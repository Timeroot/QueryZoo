concepts:

- id: settings
  title: "Total functions, partial functions, and relations"
  order: 10
  blurb: "The single most important distinction in this zoo: almost every polynomial relation is a theorem about total Boolean functions only."
  body: |
    Three kinds of computational problem appear in query complexity, and the
    zoo keeps them strictly apart.

    ### Total function
    $f : \{0,1\}^n \to \{0,1\}$. Every input is legal, every input has exactly
    one right answer. **This is the setting of essentially every polynomial
    relation in the literature.** When a paper says "$\mathrm{D}(f) = O(\mathrm{R}(f)^3)$"
    with no qualification, it means total $f$.

    ### Partial function (promise problem)
    $f : \mathrm{Dom}(f) \to \{0,1\}$ with $\mathrm{Dom}(f) \subseteq \{0,1\}^n$.
    The algorithm may behave arbitrarily off the promise. Almost every
    polynomial relation **fails**, usually spectacularly:

    | relation | total | partial |
    |---|---|---|
    | $\mathrm{D}$ vs $\mathrm{R}$ | $\mathrm{D}=O(\mathrm{R}^3)$ | unbounded ([[promiseFind1]]) |
    | $\mathrm{R}$ vs $\mathrm{Q}$ | $\mathrm{R}=O(\mathrm{Q}^4)$ | unbounded ([[Forrelation]], [[Simon]]) |
    | $\mathrm{Q}$ vs $\widetilde{\deg}$ | polynomial | exponential [AmbainisBelovs23] |
    | $\mathrm{D}$ vs $\mathrm{s}$ | $\mathrm{D}\le\mathrm{s}^4$ | unbounded |

    What *does* survive: the trivial chain
    $\mathrm{Q}\le\mathrm{R}\le\mathrm{R}_0\le\mathrm{D}$, the polynomial
    method ($\widetilde{\deg}\le 2\mathrm{Q}$, $\widetilde{\deg}\le\mathrm{R}$),
    and the general adversary characterisation
    $\mathrm{Q}=\Theta(\mathrm{Adv}^{\pm})$. These never used totality.

    Why do the combinatorial measures die? Because $\mathrm{s}$, $\mathrm{bs}$,
    $\mathrm{C}$ and friends all measure *local* structure of the hypercube,
    and a promise deletes most of the hypercube. A single promise can make
    every input have an $O(1)$-size certificate while leaving the problem
    maximally hard.

    ### Relation / search problem
    $S \subseteq \{0,1\}^n \times \mathcal{O}$ where every $x$ has at least one
    valid output. The algorithm must output *some* $o$ with $(x,o)\in S$.
    A **total search problem** is the query analogue of $\mathsf{TFNP}$.

    Which measures still make sense?

    * **Fine:** $\mathrm{D}$, $\mathrm{R}$, $\mathrm{R}_0$, $\mathrm{Q}$,
      $\mathrm{Adv}^{\pm}$, $\mathrm{prt}$, $\mathrm{cjdeg}$,
      $\overline{\mathrm{prt}}$, $\mathrm{DTsize}$.
    * **Only meaningful here:** [[psD]] (pseudo-determinism) -- for a function
      there is only one correct answer, so $\mathrm{psD}=\mathrm{R}$; for a
      search problem, committing to a canonical answer can be exponentially
      harder [CDM23].
    * **Awkward or undefined:** anything defined through $f^{-1}(0)$ and
      $f^{-1}(1)$ -- $\mathrm{s}$, $\mathrm{bs}$, $\mathrm{C}^0/\mathrm{C}^1$,
      $\deg$, $\widetilde{\deg}$ (one can define these via the output relation
      but the standard theorems do not apply). Approximate degree *is* usually
      defined for search problems as the minimum degree of a "conical junta"-
      style certificate; see [[cjdeg]].
    * **Collapses:** $\mathrm{R}_0$ vs $\mathrm{R}$ largely collapses when
      outputs are cheaply verifiable.

    Total search problems are much closer to partial functions than to total
    functions: [BenDavidKundu24search] give explicit conversions in both
    directions, and use them to transport exponential separations back and forth.
  refs: [BenDavidKundu24search, CDM23, AmbainisBelovs23, BdW02]
  see_also: [D, R, Q, psD, cjdeg, Forrelation, promiseFind1, Simon]

- id: cost-conventions
  title: "Cost conventions: worst case, expected cost, zero error"
  order: 20
  blurb: "Why R_0 must be an expected-cost measure, and when worst-case and expected cost differ."
  body: |
    Two orthogonal choices define a randomized measure:

    1. **Error model.** Zero error / one-sided error / bounded error /
       unbounded error. ($\mathsf{ZPP}$ / $\mathsf{RP}$ / $\mathsf{BPP}$ /
       $\mathsf{PP}$.)
    2. **Cost model.** Worst-case number of queries over all coin flips, or
       expected number of queries.

    ### The zero-error trap
    If you demand **zero error** and **worst-case cost**, you get
    $\mathrm{D}(f)$ exactly: fix the coins of an always-correct depth-$T$
    algorithm and you have a deterministic depth-$T$ tree. So
    $\mathrm{R}_0$ and $\mathrm{Q}_0$ cannot be worst-case-cost measures with a
    forced answer.

    There are two ways out, and they give the same measure up to a factor of two:
    charge the **expected** number of queries, or keep worst-case cost and allow
    the answer $\bot$ with probability $\le 1/2$. Markov truncation at twice the
    expected cost converts the first into the second; repeating until an answer
    appears converts the second into the first. The zoo takes $\mathrm{R}_0$ in
    the expected-cost form and $\mathrm{Q}_0$ in the $\bot$ form, purely because
    that is how each is usually written -- and applying the truncation to a
    classical Las Vegas algorithm gives
    $\mathrm{Q}_0(f)\le 2\,\mathrm{R}_0(f)$, for relations as much as for total
    functions. A $\mathrm{Q}_0$ value above the function's own $\mathrm{R}_0$ is
    therefore an error, not a convention clash.

    One trap of its own: allowing $\bot$ weakens the polynomial method. A
    $T$-query zero-error algorithm makes $p_1$ *vanish* on $f^{-1}(0)$ rather
    than *equal* $f$, so it bounds
    $\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}$, not $\deg$:
    the floor is $\mathrm{rdeg}/2$, and $\deg/2$ is a floor for
    $\mathrm{Q}_{\mathrm{E}}$ only. On [[NANDtree]] the two differ by a square.

    ### The bounded-error case
    $\bar{\mathrm{R}}_\varepsilon(f) \le \mathrm{R}_\varepsilon(f)$ always, and
    Markov + truncation gives
    $\mathrm{R}_{\varepsilon+\delta}(f)\le \bar{\mathrm{R}}_\varepsilon(f)/\delta$.
    So for *constant* error the two agree up to constants and nobody bothers to
    distinguish them.

    They stop agreeing as $\varepsilon \to 0$, and this is not pedantry:

    * $\mathrm{R}(\mathrm{MAJ}_n\circ g^n)=\Theta(n\cdot\bar{\mathrm{R}}_{1/n}(g))$
      [GoosMaystre21] -- the *expected* complexity at error $1/n$ is the right
      quantity, and converting to $\mathrm{R}_{1/n}$ would cost a factor $n$.
    * The strong direct sum $\bar{\mathrm{R}}_\varepsilon(f^k)=\Theta(k\bar{\mathrm{R}}_{\varepsilon/k}(f))$
      [BlaisBrody19] is false for worst-case cost.
    * Yao's minimax question is *about* expected cost; see [[minimax]].

    ### Unbounded error
    Letting $\varepsilon \to 1/2$ gives the $\mathsf{PP}$-flavoured measures:
    [[sdeg]] (sign degree), [[PostQ]] (post-selected quantum), and
    [[ardeg]]. See [[param-adeg-eps]].
  refs: [BlaisBrody19, GoosMaystre21, Vereshchagin98, BdW02]
  see_also: [R, Rbar, R0, Q0, sdeg, PostQ, minimax]

- id: normalization
  title: "Dimensionless quantities and how to normalize them"
  order: 25
  blurb: "MaxInf, NS and Stab are probabilities, not query counts. Why they cannot appear in the matrix, and what ratio to use instead."
  body: |
    Every measure in the exponent matrix answers the same question: *how many
    queries?* Each one grows with $n$, and a cell of the matrix asserts something
    of the form $\mathrm{M}_1 = O(\mathrm{M}_2^{\,b})$ -- a comparison that only
    means anything if both sides are on the same scale.

    Several natural Fourier quantities are not on that scale. [[MaxInf]] is a
    probability. So is noise sensitivity [[NS]]. Noise stability [[Stab]] is a
    correlation, and
    [[Var]] is a variance of a $\pm 1$ random variable. All of them live in a
    bounded interval no matter how large $n$ is. That has three consequences:

    1. **No exponent exists.** A quantity that never exceeds $1$ cannot be
       polynomially related to one that grows like $n$, in either direction, for
       reasons of units alone. The cell is not "open"; it is meaningless.
    2. **The sign is often backwards.** $\mathrm{MaxInf}$ and $\mathrm{NS}_\delta$
       tend to be *smaller* for harder functions, so even a qualitative reading of
       the row would mislead.
    3. **Bias dominates.** $\mathrm{MaxInf}(\mathrm{OR}_n) = 2^{1-n}$ is tiny not
       because $\mathrm{OR}_n$ is easy -- it is evasive -- but because
       $\mathrm{OR}_n$ is nearly constant. Any statement about a lopsided function
       is really a statement about its bias.

    So the zoo keeps these quantities, with their own pages, definitions and
    relations, but hides them from the matrix. What goes into the matrix instead
    is a **normalized** version: a ratio of two dimensionless quantities, or an
    inverse of a rate, chosen so that the result is a query count.

    ### Divide by the variance

    $\mathrm{Var}(f) = 4p(1-p)$, where $p = \Pr[f = 1]$, is the natural unit of
    "how much there is to lose". Every Fourier quantity above is measured against
    it, and dividing cancels the bias exactly. The zoo records one such ratio:
    $$\mathrm{osss}(f) \;=\; \frac{\mathrm{Var}(f)}{\mathrm{MaxInf}(f)} .$$
    This is a genuine query count -- it is between $1$ and $O(n/\log n)$, and the
    **OSSS inequality** says it lower-bounds the *average* depth of a decision
    tree for $f$, hence $\mathrm{R}_0(f)$ and $\mathrm{D}(f)$. See [[osss]].

    ### Invert a rate

    When a dimensionless quantity comes with a free parameter, the query-scale
    content is *where the parameter has to be* for something to happen. For noise
    sensitivity, the critical rate $\delta^{*}$ at which $\mathrm{NS}_\delta$
    reaches a fixed fraction of its maximum gives
    $$\mathrm{nsr}(f) \;=\; 1/\delta^{*}(f),$$
    which is $\Theta(n)$ for $\oplus_n$ and $\Theta(1)$ for $\mathrm{MAJ}_n$.
    See [[nsr]].

    The other end of the same curve is also a query count: the slope of
    $\mathrm{NS}_\delta$ at $\delta = 0$ is the total influence $\mathrm{I}(f)$,
    which was already in the zoo as [[Inf]] and satisfies
    $\mathrm{I}\le\mathrm{D}$. One dimensionless family thus yields two measures
    that point in opposite directions -- $\mathrm{I}$ is large when $f$ is
    fragile, $\mathrm{nsr}$ when it is robust.

    ### What normalization does not fix

    A normalized quantity inherits the weakness of its ingredients.
    $\mathrm{osss}$ is a *weak* lower bound: it is $1$ for $\oplus_n$ and
    $\Theta(1)$ for $\mathrm{OR}_n$, both of which have $\mathrm{D} = n$. Nor are
    the two normalizations comparable to each other -- $\oplus_n$ has
    $\mathrm{osss} = 1$ and $\mathrm{nsr} = \Theta(n)$, $\mathrm{MAJ}_n$ has
    $\mathrm{osss} = \Theta(\sqrt n)$ and $\mathrm{nsr} = \Theta(1)$. Putting a
    quantity on the query scale makes it comparable, not strong.

    Finally, the constants in a normalization are a convention. Any fixed
    fraction of the maximum defines $\delta^{*}$ up to a constant factor, so
    $\mathrm{nsr}$ is only meaningful up to $\Theta(\cdot)$; values are recorded
    that way.
  refs: [OSSS05, KKL88, ODonnell14]
  see_also: [osss, nsr, Var, MaxInf, NS, Stab, Inf, reading-the-tables]

- id: minimax
  title: "Yao's minimax and its failures"
  order: 30
  blurb: "The distributional characterisation of randomized query complexity: what is true, what Vereshchagin fixed, and where it breaks."
  body: |
    ### The easy version (error minimax)
    Fix a depth budget $T$. The game "algorithm picks a depth-$T$ tree,
    adversary picks an input, payoff = probability of error" is zero-sum and
    finite, so von Neumann gives
    $$\mathrm{R}_\varepsilon(f) \;=\; \max_{\mu}\ \mathrm{D}^{\mu}_{\varepsilon}(f),$$
    where $\mathrm{D}^\mu_\varepsilon(f)$ is the least depth of a deterministic
    tree erring with probability $\le\varepsilon$ under $\mu$. No subtleties.

    ### The hard version (cost minimax)
    Now fix the error and minimise the *cost*. Yao (1977) asked whether
    $$\bar{\mathrm{R}}_\varepsilon(f) \;\stackrel{?}{=}\; \Theta\Big(\max_\mu\ \bar{\mathrm{D}}^{\mu}_{\varepsilon}(f)\Big).$$
    This is no longer a plain zero-sum game, because the error constraint is a
    hard constraint rather than a payoff.

    * **Yes for bounded error** [Vereshchagin98].
    * **No for small bias** $\varepsilon = 1/2-o(1)$ [BBGM22].

    ### The repair
    [BenDavidBlais20minimax] prove a new minimax theorem producing a *single*
    hard distribution that works at **all bias levels simultaneously**, and
    show it applies to randomized query complexity, communication complexity,
    approximate degree and approximate log-rank. This is the technical engine
    behind the $\mathrm{noisyR}$ composition theorem.
  refs: [Yao77, Vereshchagin98, BBGM22, BenDavidBlais20minimax]
  see_also: [R, Rbar, Dmu, D_prod, noisyR, cost-conventions]

- id: composition
  title: "Composition"
  order: 40
  blurb: "Does M(f o g) = M(f) M(g)? The answer distinguishes the well-behaved measures from the rest, and has spawned a family of measures of its own."
  body: |
    For $f$ on $n$ bits and $g$ on $m$ bits, $f\circ g^n$ is the function on
    $nm$ bits obtained by feeding $n$ disjoint copies of $g$ into $f$.

    ### Scoreboard

    | measure | composes? | reference |
    |---|---|---|
    | $\mathrm{D}$ | **exactly**, even for an outer relation | [Savicky02, Tal13, Montanaro14] |
    | $\deg$ | **exactly** | [Tal13] |
    | $\mathrm{Q}$ | up to constants, even for partial $f,g$ | [LMRSS11, Reichardt11] |
    | $\mathrm{Adv}^{\pm}$ | **exactly** (SDP) | [HLS07] |
    | $\mathrm{RS}$ | perfect lower bound $\mathrm{RS}(f\circ g)\ge\mathrm{RS}(f)\mathrm{RS}(g)$ | [BenDavidKothari18] |
    | $\mathrm{R}$ | lower bound with $\log(n+1)$ loss, even for partial Boolean $f,g$; constants fail even for total functions | [PednekarPodder26STOC, Meiburg26composition] |
    | $\widetilde{\deg}$ | up to constants for total Boolean $f,g$ | [PednekarPodder26composition, Sherstov12robust] |
    | $\mathrm{Q}_{\mathrm{E}}$ | multiplicative lower bound fails on total functions | [PednekarPodder26composition, PednekarPodder26STOC] |
    | $\chi$ | constant-factor multiplicative lower bound fails on total functions | [Meiburg26composition] |
    | $\mathrm{s}$, $\mathrm{bs}$, $\mathrm{C}$ | up to constants | [Tal13] |

    ### Why $\mathrm{R}$ is hard
    The natural algorithm for $f\circ g^n$ runs the outer algorithm and
    amplifies each inner call to error $1/(3\mathrm{R}(f))$, costing
    $O(\mathrm{R}(f)\mathrm{R}(g)\log \mathrm{R}(f))$. Two things can go wrong
    with the matching lower bound:

    1. The outer algorithm may tolerate *noisy* answers from the inner copies,
       paying less than full price per copy. This is what [[noisyR]] measures,
       and $\mathrm{R}(f\circ g^n)=\Omega(\mathrm{noisyR}(f)\mathrm{R}(g))$ is
       the optimal theorem of that shape.
    2. The outer algorithm may not need a *decision* from each inner copy, only
       partial information. This is what [[chi]], [[chibar]], [[RS]] and
       [[LR]] measure, and $\mathrm{R}(f\circ g^n)=\Omega(\mathrm{R}(f)\mathrm{LR}(g))$
       is the optimal theorem of *that* shape.

    The new bound $\mathrm{noisyR}(f)=\Omega(\mathrm{R}(f)/\log(n+1))$ [PednekarPodder26STOC] combines with the outer theorem to settle composition with an input-size logarithmic loss. It applies to partial Boolean functions. The logarithm is of outer input length $n$, with no promised replacement by $\log\mathrm{R}(f)$. Constant-factor composition is false even for total functions [Meiburg26composition].

    ### The inner hierarchy
    $$\mathrm{RS}\lesssim\bar\chi\lesssim\mathrm{LR}\lesssim\mathrm{R},
    \qquad\chi\le\bar\chi,\qquad\mathrm{LR}=\Omega(\sqrt{\mathrm{R}}).$$
    Every adjacent pair in the first chain is separated on total functions
    [Meiburg26composition]. The parity-pointer family separates $\bar\chi$ from
    $\mathrm{RS}$ by $\Omega(\log N)$; the masked family separates $\mathrm{LR}$
    from $\bar\chi$ by $\Omega(\sqrt{\log N})$; the majority family separates
    $\mathrm{R}$ from $\mathrm{LR}$ by $\Omega(\log N)$.
    Conflict and sabotage are incomparable: [[MeiburgParityPointer]] has
    $\chi/\mathrm{RS}=\Omega(\log N)$, while [[ANDOR]] has
    $\mathrm{RS}/\chi=\Omega(\sqrt{\log N})$.
    The same paper gives total functions with $\mathrm{R}/\mathrm{noisyR}$
    unbounded and [[MeiburgCompositionRate]] with
    $\mathrm{R}^{*}/\mathrm{R}=\Theta(\log\mathrm{R})$.

    The total–total randomized composition example saves
    $\Theta(\log\mathrm{R}(g))=\Theta(\log\log L)$ in composed input length $L$.
    It coexists with the new $\log(n+1)$ lower bound; the scales of the two
    logarithms are different.
    The easiest case of composition is an identity outer function, i.e. solving
    many copies — see [[direct-sum]].
  refs: [BenDavidKothari18, BenDavidBlais20composition, BBGM22, GLSS19, Sanyal18, Tal13, Sherstov12robust, CKMPSS23, Savicky02, Montanaro14, PednekarPodder26composition, PednekarPodder26STOC, Meiburg26composition]
  see_also: [comp-R, comp-adeg, comp-deg, comp-Q, comp-D, comp-MAJ, RS, chi, chibar, LR, noisyR, Rstar, direct-sum, comp-QE, comp-chi, MeiburgParityPointer, MeiburgMaskedPointer, MeiburgMajorityPointer]
- id: direct-sum
  title: "Direct sum and direct product"
  order: 45
  blurb: "k independent copies of f: does it cost k times as much (direct sum), and does a smaller budget make you fail on almost all of them (direct product)?"
  body: |
    Write $f^{\otimes k}$ for the problem of solving $k$ independent instances of $f$ and
    reporting all $k$ answers. Two questions, easily confused:

    * **Direct sum**: is $\mathrm{M}(f^{\otimes k}) \approx k\,\mathrm{M}(f)$?
    * **Direct product** (DPT): with a budget well below $k\,\mathrm{M}(f)$, does the
      probability of getting *all* $k$ right decay like $2^{-\Omega(k)}$?

    A direct product theorem is much stronger, and it is where the subtleties live. The
    intermediate statements have names too: a **threshold DPT** bounds the chance of getting
    $\eta k$ of them right, and an **XOR lemma** bounds the advantage in computing
    $\bigoplus_i f(x^i)$.

    ### Scoreboard

    | measure | direct sum | direct product | reference |
    |---|---|---|---|
    | $\mathrm{D}$ | **exactly** $k\,\mathrm{D}(f)$, for relations | -- | [JainKlauckSantha10, Montanaro14] |
    | $\mathrm{C}$ | additive, easy | -- | folklore |
    | $\mathrm{R}$ | $\Theta(k\,\mathrm{R}(f))$ up to a $\log k$ that is sometimes needed | yes, at budget $\gamma^3\mathrm{R}(f)k/11$ | [JainKlauckSantha10, BlaisBrody19, Drucker12] |
    | $\bar{\mathrm{R}}$ | **exactly** $\Theta(k\,\bar{\mathrm{R}}_{\varepsilon/k}(f))$ | -- | [BlaisBrody19] |
    | $\mathrm{Q}$ | $\tilde\Theta(k\,\mathrm{Q}(f))$, Boolean only | yes, at budget $\Omega(\mathrm{Q}(f)k)$ | [ACGT09, Reichardt11, LeeRoland13] |

    ### Shaltiel's examples
    Everything here has to dodge one construction [Shaltiel04]. Take a distribution that is
    hard with probability $1-\varepsilon$ and trivial with probability $\varepsilon$. One
    instance is hard on average; but among $k$ instances the algorithm can go hunting for the
    easy ones, and it finds about $\varepsilon k$ of them cheaply. So the success probability
    does **not** collapse until the budget drops below $\Theta(\varepsilon T k)$ -- a factor
    $\varepsilon$ below the naive $Tk$. [Drucker12] shows this is the *only* obstruction: his
    bounds match it, and they are stated with exactly that $\alpha\varepsilon Tk$ budget.

    The same examples are why direct sum theorems are stated distribution-free. Relative to a
    fixed distribution the tight statements are false, and this is the shared root of three
    things in this zoo: the $\delta^2$ loss in the randomized direct sum [[dirsum-R]], the
    difficulty of the randomized composition conjecture [[comp-R]], and the invention of the
    [[Corr]] and [[Sel]] measures, whose whole content is that maximising over the
    distribution removes the loophole.

    ### Why the $\log k$ is real
    Solving $k$ copies by amplifying to error $1/3k$ each costs $O(k\,\mathrm{R}(f)\log k)$, and
    [BlaisBrody19] exhibit a total $f$ where that is optimal. The clean statement is a strong
    direct sum in the *expected-cost* measure,
    $\bar{\mathrm{R}}_\varepsilon(f^{k}) = \Theta(k\,\bar{\mathrm{R}}_{\varepsilon/k}(f))$
    [[param-R-directsum]], which makes visible that the direct sum question for $\mathrm{R}$ is
    a question about $\varepsilon$-dependence in disguise. Compare [[comp-R]], where the same
    $\log$ appears in the composition upper bound for the same reason.

    ### Relation to composition
    Direct sum is composition with the outer function being the identity, so it is the easiest
    case -- and it is *still* not trivial for $\mathrm{R}$, and *still* open for $\mathrm{Q}$
    without a log. That is a fair summary of how hard composition is.
  refs: [JainKlauckSantha10, Drucker12, Shaltiel04, BlaisBrody19, Montanaro14, KSdW07, LeeRoland13, NRS94, ACGT09, BDGHMT20]
  see_also: [dirsum-D, dirsum-R, dirprod-R, dirprod-Q, comp-D, comp-R, Corr, Sel, R, Rbar, D, Q, open-direct-sum, param-R-directsum, composition]

- id: noisy-models
  title: "Two different noisy query models"
  order: 50
  blurb: "N_p (faulty oracle) and noisyR (bias purchasing) are NOT the same measure. Read this before using either."
  body: |
    The word "noisy" is used for two genuinely different things, and the zoo
    keeps them as separate measures.

    ### 1. Faulty oracle -- [[Np]]
    Introduced by [FRPU94] (see also [ReischukSchmeltz91]). Every query answer
    is independently flipped with probability $p$; the algorithm has no control
    over this. Cost = number of queries.

    * $\mathrm{N}_p(f) = O(\mathrm{R}(f)\log \mathrm{R}(f)/(1-2p)^2)$ -- repeat
      and majority-vote.
    * $\mathrm{N}_p(\mathrm{PARITY}_n)=\Theta(n\log n)$: the $\log$ is
      **necessary** [FRPU94, EvansPippenger98].
    * The quantum analogue [[robustQ]] behaves differently:
      $\mathrm{Q}^{\mathrm{rob}}(\mathrm{PARITY}_n)=\Theta(n)$ -- **no log**
      [BNRdW05].

    ### 2. Bias purchasing -- [[noisyR]]
    Introduced by [BenDavidBlais20composition]. The algorithm may query a bit
    "at bias $\gamma$", receiving the correct value with probability
    $\tfrac12+\gamma$, and pays $\gamma^2$ for it (so an exact query costs
    $\Theta(1)$). The algorithm *chooses* the noise level per query.

    * $\mathrm{noisyR}(f)\le\mathrm{R}(f)$.
    * $\mathrm{noisyR}(f)=\Theta\big(\mathrm{R}(f\circ\mathrm{GapMaj}_n)/\mathrm{R}(\mathrm{GapMaj}_n)\big)$
      -- an exact characterisation.
    * $\mathrm{noisyR}$ is the largest measure $M$ with
      $\mathrm{R}(f\circ g^n)=\Omega(M(f)\mathrm{R}(g))$.
    * There are partial $f$ with $\mathrm{R}(f)=\mathrm{noisyR}(f)^{1+\Omega(1)}$;
      this separation *is* the refutation of the randomized composition conjecture.

    ### The difference in one line
    In $\mathrm{N}_p$ the noise is **imposed** on the algorithm and the natural
    question is "how much repetition do you need?"; in $\mathrm{noisyR}$ the
    noise is **bought** by the algorithm and the natural question is "how little
    information suffices?". Their behaviour on $\mathrm{PARITY}$ already differs:
    $\mathrm{N}_p(\mathrm{PARITY}_n)=\Theta(n\log n)$ while
    $\mathrm{noisyR}(\mathrm{PARITY}_n)=\Theta(n)$ (since
    $\mathrm{R}(\mathrm{PARITY}_n)=\Theta(n)$ is full, and
    $\mathrm{R}(f)=\Theta(n)\Rightarrow\mathrm{noisyR}(f)=\Theta(\mathrm{R}(f))$
    [CKMPSS23]).

    ### The information-theoretic engine, and what is open in it
    Both halves of [[noisyRna]]'s Theorem 8 -- $\mathrm{noisyR}^{\mathrm{na}}(f)
    =\Theta(\mathrm{R}^{\mathrm{na}}(f))$ for total and partial $f$, but not for
    relations -- run on one inequality of [Samorodnitsky16], in the form isolated
    by [PolyanskiyWu17]: a **noisy** copy of $X$ at bias $\rho$ tells you at
    least as much about $f(X)$ as an **erasure** copy that survives with
    probability $\rho^2$. Since erasures are honest queries, a noise budget
    converts into a query budget.

    That inequality is a by-product of the *most informative Boolean function*
    conjecture of [CourtadeKumar14]: if $Y$ is $X$ sent through a binary
    symmetric channel with crossover probability $\varepsilon$, then for every
    Boolean $f$,
    $$I\big(f(X);Y\big) \;\le\; 1 - H_2(\varepsilon),$$
    with equality for a dictator (a subcube of codimension 1). It is **open**.
    [Samorodnitsky16] proves it for high noise -- there is an absolute $\delta>0$
    such that it holds whenever $(1-2\varepsilon)^2\le\delta$ -- via the
    strengthening of Mrs. Gerber's lemma
    $\mathrm{Ent}(T_\varepsilon f)\le \mathbb{E}_T\,\mathrm{Ent}(f\mid T)$ that
    also yields the noise-beats-erasure comparison above.

    The reason none of this survives for **relations** is the last step, not the
    first: converting an entropy gap into a guessing advantage needs
    Fano / [HellmanRaviv70], and with many acceptable outputs there is nothing
    to guess. That is exactly where the exponential separation of Theorem 8
    lives.
  refs: [FRPU94, EvansPippenger98, ReischukSchmeltz91, BenDavidBlais20composition, BNRdW05, CKMPSS23, Gu25noisy, GLX26noisy, Samorodnitsky16, PolyanskiyWu17, CourtadeKumar14, HellmanRaviv70]
  see_also: [Np, noisyR, noisyRna, robustQ, R, GapMaj, PARITY, composition]

- id: sensitivity-conjecture
  title: The sensitivity conjecture (now Huang's theorem)
  order: 60
  blurb: s, bs, C, deg, D are all polynomially related for total functions. Resolved in 2019; the exact
    exponents are still open.
  body: 'For decades it was open whether sensitivity $\mathrm{s}(f)$ -- the most

    local measure in the zoo -- is polynomially related to the rest.

    [Nisan91] and [NS94] showed everything else is polynomially related:

    $$\mathrm{s} \le \mathrm{bs} \le \mathrm{C} \le \mathrm{s}\cdot\mathrm{bs},\qquad

    \mathrm{bs}\le 2\deg^2,\qquad \mathrm{D}\le 2\deg^4 .$$

    The missing link was $\deg$ vs $\mathrm{s}$.


    **Huang''s theorem (2019):** $\deg(f) \le \mathrm{s}(f)^2$.


    The proof is two pages: a signed adjacency matrix of the hypercube whose

    eigenvalues are $\pm\sqrt n$, plus Cauchy interlacing, gives that every

    induced subgraph of $Q_n$ on more than $2^{n-1}$ vertices has maximum

    degree $\ge\sqrt n$. [ABKRT21] later gave the spectral refinement

    $\deg(f)\le\lambda(f)^2$ with $\lambda\le\mathrm{s}$, which is where

    [[lambda]] comes from.


    ### What is still open

    The exponents. Currently

    $$\mathrm{bs}(f) \le 2\deg(f)^2 \le 2\mathrm{s}(f)^4.$$

    The quadratic strengthening was refuted by [OpenAISensitivity26]. The latest

    public campaign theorem [Prove2MeSensitivity26] gives

    $\mathrm{bs}\ge\mathrm{s}^{\alpha-\varepsilon}$ for every $\varepsilon>0$ and

    arbitrarily large sensitivity, where

    $\alpha=\log(14055^8)/\log(3738277295413674)=2.1308255793978239\ldots$.

    The quartic universal upper bound remains. See [[open-bs-vs-s]].

    '
  refs:
  - Huang19
  - Nisan91
  - NS94
  - ABKRT21
  - Rubinstein95
  - AmbainisSun11
  - HKP11
  - OpenAISensitivity26
  - Prove2MeSensitivity26
  see_also:
  - s
  - bs
  - C
  - deg
  - lambda
  - D
  - open-bs-vs-s
  - Rubinstein
