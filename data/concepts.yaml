- id: monotone
  title: "Monotone functions"
  order: 70
  blurb: "Everything collapses: s = bs = C, D <= s^2, and the quantum speedup is at most quadratic."
  body: |
    For monotone $f$:

    * $\mathrm{s}(f) = \mathrm{bs}(f) = \mathrm{C}(f)$ [Nisan91].
    * Hence $\mathrm{D}(f) \le \mathrm{C}^0(f)\mathrm{C}^1(f) \le \mathrm{s}(f)^2$
      [BdW02, Cor. 5].
    * $\mathrm{s}(f) \le \deg(f)$ [BdW02, Prop. 4].
    * Therefore $\mathrm{D}(f)=O(\mathrm{R}(f)^2)$, $\mathrm{D}(f)=O(\mathrm{Q}_E(f)^2)$
      and $\mathrm{D}(f)=O(\mathrm{Q}(f)^4)$ [BdW02, Cor. 6].
    * **Monotone graph properties** have $\mathrm{Q}(f)=\Omega(n)$ on
      $\binom{n}{2}$-bit inputs, i.e. $\Omega(N^{1/2})$ [ABKRT21, Thm 5] --
      a quantum version of the Aanderaa-Karp-Rosenberg evasiveness programme.
    * Zero-error quantum gives near-optimal separations for monotone graph
      properties [BCWZ99].

    Monotonicity is the standard sanity check: any conjectured
    super-quadratic separation must use a non-monotone function.
  refs: [Nisan91, BdW02, ABKRT21, BCWZ99]
  see_also: [s, bs, C, D, Q, QE, sensitivity-conjecture]

- id: cheat-sheets
  title: "Cheat sheets: turning partial separations into total ones"
  order: 80
  blurb: "The Aaronson-Ben-David-Kothari trick that converts a partial-function separation into a total-function separation with the same exponents."
  body: |
    Most extremal examples in query complexity are naturally *partial*
    ([[Forrelation]], [[kForrelation]]). The **cheat sheet** construction
    [ABK16] turns a partial function $f$ into a total function $f_{\mathrm{CS}}$
    while roughly preserving the measures of interest.

    Sketch: $f_{\mathrm{CS}}$ takes $\ell$ independent inputs
    $x^1,\dots,x^\ell$ to $f$ together with $2^\ell$ "cells", each holding a
    claimed certificate. The string $f(x^1)\cdots f(x^\ell)$ addresses one
    cell; the function outputs $1$ iff that cell contains valid certificates
    for all $\ell$ answers. Off-promise inputs are handled because the
    certificate check is a *total* condition.

    Effects:
    * $\mathrm{Q}(f_{\mathrm{CS}}) = \tilde\Theta(\mathrm{Q}(f))$ and similarly
      for the other "algorithmic" measures.
    * $\mathrm{R}(f_{\mathrm{CS}}) = \tilde\Theta(\mathrm{R}(f))$.
    * Certificate-based measures ($\mathrm{C}$, $\mathrm{bs}$, $\mathrm{s}$)
      become small, which is exactly what one wants for separations *from*
      those measures.

    This is how the cubic $\mathrm{R}$-vs-$\mathrm{Q}$ separation and the
    quadratic $\mathrm{Q}$-vs-$\deg$ separation are obtained for total
    functions from Forrelation-type partial functions.
  refs: [ABK16, AaronsonAmbainis14, BansalSinha21, SSW21]
  see_also: [cheatsheet, Forrelation, kForrelation, Q, R, deg, settings]

- id: lifting
  title: "Lifting: query complexity as a source of communication lower bounds"
  order: 90
  blurb: "Why query-complexity measures are studied so intensely: composed with a small gadget, they transfer to communication complexity."
  body: |
    A *lifting theorem* says: for a suitable two-party gadget $g$ on
    $O(\log n)$ bits,
    $$\mathrm{M}^{\mathrm{cc}}(f\circ g^n) \;=\; \Theta\big(\mathrm{M}(f)\cdot \log n\big)$$
    for the appropriate pair of query and communication measures $\mathrm{M}$.
    Known for deterministic [GPW18], randomized, and several LP-based measures.

    Consequences visible in this zoo:

    * The $\mathrm{D}$-vs-$\mathrm{SP}$ separation [GPW18] was found in order to
      refute the log-approximate-rank / partition-number conjecture in
      communication complexity.
    * [BenDavidKothari18] note that a zero-error lifting theorem would imply a
      bounded-error one, via sabotage complexity.
    * The strong direct sum of [BlaisBrody19] lifts to
      $\mathrm{R}^{\mathrm{cc}}(f^k)=\Theta(k\log k\cdot \mathrm{R}^{\mathrm{cc}}(f))$.
    * The $\mathrm{D}^{\oplus}$-vs-Fourier-sparsity question is the query
      analogue of the **log-rank conjecture**; see [[open-log-rank]].
  refs: [GPW18, BenDavidKothari18, BlaisBrody19, TsangWongXieZhang13]
  see_also: [D, SP, PDT, spar, RS, open-log-rank]

- id: adversary-methods
  title: "The adversary methods"
  order: 100
  blurb: "From Ambainis' 2000 lower bound to the SDP that exactly characterises quantum query complexity."
  body: |
    ### Positive weights -- [[Adv]]
    Ambainis' original method, in the form
    $\mathrm{Adv}(f)=\max_{\Gamma\ge 0}\|\Gamma\|/\max_i\|\Gamma\circ D_i\|$.
    Špalek-Szegedy showed the spectral, weighted, Kolmogorov-complexity and
    minimax formulations all coincide [SpalekSzegedy06].

    **Barrier:** $\mathrm{Adv}(f)\le\sqrt{\mathrm{C}^0(f)\mathrm{C}^1(f)}$
    [SpalekSzegedy06, Zhang05], strengthened to
    $\sqrt{\mathrm{RC}^0(f)\mathrm{RC}^1(f)}$ [KulkarniTal16]. So the positive
    adversary is useless for [[ElementDistinctness]], where $\mathrm{C}=2$ but
    $\mathrm{Q}=\Theta(n^{2/3})$.

    ### Negative weights -- [[Advpm]]
    Dropping the non-negativity constraint gives $\mathrm{Adv}^{\pm}$, which
    **exactly characterises** quantum query complexity:
    $\mathrm{Q}(f)=\Theta(\mathrm{Adv}^{\pm}(f))$ [HLS07, Reichardt11, LMRSS11],
    for total functions, partial functions, and state conversion. It is an SDP,
    hence computable in principle, and it composes perfectly.

    ### Classical analogues
    [[CA]], the classical adversary bound, and the certificate-game family
    [[CG]] / [[CGpub]] / [[CGstar]] / [[CGns]] [CGLMSG23]. All classical
    adversary methods are equivalent for total functions [ABIKPS17]. Two
    pleasant identities from the certificate-game paper: the single-bit
    public-coin game is $\Theta(\mathrm{s}(f))$, and the single-bit private-coin
    game is $\lambda(f)^2$.

    The private-coin game is the odd one out and worth a warning, because it
    breaks the habit every other row of the zoo trains you into. Three of the
    four variants collapse to $\mathrm{CA}$; $\mathrm{CG}$ does not. It sits
    *above* $\mathrm{R}_0$, not below it, and the $\lambda^2$ identity above
    generalises to $\mathrm{CG}(f)=\Omega(\mathrm{Adv}(f)^2)$ -- which means
    $\mathrm{CG}$ is **not** bounded by $\mathrm{D}$ and can exceed the number
    of variables outright. Parity is the clean example:
    $\mathrm{CG}(\oplus_n)=\Theta(n^2)$, squeezed between $\mathrm{Adv}^2=n^2$
    below and $\mathrm{C}^0\mathrm{C}^1=n^2$ above.

    ### Spectral sensitivity -- [[lambda]]
    $\lambda(f)$, the spectral norm of the sensitivity graph, is the simplest
    quantity below $\mathrm{Adv}$: $\lambda\le\mathrm{Adv}\le\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$,
    and $\sqrt{\mathrm{s}}\le\lambda\le\mathrm{s}$ [ABKRT21].
  refs: [Ambainis02, SpalekSzegedy06, Zhang05, HLS07, Reichardt11, LMRSS11, ABKRT21, CGLMSG23, ABIKPS17, KulkarniTal16]
  see_also: [Adv, Advpm, lambda, CA, CG, CGpub, CGstar, CGns, MAdv, gamma2, Q]

- id: reading-the-tables
  title: "How to read this zoo"
  order: 5
  blurb: "Conventions: what O(.) means here, what a 'witness' is, and how confident each entry is."
  body: |
    ### Relations
    Every relation page is about an ordered pair $(\mathrm{M}_1,\mathrm{M}_2)$
    in a fixed **setting** (total / partial / relation), and has two halves:

    * **Upper bounds** -- statements $\mathrm{M}_1(f)=O(g(\mathrm{M}_2(f)))$
      holding for *all* $f$ in that setting.
    * **Lower bounds** -- statements $\exists$ a family $f_n$ with
      $\mathrm{M}_1(f_n)=\Omega(g(\mathrm{M}_2(f_n)))$, together with the
      **witness** function family, which links to its own page.

    A relation is `settled` when the two match, `gap` when they do not,
    `open` when the upper bound is conjectural, and `fails` when no bound
    exists at all.

    ### The exponent matrix
    The big table records one exponent pair per ordered pair of measures: the
    cell in row $\mathrm{M}_1$, column $\mathrm{M}_2$ records $a,b$ meaning
    $$\mathrm{M}_1(f) = \Omega\big(\mathrm{M}_2(f)^{a}\big)\ \text{ is witnessed, and }\
    \mathrm{M}_1(f) = O\big(\mathrm{M}_2(f)^{b}\big)\ \text{ is a theorem}.$$
    A shaded cell means $a<b$ (a gap). Exponents hide $n^{o(1)}$ factors; the
    per-pair pages carry the fine-grained statements with logs and constants.
    Each cell cites its sources; a star marks one whose exponent was worked out
    here, with the argument in the note.

    ### Confidence
    Entries carry `conf: high | medium | low`, reflecting how sure *the
    editor of this zoo* is that the statement and attribution are right --
    not how sure the community is. Anything marked `todo` is an admitted gap
    in this database, not in the literature.
  refs: [IJKKKSWW23]
  see_also: [settings, cost-conventions]

# Operational certification and quantum sabotage.
- id: quantum-sabotage
  title: 'Quantum sabotage: four variants'
  order: 115
  blurb: Separate the available oracle information from the requested output.
  body: 'For a partial Boolean function $f:D\to\{0,1\}$, choose opposite-output inputs $x,y$.

    A sabotaged input agrees with their common bits and replaces every differing bit by

    the same symbol $\ast$ or $\dagger$. The quantum algorithm must either distinguish

    the symbols or output a sabotaged coordinate [CMP24, Section 3].


    | Oracle | Distinguish $\ast$ / $\dagger$ | Find a sabotaged index |

    | --- | --- | --- |

    | Only the sabotaged string $z$ | [[QSweak]] | [[QSweakind]] |

    | Triples $(x_i,y_i,z_i)$ | [[QSstr]] | [[QSstrind]] |


    These four distinctions disappear up to constant factors for randomized sabotage

    [[RS]]. Quantumly, their equivalence is open. The proved inclusions are

    $\mathrm{QS}_{\mathrm{str}}=O(\mathrm{QS}_{\mathrm{weak}})$,

    $\mathrm{QS}^{\mathrm{ind}}_{\mathrm{str}}=O(\mathrm{QS}^{\mathrm{ind}}_{\mathrm{weak}})$,

    and decision costs at most index-finding plus one query in each oracle model.

    All four are $O(\mathrm{RS})$ and $O(\sqrt n)$.


    For partial as well as total functions,

    $\mathrm{QS}_{\mathrm{str}}=O(\mathrm{Q})$ and

    $\mathrm{QS}^{\mathrm{ind}}_{\mathrm{str}}=O(\mathrm{Q}^{3/2})$

    [CMP24, Lemma 1.1 and Theorem 1.2]. The general weak-model upper bound in terms

    of $\mathrm{Q}$ is only stated here for total functions, via

    $\mathrm{QS}_{\mathrm{weak}},\mathrm{QS}^{\mathrm{ind}}_{\mathrm{weak}}=O(\mathrm{R})=O(\mathrm{Q}^4)$.


    The common lower bound is $\Omega(\sqrt{\mathrm{fbs}})=\Omega(\mathrm{QC})$.

    [CMP24] state its theorem for total functions; [KLLPV26, proof of Theorem 4(v)]

    explicitly verify that the proof also covers partial functions. Grover meets this

    bound for AND, OR, PARITY and MAJORITY. It is not always tight: on [[ADDR]],

    all four sabotage variants are $\Theta(n)$ and $\mathrm{fbs}=n+1$.

    For total functions the paper gives the converse polynomial relation

    $\mathrm{Q}=\widetilde O(\mathrm{QS}^6)$ for each variant.


    Applying the [[certification]] transform collapses **all four** variants to

    $\Theta(\mathrm{QC})$ [KLLPV26, Theorem 4]. This does not establish equivalence

    of the original measures. See [[open-QS-vs-Q]].'
  refs:
  - CMP24
  - KLLPV26
  see_also:
  - QSweak
  - QSstr
  - QSweakind
  - QSstrind
  - RS
  - QC
  - ADDR
  - certification
  - open-QS-vs-Q
- id: certification
  title: Operational certification complexity
  order: 120
  blurb: Recognize a publicly known input against all opposite-output inputs, then maximize over the known
    input.
  body: 'For $f:D\subseteq\{0,1\}^n\to\{0,1\}$ and a publicly known $z\in D$,

    define $f_z^{\mathrm{cert}}$ on $\{z\}\cup f^{-1}(1-f(z))$, accepting $z$ and

    rejecting the opposite-output inputs. For a complexity measure $M$, put

    $$M^{\mathrm{cert}}(f)=\max_{z\in D}M(f_z^{\mathrm{cert}}).$$

    The input $z$ is free information to the certifying algorithm; only the unknown

    input is queried. [KLLPV26, Definitions 1–2] systematize this transform.


    **Collapses onto existing measures.** Theorem 3 gives, for partial functions too,

    $\mathrm{D}^{\mathrm{cert}}=\mathrm{R}_0^{\mathrm{cert}}=\mathrm{UC}^{\mathrm{cert}}=\mathrm{C}$

    and $\mathrm{CG}^{\mathrm{cert}}=\Theta(\mathrm{C})$. Bounded-error randomized

    queries, sabotage, expectational certificates, the partition bound and critical

    fractional block sensitivity all certify at cost $\Theta(\mathrm{RC})=\Theta(\mathrm{fbs})$.

    The local measures $\mathrm{C},\mathrm{RC},\mathrm{FC},\mathrm{fbs},\mathrm{bs},\mathrm{s}$

    are unchanged by certification (Remark 39).


    Theorems 4 and 6 give

    $$\mathrm{Q}^{\mathrm{cert}}=\Theta(\mathrm{QC})=

    \Theta(\mathrm{QD}^{\mathrm{cert}})=\Theta(\mathrm{MM}^{\mathrm{cert}})=

    \Theta(\mathrm{QS}^{\mathrm{cert}})=\Theta(\widetilde{\deg}^{\mathrm{cert}})=

    \Theta(\mathrm{bm\text{-}deg}^{\mathrm{cert}}).$$

    Here QD is quantum distinguishing complexity, MM the positive-weight minimax quantum adversary

    bound, and bm-deg the whole-cube bounded block-multilinear approximate degree.

    The QS equality holds for each of the [[quantum-sabotage|four variants]].

    These are identities **after certification**, not identities of the original measures.

    Rational degree is unchanged: $\mathrm{rdeg}^{\mathrm{cert}}=\mathrm{rdeg}$ (Lemma 50).

    Spectral sensitivity certifies to [[lambdacert]], exactly $\sqrt{\mathrm{s}}$ (Theorem 42).


    **New lower bounds for zero-error quantum queries.** Exact and zero-error quantum

    certification coincide up to constants:

    $$\mathrm{Q}_{\mathrm{E}}^{\mathrm{cert}}=\Theta(\mathrm{Q}_0^{\mathrm{cert}})=O(\mathrm{Q}_0).$$

    Theorem 5 uses exact amplitude amplification: success probability on the fixed,

    known reference input can be computed without queries.

    The zoo records these as [[QEcert]] and [[Q0cert]].


    The new [[osdeg]] is the maximum of two degrees of polynomials bounded in $[0,1]$

    on the whole cube, each exact on one output class and accurate on the other.

    It differs from the existing [[odeg]], which allows positive-side overshoot.

    Theorem 8 proves $\overline{\mathrm{osdeg}}=O(\mathrm{Q}_0)$.

    Its certification transform equals the bounded exact degree certification [[degcert]]

    (Theorem 9). In particular,

    $$\mathrm{rdeg}\le\overline{\deg}^{\mathrm{cert}}\le\mathrm{C},\qquad

    \overline{\deg}^{\mathrm{cert}}=O(\overline{\mathrm{osdeg}}),\qquad

    \overline{\deg}^{\mathrm{cert}}\le2\mathrm{Q}_{\mathrm{E}}^{\mathrm{cert}}.$$


    **Boundedness on a promise matters.** This paper''s exact degree requires

    $0\le p\le1$ on the whole cube. It equals ordinary [[deg]] for total functions,

    but has its own id [[bdeg]] for partial functions. A certification promise is

    partial even when the original function is total, so [[degcert]] uses [[bdeg]].

    Theorem 12 proves $\mathrm{bs}=O((\overline{\deg}^{\mathrm{cert}})^2)$ for partial

    functions and $\mathrm{C}=O((\overline{\deg}^{\mathrm{cert}})^3)$ for total ones.

    No application of the total-only upper bound to arbitrary partial functions is recorded.


    On [[ANDNotExactOne]], Theorem 10 and Lemma 55 give

    $\mathrm{rdeg}=m$, $\mathrm{Q}=\Theta(m)$,

    $\overline{\deg}^{\mathrm{cert}}=\Omega(m^{3/2}/\log^2m)$, and

    $\mathrm{Q}_0=O(m^{3/2})$. Thus the new certification lower bounds exceed both

    rational degree and bounded-error quantum complexity on the same total family.

    On [[ANDOR]], Proposition 52 gives degree $m^2$ against certified degree $m$.'
  refs:
  - KLLPV26
  - CMP24
  - Aaronson08
