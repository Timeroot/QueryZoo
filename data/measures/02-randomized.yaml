- id: psD
  name: Pseudo-deterministic query complexity
  symbol: '\mathrm{psD}(S)'
  aliases: ['pseudodeterministic decision tree complexity', 'reproducible randomized complexity']
  category: randomized
  order: 35
  short: 'Randomized cost of a search algorithm that must output the *same* canonical answer with high probability on every input.'
  definition: |
    For a relation $S \subseteq \{0,1\}^n \times \mathcal{O}$, a *pseudo-deterministic*
    algorithm is a randomized decision tree $A$ together with a canonical solution
    function $s : \{0,1\}^n \to \mathcal{O}$ with $(x, s(x)) \in S$, such that
    $$\Pr[A(x) = s(x)] \ \ge\ 2/3 \quad\text{for every } x .$$
    $\mathrm{psD}(S)$ is the least worst-case cost of such an $A$. It interpolates
    between $\mathrm{R}$ and $\mathrm{D}$: a deterministic algorithm is trivially
    pseudo-deterministic, and a pseudo-deterministic algorithm is randomized.
    This is *the* measure that makes the relational setting interesting: for
    Boolean-valued $f$ it collapses, $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$,
    because the canonical answer is forced.
  settings:
    total:    {defined: degenerate, note: 'For total (or partial) Boolean functions $\mathrm{psD} = \Theta(\mathrm{R})$: there is only one correct answer, so reproducibility is free.'}
    partial:  {defined: degenerate, note: 'Same collapse as for total functions.'}
    relation: {defined: yes, note: 'The natural home of this measure. Only interesting when a single input admits several valid outputs.'}
  equivalent:
    - {measure: R, setting: total, form: {exp: 1, kind: theta}, statement: '$\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ for Boolean-valued $f$: the canonical answer is forced, so reproducibility is free', refs: [GGR13]}
    - {measure: R, setting: partial, form: {exp: 1, kind: theta}, statement: '$\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ on the promise as well -- the collapse only needs the answer to be unique', refs: [GGR13]}
  facts:
    - '$\mathrm{R}(S) \le \mathrm{psD}(S) \le \mathrm{D}(S)$.'
    - '$\mathrm{D}(S) = O(\mathrm{psD}(S)^3)$ for total search problems [CDM23], improving the quartic bound of [GGR13].'
    - '$\mathrm{R}$ and $\mathrm{psD}$ are **exponentially separated**: for the approximate-Hamming-weight relation $\mathrm{ApproxHW}$, $\mathrm{R} = O(1)$ while $\mathrm{psD} = \Omega(n)$ [CDM23]; and $\mathrm{psD}(\mathrm{SearchCNF}) = \Omega(n^{1/3})$ for random $k$-CNFs [CDM23], $\Omega(\sqrt{n})$ in the setting of [GIPS21].'
    - 'In the zero-error average-case setting, deterministic, randomized and pseudo-deterministic complexity all coincide [GIPS21].'
  refs: [GGR13, GIPS21, CDM23]
  related: [R, D, R0, cbs]
  see_also: [R, D, R0]
  confidence: high

- id: Rna
  name: Non-adaptive randomized query complexity
  symbol: '\mathrm{R}^{\mathrm{na}}(f)'
  aliases: ['oblivious randomized decision tree complexity']
  category: randomized
  order: 15
  short: 'Bounded-error cost when the query set is drawn from a distribution fixed in advance, independent of the answers.'
  definition: |
    The algorithm samples a set $S \subseteq [n]$ from a distribution of its choosing,
    learns $x|_S$, and outputs a guess that must be correct with probability $\ge 2/3$.
    $\mathrm{R}^{\mathrm{na}}_\varepsilon(f)$ is the least $\max |S|$ over the support
    (the worst-case version; the expected-cost version is the natural companion, as for
    $\bar{\mathrm{R}}$).

    Non-adaptivity is the standard restriction in property testing, where "adaptive vs
    non-adaptive" is one of the two axes (the other being one-sided vs two-sided error).
  params:
    - {name: eps, symbol: '\varepsilon', default: '1/3', description: 'error probability'}
  settings:
    total:    {defined: yes}
    partial:  {defined: yes, note: 'The interesting case: property testing lives here.'}
    relation: {defined: yes}
  facts:
    - '$\mathrm{R}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, and in the other direction $\mathrm{R}^{\mathrm{na}}_\varepsilon(f) \le 2^{\mathrm{R}_\varepsilon(f)}-1$: sample a tree from the optimal distribution and read every variable it could ever query.'
    - 'Yao''s minimax applies verbatim: $\mathrm{R}^{\mathrm{na}}_\varepsilon(f) = \max_\mu \mathrm{D}^{\mathrm{na},\mu}_\varepsilon(f)$, the max over input distributions of the best *fixed* query set of that size.'
    - 'Adaptivity can save exponentially even with randomness: $\mathrm{R}(\mathrm{ADDR}) = \Theta(\log n)$ while $\mathrm{R}^{\mathrm{na}}(\mathrm{ADDR}) = \Theta(n)$, since a fixed distribution over $k$ data bits finds the addressed bit with probability $\le k/n$ and must otherwise guess.'
    - 'For $\mathrm{OR}_n$ adaptivity buys nothing: $\mathrm{R}(\mathrm{OR}_n) = \Theta(n) = \mathrm{R}^{\mathrm{na}}(\mathrm{OR}_n)$.'
    - 'Non-adaptively, *noise is free to resist*: $\mathrm{R}^{\mathrm{na}}(f) = \Theta(\mathrm{noisyR}^{\mathrm{na}}(f))$ for every partial Boolean $f$ [BenDavidBlais20composition, Thm. 8], although the same statement is false for relations. Contrast the adaptive case, where $\mathrm{noisyR}$ can be exponentially smaller than $\mathrm{R}$.'
  refs: [BdW02, BenDavidBlais20composition]
  related: [R, Dna, D, noisyRna]
  see_also: [R, Dna, D, Rbar, ADDR, noisyRna]
  confidence: medium
