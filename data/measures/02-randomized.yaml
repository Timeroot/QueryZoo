# =====================================================================
# MEASURES: randomized (bounded error, zero error, expected cost,
#           noisy, and the composition-theoretic family)
# =====================================================================

measures:

- id: R
  name: Bounded-error randomized query complexity
  symbol: '\mathrm{R}_{\varepsilon}(f)'
  aliases: ['R_2(f)', 'Monte Carlo decision tree complexity', 'BPP-style query complexity']
  category: randomized
  order: 10
  short: 'Worst-case number of queries of a randomized decision tree that errs with probability at most eps.'
  definition: |
    A randomized decision tree is a probability distribution over deterministic trees.
    $\mathrm{R}_\varepsilon(f)$ is the least $T$ such that some distribution over depth-$T$
    trees outputs $f(x)$ with probability $\ge 1-\varepsilon$ for every $x$ in the domain.
    Unadorned $\mathrm{R}(f) := \mathrm{R}_{1/3}(f)$.

    Two cost conventions circulate and they are *not* interchangeable at small bias:
    * **worst-case cost** ($\mathrm{R}_\varepsilon$): every branch has depth $\le T$;
    * **expected cost** ($\bar{\mathrm{R}}_\varepsilon$, see [[Rbar]]): the expected number of
      queries is $\le T$, maximised over inputs.
  params:
    - name: eps
      symbol: '\varepsilon'
      default: '1/3'
      range: '[0, 1/2)'
      description: 'Error probability. Standard choice 1/3; "small bias" means eps = 1/2 - gamma with gamma -> 0.'
      dependence: |
        **Amplification (always true):** $\mathrm{R}_{\varepsilon}(f) = O\!\big(\mathrm{R}_{1/3}(f)\log(1/\varepsilon)\big)$
        by majority vote, and this is tight for some $f$ (e.g. $\mathrm{OR}$) but not for all.

        **Small bias:** for $\varepsilon = 1/2-\gamma$, $\mathrm{R}_{1/2-\gamma}(f) \ge \Omega(\gamma^2 \mathrm{R}_{1/3}(f))$
        is *false* in general; the correct general statement is
        $\mathrm{R}_{1/3}(f) = O\!\big(\gamma^{-2}\,\mathrm{R}_{1/2-\gamma}(f)\big)$ by amplification,
        and the extent to which small-bias algorithms can beat $\gamma^2$ scaling is exactly what
        the measures [[noisyR]] and [[LR]] were invented to capture.
  settings:
    total:    {defined: yes}
    partial:  {defined: yes, note: 'Only inputs in the promise must be answered correctly.'}
    relation: {defined: yes, note: 'Must output some valid $o$ with probability $\ge 1-\varepsilon$. Yao-style minimax for relations is subtler; see [[settings]].'}
  facts:
    - '$\mathrm{bs}(f) \le 3\,\mathrm{R}(f)$ and $\widetilde{\deg}(f) \le \mathrm{R}(f)$ [Nisan; BBCMdW01].'
    - '$\mathrm{D}(f) \le 27\,\mathrm{R}(f)^3$ [Nisan]. Best known separation is $\mathrm{D} = \tilde\Omega(\mathrm{R}^2)$ [ABBLSS17], so the truth is between $2$ and $3$.'
    - 'Composition can *fail*: there are partial $f,g$ with $\mathrm{R}(f\circ g) \ll \mathrm{R}(f)\mathrm{R}(g)$ [BenDavidBlais20composition].'
    - '$\mathrm{R}_\varepsilon(f) = \max_\mu \mathrm{D}^\mu_\varepsilon(f)$ (Yao), for the worst-case-cost convention.'
    - 'Composition holds with an outer-input-size logarithmic loss, even for partial Boolean functions: $\mathrm{R}(f\circ g^n)=\Omega(\mathrm{R}(f)\mathrm{R}(g)/\log(n+1))$ [PednekarPodder26STOC]. Constant-factor composition fails even for total functions [Meiburg26composition]; see [[comp-R]].'
    - The optimal total-function $\mathrm{R}$-versus-$\mathrm{Q}$ power is 4 [OpenAI26QuarticRQ]. The new family rules out every power below 4, matching $\mathrm{R}\le\mathrm{D}=O(\mathrm{Q}^4)$ [ABKRT21]; see [[OpenAIQuarticRQ]].
  refs: [Nisan91, BBCMdW01, BdW02, ABBLSS17, PednekarPodder26STOC, Meiburg26composition, OpenAI26QuarticRQ]
  related: [R0, D, Q, Rbar, RS, noisyR]
  see_also: [R0, Rbar, D, Q, noisyR, LR, RS]
  confidence: high
- id: Rbar
  name: Expected-cost randomized query complexity
  symbol: '\bar{\mathrm{R}}_{\varepsilon}(f)'
  aliases: ['expected query complexity', 'average-depth randomized complexity']
  category: randomized
  order: 15
  short: 'Same as R_eps but the cost is the expected (not worst-case) number of queries.'
  definition: |
    $\bar{\mathrm{R}}_\varepsilon(f) = \min_{A} \max_{x\in\mathrm{Dom}(f)} \mathbb{E}[\#\text{queries of }A\text{ on }x]$
    over randomized algorithms $A$ that err with probability $\le\varepsilon$ on every $x$.

    The distinction from $\mathrm{R}_\varepsilon$ matters:
    * $\bar{\mathrm{R}}_\varepsilon(f) \le \mathrm{R}_\varepsilon(f)$ always;
    * $\mathrm{R}_{\varepsilon'}(f) \le \bar{\mathrm{R}}_\varepsilon(f)/(\varepsilon'-\varepsilon)$ by Markov + truncation,
      so at constant error they agree up to constants;
    * at $\varepsilon = 1/2 - o(1)$ they can behave very differently, and Yao's question
      of whether $\bar{\mathrm{R}}_\varepsilon$ has a distributional characterisation has a
      **positive** answer for bounded error [Vereshchagin98] and a **negative** answer
      in the small-bias regime [BBGM22].
  params:
    - {name: eps, symbol: '\varepsilon', default: '1/3'}
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: yes}}
  facts:
    - '$\bar{\mathrm{R}}_0(f) = \mathrm{R}_0(f)$: the zero-error measure is by definition an expected-cost measure.'
    - 'Yao (1977) asked for a distributional characterisation of $\bar{\mathrm{R}}_\varepsilon$; resolved positively for constant $\varepsilon$ and negatively for $\varepsilon = 1/2-o(1)$.'
  refs: [Yao77, Vereshchagin98, BBGM22]
  related: [R, R0, Dmu, R1]
  see_also: [R, R0, Dmu]
  confidence: high

- id: R0
  name: Zero-error randomized query complexity
  symbol: '\mathrm{R}_{0}(f)'
  aliases: ['Las Vegas query complexity', 'ZPP-style query complexity']
  category: randomized
  order: 20
  short: 'Expected number of queries of a randomized algorithm that is always correct.'
  definition: |
    The minimum over always-correct randomized algorithms of the worst-case
    *expected* number of queries. (Worst-case cost would collapse to $\mathrm{D}$,
    so the expected-cost convention is forced here.)
    Equivalently the algorithm may output "don't know" with probability $\le 1/2$
    and otherwise must be right ("Las Vegas").
  params: []
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: yes}}
  facts:
    - '$\mathrm{R}(f) \le \mathrm{R}_0(f) \le \mathrm{D}(f)$.'
    - '$\mathrm{D}(f) = O(\mathrm{R}_0(f)^2)$ for total $f$; tight up to $\tilde\Omega$ by pointer functions [ABBLSS17].'
    - '$\mathrm{R}_0(f) = O\big(\mathrm{R}(f)^2\log \mathrm{R}(f)\big)$ [KulkarniTal16], improving $O(\mathrm{R}(f)^2\log n)$ [Midrijanis05].'
    - '$\mathrm{R}_0(\text{NAND-tree}_n) = \Theta(n^{0.7537\ldots})$ [Saks-Wigderson], matching $\mathrm{R}$ [Santha].'
  refs: [SaksWigderson86, Santha95, KulkarniTal16, ABBLSS17, BdW02]
  related: [R, D, Q0, Rbar, C]
  see_also: [R, D, Rbar, Q0]
  confidence: high

- id: R1
  name: One-sided-error randomized query complexity
  symbol: '\mathrm{R}^{1}(f)'
  aliases: ['RP-style query complexity', 'R^0(f) for the co-version']
  category: randomized
  order: 25
  short: 'Randomized complexity when errors are allowed on only one side.'
  definition: |
    $\mathrm{R}^1_\varepsilon(f)$: the algorithm must output $1$ with certainty when $f(x)=1$
    and output $0$ with probability $\ge 1-\varepsilon$ when $f(x)=0$ (or vice versa for $\mathrm{R}^0$).
    This is the query analogue of $\mathsf{RP}$/$\mathsf{coRP}$, and
    $\mathrm{R}_0(f) = \Theta(\mathrm{R}^0(f) + \mathrm{R}^1(f))$ up to log factors
    (run both and stop when one is certain).
  params: [{name: eps, symbol: '\varepsilon', default: '1/3'}]
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: partial, note: 'Needs a notion of "certainly valid output".'}}
  facts:
    - '$\mathrm{R}^1(f) \ge \mathrm{C}^1(f)$: a certain "yes" must exhibit a 1-certificate.'
    - '$\mathrm{R}(f) \le \mathrm{R}^1(f) \le \mathrm{R}_0(f) \le \mathrm{D}(f)$.'
    - The total complement [[AIKDNFComplement]] has $\mathrm{C}=\Theta((\mathrm{R}^{1})^2)$ with no logarithmic loss [AIK26, Theorem 2.2]. The original [[AIKDNF]] uses the paper’s certain-rejection $\mathrm{R}_1$, recorded here as [[R1RP]].
  refs: [BdW02, AIK26]
  related: [R, R0, C1, Rbar]
  see_also: [R, R0, C1, R1RP, AIKDNFComplement]
  confidence: medium
- id: RS
  name: Sabotage complexity
  symbol: '\mathrm{RS}(f)'
  category: composition
  order: 30
  short: 'Randomized cost of finding a "sabotaged" (damaged) input bit; the first measure with perfect composition.'
  definition: |
    Define the *sabotaged* problem $f_{\mathrm{sab}}$: the input is a partial assignment with
    some coordinates set to $\ast$ such that the $\ast$'s genuinely matter (the value of $f$ is
    not determined), and the goal is to find one $\ast$. $\mathrm{RS}(f)$ is the bounded-error
    randomized query complexity of $f_{\mathrm{sab}}$.
  settings:
    total:    {defined: yes}
    partial:  {defined: yes}
    relation: {defined: partial, note: 'Definable in principle; not standard.'}
  facts:
    - 'Formally $\mathrm{RS}(f) := \mathrm{R}_0(f_{\mathrm{sab}})$; using $\mathrm{R}$ instead of $\mathrm{R}_0$ changes nothing up to constants [BenDavidKothari18, Def. 10].'
    - '$\mathrm{RS}(f\circ g) \ge \mathrm{RS}(f)\,\mathrm{RS}(g)$ -- perfect composition [BenDavidKothari18, Thm 19].'
    - '$\mathrm{R}(f\circ g^n) = \Omega(\mathrm{R}(f)\,\mathrm{RS}(g))$ [BenDavidKothari18, Thm 21].'
    - '$\mathrm{R}_\varepsilon(f) \ge \bar{\mathrm{R}}_\varepsilon(f) \ge (1-2\varepsilon)\,\mathrm{RS}(f)$ [BenDavidKothari18, Thm 12].'
    - '**Quadratically tight for total $f$:** $\mathrm{R}(f) = O(\mathrm{RS}(f)^2\log \mathrm{RS}(f))$ [BenDavidKothari18, Thm 32].'
    - '$\mathrm{RS}$ can be quadratically larger than the partition bound, and $\mathrm{RS}(f) = \tilde\Omega(\mathrm{Q}(f)^{2.5})$ for some total $f$ [BenDavidKothari18, Thm 30].'
    - '$\mathrm{RS}(g) = \tilde\Omega(\mathrm{D}^{\mathrm{prod}}(g))$ for total $g$, and the gap is polynomial (NAND-tree) [Sanyal24].'
    - '**The quadratic tightness above is total-only, and badly so.** On partial functions $\mathrm{R}$ is *unbounded* in terms of $\mathrm{RS}$: any promise whose two sides are far apart in Hamming distance has $\mathrm{RS} = O(1)$ whatever its randomized complexity, because every sabotaged input is then riddled with stars. The collision problem is the clean instance -- $\mathrm{RS}(\mathrm{COL}_n) = \Theta(1)$ against $\mathrm{R} = \Theta(\sqrt n)$ [BenDavidKothari18, Sec. 1.4]. See [[Collision]].'
    - '$\bar{\chi}(g) = \Omega(\mathrm{RS}(g))$ for all partial $g$ [GLSS19, Thm 7]; the same collision witness makes that gap unbounded. Repairing the partial-function collapse is what $\chi$, $\bar\chi$ and $\mathrm{LR}$ are for: each is $\Omega(\sqrt{\mathrm{R}})$ even off the promise, and $\mathrm{RS}$ is not.'
    - 'Total functions now separate sabotage and randomized complexity by $\Omega(\log N)$ [Meiburg26composition]; [[MeiburgParityPointer]] is a witness. Conflict and sabotage are incomparable on total functions: the opposite directions use that family and [[ANDOR]].'
  refs: [BenDavidKothari18, GLSS19, Sanyal24, Meiburg26composition]
  related: [R, chibar, chi, LR, D_prod, noisyR]
  see_also: [R, chi, chibar, LR, noisyR, Collision, open-RS-vs-R]
  confidence: high
- id: chi
  name: Conflict complexity
  symbol: '\chi(f)'
  category: composition
  order: 35
  short: 'A measure of how hard it is for a decision tree to distinguish a random 0-input from a random 1-input, one query at a time.'
  definition: |
    Introduced to prove composition theorems. Informally: sample $x \sim \mu_0$ and
    $y \sim \mu_1$ from hard distributions on $g^{-1}(0)$ and $g^{-1}(1)$, and run a
    deterministic tree simultaneously on both, "resolving" a conflict when the tree
    queries a coordinate on which $x$ and $y$ differ. $\chi(g)$ measures the expected
    number of queries before a conflict, maximised over distributions and minimised
    over trees.
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: no}}
  facts:
    - '$\mathrm{R}(f\circ g^n) = \Omega(\mathrm{R}(f)\,\chi(g))$ [Sanyal18; AGJKLMSS17].'
    - '$\chi(g) = \Omega(\mathrm{bs}(g))$ -- more precisely $\chi(f)\ge(\mathrm{bs}(f)+1)/2$ for total $f$ [Li18, Thm 1].'
    - '$\chi(g) = \Omega(\sqrt{\mathrm{R}(g)})$.'
    - '$\chi(g)\le\mathrm{D}(g)$ [Li18, Sec. 2] is the *only* upper bound proved directly for $\chi$; everything else runs through $\chi\le\bar\chi\le\mathrm{LR}\le\mathrm{R}$. It gives $\chi\le\mathrm{C}^2$ and $\chi\le\mathrm{bs}^3$, so the $\mathrm{bs}$ cell is a gap $[1,3]$ and the $\mathrm{C}$ cell a gap $[1,2]$ -- both inherited from $\mathrm{D}$, neither touched since.'
    - 'Whether $\chi=\Omega(\mathrm{C})$ or $\chi=O(\mathrm{C})$ -- or neither -- is [[open-chi-vs-C]].'
    - Conflict and sabotage are incomparable on total functions. [[MeiburgParityPointer]] gives $\chi/\mathrm{RS}=\Omega(\log N)$; [[ANDOR]] gives $\mathrm{RS}/\chi=\Omega(\sqrt{\log N})$. Also $\chi$ is not $O(\mathrm{C})$ and fails perfect composition [Meiburg26composition].
  refs: [Sanyal18, AGJKLMSS17, Li18, Meiburg26composition]
  related: [chibar, RS, LR, R, bs]
  see_also: [chibar, RS, LR, R, bs, C, D, open-chi-vs-C]
  confidence: medium
- id: chibar
  name: Max-conflict complexity
  symbol: '\bar{\chi}(f)'
  category: composition
  order: 36
  short: 'A strengthening of conflict complexity that dominates sabotage complexity.'
  definition: |
    The "max" version of conflict complexity of Gavinsky-Lee-Santha-Sanyal: the
    adversary may choose the hard distribution pair *after* seeing the algorithm's
    behaviour, yielding a larger and better-behaved measure.
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: no}}
  facts:
    - '$\mathrm{R}(f\circ g^n) = \Omega(\mathrm{R}(f)\,\bar{\chi}(g))$ [GLSS19].'
    - '$\bar{\chi}(g) = \Omega(\sqrt{\mathrm{R}(g)})$ even for partial $g$ [GLSS19, Thm 6] -- proved there for the smaller measure $\chi$, so it holds a fortiori for $\bar\chi$.'
    - '$\bar{\chi}(g) = \Omega(\mathrm{RS}(g))$ for all partial $g$ [GLSS19, Thm 7]. The two facts together make the gap *unbounded* on partial functions: the collision problem has $\mathrm{RS} = \Theta(1)$ but $\mathrm{R} = \Theta(\sqrt n)$, hence $\bar\chi = \Omega(n^{1/4})$. Not being able to collapse that way is the whole point of the measure.'
    - 'Ordering: $\mathrm{RS} \lesssim \bar{\chi} \lesssim \mathrm{LR} \lesssim \mathrm{R}$; no asymptotic separation among the first three is known for *total* functions.'
    - Total families separate $\bar\chi$ from sabotage by $\Omega(\log N)$ and linearised complexity from $\bar\chi$ by $\Omega(\sqrt{\log N})$ [Meiburg26composition]; see [[MeiburgParityPointer]] and [[MeiburgMaskedPointer]].
  refs: [GLSS19, BBGM22, BenDavidKothari18, Meiburg26composition]
  related: [chi, RS, LR, R]
  see_also: [chi, RS, LR, R, Collision]
  confidence: high
- id: LR
  name: Linearised randomized complexity
  symbol: '\mathrm{LR}(f)'
  category: composition
  order: 37
  short: 'The largest measure satisfying an inner composition theorem R(f o g) = Omega(R(f) LR(g)).'
  definition: |
    Where $\mathrm{R}$ effectively charges $1/\gamma^2$ for an algorithm that achieves bias
    $\gamma$ towards the right answer, $\mathrm{LR}$ charges only $1/\gamma$ -- it *linearises*
    the cost in the bias. Consequently $\mathrm{LR}(f)$ can be as small as $\sqrt{\mathrm{R}(f)}$
    and never larger than $\mathrm{R}(f)$.

    Ben-David-Blais-Göös-Maystre prove it is exactly the right inner measure:
    $\mathrm{R}(f\circ g)=\Omega(\mathrm{R}(f)\mathrm{LR}(g))$ for all partial $f,g$, and
    *no* larger measure has this property.
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: partial, note: 'The composition statement is proved for partial functions; the relational case is not standard.'}}
  facts:
    - '$\Omega(\sqrt{\mathrm{R}(f)}) \le \mathrm{LR}(f) \le \mathrm{R}(f)$.'
    - '$\mathrm{LR}$ can be polynomially larger than $\bar{\chi}$ [BBGM22].'
    - '$\mathrm{R}^*(f) \ge \Omega(\mathrm{LR}(f))$.'
    - Total functions have $\mathrm{R}/\mathrm{LR}=\Omega(\log N)$ and $\mathrm{LR}/\bar\chi=\Omega(\sqrt{\log N})$ [Meiburg26composition]; see [[MeiburgMajorityPointer]] and [[MeiburgMaskedPointer]].
  refs: [BBGM22, Meiburg26composition]
  related: [chibar, RS, R, Rstar, noisyR]
  see_also: [chibar, RS, noisyR, Rstar, R]
  confidence: high
- id: noisyR
  name: Noisy randomized query complexity
  symbol: '\mathrm{noisyR}(f)'
  category: composition
  order: 38
  short: 'Randomized complexity when the algorithm may buy a biased (noisy) copy of any bit at cost proportional to bias squared.'
  definition: |
    In the *noisy query model* the algorithm may, at any step, request the value of $x_i$
    through a channel of its choosing with bias $\gamma$, paying cost $\Theta(\gamma^2)$.
    (Equivalently: it may make a fractional query.) $\mathrm{noisyR}(f)$ is the least total
    cost of an algorithm that computes $f$ with error $\le 1/3$.

    Ben-David and Blais showed this is exactly the right *outer* measure for composition.
  settings:
    total:    {defined: yes}
    partial:  {defined: yes}
    relation: {defined: yes, note: 'Buying biased copies and then having to name *some* valid output is a perfectly ordinary search problem; Lemma 37 of [BenDavidBlais20composition] is stated for relations, and the relational case is where the model comes apart from $\mathrm{R}$ for good -- see [[AgreeString]].'}
  facts:
    - '$\mathrm{noisyR}(f) \le \mathrm{R}(f)$ always, and the two are *not* within a constant: $\mathrm{R}$ can be exponentially larger for partial $f$ ([[ApproxIndex]]). Whether $\mathrm{R} = 2^{O(\mathrm{noisyR})}$ in general is open.'
    - '$\mathrm{R}(f\circ g^n) = \Omega(\mathrm{noisyR}(f)\,\mathrm{R}(g))$, and $\mathrm{noisyR}$ is the largest measure with this property [BenDavidBlais20composition].'
    - 'Characterisation: $\mathrm{noisyR}(f) = \Theta\!\big(\mathrm{R}(f\circ \mathrm{GapMaj}_n)/\mathrm{R}(\mathrm{GapMaj}_n)\big)$.'
    - 'If $\mathrm{R}(f) = \Theta(n)$ then $\mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$.'
    - '**Lemma 37** of [BenDavidBlais20composition]: $\mathrm{noisyR}(f) = \Omega(1)$ for every non-constant $f$, and more precisely distinguishing two inputs that differ on a block $B$ costs $\Omega(1)$ *inside $B$*. Both hold for relations with two inputs whose allowed output sets are disjoint.'
    - '**Lemma 38**: $\mathrm{noisyR}(f) = \Omega(\mathrm{fbs}(f))$, by LP-weighting the previous item over the sensitive blocks. Composed with $\mathrm{R} = O(\mathrm{fbs}^3)$ this gives a complexity-only bound for total $f$. The new input-size-dependent bound is $\mathrm{R}=O(\mathrm{noisyR}\log(n+1))$ for partial Boolean functions [PednekarPodder26STOC].'
    - '**Normal form** (Lemmas 36, Theorem 39): an optimal noisy algorithm may be assumed to use only two bias values, $\gamma = 1$ and $\gamma = 1/\sqrt n$.'
    - For every nonconstant partial Boolean $f$ on $n$ bits, $\mathrm{R}(f)\le C\log(n+1)\mathrm{noisyR}(f)$ [PednekarPodder26STOC, Theorem 31]. This closes [[open-noisyR-vs-R]]. Total functions nevertheless have $\mathrm{R}/\mathrm{noisyR}=\Omega((\log N)^{1/4}/\log\log\log N)$ [Meiburg26composition, Theorem 4.1].
  refs: [BenDavidBlais20minimax, BenDavidBlais20composition, GoosMaystre21, PednekarPodder26STOC, Meiburg26composition]
  related: [R, LR, Np, noisyRna, Rstar, fbs]
  see_also: [R, LR, Rstar, Np, noisyRna, fbs]
  confidence: high
- id: noisyRna
  name: Non-adaptive noisy randomized query complexity
  symbol: '\mathrm{noisyR}^{\mathrm{na}}(f)'
  category: composition
  order: 38.5
  short: 'The bias-purchasing model with the whole schedule of biases committed to in advance.'
  definition: |
    As [[noisyR]], but non-adaptively: the algorithm draws, from a distribution of its
    choosing, a vector of biases $(\gamma_1,\dots,\gamma_n)$; it then receives one copy
    of each $x_i$ through a binary symmetric channel of bias $\gamma_i$, all at once,
    and must output an answer. The cost is $\sum_i \gamma_i^2$ and the error must be
    at most $1/3$.

    Setting every $\gamma_i \in \{0,1\}$ recovers [[Rna]], so
    $\mathrm{noisyR}^{\mathrm{na}} \le \mathrm{R}^{\mathrm{na}}$.
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: yes}}
  facts:
    - '**Theorem 8** of [BenDavidBlais20composition]: $\mathrm{noisyR}^{\mathrm{na}}(f) = \Theta(\mathrm{R}^{\mathrm{na}}(f))$ for every (possibly *partial*) Boolean $f$. Non-adaptively, buying cheap bias buys nothing at all.'
    - 'This is **false for relations**: on the [[AgreeString]] family of [GLSS19], $\mathrm{noisyR}^{\mathrm{na}} = O(1)$ while $\mathrm{R}^{\mathrm{na}} = \Omega(\sqrt n)$. The proof of Theorem 8 therefore has to "notice" that $f$ is a function, which is unusual in query complexity.'
    - 'The adaptive analogue is exactly [[open-noisyR-vs-R]], and is *false* as an exact $\Theta$ for partial $f$ ([[ApproxIndex]]).'
    - 'The proof goes through Samorodnitsky''s inequality [Samorodnitsky16, PolyanskiyWu17]: a noisy copy at bias $\rho$ tells you at least as much about $f(X)$ as an erasure copy that survives with probability $\rho^2$. Erasures are honest queries, so the noisy budget can be converted into a query budget -- and it is the entropy-to-error step (Fano / [HellmanRaviv70]) that breaks for relations.'
  refs: [BenDavidBlais20composition, Samorodnitsky16, PolyanskiyWu17, HellmanRaviv70]
  related: [noisyR, Rna, R, Dna]
  see_also: [noisyR, Rna, R, Dna, AgreeString]
  confidence: high

- id: Corr
  name: Correlated samples complexity
  symbol: '\mathrm{Corr}_{\varepsilon}(f)'
  aliases: ['correlated samples problem', 'multiple-sample distributional complexity']
  category: composition
  order: 38.6
  short: 'Distributional complexity when the algorithm may query as many independent samples from the same side as it likes.'
  definition: |
    Fix an input distribution $D = \tfrac12 D_0 + \tfrac12 D_1$, where $D_b$ is supported on
    $f^{-1}(b)$; distinguishing $D_0$ from $D_1$ with one sample is exactly the distributional
    complexity $\mathrm{D}_\varepsilon(f, D)$. Now hand the algorithm $k$ samples drawn from the
    *same* side, so that $f^k$ evaluates to $0^k$ or to $1^k$, and let it choose $k$:
    $$\mathrm{Corr}_\varepsilon(f, D) \;:=\; \min_{k\ge 1}\ \mathrm{D}_\varepsilon\big(f^k,\ \tfrac12 D_0^k + \tfrac12 D_1^k\big),
    \qquad \mathrm{Corr}_\varepsilon(f) := \max_D \mathrm{Corr}_\varepsilon(f, D).$$
    More samples never hurt, so the minimand is non-increasing in $k$, and $k \le n$ is without
    loss of generality. Unadorned $\mathrm{Corr} := \mathrm{Corr}_{1/3}$.

    For a *fixed* $D$ the extra samples can help enormously; the content of the measure is that
    against the **hardest** $D$ they do not.
  params:
    - name: eps
      symbol: '\varepsilon'
      default: '1/3'
      range: '[0, 1/2)'
      description: 'Error probability, over the draw of the samples.'
      dependence: |
        Unlike single-sample distributional complexity, this model **does** admit cheap error
        reduction: $\mathrm{Corr}_\varepsilon(f, D) \le O(\log(1/\varepsilon)/\delta^2)\cdot
        \mathrm{Corr}_{1/2-\delta}(f, D)$ (Fact 1 of [BDGHMT20]). Run the weak algorithm on fresh
        samples and take the majority -- which is legal precisely because all the samples come
        from the same side. In the single-sample setting the same trick is unavailable, and that
        failure is the reason $\mathrm{D}_\varepsilon(f,D)$ is so badly behaved at small bias.
  settings:
    total:    {defined: yes}
    partial:  {defined: yes, note: '$D_0$ and $D_1$ are supported inside the promise.'}
    relation: {defined: no, note: 'The definition splits the distribution by the *value* of $f$ into two sides; with many valid outputs there is no such split, and $f^k$ has no "all copies agree" event.'}
  equivalent:
    - {measure: R, setting: total, form: {exp: 1, kind: theta}, statement: '$\mathrm{Corr}(f) = \Theta(\mathrm{R}(f))$ -- Theorem 1, for partial $f$ as well', refs: [BDGHMT20]}
    - {measure: Sel, setting: total, form: {exp: 1, kind: theta}, statement: '$\mathrm{Corr}(f) = \Theta(\mathrm{Sel}(f))$, both being $\Theta(\mathrm{R}(f))$ -- but *not* distribution by distribution', refs: [BDGHMT20]}
  facts:
    - '**Theorem 1** of [BDGHMT20]: $\mathrm{Corr}(f) = \Theta(\mathrm{R}(f))$ for every (possibly partial) Boolean $f$. The easy direction is $\mathrm{Corr} \le \mathrm{R}$ (take $k=1$ and apply Yao).'
    - 'Against a fixed distribution the measure genuinely differs: on $\mathrm{XOR}_n$ with Shaltiel''s distribution ($0U^{n-1}$ w.p. $99\%$, $1U^{n-2}0$ w.p. $1\%$) one has $\mathrm{D}(\mathrm{XOR}_n, D) = \Omega(n)$ but $\mathrm{Corr}(\mathrm{XOR}_n, D) = O(1)$ -- query the first bit of many samples until an easy one turns up.'
    - 'So Theorem 1 is exactly the statement that **Shaltiel examples can be avoided by choosing the distribution well**, which is what makes it useful for composition.'
    - 'Lemma 7 of [BDGHMT20]: $\mathrm{Corr}(f, D) = \Theta(\mathrm{biCorr}(f, D))$, the variant where the algorithm must also say which side it thinks the samples came from at every leaf.'
    - 'The application: with $\mathrm{Corr} = \Theta(\mathrm{R})$ in hand, [BDGHMT20] prove $\mathrm{R}(f\circ g) = \Omega(\mathrm{fbs}(f)\mathrm{R}(g))$ -- see [[comp-R]].'
    - '[BenDavidBlais20minimax] reprove Theorem 1 by a different route (Shaltiel-free minimax theorems), concurrently and independently.'
  refs: [BDGHMT20, BenDavidBlais20minimax, Shaltiel04]
  related: [R, Sel, Dmu, noisyR]
  see_also: [R, Sel, Dmu, fbs, noisyR, direct-sum, comp-R]
  confidence: high

- id: Sel
  name: Selection complexity
  symbol: '\mathrm{Sel}_{\varepsilon}(f)'
  aliases: ['selection problem', 'choose problem']
  category: composition
  order: 38.7
  short: 'Cost of solving *any one* of k independent instances, with k chosen by the algorithm and the instances drawn from the hardest distribution.'
  definition: |
    In the $k$-selection problem for $(f, D)$ the input is $x = (x^1,\dots,x^k) \sim D^k$ and the
    algorithm must output a pair $(i, f(x^i))$ for some $i$ of its choosing: it picks which
    instance to be graded on. Writing $k\text{-}\mathrm{Sel}_\varepsilon(f,D)$ for the query
    complexity of that task,
    $$\mathrm{Sel}_\varepsilon(f, D) := \min_{k\ge1} k\text{-}\mathrm{Sel}_\varepsilon(f, D),
    \qquad \mathrm{Sel}_\varepsilon(f) := \max_D \mathrm{Sel}_\varepsilon(f, D).$$
    The communication-complexity ancestor of the problem is *choose* [BBKW14].
  params:
    - {name: eps, symbol: '\varepsilon', default: '1/3', range: '[0, 1/2)', description: 'Error probability.', dependence: 'Selection admits **no** efficient error reduction, in contrast to [[Corr]]: item 3 of Theorem 2 of [BDGHMT20]. Having many instances does not help you check an answer, because the instance you would re-solve is the one you already found hard.'}
  settings:
    total:    {defined: yes}
    partial:  {defined: yes}
    relation: {defined: no, note: 'Inherits the obstruction of [[Corr]]: the hardest-distribution definition is set up around a Boolean output.'}
  equivalent:
    - {measure: R, setting: total, form: {exp: 1, kind: theta}, statement: '$\mathrm{Sel}(f) = \Theta(\mathrm{R}(f))$ -- Corollary 1, for partial $f$ as well', refs: [BDGHMT20]}
  facts:
    - '**Corollary 1** of [BDGHMT20]: $\mathrm{Sel}(f) = \Theta(\mathrm{R}(f))$ for every (possibly partial) Boolean $f$. Being allowed to duck the hard instances is worth nothing against the hardest distribution.'
    - 'Pointwise in the distribution, selection is the harder task: $\mathrm{Corr}(f, D) = O(\mathrm{Sel}(f, D))$ for every $(f,D)$ (Theorem 2.1), and there are $(f,D)$ with $\mathrm{Sel}(f,D) = \Omega(n)$ while $\mathrm{Corr}(f,D) = O(1)$ (Theorem 2.2).'
    - 'Like [[Corr]], it is subject to Shaltiel examples at a fixed distribution: $\mathrm{Sel}(\mathrm{XOR}_n, D) = O(1)$ for the same $D$, by hunting for an easy instance.'
    - 'The distribution-free collapse $\mathrm{Sel} = \Theta(\mathrm{R})$ is a corollary of $\mathrm{Corr} = \Theta(\mathrm{R})$, not an independent argument.'
  refs: [BDGHMT20, BBKW14, Shaltiel04]
  related: [Corr, R, Dmu]
  see_also: [Corr, R, Dmu, direct-sum, comp-R]
  confidence: high

- id: Rstar
  name: Asymptotic composition rate
  symbol: '\mathrm{R}^{*}(f)'
  category: composition
  order: 39
  short: 'lim_k R(f^{o k})^{1/k}: the per-level cost of composing f with itself many times.'
  definition: '$\mathrm{R}^{*}(f)=\lim_{k\to\infty}\mathrm{R}(f^{\circ k})^{1/k}$ is the per-level cost
    of iterated composition. The limit exists; bounded-error amplification requires care, so it is not justified
    by plain submultiplicativity of R. The composition rate can exceed one-level complexity: [[MeiburgCompositionRate]]
    attains $\mathrm{R}^{*}/\mathrm{R}=\Theta(\log\mathrm{R})$ [Meiburg26composition].'
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: no}}
  facts:
    - '$\mathrm{R}^*(f) \ge \Omega(\mathrm{LR}(f))$ [BBGM22].'
    - '$\mathrm{R}^*(f) \ge \Omega(\mathrm{Q}(f))$, since quantum query complexity composes perfectly.'
    - 'Whether either bound dominates the other is open.'
    - 'General upper bound: $\mathrm{R}^{*}(f)=O(\mathrm{R}(f)\log(\mathrm{R}(f)+1))$; a total family attains it [Meiburg26composition, Theorem 10.7].'
  refs: [BBGM22, Meiburg26composition]
  related: [R, Q, LR, noisyR]
  see_also: [LR, Q, R, noisyR]
  confidence: high
- id: Np
  name: Noisy decision tree complexity
  symbol: '\mathrm{N}_{p}(f)'
  aliases: ['noisy query complexity (FRPU model)', 'noisy oracle complexity']
  category: randomized
  order: 40
  short: 'Number of queries when every query answer is independently flipped with probability p.'
  definition: |
    In the model of Feige-Raghavan-Peleg-Upfal each query (repeats allowed) returns
    $x_i \oplus \eta$ where $\eta = 1$ with probability $p \in (0,1/2)$ independently
    each time. $\mathrm{N}_p(f)$ is the least number of queries needed to output $f(x)$
    with error $\le 1/3$.

    This is a *different* notion from [[noisyR]]: here the noise rate is imposed by the
    model, and repetition is the only way to reduce it, whereas in the Ben-David-Blais
    model the algorithm chooses the bias and pays for it.
  params:
    - name: p
      symbol: 'p'
      default: 'constant in (0,1/2)'
      description: 'per-query flip probability'
      dependence: |
        For constant $p$, changing $p$ changes $\mathrm{N}_p$ by only a constant factor
        (each "reliable" bit costs $\Theta(\log(1/\delta)/(1-2p)^2)$ repetitions).
        The interesting dependence is on the *target* error and on $n$.
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: yes}}
  facts:
    - '$\mathrm{N}_p(f) = O(\mathrm{R}(f)\log \mathrm{R}(f))$ always (amplify each query by $O(\log \mathrm{R})$ repetitions and union bound).'
    - '$\mathrm{N}_p(\mathrm{PARITY}_n) = \Theta(n\log n)$ [FRPU94] -- the log factor is *necessary*, giving a genuine separation from $\mathrm{R}$.'
    - 'Average-case/Fourier lower bound: $\mathrm{N}_p(f) = \Omega\!\big(\sum_S |\hat f(S)|^2 |S| \log|S|\big)$-flavoured bounds [Evans-Pippenger].'
    - '$\mathrm{N}_p(f) = \Omega(\mathrm{I}(f)\log \mathrm{I}(f))$ for every total $f$ [GLX26noisy] -- the first general lower bound beyond the trivial $\mathrm{N}_p(f) = \Omega(\mathrm{R}(f))$, and tight at PARITY.'
    - 'Almost all $f$ need $\Omega(n\log n)$ noisy queries [Reischuk-Schmeltz].'
    - 'Quantum contrast: the *robust* quantum query complexity of PARITY is $\Theta(n)$ -- no log factor [BNRdW05].'
  refs: [FRPU94, EvansPippenger98, ReischukSchmeltz91, BNRdW05, Gu25noisy, GLX26noisy]
  related: [R, noisyR, robustQ, NS]
  see_also: [R, noisyR, robustQ]
  confidence: high

- id: CA
  name: Classical adversary bound
  symbol: '\mathrm{CA}(f)'
  aliases: ['relational adversary', 'Aaronson adversary', 'Laplante-Magniez Kolmogorov bound']
  category: adversary
  order: 45
  short: 'The classical analogue of the positive-weights quantum adversary; a lower bound on R.'
  definition: |
    Aaronson's classical adversary: choose a relation $\mathcal{R}$ between 0-inputs and
    1-inputs and weights; the bound is the resulting min-max quantity. Several apparently
    different formulations (Aaronson's, the Laplante-Magniez Kolmogorov version, the
    "weighted" version) all coincide.
  settings:
    total:   {defined: yes, note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for total $f$ -- all classical adversary methods are equivalent and equal fractional block sensitivity [ABIKPS17].'}
    partial: {defined: yes, note: 'For partial functions $\mathrm{CA}$ is strictly stronger than $\mathrm{fbs}$ and can be exponentially separated from $\mathrm{R}$ [CGLMSG23].'}
    relation: {defined: yes, note: 'The relational adversary was designed for exactly this setting.'}
  equivalent:
    - {measure: CGpub, form: {exp: 1, kind: theta}, statement: '$\mathrm{CA}(f) = \Theta(\mathrm{CG}^{\mathrm{pub}}(f))$', refs: [CGLMSG23]}
    - {measure: fbs, form: {exp: 1, kind: theta}, statement: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for *total* $f$', refs: [ABIKPS17]}
  facts:
    - '$\mathrm{CA}(f) = O(\mathrm{R}(f))$ for every (partial) Boolean $f$.'
    - '$\mathrm{CA}(f) \le \mathrm{EC}(f)$ always, and $\mathrm{CA}(f) \le \mathrm{RS}(f)$.'
    - '$\mathrm{EC}(f) \le \mathrm{C}(f)$ **for total $f$ only**. The proof hands each input the indicator of a minimal certificate as its weight scheme, and checks the constraint on a pair $x,y$ with $f(x) \ne f(y)$ by observing that their certificates must conflict. On a promise problem two certificates can fail to conflict, because the string stitched together from both may simply be outside the domain -- the same step that breaks the [[CG]] sandwich. On a partial function, prove an $\mathrm{EC}$ upper bound by exhibiting a weighting directly.'
    - 'There are partial functions with $\mathrm{R}(f)$ exponentially larger than $\mathrm{CA}(f)$ [CGLMSG23].'
  refs: [Aaronson06, LaplanteMagniez08, ABIKPS17, CGLMSG23]
  related: [R, fbs, CGpub, CG, EC, Adv]
  see_also: [fbs, CG, CGpub, EC, R, Adv]
  confidence: high

- id: CG
  name: Certificate game complexity (private coin)
  symbol: '\mathrm{CG}(f)'
  category: adversary
  order: 50
  short: 'Inverse winning probability of a zero-communication game where two players must agree on a coordinate where their inputs differ.'
  definition: |
    Two players receive $x$ and $y$ with $f(x)\ne f(y)$ and, without communicating,
    must both output the *same* index $i$ with $x_i \ne y_i$. $\mathrm{CG}(f)$ is the
    inverse of the optimal (worst-case over $(x,y)$) winning probability, using
    private randomness.
  settings: {total: {defined: yes}, partial: {defined: yes}, relation: {defined: no}}
  facts:
    - '$\mathrm{CG}^{\mathrm{ns}} \le \mathrm{CG}^{*} \le \mathrm{CG}^{\mathrm{pub}} \le \mathrm{CG}$. Private coin is the *one* variant of the four that escapes the collapse to the classical adversary bound [CGLMSG23].'
    - 'The sandwich: $\max\{\mathrm{Adv}(f)^2,\ \mathrm{R}_0(f),\ \mathrm{CA}(f)\} \le \mathrm{CG}(f) \le \min\{\mathrm{C}^0(f)\,\mathrm{C}^1(f),\ O(\mathrm{EC}(f)^2)\}$ [CGLMSG23, Thm 5.10]. **For total $f$.** The definition itself is stated for possibly-partial $f$, but the sandwich is not: the certificate-product bound needs a $0$-certificate and a $1$-certificate to conflict, and on a promise problem the input stitched together from two non-conflicting certificates may simply be outside the domain. It fails badly there -- [[GluedTrees]] has $\mathrm{C} = \Theta(1)$ and $\mathrm{R}_0 = 2^{\Omega(n)}$, so no bound of the form $\mathrm{R}_0 \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ can survive.'
    - 'The upper bound $\mathrm{CG}(f) \le \mathrm{C}^0(f)\,\mathrm{C}^1(f)$ is one line: each player outputs a uniformly random index of a minimal certificate for their own input, and a $0$-certificate and a $1$-certificate must conflict somewhere. It is tight for $\mathrm{OR}$ and for $\oplus$.'
    - '$\mathrm{CG}$ is **not** bounded by $\mathrm{D}$: it can exceed the arity of the function. $\mathrm{CG}(\oplus_n) = \Theta(n^2)$, because $\mathrm{C}^0\mathrm{C}^1 = n^2$ above and $\mathrm{Adv}(\oplus_n)^2 = n^2$ below.'
    - 'The *single-bit* private-coin variant (inputs at Hamming distance $1$) equals $\lambda(f)^2$ [CGLMSG23, Thm 8.9]; the single-bit public-coin variant is $\Theta(\mathrm{s}(f))$ [CGLMSG23, Thm 8.4]. Since restricting the adversary to distance-$1$ pairs can only help the players, these are lower bounds on the unrestricted games.'
  refs: [CGLMSG23, GJKKLSSV17]
  related: [CGpub, CGstar, CGns, CA, EC, R0]
  see_also: [CGpub, CGstar, CGns, CA, lambda, EC, R0, Adv]
  confidence: medium

