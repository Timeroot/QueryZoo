# Status vocabulary used by relations. Order = severity for display.
statuses:
  settled:
    label: "Settled"
    blurb: "Upper bound and separation match (up to the stated slack)."
    color: "settled"
  gap:
    label: "Gap"
    blurb: "Best upper bound and best separation do not meet."
    color: "gap"
  open:
    label: "Wide open"
    blurb: "No nontrivial bound in at least one direction."
    color: "open"
  fails:
    label: "No bound exists"
    blurb: "Proved that no bound of this form can hold in this setting."
    color: "fails"
