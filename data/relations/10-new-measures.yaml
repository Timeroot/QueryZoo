# =====================================================================
# RELATIONS, part 10: the measures added after the first pass --
# FC (the certificate LP), the one-sided block sensitivities bs^0/bs^1,
# critical block sensitivity, decision tree rank, non-adaptive D and R,
# and one-sided approximate degree.
#
# Most of these attach to the zoo through a single exact edge (FC = fbs,
# bs^0 <= bs, rank <= D, ...) and let the transitive closure do the rest;
# what is recorded here is the edge and the family that shows the
# reverse direction fails.
# Schema: see 01-classical-core.yaml.
# =====================================================================

relations:

# ================================================================== FC
# FC and fbs are the two sides of one linear program, so this pair is an
# equality and everything else about FC follows by closure through fbs.

- from: FC
  to: fbs
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{FC}(f) = \mathrm{fbs}(f)'
      form: {exp: 1, kind: exact}
      refs: [Tal13]
      conf: high
  notes: |
    An equality, not a $\Theta$ -- the only such pair in the zoo besides the
    trivial ones. See [[FC]] for why both names are kept.
  see_also: [FC, fbs, RC, C]

- from: fbs
  to: FC
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{fbs}(f) = \mathrm{FC}(f)'
      form: {exp: 1, kind: exact}
      refs: [Tal13, KulkarniTal16]
      note: |
        The mirror of the $\mathrm{FC}$ vs $\mathrm{fbs}$ record: one LP duality, pointwise in
        $x$, over the constraint set $\{y\in\mathrm{Dom}(f): f(y)\ne f(x)\}$. Nothing about the
        duality cares whether that set came from a total function or a promise.
      conf: high
  see_also: [FC, fbs]

- from: fbs
  to: FC
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{fbs}(f) = \mathrm{FC}(f)'
      form: {exp: 1, kind: exact}
      refs: [Tal13]
      conf: high
  see_also: [FC, fbs]

- from: FC
  to: fbs
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{FC}(f) = \mathrm{fbs}(f)'
      form: {exp: 1, kind: exact}
      refs: [Tal13]
      note: 'The duality argument never uses totality: only inputs in $\mathrm{Dom}(f)$ appear as constraints on either side.'
      conf: high
  see_also: [FC, fbs]

- from: FC
  to: EC
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{FC}(f) \le \mathrm{EC}(f)'
      form: {exp: 1, kind: exact}
      refs: [GJKKLSSV17]
      note: |
        An expectational certificate assignment $\{w^x\}$ is, at each $x$, feasible for the
        fractional certificate LP up to the product structure:
        $\sum_{i: x_i\ne y_i} w^x_i \ge \sum_{i: x_i \ne y_i} w^x_i w^y_i \ge 1$.
        The inequality is checked pairwise on $(x,y)$ with $f(x)\ne f(y)$, and restricting
        to a domain only removes constraints from both LPs, so it survives to partial $f$.
      conf: high
  see_also: [FC, EC, fbs, C]

- from: FC
  to: EC
  setting: total
  status: gap
  lower:
    - stmt: '\mathrm{FC}(\mathrm{OR}_n) = \mathrm{EC}(\mathrm{OR}_n) = n'
      form: {exp: 1, kind: exact}
      witness: OR
      conf: medium
  notes: |
    Whether $\mathrm{EC} = O(\mathrm{FC})$ -- equivalently whether the extra product
    constraint in the expectational LP costs anything -- is open; the best known
    upper bound is $\mathrm{EC} \le \mathrm{C} = O(\mathrm{FC}^2)$.
  see_also: [FC, EC, fbs, C]

- from: EC
  to: C
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{EC}(f) \le \mathrm{C}(f)'
      form: {exp: 1, kind: exact}
      refs: [GJKKLSSV17]
      note: |
        Take $w^x$ to be the indicator of a minimal certificate for $x$. If
        $f(x)\ne f(y)$ then the two certificates must disagree on some queried
        coordinate -- otherwise they would be jointly satisfiable and the value
        undetermined -- so $\sum_{i:x_i\ne y_i} w^x_i w^y_i \ge 1$, and
        $\sum_i w^x_i = \mathrm{C}_x(f)$. Nothing here needs $f$ total.
      conf: high
  notes: |
    Recorded because without it the $\mathrm{EC}$ *row* has no upper bound at all:
    the measure was introduced for the inequalities that bound $\mathrm{R}_0$ from
    *below*, and $\mathrm{EC} \le \mathrm{R}_0 = O(\mathrm{EC}^2)$ [GJKKLSSV17]
    reaches nothing else. Through $\mathrm{C}$ the row inherits the rest of the
    zoo, and the two routes agree: $\mathrm{EC}\le\mathrm{C}\le\mathrm{R}_0$.
  see_also: [EC, C, FC, fbs, R0]

- from: UCmin
  to: UC
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{UC}_{\min}(f) \le \mathrm{UC}(f)'
      form: {exp: 1, kind: exact}
      refs: [BHT17]
      note: |
        $\mathrm{UC}_{\min} = \min\{\mathrm{UC}^0,\mathrm{UC}^1\}$ and
        $\mathrm{UC} = \max\{\mathrm{UC}^0,\mathrm{UC}^1\}$ [BHT17, Sec. 2.5]:
        the cheaper side is at most the dearer one. As with $\mathrm{C}^0$, this
        is the line that gives the row an upper bound of any kind -- the other
        recorded $\mathrm{UC}_{\min}$ facts,
        $\mathrm{D} \le \mathrm{UC}_{\min}^2$ and
        $\mathrm{fbs} \le 2\,\mathrm{UC}_{\min}-1$, both point the other way.
      conf: high
  see_also: [UCmin, UC, C, D, fbs]

- from: D
  to: UCmin
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{D}(f) \le \mathrm{UC}_{\min}(f)^2'
      form: {exp: 2, kind: exact}
      refs: [BHT17]
      note: 'Section 2.7.2, query-side proof due to Goos. This bound is for total functions;
        it is recorded here so all measures upper-bounded by D inherit it.'
      conf: high
  see_also: [UCmin, UC, C, R, Q]

# ================================================ one-sided sensitivity

- from: bs0
  to: bs
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{bs}^0(f) \le \mathrm{bs}(f)'
      form: {exp: 1, kind: exact}
      note: 'A maximum over a subset of the inputs -- of $\mathrm{Dom}(f)$ in the partial setting, which changes nothing.'
      conf: high
  see_also: [bs, bs1, s0, C0]

- from: bs0
  to: bs
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{bs}^0(\mathrm{OR}_n) = \mathrm{bs}(\mathrm{OR}_n) = n'
      form: {exp: 1, kind: exact}
      witness: OR
      note: 'At $0^n$ all $n$ singletons are sensitive, and $0^n$ is a $0$-input.'
      conf: high
  see_also: [bs, bs1, s0, C0]

- from: bs
  to: bs0
  setting: total
  status: fails
  lower:
    - stmt: '\mathrm{bs}(\mathrm{AND}_n) = n,\quad \mathrm{bs}^0(\mathrm{AND}_n) = 1'
      form: {kind: unbounded}
      witness: AND
      note: 'Every $0$-input of $\mathrm{AND}_n$ has exactly one sensitive block (the set of its zeros), so $\mathrm{bs}^0 = 1$ while $\mathrm{bs}^1 = n$ at $1^n$.'
      conf: high
  notes: |
    $\mathrm{bs} = \max(\mathrm{bs}^0, \mathrm{bs}^1)$, so one of the two one-sided
    quantities always equals $\mathrm{bs}$ -- but never both, and which one is not
    determined by anything else.
  see_also: [bs, bs0, bs1]

- from: bs1
  to: bs
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{bs}^1(f) \le \mathrm{bs}(f)'
      form: {exp: 1, kind: exact}
      note: 'A maximum over a subset of the inputs; the restriction to $\mathrm{Dom}(f)$ applies to both sides.'
      conf: high
  see_also: [bs, bs0, s1, C1]

- from: bs1
  to: bs
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{bs}^1(\mathrm{AND}_n) = \mathrm{bs}(\mathrm{AND}_n) = n'
      form: {exp: 1, kind: exact}
      witness: AND
      conf: high
  see_also: [bs, bs0, s1, C1]

- from: bs
  to: bs1
  setting: total
  status: fails
  lower:
    - stmt: '\mathrm{bs}(\mathrm{OR}_n) = n,\quad \mathrm{bs}^1(\mathrm{OR}_n) = 1'
      form: {kind: unbounded}
      witness: OR
      conf: high
  see_also: [bs, bs1]

- from: s0
  to: bs0
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{s}^0(f) \le \mathrm{bs}^0(f)'
      form: {exp: 1, kind: exact}
      note: 'Singleton blocks are blocks, and the maximisation is over the same set of inputs -- the $0$-inputs of $\mathrm{Dom}(f)$, promise or no promise.'
      conf: high
  see_also: [s0, bs0, s, bs]

- from: s0
  to: bs0
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{s}^0(\mathrm{OR}_n) = \mathrm{bs}^0(\mathrm{OR}_n) = n'
      form: {exp: 1, kind: exact}
      witness: OR
      conf: high
  see_also: [s0, bs0, s, bs]

- from: s1
  to: bs1
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{s}^1(f) \le \mathrm{bs}^1(f)'
      form: {exp: 1, kind: exact}
      note: 'Singleton blocks are blocks; the mirror of the $\mathrm{s}^0$ vs $\mathrm{bs}^0$ record, and equally setting-agnostic.'
      conf: high
  see_also: [s1, bs1]

- from: s1
  to: bs1
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{s}^1(\mathrm{AND}_n) = \mathrm{bs}^1(\mathrm{AND}_n) = n'
      form: {exp: 1, kind: exact}
      witness: AND
      conf: high
  see_also: [s1, bs1]

- from: C0
  to: bs0
  setting: total
  status: fails
  upper:
    - stmt: '\mathrm{C}^0(f) \le \mathrm{s}^1(f)\,\mathrm{bs}^0(f)'
      refs: [Nisan91, BdW02]
      note: 'Nisan''s argument, kept one-sided: take a maximal family of disjoint *minimal* sensitive blocks at a $0$-input $x$; each has size at most $\mathrm{s}^1(f)$ because flipping it lands on a $1$-input all of whose bits in the block are sensitive. Their union is a $0$-certificate. No `form:` -- the bound is a product of two other measures, and the $\mathrm{s}^1$ factor is not decoration: it is the whole content of the bound.'
      conf: high
    - stmt: '\mathrm{C}^0(f) \le \mathrm{s}(f)\,\mathrm{bs}^0(f) \le \mathrm{bs}(f)\,\mathrm{bs}^0(f)'
      refs: [Nisan91]
      conf: high
  lower:
    - stmt: '\mathrm{bs}^0(f) \le \mathrm{C}^0(f)'
      form: {exp: 1, kind: exact, dir: reverse}
      note: 'Disjoint sensitive blocks must each be touched by any certificate.'
      conf: high
    - stmt: '\mathrm{C}^0(g_n) = \Theta(n),\quad \mathrm{bs}^0(g_n) = O(1)'
      form: {kind: unbounded}
      witness: GSSinner
      refs: [GSS16]
      note: 'The [[GSSinner]] gadget: the indicator of $2^{n/50}$ random points. They are far apart, so a $0$-input has $O(1)$ disjoint sensitive blocks; they are dense, so no subcube of codimension $n/100$ misses them and every $0$-certificate is linear.'
      conf: high
  notes: |
    There is no upper bound on $\mathrm{C}^0$ in terms of $\mathrm{bs}^0$ alone,
    of any shape. Both recorded inequalities are products, and the witness shows
    the second factor is doing all the work: at $g_n$ the bound reads
    $n \le n\cdot O(1)$.

    This is the one-sided anomaly. Two-sidedly $\mathrm{C}\le\mathrm{s}\cdot
    \mathrm{bs}\le\mathrm{bs}^2$ and the exponent $2$ is attained ([[GSSfn]]),
    so $\mathrm{C}$ vs $\mathrm{bs}$ is settled; but the $0$-side of $\mathrm{C}$
    is controlled by the $1$-side of $\mathrm{s}$, and a function whose $1$-side
    is maximally sensitive can hide an arbitrarily large $0$-certificate behind
    a constant $\mathrm{bs}^0$. Composing with $\mathrm{OR}_n$ trades the
    unbounded ratio for the quadratic one: it multiplies $\mathrm{bs}^0$ by $n$
    and $\mathrm{C}^0$ by $n$ as well, turning $g_n$ into a family where both
    sides are polynomial and the exponent $2$ can be read off.

    A hypothesis that does buy the bound: for **monotone** $f$ the three
    measures collapse pointwise, $\mathrm{s}(f,x)=\mathrm{C}(f,x)$ for every $x$
    [Nisan91], so $\mathrm{s}^0=\mathrm{bs}^0=\mathrm{C}^0$ exactly and the cell
    is settled at exponent $1$. The witness is as far from monotone as a
    function gets -- an indicator of scattered points.
  see_also: [C0, bs0, s1, bs, C, GSSinner, GSSfn]

- from: C1
  to: bs1
  setting: total
  status: fails
  upper:
    - stmt: '\mathrm{C}^1(f) \le \mathrm{s}^0(f)\,\mathrm{bs}^1(f)'
      refs: [Nisan91, BdW02]
      note: 'The mirror image of the $\mathrm{C}^0$ bound. This is the form actually used in $\mathrm{D} \le \mathrm{C}^0\mathrm{C}^1$-style arguments.'
      conf: high
  lower:
    - stmt: '\mathrm{bs}^1(f) \le \mathrm{C}^1(f)'
      form: {exp: 1, kind: exact, dir: reverse}
      conf: high
    - stmt: '\mathrm{C}^1(\neg g_n) = \Theta(n),\quad \mathrm{bs}^1(\neg g_n) = O(1)'
      form: {kind: unbounded}
      refs: [GSS16]
      note: 'Negating the output of [[GSSinner]] swaps the two sides, so the $\mathrm{C}^0$-vs-$\mathrm{bs}^0$ impossibility transfers verbatim. Not recorded as a separate function entry: $\neg g_n$ has the same table as $g_n$ with every superscript flipped.'
      conf: high
  notes: |
    The dual of the [[C0]] vs [[bs0]] record, and it fails for the same reason:
    the product bound spends its whole budget on the *other* side, here
    $\mathrm{s}^0$.
  see_also: [C1, bs1, s0, C0, bs0, GSSinner]

# ============================================ critical block sensitivity

- from: cbs
  to: bs
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{cbs}(f) = \mathrm{bs}(f) \text{ for Boolean } f'
      form: {exp: 1, kind: exact}
      refs: [GoosPitassi14]
      note: 'Every input of a function is critical and the solution function is forced to be $f$ itself, so the min-max degenerates.'
      conf: high
  lower:
    - stmt: '\mathrm{cbs}(f) = \mathrm{bs}(f)'
      form: {exp: 1, kind: exact}
      refs: [GoosPitassi14]
      conf: high
  see_also: [cbs, bs, D]

- from: D
  to: cbs
  setting: relation
  status: fails
  headline: '\mathrm{D} \text{ is unbounded in terms of } \mathrm{cbs} \text{: critical block sensitivity lower-bounds the randomized cost, and } \mathrm{R}, \mathrm{D} \text{ are already unboundedly far apart for search problems}'
  lower:
    - stmt: '\mathrm{cbs}(S) \le \mathrm{D}(S)'
      form: {exp: 1, kind: exact, dir: reverse}
      refs: [GoosPitassi14]
      note: 'A depth-$d$ deterministic algorithm computes *some* solution function $s$, and any function computed by a depth-$d$ tree has $\mathrm{bs}(s,x)\le d$ at every $x$. So the min over solution functions is at most $\mathrm{D}(S)$.'
      conf: high
    - stmt: '\mathrm{D}(\mathrm{SearchCNF}) = \Theta(n) \to \infty, \qquad \mathrm{cbs}(\mathrm{SearchCNF}) = \Theta(1)'
      form: {kind: unbounded}
      witness: SearchCNF
      refs: [GoosPitassi14, LNNW95]
      note: 'The false-clause search problem of a random $\Delta$-dense unsatisfiable $k$-CNF. Sampling $O(1)$ clauses finds a falsified one, so $\mathrm{R} = \Theta(1)$ and hence $\mathrm{cbs} = \Theta(1)$; but naming a specific falsified clause deterministically is a tree-like resolution refutation, so $\mathrm{D} = \Theta(n)$. Contrast [[TseitinExpander]], where a single vertex constraint may be the only violated one, sampling fails, and $\mathrm{cbs} = \Theta(n)$ matches $\mathrm{D}$.'
      conf: high
  notes: |
    The point of $\mathrm{cbs}$ is not the query bound but the *lifted* one:
    $\mathrm{R}^{cc}(S\circ g^n) = \Omega(\mathrm{cbs}(S))$ for a constant-size gadget
    $g$ [GoosPitassi14]. That lifting target is randomized, which is exactly why
    $\mathrm{cbs}$ tracks $\mathrm{R}$ and not $\mathrm{D}$: see [[cbs]] vs [[R]].
    The open question in this neighbourhood is whether
    $\mathrm{R}(S) = \mathrm{poly}(\mathrm{cbs}(S))$ for total search problems, the
    relational analogue of $\mathrm{R}$ vs $\mathrm{bs}$.
  see_also: [cbs, D, bs, SearchCNF, TseitinExpander, psD]

# cbs sits under R, not under D -- the fact that makes the cell above `fails`
- from: cbs
  to: R
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{cbs}(S) = O(\mathrm{R}(S))'
      form: {exp: 1, kind: const}
      refs: [ABK21lifting, GoosPitassi14]
      putative: true
      note: 'Let $s$ be the plurality output of a bounded-error algorithm $A$ of cost $T$, let $x$ be critical, and let $B_1,\dots,B_b$ be disjoint blocks with $s(x^{B_i}) \ne s(x)$. If $A$ never queries inside $B_i$ it behaves identically on $x$ and $x^{B_i}$, so it cannot output both answers with high probability; each block must therefore be entered with constant probability, giving $b = O(T)$. Taking the min over solution functions, $\mathrm{cbs} = O(\mathrm{R})$. The same conclusion follows from $\mathrm{cbs} = O(\mathrm{CA})$ [ABK21lifting] together with $\mathrm{CA} \le \mathrm{R}$.'
      conf: high
  lower:
    - stmt: '\mathrm{cbs}(\vee_n) = n = \Theta(\mathrm{R}(\vee_n))'
      form: {exp: 1, kind: theta}
      witness: OR
      note: 'Tight already on a total function read as a search problem.'
      conf: high
  see_also: [cbs, R, CA, bs, SearchCNF, settings]

# ============================================================ rank

- from: rank
  to: D
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{rank}(f) \le \mathrm{D}(f)'
      form: {exp: 1, kind: exact}
      refs: [EhrenfeuchtHaussler89]
      note: |
        The rank of a tree never exceeds its depth (induction: rank increases only when both
        children have equal rank). This is a fact about the tree, not about what it computes,
        so it applies to whatever a depth-$\mathrm{D}$ tree is solving.
      conf: high
  see_also: [rank, D, D_size]

- from: rank
  to: D
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{rank}(\mathrm{PARITY}_n) = \mathrm{D}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      note: 'Every subtree of every tree for $\mathrm{PARITY}_n$ has both children equally hard, so the rank is the depth.'
      conf: high
  see_also: [rank, D, D_size]

- from: D
  to: rank
  setting: total
  status: fails
  lower:
    - stmt: '\mathrm{rank}(\mathrm{OR}_n) = 1,\quad \mathrm{D}(\mathrm{OR}_n) = n'
      form: {kind: unbounded}
      witness: OR
      refs: [EhrenfeuchtHaussler89]
      note: 'Rank measures branching, not depth; a "caterpillar" tree -- which is what a tree for $\mathrm{OR}_n$ is -- has rank $1$ at any depth.'
      conf: high
  notes: |
    What *is* true is a bound involving the arity: a rank-$r$ tree on $n$ variables has
    at most $\sum_{i\le r}\binom{n}{i}$ leaves, so $\mathrm{DTsize}(f) \le
    n^{O(\mathrm{rank}(f))}$ [EhrenfeuchtHaussler89]. This is why rank, not depth, is the
    parameter in the classical decision-tree learning results.
  see_also: [rank, D, D_size]

- from: rank
  to: D_size
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{rank}(f) \le \log_2 \mathrm{DTsize}(f)'
      form: {kind: log}
      refs: [EhrenfeuchtHaussler89]
      note: |
        A tree of rank $r$ contains a complete binary tree of depth $r$ as a minor, hence has at
        least $2^r$ leaves. Pure tree combinatorics: the labels at the leaves never enter, so the
        bound holds for partial functions and relations too.
      conf: high
  lower:
    - stmt: '\mathrm{rank}(\oplus_n) = n = \log_2 \mathrm{DTsize}(\oplus_n)'
      form: {kind: log}
      witness: PARITY
      note: 'The minimal tree for $\oplus_n$ is the full binary tree of depth $n$, whose rank is $n$ and whose size is $2^n$. So the inequality above is an equality and the cell closes.'
      conf: high
  see_also: [rank, D_size, D, PARITY]

- from: Cmin
  to: D_size
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{C}_{\min}(f) \le \log_2 \mathrm{DTsize}(f)'
      form: {kind: log}
      note: |
        A tree with $L$ leaves has some leaf at depth $\le \log_2 L$. The path to a
        leaf fixes the input on those coordinates and already determines the output,
        so it *is* a certificate for every input reaching it -- and $\mathrm{C}_{\min}$
        only asks for one input with a short certificate. Note this needs the $\min$:
        the deepest leaf says nothing, which is exactly why $\mathrm{C}$ itself is
        **not** bounded by $\log \mathrm{DTsize}$.
      conf: high
      putative: true
  lower:
    - stmt: '\mathrm{C}_{\min}(\oplus_n) = n = \log_2 \mathrm{DTsize}(\oplus_n)'
      form: {kind: log}
      witness: PARITY
      note: 'Every input of $\oplus_n$ needs all $n$ bits, and its minimal tree is the full binary tree on $2^n$ leaves. Equality, so nothing can be shaved.'
      conf: high
  notes: |
    This is the $\mathrm{C}_{\min}$ shadow of $\mathrm{rank}\le\log_2\mathrm{DTsize}$
    above, and can also be obtained by composing that record with
    $\mathrm{C}_{\min}\le\mathrm{rank}$ -- but the closure does not chain a
    polynomial bound through a logarithmic one, so it is recorded directly.
    Recorded under **partial** since nothing in the argument uses totality; the
    total row inherits it. It does not extend to relations, where
    $\mathrm{C}_{\min}$ is not defined.
  see_also: [Cmin, D_size, rank, UCmin, PARITY]

# ====================================================== non-adaptivity

- from: D
  to: Dna
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{D}(f) \le \mathrm{D}^{\mathrm{na}}(f)'
      form: {exp: 1, kind: exact}
      note: |
        An adaptive algorithm may ignore the answers: read the non-adaptive set $S$ in
        any order and finish. The argument never looks at what has to be *output*, so it
        is a statement about relations, and the partial- and total-function versions are
        inherited from it rather than recorded separately.
      conf: high
  see_also: [D, Dna, Rna]

- from: D
  to: Dna
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{D}(\mathrm{PARITY}_n) = \mathrm{D}^{\mathrm{na}}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      note: 'Equality, not merely the exponent: the inequality above is attained on the nose, so there is nothing left to shave here -- not even a constant.'
      conf: high
  see_also: [D, Dna]

- from: Dna
  to: D
  setting: relation
  status: settled
  headline: '\mathrm{D}^{\mathrm{na}}(f) \le 2^{\mathrm{D}(f)} - 1'
  upper:
    - stmt: '\mathrm{D}^{\mathrm{na}}(f) \le 2^{\mathrm{D}(f)} - 1'
      form: {kind: exp}
      note: |
        Not "no bound": an exponential one. A decision tree of depth $\mathrm{D}$ has at
        most $2^{\mathrm{D}}-1$ internal nodes, hence queries at most that many distinct
        variables; reading all of them non-adaptively determines the whole path, and with
        it the tree's output. Nothing here is specific to Boolean output, so it holds for
        relations.
      conf: high
  see_also: [Dna, D, Rna, TreeNav, ADDR]

- from: Dna
  to: D
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{D}^{\mathrm{na}}(\mathrm{Nav}_k) = 2^k - 1 = 2^{\mathrm{D}(\mathrm{Nav}_k)} - 1'
      form: {kind: exp}
      witness: TreeNav
      note: 'The exponential bound is attained exactly, with no constant to spare: binary tree navigation has $\mathrm{D}=k$ and all $2^k-1$ variables relevant.'
      conf: high
    - stmt: '\mathrm{D}^{\mathrm{na}}(\mathrm{ADDR}_k) = k + 2^k,\quad \mathrm{D}(\mathrm{ADDR}_k) = k+1'
      witness: ADDR
      note: 'The textbook witness, loose against the bound by a factor of two ($2^{\mathrm{D}}-1 = 2^{k+1}-1$).'
      conf: high
