# ============================================ one-sided approximate degree

- from: odeg
  to: adeg
  setting: partial
  status: settled
  upper:
    - stmt: '\widetilde{\deg}_+(f) \le \widetilde{\deg}(f)'
      form: {exp: 1, kind: exact}
      refs: [Sherstov14onesided, BT22]
      note: |
        An $\varepsilon$-approximating polynomial satisfies the one-sided constraints -- a
        pointwise implication at each $x \in \mathrm{Dom}(f)$, so a containment of feasible sets
        in any setting. (One-sided approximate degree is in fact *most* used for partial
        functions, where it is the natural measure for one-sided error.)
      conf: high
  see_also: [odeg, adeg, sdeg, deg]

- from: odeg
  to: adeg
  setting: total
  status: settled
  lower:
    - stmt: '\widetilde{\deg}_+(\mathrm{AND}_n) = \widetilde{\deg}(\mathrm{AND}_n) = \Theta(\sqrt n)'
      form: {exp: 1, kind: theta}
      witness: AND
      refs: [NS94, Paturi92]
      note: 'The one-sided relaxation buys nothing on the AND side: a polynomial bounded on all of $\{0,1\}^n \setminus \{1^n\}$ and large at $1^n$ still needs degree $\Omega(\sqrt n)$ by the Markov-brothers argument.'
      conf: high
    - stmt: '\widetilde{\deg}_+(\mathrm{PARITY}_n) = \widetilde{\deg}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      refs: [MinskyPapert69, NS94]
      note: 'Squeezed with no room at all: $\mathrm{sdeg}(\oplus_n) = n \le \widetilde{\deg}_+(\oplus_n) \le \widetilde{\deg}(\oplus_n) = n$. So on parity one-sidedness buys literally nothing, not even a constant.'
      conf: high
  see_also: [odeg, adeg, sdeg, deg]

- from: adeg
  to: odeg
  setting: total
  status: fails
  lower:
    - stmt: '\widetilde{\deg}(\mathrm{OR}_n) = \Theta(\sqrt n),\quad \widetilde{\deg}_+(\mathrm{OR}_n) = 1'
      form: {kind: unbounded}
      witness: OR
      refs: [BT22, Sherstov14onesided]
      note: '$p(x) = \sum_i x_i$ is $0$ at $0^n$ and at least $1$ everywhere else, which is all the one-sided definition asks for.'
      conf: high
  see_also: [adeg, odeg, OR]

- from: sdeg
  to: odeg
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{sdeg}(f) \le \widetilde{\deg}_+(f)'
      form: {exp: 1, kind: exact}
      refs: [Sherstov14onesided, BT22]
      note: |
        If $|p|\le 1/3$ on $f^{-1}(0)$ and $p \ge 2/3$ on $f^{-1}(1)$ then $p - 1/2$
        sign-represents $f$. Both conditions are read off the same two sets of domain points,
        so the implication holds verbatim for partial $f$.
      conf: high
  see_also: [sdeg, odeg, adeg]

- from: sdeg
  to: odeg
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{sdeg}(\mathrm{OR}_n) = \widetilde{\deg}_+(\mathrm{OR}_n) = 1'
      form: {exp: 1, kind: exact}
      witness: OR
      conf: high
  see_also: [sdeg, odeg, adeg]

- from: odeg
  to: sdeg
  setting: total
  status: fails
  lower:
    - stmt: '\widetilde{\deg}_+(\mathrm{AND}_n) = \Theta(\sqrt n),\quad \mathrm{sdeg}(\mathrm{AND}_n) = 1'
      form: {kind: unbounded}
      witness: AND
      refs: [MinskyPapert69]
      note: '$\sum_i x_i - (n - \tfrac12)$ sign-represents $\mathrm{AND}_n$ with degree $1$.'
      conf: high
  see_also: [odeg, sdeg, AND]

# ---------------------------------------------------------------------------
# Certificate games: everything except the private-coin model collapses.
# ---------------------------------------------------------------------------

- from: CGpub
  to: CGns
  setting: partial
  status: settled
  headline: 'Public-coin, entangled and non-signaling certificate games all collapse to the classical adversary bound.'
  upper:
    - stmt: '\mathrm{CG}^{\mathrm{ns}}(f) \le \mathrm{CG}^{*}(f) \le \mathrm{CG}^{\mathrm{pub}}(f)'
      form: {exp: 1, kind: exact, dir: reverse}
      refs: [CGLMSG23]
      note: 'A shared entangled state simulates shared randomness, and every entangled strategy is non-signaling, so the three models are nested by fiat.'
      conf: high
  lower:
    - stmt: '\mathrm{CG}^{\mathrm{pub}}(f) = O\big(\mathrm{CG}^{\mathrm{ns}}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [CGLMSG23]
      note: 'The **non-signaling bottleneck**. Any non-signaling strategy for the certificate game already yields a classical adversary weight scheme, so $\mathrm{CG}^{\mathrm{ns}} = \Omega(\mathrm{CA}) = \Omega(\mathrm{CG}^{\mathrm{pub}})$. Combined with the trivial nesting, $\mathrm{CG}^{\mathrm{ns}} = \Theta(\mathrm{CG}^{*}) = \Theta(\mathrm{CG}^{\mathrm{pub}}) = \Theta(\mathrm{CA})$ for every $f$. Only the private-coin model [[CG]] stays outside the collapse.'
      conf: high
  notes: |
    This is the reason the zoo records the same number in the
    $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$
    columns of every function page: the three are the same measure up to
    constants.  They are kept as separate columns only because the *definitions*
    differ and a reader may arrive looking for one of them.
  see_also: [CGpub, CGstar, CGns, CG, CA]

- from: CGpub
  to: CGstar
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{CG}^{*}(f) \le \mathrm{CG}^{\mathrm{pub}}(f)'
      form: {exp: 1, kind: exact, dir: reverse}
      refs: [CGLMSG23]
      conf: high
  lower:
    - stmt: '\mathrm{CG}^{\mathrm{pub}}(f) = O\big(\mathrm{CG}^{*}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [CGLMSG23]
      note: 'Via the non-signaling bottleneck: $\mathrm{CG}^{*} \ge \mathrm{CG}^{\mathrm{ns}} = \Omega(\mathrm{CA}) = \Omega(\mathrm{CG}^{\mathrm{pub}})$.'
      conf: high
  see_also: [CGpub, CGstar, CGns]

- from: CGstar
  to: Q
  setting: total
  status: gap
  headline: '\text{The entangled certificate game is not a quantum query lower bound: } \mathrm{CG}^{*} \text{ can be quadratically larger than } \mathrm{Q}'
  lower:
    - stmt: '\mathrm{CG}^{*}(\mathrm{OR}_n) = \Theta(n) \text{ while } \mathrm{Q}(\mathrm{OR}_n) = \Theta(\sqrt n)'
      form: {exp: 2, kind: theta}
      refs: [CGLMSG23]
      witness: OR
      note: '$\mathrm{CG}^{*}$ can be quadratically *larger* than $\mathrm{Q}$, so despite the shared entanglement it is a lower bound on randomized, not quantum, query complexity. This is the sharpest way to see that the certificate-game hierarchy is a classical object.'
      conf: high
  see_also: [CGstar, Q, OR, CGpub]

# ------------------------------------------- log-shaped separations vs DTsize
# DTsize is exponentially large, so no *polynomial* separation against it can
# exist and the value layer -- which only ever reads off exponents -- leaves
# every one of these cells blank.  The honest statement is the logarithmic one,
# and PARITY is the universal witness: its minimal tree is the full binary tree
# of depth n, so log_2 DTsize = n, which every measure below meets exactly.
# The upper halves live with the more general settings above where they are
# known; these records supply the missing separations.

- from: UCmin
  to: D_size
  setting: total
  status: gap
  lower:
