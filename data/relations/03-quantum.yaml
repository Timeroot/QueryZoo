# =====================================================================
# RELATIONS, part 3: quantum measures and adversary bounds.
# Schema documented in 01-classical-core.yaml.
# =====================================================================

relations:

# ---------------------------------------------------------- D vs Q
- from: D
  to: Q
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{D}(f) = O(\mathrm{Q}(f)^4)'
      form: {exp: 4, kind: const}
      refs: [ABKRT21]
      note: 'Theorem 2 of [ABKRT21]. Proof: $\mathrm{D}\le\mathrm{bs}\cdot\deg$ [Midrijanis04], $\mathrm{bs}=O(\mathrm{Q}^2)$ [NS94, BBCMdW01], $\deg=O(\mathrm{Q}^2)$ [ABKRT21, Thm 3].'
      conf: high
    - stmt: '\mathrm{D}(f) = O(\mathrm{Q}(f)^6)'
      form: {exp: 6, kind: const}
      refs: [BBCMdW01, BdW02]
      note: 'The 1998 bound (Corollary 4 of [BdW02]).'
      conf: high
      superseded_by: 'ABKRT21'
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega(\mathrm{Q}(f_n)^4)'
      form: {exp: 4, kind: tilde}
      witness: pointer
      refs: [ABBLSS17]
      conf: high
  notes: |
    **The maximum quantum speedup for total Boolean functions is exactly
    quartic**, up to $n^{o(1)}$ factors. Contrast the partial-function world,
    where the speedup is unbounded ([[Forrelation]], [[Simon]]).
    For **monotone** $f$, $\mathrm{D}(f) = O(\mathrm{Q}(f)^4)$ improves to
    $O(\mathrm{Q}(f)^4)$... in fact [BdW02, Cor. 6] already gives
    $\mathrm{D}(f)=O(\mathrm{Q}(f)^4)$ for monotone $f$ from $\mathrm{D}\le\mathrm{s}^2$.
  see_also: [D, Q, pointer, Forrelation]

# ---------------------------------------------------------- R vs Q
- from: R
  to: Q
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{R}(f) \le \mathrm{D}(f) = O(\mathrm{Q}(f)^4)'
      form: {exp: 4, kind: const}
      refs: [ABKRT21]
      conf: high
  lower:
    - stmt: \forall\alpha<4\ \exists k:\ \frac{\mathrm{R}(F_{k,m})}{(1+\mathrm{Q}(F_{k,m}))^\alpha}\longrightarrow\infty
      refs:
        - OpenAI26QuarticRQ
      conf: high
      note: 'Theorem 1.1: for each fixed k≥2, R≥c_k m^(2−1/k)/log²m and Q≤C_k sqrt(m)(log m)^{b_k}. Thus
        the optimal power is 4. The fixed-k lower exponent is 4−2/k; no literal fixed-k Ω̃(Q⁴) shadow is
        asserted.'
      witness: OpenAIQuarticRQ
    - stmt: \mathrm{R}(f_n) = \widetilde\Omega(\mathrm{Q}(f_n)^3)
      form:
        exp: 3
        kind: tilde
      refs:
        - BansalSinha21
        - SSW21
        - ABK16
      witness: kForrelation
      note: Take $k$-Forrelation ($\mathrm{Q}=k$, $\mathrm{R}=\widetilde\Theta(n^{1-1/2k})$, a *partial*
        function) and totalise it with a cheat sheet [ABK16].
      conf: high
  notes: The optimal randomized-to-quantum power for total Boolean functions is now 4 [OpenAI26QuarticRQ,
    Theorem 1.1], matching the known universal upper bound [ABKRT21] and refuting the conjectured cubic
    bound. The new family attains every exponent below 4, with polylogarithmic losses for each fixed k.
    The earlier cubic separation is retained below as a historical lower bound.
  see_also: [R, Q, kForrelation, cheatsheet, open-R-vs-Q, OpenAIQuarticRQ]

# --------------------------------------------------------- Q vs deg
- from: Q
  to: deg
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{Q}(f) \le \mathrm{D}(f) \le 2\deg(f)^3'
      form: {exp: 3, kind: const}
      refs: [Midrijanis04]
      conf: high
  lower:
    - stmt: '\mathrm{Q}(f_n) = \widetilde\Omega(\deg(f_n)^2)'
      form: {exp: 2, kind: tilde}
      refs: [ABK16]
      witness: cheatsheet
      conf: high
  notes: |
    "How lossy is the polynomial method?" The gap here $[2,3]$ mirrors the
    $\mathrm{D}$-vs-$\deg$ gap.
  see_also: [Q, deg, adeg]

# ------------------------------------------------------- Q vs lambda
- from: Q
  to: lambda
  setting: partial
  status: settled
  upper:
    - stmt: '\lambda(f) \le \mathrm{Q}(f)\cdot O(1) \quad\text{i.e.}\quad \mathrm{Q}(f) = \Omega(\lambda(f))'
      form: {exp: 1, kind: const, dir: reverse}
      refs: [ABKRT21, BarnumSaksSzegedy03]
      note: |
        Spectral sensitivity is a quantum lower bound because
        $\lambda(f)\le\mathrm{Adv}(f)\le \mathrm{Adv}^{\pm}(f)=\Theta(\mathrm{Q}(f))$. Every link
        of that chain holds for partial $f$ -- the sensitivity graph is built from the domain
        edges, the eigenvector is a feasible adversary matrix, and $\mathrm{Adv}^\pm$
        characterises $\mathrm{Q}$ off-promise too [LMRSS11] -- so the bound belongs here.
      conf: high
  see_also: [lambda, Q, Adv]

- from: Q
  to: lambda
  setting: total
  status: settled
  lower:
    - stmt: '\lambda(\mathrm{PARITY}_n) = n,\ \mathrm{Q}(\mathrm{PARITY}_n)=\lceil n/2\rceil'
      form: {exp: 1, kind: const}
      witness: PARITY
      conf: high
  see_also: [lambda, Q, Adv]

- from: lambda
  to: s
  setting: partial
  status: settled
  upper:
    - stmt: '\lambda(f) \le \mathrm{s}(f)'
      form: {exp: 1, kind: exact}
      refs: [ABKRT21]
      note: |
        Spectral radius of the sensitivity graph is at most its maximum degree -- a fact about
        the graph, and for partial $f$ the graph simply has fewer edges (only pairs
        $x, x^{i} \in \mathrm{Dom}(f)$ with $f(x)\ne f(x^i)$). Its maximum degree is
        $\mathrm{s}(f)$ in either setting.
      conf: high
  see_also: [lambda, s, deg, Huang19]

- from: lambda
  to: s
  setting: total
  status: settled
  lower:
    - stmt: '\sqrt{\mathrm{s}(f)} \le \lambda(f)'
      refs: [ABKRT21]
      note: 'A star $K_{1,\mathrm{s}}$ sits inside the sensitivity graph, and $\lambda(K_{1,k})=\sqrt k$. Tight for AND: $\lambda(\wedge_n)=\sqrt n$, $\mathrm{s}(\wedge_n)=n$.'
      witness: AND
      conf: high
    - stmt: '\lambda(\mathrm{PARITY}_n) = \mathrm{s}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      refs: [ABKRT21]
      note: 'The other end of $\sqrt{\mathrm{s}} \le \lambda \le \mathrm{s}$: the sensitivity graph of $\oplus_n$ is the whole hypercube $Q_n$, which is $n$-regular, so $\lambda = n = \mathrm{s}$.'
      conf: high
  notes: |
    So $\sqrt{\mathrm{s}} \le \lambda \le \mathrm{s}$, and both ends are achieved.
    Huang''s theorem is the statement $\deg\le\mathrm{s}^2$; its spectral
    strengthening $\deg\le\lambda^2$ [ABKRT21, Thm 1] is what makes $\lambda$
    worth its own column.
  see_also: [lambda, s, deg, Huang19]

# ------------------------------------------------------- Adv family
- from: Q
  to: Advpm
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{Adv}^{\pm}(f)\le \mathrm{Q}(f)\cdot O(1)'
      form: {exp: 1, kind: const}
      refs: [HLS07]
      note: 'The easy half of the characterisation -- [HLS07] proved the adversary is a valid lower bound; [Reichardt11, LMRSS11] the converse. Both halves are setting-agnostic, so the $\Theta$ is recorded for **relations** and inherited here.'
      conf: high
  notes: |
    Consequences: $\mathrm{Q}$ composes perfectly
    ($\mathrm{Q}(f\circ g)=\Theta(\mathrm{Q}(f)\mathrm{Q}(g))$), and
    $\mathrm{Adv}^{\pm}=\Theta(\gamma_2$-norm$)$.
  see_also: [Advpm, Q, gamma2, composition]

- from: Advpm
  to: Adv
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)'
      form: {exp: 1, kind: exact, dir: reverse}
      note: |
        Trivial: the positive adversary is the negative adversary restricted to non-negative
        weights, i.e. a minimisation over a smaller feasible set. Both SDPs are written down
        the same way whatever the domain and whatever is to be output, so the containment is a
        fact about relations.
      conf: high
  see_also: [Adv, Advpm, MAdv, ElementDistinctness]

- from: Advpm
  to: Adv
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}(f)) \le \mathrm{D}(f) \le \mathrm{bs}(f)^3 \le \mathrm{Adv}(f)^6'
      form: {exp: 6, kind: const}
      refs: [Reichardt11, Nisan91, Ambainis02]
      note: 'Only the two ends are about adversaries: $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$ at one, $\mathrm{bs}\le\mathrm{Adv}^2$ at the other, with the ordinary classical chain in between. So every improvement to [[open-D-vs-bs]] lands here doubled.'
      conf: high
  lower:
    - stmt: '\mathrm{Adv}^{\pm}(f_n) = \widetilde\Omega\big(\mathrm{Adv}(f_n)^2\big)'
      form: {exp: 2, kind: tilde}
      refs: [ABK16, SpalekSzegedy06, Zhang05]
      witness: cheatsheet
      note: 'The **certificate complexity barrier**, $\mathrm{Adv} \le \sqrt{\mathrm{C}^{0}\mathrm{C}^{1}}$, applied to a function built to have cheap certificates and expensive quantum complexity: $\mathrm{Q} = \widetilde\Theta(n)$ against $\mathrm{C} = \widetilde O(\sqrt n)$, so $\mathrm{Adv} = \widetilde O(\sqrt n)$ however the true value falls out. Element distinctness is the older and weaker illustration: a $2$-element $1$-certificate but $\mathrm{C}^{0} = n$, so the barrier gives only $\mathrm{Adv} = O(\sqrt n)$ against $\mathrm{Q} = \Theta(n^{2/3})$.'
      conf: high
    - stmt: '\mathrm{Adv}^{\pm}(g^{\circ d}) \ge \mathrm{Adv}(g^{\circ d})^{1.098}'
      form: {exp: 1.098, kind: exact}
      refs: [HLS07]
      note: 'Smaller than the barrier separation, but the only one proved *between the two bounds themselves* rather than through $\mathrm{Q}$. Take the monotone $g$ on six bits whose minterms and maxterms are the Hamming-weight-three inputs of a function of Kushilevitz''s, so $\mathrm{C}^{0}(g) = \mathrm{C}^{1}(g) = 3$; a numerically found negative-weight matrix gives $\mathrm{Adv}^{\pm}(g) \ge 2 + 3\sqrt5/5 \approx 3.341$; both bounds compose, and the barrier caps $\mathrm{Adv}(g^{\circ d})$ at $3^d$.'
      conf: high
  notes: |
    Written out at [[open-Advpm-vs-Adv]]. The positive adversary is pinned
    between $\sqrt{\mathrm{fbs}}$ and $\mathrm{fbs}$ on total functions
    [Ambainis02, KulkarniTal16], so this cell is a proxy for $\mathrm{Q}$
    versus $\mathrm{fbs}$.
  see_also: [Adv, Advpm, MAdv, cheatsheet, ElementDistinctness, open-Advpm-vs-Adv]

- from: Advpm
  to: Adv
  setting: partial
  status: settled
  lower:
    - stmt: '\mathrm{Adv}(\mathrm{Col}) = O(1) \text{ while } \mathrm{Adv}^{\pm}(\mathrm{Col}) = \Theta(n^{1/3})'
      form: {kind: unbounded}
      refs: [SpalekSzegedy06, Zhang05, AaronsonShi04]
      witness: Collision
      note: 'The **property-testing barrier**: if every $0$-input is at relative Hamming distance $\ge\epsilon$ from every $1$-input then $\mathrm{Adv}(f) \le 1/\epsilon$, since both certificate complexities are $O(1)$ under such a promise. [[Collision]] has $\epsilon = 1/2$, so the positive adversary is stuck at a constant against $\mathrm{Q} = \Theta(n^{1/3})$; [[Simon]] is the same story against $\Theta(n)$. This is exactly why the negative-weights version was invented.'
      conf: high
  see_also: [Adv, Advpm, MAdv, Collision, Simon, open-Advpm-vs-Adv]

# ------------------------------------------- Adv vs C (the barrier, as a bound)
- from: Adv
  to: C
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{Adv}(f) \le \sqrt{\mathrm{C}^{0}(f)\,\mathrm{C}^{1}(f)} \le \mathrm{C}(f)'
      form: {exp: 1, kind: exact}
      refs: [SpalekSzegedy06, Zhang05]
      note: 'The **certificate complexity barrier**, recorded here in the coarse two-measure form the matrix can use; the sharp statement involves $\mathrm{C}^{0}$ and $\mathrm{C}^{1}$ separately and is written out under [[Advpm]] vs [[Adv]] above. The second inequality is just $\sqrt{ab}\le\max(a,b)$. This is the precise sense in which the positive adversary cannot see past certificates -- and the reason $\mathrm{Adv}^{\pm}$ exists. **Boolean output only.** The barrier is a statement about $0/1$-valued $f$, where "$\mathrm{C}^{0}$" and "$\mathrm{C}^{1}$" mean something; it does not survive a large output alphabet. [[OrderedSearch]] is the sharpest illustration: two queries $\{x_k = 0,\; x_{k+1} = 1\}$ pin down the answer, so the decision version has $\mathrm{C} = 2$, yet the $(n+1)$-valued *reconstruction* version has $\mathrm{Adv} \ge \tfrac{1}{\pi}\ln n$ [ChildsLee08]. That is why the $\mathrm{C}$ row is left blank on that page rather than filled in with the constant.'
      conf: high
  lower:
    - stmt: '\mathrm{Adv}(\oplus_n) = \mathrm{C}(\oplus_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      note: 'Every input of $\oplus_n$ is fully sensitive, so $\mathrm{C}=n$, and the basic adversary on the Hamming-distance-one relation already gives $n$. So the barrier is attained and the cell closes.'
      conf: high
  notes: |
    Recorded under **partial** because nothing in the barrier's proof uses
    totality -- and the promise setting is exactly where it hurts, since a
    property-testing promise can force both certificate complexities to $O(1)$
    while $\mathrm{Q}$ is polynomially large. The total-function row inherits it.
  see_also: [Adv, C, Advpm, Collision, Simon, OrderedSearch]

# --------------------------------------- Adv vs adeg (the polynomial ceiling)
- from: Adv
  to: adeg
  setting: partial
  status: gap
  upper:
    - stmt: '\mathrm{Adv}(f) = O\big(\widetilde{\deg}(f)^2\big)'
      form: {exp: 2, kind: const}
      refs: [ABK21lifting]
      note: 'The positive-weight adversary can never beat the polynomial method by more than a square, even on promise problems. This is the cleanest way to see why the Ambainis-Belovs separation *had* to use negative weights: [[AmbainisBelovsFn]] has $\deg = 9$, hence $\widetilde{\deg} \le 9$, hence $\mathrm{Adv} = O(1)$, against $\mathrm{Q} = \widetilde\Omega(n^{1/3})$. Compare the certificate barrier under [[Adv]] vs [[C]]: that one bites on property-testing promises, this one bites on low-degree ones.'
      conf: high
  lower:
    - stmt: '\mathrm{Adv}(\oplus_n) = \widetilde{\deg}(\oplus_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      note: 'The linear end. Whether the exponent $2$ in the upper bound is ever approached is not settled here -- $\mathrm{Adv} \le \mathrm{Q}$ and $\widetilde{\deg} \le \mathrm{Q}$ both hold, so any witness must have $\widetilde{\deg}$ strictly below $\mathrm{Q}$ while the positive adversary stays high, which is the opposite of the usual situation.'
      conf: high
  see_also: [Adv, adeg, Advpm, AmbainisBelovsFn, C]

# --------------------------------------- bs vs Adv (Ambainis' basic bound)
- from: bs
  to: Adv
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{bs}(f) \le \mathrm{Adv}(f)^2'
      form: {exp: 2, kind: exact}
      refs: [Ambainis02]
      note: |
        Ambainis'' basic bound applied to a single maximally block-sensitive input.
        Take $x$ attaining $\mathrm{bs}(f)=b$ with disjoint sensitive blocks
        $B_1,\dots,B_b$, and let $R$ relate $x$ to the $b$ inputs $x^{B_j}$.
        Then $m_x = b$, $m_y = 1$, and because the blocks are **disjoint** each
        index $i$ lies in at most one of them, so $\ell_x=\ell_y=1$. The bound
        $\sqrt{m_x m_y/(\ell_x \ell_y)}$ is $\sqrt b$. Nothing here needs $f$
        total: each $x^{B_j}$ is a domain point by the definition of a sensitive
        block.
      conf: high
  lower:
    - stmt: '\mathrm{bs}(\vee_n) = n = \mathrm{Adv}(\vee_n)^2'
      form: {exp: 2, kind: exact}
      witness: OR
      note: '$\mathrm{Adv}(\vee_n)=\sqrt n$, which the barrier above also caps at $\sqrt{\mathrm{C}^0\mathrm{C}^1}=\sqrt n$. The exponent $2$ is optimal and the cell closes.'
      conf: high
  notes: |
    The two-sided refinement $\mathrm{Adv}(f) = \Omega\big(\sqrt{\mathrm{bs}^{0}(f)\,
    \mathrm{bs}^{1}(f)}\big)$ comes out of the same relation with $X$ and $Y$
    both taken to be large, and is what pins $\mathrm{Adv}$ on functions like
    [[ADDR]]; it is not a two-measure statement, so it lives in the notes rather
    than in the matrix. Composed with $\mathrm{s}\le\mathrm{bs}$ this record also
    supplies $\mathrm{s}\le\mathrm{Adv}^2$, and with
    $\mathrm{Adv}\le\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$ it recovers the
    classic $\mathrm{Q}=\Omega(\sqrt{\mathrm{bs}})$.
  see_also: [bs, Adv, Q, Ambainis02, OR, ADDR]

- from: MAdv
  to: Q
  setting: partial
  status: settled
  headline: 'The multiplicative adversary is sandwiched between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}$, so it is $\Theta(\mathrm{Q})$ -- its value is in the *strength* of the statements it proves, not in the quantity it computes.'
  upper:
    - stmt: '\mathrm{MAdv}(f) = O\big(\mathrm{Q}_{\varepsilon}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [Spalek08]
      note: 'It is a lower-bound method for $\mathrm{Q}$, so it cannot exceed it.'
      conf: high
  lower:
    - stmt: '\mathrm{MAdv}(f) = \Omega\big(\mathrm{Q}_{\varepsilon}(f)\big)'
      form: {exp: 1, kind: const, dir: reverse}
      refs: [Spalek08, Reichardt11]
      note: 'Via $\mathrm{Adv}^{\pm} \le \mathrm{MAdv}$ below and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_\varepsilon)$.'
      conf: high
  notes: |
    So as a *number* the multiplicative adversary tells you nothing that
    [[Advpm]] does not. What it buys is the regime: the multiplicative progress
    measure survives success probability $2^{-\Omega(T)}$, which is what strong
    direct product theorems need, whereas the additive bound degrades to nothing
    once the success probability drops below a constant. Every value on a function
    page is therefore recorded as $\Theta(\mathrm{Q})$ and derived.
  see_also: [Advpm, Q, Adv]

- from: MAdv
  to: Advpm
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{Adv}^{\pm}(f) = O\big(\mathrm{MAdv}(f)\big)'
      form: {exp: 1, kind: const, dir: reverse}
      refs: [Spalek08]
      note: 'Spalek shows the multiplicative adversary is at least as strong as the additive one, up to a constant.'
      conf: medium
  see_also: [Advpm, MAdv]

- from: gamma2
  to: Advpm
  setting: partial
  status: settled
  headline: 'The approximate $\gamma_2$ norm *is* the general adversary bound, rewritten as a factorisation norm.'
  upper:
    - stmt: '\gamma_2^{\alpha}(f) = O\big(\mathrm{Adv}^{\pm}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [LMRSS11]
      conf: high
  lower:
    - stmt: '\gamma_2^{\alpha}(f) = \Omega\big(\mathrm{Adv}^{\pm}(f)\big)'
      form: {exp: 1, kind: const, dir: reverse}
      refs: [LMRSS11]
      conf: high
  notes: |
    The adversary SDP and the $\gamma_2$ minimisation are two readings of the same
    optimisation: an adversary matrix $\Gamma$ with $\|\Gamma\|=1$ and small
    $\|\Gamma\circ\Delta_i\|$ is exactly a small factorisation of the target through the
    query matrices. Nothing in the translation asks $f$ to be total, so the identification
    holds verbatim on a promise.
  see_also: [gamma2, Advpm, Q]

- from: gamma2
  to: Q
  setting: partial
  status: settled
  headline: 'Hence $\gamma_2^{\alpha} = \Theta(\mathrm{Q})$: it computes quantum query complexity, it does not merely bound it.'
  upper:
    - stmt: '\gamma_2^{\alpha}(f) = O\big(\mathrm{Q}_{\varepsilon}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [LMRSS11, Reichardt11]
      note: 'Via $\gamma_2^{\alpha} = \Theta(\mathrm{Adv}^{\pm})$ above and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_{\varepsilon})$.'
      conf: high
  lower:
    - stmt: '\gamma_2^{\alpha}(f) = \Omega\big(\mathrm{Q}_{\varepsilon}(f)\big)'
      form: {exp: 1, kind: const, dir: reverse}
      refs: [LMRSS11, Reichardt11]
      conf: high
  notes: |
    This is the record the function pages appeal to when they enter
    $\gamma_2 = \Theta(\mathrm{Q})$ rather than computing a factorisation by hand. The
    interesting reading is the contrast with the *positive* adversary [[Adv]]: on
    [[Collision]] the positive bound is capped at $O(1)$ by the certificate-complexity
    barrier while $\gamma_2 = \Theta(n^{1/3})$, so the difference between the two norms is
    the whole of what sign changes buy.
  see_also: [gamma2, Q, Advpm, Adv, Collision]

- from: Adv
  to: lambda
  setting: partial
  status: settled
  upper:
    - stmt: '\lambda(f) \le \mathrm{Adv}(f)'
      form: {exp: 1, kind: exact, dir: reverse}
      refs: [ABKRT21, BarnumSaksSzegedy03]
      note: |
        Plug the sensitivity-graph eigenvector into the positive adversary SDP. The adversary
        matrix built this way is supported on domain pairs $x, x^i$ with $f(x)\ne f(x^i)$, which
        is exactly where the SDP allows weight, so the construction is unchanged for partial $f$.
      conf: high
  see_also: [lambda, Adv]

# ------------------------------------------------------- QC, RC
- from: QC
  to: RC
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{QC}(f) = \Theta\big(\sqrt{\mathrm{RC}(f)}\big) = \Theta\big(\sqrt{\mathrm{fbs}(f)}\big)'
      form: {exp: 0.5, kind: theta}
      refs: [Aaronson08]
      note: |
        An exact characterisation, proved with Ambainis' adversary method in both directions.
        Both halves are per-input verification statements -- weighted Grover over the fractional
        cover upward, the adversary bound downward -- and the adversary method is valid for
        promise problems, so no totality enters.
      conf: high
  see_also: [QC, RC, fbs, Adv]

- from: R0
  to: Q0
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{R}_0(f) = O\big(\mathrm{Q}(f)^2\,\mathrm{Q}_0(f)\log n\big)'
      refs: [Aaronson08]
      note: 'One of the few bounds that goes *from* quantum measures *to* a classical one; note the explicit $\log n$.'
      conf: high
  lower:
    - stmt: '\exists \text{ monotone total } f:\ \mathrm{R}_0(f) = \widetilde\Omega\big(\mathrm{Q}_0(f)^2\big)'
      form: {exp: 2, kind: tilde}
      refs: [BCWZ99]
      note: 'A nearly quadratic zero-error quantum speedup, for monotone functions and for monotone graph properties (bearing on the evasiveness conjecture). Quadratic is the most that can be hoped for on total $f$ if $\mathrm{Q}_0$ behaves like $\mathrm{Q}$; the other direction is bounded by the $\mathrm{Q}^2\mathrm{Q}_0\log n$ upper bound just above.'
      conf: medium
  notes: |
    The other side of this pair is definitional: $\mathrm{Q}_0 \le 2\mathrm{R}_0$ by
    Markov truncation, which holds for relations too -- see the definitional file.
  see_also: [R0, Q0, Q, Aaronson08, BCWZ99]

# ------------------------------------------------------- QE
- from: D
  to: QE
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{D}(f) \le 2\deg(f)^3 \le 16\,\mathrm{Q}_E(f)^3'
      form: {exp: 3, kind: const}
      refs: [Midrijanis04, BBCMdW01]
      conf: high
    - stmt: '\mathrm{D}(f) = O(\mathrm{Q}_E(f)^4)'
      form: {exp: 4, kind: const}
      refs: [BBCMdW01, BdW02]
      note: 'Corollary 4 of [BdW02]; superseded by the cubic bound above.'
      conf: high
      superseded_by: 'Midrijanis04'
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega(\mathrm{Q}_E(f_n)^2)'
      form: {exp: 2, kind: tilde}
      refs: [ABBLSS17]
      witness: pointer
      conf: high
    - stmt: '\mathrm{D}(f_n) = \Omega(\mathrm{Q}_E(f_n)^{1.15})'
      form: {exp: 1.15, kind: const}
      refs: [Ambainis13]
      witness: Ambainis13fn
      note: 'The first *superlinear* exact-quantum advantage for a total function: $\mathrm{Q}_E(f)=O(\mathrm{D}(f)^{0.8675})$. Historically the harder result, even though the pointer function later gave a bigger exponent for this cell.'
      conf: high
  notes: |
    **Open problem 4 of [BdW02]**: is $\mathrm{Q}_E(f)=O(\deg(f))$? Equivalently,
    can exact quantum algorithms ever beat the degree lower bound by more than a
    constant? For **symmetric** $f$, $\mathrm{Q}_E(f)=\Theta(n)$ [BdW02, Thm 21],
    so no speedup at all.
  see_also: [QE, D, deg, Ambainis13fn, open-QE-vs-deg, open-D-vs-QE]

# ------------------------------------------------------- NQ / ndeg
- from: NQ
  to: ndeg
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2\rceil'
      form: {exp: 1, kind: theta}
      refs: [deWolf03]
      note: |
        An *exact* characterisation, not merely a polynomial relation: nondeterministic quantum
        query complexity is half the nondeterministic degree. The acceptance amplitude of a
        $T$-query algorithm is a degree-$2T$ polynomial nonzero exactly on the $1$-inputs, and
        conversely $p$ may be rescaled by its maximum over the cube; nonvanishing is
        scale-invariant and off-domain behaviour is unconstrained either way, so this is a
        statement about partial functions.
      conf: high
  notes: |
    Also $\mathrm{ndeg}(f)\le\mathrm{C}^{1}(f)$, and $\mathrm{ndeg}$ can be
    exponentially smaller than $\mathrm{D}$ -- the nondeterministic world is
    genuinely different.
  see_also: [NQ, ndeg, C1]

# ------------------------------------------------------- PostQ / rdeg
- from: PostQ
  to: ardeg
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{PostQ}_\varepsilon(f) = \Theta(\mathrm{rdeg}_\varepsilon(f))'
      form: {exp: 1, kind: theta}
      refs: [MahadevdeWolf15]
      note: |
        Post-selected quantum query complexity is characterised by *approximate rational* degree,
        exactly as $\mathrm{Q}$ is characterised (polynomially) by approximate degree. Rational
        degree is defined with no boundedness required off the domain, and the implementation
        direction rescales $p$ and $q$ jointly, which leaves $p/q$ fixed -- so the characterisation
        is a partial-function one.
      conf: high
  notes: |
    This is the reason rational degree is in the zoo at all: it is the natural
    "$\mathsf{PostBQP}$" analogue of $\widetilde{\deg}$. Its exact version
    $\mathrm{rdeg}$ -- equivalently $\mathrm{PostQ}_{\mathrm{E}}$, zero-error
    post-selected quantum query complexity -- is the one Fortnow asked about,
    answered in [KKWY26].
  see_also: [PostQ, ardeg, rdeg, sdeg]

# ------------------------------------------------------- robust Q
- from: robustQ
  to: Q
  setting: relation
  status: gap
  upper:
    - stmt: '\mathrm{Q}^{\mathrm{rob}}(f) = O(\mathrm{Q}(f)\log \mathrm{Q}(f))'
      form: {exp: 1, log: 1, kind: const}
      refs: [BNRdW05]
      note: |
        A black-box simulation: amplify each of the $\mathrm{Q}$ queries by
        $O(\log \mathrm{Q})$ noisy ones and take a (reversible) majority, then union-bound.
        The construction never inspects what the algorithm is computing, so it applies to
        partial functions and relations verbatim.
      conf: high
  see_also: [robustQ, Q, Np, noisyR, PARITY]

- from: robustQ
  to: Q
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{Q}^{\mathrm{rob}}(\mathrm{PARITY}_n) = \Theta(n)'
      refs: [BNRdW05]
      note: '**No** $\log n$ overhead, unlike the classical noisy model where $\mathrm{N}_p(\mathrm{PARITY}_n)=\Theta(n\log n)$ [FRPU94, EvansPippenger98]. Quantum error-correction of the *oracle* is cheaper than classical repetition.'
      witness: PARITY
      conf: high
  notes: |
    Whether the $\log$ is needed in general is open. Compare with the
    classical picture in the noise file: there the $\log$ is provably
    necessary for PARITY.
  see_also: [robustQ, Q, Np, noisyR, PARITY]
