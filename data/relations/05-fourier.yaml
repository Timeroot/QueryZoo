# =====================================================================
# RELATIONS, part 5: Fourier-analytic measures.
# Schema documented in 01-classical-core.yaml.
# =====================================================================

relations:

- from: Inf
  to: s
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{I}(f) \le \mathrm{s}(f)'
      form: {exp: 1, kind: exact}
      refs: [ODonnell14]
      note: 'Total influence is the *average* number of sensitive coordinates, sensitivity the maximum. Equality for $\mathrm{PARITY}_n$ (both $=n$).'
      witness: PARITY
      conf: high
  lower:
    - stmt: '\mathrm{I}(\mathrm{PARITY}_n) = \mathrm{s}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      note: 'Every coordinate is sensitive at every input, so the average and the maximum coincide: the inequality is attained with nothing to spare.'
      conf: high
    - stmt: '\mathrm{I}(f) \text{ can be exponentially smaller than } \mathrm{s}(f)'
      witness: AND
      note: '$\mathrm{I}(\wedge_n) = n\,2^{-(n-1)}$ while $\mathrm{s}(\wedge_n)=n$. Influence is an *average-case* measure, so it is not comparable to the worst-case zoo in the usual way.'
      conf: high
  notes: |
    Influence-type measures sit slightly outside the main lattice: they lower
    bound average-case rather than worst-case complexity. The useful direction
    is always $\mathrm{I}(f) \le (\text{worst-case measure})$.
  see_also: [Inf, s, MaxInf, D]

- from: Inf
  to: deg
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{I}(f) \le \deg(f)'
      form: {exp: 1, kind: exact}
      note: '$\mathrm{I}(f)=\sum_S |S|\hat f(S)^2 \le \deg(f)\sum_S \hat f(S)^2 = \deg(f)$ by Parseval.'
      conf: high
  lower:
    - stmt: '\mathrm{I}(\mathrm{PARITY}_n)=\deg(\mathrm{PARITY}_n)=n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  see_also: [Inf, deg]

- from: Inf
  to: adeg
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{I}(f) = O(\widetilde{\deg}(f))'
      form: {exp: 1, kind: const}
      refs: [Shi00]
      note: 'Shi''s theorem. Hence $\mathrm{I}(f)=O(\mathrm{Q}(f))$ -- a quantum algorithm cannot be much cheaper than the total influence of what it computes.'
      conf: high
  lower:
    - stmt: '\mathrm{I}(\mathrm{PARITY}_n)=n,\ \widetilde{\deg}(\mathrm{PARITY}_n)=n'
      form: {exp: 1, kind: const}
      witness: PARITY
      conf: high
  see_also: [Inf, adeg, Q, Shi00]

- from: Inf
  to: D_size
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{I}(f) \le \log_2 \mathrm{DTsize}(f)'
      form: {kind: log}
      refs: [ODonnell14]
      note: |
        Two standard steps. First, for any decision tree $T$ computing $f$,
        $\mathrm{Inf}_i(f) \le \Pr_x[T \text{ queries } i]$ -- if $f(x)\ne f(x^{\oplus i})$
        and $T$ never queried $i$, then $x$ and $x^{\oplus i}$ follow the same path
        and get the same answer. Summing over $i$ gives
        $\mathrm{I}(f) \le \mathbb{E}_x[\#\text{queries}]$. Second, in a tree where
        no coordinate is queried twice a leaf at depth $d_\ell$ is reached with
        probability exactly $2^{-d_\ell}$, so
        $\mathbb{E}_x[\#\text{queries}] = \sum_\ell p_\ell \log_2(1/p_\ell)$ is the
        entropy of a distribution on $\mathrm{DTsize}(f)$ outcomes, hence at most
        $\log_2 \mathrm{DTsize}(f)$.
      conf: high
      putative: true
  lower:
    - stmt: '\mathrm{I}(\oplus_n) = n = \log_2 \mathrm{DTsize}(\oplus_n)'
      form: {kind: log}
      witness: PARITY
      note: 'Attained exactly: the minimal tree for $\oplus_n$ is the full binary tree on $2^n$ leaves and every coordinate is fully influential.'
      conf: high
  notes: |
    Strictly stronger than $\mathrm{I}(f)\le\mathrm{D}(f)$, since
    $\log_2\mathrm{DTsize}\le\mathrm{D}$: a wide shallow tree bounds the
    influence by its *size*, not its depth. The first step above is the same
    observation that drives the OSSS inequality.
  see_also: [Inf, D_size, D, MaxInf, PARITY]

- from: D
  to: MaxInf
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{D}(f) \;\ge\; \frac{\mathrm{Var}(f)}{\mathrm{MaxInf}(f)}'
      refs: [OSSS05]
      note: '**OSSS inequality:** $\mathrm{Var}(f) \le \sum_i \delta_i(T)\,\mathrm{Inf}_i(f)$ for every decision tree $T$, where $\delta_i(T)$ is the probability that $T$ queries $i$. Summing, $\sum_i\delta_i(T) \le \mathrm{D}(f)$, so some coordinate has influence at least $\mathrm{Var}(f)/\mathrm{D}(f)$.'
      conf: high
  notes: |
    OSSS is the standard route from "shallow decision tree" to "influential
    variable", and is the classical shadow of the **Aaronson-Ambainis
    conjecture**, which asks for the same conclusion from *bounded low-degree
    polynomial* instead of *shallow decision tree*.
  see_also: [D, MaxInf, Inf, Inf1, AaronsonAmbainis14, open-aaronson-ambainis]

- from: MaxInf
  to: adeg
  setting: total
  status: open
  upper:
    - stmt: '\text{(conjectured) } \mathrm{MaxInf}(p) \ge \mathrm{poly}\big(\mathrm{Var}(p)/\deg(p)\big) \text{ for bounded } p'
      refs: [AaronsonAmbainis14]
      note: '**The Aaronson-Ambainis conjecture.** A bounded degree-$d$ real polynomial with variance $\ge\varepsilon$ should have a variable of influence $\ge \mathrm{poly}(\varepsilon/d)$.'
      conf: high
      todo: 'open'
  notes: |
    Consequence if true: $\mathrm{R}(f) = \mathrm{poly}(\mathrm{Q}(f))$ for all
    **total** $f$ -- and more generally, every bounded-error quantum query
    algorithm on a product distribution can be simulated classically with
    polynomially many queries. This is the main structural conjecture behind
    "quantum speedups need structure".
  see_also: [MaxInf, adeg, Q, R, Inf1, open-aaronson-ambainis]

- from: Inf1
  to: deg
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{I}^{1}(p) = O(\deg(p)^2) \text{ for bounded } p:\{-1,1\}^n\to[-1,1]'
      form: {exp: 2, kind: const}
      refs: [FHKL16]
      note: 'Improves the $O(d^3)$ of [BackursBavarian14]. For *homogeneous* $p$ the bound is $O(d\log d)$.'
      conf: high
  lower:
    - stmt: '\exists \text{ bounded } p:\ \mathrm{I}^{1}(p) = \Omega(\deg(p)\log\deg(p))'
      form: {exp: 1, log: 1, kind: const}
      refs: [FHKL16]
      note: 'Matching the homogeneous upper bound; the truth for general bounded $p$ is between $d\log d$ and $d^2$.'
      conf: medium
  notes: |
    Why this is a *query* statement: if a quantum algorithm makes $T$ queries
    then its acceptance probability is a bounded polynomial of degree $\le 2T$,
    so $L_1$-influence bounds for bounded polynomials transfer directly to
    quantum query algorithms.
  see_also: [Inf1, deg, Q, adeg]

- from: NS
  to: Inf
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{NS}_\delta(f) \le \delta\,\mathrm{I}(f)'
      refs: [ODonnell14]
      note: 'Union bound over which coordinate flip first changes $f$.'
      conf: high
  see_also: [NS, Inf, Stab]

- from: NS
  to: D
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{NS}_\delta(f) = O(\delta\,\mathrm{D}(f))'
      refs: [ODonnell14, OSSS05]
      note: 'Shallow decision trees are noise-stable. Equivalently, $\mathrm{NS}_{1/\mathrm{D}(f)}(f)=O(1)$.'
      conf: high
  notes: |
    The quantitative form of this -- **Fourier growth** of decision trees,
    $\sum_{|S|=k}|\hat f(S)| \le O(\sqrt{\mathrm{D}})^{k}$-type bounds -- is
    the engine behind the near-optimal quantum-vs-randomized separations
    [Tal20, BansalSinha21, SSW21].
  see_also: [NS, D, Stab, Tal20, kForrelation]

- from: L1
  to: D_size
  setting: total
  status: settled
  upper:
    - stmt: '\hat L_1(f) \le \mathrm{DTsize}(f)'
      form: {exp: 1, kind: exact}
      refs: [ODonnell14]
      note: |
        Write $f$ as a sum over the leaves of an optimal tree,
        $f = \sum_{\ell} f(\ell)\,\mathbb{1}_{C_\ell}$, one term per leaf subcube.
        A subcube indicator of codimension $d$ factors as
        $\prod_{i \in S}\tfrac{1 \pm x_i}{2}$ over its $d$ fixed coordinates, so its
        spectral norm is $1$; the triangle inequality adds them up. With
        $|f(\ell)| = 1$ this is $\hat L_1(f) \le \#\{\text{leaves}\}$.
      conf: high
  lower:
    - stmt: '\hat L_1(\mathrm{ADDR}_k) = 2^k = \tfrac12\,\mathrm{DTsize}(\mathrm{ADDR}_k)'
      form: {exp: 1, kind: const}
      witness: ADDR
      note: 'Every certificate of $\mathrm{ADDR}_k$ has size $k+1$, so every leaf sits at depth $\ge k+1$ and the tree has $2^{k+1}$ of them; the spectral norm is $2^k$. A factor $2$ from the bound, and the only slack in it.'
      conf: high
  notes: |
    The leaf argument proves *this*, and the familiar
    $\hat L_1 \le 2^{\mathrm{D}}$ is its corollary via
    $\mathrm{DTsize} \le 2^{\mathrm{D}}$ -- worth keeping the order straight,
    because size is the quantity the proof actually counts and a wide shallow
    tree makes the difference enormous: [[OMB]] has
    $\hat L_1 = \Theta(n) = \Theta(\mathrm{DTsize})$ but $2^{\mathrm{D}} = 2^n$.
  see_also: [L1, D_size, D, spar, ADDR, OMB]

- from: L1
  to: D
  setting: total
  status: settled
  upper:
    - stmt: '\hat L_1(f) \le 2^{\mathrm{D}(f)}'
      form: {kind: exp}
      refs: [ODonnell14]
      note: 'Write $f$ as a sum over the $\le \mathrm{DTsize}(f)$ leaves; each subcube indicator has spectral norm $1$. Since $\mathrm{DTsize} \le 2^{\mathrm{D}}$, this also gives $\hat L_1 \le 2^{\mathrm{D}}$ -- see the [[L1]] vs [[D_size]] record, which is the primitive form.'
      conf: high
  lower:
    - stmt: '\hat L_1(\mathrm{ADDR}_k) = 2^k = 2^{\mathrm{D}(\mathrm{ADDR}_k)-1}'
      form: {kind: exp}
      witness: ADDR
      note: 'Write $\mathrm{ADDR}_k = \sum_a \mathbb{1}[\mathrm{addr} = a]\cdot y_a$. Each term has spectral norm $1$, and the $2^k$ terms have disjoint Fourier supports (they differ in which $y$-variable appears), so the norms add. With $\mathrm{D} = k+1$ this is a factor $2$ from the bound -- the same factor $2$ as in the [[D_size]] record, since $\mathrm{DTsize}(\mathrm{ADDR}_k) = 2^{\mathrm{D}}$ exactly.'
      conf: high
  see_also: [L1, D, D_size, PDT, spar, ADDR]

- from: PDT
  to: spar
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{D}^{\oplus}(f) = O\big(\sqrt{\mathrm{spar}(f)}\,\log \mathrm{spar}(f)\big)'
      form: {exp: 0.5, log: 1, kind: const}
      refs: [TsangWongXieZhang13]
      conf: high
    - stmt: '\text{(conjectured) } \mathrm{D}^{\oplus}(f) = \mathrm{polylog}(\mathrm{spar}(f))'
      refs: [TsangWongXieZhang13]
      note: 'The **query analogue of the log-rank conjecture**: composing it with an inner gadget and lifting gives log-rank for XOR functions.'
      conf: high
      todo: 'open'
  lower:
    - stmt: '\mathrm{spar}(f) \le 4^{\mathrm{D}^{\oplus}(f)},\ \text{i.e. } \mathrm{D}^{\oplus}(f)\ge \tfrac12\log_2\mathrm{spar}(f)'
      form: {kind: log}
      refs: [TsangWongXieZhang13]
      conf: high
  notes: |
    Known unconditionally for special classes: $\mathrm{D}^{\oplus}(f) =
    \mathrm{polylog}(\mathrm{spar}(f))$ when $f$ has small $\mathbb{F}_2$-degree,
    or when $f$ is a "sparse" symmetric function [Sanyal19].
  see_also: [PDT, spar, L1, Fdim, open-log-rank]

- from: deg
  to: spar
  setting: total
  status: fails
  lower:
    - stmt: '\deg(\oplus_n) = n,\quad \mathrm{spar}(\oplus_n) = 1'
      form: {kind: unbounded}
      witness: PARITY
      note: |
        A single character $\chi_{[n]}$ has full real degree and Fourier sparsity $1$, so
        sparsity constrains the real degree not at all. The true theorem is the
        $\mathbb{F}_2$-degree one recorded below; conflating $\deg$ with $\deg_2$ here is
        an easy mistake, since for most familiar functions the two happen to agree.
      conf: high
  see_also: [deg, deg2, spar, Fdim]

- from: deg2
  to: PDT
  setting: total
  status: gap
  upper:
    - stmt: '\deg_2(f) \le \mathrm{D}^{\oplus}(f) \le \mathrm{D}(f)'
      form: {exp: 1, kind: exact}
      refs: [BdW02]
      note: |
        Read a parity decision tree as an $\mathbb{F}_2$-polynomial: each leaf
        contributes the product of its $d$ query answers, each of which is an
        affine form $\bigoplus_{i\in S}x_i \oplus c$ of $\mathbb{F}_2$-degree one.
        Ordinary queries are the singleton case, so the same argument bounds
        $\deg_2$ by $\mathrm{D}$.
      conf: high
  lower:
    - stmt: '\deg_2(\mathrm{AND}_n) = \mathrm{D}^{\oplus}(\mathrm{AND}_n) = n'
      form: {exp: 1, kind: exact}
      witness: AND
      note: 'The $\mathbb{F}_2$-polynomial of $\mathrm{AND}_n$ is $x_1\cdots x_n$, and parity queries do not help on it.'
      conf: high
  notes: |
    Recorded for the same reason as $\mathrm{C}^0 \le \mathrm{C}$: everything else
    on file for $\deg_2$ is either a separation or a $\log$-shaped bound against
    $\mathrm{spar}$, so without this line the $\deg_2$ row carries no exponent at
    all. Which power of $\mathrm{D}^{\oplus}$ or $\mathrm{D}$ is *needed* is a
    different and harder question -- see the measure's own todo -- but the trivial
    direction is not in doubt.
  see_also: [deg2, PDT, D, deg]

- from: deg2
  to: deg
  setting: total
  status: settled
  upper:
    - stmt: '\deg_2(f) \le \deg(f)'
      form: {exp: 1, kind: exact}
      refs: [BdW02]
      note: |
        The real multilinear representation of a Boolean function has integer
        coefficients; reducing them mod $2$ gives *the* $\mathbb{F}_2$-multilinear
        representation, which can only lose monomials.
      conf: high
  lower:
    - stmt: '\deg_2(\mathrm{AND}_n) = \deg(\mathrm{AND}_n) = n'
      form: {exp: 1, kind: exact}
      witness: AND
      conf: high
  notes: |
    Tight above and unbounded below: $\deg_2(\oplus_n) = 1$ while $\deg(\oplus_n) = n$,
    which is why the $\deg$-vs-$\deg_2$ cell is empty in the other direction.
  see_also: [deg2, deg, PDT, spar]

- from: deg2
  to: spar
  setting: total
  status: settled
  upper:
    - stmt: '\deg_2(f) \le \log_2\big(\mathrm{spar}(f)+1\big)'
      form: {kind: log}
      putative: true
      note: |
        Restrict to a set $S$ with $|S| = d = \deg_2(f)$ carrying a top $\mathbb{F}_2$-monomial.
        The restriction $g$ (as a $0/1$-valued function on $d$ bits) still contains
        $\prod_{i\in S} x_i$, so $\sum_x g(x)$ is odd. For the $\pm1$ encoding
        $h = 1-2g$ and any $T\ne\emptyset$,
        $\hat h(T) = -2^{1-d}\sum_x g(x)\chi_T(x)$, and $\sum_x g(x)\chi_T(x) \equiv \sum_x g(x)
        \pmod 2$ is odd, hence nonzero. So all $2^d-1$ non-empty coefficients survive, and
        restriction never increases sparsity. The $+1$ is not slack: $\oplus_n$ has
        $\deg_2 = 1$ and $\mathrm{spar} = 1$, so the bound is attained.
      conf: high
  lower:
    - stmt: '\deg_2(\mathrm{OR}_n) = n = \log_2 \mathrm{spar}(\mathrm{OR}_n)'
      form: {kind: log}
      witness: OR
      note: 'Attained again at the other end: $\mathrm{spar}(\mathrm{OR}_n) = 2^n$ and the $\mathbb{F}_2$-polynomial of $\mathrm{OR}_n$ contains $x_1\cdots x_n$.'
      conf: high
  see_also: [deg2, spar, PDT, Fdim]

- from: degp
  to: spar
  setting: total
  status: fails
  lower:
    - stmt: '\deg_p(\oplus_n) = n \ \text{ for every odd prime } p, \quad \mathrm{spar}(\oplus_n) = 1'
      form: {kind: unbounded}
      witness: PARITY
      note: |
        Fourier sparsity is a statement about the *real* representation and says nothing
        about representations over $\mathbb{F}_p$. Parity is the extreme case in both
        directions at once: a single Fourier coefficient, but over $\mathbb{F}_p$ with
        $p$ odd it needs full degree, $\tfrac12\big(1 - \prod_i (1-2x_i)\big)$ being the
        only representation. Over $\mathbb{F}_2$ the two collapse to $\deg_2 = 1$,
        which is why the value string for [[PARITY]] has to split on $p$.
      conf: high
  see_also: [degp, spar, deg, PARITY]

- from: osss
  to: R0
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{osss}(f) \;=\; \frac{\mathrm{Var}(f)}{\mathrm{MaxInf}(f)} \;\le\; \bar{\mathrm{R}}_0(f) \;=\; \mathrm{R}_0(f)'
      form: {exp: 1, kind: const}
      refs: [OSSS05]
      note: |
        This is the **OSSS inequality** and the reason [[osss]] is in the zoo at all. For any
        decision tree $T$ computing $f$, writing $\delta_i(T) = \Pr_x[T\text{ reads }x_i]$,
        $$\mathrm{Var}(f)\ \le\ \sum_i \delta_i(T)\,\mathrm{Inf}_i(f)\ \le\ \mathrm{MaxInf}(f)\sum_i\delta_i(T)
          = \mathrm{MaxInf}(f)\cdot\mathbb{E}_x[\#\text{queries of }T\text{ on }x].$$
        So $\mathrm{osss}(f)$ is a lower bound on the *expected* number of queries, not merely
        on the depth. A zero-error randomized algorithm is a distribution over such trees, and
        averaging the inequality over that distribution leaves it intact, so the bound is
        against $\bar{\mathrm{R}}_0 = \mathrm{R}_0$ and hence against $\mathrm{D}$ by closure.
        The averaging step is not in [OSSS05], which states the deterministic case.
      conf: high
  lower:
    - stmt: '\mathrm{osss}(\mathrm{SCORPION}_m) = \Theta(m) = \Theta(\mathrm{R}_0)'
      form: {exp: 1, kind: const}
      witness: SCORPION
      note: |
        $\mathrm{Var} = \Theta(m^3 2^{-3m})$ against $\mathrm{MaxInf} = 12(m-2)^2 2^{6-3m}$
        gives $\mathrm{osss} = \Theta(m)$, and $\mathrm{R}_0(\mathrm{SCORPION}) = \Theta(m)$:
        the bound is attained, constants aside. [[TRIBES]] attains it to within the
        $\log$ that KKL forces on any function.
      conf: high
  see_also: [osss, MaxInf, Var, R0, D, normalization]

- from: nsr
  to: s
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{nsr}(f) \;\le\; 4\,\mathrm{s}(f)'
      form: {exp: 1, kind: const}
      putative: true
      refs: [ODonnell14]
      note: |
        Two textbook steps. First $\mathrm{NS}_\delta(f)\le\delta\,\mathrm{I}(f)$ (a union
        bound over which coordinate is pivotal), so the threshold
        $\mathrm{NS}_{\delta}\ge\mathrm{Var}/4$ defining $\delta^{*}$ cannot be reached before
        $\delta = \mathrm{Var}/(4\mathrm{I})$, giving
        $\mathrm{nsr}\le 4\,\mathrm{I}(f)/\mathrm{Var}(f)$. Second, count sensitive edges: with
        $p = \Pr[f=1]\le\tfrac12$ (else complement, which changes neither side),
        $\mathrm{I}(f) = 2|\partial S|/2^n \le 2\,\mathrm{s}(f)\,p$ because every $x\in S=f^{-1}(1)$
        has at most $\mathrm{s}(f)$ sensitive edges, while $\mathrm{Var}(f) = 4p(1-p)\ge 2p$.
        Hence $\mathrm{I}\le\mathrm{s}\cdot\mathrm{Var}$ and the $\mathrm{Var}$ cancels.
        By closure this also gives $\mathrm{nsr} = O(\mathrm{D})$; the constant $4$ is an
        artefact of the $\mathrm{Var}/4$ threshold convention in [[nsr]].
      conf: high
  lower:
    - stmt: '\mathrm{nsr}(\mathrm{SCORPION}_m) = \Theta(m) = \Theta(\mathrm{s})'
      form: {exp: 1, kind: const}
      witness: SCORPION
      note: |
        $\mathrm{NS}_\delta = (2+o(1))\,P\,(1-(1-\delta)^{3m-6})$ with
        $P = m(m-1)(m-2)2^{6-3m}$ and $\mathrm{Var} = (4+o(1))P$, so the threshold
        $\mathrm{Var}/4$ is crossed at $\delta^{*} = \Theta(1/m)$, against
        $\mathrm{s} = 3m-6$. A sensitive-everywhere function is as noise-robust as its
        sensitivity allows.
      conf: high
  see_also: [nsr, NS, Var, Inf, s, D, normalization]

- from: osss
  to: spar
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{osss}(f) \;\le\; \mathrm{spar}(f)'
      form: {exp: 1, kind: const}
      putative: true
      note: |
        Pigeonhole on the spectrum. The non-empty Fourier coefficients of $f$ number at most
        $\mathrm{spar}(f)$ and carry total weight $\mathrm{Var}(f)$, so some $S\ne\emptyset$ has
        $\hat f(S)^2 \ge \mathrm{Var}(f)/\mathrm{spar}(f)$; any $i\in S$ then has
        $\mathrm{Inf}_i(f) = \sum_{T\ni i}\hat f(T)^2 \ge \hat f(S)^2$, giving
        $\mathrm{MaxInf}\ge\mathrm{Var}/\mathrm{spar}$. Very lossy: the best separation on record
        is no separation at all, since every sparse function in the zoo also has
        $\mathrm{osss} = O(1)$. A much stronger bound should follow from
        $\mathrm{osss}\le\mathrm{D}$ together with the $\mathrm{D}$ versus $\mathrm{spar}$
        literature, which the zoo does not yet record as a relation.
      conf: high
  lower:
    - stmt: '\mathrm{osss}(\oplus_n) = 1 = \mathrm{spar}(\oplus_n)'
      form: {kind: const}
      witness: PARITY
      note: |
        A single character has sparsity $1$ and $\mathrm{osss} = 1$: the two agree, but neither
        grows, so this witnesses no exponent. No function in the zoo has $\mathrm{osss}$ growing
        while $\mathrm{spar}$ stays bounded -- indeed $\mathrm{spar}(f) = O(1)$ forces $f$ to be a
        constant-size combination of characters, and $\mathrm{osss}$ is then bounded too.
      conf: medium
  see_also: [osss, spar, MaxInf, Var, D]
