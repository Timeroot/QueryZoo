# =====================================================================
# RELATIONS, part 2: polynomial degree (deg, deg-tilde, rdeg, ...).
# Schema documented in 01-classical-core.yaml.
# =====================================================================

relations:

# ---------------------------------------------------- deg vs s (Huang)
- from: deg
  to: s
  setting: total
  status: settled
  upper:
    - stmt: '\deg(f) \le \mathrm{s}(f)^2'
      form: {exp: 2, kind: exact}
      refs: [Huang19]
      note: 'Huang''s sensitivity theorem, via a signed adjacency matrix of the hypercube and Cauchy interlacing. Equivalent form: every induced subgraph of $Q_n$ on $>2^{n-1}$ vertices has max degree $\ge\sqrt n$.'
      conf: high
    - stmt: '\deg(f) \le \lambda(f)^2 \le \mathrm{s}(f)^2'
      refs: [ABKRT21]
      note: 'Theorem 1 of [ABKRT21] -- the spectral strengthening, since $\lambda(f)\le\mathrm{s}(f)$ always.'
      conf: high
  lower:
    - stmt: '\deg(f_n) = \mathrm{s}(f_n)^2'
      form: {exp: 2, kind: exact}
      witness: ANDOR
      note: '$\wedge_k\circ\vee_k$: $\deg = k^2$, $\mathrm{s}=k$. Optimal, so this cell is closed.'
      conf: high
  notes: |
    For **monotone** $f$ the inequality reverses and improves:
    $\mathrm{s}(f)\le\deg(f)$ [BdW02, Prop. 4], and $\mathrm{C}=\mathrm{s}=\mathrm{bs}$
    [Nisan91].
  see_also: [s, lambda, deg, Huang19, sensitivity-conjecture]

# ---------------------------------------------- deg vs lambda (Huang, sharp)
- from: deg
  to: lambda
  setting: total
  status: settled
  upper:
    - stmt: '\deg(f) \le \lambda(f)^2'
      form: {exp: 2, kind: exact}
      refs: [ABKRT21, Huang19]
      note: 'Huang''s theorem in its sharpest form. What the Cauchy-interlacing argument actually produces is a bound on the *spectral* sensitivity, and $\lambda(f)\le\mathrm{s}(f)$ is a separate, easy step; recording the strong form here rather than only under [[s]] lets the closure route every consequence of Huang through $\lambda$.'
      conf: high
  lower:
    - stmt: '\deg(\wedge_n) = n = \lambda(\wedge_n)^2'
      form: {exp: 2, kind: exact}
      witness: AND
      note: 'The sensitivity graph of $\wedge_n$ is the star $K_{1,n}$ centred at $1^n$, so $\lambda=\sqrt n$, against $\deg = n$. The exponent $2$ is therefore optimal and this cell is closed.'
      conf: high
  notes: |
    Everything Huang's theorem implies factors through this one inequality:
    $\deg \le \lambda^2$ composed with $\lambda \le \mathrm{s} \le \mathrm{bs}
    \le \mathrm{C}$ recovers $\deg\le\mathrm{s}^2$ and the resolution of the
    sensitivity conjecture. Note the analogous statement for [[rdeg]] is
    **false** -- see the `lambda` vs `rdeg` record below.
  see_also: [lambda, deg, s, Huang19, ABKRT21, sensitivity-conjecture]

# --------------------------------------------------- bs vs deg
- from: bs
  to: deg
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{bs}(f) \le 2\deg(f)^2'
      form: {exp: 2, kind: const}
      refs: [NS94, BdW02]
      note: 'Theorem 4 of [BdW02]; proved by symmetrising to a univariate polynomial and applying Ehlich-Zeller / Rivlin-Cheney.'
      conf: high
  lower:
    - stmt: '\mathrm{bs}(f_n) = \Omega\big(\deg(f_n)^{\log 6/\log 3}\big) = \Omega(\deg(f_n)^{1.6309})'
      form: {exp: 1.6309, kind: const}
      witness: Kushilevitz
      refs: [NisanWigderson95]
      note: 'Iterating Kushilevitz'' $6$-variable function ($\mathrm{D}=\mathrm{s}=6$, $\deg=3$) $k$ times gives $\mathrm{bs}=6^k$, $\deg=3^k$. Reported in [NisanWigderson95]; the same family gives the $1.63$ entries in the $\mathrm{s}$, $\mathrm{bs}$ and $\mathrm{RC}$ rows of the $\deg$ column.'
      conf: high
  see_also: [bs, deg, NS94]

- from: bs
  to: adeg
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{bs}(f) \le 6\,\widetilde{\deg}(f)^2'
      form: {exp: 2, kind: const}
      refs: [NS94, BdW02]
      note: 'Theorem 7 of [BdW02] -- the bounded-error analogue, same symmetrisation proof.'
      conf: high
  lower:
    - stmt: '\mathrm{bs}(\mathrm{OR}_n) = n = \Theta(\widetilde{\deg}(\mathrm{OR}_n)^2)'
      form: {exp: 2, kind: const}
      witness: OR
      note: '$\widetilde{\deg}(\mathrm{OR}_n)=\Theta(\sqrt n)$ [NS94], so the constant-$6$ bound is tight up to the constant.'
      conf: high
  see_also: [bs, adeg, OR]

# --------------------------------------------- deg vs approximate deg
- from: deg
  to: adeg
  setting: total
  status: settled
  upper:
    - stmt: '\deg(f) = O(\widetilde{\deg}(f)^2)'
      form: {exp: 2, kind: const}
      refs: [ABKRT21]
      note: 'Theorem 4 of [ABKRT21]. Resolves a conjecture; the proof goes through $\deg\le\lambda^2$ and a bound on $\lambda$ by $\widetilde{\deg}$.'
      conf: high
  lower:
    - stmt: '\deg(\mathrm{OR}_n) = n = \Theta(\widetilde{\deg}(\mathrm{OR}_n)^2)'
      form: {exp: 2, kind: const}
      witness: OR
      refs: [NS94]
      note: 'Optimal, witnessed by OR/AND: $\widetilde{\deg}(\mathrm{OR}_n) = \Theta(\sqrt n)$.'
      conf: high
  notes: |
    Before [ABKRT21] the best bound was $\deg = O(\widetilde{\deg}^4)$ via
    $\deg \le \mathrm{D}$ and $\mathrm{D} = O(\widetilde{\deg}^6)$; the quadratic
    bound was a well-known conjecture.
  see_also: [deg, adeg, Q, OR]

- from: D
  to: adeg
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{D}(f) = O(\widetilde{\deg}(f)^4)'
      form: {exp: 4, kind: const}
      refs: [ABKRT21, Midrijanis04, NS94]
      note: '$\mathrm{D}\le\mathrm{bs}\cdot\deg$ [Midrijanis04], $\mathrm{bs}\le 6\widetilde{\deg}^2$ [NS94], $\deg = O(\widetilde{\deg}^2)$ [ABKRT21].'
      conf: high
    - stmt: '\mathrm{D}(f) = O(\widetilde{\deg}(f)^6)'
      form: {exp: 6, kind: const}
      refs: [BBCMdW01, BdW02]
      note: 'The historical bound (Theorem 13 of [BdW02]), improving Nisan-Szegedy''s $O(\widetilde{\deg}^8)$.'
      conf: high
      superseded_by: 'ABKRT21'
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega(\widetilde{\deg}(f_n)^4)'
      form: {exp: 4, kind: tilde}
      witness: pointer
      refs: [ABBLSS17]
      conf: high
  see_also: [D, adeg, Q, pointer]

- from: D
  to: deg
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{D}(f) \le \mathrm{bs}(f)\cdot\deg(f) \le 2\deg(f)^3'
      form: {exp: 3, kind: const}
      refs: [Midrijanis04, NS94]
      conf: high
    - stmt: '\mathrm{D}(f) \le \deg(f)^2\,\mathrm{bs}(f) \le 2\deg(f)^4'
      form: {exp: 4, kind: const}
      refs: [NisanSmolensky, BdW02]
      note: 'Theorem 12 of [BdW02] -- the maxonomial argument; superseded by Midrijanis but still the cleanest proof.'
      conf: high
      superseded_by: 'Midrijanis04'
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega(\deg(f_n)^2)'
      form: {exp: 2, kind: tilde}
      refs: [GPW18]
      witness: GPWfn
      conf: high
  notes: |
    **Open**: is $\mathrm{D}(f) = O(\deg(f)^2)$? This is one of the oldest
    open questions in the area. A positive answer would also give
    $\mathrm{D} = O(\widetilde{\deg}^4)$ by a second route.
  see_also: [D, deg, open-D-vs-deg]

# ----------------------------------------------------- adeg vs R
- from: adeg
  to: R
  setting: total
  status: settled
  lower:
    - stmt: '\widetilde{\deg}(\mathrm{PARITY}_n) = \mathrm{R}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      refs: [NS94, BBCMdW01]
      note: 'Both sides are exactly $n$: parity needs all $n$ queries even at error $1/3$, and no polynomial of degree $<n$ approximates it. Theorem 15 of [BdW02] loses nothing here.'
      conf: high
  notes: |
    The bound itself, $\widetilde{\deg}\le\mathrm{R}$, is recorded one setting up --
    the polynomial method never uses totality -- and inherited here; this record
    keeps the total-function witness, which makes it tight.
    The same proof gives $\widetilde{\deg}_\varepsilon(f)\le\mathrm{R}_\varepsilon(f)$
    for every error $\varepsilon$, and $\deg(f)\le \mathrm{D}(f)$ in the exact case.
    The *reverse* direction is where everything is hard: see [[R]] vs
    [[adeg]] (quartic separation, [ABBLSS17]).
  see_also: [adeg, R, D, deg]

- from: R
  to: adeg
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{R}(f) = O(\widetilde{\deg}(f)^4)'
      form: {exp: 4, kind: const}
      refs: [ABKRT21]
      note: 'Inherited from $\mathrm{D} = O(\widetilde{\deg}^4)$.'
      conf: high
  lower:
    - stmt: '\mathrm{R}(f_n) = \widetilde\Omega(\widetilde{\deg}(f_n)^4)'
      form: {exp: 4, kind: tilde}
      witness: pointer
      refs: [ABBLSS17]
      note: 'The quartic $\mathrm{R}$-vs-$\widetilde{\deg}$ separation -- quadratically better than anything known before [ABBLSS17].'
      conf: high
  see_also: [R, adeg, pointer]

# ------------------------------------------------------- rdeg
#
# Fortnow's question -- is every measure polynomially bounded by rational
# degree? -- was answered in the affirmative in 2026 [KKWY26], thirty-two
# years after Nisan and Szegedy wrote it down. The three records below are
# the whole of the new column: everything else in it is closure through
# D <= 16 rdeg^4. Before them the column read "a, ?" in every cell.
- from: D
  to: rdeg
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{D}(f) \le 4\,\deg_{\pm}(f)^2\,\mathrm{rdeg}(f)^2 \le 16\,\mathrm{rdeg}(f)^4'
      form: {exp: 4, kind: exact}
      refs: [KKWY26]
      note: |
        Theorem 4, and the resolution of Fortnow's question. The proof turns on
        *minimum* block sensitivity $\min_x \mathrm{bs}_x(f)$ -- a quantity nobody
        had found a use for -- via $\min_x \mathrm{bs}_x(f)\le 2\deg_{\pm}(f)^2$
        (Lemma 2). That bounds the size of a hitting set for one of the two
        nondeterministic representations $p$ of $f$ and $q$ of $\bar f$ whose
        degrees define $\mathrm{rdeg} = \max(\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f))$;
        querying that hitting set kills a maximal monomial, so after
        $\mathrm{rdeg}$ rounds one of the two representations is exhausted and the
        function is constant. The second inequality is $\deg_{\pm}\le 2\,\mathrm{rdeg}$.
      conf: high
    - stmt: '\mathrm{D}(f) = O\big(\mathrm{rdeg}(f)\deg_{\pm}(f)^2\log n\big) = O(\mathrm{rdeg}(f)^3\log n)'
      form: {exp: 4, kind: const}
      refs: [KKWY26]
      note: |
        Theorem 8, which is sharper in $\mathrm{rdeg}$ but pays a $\log n$ in the
        *arity*, not in $\mathrm{rdeg}$ -- and that log cannot be absorbed, because
        $\mathrm{rdeg}(f) = \Omega(\log n)$ (Theorem 9) is tight, on
        [[ADDR]]. So as a pure exponent it still reads $4$, and the clean
        $16\,\mathrm{rdeg}^4$ above is what the closure uses. Theorem 8 does give
        $\mathrm{D} = \widetilde O(\mathrm{rdeg}^3)$ for every family of arity
        $2^{\mathrm{polylog}(\mathrm{rdeg})}$ or less. The authors note it will be
        hard to do much better: $\mathrm{D} = O(\deg^3)$ [Midrijanis04] is still the
        best bound by ordinary degree.
      conf: high
  lower:
    - stmt: '\mathrm{D}(f_n) = \Omega(\mathrm{rdeg}(f_n)^2)'
      form: {exp: 2, kind: const}
      witness: ANDEH
      refs: [IJKKKSWW23]
      note: 'On $\wedge_n\circ\overline{\mathrm{EH}}_n$: $\mathrm{rdeg}=\Theta(n)$ and $\mathrm{D}=\Theta(n^2)$, the full input length.'
      conf: high
  notes: |
    The surviving question is the exponent, not the relation: somewhere in
    $[2,4]$, exactly as for $\mathrm{D}$ vs $\deg$ -- see [[open-rdeg]].
  see_also: [D, rdeg, ndeg, sdeg, ANDEH, open-rdeg]

- from: deg
  to: rdeg
  setting: total
  status: gap
  upper:
    - stmt: '\deg(f) = O\big(\mathrm{rdeg}(f)\deg_{\pm}(f)^2\log \mathrm{rdeg}(f)\big) = \widetilde O(\mathrm{rdeg}(f)^3)'
      form: {exp: 3, kind: tilde}
      refs: [KKWY26]
      note: |
        Corollary 4, and the headline statement of [KKWY26]. Here the $\log n$ of
        Theorem 8 *does* become a $\log\mathrm{rdeg}$: apply Theorem 8 not to $f$
        but to $f$ restricted to a maximal monomial of its polynomial, which has
        only $\deg(f)$ variables and no larger $\mathrm{rdeg}$ or $\deg_{\pm}$.
        The same restriction trick works for $\mathrm{s}$ and fails for
        $\mathrm{D}$, which is why $\mathrm{D}$ vs $\mathrm{rdeg}$ is stuck at $4$
        -- it would need $\mathrm{D}$ to condense onto $\mathrm{poly}(\mathrm{D})$
        variables.
      conf: high
  lower:
    - stmt: '\deg(f_n) = \Omega(\mathrm{rdeg}(f_n)^2)'
      form: {exp: 2, kind: const}
      witness: ANDEH
      refs: [IJKKKSWW23]
      note: '$\mathrm{rdeg}=\Theta(n)$ against $\deg=\Theta(n^2)$.'
      conf: high
  notes: |
    Fortnow's question in its original form, and the cell the 2026 proof was
    aimed at: is $\mathrm{rdeg}(f) = \deg(f)^{\Omega(1)}$? Yes, with
    $\mathrm{rdeg} = \widetilde\Omega(\deg^{1/3})$. The exponent is now known to
    lie in $[2,3]$.
  see_also: [deg, rdeg, sdeg, ANDEH, open-rdeg]

- from: s
  to: rdeg
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{s}(f) = O\big(\mathrm{rdeg}(f)\deg_{\pm}(f)^2\log \mathrm{rdeg}(f)\big) = \widetilde O(\mathrm{rdeg}(f)^3)'
      form: {exp: 3, kind: tilde}
      refs: [KKWY26]
      note: 'Corollary 4 again, restricting to a maximum-sensitivity block instead of a maximal monomial. Sharper than the $\mathrm{s}\le\mathrm{D}\le16\,\mathrm{rdeg}^4$ that closure would give.'
      conf: high
  lower:
    - stmt: '\mathrm{s}(f_n) = \Omega(\mathrm{rdeg}(f_n)^2)'
      form: {exp: 2, kind: const}
      witness: ANDEH
      refs: [IJKKKSWW23]
      conf: high
  see_also: [s, rdeg, ANDEH, open-rdeg]

- from: sdeg
  to: rdeg
  setting: partial
  status: settled
  upper:
    - stmt: '\deg_{\pm}(f) \le 2\,\mathrm{rdeg}(f)'
      form: {exp: 1, kind: exact}
      refs: [KKWY26, IJKKKSWW23]
      note: |
        Fact 2. If $p/q = f$ on the domain then $(q-2p)q$ is a sign representation:
        it equals $-q^2 < 0$ where $f = 1$ and $q^2 > 0$ where $f = 0$. The factor
        $2$ is not removable -- $\deg_{\pm}(\oplus_n) = n$ while
        $\mathrm{rdeg}(\oplus_n) = n/2$. Only the identity $p/q = f$ *on the domain*
        is used, so the bound holds on promises as well, and is recorded here for
        the partial setting so that the total one inherits it.
      conf: high
  lower:
    - stmt: '\deg_{\pm}(\oplus_n) = n = 2\,\mathrm{rdeg}(\oplus_n)'
      form: {exp: 1, kind: const}
      witness: PARITY
      refs: [KKWY26]
      note: 'The factor of $2$ in the upper bound is attained, so the cell is settled at exponent $1$ and the constant is settled too.'
      conf: high
  notes: |
    Nothing travels the other way: majority has a degree-$1$ sign representation,
    while $\mathrm{D} = n$ together with
    $\mathrm{D} = O(\mathrm{rdeg}\deg_{\pm}^2\log n)$ forces
    $\mathrm{rdeg}(\mathrm{MAJ}_n) = \Omega(n/\log n)$ -- Remark 2 of [KKWY26],
    where majority is what shows Theorem 8 tight up to the log.

    Sign degree is the one measure the new bound treats as a *second* parameter
    rather than a corollary: $\mathrm{D} \le 4\deg_{\pm}^2\mathrm{rdeg}^2$ and
    $\deg = \widetilde O(\deg_{\pm}^2\mathrm{rdeg})$ are both stronger than their
    pure-$\mathrm{rdeg}$ consequences, and $\deg_{\pm}$ is not polynomially
    related to $\deg$ at all (majority again). See also Corollary 5 of [KKWY26],
    which replaces $\mathrm{rdeg}$ by $\mathbb{F}_2$-degree in the same slot: two
    measures that are each incomparable to $\deg$ multiply to bound it, the way
    $\deg \le \mathrm{C}^0\mathrm{C}^1$ does.
  see_also: [sdeg, rdeg, PARITY, MAJ, deg]

- from: adeg
  to: rdeg
  setting: total
  status: gap
  upper: []
  lower:
    - stmt: '\widetilde{\deg}(f_n) = \Omega(\mathrm{rdeg}(f_n)^{3/2})'
      form: {exp: 1.5, kind: const}
      witness: ANDEH
      refs: [IJKKKSWW23]
      note: 'Proposition 29: on $N=n^2$ input bits, $\wedge_n\circ\overline{\mathrm{EH}}_n$ has $\mathrm{rdeg}=\Theta(n)$ while $\widetilde{\deg}=\Theta(n^{3/2})$ (approximate-degree composition: $\Theta(\sqrt n)$ for the outer AND times $\Theta(n)$ for exact-half).'
      conf: medium
  notes: |
    No bound is recorded here directly; the cell is filled by closure through
    $\widetilde{\deg}\le\deg = \widetilde O(\mathrm{rdeg}^3)$ [KKWY26]. This is
    the cell with the *best* known separation from $\mathrm{rdeg}$, so it is
    also the one where the surviving exponent gap is narrowest from below.
    Known in the other direction: $\mathrm{rdeg}(f)\le\widetilde{\deg}(f)$ and
    $\mathrm{rdeg}(f)\le\deg(f)$; also $\mathrm{rdeg}(f) = \Theta(\widetilde{\deg}(f))$
    for symmetric $f$.
  see_also: [rdeg, ardeg, ANDEH, open-rdeg]

- from: lambda
  to: rdeg
  setting: total
  status: open
  lower:
    - stmt: '\lambda(f_n) = \Theta(n^{3/2}) \text{ while } \mathrm{rdeg}(f_n)=\Theta(n)'
      form: {exp: 1.5, kind: const}
      witness: ANDEH
      refs: [IJKKKSWW23]
      note: 'In particular $\lambda(f)\le \mathrm{rdeg}(f)$ is **false**, answering a natural question negatively.'
      conf: high
  see_also: [lambda, rdeg, ANDEH]

# ------------------------------------------------ deg vs QE, adeg vs Q
- from: deg
  to: QE
  setting: partial
  status: settled
  upper:
    - stmt: '\deg(f) \le 2\,\mathrm{Q}_E(f)'
      form: {exp: 1, kind: const}
      refs: [BBCMdW01, BdW02]
      note: |
        Theorem 17 of [BdW02] -- the exact-case polynomial method. The acceptance amplitude of a
        $T$-query algorithm is a degree-$\le T$ polynomial in the input bits, so the acceptance
        probability has degree $\le 2T$ and represents $f$ on every input the algorithm is
        required to be right about. Nothing asks for that set to be all of $\{0,1\}^n$.
      conf: high
  see_also: [deg, QE, PARITY, open-QE-vs-deg]

- from: deg
  to: QE
  setting: total
  status: settled
  lower:
    - stmt: '\deg(\mathrm{PARITY}_n) = n = 2\,\mathrm{Q}_E(\mathrm{PARITY}_n)'
      form: {exp: 1, kind: const}
      witness: PARITY
      conf: high
  notes: |
    **Open problem 4 of [BdW02]**: is $\mathrm{Q}_E(f) = O(\deg(f))$? No $f$ is
    known with $\mathrm{Q}_E(f) > \deg(f)$.
  see_also: [deg, QE, PARITY, open-QE-vs-deg]

- from: adeg
  to: Q
  setting: total
  status: settled
  lower:
    - stmt: '\widetilde{\deg}(\mathrm{PARITY}_n) = n = 2\,\mathrm{Q}(\mathrm{PARITY}_n)'
      form: {exp: 1, kind: const}
      witness: PARITY
      conf: high
  notes: |
    The easy direction $\widetilde{\deg}\le 2\mathrm{Q}$ is the polynomial method, so it
    is recorded for **partial** $f$ and inherited here; $\mathrm{PARITY}$ shows it is
    tight already for total $f$.

    **Open problem 4 of [BdW02]**: is $\mathrm{Q}(f)=O(\widetilde{\deg}(f))$ for
    total $f$? Known false for **partial** functions -- exponentially so
    [AmbainisBelovs23] -- and false even for **total search problems**
    [BenDavidKundu24search]. For total Boolean functions the best known is
    $\mathrm{Q} = O(\widetilde{\deg}^4)$, with a quartic separation from cheat
    sheets [ABK16], so this cell is *settled at exponent 4*.
  see_also: [adeg, Q, cjdeg, AmbainisBelovsFn, BDKrelation]

- from: Q
  to: adeg
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{Q}(f) = O(\widetilde{\deg}(f)^4)'
      form: {exp: 4, kind: const}
      refs: [ABKRT21]
      conf: high
  lower:
    - stmt: '\mathrm{Q}(f_n) = \widetilde\Omega(\widetilde{\deg}(f_n)^4)'
      form: {exp: 4, kind: tilde}
      refs: [ABK16]
      witness: cheatsheet
      conf: high
  see_also: [Q, adeg, cheatsheet]

