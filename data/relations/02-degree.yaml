# --------------------------------------------------- absolute bounds
- from: Q
  to: D
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{Q}(f) \le \mathrm{R}(f) \le \mathrm{R}_0(f) \le \mathrm{D}(f) \le n'
      form: {exp: 1, kind: exact}
      note: 'The trivial chain: each step is a model inclusion, so none of it cares whether $f$ is total, partial or a relation.'
      conf: high
    - stmt: '\mathrm{Q}(f) \le n/2 + O(\sqrt n)'
      refs: [vanDam98]
      note: |
        Quantum oracle interrogation: *every* $n$-bit function, even the hardest, costs only
        about half the classical worst case. The algorithm recovers the entire input $x$ with
        high probability and never looks at what is to be computed from it, so it solves
        partial functions and relations just as well.
      conf: high
  see_also: [Q, R, D]

- from: Q
  to: D
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{Q}(\mathrm{PARITY}_n) = \lceil n/2\rceil'
      form: {exp: 1, kind: const}
      witness: PARITY
      refs: [BBCMdW01]
      conf: high
    - stmt: '\text{almost all } f:\ \widetilde{\deg}(f) \ge n/2 - O(\sqrt{n\log n}),\ \text{so } \mathrm{Q}(f)\ge n/4-o(n)'
      refs: [Ambainis99deg, BdW02]
      conf: high
  see_also: [Q, D, PARITY]

# ------------------------------------------------------ deg~ vs RC / QC
- from: adeg
  to: RC
  setting: total
  status: gap
  upper:
    - stmt: '\widetilde{\deg}(f) = \Omega\big(\sqrt{\mathrm{RC}(f)}\big),\ \text{ i.e. } \mathrm{RC}(f) = O\big(\widetilde{\deg}(f)^2\big)'
      form: {exp: 2, kind: const, dir: reverse}
      refs: [KulkarniTal16]
      note: 'Solves a question of Aaronson. Since $\mathrm{QC}(f)=\Theta(\sqrt{\mathrm{RC}(f)})$ [Aaronson08], this says $\widetilde{\deg}(f)=\Omega(\mathrm{QC}(f))$: approximate degree is *always* at least as good a quantum lower bound as quantum certificate complexity.'
      conf: high
    - stmt: '\mathrm{fbs}(f) = O\big(\widetilde{\deg}(f)^2\big)'
      refs: [KulkarniTal16]
      note: 'Same statement, since $\mathrm{fbs}=\Theta(\mathrm{RC})$.'
      conf: high
  lower:
    - stmt: '\widetilde{\deg}(f_n) = \tilde\Omega\big(\mathrm{RC}(f_n)^{?}\big)'
      refs: [BunThaler17]
      note: 'The $\widetilde{\deg}$-vs-$\mathrm{RC}$ cell of the matrix records exponent $2$; see the matrix for the witness.'
      conf: medium
  notes: |
    Consequence for **transitive** functions on $n$ variables (all tight):
    $\mathrm{RC}(f)=\Omega(\sqrt n)$, $\mathrm{QC}(f)=\Omega(n^{1/4})$ and
    $\widetilde{\deg}(f)=\Omega(n^{1/4})$ [KulkarniTal16].
  see_also: [adeg, RC, QC, fbs, Aaronson08]
