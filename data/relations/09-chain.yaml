# =====================================================================
# RELATIONS, part 9: the elementary chain.
#
# The textbook pointwise inequalities
#
#   s <= bs <= C <= D,   Q <= R <= R0 <= D,   adeg <= deg <= D,
#   Q <= Q0 <= QE <= D,  rdeg <= adeg,        C <= R0 <= C^2
#
# each as its own record. They carry no surprises, but they are the edges
# the transitive closure walks, so leaving them implicit inside somebody
# else's `stmt` chain made the derived bounds much weaker than the data
# actually supports. Each is tight at exponent 1, witnessed by PARITY or OR.
#
# Schema: see 01-classical-core.yaml.
# =====================================================================

relations:

- from: s
  to: bs
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{s}(f) \le \mathrm{bs}(f)'
      form: {exp: 1, kind: exact}
      refs: [Nisan91, BdW02]
      note: |
        Sensitivity is block sensitivity restricted to singleton blocks. Both maxima range over
        $x \in \mathrm{Dom}(f)$ and count only blocks $B$ with $x^B \in \mathrm{Dom}(f)$, so the
        inclusion is the same one line for line in the partial setting.
      conf: high
  see_also: [s, bs, sensitivity-conjecture]

- from: s
  to: bs
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{s}(\mathrm{OR}_n) = \mathrm{bs}(\mathrm{OR}_n) = n'
      form: {exp: 1, kind: exact}
      witness: OR
      conf: high
  see_also: [s, bs, sensitivity-conjecture]

- from: bs
  to: C
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{bs}(f) \le \mathrm{C}(f)'
      form: {exp: 1, kind: exact}
      refs: [Nisan91, BdW02]
      note: |
        A certificate for $x$ must intersect every sensitive block of $x$, and the blocks are
        disjoint. Partial functions change nothing: a sensitive block already has to satisfy
        $x^B \in \mathrm{Dom}(f)$, and a certificate has to fix the value on every *domain*
        input consistent with it, so a block disjoint from the certificate could not have been
        sensitive.
      conf: high
  see_also: [bs, C, fbs]

- from: bs
  to: C
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{bs}(\mathrm{OR}_n) = \mathrm{C}(\mathrm{OR}_n) = n'
      form: {exp: 1, kind: exact}
      witness: OR
      conf: high
  see_also: [bs, C, fbs]

- from: C
  to: D
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{C}(f) \le \mathrm{D}(f)'
      form: {exp: 1, kind: exact}
      refs: [BdW02]
      note: |
        The queries a deterministic algorithm makes on $x$ are a certificate for $x$: they
        already fix the leaf, hence fix an output that is valid for every domain input
        consistent with them. Nothing here needs $f$ to be total or single-valued, so the
        bound is a statement about relations.
      conf: high
  see_also: [C, D]

- from: C
  to: D
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{C}(\mathrm{PARITY}_n) = \mathrm{D}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  see_also: [C, D]

- from: C
  to: R0
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{C}(f) \le \mathrm{R}_0(f)'
      form: {exp: 1, kind: exact}
      refs: [GJKKLSSV17, BdW02]
      note: |
        Fix any accepting run of a zero-error algorithm on $x$. The bits it queried certify
        the output it produced, since the algorithm is never wrong on any consistent input.
        The argument reads only the transcript, so it holds for relations too.
      conf: high
  see_also: [C, R0]

- from: C
  to: R0
  setting: total
  status: gap
  lower:
    - stmt: '\mathrm{C}(\mathrm{PARITY}_n) = \mathrm{R}_0(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  see_also: [C, R0]

- from: R0
  to: C
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{R}_0(f) \le \mathrm{C}(f)^2'
      form: {exp: 2, kind: exact}
      refs: [GJKKLSSV17]
      note: 'Via $\mathrm{D}\le\mathrm{C}^{(0)}\mathrm{C}^{(1)}$.'
      conf: high
  lower:
    - stmt: '\mathrm{R}_0(f_n) = \widetilde\Omega\big(\mathrm{C}(f_n)^{?}\big)'
      todo: 'Best known R0 vs C separation -- is the quadratic bound tight?'
      conf: low
  see_also: [R0, C, D]

- from: R
  to: R0
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{R}_{1/3}(f) \le \tfrac32\,\mathrm{R}_0(f)'
      form: {exp: 1, kind: const}
      refs: [BdW02]
      note: |
        A zero-error algorithm is in particular a bounded-error one — a model inclusion, so it
        holds whatever the algorithm is asked to output. But mind the cost convention: since
        $\mathrm{R}_0$ is *expected* cost (worst-case cost at zero error is just $\mathrm{D}$),
        the conversion is Markov, not free. Truncate after $\tfrac32\mathrm{R}_0$ queries and
        output a uniform bit: the truncation fires with probability $\le 2/3$ and is then wrong
        half the time, so the error is $\le 1/3$. See [[cost-conventions]]; the clean
        $\mathrm{R} \le \mathrm{R}_0$ holds only for $\bar{\mathrm{R}}$.
      conf: high
  see_also: [R, R0]

- from: R
  to: R0
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{R}(\mathrm{PARITY}_n) = \mathrm{R}_0(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  see_also: [R, R0]

- from: R
  to: D
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{R}(f) \le \mathrm{R}_0(f) \le \mathrm{D}(f)'
      form: {exp: 1, kind: exact}
      refs: [BdW02]
      note: 'Two model inclusions, neither of which looks at what is being computed.'
      conf: high
  see_also: [R, D, R0]

- from: R
  to: D
  setting: total
  status: gap
  lower:
    - stmt: '\mathrm{R}(\mathrm{PARITY}_n) = \mathrm{D}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  notes: |
    The interesting direction is the reverse one, $\mathrm{D}$ in terms of
    $\mathrm{R}$, where the exponent is between 2 and 3.
  see_also: [R, D, R0]

- from: Q
  to: R
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{Q}(f) \le \mathrm{R}(f)'
      form: {exp: 1, kind: exact}
      refs: [BdW02]
      note: 'A randomized algorithm is a (very restricted) quantum one. The simulation uses no structure of the domain, so it is a fact about relations.'
      conf: high
  see_also: [Q, R, D]

- from: Q
  to: R
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{Q}(\mathrm{PARITY}_n) = \lceil n/2\rceil = \tfrac12\,\mathrm{R}(\mathrm{PARITY}_n)'
      form: {exp: 1, kind: const}
      witness: PARITY
      refs: [BBCMdW01]
      conf: high
  see_also: [Q, R, D]

- from: Q
  to: Q0
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{Q}(f) \le \mathrm{Q}_0(f)'
      form: {exp: 1, kind: exact}
      refs: [BdW02]
      note: |
        Definitional, and so setting-agnostic — but unlike the classical $\mathrm{R}$ versus
        $\mathrm{R}_0$ case there is no Markov loss, because $\mathrm{Q}_0$ is worst-case cost
        with an "inconclusive" outcome of probability $\le 1/2$. Replace $\bot$ by a uniform
        random bit and the error is $\le 1/4$.
      conf: high
  see_also: [Q, Q0, QE]

- from: Q
  to: Q0
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{Q}(\mathrm{PARITY}_n) = \mathrm{Q}_0(\mathrm{PARITY}_n) = \lceil n/2\rceil'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  see_also: [Q, Q0, QE]

- from: QE
  to: D
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{Q}_E(f) \le \mathrm{D}(f)'
      form: {exp: 1, kind: exact}
      refs: [BdW02]
      note: 'A deterministic decision tree is an exact quantum algorithm that never uses superposition.'
      conf: high
  see_also: [QE, D, Q0]

- from: QE
  to: D
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{Q}_E(\mathrm{OR}_n) = n = \mathrm{D}(\mathrm{OR}_n)'
      form: {exp: 1, kind: exact}
      witness: OR
      refs: [BBCMdW01]
      note: 'Exact quantum algorithms need $n$ queries for $\mathrm{OR}$.'
      conf: high
  see_also: [QE, D, Q0]

- from: deg
  to: D
  setting: partial
  status: settled
  upper:
    - stmt: '\deg(f) \le \mathrm{D}(f)'
      form: {exp: 1, kind: exact}
      refs: [NS94, BdW02]
      note: |
        Sum the indicator polynomials of the accepting leaves of a depth-$\mathrm{D}$ tree. The
        resulting polynomial is defined on the whole cube and agrees with the tree everywhere,
        so in particular it represents $f$ on $\mathrm{Dom}(f)$ -- which is all $\deg$ of a
        partial function asks for. (Off the domain the polynomial is free, which is exactly why
        $\deg$ can be much smaller than $\mathrm{D}$ for promise problems.)
      conf: high
  see_also: [deg, D, adeg]

- from: deg
  to: D
  setting: total
  status: settled
  lower:
    - stmt: '\deg(\mathrm{PARITY}_n) = \mathrm{D}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  see_also: [deg, D, adeg]

- from: adeg
  to: deg
  setting: partial
  status: fails
  upper:
    - stmt: 'No bound: $\widetilde{\deg}(f)$ is not bounded by any function of $\deg(f)$ for partial $f$.'
      form: {kind: none}
      conf: high
  lower:
    - stmt: '\deg(\mathrm{SEARCH}^{\le 1}_n) = 1 \text{ while } \widetilde{\deg}(\mathrm{SEARCH}^{\le 1}_n) = \Theta(\sqrt n)'
      form: {kind: unbounded}
      witness: UniqueSearch
      refs: [BBCMdW01]
      conf: high
  notes: |
    The usual one-line argument -- "a representing polynomial is in particular an approximating
    one" -- **breaks on a promise**, and the failure is not cosmetic. For partial $f$, [[deg]] asks
    only that $p$ agree with $f$ on $\mathrm{Dom}(f)$ and lets $p$ be arbitrary elsewhere, whereas
    [[adeg]] additionally demands $|p(x)| \le 1+\varepsilon$ at *every* $x \in \{0,1\}^n$ -- the
    condition that makes $\widetilde{\deg}$ a quantum lower bound in the first place. On
    [[UniqueSearch]] ($|x| \le 1$; is $|x| = 1$?) the polynomial $\sum_i x_i$ represents $f$ exactly
    on the domain, so $\deg = 1$, but it runs up to $n$ off the promise; a *bounded* approximation
    needs degree $\Theta(\sqrt n)$, matching $\mathrm{Q}$.
  see_also: [adeg, deg, rdeg, UniqueSearch]

- from: adeg
  to: deg
  setting: total
  status: settled
  upper:
    - stmt: '\widetilde{\deg}(f) \le \deg(f)'
      form: {exp: 1, kind: exact}
      refs: [NS94, BdW02]
      note: |
        For total $f$ the unique multilinear representation takes values in $\{0,1\}$ on the whole
        cube, so it is automatically bounded and is in particular a legal approximating polynomial.
        Recorded here and not in the partial setting on purpose: see the partial record, where the
        boundedness demanded off the domain makes the inequality fail outright.
      conf: high
  lower:
    - stmt: '\widetilde{\deg}(\mathrm{PARITY}_n) = \deg(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      refs: [BBCMdW01]
      conf: high
  see_also: [adeg, deg, rdeg]

- from: ardeg
  to: adeg
  setting: partial
  status: gap
  upper:
    - stmt: '\mathrm{rdeg}_\varepsilon(f) \le \widetilde{\deg}_\varepsilon(f)'
      form: {exp: 1, kind: exact}
      refs: [IJKKKSWW23, MahadevdeWolf15]
      note: |
        A polynomial is a rational function with denominator $1$, so every feasible solution for
        $\widetilde{\deg}$ is one for $\mathrm{rdeg}_\varepsilon$: a containment of feasible sets.
        Unlike [[adeg]] versus [[deg]], the containment survives a promise -- $\mathrm{rdeg}_\varepsilon$
        imposes *fewer* constraints (nothing at all off $\mathrm{Dom}(f)$), so dropping
        $\widetilde{\deg}$'s off-domain boundedness only helps.
      conf: high
  notes: |
    Careful: this is the *approximate* rational degree. The exact rational degree
    [[rdeg]] is **not** below $\widetilde{\deg}$ -- it is $\mathrm{rdeg}=\max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}$,
    and $\widetilde{\deg}=\Omega(\mathrm{rdeg}^{3/2})$ is a theorem, not a triviality.
  see_also: [ardeg, adeg, rdeg, PostQ]

- from: ardeg
  to: adeg
  setting: total
  status: gap
  lower:
    - stmt: '\mathrm{rdeg}_\varepsilon(f_n) = \Omega\big(\widetilde{\deg}_\varepsilon(f_n)^{?}\big)'
      todo: 'Best known separation of approximate rational degree from approximate degree.'
      conf: low
  see_also: [ardeg, adeg, rdeg, PostQ]

- from: ardeg
  to: rdeg
  setting: partial
  status: gap
  upper:
    - stmt: '\mathrm{rdeg}_\varepsilon(f) \le \mathrm{rdeg}(f)'
      form: {exp: 1, kind: exact}
      refs: [IJKKKSWW23]
      note: |
        Exact rational representation is in particular an $\varepsilon$-approximation. Again a
        containment of feasible sets at the domain points, so it does not care about totality.
      conf: high
  see_also: [ardeg, rdeg, PostQ]

- from: rdeg
  to: C
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{rdeg}(f) \le \mathrm{C}(f)'
      form: {exp: 1, kind: exact}
      refs: [IJKKKSWW23]
      note: |
        Via $\mathrm{rdeg}(f)=\max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}$ and
        $\mathrm{ndeg}\le\mathrm{C}$. The latter is the sum of the indicators of the minimal
        $1$-certificates: it is positive on every $1$-input and vanishes on every $0$-input
        *of the domain*, because a domain $0$-input consistent with a $1$-certificate would
        contradict that certificate. Off-domain inputs are unconstrained, so the argument runs
        unchanged for partial $f$.
      conf: medium
  see_also: [rdeg, C, ndeg, PARITY]

- from: rdeg
  to: C
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{rdeg}(\mathrm{PARITY}_n) = \mathrm{C}(\mathrm{PARITY}_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      refs: [IJKKKSWW23]
      note: '$\mathrm{ndeg}(\oplus_n) = n$, so $\mathrm{rdeg}(\oplus_n) = n$; and every input of $\oplus_n$ needs the whole assignment as a certificate, so $\mathrm{C} = n$ too.'
      conf: high
  see_also: [rdeg, C, ndeg, PARITY]
