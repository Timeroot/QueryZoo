- from: cbs
  to: CA
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{cbs}(f) = O(\mathrm{CA}(f))'
      form: {exp: 1, kind: const}
      refs: [ABK21lifting]
      note: 'The classical adversary dominates critical block sensitivity, for partial functions and search problems alike. This is what makes [[CA]] the stronger of the two as a lifting target: [ABK21lifting] lift $\mathrm{CAdv}$ to randomized communication complexity with a *constant*-size gadget, and the resulting lower bound is strictly stronger than the one lifting $\mathrm{cbs}$ gives. The converse fails to be tight -- see the $\mathrm{CA}$ vs $\mathrm{cbs}$ cell above, where $\vee_n$ shows the two can also coincide.'
      conf: high
  see_also: [cbs, CA, bs, settings]

