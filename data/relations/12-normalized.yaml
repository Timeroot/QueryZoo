# =====================================================================
# THE NORMALIZED QUANTITIES: NS, Stab and MaxInf against everything else.
#
# These three are not query-complexity measures at all -- they are
# probabilities and correlations. For every $f$, every $n$ and every setting
# of their own parameter, $\mathrm{NS}_\delta \in [0,\tfrac12]$,
# $\mathrm{Stab}_\rho \in [-1,1]$ and $\mathrm{MaxInf} \in [0,1]$. So a growing
# measure is never $O$ of any power of them, and the honest entry in each of
# these cells is an unbounded separation rather than an exponent.
#
# The engine cannot see this on its own, twice over: `exp` must be positive, so
# there is no way to write "this quantity is $O(1)$", and an `unbounded` verdict
# does not chain through a polynomial lower bound in the closure. So every cell
# is written out.
#
# The witness in each record is chosen to meet the zoo's own standard for an
# unbounded verdict (see the comment in `growth.compare`): the small side must
# settle on a *positive* constant. A family on which the normalized quantity
# tends to zero is not good enough, because it may encode $n$ and then some
# decreasing function of it bounds the large side after all. That rules out
# $\oplus_n$ for $\mathrm{Stab}_\rho$ (it is $\rho^n$) and $\vee_n$ for both
# $\mathrm{NS}_\delta$ and $\mathrm{MaxInf}$ (both $2^{-\Theta(n)}$). The
# families that do qualify, and are used below:
#
#   NS_delta      PARITY  -> 1/2          MAJ -> 1/2 - arcsin(1-2d)/pi
#                 IP      -> 1/2
#   Stab_rho      MAJ     -> (2/pi)arcsin(rho)     OR, AND, MP, SINK -> 1
#                 (anything with vanishing variance has Stab -> 1)
#   MaxInf        PARITY  = 1 exactly
#
# The reverse direction -- NS, Stab or MaxInf as the *large* side -- is not
# blank by oversight but impossible: a quantity bounded by 1 is never
# Omega(X^k) for a growing X, and it is never unbounded in terms of anything
# either, since the constant function bounds it. The six records at the end of
# this file are what is actually true among the three of them.
#
# Schema documented in 01-classical-core.yaml.
# =====================================================================

relations:

- from: D
  to: NS
  setting: total
  status: fails
  lower:
    - stmt: '\mathrm{D}(\oplus_n) = n \to \infty, \qquad \mathrm{NS}_{\delta}(\oplus_n) = \tfrac12\big(1-(1-2\delta)^n\big) \to \tfrac12'
      form: {kind: unbounded}
      witness: PARITY
      conf: high
  see_also: [D, NS, PARITY]

- from: D
  to: Stab
  setting: total
  status: fails
  lower:
    - stmt: '\mathrm{D}(\mathrm{MAJ}_n) = n \to \infty, \qquad \mathrm{Stab}_{\rho}(\mathrm{MAJ}_n) \to \tfrac{2}{\pi}\arcsin\rho > 0'
