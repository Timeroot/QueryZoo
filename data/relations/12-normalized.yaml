# ---------------------------------------------------------------------
# The three of them against each other. `unbounded` is the right verdict every
# time, but for an unusual reason: neither quantity grows -- each is at most 1 --
# and it is the *ratio* that blows up, because the small side goes to zero while
# the large side stays put. So no bound $a = O(b^k)$ exists, for any $k > 0$.
# ---------------------------------------------------------------------

- from: NS
  to: Stab
  setting: total
  status: fails
  lower:
    - stmt: '\mathrm{NS}_{\delta}(\oplus_n) = \tfrac12\big(1-(1-2\delta)^n\big) \to \tfrac12, \qquad \mathrm{Stab}_{\rho}(\oplus_n) = \rho^{\,n} \to 0'
      form: {kind: unbounded}
      witness: PARITY
      refs: [ODonnell14]
      note: 'The ratio blows up not because the numerator grows -- it cannot, $\mathrm{NS}_\delta \le \tfrac12$ always -- but because the denominator collapses. That is the whole content of the cell.'
      conf: high
  notes: |
    No bound $\mathrm{NS}_\delta = O(\mathrm{Stab}_\rho^k)$ exists for any $k$ -- not
    because the two are unrelated, but because they are the *same quantity*,
    reparameterised:
    $$\mathrm{NS}_{\delta}(f) = \tfrac12\big(1 - \mathrm{Stab}_{1-2\delta}(f)\big),
      \qquad \mathrm{Stab}_{\rho}(f) = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}(f),$$
    an exact identity for every Boolean $f$, immediate from
    $\mathrm{Stab}_\rho = \sum_S \rho^{|S|}\hat f(S)^2$ and
    $\mathrm{NS}_\delta = \tfrac12\sum_S(1-(1-2\delta)^{|S|})\hat f(S)^2$.
    The relationship is *affine*, and the matrix records multiplicative ones, so it
    registers as no bound at all. Read the identity, not the cell.
  see_also: [NS, Stab, PARITY]

- from: Stab
  to: NS
  setting: total
  status: fails
  lower:
    - stmt: '\mathrm{Stab}_{\rho}(\vee_n) \to 1, \qquad \mathrm{NS}_{\delta}(\vee_n) = 2^{1-n}\big(1-(1-\delta)^n\big) \to 0'
      form: {kind: unbounded}
      witness: OR
      refs: [ODonnell14]
      note: 'OR is asymptotically constant, so it is perfectly noise *stable* and has vanishing noise *sensitivity* at the same time. The ratio $\mathrm{Stab}/\mathrm{NS}^k$ diverges for every $k$.'
      conf: high
  notes: |
    The same affine identity as in the other direction,
    $\mathrm{Stab}_{\rho} = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$, and the same reason it is
    invisible to a multiplicative matrix: no bound
    $\mathrm{Stab}_\rho = O(\mathrm{NS}_\delta^k)$ holds for any $k$.
  see_also: [Stab, NS, OR]

- from: NS
  to: MaxInf
  setting: total
