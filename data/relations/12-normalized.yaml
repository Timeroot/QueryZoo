  lower:
    - stmt: '\mathrm{NS}_{\delta}(\mathrm{TRIBES}_n) \to \tfrac12, \qquad \mathrm{MaxInf}(\mathrm{TRIBES}_n) = \Theta(\log n / n) \to 0'
      form: {kind: unbounded}
      witness: TRIBES
      refs: [KKL88, ODonnell14]
      note: 'The Kahn--Kalai--Linial extremal case: the smallest maximal influence a balanced monotone function can have, together with maximal noise sensitivity.'
      conf: high
  notes: |
    No bound $\mathrm{NS}_\delta = O(\mathrm{MaxInf}^k)$ exists. This is the
    Kahn--Kalai--Linial regime and the one genuinely interesting cell of the three:
    $\mathrm{TRIBES}_n$ has $\mathrm{MaxInf} = \Theta(\log n / n) \to 0$ -- as small as
    a monotone balanced function can have it -- and is nonetheless *maximally* noise
    sensitive, $\mathrm{NS}_\delta \to \tfrac12$ for every fixed $\delta$. So vanishing
    maximal influence does not buy any noise stability at all. The reverse direction
    does hold, and tightly: see [[MaxInf]] vs [[NS]].
  see_also: [NS, MaxInf, Inf, TRIBES]

