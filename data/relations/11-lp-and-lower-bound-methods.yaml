# =====================================================================
# RELATIONS, part 11: the LP / lower-bound-method column of the zoo.
#
# These are the records that let the rest of the database *infer* values
# for the partition bound, conical junta degree, the conflict measures,
# the composition rate and the one-sided / distributional variants.
# Almost every one of them is a sandwich: the measure is a lower-bound
# technique for R, so it sits between something concrete (fbs, RC, CA,
# RS) and R itself, and is pinned wherever those two agree.
#
# Schema as in 01-classical-core.yaml.
# =====================================================================

relations:

# ---------------------------------------------------------------------
# The partition bound
# ---------------------------------------------------------------------

- from: prt
  to: R
  setting: relation
  status: settled
  headline: 'The partition bound is a relaxation of a randomized decision tree, so it never exceeds $\mathrm{R}$.'
  upper:
    - stmt: '\mathrm{prt}_{\varepsilon}(f) \le 2\,\mathrm{R}_{\varepsilon}(f)'
      form: {exp: 1, kind: const}
      refs: [JainKlauck10]
      note: 'A randomized tree of depth $d$ and error $\varepsilon$ is already a feasible LP solution: put weight $\Pr[\text{leaf }\ell]$ on the subcube of $\ell$ with its label. The total weight is at most $2^{d}$ (the number of leaves) and every subcube is priced at $2^{|A|} \le 2^{d}$, so the LP optimum is at most $2^{2d}$ and its logarithm is at most $2d$. The factor $2$ is not an artefact: a *complete* tree of depth $d$ really does cost $2^d \cdot 2^d$, and by Cauchy--Schwarz $\sum_{\ell} 2^{|A_\ell|} \ge (\#\text{leaves})^2$ for any partition. [JainKlauck10, Thm 3.1] state it as $\mathrm{R}_\varepsilon(f) \ge \tfrac12 \log \mathrm{prt}^{\mathrm{LP}}_\varepsilon(f)$.'
      conf: high
  see_also: [prt, rprt, R, cjdeg]

- from: R
  to: prt
  setting: total
  status: open
  headline: 'Whether the partition bound is tight for randomized query complexity is open; it is at least quadratically loose.'
  lower:
    - stmt: '\exists f \text{ total}:\ \mathrm{R}(f) \ge \mathrm{prt}(f)^{2-o(1)}'
      form: {exp: 2, kind: const}
      refs: [BenDavidKothari18]
      note: 'Theorem 30, via $\mathrm{RS}(f) \ge \mathrm{prt}(f)^{2-o(1)}$ and $\mathrm{RS} \le \mathrm{R}$. So the LP genuinely loses information, and sabotage complexity is not subsumed by it.'
      conf: high
  lower:
    - stmt: '\exists f \text{ total}:\ \mathrm{D}(f) = \tilde\Omega\big(\mathrm{prt}(f)^{2}\big)'
      form: {exp: 2, kind: tilde}
      refs: [AKK16]
      note: 'Via subcube partition complexity, $\mathrm{prt} \le \mathrm{SP}$: [AKK16] give a total $f$ with $\mathrm{D}(f) = \tilde\Omega(\mathrm{SP}(f)^2)$. This is nearly the most that can happen, since $\mathrm{D}(f) = O(\mathrm{prt}_0(f)\,\mathrm{prt}_{1/3}(f))$ [JainKlauck10, Thm 3.7].'
      conf: high
  notes: |
    No upper bound on $\mathrm{R}$ in terms of $\mathrm{prt}$ is known at all --
    not even a polynomial one.  This is the query-complexity shadow of the
    long-standing question of whether the partition bound characterises
    randomized communication complexity.  What *is* known: for **product**
    distributions the partition bound is quadratically tight,
    $\mathrm{D}^{\mu}_{0.49}(f) = O\big((\mathrm{prt}_{1/8}(f)\log \mathrm{prt}_{1/8}(f))^{2}\big)$
    [HarshaJainRadhakrishnan16], and for total $f$ the deterministic complexity
    is polynomially bounded, $\mathrm{D}(f) = O(\mathrm{prt}_{1/3}(f)^3)$
    [JainKlauck10].  So any counterexample must be a partial function, or must
    separate $\mathrm{R}$ from $\mathrm{D}$ at the same time.
  see_also: [prt, R, RS, D_prod, SP]

- from: RC
  to: prt
  setting: partial
  status: settled
  headline: 'The partition bound subsumes randomized certificate complexity.'
  upper:
    - stmt: '\mathrm{RC}_{2\varepsilon/(1-2\varepsilon)}(f) \le \mathrm{prt}_{\varepsilon}(f) + \log(1/\varepsilon)'
      form: {exp: 1, kind: const}
      refs: [JainKlauck10]
      note: '[JainKlauck10, Thm 3.4]: an optimal LP solution *is* a randomized verifier. To verify $x$, sample a subcube $A \ni x$ with probability proportional to $w_{A,f(x)}$ (restricted to the cheap subcubes, $2^{|A|} \le \mathrm{prt}^{\mathrm{LP}}/\varepsilon$) and check the input against it; a $y$ with $f(y) \ne f(x)$ is accepted only through subcubes that are wrong at $y$, whose total weight is $\le 2\varepsilon$. Since $\mathrm{fbs} = \Theta(\mathrm{RC})$, this also gives $\mathrm{fbs} = O(\mathrm{prt})$ and hence $\mathrm{bs} = O(\mathrm{prt})$.'
      conf: high
  see_also: [prt, RC, fbs, bs, CA]

- from: CA
  to: prt
  setting: partial
  status: settled
  upper:
    - stmt: '(1-4\varepsilon)\,\mathrm{CA}(f) \le \mathrm{prt}_{\varepsilon}(f) + \log(1/\varepsilon)'
      form: {exp: 1, kind: const}
      refs: [JainKlauck10, CGLMSG23]
      note: '[JainKlauck10, Thm 3.5]. The classical adversary bound -- equivalently $\mathrm{CG}^{\mathrm{pub}}$ -- is one of the weight schemes the LP optimises over: the distributions $p_x$ are read off the LP solution by sampling a cheap subcube at $x$ and then a fixed variable of it uniformly. If two inputs $x,y$ with $f(x)\ne f(y)$ overlapped too little, the hybrid input $r$ that follows whichever of $x,y$ is heavier coordinatewise would be covered with total weight $>1$, contradicting completeness.'
      conf: high
  see_also: [prt, CA, CGpub]

- from: C
  to: prt
  setting: partial
  status: settled
  headline: 'At zero error the partition bound is at least certificate complexity, because zero error forces every subcube in the LP to be a genuine certificate.'
  upper:
    - stmt: '\mathrm{C}(f) \le \mathrm{prt}_{0}(f)'
      refs: [JainKlauck10]
      note: '[JainKlauck10, Thm 3.2]. At $\varepsilon = 0$ a subcube $A$ carrying weight under label $z$ must be a $z$-certificate: if some $x \in A$ had $f(x) \ne z$ then the correct weight at $x$ already sums to $1$, and adding $w_{A,z}>0$ would break completeness. So every subcube used at $x$ has $|A| \ge \mathrm{C}_x(f)$, and $\mathrm{prt}^{\mathrm{LP}}_0(f) \ge 2^{\mathrm{C}_x(f)}\sum_{A \ni x} w_{A,f(x)} = 2^{\mathrm{C}_x(f)}$. Note this is $\mathrm{C}$, not $\mathrm{D}$ -- the LP does not have to be consistent across inputs.'
      conf: high
  notes: |
    **Deliberately kept out of the transitive closure.**  This bullet carries no
    `form:`, because the zoo indexes $\mathrm{prt}$ at its default error
    $\varepsilon = 1/3$ and the statement above holds only at $\varepsilon = 0$.
    Chaining the two would give $\mathrm{C}(f) \le \mathrm{prt}(f) \le
    2\mathrm{R}(f)$, i.e. $\mathrm{C} = O(\mathrm{R})$, which is false -- $\mathrm{C}$
    and $\mathrm{R}$ are quadratically separated.  The honest bounded-error
    statement is the $\mathrm{RC} \to \mathrm{prt}$ record, and $\mathrm{C}$ is
    *not* below $\mathrm{prt}_{1/3}$.
  see_also: [prt, C, RC, SP]

- from: adeg
  to: prt
  setting: partial
  status: settled
  upper:
    - stmt: '\widetilde{\deg}_{2\varepsilon}(f) \le \mathrm{prt}_{\varepsilon}(f) + \log(1/\varepsilon)'
      form: {exp: 1, kind: const}
      refs: [JainKlauck10]
      conf: high
      note: 'Stated natively for query complexity in [JainKlauck10, Thm 3.6], and the proof is a one-liner worth knowing: throw away every subcube with $2^{|A|} > \mathrm{prt}^{\mathrm{LP}}/\varepsilon$ (they carry total weight $\le \varepsilon$), and let $p(x) = \sum_{A \ni x} w_{A,1}$ be the sum of the surviving $1$-labelled monomials. The completeness constraint gives $p \le 1$ everywhere, correctness gives $p \ge 1-2\varepsilon$ on $f^{-1}(1)$ and $p \le 2\varepsilon$ on $f^{-1}(0)$, and $\deg p \le \log(\mathrm{prt}^{\mathrm{LP}}/\varepsilon)$.'
  see_also: [prt, adeg]

- from: rprt
  to: prt
  setting: relation
  status: settled
  upper:
    - stmt: '\overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{prt}_{\varepsilon}(f)'
      form: {exp: 1, kind: exact}
      refs: [JainKlauck10]
      note: 'Relaxing the completeness constraint from $\sum_{A \ni x,z} w_{A,z} = 1$ to $\le 1$ enlarges the feasible region, so the minimum can only drop. In the zero-communication reading: the prover is allowed to abort with probability up to $\varepsilon$, and may abort more often on some inputs than on others.'
      conf: high
  notes: |
    The relaxation is not cosmetic in the setting it was invented for:
    $\overline{\mathrm{prt}}$ lower-bounds *information* complexity and
    $\mathrm{prt}$ is not known to [KLLRX15].  The compression lemma turns a
    protocol leaking $I$ bits into a zero-communication protocol with non-abort
    probability $\ge 2^{-O(I)}$, and there is no way to make that probability
    come out exactly equal on every input.  In the *query* setting, though,
    nothing seems to be lost -- see the $\mathrm{RC} \to \overline{\mathrm{prt}}$
    record.
  see_also: [rprt, prt]

- from: RC
  to: rprt
  setting: partial
  status: settled
  headline: 'Every lower bound the partition bound subsumes survives the relaxation: the proofs of [JainKlauck10] never use completeness in the direction that is given up.'
  upper:
    - stmt: '\mathrm{RC}_{2\varepsilon/(1-2\varepsilon)}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) + \log(1/\varepsilon)'
      form: {exp: 1, kind: const}
      refs: [JainKlauck10, KLLRX15]
      conf: medium
      note: 'The five containments of [JainKlauck10, Thm 3] -- $\mathrm{C}$ at zero error, $\mathrm{bs}$, $\mathrm{RC}$, $\mathrm{CA}$, $\widetilde{\deg}$ -- all go through verbatim for $\overline{\mathrm{prt}}$. Four of them are primal arguments that use completeness only as $\sum_{A \ni x,z} w_{A,z} \le 1$: to say that the wrong-label weight at $x$ is at most $\varepsilon$ (Thms 3.2, 3.4), to bound the polynomial $p = \sum_A w_{A,1} m_A$ by $1$ from above (Thm 3.6), or to derive a contradiction from a hybrid input covered with weight $>1$ (Thm 3.5). The fifth, block sensitivity (Thm 3.3), is a *dual* argument, and relaxing an equality constraint to $\le$ sign-constrains its dual variable to $\varphi_x \le 0$ -- but the certificate exhibited there already has $\varphi_x = -(1-\varepsilon)\mu_x \le 0$ and $\varphi_{x^{B_i}} = -\mu_{x^{B_i}} \le 0$, with all other $\varphi$ zero, so it stays feasible. Flagged medium and stated as $\mathrm{RC}$ because this is the zoo reading the proofs of [JainKlauck10] against the LP of [KLLRX15, Def. 3.2]; no query-native write-up of $\overline{\mathrm{prt}}$ is known to us.'
  notes: |
    Consequence: on every function in this zoo where $\mathrm{prt}$ is pinned by
    the sandwich $\mathrm{RC} \le \mathrm{prt} \le 2\mathrm{R}$, the same sandwich
    pins $\overline{\mathrm{prt}}$, and the two agree up to constants.  A function
    separating $\overline{\mathrm{prt}}$ from $\mathrm{prt}$ in the query setting
    would be interesting and is not known to us.
  see_also: [rprt, prt, RC, fbs, bs, CA, adeg, C]

- from: adeg
  to: rprt
  setting: partial
  status: settled
  upper:
    - stmt: '\widetilde{\deg}_{2\varepsilon}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) + \log(1/\varepsilon)'
      form: {exp: 1, kind: const}
      refs: [JainKlauck10, KLLRX15]
      conf: medium
      note: 'Same transfer as the $\mathrm{RC} \to \overline{\mathrm{prt}}$ record. The degree proof reads the approximating polynomial straight off the cheap subcubes and needs completeness only as an upper bound of $1$, which the relaxed LP still supplies.'
  see_also: [rprt, adeg, prt]

- from: C
  to: rprt
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{C}(f) \le \overline{\mathrm{prt}}_{0}(f)'
      refs: [JainKlauck10, KLLRX15]
      conf: medium
      note: 'At $\varepsilon = 0$ the argument that every weighted subcube is a genuine certificate only needs $\sum_{A \ni x,z} w_{A,z} \le 1$ against $\sum_{A \ni x} w_{A,f(x)} \ge 1$, so it survives the relaxation. See the $\mathrm{RC} \to \overline{\mathrm{prt}}$ record.'
  notes: |
    As with $\mathrm{C} \to \mathrm{prt}$, this bullet carries no `form:` and is
    kept out of the closure: it is a zero-error statement, and the zoo indexes
    $\overline{\mathrm{prt}}$ at $\varepsilon = 1/3$.
  see_also: [rprt, C, prt]

# ---------------------------------------------------------------------
# Conical junta degree
# ---------------------------------------------------------------------

- from: cjdeg
  to: R
  setting: relation
  status: gap
  headline: 'Conical junta degree is the "nonnegative degree" shadow of a randomized decision tree; it is at most $\mathrm{R}$, and tight up to logs on AND-OR trees.'
  upper:
    - stmt: '\mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)'
      form: {exp: 1, kind: exact}
      refs: [GLMWZ16, GoosJayram16]
      note: 'Expand a depth-$d$ randomized tree over its leaves: $\sum_{\ell \text{ labelled } 1} \Pr[\ell]\cdot C_\ell$ is a nonnegative combination of conjunctions of width $\le d$ that $\varepsilon$-approximates $f$. The content of the measure is entirely in the *lower* bounds.'
      conf: high
  lower:
    - stmt: '\mathrm{cjdeg}(\mathrm{NANDtree}_d) = \tilde\Omega\big(N^{0.753\ldots}\big) = \tilde\Omega(\mathrm{R})'
      form: {exp: 1, log: 1, kind: tilde}
      refs: [GoosJayram16]
      witness: NANDtree
      note: 'The conical junta composition theorem, answering a question of Beame and Lawry. So on the binary AND-OR tree the nonnegative LP already knows the true randomized complexity, up to logarithmic factors.'
      conf: high
  see_also: [cjdeg, R, prt, NANDtree]

- from: adeg
  to: cjdeg
  setting: partial
  status: settled
  upper:
    - stmt: '\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f)'
      form: {exp: 1, kind: exact}
      note: 'Drop the nonnegativity requirement: a conical junta of width $d$ *is* a real polynomial of degree $d$ that $\varepsilon$-approximates $f$.'
      conf: high
  see_also: [cjdeg, adeg, Q]

# ---------------------------------------------------------------------
# The conflict measures: chi <= chibar <= LR <= R, and RS = O(chibar).
# NB: chi and RS are *not* known to be comparable in either direction.
# ---------------------------------------------------------------------

- from: chi
  to: chibar
  setting: partial
  status: settled
  headline: 'Max-conflict complexity is the "adversary chooses last" version of conflict complexity, hence never smaller.'
  upper:
    - stmt: '\chi(g) \le \bar\chi(g)'
      form: {exp: 1, kind: exact}
      refs: [GLSS19]
      note: 'In $\chi$ the hard distribution pair is fixed before the algorithm; in $\bar\chi$ it may be chosen after seeing the algorithm''s behaviour. Swapping the quantifiers can only help the adversary.'
      conf: high
  see_also: [chi, chibar, LR, RS]

- from: chibar
  to: LR
  setting: partial
  status: settled
  upper:
    - stmt: '\bar\chi(g) = O\big(\mathrm{LR}(g)\big)'
      form: {exp: 1, kind: const}
      refs: [BBGM22]
      note: 'Both are "inner measures" for randomized composition, and linearised randomized complexity is the larger -- indeed the largest one for which $\mathrm{R}(f \circ g^n) = \Omega(\mathrm{R}(f)\cdot\,\cdot\,)$ is known.'
      conf: high
  lower:
    - stmt: '\mathrm{LR}(g) \text{ can be polynomially larger than } \bar\chi(g)'
      refs: [BBGM22]
      note: 'No `form:` is recorded because the exponent of the separation is not stated in a closed form. The closure already caps it: $\mathrm{LR} \le \mathrm{R} = O(\bar\chi^2)$, so the gap is at most quadratic.'
      conf: high
  see_also: [chibar, LR, chi, Rstar]

- from: R
  to: LR
  setting: partial
  status: settled
  headline: 'Linearising the cost in the bias costs at most a square: $\mathrm{R} = O(\mathrm{LR}^2)$.'
  upper:
    - stmt: '\mathrm{R}(f) = O\big(\mathrm{LR}(f)^2\big)'
      form: {exp: 2, kind: const}
      refs: [BBGM22]
      note: 'Equivalently $\mathrm{LR}(f) = \Omega(\sqrt{\mathrm{R}(f)})$: charging $1/\gamma$ instead of $1/\gamma^2$ for bias $\gamma$ can shrink the measure by at most a square root. Both ends are attained -- $\mathrm{LR} = \Theta(\mathrm{R})$ whenever $\mathrm{RS} = \Theta(\mathrm{R})$, and $\mathrm{LR} = \Theta(\sqrt{\mathrm{R}})$ for the gapped-majority-style partial functions.'
      conf: high
  see_also: [LR, R, chibar]

- from: R
  to: chibar
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{R}(g) = O\big(\bar\chi(g)^2\big)'
      form: {exp: 2, kind: const}
      refs: [GLSS19]
      note: 'The $\bar\chi = \Omega(\sqrt{\mathrm{R}})$ bound, and it holds even for partial $g$ -- which is what makes $\bar\chi$ usable in composition theorems where $\mathrm{RS}$ is not.'
      conf: high
  see_also: [chibar, R, chi]

- from: R
  to: chi
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{R}(g) = O\big(\chi(g)^2\big)'
      form: {exp: 2, kind: const}
      refs: [Sanyal18]
      conf: high
  see_also: [chi, R]

- from: RS
  to: chibar
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{RS}(g) = O\big(\bar\chi(g)\big)'
      form: {exp: 1, kind: const}
      refs: [GLSS19]
      note: 'Sabotage complexity is the weakest of the four inner measures. Together with $\bar\chi \le \mathrm{LR} \le \mathrm{R}$ this pins all three whenever $\mathrm{RS} = \Theta(\mathrm{R})$, which is the case for every symmetric function.'
      conf: high
  see_also: [RS, chibar, LR, chi]

- from: LR
  to: Rstar
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{LR}(f) = O\big(\mathrm{R}^{*}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [BBGM22]
      note: 'Linearised randomized complexity lower-bounds the asymptotic composition rate. Whether it *equals* it is the open problem posed in that paper.'
      conf: high
  see_also: [LR, Rstar, R]

- from: Rstar
  to: R
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{R}^{*}(f) \le \mathrm{R}(f)'
      form: {exp: 1, kind: exact}
      refs: [BBGM22]
      note: |
        Immediate from $\mathrm{R}(f^{\circ k}) \le \mathrm{R}(f)^k$ (compose the algorithms and pay
        for error reduction only inside the constant). Strictness is exactly the failure of perfect
        composition. The composition upper bound never uses totality -- on an input of the composed
        promise every inner block already lies in $\mathrm{Dom}(f)$ -- so the inequality holds for
        partial $f$ as well.
      conf: high
  see_also: [Rstar, R, LR]

- from: Rstar
  to: R
  setting: total
  status: settled
  headline: 'The composition rate never exceeds $\mathrm{R}$, and equals it whenever $\mathrm{R}$ composes.'
  lower:
    - stmt: '\mathrm{R}^{*}(f) = \mathrm{R}(f)^{1-o(1)} \text{ for read-once formulas}'
      form: {exp: 1, kind: theta}
      witness: NANDtree
      refs: [SaksWigderson86]
      note: 'For a function whose own powers have $\mathrm{R}(f^{\circ k}) = \Theta(c^k)$ the $k$-th root kills the constant and $\mathrm{R}^{*}(f) = c$ exactly. So the composition rate is one of the very few measures in the zoo whose value is a *number*, not a $\Theta$-class.'
      conf: high
  see_also: [Rstar, R, LR, NANDtree]

# ---------------------------------------------------------------------
# One-sided error and distributional variants
# ---------------------------------------------------------------------

- from: R
  to: R1
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{R}(f) \le \mathrm{R}^{1}(f)'
      form: {exp: 1, kind: exact}
      note: 'One-sided error is a special case of two-sided error.'
      conf: high
  see_also: [R, R1, R0]

- from: R1
  to: R0
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{R}^{1}(f) \le \mathrm{R}_{0}(f)'
      form: {exp: 1, kind: exact}
      note: 'A zero-error algorithm is in particular one-sided. In the other direction $\mathrm{R}_0(f) = O\big(\mathrm{R}^{0}(f) + \mathrm{R}^{1}(f)\big)$: run both and stop at whichever becomes certain.'
      conf: high
  see_also: [R1, R0, R]

- from: C1
  to: R1
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{C}^{1}(f) \le \mathrm{R}^{1}(f)'
      form: {exp: 1, kind: exact}
      note: 'An output of $1$ that is never wrong must be justified by a $1$-certificate that the algorithm has actually queried. So the $1$-certificate complexity is a hard floor -- unlike for two-sided error, where $\mathrm{R}$ can be far below $\mathrm{C}$.'
      conf: high
  see_also: [C1, R1, C]

- from: Dmu
  to: R
  setting: relation
  status: settled
  headline: 'Yao: every fixed distribution is at most as hard as the worst case, and the maximum over distributions is exactly $\mathrm{R}$.'
  upper:
    - stmt: '\mathrm{D}^{\mu}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f) \quad\text{for every } \mu'
      form: {exp: 1, kind: exact}
      refs: [Yao77]
      note: 'Fix the random string of the best randomized algorithm to one that does well under $\mu$; averaging says such a string exists. Yao''s minimax principle is the converse: $\max_\mu \mathrm{D}^{\mu}_{\varepsilon} = \mathrm{R}_{\varepsilon}$, so the family of $\mathrm{D}^\mu$ has $\mathrm{R}$ as its upper envelope and its individual members can be anywhere below.'
      conf: high
  see_also: [Dmu, R, D_prod, minimax]

- from: D_prod
  to: R
  setting: relation
  status: settled
  upper:
    - stmt: '\mathrm{D}^{\mathrm{prod}}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)'
      form: {exp: 1, kind: exact}
      refs: [Yao77]
      note: 'A restriction of the maximum in Yao''s principle to product distributions.'
      conf: high
  see_also: [D_prod, Dmu, R, RS]

- from: D_prod
  to: RS
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{D}^{\mathrm{prod}}(g) = \tilde O\big(\mathrm{RS}(g)\big)'
      form: {exp: 1, log: 1, kind: tilde}
      refs: [Sanyal24]
      note: 'Product distributions cannot certify more hardness than sabotage complexity, up to logs; this is what upgrades the Ben-David-Kothari composition theorem to $\mathrm{R}(f \circ g^n) = \tilde\Omega(\mathrm{R}(f)\,\mathrm{D}^{\mathrm{prod}}(g))$.'
      conf: high
  see_also: [D_prod, RS, R]

# ---------------------------------------------------------------------
# Mod-p degree
# ---------------------------------------------------------------------

- from: degp
  to: deg
  setting: partial
  status: gap
  headline: 'Reducing the integer multilinear expansion mod $p$ shows $\deg_p \le \deg$ -- and the gap can be as large as $n$ versus $1$.'
  upper:
    - stmt: '\deg_p(f) \le \deg(f)'
      form: {exp: 1, kind: exact}
      note: 'For Boolean $f$ the unique real multilinear representation has *integer* coefficients (they are the Mobius / inclusion-exclusion coefficients $\sum_{S\subseteq T}(-1)^{|T|-|S|}f(S)$). Reducing them mod $p$ gives a multilinear polynomial over $\mathbb{F}_p$ that still agrees with $f$ on $\{0,1\}^n$, of no larger degree.'
      conf: high
  lower:
    - stmt: '\deg(\mathrm{PARITY}_n) = n \text{ while } \deg_2(\mathrm{PARITY}_n) = 1'
      form: {kind: unbounded, dir: reverse}
      witness: PARITY
      note: 'The extreme case: mod $2$, parity is the linear form $\sum_i x_i$. Read the other way, no bound on $\deg$ in terms of $\deg_2$ exists.'
      conf: high
  see_also: [degp, deg2, deg, PARITY]

# ---------------------------------------------------------------------
# Certificate games, private coin
#
# Scope warning.  [CGLMSG23] *defines* CG for possibly-partial functions,
# but the quantitative sandwich below is collected in their Figure 1 as
# "known relations among complexity measures for total functions", and the
# two arguments one can check by hand are total-function arguments: the
# certificate-product bound CG <= C^0 C^1 needs a 0-certificate and a
# 1-certificate to conflict, which requires the stitched-together input to
# be in the domain, and R_0 = O(CG) travels through the same machinery.
# Both fail loudly on promise problems -- [[GluedTrees]] has C = Theta(1)
# and R_0 = 2^{Omega(n)} -- so every cell in this block is recorded at
# `setting: total`.  The separations still reach the partial matrix, since
# lower bounds inherit total -> partial.
# ---------------------------------------------------------------------

- from: CGpub
  to: CG
  setting: partial
  status: gap
  upper:
    - stmt: '\mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{CG}(f)'
      form: {exp: 1, kind: exact}
      refs: [CGLMSG23]
      note: 'Public randomness is at least as useful as private randomness.'
      conf: high
  see_also: [CG, CGpub, CA]

- from: CG
  to: CGpub
  setting: partial
  status: fails
  headline: 'On promise problems the private-coin game is unboundedly harder than the public-coin one.'
  upper:
    - stmt: '\mathrm{CG}(f) \text{ is known to be unbounded in terms of } \mathrm{CG}^{\mathrm{pub}}(f).'
      form: {kind: none}
      conf: high
  lower:
    - stmt: '\mathrm{CG}(\mathrm{DJ}_N) = \Theta(N) \text{ while } \mathrm{CG}^{\mathrm{pub}}(\mathrm{DJ}_N) = \Theta(1)'
      form: {kind: unbounded}
      witness: DeutschJozsa
      putative: true
      note: |
        Deutsch--Jozsa is the cleanest witness.  **Public coin:** both players output
        one shared uniformly random index; a constant input and a balanced input differ
        on $N/2$ of the $N$ positions, so this wins with probability $1/2$ and
        $\mathrm{CG}^{\mathrm{pub}} \le 2$.  **Private coin:** pin Alice at $x = 0^N$,
        where she has a single output distribution $p$ over $[N]$.  Let $S$ be the
        $N/2$ indices on which $p$ is smallest, so $\max_{i \in S} p_i \le 2/N$, and let
        Bob hold the balanced $y = \mathbf{1}_S$.  Whatever distribution Bob plays, the
        win probability $\sum_{i \in S} p_i q_i$ is at most $\max_{i \in S} p_i \le 2/N$.
        Hence $\mathrm{CG} \ge N/2$, and the matching strategy (both players uniform)
        gives $\mathrm{CG} \le 2N$.
      conf: high
  notes: |
    Shared randomness is exactly what lets the two players agree on *where to look*,
    and on a promise problem there is nothing else forcing them to agree: the
    certificate-conflict argument that pins $\mathrm{CG}$ near $\mathrm{CG}^{\mathrm{pub}}$
    for total $f$ needs the stitched-together input to be in the domain.  For total $f$
    the question is open -- no total family is known on which $\mathrm{CG}$ exceeds
    $\mathrm{CG}^{\mathrm{pub}}$ by more than a square, and $\oplus$ realises that square.
  see_also: [CG, CGpub, CGstar, CGns, CA, DeutschJozsa]

- from: CGpub
  to: CA
  setting: partial
  status: settled
  headline: 'The public-coin certificate game *is* the classical adversary bound, up to a constant.'
  upper:
    - stmt: '\mathrm{CG}^{\mathrm{pub}}(f) = \Theta\big(\mathrm{CA}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [CGLMSG23]
      note: 'This identification is the point of [CGLMSG23] -- it is what the subtitle *and Consequences for the Classical Adversary Bound* refers to. The public-coin game''s optimum is an LP, and its dual is exactly the weight scheme that Aaronson''s classical adversary method optimises over: a shared random string lets the two players sample from a common distribution over $(x,y)$ pairs, which is what a weight scheme is. The argument is LP duality over whatever the domain happens to be, so unlike the private-coin sandwich it survives a promise.'
      conf: high
  lower:
    - stmt: '\mathrm{CG}^{\mathrm{pub}}(\vee_n) = \Theta(n) = \Theta(\mathrm{CA}(\vee_n))'
      form: {exp: 1, kind: exact}
      witness: OR
      refs: [CGLMSG23]
      note: 'The two measures agree everywhere, so any family witnesses the exponent; [[OR]] is the cheapest to check, with $\mathrm{fbs} = n$ pinning both.'
      conf: high
  see_also: [CGpub, CA, CG, CGstar, CGns, fbs]

- from: CA
  to: CGpub
  setting: partial
  status: settled
  headline: 'The other direction of the same identity.'
  upper:
    - stmt: '\mathrm{CA}(f) = \Theta\big(\mathrm{CG}^{\mathrm{pub}}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [CGLMSG23]
      note: 'See the $\mathrm{CG}^{\mathrm{pub}} \to \mathrm{CA}$ cell. Recording both directions makes the equality visible in the matrix rather than only in the closure.'
      conf: high
  lower:
    - stmt: '\mathrm{CA}(\vee_n) = \Theta(n) = \Theta(\mathrm{CG}^{\mathrm{pub}}(\vee_n))'
      form: {exp: 1, kind: exact}
      witness: OR
      refs: [CGLMSG23]
      conf: high
  see_also: [CA, CGpub, fbs, RC]

- from: CA
  to: fbs
  setting: total
  status: settled
  headline: 'For total functions the classical adversary bound collapses to fractional block sensitivity.'
  upper:
    - stmt: '\mathrm{CA}(f) = \Theta\big(\mathrm{fbs}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [ABIKPS17, Aaronson08]
      note: 'All of the classical adversary variants -- weighted, unweighted, minimax -- coincide with $\mathrm{fbs}$ up to constants on total functions [ABIKPS17]. Combined with $\mathrm{fbs} = \Theta(\mathrm{RC})$ [Aaronson08] this is why $\mathrm{CA}$ never beats $\sqrt{\mathrm{R}}$-type bounds: it is a purely combinatorial quantity in disguise. The **total** hypothesis is not decorative -- the same paper shows the variants come apart on partial functions.'
      conf: high
  lower:
    - stmt: '\mathrm{CA}(\vee_n) = \Theta(n) = \Theta(\mathrm{fbs}(\vee_n))'
      form: {exp: 1, kind: exact}
      witness: OR
      refs: [ABIKPS17]
      conf: high
  see_also: [CA, fbs, RC, CGpub, cbs]

- from: fbs
  to: CA
  setting: total
  status: settled
  headline: 'The other direction of the collapse.'
  upper:
    - stmt: '\mathrm{fbs}(f) = \Theta\big(\mathrm{CA}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [ABIKPS17, Aaronson08]
      note: 'See the $\mathrm{CA} \to \mathrm{fbs}$ cell. Chaining this with $\mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{CA})$ gives the working rule used throughout the function entries: for total $f$, $\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$.'
      conf: high
  lower:
    - stmt: '\mathrm{fbs}(\vee_n) = n = \Theta(\mathrm{CA}(\vee_n))'
      form: {exp: 1, kind: exact}
      witness: OR
      refs: [ABIKPS17]
      conf: high
  see_also: [fbs, CA, CGpub, RC]

- from: R0
  to: CG
  setting: total
  status: settled
  headline: 'Zero-error randomized complexity is *below* the private-coin certificate game, not above it.'
  upper:
    - stmt: '\mathrm{R}_0(f) = O\big(\mathrm{CG}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [CGLMSG23, GJKKLSSV17]
      note: 'The direction here is worth pausing on, because the obvious guess is backwards. The private-coin game is *harder* than $\mathrm{R}_0$: it is the one variant of the four that escapes the collapse to $\mathrm{CA}$, and it is not below $\mathrm{D}$ -- $\mathrm{CG}$ can exceed the number of variables. The public-coin argument that does give $\mathrm{CG}^{\mathrm{pub}} = O(\mathrm{R})$ -- both players run one algorithm on a *shared* random string and guess the step at which their transcripts diverge -- has no private-coin analogue, since with independent coins the two executions no longer track each other. The stated bound is implicit in the expectational-certificate machinery of [GJKKLSSV17] and is recorded as such in [CGLMSG23, Thm 5.10].'
      conf: high
  lower:
    - stmt: '\mathrm{R}_0(\vee_n) = n = \Theta(\mathrm{CG}(\vee_n))'
      form: {exp: 1, kind: exact}
      witness: OR
      refs: [CGLMSG23]
      note: 'OR is the tight case: $\mathrm{C}^0\mathrm{C}^1 = n\cdot 1 = n$ caps the game from above and $\mathrm{R}_0 = n$ meets it from below. Parity does *not* work here -- there $\mathrm{CG} = \Theta(n^2)$ while $\mathrm{R}_0 = n$, so parity is instead the extreme *separation* for this cell.'
      conf: high
  see_also: [CG, R0, CGpub, EC, CA]

- from: CG
  to: EC
  setting: total
  status: settled
  headline: 'The private-coin certificate game is at most the square of expectational certificate complexity, and the square is needed.'
  upper:
    - stmt: '\mathrm{CG}(f) = O\big(\mathrm{EC}(f)^2\big)'
      form: {exp: 2, kind: const}
      refs: [CGLMSG23, GJKKLSSV17]
      note: 'The [GJKKLSSV17] argument for $\mathrm{R}_0 = O(\mathrm{EC}^2)$ extends verbatim to the game [CGLMSG23, Sec. 7.1]. The crude version of the same idea is the one-line bound $\mathrm{CG}(f) \le \mathrm{C}^0(f)\,\mathrm{C}^1(f)$: each player outputs a uniformly random index of a minimal certificate for their own input, and since a $0$-certificate and a $1$-certificate must conflict somewhere, they collide on a differing coordinate with probability at least $1/(\mathrm{C}^0\mathrm{C}^1)$.'
      conf: high
  lower:
    - stmt: '\mathrm{CG}(\oplus_n) = \Theta(n^2) = \Theta(\mathrm{EC}(\oplus_n)^2)'
      form: {exp: 2, kind: exact}
      witness: PARITY
      note: 'Parity has $\mathrm{EC} = n$ and $\mathrm{C}^0 = \mathrm{C}^1 = n$, and both the $\mathrm{C}^0\mathrm{C}^1$ and the $\mathrm{EC}^2$ bounds are tight on it [CGLMSG23]: $\mathrm{CG}(\oplus_n) = \Theta(n^2)$. This is the cleanest demonstration that $\mathrm{CG}$ is not below $\mathrm{D}$ -- the game costs quadratically more than the arity.'
      conf: high
  see_also: [CG, EC, C0, C1, CGpub, PARITY]

- from: CG
  to: Adv
  setting: total
  status: open
  headline: 'The private-coin game is at least the *square* of the positive adversary bound -- the reason it can exceed $n$.'
  lower:
    - stmt: '\mathrm{CG}(f) = \Omega\big(\mathrm{Adv}(f)^2\big)'
      form: {exp: 2, kind: const}
      refs: [CGLMSG23]
      note: 'Theorem 5.10 of [CGLMSG23]: $\mathrm{CG}(f) \ge \mathrm{MM}(f)^2$, where $\mathrm{MM}$ is the minimax formulation of the positive adversary bound, itself sitting between $\lambda(f)$ and $\mathrm{Q}(f)$. Specialising to the Hamming-distance-$1$ game recovers the exact identity $\mathrm{CG}_{[1]}(f) = \lambda(f)^2$ [CGLMSG23, Thm 8.9]. This is what lets $\mathrm{CG}$ climb above the arity: $\mathrm{Adv}(\oplus_n) = n$ forces $\mathrm{CG}(\oplus_n) = \Omega(n^2)$.'
      conf: high
  notes: |
    No upper bound on $\mathrm{CG}$ in terms of $\mathrm{Adv}$ is known, and none should be
    expected in general: $\mathrm{CG}$ is also above $\mathrm{R}_0$, while $\mathrm{Adv}$
    is below $\mathrm{Q}$. Any total function with a large $\mathrm{R}_0$-vs-$\mathrm{Q}$
    gap therefore pushes the two apart -- $\mathrm{OR}_n$ already gives
    $\mathrm{CG} = \Theta(n)$ against $\mathrm{Adv} = \Theta(\sqrt n)$, which is exactly
    the tight case of the bound above rather than a separation. A genuine separation would
    need $\mathrm{CG} \gg \mathrm{Adv}^2$.
  see_also: [CG, Adv, lambda, Q, R0, PARITY]

- from: CG
  to: C
  setting: total
  status: settled
  headline: 'At most $\mathrm{C}^0\mathrm{C}^1$, hence at most $\mathrm{C}^2$ -- and parity meets it.'
  upper:
    - stmt: '\mathrm{CG}(f) \le \mathrm{C}^0(f)\,\mathrm{C}^1(f) \le \mathrm{C}(f)^2'
      form: {exp: 2, kind: exact}
      refs: [CGLMSG23]
      note: 'Each player outputs a uniformly random index of a minimal certificate for their own input; a $0$-certificate and a $1$-certificate must conflict on some coordinate, so they agree on a differing index with probability at least $1/(\mathrm{C}^0\mathrm{C}^1)$.'
      conf: high
  lower:
    - stmt: '\mathrm{CG}(\oplus_n) = \Theta(n^2) = \Theta(\mathrm{C}(\oplus_n)^2)'
      form: {exp: 2, kind: exact}
      witness: PARITY
      refs: [CGLMSG23]
      note: 'Tight for parity, and also for [[OR]] in the asymmetric form $\mathrm{C}^0\mathrm{C}^1 = n\cdot 1$.'
      conf: high
  see_also: [CG, C, C0, C1, EC, PARITY]

- from: CG
  to: D
  setting: total
  status: settled
  headline: 'Quadratic, and genuinely quadratic -- $\mathrm{CG}$ is one of the few measures here that can *exceed* the number of queries.'
  upper:
    - stmt: '\mathrm{CG}(f) \le \mathrm{C}^0(f)\,\mathrm{C}^1(f) \le \mathrm{D}(f)^2'
      form: {exp: 2, kind: exact}
      refs: [CGLMSG23]
      note: 'Immediate from the certificate bound, since $\mathrm{C}^0,\mathrm{C}^1 \le \mathrm{C} \le \mathrm{D}$. It is worth stating explicitly because the naive guess $\mathrm{CG} \le \mathrm{D}$ is *false*: the value of a certificate game is a product of two players'' guessing probabilities, not a query count, and nothing forces it below the arity.'
      conf: high
  lower:
    - stmt: '\mathrm{CG}(\oplus_n) = \Theta(n^2) = \Theta(\mathrm{D}(\oplus_n)^2)'
      form: {exp: 2, kind: exact}
      witness: PARITY
      refs: [CGLMSG23]
      note: 'Parity has $\mathrm{C}^0 = \mathrm{C}^1 = n$ and $\mathrm{Adv}(\oplus_n) = \Theta(n)$, so both ends of the sandwich $\mathrm{Adv}^2 \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ land on $n^2$, while $\mathrm{D}(\oplus_n) = n$. The exponent $2$ is therefore attained, not merely permitted.'
      conf: high
  notes: |
    This is the cell that most often gets recorded backwards. Certificate game
    complexity is a *lower*-bound method for randomized query complexity --
    $\mathrm{R}_0(f) = O(\mathrm{CG}(f))$ -- and it lives above $\mathrm{D}$ as
    often as below it. See [[CG]] for the full sandwich.
  see_also: [CG, D, C, C0, C1, R0, PARITY]

- from: D
  to: CG
  setting: total
  status: gap
  headline: 'At most quadratic, via $\mathrm{D} = O(\mathrm{R}_0^2)$ and $\mathrm{R}_0 = O(\mathrm{CG})$.'
  upper:
    - stmt: '\mathrm{D}(f) = O\big(\mathrm{CG}(f)^2\big)'
      form: {exp: 2, kind: const}
      refs: [CGLMSG23, Nisan91]
      putative: true
      note: 'Composition of two recorded facts. A zero-error algorithm must, on every run, query a full certificate, so $\mathrm{R}_0 \ge \mathrm{C}$; and $\mathrm{R}_0 \ge \mathrm{R} \ge \mathrm{bs}$. Nisan''s $\mathrm{D} \le \mathrm{C}\cdot\mathrm{bs}$ [Nisan91] then gives $\mathrm{D} = O(\mathrm{R}_0^2)$, and $\mathrm{R}_0 = O(\mathrm{CG})$ [CGLMSG23] finishes it.'
      conf: high
  lower:
    - stmt: '\mathrm{D}(\vee_n) = n = \Theta(\mathrm{CG}(\vee_n))'
      form: {exp: 1, kind: exact}
      witness: OR
      refs: [CGLMSG23]
      note: 'Baseline only. $\mathrm{CG}(\vee_n) \le \mathrm{C}^0\mathrm{C}^1 = n \cdot 1$, and $\mathrm{R}_0(\vee_n) = n$ forces the match. Whether the exponent can be pushed towards $2$ is open: it would need a family on which $\mathrm{CG}$ stays near $\sqrt{\mathrm{D}}$, and since $\mathrm{CG} \ge \mathrm{R}_0$ any such family also separates $\mathrm{D}$ from $\mathrm{R}_0$ at the same power. The pointer functions of [ABBLSS17] do that at power $2$ for $\mathrm{R}_0$, but their $\mathrm{C}^0\mathrm{C}^1$ is not known to be small enough to keep $\mathrm{CG}$ down.'
      conf: high
  see_also: [D, CG, R0, C, bs, OR]

- from: CG
  to: R0
  setting: total
  status: settled
  headline: 'The return leg: $\mathrm{CG} = O(\mathrm{R}_0^2)$, and parity makes it tight.'
  upper:
    - stmt: '\mathrm{CG}(f) \le \mathrm{C}^0(f)\,\mathrm{C}^1(f) \le \mathrm{R}_0(f)^2'
      form: {exp: 2, kind: exact}
      refs: [CGLMSG23]
      putative: true
      note: 'A zero-error algorithm must, on every branch it can take, query a set that determines the answer, so the queried set is a certificate and $\mathrm{R}_0(f) \ge \mathrm{C}(f) \ge \max\{\mathrm{C}^0(f), \mathrm{C}^1(f)\}$. Feeding that into the certificate-product bound of [CGLMSG23] gives the square. This pins $\mathrm{CG}$ between $\mathrm{R}_0$ and $\mathrm{R}_0^2$; the recorded $\mathrm{R}_0 = O(\mathrm{CG})$ is the other side.'
      conf: high
  lower:
    - stmt: '\mathrm{CG}(\oplus_n) = \Theta(n^2) = \Theta(\mathrm{R}_0(\oplus_n)^2)'
      form: {exp: 2, kind: exact}
      witness: PARITY
      refs: [CGLMSG23]
      note: 'Parity saturates the upper bound: $\mathrm{R}_0(\oplus_n) = n$ and both ends of the [CGLMSG23] sandwich sit at $n^2$. Contrast [[OR]], where $\mathrm{CG} = \Theta(\mathrm{R}_0)$ because the certificate product is the very lopsided $n \cdot 1$.'
      conf: high
  notes: |
    Together with the $\mathrm{R}_0 \to \mathrm{CG}$ cell this says
    $\mathrm{R}_0 \le \mathrm{CG} \le \mathrm{R}_0^2$, with both ends attained --
    $\mathrm{OR}$ at the bottom, $\oplus$ at the top. Certificate game complexity
    is thus a lower-bound method for $\mathrm{R}_0$ that is never more than
    quadratically wasteful, which is what makes the $\mathrm{CG} \ge \mathrm{Adv}^2$
    direction interesting rather than vacuous.
  see_also: [CG, R0, C, C0, C1, PARITY, OR]
