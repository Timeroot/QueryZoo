# =========================================== many samples of the same input
- from: Corr
  to: R
  setting: partial
  status: settled
  headline: '\mathrm{Corr}(f) = \Theta\big(\mathrm{R}(f)\big)'
  upper:
    - stmt: '\mathrm{Corr}(f) \le \mathrm{R}(f)'
      form: {exp: 1, kind: exact}
      refs: [BDGHMT20]
      note: 'Take $k = 1$: $\mathrm{Corr}_\varepsilon(f,D) \le \mathrm{D}_\varepsilon(f,D)$, and $\max_D \mathrm{D}_\varepsilon(f,D) = \mathrm{R}_\varepsilon(f)$ by Yao.'
      conf: high
    - stmt: '\mathrm{R}(f) = \Theta\big(\mathrm{Corr}(f)\big)'
      form: {exp: 1, kind: theta, dir: reverse}
      refs: [BDGHMT20, BenDavidBlais20minimax]
      note: |
        **Theorem 1**, for every (possibly partial) Boolean $f$: against the hardest input
        distribution, unlimited correlated samples are worth nothing. The obstruction is the
        [Shaltiel04] examples -- distributions with a small easy part, which many samples let you
        hunt for -- and the proof builds hard distributions with no easy part, via *likelihood
        boosters*: a decision tree that with probability $\ge 1-\delta$ multiplies the likelihood
        ratio between $D_0^k$ and $D_1^k$ by at most $M$. [BenDavidBlais20minimax] reprove it
        from their Shaltiel-free minimax theorems.
      conf: high
  notes: |
    The measure is not interesting one distribution at a time -- there
    $\mathrm{Corr}(f,D)$ can be $O(1)$ while $\mathrm{D}(f,D) = \Omega(n)$ -- so the whole
    content is in the $\max_D$. That is also what makes it useful: the theorem is the
    ingredient that upgrades $\mathrm{R}(f\circ g) = \Omega(\mathrm{bs}(f)\mathrm{R}(g))$ to
    $\Omega(\mathrm{fbs}(f)\mathrm{R}(g))$, see [[comp-R]].
  see_also: [Corr, Sel, R, Dmu, fbs, comp-R, direct-sum]

