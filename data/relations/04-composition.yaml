      note: |
        **Theorem 8**, for every (possibly *partial*) Boolean $f$: non-adaptively, buying
        cheap bias buys nothing. The route is an information-theoretic exchange rate.
        Samorodnitsky's inequality [Samorodnitsky16], in the form isolated by
        [PolyanskiyWu17], says that a noisy copy of $X$ at bias $\rho$ carries at least as
        much information about $f(X)$ as an *erasure* copy that survives with probability
        $\rho^2$ -- and $\rho^2$ is exactly what the noisy model charges. Erasures are honest
        queries, so a noisy algorithm of cost $c$ converts into a distribution over query
        sets of expected size $O(c)$ that leaves as little entropy in $f(X)$; a non-adaptive
        minimax lemma turns the distributional statement back into a worst-case algorithm,
        and Fano / [HellmanRaviv70] turns the entropy bound into an error bound.
      conf: high
  notes: |
    The non-adaptive shadow of [[open-noisyR-vs-R]], and the only case of it that is
    settled. Adaptively the analogous statement is *false* for partial functions --
    $\mathrm{R}$ can be exponentially larger than $\mathrm{noisyR}$ on
    [[ApproxIndex]] -- so adaptivity is what lets an algorithm spend a statistical
    budget the query model cannot match.

    The theorem is also **false for relations** ([[AgreeString]]), which is unusual:
    almost every argument in query complexity is indifferent to whether the output is
    Boolean. The step that notices is the last one, from entropy to error probability.
  see_also: [noisyRna, Rna, noisyR, R, AgreeString, ApproxIndex, open-noisyR-vs-R]

- from: Rna
  to: noisyRna
  setting: relation
  status: fails
  headline: '\mathrm{R}^{\mathrm{na}} \text{ is unbounded in terms of } \mathrm{noisyR}^{\mathrm{na}} \text{ for relations}'
  lower:
    - stmt: '\mathrm{noisyR}^{\mathrm{na}}(\mathrm{AGREE}_n) = \Theta(1) \text{ while } \mathrm{R}^{\mathrm{na}}(\mathrm{AGREE}_n) = \Theta(\sqrt n)'
      form: {kind: unbounded}
      witness: AgreeString
      refs: [BenDavidBlais20composition, GLSS19]
      conf: high
  notes: |
    Theorem 8 holds for partial Boolean functions and fails here, so its proof has to
    distinguish the two. Concretely: $\mathrm{AGREE}_n$ asks for a string agreeing with
    $x$ on $n/2+\sqrt n$ coordinates, which $n$ noisy reads at bias $c/\sqrt n$ deliver
    for total cost $c^2$, while any set of $o(\sqrt n)$ exact reads leaves the answer a
    coin flip away from the promise.

    The same family separates the *adaptive* pair $\mathrm{R}$ vs $\mathrm{noisyR}$ over
    relations, which is the "relational barrier" to [[open-noisyR-vs-R]].
  see_also: [Rna, noisyRna, AgreeString, R, noisyR, open-noisyR-vs-R]

