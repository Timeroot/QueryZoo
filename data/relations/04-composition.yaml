      refs: [BenDavidBlais20composition]
      conf: high
  notes: |
    Same reason as in the query model: a non-adaptive schedule has to spread its bias
    budget over the whole table, while an adaptive one reads the address first and then
    spends everything on the one cell it needs. The non-adaptive value is Theorem 8 of
    [BenDavidBlais20composition] applied to $\mathrm{R}^{\mathrm{na}}(\mathrm{ADDR}_k)=\Theta(2^k)$.

    So the two ways of weakening $\mathrm{R}$ -- charge less for less information, or
    forbid looking at the answers -- are not comparable, and combining them changes
    nothing: $\mathrm{noisyR}^{\mathrm{na}} = \Theta(\mathrm{R}^{\mathrm{na}})$.
  see_also: [noisyRna, noisyR, Rna, ADDR, Dna]

