# =====================================================================
# RELATIONS, part 4: composition and the measures invented to control it.
#
# These entries are a little different from the rest of the zoo: the
# "relation" being recorded is often about  f o g  rather than about a
# single function.  We use `kind: composition` on those, and keep the
# usual from/to schema (documented in 01-classical-core.yaml) for the
# plain measure-vs-measure comparisons.
# =====================================================================

relations:

# =========================================== the composition question itself
- from: R
  to: R
  kind: composition
  id: comp-R
  setting: partial
  status: settled
  headline: \frac{\mathrm{R}(f)\mathrm{R}(g)}{\log(n+1)}\lesssim\mathrm{R}(f\circ g^n)\lesssim\mathrm{R}(f)\mathrm{R}(g)\log(\mathrm{R}(f)+1)
  upper:
    - stmt: '\mathrm{R}_{1/3}(f\circ g^n) = O\big(\mathrm{R}(f)\,\mathrm{R}_{1/(3\mathrm{R}(f))}(g)\big) = O\big(\mathrm{R}(f)\,\mathrm{R}(g)\log \mathrm{R}(f)\big)'
      note: 'Folklore: run the outer algorithm and amplify each inner call to error $1/(3\mathrm{R}(f))$, then union bound. The $\log$ comes purely from amplification, which is why $\bar{\mathrm{R}}_\varepsilon$ and the $\varepsilon$-dependence of $\mathrm{R}$ matter so much here.'
      conf: high
  lower:
    - stmt: \mathrm{R}(f\circ g^n)=\Omega\!\left(\frac{\mathrm{R}(f)\mathrm{R}(g)}{\log(n+1)}\right)
      refs:
        - PednekarPodder26STOC
      conf: high
      note: Both f and g may be partial Boolean functions. Here n is the outer input length; replacing log(n+1)
        by log(R(f)+1) is not justified. Follows from Theorem 31 and the optimal outer composition theorem.
    - stmt: '\text{FALSE in general: } \exists \text{ partial } f,g:\ \mathrm{R}(f\circ g) = O\big(\mathrm{R}(f)^{2/3}\mathrm{R}(g)^{2/3}\log^{2/3}\mathrm{R}(f)\big)'
      refs:
        - BenDavidBlais20composition
      note: |
        Theorem 1: the randomized composition conjecture is **refuted** for partial functions,
        by a polynomial margin. Take $f = $ [[ApproxIndex]]$_k$ and $g = \mathrm{GapMaj}_k$;
        then $\mathrm{R}(f) = \Theta(\sqrt{k\log k})$, $\mathrm{R}(g) = \Theta(k)$ and
        $\mathrm{R}(f\circ g) = \Theta(k\log k)$, against a conjectured
        $\tilde\Theta(k^{3/2})$. Note that both $\mathrm{R}(f)$ and $\mathrm{R}(g)$ are only
        *logarithmic* in the input size $n = k + 2^k$ of $f$, which is why the theorem with a $\log(n+1)$ loss can coexist with this counterexample.
      conf: high
    - stmt: \mathrm{R}(f\circ g^n) = \Omega\big(\mathrm{noisyR}(f)\,\mathrm{R}(g)\big)
      refs:
        - BenDavidBlais20composition
      note: 'Theorem 3, the optimal *outer* composition theorem: by Lemma 6, if $\mathrm{R}(f\circ g^n)=\Omega(M(f)\mathrm{R}(g))$
        for all $f,g$ then $M(f) = O(\mathrm{noisyR}(f))$ -- so no measure can do better. Holds even when
        $f$ is a relation. The proof of optimality is one line given the characterisation $\mathrm{noisyR}(f)
        = \Theta(\mathrm{R}(f\circ\mathrm{GapMaj}_n)/n)$: take $g = \mathrm{GapMaj}_n$.'
      conf: high
    - stmt: \mathrm{R}(f\circ g^n) = \Omega\big(\mathrm{fbs}(f)\,\mathrm{R}(g)\big)
      refs:
        - BDGHMT20
        - BenDavidBlais20composition
      note: Proved independently and concurrently by [BDGHMT20]; it also follows from the $\mathrm{noisyR}$
        theorem above together with $\mathrm{noisyR}(f) = \Omega(\mathrm{fbs}(f))$ (Lemma 38 of [BenDavidBlais20composition])
        -- see the $\mathrm{fbs}\to\mathrm{noisyR}$ record. It strictly strengthens the sensitivity version
        below, since $\mathrm{fbs} \ge \mathrm{s}$.
      conf: high
    - stmt: \mathrm{R}(f\circ g^n) = \Omega\big(\mathrm{R}(f)\,\sqrt{\mathrm{R}(g)}\big)
      refs:
        - GLSS19
      note: Holds for **relational** outer $f$ and partial inner $g$ -- the strongest thing that survives
        the relational counterexample, which rules out the full $\mathrm{R}(f)\mathrm{R}(g)$ at that generality.
        It is the composition-theorem form of $\bar\chi(g) = \Omega(\sqrt{\mathrm{R}(g)})$.
      conf: high
    - stmt: \mathrm{R}(f\circ g^n) = \Omega\big(\mathrm{s}(f)\,\mathrm{R}(g)\big)
      refs:
        - GJPW18
      note: The generalisation of $\mathrm{R}(\mathrm{AND}_n\circ g) = \Omega(n\,\mathrm{R}(g))$. Subsumed
        by the $\mathrm{fbs}$ and $\mathrm{noisyR}$ versions, but it was the first outer composition theorem
        with a nontrivial outer measure.
      conf: high
    - stmt: \mathrm{R}(f\circ g^n) = \Omega\big(\mathrm{R}(f)\,\mathrm{LR}(g)\big)
      refs:
        - BBGM22
      note: 'Optimal *inner* composition theorem: $\mathrm{LR}$ is the largest measure with this property.'
      conf: high
    - stmt: \mathrm{R}(f\circ g^n) = \Omega\big(\mathrm{R}(f)\,\bar\chi(g)\big) = \Omega\big(\mathrm{R}(f)\,\mathrm{RS}(g)\big)
        = \Omega\big(\mathrm{R}(f)\,\chi(g)\big)
      refs:
        - GLSS19
        - BenDavidKothari18
        - Sanyal18
        - AGJKLMSS17
      note: 'The historical sequence of inner measures: $\mathrm{RS}$ [BenDavidKothari18], then $\chi$ [Sanyal18],
        then $\bar\chi$ [GLSS19], then $\mathrm{LR}$ [BBGM22]. Each *composition theorem* subsumes the previous
        one, but that is not the same as a pointwise chain: what is actually recorded is $\chi \le \bar\chi$
        and $\bar\chi = \Omega(\mathrm{RS})$ and $\bar\chi \le \mathrm{LR} \le \mathrm{R}$. The zoo has
        **no** pairwise comparison between $\chi$ and $\mathrm{RS}$ in either direction -- do not read one
        off this list.'
      conf: high
    - stmt: \mathrm{R}(f\circ g^n) = \tilde\Omega\big(\mathrm{R}(f)\,\mathrm{D}^{\mathrm{prod}}(g)\big)
      refs:
        - Sanyal24
      conf: high
  notes: |
    **Status by setting.**

    * *Partial Boolean functions*: constant-factor composition is false [BenDavidBlais20composition], but the $\log(n+1)$ lower bound is now proved [PednekarPodder26STOC].
    * *Total functions*: constant-factor composition is false [Meiburg26composition]; composition up to a logarithm of outer input size holds by the partial-Boolean theorem.
    * *Relations*: **false**, and this was known first. [GLSS19] give relations
      $f_n$ with $\mathrm{R}(f_n)=\Theta(\sqrt n)$ and partial functions $g_n$ with
      $\mathrm{R}(g_n)=\Theta(n)$ but $\mathrm{R}(f_n\circ g_n)=\Theta(n) \ll n^{3/2}$;
      the outer relation is [[AgreeString]] and the inner function is again
      [[GapMaj]]. Sanyal's theorem nevertheless allows the outer object to be a
      relation [Sanyal24], as does Theorem 3 above.

    The earlier counterexamples -- the relational one of [GLSS19] and the partial-function
    one of [BenDavidBlais20composition] -- use $\mathrm{GapMaj}$ (or a close variant) as the
    inner function, and both work for the same reason: the outer object only needs its bits
    to bias $1/\sqrt m$, and buying bias $1/\sqrt m$ from a $\mathrm{GapMaj}_m$ gadget costs
    $1$ query rather than $m$. The total-function counterexample instead uses an encoded pointer inner function [Meiburg26composition].

    **Sufficient conditions for composition (all with arbitrary inner $g$).**

    * $\mathrm{R}(f)=\Theta(n)$, i.e. the outer function is maximally hard [CKMPSS23].
    * $f$ symmetric, or "weakly symmetric" in the sense of [CKMPSS23].
    * Inserting a cheap buffer works unconditionally:
      $\mathrm{R}(f\circ h\circ g)=\Omega(\mathrm{R}(f)\mathrm{R}(h)\mathrm{R}(g))$
      whenever $\mathrm{D}(h)=\Theta(\log \mathrm{R}(g))$ [BenDavidKothari18], and
      likewise for $h$ a parity on $O(\log n)$ bits [AGJKLMSS17].

    **Even a trivial outer function is not trivial.** Let $\mathrm{Triv}_n$ be the promise
    problem on $\{0^n,1^n\}$, so $\mathrm{R}(\mathrm{Triv}_n) = 1$. That
    $\mathrm{R}(\mathrm{Triv}_n\circ g) = \Omega(\mathrm{R}(g))$ is obvious -- feed every
    copy the same input -- but the argument is not *distributional*: the hard distribution
    it uses is not a hard distribution for $\mathrm{Triv}_n$ composed with one for $g$, and
    all the composition theorems above are distributional. Getting the bound distributionally
    is the **correlated copies problem**, solved by [BDGHMT20]; here it is the special case
    $\mathrm{noisyR}(\mathrm{Triv}_n)=\Omega(1)$ of Lemma 37.

    **Sibling results for other measures.** $\mathrm{D}(f\circ g)=\mathrm{D}(f)\mathrm{D}(g)$
    [Savicky02, Tal13, Montanaro14], see [[comp-D]]; $\mathrm{Q}(f\circ g)=\Theta(\mathrm{Q}(f)\mathrm{Q}(g))$
    [Reichardt11, LMRSS11]; $\mathrm{s}$, $\mathrm{bs}$ and $\mathrm{fbs}$ compose
    [Tal13, GSS16]; conical juntas compose [GoosJayram16]; direct sum [[dirsum-R]]
    [JainKlauckSantha10], direct product [[dirprod-R]] [Drucker12] and strong direct sum
    [BlaisBrody19] for $\mathrm{R}$.

    **Total-function counterexample.** [Meiburg26composition, Theorem 1.1] gives
    $\mathrm{R}(f\circ g)=\Theta(\mathrm{R}(f)\mathrm{R}(g)/\log\mathrm{R}(g))$.
    For outer length $N$ and inner length $n$, $N=2^{\Theta(n^{4/5})}$, so the
    saving is $\Theta(\log n)=\Theta(\log\log L)$ in composed input length $L=Nn$.
    This refutes constant-factor composition and is consistent with the logarithmic-loss theorem.
  see_also: [R, noisyR, LR, RS, chi, chibar, D_prod, Rbar, composition, AgreeString, fbs, s, comp-D, dirsum-R, dirprod-R, direct-sum]
- from: D
  to: D
  kind: composition
  id: comp-D
  setting: relation
  status: settled
  headline: '\mathrm{D}(f\circ g^n) = \mathrm{D}(f)\,\mathrm{D}(g)'
  upper:
    - stmt: '\mathrm{D}(f\circ g^n) \le \mathrm{D}(f)\,\mathrm{D}(g)'
      note: 'The obvious algorithm: run an optimal tree for $f$ and answer each of its queries by running an optimal tree for $g$.'
      conf: high
  lower:
    - stmt: '\mathrm{D}(f\circ g^n) \ge \mathrm{D}(f)\,\mathrm{D}(g)'
      refs: [Savicky02, Tal13, Montanaro14]
      note: |
        Three independent proofs: [Savicky02] (as a lemma towards $\mathrm{D}$ vs $\mathrm{UC}$),
        [Tal13], and [Montanaro14]. Unlike the randomized case there is no log factor and no
        counterexample -- deterministic query complexity composes on the nose.
      conf: high
    - stmt: '\mathrm{D}\big(g\circ(f^1,\dots,f^n)\big) = \mathrm{D}\big(\bar g,[\mathrm{D}(f^1),\dots,\mathrm{D}(f^n)]\big)'
      refs: [Montanaro14]
      note: |
        **Theorem 2** of [Montanaro14], the general form, and the strongest statement the zoo
        records here. The outer object $g \subseteq \{0,1\}^n\times Z$ may be a **relation**;
        the inner objects $f^i \subseteq X^{m_i}\times\{0,1\}$ may be relations too, but must
        be **Boolean-valued** and non-trivial. On the right, $\mathrm{D}(\bar g,[w_1,\dots,w_n])$
        is *weighted* decision tree complexity -- the cheapest tree for $g$ when querying $y_i$
        costs $w_i$ -- and $\bar g$ is $g$ with the constant inner objects substituted in.
        Corollary 3 ($f^1=\dots=f^n$) is the displayed headline, Corollary 4 gives
        $\mathrm{D}(f^{(k)}) = \mathrm{D}(f)^k$ for the $k$-fold iteration, and Corollary 5 is
        the deterministic direct sum -- see the [[dirsum-D]] record.
      conf: high
  notes: |
    **The inner alphabet has to be Boolean.** Figure 1 of [Montanaro14] exhibits
    $f:\{0,1\}^2\to\{0,1,2\}$ and $g:\{0,1,2\}^2\to\{0,1,2\}$ with
    $\mathrm{D}(f)=\mathrm{D}(g)=2$ but $\mathrm{D}(g\circ(f,f)) = 3 < 4$. The reason is the
    one that makes composition theorems hard in general: the worst-case input for $f$ need not
    produce a worst-case input for $g$, and with three possible inner answers the outer tree has
    room to exploit that. An even cheaper illustration with a non-Boolean inner range: take
    $f = \mathrm{id}:\{0,1\}^n\to\{0,1\}^n$ and $g(y)=y_1$, so $\mathrm{D}(f)=n$,
    $\mathrm{D}(g)=1$, and $\mathrm{D}(g\circ f) = 1$.

    Iterating gives cheap amplification of separations, which is what these corollaries are
    mostly used for: applied to $\mathrm{NAE}_3$ it reproves the Nisan-Szegedy
    $\mathrm{D}$ vs $\deg$ separation directly, without going through sensitivity.

    Contrast with [[comp-R]]: for randomized complexity the same statement is *false* for
    partial functions and false for relations, and open for total functions.
  see_also: [D, Dna, dirsum-D, comp-R, comp-deg, composition, direct-sum, UC]

- from: R
  to: Rbar
  kind: composition
  id: comp-MAJ
  setting: total
  status: settled
  headline: '\mathrm{R}(\mathrm{MAJ}_n\circ g^n) = \Theta\big(n\cdot \bar{\mathrm{R}}_{1/n}(g)\big)'
  upper:
    - stmt: '\mathrm{R}(\mathrm{MAJ}_n\circ g^n) = O\big(n\cdot \bar{\mathrm{R}}_{1/n}(g)\big)'
      refs: [GoosMaystre21]
      conf: high
  lower:
    - stmt: '\mathrm{R}(\mathrm{MAJ}_n\circ g^n) = \Omega\big(n\cdot \bar{\mathrm{R}}_{1/n}(g)\big)'
      refs: [GoosMaystre21]
      conf: high
  notes: |
    The cleanest illustration in the zoo of why **$\varepsilon$-dependence and
    expected cost are not bookkeeping**: the right answer for majority-of-$g$ is
    $n$ times the *expected* complexity of $g$ at error $1/n$, not $n$ times
    $\mathrm{R}_{1/3}(g)$. [GoosMaystre21] also show that a sufficiently strong
    version of this for the single inner function $\mathrm{GapOr}$ would settle
    the general composition question.
  see_also: [MAJ, Rbar, R, comp-R]

