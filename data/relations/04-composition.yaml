    family, and hence a poor lower bound on $\mathrm{R}$ for relations.

    This is the barrier that [BenDavidBlais20composition] break in the non-adaptive
    setting -- see $\mathrm{noisyR}^{\mathrm{na}}$ vs $\mathrm{R}^{\mathrm{na}}$ -- and it
