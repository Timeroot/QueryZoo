  setting: total
  status: gap
  headline: '\text{Adaptivity is worth an exponential in the noisy model too}'
  lower:
    - stmt: '\mathrm{noisyR}(\mathrm{ADDR}_k) = O(k) \text{ while } \mathrm{noisyR}^{\mathrm{na}}(\mathrm{ADDR}_k) = \Theta(2^k)'
      form: {kind: exp}
