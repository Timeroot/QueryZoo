# =========================================== direct sum and direct product
# f^{o+ k} is k independent copies of f, all of which must be answered.
# "Direct sum": does that cost k times as much? "Direct product": if you
# are given less than that, does the success probability collapse?
- from: D
  to: D
  kind: composition
  id: dirsum-D
  setting: relation
  status: settled
  headline: '\mathrm{D}(f^{\otimes k}) = k\,\mathrm{D}(f)'
  upper:
    - stmt: '\mathrm{D}(f^{\otimes k}) \le k\,\mathrm{D}(f)'
      note: 'Solve the copies one after another.'
      conf: high
  lower:
    - stmt: '\mathrm{D}(f^{\otimes k}) \ge k\,\mathrm{D}(f),\quad\text{and more generally } \mathrm{D}(f^1,\dots,f^k) = \sum_i \mathrm{D}(f^i)'
      refs: [JainKlauckSantha10, Montanaro14]
      note: |
        Theorem 1 and Corollary 1 of [JainKlauckSantha10], for every relation $f$ and with no
        loss at all -- one of the few statements in this zoo that is an exact identity. The
        proof turns a $k$-output tree $T$ into $k$ single-output trees $T_i(v)$ by recursion on
        the vertices of $T$, and shows $\mathrm{depth}(T) \ge \sum_i \mathrm{depth}(T_i)$.
        Corollary 5 of [Montanaro14] is the same statement for Boolean-valued relations, as the
        $g = \mathrm{id}$ case of the composition theorem; [JainKlauckSantha10] allow an
        arbitrary output alphabet.
      conf: high
  notes: |
    Earlier work dismissed this as obvious ("an easy exercise" [NRS94]; "quite uninteresting"
    because queries do not span instances), and [JainKlauckSantha10] point out that it is not:
    a single tree that must produce all $k$ outputs is *not* obviously decomposable into $k$
    trees, and in the **distributional** setting the analogous tight statement is simply false
    ([Shaltiel04], see [[dirprod-R]]). What [NRS94] actually proved is a direct product theorem
    in the weaker "decision forest" model, where $k$ separate algorithms each produce one output.

    The nondeterministic version is genuinely easy: certificate complexity is additive over
    independent instances.
  see_also: [D, comp-D, dirsum-R, dirprod-R, direct-sum, C]

- from: R
  to: R
  kind: composition
  id: dirsum-R
  setting: relation
  status: settled
  headline: '\Omega\big(k\,\mathrm{R}(f)\big) \;\le\; \mathrm{R}(f^{\otimes k}) \;\le\; O\big(k\,\mathrm{R}(f)\log k\big),\ \text{both ends attained}'
  upper:
    - stmt: '\mathrm{R}(f^{\otimes k}) = O\big(k\,\mathrm{R}(f)\log k\big)'
      note: 'Run each copy at error $1/(3k)$ and union bound. [FRPU94] shows the $\log k$ cannot be removed by *black-box* use of a bounded-error algorithm for $f$ -- the same obstruction that makes $\mathrm{N}_p(\mathrm{PARITY}_n)=\Theta(n\log n)$ -- and [BlaisBrody19] show it cannot be removed at all.'
      refs: [FRPU94, Drucker12, BlaisBrody19]
      conf: high
    - stmt: '\exists f \text{ total}:\ \mathrm{R}(f^{\otimes k}) = \Theta\big(k\log k\cdot \mathrm{R}(f)\big)'
      refs: [BlaisBrody19]
      note: 'So the amplification $\log$ is real: solving $k$ independent copies can be *strictly* more than $k$ times as hard. The sharp statement is the strong direct sum $\bar{\mathrm{R}}_\varepsilon(f^{k}) = \Theta(k\,\bar{\mathrm{R}}_{\varepsilon/k}(f))$ -- see [[param-R-directsum]] -- which says the direct sum question for $\mathrm{R}$ is really a question about $\varepsilon$-dependence and expected cost.'
      conf: high
  lower:
    - stmt: '\mathrm{R}_\varepsilon(f^{\otimes k}) \ge \delta^2\,k\,\mathrm{R}_{\varepsilon''}(f),\qquad \varepsilon'' = \tfrac{\varepsilon}{1-\delta}+\delta'
      refs: [JainKlauckSantha10]
      note: |
        Theorem 2, for every relation $f$ and every small constant $\delta>0$. At constant error
        this is $\mathrm{R}(f^{\otimes k}) = \Omega(k\,\mathrm{R}(f))$, so the direct sum theorem
        holds up to constants. The proof is the communication-complexity one: fix the coins
        against $\mu^{\otimes k}$, note the expected query counts on the $k$ blocks sum to the
        total, pick a cheap block, and embed a single instance into it.
      conf: high
  notes: |
    Two losses are visible in the statement and neither is known to be necessary:
    the $\delta^2$ factor and the additive $\delta$ in the error. [JainKlauckSantha10] note
    that the $\delta^2$ loss **is** unavoidable in the *distributional* setting, by
    [Shaltiel04]'s examples, but the worst-case question is open -- see [[open-direct-sum]].

    Which end of the $\log k$ window a given $f$ sits at is decided entirely by its
    $\varepsilon$-dependence, since the upper bound is really $k\,\mathrm{R}_{1/3k}(f)$: for
    $\mathrm{OR}_n$, where error can only come from unqueried coordinates and
    $\mathrm{R}_\varepsilon = \Theta(n)$ down to exponentially small $\varepsilon$, there is no
    log; for the [BlaisBrody19] family, where $\bar{\mathrm{R}}_\varepsilon(f) = \Omega(\mathrm{R}(f)\log(1/\varepsilon))$,
    the full $\log k$ is paid.
  see_also: [R, Rbar, dirsum-D, dirprod-R, comp-R, direct-sum, open-direct-sum, param-R-directsum, Np, OR]

- from: R
  to: R
  kind: composition
  id: dirprod-R
  setting: total
  status: settled
  headline: '\text{Solving } f^{\otimes k} \text{ with } \ll k\,\mathrm{R}(f) \text{ queries succeeds with probability } 2^{-\Omega(k)}'
  upper:
    - stmt: '\text{Any } \gamma^3\mathrm{R}(f)k/11 \text{-query algorithm computes } f^{\otimes k} \text{ correctly with probability} < (1/2+\gamma)^k'
      refs: [Drucker12]
      note: |
        Theorem 1.2, for Boolean $f$ and $0<\gamma<1/4$. It replaced the earlier bound of
        [KSdW07], whose query budget scaled as $\mathrm{bs}(f)k$ -- which can be as small as
        $\mathrm{R}(f)^{1/2}k$, since $\mathrm{R}(f)^{1/3} \le \mathrm{bs}(f) \le \mathrm{R}(f)$
        and a power-$2$ separation is known. Proving a DPT at the $\mathrm{R}(f)k$ scale was one
        of the main open problems in classical query complexity.
      conf: high
    - stmt: '\mathrm{Suc}_{T,\mu}(f)\le 1-\varepsilon \;\Rightarrow\; \mathrm{Suc}_{\alpha\varepsilon Tk,\,\mu^{\otimes k}}(f^{\otimes k}) \le \big(2^{\alpha\varepsilon}(1-\varepsilon)\big)^k < (1-\varepsilon+0.84\,\alpha\varepsilon)^k'
      refs: [Drucker12]
      note: 'Theorem 1.1, the distributional statement everything else is derived from, for $0<\alpha\le 1$. The query budget must scale with $\varepsilon T k$ rather than $Tk$, and [Shaltiel04] shows that is essentially forced.'
      conf: high
  lower:
    - stmt: '\text{Not with budget } Tk\text{: } \exists (f,\mu) \text{ with } \mathrm{Suc}_{T,\mu}(f) \le 1-\varepsilon \text{ but } \mathrm{Suc}_{\Theta(Tk),\,\mu^{\otimes k}}(f^{\otimes k}) \text{ large}'
      refs: [Shaltiel04]
      note: |
        Shaltiel's examples: a distribution that is hard $1-\varepsilon$ of the time and trivial
        the rest of the time. Given $k$ copies an algorithm can hunt for the easy ones, so the
        success probability does not decay until the budget drops to $\Theta(\varepsilon Tk)$.
        This is exactly the $\varepsilon$ in Drucker's bound, and Theorem 1.1 says small
        $\varepsilon$ is the *only* obstruction.
      conf: high
  notes: |
    Also in [Drucker12]: an **XOR lemma** (Theorem 1.3), bounding the advantage in computing
    $f^{\oplus k}$, and a **threshold DPT** (Theorems 1.4, 6.3, 6.6) bounding the probability
    that $\eta k$ of the $k$ instances come out right -- which decays exponentially once
    $\eta > 1-\varepsilon+\alpha\varepsilon$, again essentially tight by Shaltiel's examples.
    The threshold version is proved for **total relations**, not just Boolean functions, and
    there is a matching DPT for decision tree *size* (Theorem 9.1), where the resource bound
    grows as $T^{\alpha\varepsilon k}$ rather than linearly in $k$.

    What is *not* known is what happens with a budget of $\alpha\,\mathrm{R}(f)k$ for
    $\alpha \gg 1$: see [[open-direct-sum]]. Quantumly that regime was settled by [BNRdW07].
  see_also: [R, Rbar, dirsum-R, dirprod-Q, direct-sum, open-direct-sum, bs]

- from: Q
  to: Q
  kind: composition
  id: dirprod-Q
  setting: total
  status: gap
  headline: '\mathrm{Q}(f^{\otimes k}) = \tilde\Theta\big(k\,\mathrm{Q}(f)\big) \text{ for Boolean } f'
  upper:
    - stmt: '\mathrm{Q}(f^{\otimes k}) = O\big(k\,\mathrm{Q}(f)\log k\big)'
      note: 'Same amplify-and-union-bound as the randomized case.'
      conf: high
  lower:
    - stmt: '\mathrm{Q}(f^{\otimes k}) = \tilde\Omega\big(k\,\mathrm{Q}(f)\big) \text{ for Boolean } f'
      refs: [ACGT09, Reichardt11, JainKlauckSantha10]
      note: |
        Not proved directly: the general adversary bound has direct sum behaviour [ACGT09] (see
        also Theorem 7.2 of the long version of [Reichardt11]), and $\mathrm{Adv}^{\pm}$ is tight
        for $\mathrm{Q}$ up to a log factor on Boolean functions [Reichardt11]. Combining the two
        gives a direct sum theorem up to that log, as observed by [JainKlauckSantha10]. Note the
        adversary bound needs a Boolean "connection" function such as XOR, so the argument does
        not reach relations.
      conf: high
    - stmt: '\text{DPT: any } \Omega(\mathrm{Q}(f)k)\text{-query quantum algorithm computes } f^{\otimes k} \text{ with probability } 2^{-\Omega(k)}'
      refs: [LeeRoland13, KSdW07, Spalek08]
      note: |
        [LeeRoland13], for possibly non-Boolean $f$, with a threshold version for Boolean $f$;
        it improves [KSdW07], whose budget scaled as $\sqrt{\mathrm{bs}(f)}k$, and the
        multiplicative-adversary DPT of [Spalek08], whose budget scaled with that measure
        instead. The quantum DPT
        therefore arrived at the right scale *before* the classical one, and the two are
        incomparable as statements about randomized algorithms: [Drucker12] allows a larger
        query budget, [LeeRoland13] a larger class of algorithms.
      conf: high
  notes: |
    A tight direct sum for $\mathrm{Q}$ -- without the log, and for relations -- is
    open problem 2 of [JainKlauckSantha10]. This is the one place where the quantum
    world is *less* clean than the classical one: $\mathrm{D}$ and $\mathrm{R}$ both
    have exact or constant-factor direct sums for relations, while $\mathrm{Q}$ has
    neither.
  see_also: [Q, Advpm, comp-Q, dirsum-R, dirprod-R, direct-sum, open-direct-sum]

