  headline: '\text{Equal up to constants distribution-free, } \textbf{not} \text{ distribution by distribution}'
  upper:
    - stmt: '\mathrm{Corr}(f, D) = O\big(\mathrm{Sel}(f, D)\big) \text{ for every } (f,D)'
      form: {exp: 1, kind: const}
      refs: [BDGHMT20]
      note: 'Theorem 2.1: a selection algorithm already tells you which side the samples came from, since it names an instance and its value.'
      conf: high
    - stmt: '\mathrm{Sel}(f) = \Theta\big(\mathrm{Corr}(f)\big)'
      form: {exp: 1, kind: theta, dir: reverse}
      refs: [BDGHMT20]
      note: 'Only after maximising over $D$: both sides are $\Theta(\mathrm{R}(f))$. There is no pointwise version -- see below.'
      conf: high
  lower:
    - stmt: '\exists (f, D):\ \mathrm{Sel}(f, D) = \Omega(n) \text{ while } \mathrm{Corr}(f, D) = O(1)'
      refs: [BDGHMT20]
      note: |
        Theorem 2.2, so selection is *strictly* harder at a fixed distribution. Related to this,
        selection admits no cheap error reduction (Theorem 2.3) while correlated samples do
        (Fact 1). The two facts sit either side of the $\max_D$: pointwise the measures differ
        by an unbounded factor, distribution-free they agree up to constants -- both being
        $\Theta(\mathrm{R})$. This is a good illustration of how much work $\max_D$ does in the
        definition of a distributional measure.
      conf: high
  see_also: [Corr, Sel, R, Dmu, direct-sum]

- from: fbs
  to: noisyR
  setting: partial
  status: settled
  headline: '\mathrm{fbs}(f) = O\big(\mathrm{noisyR}(f)\big)'
  upper:
    - stmt: '\mathrm{fbs}(f) = O\big(\mathrm{noisyR}(f)\big)'
      form: {exp: 1, kind: const}
      refs: [BenDavidBlais20composition]
      note: |
        Lemma 38, for every (possibly partial) Boolean $f$. The ingredient is Lemma 37 in its
        localised form: if $x$ and $y$ differ exactly on a block $B$ and the algorithm
        separates them, then the cost it spends *inside $B$* is $\Omega(1)$. Fix an optimal
        noisy algorithm and let $p_i$ be the expected cost it spends on coordinate $i$; then
        $\sum_{i\in B} p_i = \Omega(1)$ for every sensitive block $B$, so $(p_i)$ is (a constant
        multiple of) a feasible solution to the fractional block sensitivity LP at $x$, and
        $\mathrm{fbs}(f) \le O(\sum_i p_i) = O(\mathrm{noisyR}(f))$.
      conf: high
  notes: The fractional-block lower bound supplies one outer randomized composition theorem. The stronger
    input-size-dependent comparison $\mathrm{noisyR}(f)=\Omega(\mathrm{R}(f)/\log(n+1))$ is now proved for
    partial Boolean functions [PednekarPodder26STOC].
  see_also: [fbs, noisyR, R, D, comp-R, open-noisyR-vs-R]
- from: noisyR
  to: R
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{noisyR}(f) \le \mathrm{R}(f)'
      form: {exp: 1, kind: exact}
      refs: [BenDavidBlais20composition]
      note: 'Buying an unbiased copy of a bit costs $1$, so the noisy model is at least as powerful as the query model.'
      conf: high
    - stmt: '\mathrm{noisyR}(f) = \Theta\big(\mathrm{R}(f\circ \mathrm{GapMaj}_n)\,/\,\mathrm{R}(\mathrm{GapMaj}_n)\big)'
      refs: [BenDavidBlais20composition]
      note: |
        Theorem 4: an exact characterisation, not just a bound, with $n$ the input size of $f$
        and $\mathrm{R}(\mathrm{GapMaj}_n)=\Theta(n)$. It holds for relations too, provided two
        inputs have disjoint allowed output sets; and combined with Theorem 3 it gives
        Corollary 5, $\mathrm{R}(f\circ g) = \Omega\big(\tfrac{\mathrm{R}(f\circ\mathrm{GapMaj}_n)}{\mathrm{R}(\mathrm{GapMaj}_n)}\mathrm{R}(g)\big)$
        -- a composition theorem with no complexity measure in it at all.
        The easy direction is Theorem 3; the hard direction needs the normal form of
        Theorem 39, that an optimal noisy algorithm can be taken to use only biases
        $1$ and $1/\sqrt n$, which are simulated by reading a whole $\mathrm{GapMaj}_n$
        gadget and by reading one random bit of it respectively.
      conf: high
  lower:
    - stmt: '\mathrm{R}(f)=\Theta(n)\ \Rightarrow\ \mathrm{noisyR}(f)=\Theta(\mathrm{R}(f))'
      refs: [CKMPSS23]
      conf: high
  notes: Noisy complexity is the optimal outer measure in randomized composition [BenDavidBlais20composition].
    For partial Boolean f on n bits, it is now at least $\Omega(\mathrm{R}(f)/\log(n+1))$ [PednekarPodder26STOC].
    Constant-factor equality is false even for total functions [Meiburg26composition], as [[MeiburgNoisySeparation]]
    shows. The non-adaptive pair remains equivalent within constants.
  see_also: [noisyR, R, Np, GapMaj, noisy-models, ApproxIndex]
- from: R
  to: noisyR
  setting: partial
  status: gap
  headline: '\mathrm{R} \text{ can be exponentially larger than } \mathrm{noisyR}'
  lower:
    - stmt: '\mathrm{R}(f) = 2^{\Omega(\mathrm{noisyR}(f))}'
