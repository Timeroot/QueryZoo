# The partial-function half of the same cell. It is the *reason* the total
# statement above has to say "total": sabotage complexity is blind to a promise
# whose two sides are far apart in Hamming distance, because then every
# sabotaged input is riddled with stars and finding one is free.
- from: R
  to: RS
  setting: partial
  status: fails
  upper:
    - stmt: '\mathrm{R}_\varepsilon(g) \ge \bar{\mathrm{R}}_\varepsilon(g) \ge (1-2\varepsilon)\,\mathrm{RS}(g)'
      form: {exp: 1, kind: const, dir: reverse}
      refs: [BenDavidKothari18]
      note: 'Theorem 12 holds for partial $g$; only the converse needs totality.'
      conf: high
  lower:
    - stmt: '\mathrm{R}(\mathrm{COL}_n) = \Theta(\sqrt n) \quad\text{against}\quad \mathrm{RS}(\mathrm{COL}_n) = \Theta(1)'
      form: {kind: unbounded}
      witness: Collision
      refs: [BenDavidKothari18]
      note: 'A one-to-one and a two-to-one table differ in $\ge n/2$ of the $n$ cells, so every sabotaged input has $\ge n/2$ stars and a single random query finds one. [BenDavidKothari18, Sec. 1.4] give this example in exactly this role.'
      conf: high
  notes: |
    $\mathrm{R}$ is not bounded by any function of $\mathrm{RS}$ on partial
    functions.  The general obstruction, in the authors' words, is that *any*
    partial function all of whose domain inputs are far apart in Hamming
    distance has low sabotage complexity, whatever its randomized complexity;
    the collision problem is the clean instance.  Sabotage complexity is still
    a valid lower bound on $\mathrm{R}$ for partial $g$, and the composition
    theorem $\mathrm{R}(f\circ g^n) = \Omega(\mathrm{R}(f)\,\mathrm{RS}(g))$
    still holds -- it is just a weak one off the promise, which is what
    motivated $\chi$, $\bar\chi$ and $\mathrm{LR}$, each of which is
    $\Omega(\sqrt{\mathrm{R}})$ for partial $g$ and so cannot collapse this way.
  see_also: [RS, R, chibar, LR, Collision, comp-R, open-RS-vs-R]

