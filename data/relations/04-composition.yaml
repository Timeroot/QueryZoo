  to: noisyR
  setting: relation
  status: fails
  headline: '\mathrm{R} \text{ is unbounded in terms of } \mathrm{noisyR} \text{ for relations}'
  lower:
    - stmt: '\mathrm{noisyR}(\mathrm{AGREE}_n) = \Theta(1) \text{ while } \mathrm{R}(\mathrm{AGREE}_n) = \Theta(\sqrt n)'
      form: {kind: unbounded}
      witness: AgreeString
      refs: [BenDavidBlais20composition, GLSS19]
      conf: high
  notes: |
    The **relational barrier** of [BenDavidBlais20composition]. Since
    $\mathrm{R}(f\circ g) = \Omega(\mathrm{noisyR}(f)\mathrm{R}(g))$ holds for relational
    $f$ as well, any proof of $\mathrm{noisyR} = \tilde\Omega(\mathrm{R})$ must be a proof
    that *notices* $f$ is a function -- otherwise it would apply to [[AgreeString]], where
