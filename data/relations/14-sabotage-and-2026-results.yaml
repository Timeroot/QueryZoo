- id: recent-C-vs-R-total
  from: C
  to: R
  setting: total
  status: settled
  upper:
  - stmt: \mathrm{C}(f)=O(\mathrm{R}(f)^2)
    refs:
    - Nisan91
    conf: high
    form:
      exp: 2
      kind: const
  lower:
  - stmt: \mathrm{C}(f_n)=\Omega(\mathrm{R}(f_n)^2)
    refs:
    - AIK26
    conf: high
    form:
      exp: 2
      kind: const
    witness: AIKDNF
    note: 'Theorem 2.2: C=Θ(n²) and R≤R₁=O(n), with no logarithms.'
  - stmt: \mathrm{C}(f_n)=\Omega(\mathrm{R}(f_n)^2/\log^2\mathrm{R}(f_n))
    refs:
    - BenDavidKothari26
    conf: high
    form:
      exp: 2
      kind: const
      log: -2
    witness: Champion
    note: C=Ω(n²), R=O(n log n); R=Ω(n) by the universal C/R bound.
