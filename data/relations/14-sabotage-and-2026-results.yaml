      exp: 4
      kind: const
    note: C≤D=O(Q⁴).
  lower:
  - stmt: \mathrm{C}(F_n)=\Omega(\mathrm{Q}(F_n)^4/\log^{12}\mathrm{Q}(F_n))
    refs:
    - AIK26
    conf: high
    form:
      exp: 4
      kind: const
      log: -12
    witness: AIKCheatSheet
    note: 'Theorem 2.1: C=Ω(n²), Q=O(√n log³n), and the universal C=O(Q⁴) gives Q=Ω(√n).'
  - stmt: \mathrm{C}(f_n)=\widetilde\Omega(\mathrm{Q}(f_n)^4)
    refs:
    - BenDavidKothari26
    conf: high
    form:
      exp: 4
      kind: tilde
    witness: Champion
    note: Theorem 1 simultaneously separates R and Q from C.
  notes: Settled at the exponent, with logarithmic slack in the lower bound. Pabbaraju’s August paper
    proves the analogous approximate-degree result; it does not assert this quantum query upper bound.
