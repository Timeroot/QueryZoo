# ----------------------------------------------------- bs vs s (total)
- from: bs
  to: s
  setting: total
  status: gap
  upper:
    - stmt: \mathrm{bs}(f) \le 2\deg(f)^2 \le 2\,\mathrm{s}(f)^4
      form:
        exp: 4
        kind: const
      refs:
        - NS94
        - Huang19
      note: The first polynomial bound; Huang's theorem $\deg\le\mathrm{s}^2$ supplied the missing step
        in 2019.
      conf: high
    - stmt: \mathrm{bs}_\ell(f) = O(\mathrm{s}(f)^\ell)
      refs:
        - KenyonKutin04
      note: $\ell$-block sensitivity (blocks of size $\le \ell$); for $\ell = 2$ this is $O(\mathrm{s}^2)$.
      conf: high
  lower:
    - stmt: \mathrm{bs}(f_n) \ge \tfrac12\,\mathrm{s}(f_n)^2
      form:
        exp: 2
        kind: const
      witness: Rubinstein
      refs:
        - Rubinstein95
      note: 'On $n = 4k^2$ variables: $\mathrm{s}=\sqrt n$, $\mathrm{bs}=n/2$.'
      conf: high
    - stmt: \mathrm{bs}(f_n) \ge \tfrac23\,\mathrm{s}(f_n)^2 - \tfrac13\,\mathrm{s}(f_n)
      form:
        exp: 2
        kind: const
      refs:
        - AmbainisSun11
      note: Record constant for the classical quadratic construction.
      conf: high
    - stmt: \mathrm{bs}(f_j)=\Omega(\mathrm{s}(f_j)^{2.130825579397823})
      refs:
        - Prove2MeSensitivity26
      conf: high
      form:
        exp: 2.130825579397823
        kind: const
      witness: Prove2MeTournament
      note: The recorded decimal exponent is strictly below the exact endpoint $\alpha=\frac{\log(14055^8)}{\log(3738277295413674)}=2.1308255793978239\ldots$.
        The source supplies every ε>0 and arbitrarily large sensitivity; choose a fixed ε small enough.
        Direct separation.
  notes: |
    **The sensitivity-vs-block-sensitivity question** now has a superquadratic
    lower bound. [OpenAISensitivity26] refutes every universal quadratic bound;
    [Prove2MeSensitivity26] improves the lower endpoint to
    $2.1308255793978239\ldots$. The quartic universal upper bound remains.
    The exact source statement is $\mathrm{bs}\ge\mathrm{s}^{\alpha-\varepsilon}$
    for every $\varepsilon>0$ and arbitrarily large sensitivity. The displayed
    decimal exponent is rounded down to give a fixed-power separation.
    See [[open-bs-vs-s]] for the exact endpoint and its quantifiers.
  see_also: [s, bs, Rubinstein, open-bs-vs-s]

# ------------------------------------------------- bs vs R, s vs R etc.
- from: bs
  to: R
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{bs}(f) \le 3\,\mathrm{R}(f)'
      form: {exp: 1, kind: const}
      refs: [Nisan91, BdW02]
      note: |
        Theorem 16 of [BdW02]: the algorithm must spend $\ge 1/3$ expected queries in each
        sensitive block. Nisan's argument only ever compares the algorithm's behaviour on $x$
        and on $x^{B_i}$, and both of those are in $\mathrm{Dom}(f)$ by the definition of a
        sensitive block, so it never uses totality. Concretely: if the algorithm touched
        $B_i$ with probability $<1/3$ on $x$, its output distributions on $x$ and $x^{B_i}$
        would be too close for it to be correct on both.
      conf: high
  see_also: [bs, R, RC]

- from: bs
  to: R
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{bs}(f_n) = \Omega(\mathrm{R}(f_n))'
      form: {exp: 1, kind: const}
      witness: PARITY
      conf: high
  see_also: [bs, R, RC]

- from: RC
  to: C
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{RC}(f) = \Theta(\mathrm{fbs}(f)) \le \mathrm{C}(f)'
      form: {exp: 1, kind: exact}
      refs: [Aaronson08, KulkarniTal16]
      note: |
        Randomized certificate complexity is (up to constants) the LP relaxation of block
        sensitivity. For the inequality itself: query a full certificate of $x$ and reject.
        Every domain $y$ with $f(y)\ne f(x)$ must disagree with $x$ somewhere inside that
        certificate, so it is caught with probability $1$ — no totality needed.
      conf: high
  see_also: [RC, fbs, C, QC]

- from: RC
  to: C
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{RC}(f_n) = \Omega(\mathrm{C}(f_n))'
      form: {exp: 1, kind: const}
      witness: PARITY
      conf: high
  see_also: [RC, fbs, C, QC]

- from: C
  to: RC
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{C}(f) = O(\mathrm{RC}(f)^2)'
      form: {exp: 2, kind: const}
      refs: [Aaronson08, GSS16]
      conf: medium
  lower:
    - stmt: '\mathrm{C}(f_n) = \Omega(\mathrm{RC}(f_n)^2)'
      form: {exp: 2, kind: const}
      refs: [GSS16]
      witness: GSSfn
      conf: high
  see_also: [C, RC, fbs]

# ------------------------------------------------------ degenerate rows
- from: s
  to: D
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{s}(f) \le \mathrm{bs}(f) \le \mathrm{C}(f) \le \mathrm{D}(f)'
      form: {exp: 1, kind: exact}
      refs: [BdW02]
      note: |
        Proposition 1 + Theorem 9 of [BdW02]. The whole left column of the matrix is this chain,
        and every link of it survives a promise: see the partial-setting records for
        $\mathrm{s}\le\mathrm{bs}$ and $\mathrm{bs}\le\mathrm{C}$, and the *relational* record
        for $\mathrm{C}\le\mathrm{D}$.
      conf: high
  see_also: [s, bs, C, D, PARITY, ADDR]

- from: s
  to: D
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{s}(f_n) = \mathrm{D}(f_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  notes: |
    Absolute lower bound in the same family: if $f$ depends on all $n$
    variables then $\mathrm{s}(f) \ge \tfrac12\log n - \tfrac12\log\log n +
    \tfrac12$ [Simon83, BdW02, Thm 1], tight up to the $\log\log$ term for the
    monotone address function [Wegener85]. Similarly
    $\deg(f) \ge \log n - O(\log\log n)$ [NS94, BdW02, Thm 5], tight for
    [[ADDR]].
  see_also: [s, bs, C, D, PARITY, ADDR]

# ---------------------------------------------------- subcube partitions
# SP had no relation records at all: the pair matrix showed D, R and Q as
# only linearly above it, with no upper bound on file, when in fact two of
# the three cells are settled.

- from: SP
  to: D
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{SP}(f) \le \mathrm{D}(f)'
      form: {exp: 1, kind: exact}
      refs: [KRS15]
      note: |
        The leaves of a depth-$\mathrm{D}$ decision tree partition $\mathrm{Dom}(f)$
        into subcubes of codimension at most $\mathrm{D}$, each monochromatic. So the
        subcube-partition model is at least as strong as the decision-tree model, and
        the interesting question is by how much -- see the reverse pair.
      conf: high
  see_also: [SP, D, C, UC]

- from: SP
  to: D
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{SP}(\vee_n) = \mathrm{D}(\vee_n) = n'
      form: {exp: 1, kind: exact}
      witness: OR
      note: |
        $\vee_n$ has the greedy partition ``first one at position $i$'' plus the
        all-zeros point, whose deepest cell has codimension $n$; and no partition can
        do better, because the all-zeros input sits in a monochromatic subcube only if
        every coordinate is fixed.
      conf: high
  see_also: [SP, D, OR]

- from: C
  to: SP
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{C}(f) \le \mathrm{SP}(f)'
      form: {exp: 1, kind: exact}
      refs: [KRS15]
      note: |
        The cell of the partition containing $x$ is monochromatic, so the coordinates
        it fixes -- at most $\mathrm{SP}(f)$ of them -- certify $f(x)$: any $y \in
        \mathrm{Dom}(f)$ agreeing with $x$ there lies in the same cell. Nothing in the
        argument uses totality.
      conf: high
  see_also: [C, SP, UC, D]

- from: C
  to: SP
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{C}(\oplus_n) = \mathrm{SP}(\oplus_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  see_also: [C, SP, PARITY]

- from: SP
  to: UC
  setting: partial
  status: settled
  upper:
    - stmt: '\mathrm{SP}(f) \le \mathrm{UC}(f)'
      form: {exp: 1, kind: exact}
      note: |
        An unambiguous $1$-certificate family and an unambiguous $0$-certificate family
        are each a partition of their own side, so together they partition
        $\mathrm{Dom}(f)$ into subcubes of codimension at most $\mathrm{UC}(f)$.
        See the reverse cell: this is in fact an equality, not just a bound.
      conf: high
  see_also: [SP, UC, UCmin, C]

- from: UC
  to: SP
  setting: partial
  status: settled
  headline: 'Unambiguous certificate complexity and subcube partition complexity are the *same* measure.'
  upper:
    - stmt: '\mathrm{UC}(f) \le \mathrm{SP}(f)'
      form: {exp: 1, kind: exact}
      note: |
        Take an optimal partition of $\mathrm{Dom}(f)$ into monochromatic subcubes of
        codimension at most $\mathrm{SP}(f)$ and split it by colour.  Every subcube is
        monochromatic, so each one *is* a certificate; the $1$-subcubes cover
        $f^{-1}(1)$ disjointly and the $0$-subcubes cover $f^{-1}(0)$ disjointly, which
        is exactly unambiguity on each side.  Hence
        $\mathrm{UC}^0, \mathrm{UC}^1 \le \mathrm{SP}$ and so $\mathrm{UC} \le \mathrm{SP}$.
        Nothing here asks the two colour classes to be individually minimal, which is
        why the argument goes through and $\mathrm{UC}(f) = \mathrm{SP}(f)$ for every
        $f$, total or partial.  The zoo keeps the two ids separate because the
        literature does -- $\mathrm{SP}$ is the object that lifts to the partition
        number in communication complexity, $\mathrm{UC}$ the one that appears in
        low-sensitivity constructions -- but no function can separate them.
      conf: high
  lower:
    - stmt: '\mathrm{UC}(\oplus_n) = \mathrm{SP}(\oplus_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  notes: |
    The consequence worth remembering is that $\mathrm{D}$ vs $\mathrm{SP}$ and
    $\mathrm{D}$ vs $\mathrm{UC}$ are literally the same open problem, and the
    one-sided $\mathrm{UC}_{\min}$ -- which is *not* an equality with anything
    partition-flavoured -- is where the interesting behaviour lives.
  see_also: [UC, SP, UCmin, C, D]

- from: SP
  to: UC
  setting: total
  status: settled
  lower:
    - stmt: '\mathrm{SP}(\oplus_n) = \mathrm{UC}(\oplus_n) = n'
      form: {exp: 1, kind: exact}
      witness: PARITY
      conf: high
  see_also: [SP, UC, PARITY]

- from: D
  to: SP
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{D}(f) \le \mathrm{C}^{0}(f)\,\mathrm{C}^{1}(f) \le \mathrm{SP}(f)^2'
      form: {exp: 2, kind: const}
      refs: [BdW02, AKK16]
      note: |
        The classical $\mathrm{D} \le \mathrm{C}^{0}\mathrm{C}^{1}$ [BdW02, Thm 9]
        composed with $\mathrm{C} \le \mathrm{SP}$ above.
      conf: high
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega(\mathrm{SP}(f_n)^2)'
      form: {exp: 2, kind: tilde}
      refs: [AKK16]
      note: |
        [AKK16] build a total $f$ with a nearly quadratic gap, by alternating function
        composition with the cheat-sheet construction of [ABK16]. This is essentially
        optimal given the $\mathrm{D} = O(\mathrm{SP}^2)$ above, and it improves the
        power-$1.5$ query separation underlying [GPW18]. Lifted, it is the nearly
        quadratic separation between deterministic communication complexity and the
        log of the partition number.
      conf: high
  see_also: [D, SP, R, Q, C]

- from: R
  to: SP
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{R}(f) \le \mathrm{D}(f) = O(\mathrm{SP}(f)^2)'
      form: {exp: 2, kind: const}
      refs: [BdW02, AKK16]
      conf: high
  lower:
    - stmt: '\mathrm{R}(f_n) = \widetilde\Omega(\mathrm{SP}(f_n)^2)'
      form: {exp: 2, kind: tilde}
      refs: [AKK16]
      note: |
        The [AKK16] separation is already against *randomized* query complexity, so the
        randomized cell is settled at the same exponent as the deterministic one. The
        first separation of $\mathrm{R}$ from the subcube-partition model -- answering
        Friedgut, Kahn and Wigderson -- is [KRS15].
      conf: high
  see_also: [R, SP, D, AKK16]

- from: Q
  to: SP
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{Q}(f) \le \mathrm{D}(f) = O(\mathrm{SP}(f)^2)'
