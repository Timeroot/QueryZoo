# =====================================================================
# RELATIONS, part 1: the classical core (D, R0, R, C, bs, s).
#
# SCHEMA -- each entry says everything known about bounding `from` in
# terms of `to`, in one `setting`:
#
#   from:     measure id   (the LHS, i.e. the matrix ROW)
#   to:       measure id   (the RHS, i.e. the matrix COLUMN)
#   setting:  total | partial | relation
#   status:   settled | gap | open | fails      (see data/site.yaml)
#   upper:    list of {stmt, form, refs, note, conf, tight, todo}
#             each `stmt` is a LaTeX inequality of the form
#                 M1(f) <= <function of M2(f)>
#             holding for ALL f in the setting. Include constants and
#             log factors -- that is the whole point of this file.
#   lower:    list of {stmt, form, witness, refs, note, conf}
#             each `stmt` asserts a FAMILY f_n with
#                 M1(f_n) >= <function of M2(f_n)>.
#             `witness` is a function id from data/functions/*.yaml.
#   notes:    free markdown
#   see_also: ids of measures / concepts / functions
#
# `form` is the machine-readable shadow of `stmt`, and the only field
# build.py reasons with (tightness classification, transitive closure):
#
#   form: {exp: 2, log: 1, kind: const}     # = O(M2^2 log M2)
#
#   exp:   the exponent (default 1)
#   log:   how many log factors (default 0)
#   kind:  exact     -- the inequality as written has NO hidden constant
#          const     -- true up to a constant factor (O / explicit constant)
#          theta     -- tight to constant factors in BOTH directions
#          tilde     -- true up to unspecified polylog factors (O~ / Omega~)
#          exp       -- 2^Theta(M2): exponentially related
#          log       -- log(M2): logarithmically related
#          unbounded -- no bound at all: M1 is not O(M2^k) for any k.
#                       Lower bullets only -- it is a statement about what
#                       fails, and the witness family is the proof.
#   dir:   reverse -- this bullet actually bounds `to` in terms of `from`.
#          Records often park the reverse-direction fact next to the
#          forward one; this flag files it under the reverse pair instead
#          of silently claiming it as a bound on `from`.
#
# Add `form` only when the statement really is a pointwise bound between
# `from` and `to`. Chains through a third measure, statements with a free
# parameter, and prose get no `form` and are simply not reasoned with.
#
# `conf` in {high, medium, low} records how sure the *transcription* is,
# not how sure the community is. `todo` marks a hole to be filled.
#
# Where an entry has no `upper`, the pair page says "no upper bound of
# this form is known"; where it has `status: fails`, it says "provably
# no such bound exists".
# =====================================================================

relations:

# ------------------------------------------------------- D vs R (total)
- from: D
  to: R
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{D}(f) \le 27\,\mathrm{R}(f)^3'
      form: {exp: 3, kind: const}
      refs: [Nisan91, BdW02]
      note: 'Corollary 3 of [BdW02]. Proof: $\mathrm{D}\le\mathrm{bs}^3$ and $\mathrm{bs}\le 3\mathrm{R}$.'
      conf: high
    - stmt: '\mathrm{D}(f) \le \mathrm{C}^{(1)}(f)\cdot \mathrm{bs}(f) \le \mathrm{s}(f)\,\mathrm{bs}(f)^2'
      refs: [BBCMdW01, Nisan91]
      note: 'The route the cubic bound goes through; sometimes much better than $27\mathrm{R}^3$.'
      conf: high
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega\big(\mathrm{R}(f_n)^2\big)'
      form: {exp: 2, kind: tilde}
      witness: pointer
      refs: [ABBLSS17]
      note: 'Quadratic; whether the truth is $2$ or $3$ is a long-standing open problem.'
      conf: high
  notes: |
    The gap $[2,3]$ has been open since Nisan 1991 -- see [[open-D-vs-R]]. Note
    the constant $27$ is not believed to be optimal either; for **monotone**
    $f$, $\mathrm{D}(f) = O(\mathrm{R}(f)^2)$ [BdW02, Cor. 6]. The two
    neighbouring error models are *settled* at exponent $2$: $\mathrm{R}_0$ by
    the cell below, and $\mathrm{R}^1$ by $\mathrm{D} = O((\mathrm{R}^1)^2)$
    [Nisan91], tight on the same pointer functions. Bounded two-sided error is
    the only one of the three still open.
  see_also: [R, D, R1, pointer, monotone, open-D-vs-R]

# ------------------------------------------------------ D vs R0 (total)
- from: D
  to: R0
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{D}(f) = O(\mathrm{R}_0(f)^2)'
      form: {exp: 2, kind: const}
      refs: [BdW02, Nisan91]
      conf: medium
      note: 'Via $\mathrm{C}(f)\le \mathrm{R}_0(f)$ and $\mathrm{D}(f)\le \mathrm{C}^{(0)}(f)\,\mathrm{C}^{(1)}(f)$ [Tardos89, BlumImpagliazzo87, HartmanisHemachandra87]: a zero-error algorithm must output a certificate on every input.'
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega\big(\mathrm{R}_0(f_n)^2\big)'
      form: {exp: 2, kind: tilde}
      witness: pointer
      refs: [ABBLSS17]
  notes: |
    Settled up to $n^{o(1)}$: the pointer function of [ABBLSS17] matches the
    quadratic upper bound. Historically this was the first cell where the
    "obvious" bound turned out to be tight.
  see_also: [R0, C, pointer]

# ------------------------------------------------------ D vs R1 (total)
- from: D
  to: R1
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{D}(f) = O\big(\mathrm{R}^{1}(f)^2\big)'
      form: {exp: 2, kind: const}
      refs: [Nisan91, ABBLSS17]
      note: |
        Nisan's quadratic simulation of *one-sided* error, quoted in the
        introduction of [ABBLSS17]. It is the one-sided analogue of
        $\mathrm{D} = O(\mathrm{R}_0^2)$ and, unlike the two-sided
        $\mathrm{D} \le 27\mathrm{R}^3$, it is known to be tight.
      conf: high
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega\big(\mathrm{R}^{1}(f_n)^2\big)'
      form: {exp: 2, kind: tilde}
      witness: pointer
      refs: [ABBLSS17]
      note: 'The variant $g_{m,m}$, whose $\widetilde O(\sqrt n)$ algorithm is one-sided [ABBLSS17, Thm 12].'
      conf: high
  notes: |
    Settled up to $n^{o(1)}$. Worth reading against [[open-D-vs-R]]: allowing
    error on *both* sides is the only thing that keeps the deterministic
    simulation at a cube rather than a square.
  see_also: [D, R1, R, R0, pointer, open-D-vs-R]

# ----------------------------------------------------- R0 vs R (total)
- from: R0
  to: R
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{R}_0(f) = O\big(\mathrm{R}(f)^2\log \mathrm{R}(f)\big)'
      form: {exp: 2, log: 1, kind: const}
      refs: [KulkarniTal16]
      note: 'The fine-grained form of the exponent-$2$ cell in the matrix. Improves $\mathrm{R}_0(f)=O(\mathrm{R}(f)^2\log n)$ [Midrijanis05]: the $\log n$ becomes $\log \mathrm{R}$.'
      conf: high
      tight: 'up to the log factor'
    - stmt: '\mathrm{R}_0(f) \le \mathrm{D}(f) \le 27\,\mathrm{R}(f)^3'
      form: {exp: 3, kind: const}
      refs: [Nisan91, BdW02]
      note: 'The bound you get for free; the cubic version is certainly correct.'
      conf: high
    - stmt: '\mathrm{R}_0(f) = O\big(\mathrm{EC}(f)^2\big) \text{ and } \mathrm{EC}(f)\le \mathrm{C}(f)\le \mathrm{EC}(f)^2'
      refs: [GJKKLSSV17]
      note: 'Expectational certificate complexity is the "quadratically tight" handle on $\mathrm{R}_0$; also $\mathrm{FC}(f)\le\mathrm{EC}(f)=O(\mathrm{FC}(f)^{3/2})$.'
      conf: high
    - stmt: '\mathrm{C}(f)\le \mathrm{R}_0(f) \le \mathrm{C}(f)^2'
      refs: [GJKKLSSV17]
      conf: high
    - stmt: '\mathrm{R}_0(f) = O\big(\mathrm{Q}(f)^2\,\mathrm{Q}_0(f)\log n\big)'
      refs: [Aaronson08]
      note: 'A genuinely different route, through quantum measures.'
      conf: high
  lower:
    - stmt: '\mathrm{R}_0(f_n) = \widetilde\Omega\big(\mathrm{R}(f_n)^2\big)'
      form: {exp: 2, kind: tilde}
      witness: pointer
      refs: [ABBLSS17]
      conf: high
  notes: |
    Amplification is *not* what separates these two: $\mathrm{R}_0$ can be
    quadratically larger than $\mathrm{R}$ because zero error forces the
    algorithm to certify its answer on *every* input, and certificates can be
    large where the bounded-error algorithm only needs to be right on average.
    For **relations** (search problems) the two collapse -- see the
    partial/relational file.
  see_also: [EC, C, psD, R0]

# ------------------------------------------------------ D vs C (total)
- from: D
  to: C
  setting: total
  status: settled
  upper:
    - stmt: '\mathrm{D}(f) \le \mathrm{C}^{(0)}(f)\cdot \mathrm{C}^{(1)}(f) \le \mathrm{C}(f)^2'
      form: {exp: 2, kind: exact}
      refs: [Tardos89, BlumImpagliazzo87, HartmanisHemachandra87, BdW02]
      note: 'Corollary 2 of [BdW02]; proved three times independently around 1987-89.'
      conf: high
    - stmt: '\mathrm{D}(f) \le \mathrm{C}^{(1)}(f)\cdot \mathrm{bs}(f)'
      refs: [BBCMdW01, BdW02]
      note: 'Theorem 11 of [BdW02] -- the "repeatedly guess a consistent 1-certificate" algorithm. Often sharper than $\mathrm{C}^2$.'
      conf: high
    - stmt: '\mathrm{D}(f) \le \mathrm{C}^{(1)}(f)\cdot \deg(f)'
      refs: [BdW02]
      note: 'Theorem 14 of [BdW02]; incomparable to the previous line.'
      conf: high
  lower:
    - stmt: '\mathrm{D}(f_n) = \mathrm{C}(f_n)^2'
      form: {exp: 2, kind: exact}
      witness: ANDOR
      note: '$\wedge_k\circ\vee_k$ on $n=k^2$ bits: $\mathrm{D}=n$, $\mathrm{C}=\sqrt n$.'
      conf: high
  see_also: [C, C0, C1, ANDOR]

# ----------------------------------------------------- D vs bs (total)
- from: D
  to: bs
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{D}(f) \le \mathrm{s}(f)\,\mathrm{bs}(f)^2 \le \mathrm{bs}(f)^3'
      form: {exp: 3, kind: exact}
      refs: [Nisan91, BBCMdW01, BdW02]
      note: 'Corollary 1 of [BdW02].'
      conf: high
    - stmt: '\mathrm{D}(f) \le \mathrm{bs}(f)\cdot \deg(f)'
      refs: [Midrijanis04]
      note: 'Midrijanis'' inequality -- the workhorse behind $\mathrm{D}=O(\deg^3)$, $\mathrm{D}=O(\widetilde{\deg}^4)$ and $\mathrm{D}=O(\mathrm{Q}^4)$.'
      conf: high
  lower:
    - stmt: '\mathrm{D}(f_n) = \mathrm{bs}(f_n)^2'
      form: {exp: 2, kind: exact}
      witness: ANDOR
      conf: high
  notes: |
    **Open problem** (Open problem 2 of [BdW02]): is
    $\mathrm{D}(f) = O(\mathrm{bs}(f)^2)$? This would be optimal, witnessed by
    $\wedge\circ\vee$.
  see_also: [bs, ANDOR, open-D-vs-bs]

# ------------------------------------------------------ D vs s (total)
- from: D
  to: s
  setting: total
  status: gap
  upper:
    - stmt: '\mathrm{D}(f) \le \mathrm{bs}(f)\cdot\deg(f) \le 2\deg(f)^3 \le 2\,\mathrm{s}(f)^6'
      form: {exp: 6, kind: const}
      refs: [Midrijanis04, NS94, Huang19]
      note: 'The post-Huang chain. Before 2019 no polynomial bound was known at all -- this was *the* sensitivity conjecture.'
      conf: high
  lower:
    - stmt: '\mathrm{D}(f_n) = \widetilde\Omega\big(\mathrm{s}(f_n)^3\big)'
      form: {exp: 3, kind: tilde}
      refs: [BHT17]
      witness: BHTfn
      note: 'Cubic, from low-sensitivity functions built out of unambiguous certificates.'
      conf: high
  notes: |
    The $[3,6]$ gap is the largest remaining gap in the whole total-function
    matrix, and it propagates: every row's $\mathrm{s}$ column inherits it.
  see_also: [s, Huang19, sensitivity-conjecture, open-D-vs-s]

