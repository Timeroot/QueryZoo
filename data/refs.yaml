# =====================================================================
# Bibliography for the Query Complexity Zoo.
#
# Every entry is keyed by a short citation key (the thing you write in
# `refs: [...]` lists elsewhere in the data files).
#
# Fields (all optional except `title`):
#   authors : list of "Lastname, F." strings (or free text)
#   title   : string
#   venue   : conference / journal string
#   year    : integer
#   arxiv   : arXiv identifier, e.g. "2010.12629" or "quant-ph/9802049"
#   eccc    : ECCC report id, e.g. "TR16-098"
#   doi     : DOI
#   url     : any other canonical URL (used if arxiv/doi absent)
#   note    : free text shown under the entry
#   aliases : other keys that resolve to this entry (e.g. the "[ABB+17]"
#             style labels used in the source papers)
#
# Keys follow the usual "first letters of surnames + 2-digit year"
# convention used in the literature, so they should look familiar.
# =====================================================================

# ---------------------------------------------------------------- surveys
BdW02:
  authors: [Buhrman, H., de Wolf, R.]
  title: "Complexity measures and decision tree complexity: a survey"
  venue: "Theoretical Computer Science 288(1):21-43"
  year: 2002
  doi: "10.1016/S0304-3975(01)00144-X"
  url: "https://homepages.cwi.nl/~rdewolf/publ/qc/dectree.pdf"
  note: "The classical starting point. Source of most of the exact constants recorded in this zoo for the deterministic/randomized/quantum-vs-degree relations."

HKP11:
  authors: [Hatami, P., Kulkarni, R., Pankratov, D.]
  title: "Variations on the Sensitivity Conjecture"
  venue: "Theory of Computing Library, Graduate Surveys 4"
  year: 2011
  doi: "10.4086/toc.gs.2011.004"
  note: "Survey of s vs bs vs C vs deg, pre-Huang."

BT22:
  authors: [Bun, M., Thaler, J.]
  title: "Approximate Degree in Classical and Quantum Computing"
  venue: "Foundations and Trends in Theoretical Computer Science 15(3-4)"
  year: 2022
  doi: "10.1561/0400000107"
  note: "Book-length survey of approximate degree; the reference for everything deg-tilde."

ODonnell14:
  authors: [O'Donnell, R.]
  title: "Analysis of Boolean Functions"
  venue: "Cambridge University Press"
  year: 2014
  url: "https://arxiv.org/abs/2105.10386"
  note: "Standard reference for influence, noise sensitivity, Fourier weight, spectral norm."

Ambainis18survey:
  authors: [Ambainis, A.]
  title: "Understanding Quantum Algorithms via Query Complexity"
  venue: "Proc. ICM 2018"
  year: 2018
  arxiv: "1712.06349"

Hamoudi25:
  authors: [Hamoudi, Y.]
  title: "A Brief Introduction to Quantum Query Complexity"
  year: 2025
  arxiv: "2508.08852"

IJKKKSWW23:
  aliases: ["IJK+23", "Iyer23"]
  authors: [Iyer, V., Jain, S., Kothari, R., Kovacs-Deak, M., Kumar, V. M., Schaeffer, L., Wang, D., Whitmeyer, M.]
  title: "On the Rational Degree of Boolean Functions and Applications"
  year: 2023
  arxiv: "2310.08004"
  note: "Table 1 of this paper is the seed of the big matrix in this zoo. Introduces the rdeg column."

# ------------------------------------------------- classical foundations
Nisan91:
  authors: [Nisan, N.]
  title: "CREW PRAMs and Decision Trees"
  venue: "SIAM Journal on Computing 20(6):999-1007"
  year: 1991
  doi: "10.1137/0220062"
  note: "Introduces block sensitivity; proves C <= s*bs, bs <= 3R, D <= 27 R^3, and C = s = bs for monotone f."

NS94:
  authors: [Nisan, N., Szegedy, M.]
  title: "On the degree of Boolean functions as real polynomials"
  venue: "Computational Complexity 4:301-313"
  year: 1994
  doi: "10.1007/BF01263419"
  note: "bs <= 2 deg^2 and bs <= 6 deg-tilde^2; D = O(deg^8); the sqrt(n) approximating polynomial for OR."

NisanSmolensky:
  aliases: ["NisanSmolensky94", "NS94smolensky"]
  authors: [Nisan, N., Smolensky, R.]
  title: "Unpublished; proof reproduced in [BdW02]"
  year: 1994
  note: "D(f) <= deg(f)^2 bs(f) <= 2 deg(f)^4."

Midrijanis04:
  authors: ["Midrijanis, G."]
  title: "Exact quantum query complexity for total Boolean functions"
  year: 2004
  arxiv: "quant-ph/0403168"
  note: "D(f) = O(deg(f)^3), improving Nisan-Smolensky's deg^4."

BBCMdW01:
  authors: [Beals, R., Buhrman, H., Cleve, R., Mosca, M., de Wolf, R.]
  title: "Quantum Lower Bounds by Polynomials"
  venue: "Journal of the ACM 48(4):778-797"
  year: 2001
  arxiv: "quant-ph/9802049"
  note: "The polynomial method. deg <= 2 QE, deg-tilde <= 2 Q, D <= C1*bs, D = O(deg-tilde^6)."

Simon83:
  authors: [Simon, H.-U.]
  title: "A tight Omega(log log n) bound on the time for parallel RAM's to compute nondegenerate Boolean functions"
  venue: "FCT"
  year: 1983
  note: "s(f) >= (log n - log log n)/2 for f depending on all n variables."

Rubinstein95:
  aliases: ["Rub95"]
  authors: [Rubinstein, D.]
  title: "Sensitivity vs. block sensitivity of Boolean functions"
  venue: "Combinatorica 15:297-299"
  year: 1995
  doi: "10.1007/BF01200762"
  note: "First quadratic separation bs(f) = s(f)^2/2."

KenyonKutin04:
  authors: [Kenyon, C., Kutin, S.]
  title: "Sensitivity, block sensitivity, and l-block sensitivity of Boolean functions"
  venue: "Information and Computation 189(1):43-53"
  year: 2004
  doi: "10.1016/j.ic.2002.12.001"
  note: "bs_l(f) = O(s(f)^l); in particular bs_2 = O(s^2)."

AmbainisSun11:
  authors: [Ambainis, A., Sun, X.]
  title: "New separation between s(f) and bs(f)"
  year: 2011
  eccc: "TR11-116"
  arxiv: "1108.3494"
  note: "bs(f) >= (2/3) s(f)^2 - (1/3) s(f); the best known constant in the bs-vs-s separation."

Chakraborty11:
  authors: [Chakraborty, S.]
  title: "On the sensitivity of cyclically-invariant Boolean functions"
  venue: "Discrete Mathematics and Theoretical Computer Science 13(4)"
  year: 2011
  note: "Cyclically invariant function with s = Theta(bs^{1/3})... see also the 'minterm' constructions."

Tardos89:
  authors: [Tardos, G.]
  title: "Query complexity, or why is it difficult to separate NP^A cap coNP^A from P^A by random oracles A?"
  venue: "Combinatorica 9:385-392"
  year: 1989
  doi: "10.1007/BF02125350"
  note: "D(f) <= C0(f) * C1(f). Independently by Blum-Impagliazzo and Hartmanis-Hemachandra."

BlumImpagliazzo87:
  authors: [Blum, M., Impagliazzo, R.]
  title: "Generic oracles and oracle classes"
  venue: "FOCS 1987"
  year: 1987
  note: "Independent proof of D <= C0*C1."

HartmanisHemachandra87:
  aliases: ["HH91", "HartmanisHemachandra91"]
  authors: [Hartmanis, J., Hemachandra, L.]
  title: "One-way functions, robustness, and non-isomorphism of NP-complete sets"
  venue: "Structure in Complexity Theory"
  year: 1987
  note: "Independent proof of D <= C0*C1."

SaksWigderson86:
  authors: [Saks, M., Wigderson, A.]
  title: "Probabilistic Boolean decision trees and the complexity of evaluating game trees"
  venue: "FOCS 1986"
  year: 1986
  doi: "10.1109/SFCS.1986.44"
  note: "R0(NAND-tree) = Theta(n^{0.7537...}); the alpha = log_2((1+sqrt(33))/4) exponent."

Santha95:
  authors: [Santha, M.]
  title: "On the Monte Carlo Boolean decision tree complexity of read-once formulae"
  venue: "Random Structures & Algorithms 6(1):75-87"
  year: 1995
  note: "Bounded-error version of Saks-Wigderson: R(NAND-tree) = Theta(n^{0.7537...})."

Snir85:
  authors: [Snir, M.]
  title: "Lower bounds on probabilistic linear decision trees"
  venue: "Theoretical Computer Science 38:69-82"
  year: 1985
  note: "The randomized algorithm for the AND-OR / NAND tree."

Turan84:
  authors: ["Turan, G."]
  title: "The critical complexity of graph properties"
  venue: "Information Processing Letters 18:151-153"
  year: 1984
  note: "s(f) >= ceil((n+1)/2) for non-constant symmetric f."

NisanWigderson95:
  aliases: ["NW95"]
  authors: [Nisan, N., Wigderson, A.]
  title: "On rank vs. communication complexity"
  venue: "Combinatorica 15:557-565"
  year: 1995
  doi: "10.1007/BF01192527"
  note: "Iterating Kushilevitz's 6-variable function: deg(f) = bs(f)^{1.63...}, i.e. exponent log_6 ... . Best known deg-vs-bs and deg-vs-s separation."

vzGathenRoche97:
  authors: [von zur Gathen, J., Roche, J. R.]
  title: "Polynomials with two values"
  venue: "Combinatorica 17(3):345-362"
  year: 1997
  note: "deg(f) = n - O(n^{0.548}) for all non-constant symmetric f."

Paturi92:
  authors: [Paturi, R.]
  title: "On the degree of polynomials that approximate symmetric Boolean functions"
  venue: "STOC 1992"
  year: 1992
  doi: "10.1145/129712.129758"
  note: "Tight characterisation of deg-tilde for symmetric functions."

Huang19:
  authors: [Huang, H.]
  title: "Induced subgraphs of hypercubes and a proof of the Sensitivity Conjecture"
