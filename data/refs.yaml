  venue: "Combinatorica 15:557-565"
  year: 1995
  doi: "10.1007/BF01192527"
  note: "Iterating Kushilevitz's 6-variable function: deg(f) = bs(f)^{1.63...}, i.e. exponent log_6 ... . Best known deg-vs-bs and deg-vs-s separation."

vzGathenRoche97:
  authors: [von zur Gathen, J., Roche, J. R.]
  title: "Polynomials with two values"
  venue: "Combinatorica 17(3):345-362"
  year: 1997
  note: "deg(f) = n - O(n^{0.548}) for all non-constant symmetric f."

Paturi92:
  authors: [Paturi, R.]
  title: "On the degree of polynomials that approximate symmetric Boolean functions"
  venue: "STOC 1992"
  year: 1992
  doi: "10.1145/129712.129758"
