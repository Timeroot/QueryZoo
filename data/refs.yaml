# Filling the empty columns: postselection and rational approximation, robust
# quantum queries, conical juntas, recursive majority, critical block sensitivity.
# ---------------------------------------------------------------------------

Newman64:
  authors: ["Newman, D. J."]
  title: "Rational approximation to |x|"
  venue: "Michigan Mathematical Journal 11(1):11-14"
  year: 1964
  note: "The origin of the log-degree rational approximation to the absolute value, hence of rdeg(MAJ) = O(log n). Mahadev-de Wolf reprove it from a postselected quantum algorithm."

Aaronson05postbqp:
  authors: ["Aaronson, S."]
  title: "Quantum computing, postselection, and probabilistic polynomial-time"
  venue: "Proceedings of the Royal Society A 461(2063):3473-3482"
  year: 2005
  arxiv: "quant-ph/0412187"
  note: "PostBQP = PP. Also the first postselected query algorithm for majority, later improved to optimal by Mahadev-de Wolf."

HoyerSpalek05:
  authors: ["Hoyer, P.", "Spalek, R."]
  title: "Lower bounds on quantum query complexity"
  venue: "Bulletin of the EATCS 87:78-103"
  year: 2005
  arxiv: "quant-ph/0509153"
  note: "Survey. Section 5 states the certificate complexity barrier in the form Adv(f) <= sqrt(C0 C1) and points out that it is the property-testing promise problems -- both certificate complexities O(1) -- on which the positive adversary collapses."

Sherstov13robust:
  authors: ["Sherstov, A. A."]
  title: "Making polynomials robust to noise"
  venue: "Theory of Computing 9:593-615 (STOC 2012)"
  year: 2013
  note: "An explicit construction of the degree-O(n) robust polynomial that Buhrman-Newman-Rohrig-de Wolf had obtained only via a quantum algorithm."

GoosJayram16:
  authors: ["Goos, M.", "Jayram, T. S."]
  title: "A composition theorem for conical juntas"
  venue: "CCC 2016, LIPIcs 50, 5:1-5:16"
  year: 2016
  eccc: "TR15-167"
  note: "Degree lower bounds for conical juntas computing recursively defined functions: Omega~(n^0.753) for the binary AND-OR tree (answering Beame-Lawry) and Omega(2.59^h) for the height-h 3-majority tree -- the latter is still the best known randomized lower bound for recursive majority."

GLMWZ16:
  authors: ["Goos, M.", "Lovett, S.", "Meka, R.", "Watson, T.", "Zuckerman, D."]
  title: "Rectangles are nonnegative juntas"
  venue: "SIAM Journal on Computing 45(5):1835-1869 (STOC 2015)"
  year: 2016
  note: "The junta theorem: a rectangle in the domain of g^n is approximated by a conical d-junta. This is what makes conical junta degree the right query-side measure for randomized lifting."

MNSSTX16:
  authors: ["Magniez, F.", "Nayak, A.", "Santha, M.", "Sherman, J.", "Tardos, G.", "Xiao, D."]
  title: "Improved bounds for the randomized decision tree complexity of recursive majority"
  venue: "Random Structures & Algorithms 48(3):612-638 (ICALP 2011)"
  year: 2016
  arxiv: "1309.7565"
  eccc: "TR10-192"
  note: "R_0(3-MAJ_h) <= 1.007 * 2.64944^h by an interleaving of two recursive algorithms (Thm 4.2), and R_delta(3-MAJ_h) >= (1/2 - delta) * 2.57143^h. The lower bound has since been superseded by Goos-Jayram's Omega(2.59^h); the upper bound stands."

JayramKumarSivakumar03:
  authors: ["Jayram, T. S.", "Kumar, R.", "Sivakumar, D."]
  title: "Two applications of information complexity"
  venue: "STOC 2003, 673-682"
  year: 2003
  note: "The (1-2delta)(7/3)^h lower bound for recursive majority, and the information-complexity method that every later improvement refines."

Leonardos13:
  authors: ["Leonardos, N."]
  title: "An improved lower bound for the randomized decision tree complexity of recursive majority"
  venue: "ICALP 2013, LNCS 7965, 696-708"
  year: 2013
  note: "(1-2delta) * 2.55^h, between Jayram-Kumar-Sivakumar and Magniez et al."

Urquhart87:
  authors: ["Urquhart, A."]
  title: "Hard examples for resolution"
  venue: "Journal of the ACM 34(1):209-219"
  year: 1987
  doi: "10.1145/7531.8928"
  note: "The Tseitin contradictions on bounded-degree expanders: the first exponential resolution size lower bound for a natural family, hence 2^{Omega(n)} decision-tree size for the corresponding false-vertex search problem."

HuynhNordstrom12:
  authors: ["Huynh, T.", "Nordstrom, J."]
  title: "On the virtue of succinct proofs: amplifying communication complexity hardness to time-space trade-offs in proof complexity"
  venue: "STOC 2012, 233-248"
  year: 2012
  note: "Where critical block sensitivity was introduced, as the query-side measure that survives lifting for search problems with many valid answers."

# --- Pinning down the partition bound and its relaxation -------------
# (rprt: getting the LP right, and the D-vs-prt separations.)

AKK16:
  authors: ["Ambainis, A.", "Kokainis, M.", "Kothari, R."]
  title: "Nearly optimal separations between communication (or query) complexity and partitions"
  venue: "CCC 2016, 4:1-4:14"
  year: 2016
  arxiv: "1512.01210"
  note: "A total f with D(f) = Omega~(SP(f)^2), hence also D(f) = Omega~(prt(f)^2). Nearly matches D = O(SP^2) / D = O(prt_0 * prt_{1/3})."

HarshaJainRadhakrishnan16:
  authors: ["Harsha, P.", "Jain, R.", "Radhakrishnan, J."]
  title: "Partition bound is quadratically tight for product distributions"
  venue: "ICALP 2016, 135:1-135:13"
  year: 2016
  arxiv: "1512.01968"
  eccc: "TR15-199"
  note: "Under any product distribution mu, D^mu_{0.49}(f) = O((prt_{1/8}(f) * log prt_{1/8}(f))^2) -- so the partition bound is quadratically tight for product distributions, in both the communication and the query setting. The 2015 version stated this for the *relaxed* partition bound; the published version corrects it to prt."

Gavinsky17quadratic:
  authors: ["Gavinsky, D.", "Lee, T.", "Santha, M.", "Sanyal, S."]
  title: "Quadratically tight relations for randomized query complexity"
  venue: "Theory of Computing Systems 64:101-119 (CSR 2019)"
  year: 2017
  eccc: "TR17-123"
  note: "Uses prt for the logarithm of the Jain-Klauck LP optimum, the convention this zoo follows. Also: EC <= R_0 = O(EC^2), FC <= EC <= FC^{3/2}, so EC^{2/3} <= R."
