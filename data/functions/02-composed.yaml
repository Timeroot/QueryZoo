    - {measure: NQ,     value: '\le 3962^{\,d}', putative: true, refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil$ [deWolf03] with $\mathrm{ndeg} \le 7923.9^{\,d}$ from the [[ndeg]] entry.'}
    - {measure: odeg,   value: '\le 7923.9^{\,d}', putative: true, note: '$\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} \le \deg \le 7923.9^{\,d}$ by the [[deg]] entry.'}
    - {measure: sdeg,   value: '\le 7923.9^{\,d}', putative: true, note: 'From $\mathrm{sdeg} \le \widetilde{\deg} \le \deg \le 7923.9^{\,d}$. Note the recorded $\widetilde{\deg} = \Omega(118.3^{\,d})$ does *not* transfer: sign degree can be arbitrarily far below approximate degree.'}
    - {measure: ardeg,  value: '\le 7923.9^{\,d}', putative: true, note: '$\mathrm{rdeg}_{1/3} \le \widetilde{\deg} \le \deg \le 7923.9^{\,d}$.'}
    - {measure: PostQ,  value: 'O(7923.9^{\,d})', putative: true, refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15], bounded by the [[ardeg]] entry. Contrast the recorded $\mathrm{Q} = \Omega(118.3^{\,d})$: post-selection is not known to help or hurt on this family.'}
  witnesses:
    - of:
        - bs
        - lambda
      setting: total
      statement: $\mathrm{bs}(f_n) = \Omega(\lambda(f_n)^{2.12697})$, an earlier rigorous separation of
        exponent approximately $2.12$, refuting the quadratic bound asked about in [ABKRT21]. The main result
        is formally verified in Lean.
      refs:
        - Meiburg26
  notes: |
    Numerical (non-rigorous) evidence in the same paper suggests a 1255-variable
    relative attains exponent $\approx 2.20$, and a 30-variable instance already
    beats exponent $2$ with an exactly computable $\lambda$.
    The rigorous exponent $2.12697356\ldots$ (approximately $2.12$, usually
    quoted as $2.127$) is weaker than the
    current $2.1308255793978239\ldots$ lower endpoint supplied by
    [[Prove2MeTournament]] [Prove2MeSensitivity26]. The numerical $2.20$
    value is not an established lower bound.
  refs: [Meiburg26, ABKRT21]
  see_also: [bs, lambda, AND]
