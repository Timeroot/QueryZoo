- id: MeiburgTournament
  name: Meiburg's tournament-subcube function
  symbol: 'f_{\mathrm{Mei}}'
  group: composed
  order: 27
  kind: total
  arity: '$2{,}017{,}584$ bits (base case); composed for the family'
  short: 'Refutes $\mathrm{bs} = O(\lambda^2)$: a total function with $\mathrm{bs} \ge \lambda^{2.127}$.'
  definition: |
    The indicator of a union of $k$ subcubes of the Boolean cube, indexed by the
    vertices of a *doubly regular tournament*; the remaining free choices in the
    construction are fixed by the Lovász Local Lemma. Composing the base function
    with itself gives an infinite family with $\lambda \to \infty$ and
    $\mathrm{bs} = \Omega(\lambda^{2.127})$.
  values:
    - {measure: bs,     value: '\ge 14011 \text{ (base case)}', refs: [Meiburg26]}
    - {measure: lambda, value: '\le 89.0162 \text{ (base case)}', refs: [Meiburg26]}
  witnesses:
    - {of: [bs, lambda], setting: total, statement: '$\mathrm{bs}(f_n) = \Omega(\lambda(f_n)^{2.127})$, so the bs-vs-$\lambda$ exponent lies in $[2.127,\,4]$, not $\{2\}$ as [ABKRT21] asked. The main result is formally verified in Lean.', refs: [Meiburg26]}
  notes: |
    Numerical (non-rigorous) evidence in the same paper suggests a 1255-variable
    relative attains exponent $\approx 2.20$, and a 30-variable instance already
    beats exponent $2$ with an exactly computable $\lambda$.
    This is the single most recent change to the classical separation matrix:
    the $\mathrm{bs}$-vs-$\lambda$ cell moved from "$2,4$" to "$2.127, 4$".
  refs: [Meiburg26, ABKRT21]
  see_also: [bs, lambda, AND]
