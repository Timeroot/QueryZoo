# =====================================================================
# FUNCTIONS: composed / recursive families.
# These are the workhorses of the "witness" column of the matrix,
# because almost every measure composes (or nearly composes) and so a
# constant-size gap can be amplified to a polynomial one.
# =====================================================================

functions:

- id: ANDOR
  name: AND-OR tree (depth 2)
  symbol: '\mathrm{AND}_n \circ \mathrm{OR}_n'
  aliases: ['\wedge\circ\vee', 'CNF-like read-once formula of depth 2']
  group: composed
  order: 20
  kind: total
  arity: '$N = n^2$ bits ($n$ blocks of $n$)'
  scale: {var: n, subs: {N: 'n^2'}}
  short: $\mathrm{D}=\mathrm{R}=\Theta(N)$ while $\mathrm{C}=\mathrm{bs}=\sqrt N$; also separates sabotage
    and max-conflict from conflict complexity.
  definition: |
    Split the input into $n$ blocks of $n$ bits. Output $1$ iff *every* block
    contains at least one $1$.
  formal: |
    $$f(x^1,\dots,x^n) = \bigwedge_{j=1}^{n}\ \bigvee_{i=1}^{n} x^j_i,
      \qquad x^j\in\{0,1\}^n,\ N = n^2 .$$
  values:
    - {measure: D,      value: 'N = n^2'}
    - {measure: R0,     value: '\Theta(n^2)'}
    - {measure: R,      value: '\Theta(n^2)', refs: [SaksWigderson86, Snir85]}
    - {measure: Q,      value: '\Theta(n) = \Theta(\sqrt N)', refs: [HoyerMoscadeWolf03, BBBV97], note: 'Robust quantum search: no log factor.'}
    - {measure: QE,     value: '\Theta(n^2)', note: '$\mathrm{Q}_E \ge \deg/2 = n^2/2$.'}
    - {measure: deg,    value: 'n^2'}
    - {measure: adeg,   value: '\Theta(n)'}
    - {measure: sdeg,   value: '\Omega(\sqrt n) = \Omega(N^{1/4})', refs: [MinskyPapert69], note: 'Minsky-Papert prove $\mathrm{sdeg}(\mathrm{AND}_m \circ \mathrm{OR}_b) = \Omega(\min\{m,\sqrt b\})$, which on the *balanced* tree ($m = b = n$) is $\Omega(\sqrt n)$. The often-quoted $\Theta(N^{1/3})$ belongs to the unbalanced [[MinskyPapert]] function $\mathrm{AND}_{m}\circ\mathrm{OR}_{m^2}$, where the two terms of the minimum meet; do not transfer it here. Upper bound here: $\mathrm{sdeg} \le \widetilde{\deg} = \Theta(n)$.'}
    - {measure: s,      value: 'n = \sqrt N'}
    - {measure: bs,     value: 'n'}
    - {measure: fbs,    value: 'n'}
    - {measure: C,      value: 'n'}
    - {measure: RC,     value: '\Theta(n)'}
    - {measure: lambda, value: 'n', refs: [ABKRT21], note: '$\lambda$ is exactly multiplicative: $\lambda = \lambda(\mathrm{AND}_n)\lambda(\mathrm{OR}_n) = \sqrt n\cdot\sqrt n$.'}
    - {measure: rdeg,   value: 'n', refs: [IJKKKSWW23], note: '$\mathrm{ndeg}(f) = n\cdot\mathrm{ndeg}(\mathrm{OR}_n) = n$ and $\mathrm{ndeg}(\bar f)=\mathrm{ndeg}(\mathrm{NOR}_n)=n$.'}
    - {measure: C0,     value: 'n'}
    - {measure: C1,     value: 'n'}
    - {measure: bs0,    value: 'n'}
    - {measure: bs1,    value: 'n'}
    - {measure: FC,     value: 'n'}
    - {measure: EC,     value: 'n', note: 'Between $\mathrm{fbs}=n$ and $\mathrm{C}=n$.'}
    - {measure: Dna,    value: 'N = n^2'}
    - {measure: CA, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{CA}(f) \le \mathrm{fbs}(f)$, with $\mathrm{RC}(f) = \Theta(n)$ and $\mathrm{fbs}(f) = n$ here.'}
    - {measure: CGpub, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{fbs}(f)$, with $\mathrm{RC}(f) = \Theta(n)$ and $\mathrm{fbs}(f) = n$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Advpm, value: '\Theta(n) = \Theta(\sqrt N)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n) = \Theta(\sqrt N)$ here.'}
    - {measure: gamma2, value: '\Theta(n) = \Theta(\sqrt N)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n) = \Theta(\sqrt N)$ here.'}
    - {measure: Rbar, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{R}_{0}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: R1, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{R}_{0}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: MAdv, value: '\Theta(n) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(n) = \Theta(\sqrt N)$ here.'}
    - {measure: deg2,   value: 'N = n^2', putative: true, note: 'Over $\mathbb{F}_2$, $\mathrm{OR}_n = 1 + \prod_i(1+x_i)$ has top monomial $x_1\cdots x_n$ with coefficient $1$, and the outer AND multiplies the blocks'' polynomials, so the full monomial survives. Characteristic $2$ buys nothing on a read-once formula.'}
    - {measure: s0,     value: 'n', putative: true, note: 'Take one empty block and a single $1$ in each of the others: all $n$ bits of the empty block are sensitive, and nothing else is. Matches $\mathrm{s} = n$.'}
    - {measure: s1,     value: 'n', putative: true, note: 'Take exactly one $1$ per block: those $n$ bits are sensitive.'}
    - {measure: Cmin,   value: 'n', putative: true, note: 'Certifying a $1$ needs a witness in each of the $n$ blocks; certifying a $0$ needs a whole empty block, $n$ bits. So every input costs exactly $n$: $\mathrm{C} = \mathrm{C}_{\min} = n$.'}
    - {measure: Q0,     value: '\Omega(n),\ O(n^2)', note: 'Not pinned at $\Theta(N)$: $\deg/2$ is a floor for $\mathrm{Q}_{\mathrm{E}}$, not for $\mathrm{Q}_0$, whose polynomial floor is $\mathrm{rdeg}/2 = \Theta(n)$ -- the same order as $\mathrm{Q} = \Theta(\sqrt N)$. The ceiling is $\mathrm{D} = n^2$ (equivalently $2\mathrm{R}_0$). So the zoo does not know whether zero error costs the full quadratic here.'}
    - {measure: Rna,    value: '\Theta(n^2) = \Theta(N)', note: 'Between $\mathrm{R} = \Theta(n^2)$ and $\mathrm{D}^{\mathrm{na}} = n^2$.'}
    - {measure: SP,     value: 'N = n^2', putative: true, note: 'A partition of the cube into monochromatic subcubes of codimension $\le k$ writes $f$ as the sum of the indicators of its $1$-subcubes, each a conjunction of $\le k$ literals and none of them cancelling, so $\deg(f) \le \mathrm{SP}(f)$. Here $\deg = \mathrm{D} = n^2$, so the chain $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$ collapses. Every read-once formula is pinned this way.'}
    - {measure: UC,     value: 'N = n^2', putative: true, note: 'Squeezed by $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$ with $\deg = \mathrm{D} = n^2$; see the [[SP]] entry. Note how far this is from $\mathrm{C} = n$: the AND-OR tree is the standard $\mathrm{UC}$-vs-$\mathrm{C}$ gap.'}
    - {measure: rank,   value: 'n = \sqrt N', putative: true, note: 'Upper: read the blocks left to right, and inside a block read bits until a $1$ appears. The block subtree has rank $1$, and grafting rank-$r$ subtrees onto the leaves of a rank-$1$ tree gives rank $\le r+1$, so $\mathrm{rank}_j = \mathrm{rank}_{j+1} + 1$ and the whole tree has rank $n$. Lower: $\mathrm{C}_{\min} = n$ here and $\mathrm{C}_{\min} \le \mathrm{rank}$ (a Delayer who always defers survives $\mathrm{C}_{\min}$ rounds). So $\mathrm{rank} = \mathrm{C}_{\min} = \mathrm{C} = n$ while $\mathrm{D} = n^2$.'}
    - {measure: D_size, value: '\Theta(n^n) = 2^{\Theta(\sqrt N\log N)}', putative: true, note: 'Upper: the tree above has $S_j = n\,S_{j+1} + 1$ leaves for blocks $j..n$, i.e. $S_1 = (n^{n+1}-1)/(n-1) < \tfrac{n}{n-1}n^n$. Lower: the $n^n$ inputs with exactly one $1$ per block must reach distinct leaves, for if two of them differ in block $j$ then both of that block''s $1$-positions are free in the common leaf-subcube, and zeroing the block stays inside it while flipping $f$ to $0$. So $n^n \le \mathrm{DTsize} \le \tfrac{n}{n-1}n^n$. Far above $2^{\mathrm{rank}} = 2^{n}$ and far below $2^{\mathrm{D}} = 2^{n^2}$.'}
    - {measure: Inf,    value: '\Theta(n^2 2^{-n})', putative: true, note: 'Exactly $\mathrm{I}(f) = n^2\,2^{1-n}(1-2^{-n})^{n-1}$: bit $i$ of block $j$ is pivotal iff the rest of its block is $0$ and every other block is nonzero. The AND-OR tree is wildly unbalanced under the uniform measure -- $\Pr[f=1] = (1-2^{-n})^n \to 1$ -- so its total influence tends to $0$ even though $\mathrm{D} = N$. (Confirmed against the exact Fourier expansion for $n \le 4$.)'}
    - {measure: L1,     value: '\Theta(2^n) = \Theta(2^{\sqrt N})', putative: true, note: 'Exactly $\widehat{L}_1(f) = (2-2^{1-n})^{n+1} + |1 - 2(1-2^{-n})^{n}|$. In the $\pm1$ encoding the composed coefficients are $\hat f(T) = \pm 2^{1-n}(2^{1-n})^{|A|}(2-2^{1-n})^{\,n-|A|}$, where $A$ is the set of blocks $T$ touches, and all $T$ with the same $A$ share a sign, so the sum telescopes to a geometric one with no cancellation. Values $3.5,\ 9.71875,\ 23.719\ldots$ for $n = 2,3,4$.'}
    - {measure: UCmin,  value: 'N = n^2', putative: true, note: 'An unambiguous $b$-certificate family of width $w$ writes $f$ (or $1-f$) as a sum of indicators of disjoint subcubes of codimension $\le w$, with no cancellation, so $\deg \le \mathrm{UC}^0$ and $\deg \le \mathrm{UC}^1$, i.e. $\deg \le \mathrm{UC}_{\min} \le \mathrm{UC}$. Here $\deg = \mathrm{UC} = n^2$, so even the cheaper side of the unambiguous cover costs the full $N$ -- against $\mathrm{C}_{\min} = n$.'}
    - {measure: Adv,    value: '\Theta(n) = \Theta(\sqrt N)', note: 'Sandwiched: $\lambda \le \mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$, with $\lambda = n$ and $\mathrm{Q} = \Theta(n)$ here.'}
    - {measure: CG,     value: '\Theta(n^2) = \Theta(N)', putative: true, note: 'Pinned by the correct sandwich $\max\{\mathrm{Adv}^2,\mathrm{R}_0,\mathrm{CA}\} \le \mathrm{CG} \le \min\{\mathrm{C}^0\mathrm{C}^1,\ O(\mathrm{EC}^2)\}$ -- note $\mathrm{CG}$ is *not* capped by $\mathrm{D}$. Lower: $\mathrm{Adv}^2 = \Theta(n^2)$. Upper: $\mathrm{C}^0\mathrm{C}^1 = n\cdot n = n^2$. So the private-coin certificate game costs the full $N$ while the public-coin one costs only $\sqrt N$ -- the [[CG]] vs [[CGpub]] gap is quadratic here.'}
    - {measure: QC,     value: '\Theta(\sqrt n) = \Theta(N^{1/4})', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ for every $f$ ([[QC]] vs [[fbs]]), and $\mathrm{fbs} = n$ here.'}
    - {measure: psD,    value: '\Theta(n^2) = \Theta(N)', note: 'For a Boolean-valued function pseudo-determinism is free -- the canonical answer is forced to be $f(x)$ -- so $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$, and $\mathrm{R} = \Theta(n^2)$ here.'}
    - {measure: ndeg,   value: 'n = \sqrt N', refs: [IJKKKSWW23], note: 'Nondeterministic degree is multiplicative over the disjoint blocks of an AND: $\mathrm{ndeg}(\mathrm{AND}_n\circ g) = n\,\mathrm{ndeg}(g)$, and $\mathrm{ndeg}(\mathrm{OR}_n) = 1$ (the polynomial $\sum_i x_i$ is nonzero exactly on the $1$-inputs). This is the $\mathrm{ndeg}(f) = n$ half of the recorded [[rdeg]] value.'}
    - {measure: NQ,     value: '\Theta(n) = \Theta(\sqrt N)', note: 'De Wolf''s exact characterisation $\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$ applied to the [[ndeg]] entry. Nondeterministic quantum queries are thus quadratically cheaper than $\mathrm{D} = N$ and match $\mathrm{Q}$.'}
    - {measure: Inf1,   value: '\Theta(n^2 2^{-n})', putative: true, note: 'For Boolean-valued $f$ the $L_1$ and $L_2$ notions of total influence agree, $\mathrm{I}^1(f) = \mathrm{I}(f)$; they can differ only for bounded real-valued $p$. So this is the [[Inf]] entry verbatim.'}
    - {measure: MaxInf, value: '\Theta(2^{-n})', putative: true, note: 'The function is transitive (permute the blocks, permute inside each block), so every coordinate has the same influence and $\max_i \mathrm{Inf}_i = \mathrm{I}(f)/N = 2^{1-n}(1-2^{-n})^{n-1}$ exactly, from the [[Inf]] entry.'}
    - {measure: Var, value: '\Theta(n2^{-n}) = \Theta(\sqrt N\,2^{-\sqrt N})', note: '$4p(1-p)$ at $p = (1-2^{-n})^n = 1-\Theta(n2^{-n})$, as computed in the [[NS]] entry.'}
    - {measure: osss, value: '\Theta(n) = \Theta(\sqrt N)', putative: true, note: '$\Theta(n2^{-n})$ over $\Theta(2^{-n})$. Tight against $\mathrm{s} = n$, and quadratically short of $\mathrm{D} = N = n^2$ -- the two exponentially small Fourier quantities cancel and leave exactly the sensitivity.'}
    - {measure: nsr, value: '\Theta(n) = \Theta(\sqrt N)', putative: true, note: '$\mathrm{NS}_\delta = 2\Pr[f(x)=1,f(y)=0] = (2+o(1))n2^{-n}(1-(1-\delta)^n)$: the answer is $0$ only when some block is all-zero, and such a block stays all-zero exactly when none of its $n$ bits flips. Crossing $\mathrm{Var}/4$ needs $(1-\delta)^n \le \tfrac12$, so $\delta^{*} = \Theta(1/n)$. Tight against $4\mathrm{s} = 4n$.'}
    - {measure: Fdim,   value: 'N = n^2', putative: true, note: 'The Fourier support is everything (see [[spar]]), so its $\mathbb{F}_2$-span is all of $\mathbb{F}_2^{N}$. In particular the bound $\mathrm{D}^{\oplus} \le \dim_{\mathbb{F}_2}$ is vacuous here: parity queries have no structure to exploit on a read-once formula.'}
    - {measure: spar,   value: '2^N = 2^{n^2}', putative: true, note: 'Full Fourier support: the closed form in the [[L1]] note is nonzero for every $T$ (including $\hat f(\emptyset) = 1 - 2(1-2^{-n})^n$, which vanishes only at the degenerate $n=1$). Sparsity is therefore no better than the trivial bound even though $\mathrm{C} = \sqrt N$.'}
    - {measure: cbs,    value: 'n', refs: [GoosPitassi14], note: 'Critical block sensitivity coincides with ordinary block sensitivity on a Boolean-valued problem [GoosPitassi14]: the only solution function is $f$ itself and every input is critical, so $\mathrm{cbs} = \mathrm{bs} = n$.'}
    - {measure: Dmu,    value: '\Theta(n^2)', refs: [Yao77], note: 'Yao''s minimax principle for worst-case cost: $\max_\mu \mathrm{D}^{\mu}_{1/3} = \Theta(\mathrm{R}_{1/3})$, and $\mathrm{R} = \Theta(n^2)$ here, so no distribution is harder than $\Theta(N)$ and some distribution is that hard.'}
    - {measure: Np,     value: '\Omega(n^2),\ O(n^2\log n)', refs: [FRPU94], note: 'A noisy-query algorithm is in particular randomized, so $\mathrm{N}_p \ge \mathrm{R} = \Omega(n^2)$; repeating each query of an optimal randomized tree $O(\log \mathrm{R})$ times and taking majorities gives $\mathrm{N}_p = O(\mathrm{R}\log \mathrm{R})$ [FRPU94]. Whether the logarithm is needed here is open -- it is provably needed for [[PARITY]].'}
    - {measure: noisyR, value: '\Theta(n^2)', refs: [CKMPSS23], note: 'Always $\mathrm{noisyR} \le \mathrm{R}$, and the recorded implication $\mathrm{R}(f) = \Theta(\text{arity}) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ applies, since $\mathrm{R} = \Theta(n^2) = \Theta(N)$. So the composition theorem $\mathrm{R}(F\circ f^m) = \Omega(\mathrm{noisyR}(F)\,\mathrm{R}(f))$ loses nothing when this function is the *outer* one.'}
    - {measure: robustQ, value: '\Theta(n) = \Theta(\sqrt N)', conf: medium, refs: [HoyerMoscadeWolf03, BNRdW05], note: 'Lower bound $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(n)$. Upper bound: Grover search on *bounded-error* inputs costs $O(\sqrt m)$ calls with no logarithmic overhead [HoyerMoscadeWolf03], and noisy oracle access to a block can be turned into bounded-error access at constant amortised cost [BNRdW05]. Run robust search inside each $\mathrm{OR}_n$ block ($O(\sqrt n)$ noisy queries) and robust search again at the outer $\mathrm{AND}_n$ over the $n$ bounded-error block answers ($O(\sqrt n)$ calls): $O(n)$ in total.'}
    - {measure: PDT,    value: 'N = n^2', putative: true, note: 'Parity queries buy nothing: $\deg_2 \le \mathrm{D}^{\oplus} \le \mathrm{D}$, and the recorded $\deg_2 = \mathrm{D} = N$ closes the sandwich.'}
    - {measure: NS,     value: '\Theta(n2^{-n})', putative: true, refs: [ODonnell14], note: 'For constant $\delta$ the noise sensitivity is within constants of the variance: in $\mathrm{NS}_\delta = \tfrac12\sum_{S\ne\emptyset}(1-(1-2\delta)^{|S|})\hat f(S)^2$ every factor lies in $[2\delta, 1]$, so $\delta\,\mathrm{Var}(f) \le \mathrm{NS}_\delta(f) \le \tfrac12\mathrm{Var}(f)$. Here $\Pr[f=1] = (1-2^{-n})^n = 1-\Theta(n2^{-n})$, hence $\mathrm{Var} = 4p(1-p) = \Theta(n2^{-n})$. Consistent with the recorded $\mathrm{I}(f) = \Theta(n^2 2^{-n})$ through $\mathrm{NS}_\delta \le \delta\,\mathrm{I}$.'}
    - {measure: Stab,   value: '1 - \Theta(n2^{-n})', putative: true, note: 'From $\mathrm{Stab}_\rho = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$ and the [[NS]] entry. The function is overwhelmingly biased towards $1$, so it is almost perfectly noise stable at every constant $\rho$ -- which is why the OSSS bound $\mathrm{D} \ge \mathrm{Var}/\mathrm{MaxInf}$ gives only $\Theta(n)$ here and not $\Theta(N)$.'}
    - {measure: odeg,   value: '\Omega(\sqrt n),\ O(n)', note: 'Squeezed by $\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg}$, whose ends are the recorded $\mathrm{sdeg} = \Omega(\sqrt n)$ and $\widetilde{\deg} = \Theta(n)$.'}
    - {measure: ardeg,  value: 'O(n)', note: 'Approximate rational degree is at most both $\mathrm{rdeg} = n$ and $\widetilde{\deg} = \Theta(n)$. No matching lower bound is available: $\mathrm{rdeg}_{1/3}$ is not known to be bounded below by any of $\mathrm{bs}$, $\lambda$ or $\mathrm{Q}$.'}
    - {measure: PostQ,  value: 'O(n)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15], and [[ardeg]] gives $\mathrm{rdeg}_{1/3} = O(n)$. Whether post-selection beats the ordinary quantum $\Theta(n)$ on this function is open, since no lower bound on $\mathrm{rdeg}_{1/3}$ is known here.'}
    - {measure: degp,   value: 'N = n^2', putative: true, note: 'For *every* prime $p$. Over $\mathbb{F}_p$ one has $\mathrm{OR}_n(y) = 1-\prod_i(1-y_i)$, whose top monomial $\prod_i y_i$ carries coefficient $(-1)^{n+1}$, and $\mathrm{AND}_n$ is the plain product of its arguments; the blocks are disjoint, so the top monomial $\prod_{i,j}x_{ij}$ of the composition survives with coefficient $((-1)^{n+1})^n \ne 0$. Hence $\deg_p = \deg = N$ for all $p$, matching the recorded $\deg_2$.'}
    - {measure: cjdeg,  value: '\Omega(n),\ O(n^2)', note: 'Conical junta degree sits between approximate degree and randomized complexity, $\widetilde{\deg}_\varepsilon \le \mathrm{cjdeg}_\varepsilon \le \mathrm{R}_\varepsilon$, i.e. $\Omega(n)$ and $O(n^2)$ here. Closing the window would decide whether the non-negativity constraint costs anything on the canonical $\mathrm{Q}$-vs-$\mathrm{R}$ example.'}
    - {measure: prt,    value: '\Omega(n),\ O(n^2)', refs: [JainKlauck10], note: 'The partition bound dominates block sensitivity, $\mathrm{prt}_{\varepsilon/4} \ge \varepsilon\,\mathrm{bs} + \log\varepsilon - 2 = \Omega(n)$, and is dominated by $2\mathrm{R} = O(n^2)$ [JainKlauck10, Thm 3.1].'}
    - {measure: rprt,   value: '\Omega(n),\ O(n^2)', conf: medium, note: 'The same sandwich as [[prt]]: the relaxed bound still dominates $\mathrm{bs}$ (the zoo''s own $\mathrm{bs} \to \overline{\mathrm{prt}}$ record, which checks that the [JainKlauck10] argument never uses the completeness equality) and is at most $\mathrm{prt} \le 2\mathrm{R}$.'}
    - {measure: Rstar,  value: '\Omega(n),\ O(n^2)', refs: [BBGM22], note: 'The asymptotic composition rate obeys $\max\{\mathrm{Q},\ \Omega(\mathrm{LR})\} \le \mathrm{R}^{*} \le \mathrm{R}$ [BBGM22], and $\mathrm{Q} = \Theta(n)$, $\mathrm{R} = \Theta(n^2)$. Self-composing $\mathrm{AND}_n\circ\mathrm{OR}_n$ produces the balanced alternating $\mathrm{AND}/\mathrm{OR}$ tree of fan-in $n$, so $\mathrm{R}^{*}$ here is precisely the per-level randomized cost of deep read-once $\mathrm{AND}/\mathrm{OR}$ formulas: the same phenomenon that drops [[NANDtree]] from exponent $1$ to $0.753$.'}
    - {measure: degcert, value: n, note: 'KLLPV26, Proposition 52: certifying a fixed input reduces to AND or OR on n bits (the family has N=n² inputs).', refs: [KLLPV26]}
    - {measure: QEcert, value: \Theta(n), note: Certification costs at most its n-bit classical certificate; bounded degree certification n gives the quantum lower bound., refs: [KLLPV26]}
    - {measure: Q0cert, value: \Theta(n), note: Theorem 5 and QEcert=Θ(n)., refs: [KLLPV26]}
    - {measure: RS, value: \Theta(n^2), refs: [Meiburg26composition], note: 'Theorem 9.1; for LR use max-conflict ≤ O(LR) ≤ O(R). The conflict bound is the theorem’s bracket, not the stronger introduction-table upper bound.'}
    - {measure: chibar, value: \Theta(n^2), refs: [Meiburg26composition], note: 'Theorem 9.1; for LR use max-conflict ≤ O(LR) ≤ O(R). The conflict bound is the theorem’s bracket, not the stronger introduction-table upper bound.'}
    - {measure: LR, value: \Theta(n^2), refs: [Meiburg26composition], note: 'Theorem 9.1; for LR use max-conflict ≤ O(LR) ≤ O(R). The conflict bound is the theorem’s bracket, not the stronger introduction-table upper bound.'}
    - {measure: chi, value: '\Omega(n^2/\log^2 n),\ O(n^2/\log^{1/2}n)', refs: [Meiburg26composition], note: 'Theorem 9.1; for LR use max-conflict ≤ O(LR) ≤ O(R). The conflict bound is the theorem’s bracket, not the stronger introduction-table upper bound.'}
  witnesses:
    - {of: [Q0, Q],   setting: total, statement: 'Quadratic: $\mathrm{Q}_0 = \Theta(N)$ (forced by $\deg = N$) against $\mathrm{Q} = \Theta(\sqrt N)$ (robust quantum search). Zero error is exactly as expensive as no quantum at all here.'}
    - {of: [D, C],    setting: total, statement: '$\mathrm{D}=\mathrm{C}^2$; matches the upper bound $\mathrm{D}\le \mathrm{C}^0\mathrm{C}^1 \le \mathrm{C}^2$.', refs: [BlumImpagliazzo87, HartmanisHemachandra87, Tardos89]}
    - {of: [D, bs],   setting: total, statement: '$\mathrm{D} = \mathrm{bs}^2$ (upper bound is $\mathrm{bs}^3$).'}
    - {of: [D, RC],   setting: total, statement: '$\mathrm{D} = \mathrm{RC}^2$ (upper bound is $\mathrm{RC}^3$).'}
    - {of: [deg, s],  setting: total, statement: '$\deg = \mathrm{s}^2$; matches Huang''s $\deg \le \mathrm{s}^2$ exactly.', refs: [Huang19]}
    - {of: [deg, C],  setting: total, statement: '$\deg = \mathrm{C}^2$.'}
    - {of: [QE, C],   setting: total, statement: '$\mathrm{Q}_E = \mathrm{C}^2$.'}
  refs: [SaksWigderson86, HoyerMoscadeWolf03, ABKRT21, Huang19, MinskyPapert69, Meiburg26composition]
  see_also: [OR, AND, NANDtree, ANDEH]

  notes: ' [Meiburg26composition, Theorem 9.1] gives $\mathrm{RS}=\bar\chi=\Theta(n^2)$ and $\Omega(n^2/\log^2
    n)\le\chi\le O(n^2/\sqrt{\log n})$. Thus $\mathrm{RS}/\chi=\Omega(\sqrt{\log N})$, perfect conflict
    composition fails, and $\chi$ is not $O(\mathrm{C})$ (Corollaries 9.8, 9.9, 9.11).'
- id: NANDtree
  name: NAND tree (balanced AND-OR formula)
  symbol: '\bar{\wedge}\text{-tree}'
  aliases: ['Saks-Wigderson function', 'balanced binary NAND formula', 'read-once AND-OR formula']
  group: composed
  order: 21
  kind: total
  arity: '$N = 2^d$ leaves'
  scale: {var: d, subs: {N: '2^d'}}
  short: 'The Saks-Wigderson function: $\mathrm{R}_0 = \Theta(N^{0.7537})$, $\mathrm{Q}=\Theta(\sqrt N)$, $\deg = N$.'
  definition: |
    A complete binary tree of depth $d$ whose leaves are the input bits and
    whose internal gates are all NAND. Equivalently, the balanced read-once
    AND-OR formula with alternating levels.
  formal: |
    $$f_0(x)=x,\qquad f_{k}(x^{(1)},x^{(2)}) = \neg\big(f_{k-1}(x^{(1)}) \wedge f_{k-1}(x^{(2)})\big),$$
    and $f = f_d$ on $N=2^d$ variables.
  values:
    - {measure: D,      value: 'N'}
    - {measure: R0,     value: '\Theta\!\big(N^{\,0.753\ldots}\big)', refs: [SaksWigderson86, Santha95], note: 'The exponent is $\log_2\!\frac{1+\sqrt{33}}{4} = 0.75366\ldots$. Upper bound [SaksWigderson86], matching lower bound [SaksWigderson86]; [Santha95] extends the lower bound to bounded error.'}
    - {measure: R,      value: '\Theta\!\big(N^{\,0.753\ldots}\big)', refs: [Santha95]}
    - {measure: Q,      value: '\Theta(\sqrt{N})', refs: [FGG08, ACRSZ10], note: 'Continuous-time algorithm [FGG08], discrete-query version [ACRSZ10]; lower bound from $\lambda$.'}
    - {measure: QE,     value: '\Theta(N)', note: '$\ge \deg/2$.'}
    - {measure: deg,    value: 'N', note: 'True of any read-once formula.'}
    - {measure: adeg,   value: '\Theta(\sqrt{N})'}
    - {measure: s,      value: '\Theta(\sqrt{N})'}
    - {measure: bs,     value: '\Theta(\sqrt{N})'}
    - {measure: C,      value: '\Theta(\sqrt{N})'}
    - {measure: RC,     value: '\Theta(\sqrt{N})'}
    - {measure: lambda, value: '\sqrt{N}', note: '$\lambda(\mathrm{NAND}_2)=\sqrt2$ and $\lambda$ is multiplicative.'}
    - {measure: fbs,    value: '\Theta(\sqrt N)', note: 'Between $\mathrm{bs}$ and $\mathrm{C}$, which agree here.'}
    - {measure: FC,     value: '\Theta(\sqrt N)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: EC,     value: '\Theta(\sqrt N)', note: 'Between $\mathrm{fbs}$ and $\mathrm{C}$, which agree here.'}
    - {measure: Dna,    value: 'N'}
    - {measure: CA, value: '\Theta(\sqrt{N})', note: '$\mathrm{CA}(f) = \Theta(\mathrm{RC}(f))$ for every $f$ ([[CA]] vs [[RC]]), and $\mathrm{RC}(f) = \Theta(\sqrt{N})$ here.'}
    - {measure: CGpub, value: '\Theta(\sqrt{N})', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{RC}(f))$ for every $f$ ([[CGpub]] vs [[RC]]), and $\mathrm{RC}(f) = \Theta(\sqrt{N})$ here.'}
    - {measure: CGstar, value: '\Theta(\sqrt{N})', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(\sqrt{N})', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Advpm, value: '\Theta(\sqrt{N})', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}^{\pm}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with $\lambda(f) = \sqrt{N}$ and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt{N})$ here.'}
    - {measure: gamma2, value: '\Theta(\sqrt{N})', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt{N})$ here.'}
    - {measure: Adv, value: '\Theta(\sqrt{N})', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)$, with $\lambda(f) = \sqrt{N}$ and $\mathrm{Adv}^{\pm}(f) = \Theta(\sqrt{N})$ here.'}
    - {measure: Rbar, value: '\Theta\!\big(N^{\,0.753\ldots}\big)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{R}_{0}(f)$, with both ends $\Theta\!\big(N^{\,0.753\ldots}\big)$ here.'}
    - {measure: R1, value: '\Theta\!\big(N^{\,0.753\ldots}\big)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{R}_{0}(f)$, with both ends $\Theta\!\big(N^{\,0.753\ldots}\big)$ here.'}
    - {measure: MAdv, value: '\Theta(\sqrt{N})', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(\sqrt{N})$ here.'}
    - {measure: cjdeg, value: '\tilde\Theta\!\big(N^{\,0.753\ldots}\big)', refs: [GoosJayram16], note: 'The conical junta composition theorem gives $\tilde\Omega(N^{0.753\ldots})$, answering a question of Beame and Lawry; the matching upper bound is $\mathrm{cjdeg} \le \mathrm{R}$. So on the binary AND-OR tree the nonnegative LP is already tight up to logs -- unlike $\widetilde{\deg} = \Theta(\sqrt N)$, which is quadratically off.'}
    - {measure: Rstar, value: '\big(\tfrac{1+\sqrt{33}}{4}\big)^{d} = N^{0.753\ldots}', refs: [SaksWigderson86, Santha95], note: 'One of the few entries in the zoo that is a *number* rather than a $\Theta$-class. Because $(\mathrm{NANDtree}_d)^{\circ k} = \mathrm{NANDtree}_{dk}$ and $\mathrm{R}(\mathrm{NANDtree}_h) = \Theta(\alpha^h)$ with $\alpha = (1+\sqrt{33})/4 = 1.68614\ldots$, taking the $k$-th root kills the hidden constant exactly and leaves $\alpha^d$. Read-once formulas are the case where randomized query complexity does compose perfectly, so $\mathrm{R}^{*} = \mathrm{R}$ here up to the constant.'}
    - {measure: deg2,   value: 'N', putative: true, note: 'Over $\mathbb{F}_2$, $\mathrm{NAND}(u,v) = 1 + uv$, so each gate multiplies its children''s polynomials and the top monomial of a subtree is the product of its leaves'' -- with coefficient $1$ throughout. By induction the full monomial survives: $\deg_2 = \deg = N$.'}
    - {measure: s0,     value: '\Theta(\sqrt N)', putative: true, note: 'At a $b$-input of an alternating read-once formula the sensitive leaves are one per gate on the levels that force $b$, giving $2^{\lceil d/2\rceil}$ on one side and $2^{\lfloor d/2\rfloor}$ on the other. The two sides therefore differ by at most $\sqrt2$ and both are $\Theta(\sqrt N)$.'}
    - {measure: s1,     value: '\Theta(\sqrt N)', note: 'As $\mathrm{s}^0$.'}
    - {measure: Cmin,   value: '\Theta(\sqrt N)', putative: true, note: 'A minimal certificate takes one child at every $0$-forcing gate and both children at every $1$-forcing gate (or vice versa), so it has $2^{\lceil d/2\rceil}$ or $2^{\lfloor d/2 \rfloor}$ leaves -- $\Theta(\sqrt N)$ either way. Every input of the balanced NAND tree costs the same up to $\sqrt2$: $\mathrm{C} = \Theta(\mathrm{C}_{\min})$.'}
    - {measure: Q0,     value: '\Omega(\sqrt N),\ O\!\big(N^{\,0.753\ldots}\big)', note: 'The $\deg/2 = N/2$ floor is a $\mathrm{Q}_{\mathrm{E}}$ bound and does **not** apply here: a zero-error algorithm only forces $p_1$ to vanish on $f^{-1}(0)$, so its polynomial floor is $\mathrm{rdeg}/2 = 2^{\lceil d/2\rceil-1} = \Theta(\sqrt N)$ -- exactly the order of $\mathrm{Q}$. And the ceiling is $\mathrm{Q}_0 \le 2\mathrm{R}_0 = O(N^{0.753\ldots})$, strictly below $\mathrm{D}$: the NAND tree is one of the few places where the Las Vegas ceiling bites before the deterministic one. Contrast $\mathrm{Q}_{\mathrm{E}} = \Theta(N)$, which $\deg$ really does pin.'}
    - {measure: D_prod, value: 'O\!\big(N^{\,0.698}\big)', refs: [Sanyal24], conf: high, note: 'Strictly below $\mathrm{R} = \Theta(N^{0.753\ldots})$, and this is the *only* total function for which $\mathrm{R}$ and $\mathrm{D}^{\mathrm{prod}}$ are known to be polynomially apart [Sanyal24, Thm. 1.7]. The tempting argument -- that the Saks-Wigderson lower bound is proved against an explicit product distribution, so it certifies $\mathrm{D}^{\mathrm{prod}}$ -- is wrong, and instructively so: what that distribution certifies is the *zero-error* cost $\overline{\mathrm{D}_0^{\mu}} = \Theta(\alpha^d)$, $\alpha = (1+\sqrt{33})/4$, and bounded error is cheaper. Knowing $\mu$, run Saks-Wigderson but recurse first on the child likelier to evaluate to $0$ rather than on a random one. Two levels down, independence gives $p_{\ell} \ge (1-\alpha_{\ell})^2$ and the recursion closes at $T(d) \le \max_{x\in[0,1]}(2-x)(1+2x-x^2)\,T(d-2) = \tfrac{2}{27}(17+7\sqrt7)\,T(d-2)$, i.e. base $\sqrt{\tfrac2{27}(17+7\sqrt7)} = 1.62207\ldots$ per level against $\alpha = 1.68614\ldots$. With $N = 2^d$ that is $N^{0.69789\ldots}$. Sanyal does not claim the exponent is tight, so no lower bound is recorded.'}
    - {measure: C0,     value: '2^{\lceil d/2\rceil} = \Theta(\sqrt N)', putative: true, note: 'Certifying $f_d = 0$ means certifying both children to be $1$, and certifying $f_d = 1$ means certifying one child to be $0$: $\mathrm{C}^0(f_d) = 2\,\mathrm{C}^1(f_{d-1})$ and $\mathrm{C}^1(f_d) = \mathrm{C}^0(f_{d-1})$, from $\mathrm{C}^0(f_0) = \mathrm{C}^1(f_0) = 1$. So the two sides differ by exactly a factor $\sqrt2$ when $d$ is odd and agree when $d$ is even.'}
    - {measure: C1,     value: '2^{\lfloor d/2\rfloor} = \Theta(\sqrt N)', putative: true, note: 'See [[C0]]; the recursion swaps the two sides at every level.'}
    - {measure: bs0,    value: '2^{\lceil d/2\rceil} = \Theta(\sqrt N)', putative: true, note: 'Sensitivity obeys the same recursion as certificate complexity here -- at a $0$-input every leaf that flips its own subtree is sensitive, giving $\mathrm{s}^0(f_d) = 2\,\mathrm{s}^1(f_{d-1})$, and at a $1$-input only the leaves of a single $0$-child can help, giving $\mathrm{s}^1(f_d) = \mathrm{s}^0(f_{d-1})$. So $\mathrm{s}^b = \mathrm{bs}^b = \mathrm{C}^b$ and the squeeze is tight on both sides.'}
    - {measure: bs1,    value: '2^{\lfloor d/2\rfloor} = \Theta(\sqrt N)', putative: true, note: 'As [[bs0]], with the sides exchanged.'}
    - {measure: Rna,    value: '\Theta(N)', putative: true, note: 'Non-adaptive randomness buys nothing on any function that depends on all its variables. Pick a uniformly random leaf $\ell$ and a fixed input making $\ell$ pivotal, then set $x_\ell$ uniformly at random. A non-adaptive algorithm reading $q$ positions hits $\ell$ with probability $\le q/N$, and otherwise sees a fixed string and must guess a uniform bit, so its success probability is at most $\tfrac12 + \tfrac{q}{2N}$. Hence $\mathrm{R}^{\mathrm{na}}_{1/3}(f) \ge N/3$ for every $f$ with all $N$ variables relevant, matching $\mathrm{D}^{\mathrm{na}} = N$. This is the general form of the [[ADDR]] argument already recorded on the [[Rna]] page, and it separates $\mathrm{R}^{\mathrm{na}} = \Theta(N)$ from $\mathrm{R} = \Theta(N^{0.753\ldots})$ here.'}
    - {measure: SP,     value: 'N', putative: true, note: 'A monochromatic subcube partition writes $f$ as a sum of indicators of subcubes of codimension $\le \mathrm{SP}$, with no cancellation, so $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$. On a read-once formula $\deg = \mathrm{D} = N$, so all four coincide.'}
    - {measure: UC,     value: 'N', putative: true, note: 'Squeezed by $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D} = N$; see [[SP]]. Against $\mathrm{C} = \Theta(\sqrt N)$ this is the largest possible $\mathrm{UC}$-vs-$\mathrm{C}$ gap.'}
    - {measure: Inf,    value: '2^{-\Theta(\sqrt N)}', putative: true, note: 'Writing $p_d = \Pr[f_d = 1]$ one has $p_d = 1 - p_{d-1}^2$ and $\mathrm{I}(f_d) = \prod_{j<d} 2p_j$. The map $p \mapsto 1-p^2$ has its fixed point $(\sqrt5-1)/2$ *unstable*, and from $p_0 = \tfrac12$ the orbit is attracted to the $2$-cycle $\{0,1\}$ with $p_{2k+2}\approx 2p_{2k}^2$, i.e. doubly exponentially. So the balanced NAND tree is, under the uniform measure, an almost constant function whose total influence decays like $2^{-\Theta(2^{d/2})}$. Numerically $\log_2 \mathrm{I}(f_d) \approx -0.145\cdot 2^{d/2}$ along even $d$. A reminder that the uniform measure is the wrong one for this function: the Saks-Wigderson product distribution is the right one.'}
    - {measure: L1,     value: '2^{\Theta(N)}', putative: true, note: 'Because the two subtrees are on disjoint variables, $\hat f_d(T)$ is a single product term and the spectral norm obeys the exact recursion $A_d = A_{d-1}|1-\hat f_{d-1}(\emptyset)| + \tfrac12 A_{d-1}^2$ with $\widehat{L}_1 = |\hat f_d(\emptyset)| + A_d$. The quadratic term wins, so $\log_2 \widehat{L}_1(f_d) \to 0.29396\ldots\cdot N$. Exact small values $2,\ 3.5,\ 9.265625,\ 51.6915\ldots$ for $d = 1,2,3,4$ (checked against the full Fourier expansion).'}
    - {measure: spar,   value: '2^{N}', putative: true, note: 'Full Fourier support. Every coefficient is a product of the factors in the [[L1]] recursion, none of which vanishes because $\Pr[f_j = 1] \notin \{0,1\}$ at every level; brute force confirms $2^N$ nonzero coefficients for $d \le 4$.'}
    - {measure: PDT,    value: 'N', putative: true, refs: [ChistopolskayaPodolskii18], note: 'Parity queries buy *nothing*. In the $\pm1$ encoding each $\mathrm{NAND}_2$ gate has all four Fourier coefficients equal to $\pm\tfrac12$, and because the two subtrees are on disjoint variables every coefficient of $f_d$ is a product of one coefficient per gate on the relevant part of the tree. The coefficient of the full set uses all $N-1$ gates, so it equals $\pm 2^{-(N-1)}$ and the granularity is exactly $N-1$. [ChistopolskayaPodolskii18] give $\mathrm{D}^{\oplus} \ge k+1$ at granularity $2^{-k}$, so $\mathrm{D}^{\oplus} \ge N$, and $\mathrm{D}^{\oplus} \le \mathrm{D} = N$ closes it. Contrast [[RMAJ3]], where the same argument gives exactly $(N+1)/2$.'}
    - {measure: UCmin,  value: 'N', putative: true, note: 'An unambiguous $b$-certificate family of width $w$ writes $f$ (or $1-f$) as a sum of indicators of disjoint subcubes of codimension $\le w$, so $\deg \le \mathrm{UC}^0$ and $\deg \le \mathrm{UC}^1$, i.e. $\deg \le \mathrm{UC}_{\min}$. On a read-once formula $\deg = \mathrm{D} = N$, so even the cheaper side is full -- against $\mathrm{C}_{\min} = \Theta(\sqrt N)$, a quadratic $\mathrm{UC}_{\min}$-vs-$\mathrm{C}_{\min}$ gap.'}
    - {measure: CG,     value: '\Theta(N)', putative: true, note: 'Pinned by $\max\{\mathrm{Adv}^2,\mathrm{R}_0,\mathrm{CA}\} \le \mathrm{CG} \le \min\{\mathrm{C}^0\mathrm{C}^1,\ O(\mathrm{EC}^2)\}$; $\mathrm{CG}$ is *not* capped by $\mathrm{D}$, but here the two ends meet anyway. Lower: $\mathrm{Adv} = \Theta(\sqrt N)$ gives $\mathrm{Adv}^2 = \Theta(N)$. Upper: $\mathrm{C}^0\mathrm{C}^1 = 2^{\lceil d/2\rceil}2^{\lfloor d/2\rfloor} = 2^d = N$. So the private-coin certificate game costs $\Theta(N)$ while the public-coin one costs $\Theta(\sqrt N)$ and $\mathrm{R}$ costs $N^{0.753\ldots}$.'}
    - {measure: QC,     value: '\Theta(N^{1/4})', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ for every $f$ ([[QC]] vs [[fbs]]), and $\mathrm{fbs} = \Theta(\sqrt N)$ here.'}
    - {measure: psD,    value: '\Theta\!\big(N^{\,0.753\ldots}\big)', note: 'For a Boolean-valued function the canonical answer is forced to be $f(x)$, so pseudo-determinism is free: $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$.'}
    - {measure: RS,     value: '\Omega(\sqrt N),\ O\!\big(N^{\,0.753\ldots}\big)', putative: true, note: 'Not pinned. Upper: $\mathrm{RS} \le \mathrm{R}/(1-2\varepsilon)$. Lower: $\mathrm{RS} = \Omega(\mathrm{bs}) = \Omega(\sqrt N)$ -- star out a uniformly random one of the $\mathrm{bs}$ disjoint sensitive blocks of a maximally block-sensitive input; every unstarred bit agrees with that input, so finding a $\ast$ is unstructured search over the blocks.'}
    - {measure: prt,    value: '\Omega(\sqrt N),\ O\!\big(N^{\,0.753\ldots}\big)', note: 'Sandwiched: $\mathrm{fbs} \le \mathrm{prt}_{\varepsilon} \le \mathrm{R}_{\varepsilon}$, i.e. between $\Theta(\sqrt N)$ and $\Theta(N^{0.753\ldots})$. Where the partition bound sits inside that window is open; the conical-junta relaxation [[cjdeg]] is known to sit at the top of it.'}
    - {measure: rprt,   value: '\Omega(\sqrt N),\ O\!\big(N^{\,0.753\ldots}\big)', conf: medium, note: 'As [[prt]]; the relaxed bound still dominates $\mathrm{fbs}$ (the zoo''s own observation that the [JainKlauck10] techniques survive dropping the completeness equality) and is still at most $\mathrm{R}$.'}
    - {measure: Inf1,   value: '2^{-\Theta(\sqrt N)}', putative: true, note: 'For Boolean-valued $f$ the $L_1$ and $L_2$ notions of total influence coincide, $\mathrm{I}^1(f) = \mathrm{I}(f)$; see [[Inf]].'}
    - {measure: MaxInf, value: '2^{-\Theta(\sqrt N)}', putative: true, note: 'The tree automorphisms act transitively on the leaves, so every coordinate has influence $\mathrm{I}(f)/N$; dividing the doubly exponentially small $\mathrm{I}(f) = 2^{-\Theta(\sqrt N)}$ of the [[Inf]] entry by $N$ does not change the exponent.'}
    - {measure: Var, value: '2^{-\Theta(\sqrt N)}', note: '$4p_d(1-p_d)$ with $p_d = 1-p_{d-1}^2$ from $p_0 = \tfrac12$; the orbit escapes to the $\{0,1\}$ two-cycle doubly exponentially, as computed in the [[NS]] entry.'}
    - {measure: osss, value: '\Theta(\sqrt N) = \Theta(2^{d/2})', putative: true, note: 'Both $\mathrm{Var}$ and $\mathrm{MaxInf}$ are $2^{-\Theta(\sqrt N)}$, but the ratio is clean. Write $\varepsilon_d = \min\{p_d,1-p_d\}$, so $\mathrm{Var} = 4\varepsilon_d(1-\varepsilon_d)$ and $\varepsilon_{d+2} = (2+o(1))\varepsilon_d^2$, while $\mathrm{MaxInf}(f_d) = \prod_{j<d}p_j$ picks up exactly one new small factor $\varepsilon_d$ every two levels. Hence $\mathrm{osss}(f_{d+2})/\mathrm{osss}(f_d)\to 2$. Numerically $\mathrm{osss} = 2.6,\,6.8,\,17.3,\,41,\,90,\,184$ at $d = 2,4,\dots,12$. Well below $\mathrm{R}_0 = \Theta(N^{0.753})$.'}
    - {measure: nsr, value: 'O(\sqrt N)', putative: true, note: '$\mathrm{nsr}\le 4\mathrm{I}/\mathrm{Var} = 4N/\mathrm{osss} = \Theta(\sqrt N)$ by the [[osss]] entry. A first-moment count suggests this is tight -- conditioned on the rare event $f = 1$, an input has $\Theta(\sqrt N)$ sensitive coordinates on average, so noise at rate $\Theta(1/\sqrt N)$ should already flip the answer -- but the matching lower bound is not recorded here.'}
    - {measure: Fdim,   value: 'N', putative: true, note: 'The Fourier support is everything (see [[spar]]), so its $\mathbb{F}_2$-span is all of $\mathbb{F}_2^{N}$ and the bound $\mathrm{D}^{\oplus} \le \dim_{\mathbb{F}_2}$ is vacuous -- consistent with [[PDT]] $= N$.'}
    - {measure: rank,   value: '\Theta(N)', putative: true, note: 'Between $N/4$ and $N$. Lower, by the composing Prover--Delayer bound $\mathrm{rank}(f\circ g^n) \ge \mathrm{D}(f)(\mathrm{C}_{\min}(g)-1)$: the Delayer defers the first $\mathrm{C}_{\min}(g)-1$ queries in each block, then commits to that block''s value and forces it, and the game cannot end before $\mathrm{D}(f)$ blocks have reached their commitment. A single NAND gate has $\mathrm{C}_{\min} = 1$ and gives nothing, but writing $f_d = f_{d-2}\circ f_2$ with $\mathrm{C}_{\min}(f_2) = 2$ gives $\mathrm{rank} \ge 2^{d-2} = N/4$. Exact minimisation gives $1,2,3,6,11$ at $d = 1,\dots,5$. So the NAND tree has essentially full rank even though $\mathrm{C}_{\min} = \Theta(\sqrt N)$.'}
    - {measure: D_size, value: '2^{\Theta(N)}', putative: true, note: 'A rank-$r$ decision tree contains a complete binary branching of depth $r$ and so has $\ge 2^r$ leaves; with $\mathrm{rank} \ge N/4$ that is $2^{\Omega(N)}$, and $2^{\mathrm{D}} = 2^N$ is the ceiling. Exact minimisation gives $3, 7, 25, 409, 62833$ leaves at $d = 1,\dots,5$, i.e. $\log_2 \mathrm{DTsize} \approx 0.5\,N$.'}
    - {measure: cbs,    value: '\Theta(\sqrt N)', refs: [GoosPitassi14], note: '$\mathrm{cbs} = \mathrm{bs}$ for Boolean-valued problems [GoosPitassi14] -- every input is critical and $f$ is the only solution function -- and $\mathrm{bs} = \Theta(\sqrt N)$.'}
    - {measure: Dmu,    value: '\Theta\!\big(N^{\,0.753\ldots}\big)', refs: [Yao77, SaksWigderson86], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3} = \Theta(\mathrm{R}_{1/3})$. Both directions of the recorded $\mathrm{R} = \Theta(N^{0.753\ldots})$ are in fact proved distributionally -- Saks-Wigderson''s lower bound exhibits an explicit recursive $\mu$ -- so the distributional value is the same $N^{\log_2((1+\sqrt{33})/4)}$.'}
    - {measure: Np,     value: '\Omega(N^{\,0.753\ldots}),\ O\!\big(N^{\,0.753\ldots}\log N\big)', refs: [FRPU94], note: 'Noisy queries can only cost more than clean ones, so $\mathrm{N}_p \ge \mathrm{R}$; majority-amplifying each query of the optimal randomized tree $O(\log \mathrm{R})$ times gives $\mathrm{N}_p = O(\mathrm{R}\log \mathrm{R})$ [FRPU94].'}
    - {measure: robustQ, value: '\Omega(\sqrt N),\ O(\sqrt N\log N)', refs: [BNRdW05], note: '$\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(\sqrt N)$, and $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ in general [BNRdW05]. Whether the logarithm can be removed for the NAND tree is open; it can be for [[PARITY]].'}
    - {measure: chi,    value: '\Omega(\sqrt N),\ O\!\big(N^{\,0.753\ldots}\big)', refs: [Li18], note: '$\chi = \Omega(\mathrm{bs}) = \Omega(\sqrt N)$ [Li18], and $\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R}$.'}
    - {measure: chibar, value: '\Omega(\sqrt N),\ O\!\big(N^{\,0.753\ldots}\big)', refs: [GLSS19], note: 'Above $\chi = \Omega(\mathrm{bs})$ and above the recorded $\mathrm{RS} = \Omega(\sqrt N)$; below $\mathrm{LR} \le \mathrm{R} = O(N^{0.753\ldots})$ [GLSS19].'}
    - {measure: LR,     value: '\Omega(\sqrt N),\ O\!\big(N^{\,0.753\ldots}\big)', refs: [BBGM22], note: '$\Omega(\sqrt{\mathrm{R}}) \le \mathrm{LR} \le \mathrm{R}$ [BBGM22] gives $\Omega(N^{0.377})$, which the stronger $\mathrm{LR} = \Omega(\bar\chi) = \Omega(\mathrm{bs}) = \Omega(\sqrt N)$ improves. Note that $\mathrm{R}$ *is* multiplicative along this family ($f_d\circ f_e = f_{d+e}$), so the composition theorem $\mathrm{R}(F\circ f_d^m) = \Omega(\mathrm{R}(F)\mathrm{LR}(f_d))$ is tight for these gadgets only if $\mathrm{LR}$ sits at the top of this window.'}
    - {measure: NS,     value: '2^{-\Theta(\sqrt N)}', putative: true, refs: [ODonnell14], note: 'For constant $\delta$, $\delta\,\mathrm{Var}(f) \le \mathrm{NS}_\delta(f) \le \tfrac12\mathrm{Var}(f)$, since every factor $1-(1-2\delta)^{|S|}$ with $|S|\ge 1$ lies in $[2\delta,1]$. The uniform bias satisfies $p_d = 1-p_{d-1}^2$ from $p_0 = 1/2$, which oscillates and escapes: $p_{2m} \approx 2p_{2m-2}^2$, so $\min\{p_d, 1-p_d\} = 2^{-\Theta(2^{d/2})} = 2^{-\Theta(\sqrt N)}$ and $\mathrm{Var} = 2^{-\Theta(\sqrt N)}$. This is the same doubly exponential collapse that produces the recorded $\mathrm{I}(f) = 2^{-\Theta(\sqrt N)}$.'}
    - {measure: Stab,   value: '1 - 2^{-\Theta(\sqrt N)}', putative: true, note: 'From $\mathrm{Stab}_\rho = 1-2\,\mathrm{NS}_{(1-\rho)/2}$ and the [[NS]] entry: at any constant noise rate the tree is essentially constant, so it is almost perfectly stable.'}
    - {measure: ndeg,   value: '2^{\lfloor d/2\rfloor} = \Theta(\sqrt N)', putative: true, refs: [IJKKKSWW23], note: 'Write $f_d = \mathrm{OR}_2(\overline{f_{d-1}},\overline{f_{d-1}})$ and $\overline{f_d} = \mathrm{AND}_2(f_{d-1},f_{d-1})$, and set $a_d = \mathrm{ndeg}(f_d)$, $b_d = \mathrm{ndeg}(\overline{f_d})$. Nondeterministic degree is exactly multiplicative over the disjoint blocks of an $\mathrm{AND}$ [IJKKKSWW23], so $b_d = 2a_{d-1}$. For the $\mathrm{OR}$ level: restricting one block to a $0$-input of $\overline{f_{d-1}}$ gives $a_d \ge b_{d-1}$, while $a_d \le \mathrm{C}^1(f_d) = \mathrm{C}^0(f_{d-1}) = 2^{\lceil (d-1)/2\rceil} = 2^{\lfloor d/2\rfloor}$ (sum the indicators of the $1$-certificates -- all coefficients positive, so no cancellation). With $a_0 = b_0 = 1$ and $a_1 = 1$ (witness $1+x_1-2x_2$ for $\mathrm{NAND}_2$) the two ends meet and $a_d = 2^{\lfloor d/2\rfloor}$ exactly, matching the recorded $\mathrm{C}^1$.'}
    - {measure: rdeg,   value: '2^{\lceil d/2\rceil} = \Theta(\sqrt N)', putative: true, refs: [IJKKKSWW23], note: '$\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\}$ [IJKKKSWW23], and the recursion in the [[ndeg]] entry gives $\mathrm{ndeg}(\overline{f_d}) = 2\,\mathrm{ndeg}(f_{d-1}) = 2^{\lceil d/2\rceil}$, which is the larger of the two. So exact rational degree equals $\mathrm{C}^0$ here, and $\mathrm{rdeg} = \Theta(\sqrt{\deg})$ -- the extremal behaviour for read-once formulas.'}
    - {measure: NQ,     value: '2^{\lfloor d/2\rfloor - 1} = \Theta(\sqrt N)', putative: true, refs: [deWolf03], note: '$\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$ [deWolf03], and $\mathrm{ndeg}(f_d) = 2^{\lfloor d/2\rfloor}$ from the [[ndeg]] entry. Nondeterministic quantum queries therefore buy nothing over bounded-error quantum queries on the NAND tree, both being $\Theta(\sqrt N)$.'}
    - {measure: odeg,   value: 'O(\sqrt N)', note: 'One-sided approximate degree is squeezed by $\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = \Theta(\sqrt N)$; no lower bound better than the trivial one is known, since the threshold degree of the balanced NAND tree is not pinned down.'}
    - {measure: sdeg,   value: 'O(\sqrt N)', note: 'From $\mathrm{sdeg} \le \widetilde{\deg} = \Theta(\sqrt N)$. Minsky-Papert-style lower bounds give nothing here: each gate has fan-in $2$, so the $\Omega(\min\{m,\sqrt b\})$ bound for $\mathrm{AND}_m\circ\mathrm{OR}_b$ degenerates to $\Omega(1)$.'}
    - {measure: ardeg,  value: 'O(\sqrt N)', note: 'At most both $\mathrm{rdeg} = \Theta(\sqrt N)$ and $\widetilde{\deg} = \Theta(\sqrt N)$.'}
    - {measure: PostQ,  value: 'O(\sqrt N)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) \le O(\mathrm{rdeg}) = O(\sqrt N)$ [MahadevdeWolf15]. Since $\mathrm{Q} = \Theta(\sqrt N)$ already, post-selection can save at most a constant factor unless $\mathrm{rdeg}_{1/3} \ll \mathrm{rdeg}$ here.'}
    - {measure: degp,   value: 'N', putative: true, note: 'For *every* prime $p$. Over $\mathbb{F}_p$, $\mathrm{NAND}(u,v) = 1-uv$, so if $c_{d-1}$ is the coefficient of the top monomial of $f_{d-1}$ then $c_d = -c_{d-1}^2$; starting from $c_0 = 1$ this stays $\pm 1$ and never vanishes mod $p$. Hence $\deg_p = \deg = N$ for all $p$, consistent with the recorded $\deg_2 = N$.'}
  witnesses:
    - {of: [D, R0],  setting: total, statement: '$\mathrm{D} = \Theta(\mathrm{R}_0^{1.327\ldots})$ -- for 30 years the best known D-vs-$\mathrm{R}_0$ separation, until [ABBLSS17] made it quadratic.', refs: [SaksWigderson86]}
    - {of: [QE, R0], setting: total, statement: '$\mathrm{Q}_E = \Theta(\mathrm{R}_0^{1.33})$: the witness cited in the $\mathrm{Q}_E$-vs-$\mathrm{R}_0$ and $\mathrm{Q}_E$-vs-$\mathrm{R}$ cells.', refs: [ABKRT21]}
    - {of: [deg, R],  setting: total, statement: '$\deg = \Theta(\mathrm{R}^{1.33})$: the best known deg-vs-R separation.', refs: [ABKRT21]}
    - {of: [D, Q],    setting: total, statement: '$\mathrm{D}=\mathrm{Q}^2$; the *conjectured* extreme for read-once formulas.', refs: [FGG08]}
  notes: |
    The Saks-Wigderson conjecture -- that $\mathrm{D}(f) = O(\mathrm{R}_0(f)^{1.33})$
    for all total $f$, i.e. that this function is extremal -- was refuted by
    [ABBLSS17], who pushed the exponent to $2$ (which is optimal).
  refs: [SaksWigderson86, Snir85, Santha95, FGG08, ACRSZ10]
  see_also: [ANDOR, pointer, RMAJ3]

- id: RMAJ3
  name: Recursive MAJORITY-of-3
  symbol: '\mathrm{MAJ}_3^{\circ d}'
  aliases: ['iterated 3-majority', '3-MAJ tree']
  group: composed
  order: 22
  kind: total
  arity: '$N = 3^d$ bits'
  scale: {var: d, subs: {N: '3^d'}}
  short: 'The other classical recursive benchmark; its randomized complexity is still not pinned down.'
  definition: 'The depth-$d$ ternary tree all of whose gates are $\mathrm{MAJ}_3$.'
  formal: '$f_0(x)=x$, $f_k(x^{(1)},x^{(2)},x^{(3)}) = \mathrm{MAJ}_3\big(f_{k-1}(x^{(1)}),f_{k-1}(x^{(2)}),f_{k-1}(x^{(3)})\big)$, $f=f_d$.'
  values:
    - {measure: D,      value: 'N = 3^d'}
    - {measure: R,      value: '\Omega(2.59^{\,d}),\ O(1.007\cdot 2.64944^{\,d})', refs: [GoosJayram16, MNSSTX16, Leonardos13, JayramKumarSivakumar03], note: 'In terms of $N = 3^d$ that is between $N^{0.8663}$ and $N^{0.8869}$; the exact exponent is a well-known open problem. History of the lower bound: $(7/3)^d$ [JayramKumarSivakumar03] $\to 2.55^d$ [Leonardos13] $\to 2.57143^d$ [MNSSTX16] $\to 2.59^d$ [GoosJayram16], the last via [[cjdeg]] rather than information complexity. The upper bound is the interleaved recursive algorithm of [MNSSTX16, Thm 4.2] and is zero-error, so it bounds $\mathrm{R}_0$ too.'}
    - {measure: deg,    value: 'N'}
    - {measure: s,      value: '2^d = N^{0.6309}'}
    - {measure: bs,     value: '2^d'}
    - {measure: C,      value: '2^d'}
    - {measure: fbs,    value: '2^d', note: 'Between $\mathrm{bs}=2^d$ and $\mathrm{C}=2^d$.'}
    - {measure: FC,     value: '2^d', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: EC,     value: '2^d', note: 'Between $\mathrm{fbs}$ and $\mathrm{C}$.'}
    - {measure: Dna,    value: 'N = 3^d'}
    - {measure: PDT,    value: '(N+1)/2 = (3^d+1)/2', refs: [ChistopolskayaPodolskii18], note: 'Exactly. The granularity of $\mathrm{MAJ}_3^{\circ d}$ is $2^{-(N-1)/2}$, and [ChistopolskayaPodolskii18] show $\mathrm{D}^{\oplus}\ge k+1$ for granularity $2^{-k}$; the matching parity decision tree is explicit. So parity queries halve the cost here, unlike on [[PARITY]] (where they collapse it) or [[IP]] (where they buy a factor $2$ at most).'}
    - {measure: lambda, value: '2^d = N^{\log_3 2}', note: '$\lambda(\mathrm{MAJ}_3)=2$, multiplicativity.'}
    - {measure: Q,      value: '\Theta(2^d)', refs: [Reichardt11], note: '$\mathrm{Adv}^{\pm}(\mathrm{MAJ}_3)=2$ and $\mathrm{Adv}^\pm$ composes perfectly, so $\mathrm{Q} = \Theta(\mathrm{Adv}^\pm(\mathrm{MAJ}_3)^d)$.'}
    - {measure: RC, value: '\Theta(2^d)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{RC}(f) \le \mathrm{C}(f)$, with both ends $2^d$ here.'}
    - {measure: CA, value: '\Theta(2^d)', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = 2^d$ here.'}
    - {measure: CGpub, value: '\Theta(2^d)', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs}(f) = 2^d$ here.'}
    - {measure: CGstar, value: '\Theta(2^d)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(2^d)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Advpm, value: '\Theta(2^d)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(2^d)$ here.'}
    - {measure: gamma2, value: '\Theta(2^d)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(2^d)$ here.'}
    - {measure: MAdv, value: '\Theta(2^d)', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(2^d)$ here.'}
    - {measure: cjdeg, value: '\Omega(2.59^{\,d}),\ O(2.64944^{\,d})', refs: [GoosJayram16, MNSSTX16], note: 'The Goos-Jayram conical junta bound $\Omega(2.59^d)$ is, as of writing, also the best known lower bound on $\mathrm{R}$ itself -- the nonnegative LP is where all recent progress on recursive majority has come from. Upper bound inherited from $\mathrm{cjdeg} \le \mathrm{R}$.'}
    - {measure: Rstar, value: '\alpha^{d},\ \alpha \in [2.59,\ 2.64944]', refs: [GoosJayram16, MNSSTX16], note: 'As for [[NANDtree]], self-composition makes $\mathrm{R}^{*}$ the exact base of the exponential; pinning $\alpha$ *is* the open problem on recursive majority.'}
    - {measure: Dmu, value: '\ge (\tfrac12 - \delta)\,2.57143^{\,d}', refs: [MNSSTX16], note: 'The lower bound is proved against an explicit hard distribution, so it is a statement about $\mathrm{D}^{\mu}_{\delta}$; Yao''s principle then transfers it to $\mathrm{R}_\delta$. Goos-Jayram''s later $\Omega(2.59^d)$ goes through conical juntas instead and is not of this form.'}
    - {measure: R0, value: '\Omega(2.59^{\,d}),\ O(1.007\cdot 2.64944^{\,d})', refs: [GoosJayram16, MNSSTX16], note: 'Identical to the bounds on $\mathrm{R}$: the interleaved algorithm of [MNSSTX16, Thm 4.2] that gives the upper bound is *zero-error*, and the lower bound applies a fortiori. So recursive majority is one of the functions where zero error is known to be free.'}
    - {measure: s0,   value: '2^d', putative: true, note: 'Take the input in which every gate sees exactly two $0$-children; those two children are the sensitive ones, so the sensitive leaves double at each level. $\mathrm{MAJ}_3$ is self-dual, so the same works on the $1$-side.'}
    - {measure: s1,   value: '2^d', putative: true, note: 'As $\mathrm{s}^0$, by self-duality of $\mathrm{MAJ}_3$.'}
    - {measure: bs0,  value: '2^d', note: 'Between $\mathrm{s}^0 = 2^d$ and $\mathrm{bs} = 2^d$.'}
    - {measure: bs1,  value: '2^d', note: 'Between $\mathrm{s}^1 = 2^d$ and $\mathrm{bs} = 2^d$.'}
    - {measure: C0,   value: '2^d', note: 'Between $\mathrm{bs}^0 = 2^d$ and $\mathrm{C} = 2^d$.'}
    - {measure: C1,   value: '2^d', note: 'Between $\mathrm{bs}^1 = 2^d$ and $\mathrm{C} = 2^d$.'}
    - {measure: Cmin, value: '2^d', putative: true, note: 'Every input of $\mathrm{MAJ}_3$ costs exactly $2$ to certify, so certificate complexity is the same at every input at every level: $\mathrm{C}_{\min} = \mathrm{C} = 2^d$. Recursive majority is perfectly homogeneous in this respect, unlike [[Kushilevitz]] ($\mathrm{C}_{\min} = \mathrm{C}^{0.77}$).'}
    - {measure: deg2, value: '2^d = N^{0.6309}', putative: true, note: 'Over $\mathbb{F}_2$, $\mathrm{MAJ}_3 = xy+xz+yz$ has degree $2$, and mod-$2$ degree is exactly multiplicative under composition (the top-degree monomials of the outer function live on disjoint blocks, so their expansions cannot cancel). So $\deg_2 = 2^d = \mathrm{s}$, quadratically below $\deg = N$.'}
    - {measure: UC,   value: 'N = 3^d', putative: true, note: 'An unambiguous $1$-certificate family of width $w$ writes $f$ as a sum of $\le w$-variable conjunctions with no cancellation, so $\deg(f) \le \mathrm{UC}(f)$. Every read-once formula has $\deg = N$, which forces $\mathrm{UC} = \mathrm{SP} = \mathrm{D} = N$ -- even though $\mathrm{C} = N^{0.63}$. Verified by exact set-partition search at $d = 1,2$.'}
    - {measure: SP,   value: 'N = 3^d', note: 'Between $\mathrm{UC} = N$ and $\mathrm{D} = N$.'}
    - {measure: QE,   value: '\Theta(N)', note: 'Between $\deg/2 = N/2$ and $\mathrm{D} = N$. Exactness costs the full $N$ against $\mathrm{Q} = \Theta(N^{0.63})$.'}
    - {measure: Q0,   value: '\Omega(2^d),\ O(2.65^{\,d})', note: 'As on [[NANDtree]], $\deg/2$ is a floor for $\mathrm{Q}_{\mathrm{E}}$ and not for $\mathrm{Q}_0$. Lower: $\mathrm{Q} = \Theta(2^d)$, which beats the $\mathrm{rdeg}/2 = \Omega(1.732^{\,d})$ polynomial floor. Upper: $\mathrm{Q}_0 \le 2\mathrm{R}_0 = O(2.64944^{\,d})$, well below $\mathrm{D} = 3^d$.'}
    - {measure: adeg, value: '\Theta(2^d)', refs: [ABKRT21], note: 'Sandwiched: $\lambda(f) = O(\widetilde{\deg}(f))$ (the step [ABKRT21] combine with Huang to get $\deg = O(\widetilde{\deg}^2)$) and $\widetilde{\deg}(f) \le 2\mathrm{Q}(f)$, with $\lambda = 2^d$ and $\mathrm{Q} = \Theta(2^d)$ here. So $\widetilde{\deg}$ sits with $\mathrm{Q}$ and $\lambda$ at $N^{0.63}$, quadratically below $\deg = N$.'}
    - {measure: rank, value: '\Theta(N)', putative: true, note: 'Between $N/3$ and $N$. Upper: $\mathrm{rank}\le\mathrm{D}$. Lower, by a Prover--Delayer argument that composes: $\mathrm{rank}(f\circ g^n) \ge \mathrm{D}(f)\,(\mathrm{C}_{\min}(g)-1)$. Indeed the Delayer defers the first $\mathrm{C}_{\min}(g)-1$ queries inside each block -- so few bits can never determine that block''s value -- and only then commits to the value the block will take, answering afterwards so as to force it. The order in which blocks reach that commitment is an adversary play against $f$, and the game cannot end until the *completed* blocks alone determine $f$, so at least $\mathrm{D}(f)$ blocks reach commitment, each paying $\mathrm{C}_{\min}(g)-1$ points. With $f = \mathrm{MAJ}_3^{\circ(d-1)}$ and $g = \mathrm{MAJ}_3$ ($\mathrm{D}(f) = 3^{d-1}$, $\mathrm{C}_{\min}(g) = 2$) this gives $\mathrm{rank} \ge 3^{d-1} = N/3$. Exact minimisation gives $2, 5, 14$ at $d = 1,2,3$, i.e. $(3^d+1)/2$. Recursive majority therefore has essentially full rank, while $\mathrm{C}_{\min} = N^{0.63}$ -- the generic $\mathrm{C}_{\min}\le\mathrm{rank}$ bound is far from tight here.'}
    - {measure: D_size, value: '2^{\Theta(N)}', putative: true, note: 'A rank-$r$ decision tree contains a complete binary branching of depth $r$, hence has $\ge 2^r$ leaves; with $\mathrm{rank} = \Omega(N)$ that gives $2^{\Omega(N)}$, and $2^{\mathrm{D}} = 2^N$ is the ceiling. Exact minimisation gives $6$ leaves at $d=1$ and $116$ at $d=2$.'}
    - {measure: UCmin, value: 'N = 3^d', putative: true, note: 'An unambiguous $b$-certificate family of width $w$ writes $f$ (or $1-f$) as a sum of indicators of disjoint subcubes of codimension $\le w$, with no cancellation, so $\deg \le \mathrm{UC}^0$ and $\deg \le \mathrm{UC}^1$, i.e. $\deg \le \mathrm{UC}_{\min} \le \mathrm{UC}$. Here $\deg = \mathrm{UC} = N$, so both unambiguous sides cost the full $N$ against $\mathrm{C} = \mathrm{C}_{\min} = N^{0.63}$.'}
    - {measure: Adv,  value: '\Theta(2^d)', note: 'Sandwiched: $\lambda \le \mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$, with $\lambda = 2^d$ and $\mathrm{Q} = \Theta(2^d)$ here. The positive-weight adversary is therefore already optimal on recursive majority.'}
    - {measure: CG,   value: '\Theta(4^{\,d}) = \Theta(N^{1.2619})', putative: true, note: 'Pinned, and *far above the arity* $N = 3^d$: the private-coin certificate game is **not** capped by $\mathrm{D}$. Lower: $\mathrm{CG} \ge \mathrm{Adv}^2 = (2^d)^2$. Upper: $\mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1 = 2^d\cdot 2^d$. The two meet exactly, so $\mathrm{MAJ}_3^{\circ d}$ is a clean witness for $\mathrm{CG} = \Theta(\mathrm{D}^{1.26})$ -- and for the fact that $\mathrm{CG}$ can exceed $n$.'}
    - {measure: QC,   value: '\Theta(2^{d/2}) = \Theta(N^{0.3155})', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ for every $f$ ([[QC]] vs [[fbs]]), and $\mathrm{fbs} = 2^d$ here.'}
    - {measure: psD,  value: '\Omega(2.59^{\,d}),\ O(1.007\cdot 2.64944^{\,d})', note: 'For a Boolean-valued function the canonical answer is forced to be $f(x)$, so pseudo-determinism is free: $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$, and this is the recorded [[R]] window verbatim.'}
    - {measure: Rbar, value: '\Omega(2.59^{\,d}),\ O(1.007\cdot 2.64944^{\,d})', note: 'Between $\mathrm{R}_{\varepsilon}$ and $\mathrm{R}_0$, whose recorded windows coincide here (the [MNSSTX16] algorithm is zero-error).'}
    - {measure: R1,   value: '\Omega(2.59^{\,d}),\ O(1.007\cdot 2.64944^{\,d})', note: 'Between $\mathrm{R}_{\varepsilon}$ and $\mathrm{R}_0$, whose recorded windows coincide here.'}
    - {measure: RS,   value: '\Omega(2^{\,d}),\ O(2.64944^{\,d})', putative: true, note: 'Not pinned. Upper: $\mathrm{RS} \le \mathrm{R}/(1-2\varepsilon)$. Lower: $\mathrm{RS} = \Omega(\mathrm{bs}) = \Omega(2^d)$ -- star out a uniformly random one of the $\mathrm{bs}$ disjoint sensitive blocks of a maximally block-sensitive input; all other bits agree with it, so finding a $\ast$ is unstructured search over the blocks. Sabotage complexity composes perfectly, so pinning $\mathrm{RS}$ here would immediately pin the [[Rstar]] exponent.'}
    - {measure: prt,  value: '\Omega(2^{\,d}),\ O(2.64944^{\,d})', note: 'Sandwiched: $\mathrm{fbs} \le \mathrm{prt}_{\varepsilon} \le \mathrm{R}_{\varepsilon}$, with $\mathrm{fbs} = 2^d$ and the recorded $\mathrm{R}$ upper bound. The related conical-junta LP [[cjdeg]] is known to be $\Omega(2.59^d)$, i.e. near the top of this window.'}
    - {measure: rprt, value: '\Omega(2^{\,d}),\ O(2.64944^{\,d})', conf: medium, note: 'As [[prt]]; the relaxed partition bound still dominates $\mathrm{fbs}$ (the zoo''s own observation about the [JainKlauck10] techniques) and is still at most $\mathrm{R}$.'}
    - {measure: Fdim, value: 'N = 3^d', putative: true, note: 'The Fourier support contains every singleton: $\widehat{\mathrm{MAJ}_3}$ is supported on $\{1\},\{2\},\{3\},\{123\}$, and taking the outer set $A = \{j\}$ at every level embeds each lower-level support set into a block, so by induction $\{\ell\} \in \mathrm{supp}\widehat{f}$ for every leaf $\ell$. Singletons alone span $\mathbb{F}_2^N$, so $\dim_{\mathbb{F}_2} = N$ and the bound $\mathrm{D}^{\oplus}\le\dim_{\mathbb{F}_2}$ is vacuous -- the real bound on [[PDT]] here is the granularity one, which gives $(N+1)/2$.'}
    - {measure: Inf1, value: '(3/2)^d = N^{0.3691}', putative: true, note: 'For Boolean-valued $f$ the $L_1$ and $L_2$ notions of total influence coincide, $\mathrm{I}^1(f) = \mathrm{I}(f)$; they differ only for bounded real-valued $p$. See [[Inf]].'}
    - {measure: MaxInf, value: '2^{-d} = N^{-0.6309}', putative: true, note: 'Recursive majority is transitive, so every coordinate has the same influence $\mathrm{I}(f)/N = (3/2)^d/3^d = 2^{-d}$. Note this is exactly $1/\mathrm{s}$: the maximum influence is the reciprocal of the sensitivity.'}
    - {measure: Var, value: '1', note: '$\mathrm{MAJ}_3$ is balanced, so every level is, and $\hat f(\emptyset) = 0$.'}
    - {measure: osss, value: '2^d = N^{0.6309}', putative: true, note: '$\mathrm{Var} = 1$ over $\mathrm{MaxInf} = 2^{-d}$. Exactly $\mathrm{s}(f) = 2^d$: for a transitive balanced function $\mathrm{osss} = N/\mathrm{I}$, and here that is the sensitivity on the nose. Still short of $\mathrm{R}_0 = \Omega(2.59^d)$.'}
    - {measure: nsr, value: '\Theta((3/2)^d) = \Theta(N^{0.3691})', putative: true, note: 'Near $\rho = 1$ the stability recursion $\Psi(\rho) = (3\rho+\rho^3)/4$ of the [[NS]] entry acts as $1-\varepsilon \mapsto 1-\tfrac32\varepsilon$, so starting from $\varepsilon = 2\delta$ the stability leaves the neighbourhood of $1$ after $(3/2)^d\delta = \Theta(1)$, i.e. $\delta^{*} = \Theta((2/3)^d)$. Equal to $\mathrm{I}(f) = (3/2)^d$, so the bound $\mathrm{nsr}\le 4\mathrm{I}/\mathrm{Var}$ is tight and $\mathrm{osss}\cdot\mathrm{nsr} = \Theta(N)$.'}
    - {measure: Inf,  value: '(3/2)^d = N^{0.3691}', putative: true, note: '$\mathrm{MAJ}_3$ is balanced, so on a uniform input the three subtree values are uniform and independent and total influence multiplies: $\mathrm{I}(f\circ g^n) = \mathrm{I}(f)\mathrm{I}(g)$. Each coordinate of $\mathrm{MAJ}_3$ is pivotal exactly when the other two disagree, so $\mathrm{I}(\mathrm{MAJ}_3)=\tfrac32$.'}
    - {measure: L1,   value: '2^{\Theta(N)}', putative: true, note: 'Balancedness kills the empty coefficient, so Fourier coefficients of the composition factor exactly and $\widehat L_1(f\circ g^n) = \sum_A |\widehat f(A)|\,\widehat L_1(g)^{|A|}$. With $\widehat{\mathrm{MAJ}_3} = \tfrac12(\chi_1+\chi_2+\chi_3-\chi_{123})$ this reads $\widehat L_1(d) = \tfrac32 \widehat L_1(d-1) + \tfrac12 \widehat L_1(d-1)^3$, starting from $2$; the cubic recursion gives $\log_2 \widehat L_1 \sim 0.26\,N$, against the universal ceiling $2^{N/2}$. (Values: $2, 7, 182, 3014557,\dots$)'}
    - {measure: spar, value: '2^{\Theta(N)}', putative: true, note: 'The same factorisation as for [[L1]], now counting terms instead of adding them: $\mathrm{spar}(f\circ g^n) = \sum_{A \in \mathrm{supp}\widehat f} \mathrm{spar}(g)^{|A|}$, since every Fourier coefficient of the composition is a single product and nothing cancels. Here $\mathrm{spar}(d) = 3\,\mathrm{spar}(d-1) + \mathrm{spar}(d-1)^3$ from $\mathrm{spar}(0)=1$: $4, 76, 439204, \dots$, so $\log_2\mathrm{spar} = \Theta(3^{\,d}) = \Theta(N)$. (Checked exhaustively at $d = 2$.)'}
    - {measure: Rna,  value: '\Theta(N) = \Theta(3^{\,d})', putative: true, note: 'Non-adaptive randomness buys nothing on any function that depends on all its variables. Pick a uniformly random leaf $\ell$ and a fixed input making $\ell$ pivotal, then set $x_\ell$ uniformly at random. A non-adaptive algorithm reading $q$ positions hits $\ell$ with probability $\le q/N$, and otherwise sees a fixed string and must guess a uniform bit, so its success probability is at most $\tfrac12+\tfrac{q}{2N}$; hence $\mathrm{R}^{\mathrm{na}}_{1/3} \ge N/3$. Together with $\mathrm{R}^{\mathrm{na}} \le \mathrm{D}^{\mathrm{na}} = N$ this pins the value, and no part of the open $\mathrm{R}$ exponent is needed.'}
    - {measure: cbs,  value: '2^d', refs: [GoosPitassi14], note: '$\mathrm{cbs} = \mathrm{bs}$ for Boolean-valued problems [GoosPitassi14], and $\mathrm{bs} = 2^d$.'}
    - {measure: Np,   value: '\Omega(2.59^{\,d}),\ O(d\,2.64944^{\,d})', refs: [FRPU94], note: 'A noisy-query algorithm is randomized, so $\mathrm{N}_p \ge \mathrm{R} = \Omega(2.59^{\,d})$; amplifying each query of the optimal randomized tree by $O(\log \mathrm{R}) = O(d)$ repetitions gives $\mathrm{N}_p = O(\mathrm{R}\log \mathrm{R}) = O(d\,2.64944^{\,d})$ [FRPU94]. The whole $\mathrm{R}$ window is inherited, so the noisy exponent is open for exactly the same reason.'}
    - {measure: robustQ, value: '\Omega(2^{\,d}),\ O(d\,2^{\,d})', refs: [BNRdW05], note: '$\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(2^d)$ and $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ [BNRdW05]. Unlike the classical side, the *quantum* value is pinned to within the logarithm because $\mathrm{Q} = \Theta(2^d)$ is exact [Reichardt11].'}
    - {measure: chi,  value: '\Omega(2^{\,d}),\ O(2.64944^{\,d})', refs: [Li18], note: '$\chi = \Omega(\mathrm{bs}) = \Omega(2^d)$ [Li18], and $\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(1.007\cdot 2.64944^{\,d})$.'}
    - {measure: chibar, value: '\Omega(2^{\,d}),\ O(2.64944^{\,d})', refs: [GLSS19], note: 'Above $\chi = \Omega(\mathrm{bs})$ and above the recorded $\mathrm{RS} = \Omega(2^d)$; below $\mathrm{LR} \le \mathrm{R}$ [GLSS19].'}
    - {measure: LR,   value: '\Omega(2^{\,d}),\ O(2.64944^{\,d})', refs: [BBGM22], note: '$\mathrm{LR} = \Omega(\bar\chi) = \Omega(\mathrm{bs}) = \Omega(2^d)$ and $\mathrm{LR} \le \mathrm{R}$ [BBGM22]; the generic $\mathrm{LR} = \Omega(\sqrt{\mathrm{R}})$ is weaker here.'}
    - {measure: NS,   value: '\tfrac{1}{2} - \Theta\big((3/4)^{\,d}\big)', putative: true, refs: [ODonnell14], note: 'Exactly computable, because $\mathrm{MAJ}_3$ is balanced: $\mathrm{Stab}_\rho(F\circ g^m) = \mathrm{Stab}_{\mathrm{Stab}_\rho(g)}(F)$ when $\mathbb{E}[g]=0$, and $\mathrm{MAJ}_3 = \tfrac12(x_1+x_2+x_3) - \tfrac12 x_1x_2x_3$ in $\pm 1$ gives $\Psi(\rho) := \mathrm{Stab}_\rho(\mathrm{MAJ}_3) = (3\rho+\rho^3)/4$. Since $\Psi(\rho) < \rho$ on $(0,1)$ the iterates fall to $0$, and near $0$ each step multiplies by $\Psi''(0) = 3/4$; hence $\mathrm{Stab}_\rho = \Theta((3/4)^d)$ and $\mathrm{NS}_\delta = (1-\mathrm{Stab}_{1-2\delta})/2 = \tfrac12 - \Theta((3/4)^d)$ for every constant $\delta \in (0,1/2)$.'}
    - {measure: Stab, value: '\Theta\big((3/4)^{\,d}\big) = \Theta(N^{-0.2619})', putative: true, refs: [ODonnell14], note: 'The iteration $\rho \mapsto (3\rho+\rho^3)/4$ of the [[NS]] entry, run $d$ times from any constant $\rho \in (0,1)$, converges to $0$ at rate $3/4$ per level: $\mathrm{Stab}_\rho(f) = \Theta((3/4)^d) = \Theta(N^{\log_3(3/4)}) = \Theta(N^{-0.2619})$. Recursive majority is thus *noise sensitive* -- a random-looking balanced function -- even though it is a read-once formula.'}
    - {measure: ndeg, value: '\Omega(1.732^{\,d}),\ O(2^d)', refs: [IJKKKSWW23], note: 'Upper: $\mathrm{ndeg} \le \mathrm{C}^1 = 2^d$ (sum the indicators of the $1$-certificates; all coefficients are positive, so nothing cancels), already a factor $(3/2)^d$ below $\deg = 3^d$. Lower: $\mathrm{MAJ}_3^{\circ d}$ is self-dual, so $\mathrm{ndeg}(\bar f) = \mathrm{ndeg}(f)$ and therefore $\mathrm{ndeg} = \mathrm{rdeg}$; recursive majority is a read-once $\mathsf{TC}^0$ formula, for which $\mathrm{rdeg} = \Omega(\sqrt{\deg}) = \Omega(3^{d/2}) = \Omega(1.732^{\,d})$ [IJKKKSWW23].'}
    - {measure: rdeg, value: '\Omega(1.732^{\,d}),\ O(2^d)', refs: [IJKKKSWW23], note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\} \le \mathrm{C}(f) = 2^d$ [IJKKKSWW23]. From below, read-once $\mathsf{AC}^0/\mathsf{TC}^0$ formulas satisfy $\mathrm{rdeg} = \Omega(\sqrt{\deg})$, i.e. $\Omega(3^{d/2}) = \Omega(1.732^{\,d})$ here. The remaining factor-$1.155^{\,d}$ window is an instance of the open question of whether $\mathrm{rdeg} = \deg^{\Omega(1)}$ is tight for read-once formulas.'}
    - {measure: NQ,   value: '\Omega(1.732^{\,d}),\ O(2^{d-1})', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil$ [deWolf03], with the [[ndeg]] window $[\Omega(1.732^{\,d}),\,2^d]$. Nondeterministic quantum queries are thus within a $1.155^{\,d}$ factor of the bounded-error $\mathrm{Q} = \Theta(2^d)$.'}
    - {measure: odeg, value: 'O(2^d)', note: '$\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = \Theta(2^d)$. Self-duality of $\mathrm{MAJ}_3$ makes the two one-sided degrees $\widetilde{\deg}_+(f)$ and $\widetilde{\deg}_+(\bar f)$ equal, so no asymmetry can be exploited on this family.'}
    - {measure: sdeg, value: 'O(2^d)', note: 'From $\mathrm{sdeg} \le \widetilde{\deg} = \Theta(2^d)$. The base gate is a linear threshold function, so $\mathrm{sdeg}(\mathrm{MAJ}_3) = 1$; how fast sign degree grows under self-composition of an LTF is not known, which is why only the upper bound is recorded.'}
    - {measure: ardeg, value: 'O(2^d)', note: 'At most both $\mathrm{rdeg} \le 2^d$ and $\widetilde{\deg} = \Theta(2^d)$.'}
    - {measure: PostQ, value: 'O(2^d)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] and $\mathrm{rdeg}_{1/3} \le \mathrm{rdeg} \le 2^d$; since $\mathrm{Q} = \Theta(2^d)$ already, post-selection saves at most a constant factor unless the approximate rational degree drops below the exact one.'}
  refs: [SaksWigderson86, Reichardt11, ABKRT21]
  see_also: [MAJ, NANDtree]

- id: Kushilevitz
  name: Kushilevitz's function (iterated)
  symbol: 'K^{\circ k}'
  aliases: ['the 6-variable degree-3 function', 'Nisan-Wigderson example']
  group: composed
  order: 23
  kind: total
  arity: '$N = 6^k$ bits'
  scale: {var: k, subs: {N: '6^k'}}
  short: 'A 6-variable function with $\deg = 3$ and $\mathrm{s}=6$; iterating gives $\mathrm{s} = \deg^{1.63}$.'
  definition: |
    Kushilevitz exhibited a function $K:\{0,1\}^6\to\{0,1\}$ with $\deg(K)=3$ but
    $\mathrm{s}(K)=\mathrm{bs}(K)=6$. Since $\deg$ is multiplicative under
    composition and $\mathrm{bs}$ is (at least) multiplicative, iterating $K$
    gives $\deg = N^{\log_6 3}=N^{0.6131}$ against $\mathrm{bs} = N$, i.e.
    $\mathrm{bs} = \deg^{\log 6/\log 3} = \deg^{1.6309\ldots}$.
  formal: |
    Identify the six coordinates with the projective line
    $\mathbb{P}^1(\mathbb{F}_5)=\{0,1,2,3,4,\infty\}$ and let $\mathcal{F}$ be the
    orbit of $\{\infty,0,1\}$ under $\mathrm{PSL}(2,5)$, a family of ten $3$-sets
    containing exactly one of each complementary pair. Then
    $$K(x) = 1 \iff |x| \in \{1,2,6\}\ \text{ or }\ \big(|x| = 3 \text{ and } \mathrm{supp}(x) \in \mathcal{F}\big).$$
    Equivalently, in the $\pm1$ encoding,
    $$(-1)^{K(x)} \;=\; \tfrac14\Big(\textstyle\sum_{T\in\mathcal F}\chi_T(x) \;-\; \sum_{i=1}^{6}\chi_i(x)\Big),$$
    which exhibits $\deg(K)=3$, $\widehat{L}_1(K)=4$, $\mathrm{spar}(K)=16$ and
    $\mathbb{E}[K]=\tfrac12$ at a glance. Up to permuting coordinates, negating
    individual coordinates and negating the output, this is the *only*
    $f:\{0,1\}^6\to\{0,1\}$ with $\deg(f) = 3$ and a fully sensitive
    input, and its automorphism group is exactly $\mathrm{PSL}(2,5)\cong A_5$
    (order $60$, transitive on the six coordinates). The iterated function is
    $K^{\circ k}$ on $N = 6^k$ bits.
  values:
    - {measure: deg, value: '3^k = N^{0.6131}'}
    - {measure: s,   value: 'N = 6^k'}
    - {measure: bs,  value: 'N'}
    - {measure: fbs, value: 'N'}
    - {measure: RC,  value: '\Theta(N)'}
    - {measure: C,   value: 'N'}
    - {measure: D,   value: 'N'}
    - {measure: FC,     value: 'N'}
    - {measure: EC,     value: 'N', note: 'Between $\mathrm{fbs}=N$ and $\mathrm{C}=N$.'}
    - {measure: Dna,    value: 'N'}
    - {measure: R0, value: 'N', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: CA, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{CA}(f) \le \mathrm{fbs}(f)$, with $\mathrm{RC}(f) = \Theta(N)$ and $\mathrm{fbs}(f) = N$ here.'}
    - {measure: CGpub, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{fbs}(f)$, with $\mathrm{RC}(f) = \Theta(N)$ and $\mathrm{fbs}(f) = N$ here.'}
    - {measure: CGstar, value: '\Theta(N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: R, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: Rbar, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: R1, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: chi, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \chi(g) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: chibar, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \bar{\chi}(g) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: LR, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: Rstar, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: CG, value: '\Omega(N),\ O(N^2)', note: 'Not pinned. The private-coin certificate game is **not** bounded by $\mathrm{D}$; the correct sandwich is $\max\{\mathrm{Adv}^2,\mathrm{R}_0,\mathrm{CA}\} \le \mathrm{CG} \le \min\{\mathrm{C}^0\mathrm{C}^1,\ O(\mathrm{EC}^2)\}$. Lower: $\lambda = \sqrt N$ and $\mathrm{Adv} \ge \lambda$, so $\mathrm{Adv}^2 \ge N$ (the $\mathrm{R}_0 = N$ route gives the same). Upper: $\mathrm{C}^0\mathrm{C}^1 = N^2$, and $\mathrm{EC} = N$ gives the same $O(N^2)$. So $\mathrm{CG}$ can be as large as the *square* of the arity here and only a range is provable.'}
    - {measure: Rna, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with both ends $N$ here.'}
    - {measure: prt, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $N$ here.'}
    - {measure: rprt, value: '\Theta(N)', conf: medium, note: 'Sandwiched: $\mathrm{bs}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $N$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: s0,   value: 'N', putative: true, note: 'The base function has $K(0^6)=0$ with all six coordinates sensitive, so the all-zero input of $K^{\circ k}$ has every block at $0^6$, every block value $0$, and every one of the $N$ bits sensitive.'}
    - {measure: s1,   value: 'N', putative: true, note: 'Mirror of $\mathrm{s}^0$: $K(1^6)=1$ (weight $6$ is a $1$-input, all six weight-$5$ neighbours are $0$-inputs), so the all-one input of $K^{\circ k}$ is fully sensitive as well. Kushilevitz''s function is fully sensitive on *both* sides, which is what makes the $\mathrm{s}$-vs-$\deg$ separation survive negation.'}
    - {measure: bs0,  value: 'N', note: 'Between $\mathrm{s}^0 = N$ and the trivial ceiling $N$.'}
    - {measure: bs1,  value: 'N', note: 'Between $\mathrm{s}^1 = N$ and the trivial ceiling $N$.'}
    - {measure: C0,   value: 'N', note: 'Between $\mathrm{bs}^0 = N$ and the trivial ceiling $N$.'}
    - {measure: C1,   value: 'N', note: 'Between $\mathrm{bs}^1 = N$ and the trivial ceiling $N$.'}
    - {measure: Cmin, value: '4^k = N^{0.7737}', putative: true, note: 'Exhaustive search over the $64$ inputs of the base function gives $\mathrm{C}_{\min}(K)=4$, attained on both sides ($\min_{K(x)=0}\mathrm{C}_x = \min_{K(x)=1}\mathrm{C}_x = 4$). Minimum certificate complexity composes: a certificate of $f\circ g^n$ at $x$ restricts to a certificate of $f$ at $g(x)$ on the blocks it certifies, so $\mathrm{C}_x(f\circ g^n) = \min_{S}\sum_{j\in S}\mathrm{C}_{x^j}(g)$ over certificates $S$ of $f$, and since $K$ is $4$ on both sides the minimum is $4\cdot\mathrm{C}_{\min}$ of the previous level. So $\mathrm{C}_{\min} = 4^k$ against $\mathrm{C} = 6^k$ -- a genuine gap, unlike [[ANDOR]] where the two coincide.'}
    - {measure: deg2, value: '3^k = N^{0.6131}', putative: true, note: 'Mod-$2$ degree is exactly multiplicative under composition: the degree-$d_f$ part of $f$ over $\mathbb{F}_2$ is a sum of monomials in *disjoint* blocks, each of which becomes a product of the blocks'' degree-$d_g$ parts, and distinct top monomials of $f$ land on distinct monomials, so nothing cancels. The base has $\deg_2(K)=3=\deg(K)$ (checked on the truth table), so $\deg_2 = \deg = 3^k$ here: characteristic $2$ buys nothing, and the $\mathrm{s}$-vs-$\deg$ separation is simultaneously an $\mathrm{s}$-vs-$\deg_2$ separation.'}
    - {measure: UC,   value: 'N', note: 'Squeezed between $\mathrm{C} = N$ and $\mathrm{D} = N$, since $\mathrm{C} \le \mathrm{UC} \le \mathrm{SP} \le \mathrm{D}$.'}
    - {measure: SP,   value: 'N', note: 'Squeezed between $\mathrm{UC} = N$ and $\mathrm{D} = N$.'}
    - {measure: rank, value: '\Theta(N)', putative: true, note: 'Between $N/2$ and $N$. Upper: $\mathrm{rank}\le\mathrm{D}=N$. Lower, by a Prover--Delayer argument that composes: $\mathrm{rank}(f\circ g^n) \ge \mathrm{D}(f)\,(\mathrm{C}_{\min}(g)-1)$. The Delayer defers the first $\mathrm{C}_{\min}(g)-1$ queries inside each block -- so few bits can never determine that block''s value -- and only then commits to the value the block will take, answering afterwards so as to force it. The order in which blocks reach that commitment is an adversary play against $f$, and the game cannot end until the *completed* blocks alone determine $f$, so at least $\mathrm{D}(f)$ blocks reach commitment, each paying $\mathrm{C}_{\min}(g)-1$ points. Here $\mathrm{C}_{\min}(K) = 4$ and $\mathrm{D}(K^{\circ k-1}) = 6^{k-1}$, so $\mathrm{rank} \ge 3\cdot 6^{k-1} = N/2$. Kushilevitz''s function therefore has *full* rank up to a factor $2$: none of its depth is caterpillar, in contrast with $\mathrm{C}_{\min} = N^{0.77}$.'}
    - {measure: D_size, value: '2^{\Theta(N)}', putative: true, note: 'A decision tree of rank $r$ contains a complete binary branching of depth $r$ and so has at least $2^{r}$ leaves; with $\mathrm{rank} \ge N/2$ that gives $\mathrm{DTsize} \ge 2^{N/2}$, and $2^{\mathrm{D}} = 2^{N}$ is the ceiling. (The weaker generic bound $2^{\mathrm{C}_{\min}}$ would only give $2^{N^{0.77}}$.)'}
    - {measure: lambda, value: '6^{k/2} = \sqrt N', refs: [ABKRT21], note: 'The sensitivity graph of the base function is a $60$-vertex-transitive graph on the cube with spectral norm exactly $\sqrt6$, and $\lambda$ is exactly multiplicative under composition, so $\lambda(K^{\circ k}) = 6^{k/2}$. Note this saturates Huang''s inequality $\deg \le \lambda^2$ *at the base* ($3 \le 6$) but not asymptotically: $\lambda^2 = N$ while $\deg = N^{0.61}$.'}
    - {measure: UCmin, value: '\Omega(N^{0.6131}),\ O(N)', putative: true, note: 'Not pinned. Lower: an unambiguous $b$-certificate family of width $w$ writes $f$ (or $1-f$) as a sum of indicators of disjoint subcubes of codimension $\le w$, so $\deg \le \mathrm{UC}^0$ and $\deg \le \mathrm{UC}^1$, i.e. $\mathrm{UC}_{\min} \ge \deg = 3^k$. Upper: $\mathrm{UC}_{\min} \le \mathrm{UC} = N$. Unlike the read-once functions in this file, $\deg \ne \mathrm{D}$ here, so the squeeze leaves a genuine $N^{0.39}$ window.'}
    - {measure: PDT,  value: '\Omega(N^{0.6131}),\ O(N)', putative: true, refs: [ChistopolskayaPodolskii18], note: 'Not pinned. Upper: $\mathrm{D}^{\oplus}\le\mathrm{D}=N$. Lower by granularity: every coefficient of $K^{\circ k}$ is a product of base coefficients, each exactly $\pm\tfrac14$, and the number of factors obeys $F_k = 1 + 3F_{k-1}$ (choose one of the ten *triples* at every level), so the extreme coefficient is $\pm 4^{-(3^k-1)/2} = \pm 2^{-(3^k-1)}$ and the granularity is exactly $3^k-1$. [ChistopolskayaPodolskii18] then give $\mathrm{D}^{\oplus} \ge 3^k = \deg$. Parity queries can therefore save at most the $N^{0.39}$ by which $\deg$ falls short of $\mathrm{D}$.'}
    - {measure: QC,   value: '\Theta(\sqrt N)', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ for every $f$ ([[QC]] vs [[fbs]]), and $\mathrm{fbs} = N$ here.'}
    - {measure: psD,  value: '\Theta(N)', note: 'For a Boolean-valued function the canonical answer is forced to be $f(x)$, so pseudo-determinism is free: $\mathrm{psD}(f) = \Theta(\mathrm{R}(f)) = \Theta(N)$.'}
    - {measure: RS,   value: '\Theta(N)', putative: true, note: 'Pinned. Upper: $\mathrm{RS} \le \mathrm{R}/(1-2\varepsilon) = O(N)$. Lower: $\mathrm{RS} = \Omega(\mathrm{bs}) = \Omega(N)$ -- at the fully sensitive input, star out one uniformly random coordinate; every other bit agrees with that input, so finding the $\ast$ is unstructured search over all $N$ positions.'}
    - {measure: Adv,  value: '\Omega(\sqrt N),\ O(N)', note: 'Not pinned, for the same reason as [[Q]]: $\lambda \le \mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$ with $\lambda = \sqrt N$, and the certificate barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = N$ is no better than the trivial ceiling here.'}
    - {measure: Advpm, value: '\Omega(\sqrt N),\ O(N)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), so this inherits the [[Q]] window verbatim; pinning it *is* the open question about the base function''s adversary bound.'}
    - {measure: gamma2, value: '\Omega(\sqrt N),\ O(N)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), so this inherits the [[Q]] window verbatim.'}
    - {measure: MAdv, value: '\Omega(\sqrt N),\ O(N)', note: 'Between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}_{\varepsilon}$, which agree up to constants; the window is that of [[Q]].'}
    - {measure: cjdeg, value: '\Omega(\sqrt N),\ O(N)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon} \le \mathrm{cjdeg}_{\varepsilon} \le \mathrm{R}_{\varepsilon}$, with $\widetilde{\deg} = \Omega(\sqrt N)$ and $\mathrm{R} = \Theta(N)$ here.'}
    - {measure: Fdim, value: 'N = 6^k', putative: true, note: 'The Fourier support of the base contains all six singletons (the $-\tfrac14\sum_i\chi_i$ term of the formal expansion), and taking the outer set $A = \{j\}$ at every level embeds each lower-level support set into a block, so every singleton of $[N]$ is in $\mathrm{supp}\widehat{K^{\circ k}}$. Singletons span $\mathbb{F}_2^N$, so $\dim_{\mathbb{F}_2} = N$ even though $\mathrm{spar} = 2^{\Theta(N^{0.61})}$ is far from full.'}
    - {measure: Inf1, value: '(9/4)^k = N^{0.4526}', putative: true, note: 'For Boolean-valued $f$ the $L_1$ and $L_2$ notions of total influence coincide, $\mathrm{I}^1(f) = \mathrm{I}(f)$; see [[Inf]].'}
    - {measure: MaxInf, value: '(3/8)^k = N^{-0.5474}', putative: true, note: 'The automorphism group of the base is $\mathrm{PSL}(2,5)$, transitive on the six coordinates, so $K^{\circ k}$ is transitive and every coordinate has influence $\mathrm{I}(f)/N = (9/4)^k/6^k$. Maximum influence therefore *decays* even though $\mathrm{s} = N$: the fully sensitive inputs form a vanishing fraction of the cube.'}
    - {measure: Var, value: '1', note: 'The $\pm1$ Fourier expansion of the gadget recorded in the [[Inf]] entry has no constant term, so the gadget and every iterate of it is balanced.'}
    - {measure: osss, value: '(8/3)^k = N^{0.5474}', putative: true, note: '$\mathrm{Var} = 1$ over $\mathrm{MaxInf} = (3/8)^k$. The function is transitive, so this is $N/\mathrm{I}(f) = 6^k/(9/4)^k$. Far short of $\mathrm{D} = \mathrm{R}_0 = N$, and short even of $\mathrm{s} = N$.'}
    - {measure: nsr, value: '\Theta((9/4)^k) = \Theta(N^{0.4526})', putative: true, note: 'The stability recursion $\Psi_K(\rho) = (3\rho+5\rho^3)/8$ of the [[NS]] entry acts as $1-\varepsilon\mapsto 1-\tfrac94\varepsilon$ near $\rho = 1$, so $\delta^{*} = \Theta((4/9)^k)$. Equal to $\mathrm{I}(f)$, so $\mathrm{osss}\cdot\mathrm{nsr} = \Theta(N)$ as for every transitive function whose $\mathrm{NS}_\delta\le\delta\mathrm{I}$ bound is tight.'}
    - {measure: Inf,  value: '(9/4)^k = N^{0.4526}', putative: true, note: 'The base is balanced, so under a uniform input the block values of $K\circ g^6$ are uniform and independent and total influence is exactly multiplicative: $\mathrm{I}(f\circ g^n) = \mathrm{I}(f)\,\mathrm{I}(g)$. From the Fourier expansion above, $\mathrm{I}(K) = 1\cdot 6\cdot(\tfrac14)^2 + 3\cdot 10\cdot(\tfrac14)^2 = \tfrac94$. So influence is only $N^{0.45}$ while $\mathrm{s} = N$: sensitivity here is concentrated on a vanishing fraction of the cube.'}
    - {measure: L1,   value: '2^{\Theta(3^k)}', putative: true, note: 'Because $K$ is balanced, $\widehat{K}(\emptyset)=0$ and the Fourier coefficients of a composition factor exactly: $\widehat{f\circ g}(T) = \widehat f(A)\prod_{j\in A}\widehat g(T_j)$ where $A$ is the set of blocks $T$ touches. Hence $\widehat L_1(f\circ g^n) = \sum_A|\widehat f(A)|\,\widehat L_1(g)^{|A|}$ with no cancellation, i.e. $\widehat L_1(K^{\circ k}) = \tfrac32\widehat L_1(K^{\circ k-1}) + \tfrac52\widehat L_1(K^{\circ k-1})^3$ from $\widehat L_1(K)=4$. The cubic recursion gives $\log \widehat L_1 = \Theta(3^k) = \Theta(\deg)$, comfortably under the universal ceiling $2^{N/2}$.'}
    - {measure: spar, value: '2^{\Theta(N^{0.6131})}', putative: true, note: 'The same factorisation as for [[L1]], counting terms instead of adding them: $\mathrm{spar}(f\circ g^n) = \sum_{A\in\mathrm{supp}\widehat f}\mathrm{spar}(g)^{|A|}$. With the ten triples and six singletons of $\widehat K$ this is $\mathrm{spar}(k) = 6\,\mathrm{spar}(k-1) + 10\,\mathrm{spar}(k-1)^3$ from $\mathrm{spar}(0)=1$: $16, 41056, 6.9\cdot10^{14},\dots$, so $\log_2 \mathrm{spar} = \Theta(3^k) = \Theta(N^{\log_6 3})$. Sparsity is therefore governed by the *degree*, not by $N$: $K^{\circ k}$ has only $2^{N^{0.62}}$ of the $2^N$ possible coefficients, matching $\widehat L_1$.'}
    - {measure: adeg, value: '\Omega(\sqrt N),\ O(N^{0.6131})', note: 'Not pinned. Upper: $\widetilde{\deg}\le\deg = 3^k$. Lower: $\widetilde{\deg} = \Omega(\sqrt{\mathrm{bs}}) = \Omega(\sqrt N)$. An LP over the $64$ inputs shows the base already has $\widetilde{\deg}(K) = \deg(K) = 3$, but no inner composition theorem for approximate degree is strong enough to iterate that (see [[comp-adeg]]).'}
    - {measure: Q,    value: '\Omega(\sqrt N),\ O(N)', note: 'Not pinned. $\mathrm{Q}$ composes perfectly, so $\mathrm{Q}(K^{\circ k}) = \Theta(\mathrm{Adv}^{\pm}(K)^k)$ and the whole question is the value of the base adversary bound, which lies between $\lambda(K) = \sqrt6$ and $\mathrm{D}(K)=6$. The two ends give exactly $\sqrt N$ and $N$.'}
    - {measure: Q0,   value: '\Omega(\sqrt N),\ O(N)', note: 'The $\deg/2 = 3^k/2$ floor belongs to $\mathrm{Q}_{\mathrm{E}}$ (the row below), not to $\mathrm{Q}_0$: the zero-error floor is $\mathrm{rdeg}/2$, and $\mathrm{rdeg}$ is only bounded *above* by $3^k$ here. What is left is $\mathrm{Q} = \Omega(\sqrt N)$ underneath and $\mathrm{D} = N$ above.'}
    - {measure: QE,   value: '\Omega(N^{0.6131}),\ O(N)', note: 'Between $\deg/2 = 3^k/2$ and $\mathrm{D} = N$. Unlike [[ANDOR]] and [[NANDtree]], where $\deg = \mathrm{D}$ forces $\mathrm{Q}_E = \Theta(\mathrm{D})$, here the degree bound leaves a genuine $N^{0.39}$ window.'}
    - {measure: cbs,  value: 'N', refs: [GoosPitassi14], note: '$\mathrm{cbs} = \mathrm{bs}$ for Boolean-valued problems [GoosPitassi14], and $\mathrm{bs} = N$: the function is fully block sensitive.'}
    - {measure: Dmu,  value: '\Theta(N)', refs: [Yao77], note: 'Yao''s minimax gives $\max_\mu \mathrm{D}^{\mu}_{1/3} = \Theta(\mathrm{R}_{1/3}) = \Theta(N)$.'}
    - {measure: Np,   value: '\Omega(N),\ O(N\log N)', refs: [FRPU94], note: '$\mathrm{N}_p \ge \mathrm{R} = \Omega(N)$, and majority-amplifying each of the $\mathrm{R}$ queries costs a $O(\log \mathrm{R})$ factor [FRPU94].'}
    - {measure: noisyR, value: '\Theta(N)', refs: [CKMPSS23], note: '$\mathrm{noisyR} \le \mathrm{R}$ always, and the recorded implication $\mathrm{R}(f) = \Theta(\text{arity}) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ applies since $\mathrm{R} = \Theta(N)$.'}
    - {measure: robustQ, value: '\Omega(\sqrt N),\ O(N)', refs: [BNRdW05], note: 'Lower: $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Omega(\sqrt N)$. Upper: $N$ noisy quantum queries recover the whole input with high probability [BNRdW05], so $\mathrm{Q}^{\mathrm{rob}} = O(N)$ for any function; this beats $O(\mathrm{Q}\log \mathrm{Q})$ because $\mathrm{Q}$ itself is only known up to an $N^{0.11}$ window here.'}
    - {measure: NS,   value: '\tfrac{1}{2} - \Theta\big((3/8)^{\,k}\big)', putative: true, refs: [ODonnell14, NisanWigderson95], note: 'The gadget is balanced, so $\mathrm{Stab}_\rho(f\circ g^m) = \mathrm{Stab}_{\mathrm{Stab}_\rho(g)}(f)$ applies. In $\pm 1$ the Kushilevitz gadget is $\tfrac14(\sum_{T\in\mathcal{F}}\chi_T - \sum_i \chi_i)$ with $|\mathcal{F}| = 10$ triples and $6$ singletons (Parseval: $(10+6)/16 = 1$; this also reproduces the recorded $\mathrm{I} = (30+6)/16 = 9/4$ and $\mathrm{MaxInf} = (5+1)/16 = 3/8$). Hence $\Psi_K(\rho) = (3\rho+5\rho^3)/8 < \rho$ on $(0,1)$, with $\Psi_K''(0) = 3/8$, so $\mathrm{Stab} = \Theta((3/8)^k)$ and $\mathrm{NS}_\delta = \tfrac12 - \Theta((3/8)^k)$.'}
    - {measure: Stab, value: '\Theta\big((3/8)^{\,k}\big) = \Theta(N^{-0.5474})', putative: true, refs: [ODonnell14], note: 'Iterating $\Psi_K(\rho) = (3\rho+5\rho^3)/8$ from the [[NS]] entry $k$ times drives any constant $\rho$ to $0$ at rate $3/8$ per level, so $\mathrm{Stab}_\rho = \Theta((3/8)^k) = \Theta(N^{\log_6(3/8)}) = \Theta(N^{-0.5474})$. Strongly noise sensitive, as the fully block-sensitive $\mathrm{bs} = N$ suggests.'}
    - {measure: ndeg, value: '\le 3^k = N^{0.6131}', refs: [IJKKKSWW23], note: '$\mathrm{ndeg} \le \deg = 3^k$ (a polynomial computing $f$ exactly is in particular nonzero exactly on $f^{-1}(1)$). The other generic bound $\mathrm{ndeg} \le \mathrm{C}^1 = N$ is much weaker here, which is the whole point of this function: its degree is polynomially smaller than its certificate complexity.'}
    - {measure: rdeg, value: '\le 3^k = N^{0.6131}', refs: [IJKKKSWW23], note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\} \le \deg(f) = 3^k$, since $\deg(\bar f) = \deg(f)$. Again far below $\mathrm{C} = N$.'}
    - {measure: NQ,   value: 'O(N^{0.6131})', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil \le 3^k/2$ [deWolf03], from the [[ndeg]] entry.'}
    - {measure: odeg, value: 'O(N^{0.6131})', note: '$\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = O(N^{0.6131})$; the lower end of the recorded $\widetilde{\deg}$ window, $\Omega(\sqrt N)$, comes from $\mathrm{bs} = O(\widetilde{\deg}^2)$ and does not transfer to the one-sided version.'}
    - {measure: sdeg, value: 'O(N^{0.6131})', note: 'From $\mathrm{sdeg} \le \widetilde{\deg} \le \deg = 3^k$.'}
    - {measure: ardeg, value: 'O(N^{0.6131})', note: 'At most $\widetilde{\deg} = O(N^{0.6131})$, and also at most $\mathrm{rdeg} \le 3^k$.'}
    - {measure: PostQ, value: 'O(N^{0.6131})', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15], bounded by the [[ardeg]] entry.'}
    - {measure: degp, value: '3^k = N^{0.6131}', putative: true, note: 'For *every* prime $p$. In the $0/1$ multilinear expansion $K = \tfrac12 - \tfrac18(\sum_{T\in\mathcal{F}}\chi_T - \sum_i\chi_i)$ with $\chi_S = \prod_{i\in S}(1-2x_i)$, the degree-$3$ part of $\chi_T$ is $-8\prod_{i\in T}x_i$, so each of the ten monomials $\prod_{i\in T}x_i$ carries coefficient exactly $+1$ -- nonzero modulo every $p$. Under self-composition the top-degree part is $\sum_{T\in\mathcal{F}}\prod_{i\in T}(\text{top part of the } i\text{-th copy})$, a sum of *distinct* monomials over disjoint blocks, so no cancellation is possible and $\deg_p = 3^k$ for all $p$, matching the recorded $\deg_2$.'}
  witnesses:
    - {of: [bs, deg], setting: total, statement: '$\mathrm{bs} = \Omega(\deg^{1.63})$; the best known separation against the upper bound $\mathrm{bs}\le 2\deg^2$.', refs: [NisanWigderson95, NS94]}
    - {of: [s, deg],  setting: total, statement: '$\mathrm{s} = \Omega(\deg^{1.63})$ vs the upper bound $\mathrm{s}\le\deg^2$ (Huang).', refs: [NisanWigderson95, Huang19]}
    - {of: [RC, deg], setting: total, statement: '$\mathrm{RC} = \Omega(\deg^{1.63})$.', refs: [NisanWigderson95]}
  refs: [NisanWigderson95, BdW02]
  see_also: [deg, s, bs]

- id: Rubinstein
  name: Rubinstein's function
  symbol: 'f_{\mathrm{Rub}}'
  group: composed
  order: 24
  kind: total
  arity: '$N=n^2$ bits'
  scale: {var: n, subs: {N: 'n^2'}}
  short: 'The classical quadratic separation $\mathrm{bs} = \tfrac12\mathrm{s}^2$.'
  definition: |
    OR of $n$ copies of a gadget on $n$ bits that fires only on "two adjacent ones
    and nothing else".
  formal: |
    Let $n$ be even. For $y \in \{0,1\}^n$ define
    $$g(y) = 1 \iff \exists k\in[n/2]:\ y_{2k-1}=y_{2k}=1 \text{ and } y_j = 0 \text{ for all } j \notin \{2k-1,2k\}.$$
    Then $f_{\mathrm{Rub}}(y^1,\dots,y^n) = \bigvee_{j=1}^n g(y^j)$ on $N = n^2$ bits.
  values:
    - {measure: s,  value: 'n = \sqrt N', note: 'Achieved at an input where each block has a single $1$ in an odd position.'}
    - {measure: bs, value: 'n^2/2 = N/2', note: 'At $0^N$: the $n/2$ adjacent pairs inside each of the $n$ blocks are disjoint sensitive blocks.'}
    - {measure: C,  value: '\Theta(N)'}
    - {measure: D,  value: 'N'}
    - {measure: fbs,    value: '\Theta(N)', note: 'Between $\mathrm{bs}=N/2$ and $\mathrm{C}=\Theta(N)$.'}
    - {measure: FC,     value: '\Theta(N)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: Dna,    value: 'N'}
    - {measure: RC, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{RC}(f) \le \mathrm{C}(f)$, with both ends $\Theta(N)$ here.'}
    - {measure: R0, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{C}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: CA, value: '\Theta(N)', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = \Theta(N)$ here.'}
    - {measure: CGpub, value: '\Theta(N)', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs}(f) = \Theta(N)$ here.'}
    - {measure: CGstar, value: '\Theta(N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: R, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{R}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: Rbar, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: R1, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: CG, value: '\Omega(N),\ O(N^{3/2})', note: 'Not pinned. The private-coin certificate game is **not** bounded by $\mathrm{D}$; the correct sandwich is $\max\{\mathrm{Adv}^2,\mathrm{R}_0,\mathrm{CA}\} \le \mathrm{CG} \le \min\{\mathrm{C}^0\mathrm{C}^1,\ O(\mathrm{EC}^2)\}$. Lower: $\mathrm{Adv}^2 \ge \mathrm{bs} = N/2$, and $\mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(N)$ says the same. Upper: the two sides are lopsided, $\mathrm{C}^0\mathrm{C}^1 = (N/2)\cdot\sqrt N = \Theta(N^{3/2})$, which beats the $O(\mathrm{EC}^2) = O(N^2)$ route.'}
    - {measure: Rna, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}^{\mathrm{na}}(f) = N$ here.'}
    - {measure: prt, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: rprt, value: '\Theta(N)', conf: medium, note: 'Sandwiched: $\mathrm{fbs}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: s0,     value: 'n = \sqrt N', putative: true, note: 'At a $0$-input the pivotal bits are those that make some block fire. A block at a weight-$1$ input has exactly one such bit (complete the pair), and no block state has more, so $\mathrm{s}^0(f) = n\cdot\mathrm{s}^0(g) = n$. Brute force on the gadget gives $\mathrm{s}^0(g) = 1$ for $n = 4,6,8$.'}
    - {measure: s1,     value: 'n = \sqrt N', putative: true, note: 'A $1$-input has a firing block; all $n$ of its bits are sensitive (each flip destroys the pattern) and no bit outside it is. If two blocks fire the input is not sensitive at all, so $\mathrm{s}^1(f) = \mathrm{s}^1(g) = n$.'}
    - {measure: bs0,    value: 'N/2 = n^2/2', putative: true, note: 'This is where $\mathrm{bs} = \tfrac12\mathrm{s}^2$ comes from: at $0^N$ each of the $n$ blocks offers its $n/2$ adjacent pairs as disjoint sensitive blocks, so $\mathrm{bs}^0(f) = n\cdot\mathrm{bs}^0(g) = n\cdot n/2$, against $\mathrm{s}^0 = n$.'}
    - {measure: bs1,    value: 'n = \sqrt N', putative: true, note: 'Every sensitive block of a $1$-input must stop the firing block, so all of them meet its $n$ bits and at most $n$ are disjoint; the $n$ singletons work. So the quadratic gap is entirely one-sided: $\mathrm{bs}^0 = \tfrac12(\mathrm{bs}^1)^2$.'}
    - {measure: C0,     value: 'N/2 = n^2/2', putative: true, note: 'Certifying $0$ means certifying all $n$ blocks silent, and the worst block state is $0^n$, which needs one zero from each of its $n/2$ pairs. So $\mathrm{C}^0(f) = n\cdot\mathrm{C}^0(g) = n^2/2$ and $\mathrm{C} = \mathrm{C}^0 = N/2$.'}
    - {measure: C1,     value: 'n = \sqrt N', putative: true, note: 'Certifying $1$ means exhibiting one firing block, and a firing block must be pinned entirely (two ones and $n-2$ zeros): $\mathrm{C}^1(f) = \mathrm{C}^1(g) = n$.'}
    - {measure: Cmin,   value: 'n = \sqrt N', putative: true, note: 'The cheapest inputs are the $1$-inputs, at cost $\mathrm{C}^1 = n$; a $0$-input costs at least $2n$, since each of the $n$ blocks needs at least $\mathrm{C}_{\min}(g) = 2$ bits. So $\mathrm{C}_{\min} = \sqrt N$ against $\mathrm{C} = N/2$.'}
    - {measure: deg,    value: 'N = n^2', putative: true, refs: [Tal13], note: 'Degree is exactly multiplicative under block composition [Tal13], and $\deg(\mathrm{OR}_n) = n$. The gadget has full degree too: $g$ is the sum of $n/2$ point indicators, whose top monomials $y_1\cdots y_n$ all carry the same sign, so they add rather than cancel and $\deg(g) = n$. Hence $\deg = n\cdot n = N$, matching $\mathrm{D}$: this is a *full-degree* function with $\mathrm{s} = \sqrt N$, i.e. Huang''s $\deg \le \mathrm{s}^2$ is tight here as well.'}
    - {measure: deg2,   value: '\Theta(N)', putative: true, note: 'Over $\mathbb{F}_2$, $\mathrm{OR}_n = 1 + \prod_j(1+g_j)$ and the blocks are disjoint, so the top monomial of $\prod_j g_j$ survives with coefficient $1$ and $\deg_2(f) = n\deg_2(g)$. For the gadget the coefficient of $y_1\cdots y_n$ is $n/2 \bmod 2$, so $\deg_2(g) = n$ when $n/2$ is odd and $n-1$ when $n/2$ is even; brute force gives $3, 6, 7$ at $n = 4,6,8$. Hence $\deg_2 = N$ or $N - \sqrt N$.'}
    - {measure: SP,     value: 'N', putative: true, note: 'A monochromatic subcube partition writes $f$ as a sum of indicators of subcubes of codimension $\le\mathrm{SP}$, so $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$; here $\deg = \mathrm{D} = N$.'}
    - {measure: UC,     value: 'N', putative: true, note: 'Squeezed by $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D} = N$; see [[SP]].'}
    - {measure: EC,     value: '\Theta(N)', note: 'Between $\mathrm{fbs} = \Theta(N)$ and $\mathrm{C} = N/2$.'}
    - {measure: lambda, value: '\sqrt N = n', putative: true, refs: [ABKRT21], note: 'Pinned from both sides by the recorded chain $\sqrt{\deg} \le \lambda \le \mathrm{s}$: here $\deg = N$ and $\mathrm{s} = \sqrt N$ coincide at $\sqrt N$. Rubinstein''s function is thus an extremal example for Huang''s theorem in its spectral form.'}
    - {measure: Q,      value: '\Theta(\sqrt N) = \Theta(n)', putative: true, refs: [LMRSS11, Reichardt11, HLS07], note: 'Quantum query complexity composes exactly, $\mathrm{Q}(f\circ g) = \Theta(\mathrm{Q}(f)\mathrm{Q}(g))$, and $\mathrm{Q}(\mathrm{OR}_n) = \Theta(\sqrt n)$. For the gadget $\mathrm{Q}(g) = \Theta(\sqrt n)$: Grover over the $n/2$ pairs finds a fired pair in $O(\sqrt n)$ queries and a second Grover checks that no other bit is $1$; conversely restricting to the $n/2$ paired variables turns $g$ into $\mathrm{EXACT}_1$, which needs $\Omega(\sqrt n)$. So $\mathrm{Q} = \Theta(\sqrt n \cdot \sqrt n) = \Theta(\sqrt N)$, quadratically below $\mathrm{R} = \Theta(N)$ and matching the lower bound $\lambda = \sqrt N$.'}
    - {measure: adeg,   value: '\Theta(\sqrt N) = \Theta(n)', putative: true, refs: [NS94], note: 'Lower: $\mathrm{bs} \le 6\,\widetilde{\deg}^2$ with $\mathrm{bs} = N/2$. Upper: $\widetilde{\deg} \le 2\mathrm{Q} = O(\sqrt N)$. So the quadratic $\deg$-vs-$\widetilde{\deg}$ gap of [ABKRT21] is attained here as well.'}
    - {measure: QE,     value: '\Theta(N)', note: 'Between $\deg/2 = N/2$ and $\mathrm{D} = N$. Exact quantum query complexity is thus quadratically above $\mathrm{Q} = \Theta(\sqrt N)$.'}
    - {measure: Q0,     value: '\Omega(\sqrt N),\ O(N)', note: 'Between $\mathrm{Q} = \Theta(\sqrt N)$ and $\mathrm{D} = N$. Not pinned by $\deg$: that floor bounds $\mathrm{Q}_{\mathrm{E}}$, while the $\mathrm{Q}_0$ floor is $\mathrm{rdeg}/2$, and $\mathrm{rdeg}$ is itself unpinned here.'}
    - {measure: rank,   value: '\Theta(\sqrt N)', putative: true, note: 'Between $n$ and $2n$. Lower: $\mathrm{C}_{\min} \le \mathrm{rank}$ and $\mathrm{C}_{\min} = n$. Upper: the gadget has $\mathrm{rank}(g) = 2$ (query $y_1$; whichever way it goes, either the residual is a conjunction of literals or the same problem with one pair fewer -- verified exactly for $n \le 8$), and evaluating the blocks in turn grafts the remaining tree onto the $0$-leaves of a rank-$2$ tree, so $\mathrm{rank} \le 2n$.'}
    - {measure: D_size, value: '2^{\Omega(\sqrt N)},\ 2^{O(\sqrt N\log N)}', putative: true, note: 'Lower: $\mathrm{DTsize} \ge 2^{\mathrm{rank}} \ge 2^{n}$. Upper: the block-by-block tree satisfies $S_j = a + b\,S_{j+1}$ where the optimal gadget tree has $a+b = \tfrac{n}{2}(\tfrac n2+2)$ leaves (exactly $8, 15, 24$ at $n = 4,6,8$), so $S_1 = n^{O(n)}$. Not pinned: the truth is somewhere between $2^{\Theta(\sqrt N)}$ and $2^{\Theta(\sqrt N\log N)}$.'}
    - {measure: UCmin,  value: 'N', putative: true, note: 'An unambiguous $b$-certificate family of width $w$ writes $f$ (or $1-f$) as a sum of indicators of disjoint subcubes of codimension $\le w$, with no cancellation, so $\deg \le \mathrm{UC}^0$ and $\deg \le \mathrm{UC}^1$, i.e. $\deg \le \mathrm{UC}_{\min} \le \mathrm{UC}$. Here $\deg = \mathrm{UC} = N$, so both sides are pinned -- against $\mathrm{C}_{\min} = \sqrt N$.'}
    - {measure: QC,     value: '\Theta(\sqrt N)', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ for every $f$ ([[QC]] vs [[fbs]]), and $\mathrm{fbs} = \Theta(N)$ here.'}
    - {measure: psD,    value: '\Theta(N)', note: 'For a Boolean-valued function the canonical answer is forced to be $f(x)$, so pseudo-determinism is free: $\mathrm{psD}(f) = \Theta(\mathrm{R}(f)) = \Theta(N)$.'}
    - {measure: RS,     value: '\Theta(N)', putative: true, note: 'Pinned. Upper: $\mathrm{RS} \le \mathrm{R}/(1-2\varepsilon) = O(N)$. Lower: $\mathrm{RS} = \Omega(\mathrm{bs}) = \Omega(N)$ -- at $0^N$, star out a uniformly random one of the $N/2$ disjoint adjacent pairs; every unstarred bit is $0$ as usual, so finding a $\ast$ is unstructured search over the $N/2$ pairs.'}
    - {measure: Rstar,  value: '\Theta(N)', putative: true, note: 'Block sensitivity is supermultiplicative, so $\mathrm{R}(f^{\circ m}) \ge \mathrm{bs}(f)^m$ and $\mathrm{R}^{*} \ge \mathrm{bs} = N/2$; and $\mathrm{R}^{*} \le \mathrm{R} = \Theta(N)$ by submultiplicativity. Composition is perfect here for the trivial reason that $\mathrm{bs}$ and $\mathrm{R}$ already agree.'}
    - {measure: Adv,    value: '\Theta(\sqrt N) = \Theta(n)', note: 'Sandwiched: $\lambda \le \mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$, with $\lambda = \sqrt N$ and $\mathrm{Q} = \Theta(\sqrt N)$ here. Note $\mathrm{Adv}^2 = \Theta(N) = \Theta(\mathrm{bs})$: the basic adversary bound is exactly tight against block sensitivity on Rubinstein''s function.'}
    - {measure: Advpm,  value: '\Theta(\sqrt N) = \Theta(n)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q} = \Theta(\sqrt N)$ here.'}
    - {measure: gamma2, value: '\Theta(\sqrt N) = \Theta(n)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q} = \Theta(\sqrt N)$ here.'}
    - {measure: MAdv,   value: '\Theta(\sqrt N) = \Theta(n)', note: 'Between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}_{\varepsilon}$, which agree up to constants at $\Theta(\sqrt N)$ here.'}
    - {measure: cjdeg,  value: '\Omega(\sqrt N),\ O(N)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon} \le \mathrm{cjdeg}_{\varepsilon} \le \mathrm{R}_{\varepsilon}$, with $\widetilde{\deg} = \Theta(\sqrt N)$ and $\mathrm{R} = \Theta(N)$ here. Non-negativity is exactly what could close this quadratic window, as it does on [[NANDtree]].'}
    - {measure: Fdim,   value: 'N', putative: true, note: 'Sparsity is near-maximal (see [[spar]]) and in particular the gadget''s singleton coefficients $\hat g(\{i\}) = 2^{-n}(n/2-2)$ are nonzero for $n \ge 6$, so every singleton of $[N]$ lies in the Fourier support and its $\mathbb{F}_2$-span is everything.'}
    - {measure: Inf1,   value: '\Theta(n^3 2^{-n})', putative: true, note: 'For Boolean-valued $f$ the $L_1$ and $L_2$ notions of total influence coincide, $\mathrm{I}^1(f) = \mathrm{I}(f)$; see [[Inf]].'}
    - {measure: MaxInf, value: '\Theta(n2^{-n})', putative: true, note: 'The automorphism group -- permute the blocks, permute the $n/2$ pairs inside a block, swap the two coordinates of a pair -- is transitive on all $N$ coordinates, so every coordinate carries influence $\mathrm{I}(f)/N = n\,2^{-n}(1-p)^{n-1}$ exactly, from the [[Inf]] entry.'}
    - {measure: Var, value: '\Theta(n^2 2^{-n})', note: '$4p(1-p)$ at $p = 1-(1-(n/2)2^{-n})^n = \Theta(n^2 2^{-n})$, as computed in the [[NS]] entry.'}
    - {measure: osss, value: '\Theta(n) = \Theta(\sqrt N)', putative: true, note: '$\Theta(n^2 2^{-n})$ over $\Theta(n2^{-n})$. Tight against $\mathrm{s} = n$ and quadratically short of $\mathrm{D} = N$. Structurally identical to [[ANDOR]] and to [[AmbainisSunFn]]: an OR of exponentially rare gadgets always lands on the sensitivity.'}
    - {measure: nsr, value: '\Theta(n) = \Theta(\sqrt N)', putative: true, note: 'A firing gadget pins all $n$ of its bits, so it survives $\delta$-noise with probability $(1-\delta)^n$ and $\mathrm{NS}_\delta = (2+o(1))p(1-(1-\delta)^n)$ against $\mathrm{Var}/4 = (1+o(1))p$. Hence $\delta^{*} = \Theta(1/n)$, tight against $4\mathrm{s} = 4n$.'}
    - {measure: Inf,    value: '\Theta(n^3 2^{-n})', putative: true, note: 'Exactly $\mathrm{I}(f) = n^3 2^{-n}(1-p)^{n-1}$ with $p = \tfrac n2 2^{-n} = \Pr[g = 1]$: the gadget has exactly $n^2$ sensitive edges out of $n2^{n}$, so $\mathrm{I}(g) = n^2 2^{-n}$, and a block''s influence survives only if the other $n-1$ blocks stay silent. Under the uniform measure Rubinstein''s function is almost constant, so its total influence is exponentially small even though $\mathrm{bs} = N/2$. (Checked against the full Fourier expansion at $n = 4$.)'}
    - {measure: L1,     value: '2^{\Theta(\sqrt N\log N)}', putative: true, note: 'Because the blocks are disjoint, $\widehat{L}_1(f) = |2(1-p)^n - 1| + 2\big[(1-p+\tfrac12 L'')^n - (1-p)^n\big]$ exactly, where $L'' = \sum_{S\ne\emptyset}|\hat g(S)|$ in the $\pm1$ encoding. For the gadget $\hat g(S)$ depends only on the number $t$ of pairs that $S$ splits, giving $L'' = 2^{1-n/2}\sum_t \binom{n/2}{t}|n/2-2t| - 2p = \Theta(\sqrt n)$. Hence $\widehat{L}_1 = 2^{\Theta(n\log n)}$. Exact value $17.7578\ldots$ at $n = 4$, matching the full Fourier expansion.'}
    - {measure: spar,   value: '\Theta(2^N)', putative: true, note: 'Near-maximal. Sparsity multiplies over the disjoint blocks, and the gadget misses only the $S$ that split exactly half of the $n/2$ pairs: $\hat g(S) = 2^{-n}\sum_j(-1)^{|S\cap\{2j-1,2j\}|}$ vanishes iff exactly $n/4$ pairs are split, so $\mathrm{spar}(g) = 2^n - \binom{n/2}{n/4}2^{n/2}$ for $n/2$ even and $2^n$ otherwise. Hence $\mathrm{spar}(f) = \mathrm{spar}(g)^n = (1-o(1))2^N$.'}
    - {measure: cbs,  value: 'N/2 = n^2/2', refs: [GoosPitassi14], note: '$\mathrm{cbs} = \mathrm{bs}$ for Boolean-valued problems [GoosPitassi14]; the recorded $\mathrm{bs} = n^2/2$ is attained at the all-zeros input, whose $n^2/2$ sensitive blocks are the consecutive pairs.'}
    - {measure: Dmu,  value: '\Theta(N)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3} = \Theta(\mathrm{R}_{1/3}) = \Theta(N)$.'}
    - {measure: Np,   value: '\Omega(N),\ O(N\log N)', refs: [FRPU94], note: '$\mathrm{N}_p \ge \mathrm{R} = \Omega(N)$; amplifying each query $O(\log \mathrm{R})$ times gives the upper bound [FRPU94].'}
    - {measure: noisyR, value: '\Theta(N)', refs: [BenDavidBlais20composition, CKMPSS23], note: '$\mathrm{noisyR} \le \mathrm{R}$, and $\mathrm{R} = \Theta(N)$ equals the arity, which forces $\mathrm{noisyR} = \Theta(\mathrm{R})$ by the recorded implication [CKMPSS23].'}
    - {measure: robustQ, value: '\Omega(\sqrt N),\ O(\sqrt N\log N)', refs: [BNRdW05], note: '$\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(\sqrt N)$ and $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ [BNRdW05].'}
    - {measure: chi,  value: '\Theta(N)', refs: [Li18], note: 'Pinned: $\chi = \Omega(\mathrm{bs}) = \Omega(N/2)$ [Li18] from below, and $\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(N)$ from above.'}
    - {measure: chibar, value: '\Theta(N)', refs: [GLSS19], note: 'Squeezed between $\chi = \Omega(\mathrm{bs}) = \Omega(N)$ and $\mathrm{LR} \le \mathrm{R} = O(N)$; also consistent with the recorded $\mathrm{RS} = \Theta(N) \le \bar\chi$ [GLSS19].'}
    - {measure: LR,   value: '\Theta(N)', refs: [BBGM22], note: '$\mathrm{LR} = \Omega(\bar\chi) = \Omega(\mathrm{bs}) = \Omega(N)$ and $\mathrm{LR} \le \mathrm{R} = O(N)$ [BBGM22]. So this gadget loses nothing as the inner function of a composition, despite the extreme $\mathrm{s}$-vs-$\mathrm{bs}$ gap.'}
    - {measure: PDT,  value: '\Theta(N)', putative: true, note: 'Parity queries do not help: $\deg_2 \le \mathrm{D}^{\oplus} \le \mathrm{D}$, and the recorded $\deg_2 = \Theta(N)$, $\mathrm{D} = N$ close the sandwich.'}
    - {measure: NS,   value: '\Theta(n^2 2^{-n})', putative: true, refs: [ODonnell14], note: 'For constant $\delta$, $\delta\,\mathrm{Var}(f) \le \mathrm{NS}_\delta(f) \le \tfrac12\mathrm{Var}(f)$, because each factor $1-(1-2\delta)^{|S|}$ with $|S| \ge 1$ lies in $[2\delta,1]$. A block is $1$ on exactly the $n/2$ inputs with one consecutive pair set, so $\Pr[g=1] = (n/2)2^{-n}$ and $\Pr[f=1] = 1-(1-(n/2)2^{-n})^n = \Theta(n^2 2^{-n})$; hence $\mathrm{Var} = 4p(1-p) = \Theta(n^2 2^{-n})$. Consistent with the recorded $\mathrm{I}(f) = \Theta(n^3 2^{-n})$ via $\mathrm{NS}_\delta \le \delta\,\mathrm{I}$.'}
    - {measure: Stab, value: '1 - \Theta(n^2 2^{-n})', putative: true, note: 'From $\mathrm{Stab}_\rho = 1-2\,\mathrm{NS}_{(1-\rho)/2}$ and the [[NS]] entry: the function is almost always $0$, hence almost perfectly noise stable.'}
    - {measure: ndeg, value: '\le n = \sqrt N', refs: [IJKKKSWW23], note: '$\mathrm{ndeg} \le \mathrm{C}^1 = n$: sum the indicators of the $n$-bit $1$-certificates (one per block pattern), all with positive coefficients, so the sum is nonzero exactly on $f^{-1}(1)$. Note this is $\sqrt{\deg}$ -- an extreme example of nondeterministic degree collapsing below the exact degree $N$.'}
    - {measure: rdeg, value: '\le N/2', refs: [IJKKKSWW23], note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}$ [IJKKKSWW23]; the first term is $\le n$ by the [[ndeg]] entry, and the second is $\le \mathrm{C}^0 = N/2$. The $0$-side dominates, so exact rational degree cannot be pushed below $\mathrm{C}^0$ by this argument.'}
    - {measure: NQ,   value: '\le \lceil n/2\rceil', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil \le \lceil n/2\rceil$ [deWolf03], i.e. $O(\sqrt N)$ -- matching $\mathrm{Q} = \Theta(\sqrt N)$ up to constants, so nondeterminism buys nothing quantumly here.'}
    - {measure: odeg, value: 'O(\sqrt N)', note: '$\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = \Theta(\sqrt N)$.'}
    - {measure: sdeg, value: 'O(\sqrt N)', note: 'From $\mathrm{sdeg} \le \widetilde{\deg} = \Theta(\sqrt N)$.'}
    - {measure: ardeg, value: 'O(\sqrt N)', note: 'At most $\widetilde{\deg} = \Theta(\sqrt N)$; the competing bound $\mathrm{rdeg} \le N/2$ is far weaker.'}
    - {measure: PostQ, value: 'O(\sqrt N)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] and $\mathrm{rdeg}_{1/3} \le \widetilde{\deg} = O(\sqrt N)$; since $\mathrm{Q} = \Theta(\sqrt N)$, post-selection saves at most a constant factor unless the approximate rational degree collapses further.'}
  witnesses:
    - {of: [bs, s], setting: total, statement: '$\mathrm{bs}(f) = \tfrac12 \mathrm{s}(f)^2$; improved constant $\mathrm{bs}\ge\tfrac23 \mathrm{s}^2 - \tfrac13\mathrm{s}$ by [AmbainisSun11].', refs: [Rubinstein95, AmbainisSun11]}
    - {of: [RC, s], setting: total, statement: '$\mathrm{RC} = \Omega(\mathrm{s}^2)$ (since $\mathrm{RC}=\Theta(\mathrm{fbs})\ge\mathrm{bs}$); the witness in the RC-vs-s and bs-vs-s cells.', refs: [Rubinstein95]}
  notes: |
    The best known upper bound in the other direction is still exponential:
    $\mathrm{bs}(f) \le \tfrac{e}{\sqrt{2\pi}} e^{\mathrm{s}(f)}\sqrt{\mathrm{s}(f)}$
    [KenyonKutin04]. Whether $\mathrm{bs} = O(\mathrm{s}^2)$ -- the
    *sensitivity-vs-block-sensitivity* question -- is wide open and is **not**
    resolved by Huang's theorem.
  refs: [Rubinstein95, AmbainisSun11, KenyonKutin04, Chakraborty11]
  see_also: [s, bs, AmbainisSunFn]

- id: AmbainisSunFn
  name: Ambainis-Sun function
  symbol: 'f_{\mathrm{AS}}'
  group: composed
  order: 25
  kind: total
  arity: '$N=(4k+2)(3k+2)$ bits'
  scale: {var: k, subs: {N: '12k^2+14k+4'}}
  short: 'Improves Rubinstein''s constant to $\mathrm{bs} = \tfrac23 \mathrm{s}^2 - \tfrac13 \mathrm{s}$.'
  definition: |
    An OR of $3k+2$ copies of a gadget $g$ on $n = 4k+2$ bits, exactly as in
    [[Rubinstein]] but with a cleverer gadget: $g$ fires on $2k+1$ cyclic
    patterns, each of which pins $3k+2$ of the $n$ coordinates (rather than all
    of them), so the gadget keeps $\mathrm{s}^0(g)=1$ and $\mathrm{bs}^0(g)=n/2$
    while raising $\mathrm{s}^1(g)$ from $n$ only to $3k+2 = \tfrac34 n + \tfrac12$.
    Since the OR level multiplies $\mathrm{s}^0$ and $\mathrm{bs}^0$ by the number
    of blocks but leaves $\mathrm{s}^1$ alone, taking $3k+2$ blocks balances the
    two sides and buys the factor $4/3$ over Rubinstein.
  formal: |
    $$f(x^1,\dots,x^{3k+2}) = \bigvee_{i=1}^{3k+2} g(x^i), \qquad
      g(y_1,\dots,y_{4k+2}) = 1 \iff \exists j\in[2k+1]:\ y \sim P_j,$$
    where the pattern $P_j$ demands $y_{2j-1}=y_{2j}=1$ and
    $y_{2j+2i}=y_{2j-2i-1}=y_{2j-2i}=0$ for all $i\in[k]$, indices taken
    modulo $n=4k+2$. Any two patterns are at Hamming distance $\ge 3$, which is
    what forces $\mathrm{s}^0(g)=1$.
  values:
    - {measure: bs, value: '6k^2+7k+2', refs: [AmbainisSun11], note: 'Attained at the all-zero input: $\mathrm{bs}^0(f) = (3k+2)\cdot\mathrm{bs}^0(g) = (3k+2)(2k+1)$, since flipping the $j$-th pattern''s two $1$-bits inside any block turns $f$ on, and blocks from different copies are disjoint. With $\mathrm{s} = 3k+2$ this is exactly $\tfrac23\mathrm{s}^2 - \tfrac13\mathrm{s}$, the current record constant for the quadratic separation.'}
    - {measure: s,   value: '3k+2', refs: [AmbainisSun11], note: 'Both sides agree: $\mathrm{s}^0(f) = (3k+2)\mathrm{s}^0(g) = 3k+2$ and $\mathrm{s}^1(f) = \mathrm{s}^1(g) = 3k+2$. Balancing them is exactly how the number of blocks was chosen.'}
    - {measure: s0,  value: '3k+2', refs: [AmbainisSun11], note: 'Sensitivity of an OR of blocks is $n_{\mathrm{blocks}}\cdot\mathrm{s}^0$ of the gadget, and the Ambainis--Sun gadget has $\mathrm{s}^0(g) = 1$: two single-bit flips of a $0$-input landing in different patterns would put those patterns at Hamming distance $\le 2$, contradicting the distance-$3$ property.'}
    - {measure: s1,  value: '3k+2', refs: [AmbainisSun11], note: '$\mathrm{s}^1(f) = \mathrm{s}^1(g)$ for an OR of blocks, and a $1$-input of $g$ satisfies exactly one pattern, whose $3k+2$ pinned bits are the only candidates for sensitivity -- all of them sensitive at $y = 110\cdots0$.'}
    - {measure: bs0, value: '6k^2+7k+2', refs: [AmbainisSun11], note: 'The value of [[bs]]; $\mathrm{bs}^0(g) = 2k+1$ because disjoint sensitive blocks must switch on distinct patterns.'}
    - {measure: bs1, value: '3k+2', putative: true, note: 'Every sensitive block of a $1$-input must destroy the pattern that is firing, so it meets that pattern''s $3k+2$ pinned bits; at most $3k+2$ such blocks are disjoint, and the singletons work. So the separation is one-sided, as in [[Rubinstein]].'}
    - {measure: C0,  value: '6k^2+7k+2', putative: true, note: 'Certifying $f=0$ means certifying all $3k+2$ blocks silent, and $\mathrm{C}^0(g) = 2k+1$ exactly: from any $0$-input of $g$, naming one coordinate that already violates each of the $2k+1$ patterns is a certificate, and $\mathrm{C}^0(g) \ge \mathrm{bs}^0(g) = 2k+1$. So $\mathrm{C}^0(f) = (3k+2)(2k+1) = \mathrm{bs}^0(f)$: block sensitivity and certificate complexity coincide. (Brute force confirms $\mathrm{C}^0(g) = 3, 5$ at $k = 1,2$.)'}
    - {measure: C1,  value: '3k+2', putative: true, note: 'A firing pattern is a $1$-certificate of size $3k+2$, and $\mathrm{C}^1 \ge \mathrm{s}^1 = 3k+2$.'}
    - {measure: C,   value: '6k^2+7k+2', putative: true, note: '$\max\{\mathrm{C}^0,\mathrm{C}^1\}$; the $0$-side dominates quadratically.'}
    - {measure: Cmin, value: '3k+2', putative: true, note: 'The $1$-inputs are the cheap ones: $\mathrm{C}_{\min} = \mathrm{C}^1 = 3k+2 = \Theta(\sqrt N)$.'}
    - {measure: fbs, value: '6k^2+7k+2', note: 'Pinned between $\mathrm{bs}$ and $\mathrm{C}$, which coincide at $(3k+2)(2k+1)$ here.'}
    - {measure: deg, value: '(3k+2)^2', putative: true, refs: [Tal13], note: 'Degree is exactly multiplicative [Tal13]; $\deg(\mathrm{OR}_{3k+2}) = 3k+2$ and $\deg(g) = 3k+2$ (brute force gives $5$ at $k=1$ and $8$ at $k=2$; $g$ is a sum of $2k+1$ mutually exclusive subcube indicators of codimension $3k+2$, and their top monomials cannot all cancel). Note $\deg = \tfrac34 N + O(\sqrt N)$: the function is not of full degree, because each gadget leaves $k$ coordinates free.'}
    - {measure: deg2, value: '(3k+2)^2', putative: true, note: 'Over $\mathbb{F}_2$, $\mathrm{OR} = 1 + \prod_i(1+g_i)$ on disjoint blocks, so $\deg_2$ adds over the blocks; the gadget has $\deg_2(g) = \deg(g) = 3k+2$ (brute force at $k = 1,2$).'}
    - {measure: D,   value: '\Theta(N)', note: 'Between $\mathrm{C} = (3k+2)(2k+1)$ and $N = (3k+2)(4k+2)$ -- so between $N/2$ and $N$.'}
    - {measure: Dna, value: 'N = 12k^2+14k+4', note: 'Every variable is relevant, and a non-adaptive algorithm must read every relevant variable.'}
    - {measure: Rna, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs} \le \mathrm{R}^{\mathrm{na}} \le \mathrm{D}^{\mathrm{na}} = N$, with $\mathrm{fbs} = \Theta(N)$ here.'}
    - {measure: R,   value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs} \le \mathrm{R}_{\varepsilon} \le \mathrm{D}$, with both ends $\Theta(N)$.'}
    - {measure: R0,  value: '\Theta(N)', note: 'Sandwiched: $\mathrm{bs} \le \mathrm{R}_0 \le \mathrm{D}$, with both ends $\Theta(N)$.'}
    - {measure: RC,  value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs} \le \mathrm{RC} \le \mathrm{D}$, with both ends $\Theta(N)$.'}
    - {measure: D_size, value: '2^{\Omega(\sqrt N)},\ 2^{O(\sqrt N\log N)}', putative: true, note: 'Lower: $\mathrm{DTsize} \ge 2^{\mathrm{rank}} \ge 2^{3k+2}$. Upper: reading the blocks in turn multiplies the gadget''s optimal tree size (exactly $13$ at $k=1$ and $30$ at $k=2$, i.e. $\mathrm{poly}(k)$) once per block, giving $k^{O(k)}$. Not pinned between the two.'}
    - {measure: QE,  value: '\Theta(N)', note: 'Between $\deg/2 = \Theta(N)$ and $\mathrm{D} = \Theta(N)$.'}
    - {measure: Q0,  value: '\Omega(\sqrt N),\ O(N)', note: 'Between $\mathrm{Q} = \Omega(\sqrt N)$ and $\mathrm{D} = \Theta(N)$. The $\deg/2 = \Theta(N)$ floor pins $\mathrm{Q}_{\mathrm{E}}$ but not $\mathrm{Q}_0$, whose floor is $\mathrm{rdeg}/2$ -- and $\mathrm{rdeg}$ has only an upper bound here.'}
    - {measure: SP,  value: '\Theta(N)', note: 'A monochromatic subcube partition expresses $f$ as a signless sum of subcube indicators, so $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$; here $\deg$ and $\mathrm{D}$ are both $\Theta(N)$.'}
    - {measure: UC,  value: '\Theta(N)', note: 'Squeezed by $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$; see [[SP]].'}
    - {measure: EC,  value: '\Theta(N)', note: 'Between $\mathrm{fbs}$ and $\mathrm{C}$, which coincide here.'}
    - {measure: lambda, value: '3k+2', putative: true, note: 'Pinned exactly by $\sqrt{\deg} \le \lambda \le \mathrm{s}$ [ABKRT21]: $\deg = (3k+2)^2$ and $\mathrm{s} = 3k+2$. So $\mathrm{bs} = \tfrac23\lambda^2 - \tfrac13\lambda$ as well -- this function is also a near-extremal example for $\mathrm{bs}$ vs $\lambda$, the quantity later pushed past exponent $2$ by [[MeiburgTournament]].'}
    - {measure: rank, value: '\Theta(k) = \Theta(\sqrt N)', putative: true, note: 'Lower: $\mathrm{C}_{\min} \le \mathrm{rank}$ gives $3k+2$. Upper: the gadget has $\mathrm{rank}(g) = 2$ (computed exactly for $k = 1,2$), and reading the blocks in turn grafts the remaining tree onto the $0$-leaves, so $\mathrm{rank} \le 2(3k+2)$.'}
    - {measure: FC,  value: '6k^2+7k+2', note: '$\mathrm{FC} = \mathrm{fbs}$ by LP duality, and [[fbs]] is pinned at $(3k+2)(2k+1)$ here.'}
    - {measure: UCmin, value: '\Theta(N)', putative: true, note: 'An unambiguous $b$-certificate family of width $w$ writes $f$ (for $b=1$) or $1-f$ (for $b=0$) as a sum of indicators of *disjoint* subcubes of codimension $\le w$, so nothing cancels and $\deg(f) \le \min\{\mathrm{UC}^0,\mathrm{UC}^1\} = \mathrm{UC}_{\min}$. Here $\deg = (3k+2)^2 = \Theta(N)$ and $\mathrm{UC} = \Theta(N)$, so both sides are pinned.'}
    - {measure: CA,  value: '\Theta(N)', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs} = \Theta(N)$ here.'}
    - {measure: CGpub, value: '\Theta(N)', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs} = \Theta(N)$ here.'}
    - {measure: CGstar, value: '\Theta(N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CG,  value: '\Omega(N),\ O(N^{3/2})', putative: true, note: 'The private-coin certificate game is *not* capped by $\mathrm{D}$. Lower: $\mathrm{CG} \ge \mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(N)$. Upper: $\mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1 = (6k^2+7k+2)(3k+2) = \Theta(N^{3/2})$, the two sides being wildly asymmetric here. The $\mathrm{EC}$ route gives only $O(\mathrm{EC}^2) = O(N^2)$.'}
    - {measure: Rbar, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon} \le \bar{\mathrm{R}}_{\varepsilon} \le \mathrm{R}_0$, with both ends $\Theta(N)$ here.'}
    - {measure: R1,  value: '\Theta(N)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon} \le \mathrm{R}^{1} \le \mathrm{R}_0$, with both ends $\Theta(N)$ here.'}
    - {measure: Rstar, value: '\Theta(N)', putative: true, note: 'Block sensitivity is supermultiplicative, so $\mathrm{R}(f^{\circ m}) \ge \mathrm{bs}(f)^m$ and $\mathrm{R}^{*}(f) \ge \mathrm{bs}(f) = \Theta(N)$; and $\mathrm{R}^{*} \le \mathrm{R} = \Theta(N)$ by submultiplicativity. Composition is therefore perfect here for the trivial reason that $\mathrm{bs}$ and $\mathrm{R}$ already coincide.'}
    - {measure: prt, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs} \le \mathrm{prt}_{\varepsilon} \le \mathrm{R}_{\varepsilon}$, with both ends $\Theta(N)$ here.'}
    - {measure: rprt, value: '\Theta(N)', conf: medium, note: 'Sandwiched: $\mathrm{fbs} \le \overline{\mathrm{prt}}_{\varepsilon} \le \mathrm{R}_{\varepsilon}$, with both ends $\Theta(N)$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record).'}
    - {measure: Q,   value: '\Omega(\sqrt N),\ O(N^{3/4})', putative: true, refs: [HoyerMoscadeWolf03, ABKRT21], note: 'Not pinned. Lower: $\mathrm{Q} = \Omega(\lambda) = \Omega(3k+2) = \Omega(\sqrt N)$. Upper: $f$ is a DNF with $m = (3k+2)(2k+1) = \Theta(N)$ terms of width $w = 3k+2 = \Theta(\sqrt N)$, so robust Grover over the terms with a Grover $\mathrm{AND}_w$ inside each costs $O(\sqrt m\cdot\sqrt w) = O(k^{3/2})$ with no log overhead [HoyerMoscadeWolf03]. Equivalently, $\mathrm{Q}$ composes and $\mathrm{Q}(\mathrm{OR}_{3k+2}) = \Theta(\sqrt k)$ while $\mathrm{Q}(g) = O(k)$. Closing the gap needs the exact adversary bound of the gadget, exactly as for [[Kushilevitz]].'}
    - {measure: Adv, value: '\Omega(\sqrt N),\ O(N^{3/4})', putative: true, refs: [Ambainis02], note: 'Lower: $\mathrm{Adv} \ge \sqrt{\mathrm{bs}} = \Theta(\sqrt N)$ ([[bs]] vs [[Adv]]). Upper: $\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = O(N^{3/4})$. The certificate barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = O(N^{3/4})$ gives the same ceiling.'}
    - {measure: Advpm, value: '\Omega(\sqrt N),\ O(N^{3/4})', putative: true, note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), so this inherits the [[Q]] window verbatim.'}
    - {measure: gamma2, value: '\Omega(\sqrt N),\ O(N^{3/4})', putative: true, note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), so this inherits the [[Q]] window verbatim.'}
    - {measure: MAdv, value: '\Omega(\sqrt N),\ O(N^{3/4})', putative: true, note: 'Between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}_{\varepsilon}$, which agree up to constants; the window is that of [[Q]].'}
    - {measure: adeg, value: '\Omega(\sqrt N),\ O(N^{3/4})', putative: true, refs: [NS94], note: 'Lower: $\mathrm{bs} = O(\widetilde{\deg}^2)$ [NS94] with $\mathrm{bs} = \Theta(N)$. Upper: $\widetilde{\deg} \le 2\mathrm{Q} = O(N^{3/4})$. Either way $\widetilde{\deg}$ is strictly below $\deg = \Theta(N)$ unless the gadget''s adversary bound is maximal.'}
    - {measure: QC,  value: '\Theta(\sqrt N)', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ for every $f$ ([[QC]] vs [[fbs]]), and $\mathrm{fbs} = \Theta(N)$ here.'}
    - {measure: psD, value: '\Theta(N)', note: 'For a Boolean-valued function the canonical answer is forced to be $f(x)$, so pseudo-determinism is free: $\mathrm{psD}(f) = \Theta(\mathrm{R}(f)) = \Theta(N)$.'}
    - {measure: RS,  value: '\Theta(N)', putative: true, note: 'Pinned. Upper: $\mathrm{RS} \le \mathrm{R}/(1-2\varepsilon) = O(N)$. Lower: $\mathrm{RS} = \Omega(\mathrm{bs}) = \Omega(N)$ -- at $0^N$, star out a uniformly random one of the $(3k+2)(2k+1)$ disjoint sensitive blocks; every unstarred bit is $0$ as usual, so finding a $\ast$ is unstructured search over those blocks.'}
    - {measure: cjdeg, value: '\Omega(\sqrt N),\ O(N)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon} \le \mathrm{cjdeg}_{\varepsilon} \le \mathrm{R}_{\varepsilon}$, with $\widetilde{\deg} = \Omega(\sqrt N)$ and $\mathrm{R} = \Theta(N)$ here.'}
    - {measure: MaxInf, value: '\Theta(k\,2^{-3k})', putative: true, note: 'The $3k+2$ blocks are interchangeable and the gadget is invariant under the rotation $y_i \mapsto y_{i+2}$, whose two orbits (odd and even positions) carry $k+1$ and $2k+1$ of each firing pattern''s $3k+2$ pinned coordinates. So single-coordinate influences vary by a factor $\le 2$ and $\max_i \mathrm{Inf}_i = \Theta(\mathrm{I}(f)/N) = \Theta(k^3 2^{-3k}/k^2)$. Exactly: an even position is pinned by all $2k+1$ patterns, giving $\mathrm{MaxInf} = 2(2k+1)2^{-(3k+2)}(1-p)^{3k+1}$. Well below the Aaronson-Ambainis threshold, as for every function here whose uniform measure is lopsided.'}
    - {measure: Var, value: '\Theta(k^2 2^{-3k})', note: '$4p(1-p)$ at $p = 1-(1-(2k+1)2^{-(3k+2)})^{3k+2} = (1+o(1))(3k+2)(2k+1)2^{-(3k+2)}$.'}
    - {measure: osss, value: '\Theta(k) = \Theta(\sqrt N)', putative: true, note: '$\Theta(k^2 2^{-3k})$ over $\mathrm{MaxInf} = \Theta(k2^{-3k})$. Equal to $\mathrm{s} = 3k+2$ up to constants, and quadratically short of $\mathrm{D} = \Theta(N)$ -- the same picture as [[Rubinstein]], whose gadget structure this shares.'}
    - {measure: nsr, value: '\Theta(k) = \Theta(\sqrt N)', putative: true, note: 'A firing pattern pins $3k+2$ coordinates, so $\mathrm{NS}_\delta = (2+o(1))p(1-(1-\delta)^{3k+2})$ crosses $\mathrm{Var}/4$ at $\delta^{*} = \Theta(1/k)$. Tight against $4\mathrm{s} = 4(3k+2)$.'}
    - {measure: Inf1, value: '\Theta(k^3 2^{-3k})', putative: true, note: 'For a Boolean-valued $f$ the $L_1$ and $L_2$ notions of total influence coincide, $\mathrm{I}^1(f) = \mathrm{I}(f)$ -- the two differ only for bounded real-valued $p$. So this is the [[Inf]] entry verbatim.'}
    - {measure: Inf, value: '\Theta(k^3 2^{-3k})', putative: true, note: 'Exactly $\mathrm{I}(f) = (3k+2)\,\mathrm{I}(g)(1-p)^{3k+1}$ with $p = (2k+1)2^{-(3k+2)}$ and $\mathrm{I}(g) = 2(3k+2)(2k+1)2^{-(3k+2)}$: a $1$-input of $g$ has exactly $3k+2$ sensitive bits and there are $(2k+1)2^{k}$ of them. Both formulas checked by exhaustive Fourier computation for $k \le 3$. Since $p(3k+2) \to 0$, the correction factor is $1-o(1)$ and $\mathrm{I}(f) = 2(3k+2)^2(2k+1)2^{-(3k+2)}(1-o(1)) = 2^{-\Theta(\sqrt N)}$.'}
    - {measure: cbs,  value: '6k^2+7k+2', refs: [GoosPitassi14], note: '$\mathrm{cbs} = \mathrm{bs}$ for Boolean-valued problems [GoosPitassi14], and $\mathrm{bs} = \mathrm{bs}^0 = 6k^2+7k+2$ is attained at the all-zeros input.'}
    - {measure: Dmu,  value: '\Theta(N)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3} = \Theta(\mathrm{R}_{1/3}) = \Theta(N)$.'}
    - {measure: Np,   value: '\Omega(N),\ O(N\log N)', refs: [FRPU94], note: '$\mathrm{N}_p \ge \mathrm{R} = \Omega(N)$, and repeating each query $O(\log \mathrm{R})$ times gives $O(\mathrm{R}\log \mathrm{R})$ [FRPU94].'}
    - {measure: noisyR, value: '\Theta(N)', refs: [BenDavidBlais20composition, CKMPSS23], note: '$\mathrm{noisyR} \le \mathrm{R}$, and $\mathrm{R} = \Theta(N)$ is of the order of the arity, which forces equality up to constants by the recorded implication [CKMPSS23].'}
    - {measure: robustQ, value: '\Omega(\sqrt N),\ O(N^{3/4}\log N)', refs: [BNRdW05], note: '$\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Omega(\sqrt N)$ and $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ [BNRdW05], with the recorded $\mathrm{Q} = O(N^{3/4})$. The window is inherited wholesale from the open $\mathrm{Q}$ window.'}
    - {measure: chi,  value: '\Theta(N)', refs: [Li18], note: 'Pinned: $\chi = \Omega(\mathrm{bs}) = \Omega(6k^2) = \Omega(N)$ [Li18], and $\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(N)$.'}
    - {measure: chibar, value: '\Theta(N)', refs: [GLSS19], note: 'Between $\chi = \Omega(\mathrm{bs}) = \Omega(N)$ and $\mathrm{LR} \le \mathrm{R} = O(N)$ [GLSS19].'}
    - {measure: LR,   value: '\Theta(N)', refs: [BBGM22], note: '$\mathrm{LR} = \Omega(\bar\chi) = \Omega(\mathrm{bs}) = \Omega(N)$ and $\mathrm{LR} \le \mathrm{R} = O(N)$ [BBGM22]: the extremal $\mathrm{s}$-vs-$\mathrm{bs}$ gadget is nonetheless a perfect inner function for composition.'}
    - {measure: PDT,  value: '\Theta(N)', putative: true, note: '$\deg_2 \le \mathrm{D}^{\oplus} \le \mathrm{D}$, and the recorded $\deg_2 = (3k+2)^2 = \Theta(N)$ and $\mathrm{D} = \Theta(N)$ close the sandwich: parity queries buy nothing.'}
    - {measure: Fdim, value: '\Theta(N)', putative: true, note: 'Fourier dimension is squeezed by $\mathrm{D}^{\oplus} \le \dim_{\mathbb{F}_2}(f) \le N$, and the [[PDT]] entry gives $\mathrm{D}^{\oplus} = \Theta(N)$.'}
    - {measure: NS,   value: '\Theta(k^2 2^{-3k})', putative: true, refs: [ODonnell14], note: 'For constant $\delta$, $\delta\,\mathrm{Var}(f) \le \mathrm{NS}_\delta(f) \le \tfrac12\mathrm{Var}(f)$, since every factor $1-(1-2\delta)^{|S|}$ with $|S|\ge 1$ lies in $[2\delta,1]$. The gadget has $\Pr[g=1] = (2k+1)2^{-(3k+2)}$ and $f$ is the $\mathrm{OR}$ of $3k+2$ disjoint copies (the same numbers that give the recorded $\mathrm{I}(f)$), so $\Pr[f=1] = \Theta(k^2 2^{-3k})$ and $\mathrm{Var} = 4p(1-p) = \Theta(k^2 2^{-3k})$.'}
    - {measure: Stab, value: '1 - \Theta(k^2 2^{-3k})', putative: true, note: 'From $\mathrm{Stab}_\rho = 1-2\,\mathrm{NS}_{(1-\rho)/2}$ and the [[NS]] entry: almost always $0$, hence almost perfectly noise stable.'}
    - {measure: ndeg, value: '\le 3k+2', refs: [IJKKKSWW23], note: '$\mathrm{ndeg} \le \mathrm{C}^1 = 3k+2$ (sum the $1$-certificate indicators, all with positive coefficients). Since $\deg = (3k+2)^2$, nondeterministic degree is at most $\sqrt{\deg}$ here -- the same quadratic collapse as in [[Rubinstein]].'}
    - {measure: rdeg, value: '\le 6k^2+7k+2', refs: [IJKKKSWW23], note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\} \le \mathrm{C} = 6k^2+7k+2$ [IJKKKSWW23]; the $0$-side, with $\mathrm{C}^0 = 6k^2+7k+2$, is what dominates.'}
    - {measure: NQ,   value: 'O(k) = O(\sqrt N)', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil \le \lceil (3k+2)/2\rceil$ [deWolf03], from the [[ndeg]] entry.'}
    - {measure: odeg, value: 'O(N^{3/4})', note: '$\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = O(N^{3/4})$; the lower end of the recorded $\widetilde{\deg}$ window comes from $\mathrm{bs} = O(\widetilde{\deg}^2)$, which has no one-sided analogue.'}
    - {measure: sdeg, value: 'O(N^{3/4})', note: 'From $\mathrm{sdeg} \le \widetilde{\deg} = O(N^{3/4})$.'}
    - {measure: ardeg, value: 'O(N^{3/4})', note: 'At most $\widetilde{\deg} = O(N^{3/4})$; the competing bound $\mathrm{rdeg} \le \mathrm{C} = \Theta(N)$ is weaker.'}
    - {measure: PostQ, value: 'O(N^{3/4})', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) \le O(\widetilde{\deg}) = O(N^{3/4})$ [MahadevdeWolf15].'}
  witnesses:
    - {of: [bs, s], setting: total, statement: 'Current record constant for the quadratic bs-vs-s separation: $\mathrm{bs} = \tfrac23\mathrm{s}^2 - \tfrac13\mathrm{s}$, improving Rubinstein''s $\tfrac12\mathrm{s}^2$ and Virza''s $\tfrac12\mathrm{s}^2 + \tfrac12\mathrm{s}$.', refs: [AmbainisSun11]}
    - {of: [C, s], setting: total, statement: '$\mathrm{C} = \tfrac23\mathrm{s}^2 - \tfrac13\mathrm{s}$: certificate complexity matches block sensitivity exactly on this family.', refs: [AmbainisSun11]}
  notes: |
    [AmbainisSun11] also show the construction is optimal within its strategy:
    for any gadget $g$ with $\mathrm{s}^0(g) = 1$ and $\mathrm{bs}^0(g) = k$ one has
    $\mathrm{s}^1(g) \ge 3(k-1)/2$, so composing OR with such a $g$ can never beat
    $\mathrm{bs} = (\tfrac23 + o(1))\mathrm{s}^2$. Any further improvement must use
    a gadget with $\mathrm{s}^0(g) > 1$.
  refs: [AmbainisSun11]
  see_also: [Rubinstein, s, bs, lambda]

- id: ANDEH
  name: AND composed with NOT-EXACT-HALF
  symbol: '\mathrm{AND}_n \circ \overline{\mathrm{EH}}_n'
  aliases: ['\wedge\circ\overline{\mathrm{EH}}']
  group: composed
  order: 26
  kind: total
  arity: '$N=n^2$ bits'
  scale: {var: n, subs: {N: 'n^2'}}
  short: 'The witness for the whole rdeg column: $\mathrm{rdeg}=\Theta(n)$ while $\mathrm{s},\deg,\mathrm{D}=\Theta(n^2)$.'
  definition: 'AND of $n$ copies of $\overline{\mathrm{EH}}_n$ (the negation of exact-half), on $N = n^2$ bits.'
  formal: |
    $$f(x^1,\dots,x^n) = \bigwedge_{j=1}^{n} \overline{\mathrm{EH}}_n(x^j)
      = \bigwedge_{j=1}^{n} \mathbb{1}\Big[\textstyle\sum_i x^j_i \ne \tfrac n2\Big].$$
  values:
    - {measure: rdeg,   value: '\Theta(n) = \Theta(\sqrt N)', refs: [IJKKKSWW23], note: '$\mathrm{ndeg}(f) = n \cdot \mathrm{ndeg}(\overline{\mathrm{EH}}_n) = n$ and $\mathrm{ndeg}(\bar f) = \mathrm{ndeg}(\mathrm{EH}_n) \le n$.'}
    - {measure: lambda, value: '\Theta(n^{3/2})', refs: [IJKKKSWW23], note: '$\lambda(\mathrm{AND}_n)\cdot\lambda(\overline{\mathrm{EH}}_n) = \sqrt n\cdot\Theta(n)$.'}
    - {measure: s,      value: '\Theta(n^2)', refs: [IJKKKSWW23]}
    - {measure: deg,    value: '\Theta(n^2)', refs: [IJKKKSWW23]}
    - {measure: D,      value: '\Theta(n^2)'}
    - {measure: Q,      value: '\Theta(n^{3/2}) = \Theta(N^{3/4})', refs: [LMRSS11, Reichardt11, BBCMdW01], note: 'Lower from $\mathrm{Q}=\Omega(\lambda)$ and the recorded $\lambda = \Theta(n^{3/2})$. Upper by perfect composition $\mathrm{Q}(f\circ g)=O(\mathrm{Q}(f)\mathrm{Q}(g))$ [LMRSS11, Reichardt11] with $\mathrm{Q}(\mathrm{AND}_n)=\Theta(\sqrt n)$ and the trivial $\mathrm{Q}(\overline{\mathrm{EH}}_n)\le n$; the gadget really does cost $\Theta(n)$, since a symmetric function has $\mathrm{Q}=\Theta(\sqrt{n(n-\Gamma)})$ [BBCMdW01] and $\Gamma(\overline{\mathrm{EH}}_n)=1$.'}
    - {measure: s0,     value: 'n = \sqrt N', putative: true, note: 'A $0$-input is sensitive only when exactly one block is at weight $n/2$ and the rest are $1$; then every bit of that block is pivotal and nothing else is. So $\mathrm{s}^0 = \mathrm{s}^0(\overline{\mathrm{EH}}_n) = n$ against $\mathrm{s}^1 = \Theta(n^2)$: all of the sensitivity of [[ANDEH]] lives on the $1$-side.'}
    - {measure: s1,     value: 'n^2/2 + n', putative: true, note: 'At a $1$-input every block has weight $\ne n/2$, and a bit is pivotal exactly when its block sits at weight $n/2\pm1$ and the bit moves it to $n/2$; a block at weight $n/2\pm1$ has $n/2+1$ such bits. Taking all $n$ blocks there gives $\mathrm{s}^1 = n(n/2+1)$, which is the recorded $\mathrm{s} = \Theta(n^2)$. Brute force confirms $\mathrm{s}^1(\overline{\mathrm{EH}}_n) = n/2+1$ for $n \le 10$.'}
    - {measure: bs0,    value: 'n = \sqrt N', putative: true, note: 'Every sensitive block of a $0$-input must repair every zero block, so it meets each of them and at most $n$ of them are disjoint; the $n$ singletons of a single zero block achieve it.'}
    - {measure: bs1,    value: 'n^2/2 + n', putative: true, note: 'Equal to $\mathrm{s}^1$: a sensitive block must push some block from weight $n/2+t$ to $n/2$, hence contains at least $t$ of that block''s ones, so a block at distance $t$ supports at most $(n/2+t)/t$ disjoint sensitive blocks -- maximised at $t=1$, giving $n/2+1$ per block and $n(n/2+1)$ in all.'}
    - {measure: C0,     value: 'n = \sqrt N', putative: true, note: 'To certify $f = 0$ it suffices to pin one block at weight exactly $n/2$, which costs all $n$ of its bits and no fewer.'}
    - {measure: C1,     value: 'n^2/2 + n', putative: true, note: 'To certify $f = 1$ every block must be certified $\ne n/2$, and the cheapest witness for one block exhibits $n/2+1$ equal bits. So $\mathrm{C}^1 = n(n/2+1) = \Theta(N)$, matching the recorded $\mathrm{C}$.'}
    - {measure: Cmin,   value: 'n = \sqrt N', putative: true, note: 'The $0$-inputs are far cheaper to certify than the $1$-inputs: $\mathrm{C}_{\min} = \mathrm{C}^0 = n = \sqrt N$ against $\mathrm{C} = \Theta(N)$.'}
    - {measure: Dna,    value: 'N = n^2', note: 'Every variable is relevant, and a non-adaptive algorithm must read every relevant variable.'}
    - {measure: Rna,    value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with $\mathrm{fbs} = \Theta(n^2)$ and $\mathrm{D}^{\mathrm{na}} = n^2$ here.'}
    - {measure: Q0,     value: '\Omega(n^{3/2}),\ O(n^2)', note: 'Between $\mathrm{Q} = \Theta(n^{3/2})$ and $\mathrm{D} = \Theta(n^2)$. The $\deg/2 = \Theta(n^2)$ floor is a $\mathrm{Q}_{\mathrm{E}}$ bound; the $\mathrm{Q}_0$ floor is $\mathrm{rdeg}/2 = \Theta(n)$, weaker than $\mathrm{Q}$ here. So whether forbidding error costs the last $\sqrt n$ is open as far as the zoo knows.'}
    - {measure: SP,     value: '\Theta(n^2)', note: 'A monochromatic subcube partition writes $f$ as a signless sum of subcube indicators of codimension $\le \mathrm{SP}$, so $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$; here $\deg$ and $\mathrm{D}$ are both $\Theta(n^2)$.'}
    - {measure: UC,     value: '\Theta(n^2)', note: 'Squeezed by $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D} = \Theta(n^2)$; see [[SP]].'}
    - {measure: EC,     value: '\Theta(n^2)', note: 'Between $\mathrm{fbs} = \Theta(n^2)$ and $\mathrm{C} = \Theta(n^2)$.'}
    - {measure: adeg,   value: '\tilde\Theta(n^{3/2})', refs: [CKMPSS23, Sherstov12robust, Paturi92], note: 'The gadget has $\widetilde{\deg}(\overline{\mathrm{EH}}_n) = \Theta(n)$ by Paturi''s symmetric-function formula $\Theta(\sqrt{n(n-\Gamma)})$ with $\Gamma = 1$ [Paturi92]. Upper: robustification gives $\widetilde{\deg}(f\circ g) = O(\widetilde{\deg}(f)\widetilde{\deg}(g)) = O(\sqrt n\cdot n)$ [Sherstov12robust]. Lower: $\widetilde{\deg}(f\circ g) = \tilde\Omega(\sqrt{\mathrm{bs}(f)}\,\widetilde{\deg}(g)) = \tilde\Omega(\sqrt n\cdot n)$ [CKMPSS23]. So $\widetilde{\deg} = \tilde\Theta(\mathrm{Q})$, and $\deg = \Theta(\widetilde{\deg}^{4/3})$ here.'}
    - {measure: deg2,   value: '\Theta(n^2) = \Theta(N)', putative: true, note: 'Over $\mathbb{F}_2$ the composition is the product $\prod_j \overline{\mathrm{EH}}_n(x^j)$ of polynomials on disjoint blocks, so $\deg_2$ adds: $\deg_2(f) = n\deg_2(\overline{\mathrm{EH}}_n)$. For the gadget the coefficient of a degree-$k$ monomial is $\binom{k}{n/2} \bmod 2$, so $\deg_2(\overline{\mathrm{EH}}_n)$ is the largest $k \le n$ whose binary expansion contains that of $n/2$ (Lucas); this is between $n/2$ and $n-1$, since $\binom{n}{n/2}$ is always even. Brute force gives $3,3,7,7$ at $n = 4,6,8,10$.'}
    - {measure: rank,   value: '\Theta(n^2) = \Theta(N)', putative: true, note: 'Upper $\mathrm{rank} \le \mathrm{D} = \Theta(n^2)$. Lower: in the Prover--Delayer game the Delayer defers on the first $n/2$ queries inside each block, scoring a point each time -- no $n/2$ bits of a block can decide $\overline{\mathrm{EH}}_n$, whose $\mathrm{C}_{\min}$ is $n/2+1$ -- and then answers the rest of that block so that it evaluates to $1$. The top $\mathrm{AND}_n$ is then undetermined until all $n$ blocks have been visited, so the Delayer scores $n\cdot n/2 = N/2$. Note this is much stronger than the generic $\mathrm{C}_{\min} \le \mathrm{rank}$, which only gives $\sqrt N$.'}
    - {measure: D_size, value: '2^{\Theta(N)}', note: 'Between $2^{\mathrm{rank}}$ and $2^{\mathrm{D}}$, both $2^{\Theta(n^2)}$ by the [[rank]] entry.'}
    - {measure: UCmin,  value: '\Theta(n^2)', putative: true, note: 'An unambiguous $b$-certificate family of width $w$ writes $f$ (or $1-f$) as a sum of indicators of disjoint subcubes of codimension $\le w$, with no cancellation, so $\deg \le \mathrm{UC}^0$ and $\deg \le \mathrm{UC}^1$, i.e. $\deg \le \mathrm{UC}_{\min} \le \mathrm{UC}$. Here $\deg = \mathrm{UC} = \Theta(n^2)$, so both sides are pinned -- against $\mathrm{C}_{\min} = n$.'}
    - {measure: QC,     value: '\Theta(n) = \Theta(\sqrt N)', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ for every $f$ ([[QC]] vs [[fbs]]), and $\mathrm{fbs} = \Theta(n^2)$ here.'}
    - {measure: psD,    value: '\Theta(n^2)', note: 'For a Boolean-valued function the canonical answer is forced to be $f(x)$, so pseudo-determinism is free: $\mathrm{psD}(f) = \Theta(\mathrm{R}(f)) = \Theta(n^2)$.'}
    - {measure: RS,     value: '\Theta(n^2)', putative: true, note: 'Pinned. Upper: $\mathrm{RS} \le \mathrm{R}/(1-2\varepsilon) = O(n^2)$. Lower: $\mathrm{RS} = \Omega(\mathrm{bs}) = \Omega(n^2)$ -- take a $1$-input with every block at weight $n/2+1$ and star out a uniformly random one of the $n(n/2+1)$ disjoint sensitive blocks; all remaining bits look as usual, so finding a $\ast$ is unstructured search.'}
    - {measure: Adv,    value: '\Theta(n^{3/2}) = \Theta(N^{3/4})', note: 'Sandwiched: $\lambda \le \mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$, with $\lambda = \Theta(n^{3/2})$ and $\mathrm{Q} = \Theta(n^{3/2})$ here. The certificate barrier $\sqrt{\mathrm{C}^0\mathrm{C}^1} = \sqrt{n\cdot(n^2/2+n)} = \Theta(n^{3/2})$ sits at exactly the same place, so the positive adversary is maximal for this function.'}
    - {measure: Advpm,  value: '\Theta(n^{3/2}) = \Theta(N^{3/4})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q} = \Theta(n^{3/2})$ here.'}
    - {measure: gamma2, value: '\Theta(n^{3/2}) = \Theta(N^{3/4})', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q} = \Theta(n^{3/2})$ here.'}
    - {measure: MAdv,   value: '\Theta(n^{3/2}) = \Theta(N^{3/4})', note: 'Between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}_{\varepsilon}$, which agree up to constants at $\Theta(n^{3/2})$ here.'}
    - {measure: ndeg,   value: 'n = \sqrt N', refs: [IJKKKSWW23], note: 'The $\mathrm{ndeg}(f) = n$ half of the recorded [[rdeg]] value: $\mathrm{ndeg}(\overline{\mathrm{EH}}_n) = 1$, witnessed by $p(x) = \sum_i x_i - n/2$, and nondeterministic degree multiplies over the disjoint blocks of an AND, $\mathrm{ndeg}(\mathrm{AND}_n\circ g) = n\,\mathrm{ndeg}(g)$.'}
    - {measure: NQ,     value: '\Theta(n) = \Theta(\sqrt N)', refs: [IJKKKSWW23], note: 'De Wolf''s exact characterisation $\mathrm{NQ}(f) = \lceil\mathrm{ndeg}(f)/2\rceil$ applied to the [[ndeg]] entry. Nondeterministic quantum queries cost $\sqrt N$ while bounded-error ones cost $N^{3/4}$ and $\mathrm{D} = N$.'}
    - {measure: cjdeg,  value: '\widetilde\Omega(n^{3/2}),\ O(n^2)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon} \le \mathrm{cjdeg}_{\varepsilon} \le \mathrm{R}_{\varepsilon}$, with $\widetilde{\deg} = \tilde\Theta(n^{3/2})$ and $\mathrm{R} = \Theta(n^2)$ here.'}
    - {measure: Fdim,   value: 'n^2-n = N-\sqrt N', putative: true, note: 'The gadget''s Fourier support is exactly the even-size sets (see [[spar]]), which span the even-weight subspace of $\mathbb{F}_2^{n}$, of dimension $n-1$. Since the support of the composition is the product of the blocks'' supports, its $\mathbb{F}_2$-span is the direct sum of the $n$ even-weight subspaces, of dimension $n(n-1)$. So $\mathrm{D}^{\oplus} \le N - \sqrt N$: parity queries save something here, but only a $\sqrt N$ additive term.'}
    - {measure: Inf1,   value: '2^{-\Theta(\sqrt n)} = 2^{-\Theta(N^{1/4})}', putative: true, note: 'For Boolean-valued $f$ the $L_1$ and $L_2$ notions of total influence coincide, $\mathrm{I}^1(f) = \mathrm{I}(f)$; see [[Inf]].'}
    - {measure: MaxInf, value: '2^{-\Theta(\sqrt n)} = 2^{-\Theta(N^{1/4})}', putative: true, note: 'The function is transitive (permute blocks, permute inside a block, since $\overline{\mathrm{EH}}_n$ is symmetric), so every coordinate has influence exactly $\mathrm{I}(f)/N = 2c(1-c)^{n-1}$ with $c = \binom{n}{n/2}2^{-n}$; dividing by the polynomial factor $N$ does not touch the $e^{-\Theta(\sqrt n)}$ of the [[Inf]] entry.'}
    - {measure: Var, value: '2^{-\Theta(\sqrt n)} = 2^{-\Theta(N^{1/4})}', note: 'From $\mathrm{Var} = 2\,\mathrm{NS}_{1/2}$ and the [[NS]] entry. The ratio to $\mathrm{MaxInf}$ is not pinned at this precision, so [[osss]] and [[nsr]] are not recorded for this function.'}
    - {measure: Inf,    value: '2^{-\Theta(\sqrt n)} = 2^{-\Theta(N^{1/4})}', putative: true, note: 'Exactly $\mathrm{I}(f) = 2n^2c\,(1-c)^{n-1}$ with $c = \binom{n}{n/2}2^{-n} = \Theta(n^{-1/2}) = \Pr[\overline{\mathrm{EH}}_n = 0]$: a bit of block $j$ is pivotal iff the other $n-1$ bits of its block are balanced to within one, which has probability $2c$, and every other block must be $1$. Since $cn = \Theta(\sqrt n)$, the factor $(1-c)^{n-1} = e^{-\Theta(\sqrt n)}$ swamps the polynomial $2n^2c = \Theta(n^{3/2})$. (Verified against the full Fourier expansion at $n = 4$: $\mathrm{I} = 2.9296875$.)'}
    - {measure: L1,     value: '2^{\Theta(N)}', putative: true, note: 'The blocks are disjoint, so $\widehat{L}_1(f) = |1 - 2q^n| + 2\big[\widehat{L}_1^{01}(\overline{\mathrm{EH}}_n)^n - q^n\big]$ with $q = 1-c$. The gadget''s $0/1$ spectral norm is $2^{n/2}$ up to polynomial factors: Cauchy--Schwarz against $\sum_S \hat g(S)^2 = c$ gives $\widehat{L}_1^{01} \le \sqrt{\binom{n}{n/2}} \le 2^{n/2}$, and level $n/2$ alone contributes $\binom{n}{n/2}2^{-n}\binom{n/2}{n/4} = \Theta(2^{n/2}/n)$ when $n/2$ is even, because the Krawtchouk value there is $\pm\binom{n/2}{n/4}$. Hence $\widehat{L}_1(f) = 2^{(1/2-o(1))N}$. Exact value $19.1474\ldots$ at $n = 4$.'}
    - {measure: spar,   value: '2^{N-\sqrt N}', putative: true, note: 'Sparsity is multiplicative over disjoint blocks, and the gadget has exactly $2^{n-1}$ nonzero coefficients: $\hat g(S)$ is $2^{-n}$ times a Krawtchouk value $K_{n/2}(|S|)$, which vanishes for every odd $|S|$ (complementation fixes the middle slice) and is nonzero for every even $|S|$ (checked for $n \le 18$). So $\mathrm{spar}(f) = (2^{n-1})^n = 2^{N-\sqrt N}$, near-maximal.'}
    - {measure: bs, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{bs}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: fbs, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{fbs}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: C, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{C}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: FC, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{FC}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: R0, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: RC, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{RC}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: CA, value: '\Theta(n^2)', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = \Theta(n^2)$ here.'}
    - {measure: CGpub, value: '\Theta(n^2)', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs}(f) = \Theta(n^2)$ here.'}
    - {measure: CGstar, value: '\Theta(n^2)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n^2)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: R, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{R}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: Rbar, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: R1, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: chi, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \chi(g) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: chibar, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\chi}(g) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: LR, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: Rstar, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: CG, value: '\Theta(n^3) = \Theta(N^{3/2})', note: 'Pinned, and *above the arity*: the private-coin certificate game is **not** bounded by $\mathrm{D}$. Lower: $\mathrm{Adv} \ge \lambda = \Theta(n^{3/2})$, so $\mathrm{CG} \ge \mathrm{Adv}^2 = \Omega(n^3)$. Upper: $\mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1 = n\cdot(n^2/2+n) = \Theta(n^3)$. The two meet, so [[ANDEH]] is a clean example of $\mathrm{CG} = \Theta(\mathrm{D}^{3/2})$ -- which is exactly what the large $\lambda$ of this function was built to produce.'}
    - {measure: QE, value: '\Theta(n^2)', note: 'Sandwiched: $\deg(f) \le \mathrm{Q}_{\mathrm{E}}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: prt, value: '\Theta(n^2)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here.'}
    - {measure: rprt, value: '\Theta(n^2)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n^2)$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: cbs,  value: '\Theta(n^2)', refs: [GoosPitassi14], note: '$\mathrm{cbs} = \mathrm{bs}$ for Boolean-valued problems [GoosPitassi14], and $\mathrm{bs} = \Theta(n^2)$.'}
    - {measure: Dmu,  value: '\Theta(n^2)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3} = \Theta(\mathrm{R}_{1/3}) = \Theta(n^2)$.'}
    - {measure: Np,   value: '\Omega(n^2),\ O(n^2\log n)', refs: [FRPU94], note: '$\mathrm{N}_p \ge \mathrm{R} = \Omega(n^2)$, and majority-amplifying each query of the optimal randomized tree costs $O(\log \mathrm{R})$ [FRPU94].'}
    - {measure: noisyR, value: '\Theta(n^2)', refs: [BenDavidBlais20composition, CKMPSS23], note: '$\mathrm{noisyR} \le \mathrm{R}$ always, and here $\mathrm{R} = \Theta(n^2) = \Theta(N)$ is of the order of the arity, which forces $\mathrm{noisyR} = \Theta(\mathrm{R})$ by the recorded implication [CKMPSS23].'}
    - {measure: robustQ, value: '\Omega(n^{3/2}),\ O(n^{3/2}\log n)', refs: [BNRdW05], note: '$\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(n^{3/2})$, and $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ [BNRdW05]. The generic $O(N) = O(n^2)$ bound of [BNRdW05] is weaker.'}
    - {measure: PDT,  value: '\Theta(n^2)', putative: true, note: '$\deg_2 \le \mathrm{D}^{\oplus} \le \mathrm{D}$, and the recorded $\deg_2 = \Theta(n^2)$ and $\mathrm{D} = \Theta(n^2)$ close the sandwich. Consistent with the recorded $\dim_{\mathbb{F}_2} = n^2-n$.'}
    - {measure: NS,   value: '2^{-\Theta(\sqrt n)}', putative: true, refs: [ODonnell14], note: 'For constant $\delta$, $\delta\,\mathrm{Var}(f) \le \mathrm{NS}_\delta(f) \le \tfrac12\mathrm{Var}(f)$, since each factor $1-(1-2\delta)^{|S|}$ with $|S|\ge1$ lies in $[2\delta,1]$. Each of the $n$ blocks is $1$ with probability $1-c$, $c = \Theta(n^{-1/2})$, so $\Pr[f=1] = (1-c)^n = 2^{-\Theta(\sqrt n)}$ and $\mathrm{Var} = 4p(1-p) = 2^{-\Theta(\sqrt n)}$ -- the same collapse that gives the recorded $\mathrm{I}(f) = 2^{-\Theta(\sqrt n)}$.'}
    - {measure: Stab, value: '1 - 2^{-\Theta(\sqrt n)}', putative: true, note: 'From $\mathrm{Stab}_\rho = 1-2\,\mathrm{NS}_{(1-\rho)/2}$ and the [[NS]] entry: the $\mathrm{AND}$ is almost always $0$, hence almost perfectly noise stable.'}
    - {measure: odeg, value: '\widetilde O(n^{3/2})', note: '$\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = \tilde\Theta(n^{3/2})$.'}
    - {measure: sdeg, value: '\widetilde O(n^{3/2})', note: 'From $\mathrm{sdeg} \le \widetilde{\deg} = \tilde\Theta(n^{3/2})$.'}
    - {measure: ardeg, value: 'O(n) = O(\sqrt N)', refs: [IJKKKSWW23], note: 'Approximate rational degree is at most the *exact* rational degree, and the recorded $\mathrm{rdeg} = \Theta(n)$ is already a full power below $\widetilde{\deg} = \tilde\Theta(n^{3/2})$ and two powers below $\deg = \Theta(n^2)$. This is exactly the point of the function: rational approximation is cheap here even though polynomial approximation is not.'}
    - {measure: PostQ, value: 'O(n) = O(\sqrt N)', refs: [MahadevdeWolf15, IJKKKSWW23], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15], and $\mathrm{rdeg}_{1/3} \le \mathrm{rdeg} = \Theta(n)$. So post-selection gives a genuine polynomial speed-up over ordinary quantum queries on this function: $O(\sqrt N)$ against $\mathrm{Q} = \Theta(N^{3/4})$.'}
  witnesses:
    - {of: [D, rdeg],      setting: total, statement: '$\mathrm{D} = \Theta(\mathrm{rdeg}^2)$.', refs: [IJKKKSWW23]}
    - {of: [deg, rdeg],    setting: total, statement: '$\deg = \Theta(\mathrm{rdeg}^2)$ -- the largest separation known, and the lower end of the surviving gap now that $\deg = \widetilde O(\mathrm{rdeg}^3)$ [KKWY26] has answered Fortnow''s question.', refs: [IJKKKSWW23, KKWY26]}
    - {of: [s, rdeg],      setting: total, statement: '$\mathrm{s} = \Theta(\mathrm{rdeg}^2)$.', refs: [IJKKKSWW23]}
    - {of: [lambda, rdeg], setting: total, statement: '$\lambda = \Theta(\mathrm{rdeg}^{3/2})$; in particular $\lambda \le \mathrm{rdeg}$ is **false**, killing the hope of lower-bounding rdeg by spectral sensitivity.', refs: [IJKKKSWW23, ABKRT21]}
  refs: [IJKKKSWW23]
  see_also: [EH, AND, rdeg, ndeg, lambda]

- id: MeiburgTournament
  name: Meiburg's tournament-subcube function
  symbol: 'f_{\mathrm{Mei}}'
  group: composed
  order: 27
  kind: total
  arity: '$N = 2{,}017{,}584^{\,d}$ bits ($d = 1$ is the base case)'
  scale: {var: d, subs: {N: '2017584^d'}}
  short: 'Refutes $\mathrm{bs} = O(\lambda^2)$: a total function with $\mathrm{bs} \ge \lambda^{2.127}$.'
  definition: |
    The indicator of a union of $k$ subcubes of the Boolean cube, indexed by the
    vertices of a *doubly regular tournament*; the remaining free choices in the
    construction are fixed by the Lovász Local Lemma. Composing the base function
    with itself gives an infinite family with $\lambda \to \infty$ and
    $\mathrm{bs} = \Omega(\lambda^{2.127})$.
  values:
    - {measure: bs,     value: '14011^{\,d}', refs: [Meiburg26], note: 'The base case ($d=1$) is $\mathrm{bs} \ge 14011$, established -- and formally verified in Lean -- in [Meiburg26]. Block sensitivity is supermultiplicative under block composition (plant a $\mathrm{bs}$-maximising inner input in each copy and take unions of inner blocks across each outer block), so the $d$-fold composition has $\mathrm{bs} \ge 14011^{\,d}$. Exact, not merely a lower bound: $\mathrm{bs} \le \mathrm{C} = \mathrm{C}^0 = 14011^{\,d}$ by [[C0]].'}
    - {measure: lambda, value: '\le 89.0162^{\,d}', refs: [Meiburg26, ABKRT21], note: 'The base case is $\lambda \le 89.0162$ [Meiburg26]. Spectral sensitivity is *exactly* multiplicative under block composition [ABKRT21] -- the sensitivity-graph adjacency operator of $f\circ g$ is a tensor-like product -- so the family has $\lambda \le 89.0162^{\,d}$. Against the $\mathrm{bs}$ entry this gives $\mathrm{bs} \ge \lambda^{\log 14011/\log 89.0162} = \lambda^{2.127}$ for every $d$.'}
    - {measure: C,      value: '14011^{\,d}', putative: true, note: 'Squeezed exactly: $\mathrm{C} \ge \mathrm{bs} \ge \mathrm{bs}^0 = 14011^{\,d}$ from [[bs0]], and $\mathrm{C} = \max\{\mathrm{C}^0,\mathrm{C}^1\} = \mathrm{C}^0 = 14011^{\,d}$ from [[C0]] and [[C1]].'}
    - {measure: fbs,    value: '14011^{\,d}', putative: true, note: 'Squeezed exactly between $\mathrm{bs} = 14011^{\,d}$ and $\mathrm{C} = 14011^{\,d}$.'}
    - {measure: D,      value: '\ge 14011^{\,d}', putative: true, note: 'Immediate from $\mathrm{D} \ge \mathrm{C} \ge \mathrm{bs}$. Against $N = 2{,}017{,}584^{\,d}$ this is a very small fraction of the input, which is the point: the construction buys a large $\mathrm{bs}$ cheaply in $\lambda$, not in $N$.'}
    - {measure: deg,    value: '\le 7923.9^{\,d}', putative: true, refs: [ABKRT21], note: '$\lambda(f) \ge \sqrt{\deg(f)}$ [ABKRT21], so $\deg \le \lambda^2 \le 89.0162^{2d}$. In the other direction $\mathrm{bs} \le \deg^2$ gives $\deg \ge \sqrt{\mathrm{bs}} \ge 118.3^{\,d}$, so the degree is pinned into $[118.3^{\,d},\, 7923.9^{\,d}]$. Chaining the two is exactly where the $\mathrm{bs} = O(\lambda^4)$ upper bound comes from, and this family shows the truth is at least $\lambda^{2.127}$.'}
    - {measure: Q,      value: '\ge 118.3^{\,d}', putative: true, note: '$\mathrm{Q} = \Omega(\sqrt{\mathrm{bs}})$, and $\mathrm{bs} \ge 14011^{\,d}$.'}
    - {measure: R,      value: '\ge 14011^{\,d}', putative: true, note: '$\mathrm{R} = \Omega(\mathrm{bs})$, and $\mathrm{bs} \ge 14011^{\,d}$.'}
    - {measure: s,      value: '\Omega(10.87^{\,d})', putative: true, refs: [Huang19, NS94], note: 'Chain the two directions of the degree: $\mathrm{bs} = O(\deg^2)$ [NS94] gives $\deg = \Omega(\sqrt{\mathrm{bs}})$, and $\mathrm{s} \ge \sqrt{\deg}$ [Huang19] then gives $\mathrm{s} = \Omega(\mathrm{bs}^{1/4}) = \Omega(14011^{\,d/4})$. Sensitivity of this family is therefore *not* pinned: anywhere from $\mathrm{bs}^{1/4}$ to $\mathrm{bs}$ is consistent with what is proved, and $\lambda \le \mathrm{s}$ says nothing here because only an upper bound on $\lambda$ is known.'}
    - {measure: FC,     value: '14011^{\,d}', putative: true, note: '$\mathrm{FC} = \mathrm{fbs}$ by LP duality, and [[fbs]] is pinned at $14011^{\,d}$.'}
    - {measure: RC,     value: '\Theta(14011^{\,d})', putative: true, note: '$\mathrm{RC} = \Theta(\mathrm{fbs})$ for every **total** $f$ ([[RC]] vs [[fbs]]), and [[fbs]] is pinned at $14011^{\,d}$.'}
    - {measure: EC,     value: '14011^{\,d}', putative: true, note: 'Expectational certificate complexity satisfies $\mathrm{fbs} \le \mathrm{EC} \le \mathrm{C}$, and both ends are exactly $14011^{\,d}$.'}
    - {measure: UC,     value: '\ge 14011^{\,d}', putative: true, note: 'Immediate from $\mathrm{UC} \ge \mathrm{C} \ge \mathrm{bs}$.'}
    - {measure: SP,     value: '\ge 14011^{\,d}', putative: true, note: 'Every subcube of a monochromatic partition is a certificate for the inputs it contains, so $\mathrm{SP} \ge \mathrm{C} \ge \mathrm{bs}$.'}
    - {measure: UCmin,  value: '\ge 118.3^{\,d}', putative: true, note: 'An unambiguous $b$-certificate family of width $w$ writes $f$ (or $1-f$) as the sum of the indicators of disjoint subcubes of codimension $\le w$, with no cancellation, so $\deg(f) \le \mathrm{UC}^0$ and $\deg(f) \le \mathrm{UC}^1$, hence $\deg \le \mathrm{UC}_{\min}$. With $\deg \ge \sqrt{\mathrm{bs}} \ge 118.3^{\,d}$ from the [[deg]] entry this is the bound; the alternative route $\mathrm{D} \le \mathrm{UC}_{\min}^2$ gives the same $\sqrt{14011^{\,d}}$.'}
    - {measure: Dna,    value: '\ge 14011^{\,d}', putative: true, note: 'Non-adaptivity only costs more: $\mathrm{D}^{\mathrm{na}} \ge \mathrm{D} \ge \mathrm{bs}$.'}
    - {measure: R0,     value: '\ge 14011^{\,d}', putative: true, note: '$\mathrm{R}_0 \ge \mathrm{R} = \Omega(\mathrm{bs})$; in fact $\mathrm{R}_0 \ge \mathrm{C} \ge \mathrm{bs}$ directly, since a zero-error algorithm must output a certificate.'}
    - {measure: Rbar,   value: '\ge 14011^{\,d}', putative: true, note: 'Between $\mathrm{R}$ and $\mathrm{R}_0$, both $\ge 14011^{\,d}$ here.'}
    - {measure: R1,     value: '\ge 14011^{\,d}', putative: true, note: 'Between $\mathrm{R}$ and $\mathrm{R}_0$, both $\ge 14011^{\,d}$ here.'}
    - {measure: Rna,    value: '\ge 14011^{\,d}', putative: true, note: '$\mathrm{R}^{\mathrm{na}} \ge \mathrm{R} = \Omega(\mathrm{bs})$.'}
    - {measure: Rstar,  value: '\ge 14011^{\,d}', putative: true, note: 'Block sensitivity is supermultiplicative under composition, so $\mathrm{R}(f_d^{\circ m}) \ge \mathrm{bs}(f_d^{\circ m}) \ge \mathrm{bs}(f_d)^m$ for every $m$; taking $m$-th roots gives $\mathrm{R}^{*}(f_d) \ge \mathrm{bs}(f_d) \ge 14011^{\,d}$. The same computation makes $\mathrm{R}^{*}$ multiplicative along this family, since $f_d$ is itself the $d$-fold self-composition of the base function.'}
    - {measure: CA,     value: '\Theta(14011^{\,d})', putative: true, note: '$\mathrm{CA} = \Theta(\mathrm{fbs})$ for every **total** $f$ ([[CA]] vs [[fbs]]), and [[fbs]] is pinned at $14011^{\,d}$.'}
    - {measure: CGpub,  value: '\Theta(14011^{\,d})', putative: true, note: '$\mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{fbs})$ for every **total** $f$ ([[CGpub]] vs [[fbs]]), and [[fbs]] is pinned at $14011^{\,d}$.'}
    - {measure: CGstar, value: '\Theta(14011^{\,d})', refs: [CGLMSG23], putative: true, note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$, so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim.'}
    - {measure: CGns,   value: '\Theta(14011^{\,d})', refs: [CGLMSG23], putative: true, note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$, so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim.'}
    - {measure: CG,     value: '\Omega(14011^{\,d})', putative: true, note: 'The private-coin certificate game is at least $\max\{\mathrm{Adv}^2,\ \mathrm{R}_0,\ \mathrm{CA}\}$, and already $\mathrm{Adv}^2 \ge \mathrm{bs} \ge 14011^{\,d}$. Note $\mathrm{CG}$ is *not* capped by $\mathrm{D}$, so nothing here is squeezed from above.'}
    - {measure: prt,    value: '\Omega(14011^{\,d})', putative: true, note: 'The partition bound dominates fractional block sensitivity, $\mathrm{fbs} \le \mathrm{prt}_{\varepsilon}$, and $\mathrm{fbs} \ge \mathrm{bs} \ge 14011^{\,d}$.'}
    - {measure: rprt,   value: '\Omega(14011^{\,d})', conf: medium, putative: true, note: 'As [[prt]]; the relaxed partition bound still dominates $\mathrm{fbs}$ (the zoo''s own observation that the [JainKlauck10] techniques survive dropping the completeness equality -- see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record).'}
    - {measure: QE,     value: '\ge 118.3^{\,d}', putative: true, note: '$\mathrm{Q}_E \ge \mathrm{Q} \ge 118.3^{\,d}$; the degree route $\mathrm{Q}_E \ge \deg/2$ gives only $59.2^{\,d}$ and is weaker.'}
    - {measure: Q0,     value: '\ge 118.3^{\,d}', putative: true, note: '$\mathrm{Q}_0 \ge \mathrm{Q} \ge 118.3^{\,d}$.'}
    - {measure: Adv,    value: '\Omega(118.3^{\,d})', putative: true, refs: [Ambainis02], note: 'Ambainis'' basic adversary bound at a maximally block-sensitive input gives $\mathrm{Adv} \ge \sqrt{\mathrm{bs}}$ ([[bs]] vs [[Adv]]), i.e. $\ge 14011^{\,d/2}$. This is what supplies the $\mathrm{Q}$ entry, since $\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$.'}
    - {measure: Advpm,  value: '\Omega(118.3^{\,d})', putative: true, note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_{\varepsilon})$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q} \ge 118.3^{\,d}$ here.'}
    - {measure: gamma2, value: '\Omega(118.3^{\,d})', putative: true, note: '$\gamma_2^{\alpha} = \Theta(\mathrm{Q}_{\varepsilon})$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q} \ge 118.3^{\,d}$ here.'}
    - {measure: MAdv,   value: '\Omega(118.3^{\,d})', putative: true, note: 'Between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}_{\varepsilon}$, which agree up to constants; both are $\Omega(118.3^{\,d})$ here.'}
