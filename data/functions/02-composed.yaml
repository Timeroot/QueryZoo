    - {measure: adeg,   value: '\Omega(118.3^{\,d})', putative: true, refs: [NS94], note: '$\mathrm{bs} = O(\widetilde{\deg}^2)$ [NS94], so $\widetilde{\deg} = \Omega(\sqrt{\mathrm{bs}}) = \Omega(14011^{\,d/2})$. Above it sits $\widetilde{\deg} \le \deg \le 7923.9^{\,d}$ from the [[deg]] entry, so approximate degree is pinned into a factor-$67^{\,d}$ window.'}
    - {measure: C0,     value: '14011^{\,d}', putative: true, refs: [Meiburg26], note: 'Exact, and the load-bearing cell for the whole entry. The base function is the indicator of a union of $k = 14011$ subcubes, so a $0$-input is certified by naming, for each subcube, one coordinate on which it is violated: $\mathrm{C}^0 \le 14011$ for $d=1$. Since $\mathrm{C}^1 \le 7149$ (the codimension of a single subcube), $\mathrm{C} = 14011$ at $d=1$, and certificate complexity is submultiplicative under composition ($\mathrm{C}^0(F\circ g^m) \le \mathrm{C}^0(F)\,\mathrm{C}(g)$: certify the outer coordinates, then each of the corresponding inner copies), giving $\mathrm{C}^0 \le 14011^{\,d}$. The matching lower bound is $\mathrm{C}^0 \ge \mathrm{bs}^0 \ge 14011^{\,d}$ (see [[bs0]]). Consequently $\mathrm{bs} = \mathrm{fbs} = \mathrm{FC} = \mathrm{EC} = \mathrm{C} = 14011^{\,d}$ exactly, all of them being squeezed between $\mathrm{bs}^0$ and $\mathrm{C}$.'}
    - {measure: bs0,    value: '14011^{\,d}', putative: true, refs: [Meiburg26], note: 'Lower bound: [Meiburg26, Lemma 3.1] exhibits $14011$ disjoint sensitive blocks at the all-zeros input, which is a $0$-input, so $\mathrm{bs}^0 \ge 14011$ at $d=1$. Because the witnessing input is a $0$-input in every copy, the usual planting argument keeps the $0$-side: place the all-zeros input in every inner copy and take unions of inner blocks across each outer block, so $\mathrm{bs}^0(f^{\circ d}) \ge 14011^{\,d}$. Upper bound: $\mathrm{bs}^0 \le \mathrm{C}^0 \le 14011^{\,d}$ by [[C0]]. The two meet, so this is exact.'}
    - {measure: cbs,    value: '14011^{\,d}', putative: true, refs: [GoosPitassi14, Meiburg26], note: '$\mathrm{cbs} = \mathrm{bs}$ for Boolean-valued problems [GoosPitassi14]. Here $\mathrm{bs}$ is in fact pinned exactly rather than merely bounded below: $14011^{\,d} \le \mathrm{bs}^0 \le \mathrm{bs} \le \mathrm{C} \le 14011^{\,d}$, using [[bs0]] and [[C0]].'}
    - {measure: C1,     value: '\le 7149\cdot 14011^{\,d-1}', putative: true, refs: [Meiburg26], note: 'A $1$-input of the base function lies in one of the subcubes, whose codimension is $7149$, so $\mathrm{C}^1 \le 7149$ at $d = 1$. Composing, $\mathrm{C}^1(F\circ g^m) \le \mathrm{C}^1(F)\,\mathrm{C}(g)$ -- the outer $1$-certificate fixes both $0$s and $1$s, so the inner cost is the two-sided $\mathrm{C}(g) = 14011^{\,d-1}$. No lower bound is available: nothing in the construction forces a $1$-certificate to be large.'}
    - {measure: Cmin,   value: '\le 7149\cdot 14011^{\,d-1}', putative: true, note: '$\mathrm{C}_{\min} = \min\{\mathrm{C}^0,\mathrm{C}^1\} = \mathrm{C}^1$ here, since the [[C1]] bound $7149\cdot 14011^{\,d-1} \approx 0.51\cdot 14011^{\,d}$ is strictly below the exact $\mathrm{C}^0 = 14011^{\,d}$. The relation $\mathrm{D} \le \mathrm{C}_{\min}\cdot\mathrm{C}$ therefore gives only $\mathrm{D} = O(14011^{2d})$, far above the recorded lower bound.'}
    - {measure: Dmu,    value: '\ge 14011^{\,d}', putative: true, refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3} = \Theta(\mathrm{R}_{1/3})$, and $\mathrm{R} \ge \mathrm{bs} \ge 14011^{\,d}$.'}
    - {measure: Np,     value: '\ge 14011^{\,d}', putative: true, refs: [FRPU94], note: 'A noisy-query algorithm is in particular a randomized one, so $\mathrm{N}_p \ge \mathrm{R} \ge 14011^{\,d}$. The matching $O(\mathrm{R}\log \mathrm{R})$ upper bound [FRPU94] is vacuous here, since no upper bound on $\mathrm{R}$ is known.'}
    - {measure: robustQ, value: '\Omega(118.3^{\,d})', putative: true, refs: [BNRdW05], note: 'A robust quantum algorithm works in particular with a clean oracle, so $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Omega(\sqrt{\mathrm{bs}}) = \Omega(118.3^{\,d})$. The generic upper bound $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ [BNRdW05] is vacuous here, since no upper bound on $\mathrm{Q}$ is known.'}
    - {measure: chi,    value: '\Omega(14011^{\,d})', putative: true, refs: [Li18], note: 'Conflict complexity dominates block sensitivity, $\chi = \Omega(\mathrm{bs})$ [Li18], and $\mathrm{bs} = 14011^{\,d}$.'}
    - {measure: chibar, value: '\Omega(14011^{\,d})', putative: true, refs: [GLSS19], note: '$\bar\chi \ge \chi = \Omega(\mathrm{bs}) = \Omega(14011^{\,d})$; the recorded $\mathrm{RS} \le \bar\chi$ [GLSS19] gives the same bound.'}
    - {measure: LR,     value: '\Omega(14011^{\,d})', putative: true, refs: [BBGM22], note: '$\mathrm{LR} = \Omega(\bar\chi) = \Omega(\mathrm{bs}) = \Omega(14011^{\,d})$ [BBGM22]. Since $\mathrm{LR} \le \mathrm{R}$ and $\mathrm{R} \ge \mathrm{bs}$ is all that is known, the two lower bounds coincide.'}
    - {measure: cjdeg,  value: '\Omega(118.3^{\,d})', putative: true, note: 'Conical junta degree dominates approximate degree, $\widetilde{\deg}_\varepsilon \le \mathrm{cjdeg}_\varepsilon$, and the recorded $\widetilde{\deg} = \Omega(118.3^{\,d})$.'}
    - {measure: deg2,   value: '\le 7923.9^{\,d}', putative: true, note: 'The unique multilinear representation of a Boolean function has integer coefficients, so reducing it mod $2$ computes $f$ over $\mathbb{F}_2$: $\deg_2 \le \deg \le 7923.9^{\,d}$ by the [[deg]] entry. No lower bound is available.'}
    - {measure: ndeg,   value: '\le 7923.9^{\,d}', putative: true, refs: [IJKKKSWW23], note: 'A polynomial computing $f$ exactly is nonzero exactly on $f^{-1}(1)$, so $\mathrm{ndeg} \le \deg \le 7923.9^{\,d}$. The competing bound $\mathrm{ndeg} \le \mathrm{C}^1$ of [IJKKKSWW23] gives $7149\cdot 14011^{\,d-1}$, which is worse for $d \ge 2$.'}
