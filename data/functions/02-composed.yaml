- id: Rubinstein
  name: Rubinstein's function
  symbol: 'f_{\mathrm{Rub}}'
  group: composed
  order: 24
  kind: total
  arity: '$N=n^2$ bits'
  short: 'The classical quadratic separation $\mathrm{bs} = \tfrac12\mathrm{s}^2$.'
  definition: |
    OR of $n$ copies of a gadget on $n$ bits that fires only on "two adjacent ones
    and nothing else".
  formal: |
    Let $n$ be even. For $y \in \{0,1\}^n$ define
    $$g(y) = 1 \iff \exists k\in[n/2]:\ y_{2k-1}=y_{2k}=1 \text{ and } y_j = 0 \text{ for all } j \notin \{2k-1,2k\}.$$
    Then $f_{\mathrm{Rub}}(y^1,\dots,y^n) = \bigvee_{j=1}^n g(y^j)$ on $N = n^2$ bits.
  values:
    - {measure: s,  value: 'n = \sqrt N', note: 'Achieved at an input where each block has a single $1$ in an odd position.'}
    - {measure: bs, value: 'n^2/2 = N/2', note: 'At $0^N$: the $n/2$ adjacent pairs inside each of the $n$ blocks are disjoint sensitive blocks.'}
    - {measure: C,  value: '\Theta(N)'}
    - {measure: D,  value: 'N'}
    - {measure: fbs,    value: '\Theta(N)', note: 'Between $\mathrm{bs}=N/2$ and $\mathrm{C}=\Theta(N)$.'}
    - {measure: FC,     value: '\Theta(N)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: Dna,    value: 'N'}
    - {measure: RC, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{RC}(f) \le \mathrm{C}(f)$, with both ends $\Theta(N)$ here.'}
    - {measure: R0, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{C}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: CA, value: '\Theta(N)', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = \Theta(N)$ here.'}
    - {measure: CGpub, value: '\Theta(N)', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs}(f) = \Theta(N)$ here.'}
    - {measure: CGstar, value: '\Theta(N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: R, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{R}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: Rbar, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: R1, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: CG, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{CG}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: Rna, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}^{\mathrm{na}}(f) = N$ here.'}
    - {measure: prt, value: '\Theta(N)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here.'}
    - {measure: rprt, value: '\Theta(N)', conf: medium, note: 'Sandwiched: $\mathrm{fbs}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{fbs}(f) = \Theta(N)$ and $\mathrm{D}(f) = N$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
  witnesses:
    - {of: [bs, s], setting: total, statement: '$\mathrm{bs}(f) = \tfrac12 \mathrm{s}(f)^2$; improved constant $\mathrm{bs}\ge\tfrac23 \mathrm{s}^2 - \tfrac13\mathrm{s}$ by [AmbainisSun11].', refs: [Rubinstein95, AmbainisSun11]}
    - {of: [RC, s], setting: total, statement: '$\mathrm{RC} = \Omega(\mathrm{s}^2)$ (since $\mathrm{RC}=\Theta(\mathrm{fbs})\ge\mathrm{bs}$); the witness in the RC-vs-s and bs-vs-s cells.', refs: [Rubinstein95]}
  notes: |
    The best known upper bound in the other direction is still exponential:
    $\mathrm{bs}(f) \le \tfrac{e}{\sqrt{2\pi}} e^{\mathrm{s}(f)}\sqrt{\mathrm{s}(f)}$
    [KenyonKutin04]. Whether $\mathrm{bs} = O(\mathrm{s}^2)$ -- the
    *sensitivity-vs-block-sensitivity* question -- is wide open and is **not**
    resolved by Huang's theorem.
  refs: [Rubinstein95, AmbainisSun11, KenyonKutin04, Chakraborty11]
  see_also: [s, bs, AmbainisSunFn]

- id: AmbainisSunFn
  name: Ambainis-Sun function
  symbol: 'f_{\mathrm{AS}}'
  group: composed
  order: 25
  kind: total
  arity: '$N$ bits'
  short: 'Improves Rubinstein''s constant to $\mathrm{bs} \ge \tfrac23 \mathrm{s}^2 - \tfrac13 \mathrm{s}$.'
  definition: |
    A refinement of Rubinstein's gadget: the inner function fires on certain
    length-$3$ patterns rather than adjacent pairs, which buys a factor $4/3$.
  values:
    - {measure: bs, value: '\tfrac23\,\mathrm{s}^2 - \tfrac13\,\mathrm{s}'}
  witnesses:
    - {of: [bs, s], setting: total, statement: 'Current record constant for the quadratic bs-vs-s separation.', refs: [AmbainisSun11]}
  refs: [AmbainisSun11]
  see_also: [Rubinstein, s, bs]
  todo: 'Transcribe the explicit gadget from [AmbainisSun11].'

- id: ANDEH
  name: AND composed with NOT-EXACT-HALF
  symbol: '\mathrm{AND}_n \circ \overline{\mathrm{EH}}_n'
  aliases: ['\wedge\circ\overline{\mathrm{EH}}']
  group: composed
  order: 26
  kind: total
  arity: '$N=n^2$ bits'
  short: 'The witness for the whole rdeg column: $\mathrm{rdeg}=\Theta(n)$ while $\mathrm{s},\deg,\mathrm{D}=\Theta(n^2)$.'
  definition: 'AND of $n$ copies of $\overline{\mathrm{EH}}_n$ (the negation of exact-half), on $N = n^2$ bits.'
  formal: |
    $$f(x^1,\dots,x^n) = \bigwedge_{j=1}^{n} \overline{\mathrm{EH}}_n(x^j)
      = \bigwedge_{j=1}^{n} \mathbb{1}\Big[\textstyle\sum_i x^j_i \ne \tfrac n2\Big].$$
  values:
