    - {measure: psD,    value: '\ge 14011^{\,d}', putative: true, note: 'For a Boolean-valued function the canonical answer is forced to be $f(x)$, so pseudo-determinism is free: $\mathrm{psD}(f) = \Theta(\mathrm{R}(f)) = \Omega(\mathrm{bs})$.'}
