# =====================================================================
# FUNCTIONS: classical total functions that a textbook or a homework
# sheet would reach for. The bent function, the one-in-a-box function,
# SINK, and two graph properties from the evasiveness story.
# =====================================================================
functions:

- id: IP
  name: Inner product mod 2
  symbol: '\mathrm{IP}_n'
  aliases: ['IP2', 'the bent function', 'x \cdot y \bmod 2']
  group: basic
  order: 19.1
  kind: total
  arity: '$n = 2m$ bits, read as a pair $(x,y)\in\{0,1\}^m\times\{0,1\}^m$'
  short: 'Everything combinatorial is $n$ and everything Fourier is as spread out as it can be: the flat spectrum makes $\mathrm{L}_1 = 2^{n/2}$ with $\mathrm{spar} = 2^n$.'
  definition: |
    $\mathrm{IP}_n(x,y) = \bigoplus_{i=1}^{m} x_i \wedge y_i$. As a $\pm1$-valued
    function $F(x,y) = (-1)^{x\cdot y}$ it is *bent*: every one of its $2^n$ Fourier
    coefficients has the same magnitude $2^{-n/2}$, the flattest a Boolean spectrum
    can be. That single fact fixes every Fourier quantity below.

    IP is the standard gadget in lifting theorems, and the standard example of a
    function that is trivial over $\mathbb{F}_2$ ($\deg_2 = 2$) and maximally hard
    over $\mathbb{R}$ ($\deg = n$).
  formal: '$$\mathrm{IP}_n(x,y) = \sum_{i=1}^{m} x_i y_i \bmod 2, \qquad n = 2m.$$'
  values:
    - {measure: D,     value: 'n', note: 'From $\deg = n$ below, and $\deg \le \mathrm{D}$.'}
    - {measure: deg,   value: 'n', note: 'The multilinear extension is $\tfrac12\big(1 - \prod_{i=1}^{m}(1-2x_iy_i)\big)$, whose leading term $-\tfrac12(-2)^{m}\prod_i x_iy_i$ has degree $2m = n$ and does not cancel.'}
    - {measure: deg2,  value: '2', note: 'Over $\mathbb{F}_2$ it is literally $\sum_i x_iy_i$. The gap between this and $\deg = n$ is the whole reason IP is used as a lifting gadget.'}
    - {measure: s,     value: 'n', note: 'Flipping $x_i$ changes the value iff $y_i = 1$, and symmetrically, so $\mathrm{s}(x,y) = |x| + |y|$; at $x = y = 1^m$ that is $n$.'}
    - {measure: bs,    value: 'n', note: 'Pinned: $\mathrm{s} \le \mathrm{bs} \le \mathrm{D}$ and both ends are $n$. The same sandwich fixes $\mathrm{fbs}$, $\mathrm{C}$, $\mathrm{RC}$, $\mathrm{UC}$ and $\mathrm{Dna}$ at $n$.'}
    - {measure: C,     value: 'n', note: 'As above.'}
    - {measure: fbs,   value: 'n', note: 'As above.'}
    - {measure: R,     value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs} \le 3\mathrm{R}$ (indeed $\mathrm{R} = \Omega(\mathrm{s})$) and $\mathrm{R} \le \mathrm{D} = n$.'}
    - {measure: noisyR, value: '\Theta(n)', refs: [CKMPSS23], note: 'The zoo''s own [[noisyR]] vs [[R]] entry records $\mathrm{R}(f)=\Theta(n)\Rightarrow\mathrm{noisyR}(f)=\Theta(\mathrm{R}(f))$ [CKMPSS23], and the recorded $\mathrm{R}$ is linear in the arity here -- the function reads all $n$ bits, so buying unbiased copies buys nothing.'}
    - {measure: Q,     value: '\Theta(n)', note: 'Sandwiched: $\mathrm{Q} \ge \widetilde{\deg}/2 \ge \mathrm{sdeg}/2 \ge n/4$ and $\mathrm{Q} \le \mathrm{D} = n$.'}
    - {measure: QE,    value: '\Theta(n)', note: 'Sandwiched: $\mathrm{Q}_E \ge \deg/2 = n/2$ and $\mathrm{Q}_E \le \mathrm{D} = n$. (With a *parity* oracle the answer would be $m+1$ or so; see $\mathrm{D}^{\oplus}$ below.)'}
    - {measure: sdeg,  value: '\Theta(n)', note: 'Restricting $y = 1^m$ leaves $\mathrm{PARITY}_m$, so $\mathrm{sdeg} \ge \mathrm{sdeg}(\mathrm{PARITY}_{n/2}) = n/2$; and $\mathrm{sdeg} \le \deg = n$.'}
    - {measure: adeg,  value: '\Theta(n)', note: 'Between $\mathrm{sdeg} = \Omega(n)$ and $\deg = n$.'}
    - {measure: spar,  value: '2^n', note: 'Bent: no Fourier coefficient vanishes. This is the maximum possible, and with [[PARITY]] (where $\mathrm{spar} = 1$) it brackets the range.'}
    - {measure: L1,    value: '2^{n/2}', note: '$2^n$ coefficients of magnitude $2^{-n/2}$ each. Bent functions maximise $\mathrm{L}_1$ among all Boolean functions, so this is the extreme point of $\mathrm{L}_1 \le 2^{n/2}$.'}
    - {measure: Fdim,  value: 'n', note: 'The support is all of $\mathbb{F}_2^n$, so its span is everything.'}
    - {measure: Inf,   value: 'n/2', note: '$\mathrm{I}(f) = \sum_S |S|\hat f(S)^2 = 2^{-n}\sum_{S}|S| = 2^{-n}\cdot n2^{n-1}$.'}
    - {measure: MaxInf, value: '1/2', note: 'Every coordinate has $\mathrm{Inf}_i = \sum_{S \ni i}\hat f(S)^2 = 2^{-n}2^{n-1} = 1/2$; the spectrum is flat, so no coordinate is special.'}
    - {measure: Stab,  value: '\big(\tfrac{1+\rho}{2}\big)^{n}', note: '$\mathrm{Stab}_\rho = \sum_S \rho^{|S|}\hat f(S)^2 = 2^{-n}\sum_S \rho^{|S|} = 2^{-n}(1+\rho)^n$. Exponentially unstable: at any fixed $\rho < 1$ the correlation dies at a constant rate per bit.'}
    - {measure: NS,    value: '\tfrac12\big(1 - (1-\delta)^{n}\big)', note: 'Substituting $\rho = 1-2\delta$ into $\mathrm{Stab}$ above. So $\mathrm{NS}_\delta \to 1/2$ once $\delta \gg 1/n$ -- IP is as noise-sensitive as a random function.'}
    - {measure: PDT,   value: '\ge n/2 + 1', refs: [ChistopolskayaPodolskii18], note: 'The granularity of IP is exactly $2^{-n/2}$, so [ChistopolskayaPodolskii18] gives $\mathrm{D}^{\oplus} \ge n/2 + 1$. Upper bound: the trivial $n$. The factor $2$ is open as far as I know -- note $\mathrm{D}^{\oplus} \ge n/2$ also follows from bentness, since an affine subspace on which a bent function is constant has dimension at most $n/2$.'}
    - {measure: RC, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{RC}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: FC, value: 'n', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{FC}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: R0, value: 'n', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: CA, value: '\Theta(n)', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = n$ here.'}
    - {measure: CGpub, value: '\Theta(n)', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs}(f) = n$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Q0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{Q}_{\varepsilon}(f) \le \mathrm{Q}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{Q}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: Advpm, value: '\Theta(n)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n)$ here.'}
    - {measure: gamma2, value: '\Theta(n)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n)$ here.'}
    - {measure: odeg, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{sdeg}(f) \le \widetilde{\deg}_{+}(f) \le \mathrm{D}(f)$, with $\mathrm{sdeg}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: chi, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \chi(g) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: chibar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\chi}(g) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: LR, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: Rstar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: CG, value: '\Theta(n^2)', putative: true, refs: [CGLMSG23], note: 'Sandwiched: $\mathrm{Adv}(f)^2 \le \mathrm{CG}(f) \le \mathrm{C}^0(f)\,\mathrm{C}^1(f)$ [CGLMSG23], with $\mathrm{Adv} = \Theta(n)$ and $\mathrm{C}^0\mathrm{C}^1 = \Theta(n^2)$ here. Note that this is *above* the arity: the private-coin game is the one certificate-game variant that is not bounded by $\mathrm{D}$. Inner product behaves exactly like [[PARITY]] here, and for the same reason -- distance-$1$ pairs force both players to guess the same index out of $\Theta(n)$ candidates independently.'}
    - {measure: MAdv, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{Q}_{\varepsilon}(f) \le \mathrm{MAdv}(f) \le \mathrm{D}(f)$, with $\mathrm{Q}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: cjdeg, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{sdeg}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{sdeg}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: degp, value: '2 \text{ for } p = 2;\ n \text{ for } p > 2', note: 'Over $\mathbb{F}_2$ the inner product literally *is* $\sum_{i} x_i y_i$, a quadratic form -- degree $2$ on $n = 2m$ variables. Over any other field the representation is $\tfrac12\big(1 - \prod_i (1 - 2x_iy_i)\big)$ and the degree is $n$. Together with $\deg = n$, $\mathrm{s} = n$ and $\mathrm{D} = n$, this makes IP the standard example that $\deg_2$ carries no information about query complexity.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: lambda, value: 'n/\sqrt2', note: 'Write $\mathrm{IP}_n = \mathrm{PARITY}_{m} \circ \mathrm{AND}_2$ with $m = n/2$ and use exact multiplicativity of $\lambda$ [ABKRT21]: $\lambda = m \cdot \sqrt 2 = n/\sqrt2$. Consistent with $\sqrt{\mathrm{s}} \le \lambda \le \mathrm{s}$ at $\mathrm{s} = n$, and with $\mathrm{Q} = \Theta(n) = \Omega(\lambda)$; like [[PARITY]] and unlike [[AND]], the inner product sits at the *top* of that range.'}
    - {measure: Cmin, value: 'n/2', putative: true, note: 'A certificate must kill every term $x_iy_i$: for each $i$ it must fix $x_i=0$, or $y_i=0$, or *both* $x_i=y_i=1$. So $\mathrm{C}(x,y) = m + |x \wedge y|$ exactly. The minimum is $m = n/2$, attained at every input with $x \wedge y = 0$ (e.g. $x = 0^m$), and the maximum is $2m = n$ at $x=y=1^m$ -- which is where the recorded $\mathrm{C} = n$ comes from.'}
    - {measure: C0, value: '\Theta(n)', putative: true, note: 'From $\mathrm{C}(x,y) = m + |x\wedge y|$: the top value $n$ needs $x = y = 1^m$, which has $\mathrm{IP} = m \bmod 2$, and the best the other side can do is $|x\wedge y| = m-1$. So $\{\mathrm{C}^0, \mathrm{C}^1\} = \{n,\, n-1\}$, in an order set by the parity of $m$.'}
    - {measure: C1, value: '\Theta(n)', putative: true, note: 'See $\mathrm{C}^0$: the pair is $\{n, n-1\}$ and which side gets which depends only on the parity of $m$.'}
    - {measure: s0, value: '\Theta(n)', putative: true, note: 'From $\mathrm{s}(x,y) = |x|+|y|$: the maximum $n$ is only at $x=y=1^m$ (value $m \bmod 2$) and the other side tops out at $n-1$. So $\{\mathrm{s}^0,\mathrm{s}^1\} = \{n, n-1\}$.'}
    - {measure: s1, value: '\Theta(n)', putative: true, note: 'See $\mathrm{s}^0$.'}
    - {measure: bs0, value: '\Theta(n)', note: 'Between $\mathrm{s}^0 = \Theta(n)$ and $\mathrm{bs} = n$.'}
    - {measure: bs1, value: '\Theta(n)', note: 'Between $\mathrm{s}^1 = \Theta(n)$ and $\mathrm{bs} = n$.'}
    - {measure: UC, value: 'n', putative: true, note: 'The natural decision tree -- for each $i$ read $x_i$, and read $y_i$ only if $x_i=1$ -- is a subcube *partition*, hence an unambiguous certificate family, of width $\max_x (m + |x\wedge y|) = n$. And $\mathrm{UC} \ge \mathrm{C} = n$.'}
    - {measure: UCmin, value: 'n/2', putative: true, note: 'That same partition gives the input $x = 0^m$ a certificate of size $m$, and no certificate anywhere is smaller than $\mathrm{C}_{\min} = m$.'}
    - {measure: SP, value: 'n', note: 'A width-$w$ subcube partition is in particular an unambiguous family, so $\mathrm{UC} \le \mathrm{SP} \le \mathrm{D}$, and both ends are $n$ here.'}
    - {measure: EC, value: 'n', note: 'Between $\mathrm{fbs} = n$ and $\mathrm{C} = n$.'}
    - {measure: rank, value: 'n/2', putative: true, note: 'Upper: in the natural tree, the node handling index $i$ has one child of rank $r$ (the branch $x_i=0$) and one of rank $r+1$ (the branch $x_i=1$, which then splits on $y_i$), so the rank grows by exactly $1$ per index: $m = n/2$. Lower: a Delayer who defers on every query survives at least $\mathrm{C}_{\min}$ rounds, so $\mathrm{rank}(f) \ge \mathrm{C}_{\min}(f) = m$. A clean factor-$2$ gap below $\mathrm{D} = n$: half of IP''s depth is caterpillar.'}
    - {measure: Dna, value: 'n', note: 'Every variable is relevant, so non-adaptively you read all of them.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Between $\mathrm{R} = \Theta(n)$ and $n$.'}
    - {measure: cbs, value: 'n', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}$ degenerates to $\mathrm{bs}$ ([[cbs]] vs [[bs]]); here $\mathrm{bs} = n$.'}
    - {measure: psD, value: '\Theta(n)', note: 'For a Boolean function the canonical answer is forced, so $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ ([[psD]] vs [[R]]); here $\mathrm{R} = \Theta(n)$.'}
    - {measure: Dmu, value: '\Theta(n)', refs: [Yao77], note: 'Worst case over $\mu$: Yao''s minimax gives $\max_\mu \mathrm{D}^{\mu}_{\varepsilon}(f) = \mathrm{R}_{\varepsilon}(f) = \Theta(n)$.'}
    - {measure: D_prod, value: '\Theta(n)', putative: true, note: 'The *uniform* distribution is already hard, and it is a product distribution. A depth-$d$ tree leaves at least $m-d$ index pairs $(x_i,y_i)$ entirely free, and conditioned on any leaf the value is the XOR of that many independent $\mathrm{Bernoulli}(1/4)$ terms, whose bias is $2^{-(m-d)}$; error $\le 1/3$ therefore forces $d \ge m-1 = n/2 - 1$. Upper: $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R} = \Theta(n)$.'}
    - {measure: RS, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)/(1-2\varepsilon)$, and $\mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(n)$ meets $\mathrm{R} = \Theta(n)$.'}
    - {measure: QC, value: '\Theta(\sqrt n)', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{RC}(f)}) = \Theta(\sqrt{\mathrm{fbs}(f)})$ for every $f$ [Aaronson08], and $\mathrm{fbs} = n$ here. So quantum certificate complexity is a full square root below $\mathrm{Q} = \Theta(n)$: verification is cheap even though computation is not.'}
    - {measure: Np, value: '\Theta(n\log n)', refs: [GLX26noisy, FRPU94], note: 'Pinned from both sides. Lower: $\mathrm{N}_p(f) = \Omega(\mathrm{I}(f)\log \mathrm{I}(f))$ [GLX26noisy] with $\mathrm{I} = n/2$. Upper: $\mathrm{N}_p(f) = O(\mathrm{R}(f)\log \mathrm{R}(f))$ with $\mathrm{R} = \Theta(n)$. IP therefore pays the same $\log$ tax as [[PARITY]], and for the same reason -- its influence is maximal.'}
    - {measure: robustQ, value: '\Theta(n)', refs: [BNRdW05], note: 'Lower: $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(n)$. Upper: $n$ noisy quantum queries recover all $n$ input bits with high probability [BNRdW05], so no function on $n$ bits costs more. Unlike the classical $\mathrm{N}_p = \Theta(n\log n)$ above, there is no $\log$ -- the same quantum-vs-classical noise gap as for [[PARITY]].'}
    - {measure: Adv, value: '\Theta(n)', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}(f))$, with $\lambda = n/\sqrt2$ and $\mathrm{Q} = \Theta(n)$. Comfortably below the certificate barrier $\sqrt{\mathrm{C}^0\mathrm{C}^1} = \Theta(n)$, which is also $\Theta(n)$ here.'}
    - {measure: ardeg, value: '\Theta(n)', putative: true, note: 'Lower: a rational $1/3$-approximation $p/q$ makes $(p - q/2)\,q$ a sign-representing polynomial of degree $\le 2\,\mathrm{rdeg}_{\varepsilon}$, so $\mathrm{rdeg}_{\varepsilon}(f) \ge \mathrm{sdeg}(f)/2 = \Omega(n)$. Upper: $\mathrm{rdeg}_{\varepsilon} \le \widetilde{\deg} = \Theta(n)$. Post-selection buys nothing on the bent function.'}
    - {measure: PostQ, value: '\Theta(n)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_{\varepsilon}(f) = \Theta(\mathrm{rdeg}_{\varepsilon}(f))$ [MahadevdeWolf15], and the approximate rational degree is $\Theta(n)$ here.'}
    - {measure: rdeg, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{rdeg}_{\varepsilon}(f) \le \mathrm{rdeg}(f) \le \mathrm{C}(f)$, with $\mathrm{rdeg}_{\varepsilon} = \Theta(n)$ and $\mathrm{C} = n$. So IP is one of the functions on which Fortnow''s question -- is $\mathrm{rdeg} = \deg^{\Omega(1)}$? -- has the most boring possible answer.'}
    - {measure: Inf1, value: 'n/2', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide term by term, so $\mathrm{I}^{1}(f) = \mathrm{I}(f) = n/2$.'}
    - {measure: ndeg, value: '\Theta(n)', putative: true, note: 'Upper: $p = 1 - \prod_{i}(1-2x_iy_i) = 1-(-1)^{x\cdot y}$ is nonzero exactly on $\mathrm{IP}^{-1}(1)$, degree $n$. Lower: any nondeterministic polynomial $p$ gives a sign-representing one -- $q(x) := \delta - p(x)^2$ is $>0$ on $f^{-1}(0)$ and $<0$ on $f^{-1}(1)$ for any $\delta$ below the least positive value of $p^2$ -- so $\mathrm{sdeg}(f) \le 2\,\mathrm{ndeg}(f)$ always, and $\mathrm{sdeg} = \Theta(n)$ here. Bentness leaves no room for a nondeterministic shortcut.'}
    - {measure: NQ, value: '\Theta(n)', refs: [deWolf03], note: '$\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$ ([[NQ]] vs [[ndeg]]), and $\mathrm{ndeg} = \Theta(n)$ here. Nondeterminism buys at most a factor $2$ on the bent function -- contrast [[MinskyPapert]], where $\mathrm{NQ} = \Theta(N^{1/3})$ against $\mathrm{Q} = \Theta(\sqrt N)$.'}
    - {measure: D_size, value: '2^{\Theta(n)}', putative: true, note: 'Upper: the natural tree has three continuations per index ($x_i=0$; $x_i=1,y_i=0$; $x_i=1,y_i=1$), so $3^{m} = 3^{n/2}$ leaves. Lower: every leaf-subcube is monochromatic, hence of codimension $\ge \mathrm{C}_{\min} = n/2$, so there are at least $2^{n/2}$ of them.'}
  witnesses:
    - {of: [deg, deg2], setting: total, statement: 'The extreme case: $\deg = n$ against $\deg_2 = 2$. Real degree and $\mathbb{F}_2$-degree are unrelated in this direction.'}
    - {of: [L1, spar], setting: total, statement: 'Both at their maxima simultaneously: $\mathrm{spar} = 2^n$ and $\mathrm{L}_1 = 2^{n/2} = \sqrt{\mathrm{spar}}$, which is the equality case of $\mathrm{L}_1 \le \sqrt{\mathrm{spar}}$.'}
  notes: |
    **Why bent is the extreme.** Parseval gives $\sum_S \hat f(S)^2 = 1$, so by
    Cauchy-Schwarz $\mathrm{L}_1(f) = \sum_S|\hat f(S)| \le \sqrt{\mathrm{spar}(f)}
    \le 2^{n/2}$, with equality exactly when the spectrum is flat and full -- the
    definition of a bent function. Bent functions exist only for even $n$.

    **As a lifting gadget.** $\mathrm{IP}_b$ with $b = O(\log n)$ is the gadget in
    the deterministic and randomized lifting theorems; the relevant parameter there
    is the *discrepancy* $2^{-b/2}$, again a restatement of bentness.
  refs: [ChistopolskayaPodolskii18, ODonnell14]
  see_also: [PARITY, MAJ, spar, L1, Fdim, deg2, PDT]

- id: MinskyPapert
  name: Minsky-Papert one-in-a-box
  symbol: '\mathrm{MP}_m'
  aliases: ['one-in-a-box', 'AND_m o OR_{m^2}', 'the unbalanced AND-OR tree']
  group: composed
  order: 27.5
  kind: total
  arity: '$N = m^3$ bits: $m$ blocks of $m^2$'
  scale: {var: m, subs: {N: 'm^3'}}
  short: 'The unbalanced AND-OR tree, tuned so that Minsky-Papert''s $\min\{m,\sqrt b\}$ is maximised: $\mathrm{sdeg} = \Theta(N^{1/3})$.'
  definition: |
    $\mathrm{MP}_m = \mathrm{AND}_m \circ \mathrm{OR}_{m^2}$: split $N = m^3$ bits
    into $m$ boxes of $m^2$, and accept iff every box contains a $1$.

    This is *not* the balanced [[ANDOR]]. The shape matters: Minsky and Papert's
    theorem is $\mathrm{sdeg}(\mathrm{AND}_m\circ\mathrm{OR}_b) =
    \Omega(\min\{m,\sqrt b\})$, and $b = m^2$ is the choice that makes both terms
    equal. Quoting $\Theta(N^{1/3})$ for the balanced tree is a common slip.
  formal: '$$\mathrm{MP}_m(x) = \bigwedge_{j=1}^{m}\ \bigvee_{i=1}^{m^2} x^j_i, \qquad N = m^3.$$'
  values:
    - {measure: sdeg, value: '\Theta(m) = \Theta(N^{1/3})', refs: [MinskyPapert69], note: 'The original theorem, and the first threshold-degree lower bound ever proved: no polynomial of degree $o(m)$ sign-represents $\mathrm{MP}_m$. Upper bound $O(m)$: the symmetrisation argument is tight here.'}
    - {measure: D,    value: 'N = m^3', note: 'Read-once AND-OR formulas are evasive.'}
    - {measure: deg,  value: 'N = m^3', note: 'Degree is multiplicative for block composition, and $\deg(\mathrm{AND}_m)\deg(\mathrm{OR}_{m^2}) = m\cdot m^2$.'}
    - {measure: noisyR, value: '\Theta(m^3) = \Theta(N)', refs: [CKMPSS23], note: 'The zoo''s own [[noisyR]] vs [[R]] entry records $\mathrm{R}(f)=\Theta(n)\Rightarrow\mathrm{noisyR}(f)=\Theta(\mathrm{R}(f))$ [CKMPSS23], and the recorded $\mathrm{R}$ is linear in the arity here -- the AND-OR tree is evasive even for randomised algorithms.'}
    - {measure: R,    value: '\Theta(m^3) = \Theta(N)', refs: [SaksWigderson86, Snir85], note: 'Randomised evaluation of a depth-two AND-OR tree with fan-ins $m$ and $m^2$ costs $\Theta(m\cdot m^2)$.'}
    - {measure: adeg, value: '\Theta(m^{3/2}) = \Theta(\sqrt N)', note: 'The same $\Theta(\sqrt{mb})$ that gives [[ANDOR]] its $\Theta(\sqrt N)$; here $\sqrt{m\cdot m^2} = m^{3/2}$.'}
    - {measure: Q,    value: '\Theta(m^{3/2}) = \Theta(\sqrt N)', refs: [HoyerMoscadeWolf03], note: 'Robust quantum search on the two levels; matches $\widetilde{\deg}/2$.'}
    - {measure: s,    value: 'm^2 = N^{2/3}', note: 'One-sided. At a $1$-input only a box''s unique $1$ is sensitive, so $\mathrm{s}^1 = m$; at a $0$-input with exactly one empty box, every one of that box''s $m^2$ bits is sensitive, so $\mathrm{s}^0 = m^2$.'}
    - {measure: s1,   value: 'm', note: 'As above.'}
    - {measure: s0,   value: 'm^2', note: 'As above.'}
    - {measure: Advpm, value: '\Theta(m^{3/2}) = \Theta(\sqrt N)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(m^{3/2}) = \Theta(\sqrt N)$ here.'}
    - {measure: gamma2, value: '\Theta(m^{3/2}) = \Theta(\sqrt N)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(m^{3/2}) = \Theta(\sqrt N)$ here.'}
    - {measure: Rbar, value: '\Theta(m^3) = \Theta(N)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(m^3) = \Theta(N)$ here.'}
    - {measure: MAdv, value: '\Theta(m^{3/2}) = \Theta(\sqrt N)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(m^{3/2}) = \Theta(\sqrt N)$ here.'}
    - {measure: QE, value: 'N = m^3', note: 'Sandwiched exactly: $\deg(f) \le \mathrm{Q}_{\mathrm{E}}(f) \le \mathrm{D}(f)$, and both ends are $N = m^3$ here. Exact quantum computation buys nothing on a read-once AND-OR formula, while bounded error buys the full quadratic $\Theta(\sqrt N)$.'}
    - {measure: C1, value: 'm', note: 'A $1$-certificate names one $1$ in each of the $m$ boxes.'}
    - {measure: C0, value: 'm^2 = N^{2/3}', note: 'A $0$-certificate must exhibit an entirely empty box, and a box has $m^2$ bits. This is the asymmetry the whole function is built on.'}
    - {measure: C, value: 'm^2 = N^{2/3}', note: '$\max\{\mathrm{C}^0,\mathrm{C}^1\}$.'}
    - {measure: bs1, value: 'm', note: 'At a $1$-input with exactly one $1$ per box, the $m$ singleton blocks are minimal and disjoint.'}
    - {measure: bs0, value: 'm^2 = N^{2/3}', note: 'At a $0$-input with exactly one empty box, flipping any single bit of that box already makes the function $1$: $m^2$ disjoint singleton blocks.'}
    - {measure: bs, value: 'm^2 = N^{2/3}', note: 'From $\mathrm{bs}^0$. Together with $\mathrm{D} = N = m^3$ this is a cube-root gap, the largest a read-once formula allows.'}
    - {measure: fbs, value: '\Theta(m^2) = \Theta(N^{2/3})', note: 'Squeezed between $\mathrm{bs} = m^2$ and $\mathrm{C} = m^2$.'}
    - {measure: RC, value: '\Theta(m^2) = \Theta(N^{2/3})', note: '$\mathrm{RC} = \Theta(\mathrm{fbs})$.'}
    - {measure: R0, value: '\Theta(m^3) = \Theta(N)', note: 'Squeezed between $\mathrm{R} = \Theta(N)$ and $\mathrm{D} = N$.'}
    - {measure: lambda, value: 'm^{3/2} = \sqrt N', note: '$\lambda$ is exactly multiplicative under block composition [ABKRT21], so $\lambda(\mathrm{AND}_m \circ \mathrm{OR}_{m^2}) = \sqrt m \cdot \sqrt{m^2} = m^{3/2}$. This matches $\mathrm{Q} = \Theta(\sqrt N)$ up to a constant -- spectral sensitivity is tight here, while it is a $\sqrt{\ }$-factor loose against $\mathrm{s} = m^2$.'}
    - {measure: Cmin, value: 'm = N^{1/3}', putative: true, note: 'Every $1$-input costs exactly $m$ (one witness per box) and every $0$-input costs exactly $m^2$ (a whole empty box), so the minimum is the $1$-side: $\mathrm{C}_{\min} = m$ against $\mathrm{C} = m^2$.'}
    - {measure: Dna, value: 'N = m^3', note: 'Every variable is relevant.'}
    - {measure: Rna, value: '\Theta(m^3) = \Theta(N)', note: 'Between $\mathrm{R} = \Theta(N)$ and $\mathrm{D}^{\mathrm{na}} = N$.'}
    - {measure: deg2, value: 'N = m^3', putative: true, note: 'As for any read-once AND-OR formula: over $\mathbb{F}_2$, $\bigvee_i x_i = 1 + \prod_i(1+x_i)$ contributes the full monomial of its box with coefficient $1$, and the outer AND multiplies the boxes.'}
    - {measure: SP, value: 'N = m^3', putative: true, note: 'A partition of the cube into monochromatic subcubes writes $f$ as a sum of indicators of conjunctions of $\le \mathrm{SP}$ literals with no cancellation, so $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$; here $\deg = \mathrm{D} = N$, so the chain collapses. Read-once formulas are always pinned this way.'}
    - {measure: UC, value: 'N = m^3', putative: true, note: 'Pinned by the same $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$ collapse; see [[SP]]. A second, self-contained proof: $|f^{-1}(1)| = (2^{m^2}-1)^m$ is *odd*, and an unambiguous $1$-certificate family partitions $f^{-1}(1)$ into subcubes of sizes that are powers of two, so one of them must be a single point -- a certificate of full width $N$. Against $\mathrm{C} = m^2$ this is a $\mathrm{UC}$-vs-$\mathrm{C}$ gap of $N^{1/3}$.'}
    - {measure: EC, value: '\Theta(m^2) = \Theta(N^{2/3})', note: 'Squeezed between $\mathrm{fbs} = \Theta(m^2)$ and $\mathrm{C} = m^2$.'}
    - {measure: rank, value: 'm = N^{1/3}', putative: true, note: 'Upper: read the boxes in order, and inside a box read bits until a $1$ appears. A box subtree is a caterpillar, of rank $1$, and grafting a rank-$r$ tree onto the leaves of a rank-$1$ tree gives rank $\le r+1$, so the rank climbs by exactly one per box. Lower: a Delayer who always defers survives $\mathrm{C}_{\min} = m$ rounds. So $\mathrm{rank} = m$ against $\mathrm{D} = m^3$ -- almost all of the depth is caterpillar, and it lives inside the boxes.'}
    - {measure: D_size, value: '\Theta(m^{2m})', putative: true, note: 'The tree above has $L_k = m^2 L_{k-1} + 1$ leaves after $k$ boxes, i.e. $\sum_{j=0}^{m} m^{2j}$ leaves. Matching lower bound: the $m^{2m}$ inputs with exactly one $1$ per box reach pairwise distinct leaves, since a monochromatic-$1$ subcube containing two of them would leave both witnesses of some box free and hence contain an input with that box empty. So $m^{2m} \le \mathrm{D}_{\mathrm{size}} < m^{2m}(1 + 2m^{-2})$. Verified by exhaustive search at $(m,\,\text{box size}) = (2,4)$, where both sides give $21$.'}
    - {measure: cbs, value: 'm^2 = N^{2/3}', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}$ degenerates to $\mathrm{bs}$ ([[cbs]] vs [[bs]]); here $\mathrm{bs} = m^2$.'}
    - {measure: psD, value: '\Theta(m^3) = \Theta(N)', note: 'For a Boolean function the canonical answer is forced, so $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ ([[psD]] vs [[R]]); here $\mathrm{R} = \Theta(N)$.'}
    - {measure: Dmu, value: '\Theta(m^3) = \Theta(N)', refs: [Yao77], note: 'Worst case over $\mu$: Yao''s minimax gives $\max_\mu \mathrm{D}^{\mu}_{\varepsilon}(f) = \mathrm{R}_{\varepsilon}(f) = \Theta(N)$.'}
    - {measure: FC, value: '\Theta(m^2) = \Theta(N^{2/3})', note: '$\mathrm{FC} = \mathrm{fbs}$ exactly, by LP duality, and $\mathrm{fbs} = \Theta(m^2)$ here.'}
    - {measure: R1, value: '\Theta(m^3) = \Theta(N)', note: 'Sandwiched: $\mathrm{R}(f) \le \mathrm{R}^{1}(f) \le \mathrm{R}_{0}(f)$, with both ends $\Theta(m^3) = \Theta(N)$ here.'}
    - {measure: RS, value: '\Theta(m^3) = \Theta(N)', refs: [BenDavidKothari18], note: 'Lower: sabotage complexity composes perfectly, $\mathrm{RS}(f\circ g) \ge \mathrm{RS}(f)\mathrm{RS}(g)$ [BenDavidKothari18], and a sabotaged $\mathrm{AND}_k$ or $\mathrm{OR}_k$ with a single $\ast$ needs $\Theta(k)$ queries to locate it, so $\mathrm{RS} \ge \mathrm{RS}(\mathrm{AND}_m)\mathrm{RS}(\mathrm{OR}_{m^2}) = \Omega(m^3)$. Upper: $\mathrm{RS} \le \mathrm{R}/(1-2\varepsilon) = O(m^3)$. Note this is a full $\mathrm{N}^{1/3}$ above $\mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(m^2)$.'}
    - {measure: chibar, value: '\Theta(m^3) = \Theta(N)', note: 'Sandwiched: $\bar\chi(g) = \Omega(\mathrm{RS}(g))$ and $\bar\chi \le \mathrm{LR} \le \mathrm{R}$, with $\mathrm{RS} = \Theta(m^3) = \mathrm{R}$ here.'}
    - {measure: LR, value: '\Theta(m^3) = \Theta(N)', note: 'Sandwiched between $\bar\chi = \Theta(m^3)$ and $\mathrm{R} = \Theta(m^3)$. The inner composition measure loses nothing on a read-once AND-OR tree.'}
    - {measure: Rstar, value: '\Theta(m^3) = \Theta(N)', note: 'Sandwiched: $\mathrm{R}^{*}(f) = \Omega(\mathrm{LR}(f))$ and $\mathrm{R}^{*}(f) \le \mathrm{R}(f)$, with both ends $\Theta(m^3)$ here. So iterating $\mathrm{MP}$ costs the full $\mathrm{R}$ per level.'}
    - {measure: CA, value: '\Theta(m^2) = \Theta(N^{2/3})', refs: [ABIKPS17], note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for total $f$ [ABIKPS17], and $\mathrm{fbs} = \Theta(m^2)$ here. A cube-root below $\mathrm{R} = \Theta(N)$: the classical adversary is far from tight on the one-in-a-box function.'}
    - {measure: CGpub, value: '\Theta(m^2) = \Theta(N^{2/3})', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{CA}(f))$ for every $f$ [CGLMSG23], and $\mathrm{CA} = \Theta(m^2)$ here.'}
    - {measure: CGstar, value: '\Theta(m^2) = \Theta(N^{2/3})', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]).'}
    - {measure: CGns, value: '\Theta(m^2) = \Theta(N^{2/3})', refs: [CGLMSG23], note: 'The same non-signaling collapse; see [[CGstar]].'}
    - {measure: CG, value: '\Theta(m^3) = \Theta(N)', refs: [CGLMSG23], note: 'Pinned by the total-function sandwich $\max\{\mathrm{Adv}^2,\mathrm{R}_0,\mathrm{CA}\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ [CGLMSG23]: the bottom is $\mathrm{Adv}^2 = \Theta(m^3)$ (equally $\mathrm{R}_0 = \Theta(m^3)$) and the top is $\mathrm{C}^0\mathrm{C}^1 = m^2\cdot m = m^3$. So the private-coin game costs the full $\mathrm{D}$ here, a whole $N^{1/3}$ above the public-coin value $\Theta(m^2)$ -- the largest separation between the two variants that the $\mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ ceiling permits on this function.'}
    - {measure: UCmin, value: 'N = m^3', putative: true, note: 'The parity argument recorded for [[UC]] works on *both* sides, so the one-sided relaxation buys nothing. $|f^{-1}(1)| = (2^{m^2}-1)^m$ is odd, and $|f^{-1}(0)| = 2^{N} - (2^{m^2}-1)^m$ is even minus odd, hence also odd. An unambiguous $b$-certificate family partitions $f^{-1}(b)$ into subcubes of sizes $2^{N-w_i}$; an odd total forces some $w_i = N$. So $\mathrm{UC}^0 = \mathrm{UC}^1 = N$ and $\mathrm{UC}_{\min} = N = m^3$, against $\mathrm{C} = m^2$. This is an extreme point of $\mathrm{C} \ge \mathrm{UC}_{\min}^{1.22}$-type separations in the opposite direction: here $\mathrm{UC}_{\min}$ is as far *above* $\mathrm{C}$ as $\mathrm{D} \le \mathrm{UC}_{\min}^2$ allows it to be useful at all.'}
    - {measure: odeg, value: '\Theta(m) = \Theta(N^{1/3})', putative: true, note: 'A full $\sqrt m$ below $\widetilde{\deg} = \Theta(m^{3/2})$: dropping the upper constraint on the $1$-inputs is worth a quadratic saving here. Upper: $p(x) = \prod_{j=1}^{m}\big(\sum_{i} x^j_i\big)$ has degree $m$, vanishes whenever some box is empty, and is $\ge 1$ when every box has a $1$ -- exactly a one-sided approximation. Lower: $\mathrm{sdeg}(f) \le \widetilde{\deg}_+(f)$ ([[sdeg]] vs [[odeg]]) and $\mathrm{sdeg} = \Theta(m)$ by [MinskyPapert69]. Note this makes $\mathrm{MP}$ a clean witness that one-sided approximate degree is *not* $\Theta(\widetilde{\deg})$; compare [[AND]], where the two coincide.', refs: [MinskyPapert69]}
    - {measure: D_prod, value: '\Theta(m^3) = \Theta(N)', refs: [Snir85, SaksWigderson86], conf: medium, note: 'Product distributions are already worst-case for read-once AND-OR trees. The classical $\Omega(mb)$ lower bound for $\mathrm{AND}_m\circ\mathrm{OR}_b$ [Snir85, SaksWigderson86] is proved against an explicit *product* distribution -- each leaf independently $1$ with the probability that makes every gate output $1$ with a fixed constant -- so it is already a $\mathrm{D}^{\mathrm{prod}}$ bound, giving $\Omega(m^3)$. Upper: $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R} = \Theta(m^3)$. Medium confidence because it is a reading of how those proofs go rather than a statement either paper makes about product distributions. Consistent with $\mathrm{D}^{\mathrm{prod}} = \tilde O(\mathrm{RS})$ and $\mathrm{RS} = \Theta(m^3)$ here.'}
    - {measure: prt, value: '\Omega(m^2),\ O(m^3)', note: 'Sandwiched, and the sandwich is loose. Lower: $\mathrm{RC} \le \mathrm{prt}_{\varepsilon}$ ([[RC]] vs [[prt]]) with $\mathrm{RC} = \Theta(m^2)$; the $\widetilde{\deg} \le \mathrm{prt}$ route is weaker here, $\Omega(m^{3/2})$. Upper: $\mathrm{prt}_{\varepsilon} \le \mathrm{R} = \Theta(m^3)$. Whether the partition bound is tight for $\mathrm{R}$ is open in general, and the AND-OR tree is exactly the shape where nobody has closed it.'}
    - {measure: rprt, value: '\Omega(m^2),\ O(m^3)', note: 'The same window as [[prt]], and it cannot be narrower: $\mathrm{RC} \le \overline{\mathrm{prt}}_{\varepsilon} \le \mathrm{prt}_{\varepsilon} \le \mathrm{R}$, with $\mathrm{RC} = \Theta(m^2)$ and $\mathrm{R} = \Theta(m^3)$.'}
    - {measure: chi, value: '\Omega(m^2),\ O(m^3)', note: 'Sandwiched: $\chi(g) = \Omega(\mathrm{bs}(g))$ ([[chi]] vs [[bs]]) gives $\Omega(m^2)$ -- the $\mathrm{R} = O(\chi^2)$ route only gives $\Omega(m^{3/2})$ -- and $\chi \le \bar\chi = \Theta(m^3)$ ([[chi]] vs [[chibar]]). The gap here is exactly the gap between $\mathrm{bs}$ and $\mathrm{R}$ on a read-once AND-OR tree, which is why $\mathrm{MP}$ is a natural test case for whether conflict complexity is $\Theta(\bar\chi)$.'}
    - {measure: cjdeg, value: '\Omega(m^{3/2}),\ O(m^3)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)$ ([[adeg]] vs [[cjdeg]], [[cjdeg]] vs [[R]]), with $\widetilde{\deg} = \Theta(m^{3/2})$ and $\mathrm{R} = \Theta(m^3)$. On the balanced [[NANDtree]] the upper end is known to be attained; here it is open which end is the truth.'}
    - {measure: ardeg, value: '\Omega(m),\ O(m^{3/2})', note: 'Lower: a rational $1/3$-approximation $p/q$ makes $(p - q/2)\,q$ a sign-representing polynomial of degree $\le 2\,\mathrm{rdeg}_{\varepsilon}$, so $\mathrm{rdeg}_{\varepsilon}(f) \ge \mathrm{sdeg}(f)/2 = \Omega(m)$ by [MinskyPapert69]. Upper: $\mathrm{rdeg}_{\varepsilon} \le \widetilde{\deg} = O(m^{3/2})$. Rational approximation famously does *not* compose -- the outer rational function is evaluated at perturbed inputs where its denominator can vanish -- so the $O(\log)$ rational approximations of the individual $\mathrm{AND}$ and $\mathrm{OR}$ gates give nothing for the tree.', refs: [MinskyPapert69]}
    - {measure: PostQ, value: '\Omega(m),\ O(m^{3/2})', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_{\varepsilon}(f) = \Theta(\mathrm{rdeg}_{\varepsilon}(f))$ [MahadevdeWolf15], and the approximate rational degree sits in $[\Omega(m), O(m^{3/2})]$ here; see [[ardeg]]. So it is open whether post-selection beats plain quantum on the one-in-a-box function, and the whole question is the constant-vs-$\sqrt m$ gap in that window.'}
    - {measure: QC, value: '\Theta(m) = \Theta(N^{1/3})', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ [Aaronson08], and $\mathrm{fbs} = \Theta(m^2)$ here. Curiously this coincides with $\mathrm{sdeg}$ and with $\mathrm{C}_{\min}$, all three at $N^{1/3}$.'}
    - {measure: Q0, value: '\Omega(m^2),\ O(m^3)', putative: true, refs: [BCWZ99], note: 'Lower: planting a $1$ in every box but one restricts $f$ to $\mathrm{OR}_{m^2}$, and zero-error quantum search has no speedup at all, $\mathrm{Q}_0(\mathrm{OR}_b) = b$ [BCWZ99]. Upper: $\mathrm{Q}_0 \le \mathrm{Q}_{\mathrm{E}} = N$. The gap is genuine -- the zoo does not know whether zero-error costs the full $\Theta(N)$ here, though $\mathrm{Q} = \Theta(N^{1/2})$ shows bounded error does not.'}
    - {measure: Inf, value: '\Theta(m^3/2^{m^2})', putative: true, note: 'A bit of box $j$ is sensitive exactly when the other $m^2-1$ bits of its box are $0$ and every other box contains a $1$, so $\mathrm{I}(f) = m\cdot m^2\cdot 2^{-(m^2-1)}(1-2^{-m^2})^{m-1}$. Almost all of the cube is a $0$-input with two or more empty boxes, where nothing is sensitive at all, so the average sensitivity is exponentially far below $\mathrm{s} = m^2$. Checked exactly at box size $4$ with $2$ boxes.'}
    - {measure: L1, value: '\Theta(2^m) = 2^{\Theta(N^{1/3})}', putative: true, note: 'Writing $f$ in the $\pm1$ encoding, $F = 1 - 2^{1-m}\prod_{j}(1 - G_j)$ with $G_j$ the $\pm1$ form of $\mathrm{OR}_{m^2}$; the boxes are disjoint so the norms multiply, giving exactly $\hat L_1(F) = |1 - 2(1-2^{-m^2})^m| + 2(2^m-1)(1-2^{-m^2})^m = (1+o(1))\,2^{m+1}$. Checked exactly at box size $4$ with $2$ boxes ($6.03125$).'}
    - {measure: PDT, value: 'N = m^3', note: 'Pinned exactly: a depth-$d$ parity decision tree computes a function of $d$ linear forms, so $\deg_2(f) \le \mathrm{D}^{\oplus}(f) \le \mathrm{D}(f)$, and $\deg_2 = \mathrm{D} = N$ here. Parity queries are useless on a read-once AND-OR formula.'}
    - {measure: Fdim, value: 'N = m^3', note: 'Between $\mathrm{D}^{\oplus} = N$ and the arity $N$, since $\mathrm{D}^{\oplus}(f) \le \dim_{\mathbb{F}_2}(f) \le n$.'}
    - {measure: spar, value: '2^{N} = 2^{m^3}', putative: true, note: 'Full: *no* Fourier coefficient vanishes. The boxes are disjoint, so $\hat f(S) = \prod_j \hat g_j(S_j)$ where $g_j$ is the box $\mathrm{OR}_{m^2}$, and every coefficient of $\mathrm{OR}_k$ is nonzero ($1-2^{-k}$ on the empty set, $-2^{-k}$ elsewhere). Together with $\mathrm{L}_1 = \Theta(2^{m})$ this puts MP at the *opposite* corner from [[SINK]]: maximal sparsity, tiny spectral norm.'}
    - {measure: Inf1, value: '\Theta(m^3 2^{-m^2})', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide term by term, so $\mathrm{I}^{1}(f) = \mathrm{I}(f)$.'}
    - {measure: MaxInf, value: '\Theta(2^{-m^2})', putative: true, note: 'All $N$ coordinates are equivalent under the symmetry group, so $\mathrm{MaxInf} = \mathrm{I}(f)/N = 2^{1-m^2}(1-2^{-m^2})^{m-1}$. Exponentially small, yet $\mathrm{D} = N$ -- MP is a stress test for OSSS-type bounds, which only give $\mathrm{D} \ge \mathrm{Var}/\mathrm{MaxInf}$ with $\mathrm{Var}$ itself exponentially small.'}
    - {measure: NS, value: '(2+o(1))\,m\,2^{-m^2}\big(1-(1-\delta)^{m^2}\big)', putative: true, note: 'Almost every input is a $1$-input; noise flips the answer essentially only by emptying the one box that was a singleton away from empty. Exactly, $\mathrm{NS}_\delta = \tfrac12(1-\mathrm{Stab}_{1-2\delta})$ with the $\mathrm{Stab}$ below. Consistency check: as $\delta \to 0$ this is $\delta\cdot 2m^3 2^{-m^2} = (1+o(1))\,\delta\,\mathrm{I}(f)$, matching $\mathrm{NS}_\delta \approx \delta\,\mathrm{I}$.'}
    - {measure: Stab, value: '1 - (4+o(1))\,m\,2^{-m^2}\big(1-(\tfrac{1+\rho}{2})^{m^2}\big)', putative: true, note: 'Exactly $1 - 4\mu + 4\nu^{m}$ with $\mu = (1-2^{-m^2})^{m}$ and $\nu = 1 - 2^{1-m^2} + (\tfrac{1+\rho}{4})^{m^2}$, since the boxes are independent and a $\rho$-correlated pair keeps a given box empty with probability $(\tfrac{1+\rho}{4})^{m^2}$. Checks: $\rho = 1$ gives $1$, and $\rho = 0$ gives $(1-2\mu)^2 = \mathbb{E}[F]^2$. Unlike [[IP]], MP is almost perfectly noise-stable, because it is almost constant.'}
    - {measure: ndeg, value: 'm = N^{1/3}', putative: true, note: 'Upper: $\mathrm{ndeg} \le \mathrm{C}^1 = m$. Lower: planting a $0$ in all but one bit of each box restricts MP to $\mathrm{AND}_m$, and a polynomial nonzero exactly at $1^m$ must be a multiple of $\prod_i x_i$, so $\mathrm{ndeg}(\mathrm{AND}_m) = m$; restrictions do not increase $\mathrm{ndeg}$.'}
    - {measure: NQ, value: '\lceil m/2 \rceil = \Theta(N^{1/3})', refs: [deWolf03], note: '$\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$ [deWolf03], and $\mathrm{ndeg} = m$ here.'}
    - {measure: rdeg, value: 'm^2 = N^{2/3}', putative: true, note: '$\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\}$. The complement side dominates: filling every other box with a $1$ restricts $\overline{\mathrm{MP}}$ to $\mathrm{NOR}_{m^2}$, whose nondeterministic degree is $m^2$ (a polynomial nonzero exactly at $0^{k}$ is a multiple of $\prod_i(1-x_i)$), and $\mathrm{ndeg}(\bar f) \le \mathrm{C}^0 = m^2$. So $\mathrm{rdeg} = m^2 = \mathrm{C}$, a cube root below $\deg = N$.'}
    - {measure: degp, value: 'N = m^3', putative: true, note: 'For *every* prime $p$. The multilinear representation has integer coefficients, and its top coefficient is $\prod_{j}\big(\!-(-1)^{m^2}\big) = \pm1$, which survives reduction mod any $p$. So unlike [[IP]] and [[CONN]], MP loses no degree over any finite field.'}
    - {measure: Adv, value: '\Theta(m^{3/2}) = \Theta(\sqrt N)', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}(f))$, with $\lambda = m^{3/2}$ and $\mathrm{Q} = \Theta(m^{3/2})$. The positive-weights adversary is tight here, and sits exactly at its certificate barrier $\sqrt{\mathrm{C}^0\mathrm{C}^1} = \sqrt{m^2\cdot m} = m^{3/2}$.'}
    - {measure: robustQ, value: '\Theta(m^{3/2}) = \Theta(\sqrt N)', conf: medium, refs: [HoyerMoscadeWolf03], note: 'Lower: $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(m^{3/2})$. Upper: the $O(\sqrt N)$ algorithm for a two-level AND-OR tree *is* robust quantum search [HoyerMoscadeWolf03] -- that is exactly the point of the technique -- so noise costs only a constant factor and no $\log$.'}
    - {measure: Np, value: '\Omega(m^3),\ O(m^3\log m)', note: 'Between $\mathrm{R} = \Theta(m^3)$ and $O(\mathrm{R}\log \mathrm{R})$. The influence-based lower bound $\mathrm{N}_p = \Omega(\mathrm{I}\log \mathrm{I})$ [GLX26noisy] is useless here, $\mathrm{I}$ being exponentially small, so the zoo does not know whether the $\log$ is needed -- in sharp contrast to [[IP]] and [[PARITY]].'}
  witnesses:
    - {of: [C, Cmin], setting: total, statement: 'Quadratic, on a read-once formula: $\mathrm{C} = m^2$ (exhibit an empty box) against $\mathrm{C}_{\min} = m$ (one witness per box). The same asymmetry drives $\mathrm{C}^0$ vs $\mathrm{C}^1$ and is what Minsky and Papert built the function around.'}
    - {of: [adeg, sdeg], setting: total, statement: 'A polynomial gap between approximate and threshold degree on a read-once formula: $\widetilde{\deg} = \Theta(N^{1/2})$ against $\mathrm{sdeg} = \Theta(N^{1/3})$.', refs: [MinskyPapert69]}
  notes: |
    Minsky and Papert introduced this function in *Perceptrons* (1969) to show that a
    perceptron over degree-$k$ monomials cannot compute it unless $k = \Omega(N^{1/3})$
    -- the first lower bound on threshold degree, and still the template for the
    dual-polynomial arguments used on [[Surjectivity]] and $\mathrm{AC}^0$.
  refs: [MinskyPapert69, SaksWigderson86, HoyerMoscadeWolf03]
  see_also: [ANDOR, AND, OR, sdeg, adeg]

- id: SINK
  name: Sink of a tournament
  symbol: '\mathrm{SINK}_m'
  aliases: ['SINK', 'the LARC function']
  group: separating
  order: 37.5
  kind: total
  arity: '$N = \binom{m}{2}$ bits, one per edge of $K_m$, read as an orientation'
  scale: {var: m, subs: {N: '\binom m2'}}
  short: 'The function that killed the log-approximate-rank conjecture: spectral norm $O(\sqrt N)$, but $\mathrm{SINK}\circ\mathrm{XOR}$ has randomized communication complexity $\Omega(\sqrt N)$.'
  definition: |
    An input orients every edge of the complete graph $K_m$. Output $1$ iff some
    vertex is a *sink* -- every incident edge points into it.

    A tournament has at most one sink, and that is the whole trick: the $m$ events
    "$v$ is a sink" are mutually exclusive, so the indicator is a *sum* of $m$
    monomials rather than an OR of them, and the Fourier spectrum stays tiny.
  formal: '$$\mathrm{SINK}_m(x) = \bigvee_{v=1}^{m}\ \bigwedge_{u \ne v} [\,u \to v\,], \qquad N = \binom m2.$$'
  values:
    - {measure: deg,  value: 'm-1 = \Theta(\sqrt N)', refs: [CMS19], note: 'Exactly: $\mathrm{SINK}_m = \sum_{v}\prod_{u\ne v}[u\to v]$, a sum of $m$ disjoint monomials of degree $m-1$, and the top-degree terms do not cancel.'}
    - {measure: L1,   value: 'O(m) = O(\sqrt N)', refs: [CMS19], note: 'Each of the $m$ disjoint conjunctions has spectral norm $1$ in the $\pm1$ normalisation, and spectral norm is subadditive. This -- a *total* function whose spectral norm is only $\sqrt N$ -- is what the refutation runs on.'}
    - {measure: D,    value: '\Theta(m) = \Theta(\sqrt N)', note: 'Upper: the standard candidate-elimination argument. Query $m-1$ edges to knock out all but one possible sink (a vertex with an out-edge is not a sink), then spend $m-1$ more verifying the survivor, so $\mathrm{D} \le 2m-3$. Lower: $\mathrm{D} \ge \deg = m-1$.'}
    - {measure: bs,   value: '\Theta(m) = \Theta(\sqrt N)', note: 'Take a tournament in which $k$ vertices have out-degree exactly $1$; each such vertex is one edge-flip from being a sink, and the flips are distinct edges, so $\mathrm{bs} \ge k$. Counting out-degrees, $k + (m-k)(m-1) \ge \binom m2$ allows $k = \Theta(m)$. Upper: $\mathrm{bs} \le \mathrm{D} = O(m)$.'}
    - {measure: R,    value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}/3 \le \mathrm{R} \le \mathrm{D}$, with $\mathrm{bs} = \Theta(m)$ and $\mathrm{D} = O(m)$.'}
    - {measure: C1,   value: 'm-1', note: 'To certify a sink you must exhibit all $m-1$ of its in-edges, and that suffices.'}
    - {measure: adeg, value: '\Omega(\sqrt m),\ O(m)', note: 'Lower: $\widetilde{\deg} = \Omega(\sqrt{\mathrm{bs}}) = \Omega(\sqrt m)$. Upper: $\widetilde{\deg} \le \deg = m-1$. I have not found the exact value stated anywhere; note that pinning it down would also pin $\mathrm{Q}$, which is likewise only known to $\Omega(\sqrt m)$ to $O(m)$.'}
    - {measure: fbs, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{fbs}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: C, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{C}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: FC, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{FC}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: R0, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: RC, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{RC}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: Rbar, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: R1, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: chi, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \chi(g) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: chibar, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \bar{\chi}(g) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: LR, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: Rstar, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: CA, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{CA}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: CG, value: '\Omega(m),\ O(m^2)', refs: [CGLMSG23], note: 'The sandwich is $\max\{\mathrm{Adv}^2, \mathrm{R}_0\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ [CGLMSG23], which here reads $\max\{\Omega(m), \Theta(m)\} \le \mathrm{CG} \le m(m-1)$. It closes to $\Theta(m)$ exactly if $\mathrm{Adv} = \Theta(\sqrt m)$ and to $\Theta(m^2)$ if $\mathrm{Adv} = \Theta(m)$ -- the same open question as the [[Q]] row of this entry. The old reading $\mathrm{CG} \le \mathrm{D}$ is not available: $\mathrm{CG}$ is not bounded by the arity.'}
    - {measure: CGpub, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: prt, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here.'}
    - {measure: rprt, value: '\Theta(m) = \Theta(\sqrt N)', conf: medium, note: 'Sandwiched: $\mathrm{bs}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m) = \Theta(\sqrt N)$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: s1, value: 'm-1', note: 'Stated for $m \ge 5$. At a $1$-input the sink $v$ is unique, and flipping an edge not incident to $v$ leaves $v$ a sink, so only the $m-1$ edges at $v$ can be sensitive. Flipping $u \to v$ fails to be sensitive only if $u$ then becomes a sink, i.e. only if $u \to v$ was $u$''s **only** out-edge -- and at most one such $u$ can exist, since two of them would need an edge between them. So $\mathrm{s}^1 \in \{m-2, m-1\}$, and $m-1$ is attained by any $1$-input in which every non-sink has out-degree $\ge 2$ (e.g. a near-regular tournament on $V \setminus \{v\}$ with every vertex pointing at $v$), which exists for $m \ge 5$.'}
    - {measure: s0, value: '3', note: 'Stated for $m \ge 3$. At a $0$-input, flipping the edge $e$ creates a sink iff $e$ is the unique out-edge of some vertex. Distinct vertices have distinct unique out-edges, so $\mathrm{s}^0_x$ counts the vertices of out-degree exactly $1$; if there are $k$ of them, the sub-tournament they span has $\binom k2$ edges and contributes $\binom k2$ to their out-degrees, whence $\binom k2 \le k$ and $k \le 3$. Three is attained: orient $u_1 \to u_2 \to u_3 \to u_1$ and every other edge into $\{u_1,u_2,u_3\}$. So $\mathrm{s}^0 = 3$ -- **a constant**, against $\mathrm{bs}^0 \ge m$ (the out-edge sets of the $m$ vertices are disjoint blocks, and flipping one makes its vertex a sink). SINK is thus a clean natural witness to a quadratic-and-then-some $\mathrm{s}^0$-versus-$\mathrm{bs}^0$ gap.'}
    - {measure: s, value: 'm-1 = \Theta(\sqrt N)', note: '$\max\{\mathrm{s}^0,\mathrm{s}^1\} = \max\{3, m-1\}$.'}
    - {measure: lambda, value: '\Theta(\sqrt m) = \Theta(N^{1/4})', note: 'Pinned from both sides. Upper: the sensitivity graph is bipartite with side-degrees at most $\mathrm{s}^0$ and $\mathrm{s}^1$, so $\lambda \le \sqrt{\mathrm{s}^0\mathrm{s}^1} = \sqrt{3(m-1)}$. Lower: Huang''s theorem in its spectral form gives $\lambda(f) \ge \sqrt{\deg(f)} = \sqrt{m-1}$. The two meet at $\Theta(\sqrt m)$. Note this is *far* below $\mathrm{s} = m-1$: SINK sits at the $\sqrt{\mathrm{s}}$ end of $\sqrt{\mathrm{s}} \le \lambda \le \mathrm{s}$, exactly like [[AND]] and unlike [[PARITY]].'}
    - {measure: C0, value: 'm', putative: true, note: 'To rule out every sink you must exhibit an out-edge for every vertex, and an oriented edge is an out-edge for exactly one of its endpoints -- so at least $m$ edges, and $m$ suffice (pick one out-edge per vertex; they are distinct). Note $\mathrm{C}^0 = m > m-1 = \mathrm{C}^1$, so the recorded $\mathrm{C} = \Theta(m)$ is exactly $m$.'}
    - {measure: Cmin, value: 'm-1', putative: true, note: 'The cheapest inputs are the $1$-inputs, at $\mathrm{C}^1 = m-1$; every $0$-input costs $m$. So certificate complexity is essentially constant across SINK''s domain, in sharp contrast to its sensitivity, which swings from $3$ to $m-1$.'}
    - {measure: bs0, value: '\Theta(m) = \Theta(\sqrt N)', note: 'At least $m$: the out-edge sets of the $m$ vertices are disjoint, and flipping all of one vertex''s out-edges makes it a sink. At most $\mathrm{bs} = O(m)$. This against $\mathrm{s}^0 = 3$ is the separation the $\mathrm{s}^0$ note describes.'}
    - {measure: bs1, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Between $\mathrm{s}^1 = m-1$ and $\mathrm{bs} = O(m)$.'}
    - {measure: QE, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\deg/2 = (m-1)/2 \le \mathrm{Q}_{\mathrm{E}} \le \mathrm{D} = O(m)$. Unlike the bounded-error $\mathrm{Q}$, which is open between $\Omega(\sqrt m)$ and $O(m)$, the exact value is pinned.'}
    - {measure: Dna, value: 'N = \binom m2', note: 'Every edge is relevant.'}
    - {measure: deg2, value: 'm-1 = \Theta(\sqrt N)', putative: true, note: 'Over $\mathbb{F}_2$ the same disjoint decomposition works: $\mathrm{SINK}_m = \sum_v \prod_{u\ne v}[u\to v]$, and each product is a degree-$(m-1)$ polynomial whose top monomial is the star at $v$ (an oriented edge variable is $x_e$ or $1+x_e$ mod $2$, so the top term is unaffected). The $m$ stars are distinct sets, so nothing cancels and $\deg_2 = \deg = m-1$. Confirmed exhaustively for $3 \le m \le 6$. SINK is therefore *not* a $\deg$-versus-$\deg_2$ separator, unlike [[IP]].'}
    - {measure: UC, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with $\mathrm{C} = \Theta(m)$ and $\mathrm{D} = O(m)$ here.'}
    - {measure: SP, value: '\Theta(m) = \Theta(\sqrt N)', note: 'As for $\mathrm{UC}$: the leaves of any decision tree form a subcube partition, so $\mathrm{SP} \le \mathrm{D} = O(m)$, and $\mathrm{SP} \ge \mathrm{UC} \ge \mathrm{C} = \Theta(m)$.'}
    - {measure: UCmin, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{C}_{\min} \le \mathrm{UC}_{\min} \le \mathrm{UC}$, with $\mathrm{C}_{\min} = m-1$ and $\mathrm{UC} = \Theta(m)$ here.'}
    - {measure: EC, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Between $\mathrm{fbs}(f) = \mathrm{FC}(f) \le \mathrm{EC}(f)$ and $\mathrm{EC}(f) \le \mathrm{C}(f)$, both $\Theta(m)$ here.'}
    - {measure: rank, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: a Delayer who always defers survives $\mathrm{C}_{\min} = m-1$ rounds, and $\mathrm{rank} \le \mathrm{D} = O(m)$. Nothing about SINK is caterpillar-shaped.'}
    - {measure: D_size, value: '2^{\Theta(m)} = 2^{\Theta(\sqrt N)}', note: 'Sandwiched: every leaf-subcube is monochromatic, hence of codimension $\ge \mathrm{C}_{\min} = m-1$, so $\mathrm{DTsize} \ge 2^{m-1}$; and $\mathrm{DTsize} \le 2^{\mathrm{D}} = 2^{O(m)}$.'}
    - {measure: Q0, value: '\Theta(m) = \Theta(\sqrt N)', putative: true, note: 'Zero-error quantum buys nothing here. Fix the tournament on $V\setminus\{v\}$ to be a sink-free one (any cyclic orientation, $m \ge 4$) and leave the $m-1$ edges at $v$ free: the restriction is exactly $\mathrm{AND}_{m-1}$, and zero-error quantum search has no speedup at all, $\mathrm{Q}_0(\mathrm{AND}_{m-1}) = m-1$ [BCWZ99]. Restrictions only decrease $\mathrm{Q}_0$, so $\mathrm{Q}_0 \ge m-1$; and $\mathrm{Q}_0 \le \mathrm{Q}_{\mathrm{E}} = O(m)$. Note this pins $\mathrm{Q}_0$ even though the bounded-error $\mathrm{Q}$ is open between $\Omega(\sqrt m)$ and $O(m)$.'}
    - {measure: Rna, value: '\Theta(m^2) = \Theta(N)', putative: true, note: 'Non-adaptively you must read essentially the whole tournament, a full quadratic above $\mathrm{R} = \Theta(\sqrt N)$. Hard distribution: pick $v$ and $u \ne v$ uniformly, orient every edge into $v$ and the rest of the tournament uniformly at random, then flip the edge $uv$ with probability $1/2$. Flipping it destroys the sink and creates a new one only if $u$ is a sink of the sub-tournament, which happens with probability $2^{-(m-2)}$. The unordered pair $\{u,v\}$ is uniform over all $\binom m2$ edges, and flipping the coin is an involution that leaves $x|_S$ unchanged whenever $uv \notin S$, so any fixed $S$ errs with probability $\ge \tfrac12(1 - |S|/\binom m2) - 2^{-(m-2)}$. Hence $|S| = \Omega(N)$, and $\mathrm{R}^{\mathrm{na}} \le \mathrm{D}^{\mathrm{na}} = N$.'}
    - {measure: Inf, value: '\Theta(m^2 2^{-m})', putative: true, note: 'Exactly $\binom m2 2^{3-m}\big(1 - 2^{2-m}\big)$. Every sensitive hypercube edge has a $1$-endpoint, so $\mathrm{I}(f) = 2^{1-N}\sum_{f(x)=1}\mathrm{s}(x)$. At a $1$-input the sink $v$ is unique and only its own $m-1$ edges can matter; flipping $uv$ kills $v$ and creates a sink only if $u$ already loses to all of $V\setminus\{u,v\}$, and at most one such $u$ exists. Counting: $m\,2^{\binom{m-1}2}$ inputs have a sink and $m(m-1)2^{\binom{m-2}2}$ of them also have such a $u$. Verified exhaustively for $m \le 7$. So average sensitivity is exponentially small, while $\mathrm{s} = m-1$.'}
    - {measure: Q, value: '\Omega(\sqrt m),\ O(m)', note: 'Open, and the same gap as $\widetilde{\deg}$. Lower: $\mathrm{Q} \ge \widetilde{\deg}/2 = \Omega(\sqrt{\mathrm{bs}}) = \Omega(\sqrt m) = \Omega(N^{1/4})$. Upper: $\mathrm{Q} \le \mathrm{D} = O(m)$, and the obvious quantum algorithm does no better -- amplitude amplification over the $m$ candidate sinks, each checked by a Grover search for an out-edge, costs $O(\sqrt m \cdot \sqrt m) = O(m)$, exactly what candidate elimination already gives classically. The at-most-one-sink promise is what blocks the usual $\mathrm{OR}\circ\mathrm{AND}$ adversary bound of $\Omega(m)$, so neither end is known to be tight.'}
    - {measure: Advpm, value: '\Omega(\sqrt m),\ O(m)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}$ is open between $\Omega(\sqrt m)$ and $O(m)$ here. Pinning this SDP down would settle $\mathrm{Q}(\mathrm{SINK})$.'}
    - {measure: gamma2, value: '\Omega(\sqrt m),\ O(m)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]); see [[Advpm]].'}
    - {measure: MAdv, value: '\Omega(\sqrt m),\ O(m)', note: 'Sandwiched between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}$, which are $\Theta$ of each other and open in the same range here.'}
    - {measure: Adv, value: '\Omega(\sqrt m),\ O(m)', note: 'Lower: $\lambda(f) \le \mathrm{Adv}(f)$ with $\lambda = \Theta(\sqrt m)$. Upper: $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = \sqrt{m(m-1)} = \Theta(m)$, the certificate barrier, which here coincides with $\mathrm{Adv} \le \mathrm{Adv}^{\pm} = O(m)$.'}
    - {measure: cbs, value: '\Theta(m) = \Theta(\sqrt N)', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}$ degenerates to $\mathrm{bs}$ ([[cbs]] vs [[bs]]).'}
    - {measure: psD, value: '\Theta(m) = \Theta(\sqrt N)', note: 'For a Boolean function the canonical answer is forced, so $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ ([[psD]] vs [[R]]).'}
    - {measure: Dmu, value: '\Theta(m) = \Theta(\sqrt N)', refs: [Yao77], note: 'Worst case over $\mu$: Yao''s minimax gives $\max_\mu \mathrm{D}^{\mu}_{\varepsilon}(f) = \mathrm{R}_{\varepsilon}(f) = \Theta(m)$.'}
    - {measure: RS, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)/(1-2\varepsilon)$, and $\mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(m)$ meets $\mathrm{R} = \Theta(m)$.'}
    - {measure: CGstar, value: '\Theta(m) = \Theta(\sqrt N)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]).'}
    - {measure: CGns, value: '\Theta(m) = \Theta(\sqrt N)', refs: [CGLMSG23], note: 'The same non-signaling collapse; see [[CGstar]].'}
    - {measure: QC, value: '\Theta(\sqrt m) = \Theta(N^{1/4})', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ [Aaronson08], and $\mathrm{fbs} = \Theta(m)$ here. It coincides with $\lambda$ and with the lower end of the $\mathrm{Q}$ range.'}
    - {measure: Np, value: '\Omega(m),\ O(m\log m)', note: 'Between $\mathrm{R} = \Theta(m)$ and $O(\mathrm{R}\log \mathrm{R})$. The influence-based lower bound $\mathrm{N}_p = \Omega(\mathrm{I}\log \mathrm{I})$ [GLX26noisy] gives nothing, $\mathrm{I}$ being exponentially small.'}
    - {measure: robustQ, value: '\Omega(\sqrt m),\ O(m\log m)', note: 'Between $\mathrm{Q}$ and $O(\mathrm{Q}\log \mathrm{Q})$, and $\mathrm{Q}$ is itself open here; the upper end also follows from $\mathrm{Q}^{\mathrm{rob}} \le \mathrm{N}_p = O(m\log m)$.'}
    - {measure: ndeg, value: 'm-1 = \Theta(\sqrt N)', putative: true, note: 'Upper: $\mathrm{ndeg} \le \mathrm{C}^1 = m-1$. Lower: fix a sink-free tournament on $V \setminus \{v\}$ and leave the $m-1$ edges at $v$ free; the restriction is $\mathrm{AND}_{m-1}$, whose nondeterministic degree is $m-1$ (a polynomial nonzero exactly at $1^k$ is a multiple of $\prod_i x_i$), and restrictions do not increase $\mathrm{ndeg}$.'}
    - {measure: NQ, value: '\lceil (m-1)/2 \rceil = \Theta(\sqrt N)', refs: [deWolf03], note: '$\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$ [deWolf03], and $\mathrm{ndeg} = m-1$ here.'}
    - {measure: rdeg, value: '\Theta(m) = \Theta(\sqrt N)', putative: true, note: 'Sandwiched: $\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\} \ge m-1$, and $\mathrm{rdeg}(f) \le \mathrm{C}(f) = m$. (For the record the complement is no harder: at most one vertex is a sink, so $\overline{\mathrm{SINK}} = 1 - \sum_v \prod_{u\ne v}[u\to v]$ on the nose, giving $\mathrm{ndeg}(\bar f) \le m-1$ as well.)'}
    - {measure: degp, value: 'm-1 = \Theta(\sqrt N)', putative: true, note: 'For *every* prime $p$, by the same disjoint decomposition that gives $\deg$ and $\deg_2$: the $m$ star monomials are distinct sets and each carries coefficient $\pm1$ over $\mathbb{Z}$, so nothing cancels in any characteristic.'}
    - {measure: PDT, value: '\Theta(m) = \Theta(\sqrt N)', putative: true, note: 'Lower: $\mathrm{spar}(f) \le 4^{\mathrm{D}^{\oplus}(f)}$ with $\mathrm{spar} = \Theta(m2^m)$ gives $\mathrm{D}^{\oplus} \ge (m-1)/2$. Upper: $\mathrm{D}^{\oplus} \le \mathrm{D} = O(m)$. Parity queries buy nothing, which is the query-level shadow of the [CMS19] refutation: $\mathrm{SINK}$ has tiny spectral norm yet its parity decision trees are as deep as its ordinary ones.'}
    - {measure: spar, value: 'm2^{m-1} - m^2 + 1 = \Theta(m2^{m})', putative: true, note: 'A set $S$ has $\hat F(S) \ne 0$ iff $|S| \ge 2$ and $S$ lies inside some star (each star has $2^{m-1}-m$ such subsets, and no two stars share one), plus the empty set. Singletons cancel exactly: the edge $uv$ appears in the star at $v$ with the opposite sign to the star at $u$. Verified exhaustively for $m = 3,4,5$ (the empty coefficient also vanishes at $m = 4$, where $\mathrm{SINK}_4$ happens to be balanced, so the count is one lower there). Note $\log_2\mathrm{spar} = \Theta(m) = \Theta(\mathrm{D})$ while $\mathrm{L}_1 = O(m)$ -- sparse *and* of small spectral norm.'}
    - {measure: Fdim, value: '\binom m2 = N', putative: true, note: 'Full, for $m \ge 4$. The support contains every pair of edges sharing a vertex, and those pairs already span all even-weight sets; it also contains $3$-subsets of a star once $m \ge 4$, so the span is all of $\mathbb{F}_2^{N}$. Verified exhaustively at $m = 4,5$. The Fourier-dimension bound $\mathrm{D}^{\oplus} \le \dim_{\mathbb{F}_2}$ is therefore vacuous here, and the real $\mathrm{D}^{\oplus} = \Theta(\sqrt N)$ comes from sparsity instead.'}
    - {measure: Inf1, value: '\Theta(m^2 2^{-m})', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide term by term, so $\mathrm{I}^{1}(f) = \mathrm{I}(f)$.'}
    - {measure: MaxInf, value: '\Theta(2^{-m})', putative: true, note: 'Relabelling vertices acts transitively on edges, so every coordinate has the same influence and $\mathrm{MaxInf} = \mathrm{I}(f)/N = 2^{3-m}(1-2^{2-m})$.'}
    - {measure: NS, value: '(1+o(1))\,m\,2^{2-m}\big(1-(1-\delta)^{m-1}\big)', putative: true, note: 'A random tournament has a sink with probability $m2^{1-m}$, and the sink survives $\delta$-noise exactly when none of its $m-1$ in-edges flips; a *new* sink appearing needs $\ge m-2$ simultaneous flips and is lower order. So $\mathrm{NS}_\delta = 2\Pr[f(x)=1]\big(1-(1-\delta)^{m-1}\big)(1+o(1))$. Consistency check: as $\delta \to 0$ this is $\delta\,m(m-1)2^{2-m} = \delta\,\mathrm{I}(f)$ exactly.'}
    - {measure: Stab, value: '1 - m2^{3-m}\big(1-(\tfrac{1+\rho}{2})^{m-1}\big)', putative: true, note: 'Substituting $\delta = (1-\rho)/2$ into $\mathrm{NS}$ above, via $\mathrm{Stab}_\rho = 1 - 2\mathrm{NS}_\delta$. SINK is almost perfectly noise-stable simply because it is almost always $0$.'}
    - {measure: noisyR, value: '\Theta(m) = \Theta(\sqrt N)', putative: true, note: 'The zoo''s shortcut $\mathrm{R} = \Theta(n) \Rightarrow \mathrm{noisyR} = \Theta(\mathrm{R})$ does *not* apply -- $\mathrm{R} = \Theta(\sqrt N)$ here, not linear in the arity -- so the lower bound has to come from a restriction. Fix the tournament on $\{2,\dots,m\}$ to be transitive and orient $\{1,m\}$ into vertex $1$: then every vertex except $1$ has an outgoing edge, and the function of the $m-2$ free edges $\{1,u\}$ is exactly $\mathrm{AND}_{m-2}$. Noisy randomized complexity is monotone under restriction, and $\mathrm{noisyR}(\mathrm{AND}_k) = \Theta(k)$ since $\mathrm{R}(\mathrm{AND}_k) = k$ is linear in *its* arity. Upper: $\mathrm{noisyR} \le \mathrm{R} = \Theta(m)$ ([[noisyR]] vs [[R]]).'}
    - {measure: D_prod, value: '\Theta(m) = \Theta(\sqrt N)', putative: true, note: 'Product distributions lose nothing here. Upper: $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R} = \Theta(m)$. Lower, by the same $\mathrm{AND}_{m-2}$ restriction as [[noisyR]] -- restricting is legal because a product distribution on the free variables extends to a product distribution with point masses on the fixed ones -- together with $\mathrm{D}^{\mathrm{prod}}(\mathrm{AND}_k) = \Theta(k)$: take each bit $1$ independently with probability $1-1/k$, so that after $d$ observed ones the conditional probability of $\mathrm{AND} = 1$ is $(1-1/k)^{k-d}$, which stays in $[e^{-1}, e^{-1/2}]$ until $d \ge k/2$ and therefore keeps the error above $1/3$.'}
    - {measure: cjdeg, value: '\Omega(\sqrt m),\ O(m)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)$ ([[adeg]] vs [[cjdeg]], [[cjdeg]] vs [[R]]), with $\widetilde{\deg} \in [\Omega(\sqrt m), O(m)]$ and $\mathrm{R} = \Theta(m)$. The window is exactly the open window on $\widetilde{\deg}$ -- pinning the approximate degree of SINK would pin this too.'}
  witnesses:
    - {of: [bs0, s0], setting: total, statement: 'Unbounded on a natural total function: $\mathrm{bs}^0 = \Theta(m)$ against $\mathrm{s}^0 = 3$, a *constant*. At most three vertices of a tournament can have out-degree $1$, so only three single-edge flips can create a sink -- but the $m$ out-edge *sets* are disjoint blocks.'}
    - {of: [s1, s0], setting: total, statement: 'Unbounded: $\mathrm{s}^1 = m-1$ against $\mathrm{s}^0 = 3$, which is bounded outright. Compare [[TRIBES]] for the same phenomenon on a monotone read-once DNF.'}
    - {of: [Rna, R], setting: total, statement: 'Quadratic: $\mathrm{R}^{\mathrm{na}} = \Theta(N)$ against $\mathrm{R} = \Theta(\sqrt N)$. Candidate elimination -- the reason finding a sink is cheap -- is inherently adaptive, and randomness does not substitute for it.'}
    - {of: [D, L1], setting: total, statement: 'Both $\Theta(\sqrt N)$ -- no separation *here*. The refutation happens one level up: $\log$ of the approximate rank of $\mathrm{SINK}\circ\mathrm{XOR}$ is $\widetilde O(\sqrt N)^{o(1)}$-small while its randomized communication complexity is $\Omega(\sqrt N)$.', refs: [CMS19]}
  notes: |
    **What is actually refuted.** The log-approximate-rank conjecture (Lee-Shraibman)
    said $\mathrm{R}^{cc}(F) \le \mathrm{polylog}(\text{approximate rank of } F)$ for
    total $F$. [CMS19] take $F = \mathrm{SINK}_m \circ \mathrm{XOR}$: its approximate
    rank is $2^{O(\log m)}$-ish because the spectral norm is $O(m)$, while a corruption
    argument (lifting a randomized parity-decision-tree bound, via Shearer's lemma)
    gives $\mathrm{R}^{cc} = \Omega(m)$. The same function refutes Grolmusz's
    conjecture and the parity-measure conjecture of Tsang-Wong-Xie-Zhang, which had
    implied the log-rank conjecture for XOR functions.

    The quantum version of the conjecture fell the same year, independently:
    [SinhadeWolf19] and [ABT19].

    **Why composed functions had not done this before.** For query complexity the
    decision-tree analogue of the log-rank conjecture is *true* for both exact and
    approximate degree, so a $g \circ \mathrm{XOR}$ counterexample has to come from a
    $g$ whose ordinary Fourier structure is simple but whose *parity* decision trees
    are not. SINK is exactly that.
  refs: [CMS19, SinhadeWolf19, ABT19]
  see_also: [L1, spar, PDT, adeg, OR]

- id: SCORPION
  name: Scorpion graphs
  symbol: '\mathrm{SCORP}_m'
  group: basic
  order: 19.2
  kind: total
  arity: '$N = \binom{m}{2}$ bits, the adjacency matrix of an $m$-vertex graph'
  scale: {var: m, subs: {N: '\binom m2'}}
  short: 'The nontrivial graph property that is nowhere near evasive: $\mathrm{D} = \Theta(m) = \Theta(\sqrt N)$ out of $N$ possible queries.'
  definition: |
    A graph is a *scorpion* if it has three special vertices -- a **sting** $s$ of
    degree $1$, adjacent only to the **tail** $t$; a tail $t$ of degree $2$, adjacent
    only to $s$ and to the **body** $b$; and a body $b$ adjacent to every vertex except
    $s$. The remaining $m-3$ vertices (the "feet") may be joined arbitrarily.

    "Is this graph a scorpion?" is a graph property -- invariant under relabelling
    vertices -- and it is nontrivial. It is also decidable in $O(m)$ queries.
  formal: 'The property $P = \{G : \exists\, s,t,b \text{ with } N(s) = \{t\},\ N(t) = \{s,b\},\ N(b) = V \setminus \{s\}\}$.'
  values:
    - {measure: D, value: '\Theta(m) = \Theta(\sqrt N)', refs: [BvEBL74, LovaszYoung02], note: 'Upper: at most $6m$ queries. Walk a candidate body around, maintaining a set of vertices known not to be the body; each query eliminates a vertex, so $O(m)$ queries identify $b$ or reject, and $2(m-1)$ more check $s$ and $t$. Lower: $\Omega(m)$, since the answer depends on all $m$ vertices.'}
    - {measure: R, value: '\Theta(m)', note: 'Between $\Omega(\sqrt{\mathrm{bs}})$ and $\mathrm{D} = O(m)$; nothing below $\Theta(m)$ is possible because the property depends on every vertex.'}
    - {measure: deg, value: '3m-6 = \Theta(\sqrt N)', putative: true, note: 'Exactly, for $m \ge 5$. For $m \ge 5$ a scorpion has a *unique* triple $(s,t,b)$ -- the body is the only vertex of degree $m-2$, since a foot misses both $s$ and $t$ -- so $\mathrm{SCORP}_m = \sum_{(s,t,b)} \mathbf{1}[\text{the } 3m-6 \text{ pairs touching } \{s,t,b\} \text{ take their scorpion values}]$ is a sum of *disjoint* subcube indicators of codimension $3m-6$. Hence $\deg \le 3m-6$. It is attained: all six orderings of one $3$-set share the same touch set $T$ and each contributes $(-1)^{2m-5} = -1$ to the coefficient of $\prod_{e\in T} x_e$, so that coefficient is $-6 \ne 0$. Confirmed exhaustively for $m \le 6$. Note $\deg = \mathrm{s}^1 = \mathrm{C}^1$, all three equal to $3m-6$.'}
    - {measure: QE, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: $\deg/2 = (3m-6)/2 \le \mathrm{Q}_{\mathrm{E}} \le \mathrm{D} = O(m)$.'}
    - {measure: Q0, value: '\Theta(m) = \Theta(\sqrt N)', putative: true, refs: [BCWZ99], note: 'Zero-error quantum buys nothing. Fix the triple $(s,t,b) = (1,2,3)$, make the feet pairwise non-adjacent, fix all touch pairs at their scorpion values except the $m-3$ body-foot pairs, and leave those free: for $m \ge 6$ the result is a scorpion iff all $m-3$ are present (no foot can take over as body, its degree being at most $1$), so the restriction is $\mathrm{AND}_{m-3}$. Zero-error quantum search has no speedup at all, $\mathrm{Q}_0(\mathrm{AND}_k) = k$ [BCWZ99], and restrictions only decrease $\mathrm{Q}_0$, so $\mathrm{Q}_0 \ge m-3$; and $\mathrm{Q}_0 \le \mathrm{Q}_{\mathrm{E}} = O(m)$.'}
    - {measure: R0, value: '\Theta(m)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{R} = \Theta(m)$ and $\mathrm{D} = O(m)$ here.'}
    - {measure: adeg, value: '\Omega(\sqrt m),\ O(m)', note: 'Lower: the restriction above turns $\mathrm{SCORP}_m$ into $\mathrm{AND}_{m-3}$, so $\widetilde{\deg} \ge \widetilde{\deg}(\mathrm{AND}_{m-3}) = \Theta(\sqrt m)$. Upper: $\widetilde{\deg} \le \deg = 3m-6$. Not pinned down here; as with [[SINK]], settling it would also settle $\mathrm{Q}$.'}
    - {measure: Q, value: 'O(m)', note: 'From $\mathrm{Q} \le \mathrm{D}$. No better bound is recorded, and no better one is obviously available: this is not a search problem.'}
    - {measure: Rbar, value: '\Theta(m)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(m)$ here.'}
    - {measure: s1, value: '3m-6', putative: true, note: 'Take the scorpion with independent feet. The pairs *touching* $\{s,t,b\}$ number $3 + 3(m-3) = 3m-6$, and each of them is sensitive: adding an edge at the sting or the tail destroys the only degree-$1$/degree-$2$ pair, deleting $st$ or $tb$ breaks the chain, and deleting a body-foot edge stops $b$ from dominating -- in every case no *other* triple can take over, because a replacement sting would need a neighbour of degree $2$ and the only such vertex is gone. Pairs between feet are insensitive by definition. Exhaustive search confirms $\mathrm{s}^1 = 3m-6$ exactly for $m \le 7$.'}
    - {measure: s0, value: '2m-4', putative: true, note: 'The extremal $0$-input is $K_{m-2} \sqcup K_2$: a clique on $A$, plus a lone edge $\{u,v\}$ with no edges to $A$. Adding $ua$ for any $a \in A$ makes a scorpion with sting $v$, tail $u$, body $a$ (the clique makes $a$ dominate everything but $v$); symmetrically for $va$. That is $2(m-2)$ sensitive pairs, and exhaustive search confirms $\mathrm{s}^0 = 2m-4$ exactly for $m \le 7$. Contrast $\mathrm{s}^1 = 3m-6$: the scorpion is mildly $1$-biased.'}
    - {measure: s, value: '3m-6', putative: true, note: '$\max(\mathrm{s}^0,\mathrm{s}^1) = \max(2m-4,\,3m-6)$.'}
    - {measure: C1, value: '3m-6', putative: true, note: 'The $3m-6$ touch pairs of a triple $(s,t,b)$ *are* a certificate: they pin $N(s)=\{t\}$, $N(t)=\{s,b\}$ and $N(b) = V\setminus\{s\}$, and the feet may then do anything. So $3m-6 = \mathrm{s}^1 \le \mathrm{bs}^1 \le \mathrm{C}^1 \le 3m-6$ and all three coincide -- the scorpion is $1$-certificate-tight, verified by brute force for $m \le 9$.'}
    - {measure: bs1, value: '3m-6', putative: true, note: 'Squeezed between $\mathrm{s}^1$ and $\mathrm{C}^1$, both $3m-6$.'}
    - {measure: C0, value: '\Theta(m)', putative: true, note: 'Upper: $\mathrm{C}^0 \le \mathrm{D} = O(m)$. Lower: at the empty graph, refuting the triple $(\sigma,\tau,\beta)$ needs a queried edge in $\{\sigma\tau\} \cup \mathrm{star}(\beta)\setminus\{\beta\sigma\}$, so a $0$-certificate is a hitting set for that family; unless $P$ meets $\mathrm{star}(\beta)$ twice for nearly every $\beta$ it must contain a near-clique, and $\sum_\beta |P \cap \mathrm{star}(\beta)| = 2|P|$ then forces $|P| = \Omega(m)$; the empty graph''s own optimum is exactly $m-1$ (a single star of absent pairs, isolating a vertex) for $5 \le m \le 8$, and that is where $\mathrm{C}_{\min}$ comes from. The *maximum* over $0$-inputs is larger: exhaustive search gives $\mathrm{C}^0 = 2m-4$ for $4 \le m \le 6$, matching $\mathrm{s}^0$ exactly, so $\mathrm{s}^0 = \mathrm{bs}^0 = \mathrm{C}^0$ and the extremal $0$-input is $K_{m-2}\sqcup K_2$ in all three.'}
    - {measure: bs0, value: '\Theta(m)', note: 'Squeezed between $\mathrm{s}^0 = 2m-4$ and $\mathrm{C}^0 = \Theta(m)$.'}
    - {measure: bs, value: '\Theta(m)', note: 'Squeezed between $\mathrm{s} = 3m-6$ and $\mathrm{C} = \Theta(m)$.'}
    - {measure: fbs, value: '\Theta(m)', note: 'Squeezed between $\mathrm{bs}$ and $\mathrm{C}$, both $\Theta(m)$.'}
    - {measure: C, value: '\Theta(m)', putative: true, note: '$\max(\mathrm{C}^0,\mathrm{C}^1)$; also directly $\mathrm{C} \le \mathrm{D} = O(m)$.'}
    - {measure: Dna, value: '\binom{m}{2} = N', putative: true, note: 'Every pair $uv$ is sensitive somewhere -- take the scorpion with sting $u$, tail $v$ -- so a fixed query set that omits $uv$ fails to separate that scorpion from its neighbour. Hence all $N$ bits must be read in advance, against $\mathrm{D} = \Theta(\sqrt N)$. (The $\mathrm{D}^{\mathrm{na}} = N$ half is the generic fact that a non-adaptive algorithm must read every relevant variable; what is special here is how small $\mathrm{D}$ is.) [[TreeNav]] pushes the same phenomenon to an exponential gap; the scorpion is the natural graph-theoretic instance.'}
    - {measure: Cmin, value: 'm-1', putative: true, note: 'Upper: at the empty graph, fixing the $m-1$ pairs at one vertex to *absent* isolates it, and a scorpion has no isolated vertex (the body dominates everything but the sting, and the sting has degree $1$). Lower: if a set $S$ of $|S| = k$ pairs leaves three vertices untouched, take them as $(s,t,b)$ -- every pair the triple touches is then free, and the feet may do anything -- so the subcube contains a scorpion and $S$ is not a $0$-certificate; hence $m - 2k \le 2$, i.e. every $0$-input costs at least $(m-2)/2$. Every $1$-input costs $\mathrm{C}^1 = 3m-6$. Exhaustive search gives $\mathrm{C}_{\min} = m-1$ exactly for $4 \le m \le 6$, attained only at graphs with an isolated vertex.'}
    - {measure: rank, value: '\Theta(m) = \Theta(\sqrt N)', note: 'Sandwiched: a Delayer who always defers survives $\mathrm{C}_{\min} = m-1$ rounds, so $\mathrm{rank} \ge m-1$, and $\mathrm{rank} \le \mathrm{D} = O(m)$. So the scorpion decision tree is genuinely branching, not a caterpillar -- unlike [[OR]], whose $\mathrm{D}$ is also large while $\mathrm{rank} = 1$.'}
    - {measure: D_size, value: '2^{\Theta(m)} = 2^{\Theta(\sqrt N)}', note: 'Sandwiched: every leaf-subcube is monochromatic, hence of codimension $\ge \mathrm{C}_{\min} = m-1$, so $\mathrm{DTsize} \ge 2^{m-1}$; and $\mathrm{DTsize} \le 2^{\mathrm{D}} = 2^{O(m)}$. Note $\log_2\mathrm{DTsize} = \Theta(\sqrt N)$ while there are $N$ variables -- the tree is exponentially smaller than the truth table.'}
    - {measure: UC, value: '\Theta(m)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with $\mathrm{C} = \Theta(m)$ and $\mathrm{D} = O(m)$ here.'}
    - {measure: SP, value: '\Theta(m)', note: 'The leaves of the $O(m)$-query algorithm form a monochromatic subcube partition, so $\mathrm{SP} \le \mathrm{D} = O(m)$; and $\mathrm{SP} \ge \mathrm{UC} \ge \mathrm{C} = \Theta(m)$.'}
    - {measure: UCmin, value: '\Theta(m)', note: 'Sandwiched: $\mathrm{C}_{\min} \le \mathrm{UC}_{\min} \le \mathrm{UC}$, with $\mathrm{C}_{\min} = m-1$ and $\mathrm{UC} = \Theta(m)$ here.'}
    - {measure: EC, value: '\Theta(m)', note: 'Between $\mathrm{fbs}(f) = \mathrm{FC}(f) \le \mathrm{EC}(f)$ and $\mathrm{EC}(f) \le \mathrm{C}(f)$, both $\Theta(m)$ here.'}
    - {measure: FC, value: '\Theta(m)', note: '$\mathrm{FC} = \mathrm{fbs}$ exactly, by LP duality, and $\mathrm{fbs} = \Theta(m)$ here.'}
    - {measure: RC, value: '\Theta(m)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{RC}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m)$ here.'}
    - {measure: Rna, value: '\Theta(m^2) = \Theta(N)', putative: true, note: 'Non-adaptively the scorpion property is *evasive up to a constant*, a full quadratic above $\mathrm{R} = \Theta(\sqrt N)$. Hard distribution: draw an ordered triple $(s,t,b)$ uniformly and the foot subgraph uniformly, giving a scorpion $G$, then delete the edge $st$ with probability $\tfrac12$ (which isolates $s$, so the result is never a scorpion). Flipping that coin is a measure-preserving involution that does not change $x|_S$ whenever $st \notin S$, so given $x|_S$ the answer is an unbiased coin on that event; since $\{s,t\}$ is uniform over all $\binom m2$ pairs, a fixed $S$ succeeds with probability at most $1 - \tfrac12(1 - |S|/\binom m2)$, forcing $|S| \ge \binom m2/3$. Upper: $\mathrm{R}^{\mathrm{na}} \le \mathrm{D}^{\mathrm{na}} = N$.'}
    - {measure: Inf, value: '\Theta(m^4 2^{-3m}) = 2^{-\Theta(\sqrt N)}', putative: true, note: 'Exactly $\mathrm{I} = 6m(m-1)(m-2)^2\,2^{6-3m}$ for $m \ge 5$. Every scorpion has sensitivity exactly $3m-6$ (the proof of $\mathrm{s}^1$ applies to *every* scorpion, not just the one with independent feet), so the sensitivity graph has $m(m-1)(m-2)2^{\binom{m-3}2}(3m-6)$ edges; divide by $2^{\binom m2}$ and double. Verified exactly against exhaustive computation for $5 \le m \le 7$. The scorpion property is thus vanishingly rare *and* vanishingly influential, which is why $\mathrm{R}$ cannot be beaten below $\Theta(m)$ by sampling.'}
    - {measure: lambda, value: '\Omega(\sqrt m),\ O(m)', note: 'Lower: Huang''s theorem in spectral form, $\lambda \ge \sqrt{\deg} = \sqrt{3m-6}$. Upper: the sensitivity graph is bipartite with side-degrees $\mathrm{s}^1 = 3m-6$ and $\mathrm{s}^0 = 2m-4$, so $\lambda \le \sqrt{\mathrm{s}^0\mathrm{s}^1} = \sqrt6\,(m-2)$. Not pinned; exhaustive computation gives $\lambda^2 = 16,\,23,\,26,\,33$ at $m = 4,\dots,7$, which tracks the $\Theta(\sqrt m)$ end.'}
    - {measure: L1, value: 'O(m^3) = O(N^{3/2})', putative: true, note: 'For $m \ge 5$ the property is a disjoint union of $m(m-1)(m-2)$ subcubes, one per ordered triple, and the indicator of a subcube has spectral norm $1$; spectral norm is subadditive, so the $\pm1$ version has $\hat{\mathrm{L}}_1 \le 1 + 2m(m-1)(m-2)$. Like [[SINK]], the scorpion is a total function whose spectral norm is only *polynomial* in $N$, against the $2^{\Theta(N)}$ of a generic function. The exhaustive values $16.5,\,40.6,\,99.1$ at $m = 5,6,7$ leave the constant, and indeed the exponent, unsettled.'}
    - {measure: cbs, value: '\Theta(m)', note: 'For a Boolean function the solution to be produced is forced, so $\mathrm{cbs}$ degenerates to $\mathrm{bs}$ ([[cbs]] vs [[bs]]); here $\mathrm{bs} = \Theta(m)$.'}
    - {measure: psD, value: '\Theta(m)', note: 'For a Boolean function the canonical answer is forced, so $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ ([[psD]] vs [[R]]); here $\mathrm{R} = \Theta(m)$.'}
    - {measure: Dmu, value: '\Theta(m)', refs: [Yao77], note: 'Worst case over $\mu$: Yao''s minimax gives $\max_\mu \mathrm{D}^{\mu}_{\varepsilon}(f) = \mathrm{R}_{\varepsilon}(f) = \Theta(m)$.'}
    - {measure: R1, value: '\Theta(m)', note: 'Sandwiched between $\mathrm{R} = \Theta(m)$ and $\mathrm{R}_0 = \Theta(m)$.'}
    - {measure: RS, value: '\Theta(m)', note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)/(1-2\varepsilon)$, and $\mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(m)$ meets $\mathrm{R} = \Theta(m)$. So the scorpion composes perfectly: $\mathrm{R}(\mathrm{SCORP}_m \circ g^N) = \Omega(m\,\mathrm{R}(g))$.'}
    - {measure: chi, value: '\Theta(m)', note: 'Sandwiched: $\chi(f) = \Omega(\mathrm{bs}(f))$ and $\chi(f) \lesssim \mathrm{RS}(f)$, with $\mathrm{bs} = \Theta(m)$ and $\mathrm{RS} = \Theta(m)$ here. The whole inner-measure chain $\chi \lesssim \mathrm{RS} \lesssim \bar\chi \lesssim \mathrm{LR} \lesssim \mathrm{R}$ collapses to $\Theta(m)$ on this function.'}
    - {measure: chibar, value: '\Theta(m)', note: 'Squeezed inside the chain $\mathrm{RS} \lesssim \bar\chi \lesssim \mathrm{LR} \lesssim \mathrm{R}$, with $\mathrm{RS} = \Theta(m)$ and $\mathrm{R} = \Theta(m)$.'}
    - {measure: LR, value: '\Theta(m)', note: 'Squeezed between $\bar\chi = \Theta(m)$ and $\mathrm{R} = \Theta(m)$.'}
    - {measure: Rstar, value: '\Theta(m)', note: 'Squeezed between $\mathrm{LR} = \Theta(m)$ and $\mathrm{R} = \Theta(m)$.'}
    - {measure: CA, value: '\Theta(m)', refs: [ABIKPS17], note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for total $f$ [ABIKPS17], and $\mathrm{fbs} = \Theta(m)$ here.'}
    - {measure: CGpub, value: '\Theta(m)', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{CG}^{*}) = \Theta(\mathrm{CG}^{\mathrm{ns}}) = \Theta(\mathrm{CA})$, the non-signaling bottleneck [CGLMSG23], and $\mathrm{CA} = \Theta(m)$ here.'}
    - {measure: CGstar, value: '\Theta(m)', refs: [CGLMSG23], note: 'Entanglement buys nothing beyond the non-signaling value: $\mathrm{CG}^{*} = \Theta(\mathrm{CA}) = \Theta(m)$.'}
    - {measure: CGns, value: '\Theta(m)', refs: [CGLMSG23], note: 'The non-signaling relaxation is already $\Theta(\mathrm{CA}) = \Theta(m)$.'}
    - {measure: CG, value: '\Omega(m),\ O(m^2)', refs: [CGLMSG23], note: 'The sandwich is $\max\{\mathrm{Adv}^2, \mathrm{R}_0, \mathrm{CA}\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ [CGLMSG23]: here $\mathrm{R}_0 = \Theta(m)$ from below and $\mathrm{C}^0\mathrm{C}^1 = \Theta(m)\cdot(3m-6) = \Theta(m^2)$ from above, and $\mathrm{Adv}$ is itself only pinned to $[\Omega(\sqrt m), O(m)]$. Note the direction: $\mathrm{R}_0 = O(\mathrm{CG})$, not the reverse -- private coin is the one variant of the game that is *harder* than zero-error query complexity, and is not capped by $\mathrm{D}$.'}
    - {measure: prt, value: '\Theta(m)', refs: [JainKlauck10], note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{prt}(f) + O(1) \le 2\,\mathrm{R}(f) + O(1)$, with $\mathrm{RC} = \Theta(m)$ and $\mathrm{R} = \Theta(m)$ here. The LP loses nothing on the scorpion, in contrast with the quadratic loss it can suffer in general.'}
    - {measure: Fdim, value: '\binom{m}{2} = N', putative: true, note: 'Full. The Fourier support fails to span $\mathbb{F}_2^N$ exactly when $f(x \oplus a) = f(x)$ for some $a \ne 0$, since the shifted function has coefficients $(-1)^{a \cdot S}\hat f(S)$; no nonempty edge set $a$ can be flipped without ever destroying scorpionhood (flip an edge of $a$ at the sting of a scorpion whose triple avoids the rest of $a$). Confirmed by exhaustive computation for $m \le 7$. So a parity decision tree gets no help from a global change of basis, even though $\mathrm{D} = \Theta(\sqrt N)$.'}
    - {measure: Inf1, value: '\Theta(m^4 2^{-3m})', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide term by term, so $\mathrm{I}^{1}(f) = \mathrm{I}(f) = 6m(m-1)(m-2)^2\,2^{6-3m}$; see [[Inf]].'}
    - {measure: MaxInf, value: '12(m-2)^2\,2^{6-3m}', putative: true, note: 'The property is invariant under relabelling vertices and the symmetric group is transitive on pairs, so every coordinate has the same influence and $\mathrm{MaxInf} = \mathrm{I}(f)/N = 6m(m-1)(m-2)^2 2^{6-3m}/\binom m2 = \Theta(m^2 2^{-3m})$.'}
    - {measure: NS, value: '(2+o(1))\,m(m-1)(m-2)\,2^{6-3m}\big(1-(1-\delta)^{3m-6}\big)', putative: true, note: 'Noise sensitivity is $2\Pr[f(x)=1,\,f(y)=0]$. A uniform graph is a scorpion with probability $p = m(m-1)(m-2)2^{6-3m}$, and given a scorpion with triple $(s,t,b)$ the noisy copy stays a scorpion essentially only if none of the $3m-6$ touch pairs flips -- acquiring a *different* triple needs $\Omega(m)$ flips and costs a further $2^{-\Omega(m)}$ -- whence the displayed formula. Consistency: as $\delta \to 0$ it tends to $6m(m-1)(m-2)^2 2^{6-3m}\,\delta = \delta\,\mathrm{I}(f)$, exactly the recorded [[Inf]].'}
    - {measure: Stab, value: '1 - (4+o(1))\,m(m-1)(m-2)\,2^{6-3m}\big(1-(\tfrac{1+\rho}{2})^{3m-6}\big)', putative: true, note: 'From $\mathrm{Stab}_{\rho} = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$ and the [[NS]] entry. Stability is $1 - 2^{-\Theta(m)}$ for every fixed $\rho < 1$: the $\pm1$ version of the scorpion property is a constant function up to an exponentially small correction, which is the Fourier shadow of $\mathrm{I}(f) = 2^{-\Theta(\sqrt N)}$.'}
    - {measure: noisyR, value: '\Theta(m) = \Theta(\sqrt N)', putative: true, note: 'As on [[SINK]], the "$\mathrm{R}$ linear in the arity" shortcut is unavailable ($\mathrm{R} = \Theta(\sqrt N)$), so the lower bound comes from a restriction to $\mathrm{AND}$. Put the sting at $1$, the tail at $2$ and the body at $3$: fix $\{1,2\}$ and $\{2,3\}$ present, every other edge at $1$ or $2$ absent, and every foot-foot edge absent. What remains free is the $m-3$ edges $\{3,u\}$, $u \ge 4$, and the graph is a scorpion iff all of them are present -- no other vertex can play body, since the feet now have degree $\le 1$. So $\mathrm{noisyR} \ge \mathrm{noisyR}(\mathrm{AND}_{m-3}) = \Theta(m)$, and $\mathrm{noisyR} \le \mathrm{R} = \Theta(m)$.'}
    - {measure: D_prod, value: '\Theta(m) = \Theta(\sqrt N)', putative: true, note: 'The same $\mathrm{AND}_{m-3}$ restriction as [[noisyR]], with $\mathrm{D}^{\mathrm{prod}}(\mathrm{AND}_k) = \Theta(k)$ (each bit $1$ independently with probability $1-1/k$; see the [[SINK]] entry), against the ceiling $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R} = \Theta(m)$. Note the contrast with $\mathrm{D}$: the scorpion property is $\Theta(m)$-easy deterministically too, so unlike [[CONN]] there is nothing for randomness or for a product distribution to exploit.'}
    - {measure: cjdeg, value: '\Omega(\sqrt m),\ O(m)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)$, with $\widetilde{\deg} \in [\Omega(\sqrt m), O(m)]$ and $\mathrm{R} = \Theta(m)$; the window is inherited wholesale from the open window on $\widetilde{\deg}$.'}
    - {measure: QC, value: '\Theta(\sqrt m) = \Theta(N^{1/4})', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ [Aaronson08], and $\mathrm{fbs} = \Theta(m)$ here. So a quantum verifier checks the scorpion property with a quadratically shorter certificate than the classical $\mathrm{C} = \Theta(m)$.'}
    - {measure: Np, value: '\Omega(m),\ O(m\log m)', refs: [FRPU94], note: 'Generic: $\mathrm{R}(f) \le \mathrm{N}_p(f) = O(\mathrm{R}(f)\log \mathrm{R}(f))$ [FRPU94], with $\mathrm{R} = \Theta(m)$. The $\mathrm{I}\log \mathrm{I}$ lower bound is useless here, the scorpion''s total influence being exponentially small.'}
    - {measure: robustQ, value: '\Omega(\sqrt m),\ O(m\log m)', note: 'Lower: $\mathrm{Q} \le \widetilde{\mathrm{Q}}$ and $\mathrm{Q} \ge \widetilde{\deg}/2 = \Omega(\sqrt m)$. Upper: $\widetilde{\mathrm{Q}}(f) = O(\mathrm{Q}(f)\log \mathrm{Q}(f))$ with $\mathrm{Q} = O(m)$. Inherits the whole $\widetilde{\deg}$-vs-$\deg$ gap of [[adeg]].'}
    - {measure: Advpm, value: '\Omega(\sqrt m),\ O(m)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}$ is only known to lie between $\Omega(\sqrt m)$ (from $\widetilde{\deg}$) and $O(m)$ here.'}
    - {measure: gamma2, value: '\Omega(\sqrt m),\ O(m)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), which is pinned only to $[\Omega(\sqrt m), O(m)]$ here.'}
    - {measure: MAdv, value: '\Omega(\sqrt m),\ O(m)', note: 'Squeezed between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}_{\varepsilon}$, which are equal up to constants and known here only to $[\Omega(\sqrt m), O(m)]$.'}
    - {measure: Adv, value: '\Omega(\sqrt m),\ O(m)', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}(f))$, with $\lambda = \Omega(\sqrt m)$ below and $\mathrm{Q} = O(m)$ above. Note $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = \Theta(m)$ anyway, so the positive adversary cannot prove more than $\Theta(m)$ here even in principle.'}
    - {measure: ndeg, value: '\Theta(m)', putative: true, note: 'Upper: for $m \ge 5$ the property is a *disjoint* union of $m(m-1)(m-2)$ subcubes of codimension $3m-6$, and the sum of their indicator monomial products is nonzero exactly on the scorpions, so $\mathrm{ndeg} \le 3m-6$. Lower: the restriction of the [[Q0]] entry turns $\mathrm{SCORP}_m$ into $\mathrm{AND}_{m-3}$, a polynomial nonzero exactly at $1^k$ is a multiple of $\prod_i x_i$, and restrictions never increase $\mathrm{ndeg}$, so $\mathrm{ndeg} \ge m-3$.'}
    - {measure: NQ, value: '\Theta(m)', refs: [deWolf03], note: '$\mathrm{N}\mathrm{Q}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$ exactly [deWolf03], and $\mathrm{ndeg} = \Theta(m)$ here.'}
    - {measure: rdeg, value: '\Theta(m)', note: 'Sandwiched: $\mathrm{ndeg}(f) \le \mathrm{rdeg}(f) \le \deg(f)$, with $\mathrm{ndeg} = \Theta(m)$ and $\deg = 3m-6$ here. Rational functions buy nothing exactly, just as they buy nothing on [[CONN]].'}
    - {measure: degp, value: '3m-6 \text{ for } p \ge 5', putative: true, note: 'Reduce the integer multilinear polynomial mod $p$: the top coefficient of $\prod_{e \in T}x_e$ is exactly $-6$, the six orderings of one triple $\{s,t,b\}$ each contributing $-1$ (see [[deg]]), so it survives modulo every prime $p \ge 5$ and $\deg_p = \deg = 3m-6$. It does *not* survive mod $2$ or mod $3$, and indeed exhaustive computation gives $\deg_2 = 6,\,10,\,13$ at $m = 5,6,7$ against $3m-6 = 9,\,12,\,15$ -- small characteristic genuinely helps on the scorpion, which is why [[deg2]] is left unrecorded rather than guessed.'}
    - {measure: rprt, value: '\Theta(m)', conf: medium, refs: [JainKlauck10, KLLRX15], note: 'The same sandwich as [[prt]] survives the relaxation, $\mathrm{RC}(f) \le \overline{\mathrm{prt}}(f) + O(1) \le \mathrm{prt}(f) + O(1) = O(m)$; medium confidence because the $\mathrm{RC}$ containment is the zoo''s own reading of [JainKlauck10] against the LP of [KLLRX15].'}
  witnesses:
    - {of: [D, D], setting: total, statement: 'Not a separation between measures, but the separation the evasiveness literature cares about: a nontrivial graph property with $\mathrm{D} = \Theta(\sqrt N)$ rather than $N$. Monotonicity is what makes the Aanderaa-Karp-Rosenberg conjecture plausible, and the scorpion is the reason it must be assumed.', refs: [BvEBL74]}
    - {of: [Dna, D], setting: total, statement: 'Quadratic on a natural graph property: $\mathrm{D}^{\mathrm{na}} = N$ while $\mathrm{D} = \Theta(\sqrt N)$.'}
    - {of: [Rna, R], setting: total, statement: 'The quadratic $\mathrm{D}^{\mathrm{na}}$-vs-$\mathrm{D}$ gap survives randomization: $\mathrm{R}^{\mathrm{na}} = \Theta(N)$ against $\mathrm{R} = \Theta(\sqrt N)$. Deleting the sting edge of a random scorpion is a measure-preserving involution touching a uniformly random pair, so a fixed query set has to cover a constant fraction of all pairs. Adaptivity, not randomness, is what makes the scorpion cheap.'}
  notes: |
    The Aanderaa-Karp-Rosenberg conjecture asserts that every nontrivial *monotone*
    graph property is evasive ($\mathrm{D} = \binom m2$ exactly). It is known for
    prime-power $m$ by the topological argument of [KSS84], and $\Omega(m^2)$ in
    general [RivestVuillemin76]; see [Miller13] for the survey. The scorpion property
    is not monotone -- adding an edge at the sting destroys it -- and shows that
    dropping monotonicity collapses the bound all the way to $\Theta(\sqrt N)$.

    Randomized AKR is much weaker: the best general bound for monotone properties is
    $\mathrm{R} = \Omega(m^{4/3}\log^{1/3} m)$ [ChakrabartiKhot07], against a
    conjectured $\Omega(m^2)$.
  refs: [BvEBL74, RivestVuillemin76, KSS84, LovaszYoung02, Miller13, ChakrabartiKhot07]
  see_also: [CONN, D, R]

- id: CONN
  name: Graph connectivity
  symbol: '\mathrm{CONN}_m'
  group: basic
  order: 19.3
  kind: total
  arity: '$N = \binom{m}{2}$ bits, the adjacency matrix of an $m$-vertex graph'
  scale: {var: m, subs: {N: '\binom m2'}}
  short: 'The monotone graph property everyone checks first: evasive, $\mathrm{R} = \Theta(N)$, and $\mathrm{Q} = \Theta(N^{3/4})$.'
  definition: 'Given the adjacency matrix of an undirected graph on $m$ labelled vertices, decide whether the graph is connected. Monotone (adding edges never disconnects) and nontrivial.'
  formal: '$$\mathrm{CONN}_m(G) = 1 \iff G \text{ has one connected component}.$$'
  values:
    - {measure: D, value: '\binom{m}{2} = N', refs: [Bollobas76, KSS84], note: 'Evasive for every $m \ge 2$: an adversary can always force all $\binom m2$ queries. One of the earliest properties proved evasive, and the model case for the Aanderaa-Karp-Rosenberg conjecture.'}
    - {measure: R, value: '\Theta(m^2) = \Theta(N)', note: 'Upper: $\mathrm{R} \le \mathrm{D}$. Lower: $\Omega(m^2)$ -- take a random graph on the threshold and note that a spanning-tree/isolated-vertex distinction survives $o(m^2)$ random probes. So connectivity is one of the (few) monotone graph properties where randomized AKR is known.'}
    - {measure: noisyR, value: '\Theta(m^2) = \Theta(N)', refs: [CKMPSS23], note: 'The zoo''s own [[noisyR]] vs [[R]] entry records $\mathrm{R}(f)=\Theta(n)\Rightarrow\mathrm{noisyR}(f)=\Theta(\mathrm{R}(f))$ [CKMPSS23], and the recorded $\mathrm{R}$ is linear in the arity here -- connectivity is randomised-evasive up to a constant.'}
    - {measure: Q, value: '\Theta(m^{3/2}) = \Theta(N^{3/4})', refs: [DHHM06], note: '[DHHM06]: Grover-search the neighbourhoods in a BFS, $O(m^{3/2})$ queries; and $\Omega(m^{3/2})$ by the quantum adversary. Strong connectivity of a digraph, minimum spanning tree and single-source shortest paths in the adjacency-matrix model are all $\Theta(m^{3/2})$ too.'}
    - {measure: C1, value: 'm-1', note: 'A spanning tree certifies connectivity.'}
    - {measure: C0, value: '\Theta(m^2)', note: 'To certify disconnectedness you must exhibit a cut $(S,\bar S)$ with all $|S|(m-|S|)$ edges absent; the adversary makes $|S| = m/2$, so $\mathrm{C}^0 = \Theta(m^2)$.'}
    - {measure: Advpm, value: '\Theta(m^{3/2}) = \Theta(N^{3/4})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(m^{3/2}) = \Theta(N^{3/4})$ here.'}
    - {measure: gamma2, value: '\Theta(m^{3/2}) = \Theta(N^{3/4})', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(m^{3/2}) = \Theta(N^{3/4})$ here.'}
    - {measure: Rbar, value: '\Theta(m^2) = \Theta(N)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(m^2) = \Theta(N)$ here.'}
    - {measure: MAdv, value: '\Theta(m^{3/2}) = \Theta(N^{3/4})', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(m^{3/2}) = \Theta(N^{3/4})$ here.'}
    - {measure: s1, value: 'm-1', putative: true, note: 'At a connected $G$ the sensitive coordinates are exactly the *bridges* -- adding an edge can never disconnect. A tree has $m-1$ bridges and nothing has more.'}
    - {measure: s0, value: '\lfloor m^2/4 \rfloor', putative: true, note: 'At a disconnected $G$ the sensitive coordinates are exactly the absent pairs whose insertion connects the whole graph, so $G$ must have precisely two components and every crossing pair is sensitive. Balancing them gives $\lfloor m/2\rfloor\lceil m/2\rceil$. Deleting an edge from a disconnected graph never connects it, so nothing else contributes.'}
    - {measure: s, value: '\lfloor m^2/4 \rfloor = \Theta(N)', putative: true, note: 'The $0$-side wins by a full quadratic factor: two balanced cliques are as $0$-sensitive as a graph can be, while $1$-sensitivity is capped by the $m-1$ bridges of a tree.'}
    - {measure: bs1, value: 'm-1', putative: true, note: 'Squeezed between $\mathrm{s}^1 = m-1$ and $\mathrm{C}^1 = m-1$.'}
    - {measure: bs0, value: '\Theta(m^2) = \Theta(N)', note: 'Squeezed between $\mathrm{s}^0 = \lfloor m^2/4\rfloor$ and $\mathrm{C}^0 = \Theta(m^2)$.'}
    - {measure: bs, value: '\Theta(m^2) = \Theta(N)', note: 'From $\mathrm{bs}^0$.'}
    - {measure: fbs, value: '\Theta(m^2) = \Theta(N)', note: 'Squeezed between $\mathrm{bs}$ and $\mathrm{C}$, both $\Theta(N)$.'}
    - {measure: FC, value: '\Theta(m^2) = \Theta(N)', note: '$\mathrm{FC} = \mathrm{fbs}$ exactly, by LP duality, and $\mathrm{fbs} = \Theta(m^2)$ here.'}
    - {measure: RC, value: '\Theta(m^2) = \Theta(N)', note: '$\mathrm{RC} = \Theta(\mathrm{fbs})$, and $\mathrm{fbs} = \Theta(m^2)$ here.'}
    - {measure: C, value: '\Theta(m^2) = \Theta(N)', note: '$\max(\mathrm{C}^0, \mathrm{C}^1)$, i.e. the cut side.'}
    - {measure: Cmin, value: 'm-1', putative: true, note: 'Both kinds of certificate need $m-1$ coordinates and both achieve it: a spanning tree on the connected side, an isolated vertex on the disconnected side. So $\mathrm{C}_{\min} = \Theta(\sqrt{\mathrm{C}})$ -- connectivity is one of the cleanest natural examples of certificate complexity that varies quadratically across inputs.'}
    - {measure: Dna, value: '\binom{m}{2} = N', note: 'Every pair is relevant, so a non-adaptive algorithm reads everything. Here that is no loss at all: $\mathrm{D}=N$ already, connectivity being evasive.'}
    - {measure: Rna, value: '\Theta(m^2) = \Theta(N)', note: 'Sandwiched between $\mathrm{R} = \Theta(N)$ and $\mathrm{D}^{\mathrm{na}} = N$.'}
    - {measure: R0, value: '\Theta(m^2) = \Theta(N)', note: 'Sandwiched between $\mathrm{R} = \Theta(N)$ and $\mathrm{D} = N$.'}
    - {measure: R1, value: '\Theta(m^2) = \Theta(N)', note: 'Sandwiched between $\mathrm{R} = \Theta(N)$ and $\mathrm{D} = N$.'}
    - {measure: deg, value: '\binom{m}{2} = N', putative: true, note: 'Full degree, so connectivity is evasive for the polynomial method too. The coefficient of the top monomial $\prod_e x_e$ in the multilinear extension is $\sum_{S}(-1)^{N-|S|}\mathrm{CONN}(S) = \pm\sum_{S \text{ connected}}(-1)^{|S|}$, and the classical alternating count of connected spanning subgraphs of $K_m$ is $(-1)^{m-1}(m-1)!$ -- never zero. Verified by exact expansion for $m \le 6$, where the top coefficient is $\pm 2, \pm 6, \pm 24, \pm 120$.'}
    - {measure: QE, value: '\Theta(m^2) = \Theta(N)', note: 'Sandwiched between $\deg/2 = N/2$ and $\mathrm{D} = N$. Exact quantum computation buys at most a factor $2$ on connectivity, while bounded error buys the $\Theta(N^{3/4})$ of [[Q]].'}
    - {measure: Q0, value: '\Omega(m^{3/2}),\ O(m^2)', note: 'Between $\mathrm{Q} = \Theta(m^{3/2})$ and $\mathrm{Q}_{\mathrm{E}} = O(m^2)$. Whether zero-error connectivity is as hard as exact connectivity is open as far as the zoo knows; note that the [DHHM06] algorithm is Grover-based and therefore genuinely bounded-error.'}
    - {measure: SP, value: '\binom{m}{2} = N', putative: true, note: 'A monochromatic subcube partition writes $f$ as a sum of indicators of conjunctions of $\le \mathrm{SP}$ literals with no cancellation, so $\deg \le \mathrm{SP} \le \mathrm{UC} \le \mathrm{D}$; here $\deg = \mathrm{D} = N$ and the whole chain collapses.'}
    - {measure: UC, value: '\binom{m}{2} = N', putative: true, note: 'Pinned by the same collapse; see [[SP]]. Note the contrast with $\mathrm{C}_{\min} = m-1$: a spanning tree is a perfectly good certificate, but no *unambiguous* family can be narrow anywhere near everywhere.'}
    - {measure: EC, value: '\Theta(m^2) = \Theta(N)', note: 'Squeezed between $\mathrm{fbs} = \Theta(m^2)$ and $\mathrm{C} = \Theta(m^2)$.'}
    - {measure: deg2, value: '\lfloor m^2/4 \rfloor', putative: true, note: 'Over $\mathbb{F}_2$ the coefficient of $x_S$ is the number of connected spanning subgraphs of $(V,S)$ mod $2$, and that count is **odd exactly when $(V,S)$ is connected and bipartite**. (Proof: both sides satisfy the deletion-contraction recursion $N(H) = N(H/e)+N(H-e)$ mod $2$ -- contracting a non-bridge of a bipartite graph creates an odd cycle, contracting a bridge preserves bipartiteness -- with the same base cases.) So $\deg_2$ is the largest number of edges in a connected bipartite graph on $m$ vertices, namely $K_{\lfloor m/2\rfloor,\lceil m/2\rceil}$. Verified exhaustively over all graphs on $m \le 6$ vertices, and the value $2,4,6,9,12$ for $m = 3,\dots,7$. So $\deg_2 = (\tfrac12+o(1))\deg$ -- connectivity loses exactly half its degree over $\mathbb{F}_2$.'}
    - {measure: Inf, value: '\Theta(m^2 2^{-m})', putative: true, note: 'A uniformly random graph is connected with probability $1-\Theta(m2^{-m})$, and a pair $uv$ is sensitive only in the two degenerate ways: $uv$ is a *bridge* with one endpoint pendant, or one endpoint is *isolated* and $uv$ would attach it. Each has probability $2^{2-m}$, so $\mathrm{I}(f) = (1+o(1))\binom m2 2^{3-m}$. Confirmed numerically: the ratio to $\binom m2 2^{3-m}$ is $0.50,\,0.63,\,0.78,\,0.91,\,0.97$ at $m = 3,\dots,7$. Average sensitivity is thus exponentially below $\mathrm{s} = \lfloor m^2/4\rfloor$ -- connectivity is a wildly unbalanced function.'}
    - {measure: adeg, value: '\Omega(m),\ O(m^{3/2})', note: 'Lower: $\mathrm{bs} \le 6\widetilde{\deg}^2$ [NS94] against $\mathrm{bs} = \Theta(m^2)$. Upper: $\widetilde{\deg} \le 2\mathrm{Q} = O(m^{3/2})$. The $\Omega(m^{3/2})$ lower bound for [[Q]] is an adversary bound, not a polynomial one, so the zoo does not know that $\widetilde{\deg}$ matches it.'}
    - {measure: lambda, value: '\Omega(m),\ O(m^{3/2})', note: 'Lower: $\lambda \ge \sqrt{\deg} = \sqrt{N} = \Theta(m)$ [Huang19]. Upper: $\lambda \le \sqrt{\mathrm{s}^0\mathrm{s}^1} = \sqrt{\lfloor m^2/4\rfloor(m-1)} = \Theta(m^{3/2})$, far below $\mathrm{s} = \Theta(m^2)$. Exact diagonalisation of the sensitivity graph gives $\lambda = 2,\ 3.126,\ 4.356,\ 5.674$ at $m = 3,4,5,6$, i.e. $\lambda/m^{3/2} = 0.385,\ 0.391,\ 0.390,\ 0.386$ -- so the upper end looks like the truth, and $\lambda$ would then match $\mathrm{Q} = \Theta(m^{3/2})$ exactly.'}
    - {measure: cbs, value: '\Theta(m^2) = \Theta(N)', note: 'For a Boolean function the solution to be produced is forced, so $\mathrm{cbs}$ degenerates to $\mathrm{bs}$ ([[cbs]] vs [[bs]]); here $\mathrm{bs} = \Theta(m^2)$.'}
    - {measure: psD, value: '\Theta(m^2) = \Theta(N)', note: 'For a Boolean function the canonical answer is forced, so $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ ([[psD]] vs [[R]]); here $\mathrm{R} = \Theta(m^2)$.'}
    - {measure: Dmu, value: '\Theta(m^2) = \Theta(N)', refs: [Yao77], note: 'Worst case over $\mu$: Yao''s minimax gives $\max_\mu \mathrm{D}^{\mu}_{\varepsilon}(f) = \mathrm{R}_{\varepsilon}(f) = \Theta(m^2)$.'}
    - {measure: RS, value: '\Theta(m^2) = \Theta(N)', note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)/(1-2\varepsilon)$, and $\mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(m^2)$ meets $\mathrm{R} = \Theta(m^2)$. Connectivity therefore composes perfectly: $\mathrm{R}(\mathrm{CONN}_m \circ g^N) = \Omega(N\,\mathrm{R}(g))$.'}
    - {measure: chi, value: '\Theta(m^2) = \Theta(N)', note: 'Sandwiched: $\chi(f) = \Omega(\mathrm{bs}(f))$ and $\chi(f) \lesssim \mathrm{RS}(f)$, both $\Theta(m^2)$ here. The whole inner-measure chain $\chi \lesssim \mathrm{RS} \lesssim \bar\chi \lesssim \mathrm{LR} \lesssim \mathrm{R}$ collapses on a randomised-evasive function.'}
    - {measure: chibar, value: '\Theta(m^2) = \Theta(N)', note: 'Squeezed inside $\mathrm{RS} \lesssim \bar\chi \lesssim \mathrm{LR} \lesssim \mathrm{R}$, with $\mathrm{RS} = \Theta(m^2)$ and $\mathrm{R} = \Theta(m^2)$.'}
    - {measure: LR, value: '\Theta(m^2) = \Theta(N)', note: 'Squeezed between $\bar\chi = \Theta(m^2)$ and $\mathrm{R} = \Theta(m^2)$.'}
    - {measure: Rstar, value: '\Theta(m^2) = \Theta(N)', note: 'Squeezed between $\mathrm{LR} = \Theta(m^2)$ and $\mathrm{R} = \Theta(m^2)$.'}
    - {measure: CA, value: '\Theta(m^2) = \Theta(N)', refs: [ABIKPS17], note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for total $f$ [ABIKPS17], and $\mathrm{fbs} = \Theta(m^2)$ here.'}
    - {measure: CGpub, value: '\Theta(m^2) = \Theta(N)', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{CG}^{*}) = \Theta(\mathrm{CG}^{\mathrm{ns}}) = \Theta(\mathrm{CA})$, the non-signaling bottleneck [CGLMSG23], and $\mathrm{CA} = \Theta(m^2)$ here.'}
    - {measure: CGstar, value: '\Theta(m^2) = \Theta(N)', refs: [CGLMSG23], note: 'Entanglement buys nothing beyond the non-signaling value: $\mathrm{CG}^{*} = \Theta(\mathrm{CA}) = \Theta(m^2)$. Note the contrast with [[Q]], where quantum queries do buy the factor $\sqrt m$.'}
    - {measure: CGns, value: '\Theta(m^2) = \Theta(N)', refs: [CGLMSG23], note: 'The non-signaling relaxation is already $\Theta(\mathrm{CA}) = \Theta(m^2)$.'}
    - {measure: CG, value: '\Theta(m^3) = \Theta(N^{3/2})', putative: true, refs: [CGLMSG23], note: 'Both ends of the [CGLMSG23] sandwich land on $m^3$: $\mathrm{Adv}(f)^2 = \Theta(m^{3/2})^2 = \Theta(m^3)$ from below, and $\mathrm{C}^0\mathrm{C}^1 = \Theta(m^2)\cdot(m-1) = \Theta(m^3)$ from above. So connectivity is one of the sharpest examples in the zoo of $\mathrm{CG}$ exceeding the arity -- $\mathrm{CG} = \Theta(N^{3/2})$ on $N = \binom{m}{2}$ variables.'}
    - {measure: prt, value: '\Theta(m^2) = \Theta(N)', refs: [JainKlauck10], note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{prt}(f) + O(1) \le 2\,\mathrm{R}(f) + O(1)$, with $\mathrm{RC} = \Theta(m^2)$ and $\mathrm{R} = \Theta(m^2)$ here. The LP bound is tight on connectivity, so the $\Theta(N)$ randomized lower bound is already visible to the partition bound.'}
    - {measure: rprt, value: '\Theta(m^2) = \Theta(N)', conf: medium, refs: [JainKlauck10, KLLRX15], note: 'The [[prt]] sandwich survives the relaxation, $\mathrm{RC}(f) \le \overline{\mathrm{prt}}(f) + O(1) \le \mathrm{prt}(f) + O(1) = O(m^2)$; medium confidence because the $\mathrm{RC}$ containment is the zoo''s own reading of [JainKlauck10] against the LP of [KLLRX15].'}
    - {measure: QC, value: '\Theta(m) = \Theta(\sqrt N)', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{fbs}(f)})$ [Aaronson08], and $\mathrm{fbs} = \Theta(m^2)$ here. The $1$-side already has a classical certificate of size $m-1$ (a spanning tree); what the quantum verifier compresses is the $\Theta(m^2)$-edge cut on the $0$-side.'}
    - {measure: Np, value: '\Omega(m^2),\ O(m^2\log m)', refs: [FRPU94], note: 'Generic: $\mathrm{R}(f) \le \mathrm{N}_p(f) = O(\mathrm{R}(f)\log \mathrm{R}(f))$ [FRPU94], with $\mathrm{R} = \Theta(m^2)$. Whether the logarithm is needed is exactly the question of whether noisy connectivity is harder than noiseless; the $\mathrm{I}\log\mathrm{I}$ lower bound gives nothing, $\mathrm{I}(f)$ being exponentially small.'}
    - {measure: robustQ, value: '\Omega(m^{3/2}),\ O(m^{3/2}\log m)', note: 'Generic: $\mathrm{Q}(f) \le \widetilde{\mathrm{Q}}(f) = O(\mathrm{Q}(f)\log \mathrm{Q}(f))$, with $\mathrm{Q} = \Theta(m^{3/2})$.'}
    - {measure: Adv, value: '\Theta(m^{3/2}) = \Theta(N^{3/4})', refs: [DHHM06], note: 'The recorded $\Omega(m^{3/2})$ lower bound for [[Q]] is an adversary bound [DHHM06], so $\mathrm{Adv} = \Omega(m^{3/2})$; and $\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = O(m^{3/2})$. The positive adversary is exactly optimal here, and it meets its own certificate barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = \Theta(m^{3/2})$ -- connectivity is one of the cleanest total functions where that barrier is attained rather than obstructive.'}
    - {measure: ndeg, value: 'm-1', putative: true, note: 'Exactly. Upper: the spanning-tree generating polynomial $\tau(G) = \sum_{T}\prod_{e \in T}x_e$ (the reduced Laplacian determinant of the matrix-tree theorem) is multilinear of degree $m-1$ and is nonzero precisely when $G$ is connected, all its terms being non-negative. Lower: fix a spanning tree''s $m-1$ pairs free and all other pairs absent; the restriction is $\mathrm{AND}_{m-1}$, a polynomial nonzero exactly at $1^{k}$ is a multiple of $\prod_i x_i$, and restrictions never increase $\mathrm{ndeg}$. So the *nondeterministic* degree of connectivity is $\Theta(\sqrt N)$, a quadratic drop from $\deg = N$.'}
    - {measure: NQ, value: '\lceil (m-1)/2 \rceil = \Theta(\sqrt N)', refs: [deWolf03], note: '$\mathrm{N}\mathrm{Q}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$ exactly [deWolf03], and $\mathrm{ndeg} = m-1$ here. Nondeterministic quantum connectivity thus costs $\Theta(\sqrt N)$, below even $\mathrm{Q} = \Theta(N^{3/4})$: guessing a spanning tree is much easier than finding one.'}
    - {measure: rdeg, value: '\Theta(m^2) = \Theta(N)', putative: true, note: 'Rational functions buy essentially nothing. Use the characterisation $\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\} \le \mathrm{C}(f)$: the $0$-side is expensive, since fixing all pairs inside a balanced bipartition $(A,B)$ to *present* and leaving the $\lfloor m^2/4\rfloor$ crossing pairs free makes the restriction $\mathrm{OR}$, whence $\mathrm{ndeg}(\bar f) \ge \mathrm{ndeg}(\mathrm{NOR}_{\lfloor m^2/4\rfloor}) = \lfloor m^2/4\rfloor$; and $\mathrm{C} = \Theta(m^2)$ caps it. Contrast $\mathrm{ndeg} = m-1$: the asymmetry between spanning trees and cuts is exactly what rational degree cannot exploit.'}
    - {measure: degp, value: 'N \text{ for } p \ge m', putative: true, note: 'The top coefficient of the multilinear expansion is $\pm(m-1)!$ (see [[deg]]), invertible modulo every prime $p \ge m$, so $\deg_p = \deg = N$ there. For small primes it does vanish, and dramatically so: [[deg2]] is only $\lfloor m^2/4\rfloor$.'}
    - {measure: PDT, value: '\Theta(m^2) = \Theta(N)', note: 'Sandwiched: $\deg_2(f) \le \mathrm{D}^{\oplus}(f) \le \mathrm{D}(f)$, with $\deg_2 = \lfloor m^2/4\rfloor$ and $\mathrm{D} = N$ here. Parity queries save at most the factor $2$ that $\mathbb{F}_2$-degree already saves -- connectivity is evasive up to a constant even for parity decision trees.'}
    - {measure: Fdim, value: '\binom{m}{2} = N', putative: true, note: 'Full, so the Fourier support spans everything and no change of basis helps. The support lies in a proper subspace exactly when $f(x \oplus a) = f(x)$ identically for some $a \ne 0$, the shifted function having coefficients $(-1)^{a\cdot S}\hat f(S)$. Given $a \ne 0$, pick a vertex $u$ meeting some pair of $a$ and let $x$ be the graph consisting of the pairs of $a$ at $u$ together with *all* pairs inside $V \setminus \{u\}$: then $x$ is connected, while $x \oplus a$ deletes every edge at $u$ and adds none, isolating $u$. So no such $a$ exists.'}
    - {measure: Inf1, value: '\Theta(m^2 2^{-m})', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide term by term, so $\mathrm{I}^{1}(f) = \mathrm{I}(f) = (1+o(1))\binom m2 2^{3-m}$; see [[Inf]].'}
    - {measure: MaxInf, value: '(1+o(1))\,2^{3-m}', putative: true, note: 'Connectivity is invariant under relabelling vertices and the symmetric group is transitive on pairs, so every coordinate carries the same influence and $\mathrm{MaxInf} = \mathrm{I}(f)/N = (1+o(1))2^{3-m}$. Exact computation gives $\mathrm{I}(f)/N = 0.0608$ at $m = 7$ against $2^{3-m} = 0.0625$.'}
    - {measure: NS, value: '(1+o(1))\,m\,2^{2-m}\big(1-(1-\delta)^{m-1}\big)', putative: true, note: 'Noise sensitivity is $2\Pr[f(x)=1,f(y)=0] = 2(\Pr[\text{disconnected}] - \Pr[\text{both disconnected}])$. Disconnection is dominated by a single isolated vertex, of probability $m2^{1-m}$, and a vertex is isolated in *both* $x$ and its $\delta$-noisy copy with probability $((1-\delta)/2)^{m-1}$ per vertex, whence the formula. Consistency: as $\delta \to 0$ it tends to $m(m-1)2^{2-m}\delta = \delta\,\mathrm{I}(f)$, exactly the recorded [[Inf]]. Exact computation gives ratios $0.60,\,0.74,\,0.86,\,0.93$ to the formula at $m = 4,5,6,7$ with $\delta = 0.05$ -- the same slow $1+o(1)$ convergence as [[Inf]] itself.'}
    - {measure: Stab, value: '1 - (1+o(1))\,m\,2^{3-m}\big(1-(\tfrac{1+\rho}{2})^{m-1}\big)', putative: true, note: 'From $\mathrm{Stab}_{\rho} = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$ and the [[NS]] entry. For every fixed $\rho < 1$ stability is $1 - \Theta(m2^{-m})$: almost all the Fourier mass of the $\pm1$ version sits on the empty set, which is why $\mathrm{I}(f) = o(1)$ while $\mathrm{s} = \Theta(N)$.'}
    - {measure: D_prod, value: '\Theta(m^2) = \Theta(N)', putative: true, note: 'Product distributions are worst-case here. Upper: $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R} = \Theta(m^2)$. Lower: split the vertices into halves $A$ and $B$ and fix every edge inside $A$ and inside $B$ to be present. The graph is then connected iff at least one of the $\lfloor m^2/4\rfloor$ free $A$-$B$ edges is present, i.e. the restriction is $\mathrm{OR}_{\lfloor m^2/4\rfloor}$, and $\mathrm{D}^{\mathrm{prod}}(\mathrm{OR}_k) = \Theta(k)$: take each bit $1$ independently with probability $1/k$, so that after $d$ observed zeros the conditional probability of $\mathrm{OR} = 1$ is $1-(1-1/k)^{k-d}$, still above $1/3$ until $d \ge 0.59k$.'}
    - {measure: UCmin, value: '\Theta(m^2) = \Theta(N)', putative: true, note: 'The one-sided relaxation buys nothing, but for a softer reason than on [[MinskyPapert]]: the $0$-side is genuinely cheap to cover unambiguously and it is still $\Theta(N)$. Cover: for each connected vertex set $S \ni v_1$ with $S \ne V$, take the certificate that specifies *every* edge inside $S$ together with all $|S|(m-|S|)$ cross edges absent. Each disconnected graph matches exactly one of these -- $S$ is forced to be the component of $v_1$ -- so $\mathrm{UC}^0 \le N$, and $\mathrm{UC}^0 \ge \mathrm{C}^0 = \Theta(m^2)$. The lower bound on the min is $\mathrm{fbs} \le 2\,\mathrm{UC}_{\min} - 1$ ([[fbs]] vs [[UCmin]]) with $\mathrm{fbs} = \Theta(m^2)$.'}
    - {measure: cjdeg, value: '\Omega(m),\ O(m^2)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)$ ([[adeg]] vs [[cjdeg]], [[cjdeg]] vs [[R]]), with $\widetilde{\deg} \in [\Omega(m), O(m^{3/2})]$ and $\mathrm{R} = \Theta(m^2)$. Even pinning $\widetilde{\deg}$ would leave a $\sqrt N$ window here.'}
  witnesses:
    - {of: [R, Q], setting: total, statement: 'A clean quadratic-in-the-vertex-count gap on a natural total function: $\mathrm{R} = \Theta(m^2)$ against $\mathrm{Q} = \Theta(m^{3/2})$, i.e. $\mathrm{R} = \Theta(\mathrm{Q}^{4/3})$ in the query count.', refs: [DHHM06]}
    - {of: [C0, C1], setting: total, statement: '$\mathrm{C}^1 = m-1$ against $\mathrm{C}^0 = \Theta(m^2)$: certificate complexity is wildly one-sided, and $\mathrm{D} = \binom m2 = \Theta(\mathrm{C}^0\mathrm{C}^1/m)$.'}
    - {of: [s0, s1], setting: total, statement: 'Quadratic: $\mathrm{s}^0 = \lfloor m^2/4\rfloor$ against $\mathrm{s}^1 = m-1$, i.e. $\mathrm{s}^0 = \Theta((\mathrm{s}^1)^2)$, on a thoroughly natural monotone property.'}
    - {of: [C, Cmin], setting: total, statement: 'Quadratic: $\mathrm{C} = \Theta(m^2)$ at a balanced cut against $\mathrm{C}_{\min} = m-1$ at a tree or an isolated vertex.'}
  notes: |
    Connectivity is the standard illustration of the gap between the three graph
    query models. In the *adjacency matrix* model above it is $\Theta(m^{3/2})$
    quantumly; in the *adjacency list* model [DHHM06] give $\Theta(m)$ for a graph
    with $m$ edges. The zoo records the matrix model, since that is the one that is a
    Boolean function on $\binom m2$ bits.
  refs: [Bollobas76, KSS84, DHHM06, RivestVuillemin76, ChakrabartiKhot07, LovaszYoung02]
  see_also: [SCORPION, D, R, Q, C0, C1]
