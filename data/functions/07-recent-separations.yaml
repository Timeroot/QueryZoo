  id: MeiburgParityPointer
  name: Meiburg’s parity-pointer family
  symbol: P_q
  order: 70
  arity: $N_q=\Theta(q^4\log q)$ bits
  short: A total logarithmic separation of sabotage from conflict, max-conflict, linearised and randomized
    query complexity.
  definition: The encoded pointer block $g_q$ is the succinct total pointer function in [Meiburg26composition,
    Section 3], with an exact one-sided detector. Write $m_q=q^3\log q$; $q$ is odd for the majority families.
    The parity family is $P_q=\mathrm{XOR}_q\circ g_q^q$.
