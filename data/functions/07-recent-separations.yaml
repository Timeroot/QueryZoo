- id: OpenAIQuarticRQ
  name: OpenAI’s nearly quartic randomized–quantum family
  symbol: F_{k,m}
  group: composed
  order: 75
  kind: total
  arity: A winner-column construction on $m$ columns, with address and certificate arrays; $k\ge2$ is
    fixed and $m$ ranges over sufficiently large powers of four.
  short: Settles the optimal total-function $\mathrm{R}$-versus-$\mathrm{Q}$ exponent at $4$.
  definition: Each column contains an $m$-bit string and an address-indexed certificate array. A unique
    winner has an all-one string and a valid certificate pointing to a zero in every other column. Addresses
    are computed by instances of the Bansal–Sinha partial-function separation. A quantum tournament finds
    a short list containing the winner; a randomized algorithm must find an erased zero or the correctly
    addressed filled cell [OpenAI26QuarticRQ, Sections 2–4].
  values:
  - measure: Q
    value: \widetilde O(\sqrt m)
    refs:
    - OpenAI26QuarticRQ
    note: For each fixed k, Q≤C_k sqrt(m)(log m)^{b_k}. Constants and the log exponent may depend on k.
  - measure: R
    value: \Omega(m^{2-1/k}/\log^2m)
    refs:
    - OpenAI26QuarticRQ
    note: Theorem 1.1, for each fixed k≥2.
  witnesses:
  - of:
    - R
    - Q
    setting: total
    statement: For every $\alpha<4$, there is a fixed $k$ for which $\mathrm{R}(F_{k,m})/(1+\mathrm{Q}(F_{k,m}))^\alpha\to\infty$.
    refs:
    - OpenAI26QuarticRQ
  notes: The fixed-k separation exponent is $4-2/k$ up to polylogarithmic factors. Varying k proves that
    the optimal universal power is 4; the paper does not state a fixed-k $\widetilde\Omega(\mathrm{Q}^4)$
    lower bound. The general upper bound is $\mathrm{R}\le\mathrm{D}=O(\mathrm{Q}^4)$ [ABKRT21].
    Will Cook provides a [great exposition](https://wcook04.github.io/quartic-query-lean/#/read/expert?v=lean&d=QuarticQuery.theorem_1_1_unconditional)
    and a [Lean proof, with instructions for reproducing the formal checks](https://github.com/wcook04/quartic-query-lean#reproducing-the-formal-checks).
  refs:
  - OpenAI26QuarticRQ
  - ABKRT21
  see_also:
  - R
  - Q
  - open-R-vs-Q
  - kForrelation
  - AIKCheatSheet
- id: AIKDNFComplement
  name: Complement of the Ambainis–Iraids–Kokainis DNF
  symbol: \overline f_{\mathrm{AIK}}
  group: composed
  order: 76
  kind: total
  arity: $N=n^2$ bits
  scale:
    var: n
    subs:
      N: n^2
  short: Logarithm-free quadratic $\mathrm{C}$ versus certain-acceptance one-sided $\mathrm{R}^1$ separation.
  definition: Take the Boolean complement of [[AIKDNF]]. The AIK one-sided algorithm rejects every negative
    DNF input with certainty and accepts positive inputs with probability at least 2/3. Flipping its answer
    gives an algorithm with certain acceptance on every positive input of the complement, matching this
    catalog’s [[R1]] convention.
  values:
  - measure: C
    value: \Theta(n^2)
    refs:
    - AIK26
    note: Certificate complexity is invariant under output complementation; Theorem 2.2.
  - measure: R
    value: \Theta(n)
    refs:
    - AIK26
    note: Bounded-error randomized complexity is invariant under output complementation.
  - measure: R1
    value: \Theta(n)
    refs:
    - AIK26
    note: R¹(¬f)=R_RP(f) under the catalog conventions. Theorem 2.2 gives the upper bound; C=O(R²) gives
      the matching lower bound.
  notes: The paper calls its certain-rejection measure $\mathrm{R}_1$; this catalog calls it [[R1RP]].
    The legacy [[R1]] entry fixes the other output side. The original and complementary DNF witnesses
    therefore settle both one-sided columns without identifying the two measures on the same function.
  refs:
  - AIK26
  - Nisan91
  see_also:
  - C
  - R
  - R1
  - R1RP
  - AIKDNF
