  - measure: QC
    value: \Theta(m)
    refs:
    - Aaronson08
    - KLLPV26
    note: QC=Θ(√fbs).
  - measure: QEcert
    value: \Omega(m^{3/2}/\log^2 m),\ O(m^{3/2})
    refs:
    - KLLPV26
    note: 2QEcert≥degcert and QEcert=O(Q₀).
  - measure: Q0cert
    value: \Omega(m^{3/2}/\log^2 m),\ O(m^{3/2})
    refs:
    - KLLPV26
    note: Theorem 5 and the QEcert bounds.
  - measure: osdeg
    value: \Omega(m^{3/2}/\log^2 m),\ O(m^{3/2})
    refs:
    - KLLPV26
    note: degcert=O(osdeg) and osdeg=O(Q₀).
