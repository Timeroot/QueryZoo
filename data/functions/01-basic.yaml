# =====================================================================
# FUNCTIONS: the basic building blocks.
#
# Schema (see data/functions/README or the "Editing" page):
#   id        : slug, unique across ALL function files
#   name / symbol (LaTeX, no $) / aliases / group / order
#   kind      : total | partial | relation
#   arity     : human-readable description of the input size
#   short     : one-liner
#   definition: markdown + LaTeX, informal is fine
#   formal    : the exact mathematical description. If absent, the function
#               page shows a "definition not yet transcribed" banner and the
#               function is listed on the /functions "stubs" list.
#   values    : list of {measure, value, note, refs, conf}
#               `value` is LaTeX (no $). `conf` in {high, medium, low}.
#               NOT decoration: the build compares every pair of values on a
#               family and emits the separation it proves. \Theta(.) and bare
#               expressions bound the measure from both sides, O(.)/\le only
#               from above, \Omega(.)/\ge only from below, and that is
#               respected -- an O(.) value can never witness a separation.
#   scale     : {var, subs, note} -- the asymptotic parameter of the family,
#               and every other name in terms of it, e.g.
#                 scale: {var: m, subs: {N: '\binom m2'}}
#               Needed only when the values use more than one name for the
#               same parameter; with one name the build infers it. Prefer the
#               smallest variable (var: d, subs: {N: '2^d'}), which keeps
#               values like N^{0.753} exact. Omit it for a family with two
#               genuinely free parameters -- the build then skips the family
#               instead of inventing separations, and says so in its report.
#   witnesses : list of {of: [M1, M2], setting, statement, refs}
#               meaning: this family witnesses "M1 can be this much bigger
#               than M2" in the given setting.  Use of: ['*','*'] for a
#               witness that is not about one specific pair.
#   refs / see_also / notes
# =====================================================================

functions:

- id: OR
  name: OR
  symbol: '\mathrm{OR}_n'
  aliases: ['unstructured search (decision version)', '\vee']
  group: basic
  order: 10
  kind: total
  arity: '$n$ bits'
  short: 'The archetypal one-sided function: cheap 1-certificates, expensive 0-certificates.'
  definition: |
    $\mathrm{OR}_n(x) = 1$ iff some $x_i = 1$.
  formal: |
    $$\mathrm{OR}_n : \{0,1\}^n \to \{0,1\},\qquad \mathrm{OR}_n(x) \;=\; \bigvee_{i=1}^n x_i
      \;=\; 1 - \prod_{i=1}^n (1-x_i).$$
  values:
    - {measure: D,    value: 'n'}
    - {measure: R0,   value: 'n'}
    - {measure: R,    value: '\Theta(n)'}
    - {measure: noisyR, value: '\Theta(n)', note: 'From $\mathrm{R}(f) = \Theta(n) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ [CKMPSS23] -- see the [[noisyR]] vs [[R]] record. At the top of the range there is no room for fractional queries to help.'}
    - {measure: Q,    value: '\Theta(\sqrt{n})', refs: [Grover96, BBBV97], note: 'Grover upper bound, BBBV lower bound. Exactly $\tfrac{\pi}{4}\sqrt n$ asymptotically.'}
    - {measure: QE,   value: 'n', refs: [BBCMdW01]}
    - {measure: deg,  value: 'n'}
    - {measure: adeg, value: '\Theta(\sqrt{n})', refs: [NS94, Paturi92]}
    - {measure: sdeg, value: '1', note: 'A linear threshold function: $\sum_i x_i \ge 1$.'}
    - {measure: ndeg, value: '1', note: '$p(x)=\sum_i x_i$ vanishes exactly on $\mathrm{OR}^{-1}(0)$.'}
    - {measure: rdeg, value: 'n', refs: [IJKKKSWW23], note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\} = \max\{1, n\}$.'}
    - {measure: s0,   value: 'n'}
    - {measure: s1,   value: '1'}
    - {measure: s,    value: 'n'}
    - {measure: bs,   value: 'n'}
    - {measure: fbs,  value: 'n'}
    - {measure: C0,   value: 'n'}
    - {measure: C1,   value: '1'}
    - {measure: C,    value: 'n'}
    - {measure: RC,   value: '\Theta(n)'}
    - {measure: lambda, value: '\sqrt{n}', refs: [ABKRT21], note: 'Sensitivity graph is a star $K_{1,n}$ plus isolated edges; $\|K_{1,n}\| = \sqrt n$.'}
    - {measure: PDT,  value: 'n'}
    - {measure: Inf,  value: 'n\,2^{1-n}', note: 'Vanishingly small: OR is very noise-stable.'}
    - {measure: Np,   value: '\Theta(n)', conf: medium, refs: [FRPU94], note: 'Constant-rate noise costs only a constant factor here, unlike PARITY.'}
    - {measure: FC,     value: 'n', refs: [Aaronson08], note: 'Equal to $\mathrm{fbs}$ by LP duality; the LP is integral here because at $0^n$ every coordinate must carry weight $1$.'}
    - {measure: EC,     value: 'n', refs: [GJKKLSSV17], note: 'Sandwiched between $\mathrm{fbs}=n$ and $\mathrm{C}=n$.'}
    - {measure: bs0,    value: 'n'}
    - {measure: bs1,    value: '1'}
    - {measure: Cmin,   value: '1', note: 'Any $1$-input is certified by a single $1$.'}
    - {measure: UC,     value: 'n', note: 'At least $\mathrm{C}=n$; and the "first $1$" family -- $x_1=\cdots=x_{i-1}=0,\,x_i=1$ for each $i$, together with $0^n$ -- is unambiguous with all certificates of size $\le n$.'}
    - {measure: UCmin,  value: 'n', putative: true, refs: [BHT17], note: '**Corrected.** $\mathrm{UC}_{\min} = \min\{\mathrm{UC}^0,\mathrm{UC}^1\}$ is the *one-sided* version, not a minimum over inputs. $\mathrm{UC}^0 = n$ because $0^n$ is the only $0$-input and its certificate must fix every bit. $\mathrm{UC}^1 = n$ too: an unambiguous $1$-cover partitions the $2^n-1$ ones-inputs into subcubes of sizes $2^{n-c_i}$, and an odd total forces some $c_i = n$. Consistent with the two general bounds $\mathrm{D} \le \mathrm{UC}_{\min}^2$ and $\mathrm{fbs} \le 2\,\mathrm{UC}_{\min}-1$ [BHT17], both of which the old value $1$ violated.'}
    - {measure: SP,     value: 'n', note: 'The subcube containing $0^n$ must fix all $n$ coordinates, since any free coordinate could be set to $1$; the "first $1$" tree achieves codimension $n$.'}
    - {measure: rank,   value: '1', note: 'The "first $1$" tree is a caterpillar -- every internal node has a leaf child -- and rank $0$ would mean $f$ is constant.'}
    - {measure: D_size, value: 'n+1', note: 'The caterpillar has $n+1$ leaves. Conversely the unique $0$-input sits at depth $n$ in any tree, and each of the $n$ branches leaving that path reaches a different leaf.'}
    - {measure: Dna,    value: 'n', note: 'Every variable is relevant.'}
    - {measure: Rna,    value: '\Theta(n)', note: 'A fixed distribution over query sets of size $m$ leaves some coordinate unqueried with probability $\ge 1-m/n$, and $0^n$ versus $e_i$ is then undecidable; so $m=\Omega(n)$.'}
    - {measure: QC,     value: '\Theta(\sqrt n)', refs: [Aaronson08], note: 'Quantum certificate complexity is $\Theta(\sqrt{\mathrm{RC}})$; for OR this is the Grover-verification bound.'}
    - {measure: NQ,     value: '1', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil$ and $\mathrm{ndeg}(\mathrm{OR})=1$.'}
    - {measure: Q0,     value: '\Theta(n)', note: 'Squeezed between $\deg/2 = n/2$ and $\mathrm{D} = n$. Zero error costs the full $n$: the $\Theta(\sqrt n)$ of Grover is bought entirely with bounded error.'}
    - {measure: odeg,   value: '1', refs: [BT22], note: '$p(x)=\sum_i x_i$ is $0$ at the unique $0$-input and $\ge 1$ at every $1$-input. The extreme case of one-sided approximation being cheaper than two-sided ($\widetilde{\deg}=\Theta(\sqrt n)$).'}
    - {measure: deg2,   value: 'n', note: 'Over $\mathbb{F}_2$, $\mathrm{OR}=1-\prod_i(1-x_i)$ contains the monomial $x_1\cdots x_n$.'}
    - {measure: spar,   value: '2^n', note: 'In the $\pm1$ encoding $(-1)^{\mathrm{OR}(x)} = -1 + 2^{1-n}\prod_i(1+\chi_i)$, so every one of the $2^n$ characters has a nonzero coefficient.'}
    - {measure: L1,     value: '3 - 2^{2-n}', refs: [ODonnell14], note: 'From the same expansion: $|-1+2^{1-n}| + (2^n-1)\,2^{1-n}$. The spectral norm of OR is below $3$ for every $n$ -- a useful reminder that $\hat L_1$ is not a proxy for query complexity.'}
    - {measure: Fdim,   value: 'n', note: 'The Fourier support is all of $2^{[n]}$, whose $\mathbb{F}_2$-span is everything.'}
    - {measure: MaxInf, value: '2^{1-n}', note: 'By symmetry every coordinate has influence $\mathrm{I}(f)/n = 2^{1-n}$.'}
    - {measure: NS,     value: '2^{1-n}\big(1-(1-\delta)^n\big)', note: 'Exact, for every $\delta$: $\vee_n(x) \ne \vee_n(y)$ holds precisely when exactly one of $x, y$ is $0^n$, and $\Pr[x = 0^n,\ y \ne 0^n] = 2^{-n}(1-(1-\delta)^n)$. So $\vee_n$ is *exponentially* noise-stable -- the extreme opposite of [[PARITY]].'}
    - {measure: Stab,   value: '1 - 2^{2-n}\big(1-(\tfrac{1+\rho}{2})^n\big)', note: 'From $\mathrm{Stab}_\rho = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$ and the entry above. Tends to $1$ for every fixed $\rho$.'}
    - {measure: RS,     value: '\Theta(n)', refs: [BenDavidKothari18], note: 'At most $\mathrm{R}=\Theta(n)$. For the lower bound, take the sabotaged input with a single $\ast$ and zeros elsewhere: the value is undetermined, and finding the $\ast$ among $n$ positions needs $\Omega(n)$ queries.'}
    - {measure: CA, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{CA}(f) \le \mathrm{fbs}(f)$, with $\mathrm{RC}(f) = \Theta(n)$ and $\mathrm{fbs}(f) = n$ here.'}
    - {measure: CGpub, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{fbs}(f)$, with $\mathrm{RC}(f) = \Theta(n)$ and $\mathrm{fbs}(f) = n$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Advpm, value: '\Theta(\sqrt{n})', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}^{\pm}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with $\lambda(f) = \sqrt{n}$ and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt{n})$ here.'}
    - {measure: gamma2, value: '\Theta(\sqrt{n})', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt{n})$ here.'}
    - {measure: Adv, value: '\Theta(\sqrt{n})', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)$, with $\lambda(f) = \sqrt{n}$ and $\mathrm{Adv}^{\pm}(f) = \Theta(\sqrt{n})$ here.'}
    - {measure: MAdv, value: '\Theta(\sqrt n)', refs: [Spalek08], note: '$\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$ and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_\varepsilon)$, so the multiplicative adversary is $\Theta(\mathrm{Q})$ on every function; here $\mathrm{Q} = \Theta(\sqrt n)$.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: chi, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}^0(f) \le \chi(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: chibar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}^0(f) \le \bar{\chi}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: LR, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: Rstar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: CG, value: '\Theta(n)', refs: [CGLMSG23], note: 'Sandwiched by the [CGLMSG23] bounds $\max\{\mathrm{Adv}^2, \mathrm{R}_0\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$: here $\mathrm{Adv}^2 = \Theta(n)$ and $\mathrm{R}_0 = n$ from below, and the asymmetric product $\mathrm{C}^0\mathrm{C}^1 = n \cdot 1$ from above. OR is one of the two functions on which the certificate-product bound is tight. Note that the old reading $\mathrm{CG} \le \mathrm{D}$ is not available in general -- $\mathrm{CG}$ is not bounded by the arity -- it just happens to hold here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: ardeg, value: '1', refs: [MahadevdeWolf15], note: 'The single rational function $r(x) = \dfrac{n\sum_i x_i}{1 + n\sum_i x_i}$ has numerator and denominator of degree $1$, is $0$ at $0^n$, and is $\ge \tfrac{n}{n+1} \ge \tfrac23$ at every $1$-input. So one degree of freedom suffices where $\widetilde{\deg} = \Theta(\sqrt n)$ is needed for polynomials -- the cleanest illustration that rational approximation is a strictly different resource.'}
    - {measure: PostQ, value: '\Theta(1)', refs: [MahadevdeWolf15, Aaronson05postbqp], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon)$, and $\mathrm{rdeg}_\varepsilon(\mathrm{OR}) = 1$. Postselection makes unstructured search free: prepare a uniform superposition, query once, and postselect on the answer bit being $1$.'}
    - {measure: robustQ, value: '\Theta(\sqrt n)', refs: [HoyerMoscadeWolf03, BNRdW05], note: 'Robust Grover: search over bounded-error inputs costs $O(\sqrt n)$ with **no** log factor, by amplitude amplification around a subroutine whose error is never amplified. Classically, noisy OR costs $\Theta(n)$ either way, so the quantum speedup survives noise intact.'}
    - {measure: degp, value: 'n', note: 'For **every** prime $p$. Over $\mathbb{F}_p$ the multilinear representation is still $1 - \prod_i(1 - x_i)$, which contains $x_1\cdots x_n$ with coefficient $(-1)^{n+1} \ne 0$. Unlike [[PARITY]], OR gets no help from small characteristic -- which is why the value can be recorded as a bare $n$ with no choice of $p$ to make.'}
    - {measure: D_prod, value: '\Theta(n)', note: 'Take the product distribution with each bit $1$ independently with probability $1/n$. After seeing $m$ zeros the conditional probability that a $1$ remains is $1 - (1-1/n)^{n-m}$, which is $\ge 1 - e^{-1/2} > 0.39$ for $m \le n/2$; so no depth-$n/2$ tree has error $\le 1/3$. Product distributions are already as hard as OR gets, which is not true for every function.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: Dmu,  value: '\Theta(n)', refs: [Yao77], note: 'By Yao''s minimax principle $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(n)$. A concrete maximiser: half the mass on $0^n$, the other half spread uniformly over the $n$ weight-one inputs. A depth-$d$ tree that has seen only zeros is consistent with $0^n$ and with the $n-d$ unqueried $e_i$, so whichever answer it commits to it errs on mass at least $\min\{1/2,\ (n-d)/(2n)\}$, forcing $d \ge n/3$. See [[D_prod]] for the product-distribution version.'}
    - {measure: Inf1, value: 'n\,2^{1-n}', note: 'Boolean-valued, so the $L_1$ and $L_2$ total influences coincide: this is the $\mathrm{I}(f)$ recorded above.'}
    - {measure: cbs,  value: 'n', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, attained at $0^n$. The measure only says something new for search problems where some input has several valid answers.'}
    - {measure: psD,  value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(n)$. Contrast the relation [[ApproxHW]], where $\mathrm{R} = O(1)$ but $\mathrm{psD} = \Omega(n)$ [CDM23].'}
    - {measure: cjdeg, value: '\Theta(n)', putative: true, conf: medium, note: 'Upper: $\mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f) = n$, the $1$-leaves of the caterpillar being disjoint conjunctions. Lower: let $h = \sum_C \alpha_C C$ be a width-$d$ conical junta with $|h - \vee_n| \le 1/3$ pointwise. A conjunction with $C(e_i) = 1$ either has all its literals negative -- and then $C(0^n) = 1$ as well -- or has exactly one positive literal, necessarily $x_i$. Conjunctions of the first kind contribute at most $h(0^n) \le 1/3$ to each of the $n$ points $e_i$, so writing $A$ for the total weight of the conjunctions with exactly one positive literal, $2n/3 \le \sum_i h(e_i) \le n/3 + A$, i.e. $A \ge n/3$. Now evaluate under the product measure that sets each bit to $1$ with probability $1/d$: each such $C$ has expectation at least $\tfrac1d(1-\tfrac1d)^{d-1} \ge \tfrac{1}{ed}$, while $\mathbb{E}[h] \le 4/3$, so $A \le 4ed/3$ and $d \ge n/(4e)$. Non-negativity therefore costs a quadratic blow-up over $\widetilde{\deg} = \Theta(\sqrt n)$.'}
  witnesses:
    - {of: [C, Q],      setting: total, statement: '$\mathrm{C} = \Theta(\mathrm{Q}^2)$ -- the "$2$" in the C-vs-Q cell (usually quoted with AND).', refs: [Grover96]}
    - {of: [deg, adeg], setting: total, statement: '$\deg = \Theta(\widetilde{\deg}^2)$, matching the ABKRT upper bound $\deg = O(\widetilde{\deg}^2)$.', refs: [NS94, ABKRT21]}
    - {of: [s, lambda], setting: total, statement: '$\mathrm{s} = \lambda^2$, matching $\mathrm{s} \le \lambda^2$.', refs: [ABKRT21]}
    - {of: [bs, lambda], setting: total, statement: '$\mathrm{bs} = \lambda^2$; improved to $\lambda^{2.127}$ by Meiburg.', refs: [ABKRT21, Meiburg26]}
    - {of: [rdeg, ndeg], setting: total, statement: 'Maximal gap between $\mathrm{ndeg}(f)=1$ and $\mathrm{ndeg}(\bar f)=n$.', refs: [deWolf00]}
  refs: [Grover96, BBBV97, NS94, BdW02]
  see_also: [AND, PARITY, MAJ, ANDOR, GroverSearch]

- id: AND
  name: AND
  symbol: '\mathrm{AND}_n'
  aliases: ['\wedge']
  group: basic
  order: 11
  kind: total
  arity: '$n$ bits'
  short: 'The dual of OR; the witness cited in most "$2,2$" and "$2,4$" cells of the total-function matrix.'
  definition: '$\mathrm{AND}_n(x)=1$ iff every $x_i=1$. All measures are those of $\mathrm{OR}_n$ with the roles of $0$ and $1$ exchanged.'
  formal: |
    $$\mathrm{AND}_n : \{0,1\}^n \to \{0,1\},\qquad \mathrm{AND}_n(x) = \prod_{i=1}^n x_i .$$
  values:
    - {measure: D,    value: 'n'}
    - {measure: R,    value: '\Theta(n)'}
    - {measure: noisyR, value: '\Theta(n)', note: 'From $\mathrm{R}(f) = \Theta(n) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ [CKMPSS23] -- see the [[noisyR]] vs [[R]] record. At the top of the range there is no room for fractional queries to help.'}
    - {measure: Q,    value: '\Theta(\sqrt{n})'}
    - {measure: deg,  value: 'n'}
    - {measure: adeg, value: '\Theta(\sqrt{n})'}
    - {measure: s0,   value: '1'}
    - {measure: s1,   value: 'n'}
    - {measure: s,    value: 'n'}
    - {measure: bs,   value: 'n'}
    - {measure: C,    value: 'n'}
    - {measure: RC,   value: '\Theta(n)'}
    - {measure: lambda, value: '\sqrt{n}', refs: [IJKKKSWW23]}
    - {measure: ndeg, value: 'n'}
    - {measure: rdeg, value: 'n'}
    - {measure: R0,     value: 'n'}
    - {measure: QE,     value: 'n', refs: [BBCMdW01], note: 'Exact quantum computation gives no speedup, as for OR.'}
    - {measure: C0,     value: '1'}
    - {measure: C1,     value: 'n'}
    - {measure: bs0,    value: '1'}
    - {measure: bs1,    value: 'n'}
    - {measure: fbs,    value: 'n'}
    - {measure: FC,     value: 'n'}
    - {measure: EC,     value: 'n', refs: [GJKKLSSV17], note: 'Sandwiched between $\mathrm{fbs}=n$ and $\mathrm{C}=n$.'}
    - {measure: Cmin,   value: '1', note: 'Any $0$-input is certified by a single $0$.'}
    - {measure: UC,     value: 'n', note: 'The "first $0$" family, mirroring OR.'}
    - {measure: UCmin,  value: 'n', putative: true, refs: [BHT17], note: '**Corrected**, mirroring [[OR]]: $\mathrm{UC}_{\min} = \min\{\mathrm{UC}^0,\mathrm{UC}^1\}$ is one-sided, not a minimum over inputs. $\mathrm{UC}^1 = n$ since $1^n$ is the only $1$-input, and $\mathrm{UC}^0 = n$ since an unambiguous $0$-cover partitions an odd number ($2^n-1$) of inputs into subcubes. The old value $1$ violated both $\mathrm{D} \le \mathrm{UC}_{\min}^2$ and $\mathrm{fbs} \le 2\,\mathrm{UC}_{\min}-1$ [BHT17].'}
    - {measure: SP,     value: 'n', note: 'The subcube containing $1^n$ must fix everything.'}
    - {measure: rank,   value: '1', note: 'Caterpillar tree: query the bits in order and stop at the first $0$.'}
    - {measure: D_size, value: 'n+1', note: 'Mirror of OR: the caterpillar has $n+1$ leaves and no tree has fewer.'}
    - {measure: Dna,    value: 'n', note: 'Every variable is relevant.'}
    - {measure: QC,     value: '\Theta(\sqrt n)', refs: [Aaronson08]}
    - {measure: NQ,     value: '\lceil n/2 \rceil', refs: [deWolf03], note: '$\mathrm{ndeg}(\mathrm{AND})=n$.'}
    - {measure: Q0,     value: '\Theta(n)', note: 'Squeezed between $\deg/2 = n/2$ and $\mathrm{D} = n$, exactly as for [[OR]].'}
    - {measure: odeg,   value: '\Theta(\sqrt n)', putative: true, refs: [NS94, BT22], note: 'Unlike OR, the one-sided relaxation buys nothing: a polynomial bounded by $1/3$ on all of $\{0,1\}^n\setminus\{1^n\}$ and at least $2/3$ at $1^n$ still needs degree $\Omega(\sqrt n)$ by the Markov-brothers argument, and Chebyshev gives $O(\sqrt n)$.'}
    - {measure: spar,   value: '2^n', note: '$(-1)^{\mathrm{AND}(x)} = 1 - 2^{1-n}\prod_i(1-\chi_i)$: every character appears.'}
    - {measure: L1,     value: '3 - 2^{2-n}', refs: [ODonnell14], note: 'Same computation as for OR.'}
    - {measure: Fdim,   value: 'n', note: 'The Fourier support spans all of $\mathbb{F}_2^n$: it contains every singleton.'}
    - {measure: Inf,    value: 'n\,2^{1-n}'}
    - {measure: MaxInf, value: '2^{1-n}'}
    - {measure: CA, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{CA}(f) \le \mathrm{RC}(f)$, with $\mathrm{fbs}(f) = n$ and $\mathrm{RC}(f) = \Theta(n)$ here.'}
    - {measure: CGpub, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{RC}(f)$, with $\mathrm{fbs}(f) = n$ and $\mathrm{RC}(f) = \Theta(n)$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}}(f) = n$ here.'}
    - {measure: Advpm, value: '\Theta(\sqrt{n})', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}^{\pm}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with $\lambda(f) = \sqrt{n}$ and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt{n})$ here.'}
    - {measure: gamma2, value: '\Theta(\sqrt{n})', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt{n})$ here.'}
    - {measure: Adv, value: '\Theta(\sqrt{n})', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)$, with $\lambda(f) = \sqrt{n}$ and $\mathrm{Adv}^{\pm}(f) = \Theta(\sqrt{n})$ here.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R1, value: 'n', note: 'Sandwiched: $\mathrm{C}^1(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: chi, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}^1(f) \le \chi(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: chibar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}^1(f) \le \bar{\chi}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: LR, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: Rstar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: CG, value: '\Theta(n)', refs: [CGLMSG23], note: 'Sandwiched by the [CGLMSG23] bounds $\max\{\mathrm{Adv}^2, \mathrm{R}_0\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$: here $\mathrm{Adv}^2 = \Theta(n)$ and $\mathrm{R}_0 = n$ from below, and $\mathrm{C}^0\mathrm{C}^1 = 1 \cdot n$ from above. The mirror image of [[OR]].'}
    - {measure: MAdv, value: '\Theta(\sqrt{n})', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(\sqrt{n})$ here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: ardeg, value: '1', refs: [MahadevdeWolf15], note: 'Dual to [[OR]]: $1 - r(\bar x)$ for the same degree-$1$ rational $r$.'}
    - {measure: PostQ, value: '\Theta(1)', refs: [MahadevdeWolf15], note: 'Dual to [[OR]].'}
    - {measure: degp, value: 'n', note: 'For **every** prime $p$: $\mathrm{AND} = \prod_i x_i$ over every field, so there is no choice of $p$ to make and the value is a bare $n$.'}
    - {measure: deg2, value: 'n', note: 'The $p=2$ case of the line above: $\mathrm{AND} = x_1\cdots x_n$ over $\mathbb{F}_2$.'}
    - {measure: PDT, value: 'n', putative: true, note: 'Parity queries are unaffected by complementing the input (a parity of a set shifts by a constant), so $\mathrm{D}^{\oplus}(\mathrm{AND}_n) = \mathrm{D}^{\oplus}(\mathrm{OR}_n) = n$.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: Dmu, value: '\min\{n,\ \lceil \log(1/\varepsilon)/\log(1/p)\rceil\} \text{ under } \mu_p', note: 'The cleanest illustration of why $\mathrm{D}^{\mu}$ is a *family* of measures rather than one number. Let $\mu_p$ make each bit $1$ independently with probability $p$. Querying bits until one comes up $0$ and answering $1$ if the first $m$ are all $1$ errs with probability $p^{m}(1-p^{n-m})$, so $m = \lceil \log(1/\varepsilon)/\log(1/p)\rceil$ queries suffice; conversely, the leaf reached by the all-ones input has some depth $m_0 \le m$ and carries $\mathrm{AND}^{-1}(0)$-mass $p^{m_0} - p^{n}$ against $\mathrm{AND}^{-1}(1)$-mass $p^{n}$, so the error is at least $\min\{p^{m}-p^{n},\,p^{n}\}$. At $p = 1/2$ this is $\Theta(\log(1/\varepsilon))$; at $p = 1 - 1/n$ it is $n$. Averaging over the parameter is exactly what the zoo cannot do, which is why $\mathrm{D}^{\mu}$ is left out of the ladder ordering on the matrix page.'}
    - {measure: D_prod, value: 'n', note: 'Take $p = 1-1/n$ in the previous line: $\log(1/p) = \Theta(1/n)$, so the bound saturates at $n$. Product distributions are already worst-case-hard for AND.'}
    - {measure: sdeg, value: '1', note: '$\mathrm{AND}_n = \operatorname{sign}\big(\sum_i x_i - n + \tfrac12\big)$: every halfspace has threshold degree $1$. Against $\widetilde{\deg} = \Theta(\sqrt n)$ and $\deg = n$.'}
    - {measure: Inf1, value: 'n\,2^{1-n}', note: 'Boolean-valued, so the $L_1$ and $L_2$ total influences coincide: this is the $\mathrm{I}(f)$ recorded above.'}
    - {measure: NS,   value: '2^{1-n}\big(1-(1-\delta)^n\big)', note: 'Exact, for every $\delta$: $\wedge_n(x) \ne \wedge_n(y)$ holds precisely when exactly one of $x,y$ equals $1^n$, and $\Pr[x = 1^n,\ y \ne 1^n] = 2^{-n}(1-(1-\delta)^n)$. The mirror of [[OR]] under $x \mapsto \bar x$: exponentially noise-stable.'}
    - {measure: Stab, value: '1 - 2^{2-n}\big(1-(\tfrac{1+\rho}{2})^n\big)', note: 'From $\mathrm{Stab}_\rho = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$ and the entry above. Tends to $1$ for every fixed $\rho$.'}
    - {measure: Np,   value: '\Theta(n)', conf: medium, refs: [FRPU94], note: 'Noisy decision trees are unaffected by negating input bits or complementing the output, and $\wedge_n(x) = \lnot\vee_n(\bar x)$, so this is the [[OR]] value: constant-rate noise costs only a constant factor, unlike [[PARITY]].'}
    - {measure: RS,   value: '\Theta(n)', refs: [BenDavidKothari18], note: 'At most $\mathrm{R} = \Theta(n)$. For the lower bound take the sabotaged input with a single $\ast$ and ones elsewhere: the value is undetermined, and finding the $\ast$ among $n$ positions needs $\Omega(n)$ queries.'}
    - {measure: robustQ, value: '\Theta(\sqrt n)', refs: [HoyerMoscadeWolf03, BNRdW05], note: 'Robust Grover search for a zero costs $O(\sqrt n)$ with **no** log factor, and $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(\sqrt n)$. The [[OR]] entry after negating the input bits.'}
    - {measure: cbs,  value: 'n', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, attained at $1^n$.'}
    - {measure: psD,  value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(n)$.'}
    - {measure: cjdeg, value: '\Theta(n)', putative: true, conf: medium, note: 'Upper: $\mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f) = n$. Lower: let $h = \sum_C \alpha_C C$ be a width-$d$ conical junta with $|h - \wedge_n| \le 1/3$ pointwise. The conjunctions that evaluate to $1$ at $1^n$ are exactly the all-positive ones, so $\sum_{C \text{ positive}} \alpha_C = h(1^n) \ge 2/3$; an all-positive $C$ still evaluates to $1$ at $1^n - e_i$ unless $x_i$ is one of its at most $d$ literals, whence $\sum_i h(1^n - e_i) \ge \sum_{C \text{ positive}} \alpha_C\,(n - |C|) \ge (n-d)\tfrac23$. Every $1^n - e_i$ is a $0$-input, so the left-hand side is at most $n/3$, giving $d \ge n/2$. Non-negativity thus wipes out the $\widetilde{\deg} = \Theta(\sqrt n)$ saving, and it does so even though $\mathrm{sdeg}(\wedge_n) = 1$.'}
  witnesses:
    - {of: [C, Q],       setting: total, statement: '$\mathrm{C}(f)=n$, $\mathrm{Q}(f)=\Theta(\sqrt n)$: the quadratic C-vs-Q separation.', refs: [Grover96]}
    - {of: [bs, lambda], setting: total, statement: '$\mathrm{bs}=\lambda^2$.', refs: [ABKRT21]}
    - {of: [RC, Q],      setting: total, statement: '$\mathrm{RC}=\Theta(\mathrm{Q}^2)$, matching $\mathrm{RC}=O(\mathrm{Q}^2)$.', refs: [Aaronson08]}
    - {of: [deg, adeg],  setting: total, statement: '$\deg = \Theta(\widetilde{\deg}^2)$.', refs: [NS94]}
  refs: [Grover96, NS94, BdW02]
  see_also: [OR, ANDOR, ANDEH]

- id: PARITY
  name: PARITY
  symbol: '\oplus_n'
  aliases: ['XOR', 'MOD_2']
  group: basic
  order: 12
  kind: total
  arity: '$n$ bits'
  short: 'Maximally hard for every measure in the zoo except parity decision trees -- hence the witness for every "$1,1$" cell.'
  definition: '$\oplus_n(x) = x_1 \oplus \cdots \oplus x_n$.'
  formal: |
    $$\oplus_n(x) = \sum_{i=1}^n x_i \bmod 2,\qquad\text{Fourier: } (-1)^{\oplus_n(x)} = \prod_{i=1}^n (-1)^{x_i}=\chi_{[n]}(x).$$
  values:
    - {measure: D,      value: 'n'}
    - {measure: R0,     value: 'n'}
    - {measure: R,      value: 'n'}
    - {measure: noisyR, value: '\Theta(n)', note: 'From $\mathrm{R}(f) = \Theta(n) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ [CKMPSS23] -- see the [[noisyR]] vs [[R]] record. At the top of the range there is no room for fractional queries to help.'}
    - {measure: Q,      value: '\lceil n/2 \rceil', refs: [BBCMdW01], note: 'One query decides the parity of two bits (Deutsch); this is exactly tight.'}
    - {measure: QE,     value: '\lceil n/2 \rceil', refs: [BBCMdW01]}
    - {measure: deg,    value: 'n'}
    - {measure: adeg,   value: 'n'}
    - {measure: sdeg,   value: 'n', refs: [MinskyPapert69]}
    - {measure: s,      value: 'n'}
    - {measure: bs,     value: 'n'}
    - {measure: fbs,    value: 'n'}
    - {measure: C,      value: 'n'}
    - {measure: RC,     value: '\lceil n/2\rceil', putative: true, note: 'A verifier must catch the flip of any single bit with probability $\ge 1/2$, so $\Pr[i \in S]\ge 1/2$ for every $i$ and $\mathbb{E}|S| \ge n/2$; a uniformly random half attains it. Note $\mathrm{RC} \ne \mathrm{fbs} = n$ here -- the constant in $\mathrm{RC}=\Theta(\mathrm{fbs})$ is real.'}
    - {measure: lambda, value: 'n', note: 'Sensitivity graph is the whole hypercube, which is $n$-regular.'}
    - {measure: rdeg,   value: 'n'}
    - {measure: ndeg,   value: 'n'}
    - {measure: PDT,    value: '1', note: 'One parity query. The reason $\mathrm{D}^{\oplus}$ is a genuinely different measure.'}
    - {measure: Inf,    value: 'n'}
    - {measure: spar,   value: '1'}
    - {measure: L1,     value: '1'}
    - {measure: Np,     value: '\Theta(n\log n)', refs: [FRPU94, EvansPippenger98], note: 'The canonical example where constant-rate noise costs a $\log n$ factor; matching upper bound in [FRPU94], matching lower bound in [EvansPippenger98].'}
    - {measure: s0,     value: 'n'}
    - {measure: s1,     value: 'n'}
    - {measure: bs0,    value: 'n'}
    - {measure: bs1,    value: 'n'}
    - {measure: C0,     value: 'n'}
    - {measure: C1,     value: 'n'}
    - {measure: Cmin,   value: 'n', note: 'Every input needs the whole assignment; PARITY is evasive in the strongest sense.'}
    - {measure: FC,     value: 'n'}
    - {measure: EC,     value: 'n', note: 'Between $\mathrm{fbs}=n$ and $\mathrm{C}=n$.'}
    - {measure: UC,     value: 'n', note: 'The full binary tree is already an unambiguous partition, and $\mathrm{UC}\ge\mathrm{C}=n$.'}
    - {measure: UCmin,  value: 'n', note: 'Every certificate of every input is the whole assignment.'}
    - {measure: SP,     value: 'n', note: 'A monochromatic subcube must fix every coordinate.'}
    - {measure: rank,   value: 'n', note: 'Both children of every node of every tree for $\oplus_n$ compute a parity of the remaining variables, so the two ranks are equal at every level and the rank climbs by one each time.'}
    - {measure: D_size, value: '2^n', note: 'Every leaf is a full assignment.'}
    - {measure: Dna,    value: 'n'}
    - {measure: Rna,    value: 'n', note: 'Leaving any coordinate unqueried leaves the answer a fair coin flip.'}
    - {measure: Q0,     value: '\lceil n/2 \rceil', refs: [BBCMdW01], note: 'Sandwiched between $\mathrm{Q}=\lceil n/2\rceil$ and $\mathrm{Q_E}=\lceil n/2\rceil$.'}
    - {measure: NQ,     value: '\lceil n/2 \rceil', refs: [deWolf03], note: '$\mathrm{ndeg}(\oplus_n)=n$.'}
    - {measure: QC,     value: '\Theta(\sqrt n)', refs: [Aaronson08], note: '$\mathrm{QC}=\Theta(\sqrt{\mathrm{RC}})$ and $\mathrm{RC}=\lceil n/2\rceil$. Verification is quadratically cheaper than computation even here.'}
    - {measure: odeg,   value: 'n', note: 'Squeezed between $\mathrm{sdeg}=n$ and $\widetilde{\deg}=n$.'}
    - {measure: deg2,   value: '1', note: 'Over $\mathbb{F}_2$ parity is linear -- the reason $\mathrm{D}^{\oplus}=1$.'}
    - {measure: Fdim,   value: '1', note: 'The Fourier support is the single set $[n]$.'}
    - {measure: MaxInf, value: '1', note: 'Every coordinate is always sensitive.'}
    - {measure: Inf1,   value: 'n', note: 'Boolean-valued, so the $L_1$ and $L_2$ influences agree.'}
    - {measure: NS,     value: '\tfrac12\big(1-(1-2\delta)^n\big)', refs: [ODonnell14], note: 'Exactly: the noise flips the answer iff an odd number of bits flip. Maximally noise-sensitive.'}
    - {measure: Stab,   value: '\rho^{\,n}', refs: [ODonnell14]}
    - {measure: RS,     value: '\Theta(n)', refs: [BenDavidKothari18], note: 'At most $\mathrm{R}=n$; and a sabotaged input with a single $\ast$ hides it among $n$ positions.'}
    - {measure: CA, value: '\Theta(n)', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = n$ here.'}
    - {measure: CGpub, value: '\Theta(n)', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs}(f) = n$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Advpm, value: '\Theta(\lceil n/2 \rceil)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \lceil n/2 \rceil$ here.'}
    - {measure: gamma2, value: '\Theta(\lceil n/2 \rceil)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \lceil n/2 \rceil$ here.'}
    - {measure: MAdv, value: 'n/2', refs: [Spalek08], note: '$\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$ and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_\varepsilon)$, so the multiplicative adversary is $\Theta(\mathrm{Q})$ on every function; here $\mathrm{Q} = n/2$.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: R1, value: 'n', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: chi, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \chi(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: chibar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\chi}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: LR, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: Rstar, value: '\Theta(n)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: CG, value: '\Theta(n^2)', refs: [CGLMSG23], note: 'The headline case for this measure: **above the arity**. From below $\mathrm{CG} \ge \mathrm{Adv}^2 = n^2$ -- equivalently the Hamming-distance-$1$ game already costs $\lambda^2 = n^2$, since two players who differ in one unknown coordinate must each guess it out of $n$ independently. From above $\mathrm{C}^0\mathrm{C}^1 = n^2$. Both [CGLMSG23] bounds are tight on parity, and the result is quadratically larger than $\mathrm{D} = n$: private-coin certificate games are the one variant of the four that is not capped by decision-tree complexity.'}
    - {measure: Adv, value: '\Theta(n)', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: cjdeg, value: 'n', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: ardeg, value: 'n', refs: [MahadevdeWolf15], note: 'Rational approximation does not help at all here. Suppose $p/q$ approximates $\mathrm{PARITY}$ to within $1/3$ with $\deg p, \deg q \le d$ and $q > 0$ on the cube. Symmetrising over the slices, $P(k) - \tfrac12 Q(k)$ is a univariate polynomial of degree $\le d$ whose sign alternates at $k = 0,1,\dots,n$, so it has $\ge n$ roots and $d \ge n$. Contrast $\mathrm{rdeg}(\mathrm{MAJ}) = \Theta(\log n)$: parity is the function on which postselection buys nothing.'}
    - {measure: PostQ, value: '\Theta(n)', refs: [MahadevdeWolf15], note: 'From $\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = \Theta(n)$. Even $\mathsf{PostBQP}$ needs to read essentially the whole input.'}
    - {measure: robustQ, value: '\Theta(n)', refs: [BNRdW05, FRPU94], note: 'The headline robustness result: $n$ noisy quantum queries recover all $n$ bits, so $\mathrm{Q}^{\mathrm{rob}} = O(n)$, matching $\mathrm{Q} = n/2$ up to a constant. Classically the same task costs $\Theta(n\log n)$ [FRPU94] -- noise imposes a logarithmic tax on randomized algorithms that quantum algorithms simply do not pay. An explicit degree-$O(n)$ robust polynomial was later given by [Sherstov13robust].'}
    - {measure: degp, value: '1 \text{ if } p = 2;\ n \text{ if } p > 2', note: 'Over $\mathbb{F}_2$ parity *is* the linear form $\sum_i x_i$. For odd $p$ the multilinear representation is $\tfrac12\big(1 - \prod_i(1-2x_i)\big)$, whose top coefficient $\pm 2^{n-1}$ is a unit mod $p$, so the degree jumps back to $n$. This single function is the whole content of the $\deg_p$ column.'}
    - {measure: Dmu, value: 'n', note: 'Under the **uniform** $\mu$, for every $\varepsilon < 1/2$ -- and since $\mathrm{D}^\mu \le \mathrm{D} = n$ for every $\mu$, the uniform distribution is simultaneously the hardest one, so no choice of $\mu$ has to be recorded alongside the value. Every leaf of a tree of depth $< n$ leaves some coordinate unqueried, and conditioned on the queried bits the parity is still uniform on $\{0,1\}$; so any such tree errs with probability exactly $1/2$ under the uniform distribution. This is the extreme point of Yao''s principle: one distribution already witnesses the worst case, with no slack.'}
    - {measure: D_prod, value: 'n', note: 'The uniform distribution is a product distribution, and $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R} = n$.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $n$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: cbs,  value: 'n', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$: every one of the $n$ coordinates is sensitive at every input.'}
    - {measure: psD,  value: 'n', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$, and $\mathrm{R} = \mathrm{D} = n$ here, so all three of $\mathrm{R}$, $\mathrm{psD}$ and $\mathrm{D}$ coincide exactly.'}
  witnesses:
    - {of: ['*', '*'], setting: total, statement: 'Every classical measure equals $n$, so PARITY certifies that all the "$1,1$" cells of the matrix are tight -- no measure in the left column can be asymptotically smaller than any in the top row on this family.', refs: [ABKRT21]}
    - {of: [D, PDT], setting: total, statement: '$\mathrm{D}=n$ but $\mathrm{D}^{\oplus}=1$: parity decision trees are incomparable to ordinary ones.', refs: [TsangWongXieZhang13]}
    - {of: [Np, D],  setting: total, statement: '$\mathrm{N}_p = \Theta(n\log n)$ vs $\mathrm{D}=n$: noise genuinely costs a logarithm.', refs: [FRPU94, EvansPippenger98]}
  refs: [BBCMdW01, FRPU94, EvansPippenger98]
  see_also: [OR, MAJ, PDT]

- id: MAJ
  name: MAJORITY
  symbol: '\mathrm{MAJ}_n'
  aliases: ['\mathrm{THR}_{n/2}']
  group: basic
  order: 13
  kind: total
  arity: '$n$ bits, $n$ odd'
  short: 'Hard for quantum too ($\mathrm{Q}=\Theta(n)$), but with sensitivity only $\approx n/2$.'
  definition: '$\mathrm{MAJ}_n(x)=1$ iff $|x| > n/2$.'
  formal: '$\mathrm{MAJ}_n(x) = \mathbb{1}[\,\sum_i x_i \ge (n+1)/2\,]$ for odd $n$.'
  values:
    - {measure: D,      value: 'n'}
    - {measure: R,      value: '\Theta(n)'}
    - {measure: noisyR, value: '\Theta(n)', note: 'From $\mathrm{R}(f) = \Theta(n) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ [CKMPSS23] -- see the [[noisyR]] vs [[R]] record. At the top of the range there is no room for fractional queries to help.'}
    - {measure: Q,      value: '\Theta(n)', refs: [BBCMdW01, Paturi92], note: 'Via Paturi: $\widetilde{\deg}(\mathrm{MAJ}) = \Theta(n)$ because the jump is at the middle layer.'}
    - {measure: deg,    value: 'n'}
    - {measure: adeg,   value: '\Theta(n)', refs: [Paturi92]}
    - {measure: sdeg,   value: '1'}
    - {measure: s,      value: '(n+1)/2'}
    - {measure: bs,     value: '(n+1)/2'}
    - {measure: C,      value: '(n+1)/2'}
    - {measure: lambda, value: '(n+1)/2', note: 'The sensitivity graph is the middle-layer bipartite graph, which is $\tfrac{n+1}{2}$-regular, so $\lambda = \mathrm{s}$.'}
    - {measure: rdeg,   value: '\Theta(n)', refs: [IJKKKSWW23], note: 'Symmetric functions have $\mathrm{rdeg} = \Omega(\deg)$.'}
    - {measure: Inf,    value: '\Theta(\sqrt{n})'}
    - {measure: R0,     value: '\Theta(n)', note: 'Between $\mathrm{R}=\Theta(n)$ and $\mathrm{D}=n$. (The saving from stopping early once one side reaches $(n+1)/2$ is only $\Theta(\sqrt n)$.)'}
    - {measure: Rbar,   value: '\Theta(n)', note: 'Same sandwich; expected cost cannot help by more than a constant at constant error.'}
    - {measure: s0,     value: '(n+1)/2', note: 'At a $0$-input with exactly $(n-1)/2$ ones, each of the $(n+1)/2$ zeros is sensitive.'}
    - {measure: s1,     value: '(n+1)/2'}
    - {measure: bs0,    value: '(n+1)/2'}
    - {measure: bs1,    value: '(n+1)/2'}
    - {measure: C0,     value: '(n+1)/2'}
    - {measure: C1,     value: '(n+1)/2'}
    - {measure: Cmin,   value: '(n+1)/2', note: 'Every input needs a full majority-sized certificate, so the min and the max coincide.'}
    - {measure: fbs,    value: '(n+1)/2', refs: [Aaronson08], note: 'Squeezed: $\mathrm{bs}\le\mathrm{fbs}\le\mathrm{C}$ and both ends are $(n+1)/2$. The certificate LP is integral for MAJ.'}
    - {measure: FC,     value: '(n+1)/2', note: 'Equal to $\mathrm{fbs}$.'}
    - {measure: EC,     value: '(n+1)/2', refs: [GJKKLSSV17], note: 'Same squeeze, since $\mathrm{fbs}\le\mathrm{EC}\le\mathrm{C}$.'}
    - {measure: RC,     value: '\Theta(n)', refs: [Aaronson08], note: '$\mathrm{RC}=\Theta(\mathrm{fbs})=\Theta(n)$.'}
    - {measure: CA,     value: '\Theta(n)', refs: [ABIKPS17], note: 'The classical adversary equals $\Theta(\mathrm{fbs})$ for total functions.'}
    - {measure: QC,     value: '\Theta(\sqrt n)', refs: [Aaronson08], note: '$\mathrm{QC}=\Theta(\sqrt{\mathrm{RC}})$. Verifying a majority is quadratically cheaper than computing it.'}
    - {measure: QE,     value: '\Theta(n)', refs: [BBCMdW01, AmbainisGruslysEtAl16], note: 'At least $\deg/2 = n/2$ and at most $n$; [AmbainisGruslysEtAl16] pin down the exact quantum complexity of threshold functions.'}
    - {measure: ndeg,   value: '(n+1)/2', putative: true, note: 'Exactly. Upper: $\prod_{j=0}^{(n-1)/2}(|x|-j)$ vanishes exactly on the $0$-inputs. Lower: $\mathrm{MAJ}_n = \mathrm{THR}^n_{(n+1)/2}$, and restricting $(n-1)/2$ variables to $0$ leaves $\wedge_{(n+1)/2}$, whose nondeterministic degree is $(n+1)/2$ (the [[AND]] line); $\mathrm{ndeg}$ cannot increase under restriction. This is the [[THR]] value $\mathrm{ndeg} = k$ at $k = (n+1)/2$.'}
    - {measure: odeg,   value: '\Theta(\sqrt n)', putative: true, note: 'Sharply below $\widetilde{\deg}(\mathrm{MAJ})=\Theta(n)$. A Chebyshev polynomial scaled to be $\le 1/3$ in absolute value on $\{0,\dots,(n-1)/2\}$ has grown past $2/3$ one step later, and nothing constrains it above; the matching $\Omega(\sqrt n)$ is the Markov-brothers bound on an interval with $\Theta(n)$ points.'}
    - {measure: rank,   value: '(n+1)/2', putative: true, note: 'Prover-Delayer: until one side has $(n+1)/2$ votes the Delayer may answer either way, scoring a point each time; the counting tree attains it.'}
    - {measure: Dna,    value: 'n', note: 'Every variable is relevant.'}
    - {measure: Rna,    value: '\Theta(n)', note: 'In fact $n - O(1)$, which is sharper than the recorded $\Theta(n)$ but mixes an exact and an asymptotic term, so it lives here rather than in the value. If two coordinates go unqueried the remaining $n-2$ bits can be set to split evenly, and then the two unread bits decide the answer, leaving it a fair coin flip; so every non-adaptive query set must miss at most one coordinate and $\mathrm{R}^{\mathrm{na}} \ge n-1$. The matching $\mathrm{R}^{\mathrm{na}} \le \mathrm{D}^{\mathrm{na}} = n$ is trivial.'}
    - {measure: RS,     value: '\Theta(n)', refs: [BenDavidKothari18], note: 'At most $\mathrm{R}=\Theta(n)$; and the sabotaged input with $(n-1)/2$ ones, $(n-1)/2$ zeros and a single $\ast$ hides that $\ast$ among $n$ positions.'}
    - {measure: MaxInf, value: '\binom{n-1}{(n-1)/2}2^{1-n} = \Theta(1/\sqrt n)', refs: [ODonnell14], note: 'Every coordinate is pivotal exactly when the other $n-1$ split evenly.'}
    - {measure: Inf1,   value: '\Theta(\sqrt n)', note: 'Boolean-valued, so equal to $\mathrm{I}(f)$.'}
    - {measure: NS,     value: '\Theta(\sqrt\delta)', refs: [ODonnell14], note: 'As $n\to\infty$, $\mathrm{NS}_\delta \to \tfrac1\pi\arccos(1-2\delta)$. Majority is the *most* noise-stable of all low-influence functions (Majority Is Stablest).'}
    - {measure: Stab,   value: '\tfrac{2}{\pi}\arcsin\rho + o(1)', refs: [ODonnell14], note: 'Sheppard formula, in the $n\to\infty$ limit.'}
    - {measure: spar,   value: '2^{n-1}', refs: [ODonnell14], note: 'MAJ is odd, so only odd-size sets can appear, and the standard formula for $\widehat{\mathrm{MAJ}}(S)$ is nonzero for every one of them.'}
    - {measure: Fdim,   value: 'n', note: 'The support contains every singleton (odd sets of size $1$ have nonzero coefficient), so it spans $\mathbb{F}_2^n$.'}
    - {measure: PDT,    value: 'n - \mathrm{B}(n) + 1', refs: [ChistopolskayaPodolskii18], note: 'Exactly, where $\mathrm{B}(n)$ is the number of ones in the binary expansion of $n$. Lower bound from granularity: every Fourier coefficient of $\mathrm{MAJ}_n$ is an integer multiple of $2^{-k}$ with $k = n - \mathrm{B}(n)$, and [ChistopolskayaPodolskii18] show $\mathrm{D}^{\oplus} \ge k+1$. Parity queries buy $\mathrm{B}(n)-1$ queries off $\mathrm{D} = n$, and no more.'}
    - {measure: CGpub, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{RC}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Q0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{Q}_{\varepsilon}(f) \le \mathrm{Q}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{Q}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: Advpm, value: '\Theta(n)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n)$ here.'}
    - {measure: gamma2, value: '\Theta(n)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n)$ here.'}
    - {measure: MAdv, value: '\Theta(n)', refs: [Spalek08], note: '$\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$ and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_\varepsilon)$, so the multiplicative adversary is $\Theta(\mathrm{Q})$ on every function; here $\mathrm{Q} = \Theta(n)$.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: chibar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{RS}(f) \le \bar{\chi}(f) \le \mathrm{D}(f)$, with $\mathrm{RS}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: LR, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{RS}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with $\mathrm{RS}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: Rstar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{Q}_{\varepsilon}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with $\mathrm{Q}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: CG, value: '\Theta(n^2)', refs: [CGLMSG23], note: 'Sandwiched between $\mathrm{Adv}^2 = \Theta(n^2)$ and $\mathrm{C}^0\mathrm{C}^1 = \Theta(n^2)$ [CGLMSG23]. Like [[PARITY]] this sits above the arity: the sensitivity graph of majority is biregular of degree $\Theta(n)$ between the two middle layers, so $\lambda = \Theta(n)$ and the distance-$1$ game alone already costs $\Theta(n^2)$.'}
    - {measure: cjdeg, value: '\Theta(n)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\widetilde{\deg}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\widetilde{\deg}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: ardeg, value: '\Theta(\log n)', refs: [Newman64, MahadevdeWolf15], note: 'Newman''s degree-$O(\log(1/\varepsilon))$ rational approximation to $|x|$, rescaled to the slices $k = 0,\dots,n$, approximates the sign of $k - n/2$ with degree $O(\log n)$; the matching $\Omega(\log n)$ is in [MahadevdeWolf15]. Compare $\widetilde{\deg}(\mathrm{MAJ}) = \Theta(n)$: **rational** approximation is exponentially cheaper than polynomial approximation here, which is exactly what makes majority the canonical postselection example.'}
    - {measure: PostQ, value: '\Theta(\log n)', refs: [MahadevdeWolf15, Aaronson05postbqp], note: 'Aaronson gave the first postselected majority algorithm; Mahadev-de Wolf made it optimal and observed that reading the algorithm backwards reproves Newman''s theorem.'}
    - {measure: robustQ, value: '\Theta(n)', refs: [BNRdW05], note: 'Sandwiched between $\mathrm{Q} = \Theta(n)$ and the universal $O(n)$ upper bound.'}
    - {measure: deg2, value: '(n+1)/2', putative: true, note: 'Recorded along the subfamily $n = 2^m - 1$. The $p=2$ case of the $\deg_p$ line below. The restriction to $n = 2^m-1$ is only for tidiness: running the same Lucas computation for every $n$ gives $\deg_2(\mathrm{MAJ}_n) = 2^{\lfloor \log_2 n\rfloor}$, so $\deg_2$ is always a power of two: it equals $n$ exactly when $n$ is one, and bottoms out at $(n+1)/2$ at $n = 2^m-1$, which is the case recorded here. Either way $\deg_2 = \Theta(n)$ while $\deg = n$ -- unlike [[IP]], majority gets essentially no discount from characteristic $2$.'}
    - {measure: degp, value: '(n+1)/2 \text{ for } p = 2,\ n = 2^m - 1', note: 'The $\mathbb{F}_2$ multilinear expansion of the threshold $\mathrm{Th}_k^n$ is $\sum_{|S| \ge k} \binom{|S|-1}{k-1}\prod_{i \in S} x_i$. By Lucas'' theorem $\binom{s-1}{k-1}$ is odd iff the binary digits of $k-1$ are a submask of those of $s-1$; with $n = 2^m-1$ and $k = 2^{m-1}$ the only $s-1 \le n-1$ containing the mask $0\underbrace{1\cdots1}_{m-1}$ is $2^{m-1}-1$ itself, so the degree is exactly $2^{m-1} = (n+1)/2$. For $n = 3$ this is the familiar $\mathrm{MAJ}_3 = xy + yz + zx$.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\widetilde{\deg}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: chi, value: '\Theta(n)', refs: [Li18], note: 'Sandwiched: $\chi(f) = \Omega(\mathrm{bs}(f))$ and $\chi(f) = O(\mathrm{R}(f))$, with both ends $\Theta(n)$ here.'}
    - {measure: Adv, value: '\Theta(n)', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)$, with $\lambda(f) = (n+1)/2$ and $\mathrm{Adv}^{\pm}(f) = \Theta(n)$ here. The positive-weight adversary is already tight for majority, unlike for [[ANDOR]]-style functions where the certificate barrier bites.'}
    - {measure: UC, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{D}(f)$, with $\mathrm{C}(f) = (n+1)/2$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: UCmin, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{C}_{\min}(f) \le \mathrm{UC}_{\min}(f) \le \mathrm{UC}(f)$, with $\mathrm{C}_{\min}(f) = (n+1)/2$ and $\mathrm{UC}(f) = \Theta(n)$ here.'}
    - {measure: SP, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with $\mathrm{C}(f) = (n+1)/2$ and $\mathrm{D}(f) = n$ here. Majority cannot separate any of the certificate-flavoured measures from $\mathrm{D}$ by more than a factor of two.'}
    - {measure: D_prod, value: '\Theta(n)', putative: true, note: 'The uniform distribution is already a product distribution and already hard: after $m$ queries the unseen weight is $\mathrm{Bin}(n-m,\tfrac12)$, whose standard deviation $\tfrac12\sqrt{n-m}$ exceeds the distance to the threshold with constant probability unless $n - m = O(1)$. Unlike [[TRIBES]] or [[ADDR]], majority needs no correlated distribution to be hard.'}
    - {measure: Np, value: '\Theta(n\log n)', putative: true, conf: medium, refs: [FRPU94], note: 'Upper: $O(\mathrm{R}\log \mathrm{R})$ by repeating each query $O(\log n)$ times. Lower: on inputs of weight $(n\pm1)/2$ the answer is determined by a margin of one bit, so an estimator of the weight must have error variance $o(1)$; a coordinate read $k$ times still has posterior error probability $2^{-\Theta(k)}$, contributing $\Theta(n2^{-\Theta(k)})$ to the variance of the estimated weight, which forces $k = \Omega(\log n)$ on a constant fraction of the coordinates. So noisy majority is a second natural $\Theta(n\log n)$ family alongside [[PARITY]] -- and the $\Omega(\mathrm{I}\log\mathrm{I})$ bound of [GLX26noisy] only gives $\Omega(\sqrt n\log n)$ here, so it is not the binding constraint.'}
    - {measure: D_size, value: 'O\!\big(2^n/\sqrt n\big)', putative: true, note: 'The counting tree -- query until one side reaches $(n+1)/2$ -- has exactly $\binom{n+1}{(n+1)/2}$ leaves, since the stopping sequences of each type number $\sum_{j<m}\binom{m+j-1}{j} = \tfrac12\binom{2m}{m}$ with $m=(n+1)/2$. That is $6$ for $\mathrm{MAJ}_3$, matching the familiar three-query tree. Recorded as an upper bound only: no matching lower bound is claimed here, the best easy one being $2^{(n+1)/2}$ from the fact that every leaf subcube has codimension $\ge (n+1)/2$.'}
    - {measure: L1, value: '\Theta\!\big(2^{n/2}/\sqrt n\big)', putative: true, refs: [ODonnell14], note: 'Exponentially large, in sharp contrast with $\hat L_1(\mathrm{OR}_n) < 3$. Upper: Cauchy-Schwarz against $\mathrm{spar} = 2^{n-1}$ gives $\hat L_1 \le 2^{(n-1)/2}$. The exact sum $\sum_{k \text{ odd}}\binom nk \big|\widehat{\mathrm{MAJ}}([k])\big|$, evaluated from the standard closed form for $\widehat{\mathrm{MAJ}}(S)$, is $\tfrac{2}{\sqrt\pi}\,2^{n/2}n^{-1/2}(1+o(1))$ -- so majority is within a $\sqrt n$ factor of the largest spectral norm any $n$-bit function can have.'}
    - {measure: Dmu,  value: '\Theta(n)', refs: [Yao77], note: 'Yao''s minimax gives $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(n)$, and the [[D_prod]] line shows the uniform product distribution already attains it: after $o(n)$ queries the unseen coordinates leave the majority undecided with constant probability.'}
    - {measure: cbs,  value: '(n+1)/2', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, which is $(n+1)/2$ at a balanced input.'}
    - {measure: psD,  value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(n)$.'}
    - {measure: NQ,   value: '\lceil (n+1)/4 \rceil', refs: [deWolf00], note: 'Exactly, from $\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$ [deWolf00] and the $\mathrm{ndeg} = (n+1)/2$ recorded above. Nondeterminism buys only a factor $2$ over $\mathrm{Q} = \Theta(n)$ here, unlike at [[OR]] where $\mathrm{NQ} = 1$.'}
  refs: [Paturi92, BBCMdW01, IJKKKSWW23]
  see_also: [THR, EH, RMAJ3, SYM]

- id: THR
  name: Threshold
  symbol: '\mathrm{THR}^n_k'
  group: basic
  order: 14
  kind: total
  arity: '$n$ bits'
  short: 'The whole one-parameter family interpolating OR ($k=1$), MAJ ($k=n/2$) and AND ($k=n$).'
  definition: '$\mathrm{THR}^n_k(x)=1$ iff $|x|\ge k$.'
  formal: '$\mathrm{THR}^n_k(x) = \mathbb{1}[\,\sum_{i=1}^n x_i \ge k\,]$.'
  values:
    - {measure: D,    value: 'n'}
    - {measure: adeg, value: '\Theta\!\big(\sqrt{k(n-k+1)}\big)', refs: [Paturi92]}
    - {measure: Q,    value: '\Theta\!\big(\sqrt{k(n-k+1)}\big)', refs: [BBCMdW01, NayakWu99]}
    - {measure: s,    value: '\max\{k,\; n-k+1\}'}
    - {measure: bs,   value: '\max\{k,\; n-k+1\}'}
    - {measure: C0,   value: 'n-k+1'}
    - {measure: C1,   value: 'k'}
    - {measure: sdeg, value: '1'}
    - {measure: s0,     value: 'n-k+1', note: 'At an input with $k-1$ ones every zero is sensitive.'}
    - {measure: s1,     value: 'k', note: 'At an input with exactly $k$ ones every one is sensitive.'}
    - {measure: bs0,    value: 'n-k+1'}
    - {measure: bs1,    value: 'k'}
    - {measure: fbs,    value: '\max\{k,\;n-k+1\}', note: 'Between $\mathrm{bs}$ and $\mathrm{C}$, which coincide here.'}
    - {measure: FC,     value: '\max\{k,\;n-k+1\}', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: C,      value: '\max\{k,\;n-k+1\}'}
    - {measure: odeg,   value: '\Theta(\sqrt k)', putative: true, note: 'Only the $0$-side is constrained, and it is the interval $\{0,\dots,k-1\}$: Chebyshev on $k$ points gives $O(\sqrt k)$ and Markov gives $\Omega(\sqrt k)$. Compare $\widetilde{\deg} = \Theta(\sqrt{k(n-k+1)})$ -- one-sidedness removes the whole $n-k+1$ factor.'}
    - {measure: Dna,    value: 'n'}
    - {measure: RC, value: '\Theta(\max\{k,\;n-k+1\})', note: 'Sandwiched: $\mathrm{FC}(f) \le \mathrm{RC}(f) \le \mathrm{fbs}(f)$, with both ends $\max\{k,\;n-k+1\}$ here.'}
    - {measure: CA, value: '\Theta(\max\{k,\;n-k+1\})', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = \max\{k,\;n-k+1\}$ here.'}
    - {measure: CGpub, value: '\Theta(\max\{k,\;n-k+1\})', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs}(f) = \max\{k,\;n-k+1\}$ here.'}
    - {measure: CGstar, value: '\Theta(\max\{k,\;n-k+1\})', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(\max\{k,\;n-k+1\})', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Advpm, value: '\Theta\!\big(\sqrt{k(n-k+1)}\big)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta\!\big(\sqrt{k(n-k+1)}\big)$ here.'}
    - {measure: gamma2, value: '\Theta\!\big(\sqrt{k(n-k+1)}\big)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta\!\big(\sqrt{k(n-k+1)}\big)$ here.'}
    - {measure: MAdv, value: '\Theta\!\big(\sqrt{k(n-k+1)}\big)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta\!\big(\sqrt{k(n-k+1)}\big)$ here.'}
    - {measure: Cmin, value: '\min\{k,\; n-k+1\}', putative: true, note: 'A $1$-input needs $k$ ones exhibited and a $0$-input needs $n-k+1$ zeros, so $\mathrm{C}(x)$ takes exactly the two values $k$ and $n-k+1$; the minimum over inputs is the smaller of them. Contrast $\mathrm{C} = \max\{k,\;n-k+1\}$: the gap between [[Cmin]] and [[C]] on this one family is already unbounded (take $k=1$).'}
    - {measure: deg, value: 'n', putative: true, note: 'The top Fourier coefficient is $\sum_{j\ge k}(-1)^{n-j}\binom{n}{j} = (-1)^{n-k}\binom{n-1}{k-1} \ne 0$, so the multilinear polynomial has the full monomial $x_1\cdots x_n$ for every $1 \le k \le n$. This is the tight end of the von zur Gathen-Roche bound recorded on [[SYM]].'}
    - {measure: QE, value: '\Theta(n)', note: 'Between $\deg(f)/2 = n/2$ and the trivial $n$.'}
    - {measure: Q0, value: '\Theta(n)', note: 'Between $\deg(f)/2 = n/2$ and $\mathrm{Q}_{E}(f) \le n$.'}
    - {measure: R, value: '\Theta(n)', note: '$\mathrm{R}(f) = \Omega(\mathrm{bs}(f)) = \Omega(\max\{k,\;n-k+1\}) = \Omega(n)$. Note this holds uniformly in $k$, unlike $\mathrm{Q}$, which drops to $\Theta(\sqrt n)$ at the two ends.'}
    - {measure: Rbar, value: '\Theta(n)'}
    - {measure: R0, value: '\Theta(n)'}
    - {measure: Rna, value: '\Theta(n)'}
    - {measure: Inf, value: 'n\binom{n-1}{k-1}2^{1-n}', putative: true, note: 'Coordinate $i$ is pivotal exactly when the other $n-1$ bits have weight $k-1$. At $k = n/2$ this is $\Theta(\sqrt n)$, recovering [[MAJ]]; at $k=1$ it is $n2^{1-n}$, recovering [[OR]].'}
    - {measure: MaxInf, value: '\binom{n-1}{k-1}2^{1-n}', putative: true, note: 'The family is transitive, so every coordinate carries the same influence: $\mathrm{Inf}(f)/n$.'}
    - {measure: Inf1, value: 'n\binom{n-1}{k-1}2^{1-n}', putative: true, note: 'For a Boolean-valued $f$ the $L_1$ and $L_2$ notions of total influence coincide, so this is the recorded $\mathrm{I}(f)$ verbatim.'}
    - {measure: lambda, value: '\sqrt{k(n-k+1)}', putative: true, note: 'The sensitivity graph is exactly the bipartite graph between Hamming layers $k-1$ and $k$ of the cube: it is biregular of degrees $n-k+1$ (from the $k-1$ side) and $k$ (from the $k$ side), and a connected biregular bipartite graph has spectral norm $\sqrt{d_0 d_1}$ -- put $a$ on one side and $b$ on the other, so that $(n-k+1)b = \lambda a$ and $ka = \lambda b$. Recovers $\lambda(\mathrm{MAJ}) = (n+1)/2$ and $\lambda(\mathrm{OR}) = \sqrt n$, and it is exactly $\sqrt{\mathrm{C}^0\mathrm{C}^1}$, so [[Huang19]]''s $\deg \le \lambda^2$ is tight here only at the two ends.'}
    - {measure: Adv, value: '\Theta\!\big(\sqrt{k(n-k+1)}\big)', putative: true, refs: [Ambainis02], note: 'Lower: Ambainis'' unweighted adversary with $A$ the weight-$(k-1)$ inputs, $B$ the weight-$k$ inputs and Hamming distance $1$ gives $m = n-k+1$, $m'' = k$, $\ell = \ell'' = 1$ and hence $\sqrt{mm''/\ell\ell''} = \sqrt{k(n-k+1)}$. Upper: $\mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}(f))$, which is the same quantity. So the positive-weight adversary is already tight on the whole threshold family -- the certificate barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1}$ is met with equality.'}
    - {measure: ndeg, value: 'k', putative: true, note: 'Upper: $\prod_{j=0}^{k-1}(|x|-j)$ is nonzero exactly on the $1$-inputs and has degree $k$. Lower: let $S$ be a minimal set in the Fourier-style monomial support of a witnessing multilinear $p$; then $p(1_S) = \sum_{T \subseteq S} c_T = c_S \ne 0$, so $1_S$ is a $1$-input and $|S| \ge k$. Dually $\mathrm{ndeg}(\bar f) = n-k+1$.'}
    - {measure: rdeg, value: '\max\{k,\;n-k+1\}', putative: true, refs: [IJKKKSWW23], note: 'Exactly, from the characterisation $\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\} = \max\{k,\,n-k+1\}$ using the [[ndeg]] line above. Consistent with the two general bounds $\mathrm{rdeg} \le \mathrm{C} = \max\{k,\,n-k+1\}$ and $\mathrm{rdeg} = \Omega(\deg)$ for symmetric $f$ [IJKKKSWW23], which here pin it from both sides.'}
    - {measure: NQ, value: '\Theta(k)', putative: true, refs: [deWolf00], note: 'Exactly $\lceil k/2 \rceil$, by de Wolf''s $\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil$ and $\mathrm{ndeg} = k$. Note this is *not* below $\mathrm{Q}$: at $k = n$ ([[AND]]) nondeterministic quantum costs $n/2$ while bounded-error quantum costs $\Theta(\sqrt n)$, because the nondeterministic model is one-sided.'}
    - {measure: rank, value: '\min\{k,\; n-k+1\}', putative: true, note: 'Prover--Delayer: if the Delayer always defers, the Prover must drive the transcript to $k$ ones or to $n-k+1$ zeros before the value is fixed, and scores nothing on the way, so the Delayer banks $\min\{k,\,n-k+1\}$ points. Conversely $r(n,k) := \min\{k,\,n-k+1\}$ satisfies the rank recursion for the tree that queries $x_1$ first: its children have ranks $r(n-1,k-1)$ and $r(n-1,k)$, which differ by one when $k \ne n-k+1$ and are equal to $r(n,k)-1$ when $k = n-k+1$. Recovers $\mathrm{rank}(\mathrm{OR}) = 1$ and $\mathrm{rank}(\mathrm{MAJ}) = (n+1)/2$; against $\mathrm{D} = n$ this is an unbounded rank-vs-depth gap already inside the threshold family.'}
    - {measure: EC, value: '\max\{k,\;n-k+1\}', refs: [GJKKLSSV17], note: 'Squeezed: $\mathrm{fbs}(f) \le \mathrm{EC}(f) \le \mathrm{C}(f)$, and both ends are $\max\{k,\,n-k+1\}$ here.'}
    - {measure: UC, value: '\Theta(n)', note: 'Squeezed: $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{D}(f)$, with $\mathrm{C}(f) = \max\{k,\,n-k+1\} \ge (n+1)/2$ and $\mathrm{D}(f) = n$.'}
    - {measure: UCmin, value: '\Theta(n)', putative: true, refs: [BHT17], note: 'Immediately from $\mathrm{fbs}(f) \le 2\,\mathrm{UC}_{\min}(f)-1$ [BHT17] with $\mathrm{fbs} = \max\{k,\,n-k+1\}$, together with $\mathrm{UC}_{\min} \le \mathrm{UC} = \Theta(n)$. A self-contained route gives the same bound with better constants. Unambiguous covers restrict: intersecting each subcube of a cover with a subcube $\rho$ leaves an unambiguous cover of $f|_\rho$ of no larger width, so $\mathrm{UC}^b(f|_\rho) \le \mathrm{UC}^b(f)$. Fixing $k-1$ ones turns $\mathrm{THR}^n_k$ into $\mathrm{OR}_{n-k+1}$ and fixing $n-k$ zeros turns it into $\mathrm{AND}_k$; for both of these each side has an odd number of inputs ($2^m-1$, or the single point), so some subcube of any unambiguous cover has full codimension. Hence $\mathrm{UC}^0, \mathrm{UC}^1 \ge \max\{k,\,n-k+1\}$ and $\mathrm{UC}_{\min} = \Theta(n)$ -- the threshold family cannot witness anything for the [BHT17] $\mathrm{C}$-vs-$\mathrm{UC}_{\min}$ question.'}
    - {measure: SP, value: '\Theta(n)', note: 'Squeezed: $\mathrm{C}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with $\mathrm{C}(f) \ge (n+1)/2$ and $\mathrm{D}(f) = n$.'}
    - {measure: R1, value: '\Theta(n)', note: 'Squeezed: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$.'}
    - {measure: RS, value: '\Theta(n)', refs: [BenDavidKothari18], note: 'Squeezed: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)$, with both ends $\Theta(n)$.'}
    - {measure: chi, value: '\Theta(n)', refs: [Li18], note: 'Squeezed: $\chi(f) = \Omega(\mathrm{bs}(f))$ and $\chi(f) = O(\mathrm{R}(f))$, with both ends $\Theta(n)$.'}
    - {measure: chibar, value: '\Theta(n)', refs: [GLSS19], note: 'Squeezed: $\mathrm{RS}(f) = O(\bar{\chi}(f))$ and $\bar{\chi}(f) = O(\mathrm{R}(f))$, with both ends $\Theta(n)$.'}
    - {measure: LR, value: '\Theta(n)', refs: [BBGM22], note: 'Squeezed: $\bar{\chi}(f) = O(\mathrm{LR}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(n)$.'}
    - {measure: Rstar, value: '\Theta(n)', refs: [BBGM22], note: 'Squeezed: $\mathrm{LR}(f) = O(\mathrm{R}^{*}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(n)$.'}
    - {measure: noisyR, value: '\Theta(n)', refs: [CKMPSS23], note: 'From $\mathrm{R}(f) = \Theta(n) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ -- see the [[noisyR]] vs [[R]] record. Fractional queries buy nothing at the top of the range.'}
    - {measure: prt, value: '\Theta(n)', note: 'Squeezed: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{s}(f) = \max\{k,\,n-k+1\}$ and $\mathrm{D}(f) = n$.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Squeezed: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{s}(f) = \max\{k,\,n-k+1\}$ and $\mathrm{D}(f) = n$. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: QC, value: '\Theta(\sqrt n)', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{RC}(f)})$ for every $f$, and $\mathrm{RC}(f) = \Theta(\max\{k,\,n-k+1\}) = \Theta(n)$ here. Verifying a threshold is quadratically cheaper than computing it, uniformly in $k$.'}
    - {measure: CG, value: '\Theta(k(n-k+1))', refs: [CGLMSG23], note: 'Squeezed by the [CGLMSG23] sandwich $\max\{\mathrm{Adv}^2,\mathrm{R}_0\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$: the upper end is $k(n-k+1)$ and $\mathrm{Adv}^2 = \Theta(k(n-k+1))$ from the [[Adv]] line above. Interpolates the two recorded endpoints, $\Theta(n)$ for [[OR]] and $\Theta(n^2)$ for [[MAJ]], and shows the whole intermediate range $n^{1+c}$ is realised.'}
    - {measure: deg2, value: '\Theta(n)', putative: true, note: 'Over $\mathbb{F}_2$, $\mathrm{THR}^n_k = \sum_{|S|\ge k}\binom{|S|-1}{k-1}\prod_{i\in S}x_i$, so $\deg_2 = \max\{s \le n : \binom{s-1}{k-1} \text{ odd}\}$, which by Lucas is the largest $s-1 \le n-1$ whose binary expansion contains that of $k-1$. Let $2^t \le n-1 < 2^{t+1}$. If $k-1 < 2^t$ then $s-1 = 2^t-1$ qualifies and $\deg_2 \ge 2^t \ge (n-1)/2$; otherwise $k-1 \ge 2^t$ and already $s-1 = k-1$ gives $\deg_2 \ge k > (n-1)/2$. So thresholds get at most a factor-two discount from characteristic $2$; see the exact $\deg_2(\mathrm{MAJ}_n) = 2^{\lfloor\log_2 n\rfloor}$ on [[MAJ]].'}
    - {measure: Fdim, value: 'n', putative: true, note: 'Every singleton is in the Fourier support: $\hat f(\{i\})$ is a nonzero multiple of $\binom{n-1}{k-1}$, which is exactly the statement that $\mathrm{MaxInf}(f) \ne 0$. The $n$ singletons already span $\mathbb{F}_2^n$.'}
    - {measure: D_prod, value: '\Theta(n)', putative: true, note: 'Take the product distribution with each bit $1$ independently with probability $p$ chosen so that $\Pr[|x| \ge k] = \tfrac12$; this is $p = \Theta(k/n)$. Run a depth-$m$ deterministic tree and follow the single path on which every answer is $0$: it is reached with probability $(1-p)^{m}$, and conditioned on it the residual weight is $\mathrm{Bin}(n-m,p)$, whose chance of reaching $k$ stays bounded away from $0$ and $1$ as long as $m \le \alpha n$ for a small constant $\alpha$. The product of the two is more than $1/3$, so $\mathrm{D}^{\mathrm{prod}} = \Omega(n)$, matching the trivial $\mathrm{D} = n$. Even at $k=1$, where the threshold sits at the very edge, no product distribution is easy.'}
    - {measure: ardeg, value: 'O(\log n)', refs: [Newman64, MahadevdeWolf15], note: 'Newman''s degree-$O(\log(1/\delta))$ rational approximation to $\mathrm{sign}$ on $[-1,-\delta]\cup[\delta,1]$, applied after the affine map $j \mapsto (j-k+\tfrac12)/n$ so that $\delta = \Theta(1/n)$. Recorded as an upper bound only, because the truth genuinely depends on $k$: it is $\Theta(\log n)$ at $k = n/2$ [MahadevdeWolf15] but only $1$ at $k=1$, where $2|x|/(1+2|x|)$ already separates $|x|=0$ from $|x|\ge1$.'}
    - {measure: PostQ, value: 'O(\log n)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_{\varepsilon}(f) = \Theta(\mathrm{rdeg}_{\varepsilon}(f))$, and the [[ardeg]] line above gives $O(\log n)$. Postselection collapses the whole threshold family to polylogarithmic cost, against $\mathrm{Q} = \Theta(\sqrt{k(n-k+1)})$.'}
    - {measure: D_size, value: 'O\!\big(\binom{n+1}{k}\big)', putative: true, note: 'The counting tree, which reads $x_1,x_2,\dots$ and stops as soon as $k$ ones or $n-k+1$ zeros have been seen, has $\sum_{z\le n-k}\binom{k-1+z}{z} + \sum_{o<k}\binom{n-k+o}{o} = \binom{n}{k}+\binom{n}{k-1} = \binom{n+1}{k}$ leaves by the hockey-stick identity. Upper bound only: the best easy lower bound is $2^{\min\{k,\,n-k+1\}}$, from the fact that every leaf subcube has codimension at least $\min\{k,\,n-k+1\}$.'}
    - {measure: Dmu,  value: '\Theta(n)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(n)$, uniformly in $k$ by the [[R]] line, and the [[D_prod]] line exhibits a product distribution attaining it.'}
    - {measure: cbs,  value: '\max\{k,\; n-k+1\}', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, recorded on the [[bs]] line.'}
    - {measure: psD,  value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(n)$, uniformly in $k$.'}
    - {measure: cjdeg, value: '\Theta(n)', putative: true, conf: medium, note: 'Restricting $k-1$ variables to $1$ turns $\mathrm{THR}^n_k$ into $\vee_{n-k+1}$, and restricting $n-k$ variables to $0$ turns it into $\wedge_k$. A conical junta restricts to a conical junta of no larger width, so the [[OR]] and [[AND]] lower bounds give $\mathrm{cjdeg} = \Omega(\max\{k,\ n-k+1\}) = \Omega(n)$; and $\mathrm{cjdeg}_{\varepsilon} \le \mathrm{D} = n$. So, uniformly in $k$, non-negativity destroys the $\widetilde{\deg} = \Theta(\sqrt{k(n-k+1)})$ saving -- at $k=1$ this is a quadratic gap.'}
    - {measure: degp, value: '\Theta(n)', putative: true, note: 'For **every** prime $p$. Over the integers $\mathrm{THR}^n_k = \sum_{|S| \ge k} (-1)^{|S|-k}\binom{|S|-1}{k-1}\prod_{i \in S} x_i$ (the [[deg]] line), and reducing this unique multilinear form mod $p$ shows $\deg_p = \max\{s \le n : \binom{s-1}{k-1} \not\equiv 0 \bmod p\}$. Taking $s = k$ gives the coefficient $\binom{k-1}{k-1} = 1$, so $\deg_p \ge k$; substituting $x_i \mapsto 1-x_i$ preserves degree and maps $\mathrm{THR}^n_k$ to the complement of $\mathrm{THR}^n_{n-k+1}$, so also $\deg_p \ge n-k+1$. Hence $\deg_p \ge \max\{k,\ n-k+1\} \ge (n+1)/2$, and $\deg_p \le n$. No prime helps, in contrast with [[ADDR]].'}
    - {measure: PDT,  value: '\Theta(n)', putative: true, refs: [ChistopolskayaPodolskii18], note: 'Between $n - \log_2 n$ and $n$. Upper: $\mathrm{D}^{\oplus} \le \mathrm{D} = n$. Lower by granularity: in the $\pm1$ encoding the top Fourier coefficient is $\pm 2^{1-n}\binom{n-1}{k-1}$ (the [[deg]] line), so the granularity is at least $n-1-\nu_2\binom{n-1}{k-1}$, and $\mathrm{D}^{\oplus} \ge \mathrm{gran}+1$ [ChistopolskayaPodolskii18]. By Kummer''s theorem $\nu_2\binom{n-1}{k-1}$ counts the carries when adding $k-1$ and $n-k$ in base $2$, hence is at most $\log_2 n$. At $k = (n+1)/2$ this reproduces the exact $n - \mathrm{B}(n) + 1$ recorded for [[MAJ]]; parity queries never help a threshold.'}
    - {measure: Np,   value: '\Omega(n),\ O(n\log n)', conf: medium, refs: [FRPU94, GLX26noisy], note: 'Lower: $\mathrm{N}_p \ge \mathrm{R} = \Theta(n)$, uniformly in $k$. Upper: $O(\mathrm{R}\log\mathrm{R})$ by repeating each query $O(\log n)$ times. Recorded as a range because the truth genuinely depends on $k$: the log factor *is* needed at $k = (n+1)/2$ ([[MAJ]], $\Theta(n\log n)$) and is *not* needed at $k = 1$ ([[OR]], $\Theta(n)$). The influence-based bound $\mathrm{N}_p = \Omega(\mathrm{I}\log\mathrm{I})$ [GLX26noisy] with $\mathrm{I} = n\binom{n-1}{k-1}2^{1-n}$ interpolates between the two.'}
    - {measure: robustQ, value: '\Theta\!\big(\sqrt{k(n-k+1)}\big)', refs: [BNRdW05], note: 'Theorem 4 of [BNRdW05] gives a robust quantum algorithm using $O(\sqrt{n(n-\Gamma(f)+1)})$ queries for every symmetric $f$; here $\Gamma = |2k-n-1|$, so $n - \Gamma + 1$ is $2k$ for $k \le (n+1)/2$ and $2(n-k+1)$ otherwise, and the bound reads $O(\sqrt{k(n-k+1)})$. That matches $\mathrm{Q}$ from above, and $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q}$. So noise is free for the quantum algorithm at every $k$, while classically it costs a $\log$ factor at $k \approx n/2$.'}
  refs: [Paturi92, NayakWu99]
  see_also: [OR, AND, MAJ, SYM]

- id: SYM
  name: Symmetric functions (general)
  symbol: 'f = f(|x|)'
  group: basic
  order: 15
  kind: total
  arity: '$n$ bits'
  short: 'Every measure in the polynomial/quantum column is pinned down exactly by Paturi''s theorem.'
  definition: |
    $f$ is *symmetric* if $f(x)$ depends only on the Hamming weight $|x|$; write
    $f(x) = f_{|x|}$. Let
    $$\Gamma(f) \;=\; \min\{\,|2k-n+1| \;:\; f_k \ne f_{k+1}\,\}$$
    measure how close to the middle layer the "jump" is.
  formal: |
    $f:\{0,1\}^n\to\{0,1\}$ with $f(x)=f(\sigma x)$ for all permutations $\sigma$.
    Equivalently $f = g \circ (\sum_i x_i)$ for some $g : \{0,\dots,n\}\to\{0,1\}$.
  values:
    - {measure: adeg, value: '\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)', refs: [Paturi92]}
    - {measure: Q,    value: '\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)', refs: [BBCMdW01, Paturi92], note: 'Approximate degree characterises $\mathrm{Q}$ exactly (up to constants) for symmetric functions.'}
    - {measure: deg,  value: 'n - O(n^{0.548})', refs: [vzGathenRoche97], note: 'What is **proved**: von zur Gathen--Roche show $\deg(f) \ge n - O(n^{0.548})$ for every non-constant symmetric $f$, and $\deg(f)\le n$ is trivial, so $\deg(f) = n - O(n^{0.548})$. Their exponent comes from prime gaps: $\deg(f) = n - O(g(n))$ where $g$ bounds the gap below $n$, so any improvement on prime gaps improves this line automatically, and the Riemann Hypothesis would give $n - O(\sqrt n\log n)$. **Conjecturally** the truth is $\deg(f) \in \{n, n-1\}$ for every non-constant symmetric $f$ -- i.e. $\deg(f) = n - O(1)$; it has been checked exhaustively for small $n$, and it holds for every $f$ whose jump structure is a single threshold (see [[THR]], where $\deg = n$ exactly).'}
    - {measure: D,    value: 'n \text{ (for all but trivial } f)'}
    - {measure: rdeg, value: '\Omega(\deg(f))', refs: [IJKKKSWW23], note: 'Asymptotically tight: symmetric functions cannot separate rdeg from deg.'}
    - {measure: Dna,  value: 'n', note: 'A non-degenerate symmetric function depends on every coordinate.'}
    - {measure: Advpm, value: '\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)$ here.'}
    - {measure: gamma2, value: '\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)$ here.'}
    - {measure: MAdv, value: '\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)$ here.'}
    - {measure: s, value: '\Theta(n)', putative: true, note: 'Pick any $k$ with $f_k \ne f_{k+1}$. At an input of weight $k$ all $n-k$ zeros are sensitive, and at an input of weight $k+1$ all $k+1$ ones are, so $\mathrm{s}(f) \ge \max\{k+1,\,n-k\} \ge \lceil (n+1)/2\rceil$. Every non-constant symmetric function therefore has sensitivity $\Theta(n)$ -- this, and not the degree, is the reason symmetric functions are uninteresting for the classical measures: everything from $\mathrm{s}$ up to $\mathrm{D}$ collapses to $\Theta(n)$ regardless of $\Gamma(f)$.'}
    - {measure: bs, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{bs}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: fbs, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{fbs}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: FC, value: '\Theta(n)', refs: [Tal13], note: '$\mathrm{FC}(f) = \mathrm{fbs}(f)$ exactly, by LP duality.'}
    - {measure: C, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{C}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: EC, value: '\Theta(n)', refs: [GJKKLSSV17], note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{EC}(f) \le \mathrm{C}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: UC, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: SP, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: RC, value: '\Theta(n)', refs: [Aaronson08], note: '$\mathrm{RC}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$, and $\mathrm{fbs}(f) = \Theta(n)$ here.'}
    - {measure: CA, value: '\Theta(n)', refs: [ABIKPS17], note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for total $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = \Theta(n)$ here.'}
    - {measure: CGpub, value: '\Theta(n)', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{CA}(f))$ for every $f$, and $\mathrm{CA}(f) = \Theta(n)$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger. In particular $\mathrm{CG}^{*}$ is $\Theta(n)$ for *every* symmetric function, however small $\mathrm{Q}$ gets.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CG, value: '\Omega(n),\ O(n^2)', refs: [CGLMSG23], note: 'The [CGLMSG23] sandwich is $\max\{\mathrm{Adv}^2, \mathrm{R}_0\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$, and for a generic non-constant symmetric $f$ only $\mathrm{R}_0 = \Theta(n)$ is available below while $\mathrm{C}^0\mathrm{C}^1 = O(n^2)$ caps it above. Which end is reached depends on the function: it is $\Theta(n)$ for [[OR]] and $\Theta(n^2)$ for [[PARITY]] and [[MAJ]], both of which are symmetric, so no single value can be recorded for the whole class.'}
    - {measure: R, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f)/3 \le \mathrm{R}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. Randomization never helps on a symmetric function, in sharp contrast with $\mathrm{Q}$, which drops to $\Theta(\sqrt n)$ when the jump is at the edge.'}
    - {measure: R0, value: '\Theta(n)', note: 'Sandwiched between $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched between $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$.'}
