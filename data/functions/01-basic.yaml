    - {measure: cjdeg, value: '\Theta(n)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\widetilde{\deg}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\widetilde{\deg}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\widetilde{\deg}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: C1, value: 'n', putative: true, note: 'A $1$-input has weight exactly $n/2$, and flipping any single unfixed coordinate leaves the middle slice, so a $1$-certificate must fix all $n$ coordinates. This is the value that makes $\mathrm{C} = n$.'}
    - {measure: C0, value: 'n/2 + 1', putative: true, note: 'A partial assignment with $a$ ones and $b$ zeros forces the answer $0$ exactly when $a > n/2$ or $b > n/2$, so the cheapest $0$-certificate exhibits $n/2+1$ equal bits, and every $0$-input has one. Matches $\mathrm{s}^0 = n/2+1$, so blocks and fractional relaxations buy nothing on the $0$-side.'}
    - {measure: bs0, value: 'n/2 + 1', note: 'Sandwiched: $\mathrm{s}^0(f) \le \mathrm{bs}^0(f) \le \mathrm{C}^0(f)$, with both ends $n/2+1$ here.'}
    - {measure: Cmin, value: 'n/2 + 1', putative: true, note: 'Every $0$-input costs $n/2+1$ and every $1$-input costs $n$, so the minimum is the $0$-side value. The factor-$2$ gap to $\mathrm{C} = n$ is the whole of the asymmetry of $\mathrm{EH}$.'}
    - {measure: EC, value: 'n', refs: [GJKKLSSV17], note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{EC}(f) \le \mathrm{C}(f)$, with both ends $n$ here.'}
    - {measure: UC, value: 'n', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: SP, value: 'n', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with both ends $n$ here. The $1$-inputs are isolated points of the cube, so no monochromatic subcube containing one can have codimension below $n$.'}
    - {measure: rdeg, value: '\Theta(n)', refs: [IJKKKSWW23], note: '$\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\}$, and symmetric functions have $\mathrm{rdeg} = \Omega(\deg)$ (see [[SYM]]). Since $\mathrm{ndeg}(\overline{\mathrm{EH}}) = 1$, the whole of $\mathrm{rdeg}$ comes from $\mathrm{ndeg}(\mathrm{EH}) = \Theta(n)$ -- this is precisely the $\mathrm{ndeg}$-versus-$\mathrm{rdeg}$ separation that $\mathrm{EH}$ is famous for.'}
    - {measure: RS, value: '\Theta(n)', refs: [BenDavidKothari18], note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: QC, value: '\Theta(\sqrt n)', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{RC}(f)})$ for every $f$, and $\mathrm{RC}(f) = \Theta(n)$ here. So verifying is quadratically cheaper even though computing costs the full $\Theta(n)$ quantumly.'}
    - {measure: Inf, value: '\Theta(\sqrt n)', putative: true, note: 'Coordinate $i$ is pivotal exactly when the other $n-1$ bits have weight $n/2$ or $n/2-1$, so $\mathrm{Inf}_i = \binom{n}{n/2}2^{1-n} = \Theta(1/\sqrt n)$ and the total is $\Theta(\sqrt n)$ -- the same order as [[MAJ]], despite $\mathrm{EH}$ being exponentially unbalanced.'}
    - {measure: Inf1, value: '\Theta(\sqrt n)', note: 'Boolean-valued, so equal to $\mathrm{I}(f)$.'}
    - {measure: MaxInf, value: '\binom{n}{n/2}2^{1-n}', putative: true, note: 'The family is transitive, so every coordinate carries $\mathrm{I}(f)/n = \Theta(1/\sqrt n)$.'}
    - {measure: rank, value: 'n/2 + 1', putative: true, note: 'Prover-Delayer: the value stays undetermined until one of the two counts reaches $n/2+1$, and until then the Delayer may defer on every query, so she scores $n/2+1$; the counting tree, which stops as soon as either count passes $n/2$, attains it. Same value as [[MAJ]] -- exactness costs nothing in rank, only in depth on the $1$-side.'}
    - {measure: D_prod, value: '\Theta(n)', putative: true, note: 'Fix $n/2$ coordinates to be $1$ with probability $1$ and give each of the other $n/2$ probability $2/n$. Then $\mathrm{EH} = 1$ exactly when none of the low-probability bits fires, which happens with probability $\to e^{-1} > 1/3$, and deciding that is $\mathrm{OR}$ under its own hard product distribution: after $m$ zeros the conditional probability of a remaining $1$ is still $1 - (1-2/n)^{n/2-m}$. So $m = \Omega(n)$, and product distributions are already worst case.'}
    - {measure: robustQ, value: '\Theta(n)', refs: [BNRdW05], note: 'Sandwiched between $\mathrm{Q} = \Theta(n)$ and the universal $O(n)$ robust upper bound.'}
    - {measure: Np, value: '\Theta(n\log n)', putative: true, conf: medium, refs: [FRPU94], note: 'Upper: $O(\mathrm{R}\log \mathrm{R})$ by repeating each query. Lower: as for [[MAJ]], only more so -- the answer changes when a single bit moves the weight off $n/2$, so every coordinate must be resolved to error $o(1/n)$, costing $\Omega(\log n)$ repetitions each.'}
    - {measure: Fdim, value: 'n-1', putative: true, note: '$\mathrm{EH}_n(\bar x) = \mathrm{EH}_n(x)$, so only even-size sets carry Fourier weight and the support lies in the even-weight subspace of $\mathbb{F}_2^n$, of dimension $n-1$. It spans that subspace: every level-$2$ coefficient is nonzero, since conditioned on the middle slice $\mathbb{E}[X_iX_j] = -1/(n-1) \ne 0$. Note the singletons all vanish -- $\mathrm{EH}$ has no linear part at all.'}
    - {measure: deg2, value: 'n-1', putative: true, note: 'Recorded along the subfamily $n = 2^m$. The $\mathbb{F}_2$ coefficient of the monomial $\prod_{i\in S}x_i$ in $\mathrm{EH}_n$ is $\binom{|S|}{n/2} \bmod 2$, so $\deg_2$ is the largest $s \le n$ whose binary expansion contains that of $n/2$ (Lucas). For $n = 2^m$ the bit $2^{m-1}$ is absent from $n$ itself, and the largest admissible $s$ is $n-1 = 2^m-1$. For other $n$ the answer jumps around -- e.g. $\deg_2(\mathrm{EH}_6) = 3$ -- which is why the value is recorded on a subfamily.'}
    - {measure: sdeg, value: '2', note: 'A symmetric function has threshold degree equal to the number of sign changes of its slice pattern, and $\mathrm{EH}$ changes sign twice. Explicitly $p(x) = \tfrac14 - \big(\sum_i x_i - \tfrac n2\big)^2$ is positive exactly on the middle slice. So $\mathrm{sdeg} = 2$ against $\widetilde{\deg} = \Theta(n)$. Threshold degree is not a lower bound on anything interesting on its own: [[MAJ]] does even better with $\mathrm{sdeg} = 1$, and the point of [[MinskyPapert]] is that a *small-depth* function can force $\mathrm{sdeg}$ up at all. What makes $\mathrm{EH}$ instructive is that its two sign changes are forced -- one is not enough for a non-monotone slice pattern -- so the exact value is $2$ rather than merely $O(1)$.'}
    - {measure: NQ, value: '\lceil n/4 \rceil', refs: [deWolf00], note: '$\mathrm{NQ}(f) = \lceil\mathrm{ndeg}(f)/2\rceil$ [deWolf00] applied to the $\mathrm{ndeg} = n/2$ line above. For the negation the same formula gives $\mathrm{NQ}(\overline{\mathrm{EH}}_n) = 1$: one nondeterministic query certifies *inequality* to $n/2$, while $n/4$ are needed to certify equality.'}
    - {measure: UCmin, value: '\Theta(n)', putative: true, refs: [BHT17], note: 'Lower: $\mathrm{fbs} \le 2\,\mathrm{UC}_{\min}-1$ [BHT17] with $\mathrm{fbs} = n$ gives $\mathrm{UC}_{\min} \ge (n+1)/2$. Upper: $\mathrm{UC}_{\min} \le \mathrm{UC}^1 = n$, the $1$-inputs being isolated points, which the partition into singletons covers unambiguously. The exact constant is open here; note that no unambiguous $0$-cover can use only minimum $0$-certificates, since two all-ones certificates of size $n/2+1$ must overlap in a coordinate and their subcubes then share the input $1_{S \cup T}$.'}
    - {measure: PDT, value: '\Theta(n)', putative: true, refs: [ChistopolskayaPodolskii18], note: 'Upper: $\mathrm{D}^{\oplus} \le \mathrm{D} = n$. Lower by granularity: in the $\pm1$ encoding the top coefficient is $\hat g([n]) = \mp\binom{n}{n/2}2^{1-n}$, and $\nu_2\binom{n}{n/2}$ equals the number of carries in adding $n/2 + n/2$ in base $2$, namely the binary digit sum of $n/2$ (Kummer). So the granularity is at least $n-1-\log_2 n$ and $\mathrm{D}^{\oplus} \ge n - \log_2 n$. Along $n = 2^m$ the digit sum is $1$, pinning $\mathrm{D}^{\oplus}$ to $n-1$ or $n$: parity queries buy at most one query on the middle slice.'}
    - {measure: D_size, value: '\Theta(2^n/\sqrt n)', putative: true, note: 'Lower: $\mathrm{C}^1 = n$, so every $1$-leaf is a single point of the cube and the tree needs $\binom{n}{n/2}$ of them. Upper: the counting tree -- read $x_1,x_2,\dots$ and halt as soon as either count exceeds $n/2$ -- has $\binom{n}{n/2} + 2\binom{n}{n/2+1}$ leaves. Both ends are $\Theta(2^n/\sqrt n)$.'}
    - {measure: spar, value: '2^{n-1}', putative: true, note: 'Exactly. Using $\binom ns K_k(s) = \binom nk K_s(k)$ and $K_s(n/2) = [z^s](1-z)^{n/2}(1+z)^{n/2} = [z^s](1-z^2)^{n/2}$, the Fourier coefficient at a set of size $s$ is $\widehat{\mathrm{EH}}(S) = 2^{-n}\binom{n}{n/2}(-1)^{s/2}\binom{n/2}{s/2}\big/\binom ns$ for even $s$, and $0$ for odd $s$. So every even-size set carries a nonzero coefficient and no odd one does -- consistent with the recorded $\mathrm{Fdim} = n-1$.'}
    - {measure: L1, value: '\Theta(2^{n/2}/\sqrt n)', putative: true, note: 'Exactly $\binom{n}{n/2}2^{-n/2}$, from the closed form on the [[spar]] line: the binomials $\binom ns$ cancel and $\hat L_1 = 2^{-n}\binom{n}{n/2}\sum_{t}\binom{n/2}{t} = 2^{-n/2}\binom{n}{n/2}$. Asymptotically $\sqrt{2/\pi}\,2^{n/2}n^{-1/2}$ -- the same order as [[MAJ]], and within $\sqrt n$ of the maximum possible, which is what Cauchy--Schwarz against $\mathrm{spar} = 2^{n-1}$ predicts.'}
    - {measure: NS, value: '\Theta(1/\sqrt n)', putative: true, note: 'For every fixed $\delta \in (0,1/2)$. $\mathrm{NS}_\delta = 2\big(M - \Pr[\mathrm{EH}(x)=\mathrm{EH}(y)=1]\big)$ with $M = \binom{n}{n/2}2^{-n} = \Theta(n^{-1/2})$, and the joint probability is $M^2\sum_t \rho^{2t}\binom{n/2}{t}^2/\binom{n}{2t} \to M^2/\sqrt{1-\rho^2}$ at $\rho = 1-2\delta$, of order $1/n$. So $\mathrm{NS}_\delta = 2M(1-o(1))$: noise almost always destroys a $1$, but $1$s are rare, so the function is *noise stable* in the crude sense while carrying no low-degree structure at all.'}
    - {measure: Stab, value: '1 - \Theta(1/\sqrt n)', putative: true, note: 'The [[NS]] line through $\mathrm{Stab}_\rho = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$, for every fixed $\rho \in (-1,1)$. The exponentially unbalanced $\pm1$ encoding is what makes this tend to $1$; the whole spectrum above level $0$ carries weight only $4M(1-M) = \Theta(n^{-1/2})$.'}
    - {measure: odeg, value: '\Theta(n)', putative: true, refs: [Paturi92], note: 'Equal to $\widetilde{\deg}$, by a normalisation that works because the $1$-inputs form a single slice. Symmetrising a one-sided approximant $p$ gives a univariate $P$ of degree $\le \deg p$ with $|P(k)| \le 1/3$ for $k \ne n/2$ and $M := P(n/2) \ge 2/3$; the one-sided model puts no ceiling on $M$. Now replace $P$ by $P/\max\{1,M\}$. If $M \le 1$ nothing changes and the error at $n/2$ is $1-M \le 1/3$; if $M > 1$ the error at $n/2$ becomes $0$ and the errors elsewhere only shrink. Either way the result is a genuine two-sided $1/3$-approximation, so $\mathrm{odeg} \ge \widetilde{\deg} = \Theta(n)$ [Paturi92]. One-sidedness saves nothing here, in sharp contrast with [[OR]], where $3\sum_i x_i$ gives $\mathrm{odeg} = 1$ against $\widetilde{\deg} = \Theta(\sqrt n)$ -- the difference being that $\mathrm{OR}$ has $1$-inputs on every slice, so no single rescaling can tame them.'}
    - {measure: ardeg, value: 'O(1)', putative: true, refs: [MahadevdeWolf15], note: 'Degree $2$ suffices: $r(x) = \big(1 + 2(\sum_i x_i - n/2)^2\big)^{-1}$ equals $1$ on the middle slice and is at most $1/3$ everywhere else, since $|\sum_i x_i - n/2| \ge 1$ off it. This is the sharpest gap in the zoo between rational and polynomial approximation: $\widetilde{\deg} = \Theta(n)$ and even $\mathrm{rdeg} = \Theta(n)$ (exact rational representation), yet approximate rational degree is constant. Recorded as $O(1)$ because $\ge 2$ is not proved -- only $\ge 1$ from non-constancy.'}
    - {measure: PostQ, value: 'O(1)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_{\varepsilon}(f) = \Theta(\mathrm{rdeg}_{\varepsilon}(f))$ [MahadevdeWolf15] applied to the [[ardeg]] line: a postselecting quantum algorithm decides $\mathrm{EH}_n$ with $O(1)$ queries while $\mathrm{Q} = \Theta(n)$, the largest possible separation.'}
    - {measure: degp, value: '\Theta(n)', putative: true, note: 'For **every** prime $p$. The coefficient of $\prod_{i \in S}x_i$ in the integer multilinear expansion is $(-1)^{|S|-n/2}\binom{|S|}{n/2}$, so $\deg_p$ is the largest $s \le n$ with $\binom{s}{n/2} \not\equiv 0 \pmod p$. Taking $s = n/2$ gives $\binom{n/2}{n/2} = 1$, so $\deg_p \ge n/2$ in every characteristic, and $\deg_p \le n$ trivially. Which $s$ is largest jumps around with $p$ and $n$ by Lucas -- see the [[deg2]] line for the $p=2$ story -- but the order is always $n$.'}
    - {measure: Dmu,  value: '\Theta(n)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(n)$; the [[D_prod]] line shows the uniform distribution already attains it.'}
    - {measure: cbs,  value: 'n', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, which is $n$ here, attained at any input of weight $n/2$.'}
    - {measure: psD,  value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(n)$.'}
  refs: [IJKKKSWW23, Paturi92]
  see_also: [ANDEH, rdeg, SYM]

- id: OMB
  name: ODD-MAX-BIT
  symbol: '\mathrm{OMB}_n'
  group: basic
  order: 17
  kind: total
  arity: '$n$ bits'
  short: 'Sign degree $1$, deterministic complexity $n$: the extreme sdeg separation.'
  definition: |
    $\mathrm{OMB}_n(x) = 1$ iff the largest index $i$ with $x_i = 1$ is odd
    (and $\mathrm{OMB}_n(0^n)=0$).
  formal: |
    $$\mathrm{OMB}_n(x) = \mathrm{sign}\Big(\sum_{i=1}^n (-1)^{i+1}\, 2^{\,n-i}\, x_i\Big)_{+}$$
    i.e. it is the linear threshold function with exponentially decreasing weights;
    the highest-index $1$ dominates all lower-index terms.
  values:
    - {measure: sdeg, value: '1', note: 'It is a linear threshold function -- but every representation needs exponentially large weights.'}
    - {measure: D,    value: 'n'}
    - {measure: R,    value: '\Theta(n)'}
    - {measure: noisyR, value: '\Theta(n)', note: 'From $\mathrm{R}(f) = \Theta(n) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ [CKMPSS23] -- see the [[noisyR]] vs [[R]] record. At the top of the range there is no room for fractional queries to help.'}
    - {measure: Dna,  value: 'n'}
    - {measure: s,    value: '\lfloor n/2 \rfloor + 1', putative: true, note: 'Coordinates below the highest $1$ are never sensitive, so at an input whose highest $1$ is at position $i$ only position $i$ and the opposite-parity positions above it can be sensitive: $\mathrm{s}(x) \le 1 + \lceil (n-i)/2\rceil$. The bound is met at $x=e_1$, where $\{1\}\cup\{j>1 : j \text{ even}\}$ is sensitive.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}}(f) = n$ here.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: C, value: '\lfloor n/2 \rfloor + 1', putative: true, note: 'A certificate need not pin the highest $1$ -- it only has to force the answer. If the highest $1$ of $x$ is at position $i$, it is enough to fix $x_i = 1$ and to zero out the *opposite-parity* positions above $i$: $1 + |\{j > i : j \not\equiv i\}|$ coordinates, maximised at $i = 1$ giving $\lfloor n/2\rfloor + 1$. That also matches $\mathrm{bs} = \lfloor n/2\rfloor+1 \le \mathrm{C}$, so the bound is tight. (Verified exhaustively for $n \le 12$.)'}
    - {measure: C0, value: '\lceil n/2 \rceil', putative: true, note: 'Attained at $0^n$, where zeroing the $\lceil n/2\rceil$ odd positions already forces the answer $0$ -- and at any $0$-input whose highest $1$ sits at position $2$.'}
    - {measure: C1, value: '\lfloor n/2 \rfloor + 1', putative: true, note: 'Attained at $e_1$: fix $x_1 = 1$ and zero the $\lfloor n/2\rfloor$ even positions above it.'}
    - {measure: Cmin, value: '1', putative: true, note: 'At $x = e_n$, reading $x_n = 1$ already decides (the answer is the parity of $n$). Certificate complexity varies by a factor of $\Theta(n)$ across inputs.'}
    - {measure: bs, value: '\lfloor n/2 \rfloor + 1', putative: true, note: 'Equal to $\mathrm{s}$, so blocks buy nothing. A sensitive block at $x$ either contains the current highest $1$ (at most one such block can be disjoint from the others) or has its own maximum above it, of parity opposite to $i$ -- and distinct disjoint blocks need distinct maxima. That caps the count at $1+\lceil (n-i)/2\rceil$, the same bound as for $\mathrm{s}$, and $x=e_1$ attains it.'}
    - {measure: fbs, value: '\lfloor n/2 \rfloor + 1', putative: true, note: 'The same argument survives the fractional relaxation: charge each block to its maximum index, and the load constraint at that coordinate caps the total weight per admissible maximum at $1$.'}
    - {measure: deg, value: 'n', putative: true, note: 'Writing $\mathrm{OMB} = \sum_{i \text{ odd}} x_i\prod_{j>i}(1-x_j)$, the monomial $x_1x_2\cdots x_n$ can only come from the $i=1$ term, with coefficient $(-1)^{n-1} \ne 0$. So $\deg = n$ against $\mathrm{sdeg} = 1$ -- the maximum possible separation between exact and sign degree.'}
    - {measure: deg2, value: 'n', putative: true, note: 'The same expansion over $\mathbb{F}_2$, with the same top monomial and coefficient $1$.'}
    - {measure: Q, value: '\Theta(\sqrt n)', putative: true, note: 'Upper: quantum maximum-finding [DurrHoyer96] locates the highest $1$ in $O(\sqrt n)$ queries; its parity is the answer. Lower: setting all even-indexed bits to $0$ restricts $\mathrm{OMB}$ to $\mathrm{OR}$ on the odd ones, so $\mathrm{Q} \ge \mathrm{Q}(\mathrm{OR}_{\lceil n/2\rceil}) = \Omega(\sqrt n)$.'}
    - {measure: adeg, value: '\Theta(\sqrt n)', note: 'Squeezed: $\mathrm{bs} = O(\widetilde{\deg}^2)$ gives $\widetilde{\deg} = \Omega(\sqrt n)$, and $\widetilde{\deg} \le 2\mathrm{Q} = O(\sqrt n)$.'}
    - {measure: QE, value: '\Theta(n)', note: 'Squeezed between $\deg/2 = n/2$ and $\mathrm{D} = n$. So $\mathrm{OMB}$ has a full quadratic exact-vs-bounded-error quantum gap.'}
    - {measure: Q0, value: '\Theta(n)', note: 'Same squeeze: $\deg \le 2\mathrm{Q}_0$ and $\mathrm{Q}_0 \le \mathrm{D}$.'}
    - {measure: D_size, value: 'n+1', putative: true, note: 'Query $x_n, x_{n-1}, \dots$ and stop at the first $1$: a path with $n$ branchings, hence $n+1$ leaves. The all-zero input forces a root-to-leaf path of length $n$, so no smaller tree exists.'}
    - {measure: s0, value: '\lceil n/2 \rceil', putative: true, note: 'Attained at $0^n$: flipping position $j$ makes $j$ the highest $1$, which flips the answer exactly for the $\lceil n/2\rceil$ odd $j$. (Verified exhaustively for $n \le 12$.)'}
    - {measure: s1, value: '\lfloor n/2 \rfloor + 1', putative: true, note: 'Attained at $e_1$: the $\lfloor n/2 \rfloor$ even positions above, plus position $1$ itself. This is the value recorded as $\mathrm{s}$.'}
    - {measure: bs0, value: '\lceil n/2 \rceil', putative: true, note: 'Equal to $\mathrm{s}^0$: blocks buy nothing on either side, by the maximum-index charging argument used for $\mathrm{bs}$. (Verified exhaustively for $n \le 12$.)'}
    - {measure: bs1, value: '\lfloor n/2 \rfloor + 1', putative: true, note: 'Equal to $\mathrm{s}^1$, and to $\mathrm{bs}$.'}
    - {measure: FC, value: '\lfloor n/2 \rfloor + 1', refs: [Tal13, KulkarniTal16], note: '$\mathrm{FC}(f) = \mathrm{fbs}(f)$ exactly, by LP duality.'}
    - {measure: EC, value: '\lfloor n/2 \rfloor + 1', refs: [GJKKLSSV17], note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{EC}(f) \le \mathrm{C}(f)$, with both ends $\lfloor n/2\rfloor+1$ here.'}
    - {measure: RC, value: '\Theta(n)', refs: [Aaronson08], note: '$\mathrm{RC}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$, and $\mathrm{fbs}(f) = \lfloor n/2\rfloor+1$ here.'}
    - {measure: CA, value: '\Theta(n)', refs: [ABIKPS17], note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for total $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = \lfloor n/2\rfloor+1$ here.'}
    - {measure: CGpub, value: '\Theta(n)', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{CA}(f))$ for every $f$, and $\mathrm{CA}(f) = \Theta(n)$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger. Note $\mathrm{CG}^{*} = \Theta(n)$ against $\mathrm{Q} = \Theta(\sqrt n)$: another instance of the entangled certificate game *not* being bounded by quantum query complexity.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CG, value: '\Omega(n),\ O(n^2)', refs: [CGLMSG23], note: 'From below $\mathrm{R}_0 = \Theta(n)$ and $\mathrm{Adv}^2 = \Theta(n)$; from above $\mathrm{C}^0\mathrm{C}^1 = \Theta(n^2)$ [CGLMSG23]. The two ends do not meet and nothing in the zoo closes the gap, so the cell is recorded as a range rather than as the old (unjustified) $\Theta(n)$, which rested on the false inequality $\mathrm{CG} \le \mathrm{D}$.'}
    - {measure: RS, value: '\Theta(n)', refs: [BenDavidKothari18], note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: chi, value: '\Theta(n)', refs: [Li18], note: 'Sandwiched: $\chi(f) = \Omega(\mathrm{bs}(f))$ and $\chi(f) = O(\mathrm{R}(f))$, with both ends $\Theta(n)$ here.'}
    - {measure: chibar, value: '\Theta(n)', refs: [GLSS19], note: 'Sandwiched: $\mathrm{RS}(f) = O(\bar{\chi}(f))$ and $\bar{\chi}(f) = O(\mathrm{R}(f))$, with both ends $\Theta(n)$ here.'}
    - {measure: LR, value: '\Theta(n)', refs: [BBGM22], note: 'Sandwiched: $\bar{\chi}(f) = O(\mathrm{LR}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: Rstar, value: '\Theta(n)', refs: [BBGM22], note: 'Sandwiched: $\mathrm{LR}(f) = O(\mathrm{R}^{*}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: QC, value: '\Theta(\sqrt n)', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{RC}(f)})$ for every $f$, and $\mathrm{RC}(f) = \Theta(n)$ here.'}
    - {measure: lambda, value: '\Theta(\sqrt n)', refs: [ABKRT21], note: 'Sandwiched: $\sqrt{\mathrm{s}(f)} \le \lambda(f) = O(\mathrm{Q}_{\varepsilon}(f))$, with $\mathrm{s}(f) = \lfloor n/2\rfloor+1$ and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt n)$ here. So [[OMB]] joins [[OR]] as a family where Huang''s $\mathrm{s} \le \lambda^2$ is tight.'}
    - {measure: Advpm, value: '\Theta(\sqrt n)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt n)$ here.'}
    - {measure: Adv, value: '\Theta(\sqrt n)', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)$, with both ends $\Theta(\sqrt n)$ here.'}
    - {measure: gamma2, value: '\Theta(\sqrt n)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt n)$ here.'}
    - {measure: MAdv, value: '\Theta(\sqrt n)', refs: [Spalek08], note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(\sqrt n)$ here.'}
    - {measure: rank, value: '1', putative: true, note: 'The optimal tree is a caterpillar: query $x_n$, then $x_{n-1}$, and so on, stopping at the first $1$ -- whose index immediately gives the answer. Every internal node therefore has a leaf child, so the rank is $1$ (and it cannot be $0$, as $\mathrm{OMB}$ is not constant). Against $\mathrm{D} = n$ this is the maximum possible rank-vs-depth gap, matching [[OR]]. It also explains $\mathrm{DTsize} = n+1$.'}
    - {measure: Inf, value: '\Theta(1)', putative: true, note: 'Coordinate $i$ is pivotal only when every bit above it is $0$, which costs $2^{-(n-i)}$; conditioned on that, flipping $x_i$ moves the maximum to the highest $1$ below $i$, whose index has the opposite parity with probability $\tfrac12+\tfrac18+\tfrac1{32}+\cdots = \tfrac23$. Summing the geometric series, $\mathrm{I}(\mathrm{OMB}_n) \to 4/3$. So $\mathrm{OMB}$ is a *balanced* function of total influence $O(1)$ and $\mathrm{D} = n$.'}
    - {measure: Inf1, value: '\Theta(1)', note: 'Boolean-valued, so equal to $\mathrm{I}(f)$.'}
    - {measure: MaxInf, value: '\Theta(1)', putative: true, note: 'The top bit $x_n$ is the most influential and carries essentially all of the influence: it is pivotal exactly when the highest $1$ below it has the opposite parity, probability $\to 2/3$. Influence is concentrated on one coordinate -- the exact opposite of the [[TRIBES]] shape.'}
    - {measure: degp, value: 'n', putative: true, note: 'For **every** prime $p$. The expansion $\mathrm{OMB} = \sum_{i \text{ odd}} x_i\prod_{j>i}(1-x_j)$ has the top monomial $x_1\cdots x_n$ only from the $i=1$ term, with coefficient $(-1)^{n-1}$, which is nonzero in every characteristic. So small characteristic buys nothing, exactly as for [[OR]].'}
    - {measure: UC, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{D}(f)$, with $\mathrm{C}(f) = \lfloor n/2\rfloor+1$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: UCmin, value: '\Theta(n)', refs: [BHT17], note: 'Squeezed: $\mathrm{fbs}(f) \le 2\,\mathrm{UC}_{\min}(f)-1$ [BHT17] forces $\mathrm{UC}_{\min} \ge \tfrac12(\lfloor n/2\rfloor+2) = \Omega(n)$, and $\mathrm{UC}_{\min} \le \mathrm{UC} = \Theta(n)$. Note the contrast with $\mathrm{C}_{\min} = 1$: the *one-sided* unambiguous measure is not a minimum over inputs and does not collapse.'}
    - {measure: SP, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with $\mathrm{C}(f) = \lfloor n/2\rfloor+1$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: PDT, value: 'n', putative: true, refs: [ChistopolskayaPodolskii18], note: 'At most $\mathrm{D} = n$. For the lower bound, take the $\pm1$-valued $g = 1-2\mathrm{OMB}$: in the expansion $\mathrm{OMB} = \sum_{i \text{ odd}} x_i\prod_{j>i}(1-x_j)$ only the $i=1$ term involves $x_1$, so it alone determines $\hat g(S)$ for every $S \ni 1$, and each such coefficient is exactly $\pm 2^{-(n-1)}$. The granularity is therefore exactly $n-1$, and the bound $\mathrm{D}^{\oplus} \ge \mathrm{gran}+1$ of [ChistopolskayaPodolskii18] gives $n$. So parity queries buy nothing, even though $\mathrm{sdeg} = 1$.'}
    - {measure: Fdim, value: 'n', putative: true, note: 'Full. By the computation on the [[PDT]] line, $\hat g(S) = \pm2^{-(n-1)} \ne 0$ for *every* $S$ containing the coordinate $1$; in particular $\{1\}$ and $\{1,j\}$ are in the support, and their $\mathbb{F}_2$-sum is $\{j\}$.'}
    - {measure: spar, value: '\Theta(2^n)', putative: true, note: 'At least $2^{n-1}$, since every one of the $2^{n-1}$ sets containing coordinate $1$ carries the nonzero coefficient $\pm2^{-(n-1)}$ (see the [[PDT]] line); at most $2^n$ trivially.'}
    - {measure: D_prod, value: '\Theta(n)', putative: true, note: 'Take the product distribution with each bit $1$ independently with probability $c/n$ for a suitable constant $c$. Run a depth-$m$ deterministic tree and follow the path on which every answer is $0$: it is reached with probability $\approx e^{-cm/n}$, and conditioned on it the highest $1$ lies among the $n-m$ unread coordinates, where its index is odd with probability $\tfrac12(1-e^{-c(n-m)/n})$ -- bounded away from $0$ and $1$. For $m \le 0.1n$ the product of the two exceeds $1/3$, so $\mathrm{D}^{\mathrm{prod}} = \Omega(n)$, matching $\mathrm{D} = n$. Unlike its randomized *expected* cost, which is $O(1)$ under this distribution, the worst-case depth stays linear.'}
    - {measure: L1, value: '\Theta(n)', putative: true, note: 'Exactly. The $2^{-(n-i+1)}$-weighted subcubes $B_i = \{x_i=1,\ x_j=0\ \forall j>i\}$ for odd $i$ partition $\mathrm{OMB}^{-1}(1)$, and $\mathbb{1}_{B_i} = 2^{-(n-i+1)}(1-\chi_i)\prod_{j>i}(1+\chi_j)$. Summing, a set $S$ with $\min S = t$ gets $\widehat{\mathrm{OMB}}(S) = \sum_{i \text{ odd},\, i \le t} 2^{i-n-1} - 2\cdot[t \text{ odd}]\,2^{t-n-1}$, whose absolute value is $\tfrac23 2^{t-n-1}(1+o(1))$ for either parity of $t$. There are $2^{n-t}$ sets with $\min S = t$, so each $t$ contributes $\tfrac13$ and $\hat L_1 = \tfrac{2n}{3}(1+o(1))$ in the $\pm1$ encoding. Linear, not exponential -- $\mathrm{OMB}$ is a sum of only $n/2$ subcube indicators, so it sits with [[OR]] rather than with [[MAJ]] on the spectral-norm scale, despite having full degree.'}
    - {measure: cjdeg, value: '\Theta(n)', putative: true, conf: medium, note: 'Upper: $\mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f) = n$. Lower: setting every even position to $0$ leaves $\vee_{\lceil n/2\rceil}$ on the odd positions, and a conical junta restricts to a conical junta of no larger width, so $\mathrm{cjdeg} = \Omega(n)$ by the [[OR]] line. Non-negativity therefore costs a quadratic blow-up over $\widetilde{\deg}_{\varepsilon} = \Theta(\sqrt n)$.'}
    - {measure: robustQ, value: '\Omega(\sqrt n),\ O(n)', refs: [BNRdW05], note: 'Lower: $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(\sqrt n)$. Upper: the universal $O(n)$ bound of [BNRdW05] for recovering all $n$ noisy bits. Whether the $\sqrt n$ algorithm survives noise is the interesting question and is not settled here.'}
    - {measure: Np, value: '\Omega(n),\ O(n\log n)', refs: [FRPU94], note: 'Lower: $\mathrm{N}_p \ge \mathrm{R} = \Theta(n)$. Upper: repeat each query $O(\log n)$ times. The influence-based lower bound of the [[Np]] record gives nothing here, since $\mathrm{I}(\mathrm{OMB}) = \Theta(1)$ -- so unlike [[PARITY]] or [[ADDR]] there is no evidence that the log factor is needed.'}
    - {measure: ndeg, value: '\lfloor n/2 \rfloor + 1', putative: true, refs: [deWolf03], note: 'Exactly. Upper: $\mathrm{ndeg} \le \mathrm{C}^1 = \lfloor n/2\rfloor + 1$ (the [[C1]] line). Lower: set every odd position $\ge 3$ to $0$ and leave $x_1$ together with the $\lfloor n/2\rfloor$ even positions free; the restriction is $1$ iff $x_1 = 1$ and all even positions are $0$, an $\mathrm{AND}$ on $\lfloor n/2\rfloor+1$ variables with some of them negated. Nondeterministic degree cannot increase under restriction or under negating variables, and $\mathrm{ndeg}(\wedge_m) = m$ (the [[AND]] line). Exhaustive computation of the minimal witnessing degree for $n \le 9$ agrees.'}
    - {measure: rdeg, value: '\lfloor n/2 \rfloor + 1', putative: true, refs: [deWolf03], note: 'Exactly, from $\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f),\ \mathrm{ndeg}(\bar f)\}$. The line above gives $\mathrm{ndeg}(f) = \lfloor n/2\rfloor+1$. For the complement, $\mathrm{ndeg}(\bar f) \le \mathrm{C}^0 = \lceil n/2\rceil$, and setting all even positions to $0$ leaves $\bar f$ equal to the $\mathrm{AND}$ of the negations of the $\lceil n/2 \rceil$ odd variables, so $\mathrm{ndeg}(\bar f) = \lceil n/2\rceil$. The maximum is $\lfloor n/2\rfloor+1$, meeting the general bound $\mathrm{rdeg} \le \mathrm{C}$ recorded on the [[C]] line.'}
    - {measure: NQ,   value: '\lceil (\lfloor n/2 \rfloor + 1)/2 \rceil', refs: [deWolf00], note: 'Exactly, from $\mathrm{NQ}(f) = \lceil\mathrm{ndeg}(f)/2\rceil$ [deWolf00] and the [[ndeg]] line. So $\mathrm{NQ} = \Theta(n)$ while $\mathrm{Q} = \Theta(\sqrt n)$: nondeterminism is quadratically *worse* than bounded error here, the same phenomenon as at [[AND]].'}
    - {measure: odeg, value: '\Theta(\sqrt n)', putative: true, note: 'Upper: $\widetilde{\deg}_+ \le \widetilde{\deg} = \Theta(\sqrt n)$. Lower: one-sided approximate degree does not increase under restriction or under negating variables, and the restriction used on the [[ndeg]] line turns OMB into an $\mathrm{AND}$ on $\lfloor n/2\rfloor+1$ variables, for which $\widetilde{\deg}_+ = \Theta(\sqrt n)$ (the [[AND]] line). So the one-sided relaxation buys nothing, even though $\mathrm{sdeg}(\mathrm{OMB}) = 1$.'}
    - {measure: ardeg, value: '1', putative: true, refs: [MahadevdeWolf15], note: 'Degree $1$ suffices, as for [[OR]]. Take $N(x) = \sum_{i \text{ odd}} 10^i x_i$ and $D(x) = 1 + \sum_i 10^i x_i$, both of degree $1$, and let $h$ be the highest position with $x_h = 1$ (with $h=0$ for $x = 0^n$, where $N/D = 0$). Then $10^h \le D \le 1 + \tfrac{10}{9}(10^h-1) < 1.112\cdot 10^h$. If $h$ is odd then $10^h \le N \le \tfrac{100}{99}10^h$, so $N/D \ge 0.899$; if $h$ is even then $N \le \tfrac{100}{99}10^{h-1}$, so $N/D \le 0.102$. Hence $|N/D - \mathrm{OMB}| \le 0.102$ everywhere, for every $n$ (the true maximum is $0.092$). Compare $\widetilde{\deg} = \Theta(\sqrt n)$ and $\mathrm{D} = n$.'}
    - {measure: PostQ, value: '\Theta(1)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_{\varepsilon}(f) = \Theta(\mathrm{rdeg}_{\varepsilon}(f))$ [MahadevdeWolf15], and $\mathrm{rdeg}_{\varepsilon} = 1$ on the [[ardeg]] line. Postselection collapses OMB entirely, against $\mathrm{Q} = \Theta(\sqrt n)$ and $\mathrm{D} = n$ -- the largest gap in this file after [[EH]].'}
    - {measure: NS,   value: '\tfrac{4\delta}{3(1+\delta)} + o(1)', putative: true, note: 'For every fixed $\delta$, as $n \to \infty$. Scan positions from the top: at each one the pair $(x_i,y_i)$ is $(0,0)$ with probability $(1-\delta)/2$, so conditioned on the first position $k$ where it is not, the pair is $(1,1)$ with probability $\tfrac{1-\delta}{1+\delta}$ -- both highest ones are then at $k$ and the answers agree -- and is $(1,0)$ or $(0,1)$ with probability $\tfrac{2\delta}{1+\delta}$. In the latter case one highest one is at $k$ and the other is the highest one of a fresh uniform string below $k$, whose position has parity opposite to $k$ with probability $\tfrac12+\tfrac18+\cdots = \tfrac23$. Multiplying gives $\tfrac{2\delta}{1+\delta}\cdot\tfrac23$. So OMB is noise-stable in the sense that $\mathrm{NS}_\delta \to 0$ with $\delta$, uniformly in $n$, unlike [[PARITY]] or [[TRIBES]].'}
    - {measure: Stab, value: '1 - \tfrac{8(1-\rho)}{3(3-\rho)} + o(1)', putative: true, note: 'From $\mathrm{Stab}_\rho = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$ and the [[NS]] line. It is $1/9$ at $\rho = 0$, so two independent uniform inputs still give correlated answers -- the highest-one statistic is dominated by the top few coordinates.'}
    - {measure: Dmu,  value: '\Theta(n)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(n)$; the [[D_prod]] line exhibits a product distribution attaining it.'}
    - {measure: cbs,  value: '\lfloor n/2 \rfloor + 1', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, recorded on the [[bs]] line.'}
    - {measure: psD,  value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(n)$.'}
  witnesses:
    - {of: [D, sdeg], setting: total, statement: 'Unbounded: $\mathrm{D}=n$, $\mathrm{sdeg}=1$. Sign degree is *not* polynomially related to any other measure in the zoo.', refs: [Beigel94]}
    - {of: [deg, sdeg], setting: total, statement: 'Unbounded and maximal: $\deg = n$ against $\mathrm{sdeg} = 1$.'}
    - {of: [C, Cmin], setting: total, statement: 'Unbounded: $\mathrm{C}=\lfloor n/2\rfloor+1$ at $e_1$ against $\mathrm{C}_{\min}=1$ at $e_n$.'}
    - {of: [QE, Q], setting: total, statement: 'Quadratic: $\mathrm{Q}_E = \Theta(n)$ (forced by $\deg = n$) against $\mathrm{Q} = \Theta(\sqrt n)$ (quantum maximum finding).'}
  refs: [Beigel94, MinskyPapert69, DurrHoyer96]
  see_also: [sdeg, MAJ, deg, Q]

- id: ADDR
  name: ADDRESS / multiplexer
  symbol: '\mathrm{ADDR}_k'
  aliases: ['MUX', 'index function', 'storage access function']
  group: basic
  order: 18
  kind: total
  arity: '$k + 2^k$ bits'
  short: 'The standard gadget in lifting theorems and in "adaptivity is necessary" arguments.'
  definition: |
    Input is $(a, y)$ with $a \in \{0,1\}^k$ an *address* and $y \in \{0,1\}^{2^k}$
    a *table*; the output is $y_a$.
  formal: '$\mathrm{ADDR}_k(a, y) = y_{\mathrm{bin}(a)}$ where $\mathrm{bin}(a)\in\{0,\dots,2^k-1\}$ is the integer encoded by $a$.'
  values:
    - {measure: D,   value: 'k+1'}
    - {measure: deg, value: 'k+1'}
    - {measure: s,   value: 'k+1'}
    - {measure: bs,  value: 'k+1'}
    - {measure: C,   value: 'k+1'}
    - {measure: C0,     value: 'k+1'}
    - {measure: C1,     value: 'k+1'}
    - {measure: fbs,    value: 'k+1', note: 'Between $\mathrm{bs}=k+1$ and $\mathrm{C}=k+1$.'}
    - {measure: FC,     value: 'k+1', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: R,      value: '\Theta(k)', refs: [Nisan91], note: 'At most $\mathrm{D}=k+1$, and at least $\mathrm{bs}/3 = \Omega(k)$.'}
    - {measure: L1,     value: '2^k', note: 'Write $\mathrm{ADDR}_k = \sum_a \mathbb{1}[\mathrm{addr}=a]\cdot y_a$: each term has spectral norm $1$ and the $2^k$ terms have disjoint Fourier supports, so the norms add.'}
    - {measure: ndeg,   value: '\Theta(k)', note: 'Upper: $\mathrm{ndeg} \le \mathrm{C}^{1} = k+1$, and in fact $\sum_a \mathbb{1}[\mathrm{addr}=a]\,y_a$ *is* the function, of degree $k+1$. Lower: restrict the data table to $e_{a_0}$; the restriction is $\mathbb{1}[\mathrm{addr}=a_0]$, and a polynomial that is nonzero at exactly one point of $\{0,1\}^k$ is a scalar multiple of that point indicator, of degree $k$. So $\mathrm{ndeg} \in \{k, k+1\}$.'}
    - {measure: NQ,     value: '\Theta(k)', refs: [deWolf00], note: '$\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2 \rceil$ [deWolf00], and $\mathrm{ndeg} = \Theta(k)$ above. Together with $\hat L_1 = 2^k$ this is the zoo''s only family separating spectral norm from either nondeterministic measure -- and the gap is exponential, not polynomial.'}
    - {measure: Dna,    value: 'k + 2^k', note: 'Every data bit is relevant, so a non-adaptive algorithm reads the entire table.'}
    - {measure: Rna,    value: '\Theta(2^k)', note: 'A fixed distribution over $m$ data bits contains the addressed one with probability at most $m/2^k$; otherwise the algorithm is guessing an unbiased bit.'}
    - {measure: RC, value: '\Theta(k+1)', note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{RC}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: R0, value: 'k+1', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: CA, value: '\Theta(k+1)', note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = k+1$ here.'}
    - {measure: CGpub, value: '\Theta(k+1)', note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$ ([[CGpub]] vs [[fbs]]), and $\mathrm{fbs}(f) = k+1$ here.'}
    - {measure: CGstar, value: '\Theta(k+1)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(k+1)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Rbar, value: '\Theta(k+1)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: R1, value: 'k+1', note: 'Sandwiched: $\mathrm{C}^1(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: chi, value: '\Theta(k+1)', note: 'Sandwiched: $\mathrm{s}(f) \le \chi(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: chibar, value: '\Theta(k+1)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\chi}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: LR, value: '\Theta(k+1)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: Rstar, value: '\Theta(k+1)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: CG, value: '\Theta(k^2)', putative: true, refs: [CGLMSG23], note: 'Both ends of the [CGLMSG23] sandwich land on $k^2$: $\mathrm{Adv}^2 = \Theta(k^2)$ from below and $\mathrm{C}^0\mathrm{C}^1 = (k+1)^2$ from above. So the address function too has $\mathrm{CG}$ above its own decision-tree complexity $k+1$ -- quadratically so.'}
    - {measure: QE, value: '\Theta(k+1)', note: 'Sandwiched: $\deg(f)/2 \le \mathrm{Q}_{\mathrm{E}}(f) \le \mathrm{D}(f)$ -- the same halving as on [[TRIBES]] -- with $\deg(f) = k+1$ and $\mathrm{D}(f) = k+1$ here, so both ends are $\Theta(k)$.'}
    - {measure: prt, value: '\Theta(k+1)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here.'}
    - {measure: rprt, value: '\Theta(k+1)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $k+1$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: s0, value: 'k+1', putative: true, note: 'Take $y \equiv 0$ except $y_a = 0$ with all $2^k$ table entries chosen so that every address-neighbour of $a$ carries a $1$: then all $k$ address bits and $y_a$ itself are sensitive. Complementing the table swaps the two sides, so $\mathrm{s}^0 = \mathrm{s}^1$.'}
    - {measure: s1, value: 'k+1', putative: true, note: 'By the complement symmetry $\mathrm{ADDR}_k(a,\bar y) = 1 - \mathrm{ADDR}_k(a,y)$, the two sides are equal; see $\mathrm{s}^0$.'}
    - {measure: bs0, value: 'k+1', note: 'Squeezed between $\mathrm{s}^0 = k+1$ and $\mathrm{bs} = k+1$.'}
    - {measure: bs1, value: 'k+1', note: 'Squeezed between $\mathrm{s}^1 = k+1$ and $\mathrm{bs} = k+1$.'}
    - {measure: Cmin, value: 'k+1', putative: true, note: 'A certificate that fixes $j$ of the address bits leaves $2^{k-j}$ live addresses and must therefore pin all $2^{k-j}$ of the corresponding table entries, for a total of $j + 2^{k-j} \ge k+1$ coordinates, with equality only at $j=k$ (and $j=k-1$). So *every* input has $\mathrm{C}(x) = k+1$: $\mathrm{C} = \mathrm{C}_{\min} = k+1$ and $\mathrm{ADDR}$ is perfectly balanced in certificate size.'}
    - {measure: UC, value: 'k+1', putative: true, note: 'The family $\{a \text{ fixed},\, y_a = b\}$ over all $2^k$ addresses is unambiguous -- each input matches exactly one member per output value -- and has width $k+1 = \mathrm{C}$.'}
    - {measure: UCmin, value: 'k+1', note: 'Between $\mathrm{C}_{\min} = k+1$ and $\mathrm{UC} = k+1$.'}
    - {measure: SP, value: 'k+1', putative: true, note: 'The natural tree (read the address, then the addressed entry) partitions the cube into codimension-$(k+1)$ monochromatic subcubes, and no monochromatic subcube can have codimension below $\mathrm{C}_{\min} = k+1$.'}
    - {measure: EC, value: 'k+1', note: 'Between $\mathrm{fbs} = k+1$ and $\mathrm{C} = k+1$.'}
    - {measure: rank, value: 'k+1', putative: true, note: 'Upper: $\mathrm{rank} \le \mathrm{D} = k+1$. Lower: in the Prover--Delayer game the Delayer defers on every query, so the game lasts at least $\mathrm{C}_{\min}$ rounds; in general $\mathrm{C}_{\min}(f) \le \mathrm{rank}(f)$, and here $\mathrm{C}_{\min} = k+1$. So $\mathrm{ADDR}$ has *full* rank: none of its depth is caterpillar.'}
    - {measure: D_size, value: '2^{k+1}', putative: true, note: 'Each leaf-subcube is monochromatic, hence of codimension $\ge \mathrm{C}_{\min} = k+1$, hence of measure $\le 2^{-(k+1)}$; the leaves partition the cube, so there are at least $2^{k+1}$ of them. The natural tree achieves it: $2^k$ address paths, each ending in one table query.'}
    - {measure: deg2, value: 'k+1', putative: true, note: 'Over $\mathbb{F}_2$, $\mathrm{ADDR}_k = \sum_a \big(\prod_{i:\,a_i=1} z_i \prod_{i:\,a_i=0} (1+z_i)\big)\, y_a$ with $z$ the address. Each summand has the top monomial $z_1\cdots z_k\, y_a$, and these carry distinct table variables, so nothing cancels: $\deg_2 = k+1$.'}
    - {measure: sdeg, value: '\Theta(k)', putative: true, note: 'Restricting the table to $y_b = \mathrm{parity}(b)$ turns $\mathrm{ADDR}_k$ into $\mathrm{PARITY}_k$, and sign degree cannot increase under restriction, so $\mathrm{sdeg} \ge \mathrm{sdeg}(\mathrm{PARITY}_k) = k$; also $\mathrm{sdeg} \le \deg = k+1$.'}
    - {measure: adeg, value: '\Theta(k)', note: 'Squeezed between $\mathrm{sdeg} = \Omega(k)$ and $\deg = k+1$.'}
    - {measure: Q, value: '\Theta(k)', note: 'Squeezed between $\widetilde{\deg}/2 = \Omega(k)$ and $\mathrm{D} = k+1$. Quantum buys nothing on the multiplexer.'}
    - {measure: Q0, value: '\Theta(k)', note: 'Between $\mathrm{Q} = \Omega(k)$ and $\mathrm{D} = k+1$.'}
    - {measure: Adv, value: '\Theta(k)', note: 'Between $\sqrt{\mathrm{bs}^0\,\mathrm{bs}^1} = k+1$ and $\mathrm{Q} = O(k)$.'}
    - {measure: Advpm, value: '\Theta(k)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q} = \Theta(k)$ here.'}
    - {measure: MAdv, value: '\Theta(k)', note: 'Also $\Theta(\mathrm{Q})$ for every $f$, and $\mathrm{Q} = \Theta(k)$ here.'}
    - {measure: Inf, value: '(k+2)/2', putative: true, note: 'Flipping an address bit moves the pointer to a uniformly unrelated table entry, flipping the output with probability $1/2$: total $k/2$. Flipping table entry $y_b$ matters exactly when $\mathrm{bin}(a) = b$, probability $2^{-k}$, and there are $2^k$ of them: total $1$. So $\mathrm{Inf} = k/2 + 1$.'}
    - {measure: MaxInf, value: '1/2', putative: true, note: 'Attained by any address bit (for $k \ge 1$); each table bit has influence only $2^{-k}$.'}
    - {measure: spar, value: '4^k', putative: true, note: 'In the $\pm 1$ basis each of the $2^k$ terms $\mathbb{1}[\mathrm{addr}=a]\,y_a$ expands into $2^k$ monomials of coefficient $\pm 2^{-k}$, and the $y_a$ factor keeps the supports of different $a$ disjoint. Consistent with the recorded $\mathrm{L}_1 = 4^k \cdot 2^{-k} = 2^k$.'}
    - {measure: Fdim, value: 'k + 2^k', putative: true, note: 'The Fourier support contains every singleton $\{y_a\}$ and every subset of the address bits, so it spans all $n$ coordinates over $\mathbb{F}_2$.'}
    - {measure: noisyR, value: '\Theta(k)', refs: [CKMPSS23], note: 'From $\mathrm{R}(f) = \Theta(k) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ -- see the [[noisyR]] vs [[R]] record.'}
    - {measure: RS, value: '\Theta(k)', refs: [BenDavidKothari18], note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)$, with both ends $\Theta(k)$ here.'}
    - {measure: gamma2, value: '\Theta(k)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(k)$ here.'}
    - {measure: QC, value: '\Theta(\sqrt k)', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{RC}(f)})$ for every $f$, and $\mathrm{RC}(f) = \Theta(k)$ here.'}
    - {measure: lambda, value: '\Theta(k)', putative: true, note: 'Upper: $\lambda(f) \le \mathrm{s}(f) = k+1$. Lower: the spectral norm of a graph is at least its average degree, and the average degree of the sensitivity graph is exactly $\mathrm{I}(f) = (k+2)/2$.'}
    - {measure: Inf1, value: '(k+2)/2', note: 'Boolean-valued, so equal to $\mathrm{I}(f)$.'}
    - {measure: cjdeg, value: '\Theta(k)', note: 'Squeezed: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(k)$ here.'}
    - {measure: rdeg, value: '\Theta(k)', note: 'Squeezed: $\mathrm{ndeg}(f) \le \mathrm{rdeg}(f) \le \mathrm{C}(f)$, with $\mathrm{ndeg}(f) = \Theta(k)$ recorded above and $\mathrm{C}(f) = k+1$.'}
    - {measure: odeg, value: '\Theta(k)', putative: true, note: 'Squeezed between $\mathrm{odeg}(\mathrm{PARITY}_k) = k$ -- restrict the table to $y_b = \mathrm{parity}(b)$, as on the [[sdeg]] line, and note that one-sided approximation survives restriction -- and $\widetilde{\deg}(f) = O(k)$.'}
    - {measure: ardeg, value: '\Theta(k)', putative: true, refs: [MahadevdeWolf15], note: 'Upper: $\mathrm{rdeg}_{\varepsilon} \le \mathrm{rdeg} = O(k)$. Lower: the same restriction to $\mathrm{PARITY}_k$, whose approximate rational degree is $\Theta(k)$. So postselection does not help the multiplexer at all.'}
    - {measure: PostQ, value: '\Theta(k)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_{\varepsilon}(f) = \Theta(\mathrm{rdeg}_{\varepsilon}(f)) = \Theta(k)$.'}
    - {measure: degp, value: 'k+1', putative: true, note: 'For **every** prime $p$: the expansion $\sum_a \big(\prod_{i:a_i=1} z_i \prod_{i:a_i=0}(1-z_i)\big) y_a$ used for $\deg_2$ has top monomials $z_1\cdots z_k\,y_a$ with coefficient $\pm1$, nonzero in every characteristic, and they cannot cancel because they carry distinct table variables.'}
    - {measure: PDT, value: '\Theta(k)', putative: true, note: 'Upper: $\mathrm{D}^{\oplus} \le \mathrm{D} = k+1$. Lower: a depth-$d$ parity decision tree has at most $2^d$ leaves, each an affine subspace of codimension $\le d$ whose indicator has Fourier support of size $2^d$, so $\mathrm{spar}(f) \le 4^{d}$; with $\mathrm{spar} = 4^k$ this forces $d \ge k$. Parity queries save at most one query on the multiplexer.'}
    - {measure: D_prod, value: '\Theta(k)', putative: true, note: 'Take the uniform distribution. A tree of depth $m$ leaves at least $k-m$ address bits unread, so the addressed entry is uniform over $\ge 2^{k-m}$ candidates of which at most $m$ have been read; for $m \le k/2$ the algorithm identifies it with probability $\le m2^{-k/2}$ and is otherwise flipping a fair coin. Hence $\mathrm{D}^{\mathrm{prod}} = \Omega(k)$, matching $\mathrm{D} = k+1$. (The exact optimum is $k$, not $k+1$: read $k-1$ address bits and one of the two surviving entries, and guess when the address misses -- error $1/4$.)'}
    - {measure: Np, value: '\Theta(k\log k)', putative: true, conf: medium, refs: [GLX26noisy, FRPU94], note: 'Upper: $\mathrm{N}_p(f) = O(\mathrm{R}(f)\log\mathrm{R}(f))$ by repeating each query $O(\log k)$ times. Lower: $\mathrm{N}_p(f) = \Omega(\mathrm{I}(f)\log\mathrm{I}(f))$ [GLX26noisy] with $\mathrm{I}(f) = (k+2)/2$. The two meet, so the multiplexer joins [[PARITY]] and [[TreeNav]] as a family where the repetition log factor is provably necessary -- unsurprisingly, since a single corrupted address bit sends the walk to an unrelated table entry.'}
    - {measure: Stab, value: '\rho\big(\tfrac{1+\rho}{2}\big)^{k}', putative: true, note: 'Exactly. In the $\pm1$ basis $g = 2^{-k}\sum_a\sum_{S \subseteq [k]} \pm\,\chi_S\,Y_a$, so every one of the $4^k$ Fourier coefficients is $\pm2^{-k}$ and the set $S \cup \{y_a\}$ has size $|S|+1$; summing, $\mathrm{Stab}_\rho = 2^{-2k}\,2^k\rho\sum_{S}\rho^{|S|} = 2^{-k}\rho(1+\rho)^k$. Identical in form to [[TreeNav]] with one more level, as it should be.'}
    - {measure: NS, value: '\tfrac12\big(1-(1-2\delta)(1-\delta)^{k}\big)', putative: true, note: 'The [[Stab]] line at $\rho = 1-2\delta$, through $\mathrm{NS}_\delta = \tfrac12(1-\mathrm{Stab}_{1-2\delta})$. Noise on the address, not on the table, is what destroys the answer: the table contributes only the leading factor $1-2\delta$.'}
    - {measure: robustQ, value: '\Omega(k),\ O(k\log k)', refs: [BNRdW05], note: 'Lower: $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(k)$. Upper: read the address and the entry classically, repeating each query $O(\log k)$ times. The universal $O(\mathrm{arity})$ bound of [BNRdW05] is useless here, the arity being $k+2^k$.'}
    - {measure: Dmu,  value: '\Theta(k)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(k)$; the [[D_prod]] line shows the uniform distribution attains it.'}
    - {measure: cbs,  value: 'k+1', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, which is $k+1$ here by the [[bs]] line.'}
    - {measure: psD,  value: '\Theta(k)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(k)$.'}
  witnesses:
    - {of: [Dna, D], setting: total, statement: 'Exponential, on a total function: $\mathrm{D}^{\mathrm{na}} = k + 2^k$ while $\mathrm{D} = k+1$. Adaptivity is what lets you skip the table. Compare [[TreeNav]], where the same gap arises with no promise and no gadget.'}
    - {of: [Rna, R], setting: total, statement: 'Exponential: $\mathrm{R}^{\mathrm{na}} = \Theta(2^k)$ against $\mathrm{R} = \Theta(k)$ -- randomness does not substitute for adaptivity here, since a non-adaptive sampler misses the addressed entry.'}
  refs: [GPW18, GJPW18]
  see_also: [ANDOR, pointer, TreeNav]

- id: TreeNav
  name: Binary tree navigation
  symbol: '\mathrm{Nav}_k'
  group: basic
  order: 18.5
  kind: total
  arity: '$2^k - 1$ bits'
  short: 'Adaptivity at its most extreme: $\mathrm{D}=k$ but every one of the $2^k-1$ variables is relevant.'
  definition: |
    Index the variables by the nodes of a complete binary tree of depth $k$, so
    $x_0$ sits at the root and node $i$ has children $2i+1$ and $2i+2$. Walk the
    tree: read $x_0$, and from node $i$ move to node $2i+1+x_i$. After $k$ reads
    the walk is at a node of the bottom level; the output is the bit read there.
  formal: |
    $$\mathrm{Nav}_k(x) = x_{i_k}, \qquad i_0 = 0,\ \ i_{j+1} = 2 i_j + 1 + x_{i_j},$$
    so $i_k \in \{2^{k-1}-1,\dots,2^k-2\}$ indexes the bottom level.
  values:
    - {measure: D,   value: 'k', note: 'The walk reads one variable per level.'}
    - {measure: Dna, value: '2^k - 1', note: 'Every variable is relevant: for the node $v$, take the input whose walk reaches $v$ and whose two subtrees below $v$ lead to bottom bits of opposite value. So a non-adaptive algorithm must read all of them, and $\mathrm{D}^{\mathrm{na}} = 2^{\mathrm{D}}-1$ exactly -- the extreme case of the bound $\mathrm{D}^{\mathrm{na}} \le 2^{\mathrm{D}}-1$.'}
    - {measure: R,   value: '\Theta(k)', note: 'At most $\mathrm{D}=k$. For the lower bound, on a uniformly random input each of the $k$ variables on the walk is sensitive with probability $1/2$, so $\mathrm{bs} = \Omega(k)$ and $\mathrm{R} \ge \mathrm{bs}/3$.'}
    - {measure: Rna, value: '\Theta(2^k)', note: 'On a uniformly random input the bottom node reached is uniform over the $2^{k-1}$ bottom nodes, and an algorithm that has not read it is guessing an unbiased bit; a fixed set of $m$ variables contains it with probability at most $m/2^{k-1}$.'}
    - {measure: Rbar, value: '\Theta(k)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(k)$ and $\mathrm{D}(f) = k$ here.'}
    - {measure: R0, value: '\Theta(k)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(k)$ and $\mathrm{D}(f) = k$ here.'}
    - {measure: R1, value: '\Theta(k)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(k)$ and $\mathrm{D}(f) = k$ here.'}
    - {measure: C, value: 'k', putative: true, note: 'The walk itself is a certificate, and nothing shorter is: omit a node of the walk and the walk is free to leave. So $\mathrm{C} = \mathrm{C}^0 = \mathrm{C}^1 = \mathrm{C}_{\min} = \mathrm{D} = k$ -- navigation is completely certificate-uniform, and all the difficulty is in *finding* the $k$ relevant variables among $2^k-1$.'}
    - {measure: Cmin, value: 'k', putative: true, note: 'Every input has the same certificate structure.'}
    - {measure: C0, value: 'k', putative: true, note: 'As $\mathrm{C}$: complementing the bottom level swaps the two sides, so the certificate structure is the same for both. (Verified exhaustively for $k \le 3$.)'}
    - {measure: C1, value: 'k', putative: true, note: 'As $\mathrm{C}^0$.'}
    - {measure: s0, value: 'k', putative: true, note: 'As $\mathrm{s}$: the construction there can be run with either final value, so both sides reach $k$. (Verified exhaustively for $k \le 3$.)'}
    - {measure: s1, value: 'k', putative: true, note: 'As $\mathrm{s}^0$.'}
    - {measure: bs0, value: 'k', note: 'Squeezed between $\mathrm{s}^0 = k$ and $\mathrm{C}^0 = k$.'}
    - {measure: bs1, value: 'k', note: 'Squeezed between $\mathrm{s}^1 = k$ and $\mathrm{C}^1 = k$.'}
    - {measure: s, value: 'k', putative: true, note: 'At the right input all $k$ walk variables are sensitive: flipping the bottom one flips the output, and flipping the one at level $j$ diverts the walk into the sibling subtree -- arrange each sibling subtree to deliver the opposite bit. Nothing off the walk is sensitive.'}
    - {measure: bs, value: 'k', note: 'Squeezed between $\mathrm{s}=k$ and $\mathrm{C}=k$.'}
    - {measure: fbs, value: 'k', note: 'Squeezed between $\mathrm{bs}=k$ and $\mathrm{C}=k$.'}
    - {measure: deg, value: 'k', putative: true, note: 'Expand recursively: $\mathrm{Nav}_k = (1-x_0)\mathrm{Nav}_{k-1}(L) + x_0\mathrm{Nav}_{k-1}(R)$. The two subtrees have disjoint variable sets, so the top monomial of the right branch times $x_0$ has degree $k$ and cannot be cancelled by anything in the left branch.'}
    - {measure: deg2, value: 'k', putative: true, note: 'The same recursion over $\mathbb{F}_2$: $\mathrm{Nav}_k = L + x_0(L+R)$.'}
    - {measure: QE, value: '\Theta(k)', note: 'Squeezed between $\deg/2$ and $\mathrm{D}$, both $\Theta(k)$.'}
    - {measure: Inf, value: '(k+1)/2', putative: true, note: 'On a uniform input the level-$j$ walk variable is pivotal exactly when the sibling subtree would deliver the opposite bit, which happens with probability $1/2$; the bottom variable is always pivotal. So $\mathrm{I} = 1 + (k-1)/2$ while the function has $2^k-1$ variables -- influence logarithmic in the input length, and a clean instance of $\mathrm{I} \le \mathrm{D}$ being tight up to a factor of $2$.'}
    - {measure: D_size, value: '2^k', putative: true, note: 'Exactly. The walk tree is complete of depth $k$, giving $2^k$ leaves. For the lower bound: the walk is the unique minimal certificate, so every leaf''s read-set contains one complete walk together with its final bit, and the $2^{k-1}$ walks times the $2$ values of the final bit need $2^k$ distinct leaves.'}
    - {measure: FC, value: 'k', refs: [Tal13, KulkarniTal16], note: '$\mathrm{FC}(f) = \mathrm{fbs}(f)$ exactly, by LP duality, and $\mathrm{fbs} = k$ here.'}
    - {measure: RC, value: '\Theta(k)', refs: [Aaronson08], note: '$\mathrm{RC}(f) = \Theta(\mathrm{fbs}(f))$ for every $f$, and $\mathrm{fbs}(f) = k$ here.'}
    - {measure: EC, value: 'k', refs: [GJKKLSSV17], note: 'Sandwiched: $\mathrm{fbs}(f) \le \mathrm{EC}(f) \le \mathrm{C}(f)$, with both ends $k$ here.'}
    - {measure: CA, value: '\Theta(k)', refs: [ABIKPS17], note: '$\mathrm{CA}(f) = \Theta(\mathrm{fbs}(f))$ for total $f$ ([[CA]] vs [[fbs]]), and $\mathrm{fbs}(f) = k$ here.'}
    - {measure: CGpub, value: '\Theta(k)', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}}(f) = \Theta(\mathrm{CA}(f))$ for every $f$, and $\mathrm{CA}(f) = \Theta(k)$ here.'}
    - {measure: CGstar, value: '\Theta(k)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(k)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CG, value: '\Omega(k),\ O(k^2)', refs: [CGLMSG23], note: 'From below $\mathrm{R}_0 = \Theta(k)$; from above $\mathrm{C}^0\mathrm{C}^1 = k^2$ [CGLMSG23]. No value of $\mathrm{Adv}$ is recorded for this family, so the gap stays open; the previous $\Theta(k)$ rested on the false inequality $\mathrm{CG} \le \mathrm{D}$.'}
    - {measure: UC, value: 'k', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{D}(f)$, with both ends $k$ here. Concretely the $2^k$ leaves of the walk tree are already an unambiguous certificate family.'}
    - {measure: UCmin, value: 'k', note: 'Sandwiched: $\mathrm{C}_{\min}(f) \le \mathrm{UC}_{\min}(f) \le \mathrm{UC}(f)$, with both ends $k$ here -- navigation is completely certificate-uniform, so none of the four certificate variants can separate.'}
    - {measure: SP, value: 'k', note: 'Sandwiched: $\mathrm{C}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with both ends $k$ here. The walk tree partitions the cube into $2^k$ monochromatic subcubes of codimension exactly $k$.'}
    - {measure: rank, value: 'k', putative: true, note: 'Prover-Delayer: whenever the Prover queries a node the walk has just reached, both answers are still live, so the Delayer scores; the Prover must resolve all $k$ walk nodes, and off-walk queries are answered for free. That gives $\mathrm{rank} \ge k$, and the complete depth-$k$ walk tree has rank exactly $k$. So $\mathrm{rank} = \mathrm{D}$ here -- the opposite extreme from [[OR]], where $\mathrm{rank} = 1$ and $\mathrm{D} = n$.'}
    - {measure: RS, value: '\Theta(k)', refs: [BenDavidKothari18], note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)$, with both ends $\Theta(k)$ here.'}
    - {measure: chibar, value: '\Theta(k)', refs: [GLSS19], note: 'Sandwiched: $\mathrm{RS}(f) = O(\bar{\chi}(f))$ and $\bar{\chi}(f) = O(\mathrm{R}(f))$, with both ends $\Theta(k)$ here.'}
    - {measure: chi, value: '\Theta(k)', refs: [Li18], note: 'Sandwiched: $\chi(f) = \Omega(\mathrm{bs}(f))$ and $\chi(f) = O(\mathrm{R}(f))$, with both ends $\Theta(k)$ here.'}
    - {measure: LR, value: '\Theta(k)', refs: [BBGM22], note: 'Sandwiched: $\bar{\chi}(f) = O(\mathrm{LR}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(k)$ here.'}
    - {measure: Rstar, value: '\Theta(k)', refs: [BBGM22], note: 'Sandwiched: $\mathrm{LR}(f) = O(\mathrm{R}^{*}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(k)$ here.'}
    - {measure: Q0, value: '\Theta(k)', note: 'Sandwiched: $\deg(f)/2 \le \mathrm{Q}_{0}(f) \le \mathrm{D}(f)$, with $\deg(f) = k$ and $\mathrm{D}(f) = k$ here.'}
    - {measure: QC, value: '\Theta(\sqrt k)', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{RC}(f)})$ for every $f$, and $\mathrm{RC}(f) = \Theta(k)$ here. Verifying a claimed walk is quadratically cheaper than following it.'}
    - {measure: prt, value: '\Theta(k)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $k$ here.'}
    - {measure: rprt, value: '\Theta(k)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $k$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: Np, value: '\Theta(k\log k)', refs: [GLX26noisy, FRPU94], note: 'Upper: $\mathrm{N}_p(f) = O(\mathrm{R}(f)\log \mathrm{R}(f))$ by repeating each query $O(\log k)$ times. Lower: $\mathrm{N}_p(f) = \Omega(\mathrm{I}(f)\log \mathrm{I}(f))$ [GLX26noisy] with $\mathrm{I}(f) = (k+1)/2$. The two meet, so navigation is a second natural family (after [[PARITY]]) where the repetition log factor is provably necessary.'}
    - {measure: Inf1, value: '(k+1)/2', note: 'Boolean-valued, so equal to $\mathrm{I}(f)$.'}
    - {measure: MaxInf, value: '1/2', putative: true, note: 'The root is the most influential coordinate: flipping $x_0$ swaps the two subtrees, and the two bits they deliver differ with probability $1/2$ under the uniform input. A node at level $j$ is on the walk only with probability $2^{-j}$, so its influence is $2^{-j-1}$. Note this is $\Theta(1)$ while $\mathrm{MaxInf}$ is $O(\log n/n)$ for [[TRIBES]] -- navigation is as far from the KKL extremal shape as a balanced function can be.'}
    - {measure: spar, value: '4^{k-1}', putative: true, note: 'From the recursion $\mathrm{Nav}_k = \tfrac{L+R}{2} + x_0\tfrac{L-R}{2}$ in the $\pm1$ encoding, where $L$ and $R$ are $\mathrm{Nav}_{k-1}$ on disjoint variable sets and each is balanced (no constant term). The four groups of monomials have pairwise disjoint supports, so $\mathrm{spar}(k) = 4\,\mathrm{spar}(k-1)$ with $\mathrm{spar}(1) = 1$.'}
    - {measure: L1, value: '2^{k-1}', putative: true, note: 'Same recursion: the halving is exactly cancelled by the doubling of the number of terms, giving $\hat L_1(k) = 2\,\hat L_1(k-1)$ from $\hat L_1(1) = 1$. So $\hat L_1 = 2^{\mathrm{D}-1}$, the maximum a depth-$\mathrm{D}$ tree can have.'}
    - {measure: Fdim, value: '2^k - 1', putative: true, note: 'Full. By the same recursion the support contains both $S$ and $S \cup \{0\}$ for every $S$ in the support of the left subtree, so their sum $\{0\}$ lies in the $\mathbb{F}_2$-span; inductively the span is everything.'}
    - {measure: PDT, value: 'k', putative: true, refs: [ChistopolskayaPodolskii18], note: 'At most $\mathrm{D} = k$. For the lower bound, the recursion above makes every nonzero Fourier coefficient exactly $\pm 2^{-(k-1)}$, so the granularity is $k-1$ and the granularity bound $\mathrm{D}^{\oplus} \ge \mathrm{gran} + 1$ of [ChistopolskayaPodolskii18] gives $k$. Parity queries buy nothing at all here.'}
    - {measure: adeg, value: '\Theta(k)', putative: true, note: 'Substituting one fresh variable $y_j$ for *all* nodes at level $j$ ($0 \le j \le k-2$), and the constant $\mathrm{parity}(b(v))$ for the bottom node $v$ reached by the path $b(v)$, turns $\mathrm{Nav}_k$ into $\mathrm{PARITY}_{k-1}$ -- the walk reads $y_0,\dots,y_{k-2}$ and then outputs their parity. Approximate degree cannot increase under a substitution of variables by variables and constants, so $\widetilde{\deg}(\mathrm{Nav}_k) \ge \widetilde{\deg}(\mathrm{PARITY}_{k-1}) = k-1$; and $\widetilde{\deg} \le \deg = k$. Navigation is therefore as hard for polynomials as it is for decision trees.'}
    - {measure: Q, value: '\Theta(k)', putative: true, note: 'Squeezed: $\widetilde{\deg}(f)/2 \le \mathrm{Q}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\widetilde{\deg}(f) = \Theta(k)$ from the line above and $\mathrm{D}(f) = k$. So navigation admits no quantum speedup at all: the $k$ walk steps must be taken one after another even coherently, and the embedded [[PARITY]] certifies it.'}
    - {measure: Advpm, value: '\Theta(k)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(k)$ here.'}
    - {measure: gamma2, value: '\Theta(k)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(k)$ here.'}
    - {measure: MAdv, value: '\Theta(k)', note: 'Squeezed: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(k)$ here.'}
    - {measure: lambda, value: '\Theta(k)', putative: true, note: 'Upper: $\lambda(f) \le \mathrm{s}(f) = k$. Lower: the spectral norm of a graph is at least its average degree, and the average degree of the sensitivity graph is exactly $\mathrm{I}(f) = (k+1)/2$. So $\lambda = \Theta(k)$, far above the $\sqrt{\deg} = \sqrt k$ floor of [Huang19].'}
    - {measure: Adv, value: '\Theta(k)', note: 'Squeezed: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)$, with $\lambda(f) = \Theta(k)$ and $\mathrm{Adv}^{\pm}(f) = \Theta(k)$ here. Note $\sqrt{\mathrm{C}^0\mathrm{C}^1} = k$, so the certificate barrier is met with equality and the positive-weight adversary is already optimal.'}
    - {measure: sdeg, value: '\Theta(k)', putative: true, note: 'Upper: $2f-1$ sign-represents $f$ and has degree $\deg(f) = k$. Lower: sign-representation survives the substitution of the [[adeg]] line, so $\mathrm{sdeg}(\mathrm{Nav}_k) \ge \mathrm{sdeg}(\mathrm{PARITY}_{k-1}) = k-1$. Contrast [[OR]] and [[AND]], where $\mathrm{sdeg} = 1$.'}
    - {measure: odeg, value: '\Theta(k)', putative: true, note: 'Squeezed between $\mathrm{odeg}(\mathrm{PARITY}_{k-1}) = k-1$ (one-sided approximation also survives the substitution of the [[adeg]] line) and $\widetilde{\deg}(f) = O(k)$.'}
    - {measure: ndeg, value: '\Theta(k)', putative: true, note: 'Upper: $f$ itself is $0/1$-valued, so its exact multilinear polynomial is nonzero precisely on the $1$-inputs, giving $\mathrm{ndeg} \le \deg = k$. Lower: the property "nonzero exactly on the $1$-inputs" survives the substitution of the [[adeg]] line, so $\mathrm{ndeg}(\mathrm{Nav}_k) \ge \mathrm{ndeg}(\mathrm{PARITY}_{k-1}) = k-1$.'}
    - {measure: NQ, value: '\Theta(k)', refs: [deWolf00], note: '$\mathrm{NQ}(f) = \lceil\mathrm{ndeg}(f)/2\rceil$ and $\mathrm{ndeg}(f) = \Theta(k)$ here.'}
    - {measure: rdeg, value: '\Theta(k)', note: '$\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\} = \Theta(k)$ by the [[ndeg]] line (the complement is another navigation function, with the bottom level flipped), and $\mathrm{rdeg} \le \mathrm{C} = k$.'}
    - {measure: ardeg, value: '\Theta(k)', putative: true, refs: [MahadevdeWolf15], note: 'Upper: $\mathrm{rdeg}_{\varepsilon} \le \mathrm{rdeg} = O(k)$. Lower: a rational approximation survives the substitution of the [[adeg]] line, so $\mathrm{rdeg}_{\varepsilon}(\mathrm{Nav}_k) \ge \mathrm{rdeg}_{\varepsilon}(\mathrm{PARITY}_{k-1}) = \Omega(k)$. Postselection is useless here, unlike for [[MAJ]] where it gives an exponential saving.'}
    - {measure: PostQ, value: '\Theta(k)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_{\varepsilon}(f) = \Theta(\mathrm{rdeg}_{\varepsilon}(f)) = \Theta(k)$.'}
    - {measure: cjdeg, value: '\Theta(k)', note: 'Squeezed: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(k)$ here.'}
    - {measure: noisyR, value: '\Theta(k)', refs: [CKMPSS23], note: 'From $\mathrm{R}(f) = \Theta(k) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ -- see the [[noisyR]] vs [[R]] record.'}
    - {measure: robustQ, value: '\Omega(k),\ O(k\log k)', refs: [BNRdW05], note: 'Lower: $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(k)$. Upper: run the depth-$k$ walk classically, repeating each query $O(\log k)$ times. The universal $O(\mathrm{arity})$ bound of [BNRdW05] is useless here, since the arity is $2^k-1$; whether the $\log k$ can be removed is exactly the open case of robust computation for very shallow, very wide functions.'}
    - {measure: degp, value: 'k', putative: true, note: 'The recursion $\mathrm{Nav}_k = L + x_0(R-L)$ over $\mathbb{F}_p$: by induction $R$ carries a degree-$(k-1)$ monomial with coefficient $\pm1$ in variables disjoint from those of $L$, so $x_0$ times it survives with coefficient $\pm1 \ne 0$ for every $p$. Unlike [[PARITY]] and [[MAJ]], navigation gets no discount in any characteristic.'}
    - {measure: Stab, value: '\rho\big(\tfrac{1+\rho}{2}\big)^{k-1}', putative: true, note: 'From the $\pm1$ recursion $\mathrm{Nav}_k = \tfrac{L+R}{2} + x_0\tfrac{L-R}{2}$ on disjoint variable sets: the four monomial groups are disjoint, so $\mathrm{Stab}_\rho(k) = \tfrac{1+\rho}{2}\,\mathrm{Stab}_\rho(k-1)$ with $\mathrm{Stab}_\rho(1) = \rho$. Checked at $k=2$ against the multiplexer spectrum $\{\pm\tfrac12\}$ on four sets.'}
    - {measure: NS, value: '\tfrac12\big(1-(1-2\delta)(1-\delta)^{k-1}\big)', putative: true, note: 'The [[Stab]] line at $\rho = 1-2\delta$, where $\tfrac{1+\rho}{2} = 1-\delta$, through $\mathrm{NS}_\delta = \tfrac12(1-\mathrm{Stab}_{1-2\delta})$. So navigation becomes noise-sensitive at $\delta = \Theta(1/k)$ -- exponentially earlier in the input length $2^k-1$ than [[MAJ]] does.'}
    - {measure: D_prod, value: 'k', putative: true, note: 'Take the uniform (product) distribution. The output is determined only once every one of the $k$ walk nodes has been read, since the last of them is the output bit and the earlier ones are what identify it; so a tree of depth $< k$ leaves an unbiased bit and errs with probability $1/2$. Hence $\mathrm{D}^{\mathrm{prod}} \ge k$, matching $\mathrm{D}^{\mathrm{prod}} \le \mathrm{D} = k$. Product distributions are already worst case for navigation.'}
    - {measure: Dmu,  value: '\Theta(k)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(k)$, and the [[D_prod]] line shows the uniform distribution already forces the full depth $k$.'}
    - {measure: cbs,  value: 'k', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, which is $k$ here by the [[bs]] line.'}
    - {measure: psD,  value: '\Theta(k)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(k)$.'}
  witnesses:
    - {of: [Dna, D], setting: total, statement: '$\mathrm{D}^{\mathrm{na}} = 2^{\mathrm{D}}-1$: exactly tight against the general bound, where $\mathrm{ADDR}_k$ is loose by a factor of two.'}
    - {of: [Rna, R], setting: total, statement: '$\mathrm{R}^{\mathrm{na}} = 2^{\Theta(\mathrm{R})}$, against the general bound $\mathrm{R}^{\mathrm{na}} \le 2^{\mathrm{R}}-1$.'}
  see_also: [ADDR, Dna, Rna, D]

- id: TRIBES
  name: TRIBES
  symbol: '\mathrm{Tribes}_{w,s}'
  group: basic
  order: 19
  kind: total
  arity: '$n = ws$ bits'
  short: 'Balanced read-once DNF; the KKL / max-influence extremal example.'
  definition: |
    An OR of $s$ disjoint ANDs of $w$ variables each, with $w,s$ chosen so that
    $\Pr[\mathrm{Tribes}=1] \approx 1/2$, i.e. $s \approx 2^w \ln 2$.
  formal: |
    $$\mathrm{Tribes}_{w,s}(x) = \bigvee_{j=1}^{s} \bigwedge_{i=1}^{w} x_{(j-1)w+i},
      \qquad w \approx \log_2 n - \log_2\ln n,\ \ s = n/w .$$
  values:
    - {measure: D,      value: 'n'}
    - {measure: R,      value: '\Theta(n)'}
    - {measure: noisyR, value: '\Theta(n)', note: 'From $\mathrm{R}(f) = \Theta(n) \Rightarrow \mathrm{noisyR}(f) = \Theta(\mathrm{R}(f))$ [CKMPSS23] -- see the [[noisyR]] vs [[R]] record. At the top of the range there is no room for fractional queries to help.'}
    - {measure: s1,     value: '\Theta(\log n)', note: 'Flip any bit of the unique all-ones tribe.'}
    - {measure: s0,     value: '\Theta(n/\log n)', note: 'Every tribe missing exactly one bit.'}
    - {measure: s,      value: '\Theta(n/\log n)'}
    - {measure: bs,     value: '\Theta(n/\log n)'}
    - {measure: C1,     value: '\Theta(\log n)'}
    - {measure: C0,     value: '\Theta(n/\log n)'}
    - {measure: C,      value: '\Theta(n/\log n)'}
    - {measure: Inf,    value: '\Theta(\log n)'}
    - {measure: MaxInf, value: '\Theta(\log n / n)', refs: [KKL88], note: 'Extremal for the KKL theorem: no variable has influence more than $O(\log n/n)$.'}
    - {measure: deg,    value: 'n', note: 'The multilinear polynomial $1-\prod_j(1-\prod_{i\in T_j} x_i)$ has the full monomial.'}
    - {measure: bs0,    value: '\Theta(n/\log n)'}
    - {measure: bs1,    value: '\Theta(\log n)', note: 'At most $\mathrm{C}^1 = w$, and the $w$ singletons inside the satisfied tribe achieve it.'}
    - {measure: fbs,    value: '\Theta(n/\log n)', note: 'Between $\mathrm{bs}$ and $\mathrm{C}$, which agree up to constants.'}
    - {measure: FC,     value: '\Theta(n/\log n)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC,     value: '\Theta(n/\log n)', refs: [Aaronson08], note: '$\mathrm{RC}=\Theta(\mathrm{fbs})$.'}
    - {measure: EC,     value: '\Theta(n/\log n)', refs: [GJKKLSSV17], note: 'Between $\mathrm{fbs}$ and $\mathrm{C}$, which agree up to constants.'}
    - {measure: Cmin,   value: '\Theta(\log n)', note: 'The cheapest input to certify is a $1$-input: one satisfied tribe, $w=\Theta(\log n)$ bits.'}
    - {measure: R0,     value: '\Theta(n)', note: 'Between $\mathrm{R}=\Theta(n)$ and $\mathrm{D}=n$.'}
    - {measure: Q,      value: '\Theta(\sqrt n)', refs: [Grover96, BT22], note: 'Grover over the $s$ tribes, Grover inside each: $\sqrt s\cdot\sqrt w = \sqrt n$. Tight, since $\widetilde{\deg}=\Theta(\sqrt n)$.'}
    - {measure: adeg,   value: '\Theta(\sqrt n)', refs: [BT22], note: 'As for any depth-two AND-OR tree on $n$ variables.'}
    - {measure: lambda, value: '\Theta(\sqrt n)', refs: [Huang19, ABKRT21], note: 'At most $\sqrt{\mathrm{s}^0\mathrm{s}^1} = \sqrt{\Theta(n/\log n)\cdot\Theta(\log n)} = \Theta(\sqrt n)$, and at least $\sqrt{\deg} = \sqrt n$ by Huang.'}
    - {measure: NS,     value: '\tfrac12 - o(1)', refs: [ODonnell14], note: 'For any fixed $\delta>0$: TRIBES is the standard example of a *noise-sensitive* monotone function, because all its influences are $O(\log n/n)$.'}
    - {measure: Inf1,   value: '\Theta(\log n)', note: 'Boolean-valued, so equal to $\mathrm{I}(f)$.'}
    - {measure: Dna,    value: 'n', note: 'Every variable is relevant.'}
    - {measure: CA, value: '\Theta(n/\log n)', note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{CA}(f) \le \mathrm{fbs}(f)$, with both ends $\Theta(n/\log n)$ here.'}
    - {measure: CGpub, value: '\Theta(n/\log n)', note: 'Sandwiched: $\mathrm{RC}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{fbs}(f)$, with both ends $\Theta(n/\log n)$ here.'}
    - {measure: CGstar, value: '\Theta(n/\log n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n/\log n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}}(f) = n$ here.'}
    - {measure: Advpm, value: '\Theta(\sqrt n)', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}^{\pm}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(\sqrt n)$ here.'}
    - {measure: gamma2, value: '\Theta(\sqrt n)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt n)$ here.'}
    - {measure: Adv, value: '\Theta(\sqrt n)', note: 'Sandwiched: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)$, with both ends $\Theta(\sqrt n)$ here.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: QE, value: '\Theta(n)', note: 'Sandwiched: $\deg(f)/2 \le \mathrm{Q}_{\mathrm{E}}(f) \le \mathrm{D}(f)$ -- a $t$-query exact algorithm gives an exact polynomial of degree at most $2t$, so the degree bound is halved -- with $\deg(f) = n$ and $\mathrm{D}(f) = n$ here, hence $n/2 \le \mathrm{Q}_{\mathrm{E}} \le n$.'}
    - {measure: MAdv, value: '\Theta(\sqrt n)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(\sqrt n)$ here.'}
    - {measure: deg2,   value: 'n', putative: true, note: 'Over $\mathbb{F}_2$, $\bigvee_j y_j = 1 + \prod_j(1+y_j)$ contributes the monomial $\prod_j y_j$ with coefficient $1$, and each $y_j$ is the product of its tribe''s variables. So the full monomial $x_1\cdots x_n$ survives, exactly as over $\mathbb{R}$.'}
    - {measure: Q0,     value: '\Theta(n)', note: 'Between $\deg/2 = n/2$ and $\mathrm{D} = n$. A full quadratic above $\mathrm{Q} = \Theta(\sqrt n)$.'}
    - {measure: RS, value: '\Theta(n)', putative: true, refs: [BenDavidKothari18], note: 'At most $\mathrm{R} = \Theta(n)$. For the lower bound take the sabotaged input in which every tribe has exactly one $0$ except one distinguished tribe, which is all $1$s apart from a single $\ast$; the value is undetermined. Ruling out a tribe means finding its unique $0$, which costs $\Omega(w)$ queries, and a constant fraction of the $s$ tribes must be ruled out, so $\Omega(sw) = \Omega(n)$.'}
    - {measure: chibar, value: '\Theta(n)', refs: [GLSS19], note: 'Sandwiched: $\mathrm{RS}(f) = O(\bar{\chi}(f))$ and $\bar{\chi}(f) = O(\mathrm{R}(f))$, with both ends $\Theta(n)$ here.'}
    - {measure: LR, value: '\Theta(n)', refs: [BBGM22], note: 'Sandwiched: $\bar{\chi}(f) = O(\mathrm{LR}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: Rstar, value: '\Theta(n)', refs: [BBGM22], note: 'Sandwiched: $\mathrm{LR}(f) = O(\mathrm{R}^{*}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: QC, value: '\Theta(\sqrt{n/\log n})', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{RC}(f)})$ for every $f$, and $\mathrm{RC}(f) = \Theta(n/\log n)$ here. Strictly below $\mathrm{Q} = \Theta(\sqrt n)$ by a $\sqrt{\log n}$ factor.'}
    - {measure: rank, value: '\Theta(n/\log n)', putative: true, conf: medium, note: 'Equal to the number of tribes $s$. Write $h(m,r)$ for the rank of $\mathrm{AND}_m \vee G$ with $\mathrm{rank}(G) = r$ on disjoint variables: $h(1,r) = r$ (the $\mathrm{AND}_1$ variable has a constant branch) and $h(m,r) = r+1$ for $m \ge 2$, since querying a tribe variable gives branches of rank $r$ and $r$ or $r+1$. Iterating over the $s$ tribes from $\mathrm{rank}(\mathrm{AND}_w) = 1$ gives $s$. Checked by hand at $w = s = 2$, where the rank is $2$.'}
    - {measure: ndeg, value: '\Theta(\log n)', putative: true, note: 'Exactly $w$. Upper: $p(x) = \sum_j \prod_{i \in T_j} x_i$ is a sum of nonnegative terms that vanishes precisely when no tribe is all-ones, and has degree $w$. Lower: kill all but one tribe by planting a $0$ in each of the others; the restriction is $\mathrm{AND}_w$, whose nondeterministic degree is $w$ because a polynomial vanishing on all but one point of the cube needs full degree. Contrast $\deg = n$: the [[rdeg]] gap comes entirely from the other side.'}
    - {measure: NQ, value: '\Theta(\log n)', refs: [deWolf03], note: '$\mathrm{NQ}(f) = \lceil \mathrm{ndeg}(f)/2\rceil$, and $\mathrm{ndeg}(f) = w = \Theta(\log n)$ here.'}
    - {measure: degp, value: 'n', putative: true, note: 'For **every** prime $p$. Over $\mathbb{F}_p$ the representation is still $1 - \prod_j(1 - \prod_{i\in T_j} x_i)$, whose top monomial $x_1\cdots x_n$ has coefficient $(-1)^{s+1} \ne 0$ in every characteristic. Consistent with the $\deg_2 = n$ entry above.'}
    - {measure: Fdim, value: 'n', putative: true, note: 'TRIBES is monotone, so $\hat f(\{i\}) = \mathrm{Inf}_i > 0$ for every $i$: the Fourier support contains all $n$ singletons and therefore spans $\mathbb{F}_2^n$.'}
    - {measure: Stab, value: 'o(1)', refs: [ODonnell14], note: 'For every fixed $\rho \in (-1,1)$, from $\mathrm{Stab}_\rho = 1 - 2\,\mathrm{NS}_{(1-\rho)/2}$ and $\mathrm{NS}_\delta \to 1/2$. TRIBES is balanced and noise sensitive, so correlation between $f(x)$ and $f(y)$ vanishes -- the extreme opposite of [[MAJ]].'}
    - {measure: robustQ, value: '\Theta(\sqrt n)', putative: true, conf: medium, refs: [HoyerMoscadeWolf03, BNRdW05], note: 'At least $\mathrm{Q} = \Omega(\sqrt n)$. The matching upper bound is the ordinary $\sqrt s \cdot \sqrt w$ algorithm with both Grover layers replaced by robust amplitude amplification, which tolerates bounded-error inputs with no log overhead. So the quantum speedup over $\mathrm{R} = \Theta(n)$ survives noisy oracles intact.'}
    - {measure: UC, value: 'n', putative: true, note: 'A parity obstruction. An unambiguous $b$-cover partitions $f^{-1}(b)$ into subcubes of sizes $2^{n-c_i}$, so if $|f^{-1}(b)|$ is odd some $c_i$ must equal $n$. Here $|f^{-1}(0)| = (2^w-1)^s$ is a power of an odd number, hence odd, and $|f^{-1}(1)| = 2^n - (2^w-1)^s$ is odd too. So $\mathrm{UC}^0 = \mathrm{UC}^1 = n$, far above $\mathrm{C} = \Theta(n/\log n)$ and $\mathrm{C}^1 = \Theta(\log n)$.'}
    - {measure: UCmin, value: 'n', putative: true, refs: [BHT17], note: 'Both sides are $n$ by the parity argument on the [[UC]] line, so the one-sided minimum does not help. TRIBES is therefore useless as a witness for the [BHT17] $\mathrm{C}$-vs-$\mathrm{UC}_{\min}$ question, despite its very lopsided certificate complexities.'}
    - {measure: SP, value: 'n', putative: true, note: 'A subcube partition induces an unambiguous cover on each side, so $\mathrm{SP} \ge \mathrm{UC} = n$ by the parity argument on the [[UC]] line; and $\mathrm{SP} \le \mathrm{D} = n$. The $\Theta(\log n)$-size $1$-certificates cannot be assembled into a partition.'}
    - {measure: PDT, value: 'n', putative: true, refs: [ChistopolskayaPodolskii18], note: 'At most $\mathrm{D} = n$. For the lower bound, the $0/1$ representation $1-\prod_j(1-\prod_{i\in T_j}x_i)$ has top monomial coefficient $(-1)^{s+1} = \pm1$, so the $\pm1$-valued $g = 1-2f$ has $\hat g([n]) = \pm2^{-(n-1)}$ -- the largest granularity an $n$-bit function can have -- and $\mathrm{D}^{\oplus} \ge \mathrm{gran}+1 = n$ [ChistopolskayaPodolskii18]. Parity queries buy nothing.'}
    - {measure: CG, value: '\Theta(n)', refs: [CGLMSG23], note: 'Squeezed by the [CGLMSG23] sandwich $\max\{\mathrm{Adv}^2,\mathrm{R}_0\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$: below, $\mathrm{Adv}^2 = \Theta(n)$ and $\mathrm{R}_0 = \Theta(n)$; above, $\mathrm{C}^0\mathrm{C}^1 = \Theta(n/\log n)\cdot\Theta(\log n) = \Theta(n)$. The lopsidedness of the two certificate complexities is exactly what makes this cell close, unlike [[OMB]] where the same sandwich leaves a quadratic gap.'}
    - {measure: rdeg, value: '\Theta(n/\log n)', putative: true, note: 'Exactly $s$. From $\mathrm{rdeg}(f) = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}$ with $\mathrm{ndeg}(f) = w$ recorded above: $\bar f$ is an AND of ORs, and $\prod_j\big(\sum_{i \in T_j}(1-x_i)\big)$ is nonzero exactly when every tribe contains a $0$, giving $\mathrm{ndeg}(\bar f) \le s$; setting $w-1$ bits of each tribe to $1$ restricts $\bar f$ to $\mathrm{AND}_s$, whose nondeterministic degree is $s$, giving the match. So $\mathrm{rdeg} = \Theta(n/\log n)$ against $\deg = n$ -- a genuine, if only logarithmic, rational-vs-exact degree gap on a monotone function.'}
    - {measure: D_prod, value: '\Theta(n/\log n)', putative: true, conf: medium, note: 'Equal to $\Theta(s)$, strictly below $\mathrm{R} = \Theta(n)$: **product distributions are provably not worst case for TRIBES.** Lower: under the uniform distribution a depth-$m$ tree touches at most $m$ tribes, and each of the $\ge s-m$ untouched tribes is independently all-ones with probability $2^{-w} = \Theta(1/s)$, so for $m = \varepsilon s$ the answer is still an almost-fair coin at every leaf. Upper: for any product distribution, resolve tribes one at a time, querying each tribe''s bits in increasing order of $\Pr[x_i=1]$; the expected cost of resolving a tribe with all-ones probability $q_j$ is at most $\sum_{t<w} q_j^{t/w}$, which is $O(1)$ in the only hard regime $q_j = \Theta(1/s)$ (larger $q_j$ makes some tribe satisfied almost surely, smaller makes the answer almost surely $0$). $O(s)$ queries then resolve every tribe except with probability $e^{-\Omega(s)}$. Marked medium confidence because the upper bound is a case analysis over product distributions rather than a single clean argument.'}
    - {measure: spar, value: '\Theta(2^n)', putative: true, note: 'Full support, or one short of it. Write $\mathrm{Tribes} = 1 - \prod_{j=1}^{s}(1-A_j)$ with $A_j = \prod_{i \in T_j}x_i = 2^{-w}\prod_{i \in T_j}(1-\chi_i)$. The tribes are on disjoint variables, so the Fourier coefficient of $\chi_S$ in the product factorises over $j$, the factor being $1-2^{-w}$ when $S \cap T_j = \emptyset$ and $-(-1)^{|S \cap T_j|}2^{-w}$ otherwise -- never zero. So every nonempty $S$ carries a nonzero coefficient. The empty set is the only possible exception: in the $\pm1$ encoding $\hat g(\emptyset) = 2(1-2^{-w})^{s}-1$, which vanishes exactly when the function is perfectly balanced. Maximal sparsity, in contrast with the $2^{n-1}$ of [[MAJ]] and [[EH]], which are forced down by a symmetry.'}
    - {measure: odeg, value: '\Omega(\sqrt{\log n}),\ O(\log n)', putative: true, note: 'Upper: $p(x) = \sum_j \prod_{i \in T_j} x_i$ has degree $w$, equals $0$ on every $0$-input (each tribe has a zero) and is $\ge 1$ on every $1$-input -- a one-sided approximant of degree $w = \Theta(\log n)$, exponentially below $\widetilde{\deg} = \Theta(\sqrt n)$. Lower: restricting all but one tribe to contain a $0$ leaves $\mathrm{AND}_w$, and $\mathrm{odeg}(\mathrm{AND}_w) = \widetilde{\deg}(\mathrm{AND}_w) = \Theta(\sqrt w)$ by the single-slice normalisation argument spelled out on the [[EH]] $\mathrm{odeg}$ line. This is the zoo''s cleanest illustration that one-sidedness is worth an exponential factor for a monotone DNF.'}
    - {measure: sdeg, value: '\Omega(\sqrt{\log n}),\ O(\log n)', putative: true, refs: [MinskyPapert69], note: 'Upper: $\mathrm{sdeg} \le \mathrm{odeg} \le w = \Theta(\log n)$, since a one-sided approximant minus $1/2$ sign-represents. Lower: restrict to $m = \sqrt w$ tribes (force a $0$ into each of the others), leaving $\mathrm{OR}_m \circ \mathrm{AND}_{m^2}$, the negation of the Minsky--Papert function, whose threshold degree is $\Omega(m)$ [MinskyPapert69]. Threshold degree is negation-invariant, so $\mathrm{sdeg}(\mathrm{Tribes}) = \Omega(\sqrt{\log n})$.'}
    - {measure: cjdeg, value: '\Omega(n/\log n),\ O(n)', putative: true, conf: medium, note: 'Upper: $\mathrm{cjdeg}_{\varepsilon}(f) \le \mathrm{D}(f) = n$. Lower: fixing $w-1$ variables of each tribe to $1$ leaves $\vee_s$ on the remaining $s = \Theta(n/\log n)$ variables, and a conical junta restricts to a conical junta of no larger width, so the [[OR]] line gives $\mathrm{cjdeg} = \Omega(s)$. This beats the $\widetilde{\deg}_{\varepsilon} = \Theta(\sqrt n)$ lower bound; whether the truth is $\Theta(n)$ is open.'}
    - {measure: prt, value: '\Omega(\sqrt n),\ O(n)', note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$. The truth is presumably $\Theta(n)$, matching $\mathrm{R}$, but the partition bound is not known to reach $\mathrm{R}$ for TRIBES and the recorded $\mathrm{RC} = \Theta(n/\log n)$ is already below $\mathrm{R}$, so no better lower bound is claimed here.'}
    - {measure: rprt, value: '\Omega(\sqrt n),\ O(n)', conf: medium, note: 'Sandwiched: $\widetilde{\deg}_{\varepsilon}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$. Same caveat as the [[prt]] line above.'}
    - {measure: Dmu,  value: '\Theta(n)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(n)$. Worth contrasting with the [[D_prod]] line, $\Theta(n/\log n)$: no *product* distribution is hard enough, so the maximising $\mu$ must correlate the variables inside a tribe.'}
    - {measure: cbs,  value: '\Theta(n/\log n)', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, which is $\Theta(n/\log n)$ here by the [[bs]] line.'}
    - {measure: psD,  value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(n)$.'}
    - {measure: chi,  value: '\Omega(n/\log n),\ O(n)', refs: [Li18], note: 'Lower: $\chi(g) = \Omega(\mathrm{bs}(g))$ [Li18] and $\mathrm{bs} = \Theta(n/\log n)$. Upper: $\chi \le \bar\chi = \Theta(n)$ by the [[chibar]] line. The gap is the same $\log n$ that separates $\mathrm{bs}$ from $\mathrm{R}$ here, and closing it would say which of the two the composition theorem really sees.'}
    - {measure: L1,   value: '2^{\Theta(n/\log n)}', putative: true, refs: [ODonnell14], note: 'Exactly $2^{s(1\pm o(1))}$ with $s = \Theta(n/\log n)$ tribes. Write $f = 1 - \prod_j (1-A_j)$ with $A_j = \prod_{i \in T_j} x_i$. In the $\pm1$ basis $A_j = 2^{-w}\prod_{i \in T_j}(1-\chi_i)$ has $\hat L_1(A_j) = 1$, so $\hat L_1(1-A_j) = (1-2^{-w}) + (1-2^{-w}) = 2 - 2^{1-w}$; the tribes are variable-disjoint, so the norms multiply and $\hat L_1\big(\prod_j (1-A_j)\big) = (2-2^{1-w})^s$. Subtracting the product from $1$ changes only the constant term. Since $w = \Theta(\log n)$, this is $2^{\Theta(n/\log n)}$ -- exponentially large, but exponentially far below the maximum $2^{\mathrm{D}} = 2^n$.'}
    - {measure: D_size, value: '2^{\Omega(n/\log n)},\ 2^{O(n\log\log n/\log n)}', putative: true, note: 'Lower: the subcube of a $0$-leaf must contain a $0$ in each of the $s$ tribes, so it has codimension at least $s$ and measure at most $2^{-s}$; the $0$-leaves cover a set of measure $\Pr[f=0] \to 1/2$, so there are at least $2^{s-1}$ of them, and $s = \Theta(n/\log n)$. Upper: the natural tree reads one tribe at a time, stopping at the first $0$ inside a tribe, and its leaf count satisfies $T(j) = w\,T(j-1)+1$, giving $T(s) \le 2w^s = 2^{O(s\log w)} = 2^{O(n\log\log n/\log n)}$. The $\log\log n$ gap is left open.'}
    - {measure: Np,   value: '\Omega(n),\ O(n\log n)', conf: medium, refs: [FRPU94, GLX26noisy], note: 'Lower: $\mathrm{N}_p \ge \mathrm{R} = \Theta(n)$. Upper: $O(\mathrm{R}\log\mathrm{R})$ by repeating each query. The influence-based bound $\mathrm{N}_p = \Omega(\mathrm{I}\log\mathrm{I})$ [GLX26noisy] gives only $\Omega(\log n\log\log n)$ here, since $\mathrm{I} = \Theta(\log n)$, so as at [[OMB]] there is no evidence that the repetition log is needed.'}
    - {measure: ardeg, value: 'O(\log n)', putative: true, refs: [MahadevdeWolf15], note: 'Upper bound only, and it is $w$: put $S(x) = \sum_j \prod_{i \in T_j} x_i$, of degree $w$, and take $r = 3S/(1+3S)$. On $0$-inputs no tribe is all-ones, so $S = 0$ and $r = 0$; on $1$-inputs $S \ge 1$ and $r \ge 3/4$. No lower bound beyond the trivial $1$ is known -- the restriction to a single tribe only gives $\mathrm{rdeg}_{\varepsilon}(\wedge_w) = 1$, as at [[AND]].'}
    - {measure: PostQ, value: 'O(\log n)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_{\varepsilon}(f) = \Theta(\mathrm{rdeg}_{\varepsilon}(f))$ [MahadevdeWolf15] applied to the [[ardeg]] line, hence an upper bound only. Postselection brings TRIBES from $\mathrm{R} = \Theta(n)$ down to at most $O(\log n)$.'}
  witnesses:
    - {of: [s0, s1], setting: total, statement: 'Unbounded, and on a monotone read-once DNF: $\mathrm{s}^0 = \Theta(n/\log n)$ against $\mathrm{s}^1 = \Theta(\log n)$, a ratio of $n/\log^2 n$. The same asymmetry runs through $\mathrm{bs}^0$ vs $\mathrm{bs}^1$ and $\mathrm{C}^0$ vs $\mathrm{C}^1$; it is the reason TRIBES is the KKL extremal example.'}
    - {of: [C, Cmin], setting: total, statement: 'Unbounded: $\mathrm{C} = \Theta(n/\log n)$ at a $0$-input (every tribe must be shown to fail) against $\mathrm{C}_{\min} = \Theta(\log n)$ at a $1$-input (exhibit one satisfied tribe).'}
  refs: [KKL88, ODonnell14, BOL85]
