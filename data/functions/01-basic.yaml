    - {measure: RS, value: '\Theta(n)', refs: [BenDavidKothari18], note: 'Sandwiched: $\mathrm{CA}(f) \le \mathrm{RS}(f) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here. So every symmetric function composes perfectly on the inside.'}
    - {measure: chi, value: '\Theta(n)', refs: [Li18], note: 'Sandwiched: $\chi(f) = \Omega(\mathrm{bs}(f))$ and $\chi(f) = O(\mathrm{R}(f))$, with both ends $\Theta(n)$ here.'}
    - {measure: chibar, value: '\Theta(n)', refs: [GLSS19], note: 'Sandwiched: $\mathrm{RS}(f) = O(\bar{\chi}(f))$ and $\bar{\chi}(f) = O(\mathrm{R}(f))$, with both ends $\Theta(n)$ here.'}
    - {measure: LR, value: '\Theta(n)', refs: [BBGM22], note: 'Sandwiched: $\bar{\chi}(f) = O(\mathrm{LR}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: Rstar, value: '\Theta(n)', refs: [BBGM22], note: 'Sandwiched: $\mathrm{LR}(f) = O(\mathrm{R}^{*}(f)) \le \mathrm{R}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: QE, value: '\Theta(n)', note: 'Sandwiched: $\deg(f)/2 \le \mathrm{Q}_{\mathrm{E}}(f) \le \mathrm{D}(f)$, and von zur Gathen-Roche makes $\deg(f) = n - O(n^{0.548})$, so both ends are $\Theta(n)$.'}
    - {measure: Q0, value: '\Theta(n)', note: 'Same sandwich as $\mathrm{Q}_{\mathrm{E}}$: $\deg(f) \le 2\mathrm{Q}_0(f)$ and $\mathrm{Q}_0(f) \le \mathrm{D}(f)$. Zero error costs the full $n$ for every symmetric function, however small $\Gamma(f)$ makes the bounded-error value.'}
    - {measure: QC, value: '\Theta(\sqrt n)', refs: [Aaronson08], note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{RC}(f)})$ for every $f$, and $\mathrm{RC}(f) = \Theta(n)$ here.'}
    - {measure: sdeg, value: '\#\{k \,:\, f_k \ne f_{k+1}\}', putative: true, note: 'Exactly the number of jumps of the slice pattern. Symmetrizing a sign-representing polynomial keeps it sign-representing, so $\mathrm{sdeg}(f)$ equals the least degree of a univariate $q$ on $\{0,\dots,n\}$ with $\mathrm{sign}\,q(j) = (-1)^{f_j}$; such a $q$ needs a root strictly between each pair of consecutive jumps, and $\prod_i(|x| - a_i)$ with one $a_i$ in each gap attains the bound. Recovers $\mathrm{sdeg}(\mathrm{THR}) = 1$ and $\mathrm{sdeg}(\mathrm{EH}) = 2$. Note this is a *display-only* value: it is not a function of $n$ and $\Gamma(f)$.'}
    - {measure: lambda, value: '\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)', putative: true, note: 'The sensitivity graph is the union, over the jumps $k$ of the slice pattern, of the complete bipartite layer graphs between Hamming levels $k$ and $k+1$; that piece is biregular of degrees $n-k$ and $k+1$, so it has spectral norm $\sqrt{(k+1)(n-k)}$. Each vertex lies in at most two pieces, so $\lambda$ is within a factor $2$ of the largest piece, and the jump maximising $(k+1)(n-k)$ is the one closest to the middle, i.e. the one defining $\Gamma(f)$: $(k+1)(n-k) = \Theta(n(n-\Gamma(f)))$. So spectral sensitivity is $\Theta(\mathrm{Q}(f))$ for every symmetric function -- Huang''s $\deg \le \lambda^2$ is tight exactly at the edge-jump end, $\Gamma = n-1$.'}
    - {measure: Adv, value: '\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)', putative: true, note: 'Squeezed: $\lambda(f) \le \mathrm{Adv}(f) \le \mathrm{Adv}^{\pm}(f)$, with $\lambda(f) = \Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)$ from the line above and $\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}(f))$ the same quantity. The positive-weight adversary is therefore tight on the whole symmetric class; no symmetric function can witness the certificate barrier.'}
    - {measure: UCmin, value: '\Theta(n)', refs: [BHT17], note: 'Squeezed: $\mathrm{fbs}(f) \le 2\,\mathrm{UC}_{\min}(f) - 1$ [BHT17] forces $\mathrm{UC}_{\min} = \Omega(n)$ since $\mathrm{fbs} = \Theta(n)$ here, and $\mathrm{UC}_{\min} \le \mathrm{UC} = \Theta(n)$. So symmetric functions are useless for the $\mathrm{C}$-vs-$\mathrm{UC}_{\min}$ separation of [BHT17].'}
    - {measure: ndeg, value: '\Theta(\#\{j \,:\, f_j = 0\})', putative: true, note: 'Upper: $\prod_{j : f_j = 0}(|x|-j)$ is nonzero exactly on the $1$-inputs. Lower: if $p$ witnesses $\mathrm{ndeg}$ then $p^2$ is non-negative, vanishes exactly on the $0$-inputs, and its symmetrisation $j \mapsto \mathbb{E}_{|x|=j}[p(x)^2]$ is a univariate polynomial of degree at most $2\deg p$ that is strictly positive on the $1$-slices and zero on the $0$-slices, hence has at least $\#\{j : f_j = 0\}$ roots. So $\mathrm{ndeg}$ is pinned to within a factor $2$. Like the [[sdeg]] line this is a *display-only* value: it is a function of the slice pattern, not of $n$ and $\Gamma(f)$. Recovers $\mathrm{ndeg}(\mathrm{OR}) = 1$, $\mathrm{ndeg}(\mathrm{AND}) = n$ and $\mathrm{ndeg}(\mathrm{THR}^n_k) = k$.'}
    - {measure: NQ, value: '\Theta(\#\{j \,:\, f_j = 0\})', putative: true, refs: [deWolf00], note: 'de Wolf''s $\mathrm{NQ}(f) = \lceil\mathrm{ndeg}(f)/2\rceil$ applied to the [[ndeg]] line above. Nondeterministic quantum query complexity of a symmetric function is governed by the *number* of $0$-slices, not by where they sit -- in sharp contrast with $\mathrm{Q}$, which sees only the distance $\Gamma(f)$ of the nearest jump to the middle layer.'}
    - {measure: D_prod, value: '\Theta(n)', putative: true, note: 'Take the product distribution with each bit $1$ independently with probability $k/n$, where $k$ is a jump. After $m$ queries the unseen part of the weight is a $\mathrm{Bin}(n-m,k/n)$ variable whose standard deviation is $\Omega(\sqrt{n-m})$, so the conditional probability of landing on either side of the jump stays bounded away from $0$ and $1$ until $n-m = O(1)$. Product distributions are already worst case for symmetric functions.'}
    - {measure: Dmu,  value: '\Theta(n)', refs: [Yao77], note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{1/3}(f) = \mathrm{R}_{1/3}(f) = \Theta(n)$ for every non-constant symmetric $f$, by the [[R]] line; the [[D_prod]] line exhibits a product distribution that attains it.'}
    - {measure: cbs,  value: '\Theta(n)', refs: [GoosPitassi14], note: 'Degenerate for Boolean functions: every input is critical and the only solution function is $f$ itself, so $\mathrm{cbs}(f) = \mathrm{bs}(f)$, and $\mathrm{bs}(f) = \Theta(n)$ for every non-constant symmetric $f$ by the [[bs]] line.'}
    - {measure: psD,  value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f))$ $= \Theta(n)$ by the [[R]] line.'}
    - {measure: cjdeg, value: '\Theta(n)', putative: true, conf: medium, note: 'Fix a jump $k$, so $f_k \ne f_{k+1}$. Restricting $k$ variables to $1$ leaves a function $g$ on $m = n-k$ variables with $g(0^m) \ne g(e_i)$ for every $i$; restricting $n-k-1$ variables to $0$ leaves a function on $k+1$ variables with the corresponding property at $1^{k+1}$. In either case the [[OR]] / [[AND]] argument applies verbatim -- a width-$d$ conjunction can separate $0^m$ from at most $d$ of the $e_i$ -- and a conical junta restricts to a conical junta of no larger width, so $\mathrm{cjdeg} = \Omega(\max\{k+1,\ n-k\}) = \Omega(n)$. Upper: $\mathrm{cjdeg}_{\varepsilon} \le \mathrm{D} = n$. So non-negativity destroys Paturi''s $\widetilde{\deg} = \Theta(\sqrt{n(n-\Gamma(f))})$ saving for *every* symmetric $f$, however small $\Gamma$ is.'}
    - {measure: robustQ, value: '\Theta\!\big(\sqrt{n(n-\Gamma(f))}\big)', refs: [BNRdW05], note: 'Same as the recorded $\mathrm{Q}$, since $n - \Gamma(f) \ge 1$ for non-constant $f$. Theorem 4 of [BNRdW05]: for every symmetric $f$ there is a robust quantum algorithm using $O(\sqrt{n(n-\Gamma(f)+1)})$ queries -- robust counting suffices, since $f$ is constant on the middle band of weights of width $\Gamma(f)$. The matching lower bound is $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Theta(\sqrt{n(n-\Gamma(f))})$ by Paturi (the [[Q]] line). So the whole symmetric family tolerates noisy inputs for free, in contrast with the classical $\log$ tax at [[PARITY]] and [[MAJ]].'}
    - {measure: Np,   value: '\Omega(n),\ O(n\log n)', conf: medium, refs: [FRPU94, GLX26noisy], note: 'Lower: $\mathrm{N}_p \ge \mathrm{R} = \Theta(n)$. Upper: $O(\mathrm{R}\log\mathrm{R})$ by repeating each query. Recorded as a range because both ends occur inside the family and are not a function of $\Gamma$ alone: [[OR]] sits at $\Theta(n)$ [FRPU94] while [[PARITY]], [[MAJ]] and [[EH]] all need $\Theta(n\log n)$. The general bound $\mathrm{N}_p = \Omega(\mathrm{I}\log\mathrm{I})$ [GLX26noisy] together with the [[Inf]] line decides many individual cases.'}
    - {measure: Inf,  value: 'n\,2^{1-n}\sum_{k \,:\, f_k \ne f_{k+1}}\binom{n-1}{k}', putative: true, note: 'Exactly. Coordinate $i$ is pivotal at $x$ precisely when the other $n-1$ bits have weight $k$ for some jump $f_k \ne f_{k+1}$, an event of probability $2^{1-n}\binom{n-1}{k}$; sum over jumps and over the $n$ coordinates. Checks: $\vee_n$ (single jump at $k=0$) gives $n2^{1-n}$; $\oplus_n$ (all $n$ jumps) gives $n$; $\mathrm{THR}^n_k$ gives $n\binom{n-1}{k-1}2^{1-n}$; [[EH]] gives $\Theta(\sqrt n)$. Displayed as a formula in the slice pattern rather than in $n$ and $\Gamma$, since $\Gamma$ does not determine it.'}
    - {measure: Inf1, value: 'n\,2^{1-n}\sum_{k \,:\, f_k \ne f_{k+1}}\binom{n-1}{k}', note: 'Boolean-valued, so the $L_1$ and $L_2$ total influences coincide: this is the $\mathrm{I}(f)$ recorded above.'}
    - {measure: MaxInf, value: '2^{1-n}\sum_{k \,:\, f_k \ne f_{k+1}}\binom{n-1}{k}', putative: true, note: 'The family is transitive, so every coordinate carries the same influence $\mathrm{I}(f)/n$; divide the [[Inf]] line by $n$.'}
    - {measure: C1,   value: '\max\{\,\ell_j + n - r_j \;:\; f_j = 1\,\}', putative: true, note: 'Exactly. Write $[\ell_j, r_j]$ for the maximal interval of weights containing $j$ on which the slice pattern is constant. A certificate at an input of weight $j$ fixes $a$ ones and $b$ zeros, and the completions have every weight in $[a,\ n-b]$, so it is valid iff $a \ge \ell_j$ and $n-b \le r_j$; both are attainable, since $\ell_j \le j$ ones and $n - r_j \le n-j$ zeros are available. Hence $\mathrm{C}_x = \ell_j + n - r_j$, and $\mathrm{C}^1$ maximises over $1$-inputs. Checks: $\vee_n$ gives $1$, $\mathrm{THR}^n_k$ gives $k$, $\oplus_n$ gives $n$, [[EH]] gives $n$.'}
    - {measure: C0,   value: '\max\{\,\ell_j + n - r_j \;:\; f_j = 0\,\}', putative: true, note: 'Same computation as the [[C1]] line, maximised over $0$-inputs: with $[\ell_j, r_j]$ the maximal constancy interval of the slice pattern around $j$, a minimum certificate at weight $j$ costs $\ell_j$ ones plus $n - r_j$ zeros. Checks: $\vee_n$ gives $n$, $\mathrm{THR}^n_k$ gives $n-k+1$, [[EH]] gives $n/2+1$.'}
    - {measure: Cmin, value: '\min_j\,(\ell_j + n - r_j)', putative: true, note: 'The same per-input formula as the [[C1]] line, minimised rather than maximised over all weights $j$. Equivalently $n$ minus the length of the longest constancy interval of the slice pattern, plus one. Checks: $\vee_n$ gives $1$, $\mathrm{THR}^n_k$ gives $\min\{k,\ n-k+1\}$, $\oplus_n$ gives $n$.'}
    - {measure: s1,   value: '\max\{\,j\,[f_{j-1} \ne f_j] + (n-j)\,[f_j \ne f_{j+1}] \;:\; f_j = 1\,\}', putative: true, note: 'Exactly. At an input of weight $j$, flipping one of the $j$ ones moves the weight to $j-1$ and flipping one of the $n-j$ zeros moves it to $j+1$, so the sensitivity is that count (reading $f_{-1}, f_{n+1}$ as "no jump"). Maximise over $1$-inputs. Checks: $\vee_n$ gives $1$, $\wedge_n$ gives $n$, $\mathrm{THR}^n_k$ gives $k$, [[EH]] gives $n$.'}
    - {measure: s0,   value: '\max\{\,j\,[f_{j-1} \ne f_j] + (n-j)\,[f_j \ne f_{j+1}] \;:\; f_j = 0\,\}', putative: true, note: 'The same per-input count as the [[s1]] line, maximised over $0$-inputs. Checks: $\vee_n$ gives $n$, $\wedge_n$ gives $1$, $\mathrm{THR}^n_k$ gives $n-k+1$, [[EH]] gives $n/2+1$. Together with [[s1]] this recovers the recorded $\mathrm{s}(f) = \max\{\mathrm{s}^0, \mathrm{s}^1\} = \Theta(n)$.'}
  refs: [Paturi92, vzGathenRoche97, BBCMdW01, IJKKKSWW23]
  see_also: [MAJ, THR, EH, OR]

- id: EH
  name: EXACT-HALF
  symbol: '\mathrm{EH}_n'
  aliases: ['\overline{\mathrm{EH}}_n \text{ (its negation)}']
  group: basic
  order: 16
  kind: total
  arity: '$n$ bits, $n$ even'
  short: 'Nondeterministic degree 1 for the negation -- the engine behind the rdeg separations.'
  definition: '$\mathrm{EH}_n(x)=1$ iff $|x| = n/2$.'
  formal: |
    $$\mathrm{EH}_n(x) = \mathbb{1}\Big[\textstyle\sum_i x_i = \tfrac n2\Big],
      \qquad \overline{\mathrm{EH}}_n(x) = 1 - \mathrm{EH}_n(x).$$
    The point: $q(x)=\sum_i x_i - n/2$ vanishes *exactly* on $\overline{\mathrm{EH}}_n^{-1}(0)$,
    so $\mathrm{ndeg}(\overline{\mathrm{EH}}_n)=1$ -- the smallest possible for a
    non-constant function.
  values:
    - {measure: D,    value: 'n'}
    - {measure: deg,  value: 'n'}
    - {measure: adeg, value: '\Theta(n)', refs: [Paturi92]}
    - {measure: Q,    value: '\Theta(n)'}
    - {measure: s1,   value: 'n'}
    - {measure: s0,   value: 'n/2 + 1'}
    - {measure: s,    value: 'n'}
    - {measure: lambda, value: '\sqrt{n(n/2+1)}', putative: true, refs: [ABKRT21], note: 'Exactly, and for $\mathrm{EH}_n$ itself (spectral sensitivity is insensitive to negation, since $f$ and $\bar f$ have the same sensitivity graph, so the same number is also $\lambda(\overline{\mathrm{EH}}_n)$). The sensitivity graph has an edge $(x,x^{\oplus i})$ exactly when one endpoint has weight $n/2$, so it is bipartite between the middle layer and the two layers $n/2\pm1$. It is biregular: a middle vertex has degree $n$, and a vertex of weight $n/2-1$ or $n/2+1$ has degree $n/2+1$. The vector giving $\sqrt n$ to each vertex of the second side and $\sqrt{n/2+1}$ to each middle vertex is positive with eigenvalue $\sqrt{n(n/2+1)}$, so by Perron--Frobenius that is the spectral radius. This meets the general bound $\lambda(f)\le\sqrt{\mathrm{s}^0(f)\,\mathrm{s}^1(f)}$ with equality, since $\mathrm{s}^1 = n$ and $\mathrm{s}^0 = n/2+1$ -- so $\mathrm{EH}$ is an exact witness for that inequality, and $\lambda = n/\sqrt2\,(1+o(1))$ sits strictly between the two.'}
    - {measure: ndeg, value: 'n/2', putative: true, refs: [IJKKKSWW23], note: 'Exactly $n/2$, for $\mathrm{EH}_n$ itself. **Upper bound:** for a perfect matching $M$ of $[n]$ put $q_M(x)=\prod_{(i,j)\in M}(x_i-x_j)$, of degree $n/2$; it is nonzero iff every pair of $M$ is split, which forces $|x| = n/2$, and every middle input is split by *some* matching. So a generic combination $\sum_M a_M q_M$ is nonzero exactly on the middle slice. **Lower bound:** if $p$ is nonzero exactly on $\mathrm{EH}^{-1}(1)$ then $p^2$ is nonnegative with the same zero set, so its symmetrisation $P(k)=\mathbb{E}_{|x|=k}[p(x)^2]$ is a univariate polynomial of degree $\le 2\deg p$ vanishing at all $n$ points $k \ne n/2$ of $\{0,\dots,n\}$; hence $\deg p \ge n/2$. Contrast $\mathrm{ndeg}(\overline{\mathrm{EH}}_n) = 1$, witnessed by $\sum_i x_i - n/2$: this factor-$n/2$ asymmetry between a function and its negation is what [[EH]] is for, and it is what makes $\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\} = n/2$ here.'}
    - {measure: Dna,    value: 'n'}
    - {measure: bs, value: 'n', note: 'Sandwiched: $\mathrm{s}^1(f) \le \mathrm{bs}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
    - {measure: fbs, value: 'n', note: 'Sandwiched: $\mathrm{s}^1(f) \le \mathrm{fbs}(f) \le \mathrm{D}(f)$, with both ends $n$ here.'}
