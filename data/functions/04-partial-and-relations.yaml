    - {measure: fbs, value: 'O(k^2)', note: '$\mathrm{fbs} = \Theta(\mathrm{QC}^2)$ for partial $f$ ([[QC]] vs [[RC]]), and $\mathrm{QC} = O(k)$. So the whole block-sensitivity family is capped by a function of $k$ alone, against $\mathrm{R} = \widetilde\Theta(n^{1-1/k})$.'}
    - {measure: FC, value: 'O(k^2)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: 'O(k^2)', note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = O(k^2)$.'}
    - {measure: bs, value: 'O(k^2)', note: '$\mathrm{bs} \le \mathrm{Adv}^2$ for partial $f$ ([[bs]] vs [[Adv]]), and $\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(k)$. Also $\mathrm{bs} \le \mathrm{fbs}$.'}
    - {measure: bs0, value: 'O(k^2)', note: 'See $\mathrm{bs}$.'}
    - {measure: bs1, value: 'O(k^2)', note: 'See $\mathrm{bs}$.'}
    - {measure: sdeg, value: 'O(k)', note: 'Sandwiched: $\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = O(k)$.'}
