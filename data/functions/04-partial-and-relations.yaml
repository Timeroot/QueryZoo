    - {measure: rank, value: 'O(kn)', note: 'At most $\mathrm{D} = O(kn)$.'}
    - {measure: deg, value: 'O(kn)', note: 'At most $\mathrm{D} = O(kn)$, against $\widetilde{\deg} = O(k)$: exact representation cannot use the gap between the two promise bands.'}
    - {measure: ndeg, value: 'O(kn)', note: 'At most $\mathrm{C}^1 \le \mathrm{C} = O(kn)$.'}
    - {measure: NQ, value: 'O(kn)', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil\mathrm{ndeg}/2\rceil$ and $\mathrm{ndeg} = O(kn)$.'}
