    - {of: [R, Q], setting: partial, statement: 'In this entry''s own parameter: $\mathrm{Q} = \lceil k/2\rceil$ and $\mathrm{R} = \widetilde\Theta(n^{1-1/k})$, i.e. $\mathrm{R} = \widetilde\Theta\!\big(n^{1-1/(2\mathrm{Q})}\big)$ for even $k$. **Optimal** -- it matches the Aaronson-Ambainis upper bound $\mathrm{R} = O(n^{1-1/(2\mathrm{Q})})$ and so settles the partial-function R-vs-Q trade-off at every $\mathrm{Q}$.', refs: [BansalSinha21, SSW21, AaronsonAmbainis18]}
