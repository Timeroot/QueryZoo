# =====================================================================
# FUNCTIONS: partial functions (promise problems) and relations
# (search problems). This is where the polynomial relations of the
# total world break down, often exponentially.
# =====================================================================

functions:

- id: Forrelation
  name: FORRELATION
  symbol: '\mathrm{forr}'
  aliases: ['Fourier correlation', '2-forrelation']
  group: quantum
  order: 40
  kind: partial
  arity: '$2n$ bits (two strings $x,y \in \{\pm1\}^n$)'
  short: 'One quantum query vs $\widetilde\Theta(\sqrt n)$ randomized queries -- the maximal possible gap at $\mathrm{Q}=1$.'
  definition: |
    Decide whether $y$ is highly correlated with the Fourier transform of $x$.
  formal: |
    For $x, y \in \{-1,1\}^n$ with $n=2^m$, let
    $$\Phi(x,y) \;=\; \frac{1}{n^{3/2}}\sum_{i,j\in\{0,1\}^m} x_i\,(-1)^{i\cdot j}\,y_j
      \;=\; \frac{1}{\sqrt n}\,\langle \hat x, y\rangle .$$
    $\mathrm{forr}(x,y) = 1$ if $\Phi(x,y) \ge 3/5$, $= 0$ if $|\Phi(x,y)| \le 1/100$,
    and undefined otherwise.
  values:
    - {measure: Q,    value: '1', refs: [AaronsonAmbainis18], note: 'Prepare uniform superposition, query $x$, Hadamard, query $y$, Hadamard, measure.'}
    - {measure: adeg, value: 'O(1)', note: '$\widetilde{\deg}\le 2\mathrm{Q} = 2$.'}
    - {measure: R,    value: '\widetilde\Theta(\sqrt n)', refs: [AaronsonAmbainis18, Tal20], note: 'Lower bound $\Omega(\sqrt n/\log n)$ [AaronsonAmbainis18], improved to $\widetilde\Omega(\sqrt n)$ via Fourier growth of decision trees [Tal20]. Matching $O(\sqrt n)$ upper bound.'}
    - {measure: D,    value: '\Theta(n)'}
    - {measure: Advpm, value: '\Theta(1)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = 1$ here.'}
    - {measure: MAdv, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with $\mathrm{Adv}^{\pm}(f) = \Theta(1)$ and $\mathrm{Q}_{\varepsilon}(f) = 1$ here.'}
    - {measure: Rbar, value: '\widetilde\Theta(\sqrt n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \widetilde\Theta(\sqrt n)$ here.'}
  witnesses:
    - {of: [R, Q],    setting: partial, statement: '$\mathrm{R} = \widetilde\Omega(\mathrm{Q}^2 \cdot \sqrt n)$ -- with $\mathrm{Q}=1$ fixed, $\mathrm{R} = \widetilde\Theta(\sqrt n)$. No polynomial relation between R and Q for partial functions.', refs: [AaronsonAmbainis18, Tal20]}
    - {of: [R, adeg], setting: partial, statement: '$\widetilde{\deg} = O(1)$ but $\mathrm{R}=\widetilde\Omega(\sqrt n)$.', refs: [AaronsonAmbainis18]}
  notes: |
    Aaronson-Ambainis also proved the *matching upper bound*: any partial $f$ with
    $\mathrm{Q}(f)=k$ has $\mathrm{R}(f) = O(n^{1-1/(2k)})$. So Forrelation is
    optimal, and $k$-Forrelation extends this to every $k$.
  refs: [AaronsonAmbainis18, Tal20, AaronsonAmbainis14]
  see_also: [kForrelation, cheatsheet, Q, R]

- id: kForrelation
  name: k-FORRELATION
  symbol: '\mathrm{forr}_k'
  group: quantum
  order: 41
  kind: partial
  arity: '$kn$ bits'
  short: 'Optimal $\mathrm{Q}$-vs-$\mathrm{R}$ separation for every $k$: $\mathrm{Q}=\lceil k/2\rceil$, $\mathrm{R}=\widetilde\Theta(n^{1-1/k})$.'
  definition: |
    The $k$-fold generalisation: given $x^1,\dots,x^k$, decide whether
    $\langle x^1, H x^2, H x^3, \dots\rangle$-style alternating
    Hadamard/pointwise-product composition is large.
  formal: |
    $$\Phi_k(x^1,\dots,x^k) = \frac{1}{n}\,\mathbf{1}^{\!\top} D_{x^1} H D_{x^2} H \cdots H D_{x^k}\, \mathbf{1},$$
    where $H$ is the normalised Hadamard transform and $D_{x}$ is the diagonal
    matrix with $x$ on the diagonal. Accept if $\Phi_k \ge$ a constant, reject if
    $|\Phi_k|$ is small.
  values:
    - {measure: Q, value: '\lceil k/2\rceil', refs: [AaronsonAmbainis18]}
    - {measure: R, value: '\widetilde\Theta\!\big(n^{1-1/k}\big)', refs: [BansalSinha21, SSW21], note: 'Lower bound proved independently by [BansalSinha21] and [SSW21]; matches the Aaronson-Ambainis upper bound $\mathrm{R}=O(n^{1-1/(2\mathrm{Q})})$.'}
    - {measure: Advpm, value: '\Theta(\lceil k/2\rceil)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \lceil k/2\rceil$ here.'}
    - {measure: MAdv, value: '\Theta(\lceil k/2\rceil)', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with $\mathrm{Adv}^{\pm}(f) = \Theta(\lceil k/2\rceil)$ and $\mathrm{Q}_{\varepsilon}(f) = \lceil k/2\rceil$ here.'}
    - {measure: Rbar, value: '\widetilde\Theta\!\big(n^{1-1/k}\big)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \widetilde\Theta(n^{1-1/k})$ here.'}
  witnesses:
    - {of: [R, Q], setting: partial, statement: 'For every $k$: $\mathrm{Q}=k$ and $\mathrm{R}=\widetilde\Theta(n^{1-1/(2k)})$. **Optimal** -- this settles the partial-function R-vs-Q trade-off.', refs: [BansalSinha21, SSW21, AaronsonAmbainis18]}
    - {of: [R, Q], setting: total, statement: 'Composed with cheat sheets, gives a *total* function with $\mathrm{R} = \widetilde\Omega(\mathrm{Q}^3)$ -- the best known total separation.', refs: [ABK16, BansalSinha21, SSW21]}
  refs: [BansalSinha21, SSW21, AaronsonAmbainis18, BGGS21]
  see_also: [Forrelation, cheatsheet]

- id: Simon
  name: Simon's problem
  symbol: '\mathrm{SIMON}_n'
  group: quantum
  order: 42
  kind: partial
  arity: '$n2^n$ bits (a function table $g:\{0,1\}^n\to\{0,1\}^n$)'
  short: 'The first exponential quantum speedup for a promise problem: $\mathrm{Q}=O(n)$ vs $\mathrm{R}=\Omega(2^{n/2})$.'
  definition: |
    Promise: $g$ is either injective, or two-to-one with $g(x)=g(x\oplus s)$ for
    a hidden $s\ne 0$. Decide which (or, in the search version, find $s$).
  formal: |
    Input: the table of $g:\{0,1\}^n\to\{0,1\}^n$. Promise: either $g$ is
    injective, or $\exists s \ne 0^n$ with $g(x)=g(y) \iff y \in \{x, x\oplus s\}$.
  values:
    - {measure: Q, value: 'O(n)', refs: [Simon97]}
    - {measure: R, value: '\Theta(2^{n/2})', refs: [Simon97]}
    - {measure: Rbar, value: '\Theta(2^{n/2})', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(2^{n/2})$ here.'}
    - {measure: Adv, value: 'O(1)', refs: [HoyerSpalek05], note: 'Both certificate complexities are $O(1)$ under the promise -- exhibiting one colliding pair $x \ne y$ with $f(x)=f(y)$ settles the question -- so the positive adversary gives $O(1)$ against $\mathrm{Q} = \Theta(n)$. The largest known gap between $\mathrm{Adv}$ and $\mathrm{Q}$.'}
  witnesses:
    - {of: [R, Q], setting: partial, statement: 'Exponential: $\mathrm{R} = 2^{\Omega(\mathrm{Q})}$. The relational (find-$s$) version gives the same separation for relations.', refs: [Simon97]}
  refs: [Simon97, BernsteinVazirani97]
  see_also: [DeutschJozsa, BV, YamakawaZhandry]

- id: DeutschJozsa
  name: Deutsch-Jozsa
  symbol: '\mathrm{DJ}_n'
  group: quantum
  order: 43
  kind: partial
  arity: '$N=2^n$ bits'
  short: 'Exact quantum: 1 query vs $N/2+1$ deterministic queries (but $\mathrm{R}=O(1)$).'
  definition: 'Promise: $x$ is constant or exactly balanced. Decide which.'
  formal: '$\mathrm{DJ}(x) = 0$ if $|x| = 0$ or $|x| = N$; $=1$ if $|x| = N/2$; undefined otherwise.'
  values:
    - {measure: QE, value: '1', refs: [DeutschJozsa92]}
    - {measure: D,  value: 'N/2+1'}
    - {measure: R,  value: 'O(1)', note: 'Two random samples suffice with bounded error -- so this is an *exact*-quantum-vs-deterministic separation only.'}
  witnesses:
    - {of: [D, QE], setting: partial, statement: 'Unbounded: $\mathrm{D}=N/2+1$ vs $\mathrm{Q}_E=1$.', refs: [DeutschJozsa92]}
  refs: [DeutschJozsa92]
  see_also: [BV, EH, Simon]

- id: BV
  name: Bernstein-Vazirani
  symbol: '\mathrm{BV}_n'
  group: quantum
  order: 44
  kind: partial
  arity: '$2^n$ bits (or $n$ bits with an inner-product oracle)'
  short: 'One exact quantum query recovers an $n$-bit secret that costs $n$ classical queries.'
  definition: 'Promise: $x_i = \langle s, i\rangle \bmod 2$ for a hidden $s \in \{0,1\}^n$. Output $s$ (or one bit of it).'
  values:
    - {measure: QE, value: '1', refs: [BernsteinVazirani97]}
    - {measure: D,  value: 'n'}
    - {measure: R,  value: '\Omega(n)'}
  witnesses:
    - {of: [R, QE], setting: relation, statement: 'The "find $s$" version is a relation: $\mathrm{Q}_E=1$ vs $\mathrm{R}=\Omega(n)$.', refs: [BernsteinVazirani97]}
  refs: [BernsteinVazirani97]
  see_also: [DeutschJozsa, Simon, PARITY]

- id: GroverSearch
  name: Unstructured search (relation)
  symbol: '\mathrm{SEARCH}_n'
  group: relational
  order: 45
  kind: relation
  arity: '$n$ bits'
  short: 'The canonical relation: output any index $i$ with $x_i=1$.'
  definition: |
    $\mathrm{SEARCH}_n = \{(x,i) : x_i = 1\}$. As stated this is a *partial*
    relation (nothing is valid on $x=0^n$); the total version adds
    $(0^n, \bot)$.
  formal: '$S = \{(x,i)\in\{0,1\}^n\times[n] : x_i = 1\} \cup \{(0^n,\bot)\}$.'
  values:
    - {measure: Q,  value: '\Theta(\sqrt n)', refs: [Grover96, BBBV97]}
    - {measure: R,  value: '\Theta(n)'}
    - {measure: D,  value: 'n'}
    - {measure: Advpm, value: '\Theta(\sqrt n)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt n)$ here.'}
    - {measure: MAdv, value: '\Theta(\sqrt n)', refs: [Spalek08], note: '$\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$ and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_\varepsilon)$, so the multiplicative adversary is $\Theta(\mathrm{Q})$ on every function; here $\mathrm{Q} = \Theta(\sqrt n)$.'}
    - {measure: R0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
  witnesses:
    - {of: [R, Q], setting: relation, statement: '$\mathrm{R}=\Theta(\mathrm{Q}^2)$ for a relation, same as the decision version.', refs: [Grover96, BBBV97]}
  refs: [Grover96, BBBV97]
  see_also: [OR, ApproxHW, promiseFind1]

- id: promiseFind1
  name: FIND-1 under a density promise
  symbol: '\mathrm{Find1}_{\ge n/2}'
  group: relational
  order: 46
  kind: relation
  arity: '$n$ bits'
  short: 'The cleanest D-vs-R relational separation: $\mathrm{R}=O(1)$, $\mathrm{D}=n/2+1$.'
  definition: |
    Promise $|x| \ge n/2$; output any $i$ with $x_i = 1$. Sampling a single
    random index succeeds with probability $\ge 1/2$, so $\mathrm{R}=O(1)$;
    but an adversary can answer $0$ to a deterministic algorithm's first
    $n/2$ queries.
  values:
    - {measure: R,  value: 'O(1)'}
    - {measure: R0, value: 'O(1)', note: 'Zero error too: the algorithm *verifies* its own output, which is exactly why $\mathrm{R}_0=\Theta(\mathrm{R})$ for relations.'}
    - {measure: D,  value: 'n/2+1'}
    - {measure: psD, value: '\Omega(n)', conf: medium, note: 'Reproducibility is what costs: cf. ApproxHW.'}
  witnesses:
    - {of: [D, R],  setting: relation, statement: 'Unbounded: no function of $\mathrm{R}$ bounds $\mathrm{D}$ for *partial* relations.', refs: [GIPS21]}
  refs: [GIPS21, CDM23]
  see_also: [ApproxHW, GroverSearch, psD]

- id: ApproxHW
  name: Approximate Hamming weight
  symbol: '\mathrm{ApproxHW}'
  group: relational
  order: 47
  kind: relation
  arity: '$n$ bits'
  short: 'Total search problem with $\mathrm{R}=O(1)$ but $\mathrm{psD}=\Omega(n)$: reproducibility is exponentially expensive.'
  definition: |
    Output any integer $w$ with $\big|\,w - |x|\,\big| \le \varepsilon n$.
    Random sampling gives an estimate with $O(1/\varepsilon^2)$ queries; but a
    *pseudo-deterministic* algorithm must commit to one canonical $w$ for each
    $x$, and near the boundaries that forces $\Omega(n)$ queries.
  values:
    - {measure: R,   value: 'O(1)'}
    - {measure: psD, value: '\Omega(n)', refs: [CDM23, GIPS21]}
    - {measure: D,   value: '\Omega(n)'}
  witnesses:
    - {of: [psD, R], setting: relation, statement: 'Exponential separation between pseudo-deterministic and randomized query complexity of a *total* search problem; also an $\exp(\Omega(n))$ separation in decision-tree **size**.', refs: [CDM23, GIPS21]}
  refs: [CDM23, GIPS21, GGR13]
  see_also: [psD, SearchCNF, promiseFind1]

- id: SearchCNF
  name: SearchCNF
  symbol: '\mathrm{Search}(\varphi)'
  group: relational
  order: 48
  kind: relation
  arity: '$n$ bits (an assignment to an unsatisfiable CNF $\varphi$)'
  short: 'The canonical TFNP-style query relation: given an assignment, output a falsified clause.'
  definition: |
    Fix an unsatisfiable $k$-CNF $\varphi$ on $n$ variables. Given an assignment
    $x$, output (the index of) some clause of $\varphi$ falsified by $x$.
    Total by unsatisfiability. This is the query-complexity home of TFNP$^{dt}$
    and of resolution lower bounds.
  values:
    - {measure: R,   value: 'O(1) \text{ for random } k\text{-CNFs (sample a clause)}', conf: medium}
    - {measure: psD, value: '\Omega(n^{1/3})', refs: [CDM23], note: '$\Omega(\sqrt n)$ in the related setting of [GIPS21]; also $\exp(\widetilde\Omega(n^{1/4}))$ in pseudo-deterministic decision-tree *size*.'}
    - {measure: cbs, value: '\Omega(n)', refs: [GoosPitassi14, HuynhNordstrom12], note: 'For the false-clause search problem of a random $\Delta$-dense unsatisfiable $k$-CNF, and for the Tseitin contradiction on a bounded-degree expander. This is the whole point of the measure: ordinary $\mathrm{R}$ is $O(1)$ here (sample a clause and check it), and even block sensitivity of a *fixed* solution function can be small, but every solution function is block-sensitive at some critical input. Lifting $\mathrm{cbs}$ with a constant-size gadget is what yields the tight monotone-circuit-depth and Cutting-Planes lower bounds.'}
  refs: [GIPS21, CDM23]
  see_also: [psD, ApproxHW]

- id: GapMaj
  name: Gap-Majority
  symbol: '\mathrm{GapMaj}^{\delta}_{n}'
  group: separating
  order: 49
  kind: partial
  arity: '$n$ bits'
  short: 'The universal "hardest easy" promise problem; characterises noisy randomized complexity.'
  definition: |
    Promise $\big||x| - n/2\big| \ge \delta n$; output $1$ if $|x| \ge n/2+\delta n$
    and $0$ if $|x| \le n/2-\delta n$.
  formal: '$\mathrm{GapMaj}^\delta_n(x) = \mathbb{1}[|x| > n/2]$ restricted to $\{x : \big||x|-n/2\big| \ge \delta n\}$.'
  values:
    - {measure: R,      value: '\Theta(\min(n, 1/\delta^2))', note: 'Sample $\Theta(1/\delta^2)$ coordinates and compare the empirical density with $1/2$; the lower bound is the standard bias-amplification argument (Lemma 26 of [BenDavidBlais20composition] for the $\delta = 2/\sqrt{n}$ instance, where it reads $\mathrm{R} = \Theta(n)$).', refs: [BenDavidBlais20composition]}
    - {measure: D,      value: '\Theta(n)', note: 'Independent of $\delta$, and the whole point of the example: $\mathrm{D}$ is unbounded in terms of $\mathrm{R}$ on partial functions. Adversary count: after $q$ queries returning $a$ ones, output $0$ is still consistent iff $a \le n/2-\delta n$ and output $1$ iff $a + (n-q) \ge n/2+\delta n$, so keeping both alive is possible exactly while $q \le (1-2\delta)n$ -- giving $\mathrm{D} = (1-2\delta)n + 1$ up to integrality, and $n$ queries always suffice.'}
    - {measure: noisyR, value: '\Theta(\min(n, 1/\delta^2))', putative: true, refs: [BenDavidBlais20composition], note: 'Equal to $\mathrm{R}$: buying bias buys nothing here, which is exactly why $\mathrm{GapMaj}$ is the universal inner function of [BenDavidBlais20composition] (Theorem 4: $\mathrm{noisyR}(f) = \Theta(\mathrm{R}(f \circ \mathrm{GapMaj}_n)/n)$, with their $\mathrm{GapMaj}_n$ the $\delta = 2/\sqrt{n}$ instance). Upper: $\mathrm{noisyR} \le \mathrm{R}$ always. Lower: let $\mu^{\pm}$ be uniform on the two Hamming levels, so each coordinate is marginally $\mathrm{Bern}(1/2 \pm \delta)$. A noisy query of bias $\gamma$ returns a bit distributed $\mathrm{Bern}(1/2 \pm \gamma\delta)$, and $\mathrm{KL} = O(\gamma^2\delta^2)$, while the query costs $\gamma^2$. Distinguishing $\mu^+$ from $\mu^-$ needs $\Omega(1)$ total divergence, so the cost $\sum_j \gamma_j^2$ is $\Omega(1/\delta^2)$.'}
    - {measure: Q,      value: '\Theta(\min(n, 1/\delta))', note: 'Amplitude estimation of $|x|/n$ to additive $\delta$; the matching lower bound is the usual approximate-counting bound of [NayakWu99]. So the promise buys a quadratic quantum speed-up over $\mathrm{R}$, the same one as for approximate counting.', refs: [NayakWu99]}
    - {measure: LR, value: '\Theta\!\big(\sqrt{\mathrm{R}}\big) = \Theta\!\big(\min(\sqrt n, 1/\delta)\big)', refs: [BBGM22], conf: medium, note: 'The extreme case of the $\Omega(\sqrt{\mathrm{R}}) \le \mathrm{LR} \le \mathrm{R}$ sandwich, and the reason the measure was introduced: a single query already gives bias $\Theta(\delta)$ towards the answer, and $\mathrm{LR}$ charges $1/\gamma$ rather than $1/\gamma^2$ for bias $\gamma$. So gapped majority is cheap for $\mathrm{LR}$ and expensive for $\mathrm{R}$, which is exactly the slack that makes randomized composition fail.'}
    - {measure: chibar, value: 'O\!\big(\min(\sqrt n, 1/\delta)\big)', refs: [GLSS19], conf: medium, note: 'At most $\mathrm{LR}$. Since $\bar\chi$ is the quantity that appears in the composition theorem $\mathrm{R}(f \circ g^n) = \Omega(\mathrm{R}(f)\bar\chi(g))$, gapped majority as an *inner* function loses a square root -- which is precisely why $\mathrm{R}$ does not compose.'}
    - {measure: C,      value: '\Theta(n)', note: 'Exactly $n/2 - \delta n + 1$ on both sides, for every $\delta$. A $1$-certificate must fix that many ones: fix fewer and setting all free coordinates to $0$ leaves a completion that is still inside the promise and is a $0$-input. Symmetrically for $\mathrm{C}^0$. Note this is *not* $\Theta(\mathrm{D})$ by accident -- here $\mathrm{C}$, $\mathrm{C}^0$, $\mathrm{C}^1$ and $\mathrm{D}$ all coincide up to the additive $1$.'}
    - {measure: bs,     value: '\Theta(\min(n, 1/\delta))', note: 'Every sensitive block at a promise input must move at least $2\delta n$ coordinates, so disjoint blocks number at most $1/(2\delta)$; and at an input of weight exactly $n/2+\delta n$ that many disjoint blocks of $2\delta n$ ones each do flip the answer.'}
    - {measure: fbs,    value: '\Theta(\min(n, 1/\delta))', note: 'Same counting, fractionally: $2\delta n\sum_B w_B \le \sum_i\sum_{B \ni i} w_B \le n$. So $\mathrm{fbs} = \Theta(\mathrm{bs}) = O(1)$ at constant $\delta$ while $\mathrm{C} = \Theta(n)$ -- the promise-function counterexample to $\mathrm{C} = O(\mathrm{fbs}^2)$ and to $\mathrm{C} = O(\mathrm{RC}^2)$.'}
  witnesses:
    - {of: [D, R], setting: partial, statement: 'At constant $\delta$, $\mathrm{D} = \Theta(n)$ while $\mathrm{R} = \Theta(1)$: the standard proof that $\mathrm{D}$ is unbounded in terms of $\mathrm{R}$ on partial functions.'}
    - {of: [R, Q], setting: partial, statement: 'Quadratic: $\mathrm{R} = \Theta(1/\delta^2)$ against $\mathrm{Q} = \Theta(1/\delta)$, the approximate-counting speed-up in its cleanest form.', refs: [NayakWu99]}
    - {of: [C, fbs], setting: partial, statement: 'At constant $\delta$, $\mathrm{C} = \Theta(n)$ while $\mathrm{fbs} = O(1)$: rounding a fractional certificate is a total-function argument.'}
  refs: [BenDavidBlais20composition, BenDavidBlais20minimax, BBGM22]
  see_also: [noisyR, R, LR, chibar, ApproxIndex]

- id: ApproxIndex
  name: Approximate index
  symbol: '\mathrm{ApproxIndex}_k'
  group: separating
  order: 49.5
  kind: partial
  arity: '$n = k + 2^k$ bits (a $k$-bit address and a $2^k$-cell array over $\{0,1,2\}$, binary-encoded)'
  scale: {var: k, subs: {n: '2^k'}, note: 'The array dominates the address, $n = k + 2^k = \Theta(2^k)$.'}
  short: 'The outer function that refutes the randomized composition conjecture: a *biased guess* at the index is good enough, which is cheap noisily and expensive classically.'
  definition: |
    The input is an address $a \in \{0,1\}^k$ together with an array
    $x \in \{0,1,2\}^{2^k}$ indexed by $\{0,1\}^k$. The promise: every cell $b$ within
    Hamming distance $k/2 - 2\sqrt{k\log k}$ of $a$ holds one and the same bit, and every
    other cell holds $2$. Output that bit.

    The point is the slack. You never have to find $a$ -- any $b$ in a ball of radius just
    barely under $k/2$ around it reads off the answer -- and a ball of that radius catches a
    string built by guessing each bit of $a$ with only a *small bias*. Bias is cheap in the
    noisy model and expensive in the query model, and that difference is the whole
    counterexample. The alphabet $\{0,1,2\}$ costs only a constant factor after binary
    encoding, so this is treated as a partial Boolean function.
  formal: '$\mathrm{ApproxIndex}(a,x) = x_a$ if $x_b = x_a \in \{0,1\}$ for every $b$ with $|b-a| \le k/2 - 2\sqrt{k\log k}$ and $x_b = 2$ for every other $b$; undefined otherwise.'
  values:
    - {measure: R, value: '\Theta(\sqrt{k\log k}) = \Theta(\sqrt{\log n\,\log\log n})', refs: [BenDavidBlais20composition], note: 'Lemma 27. Upper: read the first $8\sqrt{k\log k}$ bits of $a$, fill the rest of $b$ with fair coins, query $x_b$. Lower: an algorithm making $\sqrt{k\log k}$ queries can be assumed never to query the array (pretend the answer is $2$), and then it must still name a small set of candidate addresses one of which lands in the ball -- i.e. guess $k/2 + \sqrt{k\log k}$ of the unread bits of a uniformly random string correctly, which Chernoff forbids.'}
    - {measure: D, value: '\Theta(\sqrt{k\log k})', putative: true, note: 'So this function is *not* a $\mathrm{D}$-vs-$\mathrm{R}$ separation, which is worth knowing given how hard its $\mathrm{R}$ lower bound works. Lower: $\mathrm{D} \ge \mathrm{R}$. Upper: read the first $q = 4\sqrt{k\log k}$ bits of $a$ and let $b$ agree with them and be $0$ elsewhere, $b''$ agree with them and be $1$ elsewhere. Then $|b-a| + |b''-a| = k-q$, so one of the two is within $(k-q)/2 = k/2 - 2\sqrt{k\log k}$ of $a$ -- inside the ball. Query $x_b$; if it is $2$, query $x_{b''}$, which cannot be. Total $4\sqrt{k\log k}+O(1)$ queries, deterministically. Randomness buys nothing here: it only replaces "read $4\sqrt{k\log k}$ bits and use antipodal guesses" with "read $8\sqrt{k\log k}$ bits and guess at random".'}
    - {measure: R0, value: '\Theta(\sqrt{k\log k})', note: 'Sandwiched: $\mathrm{R} \le \mathrm{R}_0 \le \mathrm{D}$, and the two ends agree.'}
    - {measure: noisyR, value: 'O(\log k) = O(\log\log n)', refs: [BenDavidBlais20composition], note: 'Not stated as a value in the source, but it is exactly what its two theorems say. Their composed algorithm gives $\mathrm{R}(\mathrm{ApproxIndex}_k \circ \mathrm{GapMaj}_k) = O(k\log k)$, and Theorem 3 says $\mathrm{R}(f \circ g) = \Omega(\mathrm{noisyR}(f)\,\mathrm{R}(g))$ with $\mathrm{R}(\mathrm{GapMaj}_k) = \Theta(k)$; divide. Directly, in the noisy model: buy each of the $k$ address bits at bias $\gamma = c\sqrt{\log k/k}$ for $\gamma^2$ each, total $c^2\log k$, which puts the guess inside the ball with high probability, then read one array cell at bias $1$.'}
    - {measure: Rbar, value: '\Theta(\sqrt{k\log k}) = \Theta(\sqrt{\log n\,\log\log n})', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(\sqrt{k\log k}) = \Theta(\sqrt{\log n\,\log\log n})$ here.'}
  witnesses:
    - {of: [R, noisyR], setting: partial, statement: 'An *exponential* gap: $\mathrm{R} = \Theta(\sqrt{k\log k})$ against $\mathrm{noisyR} = O(\log k)$, so $\mathrm{R} = 2^{\Omega(\mathrm{noisyR})}$ on this family.', refs: [BenDavidBlais20composition]}
    - {of: [R, R], setting: partial, statement: 'Composed with $\mathrm{GapMaj}_k$ it refutes the randomized composition conjecture: $\mathrm{R}(f)\,\mathrm{R}(g) = \tilde\Theta(k^{3/2})$ but $\mathrm{R}(f \circ g) = O(k \log k)$.', refs: [BenDavidBlais20composition]}
  refs: [BenDavidBlais20composition, GLSS19]
  see_also: [GapMaj, noisyR, R, composition, LR, ADDR]

- id: Collision
  name: Collision problem
  symbol: '\mathrm{COL}_n'
  group: quantum
  order: 50
  kind: partial
  arity: 'a function table $g:[n]\to[n]$'
  short: '$\mathrm{Q}=\Theta(n^{1/3})$ vs $\mathrm{R}=\Theta(\sqrt n)$: a *polynomial-only* quantum speedup for a promise problem.'
  definition: 'Promise: $g$ is one-to-one or two-to-one. Decide which.'
  values:
    - {measure: Q, value: '\Theta(n^{1/3})', refs: [BHT98, AaronsonShi04, Kutin05], note: 'Upper: the birthday-paradox-plus-Grover algorithm of [BHT98]. Lower: the polynomial method [AaronsonShi04], originally for range $\Omega(n^2)$; [Kutin05] removed the range restriction (their proof needed range $\ge 3n/2$) and simplified the argument, and [Ambainis05smallrange] handles small ranges too.'}
    - {measure: R, value: '\Theta(\sqrt n)', note: 'Birthday paradox both ways.'}
    - {measure: Advpm, value: '\Theta(n^{1/3})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n^{1/3})$ here.'}
    - {measure: Rbar, value: '\Theta(\sqrt n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(\sqrt n)$ here.'}
    - {measure: MAdv, value: '\Theta(n^{1/3})', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(n^{1/3})$ here.'}
    - {measure: Adv, value: 'O(1)', refs: [HoyerSpalek05, SpalekSzegedy06], note: 'The certificate complexity barrier at its sharpest: a collision pair certifies a $2$-to-$1$ input with $2$ queries, and the promise means $O(1)$ queries also certify $1$-to-$1$-ness against the promise, so $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = O(1)$ while $\mathrm{Q} = \Theta(n^{1/3})$. No positive-weight adversary matrix can prove anything here -- this promise problem is the reason the negative-weights version had to be invented.'}
  refs: [BHT98, AaronsonShi04, Kutin05, Ambainis05smallrange, Ambainis07]
  see_also: [ElementDistinctness, KDistinctness, Simon]

- id: ElementDistinctness
  name: Element distinctness
  symbol: '\mathrm{ED}_n'
  group: quantum
  order: 51
  kind: total
  arity: '$n$ symbols from a large alphabet'
  short: '$\mathrm{Q}=\Theta(n^{2/3})$ vs $\mathrm{R}=\Theta(n)$; a total (non-Boolean-input) function.'
  definition: 'Decide whether all $n$ input symbols are distinct.'
  values:
    - {measure: Q, value: '\Theta(n^{2/3})', refs: [Ambainis07, AaronsonShi04, Ambainis05smallrange], note: 'Upper: the quantum walk of [Ambainis07]. Lower: the polynomial method [AaronsonShi04], which needs alphabet size $\Omega(n^2)$; [Ambainis05smallrange] gets $\Omega(n^{2/3})$ down to alphabet size $n$. The $\varepsilon$-dependence is $\Theta(n^{2/3}\log^{1/3}(1/\varepsilon))$ [SherstovThaler23].'}
    - {measure: R, value: '\Theta(n)'}
    - {measure: D, value: 'n'}
    - {measure: Advpm, value: '\Theta(n^{2/3})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n^{2/3})$ here.'}
    - {measure: gamma2, value: '\Theta(n^{2/3})', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n^{2/3})$ here.'}
    - {measure: MAdv, value: '\Theta(n^{2/3})', refs: [Spalek08], note: '$\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$ and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_\varepsilon)$, so the multiplicative adversary is $\Theta(\mathrm{Q})$ on every function; here $\mathrm{Q} = \Theta(n^{2/3})$.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: Adv, value: 'O(\sqrt n)', refs: [SpalekSzegedy06, Zhang05, HoyerSpalek05], note: 'A colliding pair is a $2$-query certificate, but distinctness itself needs all $n$ values: $\mathrm{C}^1 = 2$ and $\mathrm{C}^0 = n$. The barrier caps the *product*, so $\mathrm{Adv} \le \sqrt{2n} = O(\sqrt n)$ -- short of $\mathrm{Q} = \Theta(n^{2/3})$, but not the $O(1)$ that a one-sided reading of the barrier would suggest. See [[Collision]] for the case where the collapse really is total.'}
  notes: 'A reminder that the "total function" theory in this zoo is for *Boolean* inputs; large alphabets change the picture (here $\mathrm{R}=\Theta(\mathrm{Q}^{3/2})$, which is fine, but the polynomial-relation proofs are alphabet-sensitive).'
  refs: [Ambainis07, AaronsonShi04, Ambainis05smallrange, SherstovThaler23]
  see_also: [Collision, KDistinctness, Q]

- id: AmbainisBelovsFn
  name: Ambainis-Belovs function
  symbol: 'f_{\mathrm{AB}}'
  group: quantum
  order: 52
  kind: partial
  arity: '$n$ bits'
  short: 'Exponential separation between $\mathrm{Q}$ and $\deg$ for a partial function.'
  definition: |
    A partial function whose (exact) polynomial degree is exponentially smaller
    than its quantum query complexity -- so the polynomial method is not merely
    lossy but exponentially lossy in the promise setting.
  witnesses:
    - {of: [Q, deg], setting: partial, statement: '$\mathrm{Q}(f) = 2^{\Omega(\deg(f))}$-style: exponential.', refs: [AmbainisBelovs23]}
  refs: [AmbainisBelovs23, BenDavidKundu24search]
  see_also: [BDKrelation, deg, Q]
  todo: 'Transcribe the construction from [AmbainisBelovs23].'

- id: BDKrelation
  name: Ben-David-Kundu total search problems
  symbol: 'S_{\mathrm{BDK}}'
  group: relational
  order: 53
  kind: relation
  arity: '$n$ bits'
  short: 'Exponential $\mathrm{Q}$-vs-$\widetilde{\deg}$ and $\mathrm{Q}$-vs-conical-junta-degree separations for *total* search problems.'
  definition: |
    A pair of translations (partial function $\to$ total search problem, and back)
    that transports separations across the two settings, plus explicit total
    search problems realising them.
  witnesses:
    - {of: [Q, adeg],  setting: relation, statement: 'Exponential separation between quantum query complexity and approximate degree for a **total** search problem.', refs: [BenDavidKundu24search]}
    - {of: [Q, cjdeg], setting: relation, statement: 'Strengthened: exponential separation from the *larger* two-sided approximate non-negative (conical junta) degree -- previously not even a separation from $\mathrm{R}$ was known.', refs: [BenDavidKundu24search]}
    - {of: [adeg, Adv], setting: relation, statement: 'Exponential separation between approximate degree and the positive quantum adversary.', refs: [BenDavidKundu24search]}
  notes: 'Also gives a new proof of the Ambainis-Belovs partial-function separation, and lifts to an exponential quantum-information-complexity vs relaxed-partition-bound separation in communication complexity.'
  refs: [BenDavidKundu24search, AmbainisBelovs23]
  see_also: [cjdeg, AmbainisBelovsFn, psD]

- id: YamakawaZhandry
  name: Yamakawa-Zhandry problem
  symbol: 'S_{\mathrm{YZ}}'
  group: relational
  order: 54
  kind: relation
  arity: 'random oracle'
  short: 'Verifiable exponential quantum advantage for an NP search problem relative to a random oracle.'
  definition: |
    Find a codeword of a fixed error-correcting code all of whose symbols land in
    a random oracle's preimage set. Quantum: $\mathrm{poly}$ queries; classical:
    exponentially many, *and* solutions are efficiently verifiable.
  values:
    - {measure: Q, value: '\mathrm{poly}(n)', refs: [YamakawaZhandry22]}
    - {measure: R, value: '2^{\Omega(n)}', refs: [YamakawaZhandry22]}
  witnesses:
    - {of: [R, Q], setting: relation, statement: 'Exponential, with efficiently checkable solutions -- the strongest form of query-model quantum advantage for a search problem.', refs: [YamakawaZhandry22]}
  refs: [YamakawaZhandry22]
  see_also: [Simon, BDKrelation, GroverSearch]
