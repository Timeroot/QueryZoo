# =====================================================================
# FUNCTIONS: partial functions (promise problems) and relations
# (search problems). This is where the polynomial relations of the
# total world break down, often exponentially.
# =====================================================================

functions:

- id: Forrelation
  name: FORRELATION
  symbol: '\mathrm{forr}'
  aliases: ['Fourier correlation', '2-forrelation']
  group: quantum
  order: 40
  kind: partial
  arity: '$2n$ bits (two strings $x,y \in \{\pm1\}^n$)'
  short: 'One quantum query vs $\widetilde\Theta(\sqrt n)$ randomized queries -- the maximal possible gap at $\mathrm{Q}=1$.'
  definition: |
    Decide whether $y$ is highly correlated with the Fourier transform of $x$.
  formal: |
    For $x, y \in \{-1,1\}^n$ with $n=2^m$, let
    $$\Phi(x,y) \;=\; \frac{1}{n^{3/2}}\sum_{i,j\in\{0,1\}^m} x_i\,(-1)^{i\cdot j}\,y_j
      \;=\; \frac{1}{\sqrt n}\,\langle \hat x, y\rangle .$$
    $\mathrm{forr}(x,y) = 1$ if $\Phi(x,y) \ge 3/5$, $= 0$ if $|\Phi(x,y)| \le 1/100$,
    and undefined otherwise.
  values:
    - {measure: Q,    value: '1', refs: [AaronsonAmbainis18], note: 'Prepare uniform superposition, query $x$, Hadamard, query $y$, Hadamard, measure.'}
    - {measure: adeg, value: 'O(1)', note: '$\widetilde{\deg}\le 2\mathrm{Q} = 2$.'}
    - {measure: R,    value: '\widetilde\Theta(\sqrt n)', refs: [AaronsonAmbainis18, Tal20], note: 'Lower bound $\Omega(\sqrt n/\log n)$ [AaronsonAmbainis18], improved to $\widetilde\Omega(\sqrt n)$ via Fourier growth of decision trees [Tal20]. Matching $O(\sqrt n)$ upper bound.'}
    - {measure: D,    value: '\Theta(n)'}
    - {measure: D_prod, value: '0', putative: true, note: 'The support of a product distribution is a combinatorial rectangle $\prod_i S_i$, and no rectangle inside the promise can meet both sides. Flipping one bit of $x$ or $y$ moves $\Phi$ by at most $2/\sqrt n$, since $|\partial\Phi/\partial x_i| = n^{-3/2}\big|\sum_j (-1)^{i\cdot j}y_j\big| \le n^{-1/2}$. So if the rectangle held a $1$-input ($\Phi \ge 3/5$) and a $0$-input ($|\Phi| \le 1/100$) one could walk between them inside the rectangle one bit at a time, and for $n \ge 16$ some intermediate point -- also in the rectangle -- would have $\Phi$ in the forbidden band $(1/100, 3/5)$, off the promise. Hence every product $\mu$ is one-sided and $\mathrm{D}^\mu = 0$, against $\mathrm{R} = \widetilde\Theta(\sqrt n)$. This collapse is generic for promise problems, not special to forrelation: it recurs at [[Simon]], [[BV]], [[Collision]], [[GapMaj]] and [[ApproxIndex]], and it is why $\mathrm{RS}(g) = \widetilde\Omega(\mathrm{D}^{\mathrm{prod}}(g))$ is stated only for total $g$.'}
    - {measure: Advpm, value: '\Theta(1)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = 1$ here.'}
    - {measure: MAdv, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with $\mathrm{Adv}^{\pm}(f) = \Theta(1)$ and $\mathrm{Q}_{\varepsilon}(f) = 1$ here.'}
    - {measure: Rbar, value: '\widetilde\Theta(\sqrt n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \widetilde\Theta(\sqrt n)$ here.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: Adv, value: '\Theta(1)', note: 'A lower bound on $\mathrm{Q} = 1$.'}
    - {measure: Dmu, value: '\widetilde\Theta(\sqrt n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \widetilde\Theta(\sqrt n)$.'}
    - {measure: Dna, value: '\Theta(n)', note: 'Between $\mathrm{D} = \Theta(n)$ and the trivial $2n$.'}
    - {measure: s, value: '0', putative: true, note: 'The promise gap is wider than one flip. Flipping a single $x_i$ changes $\Phi$ by $\tfrac{2}{n^{3/2}}\big|\sum_j (-1)^{i\cdot j} y_j\big| \le 2/\sqrt n$, and the same bound holds for a $y_j$; the two promise regions are separated by $3/5 - 1/100$. So for $n \ge 12$ no single flip stays inside the promise with a different value, and $\mathrm{s}^0 = \mathrm{s}^1 = 0$ while $\mathrm{D} = \Theta(n)$.'}
    - {measure: s0, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: s1, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph on the promise has no edges (see $\mathrm{s} = 0$), so the adjacency matrix is zero. Spectral sensitivity lower-bounds $\mathrm{Q}$ for total functions and says nothing at all here.'}
    - {measure: bs, value: 'O(1)', note: 'Two arguments, the second much sharper. *Counting:* flipping $m$ coordinates moves $\Phi$ by at most $2m/\sqrt n$, so every sensitive block has $\Omega(\sqrt n)$ coordinates and at most $O(\sqrt n)$ of them are disjoint. *Adversary:* $\mathrm{bs}(f) \le \mathrm{Adv}(f)^2$ holds for partial $f$ as well ([[bs]] vs [[Adv]] -- disjointness of the blocks is all the proof uses), and $\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = \Theta(1)$ here. So block sensitivity is *constant* against $\mathrm{D} = \Theta(n)$, and it does not even see the $\widetilde\Theta(\sqrt n)$ scale of $\mathrm{R}$.'}
    - {measure: bs0, value: 'O(1)', note: 'See $\mathrm{bs}$: $\mathrm{bs}^0 \le \mathrm{bs} = O(1)$.'}
    - {measure: bs1, value: 'O(1)', note: 'See $\mathrm{bs}$: $\mathrm{bs}^1 \le \mathrm{bs} = O(1)$.'}
    - {measure: fbs, value: 'O(1)', note: 'The fractional relaxation is constant too, by the quantum certificate route rather than by counting: $\mathrm{fbs}(f) = \Theta(\mathrm{RC}(f)) = \Theta(\mathrm{QC}(f)^2)$ for partial $f$ ([[QC]] vs [[RC]]), and $\mathrm{QC} \le \mathrm{Q} = 1$ since an algorithm computing $f$ also verifies its input. The load count of the $\mathrm{bs}$ entry only gives $O(\sqrt n)$; this is the right answer.'}
    - {measure: FC, value: 'O(1)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: 'O(1)', note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = O(1)$.'}
    - {measure: QC, value: '\Theta(1)', note: 'An algorithm computing $f$ also verifies it, so $\mathrm{QC} \le \mathrm{Q} = 1$; and $\mathrm{QC} \ge 1$ for a non-constant $f$. This is what forces $\mathrm{fbs} = O(1)$ above, via $\mathrm{QC} = \Theta(\sqrt{\mathrm{fbs}})$.'}
    - {measure: sdeg, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = O(1)$, and at least $1$. Every degree measure below $\widetilde{\deg}$ is constant here while $\mathrm{R} = \widetilde\Theta(\sqrt n)$.'}
    - {measure: odeg, value: '\Theta(1)', note: 'Sandwiched between $\mathrm{sdeg} = \Theta(1)$ and $\widetilde{\deg} = O(1)$.'}
    - {measure: ardeg, value: '\Theta(1)', note: 'A polynomial is a rational function with denominator $1$, so $\mathrm{rdeg}_\varepsilon \le \widetilde{\deg} = O(1)$; and at least $1$.'}
    - {measure: PostQ, value: '\Theta(1)', note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = \Theta(1)$. Post-selection is of no use on a problem already solved by one query.'}
    - {measure: cjdeg, value: '\widetilde O(\sqrt n)', note: 'Sandwiched: $\widetilde{\deg} \le \mathrm{cjdeg}_\varepsilon \le \mathrm{R}_\varepsilon$, i.e. between $O(1)$ and $\widetilde\Theta(\sqrt n)$.'}
    - {measure: CA, value: '\widetilde O(\sqrt n)', note: 'The classical adversary lower-bounds $\mathrm{R} = \widetilde\Theta(\sqrt n)$ (via $\mathrm{CA} \le \mathrm{prt}_\varepsilon + \log(1/\varepsilon) \le 2\mathrm{R}_\varepsilon + O(1)$). It is at least $\Omega(\mathrm{fbs})$, which is only $\Omega(1)$ here, so nothing pins it further.'}
    - {measure: CGpub, value: '\widetilde O(\sqrt n)', refs: [CGLMSG23], note: 'The public-coin, entangled and non-signaling certificate games all collapse to $\Theta(\mathrm{CA})$ (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]).'}
    - {measure: CGstar, value: '\widetilde O(\sqrt n)', refs: [CGLMSG23], note: 'Equal to $\mathrm{CG}^{\mathrm{pub}}$ up to constants; see [[CGpub]] vs [[CGns]].'}
    - {measure: CGns, value: '\widetilde O(\sqrt n)', refs: [CGLMSG23], note: 'Equal to $\mathrm{CG}^{\mathrm{pub}}$ up to constants; see [[CGpub]] vs [[CGns]].'}
    - {measure: R1, value: '\widetilde\Omega(\sqrt n)', note: 'Sandwiched: $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0$, both $\widetilde\Omega(\sqrt n)$ here.'}
    - {measure: RS, value: '\widetilde O(\sqrt n)', note: 'From the partial-function chain $\mathrm{RS} = O(\bar\chi) = O(\mathrm{LR}) = O(\mathrm{R})$. Nothing pins it from below: $\mathrm{CA} \le \mathrm{RS}$ is the only lower bound available and $\mathrm{CA}$ itself is unpinned here.'}
    - {measure: chi, value: '\widetilde O(\sqrt n)', note: '$\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R}$ for partial $g$. The familiar lower bound $\chi = \Omega(\mathrm{bs})$ is a total-function statement [Li18] and gives only $\Omega(1)$ here in any case, since $\mathrm{bs} = O(1)$.'}
    - {measure: Rstar, value: '\widetilde O(\sqrt n)', note: '$\mathrm{R}^{*} \le \mathrm{R}$ for partial $f$; from below $\mathrm{R}^{*} = \Omega(\mathrm{LR}) = \widetilde\Omega(n^{1/4})$ and $\mathrm{R}^{*} = \Omega(\mathrm{Q}) = \Omega(1)$, so the composition-friendly version of $\mathrm{R}$ is still polynomially far above the single quantum query.'}
    - {measure: noisyR, value: '\widetilde O(\sqrt n)', note: 'At most $\mathrm{R}$. The reverse direction is only $\mathrm{R} = 2^{\Omega(\mathrm{noisyR})}$, which permits $\mathrm{noisyR}$ to be as small as $\Omega(\log n)$; cf. [[ApproxIndex]], where that exponential gap is realised.'}
    - {measure: robustQ, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log\mathrm{Q})$, and $\mathrm{Q} = 1$. So even an oracle whose every answer is only a bounded-error bit is beaten by $O(1)$ quantum queries, against $\mathrm{R} = \widetilde\Theta(\sqrt n)$ and $\mathrm{N}_p = \widetilde\Theta(\sqrt n)$ classically.'}
    - {measure: LR, value: '\widetilde\Omega(n^{1/4})', note: '$\mathrm{LR} = \Omega(\sqrt{\mathrm{R}})$ for every partial $f$, and $\mathrm{R} = \widetilde\Theta(\sqrt n)$; the upper end is $\mathrm{LR} \le \mathrm{R}$. Even the linearised measure, which charges $1/\gamma$ instead of $1/\gamma^2$ for bias $\gamma$, stays polynomially above $\mathrm{Q} = 1$.'}
    - {measure: chibar, value: '\widetilde\Omega(n^{1/4})', note: '$\mathrm{R} = O(\bar\chi^2)$ for partial $g$, so $\bar\chi = \Omega(\sqrt{\mathrm{R}}) = \widetilde\Omega(n^{1/4})$; and $\bar\chi = O(\mathrm{LR}) \le \mathrm{R}$.'}
    - {measure: Rna, value: '\widetilde\Theta(\sqrt n)', putative: true, conf: medium, note: 'The $O(\sqrt n)$ algorithm samples coordinates of $x$ and $y$ from its coins and forms an estimator of $\langle\hat x, y\rangle$, so it is non-adaptive; and $\mathrm{R}^{\mathrm{na}} \ge \mathrm{R} = \widetilde\Theta(\sqrt n)$.'}
    - {measure: R0, value: '\widetilde\Omega(\sqrt n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon} \le \mathrm{R}_0 \le \mathrm{D}$, i.e. between $\widetilde\Theta(\sqrt n)$ and $\Theta(n)$.'}
    - {measure: Np, value: '\widetilde\Theta(\sqrt n)', note: 'At least $\mathrm{R}$, and at most $O(\mathrm{R})$ by reading each sampled coordinate $O(1)$ times and majority-voting.'}
    - {measure: prt, value: '\widetilde O(\sqrt n)', note: 'From $\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon$.'}
    - {measure: rprt, value: '\widetilde O(\sqrt n)', note: 'From $\overline{\mathrm{prt}}_\varepsilon \le \mathrm{prt}_\varepsilon$.'}
    - {measure: psD, value: '\widetilde\Theta(\sqrt n)', note: 'Degenerate on a partial Boolean function: there is only one correct answer, so the canonical solution function is forced to be $f$ itself and reproducibility is free. Hence $\mathrm{psD} = \Theta(\mathrm{R}) = \widetilde\Theta(\sqrt n)$ -- see the [[psD]] entry.'}
    - {measure: cbs, value: 'O(1)', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: every input is critical and the solution function is forced, so $\mathrm{cbs} = \mathrm{bs} = O(1)$.'}
    - {measure: C, value: '\Theta(n)', putative: true, note: 'Upper: $\mathrm{C} \le 2n$. Lower, from one explicit $1$-input. Take $n = 2^m$ with $m$ even and let $x$ be a bent function on $m$ bits, so $\hat x_j = \pm n^{-1/2}$ for every $j$; put $y_j = \sqrt n\,\hat x_j \in \{\pm1\}$. Then $\Phi = \tfrac{1}{\sqrt n}\sum_j \hat x_j y_j = 1$, a $1$-input. Dually $\hat y_i = x_i/\sqrt n$, so $\Phi = \tfrac{1}{\sqrt n}\sum_i x_i \hat y_i$ and flipping any single $x_i$ lowers $\Phi$ by exactly $2/n$; flipping $t$ of them gives $\Phi = 1 - 2t/n$ exactly. Choosing $t$ near $n/2$ lands in $|\Phi| \le 1/100$, a $0$-input. So a certificate at this input must fix all but at most $0.51n$ of the $n$ coordinates of $x$, i.e. $\mathrm{C}^1 \ge 0.49n$.'}
    - {measure: C1, value: '\Theta(n)', putative: true, note: 'The lower bound recorded under [[C]] is witnessed at a $1$-input, so $\mathrm{C}^1 = \Theta(n)$ as well.'}
    - {measure: C0, value: '\Theta(n)', putative: true, note: 'Take the same bent $x$ and $y = \chi_{j_0}$, i.e. $y_j = (-1)^{j\cdot j_0}$. Then $\sum_j \hat x_j y_j = x_{j_0} = \pm1$, so $|\Phi| = 1/\sqrt n \le 1/100$ and this is a $0$-input. Since $\sum_j |\hat x_j| = \sqrt n$ and $\sum_j \hat x_j y_j = \pm 1$, the number of $j$ with $y_j \ne \mathrm{sign}(\hat x_j)$ is $n/2 \pm \sqrt n/2$, and flipping any one of them raises $\Phi$ by exactly $2/n$. Flipping $0.31n$ of them reaches $\Phi \ge 3/5$, so a certificate must fix at least $n/2 - \sqrt n - 0.31n \ge 0.18n$ of the $y$-coordinates. With $\mathrm{C}^0 \le 2n$ this gives $\Theta(n)$.'}
    - {measure: Cmin, value: '\Theta(n)', putative: true, conf: medium, note: 'Every certificate, at every promise input, fixes $\Omega(n)$ coordinates. Suppose one fixes fewer than $10^{-3}n$; then at least $0.999n$ coordinates of $x$ and $0.999n$ of $y$ are free, and by Cauchy--Schwarz the fixed $y$-positions carry $\sum_{\text{fixed } j}|\hat x_j| \le \sqrt{10^{-3}n} \le 0.032\sqrt n$. At a $1$-input, $\Phi \ge 3/5$ forces $\sum_j |\hat x_j| \ge 0.6\sqrt n$; setting every free $y_j$ to $-\mathrm{sign}(\hat x_j)$ drives $\Phi$ below $-0.5$, and reverting those bits one at a time back to their original values moves $\Phi$ in steps of $2|\hat x_j|/\sqrt n \le 2/\sqrt n < 1/50$ up to $\Phi \ge 3/5$, so some intermediate assignment has $|\Phi| \le 1/100$ -- a $0$-input consistent with the certificate. At a $0$-input, set the free $x$-coordinates uniformly at random: then $\sum_j |\hat x_j| \ge 0.7\sqrt n$ with high probability, and setting every free $y_j$ to $\mathrm{sign}(\hat x_j)$ gives $\Phi \ge 0.7 - 2(0.032) > 3/5$, a $1$-input consistent with the certificate. Either way the set was not a certificate. With $\mathrm{C}_{\min} \le \mathrm{C} \le 2n$ this pins $\Theta(n)$.'}
    - {measure: UC, value: '\Theta(n)', note: 'Squeezed: $\mathrm{C} \le \mathrm{SP} = \mathrm{UC} \le \mathrm{D}$, and both ends are $\Theta(n)$.'}
    - {measure: SP, value: '\Theta(n)', note: 'Equal to $\mathrm{UC}$ exactly, and squeezed between $\mathrm{C} = \Theta(n)$ and $\mathrm{D} = \Theta(n)$.'}
    - {measure: UCmin, value: '\Theta(n)', note: 'Squeezed between $\mathrm{C}_{\min} = \Theta(n)$ and $\mathrm{UC} = \Theta(n)$. Note this is the one-sided minimum $\min\{\mathrm{UC}^0,\mathrm{UC}^1\}$, and both sides are already $\Theta(n)$ here.'}
    - {measure: rank, value: '\Theta(n)', note: 'A tree of rank $r$ has a leaf at depth $\le r$, so $\mathrm{C}_{\min} \le \mathrm{rank} \le \mathrm{D}$; both ends are $\Theta(n)$.'}
    - {measure: D_size, value: '2^{\Theta(n)}', note: 'At least $2^{\mathrm{C}_{\min}}$ and at most $2^{\mathrm{D}+1}$, and $\mathrm{C}_{\min} = \Theta(\mathrm{D}) = \Theta(n)$. Unlike [[DeutschJozsa]], no small tree exists: the promise here has no cheap side.'}
    - {measure: EC, value: 'O(n^{3/4})', putative: true, note: 'Exhibiting a weighting directly, as one must off the promise ($\mathrm{EC} \le \mathrm{C}$ needs totality). Flipping one bit of $x$ or $y$ moves $\Phi$ by at most $2/\sqrt n$, so two promise inputs of opposite value differ in at least $(3/5-1/100)\sqrt n/2 \ge 0.29\sqrt n$ coordinates. Put $w^x_i = (0.29\sqrt n)^{-1/2}$ at every input and every coordinate: then $\sum_{i: x_i \ne y_i} w^x_i w^y_i \ge 1$, and the cost is $2n \cdot \Theta(n^{-1/4}) = \Theta(n^{3/4})$. This beats the trivial $\mathrm{EC} \le \mathrm{C} = \Theta(n)$; from below only $\mathrm{EC} \ge \mathrm{FC} = O(1)$ is available.'}
    - {measure: CG, value: 'O(n^{3/2})', putative: true, note: 'Private coins, so no shared index is available and the total-function ceiling $\mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ is not licensed here. Both players output a uniformly random one of the $2n$ positions; since opposite-valued promise inputs differ in $\ge 0.29\sqrt n$ positions the win probability is $\ge 0.29\sqrt n/(2n)^2$, so $\mathrm{CG} = O(n^{3/2})$. From below $\mathrm{CG} \ge \mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{CA})$, which is only $\Omega(1)$ here.'}
    - {measure: deg, value: 'O(n)', note: 'At most $\mathrm{D} = \Theta(n)$. Nothing smaller is known: unlike $\widetilde{\deg} = O(1)$, exact representation cannot exploit the gap between the two promise bands.'}
    - {measure: ndeg, value: 'O(n)', note: 'At most $\mathrm{C}^1 = \Theta(n)$: the sum over $1$-certificates of their indicator polynomials is a nondeterministic polynomial.'}
    - {measure: NQ, value: 'O(n)', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil$ and $\mathrm{ndeg} = O(n)$.'}
    - {measure: rdeg, value: 'O(n)', note: 'At most $\mathrm{C} = \Theta(n)$.'}
    - {measure: QE, value: 'O(n)', note: 'At most $\mathrm{D} = \Theta(n)$, at least $\mathrm{Q} = 1$. The $\mathrm{Q}_E \ge \deg/2$ bound gives nothing, since $\deg$ itself is only known to be $O(n)$.'}
    - {measure: Q0, value: 'O(n)', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Q}_0 \le \mathrm{Q}_E = O(n)$.'}
  witnesses:
    - {of: [R, Q],    setting: partial, statement: '$\mathrm{Q} = 1$ against $\mathrm{R} = \widetilde\Theta(\sqrt n)$ -- a single quantum query beats every classical algorithm making $n^{1/2-o(1)}$. This is the $\mathrm{Q}=1$ case of the Aaronson-Ambainis trade-off $\mathrm{R} = O(n^{1-1/(2\mathrm{Q})})$, shown optimal by [Tal20]; see [[kForrelation]] for the whole curve. There is no polynomial relation between $\mathrm{R}$ and $\mathrm{Q}$ for partial functions.', refs: [AaronsonAmbainis18, Tal20]}
    - {of: [R, adeg], setting: partial, statement: '$\widetilde{\deg} = O(1)$ but $\mathrm{R}=\widetilde\Omega(\sqrt n)$.', refs: [AaronsonAmbainis18]}
  notes: |
    Aaronson-Ambainis also proved the *matching upper bound*: any partial $f$ with
    $\mathrm{Q}(f)=k$ has $\mathrm{R}(f) = O(n^{1-1/(2k)})$. So Forrelation is
    optimal, and $k$-Forrelation extends this to every $k$.
  refs: [AaronsonAmbainis18, Tal20, AaronsonAmbainis14]
  see_also: [kForrelation, cheatsheet, Q, R]

- id: kForrelation
  name: k-FORRELATION
  symbol: '\mathrm{forr}_k'
  group: quantum
  order: 41
  kind: partial
  arity: '$kn$ bits'
  short: 'Optimal $\mathrm{Q}$-vs-$\mathrm{R}$ separation for every $k$: $\mathrm{Q}=\lceil k/2\rceil$, $\mathrm{R}=\widetilde\Theta(n^{1-1/k})$.'
  definition: |
    The $k$-fold generalisation: given $x^1,\dots,x^k$, decide whether
    $\langle x^1, H x^2, H x^3, \dots\rangle$-style alternating
    Hadamard/pointwise-product composition is large.
  formal: |
    $$\Phi_k(x^1,\dots,x^k) = \frac{1}{n}\,\mathbf{1}^{\!\top} D_{x^1} H D_{x^2} H \cdots H D_{x^k}\, \mathbf{1},$$
    where $H$ is the normalised Hadamard transform and $D_{x}$ is the diagonal
    matrix with $x$ on the diagonal. Accept if $\Phi_k \ge$ a constant, reject if
    $|\Phi_k|$ is small.
  values:
    - {measure: Q, value: '\lceil k/2\rceil', refs: [AaronsonAmbainis18]}
    - {measure: R, value: '\widetilde\Theta\!\big(n^{1-1/k}\big)', refs: [BansalSinha21, SSW21], note: 'Lower bound proved independently by [BansalSinha21] and [SSW21]; matches the Aaronson-Ambainis upper bound $\mathrm{R}=O(n^{1-1/(2\mathrm{Q})})$.'}
    - {measure: Advpm, value: '\Theta(\lceil k/2\rceil)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \lceil k/2\rceil$ here.'}
    - {measure: MAdv, value: '\Theta(\lceil k/2\rceil)', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with $\mathrm{Adv}^{\pm}(f) = \Theta(\lceil k/2\rceil)$ and $\mathrm{Q}_{\varepsilon}(f) = \lceil k/2\rceil$ here.'}
    - {measure: Rbar, value: '\widetilde\Theta\!\big(n^{1-1/k}\big)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \widetilde\Theta(n^{1-1/k})$ here.'}
    - {measure: gamma2, value: '\Theta(\lceil k/2\rceil)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(\lceil k/2\rceil)$.'}
    - {measure: adeg, value: 'O(k)', note: '$\widetilde{\deg} \le 2\mathrm{Q} = 2\lceil k/2 \rceil$. Independent of $n$, against $\mathrm{R} = \widetilde\Theta(n^{1-1/k})$.'}
    - {measure: Dmu, value: '\widetilde\Theta\!\big(n^{1-1/k}\big)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R}$.'}
    - {measure: D, value: 'O(kn)', note: 'Reading all $kn$ bits determines $\Phi_k$; on the other side $\mathrm{D} \ge \mathrm{R} = \widetilde\Omega(n^{1-1/k})$, so for constant $k$ the deterministic complexity is pinned to within $n^{1/k}$. No exact value is recorded in the literature; for $k=2$ see [[Forrelation]].'}
    - {measure: Dna, value: 'O(kn)', note: 'The whole input, fixed in advance; and $\mathrm{D}^{\mathrm{na}} \ge \mathrm{D}$.'}
    - {measure: R0, value: '\widetilde\Omega\!\big(n^{1-1/k}\big)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon} \le \mathrm{R}_0 \le \mathrm{D}$, i.e. between $\widetilde\Omega(n^{1-1/k})$ and $O(kn)$.'}
    - {measure: Rna, value: '\widetilde\Theta\!\big(n^{1-1/k}\big)', putative: true, conf: medium, note: 'The randomized upper bound is an estimator built from coordinates sampled from the coins alone, so it is non-adaptive; and $\mathrm{R}^{\mathrm{na}} \ge \mathrm{R}$. Adaptivity buys nothing here, exactly as for [[Forrelation]].'}
    - {measure: Adv, value: 'O(k)', note: 'The positive adversary is a lower bound on $\mathrm{Q} = \lceil k/2\rceil$, so it is $O(k)$ -- independent of $n$, and useless against $\mathrm{R} = \widetilde\Theta(n^{1-1/k})$.'}
    - {measure: Np, value: '\widetilde\Omega\!\big(n^{1-1/k}\big)', note: 'Noise only makes the classical problem harder: $\mathrm{N}_p \ge \mathrm{R}$, and reading each sampled coordinate $O(1)$ times gives $\mathrm{N}_p = O(\mathrm{R})$ up to constants.'}
    - {measure: robustQ, value: 'O(k\log k)', note: 'The generic robustification bound $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log\mathrm{Q})$ applied to $\mathrm{Q} = \lceil k/2\rceil$; and $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q}$. Still independent of $n$.'}
    - {measure: prt, value: '\widetilde O\!\big(n^{1-1/k}\big)', note: 'From $\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon$.'}
    - {measure: rprt, value: '\widetilde O\!\big(n^{1-1/k}\big)', note: 'From $\overline{\mathrm{prt}}_\varepsilon \le \mathrm{prt}_\varepsilon$.'}
