    - {measure: PostQ, value: 'O(k)', note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = O(k)$: post-selection is worth no more than $O(k)$ queries here, while randomness is worth $\widetilde\Theta(n^{1-1/k})$.'}
    - {measure: cjdeg, value: '\widetilde O\!\big(n^{1-1/k}\big)', note: 'Sandwiched between $\widetilde{\deg} = O(k)$ and $\mathrm{R}_\varepsilon = \widetilde\Theta(n^{1-1/k})$.'}
    - {measure: R1, value: '\widetilde\Omega\!\big(n^{1-1/k}\big)', note: 'Sandwiched: $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0$, both $\widetilde\Omega(n^{1-1/k})$ here.'}
    - {measure: LR, value: '\widetilde\Omega\!\big(n^{1/2-1/(2k)}\big)', note: '$\mathrm{LR} = \Omega(\sqrt{\mathrm{R}})$ for every partial $f$; the upper end is $\mathrm{LR} \le \mathrm{R}$.'}
