- id: Simon
  name: Simon's problem
  symbol: '\mathrm{SIMON}_n'
  group: quantum
  order: 42
  kind: partial
  arity: '$n2^n$ bits (a function table $g:\{0,1\}^n\to\{0,1\}^n$)'
  short: 'The first exponential quantum speedup for a promise problem: $\mathrm{Q}=O(n)$ vs $\mathrm{R}=\Omega(2^{n/2})$.'
  definition: |
    Promise: $g$ is either injective, or two-to-one with $g(x)=g(x\oplus s)$ for
    a hidden $s\ne 0$. Decide which (or, in the search version, find $s$).
  formal: |
    Input: the table of $g:\{0,1\}^n\to\{0,1\}^n$. Promise: either $g$ is
    injective, or $\exists s \ne 0^n$ with $g(x)=g(y) \iff y \in \{x, x\oplus s\}$.
  values:
    - {measure: Q, value: '\Theta(n)', refs: [Simon97], conf: medium, note: 'Simon''s algorithm gives $O(n)$; the matching $\Omega(n)$ quantum lower bound is also known, so the exponential speedup is exactly quadratic-free: $\mathrm{R} = 2^{\Theta(\mathrm{Q})}$.'}
    - {measure: R, value: '\Theta(2^{n/2})', refs: [Simon97]}
    - {measure: Rbar, value: '\Theta(2^{n/2})', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(2^{n/2})$ here.'}
    - {measure: Adv, value: 'O(1)', refs: [HoyerSpalek05], note: 'Both certificate complexities are $O(1)$ under the promise -- exhibiting one colliding pair $x \ne y$ with $f(x)=f(y)$ settles the question -- so the positive adversary gives $O(1)$ against $\mathrm{Q} = \Theta(n)$. The largest known gap between $\mathrm{Adv}$ and $\mathrm{Q}$.'}
    - {measure: D, value: '\Theta(2^{n/2})', putative: true, note: 'Both directions are about *difference sets*. Upper: query $A\cup B$ where $A = \{(u,0^{n/2})\}$ and $B = \{(0^{n/2},v)\}$, which is $2^{n/2+1}-1$ points whose pairwise differences $(u,0)\oplus(0,v)=(u,v)$ exhaust $\mathbb{F}_2^n$; a two-to-one $g$ with shift $s$ must therefore repeat a value inside $A\cup B$, and an injective one never does. Lower: an adversary answering with fresh distinct values survives as long as some shift is unexcluded, and $q$ queries exclude only the $\binom q2$ shifts realised as differences, so $q = \Omega(2^{n/2})$. Note this matches $\mathrm{R}$: the birthday paradox buys randomness nothing here, because covering all $2^n$ differences deterministically is just as cheap.'}
    - {measure: Dna, value: '\Theta(2^{n/2})', putative: true, note: 'The $A\cup B$ query set above is fixed in advance, so the deterministic upper bound is already non-adaptive; and $\mathrm{D}^{\mathrm{na}} \ge \mathrm{D}$.'}
    - {measure: Rna, value: '\Theta(2^{n/2})', putative: true, note: 'Sampling $O(2^{n/2})$ uniformly random points is non-adaptive, and $\mathrm{R}^{\mathrm{na}} \ge \mathrm{R} = \Theta(2^{n/2})$.'}
    - {measure: R0, value: '\Theta(2^{n/2})', note: 'Sandwiched: $\mathrm{R}_{\varepsilon} \le \mathrm{R}_0 \le \mathrm{D}$, both ends $\Theta(2^{n/2})$.'}
    - {measure: C, value: '\Theta(2^{n/2})', putative: true, note: 'A certificate for an *injective* $g$ must exclude every shift $s\ne 0$, i.e. exhibit for each $s$ a queried pair $x, x\oplus s$ with different values; a set of $q$ positions realises at most $\binom q2$ differences, so $q \ge 2^{n/2}$, and the $A\cup B$ set above attains it. A two-to-one $g$ certifies in two queries, so $\mathrm{C}^0$ and $\mathrm{C}^1$ are wildly asymmetric here.'}
    - {measure: Cmin, value: '2', putative: true, note: 'On a two-to-one input, one colliding pair.'}
    - {measure: C0, value: '\Theta(2^{n/2})', putative: true, note: 'The injective side. See $\mathrm{C}$: a certificate must exhibit, for every shift $s \ne 0$, a queried pair $x, x\oplus s$ with $g(x) \ne g(x \oplus s)$, and $q$ queried points realise only $\binom q2$ differences.'}
    - {measure: C1, value: '2', putative: true, note: 'The two-to-one side: one colliding pair $g(x) = g(y)$, $x \ne y$, already rules out injectivity, and the promise then forces the answer.'}
    - {measure: s, value: '0', putative: true, note: 'Counting a query as one evaluation of $g$, as everywhere in this entry. Changing $g$ at a *single* point never stays inside the promise: from an injective $g$ it can create at most one collision, and a two-to-one function needs all $2^{n-1}$ pairs to collide; from a two-to-one $g$ it orphans exactly one pair, leaving a function that is neither injective nor two-to-one. So $\mathrm{s}^0 = \mathrm{s}^1 = 0$ against $\mathrm{D} = \Theta(2^{n/2})$.'}
    - {measure: s0, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: s1, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: bs, value: '2', putative: true, note: 'Every sensitive block has size $\ge 2^{n-1}$: crossing between the injective and the two-to-one side requires touching each of the $2^{n-1}$ pairs $\{x, x\oplus s\}$ at least once. Two disjoint blocks of exactly that size exist -- the two transversals of the pairing -- and three do not fit in $2^n$ points. So $\mathrm{bs}^0 = \mathrm{bs}^1 = 2$.'}
    - {measure: bs0, value: '2', putative: true, note: 'See $\mathrm{bs}$.'}
    - {measure: bs1, value: '2', putative: true, note: 'See $\mathrm{bs}$.'}
    - {measure: fbs, value: '2', putative: true, note: 'The fractional relaxation buys nothing: every sensitive block has $\ge 2^{n-1}$ of the $2^n$ coordinates, so $2^{n-1}\sum_B w_B \le \sum_i \mathrm{load}(i) \le 2^n$.'}
    - {measure: FC, value: '2', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: '\Theta(1)', putative: true, note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = \Theta(1)$: to reject one *fixed* input of the other kind it is enough to query a random point of a block on which the two differ, which succeeds with constant probability. Rejecting them one at a time is free; $\mathrm{R} = \Theta(2^{n/2})$ is the price of rejecting all of them at once.'}
    - {measure: UC, value: '\Theta(2^{n/2})', putative: true, note: 'Squeezed between $\mathrm{C}$ and $\mathrm{D}$, both $\Theta(2^{n/2})$.'}
    - {measure: SP, value: '\Theta(2^{n/2})', putative: true, note: 'Squeezed between $\mathrm{C}$ and $\mathrm{D}$, both $\Theta(2^{n/2})$.'}
    - {measure: UCmin, value: 'O(2^{n/2})', note: 'Squeezed between $\mathrm{C}_{\min} = 2$ and $\mathrm{UC} = \Theta(2^{n/2})$, and nothing sharper is available. $\mathrm{UC}_{\min} = \min\{\mathrm{UC}^0,\mathrm{UC}^1\}$ is worst-case *within the cheaper side*, not a minimum over inputs: the cheap two-query collision certificates on the "periodic" side are massively ambiguous, since a periodic $g$ contains $2^{n-1}$ of them, and disambiguating them by "first collision in lex order" costs the full $\Theta(2^{n/2})$ again.'}
    - {measure: Dmu, value: '\Theta(2^{n/2})', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \Theta(2^{n/2})$.'}
    - {measure: D_prod, value: '0', putative: true, note: 'The support of a product distribution is a rectangle $\prod_i S_i$ of oracle functions, and no rectangle inside the promise meets both sides. Suppose it held a $1$-$1$ function $g$ and a two-to-one function $h$, and let $h(i) = h(j) = v$ with $i \ne j$. The hybrid agreeing with $h$ at $i$ and with $g$ elsewhere lies in the rectangle, so it must be on the promise, which forces it to be $1$-$1$, i.e. $v \notin g(\mathrm{dom} \setminus \{i\})$. But then the hybrid agreeing with $h$ at both $i$ and $j$ and with $g$ elsewhere -- also in the rectangle -- takes the value $v$ exactly twice and every other value once, so it is neither $1$-$1$ nor two-to-one. Hence every product $\mu$ is one-sided and $\mathrm{D}^\mu = 0$, an exponential gap below $\mathrm{R} = \Theta(2^{n/2})$. See [[Forrelation]] for the general form of this collapse.'}
    - {measure: Advpm, value: '\Theta(n)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = \Theta(n)$. Against $\mathrm{Adv} = O(1)$ this is the largest known gap between the positive and the general adversary.'}
    - {measure: MAdv, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{Adv}^{\pm} \le \mathrm{MAdv} \le \mathrm{Q}$, both ends $\Theta(n)$.'}
    - {measure: gamma2, value: '\Theta(n)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(n)$.'}
    - {measure: QC, value: '\Theta(1)', note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{fbs}}) = \Theta(1)$, and independently $\mathrm{QC} \le \mathrm{Q}$. Against $\mathrm{C} = \Theta(2^{n/2})$ this is an exponential quantum-certificate advantage: a constant-size quantum certificate replaces a difference-covering set.'}
    - {measure: lambda, value: '0', putative: true, note: 'Spectral sensitivity is at most sensitivity for partial $f$, and $\mathrm{s} = 0$ here: the sensitivity graph on the promise has no edges. So $\lambda = 0$ while $\mathrm{Q} = \Theta(n)$.'}
    - {measure: ndeg, value: '\Theta(1)', note: 'At most $\mathrm{C}^1 = 2$, the colliding pair: put $p = \sum_{x<y} \mathbb{1}[g(x) = g(y)]$, a degree-$2$ polynomial in the indicator variables that is $0$ on injective inputs and positive on two-to-one ones.'}
    - {measure: NQ, value: '1', note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil = 1$: one nondeterministic quantum query guesses a colliding pair. Against $\mathrm{R} = \Theta(2^{n/2})$.'}
    - {measure: adeg, value: 'O(n)', note: '$\widetilde{\deg} \le 2\mathrm{Q} = O(n)$, in the indicator variables $\mathbb{1}[g(x) = v]$.'}
    - {measure: sdeg, value: 'O(n)', note: 'At most $\widetilde{\deg}_+ \le \widetilde{\deg} = O(n)$.'}
    - {measure: odeg, value: 'O(n)', note: 'At most $\widetilde{\deg} = O(n)$.'}
    - {measure: ardeg, value: 'O(n)', note: 'At most $\widetilde{\deg} = O(n)$, a rational function with denominator $1$.'}
    - {measure: PostQ, value: 'O(n)', note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = O(n)$.'}
    - {measure: R1, value: '\Theta(2^{n/2})', note: 'Sandwiched: $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0$, both $\Theta(2^{n/2})$.'}
    - {measure: EC, value: 'O(2^{n/2})', putative: true, note: 'Directly, not through $\mathrm{C}$: put $w^g_x = 2^{-(n-1)/2}$ at every one of the $2^n$ points. Two promise inputs of different value differ at $\ge 2^{n-1}$ points (turning a two-to-one $g$ into an injective one requires touching each of its $2^{n-1}$ colliding pairs), so $\sum_{x : g(x)\ne g''(x)} w^g_x w^{g''}_x \ge 1$, and each weight vector sums to $\sqrt 2\,2^{n/2}$. The textbook bound $\mathrm{EC} \le \mathrm{C}$ is a *total*-function statement and is not used.'}
    - {measure: CGpub, value: '\Theta(1)', putative: true, note: 'The shared-randomness strategy needs nothing but the code distance: both players output the *same* uniformly random point $x$ of the domain of $g$, and win iff $g(x) \ne g''(x)$. Two promise inputs of different value differ at $\ge 2^{n-1}$ of the $2^n$ points, so this wins with probability $\ge 1/2$ and $\mathrm{CG}^{\mathrm{pub}} \le 2$. In general $\mathrm{CG}^{\mathrm{pub}}(f) \le n/d$ where $d$ is the least Hamming distance between two domain points of different value.', refs: [CGLMSG23]}
    - {measure: CGstar, value: '\Theta(1)', note: 'Between $\mathrm{CG}^{\mathrm{ns}} \ge 1$ and $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$.'}
    - {measure: CGns, value: '\Theta(1)', note: 'Between $1$ and $\mathrm{CG}^{*} = \Theta(1)$.'}
    - {measure: CA, value: '\Theta(1)', conf: medium, refs: [CGLMSG23], note: 'From $\mathrm{CA} = \Theta(\mathrm{CG}^{\mathrm{pub}})$ [CGLMSG23] and $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$ above; and $\mathrm{CA} \ge 1$. So the classical adversary bound is *constant* while $\mathrm{R} = \Theta(2^{n/2})$ -- Simon''s problem is an extreme instance of the [CGLMSG23] observation that $\mathrm{R}$ can be exponentially larger than $\mathrm{CA}$ on partial functions. Every query resolves half of the surviving alternatives, so no adversary distribution can survive.'}
    - {measure: LR, value: '\Omega(2^{n/4})', note: '$\mathrm{LR} = \Omega(\sqrt{\mathrm{R}})$ for every partial $f$, and $\mathrm{LR} \le \mathrm{R} = \Theta(2^{n/2})$.'}
    - {measure: chibar, value: '\Omega(2^{n/4})', note: '$\bar\chi = \Omega(\sqrt{\mathrm{R}})$ even for partial $g$; and $\bar\chi = O(\mathrm{LR}) \le \mathrm{R}$.'}
    - {measure: chi, value: 'O(2^{n/2})', note: '$\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R}$.'}
    - {measure: RS, value: 'O(2^{n/2})', note: 'From $\mathrm{RS} = O(\bar\chi) = O(\mathrm{LR}) = O(\mathrm{R})$.'}
    - {measure: Rstar, value: 'O(2^{n/2})', note: '$\mathrm{R}^{*} \le \mathrm{R}$; from below $\mathrm{R}^{*} = \Omega(\mathrm{LR}) = \Omega(2^{n/4})$ and $\mathrm{R}^{*} = \Omega(\mathrm{Q}) = \Omega(n)$.'}
    - {measure: noisyR, value: 'O(2^{n/2})', note: 'At most $\mathrm{R}$.'}
    - {measure: Np, value: '\Theta(2^{n/2})', putative: true, note: 'At least $\mathrm{R}$; and reading each sampled point $O(1)$ times and majority-voting each of the $n$ output bits costs only $O(\log n)$ per read, absorbed into the $\Theta(2^{n/2})$.'}
    - {measure: robustQ, value: '\widetilde\Theta(n)', note: 'Between $\mathrm{Q} = \Theta(n)$ and $\mathrm{Q}\log\mathrm{Q} = O(n\log n)$. So the exponential separation survives a noisy oracle.'}
    - {measure: cjdeg, value: 'O(2^{n/2})', note: 'Sandwiched between $\widetilde{\deg} = O(n)$ and $\mathrm{R}_\varepsilon = \Theta(2^{n/2})$.'}
    - {measure: prt, value: 'O(2^{n/2})', note: 'From $\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon$.'}
    - {measure: rprt, value: 'O(2^{n/2})', note: 'From $\overline{\mathrm{prt}}_\varepsilon \le \mathrm{prt}_\varepsilon$.'}
    - {measure: psD, value: '\Theta(2^{n/2})', note: 'Degenerate on a partial Boolean function: $\mathrm{psD} = \Theta(\mathrm{R}) = \Theta(2^{n/2})$, since the decision version has a unique correct answer.'}
    - {measure: cbs, value: '2', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs} = 2$.'}
    - {measure: deg, value: 'O(n)', putative: true, note: 'Exponentially below $\mathrm{D}$. Let $z_{i,v}$ be the degree-$n$ conjunction of input bits asserting $g(i) = v$. Then $P = \sum_{i<j}\sum_v z_{i,v}z_{j,v}$ counts colliding pairs, so $P = 0$ on injective tables and $P = 2^{n-1}$ on two-to-one tables, and $2^{1-n}P$ represents $f$ exactly on the promise with degree $2n$ in the input bits. Beware: $P$ is wildly unbounded off the promise, so this does *not* bound $\widetilde{\deg}$, which is separately $O(n)$ from $2\mathrm{Q}$.'}
    - {measure: rdeg, value: 'O(2^{n/2})', note: 'At most $\mathrm{C} = \Theta(2^{n/2})$; from below $\mathrm{rdeg} \ge \mathrm{ndeg} = \Theta(1)$.'}
    - {measure: QE, value: 'O(2^{n/2})', note: 'At most $\mathrm{D} = \Theta(2^{n/2})$, at least $\mathrm{Q} = \Theta(n)$. Simon-style interference gives no exact algorithm: the hidden shift is only recovered with bounded error.'}
    - {measure: Q0, value: 'O(2^{n/2})', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Q}_0 \le \mathrm{Q}_E = O(2^{n/2})$.'}
    - {measure: CG, value: 'O(2^n)', putative: true, note: 'Private coins. An injective $g$ and a two-to-one $g^{\prime}$ must differ on at least $2^{n-1}$ of the $2^n$ table entries: for each of the $2^{n-1}$ pairs $\{x, x\oplus s\}$ we have $g^{\prime}(x)=g^{\prime}(x\oplus s)$ but $g(x)\ne g(x\oplus s)$, so at least one of the two entries moves. Both players output a uniformly random entry, winning with probability $\ge 2^{n-1}/(2^n)^2$. Contrast $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$: this is another unbounded private-versus-public certificate-game gap, as on [[DeutschJozsa]].'}
  witnesses:
    - {of: [R, Q], setting: partial, statement: 'Exponential: $\mathrm{R} = 2^{\Omega(\mathrm{Q})}$. The relational (find-$s$) version gives the same separation for relations.', refs: [Simon97]}
    - {of: [C, Cmin], setting: partial, statement: 'Unbounded: $\mathrm{C}_{\min}=2$ while $\mathrm{C}=\Theta(2^{n/2})$ -- the two-to-one side certifies in one pair, the injective side needs a difference-covering set.'}
  refs: [Simon97, BernsteinVazirani97]
  see_also: [DeutschJozsa, BV, YamakawaZhandry]

- id: DeutschJozsa
  name: Deutsch-Jozsa
  symbol: '\mathrm{DJ}_n'
  group: quantum
  order: 43
  kind: partial
  arity: '$N=2^n$ bits'
  short: 'Exact quantum: 1 query vs $N/2+1$ deterministic queries (but $\mathrm{R}=O(1)$).'
  definition: 'Promise: $x$ is constant or exactly balanced. Decide which.'
  formal: '$\mathrm{DJ}(x) = 0$ if $|x| = 0$ or $|x| = N$; $=1$ if $|x| = N/2$; undefined otherwise.'
  values:
    - {measure: QE, value: '1', refs: [DeutschJozsa92]}
    - {measure: D,  value: 'N/2+1'}
    - {measure: R,  value: 'O(1)', note: 'Two random samples suffice with bounded error -- so this is an *exact*-quantum-vs-deterministic separation only.'}
    - {measure: Q,  value: '1', note: '$\mathrm{Q} \le \mathrm{Q}_E = 1$, and one query is needed.'}
    - {measure: Q0, value: '1', note: 'Same: $\mathrm{Q} \le \mathrm{Q}_0 \le \mathrm{Q}_E = 1$.'}
    - {measure: s,  value: '0', putative: true, note: 'For $N \ge 4$ *no* single flip stays inside the promise: a constant input becomes weight $1$ or $N-1$, a balanced one weight $N/2 \pm 1$. So $\mathrm{s}^0 = \mathrm{s}^1 = 0$ while $\mathrm{D} = N/2+1$. The extreme illustration of why sensitivity says nothing about partial functions.'}
    - {measure: bs, value: '2', putative: true, note: 'At $0^N$ the sensitive blocks are exactly the $\binom{N}{N/2}$ half-sized sets, and two disjoint halves fit; at a balanced $x$ they are exactly $\mathrm{supp}(x)$ and its complement, again two disjoint blocks. Three disjoint blocks of size $N/2$ do not fit in $N$ coordinates, so $\mathrm{bs}^0=\mathrm{bs}^1=2$.'}
    - {measure: fbs, value: '2', putative: true, note: 'The fractional relaxation buys nothing: every sensitive block has size exactly $N/2$, so a feasible weighting has $\tfrac N2\sum_B w_B = \sum_i \mathrm{load}(i) \le N$.'}
    - {measure: C0, value: 'N/2+1', putative: true, note: 'Fixing $|S|$ coordinates to $0$ still admits a balanced input whenever $|S| \le N/2$, so a $0$-certificate needs $N/2+1$ zeros -- and that many suffice.'}
    - {measure: C1, value: '2', putative: true, note: 'Every other domain point consistent with "one $0$ here, one $1$ there" is balanced, hence also a $1$-input. Nothing needs to be pinned down beyond killing the two constants.'}
    - {measure: C, value: 'N/2+1', putative: true, note: 'From $\mathrm{C}^0$. With $\mathrm{fbs}=2$ this is a much cleaner unbounded $\mathrm{C}$-vs-$\mathrm{fbs}$ witness than any total function can give.'}
    - {measure: Cmin, value: '2', putative: true, note: 'Attained on the balanced inputs.'}
    - {measure: deg, value: '2', putative: true, note: 'On the promise $f$ is the symmetric function $t \mapsto [t = N/2]$ of $t=|x|$ restricted to $t \in \{0, N/2, N\}$, and $(1 - (1-2t/N)^2)$ interpolates it. Degree $1$ is impossible since $p(0)=p(N)=0$ forces $p \equiv 0$. So $\mathrm{deg} = 2 = 2\,\mathrm{Q}_E$: Deutsch-Jozsa makes $\mathrm{deg} \le 2\mathrm{Q}_E$ tight.'}
    - {measure: adeg, value: '2', putative: true, note: 'Symmetrise: a degree-$1$ univariate with $|q(0)|,|q(N)| \le 1/3$ has $q(N/2) = \tfrac12(q(0)+q(N))$, which cannot reach $2/3$. So approximation does not help either.'}
    - {measure: Dna, value: 'N/2+1', putative: true, note: 'Adaptivity is worthless here: any fixed $N/2+1$ positions contain a $0$ and a $1$ of every balanced input (which has exactly $N/2$ of each), so reading them decides. And $\mathrm{D}^{\mathrm{na}} \ge \mathrm{D}$.'}
    - {measure: R0, value: 'N/2+1', putative: true, note: 'Zero error means every run ends on a certificate, and on a constant input that is $N/2+1$ queries; $\mathrm{R}_0 \le \mathrm{D}$ gives the match. So the $\mathrm{R}=O(1)$ upper bound is *entirely* a bounded-error phenomenon -- a clean $\mathrm{R}_0$ vs $\mathrm{R}$ separation of unbounded ratio for a partial function.'}
    - {measure: Rna, value: '\Theta(1)', putative: true, note: 'Read $10$ fixed positions and answer "balanced" iff they are not all equal; a balanced input fools this with probability $2^{-9}$.'}
    - {measure: Rbar, value: '\Theta(1)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: Advpm, value: '1', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Adv}^{\pm} \le \mathrm{Q}_E$, with both ends $1$.'}
    - {measure: MAdv, value: '1', note: 'Sandwiched: $\mathrm{Adv}^{\pm} \le \mathrm{MAdv} \le \mathrm{Q}_E$, with both ends $1$.'}
    - {measure: Dmu, value: '\Theta(1)', note: 'Sandwiched between $\mathrm{Q}$ and $\mathrm{R} = O(1)$.'}
    - {measure: RC, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{RC} \le \mathrm{R} = O(1)$, and every measure here is at least $1$.'}
    - {measure: FC, value: '\Theta(1)', note: 'Equal to $\mathrm{fbs} = 2$ by LP duality; also $\le \mathrm{R} = O(1)$.'}
    - {measure: cjdeg, value: '\Theta(1)', note: 'Sandwiched between $\widetilde{\deg} = 2$ and $\mathrm{R} = O(1)$.'}
    - {measure: prt, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{prt}_\varepsilon \le \mathrm{R} = O(1)$, and at least $1$.'}
    - {measure: rprt, value: '\Theta(1)', note: 'Sandwiched: $\overline{\mathrm{prt}}_\varepsilon \le \mathrm{R} = O(1)$, and at least $1$.'}
    - {measure: s0, value: '0', putative: true, note: 'See $\mathrm{s}$: no single flip of a constant input stays in the promise.'}
    - {measure: s1, value: '0', putative: true, note: 'See $\mathrm{s}$: flipping one bit of a balanced input gives weight $N/2 \pm 1$, outside the promise.'}
    - {measure: bs0, value: '2', putative: true, note: 'At $0^N$ the sensitive blocks are exactly the $N/2$-sized sets, and two disjoint ones fit.'}
    - {measure: bs1, value: '2', putative: true, note: 'At a balanced $x$ the sensitive blocks are exactly $\mathrm{supp}(x)$ and its complement.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph of $\mathrm{DJ}$ on its promise has **no edges at all** (see $\mathrm{s}=0$), so its adjacency matrix is zero. Spectral sensitivity, which for total functions satisfies $\deg \le \lambda^2$ and lower-bounds $\mathrm{Q}$, degenerates completely: $\lambda = 0$ while $\deg = 2$ and $\mathrm{D} = N/2+1$.'}
    - {measure: rank, value: '2', putative: true, note: 'Query $x_1, x_2, \dots$ and stop as soon as two different values appear (answer "balanced") or $N/2+1$ equal values appear (answer "constant"). Each of the root''s two subtrees is a caterpillar, hence of rank $1$, so the tree has rank $2$; and $\mathrm{rank} \ge \mathrm{C}_{\min} = 2$. So rank sees none of the $\Theta(N)$ depth -- all of it is caterpillar.'}
    - {measure: D_size, value: '\Theta(N)', putative: true, note: 'The tree above has one leaf per stopping point on each of its two branches, so $O(N)$; and a tree of depth $d$ has more than $d$ leaves, so $\Omega(N)$ from $\mathrm{D} = N/2+1$.'}
    - {measure: UC, value: 'N/2+1', putative: true, note: 'Squeezed: $\mathrm{C} \le \mathrm{UC} \le \mathrm{D}$, with both ends $N/2+1$. (The leaves of the tree above are an unambiguous family of exactly this width.)'}
    - {measure: UCmin, value: 'O(N)', note: 'Squeezed between $\mathrm{C}_{\min} = 2$ and $\mathrm{UC} = N/2 + 1$. $\mathrm{UC}_{\min} = \min\{\mathrm{UC}^0,\mathrm{UC}^1\}$ is worst-case *within the cheaper side*, not a minimum over inputs, so the width-$2$ certificates on the balanced side do not give $O(1)$: a balanced input has $N^2/4$ disagreeing pairs, and an unambiguous family must still name one of them, which is the same obstruction that forces $\mathrm{UC} = \Omega(N)$.'}
    - {measure: SP, value: 'N/2+1', putative: true, note: 'Squeezed: $\mathrm{C} \le \mathrm{SP} \le \mathrm{D}$, with both ends $N/2+1$; the tree''s leaves are the subcube partition.'}
    - {measure: EC, value: '\Theta(\sqrt N)', putative: true, note: 'A genuinely intermediate value, strictly between $\mathrm{fbs} = 2$ and $\mathrm{C} = N/2+1$. *Upper:* put $w^x_i = 1/\sqrt N$ at the two constant inputs and $w^y_i = 2/\sqrt N$ everywhere at each balanced $y$; a constant $x$ and a balanced $y$ differ on $N/2$ coordinates, giving $\sum_{i : x_i \ne y_i} w^x_i w^y_i = (N/2)(2/N) = 1$, and every weight vector sums to at most $2\sqrt N$. *Lower:* at $x = 0^N$, for each balanced $y$ we need $1 \le \sum_{i \in \mathrm{supp}(y)} w^x_i w^y_i \le k \max_{i \in \mathrm{supp}(y)} w^x_i$, so fewer than $N/2$ coordinates can have $w^x_i < 1/k$; hence $k \ge \sum_i w^x_i \ge N/(2k)$.'}
    - {measure: Adv, value: '\Theta(1)', note: 'A lower bound on $\mathrm{Q} = 1$.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: QC, value: '\Theta(1)', note: 'An algorithm computing $f$ also verifies it, so $\mathrm{QC} \le \mathrm{Q} = 1$. Compare $\mathrm{C} = N/2+1$: this is the extreme case of quantum certificates beating classical ones.'}
    - {measure: CA, value: '\Theta(1)', note: 'A lower bound on $\mathrm{R} = O(1)$.'}
    - {measure: Np, value: '\Theta(1)', putative: true, note: 'Read $O(1)$ fixed positions $O(1)$ times each and majority-vote away the noise.'}
    - {measure: robustQ, value: '\Theta(1)', note: 'At most $\mathrm{N}_p = \Theta(1)$, at least $\mathrm{Q} = 1$.'}
    - {measure: sdeg, value: '2', putative: true, note: 'Symmetrising a sign-representing polynomial gives a univariate $q$ on $t \in \{0, N/2, N\}$ with $q(0), q(N) > 0 > q(N/2)$, impossible for degree $1$; and $1 - 2(1-2t/N)^2$ has the right signs. So $\mathrm{sdeg} = \widetilde{\deg} = \deg = 2$ -- no relaxation of degree helps at all.'}
    - {measure: CG, value: '\Theta(N)', putative: true, note: 'The private-coin certificate game is *linear* here, and the argument is short. **Upper:** both players output a uniformly random index of $[N]$; when Alice holds a constant $x$ and Bob a balanced $y$ they differ on exactly $N/2$ indices, so they win with probability $(N/2)/N^2 = 1/(2N)$. **Lower:** fix Alice at $x = 0^N$, where she has a single output distribution $p$. Against a balanced $y$ her success is $\sum_{i \in \mathrm{supp}(y)} p(i)\,q_y(i) \le \max_{i \in \mathrm{supp}(y)} p(i)$. Let $y$ be the indicator of the $N/2$ indices with the *smallest* $p(i)$: the $(N/2)$-th largest value of $p$ is at most $2/N$, so the value is at most $2/N$ and $\mathrm{CG} \ge N/2$. Note the total-function sandwich $\mathrm{R}_0 \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ is *not* available on a promise problem and is not used.', refs: [CGLMSG23]}
    - {measure: CGpub, value: '\Theta(1)', note: 'One shared random index $i$, output by both players, already wins with probability $1/2$. So $\mathrm{CG}^{\mathrm{pub}} \le 2$, matching $\mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{CA}) = \Theta(1)$. Against $\mathrm{CG} = \Theta(N)$ this is an *unbounded* private-versus-public certificate game gap on a partial function: shared randomness is what lets the two players agree on where to look.', refs: [CGLMSG23]}
    - {measure: CGstar, value: '\Theta(1)', note: 'Between $\mathrm{CG}^{\mathrm{ns}}$ and $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$.', refs: [CGLMSG23]}
    - {measure: CGns, value: '\Theta(1)', note: 'Between $1$ and $\mathrm{CG}^{*} = \Theta(1)$.', refs: [CGLMSG23]}
    - {measure: R1, value: 'N/2+1', putative: true, note: 'One-sided error does not help, even though the cheap side is only two queries. Fix coins $r$ for which the run on $0^N$ outputs $0$ -- at least $2/3$ of them do -- and let $L \le q$ be the positions it reads. If $L \le N/2$ some balanced $y$ agrees with all of them, so the same run outputs $0$ on a $1$-input, which zero error on the $1$-side forbids. Hence $q \ge N/2+1$, and $\mathrm{R}^1 \le \mathrm{R}_0 = N/2+1$. Compare $\mathrm{R} = O(1)$.'}
    - {measure: LR, value: '\Theta(1)', note: 'Sandwiched: $\Omega(\sqrt{\mathrm{R}}) \le \mathrm{LR} \le \mathrm{R} = O(1)$.'}
    - {measure: chibar, value: '\Theta(1)', note: 'Sandwiched: $\Omega(\sqrt{\mathrm{R}}) \le \bar\chi = O(\mathrm{LR}) = O(1)$.'}
    - {measure: chi, value: '\Theta(1)', note: 'At most $\bar\chi = \Theta(1)$, and at least $1$.'}
    - {measure: RS, value: '\Theta(1)', note: 'At most $\bar\chi = \Theta(1)$; finding a $\ast$ in a sabotaged input is as easy as the problem itself here.'}
    - {measure: Rstar, value: '\Theta(1)', note: 'Sandwiched: $\Omega(\mathrm{Q}) \le \mathrm{R}^{*} \le \mathrm{R} = O(1)$.'}
    - {measure: noisyR, value: '\Theta(1)', note: 'At most $\mathrm{R} = O(1)$, and at least $1$.'}
    - {measure: noisyRna, value: '\Theta(1)', refs: [BenDavidBlais20composition], note: 'Squeezed: $\mathrm{noisyR} = \Theta(1) \le \mathrm{noisyR}^{\mathrm{na}} \le \mathrm{R}^{\mathrm{na}} = \Theta(1)$. Also what Theorem 8 of [BenDavidBlais20composition] predicts -- $\mathrm{noisyR}^{\mathrm{na}} = \Theta(\mathrm{R}^{\mathrm{na}})$ holds for partial functions.'}
    - {measure: D_prod, value: '\Theta(1)', note: 'At most $\mathrm{D}^\mu = \Theta(1)$ for every $\mu$, and at least one query.'}
    - {measure: rdeg, value: '1', putative: true, note: 'Rational degree collapses below exact degree. By the characterisation $\mathrm{rdeg} = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\}$: $\mathrm{ndeg}(f) = 1$ (see below), and $\mathrm{ndeg}(\bar f) = 1$ too, since $p(x) = |x| - N/2$ vanishes on exactly the balanced inputs. So $\mathrm{rdeg} = 1 < \deg = \widetilde{\deg} = \mathrm{sdeg} = 2$.'}
    - {measure: ardeg, value: '1', note: 'At most $\mathrm{rdeg} = 1$, and at least $1$.'}
    - {measure: PostQ, value: '\Theta(1)', note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = \Theta(1)$.'}
    - {measure: odeg, value: '2', note: 'Squeezed between $\mathrm{sdeg} = 2$ and $\widetilde{\deg} = 2$.'}
    - {measure: NQ, value: '1', note: '$\mathrm{NQ} = \lceil\mathrm{ndeg}/2\rceil = 1$, from $\mathrm{ndeg} = 1$ below.'}
    - {measure: ndeg, value: '1', putative: true, note: 'Nondeterministic degree collapses where ordinary degree does not. Take $p = \sum_i c_i x_i$ with $\sum_i c_i = 0$ and the $c_i$ otherwise generic: then $p$ vanishes at $0^N$ and at $1^N$, while $\sum_{i \in \mathrm{supp}(y)} c_i \ne 0$ for every balanced $y$ because generic points of the hyperplane $\sum c_i = 0$ avoid the finitely many further hyperplanes. So $\mathrm{ndeg} = 1 < \deg = 2$.'}
    - {measure: psD, value: '\Theta(1)', note: 'Degenerate on a partial Boolean function: $\mathrm{psD} = \Theta(\mathrm{R}) = \Theta(1)$.'}
    - {measure: cbs, value: '2', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs} = 2$. In particular the measure that governs $\mathrm{Search}(\varphi)$ says nothing here.'}
  witnesses:
    - {of: [D, QE], setting: partial, statement: 'Unbounded: $\mathrm{D}=N/2+1$ vs $\mathrm{Q}_E=1$.', refs: [DeutschJozsa92]}
    - {of: [D, s], setting: partial, statement: 'Unbounded: $\mathrm{s}=0$ (no promise-preserving flip exists) with $\mathrm{D}=N/2+1$.'}
    - {of: [C, fbs], setting: partial, statement: 'Unbounded: $\mathrm{fbs}=2$ against $\mathrm{C}=N/2+1$. The total-function bound $\mathrm{C} = O(\mathrm{fbs}^2)$ fails as badly as possible off the promise.'}
    - {of: [R0, R], setting: partial, statement: 'Unbounded: $\mathrm{R}=O(1)$ but $\mathrm{R}_0 = N/2+1$, since zero error forces a full $0$-certificate on the constant inputs.'}
    - {of: [CG, CGpub], setting: partial, statement: 'Unbounded: $\mathrm{CG} = \Theta(N)$ against $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$. With shared randomness the two players just name a common random index and win with probability $1/2$; with private randomness Alice, who holds a constant input, has one fixed output distribution and the adversary balances $y$ onto her $N/2$ lightest indices.', refs: [CGLMSG23]}
  refs: [DeutschJozsa92]
  see_also: [BV, EH, Simon]

- id: BV
  name: Bernstein-Vazirani
  symbol: '\mathrm{BV}_n'
  group: quantum
  order: 44
  kind: partial
  arity: '$2^n$ bits (or $n$ bits with an inner-product oracle)'
  short: 'One exact quantum query recovers an $n$-bit secret that costs $n$ classical queries.'
  definition: 'Promise: $x_i = \langle s, i\rangle \bmod 2$ for a hidden $s \in \{0,1\}^n$. Output $s$ (or one bit of it).'
  values:
    - {measure: QE, value: '1', refs: [BernsteinVazirani97]}
    - {measure: D,  value: 'n'}
    - {measure: R,  value: '\Theta(n)', note: 'Recovering $s$ needs $n$ bits of information from one-bit answers, so $\mathrm{R} = \Omega(n)$ even with bounded error; and $\mathrm{R} \le \mathrm{D} = n$.'}
    - {measure: Q,  value: '1', note: '$\mathrm{Q} \le \mathrm{Q}_E = 1$.'}
    - {measure: Q0, value: '1', note: '$\mathrm{Q} \le \mathrm{Q}_0 \le \mathrm{Q}_E = 1$.'}
    - {measure: D_prod, value: '0', putative: true, note: 'The support of a product distribution is a rectangle $\prod_i S_i$ of truth tables. If two truth tables in it differ at position $i$, then copying that one bit from the second into the first gives another point of the rectangle, and a string that differs from a linear function in exactly one place is not linear -- so it is off the promise. Hence any rectangle inside the promise is a single point and $\mathrm{D}^\mu = 0$ for every product $\mu$, against $\mathrm{R} = \Theta(n)$. See the [[Forrelation]] entry for the general phenomenon.'}
    - {measure: C,  value: 'n', putative: true, note: 'A set of queried positions $i_1,\dots,i_k$ reveals $\langle s, i_j\rangle$, and pins $s$ down exactly when the $i_j$ span $\mathbb{F}_2^n$ -- so every certificate has $\ge n$ queries, and $e_1,\dots,e_n$ is one. Since this holds at *every* input, $\mathrm{C}_{\min} = \mathrm{C} = n$: BV is certificate-uniform.'}
    - {measure: Cmin, value: 'n', putative: true, note: 'See $\mathrm{C}$: the spanning requirement is input-independent.'}
    - {measure: R0, value: 'n', putative: true, note: 'Zero error forces a spanning query set on every run, and $\mathrm{R}_0 \le \mathrm{D} = n$.'}
    - {measure: Rbar, value: '\Theta(n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: Dna, value: 'n', putative: true, note: 'The spanning set $e_1,\dots,e_n$ is fixed in advance, and $\mathrm{D}^{\mathrm{na}} \ge \mathrm{D}$.'}
    - {measure: Rna, value: '\Theta(n)', putative: true, note: 'Same non-adaptive algorithm; and $\mathrm{R}^{\mathrm{na}} \ge \mathrm{R}$.'}
    - {measure: Advpm, value: '1', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Adv}^{\pm} \le \mathrm{Q}_E$, with both ends $1$.'}
    - {measure: MAdv, value: '1', note: 'Sandwiched: $\mathrm{Adv}^{\pm} \le \mathrm{MAdv} \le \mathrm{Q}_E$, with both ends $1$.'}
    - {measure: s, value: '0', putative: true, note: 'The promise inputs are exactly the $2^n$ codewords of the Hadamard code, and two distinct codewords differ in $2^{n-1} \ge 2$ positions. So no single flip stays inside the promise and $\mathrm{s} = 0$, against $\mathrm{D} = n$.'}
    - {measure: bs, value: '1', putative: true, note: 'The sensitive blocks at the input $x$ indexed by $s$ are exactly the sets $B_d = \{i : \langle d, i\rangle = 1\}$ for $d = s \oplus s'' \ne 0$. Any two of them meet -- $|B_{d} \cap B_{d''}| = 2^{n-2} > 0$ for distinct nonzero $d, d''$ -- so no two disjoint sensitive blocks exist. Hence $\mathrm{s} = 0 < \mathrm{bs} = 1$, itself a small curiosity that no total function allows.'}
    - {measure: fbs, value: '\Theta(1)', putative: true, note: 'Exactly $(2^n-1)/2^{n-1} = 2 - 2^{1-n}$. Each block $B_d$ has $2^{n-1}$ elements and each nonzero coordinate $i$ lies in exactly $2^{n-1}$ of the $2^n-1$ blocks, so by symmetry the LP optimum puts weight $2^{1-n}$ on every block. Against $\mathrm{C} = n$ this is an unbounded $\mathrm{C}$-vs-$\mathrm{fbs}$ gap.'}
    - {measure: FC, value: '\Theta(1)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph is empty (see $\mathrm{s} = 0$), so $\lambda = 0$ while $\mathrm{Q}_E = 1$ and $\mathrm{D} = n$.'}
    - {measure: UC, value: 'n', putative: true, note: 'Squeezed between $\mathrm{C} = n$ and $\mathrm{D} = n$.'}
    - {measure: UCmin, value: 'n', putative: true, note: 'Squeezed between $\mathrm{C}_{\min} = n$ and $\mathrm{UC} = n$.'}
    - {measure: SP, value: 'n', putative: true, note: 'Squeezed between $\mathrm{C} = n$ and $\mathrm{D} = n$; the $2^n$ subcubes "$x_{e_1} = b_1, \dots, x_{e_n} = b_n$" partition the promise.'}
    - {measure: rank, value: 'n', putative: true, note: 'Squeezed between $\mathrm{C}_{\min} = n$ and $\mathrm{D} = n$. Unlike [[DeutschJozsa]], where the depth is all caterpillar and $\mathrm{rank} = 2$, here every query genuinely branches.'}
    - {measure: D_size, value: '2^n', putative: true, note: 'Every leaf subcube has codimension $\ge \mathrm{C}_{\min} = n$, so there are at least $2^n$ leaves; and querying $e_1, \dots, e_n$ gives exactly $2^n$.'}
    - {measure: RC, value: '\Theta(1)', putative: true, note: 'One uniformly random query already distinguishes the codeword $x$ from any *fixed* other codeword with probability $1/2$, which is all $\mathrm{RC}$ asks; and $\mathrm{RC} = \Theta(\mathrm{fbs}) = \Theta(1)$. The contrast with $\mathrm{R} = \Theta(n)$ is the point: rejecting one alternative at a time is easy, rejecting all $2^n-1$ of them at once is not.'}
    - {measure: Dmu, value: '\Theta(n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \Theta(n)$.'}
    - {measure: PDT, value: 'n', putative: true, note: 'Parity queries buy nothing. A query on a set $S$ of positions returns $\bigoplus_{i \in S}\langle s, i\rangle = \langle s, \sum_{i \in S} i\rangle$ -- again a single linear functional of $s$ -- so $q$ queries reveal at most $q$ bits about the $n$-bit secret and $\mathrm{D}^{\oplus} \ge n$; and $\mathrm{D}^{\oplus} \le \mathrm{D} = n$. The Hadamard promise is precisely the fixed point of the parity model.'}
    - {measure: s0, value: '0', note: 'Both halves inherit $\mathrm{s} = \max\{\mathrm{s}^0,\mathrm{s}^1\} = 0$: no single flip of a Hadamard codeword lands back in the promise.'}
    - {measure: s1, value: '0', note: 'As for $\mathrm{s}^0$.'}
    - {measure: QC, value: '\Theta(1)', note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{fbs}}) = \Theta(1)$, and independently $\mathrm{QC} \le \mathrm{Q} = 1$. Against $\mathrm{C} = \mathrm{C}_{\min} = n$: a constant-size quantum certificate replaces a whole basis of $\mathbb{F}_2^n$.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: Adv, value: '1', note: 'Sandwiched: $1 \le \mathrm{Adv} \le \mathrm{Adv}^{\pm} = 1$.'}
    - {measure: EC, value: 'O(n)', putative: true, note: 'Weight $1$ on each of the $n$ positions $e_1,\dots,e_n$ and $0$ elsewhere, at every input. Two promise inputs with secrets $s \ne s''$ disagree at some $e_j$, since $s$ and $s''$ differ in some coordinate $j$, so the required product $\sum_{i : x_i \ne y_i} w^x_i w^y_i \ge 1$ holds and the scheme costs $n$. From below only $\mathrm{EC} \ge \mathrm{fbs} = \Theta(1)$; note $\mathrm{EC} \le \mathrm{C}$ is a total-function statement and is not what is used here.'}
    - {measure: CGpub, value: '\Theta(1)', putative: true, refs: [CGLMSG23], note: 'Both players output the *same* uniformly random position $i \in [2^n]$; they win iff $x_i \ne y_i$, which for two distinct Hadamard codewords happens with probability exactly $1/2$. So $\mathrm{CG}^{\mathrm{pub}} \le 2$, and $\ge 1$ trivially. (In general $\mathrm{CG}^{\mathrm{pub}}(f) \le N/d$ for $d$ the minimum Hamming distance between differently-valued inputs.)'}
    - {measure: CGstar, value: '\Theta(1)', note: 'Between $\mathrm{CG}^{\mathrm{ns}} \ge 1$ and $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$.'}
    - {measure: CGns, value: '\Theta(1)', note: 'Between $1$ and $\mathrm{CG}^{*} = \Theta(1)$.'}
    - {measure: CA, value: '\Theta(1)', conf: medium, refs: [CGLMSG23], note: 'From $\mathrm{CA} = \Theta(\mathrm{CG}^{\mathrm{pub}})$ [CGLMSG23] with $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$. Directly: any two codewords disagree on half of the positions, so a uniformly random query kills half of the surviving adversary mass and no weighting scheme can survive $\omega(1)$ queries. The classical adversary bound therefore certifies *nothing* about $\mathrm{R} = \Theta(n)$.'}
    - {measure: LR, value: '\Omega(\sqrt n)', note: '$\mathrm{LR} = \Omega(\sqrt{\mathrm{R}})$ and $\mathrm{LR} \le \mathrm{R} = \Theta(n)$; the true value is not pinned down here.'}
    - {measure: chibar, value: '\Omega(\sqrt n)', note: '$\bar\chi = \Omega(\sqrt{\mathrm{R}})$, and $\bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(n)$.'}
    - {measure: chi, value: 'O(n)', note: '$\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(n)$. The total-function lower bound $\chi = \Omega(\mathrm{bs})$ [Li18] would only give $\Omega(1)$ anyway.'}
    - {measure: RS, value: 'O(n)', note: '$\mathrm{RS} = O(\bar\chi) = O(\mathrm{R}) = O(n)$.'}
    - {measure: Rstar, value: 'O(n)', note: '$\mathrm{R}^{*} \le \mathrm{R} = O(n)$; from below only $\mathrm{R}^{*} = \Omega(\mathrm{Q}) = \Omega(1)$, since quantum query complexity composes perfectly. ($\mathrm{LR} = O(\mathrm{R}^{*})$ is recorded only for total $f$.)'}
    - {measure: noisyR, value: 'O(n)', note: '$\mathrm{noisyR} \le \mathrm{R} = O(n)$. The strengthening "$\mathrm{R} = \Theta(\text{arity}) \Rightarrow \mathrm{noisyR} = \Theta(\mathrm{R})$" does not apply: the arity is $2^n$, not $n$.'}
    - {measure: cjdeg, value: 'O(n)', note: '$\mathrm{cjdeg}_\varepsilon \le \mathrm{R}_\varepsilon = O(n)$.'}
    - {measure: prt, value: 'O(n)', note: '$\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon = O(n)$; from below $(1-4\varepsilon)\mathrm{CA} \le \mathrm{prt}_\varepsilon + \log(1/\varepsilon)$ gives only $\Omega(1)$.'}
    - {measure: rprt, value: 'O(n)', note: '$\mathrm{rprt} \le \mathrm{prt} = O(n)$.'}
    - {measure: Np, value: '\widetilde\Theta(n)', note: 'Faulty-oracle noise costs at most a log: $\mathrm{R} \le \mathrm{N}_p = O(\mathrm{R}\log \mathrm{R})$ with $\mathrm{R} = \Theta(n)$.'}
    - {measure: robustQ, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ with $\mathrm{Q} = 1$, so a robust oracle costs only a constant here.'}
    - {measure: psD, value: '\Theta(n)', note: 'Degenerate: the secret $s$ is unique, so there is only one valid output and a pseudo-deterministic algorithm is just a randomized one. Hence $\mathrm{psD} = \Theta(\mathrm{R}) = \Theta(n)$.'}
    - {measure: cbs, value: '1', refs: [GoosPitassi14], note: 'Degenerate: every input is critical (one valid output), so the solution function is forced and $\mathrm{cbs} = \mathrm{bs} = 1$.'}
    - {measure: bs0, value: '1', note: 'At most $\mathrm{bs} = 1$, and at least $1$ at every input, since replacing the table by the codeword of any other secret is a sensitive block. So both one-sided values equal $1$ however the outputs are split into two classes.'}
    - {measure: bs1, value: '1', note: 'See $\mathrm{bs}^0$.'}
    - {measure: R1, value: '\Theta(n)', note: 'Squeezed: $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0$, and both ends are $\Theta(n)$ here.'}
    - {measure: CG, value: '\Omega(n),\ O(n^2)', putative: true, note: 'Two players hold the Hadamard codewords of distinct secrets $s \ne s^{\prime}$ and must agree on a position where the tables differ, with private coins only. Upper: both output a uniformly random one of the $n$ positions $e_1,\dots,e_n$; the tables differ at $e_j$ exactly when $s_j \ne s^{\prime}_j$, which happens for some $j$, so they win with probability $\ge 1/n^2$. Lower: fix the first player at $s$ with output distribution $p$ on $\{0,1\}^n$. The $n-1$ heaviest positions span a subspace of dimension $\le n-1$, so some $d \ne 0$ is orthogonal to all of them; against $s^{\prime} = s \oplus d$ the difference set is $\{i : \langle d,i\rangle = 1\}$, which misses all of them, and the win probability is at most the $n$-th largest value of $p$, hence $\le 1/n$. Against $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$ this is another unbounded private-versus-public gap, as on [[DeutschJozsa]].'}
  witnesses:
    - {of: [fbs, C], setting: partial, statement: 'Unbounded: $\mathrm{fbs} = 2 - 2^{1-n}$ but $\mathrm{C} = \mathrm{C}_{\min} = n$. Total functions satisfy $\mathrm{C} = O(\mathrm{fbs}^2)$.'}
    - {of: [CA, R], setting: partial, statement: 'Unbounded: $\mathrm{CA} = \Theta(1)$ against $\mathrm{R} = \Theta(n)$ -- the classical adversary method is useless on the Hadamard promise. Compare [[Simon]], where the same argument gives an exponential gap.', refs: [CGLMSG23]}
    - {of: [R, QE], setting: relation, statement: 'The "find $s$" version is a relation: $\mathrm{Q}_E=1$ vs $\mathrm{R}=\Omega(n)$.', refs: [BernsteinVazirani97]}
    - {of: [C, QE], setting: partial, statement: 'Unbounded: $\mathrm{C} = \mathrm{C}_{\min} = n$ against $\mathrm{Q}_E = 1$ -- one exact quantum query beats every certificate at every input.'}
  refs: [BernsteinVazirani97]
  see_also: [DeutschJozsa, Simon, PARITY]

- id: UniqueSearch
  name: Unique search
  symbol: '\mathrm{SEARCH}^{\le 1}_n'
  group: quantum
  order: 44.5
  kind: partial
  arity: $n$ bits
  definition: 'Promise: $|x| \le 1$. Decide whether $|x| = 1$.'
  formal: '$\mathrm{Dom}(f) = \{0^n\} \cup \{e_1,\dots,e_n\}$, with $f(0^n) = 0$ and $f(e_i) = 1$.'
  short: 'Grover search as a *partial function*. The reason it is in the zoo: $\deg = 1$ while $\widetilde{\deg} = \Theta(\sqrt n)$, so $\widetilde{\deg} \le \deg$ -- a triviality for total functions -- fails outright on a promise.'
  refs: [Grover96, BBBV97]
  see_also: [OR, GroverSearch, promiseFind1, DeutschJozsa]
  values:
    - {measure: D, value: 'n', note: 'Adversary: answer $0$ to the first $n-1$ queries; the input can still be $0^n$ or $e_i$ at the one unqueried coordinate $i$. Reading all $n$ bits obviously suffices.'}
    - {measure: R, value: '\Theta(n)', note: 'Against $0^n$ versus a uniformly random $e_i$, $q$ queries see all-zero answers with probability $1 - q/n$, so $q = \Omega(n)$. The canonical quadratic quantum speed-up sits on top of this.'}
    - {measure: R0, value: '\Theta(n)', note: 'Squeezed: $\mathrm{R} \le \mathrm{R}_0 \le \mathrm{D}$, and both ends are $\Theta(n)$.'}
    - {measure: Q, value: '\Theta(\sqrt n)', refs: [Grover96, BBBV97], note: 'Grover, and the $\Omega(\sqrt n)$ hybrid-argument lower bound already applies under the unique-marked promise.'}
    - {measure: deg, value: '1', putative: true, note: '$p(x) = \sum_i x_i$ agrees with $f$ at every point of the domain: it is $0$ at $0^n$ and $1$ at each $e_i$. Off the promise it grows to $n$, which the partial-function definition of $\deg$ (agree on $\mathrm{Dom}(f)$, unbounded elsewhere) permits. $f$ is not constant, so $\deg = 1$ exactly.'}
    - {measure: adeg, value: '\Theta(\sqrt n)', putative: true, refs: [NS94, BBCMdW01, Paturi92], note: 'Upper: $\widetilde{\deg} \le 2\mathrm{Q}$. Lower: symmetrise an approximating $p$ to a univariate $q$ of the same degree with $q(0) \le 1/3$, $q(1) \ge 2/3$ and $|q(k)| \le 4/3$ at every integer $k \in [0,n]$ -- and this last is exactly where the off-promise boundedness demanded of $\widetilde{\deg}$ is used. Boundedness at the integer points upgrades to boundedness on $[0,n]$ up to a constant factor while $\deg q = O(\sqrt n)$ (Ehlich--Zeller / Coppersmith--Rivlin), and then Markov''s inequality $\max|q^{\prime}| \le 2 d^2 \max|q| / n$ against $q(1) - q(0) \ge 1/3$ forces $d = \Omega(\sqrt n)$.'}
    - {measure: sdeg, value: '1', putative: true, note: '$\tfrac12 - \sum_i x_i$ is positive at $0^n$ and negative at every $e_i$.'}
    - {measure: ndeg, value: '1', note: '$\sum_i x_i$ is nonzero exactly on the $1$-inputs of the domain.'}
    - {measure: rdeg, value: '1', note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}$, and $1 - \sum_i x_i$ vanishes exactly on the $1$-inputs, so both halves are $1$.'}
    - {measure: ardeg, value: '1', refs: [IJKKKSWW23], note: '$\mathrm{rdeg}_{1/3} \le \mathrm{rdeg} = 1$. Against $\widetilde{\deg} = \Theta(\sqrt n)$ this is an unbounded partial-function separation of approximate rational degree from approximate degree -- rational approximation is not required to stay bounded off the promise, and here that is worth a quadratic factor.'}
    - {measure: NQ, value: '1', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2 \rceil$.'}
    - {measure: s0, value: 'n', note: 'All $n$ neighbours of $0^n$ lie in the domain and are $1$-inputs.'}
    - {measure: s1, value: '1', note: 'The only domain neighbour of $e_i$ is $0^n$; flipping any other coordinate leaves the promise.'}
    - {measure: s, value: 'n'}
    - {measure: bs0, value: 'n', note: 'Only singleton blocks keep $0^n$ inside the promise, and all $n$ of them are sensitive.'}
    - {measure: bs1, value: '1', note: 'From $e_i$ the only block whose flip stays in the domain and changes the value is $\{i\}$; flipping $\{i,j\}$ gives $e_j$, another $1$-input.'}
    - {measure: bs, value: 'n'}
    - {measure: fbs, value: 'n', note: 'Squeezed between $\mathrm{bs} = n$ and $\mathrm{C} = n$.'}
    - {measure: C0, value: 'n', note: 'Fixing only $n-1$ coordinates of $0^n$ to $0$ leaves the domain point $e_j$ at the free coordinate $j$, and that is a $1$-input.'}
    - {measure: C1, value: '1', note: 'The single literal $x_i = 1$ is satisfied by no other domain point.'}
    - {measure: C, value: 'n'}
    - {measure: Cmin, value: '1', note: 'Attained at the $1$-inputs.'}
    - {measure: SP, value: 'n', putative: true, note: 'The $n$ subcubes $\{x_i = 1\}$ together with the single point $\{0^n\}$ partition the domain, so a partition of width $n$ exists; and no partition can do better, since the part containing $0^n$ must exclude all $n$ points $e_i$ and therefore fixes every coordinate.'}
    - {measure: UC, value: 'n', putative: true, note: '$\mathrm{UC} = \mathrm{SP}$, and the partition above is exactly an unambiguous certificate cover.'}
    - {measure: UCmin, value: '1', putative: true, note: 'The $1$-certificates of that cover have width $1$, so $\mathrm{UC}^1 = 1$. With $\mathrm{D} = n$ this shows the total-function bound $\mathrm{D} \le \mathrm{UC}_{\min}^2$ [BHT17] is total-only.'}
    - {measure: RC, value: '\Theta(n)', putative: true, note: 'At $0^n$ a certificate scheme must find the planted $1$ with constant probability against an adversary free to plant it anywhere, which costs $\Omega(n)$ weight; and $\mathrm{RC} \le \mathrm{C} = n$.'}
    - {measure: lambda, value: '\sqrt n', putative: true, note: 'The sensitivity graph is the star $K_{1,n}$ centred at $0^n$, whose adjacency matrix has spectral norm exactly $\sqrt n$. Both $\lambda \ge \sqrt{\mathrm{s}}$ and $\lambda = O(\mathrm{Q})$ are tight here.'}
    - {measure: rank, value: '1', putative: true, note: '"Query $x_1$; if $1$ output $1$, else query $x_2$; ..." is a caterpillar -- every internal node has a leaf child -- so its rank is $1$, against $\mathrm{D} = n$.'}
  witnesses:
    - {of: [adeg, deg], setting: partial, statement: 'Unbounded: $\deg = 1$ while $\widetilde{\deg} = \Theta(\sqrt n)$. For total $f$ the exact multilinear representation is automatically $\{0,1\}$-valued on the cube, hence bounded, so $\widetilde{\deg} \le \deg$ is a triviality; on a promise the representing polynomial may be unbounded off the domain and the inequality fails outright.'}
    - {of: [adeg, rdeg], setting: partial, statement: 'Unbounded: $\mathrm{rdeg} = \mathrm{rdeg}_{1/3} = 1$ against $\widetilde{\deg} = \Theta(\sqrt n)$.', refs: [IJKKKSWW23]}
    - {of: [D, UCmin], setting: partial, statement: 'Unbounded: $\mathrm{UC}_{\min} = \mathrm{C}_{\min} = 1$ against $\mathrm{D} = n$, so the total-function bound $\mathrm{D} \le \mathrm{UC}_{\min}^2$ [BHT17] does not survive a promise.'}

# The same search problem with the promise thickened by one, which costs nothing
# quantumly but empties the sensitivity graph. It is the witness that separates the
# positive adversary from lambda and from s on promise problems: every other lambda = 0
# function in the zoo happens to be quantumly easy, so Adv stays O(1) on it.
- id: Search02
  name: Two-or-none search
  symbol: '\mathrm{SEARCH}^{0/2}_n'
  group: quantum
  order: 44.6
  kind: partial
  arity: $n$ bits
  definition: 'Promise: $|x| \in \{0, 2\}$. Decide whether $|x| = 2$.'
  formal: '$\mathrm{Dom}(f) = \{0^n\} \cup \{e_i + e_j : i < j\}$, with $f(0^n) = 0$ and $f(e_i+e_j) = 1$.'
  short: '[[UniqueSearch]] with the promise moved from $|x|\le 1$ to $|x|\in\{0,2\}$. No two domain points are now adjacent, so $\mathrm{s} = \lambda = 0$, while $\mathrm{Q} = \mathrm{Adv} = \Theta(\sqrt n)$ is untouched.'
  refs: [Grover96, Ambainis02, NayakWu99]
  see_also: [UniqueSearch, GroverSearch, OR, Forrelation, GapMajConst]
  values:
    - {measure: D, value: 'n-1', putative: true, note: 'Adversary: answer $0$. After $n-2$ queries the two unread coordinates may both be $1$ or both be $0$, and both completions are on the promise. Conversely $n-1$ queries suffice: a $1$ anywhere settles the answer immediately, and if the first $n-1$ are all $0$ then the last coordinate cannot be $1$ alone, since $|x| = 1$ is off the promise.'}
    - {measure: R, value: '\Theta(n)', putative: true, note: 'Against $0^n$ versus a uniformly random pair, $q$ queries miss both planted ones with probability $\binom{n-q}{2}/\binom n2 \ge (1 - q/n)^2$, so $q = \Omega(n)$; and $\mathrm{R} \le \mathrm{D} = n-1$.'}
    - {measure: R0, value: '\Theta(n)', note: 'Squeezed: $\mathrm{R} \le \mathrm{R}_0 \le \mathrm{D}$, and both ends are $\Theta(n)$.'}
    - {measure: Q, value: '\Theta(\sqrt n)', refs: [Grover96, Ambainis02], note: 'Upper: amplitude amplification with a known count of $2$ marked items, $O(\sqrt{n/2})$ queries. Lower: the adversary bound below.'}
    - {measure: Adv, value: '\Theta(\sqrt n)', putative: true, refs: [Ambainis02], note: 'Take $X = \{0^n\}$, $Y = \{e_i + e_j\}$ and relate everything to everything. Then $m = \binom n2$, $m^{\prime} = 1$, $\ell = n-1$ (from $0^n$, the pairs differing at a fixed $i$ are those containing $i$) and $\ell^{\prime} = 1$, so Ambainis'' bound gives $\Omega\big(\sqrt{mm^{\prime}/\ell\ell^{\prime}}\big) = \Omega(\sqrt n)$. The ceiling is $\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = O(\sqrt n)$.'}
    - {measure: Advpm, value: '\Theta(\sqrt n)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$.'}
    - {measure: gamma2, value: '\Theta(\sqrt n)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(\sqrt n)$.'}
    - {measure: s0, value: '0', putative: true, note: 'The neighbours of $0^n$ all have $|x| = 1$ and are off the promise.'}
    - {measure: s1, value: '0', putative: true, note: 'The neighbours of a weight-$2$ point have weight $1$ or $3$.'}
    - {measure: s, value: '0', putative: true, note: 'Any two domain points differ in at least two coordinates, so the sensitivity graph is edgeless. This is the entire point of the function: it is [[UniqueSearch]] with the distance-$1$ pairs deleted from the domain, and deleting them costs nothing quantumly.'}
    - {measure: lambda, value: '0', putative: true, note: 'The spectral norm of the empty graph.'}
    - {measure: D_prod, value: '0', putative: true, note: 'The support of a product distribution is a subcube, and a subcube of dimension $k \ge 1$ inside the domain would contain points of $k+1$ consecutive Hamming weights, of which at most one lies in $\{0,2\}$. So every product $\mu$ is a point mass and $\mathrm{D}^\mu = 0$, against $\mathrm{R} = \Theta(n)$. See [[Forrelation]] for the general shape of this collapse.'}
    - {measure: bs0, value: '\lfloor n/2 \rfloor', putative: true, note: 'A block flipped at $0^n$ must land on the promise, so it is a pair, and $\lfloor n/2\rfloor$ disjoint pairs are available. Note $\mathrm{bs}^0 = \Theta(n)$ against $\mathrm{s}^0 = 0$: blocks survive the thickening, single bits do not.'}
    - {measure: bs1, value: '1', putative: true, note: 'From $e_i + e_j$ the only block whose flip both stays on the promise and changes the value is $\{i,j\}$ itself; flipping one of the two, or a pair of zeros, leaves the domain, and flipping $\{i,k\}$ gives another $1$-input.'}
    - {measure: bs, value: '\lfloor n/2 \rfloor', putative: true, note: 'The maximum of $\mathrm{bs}^0 = \lfloor n/2\rfloor$ and $\mathrm{bs}^1 = 1$.'}
    - {measure: fbs, value: 'n/2', putative: true, note: 'Exactly $n/2$ at $0^n$: giving every one of the $\binom n2$ pairs weight $1/(n-1)$ loads each coordinate to exactly $1$ and totals $n/2$, and no assignment beats it, since summing the load over coordinates counts each pair twice, giving $2\sum_B w_B \le n$.'}
    - {measure: C0, value: 'n-1', putative: true, note: 'A partial assignment of $n-2$ zeros leaves two free coordinates that may both be $1$, a $1$-input; $n-1$ zeros force the last coordinate to $0$.'}
    - {measure: C1, value: '1', putative: true, note: 'The single literal $x_i = 1$ is consistent with $n-1$ different $1$-inputs, but it already forces the *value*: weight $1$ is off the promise, so any domain point with $x_i = 1$ has weight $2$.'}
    - {measure: C, value: 'n-1', putative: true, note: 'The maximum of $\mathrm{C}^0 = n-1$ and $\mathrm{C}^1 = 1$.'}
    - {measure: Cmin, value: '1', putative: true, note: 'A single literal $x_i = 1$ already forces $f = 1$, because weight $1$ is off the promise.'}
    - {measure: RC, value: '\Theta(n)', putative: true, note: 'Squeezed between $\mathrm{fbs} = n/2$ and $\mathrm{C} = n-1$.'}
    - {measure: deg, value: '1', putative: true, note: '$p(x) = \tfrac12\sum_i x_i$ is $0$ at $0^n$ and $1$ at every weight-$2$ point, so it agrees with $f$ on the whole domain. Off the promise it runs up to $n/2$, which the partial-function definition of $\deg$ permits.'}
    - {measure: adeg, value: '\Theta(\sqrt n)', putative: true, refs: [NayakWu99, Paturi92], note: 'Upper: $\widetilde{\deg} \le 2\mathrm{Q} = O(\sqrt n)$. Lower: symmetrise to a univariate $q$ of the same degree with $q(0) \le 1/3$, $q(2) \ge 2/3$ and $|q(k)| \le 4/3$ at every integer $k \in [0,n]$ -- the off-promise boundedness is what makes $\widetilde{\deg}$ differ from $\deg$ here. Ehlich--Zeller upgrades that to boundedness on $[0,n]$, and Markov''s inequality $\max|q^{\prime}| \le 2d^2\max|q|/n$ against a jump of $1/3$ across an interval of length $2$ gives $d = \Omega(\sqrt n)$.'}
    - {measure: sdeg, value: '1', putative: true, note: '$1 - \sum_i x_i$ is $+1$ on the $0$-input and $-1$ on every $1$-input.'}
    - {measure: ndeg, value: '1', note: '$\sum_i x_i$ is nonzero exactly on the $1$-inputs of the domain.'}
    - {measure: rdeg, value: '1', note: 'Both halves are degree $1$: $\sum_i x_i$ vanishes exactly on the $0$-input, and $2 - \sum_i x_i$ exactly on the $1$-inputs.'}
    - {measure: ardeg, value: '1', note: '$\mathrm{rdeg}_{1/3} \le \mathrm{rdeg} = 1$.'}
    - {measure: NQ, value: '1', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2 \rceil$.'}
    - {measure: rank, value: '1', putative: true, note: '"Query $x_1$; if $1$ output $1$, else query $x_2$; ..." is a caterpillar, so its rank is $1$ -- and it is correct precisely because one observed $1$ already forces $|x| = 2$.'}
  witnesses:
    - {of: [Adv, lambda], setting: partial, statement: 'Unbounded: $\lambda = 0$ while $\mathrm{Adv} = \Theta(\sqrt n)$. Since $\lambda$ is *exactly* zero, no bound $\mathrm{Adv} \le g(\lambda)$ of any shape survives -- it would read $\mathrm{Adv} \le g(0)$. On total functions $\lambda \le \mathrm{Adv} \le O(\lambda^4)$ by Huang''s theorem; the upper half is promise-only false, and this is the witness.'}
    - {of: [Adv, s], setting: partial, statement: 'Unbounded: $\mathrm{s} = 0$ while $\mathrm{Adv} = \Theta(\sqrt n)$. The positive adversary needs a pair of differing inputs, not a pair of *adjacent* ones, and thickening the promise by one destroys the second without touching the first.'}
    - {of: [bs, s], setting: partial, statement: 'Unbounded, and about as cleanly as possible: $\mathrm{s} = 0$ exactly while $\mathrm{bs} = \lfloor n/2\rfloor$, since every sensitive block at $0^n$ is a pair.'}

# [[UniqueSearch]] has C = n only because its 0-side is a single input with no short
# certificate. Give the 0-side its own marks and that defect disappears while the Grover
# hardness survives, which is what makes this the zoo's cheapest C-versus-everything
# witness: one query certifies any input, and finding the query still costs sqrt(n).
- id: MarkedBit
  name: Marked bit
  symbol: '\mathrm{MARK}_n'
  group: quantum
  order: 44.7
  kind: partial
  arity: '$2n$ bits (an $n$-cell array over $\{0,1,2\}$, binary-encoded)'
  definition: |
    The input is an array $x \in \{0,1,2\}^n$; call a cell *blank* when it holds $2$ and
    *marked* otherwise. Promise: at least one cell is marked, and all marked cells hold
    the same bit $v$. Output $v$.

    The promise is [[UniqueSearch]]'s, made symmetric. There the $0$-input is the single
    all-blank string, which nothing short certifies; here both answers are carried by
    marks, so *every* input has a one-query certificate -- and the number of marks is
    left free, which is the whole difficulty.
  formal: '$\mathrm{Dom}(f) = \{x : x^{-1}(\{0,1\}) \ne \emptyset$ and $|x(\mathrm{Dom})\cap\{0,1\}| = 1\}$, with $f(x) = 1$ iff some cell holds $1$. Writing $y_b = \mathbb{1}[x_b = 1]$ and $z_b = \mathbb{1}[x_b = 0]$ for the two encoding bits of cell $b$, the domain is $\{(y,z) : y \wedge z = 0,\ (y,z) \ne (0,0),\ y = 0 \text{ or } z = 0\}$ and $f = \mathrm{OR}(y)$.'
  short: 'The certificate barrier at full strength: $\mathrm{C} = \mathrm{C}^0 = \mathrm{C}^1 = 1$, yet $\widetilde{\deg} = \mathrm{Q} = \Theta(\sqrt n)$ and $\mathrm{R} = \mathrm{D} = \Theta(n)$. Recognising the answer is one query; finding it is Grover.'
  refs: [Grover96, BBBV97, NS94, Aaronson08]
  see_also: [UniqueSearch, Search02, ApproxIndex, OrderedSearch, Collision, C, adeg]
  values:
    - {measure: D, value: 'n', putative: true, note: 'Exactly. Upper: query $y_1,\dots,y_n$, the "is this cell marked $1$" bits. If any is $1$ the answer is $1$; if all are $0$ there are no $1$-marks, and the promise guarantees a mark, so the answer is $0$. Lower: answer $0$ to everything. If some cell has both encoding bits unqueried, the two single-mark inputs there are both still consistent and disagree; so every cell must be touched.'}
    - {measure: R, value: '\Theta(n)', putative: true, note: 'Plant one mark at a uniformly random cell with a uniformly random colour. All-zero answers are what the algorithm sees unless it queries a bit of the marked cell, and each cell contributes only the bit it did not query: after $t$ queries the posterior still gives weight $\Omega((n-t)/n)$ to the other colour, so $t = \Omega(n)$. Upper: $\mathrm{R} \le \mathrm{D} = n$.'}
    - {measure: R0, value: '\Theta(n)', note: 'Squeezed: $\mathrm{R} \le \mathrm{R}_0 \le \mathrm{D}$, and both ends are $\Theta(n)$.'}
    - {measure: Rbar, value: '\Theta(n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: Dmu, value: '\Theta(n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon$; the planted-mark distribution above is the maximiser.'}
    - {measure: Dna, value: 'n', putative: true, note: 'Adaptivity buys nothing: the $y_b$ algorithm is already non-adaptive, and the lower bound above needs one query per cell whatever the order.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Between $\mathrm{R} = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}} = n$.'}
    - {measure: R1, value: '\Theta(n)', note: 'Between $\mathrm{R}$ and $\mathrm{R}_0$, which agree.'}
    - {measure: Q, value: '\Theta(\sqrt n)', putative: true, refs: [Grover96, BBHT98], note: 'Upper: search the $2n$ encoding bits for a $1$ with the unknown-number-of-solutions version of Grover [BBHT98]; there are $m \ge 1$ of them, it finds one in $O(\sqrt{2n/m}) = O(\sqrt n)$ queries, and *which* bit it finds is the answer -- a $y$-bit means $1$, a $z$-bit means $0$. Lower: $\mathrm{Q} \ge \widetilde{\deg}/2 = \Omega(\sqrt n)$.'}
    - {measure: adeg, value: '\Theta(\sqrt n)', putative: true, refs: [NS94, BBCMdW01], note: 'The value the function exists for. Upper: $\widetilde{\deg} \le 2\mathrm{Q}$. Lower, by reduction to $\mathrm{OR}$ rather than by symmetrising: let $p$ be $\varepsilon$-approximating and $[0,1]$-valued on the whole cube, and set $P(u) = p(y=u, z=0)$ and $W(u) = p(y=0, z=u)$, both of degree $\le \deg p$. For $u \ne 0^n$ the input $(u,0)$ is a domain $1$-input and $(0,u)$ a domain $0$-input, so $P(u) \ge 1-\varepsilon$ and $W(u) \le \varepsilon$; and $P(0^n) = W(0^n) = p(0,0)$, the all-blank string, whatever that unconstrained value is. So $\Psi = P - W$ has $\Psi(0^n) = 0$, $\Psi(u) \ge 1-2\varepsilon$ off the origin, and $|\Psi| \le 1$ everywhere. So $\Psi$ is a $[-1,1]$-bounded polynomial on the cube separating $0^n$ from the rest by a constant gap ($0$ versus $\ge 1/3$ at $\varepsilon = 1/3$), which is exactly what the Nisan--Szegedy argument rules out below degree $\Omega(\sqrt n)$: symmetrise $\Psi$, and Ehlich--Zeller plus Markov give $\deg p \ge \deg \Psi = \Omega(\sqrt n)$ [NS94]. The cancellation at the origin is the point -- neither $P$ nor $W$ alone is pinned there, but their difference is.'}
    - {measure: deg, value: 'n', putative: true, note: 'Exactly, and the contrast with [[UniqueSearch]] ($\deg = 1$) and [[ApproxIndex]] ($\deg = 2$) is the whole design. Upper: $1 - \prod_b (1-y_b)$. Lower: symmetrise an exact $p$ over the $n$ cells to $q(j_1,j_0)$, of no higher degree, and put $r(t) = q(t,0) - q(0,t)$; then $r(t) = 1$ for every integer $t \in [1,n]$ while $r(0) = 0$, so $r - 1$ has $n$ roots and is not identically zero. Counting the marks cannot work here because their number is not fixed.'}
    - {measure: sdeg, value: '1', putative: true, note: '$\sum_b y_b - \sum_b z_b$ is positive exactly on the $1$-inputs of the domain, since one of the two sums is always $0$ and the other is at least $1$. Against $\widetilde{\deg} = \Theta(\sqrt n)$: sign-representation is free, bounded approximation is not.'}
    - {measure: ndeg, value: '1', note: '$\sum_b y_b$ is nonzero exactly on the $1$-inputs of the domain. And $\mathrm{ndeg} \ge 1$.'}
    - {measure: rdeg, value: '1', note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\}$, and $\sum_b z_b$ does for $\bar f$ what $\sum_b y_b$ does for $f$.'}
    - {measure: ardeg, value: '1', refs: [IJKKKSWW23], note: '$\mathrm{rdeg}_{1/3} \le \mathrm{rdeg} = 1$.'}
    - {measure: NQ, value: '1', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2 \rceil$.'}
    - {measure: PostQ, value: '\Theta(1)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = \Theta(1)$: guess a cell, read it, postselect on it being marked.'}
    - {measure: C, value: '1', putative: true, note: 'One query, at every input and on both sides. Any marked cell certifies: by the promise no domain input has marks of both colours, so seeing a single $1$-mark rules out every $0$-input and vice versa. This is the sharpest form of the promise-problem lesson -- $\mathrm{D} \le \mathrm{C}^0\mathrm{C}^1$ would read $n \le 1$.'}
    - {measure: C0, value: '1', putative: true, note: 'See $\mathrm{C}$: a single $0$-mark.'}
    - {measure: C1, value: '1', putative: true, note: 'See $\mathrm{C}$: a single $1$-mark.'}
    - {measure: Cmin, value: '1', putative: true, note: 'Equal to $\mathrm{C}$: the same one-query certificate works everywhere.'}
    - {measure: s, value: '0', putative: true, note: 'No single flip stays on the promise while changing the answer. Adding a mark of the same colour or removing one of several leaves the value alone; removing the last mark, or adding a mark of the other colour, or setting a cell''s two encoding bits to $11$, all leave the domain. So $\mathrm{s}^0 = \mathrm{s}^1 = 0$ and the sensitivity graph has no edges at all.'}
    - {measure: s0, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: s1, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph is empty (see $\mathrm{s}$), so every bound of the form $M \le g(\lambda)$ fails here at once -- it would read $M \le g(0)$.'}
    - {measure: bs, value: '1', putative: true, note: 'An answer-flipping block must clear *every* current mark and plant one of the other colour, so all sensitive blocks contain the encoding bit of some fixed existing mark and no two are disjoint. There is at least one, so $\mathrm{bs} = 1$.'}
    - {measure: bs0, value: '1', putative: true, note: 'See $\mathrm{bs}$.'}
    - {measure: bs1, value: '1', putative: true, note: 'See $\mathrm{bs}$.'}
    - {measure: fbs, value: '1', putative: true, note: 'The load constraint at a single existing mark already caps $\sum_B w_B$ at $1$, since every sensitive block contains it.'}
    - {measure: FC, value: '1', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: '\Theta(1)', note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = \Theta(1)$, and also $\mathrm{RC} \le \mathrm{C} = 1$.'}
    - {measure: QC, value: '\Theta(1)', refs: [Aaronson08], note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{FC}}) = \Theta(1)$ [Aaronson08]. Constant quantum certificate complexity against $\mathrm{Q} = \Theta(\sqrt n)$ -- the same phenomenon Aaronson exhibits on [[Collision]], here at quadratic strength and with a two-line proof.'}
    - {measure: Adv, value: '\Theta(1)', refs: [SpalekSzegedy06, Zhang05], note: 'The certificate barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = 1$, which holds for partial $f$ too. So the positive-weight adversary proves nothing about a function whose $\mathrm{Q}$ is $\Theta(\sqrt n)$ -- and the barrier is not the usual property-testing shape here, since a $1$-input and a $0$-input can be a Hamming distance $2$ apart.'}
    - {measure: Advpm, value: '\Theta(\sqrt n)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$. The gap to $\mathrm{Adv} = \Theta(1)$ is as wide as the function is hard.'}
    - {measure: gamma2, value: '\Theta(\sqrt n)', note: '$\gamma_2^{\alpha} = \Theta(\mathrm{Q})$.'}
    - {measure: MAdv, value: '\Theta(\sqrt n)', note: 'Sandwiched between $\mathrm{Adv}^{\pm} = \Theta(\sqrt n)$ and $\mathrm{Q} = \Theta(\sqrt n)$.'}
    - {measure: Q0, value: '\Omega(\sqrt n),\ O(n)', note: 'Between $\mathrm{Q}$ and $\mathrm{R}_0$. Zero error cannot be cheap -- a zero-error algorithm must actually exhibit a mark -- but no bound better than the sandwich is recorded.'}
    - {measure: QE, value: '\Omega(\sqrt n),\ O(n)', note: 'Between $\mathrm{Q}_0$ and $\mathrm{D}$.'}
    - {measure: D_prod, value: '0', putative: true, note: 'Every subcube inside the promise is monochromatic, so no product distribution is hard at all. If a subcube held a $1$-input and a $0$-input then some $y_b$ and some $z_c$ would both be free in it, and the subcube would also contain the point with $y_b = z_c = 1$ -- marks of both colours if $b \ne c$, the invalid encoding $11$ if $b = c$, and off the domain either way. Against $\mathrm{R} = \Theta(n)$; see [[Forrelation]].'}
    - {measure: cbs, value: '1', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs} = 1$.'}
    - {measure: psD, value: '\Theta(n)', refs: [CDM23], note: 'Degenerate for Boolean functions: there is a single correct output, so the canonical answer is forced and $\mathrm{psD}(f) = \Theta(\mathrm{R}(f)) = \Theta(n)$.'}
    - {measure: rank, value: '1', putative: true, note: '"Query $y_1$; if $1$ output $1$, else query $y_2$; ..." is a caterpillar -- every internal node has a leaf child -- so its rank is $1$, against $\mathrm{D} = n$.'}
  witnesses:
    - {of: [adeg, C], setting: partial, statement: 'Unbounded, and polynomially so: $\mathrm{C} = \mathrm{C}^0 = \mathrm{C}^1 = \mathrm{C}_{\min} = 1$ against $\widetilde{\deg} = \Theta(\sqrt n)$. [[OrderedSearch]] separates the same pair with published bounds but only at $\log$ scale; this pushes it to a square root, which is the most a partial function can manage against $\mathrm{C} = 1$ in the sense that $\widetilde{\deg} \le 2\mathrm{Q} \le 2\mathrm{D} \le 2n$.'}
    - {of: [adeg, sdeg], setting: partial, statement: 'Unbounded: $\mathrm{sdeg} = 1$ against $\widetilde{\deg} = \Theta(\sqrt n)$. The two differ only in demanding a *bounded* approximation rather than a correct sign, and on a promise that is worth everything.'}
    - {of: [Q, QC], setting: partial, statement: 'Unbounded: $\mathrm{QC} = \mathrm{RC} = \Theta(1)$ against $\mathrm{Q} = \Theta(\sqrt n)$, so constant quantum certificate complexity does not make a promise problem easy.', refs: [Aaronson08]}

# [[MarkedBit]] with the marks made *dense*. One mark is enough to make finding one hard;
# half the cells marked makes finding one trivial -- and zero-error trivial, because a mark
# is a certificate for whichever answer it carries. Everything randomized collapses to
# $\Theta(1)$; exact degree does not notice, because the polynomial still has to reconcile
# the two all-blank limits it is never asked about. That is the deg-versus-R_0 witness.
- id: DenseMarkedBit
  name: Dense marked bit
  symbol: '\mathrm{DMARK}_n'
  group: quantum
  order: 44.8
  kind: partial
  arity: '$2n$ bits (an $n$-cell array over $\{0,1,2\}$, binary-encoded)'
  definition: |
    The input is an array $x \in \{0,1,2\}^n$; call a cell *blank* when it holds $2$ and
    *marked* otherwise. Promise: **at least $n/2$ cells are marked**, and all marked cells
    hold the same bit $v$. Output $v$.

    Exactly [[MarkedBit]]'s promise with "at least one mark" strengthened to "at least half
    the cells marked". That one change collapses every randomized and bounded-error measure
    to a constant -- sample a cell, it is marked with probability $\ge 1/2$, and a mark is a
    certificate -- while leaving the *exact* measures at $\Theta(n)$.
  formal: 'Writing $y_b = \mathbb{1}[x_b = 1]$ and $z_b = \mathbb{1}[x_b = 0]$, the promise makes one of $y, z$ identically zero, so $\mathrm{Dom}(f) = \{(y, 0^n) : |y| \ge n/2\} \cup \{(0^n, z) : |z| \ge n/2\}$, with $f = 1$ on the first part and $0$ on the second. Note $(0^n, 0^n)$ -- the all-blank array -- is *not* in the domain, and that single missing point is the whole story below.'
  short: 'Zero-error randomized cost $O(1)$ against $\deg = \mathrm{Q}_E = \Theta(n)$: the cheapest witness that exact degree is not bounded by any function of $\mathrm{R}_0$ off the promise.'
  refs: [MinskyPapert69, BBCMdW01, NS94, Aaronson08]
  see_also: [MarkedBit, UniqueSearch, DeutschJozsa, Find1Parity, GapMaj, deg, R0, QE]
  values:
    - {measure: R0, value: '\Theta(1)', putative: true, note: 'At most $4$. Pick a uniformly random cell $b$ and query $y_b$; if it is $1$, output $1$ -- correct with certainty, since by the promise no domain input carries marks of both colours. Otherwise query $z_b$; if it is $1$, output $0$. Otherwise the cell is blank: discard it and repeat with a fresh random cell. At least half the cells are marked, so each round succeeds with probability $\ge 1/2$ and costs $\le 2$ queries; the expected total is $\le 4$. The algorithm never answers without holding a mark, so it is zero-error, and [[R0]] is the *expected*-cost measure, which is what makes this legal -- the worst-case count is $\Omega(n)$, since an unlucky run can sample every blank cell first.'}
    - {measure: deg, value: 'n/2+1', putative: true, refs: [MinskyPapert69], note: 'Exactly. **Upper:** $\deg \le \mathrm{D} = n/2+1$. **Lower:** let $p$ be exact on $\mathrm{Dom}$ and symmetrise over the $n$ cells. Each cell takes one of three values, so Minsky--Papert symmetrisation [MinskyPapert69] gives a polynomial $P(a,c)$ of no higher total degree in the two counts $a = |y|$ and $c = |z|$. The domain says $P(a,0) = 1$ for every integer $a \in [n/2,\, n]$ and $P(0,c) = 0$ for every integer $c \in [n/2,\, n]$ -- that is $n/2+1$ points each. Suppose $\deg p \le n/2$. Then $u(a) := P(a,0)$ is a univariate of degree $\le n/2$ agreeing with the constant $1$ at $n/2+1$ points, so $u \equiv 1$; symmetrically $w(c) := P(0,c) \equiv 0$. But $u(0) = P(0,0) = w(0)$, so $1 = 0$. Hence $\deg p \ge n/2+1$. The contradiction lives at the all-blank array, the one point the promise omits: an exact polynomial has to commit to a value there and cannot commit to two.'}
    - {measure: D, value: 'n/2+1', putative: true, note: 'Exactly. **Upper:** query $y_1, \dots, y_{n/2+1}$, stopping at the first $1$ (answer $1$). If all are $0$ then a $1$-input would need $n/2$ marks among the remaining $n/2-1$ cells, so the answer is $0$. **Lower:** answer $0$ to everything. After $q_y$ of the $y$-bits and $q_z$ of the $z$-bits have come back $0$, a $1$-input is still consistent whenever $n - q_y \ge n/2$, and a $0$-input whenever $n - q_z \ge n/2$; so the algorithm cannot stop until $q_y > n/2$ or $q_z > n/2$.'}
    - {measure: Dna, value: 'n/2+1', putative: true, note: 'The $\mathrm{D}$ upper bound is already non-adaptive -- a fixed set of $n/2+1$ $y$-bits determines the answer -- and $\mathrm{D}^{\mathrm{na}} \ge \mathrm{D}$.'}
    - {measure: QE, value: '\Theta(n)', note: 'Squeezed by the two entries above: $\mathrm{Q}_E \ge \deg/2 = \Omega(n)$ [BBCMdW01], and $\mathrm{Q}_E \le \mathrm{D} = n/2+1$. Against $\mathrm{Q}_0 = \Theta(1)$: demanding certainty costs a factor of $n$ here, even though *aborting sometimes* is free.'}
    - {measure: R, value: '\Theta(1)', note: 'At most $\mathrm{R}_0 = \Theta(1)$, and at least $1$.'}
    - {measure: Rbar, value: '\Theta(1)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: R1, value: '\Theta(1)', note: 'Between $\mathrm{R}$ and $\mathrm{R}_0$, which agree.'}
    - {measure: Rna, value: '\Theta(1)', putative: true, note: 'Query both bits of $10$ uniformly random cells and answer from any mark found. All ten miss with probability $\le 2^{-10}$, and the queries are chosen before any answer is seen.'}
    - {measure: Dmu, value: '\Theta(1)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon = \Theta(1)$.'}
    - {measure: Q, value: '\Theta(1)', note: 'At most $\mathrm{R} = \Theta(1)$, and at least $1$.'}
    - {measure: Q0, value: '\Theta(1)', note: '$\mathrm{Q}_0 \le 2\,\mathrm{R}_0 = \Theta(1)$ ([[Q0]]). The contrast with $\mathrm{Q}_E = \Theta(n)$ is the sharpest form of the Las Vegas / exact distinction: both are "never wrong", but only one may say "don''t know".'}
    - {measure: adeg, value: '\Theta(1)', note: '$\widetilde{\deg} \le 2\mathrm{Q} = \Theta(1)$. Against $\deg = n/2+1$: bounded approximation is free here, exactness is not.'}
    - {measure: sdeg, value: '1', putative: true, note: '$\sum_b y_b - \sum_b z_b$ is positive exactly on the $1$-inputs of the domain, since one of the two sums is always $0$ and the other is at least $n/2$.'}
    - {measure: ndeg, value: '1', note: '$\sum_b y_b$ is nonzero exactly on the $1$-inputs of the domain, and $\mathrm{ndeg} \ge 1$.'}
    - {measure: rdeg, value: '1', note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\}$, and $\sum_b z_b$ does for $\bar f$ what $\sum_b y_b$ does for $f$.'}
    - {measure: ardeg, value: '1', refs: [IJKKKSWW23], note: '$\mathrm{rdeg}_{1/3} \le \mathrm{rdeg} = 1$.'}
    - {measure: NQ, value: '1', refs: [deWolf03], note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2 \rceil$.'}
    - {measure: PostQ, value: '\Theta(1)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = \Theta(1)$.'}
    - {measure: C, value: '1', putative: true, note: 'One query, on both sides: a single marked bit rules out every input of the other value, because the promise forbids marks of both colours. As on [[MarkedBit]], $\mathrm{D} \le \mathrm{C}^0\mathrm{C}^1$ would read $n/2+1 \le 1$.'}
    - {measure: C0, value: '1', putative: true, note: 'See $\mathrm{C}$: a single $0$-mark, i.e. some $z_b = 1$.'}
    - {measure: C1, value: '1', putative: true, note: 'See $\mathrm{C}$: a single $1$-mark, i.e. some $y_b = 1$.'}
    - {measure: Cmin, value: '1', note: 'Every input has a $1$-query certificate.'}
    - {measure: s, value: '0', putative: true, note: 'No promise-preserving single flip changes the answer. From a $1$-input, setting some $y_b$ to $1$ keeps the answer $1$; clearing a $y_b$ either keeps it $1$ or drops below $n/2$ marks and leaves the promise; and setting any $z_b$ to $1$ creates marks of both colours, also off the promise.'}
    - {measure: s0, value: '0', note: 'See $\mathrm{s}$.'}
    - {measure: s1, value: '0', note: 'See $\mathrm{s}$.'}
    - {measure: lambda, value: '0', note: 'The sensitivity graph has no edges at all (see $\mathrm{s} = 0$), so its adjacency matrix is zero.'}
    - {measure: bs, value: '1', putative: true, note: 'At any $x$ every sensitive block must clear *all* of $x$''s marks and plant $n/2$ of the other colour, so all sensitive blocks at $x$ share the coordinates of $x$''s marks and no two are disjoint.'}
    - {measure: bs0, value: '1', note: 'See $\mathrm{bs}$.'}
    - {measure: bs1, value: '1', note: 'See $\mathrm{bs}$.'}
    - {measure: fbs, value: '1', putative: true, note: 'The load constraint at any one of $x$''s marked coordinates already caps $\sum_B w_B$ at $1$, since every sensitive block contains it.'}
    - {measure: FC, value: '1', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: '\Theta(1)', note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = \Theta(1)$, and also $\mathrm{RC} \le \mathrm{C} = 1$.'}
    - {measure: QC, value: '\Theta(1)', refs: [Aaronson08], note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{FC}}) = \Theta(1)$ [Aaronson08]; also $\mathrm{QC} \le \mathrm{Q} = \Theta(1)$.'}
    - {measure: cbs, value: '1', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs} = 1$.'}
    - {measure: Adv, value: '\Theta(1)', refs: [SpalekSzegedy06], note: 'The certificate barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = 1$, and $\mathrm{Adv} \ge 1$.'}
    - {measure: Advpm, value: '\Theta(1)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2^{\alpha} = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: CA, value: '\Theta(1)', note: 'A lower bound on $\mathrm{R} = \Theta(1)$, and at least $1$.'}
    - {measure: psD, value: '\Theta(1)', refs: [CDM23], note: 'Degenerate for Boolean functions: $\mathrm{psD}(f) = \Theta(\mathrm{R}(f)) = \Theta(1)$.'}
    - {measure: rank, value: '1', putative: true, note: '"Query $y_1$; if $1$ output $1$, else query $y_2$; ..." is a caterpillar -- every internal node has a leaf child -- so its rank is $1$, against $\mathrm{D} = n/2+1$.'}
    - {measure: D_size, value: '\Theta(n)', putative: true, note: 'Upper: the caterpillar above has $O(n)$ leaves. Lower: a tree with $L$ leaves has depth $\le L-1$, and the depth is at least $\mathrm{D} = n/2+1$.'}
    - {measure: D_prod, value: '0', putative: true, note: 'Every subcube inside the promise is monochromatic, by the argument on [[MarkedBit]]: a subcube holding both a $1$-input and a $0$-input has some $y_b$ and some $z_c$ free, hence also contains the point setting both to $1$ -- marks of two colours, or the invalid encoding $11$, and off the domain either way.'}
    - {measure: Rstar, value: '\Theta(1)', note: 'Sandwiched: $\Omega(\mathrm{Q}) \le \mathrm{R}^{*} \le \mathrm{R} = \Theta(1)$.'}
    - {measure: noisyR, value: '\Theta(1)', note: 'At most $O(\mathrm{R}\log \mathrm{R}) = O(1)$, and at least $\mathrm{R} = \Theta(1)$.'}
    - {measure: prt, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{prt}_\varepsilon \le \mathrm{R} = \Theta(1)$, and at least $1$.'}
    - {measure: rprt, value: '\Theta(1)', note: 'Sandwiched: $\overline{\mathrm{prt}}_\varepsilon \le \mathrm{prt}_\varepsilon = \Theta(1)$, and at least $1$.'}
  witnesses:
    - {of: [deg, R0], setting: partial, statement: 'Unbounded: $\mathrm{R}_0 = \Theta(1)$ against $\deg = n/2+1$. Zero-error randomized cost puts no bound at all on exact degree off the promise -- the algorithm gets to stop as soon as it holds a certificate, while the polynomial must still assign a single value to the all-blank array that both branches of the promise demand be different.'}
    - {of: [QE, R0], setting: partial, statement: 'Unbounded: $\mathrm{R}_0 = \Theta(1)$ against $\mathrm{Q}_E \ge \deg/2 = \Omega(n)$.', refs: [BBCMdW01]}
    - {of: [QE, Q0], setting: partial, statement: 'Unbounded: $\mathrm{Q}_0 = \Theta(1)$ against $\mathrm{Q}_E = \Theta(n)$. Both models are never wrong; the Las Vegas one may abort, and off the promise that permission is worth a factor of $n$.'}
    - {of: [deg, adeg], setting: partial, statement: 'Unbounded: $\widetilde{\deg} = \Theta(1)$ against $\deg = n/2+1$, with the gap as wide as the arity allows.'}

- id: GroverSearch
  name: Unstructured search (relation)
  symbol: '\mathrm{SEARCH}_n'
  group: relational
  order: 45
  kind: relation
  arity: '$n$ bits'
  short: 'The canonical relation: output any index $i$ with $x_i=1$.'
  definition: |
    $\mathrm{SEARCH}_n = \{(x,i) : x_i = 1\}$. As stated this is a *partial*
    relation (nothing is valid on $x=0^n$); the total version adds
    $(0^n, \bot)$.
  formal: '$S = \{(x,i)\in\{0,1\}^n\times[n] : x_i = 1\} \cup \{(0^n,\bot)\}$.'
  values:
    - {measure: Q,  value: '\Theta(\sqrt n)', refs: [Grover96, BBBV97]}
    - {measure: R,  value: '\Theta(n)'}
    - {measure: D,  value: 'n'}
    - {measure: Advpm, value: '\Theta(\sqrt n)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(\sqrt n)$ here.'}
    - {measure: MAdv, value: '\Theta(\sqrt n)', refs: [Spalek08], note: '$\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$ and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_\varepsilon)$, so the multiplicative adversary is $\Theta(\mathrm{Q})$ on every function; here $\mathrm{Q} = \Theta(\sqrt n)$.'}
    - {measure: R0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: QE, value: 'n', putative: true, note: 'An exact algorithm for $\mathrm{SEARCH}$ decides $\mathrm{OR}$ exactly at no extra cost -- output $[\,i \ne \bot\,]$ -- so $\mathrm{Q}_E(\mathrm{SEARCH}) \ge \mathrm{Q}_E(\mathrm{OR}_n) = n$, and $\mathrm{Q}_E \le \mathrm{D} = n$. So the quadratic Grover speedup is *entirely* a bounded-error effect, even though a search algorithm can always verify its own output: verification makes the error one-sided, not zero.'}
    - {measure: Q0, value: 'n', putative: true, note: 'Same reduction: a zero-error search algorithm decides $\mathrm{OR}$ with zero error, and $\mathrm{Q}_0(\mathrm{OR}_n) = n$. Note the contrast with $\mathrm{R}_0 = \Theta(\mathrm{R})$ for relations -- the *randomized* zero-error cost collapses to the bounded-error one but the quantum one does not, because the obstruction is the all-zero input, where no witness exists to verify.'}
    - {measure: Rbar, value: '\Theta(n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: Dna, value: 'n', note: 'Adaptivity buys nothing: $\mathrm{D} = n$ already, and reading the whole input non-adaptively also costs $n$.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Sandwiched between $\mathrm{R} = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}} = n$.'}
    - {measure: psD, value: '\Theta(n)', putative: true, note: 'Sandwiched between $\mathrm{R} = \Theta(n)$ and $\mathrm{D} = n$, so the sandwich alone settles it -- no separate pseudo-determinism argument is needed. Contrast [[ApproxHW]] and [[promiseFind1]], where $\mathrm{R}$ is small and demanding a canonical answer is what makes the problem hard.'}
    - {measure: D_size, value: 'n+1', putative: true, note: 'Query $x_1, x_2, \dots$ and stop at the first $1$: $n+1$ leaves. And the all-zero input forces a root-to-leaf path of length $n$, whose $n$ branchings already create $n+1$ leaves.'}
    - {measure: cbs, value: 'n', putative: true, note: 'Exactly $n$, and for *every* solution function -- so the min over solution functions in the definition of [[cbs]] does nothing here. The all-zero input is critical: its only valid answer is $\bot$. Flipping any single coordinate $i$ turns it into $e_i$, whose only valid answer is $i \ne \bot$, so all $n$ singletons are sensitive blocks at $0^n$ whatever $s$ is; and $\mathrm{cbs} \le \mathrm{D} = n$. Compare $\mathrm{Q} = \Theta(\sqrt n)$: critical block sensitivity is a classical measure and sees none of the Grover speed-up.'}
    - {measure: C, value: 'n', putative: true, note: 'Attained only at $0^n$, where the sole valid answer is $\bot$ and certifying it means excluding every index, i.e. reading all $n$ bits. Everywhere else one queried $1$ certifies itself.'}
    - {measure: C1, value: '1', putative: true, note: 'One queried $1$ certifies its own index as a valid output. For a search relation this is the whole of the "yes" side; the $n$ in $\mathrm{C}$ comes entirely from the $\bot$ answer.'}
    - {measure: rank, value: '1', putative: true, note: 'The tree "query $x_1, x_2, \dots$, stop at the first $1$" is a caterpillar -- every internal node has a leaf child -- so it has rank $1$, and rank $0$ would mean no queries at all. So $\mathrm{rank}=1$ against $\mathrm{D}=n$, exactly as for [[OR]].'}
    - {measure: Dmu, value: '\Theta(n)', note: 'Yao''s minimax: $\max_\mu \mathrm{D}^{\mu}_{\varepsilon} = \mathrm{R}_{\varepsilon} = \Theta(n)$.'}
    - {measure: D_prod, value: '\Theta(n)', putative: true, note: 'Even a *product* distribution is hard: set each bit to $1$ independently with probability $1/n$. After $q$ all-zero answers each unqueried coordinate is still $1$ with probability $\approx 1/n$, so answering $\bot$ errs with probability $\approx (n-q)/n$ and naming an unqueried index does worse; hence $q = \Omega(n)$. And $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R} = \Theta(n)$.'}
    - {measure: Adv, value: '\Theta(\sqrt n)', note: 'The positive adversary is tight for unstructured search -- it is the original application of the method -- so $\mathrm{Adv} = \Theta(\sqrt n) = \Theta(\mathrm{Q})$. Contrast [[Simon]] and [[Collision]], where the positive adversary collapses to $O(1)$.', refs: [BBBV97]}
    - {measure: gamma2, value: '\Theta(\sqrt n)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(\sqrt n)$.'}
    - {measure: Cmin, value: '1', putative: true, note: 'At any input with a $1$, that single queried bit certifies its own index. The $n$ in $\mathrm{C}$ comes only from $0^n$, so $\mathrm{C}/\mathrm{C}_{\min} = n$.'}
    - {measure: CA, value: '\Theta(n)', conf: medium, note: 'The relational adversary was designed for exactly this problem and is tight on it: pair $0^n$ with each $e_i$ at weight $1/n$ to get $\Omega(n)$, and $\mathrm{CA} \le \mathrm{R} = \Theta(n)$. Note that $\mathrm{CA}$ lower-bounds $\mathrm{R}$ only, not $\mathrm{Q}$ -- the quantum bound needs [[Adv]], which stops at $\Theta(\sqrt n)$.'}
    - {measure: Np, value: '\Theta(n)', note: 'At least $\mathrm{R} = \Theta(n)$; and reading each bit $O(1)$ times to beat the noise costs only a constant factor, so $\Theta(n)$.'}
    - {measure: prt, value: 'O(n)', note: 'From $\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon = O(n)$.'}
    - {measure: rprt, value: 'O(n)', note: 'From $\overline{\mathrm{prt}}_\varepsilon \le \mathrm{prt}_\varepsilon = O(n)$.'}
    - {measure: robustQ, value: '\Theta(\sqrt n)', conf: medium, note: 'Grover search is robust: $O(\sqrt n)$ queries still suffice when each oracle answer is only a bounded-error bit, so the $\log$ in $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log\mathrm{Q})$ is not needed here; and $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q}$.'}
    - {measure: cjdeg, value: 'O(n)', note: '$\mathrm{cjdeg}_\varepsilon \le \mathrm{R}_\varepsilon = O(n)$. The usual lower bound $\mathrm{cjdeg} \ge \widetilde{\deg}$ is unavailable: approximate degree is not defined for a relation.'}
    - {measure: C0, value: 'n', putative: true, note: 'The distinguished answer $\bot$ is valid only at $0^n$, and certifying it means exhibiting a $0$ in every coordinate. So $\mathrm{C}^0 = n$ while $\mathrm{C}^1 = 1$ -- all of $\mathrm{C} = n$ sits on the $\bot$ side.'}
    - {measure: PDT, value: 'n', putative: true, note: 'Parity queries do not help. Along the branch where every answer is $0$, the queried sets $S_1,\dots,S_q$ are fixed; outputting $\bot$ is correct only if $0^n$ is the *unique* input consistent with those answers, i.e. only if $S_1,\dots,S_q$ span $\mathbb{F}_2^n$, forcing $q \ge n$. And $\mathrm{D}^{\oplus} \le \mathrm{D} = n$. Contrast $\mathrm{D}^{\oplus}(\mathrm{PARITY}) = 1$: what parity queries cannot do is *locate* a one.'}
    - {measure: R1, value: '\Theta(n)', note: 'For a search problem, one-sided error means the algorithm never emits an invalid output, so it must be certain: outputting $\bot$ requires seeing all $n$ zeros. Hence $\mathrm{R}^1 = \Theta(\mathrm{R}_0) = \Theta(n)$, and it is squeezed by $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0$ with both ends $\Theta(n)$ anyway.'}
    - {measure: noisyR, value: '\Theta(n)', putative: true, refs: [CKMPSS23], note: 'Upper: $\mathrm{noisyR} \le \mathrm{R} = \Theta(n)$. Lower: $\mathrm{R}$ is linear in the arity, the regime where fractional queries cannot help. Directly: let $\Gamma_i$ be the total squared bias the algorithm spends on coordinate $i$, so the cost is $\sum_i \Gamma_i$. The transcript distributions on $0^n$ and on $e_i$ have KL divergence $O(\Gamma_i)$, so distinguishing $0^n$ from $e_i$ needs $\Gamma_i = \Omega(1)$; this must hold for every $i$, giving cost $\Omega(n)$.'}
    - {measure: noisyRna, value: '\Theta(n)', note: 'Squeezed: $\mathrm{noisyR} = \Theta(n) \le \mathrm{noisyR}^{\mathrm{na}} \le \mathrm{R}^{\mathrm{na}} = \Theta(n)$. Theorem 8 of [BenDavidBlais20composition] is unavailable here -- it fails for relations, see [[AgreeString]] -- but nothing is lost by committing to the biases in advance at the top of the range.'}
    - {measure: PostQ, value: '\Theta(1)', putative: true, conf: medium, refs: [MahadevdeWolf15], note: 'Postselection trivialises search. Prepare $\sum_{i} \alpha_i |i\rangle + \varepsilon|\bot\rangle$ with $\alpha_i = n^{-1/2}$, query $x_i$ into a flag qubit (flag $= x_i$ on the $|i\rangle$ branches, flag $= 1$ on the $|\bot\rangle$ branch), and postselect on flag $= 1$. With $\varepsilon = 1/n$ the surviving state is a uniform superposition over $\{i : x_i = 1\}$ plus a $|\bot\rangle$ component of weight $\varepsilon^2/(\varepsilon^2 + |x|/n) \le 1/n$, so on any $x \ne 0^n$ the measurement returns a valid index, and on $x = 0^n$ only $|\bot\rangle$ survives. One query. Against $\mathrm{R} = \Theta(n)$ and $\mathrm{Q} = \Theta(\sqrt n)$ this is an unbounded gap.'}
  witnesses:
    - {of: [R, Q], setting: relation, statement: '$\mathrm{R}=\Theta(\mathrm{Q}^2)$ for a relation, same as the decision version.', refs: [Grover96, BBBV97]}
    - {of: [QE, Q], setting: relation, statement: 'Quadratic: $\mathrm{Q}_E = n$ against $\mathrm{Q}=\Theta(\sqrt n)$, matching the best possible gap for relations that admit witness verification.'}
  refs: [Grover96, BBBV97]
  see_also: [OR, ApproxHW, promiseFind1]

- id: promiseFind1
  name: FIND-1 under a density promise
  symbol: '\mathrm{Find1}_{\ge n/2}'
  group: relational
  order: 46
  kind: relation
  arity: '$n$ bits'
  short: 'The cleanest D-vs-R relational separation: $\mathrm{R}=O(1)$, $\mathrm{D}=n/2+1$.'
  definition: |
    Promise $|x| \ge n/2$; output any $i$ with $x_i = 1$. Sampling a single
    random index succeeds with probability $\ge 1/2$, so $\mathrm{R}=O(1)$;
    but an adversary can answer $0$ to a deterministic algorithm's first
    $n/2$ queries.
  values:
    - {measure: R,  value: 'O(1)'}
    - {measure: R0, value: 'O(1)', note: 'Zero error too: the algorithm *verifies* its own output, which is exactly why $\mathrm{R}_0=\Theta(\mathrm{R})$ for relations.'}
    - {measure: D,  value: 'n/2+1'}
    - {measure: psD, value: '\Theta(n)', conf: medium, note: 'Reproducibility is what costs: cf. ApproxHW. The $\Omega(n)$ side is the content; the $O(n)$ side is $\mathrm{psD} \le \mathrm{D}$.'}
    - {measure: Q,  value: '\Theta(1)', note: 'A dense search problem: one uniform sample already works, so quantum has nothing to speed up. $\mathrm{Q} \le \mathrm{R} = O(1)$.'}
    - {measure: Rbar, value: '\Theta(1)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: Rna, value: '\Theta(1)', putative: true, note: 'Sampling is already non-adaptive: read $10$ uniformly random positions and output any that is $1$.'}
    - {measure: Dna, value: 'n/2+1', putative: true, note: 'A fixed set of $n/2+1$ positions must contain a $1$ (a promise input has at most $n/2$ zeros), and a fixed set of $n/2$ positions can be entirely zero. So adaptivity is worth nothing on the deterministic side either -- all the power is in the coins.'}
    - {measure: C,  value: '1', putative: true, note: 'One queried $1$ certifies its own index as a valid output, at every input. So $\mathrm{C} = 1$ against $\mathrm{D} = n/2+1$: for relations, certificate complexity does not bound deterministic complexity at all, because knowing that a short certificate *exists* does not tell you where to look.'}
    - {measure: C1, value: '1', putative: true, note: 'Same certificate.'}
    - {measure: Advpm, value: '\Theta(1)', note: 'Sandwiched between $\mathrm{Q} = \Theta(1)$ and $\mathrm{R} = O(1)$.'}
    - {measure: Dmu, value: '\Theta(1)', note: 'Sandwiched between $\mathrm{Q}$ and $\mathrm{R} = O(1)$.'}
    - {measure: cbs, value: '0', putative: true, note: 'Vacuously: [[cbs]] maximises over *critical* inputs, those with a unique valid answer, and this problem has none. A promise input has $|x| \ge n/2 \ge 2$ ones for $n \ge 4$, so every input admits at least two answers and the max is over the empty set. So critical block sensitivity -- the standard route to relational lower bounds -- says nothing whatever about a problem with $\mathrm{D} = n/2+1$. Contrast [[SearchCNF]] and [[GroverSearch]], where the unique-answer inputs are exactly what carries the hardness.'}
    - {measure: rank, value: '1', putative: true, note: 'The optimal tree "query $x_1, x_2, \dots$ and stop at the first $1$" is a caterpillar, so its rank is $1$; and rank $0$ means a constant answer. A Delayer in the Prover--Delayer game scores nothing here because the Prover''s query is always one the adversary is happy to answer $0$.'}
    - {measure: D_size, value: '\Theta(n)', putative: true, note: 'The caterpillar has one leaf per stopping point, so $O(n)$; and a tree of depth $d$ has more than $d$ leaves, so $\Omega(n)$ by $\mathrm{D} = n/2+1$. Unlike [[ApproxHW]] and [[SearchCNF]], the deterministic hardness here is entirely depth and not at all size.'}
    - {measure: Np, value: '\Theta(1)', putative: true, note: 'Sample $O(1)$ random positions and read each $O(1)$ times to drive the noise below any constant: the promise means a random position is $1$ with probability $\ge 1/2$, so a constant number of noisy reads suffices.'}
    - {measure: robustQ, value: '\Theta(1)', note: 'At most $\mathrm{N}_p = \Theta(1)$ (a noisy quantum algorithm can simulate the classical one), and at least $\mathrm{Q} = \Theta(1)$.'}
    - {measure: CA, value: '\Theta(1)', note: 'The classical adversary bound is a lower bound on $\mathrm{R}$, which is $O(1)$ here; and it is at least a constant for any non-trivial problem. So the relational adversary, which was designed for search problems, is powerless against [[promiseFind1]] -- correctly so, since $\mathrm{R} = O(1)$.'}
    - {measure: cjdeg, value: '\Theta(1)', note: 'Squeezed by $\mathrm{cjdeg} \le \mathrm{R} = O(1)$ and by $\mathrm{cjdeg} \ge 1$ for a non-constant problem.'}
    - {measure: prt, value: 'O(1)', note: 'From $\mathrm{prt} \le 2\mathrm{R} = O(1)$.'}
    - {measure: rprt, value: 'O(1)', note: 'From $\overline{\mathrm{prt}} \le \mathrm{prt} = O(1)$.'}
    - {measure: Q0, value: '\Theta(1)', note: 'The output is self-verifying -- the algorithm only ever names an index it has *seen* to be $1$ -- so the bounded-error algorithm is already zero-error: $\mathrm{Q}_0 \le \mathrm{R}_0 = O(1)$. Contrast [[GroverSearch]], where $\mathrm{Q}_0 = n$ because the all-zero input has no witness; the density promise removes that input.'}
    - {measure: QE, value: 'n/2+1', putative: true, note: 'Exactness is as expensive as determinism. A quantum algorithm that must output a valid index *with certainty* after $q$ queries still has to have queried a $1$ in every branch of its computation, and the adversary that answers $0$ to the first $n/2$ distinct positions keeps a promise-consistent input alive; and $\mathrm{Q}_E \le \mathrm{D} = n/2+1$. So the whole $\Theta(n)$-to-$O(1)$ collapse here is a bounded-error effect.', conf: medium}
    - {measure: Adv, value: '\Theta(1)', note: 'A lower bound on $\mathrm{Q} = \Theta(1)$, and at least $1$.'}
    - {measure: MAdv, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{Adv}^{\pm} \le \mathrm{MAdv} \le \mathrm{Q}$, both $\Theta(1)$.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: Cmin, value: '1', putative: true, note: 'Equal to $\mathrm{C}$: the same one-bit certificate works at every input, since the promise guarantees a $1$ exists.'}
    - {measure: D_prod, value: '\Theta(1)', note: 'At most $\mathrm{D}^\mu = \Theta(1)$ for every $\mu$, hence in particular for product ones; and at least one query.'}
    - {measure: noisyR, value: '\Theta(1)', note: 'At most $\mathrm{R} = O(1)$, and at least $1$: buying bias cannot help a problem that is already solved by one full-strength query.'}
    - {measure: noisyRna, value: '\Theta(1)', note: 'Squeezed: $\mathrm{noisyR} = \Theta(1) \le \mathrm{noisyR}^{\mathrm{na}} \le \mathrm{R}^{\mathrm{na}} = \Theta(1)$. Against $\mathrm{psD} = \Theta(n)$ this is an unbounded gap: committing to a canonical answer is what is expensive, not adaptivity or query strength.'}
    - {measure: PDT, value: '\Theta(n)', putative: true, note: 'At least $n/2$, so parity queries are as useless as ordinary ones. Answer $0$ to every query; after $q$ queries the consistent inputs form the linear space $W^{\perp}$, $\dim = n-q$, where $W$ is the span of the queried sets. A leaf that outputs $i$ must have $x_i = 1$ throughout $W^{\perp} \cap \{|x| \ge n/2\}$, but $V = W^{\perp} \cap \{x_i = 0\}$ has dimension $\ge n-q-1$, and any subspace of dimension $d$ contains a vector of weight $\ge d$ (sum the reduced-echelon basis: it is $1$ on all $d$ pivots). For $q \le n/2 - 1$ that vector satisfies the promise and refutes the leaf. And $\mathrm{D}^{\oplus} \le \mathrm{D} = n/2+1$. Against $\mathrm{R} = O(1)$ this is the same unbounded gap as for $\mathrm{D}$.'}
    - {measure: R1, value: '\Theta(1)', note: 'Squeezed: $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0 = O(1)$. The promise $|x| \ge n/2$ means a random probe both finds and certifies a $1$, so never emitting an invalid output costs nothing extra -- in sharp contrast to [[GroverSearch]].'}
    - {measure: PostQ, value: '\Theta(1)', note: 'At most $\mathrm{Q} = \Theta(1)$, and at least $1$: there is nothing for postselection to buy.'}
  witnesses:
    - {of: [D, R],  setting: relation, statement: 'Unbounded: no function of $\mathrm{R}$ bounds $\mathrm{D}$ for *partial* relations.', refs: [GIPS21]}
    - {of: [D, C],  setting: relation, statement: 'Unbounded: $\mathrm{C}=1$ but $\mathrm{D}=n/2+1$. The total-function bound $\mathrm{D} \le \mathrm{C}^2$ has no relational analogue.'}
    - {of: [psD, Q], setting: relation, statement: 'Unbounded: $\mathrm{Q} = \Theta(1)$ against $\mathrm{psD} = \Theta(n)$.'}
    - {of: [D, cbs], setting: relation, statement: 'Unbounded, and degenerately so: with $|x| \ge n/2$ every input has many valid answers, so there are no critical inputs and $\mathrm{cbs} = 0$ while $\mathrm{D} = n/2+1$. Contrast [[SearchCNF]] and [[GroverSearch]], whose unique-answer inputs are exactly what makes $\mathrm{cbs} = \Theta(n)$ available as a lower-bound technique.'}
  refs: [GIPS21, CDM23]
  see_also: [ApproxHW, GroverSearch, psD]

- id: ApproxHW
  name: Approximate Hamming weight
  symbol: '\mathrm{ApproxHW}'
  group: relational
  order: 47
  kind: relation
  arity: '$n$ bits'
  short: 'Total search problem with $\mathrm{R}=O(1)$ but $\mathrm{psD}=\Omega(n)$: reproducibility is exponentially expensive.'
  definition: |
    Output any integer $w$ with $\big|\,w - |x|\,\big| \le \varepsilon n$.
    Random sampling gives an estimate with $O(1/\varepsilon^2)$ queries; but a
    *pseudo-deterministic* algorithm must commit to one canonical $w$ for each
    $x$, and near the boundaries that forces $\Omega(n)$ queries.
  values:
    - {measure: R,   value: '\Theta(1)', note: 'At constant $\varepsilon$; the honest dependence is $\Theta(1/\varepsilon^2)$ samples for an $\varepsilon n$-accurate estimate.'}
    - {measure: psD, value: '\Theta(n)', refs: [CDM23, GIPS21], note: 'The $\Omega(n)$ side is the theorem; $\mathrm{psD} \le \mathrm{D} = O(n)$ closes it.'}
    - {measure: D,   value: '\Theta(n)', note: 'Reading all $n$ bits is enough, and $\mathrm{D} \ge \mathrm{psD} = \Omega(n)$.'}
    - {measure: R0,  value: '\Theta(n)', putative: true, note: 'After $q$ queries the unseen coordinates leave $|x|$ uncertain within a window of width $n-q$, so a *never-wrong* algorithm cannot stop before $q \ge (1-2\varepsilon)n$. This is the sharper statement: it is not just canonicity that costs, plain certainty already does.'}
    - {measure: Q,   value: '\Theta(1)', note: 'At most $\mathrm{R}$, and at least a constant.'}
    - {measure: Rbar, value: '\Theta(1)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: Rna, value: '\Theta(1)', putative: true, note: 'Uniform sampling is non-adaptive.'}
    - {measure: Dna, value: '\Theta(n)', note: 'Between $\mathrm{D}=\Theta(n)$ and the trivial $n$.'}
    - {measure: Advpm, value: '\Theta(1)', note: 'Sandwiched between $\mathrm{Q} = \Theta(1)$ and $\mathrm{R} = \Theta(1)$.'}
    - {measure: Dmu, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{D}_\mu \le \mathrm{R} = \Theta(1)$ for every $\mu$.'}
    - {measure: cbs, value: '0', putative: true, note: 'Vacuously: an input is *critical* for [[cbs]] when it has a unique valid answer, and here the valid answers at $x$ are all integers in $[\,|x|-\varepsilon n,\ |x|+\varepsilon n\,]$, an interval containing $\ge 2\varepsilon n \ge 2$ of them. So there are no critical inputs and the maximum in the definition is empty. Critical block sensitivity is blind to approximate-counting hardness, which is why the $\mathrm{psD}$ lower bound of [CDM23] needs a different technique.'}
    - {measure: C, value: '\Theta(n)', putative: true, note: 'A partial assignment fixing $q$ coordinates leaves $|x|$ free in a window of width $n-q$, so it forces a single valid answer only when $n - q \le 2\varepsilon n$, i.e. $q \ge (1-2\varepsilon)n$. Fixing that many coordinates does certify. So even *nondeterministically* this problem is hard, unlike [[promiseFind1]] where $\mathrm{C}=1$.'}
    - {measure: rank, value: '\Theta(n)', putative: true, note: 'In the Prover--Delayer game the Delayer can defer on every query -- both answers keep at least two candidate outputs alive -- until $(1-2\varepsilon)n$ coordinates are fixed, scoring a point each round. So $\mathrm{rank} \ge (1-2\varepsilon)n$, and $\mathrm{rank} \le \mathrm{D} = \Theta(n)$.'}
    - {measure: D_size, value: '2^{\Theta(n)}', putative: true, note: 'Each leaf subcube must force a valid answer, hence has codimension $\ge (1-2\varepsilon)n$ by the certificate bound above, hence contains at most $2^{2\varepsilon n}$ inputs; so at least $2^{(1-2\varepsilon)n}$ leaves are needed, and $2^n$ suffice. This is the *worst-case* analogue of the $\exp(\widetilde\Omega(n^{1/4}))$ pseudo-deterministic size bound of [CDM23].'}
    - {measure: D_prod, value: '\Theta(1)', note: 'At most $\mathrm{R} = \Theta(1)$ by Yao, and at least one query.'}
    - {measure: Np, value: '\Theta(1)', putative: true, note: 'Reading $O(1/\varepsilon^2)$ random positions $O(1)$ times each still estimates the density to within $\varepsilon$, since the noise only rescales the empirical mean by a known factor $1-2p$.'}
    - {measure: robustQ, value: '\Theta(1)', note: 'At most $\mathrm{N}_p = \Theta(1)$, at least $\mathrm{Q} = \Theta(1)$.'}
    - {measure: CA, value: '\Theta(1)', note: 'A lower bound on $\mathrm{R} = \Theta(1)$, and at least a constant.'}
    - {measure: cjdeg, value: '\Theta(1)', note: 'Squeezed by $\mathrm{cjdeg} \le \mathrm{R} = \Theta(1)$ and $\mathrm{cjdeg} \ge 1$.'}
    - {measure: prt, value: 'O(1)', note: 'From $\mathrm{prt} \le 2\mathrm{R} = O(1)$.'}
    - {measure: rprt, value: 'O(1)', note: 'From $\overline{\mathrm{prt}} \le \mathrm{prt} = O(1)$.'}
    - {measure: Adv, value: '\Theta(1)', note: 'A lower bound on $\mathrm{Q} = \Theta(1)$, and at least $1$.'}
    - {measure: MAdv, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{Adv}^{\pm} \le \mathrm{MAdv} \le \mathrm{Q}$, both $\Theta(1)$.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: Cmin, value: '\Theta(n)', putative: true, note: 'Equal to $\mathrm{C}$: the counting argument there -- a partial assignment fixing $q$ coordinates leaves $|x|$ free in a window of width $n-q$ -- is input-independent, so every input needs $(1-2\varepsilon)n$ fixed coordinates. Certificate-uniform hardness is what drives the $\mathrm{R}_0$ and $\mathrm{DTsize}$ bounds above.'}
    - {measure: noisyR, value: '\Theta(1)', note: 'At most $\mathrm{R} = \Theta(1)$, and at least $1$.'}
    - {measure: noisyRna, value: '\Theta(1)', note: 'Squeezed: $\mathrm{noisyR} = \Theta(1) \le \mathrm{noisyR}^{\mathrm{na}} \le \mathrm{R}^{\mathrm{na}} = \Theta(1)$. Against $\mathrm{C}^1 = \mathrm{rank} = \mathrm{psD} = \Theta(n)$ this is an unbounded gap in each case -- the cheapest relational witness the zoo has for those three against the non-adaptive noisy model.'}
    - {measure: Q0, value: '\Theta(n)', putative: true, note: 'Zero error forces a certificate on every branch, quantumly too: a zero-error algorithm''s final state is supported on outcomes valid for *every* input consistent with what it has learned, and by $\mathrm{C}_{\min} = (1-2\varepsilon)n$ nothing short of that many queries pins an answer down. And $\mathrm{Q}_0 \le \mathrm{R}_0 = \Theta(n)$. So quantum buys nothing at all once error is forbidden -- against $\mathrm{Q} = \Theta(1)$.', conf: medium}
    - {measure: C1, value: '\Theta(n)', note: 'Same count as $\mathrm{C}$ and $\mathrm{C}_{\min}$: certifying *any* valid answer needs $(1-2\varepsilon)n$ fixed coordinates, at every input.'}
    - {measure: QE, value: '\Theta(n)', note: 'Squeezed between $\mathrm{Q}_0 = \Theta(n)$ and $\mathrm{D} = \Theta(n)$.'}
    - {measure: PDT, value: '\Theta(n)', putative: true, note: 'Parity queries do not count either. After $q$ parity queries the consistent inputs form an affine space $A$ of dimension $n-q$; choosing $n-q$ *free* coordinates, every pattern on them occurs, so $A$ contains an input of weight $\le q$ (free part all $0$) and one of weight $\ge n-q$ (free part all $1$). A leaf can name one valid $w$ only if the weights inside $A$ span at most $2\varepsilon n$, forcing $n - 2q \le 2\varepsilon n$, i.e. $\mathrm{D}^{\oplus} \ge (1-2\varepsilon)n/2$. And $\mathrm{D}^{\oplus} \le \mathrm{D} = \Theta(n)$.'}
    - {measure: R1, value: '\Theta(n)', putative: true, note: 'For a search problem, one-sided error means the output is always valid. Every leaf that outputs some $w$ must have pinned $|x|/n$ to within $\varepsilon$ with certainty, which takes $(1-2\varepsilon)n$ queries; since every input reaches an outputting leaf with probability $\ge 2/3$, the cost is $\Omega(n)$. So $\mathrm{R}^1 = \Theta(\mathrm{R}_0) = \Theta(n)$, against $\mathrm{R} = \Theta(1)$ -- the same collapse that makes $\mathrm{R}_0$ jump.'}
    - {measure: PostQ, value: '\Theta(1)', note: 'At most $\mathrm{Q} = \Theta(1)$, and at least $1$.'}
  witnesses:
    - {of: [psD, R], setting: relation, statement: 'Exponential separation between pseudo-deterministic and randomized query complexity of a *total* search problem; also an $\exp(\Omega(n))$ separation in decision-tree **size**.', refs: [CDM23, GIPS21]}
    - {of: [R0, R], setting: relation, statement: 'Unbounded: $\mathrm{R}=\Theta(1)$ but $\mathrm{R}_0=\Theta(n)$, for a *total* search problem. Relations with verifiable witnesses have $\mathrm{R}_0=\Theta(\mathrm{R})$; approximate counting has no witness to verify, so the collapse fails.'}
    - {of: [Dna, Rna], setting: relation, statement: 'Unbounded: $\mathrm{R}^{\mathrm{na}} = \Theta(1)$ against $\mathrm{D}^{\mathrm{na}} = \Theta(n)$ -- the whole gap for this problem is randomness, not adaptivity.'}
    - {of: [D, cbs], setting: relation, statement: 'Unbounded in the strongest possible way: $\mathrm{cbs} = 0$, because a problem whose answers come in intervals has no input with a *unique* valid answer, while $\mathrm{D} = \Theta(n)$. Critical block sensitivity is the standard route to relational lower bounds and it is simply unavailable for approximate counting; the same holds at [[promiseFind1]]. Every measure is therefore unbounded in terms of $\mathrm{cbs}$ over relations, but no *asymptotic* separation can be read off a value of exactly zero.'}
  refs: [CDM23, GIPS21, GGR13]
  see_also: [psD, SearchCNF, promiseFind1]

- id: AgreeString
  name: Correlated-string search
  symbol: '\mathrm{AGREE}_n'
  group: relational
  order: 47.5
  kind: relation
  arity: '$n$ bits in, $n$ bits out'
  short: 'The GLSS19 relational counterexample to composition: $\mathrm{R}=\Theta(\sqrt n)$ but $\mathrm{noisyR}=\Theta(1)$, adaptively *and* non-adaptively.'
  definition: |
    Given $x \in \{0,1\}^n$, output **any** $y \in \{0,1\}^n$ with
    $|x - y| \le n/2 - \sqrt n$, i.e. any string that agrees with $x$ on at least
    $n/2 + \sqrt n$ coordinates. Total: $y = x$ always works.

    Guessing at random gives agreement $n/2 \pm O(\sqrt n)$, so the task is to beat
    a coin flip by exactly one standard deviation. That is cheap if you are allowed
    to be a little bit right about every coordinate, and expensive if you have to be
    exactly right about a few of them -- which is the whole point of the example.
  formal: '$\{(x,y) : |x \oplus y| \le n/2 - \sqrt n\} \subseteq \{0,1\}^n \times \{0,1\}^n$.'
  values:
    - {measure: R, value: '\Theta(\sqrt n)', refs: [GLSS19], note: 'Query a uniformly random set $S$ of $c\sqrt n$ coordinates, copy $x$ on $S$ and flip fair coins elsewhere: the distance is $\mathrm{Bin}(n-|S|,1/2) \approx n/2 - c\sqrt n/2$ with deviation $O(\sqrt n)$, so a large enough constant $c$ works. The matching $\Omega(\sqrt n)$ is [GLSS19].'}
    - {measure: Rna, value: '\Theta(\sqrt n)', putative: true, note: 'The algorithm above never looks at an answer before choosing the next query, so it is non-adaptive; and $\mathrm{R}^{\mathrm{na}} \ge \mathrm{R} = \Omega(\sqrt n)$.'}
    - {measure: Rbar, value: '\Theta(\sqrt n)', note: '$\bar{\mathrm{R}}_\varepsilon = \Theta(\mathrm{R}_\varepsilon)$ at constant $\varepsilon$.'}
    - {measure: noisyR, value: '\Theta(1)', refs: [BenDavidBlais20composition, GLSS19], note: 'Buy *every* coordinate at bias $c/\sqrt n$ and set $y$ to the answers: total cost $n \cdot c^2/n = c^2 = O(1)$, and the expected agreement is $n/2 + c\sqrt n/2$, one standard deviation past the promise for large enough $c$. The lower bound $\Omega(1)$ is Lemma 37 of [BenDavidBlais20composition], which applies because $x=0^n$ and $x=1^n$ have disjoint sets of allowed outputs.'}
    - {measure: noisyRna, value: '\Theta(1)', refs: [BenDavidBlais20composition], note: 'That algorithm commits to all $n$ biases in advance, so the non-adaptive cost is $O(1)$ too; and $\mathrm{noisyR}^{\mathrm{na}} \ge \mathrm{noisyR} = \Omega(1)$. This is exactly the family that makes Theorem 8 false for relations.'}
    - {measure: D, value: '\Theta(n)', putative: true, note: 'Sharply $\lceil n/2 + \sqrt n\rceil$. Upper: copy $x$ on the queried coordinates and put $0$ elsewhere. Lower: after $q$ queries the output $y$ is determined, and the adversary sets every unqueried $x_i := 1 - y_i$, forcing distance $n-q$; validity needs $n - q \le n/2 - \sqrt n$.'}
    - {measure: Dna, value: '\Theta(n)', putative: true, note: 'The deterministic algorithm above is non-adaptive, and the adversary argument does not care about adaptivity.'}
    - {measure: R0, value: '\Theta(n)', putative: true, note: 'The adversary argument applies to *every* tree in the support of a zero-error algorithm and to every leaf of it, so all leaves sit at depth $\ge n/2 + \sqrt n$ and even the expected cost is $\Omega(n)$. So $\mathrm{R}_0/\mathrm{R} = \Theta(\sqrt n)$ here: a second unbounded gap, for the same reason as at [[ApproxHW]] -- there is no witness to verify.'}
    - {measure: C, value: '\Theta(n)', putative: true, note: 'A partial assignment fixing $q$ coordinates forces a valid answer only if some $y$ works for all $2^{n-q}$ completions, and the worst completion is at distance $n-q$ from $y$; so $q \ge n/2 + \sqrt n$, and that many suffice.'}
    - {measure: Cmin, value: '\Theta(n)', putative: true, note: 'The count above is input-independent, so $\mathrm{C}_{\min} = \mathrm{C} = \Theta(n)$.'}
    - {measure: cbs, value: '0', putative: true, note: 'No input has a unique valid answer -- there are $\binom{n}{\le n/2-\sqrt n}$ of them -- so there are no critical inputs and the maximum in the definition of [[cbs]] is empty. As at [[ApproxHW]], the standard route to relational lower bounds is unavailable and [GLSS19] had to argue directly.'}
    - {measure: Np, value: '\Theta(\sqrt n)', putative: true, note: 'At constant noise rate $p$: read $c\sqrt n$ random coordinates once each and copy the (possibly corrupted) answers, guessing elsewhere. Expected agreement $n/2 + c(1/2-p)\sqrt n$, so $O(\sqrt n)$ noisy queries suffice, and $\mathrm{N}_p \ge \mathrm{R} = \Omega(\sqrt n)$. Note the contrast with $\mathrm{noisyR} = \Theta(1)$: the faulty-oracle model charges $1$ per query whatever the bias, and that single convention is the entire difference.'}
    - {measure: Q, value: 'O(\sqrt n)', note: 'At most $\mathrm{R}$. No better quantum algorithm is recorded here, and no lower bound beyond $\Omega(1)$.'}
  witnesses:
    - {of: [R, noisyR], setting: relation, refs: [GLSS19, BenDavidBlais20composition], statement: 'Unbounded: $\mathrm{noisyR} = \Theta(1)$ against $\mathrm{R} = \Theta(\sqrt n)$. This is the **relational barrier** of [BenDavidBlais20composition]: any measure $M$ with $\mathrm{noisyR} = \Omega(M)$ must either be $O(1)$ on this family -- and hence a poor lower bound on $\mathrm{R}$ -- or must use the fact that $f$ is a function.'}
    - {of: [Rna, noisyRna], setting: relation, refs: [BenDavidBlais20composition], statement: 'Unbounded: $\mathrm{noisyR}^{\mathrm{na}} = \Theta(1)$ against $\mathrm{R}^{\mathrm{na}} = \Theta(\sqrt n)$, so Theorem 8 ($\mathrm{R}^{\mathrm{na}} = \Theta(\mathrm{noisyR}^{\mathrm{na}})$ for partial Boolean functions) is **false for relations**. Its proof must therefore notice Boolean-ness somewhere, and it does: the step that fails is the passage from error probability to relative entropy.'}
    - {of: [R0, R], setting: relation, statement: 'Unbounded: $\mathrm{R} = \Theta(\sqrt n)$ against $\mathrm{R}_0 = \Theta(n)$.'}
  refs: [GLSS19, BenDavidBlais20composition]
  see_also: [ApproxHW, GapMaj, ApproxIndex, noisyR, noisyRna, comp-R, promiseFind1]

- id: SearchCNF
  name: SearchCNF
  symbol: '\mathrm{Search}(\varphi)'
  group: relational
  order: 48
  kind: relation
  arity: '$n$ bits (an assignment to an unsatisfiable CNF $\varphi$)'
  short: 'The canonical TFNP-style query relation: given an assignment, output a falsified clause.'
  definition: |
    Fix an unsatisfiable $k$-CNF $\varphi$ on $n$ variables. Given an assignment
    $x$, output (the index of) some clause of $\varphi$ falsified by $x$.
    Total by unsatisfiability. This is the query-complexity home of TFNP$^{dt}$
    and of resolution lower bounds.
  values:
    - {measure: R,   value: '\Theta(1)', conf: medium, note: 'For a random $\Delta$-dense unsatisfiable $k$-CNF with $\Delta$ a large enough constant: with high probability *every* assignment falsifies a constant fraction of the clauses, so sampling $O(1)$ clauses at random and reading their $k$ variables finds a falsified one. At least one query is needed, so $\Theta(1)$.'}
    - {measure: psD, value: '\Omega(n^{1/3})', refs: [CDM23], note: '$\Omega(\sqrt n)$ in the related setting of [GIPS21]; also $\exp(\widetilde\Omega(n^{1/4}))$ in pseudo-deterministic decision-tree *size*.'}
    - {measure: D, value: '\Theta(n)', refs: [LNNW95, BenSassonWigderson01], conf: medium, note: 'For a random $\Delta$-dense unsatisfiable $k$-CNF. $\mathrm{D}(\mathrm{Search}(\varphi))$ *is* the minimum depth of a tree-like resolution refutation of $\varphi$ [LNNW95] -- a decision tree solving the search problem, read leaf-to-root, is exactly such a refutation. Random $k$-CNFs require resolution width $\Omega(n)$, hence depth $\Omega(n)$; and $n$ queries trivially suffice. So the $\mathrm{R} = O(1)$ upper bound above is an unbounded $\mathrm{D}$-vs-$\mathrm{R}$ separation, for a *total* relation.'}
    - {measure: D_size, value: '2^{\Theta(n)}', refs: [BenSassonWigderson01], conf: medium, note: 'Decision-tree size for the search problem equals tree-like resolution size, and the size-width tradeoff of [BenSassonWigderson01] with the $\Omega(n)$ width bound gives $2^{\Omega(n)}$ for random $k$-CNFs; $2^n$ is the trivial ceiling. Compare $\mathrm{R}=O(1)$: no bounded-error algorithm needs to know anything about $\varphi$ beyond one clause.'}
    - {measure: Dna, value: 'n', note: 'Every variable is relevant, so a non-adaptive algorithm reads the whole assignment.'}
    - {measure: Rna, value: '\Theta(1)', putative: true, note: 'Sampling a clause of $\varphi$ at random and reading its $k$ variables is non-adaptive; for a random $\Delta$-dense $\varphi$ a constant fraction of clauses is falsified by any fixed assignment, so $O(1)$ tries suffice.', conf: medium}
    - {measure: cbs, value: '\Theta(1)', putative: true, refs: [GoosPitassi14, HuynhNordstrom12, ABK21lifting], note: 'For the *random $\Delta$-dense* formula this entry is otherwise about -- **not** $\Theta(n)$. Critical block sensitivity lower-bounds the randomized cost: let $s$ be the plurality output of a bounded-error algorithm, take a critical $x$ and $b$ disjoint blocks with $s(x^B) \ne s(x)$; an algorithm that never queries inside $B$ cannot answer whp at both $x$ and $x^B$, so it must enter each block with constant probability and $\mathrm{cbs} = O(\mathrm{R})$. Here $\mathrm{R} = \Theta(1)$. [ABK21lifting] give the same conclusion through $\mathrm{cbs} = O(\mathrm{CA})$ with $\mathrm{CA} = \Theta(1)$. The famous $\mathrm{cbs} = \Theta(n)$ belongs to the **Tseitin** contradiction on a bounded-degree expander [HuynhNordstrom12, GoosPitassi14], where an assignment can falsify a single vertex constraint and random sampling therefore fails -- see [[TseitinExpander]]. Against $\mathrm{D} = \Theta(n)$ this makes the dense random formula an *unbounded* $\mathrm{D}$-vs-$\mathrm{cbs}$ separation rather than the $\Theta(1)$ ratio previously recorded.'}
    - {measure: C, value: '\Theta(1)', putative: true, note: 'The $k$ variables of a falsified clause certify that clause, so $\mathrm{C} \le k = O(1)$ at every assignment. So $\mathrm{C} = \Theta(1)$ against $\mathrm{D} = \Theta(n)$: a falsified clause is trivially *verifiable* and yet, by the resolution-depth lower bound, very far from *findable*. This is the query-complexity shadow of TFNP.'}
    - {measure: R0, value: '\Theta(1)', note: 'The witness is self-verifying (read the clause''s $k$ variables and check), so the sampling algorithm can be made never-wrong by repeating until it succeeds: $\mathrm{R}_0 = \Theta(\mathrm{R}) = \Theta(1)$. Contrast [[ApproxHW]], where there is no witness and $\mathrm{R}_0$ jumps to $\Theta(n)$.'}
    - {measure: Rbar, value: '\Theta(1)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$.'}
    - {measure: Q, value: '\Theta(1)', note: 'At most $\mathrm{R} = \Theta(1)$; at least one query.'}
    - {measure: Q0, value: '\Theta(1)', note: 'At most $\mathrm{R}_0 = \Theta(1)$; at least $\mathrm{Q}$.'}
    - {measure: Adv, value: '\Theta(1)', note: 'A lower bound on $\mathrm{Q} = \Theta(1)$.'}
    - {measure: Advpm, value: '\Theta(1)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: Dmu, value: '\Theta(1)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \Theta(1)$.'}
    - {measure: D_prod, value: '\Theta(1)', note: 'At most $\mathrm{D}_\mu = \Theta(1)$.'}
    - {measure: CA, value: '\Theta(1)', note: 'A lower bound on $\mathrm{R} = \Theta(1)$, hence $\Theta(1)$. By $\mathrm{cbs} = O(\mathrm{CA})$ [ABK21lifting] this forces [[cbs]] $= \Theta(1)$ here too: both of these adversary-flavoured measures lower-bound the *randomized* cost, so neither can see the $\Theta(n)$ deterministic cost. Only [[D_size]] and [[D]] do.'}
    - {measure: cjdeg, value: '\Theta(1)', note: 'Squeezed by $\mathrm{cjdeg} \le \mathrm{R} = \Theta(1)$ and $\mathrm{cjdeg} \ge 1$.'}
    - {measure: Np, value: '\Theta(1)', putative: true, note: 'Sample a clause and read each of its $k$ variables $O(1)$ times to beat the noise.'}
    - {measure: robustQ, value: '\Theta(1)', note: 'At most $\mathrm{N}_p = \Theta(1)$, at least $\mathrm{Q} = \Theta(1)$.'}
    - {measure: prt, value: 'O(1)', note: 'From $\mathrm{prt} \le 2\mathrm{R} = O(1)$.'}
    - {measure: rprt, value: 'O(1)', note: 'From $\overline{\mathrm{prt}} \le \mathrm{prt} = O(1)$.'}
    - {measure: C1, value: '\Theta(1)', note: 'The same $k$-variable certificate as $\mathrm{C}$: reading the variables of a falsified clause certifies that clause as a valid output.'}
    - {measure: Cmin, value: '\Theta(1)', note: 'Between $1$ and $\mathrm{C} = \Theta(1)$: the short certificate is available at *every* assignment, which is exactly why $\mathrm{R}$ and $\mathrm{cbs}$ stay constant while $\mathrm{D} = \Theta(n)$.'}
    - {measure: QE, value: 'O(n)', note: 'Only $\mathrm{Q}_E \le \mathrm{D} = O(n)$ is available. The Las Vegas value $\mathrm{Q}_0 = \Theta(1)$ does not bound it: certainty on *every* branch is what [[GroverSearch]] shows can cost the full $n$, and no lower bound better than $\Omega(1)$ is proved here.'}
    - {measure: rank, value: '\Theta(n)', conf: medium, putative: true, note: 'Decision-tree rank for $\mathrm{Search}(\varphi)$ is exactly the value of the Pudlak--Impagliazzo Prover--Delayer game, and a Delayer scoring $p$ points forces tree-like resolution size $\ge 2^{p}$. Random $\Delta$-dense $k$-CNFs admit a Delayer strategy scoring $\Omega(n)$ points, and $\mathrm{rank} \le \mathrm{D} = \Theta(n)$.'}
    - {measure: MAdv, value: '\Theta(1)', note: 'Sandwiched: $\mathrm{Adv}^{\pm} \le \mathrm{MAdv} \le \mathrm{Q}$, and both ends are $\Theta(1)$ here.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2 = \Theta(\mathrm{Adv}^{\pm}) = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: R1, value: '\Theta(1)', note: 'Squeezed: $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0 = \Theta(1)$. A falsified clause is self-certifying, so demanding a never-invalid output costs nothing.'}
    - {measure: noisyR, value: '\Theta(1)', note: 'At most $\mathrm{R} = \Theta(1)$, and at least $1$.'}
    - {measure: noisyRna, value: '\Theta(1)', note: 'Squeezed: $\mathrm{noisyR} = \Theta(1) \le \mathrm{noisyR}^{\mathrm{na}} \le \mathrm{R}^{\mathrm{na}} = \Theta(1)$.'}
    - {measure: PostQ, value: '\Theta(1)', note: 'At most $\mathrm{Q} = \Theta(1)$, and at least $1$.'}
  witnesses:
    - {of: [D, R], setting: relation, statement: 'Unbounded, for a *total* relation: $\mathrm{R}=O(1)$ but $\mathrm{D}=\Theta(n)$. Unlike [[promiseFind1]] no promise is needed -- the hardness is that a deterministic algorithm must name a *specific* falsified clause, which is a resolution refutation in disguise.', refs: [LNNW95]}
  refs: [GIPS21, CDM23, LNNW95, BenSassonWigderson01]
  see_also: [psD, ApproxHW, D_size]

- id: GapMaj
  name: Gap-Majority
  symbol: '\mathrm{GapMaj}^{\delta}_{n}'
  group: separating
  order: 49
  kind: partial
  arity: '$n$ bits'
  short: 'The universal "hardest easy" promise problem; characterises noisy randomized complexity.'
  definition: |
    Promise $\big||x| - n/2\big| \ge \delta n$; output $1$ if $|x| \ge n/2+\delta n$
    and $0$ if $|x| \le n/2-\delta n$.
  formal: '$\mathrm{GapMaj}^\delta_n(x) = \mathbb{1}[|x| > n/2]$ restricted to $\{x : \big||x|-n/2\big| \ge \delta n\}$.'
  values:
    - {measure: R,      value: '\Theta(\min(n, 1/\delta^2))', note: 'Sample $\Theta(1/\delta^2)$ coordinates and compare the empirical density with $1/2$; the lower bound is the standard bias-amplification argument (Lemma 26 of [BenDavidBlais20composition] for the $\delta = 2/\sqrt{n}$ instance, where it reads $\mathrm{R} = \Theta(n)$).', refs: [BenDavidBlais20composition]}
    - {measure: D,      value: '\Theta(n)', note: 'Independent of $\delta$, and the whole point of the example: $\mathrm{D}$ is unbounded in terms of $\mathrm{R}$ on partial functions. Adversary count: after $q$ queries returning $a$ ones, output $0$ is still consistent iff $a \le n/2-\delta n$ and output $1$ iff $a + (n-q) \ge n/2+\delta n$, so keeping both alive is possible exactly while $q \le (1-2\delta)n$ -- giving $\mathrm{D} = (1-2\delta)n + 1$ up to integrality, and $n$ queries always suffice.'}
    - {measure: noisyR, value: '\Theta(\min(n, 1/\delta^2))', putative: true, refs: [CKMPSS23], note: 'Equal to $\mathrm{R}$: buying bias buys nothing here, which is exactly why $\mathrm{GapMaj}$ is the universal inner function of [CKMPSS23] (Theorem 4: $\mathrm{noisyR}(f) = \Theta(\mathrm{R}(f \circ \mathrm{GapMaj}_n)/n)$, with their $\mathrm{GapMaj}_n$ the $\delta = 2/\sqrt{n}$ instance). Upper: $\mathrm{noisyR} \le \mathrm{R}$ always. Lower: let $\mu^{\pm}$ be uniform on the two Hamming levels, so each coordinate is marginally $\mathrm{Bern}(1/2 \pm \delta)$. A noisy query of bias $\gamma$ returns a bit distributed $\mathrm{Bern}(1/2 \pm \gamma\delta)$, and $\mathrm{KL} = O(\gamma^2\delta^2)$, while the query costs $\gamma^2$. Distinguishing $\mu^+$ from $\mu^-$ needs $\Omega(1)$ total divergence, so the cost $\sum_j \gamma_j^2$ is $\Omega(1/\delta^2)$.'}
    - {measure: Q,      value: '\Theta(\min(n, 1/\delta))', note: 'Amplitude estimation of $|x|/n$ to additive $\delta$; the matching lower bound is the usual approximate-counting bound of [NayakWu99]. So the promise buys a quadratic quantum speed-up over $\mathrm{R}$, the same one as for approximate counting.', refs: [NayakWu99]}
    - {measure: LR, value: '\Theta\!\big(\sqrt{\mathrm{R}}\big) = \Theta\!\big(\min(\sqrt n, 1/\delta)\big)', refs: [BBGM22], conf: medium, note: 'The extreme case of the $\Omega(\sqrt{\mathrm{R}}) \le \mathrm{LR} \le \mathrm{R}$ sandwich, and the reason the measure was introduced: a single query already gives bias $\Theta(\delta)$ towards the answer, and $\mathrm{LR}$ charges $1/\gamma$ rather than $1/\gamma^2$ for bias $\gamma$. So gapped majority is cheap for $\mathrm{LR}$ and expensive for $\mathrm{R}$, which is exactly the slack that makes randomized composition fail.'}
    - {measure: chibar, value: '\Theta\!\big(\min(\sqrt n, 1/\delta)\big)', refs: [GLSS19], conf: medium, note: 'At most $\mathrm{LR}$, and at least $\Omega(\sqrt{\mathrm{R}})$ -- the bound $\mathrm{R} = O(\bar\chi^2)$ holds for partial $g$, unlike its $\chi$ analogue -- so both ends meet. Since $\bar\chi$ is the quantity that appears in the composition theorem $\mathrm{R}(f \circ g^n) = \Omega(\mathrm{R}(f)\bar\chi(g))$, gapped majority as an *inner* function loses a square root -- which is precisely why $\mathrm{R}$ does not compose.'}
    - {measure: C,      value: '\Theta(n)', note: 'Exactly $n/2 - \delta n + 1$ on both sides, for every $\delta$. A $1$-certificate must fix that many ones: fix fewer and setting all free coordinates to $0$ leaves a completion that is still inside the promise and is a $0$-input. Symmetrically for $\mathrm{C}^0$. Note this is *not* $\Theta(\mathrm{D})$ by accident -- here $\mathrm{C}$, $\mathrm{C}^0$, $\mathrm{C}^1$ and $\mathrm{D}$ all coincide up to the additive $1$.'}
    - {measure: bs,     value: '\Theta(\min(n, 1/\delta))', note: 'Every sensitive block at a promise input must move at least $2\delta n$ coordinates, so disjoint blocks number at most $1/(2\delta)$; and at an input of weight exactly $n/2+\delta n$ that many disjoint blocks of $2\delta n$ ones each do flip the answer.'}
    - {measure: s,      value: '0', putative: true, note: 'Whenever $2\delta n > 1$. A single flip moves $|x|$ by one, and the value only changes on crossing $n/2$, which the promise puts $2\delta n$ away; so the flipped input is either outside the promise or has the same value. Sensitivity is therefore *identically zero* while $\mathrm{bs} = \Theta(\min(n,1/\delta))$ and $\mathrm{D} = \Theta(n)$: the promise-function counterexample to every bound with $\mathrm{s}$ on the small side.'}
    - {measure: Cmin,   value: '\Theta(n)', note: 'Every certificate on either side has $n/2-\delta n+1$ coordinates, so the min over inputs equals the max: $\mathrm{C}_{\min} = \mathrm{C} = \mathrm{D}$ up to $\pm 1$.'}
    - {measure: R0,     value: '\Theta(n)', putative: true, note: 'A zero-error run must end on a certificate, so $\mathrm{R}_0 \ge \mathrm{C} = \Theta(n)$; and $\mathrm{R}_0 \le \mathrm{D}$. At constant $\delta$ this is an unbounded $\mathrm{R}_0$-vs-$\mathrm{R}$ gap.'}
    - {measure: Dna,    value: '\Theta(n)', note: 'Between $\mathrm{D} = \Theta(n)$ and the trivial $n$; the adversary count for $\mathrm{D}$ never used adaptivity anyway.'}
    - {measure: Rna,    value: '\Theta(\min(n, 1/\delta^2))', note: 'Sampling is non-adaptive, and $\mathrm{R}^{\mathrm{na}} \ge \mathrm{R}$.'}
    - {measure: noisyRna, value: '\Theta(\min(n, 1/\delta^2))', refs: [BenDavidBlais20composition], note: 'Squeezed between $\mathrm{noisyR}$ and $\mathrm{R}^{\mathrm{na}}$, which coincide here; equivalently, Theorem 8 of [BenDavidBlais20composition] applied to a partial function. Every corner of the square -- adaptive or not, noisy or not -- costs $\Theta(\min(n,1/\delta^2))$, which is part of what makes $\mathrm{GapMaj}$ the right universal inner function.'}
    - {measure: Rbar,   value: '\Theta(\min(n, 1/\delta^2))', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: s0,     value: '0', putative: true, note: 'See $\mathrm{s}$: identically zero on both sides, whenever $2\delta n > 1$.'}
    - {measure: s1,     value: '0', putative: true, note: 'See $\mathrm{s}$: identically zero on both sides, whenever $2\delta n > 1$.'}
    - {measure: bs0,    value: '\Theta(\min(n, 1/\delta))', putative: true, note: 'The count in $\mathrm{bs}$ is symmetric under complementation, so $\mathrm{bs}^0 = \mathrm{bs}^1 = \mathrm{bs}$: at an input of weight exactly $n/2-\delta n$, disjoint blocks of $2\delta n$ zeros each flip the answer, and no sensitive block is smaller.'}
    - {measure: bs1,    value: '\Theta(\min(n, 1/\delta))', putative: true, note: 'See $\mathrm{bs}^0$.'}
    - {measure: C0,     value: '\Theta(n)', note: 'Exactly $n/2-\delta n+1$; see $\mathrm{C}$, which is attained on both sides.'}
    - {measure: C1,     value: '\Theta(n)', note: 'Exactly $n/2-\delta n+1$; see $\mathrm{C}$, which is attained on both sides.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph on the promise has no edges at all (see $\mathrm{s}=0$), so $\lambda = 0$ while $\deg = \Theta(n)$. Huang''s theorem $\deg \le \lambda^2$ is a total-function statement and $\mathrm{GapMaj}$ breaks it as badly as arithmetic allows.'}
    - {measure: UC,     value: '\Theta(n)', putative: true, note: 'Squeezed between $\mathrm{C}$ and $\mathrm{D}$, both $\Theta(n)$.'}
    - {measure: UCmin,  value: '\Theta(n)', putative: true, note: 'Squeezed between $\mathrm{C}_{\min}$ and $\mathrm{UC}$, both $\Theta(n)$.'}
    - {measure: SP,     value: '\Theta(n)', putative: true, note: 'Squeezed between $\mathrm{C}$ and $\mathrm{D}$, both $\Theta(n)$.'}
    - {measure: rank,   value: '\Theta(n)', putative: true, note: 'Squeezed between $\mathrm{C}_{\min}$ and $\mathrm{D}$, both $\Theta(n)$: with every certificate of full length there is no caterpillar structure to exploit.'}
    - {measure: D_size, value: '2^{\Theta(n)}', putative: true, note: 'Every leaf subcube has codimension $\ge \mathrm{C}_{\min} = \Theta(n)$, giving $2^{\Omega(n)}$ leaves; and $\mathrm{DTsize} \le 2^{\mathrm{D}}$.'}
    - {measure: deg,    value: '\Theta(n)', putative: true, note: 'Exact degree ignores the promise gap entirely. Symmetrising, an exactly representing polynomial gives a univariate $p$ with $p(t) = 0$ for all $\lfloor n/2-\delta n\rfloor + 1$ integers $t \le n/2-\delta n$, so $\deg \ge (1/2-\delta)n$; and $\deg \le \mathrm{D} = \Theta(n)$. Against $\widetilde{\deg} = \Theta(\min(n,1/\delta))$ this is the cleanest $\deg$-vs-$\widetilde{\deg}$ gap there is.'}
    - {measure: adeg,   value: '\Theta(\min(n, 1/\delta))', refs: [NayakWu99], conf: medium, note: 'The Nayak-Wu lower bound for approximate counting is a *degree* bound, so it gives $\widetilde{\deg} = \Omega(\min(n,1/\delta))$; and $\widetilde{\deg} \le 2\mathrm{Q} = O(\min(n,1/\delta))$.'}
    - {measure: QE,     value: '\Theta(n)', putative: true, note: 'Exactness is as expensive as determinism: $\mathrm{Q}_E \ge \deg/2 = \Omega(n)$ and $\mathrm{Q}_E \le \mathrm{D} = \Theta(n)$. At constant $\delta$ this is an unbounded $\mathrm{Q}_E$-vs-$\mathrm{Q}$ gap.'}
    - {measure: RC,     value: '\Theta(\min(n, 1/\delta))', note: '$\mathrm{RC} = \Theta(\mathrm{fbs})$.'}
    - {measure: FC,     value: '\Theta(\min(n, 1/\delta))', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: Dmu,    value: '\Theta(\min(n, 1/\delta^2))', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R}$.'}
    - {measure: D_prod, value: '0', putative: true, note: 'The support of a product distribution is a subcube: some coordinates are fixed, the rest free. If the fixed part has weight $w$ and there are $m$ free coordinates, the weights realised in the subcube are exactly the integers in $[w, w+m]$, an unbroken interval. Meeting both sides of the promise would mean the interval contains a weight $\le n/2 - \delta n$ and a weight $\ge n/2 + \delta n$, hence also every weight strictly between -- and those points are off the promise. So every product $\mu$ is one-sided and $\mathrm{D}^\mu = 0$, against $\mathrm{R} = \Theta(\min(n, 1/\delta^2))$. See [[Forrelation]].'}
    - {measure: Np,     value: '\Theta(\min(n, 1/\delta^2))', putative: true, note: 'Read each sampled coordinate $O(1)$ times and majority-vote: $\mathrm{N}_p = O(\mathrm{R})$, and $\mathrm{N}_p \ge \mathrm{R}$ always.'}
    - {measure: Advpm,  value: '\Theta(\min(n, 1/\delta))', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$.'}
    - {measure: MAdv,   value: '\Theta(\min(n, 1/\delta))', note: 'Sandwiched between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}$.'}
    - {measure: gamma2, value: '\Theta(\min(n, 1/\delta))', note: '$\gamma_2 = \Theta(\mathrm{Q})$.'}
    - {measure: CA,     value: '\Theta(\min(n, 1/\delta))', putative: true, refs: [CGLMSG23], note: 'Upper *and* lower, and neither uses a total-function theorem. Lower: $\mathrm{CA} \ge \mathrm{fbs} = \Theta(\min(n,1/\delta))$, which does survive on partial functions ([[CA]], settings note). Upper: $\mathrm{CA} = \Theta(\mathrm{CG}^{\mathrm{pub}})$ and the shared-random-index strategy below wins with probability $2\delta$. So $\mathrm{CA}$ sees the $\Theta(1/\delta)$ but not the $\Theta(1/\delta^2)$ of $\mathrm{R}$: the classical adversary bound is quadratically weak exactly where bias-amplification is the real cost.'}
    - {measure: CGpub,  value: '\Theta(\min(n, 1/\delta))', putative: true, refs: [CGLMSG23], note: 'Both players output the *same* uniformly random index. Inputs of different value differ in at least $2\delta n$ of the $n$ coordinates, so they win with probability $\ge 2\delta$ and $\mathrm{CG}^{\mathrm{pub}} \le 1/(2\delta)$; and $\mathrm{CG}^{\mathrm{pub}} \ge \mathrm{fbs}$.'}
    - {measure: CGstar, value: '\Theta(\min(n, 1/\delta))', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{ns}}, \mathrm{CG}^{*}, \mathrm{CG}^{\mathrm{pub}}$ collapse to $\Theta(\mathrm{CA})$ [CGLMSG23]; only the private-coin game escapes.'}
    - {measure: CGns,   value: '\Theta(\min(n, 1/\delta))', refs: [CGLMSG23], note: 'See $\mathrm{CG}^{*}$.'}
    - {measure: EC,     value: 'O(\sqrt{n/\delta})', putative: true, note: 'Uniform weights $w^x_i = (2\delta n)^{-1/2}$ at every input: two inputs of different value differ in $\ge 2\delta n$ coordinates, so their weighted product is $\ge 1$, at total cost $n/\sqrt{2\delta n} = \sqrt{n/(2\delta)}$. From below $\mathrm{EC} = \Omega(1/\delta)$: given weights of total mass $k$, take $x$ of weight $n/2+\delta n$ and let $\Delta$ be the $2\delta n$ *lightest* ones of $x$, whose total $w^x$-mass is at most $k\cdot 2\delta n/(n/2) = 4\delta k$; flipping them gives a $0$-input, and the constraint forces $4\delta k \ge 1$. So at constant $\delta$, $\mathrm{EC} = \Omega(1)$ and $O(\sqrt n)$ while $\mathrm{CA} = \Theta(1)$: the textbook chains $\mathrm{EC} \le \mathrm{C}$ and $\mathrm{R}_0 = O(\mathrm{EC}^2)$ are total-function statements and are not used.'}
    - {measure: PDT,    value: '\Theta(n)', putative: true, note: 'Parity queries are no better than plain ones. After $q$ parity queries the consistent inputs form an affine space $A$ of dimension $n-q$; picking $n-q$ free coordinates, $A$ contains an input of weight $\le q$ and one of weight $\ge n-q$. If $q < n/2-\delta n$ these are a $0$-input and a $1$-input of the promise, so no leaf can decide, giving $\mathrm{D}^{\oplus} \ge (1/2-\delta)n$; and $\mathrm{D}^{\oplus} \le \mathrm{D} = \Theta(n)$.'}
    - {measure: Q0,     value: '\Theta(n)', putative: true, note: 'Zero-error quantum is as expensive as determinism. If a $T$-query algorithm outputs $1$ with probability $p(x) \ge 1/2$ on $1$-inputs and $p(x) = 0$ on $0$-inputs, then $p$ is a non-negative polynomial of degree $\le 2T$, so its symmetrisation $\tilde p(t) = \mathbb{E}_{|x|=t}[p(x)]$ is a genuine univariate polynomial of degree $\le 2T$ vanishing at every integer $t \le n/2-\delta n$ -- that is $(1/2-\delta)n$ distinct roots -- and positive at $t \ge n/2+\delta n$. Hence $\mathrm{Q}_0 \ge (1/4-\delta/2)n$, and $\mathrm{Q}_0 \le \mathrm{R}_0 = \Theta(n)$. Against $\mathrm{Q} = \Theta(\min(n,1/\delta))$ this is an unbounded gap at constant $\delta$.'}
    - {measure: ndeg,   value: '\Theta(n)', putative: true, note: 'Same symmetrisation, applied to $p^2$: if $p$ is nonzero exactly on the $1$-inputs then $q(t) = \mathbb{E}_{|x|=t}[p(x)^2]$ is a non-negative univariate polynomial of degree $\le 2\,\mathrm{ndeg}$ vanishing at all $(1/2-\delta)n$ integers $t \le n/2-\delta n$ and nonzero above $n/2+\delta n$, so $\mathrm{ndeg} \ge (1/4-\delta/2)n$; and $\mathrm{ndeg} \le \mathrm{C}^1 = \Theta(n)$.'}
    - {measure: NQ,     value: '\Theta(n)', note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil = \Theta(n)$: nondeterministic quantum queries do not see the promise gap either.'}
    - {measure: rdeg,   value: '\Theta(n)', note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\} = \Theta(n)$, the two sides being symmetric. *Exact* rational approximation is therefore as hard as exact polynomial representation here, even though $\mathrm{rdeg}_{\varepsilon} = O(\min(n,1/\delta))$.'}
    - {measure: ardeg,  value: 'O(\min(n, 1/\delta))', note: '$\mathrm{rdeg}_\varepsilon \le \widetilde{\deg}_\varepsilon = O(\min(n,1/\delta))$. Contrast the exact $\mathrm{rdeg} = \Theta(n)$.'}
    - {measure: PostQ,  value: 'O(\min(n, 1/\delta))', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = O(\min(n,1/\delta))$; postselection does not obviously help a problem that amplitude estimation already solves at that cost.'}
    - {measure: sdeg,   value: '1', note: 'The single polynomial $p(x) = \sum_i x_i - n/2$ has the right sign at every promise input, whatever $\delta$ is. So $\mathrm{sdeg} = 1$ against $\deg = \Theta(n)$ and $\widetilde{\deg} = \Theta(\min(n,1/\delta))$ -- unbounded-error (the $\mathsf{PP}$ analogue) trivialises gapped majority.'}
    - {measure: odeg,   value: 'O(\min(n, 1/\delta))', note: 'Between $\mathrm{sdeg} = 1$ and $\widetilde{\deg} = \Theta(\min(n,1/\delta))$. For $\delta \ge 1/8$ a degree-$1$ one-sided approximation exists, so the lower end is attained at constant $\delta$.'}
    - {measure: R1,     value: '\Theta(n)', note: 'Squeezed: $\mathrm{R}^1 \ge \mathrm{C}^1 = \Theta(n)$ (a certain "yes" must exhibit a $1$-certificate) and $\mathrm{R}^1 \le \mathrm{R}_0 = \Theta(n)$. One-sided error is already as expensive as no error at all.'}
    - {measure: QC,     value: '\Theta(\sqrt{\min(n, 1/\delta)})', refs: [Aaronson08], note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{fbs}})$, with $\mathrm{fbs} = \Theta(\min(n,1/\delta))$; and independently $\mathrm{QC} \le \mathrm{Q}$.'}
    - {measure: chi,    value: 'O(\min(\sqrt n, 1/\delta))', note: '$\chi \le \bar\chi$. The matching lower bounds $\chi = \Omega(\mathrm{bs})$ [Li18] and $\mathrm{R} = O(\chi^2)$ are both *total*-function statements -- and the first is false here, since $\mathrm{bs} = \Theta(\min(n,1/\delta))$ can be quadratically larger.'}
    - {measure: RS,     value: 'O(\min(\sqrt n, 1/\delta))', note: '$\mathrm{RS} = O(\bar\chi)$. Together with $\mathrm{CA} \le \mathrm{RS}$ this pins $\mathrm{RS} = \Theta(1/\delta)$ in the standard regime $\delta \ge 1/\sqrt n$. Note $\mathrm{R} = O(\mathrm{RS}^2\log \mathrm{RS})$ is a total-function statement, and gapped majority is exactly where it fails.'}
    - {measure: Rstar,  value: 'O(\min(n, 1/\delta^2))', note: '$\mathrm{R}^{*} \le \mathrm{R}$, and $\mathrm{R}^{*} = \Omega(\mathrm{Q}) = \Omega(\min(n,1/\delta))$ because quantum query complexity composes perfectly. Whether the limit sits at $\mathrm{R}$ or at $\mathrm{Q}$ is exactly the open question of [BBGM22].'}
    - {measure: cjdeg,  value: 'O(\min(n, 1/\delta^2))', note: 'Between $\widetilde{\deg} = \Theta(\min(n,1/\delta))$ and $\mathrm{R} = \Theta(\min(n,1/\delta^2))$; the conical-junta relaxation is not known to close that quadratic gap here.'}
    - {measure: prt,    value: 'O(\min(n, 1/\delta^2))', note: '$\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon$; from below $(1-4\varepsilon)\mathrm{CA} \le \mathrm{prt}_\varepsilon + \log(1/\varepsilon)$ gives $\Omega(\min(n,1/\delta))$.'}
    - {measure: rprt,   value: 'O(\min(n, 1/\delta^2))', note: '$\overline{\mathrm{prt}} \le \mathrm{prt}$.'}
    - {measure: robustQ, value: '\widetilde\Theta(\min(n, 1/\delta))', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log\mathrm{Q})$.'}
    - {measure: Adv,    value: 'O(\min(n, 1/\delta))', note: '$\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = \Theta(\min(n,1/\delta))$. The positive adversary is not obstructed here the way it is at [[Collision]] -- the certificate barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = \Theta(n)$ is not binding -- but no matching lower bound is recorded.'}
    - {measure: fbs,    value: '\Theta(\min(n, 1/\delta))', note: 'Same counting, fractionally: $2\delta n\sum_B w_B \le \sum_i\sum_{B \ni i} w_B \le n$. So $\mathrm{fbs} = \Theta(\mathrm{bs}) = O(1)$ at constant $\delta$ while $\mathrm{C} = \Theta(n)$ -- the promise-function counterexample to $\mathrm{C} = O(\mathrm{fbs}^2)$ and to $\mathrm{C} = O(\mathrm{RC}^2)$.'}
    - {measure: psD, value: '\Theta(\min(n, 1/\delta^2))', note: 'Degenerate on a partial Boolean function: $\mathrm{psD} = \Theta(\mathrm{R})$.'}
    - {measure: cbs, value: '\Theta(\min(n, 1/\delta))', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs} = \Theta(\min(n,1/\delta))$.'}
    - {measure: CG, value: '\Omega(n)', putative: true, note: 'Private coins, and unlike $\mathrm{CG}^{\mathrm{pub}} = \Theta(\min(n,1/\delta))$ it does not shrink with $\delta$. Upper: each player outputs a uniformly random position on which its own input is $1$ (resp. $0$); the two inputs differ on $\ge 2\delta n$ such positions, giving $\mathrm{CG} = O(n/\delta)$. Lower: fix the $1$-player at $x$ with output distribution $p$, and let the $0$-player hold $y$ obtained from $x$ by zeroing the $2\delta n$ positions of $\mathrm{supp}(x)$ carrying the least $p$-mass. The win probability is at most $\max_{i \in \Delta} p(i)$, and the $2\delta n$-th smallest of the $\ge n/2$ values $\{p(i) : x_i = 1\}$ is at most $2/n$. So $\mathrm{CG} \ge n/2$. At constant $\delta$ this is $\Theta(n)$ against $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$: private randomness is the one variant of the four that escapes the collapse to $\mathrm{CA}$.'}
  witnesses:
    - {of: [D, R], setting: partial, statement: 'At constant $\delta$, $\mathrm{D} = \Theta(n)$ while $\mathrm{R} = \Theta(1)$: the standard proof that $\mathrm{D}$ is unbounded in terms of $\mathrm{R}$ on partial functions.'}
    - {of: [R, Q], setting: partial, statement: 'Quadratic: $\mathrm{R} = \Theta(1/\delta^2)$ against $\mathrm{Q} = \Theta(1/\delta)$, the approximate-counting speed-up in its cleanest form.', refs: [NayakWu99]}
    - {of: [C, fbs], setting: partial, statement: 'At constant $\delta$, $\mathrm{C} = \Theta(n)$ while $\mathrm{fbs} = O(1)$: rounding a fractional certificate is a total-function argument.'}
    - {of: [bs, s], setting: partial, statement: 'Unbounded: $\mathrm{s} = 0$ identically (the promise gap is wider than one flip) while $\mathrm{bs} = \Theta(\min(n,1/\delta))$. Every measure sitting above $\mathrm{s}$ is unbounded in terms of it on partial functions, and $\mathrm{GapMaj}$ says so in one line.'}
    - {of: [R0, R], setting: partial, statement: 'At constant $\delta$, unbounded: $\mathrm{R} = \Theta(1)$ but $\mathrm{R}_0 = \Theta(n)$, because certainty forces a full certificate.'}
  refs: [BenDavidBlais20composition, BenDavidBlais20minimax, BBGM22]
  see_also: [noisyR, R, LR, chibar, ApproxIndex, GapMajConst]

# [[GapMaj]] above is a two-parameter family, and every value that depends on
# $\delta$ is invisible to the derived layer: it needs one free variable per
# family, so all forty of the \Theta(\min(n,1/\delta^k)) entries are dropped
# and only the delta-free \Theta(n) ones survive. The whole point of the
# function is what happens at constant \delta, so the constant-gap instance is
# recorded here as a function in its own right. Nothing below is new
# mathematics: it is GapMaj at \delta = 1/4, one value at a time.
- id: GapMajConst
  name: Gap-Majority at constant gap
  symbol: '\mathrm{GapMaj}^{1/4}_{n}'
  group: separating
  order: 49.1
  kind: partial
  arity: '$n$ bits'
  scale: {var: n}
  short: 'The $\delta = 1/4$ instance of Gap-Majority: $\Theta(1)$ for every bounded-error measure, $\Theta(n)$ for every exact one.'
  definition: |
    Promise $\big||x| - n/2\big| \ge n/4$; output $1$ if $|x| \ge 3n/4$ and $0$ if
    $|x| \le n/4$. This is [[GapMaj]] with the gap parameter frozen at
    $\delta = 1/4$, and it is the instance that does the separating: every
    $\Theta(\min(n,1/\delta))$ or $\Theta(\min(n,1/\delta^2))$ entry of the
    general family collapses to $\Theta(1)$ here, while the $\delta$-free
    entries stay at $\Theta(n)$.
  formal: '$\mathrm{GapMaj}^{1/4}_n(x) = \mathbb{1}[|x| > n/2]$ restricted to $\{x : \big||x|-n/2\big| \ge n/4\}$.'
  values:
    # --- delta-free: the exact / certificate side, all Theta(n) ------------
    - {measure: D,      value: '\Theta(n)', note: 'Exactly $n/2 + 1$ up to integrality, by the adversary count of [[GapMaj]] at $\delta = 1/4$: an adversary answering queries can keep both outputs alive for $(1-2\delta)n = n/2$ queries.'}
    - {measure: C,      value: '\Theta(n)', note: 'Exactly $n/4 + 1$ on both sides: a $1$-certificate must exhibit that many ones, or setting every free coordinate to $0$ leaves a $0$-input of the promise.'}
    - {measure: C0,     value: '\Theta(n)', note: 'See $\mathrm{C}$; attained on both sides.'}
    - {measure: C1,     value: '\Theta(n)', note: 'See $\mathrm{C}$; attained on both sides.'}
    - {measure: Cmin,   value: '\Theta(n)', note: 'Every certificate has the same length, so the min over inputs equals the max.'}
    - {measure: Dna,    value: '\Theta(n)', note: 'Between $\mathrm{D}$ and $n$; the adversary count never used adaptivity.'}
    - {measure: R0,     value: '\Theta(n)', putative: true, note: 'A zero-error run must end on a certificate, so $\mathrm{R}_0 \ge \mathrm{C} = \Theta(n)$; and $\mathrm{R}_0 \le \mathrm{D}$. Against $\mathrm{R} = \Theta(1)$ this is the unbounded $\mathrm{R}_0$-vs-$\mathrm{R}$ separation on partial functions.'}
    - {measure: R1,     value: '\Theta(n)', note: 'Squeezed between $\mathrm{C}^1$ and $\mathrm{R}_0$.'}
    - {measure: UC,     value: '\Theta(n)', putative: true, note: 'Between $\mathrm{C}$ and $\mathrm{D}$.'}
    - {measure: UCmin,  value: '\Theta(n)', putative: true, note: 'Between $\mathrm{C}_{\min}$ and $\mathrm{UC}$.'}
    - {measure: SP,     value: '\Theta(n)', putative: true, note: 'Between $\mathrm{C}$ and $\mathrm{D}$.'}
    - {measure: rank,   value: '\Theta(n)', putative: true, note: 'Between $\mathrm{C}_{\min}$ and $\mathrm{D}$: with every certificate of full length there is no caterpillar structure to exploit.'}
    - {measure: PDT,    value: '\Theta(n)', putative: true, note: 'Parity queries do not help: after $q < n/4$ of them the consistent affine space still contains inputs of both values. See [[GapMaj]].'}
    - {measure: D_size, value: '2^{\Theta(n)}', putative: true, note: 'Every leaf subcube has codimension $\ge \mathrm{C}_{\min} = \Theta(n)$; and $\mathrm{DTsize} \le 2^{\mathrm{D}}$.'}
    - {measure: deg,    value: '\Theta(n)', putative: true, note: 'Exact degree ignores the promise gap: symmetrising an exactly representing polynomial gives a univariate with $\Theta(n)$ forced roots. Against $\widetilde{\deg} = \Theta(1)$ this is the cleanest $\deg$-vs-$\widetilde{\deg}$ gap there is.'}
    - {measure: QE,     value: '\Theta(n)', putative: true, note: 'Exactness costs as much as determinism: $\mathrm{Q}_E \ge \deg/2$ and $\mathrm{Q}_E \le \mathrm{D}$. Against $\mathrm{Q} = \Theta(1)$, unbounded.'}
    - {measure: Q0,     value: '\Theta(n)', putative: true, note: 'The polynomial argument of [[GapMaj]]: a zero-error algorithm''s acceptance polynomial symmetrises to a non-negative univariate with $\Theta(n)$ roots. Against $\mathrm{Q} = \Theta(1)$, unbounded.'}
    - {measure: ndeg,   value: '\Theta(n)', putative: true, note: 'Same symmetrisation applied to $p^2$; and $\mathrm{ndeg} \le \mathrm{C}^1$.'}
    - {measure: NQ,     value: '\Theta(n)', note: '$\mathrm{NQ} = \lceil\mathrm{ndeg}/2\rceil$.'}
    - {measure: rdeg,   value: '\Theta(n)', note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}$, the two sides being symmetric. Against $\mathrm{rdeg}_\varepsilon = \Theta(1)$ and $\mathrm{Q} = \Theta(1)$: on *partial* functions rational degree is unbounded in terms of everything bounded-error, which is why [[open-rdeg]] is a total-function question.'}
    - {measure: CG,     value: '\Theta(n)', putative: true, note: 'Private coins, and unlike $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$ it does not shrink with the gap: see the two-sided argument at [[GapMaj]].'}
    # --- s and friends vanish outright ------------------------------------
    - {measure: s,      value: '0', putative: true, note: 'A single flip moves $|x|$ by one and the promise puts the two sides $n/2$ apart, so no promise input has a sensitive coordinate at all.'}
    - {measure: s0,     value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: s1,     value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph on the promise has no edges, so $\lambda = 0$ while $\deg = \Theta(n)$. Huang''s $\deg \le \lambda^2$ is a total-function theorem and this breaks it as badly as arithmetic allows.'}
    - {measure: D_prod, value: '0', putative: true, note: 'The support of a product distribution is a subcube, whose realisable Hamming weights form an unbroken interval; an interval meeting both sides of the promise would have to contain the forbidden middle. So every product $\mu$ is one-sided.'}
    # --- everything bounded-error collapses to a constant ------------------
    - {measure: R,      value: '\Theta(1)', refs: [BenDavidBlais20composition], note: 'Sample $O(1)$ coordinates and take the empirical majority; $\Theta(1/\delta^2)$ at $\delta = 1/4$. Against $\mathrm{D} = \Theta(n)$ this is the standard proof that $\mathrm{D}$ is unbounded in terms of $\mathrm{R}$ on partial functions.'}
    - {measure: bs,     value: '1', note: 'A sensitive block must move at least $2\delta n = n/2$ coordinates, and an input of weight $3n/4$ has room for exactly one such block.'}
    - {measure: bs0,    value: '1', putative: true, note: 'Symmetric under complementation; see $\mathrm{bs}$.'}
    - {measure: bs1,    value: '1', putative: true, note: 'See $\mathrm{bs}^0$.'}
    - {measure: fbs,    value: '\Theta(1)', note: 'At most $1/(2\delta) = 2$ by the counting $2\delta n\sum_B w_B \le n$. So $\mathrm{fbs} = \Theta(1)$ against $\mathrm{C} = \Theta(n)$: the promise counterexample to $\mathrm{C} = O(\mathrm{fbs}^2)$.'}
    - {measure: RC,     value: '\Theta(1)', note: '$\mathrm{RC} = \Theta(\mathrm{fbs})$.'}
    - {measure: FC,     value: '\Theta(1)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: cbs,    value: '\Theta(1)', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs}$.'}
    - {measure: Q,      value: '\Theta(1)', refs: [NayakWu99], note: 'Amplitude estimation to additive $\delta$; at constant $\delta$, $O(1)$ queries.'}
    - {measure: adeg,   value: '\Theta(1)', refs: [NayakWu99], conf: medium, note: '$\widetilde{\deg} \le 2\mathrm{Q} = O(1)$, and the Nayak-Wu counting bound is a degree bound.'}
    - {measure: noisyR, value: '\Theta(1)', putative: true, refs: [CKMPSS23], note: 'Equal to $\mathrm{R}$: buying bias buys nothing here. See [[GapMaj]].'}
    - {measure: Rna,    value: '\Theta(1)', note: 'Sampling is non-adaptive.'}
    - {measure: noisyRna, value: '\Theta(1)', refs: [BenDavidBlais20composition], note: 'Every corner of the adaptive/noisy square costs $\Theta(1)$ here.'}
    - {measure: Rbar,   value: '\Theta(1)', note: '$\bar{\mathrm{R}}_\varepsilon = \Theta(\mathrm{R}_\varepsilon)$ for every $f$.'}
    - {measure: Dmu,    value: '\Theta(1)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R}$.'}
    - {measure: Np,     value: '\Theta(1)', putative: true, note: 'Between $\mathrm{R}$ and $O(\mathrm{R})$: read each sampled coordinate $O(1)$ times and vote.'}
    - {measure: psD,    value: '\Theta(1)', note: 'Degenerate on a partial Boolean function: $\mathrm{psD} = \Theta(\mathrm{R})$.'}
    - {measure: LR,     value: '\Theta(1)', refs: [BBGM22], conf: medium, note: '$\Omega(\sqrt{\mathrm{R}}) \le \mathrm{LR} \le \mathrm{R}$, and both ends are constant.'}
    - {measure: chibar, value: '\Theta(1)', refs: [GLSS19], conf: medium, note: 'Between $\Omega(\sqrt{\mathrm{R}})$ and $\mathrm{LR}$.'}
    - {measure: QC,     value: '\Theta(1)', refs: [Aaronson08], note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{fbs}})$.'}
    - {measure: Advpm,  value: '\Theta(1)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$.'}
    - {measure: MAdv,   value: '\Theta(1)', note: 'Between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}$.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2 = \Theta(\mathrm{Q})$.'}
    - {measure: CA,     value: '\Theta(1)', putative: true, refs: [CGLMSG23], note: 'Between $\mathrm{fbs}$ and $\mathrm{CG}^{\mathrm{pub}}$, both constant.'}
    - {measure: CGpub,  value: '\Theta(1)', putative: true, refs: [CGLMSG23], note: 'Both players output the same uniformly random index; inputs of different value differ in $\ge n/2$ coordinates, so they win with probability $\ge 1/2$.'}
    - {measure: CGstar, value: '\Theta(1)', refs: [CGLMSG23], note: 'All of $\mathrm{CG}^{\mathrm{ns}},\mathrm{CG}^{*},\mathrm{CG}^{\mathrm{pub}}$ collapse to $\Theta(\mathrm{CA})$.'}
    - {measure: CGns,   value: '\Theta(1)', refs: [CGLMSG23], note: 'See $\mathrm{CG}^{*}$.'}
    - {measure: robustQ, value: '\Theta(1)', note: 'Between $\mathrm{Q}$ and $O(\mathrm{Q}\log\mathrm{Q})$.'}
    - {measure: sdeg,   value: '1', note: '$p(x) = \sum_i x_i - n/2$ has the right sign at every promise input. Against $\deg = \Theta(n)$: unbounded error trivialises gapped majority.'}
    - {measure: odeg,   value: '1', note: 'At $\delta \ge 1/8$ a degree-$1$ one-sided approximation exists, so $\mathrm{odeg}$ meets $\mathrm{sdeg}$ at the bottom.'}
    # --- upper bounds only -------------------------------------------------
    - {measure: ardeg,  value: 'O(1)', note: '$\mathrm{rdeg}_\varepsilon \le \widetilde{\deg} = O(1)$. Contrast the exact $\mathrm{rdeg} = \Theta(n)$: on partial functions the two versions of rational degree are unboundedly far apart.'}
    - {measure: PostQ,  value: 'O(1)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = O(1)$.'}
    - {measure: Adv,    value: 'O(1)', note: '$\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$.'}
    - {measure: chi,    value: 'O(1)', note: '$\chi \le \bar\chi$. The total-function bound $\chi = \Omega(\mathrm{bs})$ is false here.'}
    - {measure: RS,     value: 'O(1)', note: '$\mathrm{RS} = O(\bar\chi)$. Note $\mathrm{R} = O(\mathrm{RS}^2\log\mathrm{RS})$ is a total-function statement.'}
    - {measure: Rstar,  value: 'O(1)', note: '$\mathrm{R}^{*} \le \mathrm{R}$.'}
    - {measure: cjdeg,  value: 'O(1)', note: 'Between $\widetilde{\deg}$ and $\mathrm{R}$.'}
    - {measure: prt,    value: 'O(1)', note: '$\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon$.'}
    - {measure: rprt,   value: 'O(1)', note: '$\overline{\mathrm{prt}} \le \mathrm{prt}$.'}
    - {measure: EC,     value: 'O(\sqrt n)', putative: true, note: 'Uniform weights $w^x_i = (n/2)^{-1/2}$: two inputs of different value differ in $\ge n/2$ coordinates, so their weighted product is $\ge 1$, at total cost $\sqrt{2n}$. From below $\mathrm{EC} = \Omega(1)$ only, so this cell is not pinned -- but $O(\sqrt n)$ against $\mathrm{C} = \Theta(n)$ already refutes $\mathrm{EC} \le \mathrm{C}$-style tightness and, with $\mathrm{R}_0 = \Theta(n)$, refutes $\mathrm{R}_0 = O(\mathrm{EC}^2)$ on promises.'}
  witnesses:
    - {of: [D, R],      setting: partial, statement: 'Unbounded: $\mathrm{D} = \Theta(n)$ against $\mathrm{R} = \Theta(1)$. The standard example, now readable by the derived layer.'}
    - {of: [R0, R],     setting: partial, statement: 'Unbounded: certainty forces a full certificate, $\mathrm{R}_0 = \Theta(n)$, while $\mathrm{R} = \Theta(1)$.'}
    - {of: [QE, Q],     setting: partial, statement: 'Unbounded: $\mathrm{Q}_E = \Theta(n)$ against $\mathrm{Q} = \Theta(1)$. Same for $\mathrm{Q}_0$.'}
    - {of: [deg, adeg], setting: partial, statement: 'Unbounded: $\deg = \Theta(n)$ against $\widetilde{\deg} = \Theta(1)$, the promise gap being invisible to exact representation and free for approximate.'}
    - {of: [rdeg, ardeg], setting: partial, statement: 'Unbounded: $\mathrm{rdeg} = \Theta(n)$ against $\mathrm{rdeg}_\varepsilon = O(1)$ -- and, since $\mathrm{rdeg} = \mathrm{PostQ}_{\mathrm{E}}$, exact and bounded-error post-selection are unboundedly far apart on promises.'}
    - {of: [C, fbs],    setting: partial, statement: 'Unbounded: $\mathrm{C} = \Theta(n)$ against $\mathrm{fbs} = \Theta(1)$; rounding a fractional certificate is a total-function argument.'}
    - {of: [bs, s],     setting: partial, statement: 'Unbounded: $\mathrm{s} = 0$ identically while $\mathrm{bs} = 1$. Every measure above $\mathrm{s}$ is unbounded in terms of it on partial functions.'}
    - {of: [deg, lambda], setting: partial, statement: 'Unbounded: $\lambda = 0$ while $\deg = \Theta(n)$, since the sensitivity graph on the promise has no edges at all.'}
  refs: [BenDavidBlais20composition, NayakWu99, CGLMSG23]
  see_also: [GapMaj, R, D, R0, QE, Q0, adeg, fbs, ApproxIndex, settings]

- id: Find1Parity
  name: Parity-labelled FIND-1
  symbol: '\mathrm{Find1}^{\mathrm{par}}_{n}'
  group: separating
  order: 49.25
  kind: partial
  arity: '$n$ bits, $4 \mid n$'
  scale: {var: n}
  short: 'The decision version of FIND-1: zero-error $O(1)$ against deterministic $n/4+1$.'
  definition: |
    Promise $|x| = n/4$, and $\mathrm{supp}(x)$ lies entirely inside the odd
    coordinates or entirely inside the even ones. Output $1$ in the first case,
    $0$ in the second. Splitting $[n]$ by parity is inessential -- any two fixed
    halves do -- but it makes the promise short to state.

    The design has two halves to it. *Every* input carries $n/4$ ones and each
    one of them, wherever it is, names the answer on its own; so a single
    successful probe both finds and certifies, and a Las Vegas algorithm is done
    after four expected queries. A deterministic algorithm gets no such luck:
    the adversary answers $0$ and it has to exhaust an entire half.
    [[promiseFind1]] makes that trade for a *relation*; the parity label is what
    turns it into a partial **function**, which is the setting where
    $\mathrm{D}$ vs $\mathrm{R}_0$ was otherwise witnessed only by the
    quadratic total-function [[pointer]] separation.

    Restricted to the odd half the promise reads "all-zero, or exactly
    balanced", which is [[DeutschJozsa]] -- hence $\mathrm{Q}_E = 1$ below. What
    Deutsch-Jozsa lacks is a witness for its constant case, and that is exactly
    what the even half supplies here: it is why $\mathrm{R}_0$ is $O(1)$ here
    and $\Theta(n)$ there.
  formal: '$\mathrm{Find1}^{\mathrm{par}}_n(x) = \mathbb{1}[\,\mathrm{supp}(x) \subseteq \mathrm{Odd}\,]$ restricted to $\{x : |x| = n/4,\ \mathrm{supp}(x) \subseteq \mathrm{Odd} \text{ or } \mathrm{supp}(x) \subseteq \mathrm{Even}\}$.'
  values:
    - {measure: D, value: 'n/4+1', putative: true, note: 'Exactly. Upper: query $n/4+1$ odd positions; a $1$ among them says $\mathrm{supp}(x) \subseteq \mathrm{Odd}$, and all-zero rules that case out, since $n/4$ ones would then have to fit into the $n/4-1$ odd positions left over. Lower: the adversary answers $0$ throughout. After $q_{\mathrm{odd}}$ odd and $q_{\mathrm{even}}$ even queries both completions survive as long as $n/2 - q_{\mathrm{odd}} \ge n/4$ and $n/2 - q_{\mathrm{even}} \ge n/4$, so the algorithm must spend $n/4+1$ queries inside one parity class before either answer is safe.'}
    - {measure: R0, value: '\Theta(1)', putative: true, note: 'At most $4$. Query uniformly random unqueried positions until one returns $1$, then report the parity of its index -- which is certain, since a single $1$ pins the side of the promise. A random position is $1$ with probability $n/4 \,/\, n$, so sampling without replacement finds one after $(n+1)/(n/4+1) < 4$ expected queries, and the algorithm never errs. Note this is the *expected*-cost convention ([[R0]]); worst-case zero error would be $\mathrm{D}$ by definition, which is the whole content of the separation.'}
    - {measure: R, value: '\Theta(1)', note: '$\mathrm{R} \le \mathrm{R}_0 = O(1)$, and at least one query.'}
    - {measure: R1, value: '\Theta(1)', note: 'Squeezed: $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0 = O(1)$. Since the algorithm only ever answers from a $1$ it has seen, one-sided error costs nothing -- as at [[promiseFind1]], and unlike [[GapMaj]], where $\mathrm{R}^1 = \Theta(n)$.'}
    - {measure: Rbar, value: '\Theta(1)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: Rna, value: '\Theta(1)', putative: true, note: 'Sampling needs no adaptivity: read $10$ uniformly random positions and answer from any that is $1$. A position is $1$ with probability $1/4$, so this fails with probability $(3/4)^{10} < 0.06$.'}
    - {measure: Dna, value: 'n/4+1', putative: true, note: 'The same count as $\mathrm{D}$, which never used adaptivity: a fixed set missing $n/4$ odd and $n/4$ even positions is consistent with both answers, and a fixed set of $n/4+1$ odd positions decides. So all the power here is in the coins, not in adaptivity.'}
    - {measure: C, value: '1', putative: true, note: 'One queried $1$ certifies the answer at every input: if $x_i = 1$ with $i$ odd then no $0$-input of the promise agrees, since $0$-inputs vanish on all odd coordinates. So $\mathrm{C} = 1$ against $\mathrm{D} = n/4+1$ -- the certificate is as short as it can be and locating it is the entire problem.'}
    - {measure: C0, value: '1', putative: true, note: 'See $\mathrm{C}$: a single even-indexed $1$.'}
    - {measure: C1, value: '1', putative: true, note: 'See $\mathrm{C}$: a single odd-indexed $1$.'}
    - {measure: Cmin, value: '1', putative: true, note: 'Equal to $\mathrm{C}$: every input has $n/4$ one-bit certificates, so the min over inputs and the max coincide.'}
    - {measure: RC, value: '1', putative: true, note: 'The one-bit certificate is already a verifier that needs no coins: query the fixed position $i \in \mathrm{supp}(x)$, accept iff it returns $1$. Every $y$ of the opposite value has $y_i = 0$, so it is rejected with certainty.'}
    - {measure: FC, value: '1', putative: true, note: 'Weight $1$ on a single $i \in \mathrm{supp}(x)$ is feasible -- every $y$ of the opposite value differs from $x$ at $i$ -- and $\mathrm{FC} \ge \mathrm{fbs} = 1$.'}
    - {measure: fbs, value: '1', putative: true, note: 'Between $\mathrm{bs} = 1$ and $\mathrm{C} = 1$.'}
    - {measure: bs, value: '1', putative: true, note: 'Exactly $1$. A sensitive block at $x$ must produce a domain input of the other value, and such an input is $0$ on all of $\mathrm{supp}(x)$; so every sensitive block contains $\mathrm{supp}(x)$ and no two of them are disjoint. One block exists -- swap $\mathrm{supp}(x)$ for any $n/4$ coordinates of the other parity -- so $\mathrm{bs} = 1$ while $\mathrm{D} = n/4+1$.'}
    - {measure: bs0, value: '1', putative: true, note: 'See $\mathrm{bs}$; the two sides are symmetric.'}
    - {measure: bs1, value: '1', putative: true, note: 'See $\mathrm{bs}$; the two sides are symmetric.'}
    - {measure: s, value: '0', putative: true, note: 'Identically zero: a single flip changes $|x|$ to $n/4 \pm 1$ and leaves the promise, so the sensitivity graph on the domain has no edges at all. An exact-weight promise kills $\mathrm{s}$ the same way a gapped one does at [[GapMaj]].'}
    - {measure: s0, value: '0', putative: true, note: 'See $\mathrm{s}$: no domain neighbours anywhere.'}
    - {measure: s1, value: '0', putative: true, note: 'See $\mathrm{s}$: no domain neighbours anywhere.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph is empty (see $\mathrm{s}$), so its spectral norm is $0$.'}
    - {measure: deg, value: '1', putative: true, note: 'The linear polynomial $p(x) = (4/n)\sum_{i \text{ odd}} x_i$ is $1$ on every $1$-input and $0$ on every $0$-input of the promise. Off the promise it runs up to $2$, which is allowed for $\deg$ but not for $\widetilde{\deg}$ -- see the settings note at [[deg]].'}
    - {measure: adeg, value: '\Theta(1)', note: 'At most $2\mathrm{Q} = O(1)$, and at least $1$. Unlike $\deg$ this is not witnessed by the linear polynomial above, which is unbounded off the promise.'}
    - {measure: sdeg, value: '1', putative: true, note: '$\sum_{i \text{ odd}} x_i - 1/2$ has the right sign at every promise input.'}
    - {measure: ndeg, value: '1', putative: true, note: '$\sum_{i \text{ odd}} x_i$ is nonzero on the domain exactly at the $1$-inputs.'}
    - {measure: rdeg, value: '1', putative: true, note: '$\max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\}$, and the complement is handled by $\sum_{i \text{ even}} x_i$.'}
    - {measure: NQ, value: '1', note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2 \rceil = 1$.'}
    - {measure: Q, value: '\Theta(1)', note: '$\mathrm{Q} \le \mathrm{R} = O(1)$, and at least one query.'}
    - {measure: Q0, value: '\Theta(1)', note: '$\mathrm{Q}_0 \le \mathrm{R}_0 = O(1)$; also $\mathrm{Q}_0 \le \mathrm{Q}_E = 1$.'}
    - {measure: QE, value: '1', putative: true, note: 'One query, with certainty. Prepare $|\psi\rangle = (n/2)^{-1/2}\sum_{i \text{ odd}}|i\rangle$ and apply the phase oracle $|i\rangle \mapsto (-1)^{x_i}|i\rangle$. On a $0$-input every odd coordinate is $0$, so the state is unchanged; on a $1$-input exactly $n/4$ of the $n/2$ odd coordinates carry a $-1$, so the state is *orthogonal* to $|\psi\rangle$. The projective measurement $\{|\psi\rangle\langle\psi|,\, I - |\psi\rangle\langle\psi|\}$ then answers with probability $1$ either way. This is [[DeutschJozsa]] run on the odd half, and it is why the promise fixes $|x| = n/4$: half of the odd coordinates, so the $1$-case is exactly balanced. Contrast [[GapMaj]] and [[promiseFind1]], where exactness costs $\Theta(n)$.'}
    - {measure: D_size, value: '\Theta(n)', putative: true, note: 'The caterpillar "query odd positions until the first $1$" has one leaf per stopping point, so $O(n)$; and a tree of depth $d$ has more than $d$ leaves, so $\Omega(n)$ by $\mathrm{D} = n/4+1$. As at [[promiseFind1]], the deterministic hardness is depth, not size.'}
    - {measure: rank, value: '1', putative: true, note: 'That caterpillar has rank $1$ -- one child of every internal node is a leaf -- and rank $0$ means a constant answer.'}
    - {measure: D_prod, value: '0', putative: true, note: 'The support of a product distribution on $\{0,1\}^n$ is a subcube, and the domain here contains no subcube of dimension $\ge 1$: flipping any single coordinate breaks $|x| = n/4$. So every product $\mu$ supported on the promise is a point mass, hence one-sided, and $\mathrm{D}^\mu = 0$ -- against $\mathrm{R} = \Theta(1)$ the measure is simply blind, as at [[GapMaj]] and [[Forrelation]].'}
    - {measure: Dmu, value: '\Theta(1)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \Theta(1)$.'}
    - {measure: Np, value: '\Theta(1)', putative: true, note: 'Read each of $O(1)$ sampled positions $O(1)$ times and majority-vote: $\mathrm{N}_p = O(\mathrm{R})$, and $\mathrm{N}_p \ge \mathrm{R}$ always.'}
    - {measure: noisyR, value: '\Theta(1)', note: 'At most $\mathrm{R} = O(1)$, and at least $1$: there is nothing for cheap low-bias queries to buy.'}
    - {measure: robustQ, value: '\Theta(1)', note: 'Between $\mathrm{Q} = \Theta(1)$ and $\mathrm{N}_p = \Theta(1)$.'}
    - {measure: PostQ, value: '\Theta(1)', note: 'At most $\mathrm{Q} = \Theta(1)$, and at least $1$.'}
    - {measure: Advpm, value: '\Theta(1)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: Adv, value: 'O(1)', note: '$\mathrm{Adv} \le \mathrm{Adv}^{\pm} = \Theta(1)$.'}
    - {measure: MAdv, value: '\Theta(1)', note: 'Sandwiched between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}$.'}
    - {measure: gamma2, value: '\Theta(1)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(1)$.'}
    - {measure: CA, value: '\Theta(1)', note: 'A lower bound on $\mathrm{R} = O(1)$, and at least a constant for a non-trivial problem. The classical adversary is powerless here -- correctly, since $\mathrm{R} = O(1)$.'}
    - {measure: QC, value: '\Theta(1)', note: 'At most $\mathrm{Q} = \Theta(1)$, and at least $1$.'}
    - {measure: cjdeg, value: '\Theta(1)', note: 'Between $1$ and $\mathrm{R} = O(1)$.'}
    - {measure: prt, value: 'O(1)', note: '$\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon = O(1)$.'}
    - {measure: rprt, value: 'O(1)', note: '$\overline{\mathrm{prt}} \le \mathrm{prt} = O(1)$.'}
  witnesses:
    - {of: [D, R0], setting: partial, statement: 'Unbounded, and the point of the example: $\mathrm{R}_0 = O(1)$ while $\mathrm{D} = n/4+1$. Zero error is no obstacle when every input carries $n/4$ self-certifying witnesses; what defeats determinism is having to *find* one. [[promiseFind1]] says the same thing for relations, but a relation cannot witness the partial-function cell, which is why this one is needed.'}
    - {of: [D, C], setting: partial, statement: 'Unbounded: $\mathrm{C} = 1$ against $\mathrm{D} = n/4+1$. The total-function bound $\mathrm{D} \le \mathrm{C}^0\,\mathrm{C}^1$ needs *both* sides to have short certificates and needs the search for them to be guided; here both sides do and it still fails.'}
    - {of: [D, QE], setting: partial, statement: 'Unbounded: one exact quantum query against $n/4+1$ deterministic ones. [[DeutschJozsa]] makes the same point, but there $\mathrm{R}_0 = \Theta(n)$, so the collapse is quantum; here $\mathrm{R}_0 = O(1)$ too, and every measure that is not $\mathrm{D}$ itself is constant.'}
  see_also: [promiseFind1, DeutschJozsa, GapMaj, D, R0, C, pointer]

- id: ApproxIndex
  name: Approximate index
  symbol: '\mathrm{ApproxIndex}_k'
  group: separating
  order: 49.5
  kind: partial
  arity: '$n = k + 2^k$ bits (a $k$-bit address and a $2^k$-cell array over $\{0,1,2\}$, binary-encoded)'
  scale: {var: k, subs: {n: '2^k'}, note: 'The array dominates the address, $n = k + 2^k = \Theta(2^k)$.'}
  short: 'The outer function that refutes the randomized composition conjecture: a *biased guess* at the index is good enough, which is cheap noisily and expensive classically.'
  definition: |
    The input is an address $a \in \{0,1\}^k$ together with an array
    $x \in \{0,1,2\}^{2^k}$ indexed by $\{0,1\}^k$. The promise: every cell $b$ within
    Hamming distance $k/2 - 2\sqrt{k\log k}$ of $a$ holds one and the same bit, and every
    other cell holds $2$. Output that bit.

    The point is the slack. You never have to find $a$ -- any $b$ in a ball of radius just
    barely under $k/2$ around it reads off the answer -- and a ball of that radius catches a
    string built by guessing each bit of $a$ with only a *small bias*. Bias is cheap in the
    noisy model and expensive in the query model, and that difference is the whole
    counterexample. The alphabet $\{0,1,2\}$ costs only a constant factor after binary
    encoding, so this is treated as a partial Boolean function.
  formal: '$\mathrm{ApproxIndex}(a,x) = x_a$ if $x_b = x_a \in \{0,1\}$ for every $b$ with $|b-a| \le k/2 - 2\sqrt{k\log k}$ and $x_b = 2$ for every other $b$; undefined otherwise.'
  values:
    - {measure: R, value: '\Theta(\sqrt{k\log k}) = \Theta(\sqrt{\log n\,\log\log n})', refs: [BenDavidBlais20composition], note: 'Lemma 27. Upper: read the first $8\sqrt{k\log k}$ bits of $a$, fill the rest of $b$ with fair coins, query $x_b$. Lower: an algorithm making $\sqrt{k\log k}$ queries can be assumed never to query the array (pretend the answer is $2$), and then it must still name a small set of candidate addresses one of which lands in the ball -- i.e. guess $k/2 + \sqrt{k\log k}$ of the unread bits of a uniformly random string correctly, which Chernoff forbids.'}
    - {measure: D, value: '\Theta(\sqrt{k\log k})', putative: true, note: 'So this function is *not* a $\mathrm{D}$-vs-$\mathrm{R}$ separation, which is worth knowing given how hard its $\mathrm{R}$ lower bound works. Lower: $\mathrm{D} \ge \mathrm{R}$. Upper: read the first $q = 4\sqrt{k\log k}$ bits of $a$ and let $b$ agree with them and be $0$ elsewhere, $b''$ agree with them and be $1$ elsewhere. Then $|b-a| + |b''-a| = k-q$, so one of the two is within $(k-q)/2 = k/2 - 2\sqrt{k\log k}$ of $a$ -- inside the ball. Query $x_b$; if it is $2$, query $x_{b''}$, which cannot be. Total $4\sqrt{k\log k}+O(1)$ queries, deterministically. Randomness buys nothing here: it only replaces "read $4\sqrt{k\log k}$ bits and use antipodal guesses" with "read $8\sqrt{k\log k}$ bits and guess at random".'}
    - {measure: R0, value: '\Theta(\sqrt{k\log k})', note: 'Sandwiched: $\mathrm{R} \le \mathrm{R}_0 \le \mathrm{D}$, and the two ends agree.'}
    - {measure: noisyR, value: 'O(\log k) = O(\log\log n)', refs: [BenDavidBlais20composition], note: 'Not stated as a value in the source, but it is exactly what its two theorems say. Their composed algorithm gives $\mathrm{R}(\mathrm{ApproxIndex}_k \circ \mathrm{GapMaj}_k) = O(k\log k)$, and Theorem 3 says $\mathrm{R}(f \circ g) = \Omega(\mathrm{noisyR}(f)\,\mathrm{R}(g))$ with $\mathrm{R}(\mathrm{GapMaj}_k) = \Theta(k)$; divide. Directly, in the noisy model: buy each of the $k$ address bits at bias $\gamma = c\sqrt{\log k/k}$ for $\gamma^2$ each, total $c^2\log k$, which puts the guess inside the ball with high probability, then read one array cell at bias $1$.'}
    - {measure: Rbar, value: '\Theta(\sqrt{k\log k}) = \Theta(\sqrt{\log n\,\log\log n})', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(\sqrt{k\log k}) = \Theta(\sqrt{\log n\,\log\log n})$ here.'}
    - {measure: C, value: '\Theta(1)', putative: true, note: 'One array cell. By the promise, a cell holding a value in $\{0,1\}$ *must* lie in the ball around $a$, so reading any non-$2$ cell both locates you inside the ball and reads off the answer -- two bits after the binary encoding. So $\mathrm{C} = \Theta(1)$ against $\mathrm{D} = \Theta(\sqrt{k\log k})$: the difficulty is entirely in *finding* a good cell, never in recognising one.'}
    - {measure: C0, value: '\Theta(1)', putative: true, note: 'See $\mathrm{C}$; the two sides are symmetric.'}
    - {measure: C1, value: '\Theta(1)', putative: true, note: 'See $\mathrm{C}$; the two sides are symmetric.'}
    - {measure: Cmin, value: '\Theta(1)', putative: true, note: 'See $\mathrm{C}$: the same certificate works at every input, so $\mathrm{C}_{\min} = \mathrm{C} = \Theta(1)$.'}
    - {measure: s, value: '0', putative: true, note: 'No single flip stays inside the promise. Flipping a bit of the address $a$ moves the ball, leaving cells inside the new ball holding $2$; flipping a bit of an array cell either breaks the "$v$ inside the ball" condition or the "$2$ outside" one. So $\mathrm{s}^0 = \mathrm{s}^1 = 0$.'}
    - {measure: s0, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: s1, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: bs, value: '1', putative: true, note: 'Exactly one, so no two sensitive blocks are disjoint. After any answer-flipping change every non-$2$ cell holds $1-v$, whereas at present every one of the $|B(a,r)|$ cells of the ball holds $v$; so *every* sensitive block contains the whole ball, and any two of them meet. There is at least one (rewrite everything), so $\mathrm{bs} = 1$.'}
    - {measure: bs0, value: '1', putative: true, note: 'See $\mathrm{bs}$.'}
    - {measure: bs1, value: '1', putative: true, note: 'See $\mathrm{bs}$.'}
    - {measure: fbs, value: '1', putative: true, note: 'The load constraint at any single cell of the ball already caps $\sum_B w_B$ at $1$, since every sensitive block contains that cell.'}
    - {measure: FC, value: '1', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: '\Theta(1)', note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = \Theta(1)$; also $\mathrm{RC} \le \mathrm{C} = \Theta(1)$.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph on the promise is empty (see $\mathrm{s} = 0$).'}
    - {measure: Dna, value: '\Theta(\sqrt{k\log k})', putative: true, note: 'Adaptivity is worth nothing: read the first $4\sqrt{k\log k}$ bits of $a$ and query *both* antipodal completions $x_b$ and $x_{b''}$ at once -- one of them is inside the ball. And $\mathrm{D}^{\mathrm{na}} \ge \mathrm{D}$. Note the lemma "$\mathrm{D}^{\mathrm{na}} = n$ for functions depending on all variables" does **not** apply here: with $\mathrm{s} = 0$, no single coordinate is relevant *within the promise*.'}
    - {measure: Rna, value: '\Theta(\sqrt{k\log k})', putative: true, note: 'Same remark: the randomized algorithm reads a fixed prefix of $a$ and one array cell chosen from the coins alone, so it is non-adaptive; and $\mathrm{R}^{\mathrm{na}} \ge \mathrm{R}$.'}
    - {measure: Dmu, value: '\Theta(\sqrt{k\log k})', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R}$.'}
    - {measure: D_prod, value: '0', putative: true, note: 'A rectangle inside the promise is a single input. First the address is pinned: if inputs $(a,x)$ and $(a'',x'')$ with $a \ne a''$ both lay in the rectangle, so would $(a, x'')$, and $x''$ marks the ball around $a''$, a different set of cells from the ball around $a$. With $a$ fixed, the array is pinned too: every one of the $\binom{k}{\le k/2 - 2\sqrt{k\log k}}$ cells in the ball must hold the *same* bit, so a rectangle with even one free array coordinate contains an input where two ball cells disagree. Hence $\mathrm{D}^\mu = 0$ for every product $\mu$, against $\mathrm{R} = \Theta(\sqrt{k\log k})$. See [[Forrelation]].'}
    - {measure: Q, value: 'O(\sqrt{k\log k})', note: 'At most $\mathrm{R}$. Nothing better is known and nothing better is needed: the point of the family is the $\mathrm{R}$-vs-$\mathrm{noisyR}$ gap, and quantum plays no role in it.'}
    - {measure: Advpm, value: 'O(\sqrt{k\log k})', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$, hence at most $O(\sqrt{k\log k})$.'}
    - {measure: gamma2, value: 'O(\sqrt{k\log k})', note: '$\gamma_2 = \Theta(\mathrm{Q})$.'}
    - {measure: MAdv, value: 'O(\sqrt{k\log k})', note: 'Sandwiched between $\mathrm{Adv}^{\pm}$ and $\mathrm{Q}$.'}
    - {measure: adeg, value: 'O(\sqrt{k\log k})', note: '$\widetilde{\deg} \le 2\mathrm{Q} \le 2\mathrm{R} = O(\sqrt{k\log k})$. From below, only $\Omega(1)$, and closing that is a real question rather than an oversight -- note that $\deg = 2$ below is *no* help, because approximate degree is the one polynomial measure that insists on boundedness off the promise. What a bounded polynomial can do here has a clean reading. Suppose $c_b(a)$, $b \in \{0,1\}^k$, are polynomials in the address of degree $\le d$ with $c_b \ge 0$ and $\sum_b c_b(a) \le 1$ on the whole cube, and $\sum_{b \in B(a,r)} c_b(a) \ge 2/3$ for every $a$ -- a *guessing scheme*, a distribution over cells of low degree in $a$ that lands in the ball. Then $p(a,x) = \sum_b c_b(a)\big(\mathbb{1}[x_b=1] - \mathbb{1}[x_b=0]\big)$ has degree $d+2$, satisfies $|p| \le 1$ everywhere because the $c_b$ are nonnegative and sum to at most $1$, and equals $(2v-1)\sum_{b \in B(a,r)} c_b(a)$ on the promise; so $\widetilde{\deg} \le d+2$. Two schemes are available and neither beats the algorithm: reading a prefix of $8\sqrt{k\log k}$ address bits and guessing the rest uniformly has degree $8\sqrt{k\log k}$, and biasing every bit by $\gamma = c\sqrt{\log k/k}$ -- the [[noisyR]] strategy -- gives $c_b(a) = \prod_i (\tfrac12 + \gamma(1-2b_i)(1-2a_i))$, degree $k$, which is worse. Whether some cleverer nonnegative scheme, or a polynomial not of this shape at all, does better is open.'}
    - {measure: Np, value: '\Theta(\sqrt{k\log k})', putative: true, note: 'At least $\mathrm{R}$; and reading each of the $O(\sqrt{k\log k})$ address bits $O(1)$ times and majority-voting still lands inside the ball, so $O(\mathrm{R})$. Note the sharp contrast with [[noisyR]] $= O(\log k)$: $\mathrm{N}_p$ charges a *fixed* constant noise rate per read, while the noisy-query model lets the algorithm buy an arbitrarily weak bias at cost $\gamma^2$, and weak bias is exactly what this problem needs.'}
    - {measure: prt, value: 'O(\sqrt{k\log k})', note: 'From $\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon$.'}
    - {measure: rprt, value: 'O(\sqrt{k\log k})', note: 'From $\overline{\mathrm{prt}}_\varepsilon \le \mathrm{prt}_\varepsilon$.'}
    - {measure: CA, value: 'O(\sqrt{k\log k})', note: 'At most $\mathrm{R}$. Since $\mathrm{fbs} = 1$ here, the classical adversary is the only combinatorial measure left with any room, but no lower bound better than $\Omega(1)$ is available.'}
    - {measure: Adv, value: '\Theta(1)', note: 'The certificate barrier is decisive: $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = \Theta(1)$, an inequality that does hold for partial $f$ [SpalekSzegedy06, Zhang05]. So the positive adversary method proves *nothing* about this function, whatever $\mathrm{Q}$ turns out to be. Consistent with $\mathrm{bs} \le \mathrm{Adv}^2$, since $\mathrm{bs} = 1$.', refs: [SpalekSzegedy06, Zhang05]}
    - {measure: QC, value: '\Theta(1)', refs: [Aaronson08], note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{fbs}}) = \Theta(1)$: a constant-size quantum certificate, matching the constant-size classical one.'}
    - {measure: ndeg, value: '\Theta(1)', note: '$\mathrm{ndeg} \le \mathrm{C}^1 = \Theta(1)$ -- take the sum over $1$-certificates of the product of their literal indicators, which is nonzero exactly on the $1$-inputs of the domain (a $0$-input containing a $1$-certificate would be a domain point of both values). And $\mathrm{ndeg} \ge 1$.'}
    - {measure: NQ, value: '\Theta(1)', note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil = \Theta(1)$.'}
    - {measure: rdeg, value: '\Theta(1)', note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\} = \Theta(1)$, both sides having constant certificates.'}
    - {measure: ardeg, value: '\Theta(1)', note: '$\mathrm{rdeg}_\varepsilon \le \mathrm{rdeg} = \Theta(1)$.'}
    - {measure: PostQ, value: '\Theta(1)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = \Theta(1)$. A postselecting algorithm guesses a cell, reads it, and postselects on not seeing $2$ -- against $\mathrm{R} = \Theta(\sqrt{k\log k})$ this is an unbounded gap, and it is the mirror image of the $\mathrm{noisyR}$ story: both models can afford to *guess* the address.'}
    - {measure: CG, value: 'O(k^2) = O(\log^2 n)', putative: true, refs: [CGLMSG23], note: 'A private-coin strategy, since the total-function sandwich $\mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ is unavailable on a promise problem. Each player, with probability $1/2$, outputs a uniformly random one of the $k$ address bits, and otherwise outputs a random bit of the cell indexed by its own address $a$. If the two addresses differ, they agree on a differing address bit with probability $\ge 1/(4k^2)$; if they are equal, they both name the same cell, which must differ, with probability $\Omega(1)$. So $\mathrm{CG} = O(k^2)$, while $\mathrm{CG}^{\mathrm{pub}} = O(\sqrt{k\log k})$.'}
    - {measure: CGpub, value: 'O(\sqrt{k\log k})', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{CA}) = O(\mathrm{R})$; the shared-randomness version of the strategy in $\mathrm{CG}$ also gives $O(k)$. From below only $\Omega(\mathrm{fbs}) = \Omega(1)$.'}
    - {measure: CGstar, value: 'O(\sqrt{k\log k})', refs: [CGLMSG23], note: 'At most $\mathrm{CG}^{\mathrm{pub}}$; all three non-private variants are $\Theta(\mathrm{CA})$.'}
    - {measure: CGns, value: 'O(\sqrt{k\log k})', refs: [CGLMSG23], note: 'At most $\mathrm{CG}^{*}$.'}
    - {measure: EC, value: 'O(k) = O(\log n)', putative: true, note: 'Weight $1$ on each of the $k$ address bits and on the two bits of the cell $a$ pointed at by the input''s own address. Two inputs of different value with different addresses differ in some address bit, where both put weight $1$; with the *same* address they differ at cell $a$, which both weight. Cost $k + 2$. This does not go through $\mathrm{EC} \le \mathrm{C} = \Theta(1)$, which is a total-function statement -- its proof needs a $0$-certificate and a $1$-certificate to conflict, and here two non-conflicting certificates stitch together into a string outside the promise. Whether $\mathrm{EC}$ is really $\omega(1)$ here is open; from below only $\mathrm{EC} \ge \mathrm{fbs} = 1$.'}
    - {measure: R1, value: '\Theta(\sqrt{k\log k})', note: 'Squeezed between $\mathrm{R}$ and $\mathrm{R}_0$, which agree.'}
    - {measure: Q0, value: 'O(\sqrt{k\log k})', note: 'At most $\mathrm{R}_0$; at least $\mathrm{Q}$.'}
    - {measure: QE, value: 'O(\sqrt{k\log k})', note: 'At most $\mathrm{D}$. From below the polynomial method gives $\mathrm{Q}_E \ge \deg/2 = \Omega(1)$, i.e. nothing at all, since $\deg = \Theta(1)$ here.'}
    - {measure: deg, value: '\Theta(1)', putative: true, note: 'At most $2$, and at least $1$ since $f$ is not constant. *Count* the marked cells instead of finding one: the ball $B(a,r)$ has $V = \sum_{j \le r}\binom kj$ cells whatever the address $a$ is, and on the promise every one of them holds $v$ and no other cell does, so $\tfrac1V\sum_b \mathbb{1}[x_b = 1]$ equals $v$ *exactly* on the whole domain. Each $\mathbb{1}[x_b=1]$ is a degree-$\le 2$ function of that cell''s two encoding bits, so $\deg \le 2$ -- and $\deg = 1$ under the encoding that spends one bit on $\mathbb{1}[x_b=1]$. The address is never looked at. Nothing survives this off the promise, where the sum runs up to $2^k \gg V$: it is unbounded, which is legal for $\deg$ (agree on $\mathrm{Dom}(f)$, unconstrained elsewhere) and is exactly what $\widetilde{\deg}$ forbids. So $\deg = \Theta(1)$ against $\mathrm{D} = \Theta(\sqrt{k\log k})$, and the unbounded polynomial method is worthless here; cf. [[UniqueSearch]], where the same collapse happens for the same reason.'}
    - {measure: sdeg, value: '\Theta(1)', note: '$\mathrm{sdeg} \le \deg = \Theta(1)$: the exact polynomial above, shifted to $\tfrac2V\sum_b \mathbb{1}[x_b=1] - 1$, sign-represents $f$ on the domain.'}
    - {measure: odeg, value: '\Theta(1)', note: 'Between $\mathrm{sdeg}$ and $\deg$, both $\Theta(1)$. Like $\deg$ and $\mathrm{sdeg}$, and unlike $\widetilde{\deg}$, one-sided approximate degree never asks the polynomial to stay bounded off the promise.'}
    - {measure: UC, value: 'O(\sqrt{k\log k})', note: 'Between $\mathrm{C} = \Theta(1)$ and $\mathrm{D}$. Unambiguity is not free here: the constant-size certificates overlap heavily, since many cells of the ball certify the same value.'}
    - {measure: UCmin, value: 'O(\sqrt{k\log k})', note: 'Between $\mathrm{C}_{\min} = \Theta(1)$ and $\mathrm{UC}$.'}
    - {measure: SP, value: 'O(\sqrt{k\log k})', note: 'Between $\mathrm{C}$ and $\mathrm{D}$: the leaves of the deterministic tree form a subcube partition of the promise.'}
    - {measure: rank, value: 'O(\sqrt{k\log k})', note: 'At most $\mathrm{D}$; at least $1$.'}
    - {measure: chi, value: 'O(\sqrt{k\log k})', note: '$\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R}$.'}
    - {measure: chibar, value: '\Omega\big((k\log k)^{1/4}\big)', note: 'From $\mathrm{R} = O(\bar\chi^2)$, which holds for partial $g$; and $\bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(\sqrt{k\log k})$.'}
    - {measure: LR, value: '\Omega\big((k\log k)^{1/4}\big)', note: '$\mathrm{LR} = \Omega(\sqrt{\mathrm{R}})$, and $\mathrm{LR} \le \mathrm{R} = O(\sqrt{k\log k})$. Do not confuse this with [[noisyR]] $= O(\log k)$: $\mathrm{LR}$ charges $1/\gamma$ for bias $\gamma$ and $\mathrm{noisyR}$ charges $\gamma^2$, so only the latter makes cheap guessing cheap.'}
    - {measure: RS, value: 'O(\sqrt{k\log k})', note: '$\mathrm{RS} = O(\bar\chi) = O(\mathrm{R})$.'}
    - {measure: Rstar, value: 'O(\sqrt{k\log k})', note: '$\mathrm{R}^{*} \le \mathrm{R}$; the lower bound $\mathrm{R}^{*} = \Omega(\mathrm{LR})$ is recorded only for total $f$, and $\mathrm{R}^{*} = \Omega(\mathrm{Q})$ gives nothing without a $\mathrm{Q}$ lower bound.'}
    - {measure: cjdeg, value: 'O(\sqrt{k\log k})', note: '$\mathrm{cjdeg}_\varepsilon \le \mathrm{R}_\varepsilon$.'}
    - {measure: robustQ, value: '\widetilde O(\sqrt{k\log k})', note: '$\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ with $\mathrm{Q} = O(\sqrt{k\log k})$.'}
    - {measure: psD, value: '\Theta(\sqrt{k\log k})', note: 'Degenerate on a partial Boolean function: $\mathrm{psD} = \Theta(\mathrm{R}) = \Theta(\sqrt{k\log k})$.'}
    - {measure: cbs, value: '1', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs} = 1$.'}
  witnesses:
    - {of: [D, C], setting: partial, statement: 'Unbounded: $\mathrm{C} = \mathrm{C}_{\min} = \Theta(1)$ but $\mathrm{D} = \Theta(\sqrt{k\log k})$ -- recognising a good array cell is free, finding one is not.'}
    - {of: [R, noisyR], setting: partial, statement: 'An *exponential* gap: $\mathrm{R} = \Theta(\sqrt{k\log k})$ against $\mathrm{noisyR} = O(\log k)$, so $\mathrm{R} = 2^{\Omega(\mathrm{noisyR})}$ on this family.', refs: [BenDavidBlais20composition]}
    - {of: [R, R], setting: partial, statement: 'Composed with $\mathrm{GapMaj}_k$ it refutes the randomized composition conjecture: $\mathrm{R}(f)\,\mathrm{R}(g) = \tilde\Theta(k^{3/2})$ but $\mathrm{R}(f \circ g) = O(k \log k)$.', refs: [BenDavidBlais20composition]}
    - {of: [D, deg], setting: partial, statement: 'Unbounded: $\deg = \Theta(1)$ -- count the marked cells, whose number $V$ is the same for every address -- against $\mathrm{D} = \Theta(\sqrt{k\log k})$. The counting polynomial is wildly unbounded off the promise, so it says nothing about $\widetilde{\deg}$, which remains open between $\Omega(1)$ and $O(\sqrt{k\log k})$.'}
  refs: [BenDavidBlais20composition, GLSS19]
  see_also: [GapMaj, noisyR, R, composition, LR, ADDR, MarkedBit, UniqueSearch]

- id: Collision
  name: Collision problem
  symbol: '\mathrm{COL}_n'
  group: quantum
  order: 50
  kind: partial
  arity: 'a function table $g:[n]\to[n]$'
  short: '$\mathrm{Q}=\Theta(n^{1/3})$ vs $\mathrm{R}=\Theta(\sqrt n)$: a *polynomial-only* quantum speedup for a promise problem.'
  definition: 'Promise: $g$ is one-to-one or two-to-one. Decide which.'
  values:
    - {measure: Q, value: '\Theta(n^{1/3})', refs: [BHT98, AaronsonShi04, Kutin05], note: 'Upper: the birthday-paradox-plus-Grover algorithm of [BHT98]. Lower: the polynomial method [AaronsonShi04], originally for range $\Omega(n^2)$; [Kutin05] removed the range restriction (their proof needed range $\ge 3n/2$) and simplified the argument, and [Ambainis05smallrange] handles small ranges too.'}
    - {measure: R, value: '\Theta(\sqrt n)', note: 'Birthday paradox both ways.'}
    - {measure: Advpm, value: '\Theta(n^{1/3})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n^{1/3})$ here.'}
    - {measure: Rbar, value: '\Theta(\sqrt n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \Theta(\sqrt n)$ here.'}
    - {measure: MAdv, value: '\Theta(n^{1/3})', note: 'Sandwiched: $\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$, with both ends $\Theta(n^{1/3})$ here.'}
    - {measure: Adv, value: 'O(1)', refs: [HoyerSpalek05, SpalekSzegedy06], note: 'The certificate complexity barrier at its sharpest: a collision pair certifies a $2$-to-$1$ input with $2$ queries, and the promise means $O(1)$ queries also certify $1$-to-$1$-ness against the promise, so $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = O(1)$ while $\mathrm{Q} = \Theta(n^{1/3})$. No positive-weight adversary matrix can prove anything here -- this promise problem is the reason the negative-weights version had to be invented.'}
    - {measure: D, value: 'n/2+1', putative: true, note: 'Exactly. Upper: a two-to-one $g$ takes only $n/2$ values, so any $n/2+1$ queries repeat one; a one-to-one $g$ never does. Lower: an adversary answering with fresh values keeps both promises alive for $n/2$ queries, since $k \le n/2$ distinct answers can always be extended to a two-to-one function (put the $k$ queried points in $k$ different pairs).'}
    - {measure: Dna, value: 'n/2+1', putative: true, note: 'The same $n/2+1$ positions, fixed in advance.'}
    - {measure: R0, value: 'n/2+1', putative: true, note: 'Zero error means finishing on a certificate, and certifying one-to-one-ness takes $n/2+1$ distinct answers (see $\mathrm{C}$). So $\mathrm{R}_0 = \Theta(\mathrm{R}^2)$ here: the birthday paradox is a bounded-error phenomenon and nothing else.'}
    - {measure: Rna, value: '\Theta(\sqrt n)', putative: true, note: 'Sampling $c\sqrt n$ positions is non-adaptive and finds a collision with constant probability; and $\mathrm{R}^{\mathrm{na}} \ge \mathrm{R} = \Theta(\sqrt n)$. Adaptivity is worth nothing here.'}
    - {measure: C, value: 'n/2+1', putative: true, note: '$\mathrm{C}^0 = n/2+1$ by the extension argument above; $\mathrm{C}^1 = 2$, a colliding pair.'}
    - {measure: Cmin, value: '2', putative: true, note: 'A colliding pair, on the two-to-one side.'}
    - {measure: C0, value: 'n/2+1', putative: true, note: 'The one-to-one side: $n/2$ distinct answers can always be extended to a two-to-one $g$, so nothing short of $n/2+1$ certifies injectivity against the promise.'}
    - {measure: C1, value: '2', putative: true, note: 'The two-to-one side: one colliding pair.'}
    - {measure: s, value: '0', putative: true, note: 'Counting a query as one evaluation of $g$. Changing $g$ at a single point never stays in the promise: from a one-to-one $g$ it creates at most one collision, while a two-to-one $g$ needs all $n/2$ pairs to collide; from a two-to-one $g$ it orphans exactly one pair. So $\mathrm{s}^0 = \mathrm{s}^1 = 0$ while $\mathrm{D} = n/2+1$.'}
    - {measure: s0, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: s1, value: '0', putative: true, note: 'See $\mathrm{s}$.'}
    - {measure: bs, value: '2', putative: true, note: 'Crossing between the two sides forces a change in each of the $n/2$ pairs, so every sensitive block has $\ge n/2$ of the $n$ coordinates: at most two disjoint ones, and two transversals of the pairing achieve it. $\mathrm{bs}^0 = \mathrm{bs}^1 = 2$.'}
    - {measure: bs0, value: '2', putative: true, note: 'See $\mathrm{bs}$.'}
    - {measure: bs1, value: '2', putative: true, note: 'See $\mathrm{bs}$.'}
    - {measure: fbs, value: '2', putative: true, note: 'Fractionally the same: $(n/2)\sum_B w_B \le \sum_i \mathrm{load}(i) \le n$.'}
    - {measure: FC, value: '2', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: '\Theta(1)', putative: true, note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = \Theta(1)$: rejecting one *fixed* input of the other type needs only a random query into a block where the two differ. Against $\mathrm{R} = \Theta(\sqrt n)$ and $\mathrm{Q} = \Theta(n^{1/3})$, this is why no certificate-style bound can prove anything about the collision problem.'}
    - {measure: UC, value: 'n/2+1', putative: true, note: 'Squeezed between $\mathrm{C}$ and $\mathrm{D}$, both $n/2+1$.'}
    - {measure: SP, value: 'n/2+1', putative: true, note: 'Squeezed between $\mathrm{C}$ and $\mathrm{D}$, both $n/2+1$.'}
    - {measure: UCmin, value: 'O(n)', note: 'Squeezed between $\mathrm{C}_{\min} = 2$ and $\mathrm{UC} = n/2 + 1$. $\mathrm{UC}_{\min} = \min\{\mathrm{UC}^0,\mathrm{UC}^1\}$ is worst-case *within the cheaper side*, not a minimum over inputs: a two-to-one $g$ has $n/2$ collision pairs, so the width-$2$ collision certificates overlap heavily and no unambiguous family of constant width covers that side.'}
    - {measure: Dmu, value: '\Theta(\sqrt n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \Theta(\sqrt n)$.'}
    - {measure: D_prod, value: '0', putative: true, note: 'Exactly the argument recorded at [[Simon]]: a rectangle $\prod_i S_i$ of functions that contains a $1$-$1$ function $g$ and a two-to-one function $h$ also contains the hybrids that copy one, then two, of $h$''s colliding positions into $g$, and one of those two hybrids has exactly one repeated value -- neither $1$-$1$ nor two-to-one, hence off the promise. So every product distribution inside the promise is one-sided and $\mathrm{D}^\mu = 0$, against $\mathrm{R} = \Theta(\sqrt n)$. Contrast [[ElementDistinctness]], the *total* version, where the uniform product distribution gives $\mathrm{D}^{\mathrm{prod}} = \Theta(n)$: the promise, not the collision structure, is what kills the measure.'}
    - {measure: gamma2, value: '\Theta(n^{1/3})', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Theta(n^{1/3})$. Note $\mathrm{Adv} = O(1)$ on the same problem: the general adversary is exactly what the positive one cannot see.'}
    - {measure: adeg, value: '\Theta(n^{1/3})', refs: [AaronsonShi04, Kutin05], note: 'The [AaronsonShi04]/[Kutin05] lower bound *is* a degree bound -- that is what the polynomial method proves -- so $\widetilde{\deg} = \Omega(n^{1/3})$; and $\widetilde{\deg} \le 2\mathrm{Q} = O(n^{1/3})$. Approximate degree is thus the tight measure for the collision problem, where $\mathrm{Adv}$ collapses to $O(1)$.'}
    - {measure: deg, value: '\Omega(n^{1/3})', note: '$\deg \ge \widetilde{\deg} = \Omega(n^{1/3})$, in the standard encoding of the table by indicator variables $x_{i,v}$.'}
    - {measure: sdeg, value: 'O(n^{1/3})', note: '$\mathrm{sdeg} \le \widetilde{\deg}_{+} \le \widetilde{\deg} = O(n^{1/3})$.'}
    - {measure: odeg, value: 'O(n^{1/3})', note: 'Between $\mathrm{sdeg}$ and $\widetilde{\deg} = O(n^{1/3})$.'}
    - {measure: ardeg, value: 'O(n^{1/3})', note: '$\mathrm{rdeg}_\varepsilon \le \widetilde{\deg}_\varepsilon = O(n^{1/3})$.'}
    - {measure: PostQ, value: 'O(n^{1/3})', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = O(n^{1/3})$.'}
    - {measure: ndeg, value: '2', putative: true, note: 'Exactly $2$: the polynomial $\sum_{i<j}\sum_v x_{i,v}x_{j,v}$ counts colliding pairs, so it is nonzero precisely on the two-to-one side, and no linear form can do that. Equivalently $\mathrm{ndeg} \le \mathrm{C}^1 = 2$.'}
    - {measure: NQ, value: '1', note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2\rceil = 1$: *one* nondeterministic quantum query, against $\mathrm{Q} = \Theta(n^{1/3})$ and $\mathrm{R} = \Theta(\sqrt n)$. Guessing a colliding pair is free; finding one is not.'}
    - {measure: QC, value: '\Theta(1)', refs: [Aaronson08], note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{fbs}}) = \Theta(1)$; a colliding pair is a two-query certificate and the promise makes it checkable.'}
    - {measure: lambda, value: '0', putative: true, note: 'The sensitivity graph on the promise is empty (see $\mathrm{s} = 0$: no single change of the table stays inside the promise), so $\lambda = 0$ while $\mathrm{Q} = \Theta(n^{1/3})$. Huang''s $\deg \le \lambda^2$ is a total-function theorem.'}
    - {measure: CGpub, value: '\Theta(1)', putative: true, refs: [CGLMSG23], note: 'Both players output the *same* uniformly random position $i$. A two-to-one $g$ and a one-to-one $g''$ can agree only on a set where $g$ is injective, i.e. on at most one point of each of the $n/2$ pairs, so they differ on $\ge n/2$ positions and the strategy wins with probability $\ge 1/2$. Hence $\mathrm{CG}^{\mathrm{pub}} \le 2$, and $\ge \mathrm{fbs} = 2$.'}
    - {measure: CGstar, value: '\Theta(1)', refs: [CGLMSG23], note: 'Between $\mathrm{CG}^{\mathrm{ns}} \ge 1$ and $\mathrm{CG}^{\mathrm{pub}} = \Theta(1)$.'}
    - {measure: CGns, value: '\Theta(1)', refs: [CGLMSG23], note: 'Between $1$ and $\mathrm{CG}^{*}$.'}
    - {measure: CA, value: '\Theta(1)', conf: medium, refs: [CGLMSG23], note: '$\mathrm{CA} = \Theta(\mathrm{CG}^{\mathrm{pub}}) = \Theta(1)$, with $\mathrm{CA} \ge \mathrm{fbs} = 2$ from below. So *both* adversary methods fail on the collision problem: the positive quantum one by the certificate barrier ($\mathrm{Adv} = O(1)$) and the classical one for the same combinatorial reason, while $\mathrm{R} = \Theta(\sqrt n)$.'}
    - {measure: CG, value: 'O(n)', putative: true, refs: [CGLMSG23], note: 'Private coins: both players output a uniformly random position, winning with probability $|\Delta|/n^2 \ge 1/(2n)$. The total-function sandwich $\mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1 = O(n)$ happens to give the same bound but is not available on a promise problem, so the strategy is the proof. From below only $\Omega(\mathrm{CG}^{\mathrm{pub}}) = \Omega(1)$.'}
    - {measure: EC, value: 'O(\sqrt n)', putative: true, note: 'Uniform weights $w_i = \sqrt{2/n}$: two inputs of different value differ in $\ge n/2$ positions, so their weighted product is $\ge 1$, at cost $\sqrt{2n}$. From below $\mathrm{EC} \ge \mathrm{fbs} = 2$. Not via $\mathrm{EC} \le \mathrm{C}$, which is a total-function statement.'}
    - {measure: R1, value: '\Theta(n)', putative: true, note: 'With $1$ = "two-to-one": an algorithm that is *certain* on the $1$-side never outputs $0$ on a two-to-one input, so whenever it does output $0$ it must hold a $0$-certificate, i.e. $n/2+1$ distinct values. It must do so with probability $\ge 2/3$ on one-to-one inputs, so $\mathrm{R}^1 = \Omega(n)$; and $\mathrm{R}^1 \le \mathrm{D} = n/2+1$.'}
    - {measure: Q0, value: 'O(n)', note: 'At most $\mathrm{R}_0 = n/2+1$; at least $\mathrm{Q} = \Omega(n^{1/3})$.'}
    - {measure: QE, value: 'O(n)', note: 'At most $\mathrm{D} = n/2+1$; at least $\mathrm{Q}_0 = \Omega(n^{1/3})$.'}
    - {measure: chi, value: 'O(\sqrt n)', note: '$\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(\sqrt n)$. The lower bound $\chi = \Omega(\mathrm{bs})$ [Li18] is total-only and would give only $\Omega(1)$ anyway.'}
    - {measure: chibar, value: '\Omega(n^{1/4})', note: '$\mathrm{R} = O(\bar\chi^2)$ holds for partial $g$, so $\bar\chi = \Omega(\sqrt{\mathrm{R}}) = \Omega(n^{1/4})$; and $\bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(\sqrt n)$.'}
    - {measure: LR, value: '\Omega(n^{1/4})', note: '$\mathrm{LR} = \Omega(\sqrt{\mathrm{R}})$ and $\mathrm{LR} \le \mathrm{R} = O(\sqrt n)$.'}
    - {measure: RS, value: '\Theta(1)', refs: [BenDavidKothari18], note: 'The reason sabotage complexity is a *total*-function measure. A one-to-one table and a two-to-one table can agree on at most one point of each of the $n/2$ pairs, so they differ in $\ge n/2$ of the $n$ cells (the same counting as $\mathrm{CG}^{\mathrm{pub}}$ above). Every sabotaged input therefore carries $\ge n/2$ stars, and one uniformly random query finds a star with probability $\ge 1/2$: $\mathrm{RS} \le 2$. From below $\mathrm{RS} \ge \mathrm{CA} = \Omega(1)$. [BenDavidKothari18, Sec. 1.4] state it exactly so -- "any sabotaged input to the collision problem has at least half the bits sabotaged making $\mathrm{RS}(f) = O(1)$, but $\mathrm{R}(f) = \Omega(\sqrt n)$" -- as the reason their quadratic upper bound $\mathrm{R} = O(\mathrm{RS}^2\log\mathrm{RS})$ has to assume totality.'}
    - {measure: Rstar, value: '\Omega(n^{1/3})', note: '$\mathrm{R}^{*} = \Omega(\mathrm{Q}) = \Omega(n^{1/3})$ since quantum query complexity composes perfectly, and $\mathrm{R}^{*} \le \mathrm{R} = O(\sqrt n)$. Whether iterated collision-finding costs $n^{1/3}$ or $n^{1/2}$ per level is open.'}
    - {measure: cjdeg, value: 'O(\sqrt n)', note: 'Between $\widetilde{\deg} = \Theta(n^{1/3})$ and $\mathrm{R} = \Theta(\sqrt n)$.'}
    - {measure: noisyR, value: 'O(\sqrt n)', note: '$\mathrm{noisyR} \le \mathrm{R}$. The implication "$\mathrm{R} = \Theta(\text{arity}) \Rightarrow \mathrm{noisyR} = \Theta(\mathrm{R})$" does not apply, since $\mathrm{R} = \Theta(\sqrt n)$ and the arity is $n$.'}
    - {measure: Np, value: '\widetilde\Theta(\sqrt n)', note: 'Between $\mathrm{R}$ and $O(\mathrm{R}\log\mathrm{R})$: repeat each read $O(\log n)$ times to make the whole transcript reliable.'}
    - {measure: prt, value: 'O(\sqrt n)', note: '$\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon = O(\sqrt n)$.'}
    - {measure: rprt, value: 'O(\sqrt n)', note: '$\overline{\mathrm{prt}} \le \mathrm{prt}$.'}
    - {measure: robustQ, value: '\widetilde\Theta(n^{1/3})', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log\mathrm{Q})$.'}
    - {measure: rank, value: 'O(n)', note: 'At most $\mathrm{D} = n/2+1$.'}
    - {measure: psD, value: '\Theta(\sqrt n)', note: 'Degenerate on a partial Boolean function: $\mathrm{psD} = \Theta(\mathrm{R}) = \Theta(\sqrt n)$. (The *search* version -- find a collision -- is the one where pseudo-determinism bites; the decision version has a unique answer.)'}
    - {measure: cbs, value: '2', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs} = 2$.'}
    - {measure: rdeg, value: 'O(n)', note: 'At most $\mathrm{C} = n/2+1$; from below $\mathrm{rdeg} \ge \mathrm{ndeg} = 2$ and $\mathrm{rdeg} \ge \widetilde{\mathrm{rdeg}}$.'}
  witnesses:
    - {of: [R0, R], setting: partial, statement: 'Quadratic: $\mathrm{R}_0 = n/2+1$ against $\mathrm{R} = \Theta(\sqrt n)$.'}
    - {of: [R, RS], setting: partial, statement: 'Unbounded: $\mathrm{R} = \Theta(\sqrt n)$ against $\mathrm{RS} = \Theta(1)$. This is the separation that confines $\mathrm{R} = O(\mathrm{RS}^2\log\mathrm{RS})$ to total functions [BenDavidKothari18, Sec. 1.4].'}
    - {of: [chibar, RS], setting: partial, statement: 'Unbounded: $\bar\chi = \Omega(\sqrt{\mathrm{R}}) = \Omega(n^{1/4})$ against $\mathrm{RS} = \Theta(1)$. Max-conflict complexity dominates sabotage complexity [GLSS19, Thm 7] and here it does so by an unbounded margin -- which is the point of introducing it.'}
    - {of: [LR, RS], setting: partial, statement: 'Unbounded: $\mathrm{LR} = \Omega(\sqrt{\mathrm{R}}) = \Omega(n^{1/4})$ against $\mathrm{RS} = \Theta(1)$.'}
  refs: [BHT98, AaronsonShi04, Kutin05, Ambainis05smallrange, Ambainis07, BenDavidKothari18, GLSS19]
  see_also: [ElementDistinctness, KDistinctness, Simon, RS, chibar, LR]

- id: ElementDistinctness
  name: Element distinctness
  symbol: '\mathrm{ED}_n'
  group: quantum
  order: 51
  kind: total
  arity: '$n$ symbols from a large alphabet'
  short: '$\mathrm{Q}=\Theta(n^{2/3})$ vs $\mathrm{R}=\Theta(n)$; a total (non-Boolean-input) function.'
  definition: 'Decide whether all $n$ input symbols are distinct.'
  values:
    - {measure: Q, value: '\Theta(n^{2/3})', refs: [Ambainis07, AaronsonShi04, Ambainis05smallrange], note: 'Upper: the quantum walk of [Ambainis07]. Lower: the polynomial method [AaronsonShi04], which needs alphabet size $\Omega(n^2)$; [Ambainis05smallrange] gets $\Omega(n^{2/3})$ down to alphabet size $n$. The $\varepsilon$-dependence is $\Theta(n^{2/3}\log^{1/3}(1/\varepsilon))$ [SherstovThaler23].'}
    - {measure: R, value: '\Theta(n)'}
    - {measure: D, value: 'n'}
    - {measure: Advpm, value: '\Theta(n^{2/3})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n^{2/3})$ here.'}
    - {measure: gamma2, value: '\Theta(n^{2/3})', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(n^{2/3})$ here.'}
    - {measure: MAdv, value: '\Theta(n^{2/3})', refs: [Spalek08], note: '$\mathrm{Adv}^{\pm}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\varepsilon}(f)$ and $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}_\varepsilon)$, so the multiplicative adversary is $\Theta(\mathrm{Q})$ on every function; here $\mathrm{Q} = \Theta(n^{2/3})$.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.'}
    - {measure: Adv, value: 'O(\sqrt n)', refs: [SpalekSzegedy06, Zhang05, HoyerSpalek05], note: 'A colliding pair is a $2$-query certificate, but distinctness itself needs all $n$ values: with the convention $\mathrm{ED}_n = 1$ on all-distinct inputs, $\mathrm{C}^1 = n$ and $\mathrm{C}^0 = 2$. The barrier caps the *product*, so $\mathrm{Adv} \le \sqrt{2n} = O(\sqrt n)$ -- short of $\mathrm{Q} = \Theta(n^{2/3})$, but not the $O(1)$ that a one-sided reading of the barrier would suggest. See [[Collision]] for the case where the collapse really is total.'}
    - {measure: C, value: 'n', putative: true, note: 'Certifying *distinctness* requires reading every symbol -- leave one out and it could duplicate another -- so one side of the function has $\mathrm{C} = n$, while a repeated pair certifies the other side in $2$ queries.'}
    - {measure: Cmin, value: '2', putative: true, note: 'A repeated pair.'}
    - {measure: C1, value: 'n', putative: true, note: '$\mathrm{ED}_n = 1$ means *all distinct*, and no proper subset of the symbols certifies that: whatever is left unread could duplicate something.'}
    - {measure: C0, value: '2', putative: true, note: 'A colliding pair. This is the lopsided pair of certificate complexities that defeats the positive-weight adversary -- see the [[Adv]] entry.'}
    - {measure: s1, value: 'n', putative: true, note: 'At an all-distinct input, overwriting $x_i$ with $x_j$ flips the answer for every $i$.'}
    - {measure: s0, value: '2', putative: true, note: 'A $0$-input can only be fixed by one symbol change if it has exactly one colliding pair $\{i,j\}$ and is otherwise distinct, and then only $i$ and $j$ are sensitive; every other $0$-input is less sensitive still.'}
    - {measure: bs1, value: 'n', putative: true, note: 'The $n$ singleton blocks at an all-distinct input.'}
    - {measure: bs0, value: '2', putative: true, note: 'A block disjoint from the unique colliding pair cannot break the collision, so the two singletons $\{i\},\{j\}$ are all there is.'}
    - {measure: Dna, value: 'n', note: 'Every symbol is relevant, so a non-adaptive algorithm reads all of them -- which here costs nothing, since $\mathrm{D}=n$ anyway.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Sandwiched between $\mathrm{R} = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}} = n$.'}
    - {measure: s, value: 'n', putative: true, note: 'Counting a query as one symbol read. At an all-distinct input every one of the $n$ coordinates is sensitive: overwrite $x_i$ with $x_j$ for any $j \ne i$ and the answer flips. So $\mathrm{s} = n$, and unlike the promise problems in this file the total function [[ElementDistinctness]] is as sensitive as it can be.'}
    - {measure: bs, value: 'n', putative: true, note: 'The $n$ singleton blocks above are disjoint, and $\mathrm{bs} \le n$.'}
    - {measure: fbs, value: 'n', putative: true, note: 'Between $\mathrm{bs} = n$ and $n$.'}
    - {measure: FC, value: 'n', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: '\Theta(n)', note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = \Theta(n)$; also squeezed between $\mathrm{fbs}$ and $\mathrm{R} = \Theta(n)$.'}
    - {measure: EC, value: '\Theta(n)', note: 'Squeezed between $\mathrm{fbs} = n$ and $\mathrm{C} = n$.'}
    - {measure: UC, value: 'n', putative: true, note: 'Squeezed between $\mathrm{C} = n$ and $\mathrm{D} = n$.'}
    - {measure: SP, value: 'n', putative: true, note: 'Squeezed between $\mathrm{C} = n$ and $\mathrm{D} = n$.'}
    - {measure: UCmin, value: 'O(n)', note: 'Squeezed between $\mathrm{C}_{\min} = 2$ and $\mathrm{UC} = n$. $\mathrm{UC}_{\min} = \min\{\mathrm{UC}^0,\mathrm{UC}^1\}$ is worst-case *within the cheaper side*, not a minimum over inputs, so the width-$2$ collision certificates (which live on the $0$-side under the convention $\mathrm{ED}_n = 1$ on all-distinct inputs) do not give $O(1)$: an input with many repeats has many such pairs and the family must disambiguate them.'}
    - {measure: Dmu, value: '\Theta(n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \Theta(n)$.'}
    - {measure: CA, value: '\Theta(n)', note: '$\mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(n)$ for total functions; also $\mathrm{CA} \le \mathrm{R} = \Theta(n)$. So the *classical* adversary is tight here while the *positive quantum* adversary caps out at $O(\sqrt n)$.'}
    - {measure: deg, value: 'n', putative: true, note: 'Encode a symbol $x_i$ by the indicators $x_{i,v}$, one block per position; every function on $\Sigma^n$ is then multilinear of degree $\le n$, via $\sum_x f(x)\prod_i x_{i,x_i}$. For the matching lower bound restrict the domain to $x_i \in \{0, i\}$, where $0$ is a fixed symbol and the $i$ are pairwise distinct: writing $z_i = [x_i = 0]$, the input is all-distinct exactly when at most one $z_i$ is $1$, so $\mathrm{ED}_n$ restricts to $\lnot\mathrm{Th}^n_2$ on a Boolean cube of full dimension. That is a non-constant symmetric function whose univariate interpolant takes the values $1,1,0,\dots,0$, with leading coefficient proportional to $1 - n \ne 0$, hence degree exactly $n$. Restriction cannot raise degree, so $\deg(\mathrm{ED}_n) = n$: on the exact-degree scale there is no speedup at all, in sharp contrast with $\widetilde{\deg} = \Theta(n^{2/3})$.'}
    - {measure: adeg, value: '\Theta(n^{2/3})', refs: [AaronsonShi04, Ambainis05smallrange, Ambainis07], note: 'Upper: $\widetilde{\deg} \le 2\mathrm{Q} = O(n^{2/3})$ by the polynomial method applied to the walk of [Ambainis07]. Lower: the $\Omega(n^{2/3})$ bound of [AaronsonShi04] *is* a degree bound -- it is proved by symmetrising a low-degree approximating polynomial -- and [Ambainis05smallrange] brings it down to alphabet size $n$. So $\widetilde{\deg}$ is the tight measure here while $\deg = n$.'}
    - {measure: sdeg, value: 'O(n^{2/3})', note: '$\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} = O(n^{2/3})$. No matching lower bound is recorded: sign degree ignores the size of the approximation error, and the $\Omega(n^{2/3})$ argument does not survive that relaxation.'}
    - {measure: odeg, value: 'O(n^{2/3})', note: 'Between $\mathrm{sdeg}$ and $\widetilde{\deg} = O(n^{2/3})$.'}
    - {measure: ardeg, value: 'O(n^{2/3})', note: '$\mathrm{rdeg}_{\varepsilon} \le \widetilde{\deg}_{\varepsilon} = O(n^{2/3})$. The *exact* rational degree is much bigger -- see [[rdeg]] -- so allowing error is what buys the $n^{1/3}$ factor.'}
    - {measure: PostQ, value: 'O(n^{2/3})', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = O(n^{2/3})$; post-selection buys nothing beyond the ordinary quantum walk here.'}
    - {measure: ndeg, value: '\Theta(n)', putative: true, note: 'Upper: $\mathrm{ndeg} \le \mathrm{C}^1 = n$. Lower: restrict to $x_i \in \{0,i\}$ as in the [[deg]] entry, so that $\mathrm{ED}_n$ becomes "at most one $z_i = 1$". A multilinear $p$ that is nonzero exactly on the $n+1$ points of weight $\le 1$ has Moebius coefficients $c_S = (-1)^{|S|}(a_0 - \sum_{i \in S} a_i)$ for $|S| \ge 1$, where $a_0 = p(0)$ and $a_i = p(e_i)$ are all nonzero. Killing every coefficient of degree $n$ forces $a_0 = \sum_i a_i$, and killing every coefficient of degree $n-1$ forces $a_0 = \sum_{i \ne j} a_i$ for each $j$; together these give $a_j = 0$, a contradiction. Hence $\mathrm{ndeg} \ge n-1$.'}
    - {measure: NQ, value: '\Theta(n)', note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2 \rceil$ and $\mathrm{ndeg} = \Theta(n)$. Certifying *distinctness* nondeterministically is as hard as it gets, even though the other side needs only a single colliding pair.'}
    - {measure: rdeg, value: '\Theta(n)', note: '$\mathrm{rdeg} = \max\{\mathrm{ndeg}(f), \mathrm{ndeg}(\bar f)\}$. The two sides are wildly asymmetric: $\mathrm{ndeg}(\bar f) \le 2$, since $\sum_{i<j}\sum_v x_{i,v}x_{j,v}$ counts colliding pairs and so is nonzero exactly when a collision exists, while $\mathrm{ndeg}(f) = \Theta(n)$. The max is $\Theta(n)$, matching $\mathrm{rdeg} \le \mathrm{C} = n$.'}
    - {measure: QE, value: '\Theta(n)', refs: [BBCMdW01], note: 'Squeezed between $\deg/2 = n/2$ and $\mathrm{D} = n$. Exact quantum query complexity gets no asymptotic speedup on element distinctness, while bounded error gets $n^{2/3}$ -- the whole advantage lives in the error.'}
    - {measure: Q0, value: '\Theta(n)', note: 'A zero-error algorithm is in particular a nondeterministic one for both $f$ and $\bar f$, so $\mathrm{Q}_0 \ge \mathrm{NQ} = \Theta(n)$; and $\mathrm{Q}_0 \le \mathrm{Q}_{\mathrm{E}} = \Theta(n)$. So the $n^{2/3}$ walk really does need two-sided error: forbidding it costs the full $n^{1/3}$ factor.'}
    - {measure: QC, value: '\Theta(\sqrt n)', refs: [Aaronson08], note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{RC}})$ and $\mathrm{RC} = \Theta(n)$. Directly: at an all-distinct $x$ every adversary $y$ with $\mathrm{ED}(y) = 0$ differs from $x$ in one symbol, so distinguishing $x$ from all of them is unstructured search, $\mathrm{RC}_x = \Theta(n)$ and $\mathrm{QC}_x = \Theta(\sqrt n)$. Note $\mathrm{QC} = \Theta(\sqrt n)$ sits *below* $\mathrm{Q} = \Theta(n^{2/3})$: verifying is easier than deciding.'}
    - {measure: lambda, value: '\Theta(\sqrt n)', putative: true, refs: [Huang19], note: 'Take the sensitivity graph on the Hamming graph of $\Sigma^n$. Restricting to the subcube $x_i \in \{0,i\}$ of the [[deg]] entry keeps single-symbol changes adjacent, so the restricted sensitivity matrix is a principal submatrix and $\lambda(\mathrm{ED}_n) \ge \lambda(\lnot\mathrm{Th}^n_2) \ge \sqrt{\deg(\lnot\mathrm{Th}^n_2)} = \sqrt n$ by [Huang19], which applies because the restriction is a total Boolean function. Above, $\lambda \le \mathrm{Adv} = O(\sqrt n)$.'}
    - {measure: cjdeg, value: '\Theta(n)', putative: true, note: 'Upper: a randomized algorithm of cost $\mathrm{R}$ is a distribution over leaves, i.e. a width-$\mathrm{R}$ conical junta, so $\mathrm{cjdeg} \le \mathrm{R} = O(n)$. Lower: restrict to $x_i \in \{0,i\}$, which sends every block literal to a $z$-literal or a constant and hence maps conical juntas to conical juntas of no greater width. Let $h = \sum_C \alpha_C C$ have width $d$ and approximate "at most one $z_i = 1$". Only all-negative conjunctions fire at $z = 0$, so those carry total weight $\ge 2/3$; each such $C$, of support $S$, also fires at a weight-$2$ input $e_i + e_j$ unless $S$ meets $\{i,j\}$, which for a uniformly random pair happens with probability $\le 2d/n$. Averaging, $1/3 \ge (2/3)(1 - 2d/n)$, so $d \ge n/4$. This separates $\mathrm{cjdeg} = \Theta(n)$ from $\widetilde{\deg} = \Theta(n^{2/3})$: non-negativity costs the whole gap.'}
    - {measure: prt, value: '\Theta(n)', refs: [JainKlauck10], note: 'Squeezed between $(1-4\varepsilon)\mathrm{CA} + \log\varepsilon = \Omega(n)$ and $2\mathrm{R} = O(n)$.'}
    - {measure: rprt, value: '\Theta(n)', refs: [KLLRX15], note: 'The relaxation keeps every classical lower bound the partition bound subsumes, in particular $\Omega(\mathrm{bs}) = \Omega(n)$, and $\overline{\mathrm{prt}} \le \mathrm{prt} = \Theta(n)$.'}
    - {measure: CG, value: '\Theta(n)', refs: [CGLMSG23], note: 'The sandwich $\max\{\mathrm{Adv}^2, \mathrm{R}_0, \mathrm{CA}\} \le \mathrm{CG} \le \min\{\mathrm{C}^0\mathrm{C}^1, O(\mathrm{EC}^2)\}$ needs a total function, and this one is total: $\mathrm{R}_0 = \Theta(n)$ below and $\mathrm{C}^0\mathrm{C}^1 = 2n$ above. Note how tight the certificate-product bound is here precisely because the two sides are lopsided -- compare [[Forrelation]], where the same product is worthless.'}
    - {measure: CGpub, value: '\Theta(n)', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{CA}) = \Theta(n)$. Unlike the promise problems in this file, the public-coin game gains nothing over the private-coin one here.'}
    - {measure: CGstar, value: '\Theta(n)', note: 'Between $\mathrm{CG}^{\mathrm{ns}}$ and $\mathrm{CG}^{\mathrm{pub}}$, both $\Theta(\mathrm{CA}) = \Theta(n)$.'}
    - {measure: CGns, value: '\Theta(n)', note: 'All three shared-resource variants collapse to $\Theta(\mathrm{CA}) = \Theta(n)$; only private coin can escape, and here it does not.'}
    - {measure: chi, value: '\Theta(n)', refs: [Li18], note: '$\chi = \Omega(\mathrm{bs}) = \Omega(n)$ for total functions [Li18], and $\chi \le \bar\chi \le \mathrm{LR} \le \mathrm{R} = O(n)$.'}
    - {measure: chibar, value: '\Theta(n)', refs: [GLSS19], note: 'Squeezed between $\chi = \Theta(n)$ and $\mathrm{LR} \le \mathrm{R} = O(n)$, so the whole composition-theorem family is tight here and $\mathrm{R}(f \circ \mathrm{ED}^m) = \Omega(\mathrm{R}(f)\,n)$.'}
    - {measure: LR, value: '\Theta(n)', note: 'Between $\bar\chi = \Theta(n)$ and $\mathrm{R} = \Theta(n)$. Element distinctness composes perfectly on the randomized side, unlike the partial functions above where $\mathrm{LR}$ can drop to $\sqrt{\mathrm{R}}$.'}
    - {measure: RS, value: '\Theta(n)', refs: [BenDavidKothari18], note: 'Between $\mathrm{CA} = \Theta(n)$ and $\mathrm{R} = \Theta(n)$; equivalently $\bar{\mathrm{R}} \ge (1-2\varepsilon)\mathrm{RS}$ above and $\bar\chi = \Omega(\mathrm{RS})$ is consistent below.'}
    - {measure: Rstar, value: '\Theta(n)', refs: [BBGM22], note: '$\mathrm{R}^* \ge \Omega(\mathrm{LR}) = \Omega(n)$ and $\mathrm{R}^* \le \mathrm{R} = O(n)$, so repeated self-composition loses nothing.'}
    - {measure: D_prod, value: '\Theta(n)', putative: true, note: 'Upper: $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R} = O(n)$. Lower: take $\mu$ to be $n$ independent uniform symbols from an alphabet of size $n^2$ -- a product distribution. By the birthday bound the input is all-distinct with probability $e^{-1/2} + o(1)$, so both answers have constant mass, and because the coordinates are i.i.d. adaptivity is useless: after $q$ symbol-reads the algorithm has seen a collision with probability at most $\binom{q}{2}/n^2$, and otherwise its posterior is the same as at the start. Erring with probability $\le 1/3$ therefore needs $q = \Omega(n)$. This is worth recording because $\mathrm{D}^{\mathrm{prod}}$ *can* be far below $\mathrm{R}$ -- a collision is a correlation between two coordinates, which product distributions cannot plant on purpose, yet the birthday paradox plants one for free.'}
    - {measure: psD, value: '\Theta(n)', note: 'Degenerate on a total function: only one correct answer, so $\mathrm{psD} = \Theta(\mathrm{R}) = \Theta(n)$.'}
    - {measure: cbs, value: 'n', refs: [GoosPitassi14], note: 'Degenerate on a Boolean-valued function: every input is critical and the solution function is forced, so $\mathrm{cbs} = \mathrm{bs} = n$.'}
    - {measure: Np, value: '\widetilde\Theta(n)', note: 'Sandwiched: $\mathrm{R} \le \mathrm{N}_p = O(\mathrm{R}\log \mathrm{R})$, with $\mathrm{R} = \Theta(n)$. Setting the noise rate to $0$ recovers the ordinary model, and majority-voting each read $O(\log n)$ times is the generic upper bound.'}
    - {measure: noisyR, value: '\Theta(n)', conf: medium, refs: [CKMPSS23], note: 'Upper: $\mathrm{noisyR} \le \mathrm{R}$. Lower: the recorded $\mathrm{R} = \Theta(n)$ is linear in the arity, and the zoo entry for [[noisyR]] vs [[R]] records $\mathrm{R}(f)=\Theta(n) \Rightarrow \mathrm{noisyR}(f)=\Theta(\mathrm{R}(f))$ -- at the top of the range there is no room for fractional queries. Contrast [[Collision]], where $\mathrm{R} = \Theta(\sqrt n)$ and the shortcut is unavailable.'}
    - {measure: robustQ, value: '\widetilde\Theta(n^{2/3})', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log\mathrm{Q})$, with $\mathrm{Q} = \Theta(n^{2/3})$. A noisy oracle costs at most a log factor.'}
  notes: 'A reminder that the "total function" theory in this zoo is for *Boolean* inputs; large alphabets change the picture (here $\mathrm{R}=\Theta(\mathrm{Q}^{3/2})$, which is fine, but the polynomial-relation proofs are alphabet-sensitive).'
  refs: [Ambainis07, AaronsonShi04, Ambainis05smallrange, SherstovThaler23]
  see_also: [Collision, KDistinctness, Q]

- id: AmbainisBelovsFn
  name: Ambainis-Belovs function
  symbol: '\mathrm{TSAT}_n'
  aliases: ['threshold satisfiability', 'tripartite shift problem']
  group: quantum
  order: 52
  kind: partial
  arity: '$3n$ variables over an alphabet $[q]$ with $q \ge n^{12}$ (so $\Theta(n\log n)$ bits after binary encoding)'
  short: 'Constant exact degree ($\le 9$) against $\mathrm{Q} = \Omega(n^{1/3})$: the polynomial method is exponentially lossy off-promise.'
  definition: |
    *Threshold satisfiability.* Fix a system of $n^3$ "tripartite" linear
    equations over $\mathbb{Z}_q$, one for each triple of variables taken from
    three disjoint blocks $A, B, C$ of size $n$. Given an assignment, distinguish
    "no equation is satisfied" from "exactly $n$ equations are satisfied".

    A counting argument picks right-hand sides for which *no* assignment ever
    satisfies as many as $4n$ equations. The number of satisfied equations is
    then a degree-$3$ polynomial taking values in $[0, 4n)$, and squashing it
    through a fixed univariate cubic that sends $0 \mapsto 0$, $1 \mapsto 1$ and
    keeps $[0,4]$ inside $[0,1]$ represents the function *exactly* in degree $9$.
    The quantum lower bound is a negative-weight adversary bound, and it has to
    be: the positive adversary is at most quadratic in the degree even for
    partial functions, so it could never prove more than $O(1)$ here.
  formal: |
    Variables $x_1,\dots,x_{3n} \in \mathbb{Z}_q$; index blocks
    $A = \{1,\dots,n\}$, $B = \{n+1,\dots,2n\}$, $C = \{2n+1,\dots,3n\}$; fixed
    right-hand sides $r_{a,b,c} \in \mathbb{Z}_q$. Write
    $$K(x) \;=\; \#\{(a,b,c) \in A\times B\times C \;:\; x_a + x_b + x_c = r_{a,b,c}\}.$$
    Then $f(x) = 0$ if $K(x) = 0$, $f(x) = 1$ if $K(x) = n$, and $f$ is undefined
    otherwise. The $r_{a,b,c}$ are called *good* when $K(x) < 4n$ for every $x$;
    for $q \ge n^{12}$ a good choice exists by the probabilistic method.

    The lower bound is proved for the harder-to-satisfy *tripartite shift*
    restriction, in which the positive inputs are those whose set of satisfied
    equations is exactly a shifted tripartite matching
    $\mu_{s,t} = \{(j,\, n+1+(j+s \bmod n),\, 2n+1+(j+t \bmod n)) : j \in [n]\}$.
  values:
    - {measure: deg, value: '9', refs: [AmbainisBelovs23], note: 'Theorem 6, and the whole content of the upper bound. $K(x) = \sum_{a,b,c}\sum_{s,t} \mathbb{1}[x_a{=}s]\,\mathbb{1}[x_b{=}t]\,\mathbb{1}[x_c{=}r_{a,b,c}-s-t]$ has degree $3$ in the indicator variables $\mathbb{1}[x_i = v]$, and $T(z) = \tfrac14 z^3 - \tfrac32 z^2 + \tfrac94 z$ satisfies $T(0)=0$, $T(1)=1$ and $0 \le T \le 1$ on $[0,4]$, so $T(K(x)/n)$ represents $f$ exactly and is bounded on the whole cube. Degree $3 \times 3 = 9$, independent of $n$.'}
    - {measure: adeg, value: 'O(1)', note: 'At most $\deg \le 9$: an exactly representing polynomial is in particular an approximating one. So the separation below is simultaneously a $\mathrm{Q}$-vs-$\widetilde{\deg}$ separation, and that is the form in which it is usually quoted.'}
    - {measure: Q, value: '\Omega(n^{1/3})', refs: [AmbainisBelovs23], note: 'Theorem 1, via Theorem 8: the tripartite shift problem already needs $\Omega(n^{1/3})$ quantum queries whenever $q \ge 4n^3$, for *every* choice of right-hand sides. No matching upper bound is claimed; the construction is closely related to an earlier problem of Belovs and Rosmanis, whose lower bound it strengthens.'}
    - {measure: Advpm, value: '\Omega(n^{1/3})', refs: [AmbainisBelovs23], note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$, and here the negative-weight adversary is literally how the lower bound is obtained -- an explicit adversary matrix built from the shifted matchings.'}
    - {measure: Adv, value: 'O(1)', conf: medium, putative: true, note: 'The positive-weight adversary is at most quadratic in the exact degree even for partial functions (Anshu, Ben-David and Kundu), so $\mathrm{Adv} = O(\deg^2) = O(1)$ while $\mathrm{Q} = \Omega(n^{1/3})$. This is exactly why the paper cannot use the positive adversary, and it makes the function a second [[Adv]]-vs-[[Q]] witness alongside [[Simon]] and [[Collision]].'}
    - {measure: MAdv, value: '\Omega(n^{1/3})', note: 'Sandwiched from below: $\mathrm{MAdv} \ge \mathrm{Adv}^{\pm} = \Omega(n^{1/3})$.'}
    - {measure: gamma2, value: '\Omega(n^{1/3})', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \Omega(n^{1/3})$.'}
    - {measure: D, value: 'O(n)', note: 'Reading all $3n$ variables determines the answer; no matching lower bound is proved, only $\mathrm{D} \ge \mathrm{Q} = \Omega(n^{1/3})$.'}
    - {measure: Dna, value: 'O(n)', note: 'The same $3n$ positions, fixed in advance.'}
    - {measure: R, value: '\Omega(n^{1/3})', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{R} \le \mathrm{D}$, i.e. between $\Omega(n^{1/3})$ and $O(n)$. The paper says nothing more about the classical side.'}
    - {measure: Rbar, value: '\Omega(n^{1/3})', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: sdeg, value: 'O(1)', note: '$\mathrm{sdeg} \le \widetilde{\deg}_+ \le \widetilde{\deg} \le \deg \le 9$. Everything in the degree column is a constant here; that is the point of the construction.'}
    - {measure: odeg, value: 'O(1)', note: 'Between $\mathrm{sdeg}$ and $\widetilde{\deg} \le 9$.'}
    - {measure: rdeg, value: 'O(1)', note: 'Take $p$ to be the degree-$9$ exact representation and $q = 1$: a rational representation of degree $9$. So $\mathrm{rdeg} \le \deg \le 9$ while $\mathrm{Q} = \Omega(n^{1/3})$.'}
    - {measure: ardeg, value: 'O(1)', note: '$\mathrm{rdeg}_{\varepsilon} \le \mathrm{rdeg} = O(1)$.'}
    - {measure: PostQ, value: 'O(1)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon = \Theta(\mathrm{rdeg}_\varepsilon) = O(1)$ against $\mathrm{Q} = \Omega(n^{1/3})$. Post-selection is not the resource being separated -- rather, every polynomial-flavoured measure is blind to this function, which is precisely the failure of the polynomial method that [AmbainisBelovs23] exhibits.'}
    - {measure: ndeg, value: 'O(1)', note: 'The exact representation $T(K(x)/n)$ is nonzero exactly on the $1$-inputs of the domain, so $\mathrm{ndeg} \le \deg \le 9$.'}
    - {measure: NQ, value: 'O(1)', note: '$\mathrm{NQ} = \lceil \mathrm{ndeg}/2 \rceil \le 5$.'}
    - {measure: lambda, value: 'O(1)', note: '$\lambda \le \mathrm{Adv} = O(\deg^2) = O(1)$. Spectral sensitivity, like every other measure bounded by the positive adversary, cannot see the $\Omega(n^{1/3})$ lower bound.'}
    - {measure: QE, value: '\Omega(n^{1/3})', note: 'Sandwiched: $\mathrm{Q} \le \mathrm{Q}_0 \le \mathrm{Q}_{\mathrm{E}} \le \mathrm{D}$, i.e. between $\Omega(n^{1/3})$ and $O(n)$. Note that $\deg \le 2\mathrm{Q}_{\mathrm{E}}$ is useless in this direction -- $\deg$ is $9$.'}
    - {measure: Q0, value: '\Omega(n^{1/3})', note: 'Between $\mathrm{Q} = \Omega(n^{1/3})$ and $\mathrm{Q}_{\mathrm{E}} = O(n)$.'}
    - {measure: R0, value: '\Omega(n^{1/3})', note: 'Between $\mathrm{R} = \Omega(n^{1/3})$ and $\mathrm{D} = O(n)$.'}
    - {measure: R1, value: '\Omega(n^{1/3})', note: 'Between $\mathrm{R} = \Omega(n^{1/3})$ and $\mathrm{R}_0 = O(n)$.'}
    - {measure: Rna, value: '\Omega(n^{1/3})', note: 'Between $\mathrm{R} = \Omega(n^{1/3})$ and $\mathrm{D}^{\mathrm{na}} = O(n)$.'}
    - {measure: Dmu, value: '\Omega(n^{1/3})', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \Omega(n^{1/3})$.'}
    - {measure: Rstar, value: '\Omega(n^{1/3})', note: '$\mathrm{R}^* \ge \Omega(\mathrm{Q}) = \Omega(n^{1/3})$, since quantum query complexity composes perfectly -- a chain that, unlike $\mathrm{R}^* = \Omega(\mathrm{LR})$, is available for partial functions.'}
    - {measure: robustQ, value: '\Omega(n^{1/3})', note: 'Robust queries are at least as expensive as exact ones: $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = \Omega(n^{1/3})$.'}
    - {measure: D_size, value: '\Omega(n^{2/3})', note: '$\mathrm{Q}_{2/5}(f) = O(\sqrt{\mathrm{DTsize}(f)})$, so $\mathrm{DTsize} = \Omega(\mathrm{Q}^2) = \Omega(n^{2/3})$. This is one of the few places where a *degree-blind* lower bound propagates: the tree-size bound goes through $\mathrm{Q}$, not through $\deg$.'}
    - {measure: C, value: 'O(n)', note: 'Reading all $3n$ variables is a certificate for either side. Nothing smaller is proved, and note that certificate complexity is not a lower-bound technique that could reach $\Omega(n^{1/3})$ anyway: $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1}$ is already known to be $O(1)$ here.'}
    - {measure: C1, value: 'O(n)', note: 'At most $\mathrm{C} = O(n)$.'}
    - {measure: C0, value: 'O(n)', note: 'At most $\mathrm{C} = O(n)$.'}
    - {measure: bs, value: 'O(1)', refs: [Ambainis02], note: '$\mathrm{bs} \le \mathrm{Adv}^2 = O(1)$ -- a chain that holds for partial functions, because each $x^{B_j}$ in Ambainis'' argument is a domain point by definition of a sensitive block. So block sensitivity is blind to the $\Omega(n^{1/3})$ lower bound, as is everything below it.'}
    - {measure: s, value: 'O(1)', note: '$\mathrm{s} \le \mathrm{bs} = O(1)$.'}
    - {measure: bs0, value: 'O(1)', note: 'Both sides are capped: $\mathrm{Adv} = \Omega(\sqrt{\mathrm{bs}^0\,\mathrm{bs}^1})$ and $\mathrm{bs}^0, \mathrm{bs}^1 \le \mathrm{bs} = O(1)$.'}
    - {measure: bs1, value: 'O(1)', note: 'At most $\mathrm{bs} = O(1)$.'}
    - {measure: s0, value: 'O(1)', note: 'At most $\mathrm{bs}^0 = O(1)$.'}
    - {measure: s1, value: 'O(1)', note: 'At most $\mathrm{bs}^1 = O(1)$.'}
    - {measure: psD, value: '\Omega(n^{1/3})', note: 'Degenerate on a partial Boolean function: $\mathrm{psD} = \Theta(\mathrm{R}) = \Omega(n^{1/3})$, with $\mathrm{psD} \le \mathrm{D} = O(n)$ above.'}
    - {measure: cbs, value: 'O(1)', refs: [GoosPitassi14], note: 'Degenerate on a Boolean function: $\mathrm{cbs} = \mathrm{bs} = O(1)$. So the measure is as blind to this function as block sensitivity is.'}
    - {measure: fbs, value: 'O(n)', note: 'At most $\mathrm{C} = O(n)$. The total-function shortcut $\mathrm{fbs} = \Theta(\mathrm{CA})$ [ABIKPS17] is unavailable on a promise, and the bound $\mathrm{fbs} = O(\widetilde{\deg}^2)$ is recorded only for total $f$, so nothing pins this to $O(1)$ even though $\mathrm{bs} = O(1)$.'}
    - {measure: FC, value: 'O(n)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: 'O(n)', refs: [Aaronson06], note: '$\mathrm{RC} = \Theta(\mathrm{fbs}) = O(n)$.'}
    - {measure: QC, value: 'O(\sqrt n)', refs: [Aaronson06], note: '$\mathrm{QC} = \Theta(\sqrt{\mathrm{fbs}}) = O(\sqrt n)$. The other ceiling, $\mathrm{QC} \le \mathrm{Q}$, is useless here because only a lower bound on $\mathrm{Q}$ is known.'}
    - {measure: EC, value: 'O(n)', putative: true, note: 'Exhibited directly, since $\mathrm{EC} \le \mathrm{C}$ needs a total function. Put $w^x_i = 1$ at every input and each of the $3n$ variables: any two inputs of different value differ somewhere, so $\sum_{i : x_i \ne y_i} w^x_i w^y_i \ge 1$, at cost $3n$.'}
    - {measure: CA, value: 'O(n)', note: '$\mathrm{CA} \le \mathrm{R} \le \mathrm{D} = O(n)$. From below only $\mathrm{CA} = \Omega(\mathrm{fbs}) = \Omega(1)$, so this is not pinned. Note $\mathrm{CA} = \Theta(\mathrm{fbs})$ is a total-function theorem and must not be used here.'}
    - {measure: CGpub, value: 'O(n)', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}} = \Theta(\mathrm{CA}) = O(n)$ -- the LP-duality collapse survives a promise. Directly: on a shared random one of the $3n$ positions the players win with probability $\ge 1/(3n)$.'}
    - {measure: CGstar, value: 'O(n)', refs: [CGLMSG23], note: 'Equal to $\mathrm{CG}^{\mathrm{pub}}$ up to constants.'}
    - {measure: CGns, value: 'O(n)', refs: [CGLMSG23], note: 'Equal to $\mathrm{CG}^{\mathrm{pub}}$ up to constants.'}
    - {measure: CG, value: 'O(n^2)', putative: true, note: 'Private coins: both players output a uniformly random one of the $3n$ positions, winning with probability $\ge 1/(3n)^2$. The sandwich $\max\{\mathrm{Adv}^2,\mathrm{R}_0,\mathrm{CA}\} \le \mathrm{CG} \le \min\{\mathrm{C}^0\mathrm{C}^1, O(\mathrm{EC}^2)\}$ is a total-function statement and is not used here.'}
    - {measure: Cmin, value: 'O(n)', note: 'At most $\mathrm{C} = O(n)$, i.e. $\min\{\mathrm{C}^0,\mathrm{C}^1\} \le O(n)$.'}
    - {measure: UC, value: 'O(n)', note: 'At most $\mathrm{D} = O(n)$; equal to $\mathrm{SP}$.'}
    - {measure: SP, value: 'O(n)', note: 'Equal to $\mathrm{UC}$, and at most $\mathrm{D} = O(n)$.'}
    - {measure: UCmin, value: 'O(n)', note: 'At most $\mathrm{UC} = O(n)$.'}
    - {measure: rank, value: 'O(n)', note: 'At most $\mathrm{D} = O(n)$.'}
    - {measure: chibar, value: '\Omega(n^{1/6})', note: '$\bar\chi = \Omega(\sqrt{\mathrm{R}})$ holds for partial $g$ as well, and $\mathrm{R} = \Omega(n^{1/3})$. Above, $\bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(n)$.'}
    - {measure: LR, value: '\Omega(n^{1/6})', refs: [BBGM22], note: '$\mathrm{LR} = \Omega(\sqrt{\mathrm{R}}) = \Omega(n^{1/6})$, with $\mathrm{LR} \le \mathrm{R} = O(n)$ above.'}
    - {measure: chi, value: 'O(n)', note: '$\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R} = O(n)$.'}
    - {measure: RS, value: 'O(n)', note: 'From $\mathrm{RS} = O(\bar\chi) = O(\mathrm{LR}) = O(\mathrm{R}) = O(n)$.'}
    - {measure: cjdeg, value: 'O(n)', note: 'Sandwiched between $\widetilde{\deg} = O(1)$ and $\mathrm{R} = O(n)$; nothing pins it, which is the point -- conflict-degree tracks $\mathrm{R}$, not $\widetilde{\deg}$, and this function separates the two.'}
    - {measure: prt, value: 'O(n)', note: 'From $\mathrm{prt}_\varepsilon \le 2\mathrm{R}_\varepsilon = O(n)$.'}
    - {measure: rprt, value: 'O(n)', note: 'From $\overline{\mathrm{prt}}_\varepsilon \le \mathrm{prt}_\varepsilon = O(n)$.'}
    - {measure: noisyR, value: 'O(n)', note: 'At most $\mathrm{R} = O(n)$. The shortcut $\mathrm{R} = \Theta(\text{arity}) \Rightarrow \mathrm{noisyR} = \Theta(\mathrm{R})$ is unavailable: only $\mathrm{R} = \Omega(n^{1/3})$ is known.'}
    - {measure: Np, value: '\Omega(n^{1/3})', note: 'At least $\mathrm{R}$: setting the noise rate to $0$ recovers the ordinary model. Above, $\mathrm{N}_p = O(\mathrm{R}\log\mathrm{R}) = \widetilde O(n)$.'}
    - {measure: D_prod, value: 'O(n)', note: 'At most $\mathrm{R} = O(n)$. Unlike [[Forrelation]] the promise does not force $\mathrm{D}^{\mathrm{prod}} = 0$: two inputs of opposite value can differ in a single variable, so a rectangle inside the promise can meet both sides.'}
  witnesses:
    - {of: [Q, deg], setting: partial, statement: 'For every $q \ge n^{12}$ there is a partial $f : D \to \{0,1\}$ with $D \subseteq [q]^{3n}$, exact polynomial degree at most $9$, and $\mathrm{Q}(f) = \Omega(n^{1/3})$ -- constant degree against polynomial quantum query complexity. Binary-encoding the alphabet ($q$ the least power of two above $n^{12}$) gives a partial *Boolean* function on $N$ bits with $\deg = O(\log N)$ and $\mathrm{Q} = \widetilde\Omega(N^{1/3})$, i.e. $\mathrm{Q} = 2^{\Omega(\deg)}$.', refs: [AmbainisBelovs23]}
    - {of: [Q, adeg], setting: partial, statement: 'The same construction, since $\widetilde{\deg} \le \deg \le 9$: exponential in the Boolean encoding, constant-vs-polynomial over an unbounded alphabet. A second proof, via a total search problem, is given by [BenDavidKundu24search].', refs: [AmbainisBelovs23, BenDavidKundu24search]}
    - {of: [Q, Adv], setting: partial, statement: 'The positive adversary is $O(\deg^2) = O(1)$ here, against $\mathrm{Q} = \Omega(n^{1/3})$; the lower bound genuinely needs negative weights.', refs: [AmbainisBelovs23]}
  notes: |
    The alphabet is what carries the separation: over $[q]$ with $q \ge n^{12}$ the
    exact degree is an absolute constant. Binary encoding costs a factor
    $\log q = \Theta(\log n)$ in the degree and only polylogarithmic factors in
    the input length, which is how the constant-vs-polynomial statement becomes
    an exponential one for Boolean functions.
  refs: [AmbainisBelovs23, BenDavidKundu24search]
  see_also: [BDKrelation, deg, adeg, Q, Adv, Advpm]

- id: BDKrelation
  name: Ben-David-Kundu total search problems
  symbol: '\mathrm{AndOr}_{\mathcal{H},t}'
  aliases: ['shifted AND-OR search problem', 'query TFNP separations']
  group: relational
  order: 53
  kind: relation
  arity: '$t\,n^2\log(n/2)$ bits, in $t$ blocks of $n^2\log(n/2)$; the separating setting is $t = \log^5 n$'
  short: 'A *total* search problem with $\mathrm{Q} = \Omega(\sqrt n\log^4 n)$ but conical junta degree $O(\log^7 n)$ -- exponential, and against a measure usually *larger* than $\mathrm{R}$.'
  definition: |
    Start from $\mathrm{AndOr}_n$: an $\mathrm{OR}$ of size $n^2$ of $\mathrm{AND}$s of
    size $\log(n/2)$, viewed as the *search* problem "given a $1$-input, output the
    index of an all-$1$ block". This is a promise problem -- an input with no all-$1$
    block has no valid output.

    Totality is bought by shifting. Fix a family $\mathcal{H}$ of $\log^2 n$-wise
    independent functions and take $t$ independent copies $x^1,\dots,x^t$; a valid
    output is a tuple $(i_1,\dots,i_t)$ together with a shift $h \in \mathcal{H}$ such
    that $i_\ell$ solves $\mathrm{AndOr}_n(x^\ell \oplus h)$ for every $\ell$. For
    $t = \mathrm{polylog}(n)$ some shift always works, so the problem is total: it lives
    in the query analogue of $\mathrm{TFNP}$, with certificates of only
    $t\log(n/2)$ bits.

    The two "tricks" of the paper are a translation of a partial function into a total
    search problem and a translation back. Composing them turns *unbounded* degree
    measures (where separations are easy) into *bounded* ones (where they are hard),
    which is how the separations below are manufactured.
  formal: |
    Blocks: $x^\ell \in \{0,1\}^{n^2\log(n/2)}$ split into $n^2$ blocks of
    $\log(n/2)$ bits; $\mathrm{AndOr}_n(x) = \{i : x_{ij} = 1 \text{ for all } j\}$.
    Valid outputs of $\mathrm{AndOr}_{\mathcal{H},t}$ on $(x^1,\dots,x^t)$:
    $$\big\{(i_1,\dots,i_t) \;:\; \exists\, h \in \mathcal{H} \text{ with }
      i_\ell \in \mathrm{AndOr}_n(x^\ell \oplus h) \text{ for all } \ell \in [t]\big\}.$$
    All values below are at $t = \log^5 n$.
  values:
    - {measure: adeg, value: 'O(\log^7 n)', refs: [BenDavidKundu24search], note: 'Theorem 31: $\widetilde{\deg} = O(t\log^2 n)$, here $O(\log^7 n)$. The witnessing system of polynomials is built from the *unbounded* degree-$\log(n/2)$ system $p_i(x) = \tfrac{1}{3n}\prod_j x_{ij}$ for $\mathrm{AndOr}_n$, error-reduced to $1/\sqrt n$ at degree $O(\log^2 n)$ and then made bounded by the shift.'}
    - {measure: cjdeg, value: 'O(\log^7 n)', refs: [BenDavidKundu24search], note: 'Corollary 32: the same polynomials are conical juntas, so the *two-sided bounded non-negative* degree $\widetilde{\deg}^+_2$ is also $O(t\log^2 n) = O(\log^7 n)$. This is the strong form of the result: $\mathrm{cjdeg}$ is normally at least $\mathrm{R}$, and even an $\mathrm{R}$-vs-$\mathrm{cjdeg}$ separation for a total search problem was open.'}
    - {measure: Q, value: '\widetilde\Omega(\sqrt n)', refs: [BenDavidKundu24search], note: 'Theorem 39: at $t = \log^5 n$, any quantum algorithm making $o(\sqrt n \log^4 n)$ queries succeeds with probability only $2^{-\Omega(\log^4 n)}$ against the uniform distribution. The core is the $\Omega(t\sqrt n/\log\log n)$ direct-sum bound for $t$ copies of $\mathrm{AndOr}_n$ at exponentially small success, and a union bound over the $2^{2\log^3 n\log\log(n/2)}$ shifts.'}
    - {measure: Advpm, value: '\widetilde\Omega(\sqrt n)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$, so the negative-weight adversary is $\widetilde\Omega(\sqrt n)$ here while $\widetilde{\deg} = O(\log^7 n)$: for search problems the adversary bound is exponentially stronger than the polynomial method.'}
    - {measure: R, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{Q} = \widetilde\Omega(\sqrt n)$; no better classical lower bound is claimed, and the trivial ceiling is the input length $t n^2\log(n/2)$.'}
    - {measure: Rbar, value: '\widetilde\Omega(\sqrt n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: R0, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{R}$.'}
    - {measure: D, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{R}$.'}
    - {measure: Dna, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{D}$.'}
    - {measure: Rna, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{R}$.'}
    - {measure: psD, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{R}$, since $\mathrm{R} \le \mathrm{psD}$.'}
    - {measure: D_size, value: '2^{\widetilde\Omega(\sqrt n)}', putative: true, note: 'A tree of depth $d$ has more than $d$ leaves, so this only says $\mathrm{DTsize} > \mathrm{D}$; the exponential form follows because every leaf must force a valid output, and $\mathrm{C} = O(\log^6 n)$ certificates cannot be reached in fewer than $\mathrm{D}$ queries on the hard inputs.', conf: low}
    - {measure: C, value: 'O(\log^6 n)', putative: true, note: 'A valid output is a tuple $(i_1,\dots,i_t)$ of all-$1$ blocks, and exhibiting the $t\log(n/2) = O(\log^6 n)$ bits of those blocks certifies it. Membership in query $\mathrm{TFNP}$ is exactly the requirement that certificates be polylogarithmic in the input size, and it is what makes the $\mathrm{Q} = \widetilde\Omega(\sqrt n)$ lower bound interesting.'}
    - {measure: C1, value: 'O(\log^6 n)', note: 'The problem is *total*: every input has a valid output, so there is no "no" side and $\mathrm{C}^1 = \mathrm{C} = O(\log^6 n)$.'}
    - {measure: Cmin, value: '\Theta(\log^6 n)', putative: true, note: 'Unusually, the min and the max coincide. Any certificate must name an output $(i_1,\dots,i_t)$ and a shift, and to know that $i_\ell$ is an all-$1$ block of $x^\ell \oplus h$ one must have read all $\log(n/2)$ bits of that block, for every $\ell$. So $\mathrm{C}_x \ge t\log(n/2)$ on *every* input, matching the upper bound of the [[C]] entry.'}
    - {measure: D_prod, value: '\widetilde\Omega(\sqrt n)', note: 'The hard distribution of [BenDavidKundu24search, Thm 39] is the *uniform* distribution on $t$ independent blocks, which is a product distribution, and a deterministic tree is in particular a quantum algorithm. So the restriction to product distributions costs nothing here: $\mathrm{D}^{\mathrm{prod}} = \widetilde\Omega(\sqrt n)$, and combined with $\mathrm{RS}(g) = \widetilde\Omega(\mathrm{D}^{\mathrm{prod}}(g))$ this makes the problem hard to use as an *inner* function in a composition.'}
    - {measure: Dmu, value: '\widetilde\Omega(\sqrt n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \widetilde\Omega(\sqrt n)$; the uniform distribution already achieves it -- see [[D_prod]].'}
    - {measure: QE, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{Q}$.'}
    - {measure: Q0, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{Q}$.'}
    - {measure: robustQ, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{Q}$: noisy oracles cannot be cheaper than exact ones.'}
    - {measure: Np, value: '\widetilde\Omega(\sqrt n)', note: 'At least $\mathrm{R}$: setting the noise rate to $0$ recovers the ordinary model.'}
    - {measure: MAdv, value: '\widetilde\Omega(\sqrt n)', note: 'Sandwiched: $\mathrm{Adv}^{\pm} \le \mathrm{MAdv} \le \mathrm{Q}$, and the recorded $\mathrm{Adv}^{\pm}$ is already $\widetilde\Omega(\sqrt n)$.'}
    - {measure: gamma2, value: '\widetilde\Omega(\sqrt n)', note: '$\gamma_2 = \Theta(\mathrm{Adv}^{\pm}) = \widetilde\Omega(\sqrt n)$.'}
    - {measure: R1, value: '\widetilde\Omega(\sqrt n)', note: 'Squeezed from below by $\mathrm{R} \le \mathrm{R}^1$, with $\mathrm{R} = \widetilde\Omega(\sqrt n)$; above, $\mathrm{R}^1 \le \mathrm{R}_0$. The relational reading of one-sided error is available here because the search problem is total and its outputs are self-certifying.'}
  witnesses:
    - {of: [Q, adeg],  setting: relation, statement: 'For a **total** search problem in query $\mathrm{TFNP}$: at $t = \log^5 n$, $\widetilde{\deg}(\mathrm{AndOr}_{\mathcal{H},t}) = O(t\log^2 n) = O(\mathrm{polylog}\,n)$ while $\mathrm{Q} = \Omega(\sqrt n\log^4 n)$, i.e. $\mathrm{Q} = 2^{\widetilde\Omega(\widetilde{\deg}^{1/7})}$ -- exponential. Translating back gives a partial function with $\widetilde{\deg} = O(\mathrm{polylog}\,n)$ and $\mathrm{Q} = \widetilde\Omega(n^{1/6})$ on inputs of length $2^{\mathrm{polylog}\,n}$, a second proof of [AmbainisBelovs23].', refs: [BenDavidKundu24search]}
    - {of: [Q, cjdeg], setting: relation, statement: 'The same problem, with the upper bound strengthened to the *larger* two-sided bounded non-negative degree: $\widetilde{\deg}^+_2 = O(t\log^2 n) = O(\mathrm{polylog}\,n)$ against $\mathrm{Q} = \Omega(\sqrt n\log^4 n)$. Since $\mathrm{cjdeg}$ normally sits above $\mathrm{R} \ge \mathrm{Q}$, this also gives the first $\mathrm{R}$-vs-$\mathrm{cjdeg}$ separation for a total search problem, and for a partial function.', refs: [BenDavidKundu24search]}
    - {of: [adeg, Adv], setting: relation, statement: 'A different and simpler total search problem: the *pigeonhole* problem $\mathrm{PH}_n$ -- given $n$ blocks holding symbols from an alphabet of size $n/2$, find two equal blocks. Reduction from the collision lower bound gives $\widetilde{\deg}(\mathrm{PH}_n) = \Omega(n^{1/3})$, while an explicit feasible solution $m_x(i) = 2/n$ gives $\mathrm{CA}(\mathrm{PH}_n) \le 2\log(n/2) = O(\log n)$. Since $\mathrm{CA}$ dominates $\mathrm{Adv}$, $\mathrm{fbs}$, $\mathrm{bs}$ and $\mathrm{fcbs}/2$, *every* block-sensitivity and adversary method is $O(\log n)$ here: the polynomial method is exponentially stronger than the positive adversary on search problems, the reverse of the usual situation.', refs: [BenDavidKundu24search]}
  notes: |
    Two translations drive everything. Trick 1 turns a partial function into a total
    search problem by hiding the promise behind a shift; Trick 2 turns a search problem
    back into a partial function using an array of "queried cells". Applying both in turn
    converts *unbounded* degree measures into *bounded* ones, which is why separations
    that are trivial for unbounded degree become exponential separations for
    approximate degree and conical junta degree.

    Lifted with a constant-size inner gadget, the same construction gives an exponential
    separation between quantum information cost and the relaxed partition bound in
    communication complexity -- previously open even for randomized communication
    complexity against $\mathrm{relprt}$.
  refs: [BenDavidKundu24search, AmbainisBelovs23]
  see_also: [cjdeg, adeg, Adv, CA, AmbainisBelovsFn, psD]

- id: YamakawaZhandry
  name: Yamakawa-Zhandry problem
  symbol: 'S_{\mathrm{YZ}}'
  group: relational
  order: 54
  kind: relation
  arity: 'random oracle'
  short: 'Verifiable exponential quantum advantage for an NP search problem relative to a random oracle.'
  definition: |
    Find a codeword of a fixed error-correcting code all of whose symbols land in
    a random oracle's preimage set. Quantum: $\mathrm{poly}$ queries; classical:
    exponentially many, *and* solutions are efficiently verifiable.
  values:
    - {measure: Q, value: '\mathrm{poly}(n)', refs: [YamakawaZhandry22]}
    - {measure: R, value: '2^{\Omega(n)}', refs: [YamakawaZhandry22]}
    - {measure: D, value: '2^{\Omega(n)}', note: 'At least $\mathrm{R}$.'}
    - {measure: R0, value: '2^{\Omega(n)}', note: 'At least $\mathrm{R}$.'}
    - {measure: Rbar, value: '2^{\Omega(n)}', note: '$\bar{\mathrm{R}} = \Theta(\mathrm{R})$.'}
    - {measure: Rna, value: '2^{\Omega(n)}', note: 'At least $\mathrm{R}$.'}
    - {measure: Dna, value: '2^{\Omega(n)}', note: 'At least $\mathrm{D}$.'}
    - {measure: D_size, value: '2^{\Omega(n)}', note: 'A tree of depth $d$ has more than $d$ leaves, so $\mathrm{DTsize} > \mathrm{D} = 2^{\Omega(n)}$.'}
    - {measure: psD, value: '2^{\Omega(n)}', note: 'At least $\mathrm{R} = 2^{\Omega(n)}$, since $\mathrm{R} \le \mathrm{psD}$. Pseudo-determinism costs nothing extra here in any interesting sense -- the point is the contrast with $\mathrm{Q} = \mathrm{poly}(n)$, which makes this the strongest form of quantum advantage on record for a search problem: exponential, verifiable, and against the *pseudo-deterministic* classical model.'}
    - {measure: C, value: 'n', putative: true, note: 'A solution is a codeword $y \in \mathcal{C} \subseteq \Sigma^n$ with $H(i, y_i) = 1$ for all $i$; exhibiting those $n$ oracle bits certifies it, and fewer will not, since any unfixed coordinate could fail. So $\mathrm{C} = n$ against $\mathrm{D} = 2^{\Omega(n)}$ -- the problem is in the query analogue of $\mathrm{NP}$, which is exactly what makes the quantum advantage *verifiable*.'}
    - {measure: Cmin, value: 'n', putative: true, note: 'Every input has the same $n$-bit certificate shape, so the minimum over inputs equals the maximum.'}
    - {measure: C1, value: 'n', note: 'The search problem is total -- every oracle admits a codeword all of whose symbols are preimages -- so there is no "no" side and $\mathrm{C}^1 = \mathrm{C} = n$.'}
    - {measure: Q0, value: '\mathrm{poly}(n)', putative: true, note: 'Verifiability makes the quantum advantage *zero-error*: run the $\mathrm{poly}(n)$-query algorithm, spend $n$ more queries checking $H(i,y_i)=1$ for all $i$, and repeat on failure. So $\mathrm{Q}_0 = O(\mathrm{Q} + n) = \mathrm{poly}(n)$ against $\mathrm{R}_0 = 2^{\Omega(n)}$. Contrast [[GroverSearch]], where $\mathrm{Q}_0 = n$ because the all-zero input has no witness to verify; here totality is on the quantum side too.'}
    - {measure: Advpm, value: '\mathrm{poly}(n)', note: '$\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q}) = \mathrm{poly}(n)$; the interest is entirely that this is exponentially below $\mathrm{R}$.'}
    - {measure: MAdv, value: '\mathrm{poly}(n)', note: 'Sandwiched: $\mathrm{Adv}^{\pm} \le \mathrm{MAdv} \le \mathrm{Q}$, both $\mathrm{poly}(n)$.'}
    - {measure: gamma2, value: '\mathrm{poly}(n)', note: '$\gamma_2 = \Theta(\mathrm{Q}) = \mathrm{poly}(n)$.'}
    - {measure: Adv, value: '\mathrm{poly}(n)', note: 'A lower bound on $\mathrm{Q} = \mathrm{poly}(n)$.'}
    - {measure: Dmu, value: '2^{\Omega(n)}', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon = 2^{\Omega(n)}$.'}
    - {measure: D_prod, value: '2^{\Omega(n)}', note: 'The classical lower bound is proved against a *uniformly random* oracle, which is a product distribution, so the hardness needs no correlated hard distribution at all: $\mathrm{D}^{\mathrm{prod}} = 2^{\Omega(n)}$.', refs: [YamakawaZhandry22]}
    - {measure: Np, value: '2^{\Omega(n)}', note: 'At least $\mathrm{R} = 2^{\Omega(n)}$; noise cannot help.'}
    - {measure: robustQ, value: '\mathrm{poly}(n)', note: 'At most $\mathrm{Q}\log\mathrm{Q} = \mathrm{poly}(n)$ by generic robustification, at least $\mathrm{Q}$. So even a noisy quantum oracle keeps the exponential advantage.'}
    - {measure: R1, value: '2^{\Omega(n)}', note: 'Squeezed from below by $\mathrm{R} \le \mathrm{R}^1 \le \mathrm{R}_0$, and both $\mathrm{R}$ and $\mathrm{R}_0$ are already $2^{\Omega(n)}$.'}
    - {measure: rank, value: '\Omega(n)', note: 'A tree of rank $r$ has a leaf at depth $\le r$, so $\mathrm{rank} \ge \mathrm{C}_{\min} = n$. Nothing better follows from the recorded values, since only a lower bound on $\mathrm{D}$ is known.'}
    - {measure: PostQ, value: '\mathrm{poly}(n)', note: 'At most $\mathrm{Q} = \mathrm{poly}(n)$: postselection can only help, so the exponential quantum advantage survives in this model too.'}
  witnesses:
    - {of: [R, Q], setting: relation, statement: 'Exponential, with efficiently checkable solutions -- the strongest form of query-model quantum advantage for a search problem.', refs: [YamakawaZhandry22]}
  refs: [YamakawaZhandry22]
  see_also: [Simon, BDKrelation, GroverSearch]
