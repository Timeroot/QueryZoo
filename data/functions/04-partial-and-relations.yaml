    - {measure: chi, value: '\widetilde O\!\big(n^{1-1/k}\big)', note: '$\chi \le \bar\chi = O(\mathrm{LR}) \le \mathrm{R}$ for partial $g$.'}
    - {measure: RS, value: '\widetilde O\!\big(n^{1-1/k}\big)', note: 'From $\mathrm{RS} = O(\bar\chi) = O(\mathrm{LR}) = O(\mathrm{R})$.'}
    - {measure: Rstar, value: '\widetilde O\!\big(n^{1-1/k}\big)', note: '$\mathrm{R}^{*} \le \mathrm{R}$; from below $\mathrm{R}^{*} = \Omega(\mathrm{LR}) = \widetilde\Omega(n^{1/2-1/(2k)})$.'}
    - {measure: noisyR, value: '\widetilde O\!\big(n^{1-1/k}\big)', note: 'At most $\mathrm{R}$.'}
    - {measure: CA, value: '\widetilde O\!\big(n^{1-1/k}\big)', note: '$\mathrm{CA} = O(\mathrm{R})$; from below only $\mathrm{CA} = \Omega(\mathrm{fbs}) = \Omega(1)$, so nothing pins it.'}
    - {measure: CGpub, value: '\widetilde O\!\big(n^{1-1/k}\big)', refs: [CGLMSG23], note: 'Equal to $\Theta(\mathrm{CA})$; the public-coin, entangled and non-signaling games all collapse there.'}
    - {measure: CGstar, value: '\widetilde O\!\big(n^{1-1/k}\big)', refs: [CGLMSG23], note: 'Equal to $\mathrm{CG}^{\mathrm{pub}}$ up to constants.'}
