# =====================================================================
# FUNCTIONS: purpose-built total functions from the separation
# literature. Most of these are cited in the matrix rather than
# described, so `formal` is often a stub -- populate as you go.
# =====================================================================

functions:

- id: pointer
  name: Pointer functions
  symbol: 'g_{\mathrm{ABBLSS}}'
  aliases: ['the ABB+17 functions', 'Goos-Pitassi-Watson-style pointer gadgets']
  group: separating
  order: 30
  kind: total
  arity: '$n$ bits (a grid of cells, each holding a value plus pointers)'
  short: 'The construction that refuted the Saks-Wigderson conjecture and set most of the top-left corner of the matrix.'
  definition: |
    The input is an $m\times m$ grid of *cells*. Each cell holds a bit and a
    pointer to another cell. The function asks whether there is a column all of
    whose cells are marked, together with a pointer chain certifying it; the
    pointers let a randomized algorithm follow a short path to the answer, while
    a deterministic algorithm can be forced to explore much more of the grid.
    Several variants of the payload/pointer structure give different separations.
  values:
    - {measure: D,  value: '\widetilde\Omega(n)', refs: [ABBLSS17], note: 'On a $p\times m$ grid of cells the adversary of [ABBLSS17, Thm 2] leaves the value undetermined after $pm-1$ cell queries, and one cell costs $\lceil\log|\Sigma|\rceil=\Theta(\log n)$ bits, so $\mathrm{D}$ is the input length up to logarithms. This holds for **every** variant listed below, which is what makes the upper bounds in this table mutually comparable: each $\widetilde O(\cdot)$ entry below is measured on a variant whose $\mathrm{D}$ is still $\widetilde\Omega(n)$.'}
    - {measure: R0, value: '\widetilde O(\sqrt n)', refs: [ABBLSS17], note: 'Variant $f_{2m,m}$ [ABBLSS17, Thm 4, Cor. 7]: $\widetilde O(m)$ cell queries on a grid of $2m^2$ cells, i.e. $\widetilde O(\sqrt n)$ bit queries. The back pointers let the Las Vegas algorithm halve the number of candidate zeroes each round.'}
    - {measure: R,  value: '\widetilde O(\sqrt n)', refs: [ABBLSS17], note: 'Variant $g_{m,m}$ [ABBLSS17, Thm 12, Cor. 14], for which $\mathrm{R}_0 = \widetilde\Omega(n)$ -- this is the $\mathrm{R}_0$-vs-$\mathrm{R}$ separation, so the two $\widetilde O(\sqrt n)$ lines here are attained on *different* variants. Proved there for one-sided error, which dominates $\mathrm{R}$.'}
    - {measure: QE, value: '\widetilde O(\sqrt n)', refs: [ABBLSS17], note: 'Same variant $g_{m,m}$ [ABBLSS17, Thm 12, Cor. 14]: the exact quantum algorithm costs $\widetilde O(m)$ on $m^2$ cells. Since that variant has $\mathrm{R}_0=\widetilde\Omega(n)$ this is a quadratic $\mathrm{R}_0$-vs-$\mathrm{Q}_E$ gap, and against $\mathrm{D}=\widetilde\Omega(n)$ it gives $\mathrm{D}=\widetilde\Omega(\mathrm{Q}_E^2)$.'}
    - {measure: Q,  value: '\widetilde O(n^{1/4})', refs: [ABBLSS17], note: 'Variant $f_{2m,m}$ [ABBLSS17, Thm 5, Cor. 7]: Grover search over columns costs $\widetilde O(\sqrt m)=\widetilde O(n^{1/4})$.'}
    - {measure: adeg, value: '\widetilde O(n^{1/4})', refs: [ABBLSS17], note: 'Variant $\tilde h_{1,m,m}$ [ABBLSS17, Thm 22, Cor. 23]. The approximating polynomial is the *sum* over the $m$ candidate marked columns of the acceptance polynomials of a $\widetilde O(\sqrt m)$-query column verifier; the sum is legitimate because at most one column can be marked.'}
    - {measure: lambda, value: '\widetilde O(n^{1/4})', refs: [ABKRT21], note: 'Squeeze: $\lambda(f)=O(\widetilde{\deg}(f))$ [ABKRT21, Thms 17-18] applied to the line above. This is where the $\mathrm{D}=\widetilde\Omega(\lambda^4)$ entry of the $\lambda$ column comes from.'}
    - {measure: Dna, value: '\widetilde\Theta(n)', note: 'Squeezed between $\mathrm{D}=\widetilde\Omega(n)$ and the input length $n$.'}
    - {measure: C,  value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Variant $f_{2m,m}$. Upper: a zero-error algorithm''s transcript is a certificate, so $\mathrm{C}\le 2\,\mathrm{R}_0=\widetilde O(\sqrt n)$. Lower: $\mathrm{D}\le\mathrm{C}^2$ against $\mathrm{D}=\widetilde\Omega(n)$. So the $\mathrm{D}$-vs-$\mathrm{R}_0$ separation is simultaneously an extremal $\mathrm{D}=\widetilde\Theta(\mathrm{C}^2)$ family.'}
    - {measure: bs, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Variant $f_{2m,m}$. Upper $\mathrm{bs}\le\mathrm{C}$; lower $\mathrm{bs}\ge\mathrm{D}/\mathrm{C}=\widetilde\Omega(\sqrt n)$ from $\mathrm{D}\le\mathrm{C}\cdot\mathrm{bs}$.'}
    - {measure: fbs, value: '\widetilde\Theta(\sqrt n)', note: 'Squeezed between $\mathrm{bs}$ and $\mathrm{C}$, which coincide here.'}
    - {measure: FC,  value: '\widetilde\Theta(\sqrt n)', note: 'Squeeze: $\mathrm{FC}=\mathrm{fbs}$ exactly.'}
    - {measure: RC,  value: '\widetilde\Theta(\sqrt n)', note: 'Squeeze: $\mathrm{RC}=\Theta(\mathrm{fbs})$.'}
    - {measure: CA,  value: '\widetilde\Theta(\sqrt n)', refs: [ABIKPS17], note: 'Squeeze: $\mathrm{CA}=\Theta(\mathrm{fbs})$ for total functions.'}
    - {measure: s,  value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{s}\le\mathrm{bs}=\widetilde O(\sqrt n)$ on variant $f_{2m,m}$; Huang gives the floor $\mathrm{s}\ge\sqrt{\mathrm{bs}}=\widetilde\Omega(n^{1/4})$.'}
    - {measure: QC, value: '\widetilde\Theta(n^{1/4})', note: 'Squeeze: $\mathrm{QC}=\Theta(\sqrt{\mathrm{fbs}})$.'}
    - {measure: Advpm, value: '\widetilde O(n^{1/4})', refs: [Reichardt11], note: 'Variant $f_{2m,m}$: $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$, so the adversary bound is as small as the algorithm.'}
    - {measure: gamma2, value: '\widetilde O(n^{1/4})', refs: [LMRSS11], note: 'Variant $f_{2m,m}$: the approximate $\gamma_2$ norm is the factorisation-norm form of $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$.'}
    - {measure: R1, value: '\widetilde O(\sqrt n)', refs: [ABBLSS17], note: 'Variant $g_{m,m}$: the algorithm of [ABBLSS17, Thm 12] is stated for one-sided error, which is what the recorded $\mathrm{R}$ line quotes.'}
    - {measure: Q0, value: '\widetilde O(\sqrt n)', note: 'Variant $g_{m,m}$: squeeze $\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_E=\widetilde O(\sqrt n)$.'}
    - {measure: deg, value: '\widetilde\Omega(n^{1/3})', note: 'Squeeze: $\mathrm{D}=O(\deg^3)$ [Midrijanis04] against $\mathrm{D}=\widetilde\Omega(n)$. Exact degree cannot follow $\widetilde{\deg}=\widetilde O(n^{1/4})$ down.'}
    - {measure: C0, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Variant $f_{2m,m}$. Upper: $\mathrm{C}^0\le\mathrm{C}=\widetilde O(\sqrt n)$. Lower: $\mathrm{D}\le\mathrm{C}^0\mathrm{C}^1\le\mathrm{C}^0\cdot\mathrm{C}$, and $\mathrm{D}=\widetilde\Omega(n)$ with $\mathrm{C}=\widetilde O(\sqrt n)$ forces $\mathrm{C}^0=\widetilde\Omega(\sqrt n)$. So neither side of the certificate complexity can be the cheap one.'}
    - {measure: C1, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Variant $f_{2m,m}$; the argument of the $\mathrm{C}^0$ line with the roles of the two sides exchanged.'}
    - {measure: Cmin, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Variant $f_{2m,m}$, a $2m\times m$ grid with $n=\widetilde\Theta(m^2)$ bits. Upper: $\mathrm{C}_{\min}\le\mathrm{C}=\widetilde O(\sqrt n)$. Lower: certifying a $1$ requires exhibiting a whole marked column, i.e. all $2m$ cells of it; certifying a $0$ requires an unmarked cell in each of the $m$ columns. So $\mathrm{C}_x\ge m=\widetilde\Omega(\sqrt n)$ for *every* input $x$, not just the worst one.'}
    - {measure: EC, value: '\widetilde\Theta(\sqrt n)', note: 'Squeezed between $\mathrm{fbs}=\widetilde\Theta(\sqrt n)$ and $\mathrm{C}=\widetilde\Theta(\sqrt n)$ on variant $f_{2m,m}$, which coincide.'}
    - {measure: rank, value: '\widetilde\Omega(\sqrt n)', note: 'Variant $f_{2m,m}$: a Delayer who defers on every query survives at least $\mathrm{C}_{\min}$ rounds, so $\mathrm{rank}\ge\mathrm{C}_{\min}=\widetilde\Omega(\sqrt n)$; the ceiling is $\mathrm{rank}\le\mathrm{D}=\widetilde O(n)$.'}
    - {measure: UC, value: '\widetilde\Omega(\sqrt n)', note: 'Variant $f_{2m,m}$: $\mathrm{UC}\ge\mathrm{SP}\ge\mathrm{C}=\widetilde\Omega(\sqrt n)$. No matching upper bound is claimed -- an unambiguous cover of the pointer function is not known to be as cheap as an ordinary certificate.'}
    - {measure: SP, value: '\widetilde\Omega(\sqrt n)', note: 'Variant $f_{2m,m}$: every subcube of a monochromatic partition is a certificate, so $\mathrm{SP}\ge\mathrm{C}=\widetilde\Omega(\sqrt n)$.'}
    - {measure: UCmin, value: '\widetilde\Omega(\sqrt n)', refs: [BHT17], note: 'Squeeze: $\mathrm{D}=O(\mathrm{UC}_{\min}^2)$ [BHT17] against $\mathrm{D}=\widetilde\Omega(n)$, which holds on every variant.'}
    - {measure: cbs, value: '\widetilde\Theta(\sqrt n)', note: 'Variant $f_{2m,m}$: for a Boolean function the solution function is forced and every input is critical, so $\mathrm{cbs}$ degenerates to $\mathrm{bs}=\widetilde\Theta(\sqrt n)$ ([[cbs]] vs [[bs]]).'}
    - {measure: MAdv, value: '\widetilde O(n^{1/4})', note: 'Variant $f_{2m,m}$: $\mathrm{MAdv}=\Theta(\mathrm{Q})$, so the multiplicative adversary is as small as the algorithm.'}
    - {measure: Adv, value: '\widetilde O(n^{1/4})', note: 'Variant $f_{2m,m}$: $\mathrm{Adv}\le\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})=\widetilde O(n^{1/4})$. Note the certificate barrier $\mathrm{Adv}\le\sqrt{\mathrm{C}^0\mathrm{C}^1}=\widetilde O(\sqrt n)$ is the weaker of the two bounds here.'}
    - {measure: Dmu, value: '\widetilde O(\sqrt n)', note: 'Variant $g_{m,m}$: $\max_\mu\mathrm{D}^{\mu}=\Theta(\mathrm{R})=\widetilde O(\sqrt n)$ by Yao''s minimax.'}
    - {measure: Rbar, value: '\widetilde O(\sqrt n)', note: 'Variant $g_{m,m}$: the distributional/average-case form of $\mathrm{R}$, $\overline{\mathrm{R}}=\Theta(\mathrm{R})=\widetilde O(\sqrt n)$.'}
    - {measure: psD, value: '\widetilde O(\sqrt n)', note: 'Variant $g_{m,m}$: for a Boolean function the canonical solution is forced to be $f$ itself, so $\mathrm{psD}=\mathrm{R}=\widetilde O(\sqrt n)$.'}
    - {measure: odeg, value: '\widetilde O(n^{1/4})', note: 'Variant $\tilde h_{1,m,m}$: $\widetilde{\deg}_+\le\widetilde{\deg}=\widetilde O(n^{1/4})$.'}
    - {measure: sdeg, value: '\widetilde O(n^{1/4})', note: 'Variant $\tilde h_{1,m,m}$: $\mathrm{sdeg}\le\widetilde{\deg}_+\le\widetilde{\deg}=\widetilde O(n^{1/4})$.'}
    - {measure: rdeg, value: '\widetilde O(\sqrt n)', note: 'Variant $f_{2m,m}$: $\mathrm{rdeg}\le\mathrm{C}=\widetilde O(\sqrt n)$ -- write the exact rational representation from the certificate cover.'}
    - {measure: Inf, value: '\widetilde O(n^{1/4})', refs: [Shi00], note: 'Variant $\tilde h_{1,m,m}$: $\mathrm{I}(f)=O(\widetilde{\deg}(f))$ [Shi00] applied to $\widetilde{\deg}=\widetilde O(n^{1/4})$. Against $\mathrm{D}=\widetilde\Omega(n)$, valid on the same variant, this is a fourth-power $\mathrm{D}$-vs-$\mathrm{I}$ gap for a function whose sensitivity is still polynomially large.'}
    - {measure: Inf1, value: '\widetilde O(n^{1/4})', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide coordinate by coordinate, so $\mathrm{I}^{1}=\mathrm{I}=\widetilde O(n^{1/4})$ on variant $\tilde h_{1,m,m}$.'}
    - {measure: MaxInf, value: '\widetilde O(n^{1/4})', note: 'Variant $\tilde h_{1,m,m}$: a maximum is at most a sum, so $\mathrm{MaxInf}\le\mathrm{I}=\widetilde O(n^{1/4})$. OSSS gives no useful floor here because the function is very unbalanced under the uniform measure, so $\mathrm{Var}=o(1)$.'}
    - {measure: s1, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Variant $f_{2m,m}$, a $2m\times m$ grid with $n=\widetilde\Theta(m^2)$ bits. Lower: a $1$-input has one all-marked column, and it is unique, so flipping the marked bit of any one of that column''s $2m$ cells leaves no all-marked column at all and sends the value to $0$. That is $2m=\widetilde\Omega(\sqrt n)$ sensitive coordinates at a single input. Upper: $\mathrm{s}^1\le\mathrm{s}\le\mathrm{bs}=\widetilde O(\sqrt n)$. Combined with the recorded $\mathrm{s}$ line this pins $\mathrm{s}=\widetilde\Theta(\sqrt n)$: the pointer function is *not* a sensitivity separation, and all of its gaps against $\mathrm{D}$ live on the randomized/quantum side.'}
    - {measure: s0, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{s}^0\le\mathrm{s}\le\mathrm{bs}=\widetilde O(\sqrt n)$ on variant $f_{2m,m}$. The $\mathrm{s}=\widetilde\Theta(\sqrt n)$ pin comes entirely from the $1$-side (see the $\mathrm{s}^1$ line), so no matching floor is claimed for $\mathrm{s}^0$.'}
    - {measure: bs1, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Variant $f_{2m,m}$. The $2m$ singleton blocks of the $\mathrm{s}^1$ line are pairwise disjoint and each is sensitive, so $\mathrm{bs}^1\ge\mathrm{s}^1=\widetilde\Omega(\sqrt n)$; the ceiling is $\mathrm{bs}^1\le\mathrm{bs}=\widetilde O(\sqrt n)$.'}
    - {measure: bs0, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{bs}^0\le\mathrm{bs}=\widetilde O(\sqrt n)$ on variant $f_{2m,m}$. Against $\mathrm{D}=\widetilde\Omega(n)$ this alone is a quadratic $\mathrm{D}$-vs-$\mathrm{bs}^0$ gap. No floor is claimed: the natural candidate blocks (mark a whole column) are $m$ disjoint blocks but their sensitivity depends on the pointer conventions of the variant.'}
    - {measure: RS, value: '\widetilde\Theta(\sqrt n)', refs: [BenDavidKothari18, ABIKPS17], note: 'Variant $f_{2m,m}$. Ceiling: $\mathrm{R}_\varepsilon\ge\overline{\mathrm{R}}_\varepsilon\ge(1-2\varepsilon)\mathrm{RS}$ [BenDavidKothari18, Thm 12], so $\mathrm{RS}=O(\mathrm{R})=\widetilde O(\sqrt n)$. Floor: $\mathrm{fbs}\le\mathrm{CG}^{\mathrm{pub}}\le\mathrm{RS}$, and $\mathrm{fbs}=\widetilde\Theta(\sqrt n)$ here. So randomized sabotage is tight against $\mathrm{R}$ on this family, consistent with the fact that no total function with $\mathrm{RS}=o(\mathrm{R})$ is known.'}
    - {measure: chi, value: '\widetilde\Theta(\sqrt n)', refs: [Li18, Sanyal18], note: 'Variant $f_{2m,m}$. Floor $\chi\ge\Omega(\mathrm{bs})=\widetilde\Omega(\sqrt n)$ [Li18]; ceiling $\chi=O(\mathrm{R})=\widetilde O(\sqrt n)$, since $\mathrm{R}(f\circ g)=\Omega(\mathrm{R}(f)\chi(g))$ would otherwise beat $\mathrm{R}(f\circ g)=O(\mathrm{R}(f)\mathrm{R}(g))$.'}
    - {measure: chibar, value: '\widetilde\Theta(\sqrt n)', refs: [GLSS19], note: 'Variant $f_{2m,m}$: squeezed between $\mathrm{RS}=\widetilde\Theta(\sqrt n)$ and $\mathrm{R}=\widetilde O(\sqrt n)$ along the chain $\mathrm{RS}\lesssim\bar\chi\lesssim\mathrm{LR}\lesssim\mathrm{R}$ [GLSS19].'}
    - {measure: LR, value: '\widetilde\Theta(\sqrt n)', note: 'Variant $f_{2m,m}$: squeezed between $\bar\chi=\widetilde\Theta(\sqrt n)$ and $\mathrm{R}=\widetilde O(\sqrt n)$.'}
    - {measure: Rstar, value: '\widetilde\Theta(\sqrt n)', note: 'Variant $f_{2m,m}$: squeezed between $\mathrm{LR}=\widetilde\Theta(\sqrt n)$ and $\mathrm{R}=\widetilde O(\sqrt n)$. The quantum floor $\mathrm{R}^*\ge\Omega(\mathrm{Q})=\widetilde\Omega(n^{1/4})$ is weaker.'}
    - {measure: Np, value: '\widetilde\Theta(\sqrt n)', refs: [FRPU94], note: 'Variant $g_{m,m}$: $\mathrm{R}\le\mathrm{N}_p=O(\mathrm{R}\log\mathrm{R})$, and $\mathrm{R}=\widetilde\Theta(\sqrt n)$ there ($\widetilde O(\sqrt n)$ by [ABBLSS17, Thm 12], $\widetilde\Omega(\sqrt n)$ from $\mathrm{fbs}$). The noise overhead is inside the tilde.'}
    - {measure: robustQ, value: '\widetilde O(n^{1/4})', refs: [BNRdW05], note: 'Variant $f_{2m,m}$: $\mathrm{Q}^{\mathrm{rob}}=O(\mathrm{Q}\log\mathrm{Q})$ [BNRdW05] applied to $\mathrm{Q}=\widetilde O(n^{1/4})$.'}
    - {measure: CGpub, value: '\widetilde\Theta(\sqrt n)', refs: [ABIKPS17], note: 'Variant $f_{2m,m}$: the public-coin certificate game value collapses to $\Theta(\mathrm{CA})$, and $\mathrm{CA}=\Theta(\mathrm{fbs})=\widetilde\Theta(\sqrt n)$ for total functions [ABIKPS17].'}
    - {measure: CGns, value: '\widetilde\Theta(\sqrt n)', refs: [ABIKPS17], note: 'Variant $f_{2m,m}$: $\mathrm{CG}^{\mathrm{ns}}$, $\mathrm{CG}^*$ and $\mathrm{CG}^{\mathrm{pub}}$ all collapse to $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\widetilde\Theta(\sqrt n)$.'}
    - {measure: CGstar, value: '\widetilde\Theta(\sqrt n)', refs: [ABIKPS17], note: 'Variant $f_{2m,m}$: same collapse as the $\mathrm{CG}^{\mathrm{ns}}$ line -- entangled certificate games are $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})$ here.'}
    - {measure: CG, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', note: 'Variant $f_{2m,m}$. The total-function sandwich $\max\{\mathrm{Adv}^2,\mathrm{R}_0,\mathrm{CA}\}\le\mathrm{CG}\le\min\{\mathrm{C}^0\mathrm{C}^1,O(\mathrm{EC}^2)\}$ with $\mathrm{C}^0=\mathrm{C}^1=\mathrm{EC}=\widetilde\Theta(\sqrt n)$ gives the ceiling $\widetilde O(n)$; the floor is $\mathrm{R}_0$ on this variant, which is only $\widetilde\Omega(\sqrt n)$. Private coins are the one escapee from the collapse recorded in the three lines above, so the gap between this line and $\mathrm{CG}^{\mathrm{pub}}$ is genuine and open.'}
    - {measure: prt, value: '\widetilde\Theta(\sqrt n)', refs: [JainKlauck10], note: 'Variant $g_{m,m}$: $\mathrm{prt}_\varepsilon\le 2\mathrm{R}_\varepsilon=\widetilde O(\sqrt n)$ [JainKlauck10, Thm 3.1], and $\mathrm{prt}_\varepsilon\ge\mathrm{RC}+\log\varepsilon=\widetilde\Omega(\sqrt n)$. So the partition bound is tight against $\mathrm{R}$ here and does not see the $\mathrm{D}$-vs-$\mathrm{R}$ gap.'}
    - {measure: rprt, value: '\widetilde\Theta(\sqrt n)', refs: [JainKlauck10], note: 'Variant $g_{m,m}$: $\mathrm{rprt}\le\mathrm{prt}=\widetilde O(\sqrt n)$, and the $\mathrm{RC}$ floor survives the relaxation, so $\mathrm{rprt}=\widetilde\Omega(\sqrt n)$ too.'}
    - {measure: Rna, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', note: 'Variant $f_{2m,m}$: $\mathrm{R}\le\mathrm{R}^{\mathrm{na}}\le\mathrm{D}^{\mathrm{na}}=\widetilde\Theta(n)$, with $\mathrm{R}\ge\mathrm{fbs}=\widetilde\Omega(\sqrt n)$. Nonadaptivity is expected to cost the full input length here, since the whole point of the pointer payload is that queries must chase a chain.'}
    - {measure: D_size, value: '2^{\widetilde\Omega(\sqrt n)}', refs: [EhrenfeuchtHaussler89], note: 'Variant $f_{2m,m}$: a decision tree of rank $r$ has at least $2^r$ leaves, so $\mathrm{DTsize}\ge 2^{\mathrm{rank}}$, and $\mathrm{rank}\ge\mathrm{C}_{\min}=\widetilde\Omega(\sqrt n)$ from the Prover-Delayer game. The ceiling is the trivial $2^{\mathrm{D}}=2^{\widetilde O(n)}$.'}
    - {measure: ndeg, value: '\widetilde O(\sqrt n)', note: 'Variant $f_{2m,m}$: $\mathrm{ndeg}\le\mathrm{C}^1=\widetilde\Theta(\sqrt n)$ -- sum the $1$-certificate indicator conjunctions, which are non-negative and cannot cancel.'}
    - {measure: NQ, value: '\widetilde O(\sqrt n)', note: 'Variant $f_{2m,m}$: $\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil$, so the $\mathrm{ndeg}$ line transfers verbatim.'}
    - {measure: ardeg, value: '\widetilde O(n^{1/4})', note: 'Variant $\tilde h_{1,m,m}$: $\mathrm{rdeg}_{1/3}\le\widetilde{\deg}=\widetilde O(n^{1/4})$ (a polynomial is a rational function with denominator $1$).'}
    - {measure: PostQ, value: '\widetilde O(n^{1/4})', refs: [MahadevdeWolf15], note: 'Variant $\tilde h_{1,m,m}$: $\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] applied to the $\mathrm{ardeg}$ line. Post-selection buys nothing beyond bounded-error quantum here.'}
    - {measure: cjdeg, value: '\widetilde\Omega(n^{1/4}),\ \widetilde O(n)', note: 'Variant $f_{2m,m}$: a depth-$\mathrm{D}$ decision tree is an exact conical junta of width $\mathrm{D}$ (one conjunction per accepting path, all coefficients $1$), so $\mathrm{cjdeg}\le\mathrm{D}=\widetilde O(n)$; the floor is $\mathrm{cjdeg}\ge\widetilde{\deg}\ge\Omega(\sqrt{\mathrm{bs}})=\widetilde\Omega(n^{1/4})$.'}
  witnesses:
    - {of: [D, R0],   setting: total, statement: '$\mathrm{D} = \widetilde\Omega(\mathrm{R}_0^2)$, and $\mathrm{D}=O(\mathrm{R}_0^2)$, so this cell is **settled**. Refutes the Saks-Wigderson conjecture ($\mathrm{D}=O(\mathrm{R}_0^{1.33})$).', refs: [ABBLSS17]}
    - {of: [R0, R],   setting: total, statement: '$\mathrm{R}_0 = \widetilde\Omega(\mathrm{R}^2)$, matching $\mathrm{R}_0 = \widetilde O(\mathrm{R}^2)$. **Settled.**', refs: [ABBLSS17]}
    - {of: [D, R],    setting: total, statement: '$\mathrm{D}=\widetilde\Omega(\mathrm{R}^2)$ against the upper bound $\mathrm{D}\le 27\mathrm{R}^3$.', refs: [ABBLSS17]}
    - {of: [D, Q],    setting: total, statement: '$\mathrm{D} = \widetilde\Omega(\mathrm{Q}^4)$, matching $\mathrm{D}=O(\mathrm{Q}^4)$. **Settled.**', refs: [ABBLSS17, ABKRT21]}
    - {of: [D, adeg], setting: total, statement: '$\mathrm{D} = \widetilde\Omega(\widetilde{\deg}^4)$, matching $\mathrm{D}=O(\widetilde{\deg}^4)$. **Settled.**', refs: [ABBLSS17, ABKRT21]}
    - {of: [R0, Q],   setting: total, statement: '$\mathrm{R}_0 = \widetilde\Omega(\mathrm{Q}^3)$ against the upper bound $\mathrm{R}_0=O(\mathrm{Q}^4)$.', refs: [ABBLSS17]}
    - {of: [R, QE],   setting: total, statement: '$\mathrm{R} = \widetilde\Omega(\mathrm{Q}_E^{3/2})$.', refs: [ABBLSS17]}
    - {of: [D, lambda], setting: total, statement: '$\mathrm{D} = \widetilde\Omega(\lambda^4)$ against $\mathrm{D}=O(\lambda^6)$.', refs: [ABBLSS17, ABKRT21]}
  refs: [ABBLSS17, GPW18, GJPW18]
  see_also: [cheatsheet, NANDtree]
  notes: |
    The entry is a family of variants sharing one skeleton, and the values
    above mix them: each $\widetilde O(\cdot)$ line names the variant it is
    attained on. That is sound because $\mathrm{D}=\widetilde\Omega(n)$ holds
    for all of them, so every (lower, upper) pair the engine forms from this
    table is a statement about a single function. The variants are, in the
    notation of [ABBLSS17]: $f_{p,m}$ (a $p\times m$ grid, one distinguished
    all-ones column, back pointers), $g_{p,m}$ (adds a second pointer so that
    one-sided error and exact quantum algorithms get traction), and
    $h_{k,p,m}$ / $\tilde h_{k,p,m}$ (adds $k$ layers of pointers, tuned for
    approximate degree).
  todo: 'Transcribe the exact cell/pointer encoding from [ABBLSS17, Section 2].'

- id: cheatsheet
  name: Cheat-sheet functions
  symbol: 'f_{\mathrm{CS}}'
  group: separating
  order: 31
  kind: total
  arity: '$\mathrm{poly}(n)$ bits'
  short: 'A generic transformation turning a *partial*-function separation into a *total*-function separation.'
  definition: |
    Given a partial function $f$ on $n$ bits, the cheat-sheet version $f_{\mathrm{CS}}$
    takes $c$ independent inputs $x^1,\dots,x^c$ to $f$ plus $2^c$ "cheat-sheet"
    cells; the cell indexed by the string $f(x^1)\cdots f(x^c)$ is required to
    contain certificates for all $c$ answers. This makes the function **total**
    (an input that violates the promise simply fails to be certified) while
    preserving the cheap upper bound (solve all $c$ instances, look up the cell,
    verify) and the expensive lower bound.
  formal: |
    See [ABK16, Definition 4]. Roughly: with $c = \Theta(\log n)$ copies,
    $\mathrm{Q}(f_{\mathrm{CS}}) = \widetilde\Theta(\mathrm{Q}(f) + \text{(certificate verification)})$
    and $\mathrm{R}(f_{\mathrm{CS}}) = \widetilde\Omega(\mathrm{R}(f))$.
  scale:
    var: n
    note: |
      $n$ is the input length of the *base* function, not of the cheat-sheet
      function. The values below are for the flagship instantiation of
      [ABK16]: the Block-$k$-sum-composed-with-$k$-sum function
      $\mathrm{BKK}\colon\{0,1\}^n\to\{0,1\}$ of [ABK16, Thm 10] and its cheat
      sheet $\mathrm{BKK}_{\mathrm{CS}}$, whose own input length is
      $n^{10+o(1)}$.
  values:
    - {measure: Q,  value: '\widetilde\Theta(n)', refs: [ABK16], note: 'For $\mathrm{BKK}$: $\mathrm{Q}=\Omega(n/\log^5 n)$ by reduction from $k$-sum plus the quantum composition theorem [ABK16, Thm 10], and $\mathrm{Q}\le n$ trivially. The cheat sheet inherits it, $\mathrm{Q}(f_{\mathrm{CS}})=\Omega(\mathrm{Q}(f))$ [ABK16, Lem. 12], with a matching $\widetilde O(n)$ algorithm (solve the $10\log n$ copies, then read the indexed cell).'}
    - {measure: QE, value: '\widetilde\Theta(n)', note: 'Squeeze between $\mathrm{Q}=\widetilde\Omega(n)$ and $\mathrm{D}=\widetilde O(n)$.'}
    - {measure: D,  value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{D}\ge\mathrm{Q}=\widetilde\Omega(n)$, and $\mathrm{D}\le\mathrm{C}^2=\widetilde O(n)$ for a total function.'}
    - {measure: C,  value: '\widetilde O(\sqrt n)', refs: [ABK16], note: 'The point of the construction: the outer Block $k$-sum has certificates made of $O(n)$ ones and only $O(k^2\log n)$ zeroes, and the inner $k$-sum certifies ones cheaply, so the composition certifies in $O(k^2\sqrt n\log n)=\widetilde O(\sqrt n)$ bits [ABK16, Thm 10]. The cheat sheet keeps this: certify the $10\log n$ copies and read the one indexed cell.'}
    - {measure: bs,  value: '\widetilde\Theta(\sqrt n)', note: 'Upgraded from the bare $\mathrm{bs}\le\mathrm{C}$ upper bound: $\mathrm{D}\le\mathrm{C}\cdot\mathrm{bs}$ with $\mathrm{C}=\widetilde O(\sqrt n)$ and $\mathrm{D}=\widetilde\Omega(n)$ forces $\mathrm{bs}=\widetilde\Omega(\sqrt n)$ as well.'}
    - {measure: fbs, value: '\widetilde\Theta(\sqrt n)', note: 'Squeezed between $\mathrm{bs}$ and $\mathrm{C}$, which coincide here.'}
    - {measure: RC,  value: '\widetilde\Theta(\sqrt n)', note: 'Squeeze: $\mathrm{RC}=\Theta(\mathrm{fbs})$, now pinned on both sides.'}
    - {measure: FC,  value: '\widetilde\Theta(\sqrt n)', note: 'Squeeze: $\mathrm{FC}=\mathrm{fbs}$ exactly.'}
    - {measure: CA,  value: '\widetilde\Theta(\sqrt n)', refs: [ABIKPS17], note: 'Squeeze: $\mathrm{CA}=\Theta(\mathrm{fbs})$ for total functions. Against $\mathrm{Q}=\widetilde\Theta(n)$ this is a quadratic $\mathrm{Q}$-vs-$\mathrm{CA}$ gap.'}
    - {measure: QC,  value: '\widetilde\Theta(n^{1/4})', note: 'Squeeze: $\mathrm{QC}=\Theta(\sqrt{\mathrm{fbs}})$. Quantum certificate complexity is a *fourth* power below $\mathrm{Q}$ here.'}
    - {measure: s,   value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{s}\le\mathrm{bs}=\widetilde O(\sqrt n)$, with the Huang floor $\mathrm{s}\ge\sqrt{\mathrm{bs}}=\widetilde\Omega(n^{1/4})$.'}
    - {measure: R,   value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{Q}\le\mathrm{R}\le\mathrm{D}$, both $\widetilde\Theta(n)$.'}
    - {measure: R0,  value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{R}\le\mathrm{R}_0\le\mathrm{D}$.'}
    - {measure: R1,  value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{R}\le\mathrm{R}^1\le\mathrm{D}$.'}
    - {measure: RS,  value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [BenDavidKothari18], note: 'The inequality runs $\mathrm{R}_\varepsilon\ge\overline{\mathrm{R}}_\varepsilon\ge(1-2\varepsilon)\mathrm{RS}$ [BenDavidKothari18, Thm 12], i.e. $\mathrm{RS}=O(\mathrm{R})=\widetilde O(n)$, *not* the other way round. Floors: $\mathrm{RS}\ge\mathrm{CG}^{\mathrm{pub}}\ge\mathrm{fbs}=\widetilde\Omega(\sqrt n)$, and $\mathrm{R}=O(\mathrm{RS}^2\log\mathrm{RS})$ for total $f$ [Thm 32] gives the same $\widetilde\Omega(\sqrt n)$. Pinning this cell would settle whether sabotage sees cheat-sheet hardness.'}
    - {measure: Dmu, value: '\widetilde\Theta(n)', note: 'Maximised over input distributions: Yao''s minimax gives $\max_\mu\mathrm{D}^{\mu}=\Theta(\mathrm{R})$.'}
    - {measure: Advpm, value: '\widetilde\Theta(n)', refs: [Reichardt11], note: 'Squeeze: $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$. The adversary bound therefore *does* see the hardness that $\widetilde{\deg}$ misses -- this is the standard reading of the $\mathrm{Q}$-vs-$\widetilde{\deg}$ separation.'}
    - {measure: gamma2, value: '\widetilde\Theta(n)', refs: [LMRSS11], note: 'Squeeze: the approximate $\gamma_2$ norm is the factorisation-norm form of $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$.'}
    - {measure: deg, value: '\widetilde O(\sqrt n)', refs: [ABK16], note: 'For $\mathrm{BKK}_{\mathrm{CS}}$ [ABK16, Thm 4]. A $1$-input has a *unique* valid cheat-sheet location $\ell$, so the exact representing polynomial is the plain sum over $\ell$ of the degree-$\widetilde O(\sqrt n)$ polynomials representing "the certificate stored at $\ell$ checks out".'}
    - {measure: adeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\widetilde{\deg}\le\deg=\widetilde O(\sqrt n)$, with the floor $\widetilde{\deg}=\widetilde\Omega(\mathrm{D}^{1/4})=\widetilde\Omega(n^{1/4})$ [ABKRT21]. The recorded $\mathrm{Q}=\widetilde\Theta(n)$ is what makes this the $\mathrm{Q}$-vs-$\widetilde{\deg}$ separation.'}
    - {measure: lambda, value: '\widetilde O(\sqrt n)', refs: [ABKRT21], note: 'Squeeze: $\lambda=O(\widetilde{\deg})$ [ABKRT21], with the floor $\lambda=\widetilde\Omega(\mathrm{D}^{1/6})$.'}
    - {measure: UCmin, value: '\widetilde\Theta(\sqrt n)', refs: [BHT17], note: 'Upgraded to a two-sided bound: the upper bound below, plus $\mathrm{D}\le\mathrm{UC}_{\min}^2$ [BHT17] against $\mathrm{D}=\widetilde\Theta(n)$. The same uniqueness makes the $1$-certificates of $\mathrm{BKK}_{\mathrm{CS}}$ unambiguous, giving $\mathrm{Q}=\widetilde\Omega(\mathrm{UC}_{\min}^2)$ [BHT17, Cor. 2, attributed to AKK16]. This is the input to the [[BHTfn]] amplification.'}
    - {measure: C0, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Upper: $\mathrm{C}^0\le\mathrm{C}=\widetilde O(\sqrt n)$. Lower: $\mathrm{D}\le\mathrm{C}^0\mathrm{C}^1\le\mathrm{C}^0\cdot\mathrm{C}$ with $\mathrm{D}=\widetilde\Theta(n)$ and $\mathrm{C}=\widetilde O(\sqrt n)$.'}
    - {measure: C1, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Same squeeze as the $\mathrm{C}^0$ line with the two sides exchanged; the $1$-certificates are moreover unambiguous, which is what the $\mathrm{UC}_{\min}$ line records.'}
    - {measure: Cmin, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{C}_{\min}\le\mathrm{C}=\widetilde O(\sqrt n)$. No matching lower bound is claimed -- a single cheaply certified input would not disturb anything above.'}
    - {measure: EC, value: '\widetilde\Theta(\sqrt n)', note: 'Squeezed between $\mathrm{fbs}$ and $\mathrm{C}$, which coincide at $\widetilde\Theta(\sqrt n)$. Against $\mathrm{Q}=\widetilde\Theta(n)$ this is a quadratic $\mathrm{Q}$-vs-$\mathrm{EC}$ gap.'}
    - {measure: UC, value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{UC}\ge\mathrm{SP}\ge\mathrm{C}=\widetilde\Omega(\sqrt n)$. Only the $1$-side is known to be unambiguously certifiable at that cost, which is why $\mathrm{UC}_{\min}$ is pinned above but $\mathrm{UC}$ is not.'}
    - {measure: SP, value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: every subcube of a monochromatic partition is a certificate, so $\mathrm{SP}\ge\mathrm{C}=\widetilde\Omega(\sqrt n)$.'}
    - {measure: cbs, value: '\widetilde\Theta(\sqrt n)', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}$ degenerates to $\mathrm{bs}=\widetilde\Theta(\sqrt n)$ ([[cbs]] vs [[bs]]).'}
    - {measure: Q0, value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_E$, both $\widetilde\Theta(n)$.'}
    - {measure: MAdv, value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{MAdv}=\Theta(\mathrm{Q})=\widetilde\Theta(n)$. Unlike the positive adversary below, the multiplicative adversary does see the full hardness.'}
    - {measure: Adv, value: '\widetilde O(\sqrt n)', note: 'The certificate-complexity barrier: $\mathrm{Adv}\le\sqrt{\mathrm{C}^0\mathrm{C}^1}=\widetilde O(\sqrt n)$, while $\mathrm{Q}=\widetilde\Theta(n)$. So the positive-weight adversary is quadratically too weak to certify the quantum complexity of this function -- one of the cleanest total-function instances of that barrier, and the reason $\mathrm{Adv}^{\pm}$ rather than $\mathrm{Adv}$ appears in the row above.'}
    - {measure: CG, value: '\widetilde\Theta(n)', putative: true, note: 'Squeeze: $\mathrm{R}_0=O(\mathrm{CG})$ gives $\mathrm{CG}=\widetilde\Omega(n)$, and $\mathrm{CG}\le\mathrm{C}^0\mathrm{C}^1=\widetilde O(n)$ gives the matching upper bound.'}
    - {measure: psD, value: '\widetilde\Theta(n)', note: 'For a Boolean function the canonical solution is forced to be $f$ itself, so $\mathrm{psD}=\mathrm{R}=\widetilde\Theta(n)$.'}
    - {measure: Rbar, value: '\widetilde\Theta(n)', note: 'The distributional form of $\mathrm{R}$: $\overline{\mathrm{R}}=\Theta(\mathrm{R})=\widetilde\Theta(n)$.'}
    - {measure: odeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\widetilde{\deg}_+\le\widetilde{\deg}=\widetilde O(\sqrt n)$. Like $\widetilde{\deg}$, one-sided approximate degree misses the quantum hardness by a fourth power.'}
    - {measure: sdeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{sdeg}\le\widetilde{\deg}_+\le\widetilde{\deg}=\widetilde O(\sqrt n)$.'}
    - {measure: rdeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{rdeg}\le\mathrm{C}=\widetilde O(\sqrt n)$.'}
    - {measure: Inf, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{I}(f)\le\mathrm{s}(f)=\widetilde O(\sqrt n)$ (equally, $\mathrm{I}\le\deg$). Against $\mathrm{Q}=\widetilde\Theta(n)$ this gives $\mathrm{Q}=\widetilde\Omega(\mathrm{I}^2)$ for a total function.'}
    - {measure: Inf1, value: '\widetilde O(\sqrt n)', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide coordinate by coordinate, so $\mathrm{I}^{1}=\mathrm{I}=\widetilde O(\sqrt n)$.'}
    - {measure: MaxInf, value: '\widetilde O(\sqrt n)', note: 'A maximum is at most a sum, so $\mathrm{MaxInf}\le\mathrm{I}=\widetilde O(\sqrt n)$. OSSS ($\mathrm{D}\ge\mathrm{Var}/\mathrm{MaxInf}$) gives nothing here because $\mathrm{BKK}_{\mathrm{CS}}$ is essentially never satisfied under the uniform measure.'}
    - {measure: s0, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{s}^0\le\mathrm{s}\le\mathrm{bs}=\widetilde O(\sqrt n)$. Against $\mathrm{Q}=\widetilde\Theta(n)$ this alone is a quadratic $\mathrm{Q}$-vs-$\mathrm{s}^0$ gap.'}
    - {measure: s1, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{s}^1\le\mathrm{s}\le\mathrm{bs}=\widetilde O(\sqrt n)$. No floor is claimed for either side separately; Huang''s $\mathrm{s}\ge\sqrt{\mathrm{bs}}$ only bounds the two-sided maximum.'}
    - {measure: bs0, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{bs}^0\le\mathrm{bs}=\widetilde O(\sqrt n)$.'}
    - {measure: bs1, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{bs}^1\le\mathrm{bs}=\widetilde O(\sqrt n)$. Nisan''s refined bound $\mathrm{C}^1\le\mathrm{s}^0\,\mathrm{bs}^1$ with $\mathrm{C}^1=\widetilde\Theta(\sqrt n)$ and $\mathrm{s}^0=\widetilde O(\sqrt n)$ gives only $\mathrm{bs}^1=\widetilde\Omega(1)$, so neither side of $\mathrm{bs}$ can be pinned from the recorded data.'}
    - {measure: chi, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [Li18, Sanyal18], note: 'Floors: $\chi\ge\Omega(\mathrm{bs})=\widetilde\Omega(\sqrt n)$ [Li18], and $\mathrm{R}=O(\chi^2)$ [Sanyal18] with $\mathrm{R}=\widetilde\Theta(n)$ gives the same. Ceiling $\chi=O(\mathrm{R})=\widetilde O(n)$.'}
    - {measure: chibar, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [GLSS19], note: 'Squeezed along $\mathrm{RS}\lesssim\bar\chi\lesssim\mathrm{LR}\lesssim\mathrm{R}$ [GLSS19]: the floor is the $\mathrm{RS}$ floor $\widetilde\Omega(\sqrt n)$ and the ceiling is $\mathrm{R}=\widetilde O(n)$.'}
    - {measure: LR, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', note: 'Squeezed between $\bar\chi$ and $\mathrm{R}$, neither of which is pinned here; also $\mathrm{LR}=\Omega(\sqrt{\mathrm{R}})=\widetilde\Omega(\sqrt n)$ directly.'}
    - {measure: Rstar, value: '\widetilde\Theta(n)', note: 'Unlike $\mathrm{LR}$ and $\bar\chi$, the quantum-aware relaxation is pinned: $\mathrm{R}^*\ge\Omega(\mathrm{Q})=\widetilde\Omega(n)$ and $\mathrm{R}^*\le\mathrm{R}=\widetilde O(n)$. So the cheat-sheet hardness *is* visible to $\mathrm{R}^*$ even though it may be invisible to the purely classical relaxations above.'}
    - {measure: Np, value: '\widetilde\Theta(n)', refs: [FRPU94], note: 'Squeeze: $\mathrm{R}\le\mathrm{N}_p=O(\mathrm{R}\log\mathrm{R})$ with $\mathrm{R}=\widetilde\Theta(n)$; the noise overhead vanishes into the tilde.'}
    - {measure: robustQ, value: '\widetilde\Theta(n)', refs: [BNRdW05], note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}^{\mathrm{rob}}=O(\mathrm{Q}\log\mathrm{Q})$ [BNRdW05] with $\mathrm{Q}=\widetilde\Theta(n)$.'}
    - {measure: CGpub, value: '\widetilde\Theta(\sqrt n)', refs: [ABIKPS17], note: 'The public-coin certificate game value collapses to $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\widetilde\Theta(\sqrt n)$ for total functions [ABIKPS17]. Read against the recorded $\mathrm{CG}=\widetilde\Theta(n)$, this family is a *quadratic* separation of private-coin from public-coin certificate games -- private coins are the one escapee from the collapse $\mathrm{CG}^{\mathrm{ns}}=\mathrm{CG}^*=\mathrm{CG}^{\mathrm{pub}}=\Theta(\mathrm{CA})$.'}
    - {measure: CGns, value: '\widetilde\Theta(\sqrt n)', refs: [ABIKPS17], note: 'Same collapse as the $\mathrm{CG}^{\mathrm{pub}}$ line: $\mathrm{CG}^{\mathrm{ns}}=\Theta(\mathrm{CA})=\widetilde\Theta(\sqrt n)$.'}
    - {measure: CGstar, value: '\widetilde\Theta(\sqrt n)', refs: [ABIKPS17], note: 'Same collapse: entangled certificate games are $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\widetilde\Theta(\sqrt n)$.'}
    - {measure: prt, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [JainKlauck10], note: 'Ceiling $\mathrm{prt}_\varepsilon\le 2\mathrm{R}_\varepsilon=\widetilde O(n)$ [JainKlauck10, Thm 3.1]. Best floor available: $\mathrm{prt}_\varepsilon\ge\mathrm{RC}+\log\varepsilon=\widetilde\Omega(\sqrt n)$ (the $\widetilde{\deg}$ and $\mathrm{CA}$ floors are no better, and $\mathrm{D}=O(\mathrm{prt}_{1/3}^3)$ only gives $\widetilde\Omega(n^{1/3})$). Whether the partition bound sees cheat-sheet hardness is exactly this gap.'}
    - {measure: rprt, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [JainKlauck10], note: 'The relaxation only loses from above, $\mathrm{rprt}\le\mathrm{prt}=\widetilde O(n)$, and every floor quoted on the $\mathrm{prt}$ line survives it, so the same range applies.'}
    - {measure: Rna, value: '\widetilde\Omega(n)', note: 'Squeeze: $\mathrm{R}^{\mathrm{na}}\ge\mathrm{R}=\widetilde\Omega(n)$. The ceiling is the cheat-sheet input length $n^{10+o(1)}$, which is not comparable to the other entries in this scale.'}
    - {measure: Dna, value: '\widetilde\Omega(n)', note: 'Squeeze: $\mathrm{D}^{\mathrm{na}}\ge\mathrm{D}=\widetilde\Omega(n)$; the ceiling is again the input length $n^{10+o(1)}$ rather than anything in the $n$-scale.'}
    - {measure: D_size, value: '\widetilde\Omega(n)', note: 'Squeeze: $\mathrm{D}\le\mathrm{DTsize}-1$, so $\mathrm{DTsize}=\widetilde\Omega(n)$. The much stronger $\mathrm{DTsize}\ge 2^{\mathrm{rank}}$ route is unavailable because $\mathrm{C}_{\min}$, and hence $\mathrm{rank}$, has no recorded floor here.'}
    - {measure: ndeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{ndeg}\le\min\{\mathrm{C}^1,\deg\}=\widetilde O(\sqrt n)$. Against $\mathrm{Q}=\widetilde\Theta(n)$ this is a quadratic gap.'}
    - {measure: NQ, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil=\widetilde O(\sqrt n)$. Nondeterministic quantum query complexity is quadratically below $\mathrm{Q}$ here.'}
    - {measure: ardeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{rdeg}_{1/3}\le\min\{\mathrm{rdeg},\widetilde{\deg}\}=\widetilde O(\sqrt n)$.'}
    - {measure: PostQ, value: '\widetilde O(\sqrt n)', refs: [MahadevdeWolf15], note: 'Squeeze: $\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] applied to the $\mathrm{ardeg}$ line. Against $\mathrm{Q}=\widetilde\Theta(n)$ this is a total function on which post-selection gives a quadratic speedup over bounded-error quantum queries.'}
    - {measure: cjdeg, value: '\widetilde\Omega(n^{1/4}),\ \widetilde O(n)', note: 'Ceiling: a depth-$\mathrm{D}$ decision tree is an exact conical junta of width $\mathrm{D}$ (one conjunction per accepting path, all coefficients $1$), so $\mathrm{cjdeg}\le\mathrm{D}=\widetilde O(n)$. Floor: $\mathrm{cjdeg}\ge\widetilde{\deg}=\widetilde\Omega(n^{1/4})$. Since $\mathrm{Q}=\widetilde\Theta(n)$, pinning this cell at the bottom of its range would give a $\mathrm{Q}$-vs-$\mathrm{cjdeg}$ separation strictly stronger than the recorded $\mathrm{Q}$-vs-$\widetilde{\deg}$ one.'}
    - {measure: deg2, value: '\widetilde O(\sqrt n)', note: 'The exact multilinear representation over $\mathbb{R}$ has integer coefficients (Moebius inversion of $f$), so reducing it mod $2$ represents $f$ over $\mathbb{F}_2$ and $\deg_2\le\deg=\widetilde O(\sqrt n)$.'}
    - {measure: degp, value: '\widetilde O(\sqrt n)', note: 'Same integrality argument as the $\deg_2$ line, for every prime $p$: $\deg_p\le\deg=\widetilde O(\sqrt n)$.'}
  witnesses:
    - {of: [Q, adeg],   setting: total, statement: '$\mathrm{Q} = \widetilde\Omega(\widetilde{\deg}^4)$: approximate degree does **not** characterise quantum query complexity, even for total functions. Matches the upper bound $\mathrm{Q}\le\mathrm{D}=O(\widetilde{\deg}^4)$. **Settled.**', refs: [ABK16, ABKRT21]}
    - {of: [QE, adeg],  setting: total, statement: '$\mathrm{Q}_E = \widetilde\Omega(\widetilde{\deg}^4)$.', refs: [ABK16]}
    - {of: [Q, C],      setting: total, statement: '$\mathrm{Q} = \widetilde\Omega(\mathrm{C}^2)$, matching $\mathrm{Q}\le\mathrm{D}\le\mathrm{C}^2$. **Settled.**', refs: [ABK16]}
    - {of: [Q, bs],     setting: total, statement: '$\mathrm{Q} = \widetilde\Omega(\mathrm{bs}^2)$ against $\mathrm{Q}=O(\mathrm{bs}^3)$.', refs: [ABK16]}
    - {of: [Q, deg],    setting: total, statement: '$\mathrm{Q} = \widetilde\Omega(\deg^2)$ against $\mathrm{Q}=O(\deg^3)$.', refs: [ABK16]}
    - {of: [QE, lambda], setting: total, statement: '$\mathrm{Q}_E = \widetilde\Omega(\lambda^4)$ against $O(\lambda^6)$. The cheat-sheet function is from [ABK16]; the $\lambda$ machinery that reads the separation off it is [ABKRT21].', refs: [ABK16, ABKRT21]}
    - {of: [R, Q],      setting: total, statement: 'Applying the cheat-sheet transformation to $k$-Forrelation gives a total function with $\mathrm{R} = \widetilde\Omega(\mathrm{Q}^3)$; the upper bound is $\mathrm{R}\le\mathrm{D}=O(\mathrm{Q}^4)$, so this cell is still **open** in $[3,4]$.', refs: [ABK16, BansalSinha21, SSW21]}
  notes: |
    Cheat sheets are the single most productive device in this table: every
    partial-function speedup that comes with *short certificates* can be
    "totalised". They cost polylog factors, which is why so many cells carry
    $\widetilde\Omega$ rather than $\Omega$.

    The `values` above describe one instantiation, $\mathrm{BKK}$ and
    $\mathrm{BKK}_{\mathrm{CS}}$, which is the one that supplies the
    $\mathrm{Q}$-vs-$\mathrm{C}$, $\mathrm{Q}$-vs-$\mathrm{bs}$,
    $\mathrm{Q}$-vs-$\deg$ and $\mathrm{Q}$-vs-$\mathrm{UC}_{\min}$ gaps. Two
    other instantiations appear in the witness list and are *different*
    functions, so their numbers are deliberately not merged into the table:

    - $\mathrm{R}=\widetilde\Omega(\mathrm{Q}^3)$ uses Forrelation composed
      with $\mathrm{AND}$-$\mathrm{OR}$ and then cheat-sheeted [ABK16, Thm 1];
      the cubic exponent is now known to be the truth for $k$-Forrelation
      [BansalSinha21, SSW21].
    - $\mathrm{Q}=\widetilde\Omega(\widetilde{\deg}^4)$ uses
      $\mathrm{RecBKK}_{\mathrm{CS}}$, $\mathrm{BKK}$ composed with itself
      $d=\Theta(\sqrt{\log n/\log\log n})$ times [ABK16, Thms 2, 13]. Its
      bounds are $\mathrm{Q}=n^{1-o(1)}$ and
      $\widetilde{\deg}=n^{1/4+o(1)}$, where the $o(1)$ hides a
      $\exp(\Theta(\sqrt{\log n\log\log n}))$ factor rather than a polylog --
      too coarse to record as a $\widetilde O(\cdot)$ value.
  refs: [ABK16, BansalSinha21, SSW21]
  see_also: [pointer, Forrelation, kForrelation]

- id: BHTfn
  name: Low-sensitivity function from unambiguous certificates
  symbol: 'f_{\mathrm{BHT}}'
  group: separating
  order: 32
  kind: total
  arity: '$\mathrm{poly}(n)$ bits'
  short: 'The current record for D-vs-s: $\mathrm{D} = \widetilde\Omega(\mathrm{s}^3)$.'
  definition: |
    Built from a function with small *unambiguous* certificate complexity by a
    composition that keeps sensitivity low while forcing deterministic (and
    quantum) algorithms to work hard.
  formal: |
    Two ingredients [BHT17]. *Desensitizing*: replace each input bit $x_i$ of
    $f$ by three bits and accept only strings of the form $ppp$ for $p$ an
    unambiguous $1$-certificate; the result $f'$ has $\mathrm{s}_0(f')\le 1$
    and $\mathrm{s}_1(f')\le 3\,\mathrm{UC}_1(f)$, while no measure in
    $\{\mathrm{D},\mathrm{R},\mathrm{Q},\mathrm{C},\mathrm{bs},\mathrm{RC},
    \mathrm{UC},\deg\}$ decreases. *Amplifying*: compose on the outside with
    $\mathrm{OR}_{3\mathrm{UC}_{\min}(f)}$ (for $\mathrm{D}$) or with
    $\mathrm{BSum}_{\mathrm{UC}_{\min}(f)}$, Block $k$-sum (for $\mathrm{Q}$),
    both of which have certificates using only $O(\mathrm{polylog})$ ones, so
    that $\mathrm{s}(\hat f)=\widetilde O(\mathrm{UC}_{\min}(f))$ while the
    outer complexity multiplies through. Throughout the table below, $f$ is
    the base function, $f'$ is its desensitized version, and
    $\hat f := \mathrm{BSum}_n \circ f'$ with $n = \mathrm{UC}_{\min}(f)$ is
    the amplified function whose values are recorded.
  scale:
    var: n
    note: |
      $n := \mathrm{UC}_{\min}(f)$ of the base function $f$, i.e. the
      sensitivity scale of the composed function. The base used below is
      $\mathrm{BKK}_{\mathrm{CS}}$ (see [[cheatsheet]]), for which
      $\mathrm{Q}(f)=\widetilde\Omega(\mathrm{UC}_{\min}(f)^2)$.
  values:
    - {measure: s, value: '\widetilde O(n)', refs: [BHT17], note: 'Every sensitive bit of $\hat f = \mathrm{BSum}_n\circ f''$ lies in a block that is sensitive for the outer Block $k$-sum, and Block $k$-sum has certificates containing only $O(\log^3 n)$ ones; with $\mathrm{s}_0(f'')\le 1$ this gives $\mathrm{s}(\hat f)\le n\,\mathrm{s}_0(f'')+O(\log^3 n)\,\mathrm{s}_1(f'')=\widetilde O(n)$ [BHT17, Thm 3].'}
    - {measure: Q, value: '\widetilde\Omega(n^3)', refs: [BHT17], note: 'Quantum query complexity is multiplicative under composition, so $\mathrm{Q}(\hat f)=\widetilde\Omega(n\cdot\mathrm{Q}(f))$; with the base $\mathrm{BKK}_{\mathrm{CS}}$ contributing $\mathrm{Q}(f)=\widetilde\Omega(n^2)$ this is $\widetilde\Omega(n^3)$ [BHT17, Cor. 2].'}
    - {measure: R,  value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{R}\ge\mathrm{Q}$.'}
    - {measure: R0, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{R}_0\ge\mathrm{R}\ge\mathrm{Q}$.'}
    - {measure: D,  value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{D}\ge\mathrm{R}_0\ge\mathrm{Q}$. This is the recorded $\mathrm{D}=\widetilde\Omega(\mathrm{s}^3)$.'}
    - {measure: QE, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{Q}_E\ge\mathrm{Q}$.'}
    - {measure: R1, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{R}^1\ge\mathrm{R}\ge\mathrm{Q}$.'}
    - {measure: RS, value: '\widetilde\Omega(n^{3/2})', refs: [BenDavidKothari18], note: 'The sabotage inequality runs $\mathrm{R}_\varepsilon\ge\overline{\mathrm{R}}_\varepsilon\ge(1-2\varepsilon)\mathrm{RS}$ [BenDavidKothari18, Thm 12], i.e. $\mathrm{RS}=O(\mathrm{R})$, so the recorded $\mathrm{R}=\widetilde\Omega(n^3)$ gives no floor. What does: $\mathrm{R}=O(\mathrm{RS}^2\log\mathrm{RS})$ for total $f$ [Thm 32], hence $\mathrm{RS}=\widetilde\Omega(\sqrt{\mathrm{R}})=\widetilde\Omega(n^{3/2})$; the weaker $\mathrm{RS}\ge\mathrm{CG}^{\mathrm{pub}}\ge\mathrm{fbs}$ only gives $\widetilde\Omega(n)$. Since no total function with $\mathrm{RS}=o(\mathrm{R})$ is known, the truth is probably $\widetilde\Theta(n^3)$, but that is not a theorem.'}
    - {measure: Rna, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{R}^{\mathrm{na}}\ge\mathrm{R}$.'}
    - {measure: Dna, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{D}^{\mathrm{na}}\ge\mathrm{D}$.'}
    - {measure: Advpm, value: '\widetilde\Omega(n^3)', refs: [Reichardt11], note: 'The general adversary bound characterises bounded-error quantum query complexity, $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$, so it inherits the recorded $\mathrm{Q}$.'}
    - {measure: gamma2, value: '\widetilde\Omega(n^3)', refs: [LMRSS11], note: 'The approximate $\gamma_2$ norm is the factorisation-norm form of $\mathrm{Adv}^{\pm}$, hence $\Theta(\mathrm{Q})$.'}
    - {measure: MAdv, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{Adv}^{\pm}\le\mathrm{MAdv}$.'}
    - {measure: C,  value: '\widetilde\Omega(n^{3/2})', putative: true, note: 'From $\mathrm{D}\le\mathrm{C}^2$ against $\mathrm{D}=\widetilde\Omega(n^3)$. No matching upper bound is known here: all that totality gives is $\mathrm{C}\le\mathrm{s}\cdot\mathrm{bs}$ [Nisan91], and the only *theorem* bounding $\mathrm{bs}$ by $\mathrm{s}$ is $\mathrm{bs}\le 2\deg^2\le 2\mathrm{s}^4$ (Nisan-Szegedy plus Huang), giving $\mathrm{C}\le 2\mathrm{s}^5=\widetilde O(n^5)$. The familiar $\mathrm{bs}\le\mathrm{s}^2$ is an open conjecture, not an available bound.'}
    - {measure: UC, value: '\widetilde\Omega(n^{3/2})', note: 'Squeeze: $\mathrm{UC}\ge\mathrm{C}$; equivalently $\mathrm{D}\le\mathrm{UC}^2$.'}
    - {measure: SP, value: '\widetilde\Omega(n^{3/2})', note: 'Squeeze: $\mathrm{SP}\ge\mathrm{C}$; equivalently $\mathrm{D}\le\mathrm{SP}^2$.'}
    - {measure: bs, value: '\widetilde\Omega(n)', putative: true, note: 'From $\mathrm{D}\le\mathrm{s}\cdot\mathrm{bs}^2$ with the recorded $\mathrm{s}=\widetilde O(n)$ and $\mathrm{D}=\widetilde\Omega(n^3)$: $\mathrm{bs}\ge\sqrt{\mathrm{D}/\mathrm{s}}=\widetilde\Omega(n)$. So the low-sensitivity function is *not* low-block-sensitivity: $\mathrm{bs}$ is already as large as $\mathrm{s}$. The available ceiling is $\mathrm{bs}\le 2\deg^2\le 2\mathrm{s}^4=\widetilde O(n^4)$ (Nisan-Szegedy composed with Huang''s $\deg\le\mathrm{s}^2$); $\mathrm{bs}\le\mathrm{s}^2$ would give $\widetilde O(n^2)$ but is still conjectural.'}
    - {measure: fbs, value: '\widetilde\Omega(n)', note: 'Squeeze: $\mathrm{fbs}\ge\mathrm{bs}$.'}
    - {measure: FC,  value: '\widetilde\Omega(n)', note: 'Squeeze: $\mathrm{FC}=\mathrm{fbs}$ exactly.'}
    - {measure: RC,  value: '\widetilde\Omega(n)', note: 'Squeeze: $\mathrm{RC}=\Theta(\mathrm{fbs})$.'}
    - {measure: CA,  value: '\widetilde\Omega(n)', refs: [ABIKPS17], note: 'Squeeze: $\mathrm{CA}=\Theta(\mathrm{fbs})$ for total functions.'}
    - {measure: deg, value: '\widetilde\Omega(n)', putative: true, note: 'From $\mathrm{D}=O(\deg^3)$ [Midrijanis04] against $\mathrm{D}=\widetilde\Omega(n^3)$. Huang caps it at $\deg\le\mathrm{s}^2=\widetilde O(n^2)$.'}
    - {measure: adeg, value: '\widetilde\Omega(n^{3/4})', putative: true, note: 'From $\mathrm{D}=O(\widetilde{\deg}^4)$ [ABKRT21] against $\mathrm{D}=\widetilde\Omega(n^3)$.'}
    - {measure: lambda, value: '\widetilde O(n)', note: 'Squeeze: $\lambda\le\mathrm{s}=\widetilde O(n)$. Spectral sensitivity is therefore small here too, which is why this family also witnesses a large $\mathrm{D}$-vs-$\lambda$ gap.'}
    - {measure: s0, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{s}_0\le\mathrm{s}=\widetilde O(n)$. The desensitizing step is what makes both sides small: the inner $f''$ has $\mathrm{s}_0(f'')\le 1$ by construction.'}
    - {measure: s1, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{s}_1\le\mathrm{s}=\widetilde O(n)$; the outer Block $k$-sum contributes only $O(\log^3 n)$ ones per certificate.'}
    - {measure: Inf, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{I}(f)=\mathbf{E}_x[\mathrm{s}(f,x)]\le\mathrm{s}(f)=\widetilde O(n)$. Combined with $\mathrm{D}=\widetilde\Omega(n^3)$ this is a cubic $\mathrm{D}$-vs-$\mathrm{I}$ gap that tracks the record $\mathrm{D}$-vs-$\mathrm{s}$ gap exactly.'}
    - {measure: Inf1, value: '\widetilde O(n)', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide coordinate by coordinate, so $\mathrm{I}^{1}=\mathrm{I}=\widetilde O(n)$.'}
    - {measure: UCmin, value: '\widetilde\Omega(n^{3/2})', refs: [BHT17], note: 'Squeeze: $\mathrm{D}=O(\mathrm{UC}_{\min}^2)$ [BHT17] against $\mathrm{D}=\widetilde\Omega(n^3)$. Note this is the *output* of the amplification, not the $\mathrm{UC}_{\min}$ of the base function that sets the scale variable.'}
    - {measure: EC, value: '\widetilde\Omega(n^{3/2})', note: 'Squeeze: $\mathrm{R}_0=O(\mathrm{EC}^2)$ against $\mathrm{R}_0=\widetilde\Omega(n^3)$. This beats the bare $\mathrm{EC}\ge\mathrm{fbs}=\widetilde\Omega(n)$ by half a power.'}
    - {measure: CG, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{R}_0=O(\mathrm{CG})$ against $\mathrm{R}_0=\widetilde\Omega(n^3)$.'}
    - {measure: Q0, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{Q}_0\ge\mathrm{Q}$.'}
    - {measure: QC, value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{QC}=\Theta(\sqrt{\mathrm{fbs}})$ with $\mathrm{fbs}=\widetilde\Omega(n)$.'}
    - {measure: cbs, value: '\widetilde\Omega(n)', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}=\mathrm{bs}=\widetilde\Omega(n)$ ([[cbs]] vs [[bs]]).'}
    - {measure: psD, value: '\widetilde\Omega(n^3)', note: 'For a Boolean function the canonical solution is forced to be $f$ itself, so $\mathrm{psD}=\mathrm{R}=\widetilde\Omega(n^3)$.'}
    - {measure: Rbar, value: '\widetilde\Omega(n^3)', note: 'The distributional form of $\mathrm{R}$: $\overline{\mathrm{R}}=\Theta(\mathrm{R})=\widetilde\Omega(n^3)$.'}
    - {measure: Dmu, value: '\widetilde\Omega(n^3)', note: 'Yao''s minimax: $\max_\mu\mathrm{D}^{\mu}=\Theta(\mathrm{R})=\widetilde\Omega(n^3)$.'}
    - {measure: D_size, value: '\widetilde\Omega(n^3)', note: 'Squeeze: $\mathrm{D}\le\mathrm{DTsize}-1$, so the tree needs at least $\widetilde\Omega(n^3)$ leaves. Only the trivial size bound is claimed -- the exponential lower bound one would expect is not established here.'}
    - {measure: chi, value: '\widetilde\Omega(n^{3/2})', refs: [Sanyal18, Li18], note: 'Floor from $\mathrm{R}=O(\chi^2)$ [Sanyal18] against $\mathrm{R}=\widetilde\Omega(n^3)$. This beats the block-sensitivity floor $\chi=\Omega(\mathrm{bs})=\widetilde\Omega(n)$ [Li18] by half a power.'}
    - {measure: chibar, value: '\widetilde\Omega(n^{3/2})', refs: [GLSS19], note: 'Squeeze: $\bar\chi=\Omega(\mathrm{RS})=\widetilde\Omega(n^{3/2})$ along the chain $\mathrm{RS}\lesssim\bar\chi\lesssim\mathrm{LR}\lesssim\mathrm{R}$ [GLSS19]; equivalently $\bar\chi=\Omega(\sqrt{\mathrm{R}})$ directly.'}
    - {measure: LR, value: '\widetilde\Omega(n^{3/2})', note: 'Squeeze: $\mathrm{LR}\ge\bar\chi=\widetilde\Omega(n^{3/2})$, equivalently $\mathrm{LR}=\Omega(\sqrt{\mathrm{R}})$.'}
    - {measure: Rstar, value: '\widetilde\Omega(n^3)', note: 'Unlike the classical relaxations above, this one is pinned at the top by the quantum floor $\mathrm{R}^*\ge\Omega(\mathrm{Q})=\widetilde\Omega(n^3)$, and $\mathrm{R}^*\le\mathrm{R}$ costs nothing since $\mathrm{R}$ is itself only bounded below.'}
    - {measure: Np, value: '\widetilde\Omega(n^3)', refs: [FRPU94], note: 'Squeeze: $\mathrm{N}_p\ge\mathrm{R}=\widetilde\Omega(n^3)$; the $O(\mathrm{R}\log\mathrm{R})$ ceiling adds nothing because $\mathrm{R}$ has no recorded ceiling.'}
    - {measure: robustQ, value: '\widetilde\Omega(n^3)', refs: [BNRdW05], note: 'Squeeze: $\mathrm{Q}^{\mathrm{rob}}\ge\mathrm{Q}=\widetilde\Omega(n^3)$ [BNRdW05].'}
    - {measure: CGpub, value: '\widetilde\Omega(n)', refs: [ABIKPS17], note: 'The public-coin certificate game value collapses to $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\widetilde\Omega(n)$ for total functions [ABIKPS17]. Against the recorded $\mathrm{CG}=\widetilde\Omega(n^3)$ this cell is where the private-coin/public-coin gap would show, but only the two floors are known.'}
    - {measure: CGns, value: '\widetilde\Omega(n)', refs: [ABIKPS17], note: 'Same collapse: $\mathrm{CG}^{\mathrm{ns}}=\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\widetilde\Omega(n)$.'}
    - {measure: CGstar, value: '\widetilde\Omega(n)', refs: [ABIKPS17], note: 'Same collapse: entangled certificate games are $\Theta(\mathrm{CA})=\widetilde\Omega(n)$.'}
    - {measure: prt, value: '\widetilde\Omega(n)', refs: [JainKlauck10], note: 'Two floors coincide: $\mathrm{prt}_\varepsilon\ge\mathrm{RC}+\log\varepsilon=\widetilde\Omega(n)$, and $\mathrm{D}=O(\mathrm{prt}_{1/3}^3)$ against $\mathrm{D}=\widetilde\Omega(n^3)$ gives $\widetilde\Omega(n)$ as well [JainKlauck10]. No ceiling, since $\mathrm{prt}\le 2\mathrm{R}$ and $\mathrm{R}$ is unbounded above here.'}
    - {measure: rprt, value: '\widetilde\Omega(n)', refs: [JainKlauck10], note: 'The $\mathrm{RC}$ floor survives the relaxation of the partition bound, so $\mathrm{rprt}=\widetilde\Omega(n)$ by the argument of the $\mathrm{prt}$ line.'}
    - {measure: Adv, value: '\widetilde\Omega(\sqrt n)', refs: [Ambainis02], note: 'Squeeze: $\mathrm{bs}\le\mathrm{Adv}^2$ [Ambainis02] with $\mathrm{bs}=\widetilde\Omega(n)$. The certificate barrier $\mathrm{Adv}\le\sqrt{\mathrm{C}^0\mathrm{C}^1}$ gives no ceiling here because neither one-sided certificate complexity is bounded above, and $\lambda\le\mathrm{Adv}$ gives no floor because $\lambda$ is only bounded above.'}
    - {measure: cjdeg, value: '\widetilde\Omega(n^{3/4})', note: 'Squeeze: $\mathrm{cjdeg}\ge\widetilde{\deg}=\widetilde\Omega(n^{3/4})$ (dropping non-negativity can only lower the degree).'}
    - {measure: MaxInf, value: '\widetilde O(n)', note: 'A maximum is at most a sum, so $\mathrm{MaxInf}\le\mathrm{I}=\widetilde O(n)$; equally $\mathrm{MaxInf}\le\mathrm{s}$. Against $\mathrm{D}=\widetilde\Omega(n^3)$ this is a cubic gap, i.e. the same record the $\mathrm{s}$ column records.'}
  notes: |
    The values describe the sensitivity-amplified function
    $\hat f=\mathrm{BSum}_n\circ f'$ of [BHT17, Thm 3, Cor. 2], which is what
    sets the $\mathrm{s}$ column. The last witness below,
    $\mathrm{C}=\Omega(\mathrm{UC}_{\min}^{1.22})$, comes from a *different*
    family in the same paper -- a projective-plane gadget with
    $\mathrm{C}=k^2-k+1$ and $\mathrm{UC}_{\min}=k(k+1)/2$ composed over a
    weighted alphabet [BHT17, Thm 5] -- so its numbers are not merged into the
    table above. Feeding that family through the same amplification is what
    gives $\mathrm{C}=\Omega(\mathrm{s}^{2.22})$ [BHT17, Cor. 4]; it has since
    been superseded by the cubic gap of [[BBGJKfn]].
  witnesses:
    - {of: [D, s],  setting: total, statement: '$\mathrm{D} = \widetilde\Omega(\mathrm{s}^3)$ against the upper bound $\mathrm{D}=O(\mathrm{s}^6)$ (Huang + Midrijanis).', refs: [BHT17, Huang19, Midrijanis04]}
    - {of: [R0, s], setting: total, statement: '$\mathrm{R}_0 = \widetilde\Omega(\mathrm{s}^3)$.', refs: [BHT17]}
    - {of: [R, s],  setting: total, statement: '$\mathrm{R} = \widetilde\Omega(\mathrm{s}^3)$.', refs: [BHT17]}
    - {of: [Q, s],  setting: total, statement: '$\mathrm{Q} = \widetilde\Omega(\mathrm{s}^3)$.', refs: [BHT17]}
    - {of: [C, UCmin], setting: total, statement: '$\mathrm{C} = \Omega(\mathrm{UC}_{\min}^{1.22})$.', refs: [BHT17]}
  refs: [BHT17]
  see_also: [s, UC, UCmin, BBGJKfn, cheatsheet]

- id: BBGJKfn
  name: Unambiguous-DNF / Alon-Saks-Seymour function
  symbol: 'f_{\mathrm{BBGJK}}'
  group: separating
  order: 33
  kind: total
  arity: '$\widetilde\Theta(n^4)$ bits'
  short: 'Sets the C row: $\mathrm{C}=\widetilde\Omega(\mathrm{s}^3)$, $\widetilde\Omega(\lambda^4)$, $\widetilde\Omega(\deg^2)$, $\widetilde\Omega(\widetilde{\deg}^3)$.'
  definition: |
    Comes from the resolution of the Alon-Saks-Seymour problem via unambiguous
    DNFs: a total function whose certificate complexity is much larger than its
    unambiguous certificate complexity, sensitivity, degree and spectral
    sensitivity.
  formal: |
    Two stages [BBGJK21]. First a *partial* function
    $\mathrm{Eah}_n\colon\{0,1\}^{O(n^2)}\to\{0,1,*\}$ with
    $\mathrm{C}(\mathrm{Eah}_n)\le\widetilde O(n)$ but a $*$-input $z$ at which
    both one-sided certificate complexities are $\ge\Omega(n^2)$ (this is their
    "Puzzle II", solved by 2-colouring an intersecting hypergraph). Then a
    cheat-sheet-style totalisation: take $k=\log N$ copies of the partial
    function, use their outputs to index one of $2^k$ array cells, and require
    that cell to hold identification numbers of certificates actually present
    in the copies. The result is a total
    $g\colon\{0,1\}^{3N^2\log^2 N}\to\{0,1\}$, $N=O(n^2)$, with
    $\mathrm{C}_0(g)\ge\min\{\mathrm{C}_0(\mathrm{Eah},z),
    \mathrm{C}_1(\mathrm{Eah},z)\}$ and
    $\mathrm{UC}_1(g)\le 3\,\mathrm{C}(\mathrm{Eah})\log^2 N$
    [BBGJK21, Sec. 5.1].
  scale:
    var: n
    note: '$n$ is the $\mathrm{Eah}_n$ parameter; the total function $g$ lives on $\widetilde\Theta(n^4)$ bits.'
  values:
    - {measure: C0, value: '\widetilde\Theta(n^2)', refs: [BBGJK21], note: 'Lower bound $\Omega(n^2)$ at the all-copies-are-$z$ input [BBGJK21, Claim 16]: a cheaper certificate can neither pin down the $\mathrm{Eah}$-values nor touch every array cell. Upper bound from $\mathrm{C}_0\le\mathrm{D}=\widetilde O(n^2)$.'}
    - {measure: UCmin, value: '\widetilde\Theta(n)', refs: [BBGJK21], note: 'Upper: $\mathrm{UC}_{\min}\le\mathrm{UC}_1\le 3\,\mathrm{C}(\mathrm{Eah}_n)\log^2 N=\widetilde O(n)$ [BBGJK21, Claim 17] -- read one certificate per copy plus the whole indexed cell. Lower: $\mathrm{D}\le\mathrm{UC}_{\min}^2$ [BHT17] against $\mathrm{D}=\widetilde\Omega(n^2)$.'}
    - {measure: D,  value: '\widetilde\Theta(n^2)', note: 'Squeeze: $\mathrm{D}\ge\mathrm{C}_0=\widetilde\Omega(n^2)$ and $\mathrm{D}\le\mathrm{UC}_{\min}^2=\widetilde O(n^2)$ [BHT17]. So the quadratic $\mathrm{C}_0$-vs-$\mathrm{UC}_1$ gap is simultaneously a quadratic $\mathrm{D}$-vs-$\mathrm{UC}_{\min}$ gap, and both are optimal up to logs.'}
    - {measure: C,  value: '\widetilde\Theta(n^2)', note: 'Squeeze: $\mathrm{C}\ge\mathrm{C}_0$ and $\mathrm{C}\le\mathrm{D}$.'}
    - {measure: UC, value: '\widetilde\Theta(n^2)', note: 'Squeeze: $\mathrm{C}\le\mathrm{UC}\le\mathrm{D}$.'}
    - {measure: SP, value: '\widetilde\Theta(n^2)', note: 'Squeeze: $\mathrm{C}\le\mathrm{SP}\le\mathrm{D}$.'}
    - {measure: C1, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{C}_1\le\mathrm{UC}_1=\widetilde O(n)$. The recorded $\mathrm{C}_0$ is quadratically larger -- this is the unambiguous-DNF-vs-CNF-width statement of [BBGJK21, Thm 1], matching the folklore $\mathrm{C}_0\le\mathrm{UC}_1^2$.'}
    - {measure: deg, value: '\widetilde O(n)', refs: [BBGJK21], note: 'Summing the indicator polynomials of an unambiguous $1$-DNF represents $g$ exactly, so $\deg\le\mathrm{UC}_1=\widetilde O(n)$; against $\mathrm{C}=\widetilde\Omega(n^2)$ this is [BBGJK21, Cor. 4], improving the classical power-$1.63$ separation of [NW95].'}
    - {measure: s,  value: '\widetilde\Theta(n^{2/3})', refs: [BBGJK21], note: 'The recorded witness is $\mathrm{C}=\widetilde\Omega(\mathrm{s}^3)$ with $\mathrm{C}=\widetilde\Theta(n^2)$, which gives $\mathrm{s}=\widetilde O(n^{2/3})$; and the separation is only *the* recorded $\mathrm{C}$-vs-$\mathrm{s}$ exponent if $\mathrm{s}$ is no smaller, so $\widetilde\Theta$. (The tempting shortcut $\mathrm{C}\le\mathrm{s}\cdot\mathrm{bs}\le\mathrm{s}^3$ is not available: $\mathrm{bs}\le\mathrm{s}^2$ is the *conjecture*; what [Huang19] proves is $\mathrm{bs}\le\mathrm{s}^4$.)'}
    - {measure: bs, value: '\widetilde\Omega(n^{4/3})', putative: true, note: 'From Nisan''s $\mathrm{C}\le\mathrm{s}\cdot\mathrm{bs}$ [Nisan91] with $\mathrm{C}=\widetilde\Theta(n^2)$ and $\mathrm{s}=\widetilde\Theta(n^{2/3})$. No matching upper bound is available: that would need $\mathrm{bs}\le\mathrm{s}^2$, which is open -- [Huang19] gives only $\mathrm{bs}\le\mathrm{s}^4$. The ceiling here is the trivial $\mathrm{bs}\le\mathrm{C}=\widetilde O(n^2)$. If $\mathrm{bs}$ did sit at $\widetilde\Theta(n^{4/3})$ this family would also be an extremal $\mathrm{bs}=\widetilde\Theta(\mathrm{s}^2)$ example.'}
    - {measure: fbs, value: '\widetilde\Omega(n^{4/3})', note: 'Squeeze: $\mathrm{fbs}\ge\mathrm{bs}$. The ceiling is $\mathrm{fbs}\le\mathrm{C}=\widetilde O(n^2)$.'}
    - {measure: FC,  value: '\widetilde\Omega(n^{4/3})', note: 'Squeeze: $\mathrm{FC}=\mathrm{fbs}$ exactly.'}
    - {measure: RC,  value: '\widetilde\Omega(n^{4/3})', note: 'Squeeze: $\mathrm{RC}=\Theta(\mathrm{fbs})$.'}
    - {measure: CA,  value: '\widetilde\Omega(n^{4/3})', refs: [ABIKPS17], note: 'Squeeze: $\mathrm{CA}=\Theta(\mathrm{fbs})$ for total functions.'}
    - {measure: R,   value: '\widetilde\Omega(n^{4/3})', note: 'Squeeze: $\mathrm{R}=\Omega(\mathrm{fbs})$; the ceiling is $\mathrm{R}\le\mathrm{D}=\widetilde\Theta(n^2)$.'}
    - {measure: R0,  value: '\widetilde\Theta(n^2)', note: 'Squeeze: $\mathrm{C}\le\mathrm{R}_0\le\mathrm{D}$ and both ends are $\widetilde\Theta(n^2)$. A zero-error algorithm outputs a certificate, so certificate complexity is a lower bound on $\mathrm{R}_0$ even when it is far above $\mathrm{R}$.'}
    - {measure: RS,  value: '\widetilde\Omega(n^{4/3})', refs: [BenDavidKothari18], note: 'The sabotage inequality runs the other way from what one might expect: $\mathrm{R}_\varepsilon\ge\overline{\mathrm{R}}_\varepsilon\ge(1-2\varepsilon)\mathrm{RS}$ [BenDavidKothari18, Thm 12], so $\mathrm{RS}=O(\mathrm{R})=\widetilde O(n^2)$ is the *ceiling*. The floor is $\mathrm{RS}\ge\mathrm{CG}^{\mathrm{pub}}\ge\mathrm{fbs}=\widetilde\Omega(n^{4/3})$, which happens to coincide with the recorded $\mathrm{R}$ floor.'}
    - {measure: Q,   value: '\widetilde\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{bs}=O(\mathrm{Q}^2)$ [BBCMdW01] with $\mathrm{bs}=\widetilde\Omega(n^{4/3})$. The ceiling is $\mathrm{Q}\le\mathrm{D}=\widetilde O(n^2)$.'}
    - {measure: QC,  value: '\widetilde\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{QC}=\Theta(\sqrt{\mathrm{fbs}})$.'}
    - {measure: adeg, value: '\widetilde O(n^{2/3})', refs: [BBGJK21], note: 'From the recorded witness $\mathrm{C}=\widetilde\Omega(\widetilde{\deg}^3)$ against $\mathrm{C}=\widetilde\Theta(n^2)$. Matched from below by $\widetilde{\deg}=\Omega(\sqrt{\mathrm{bs}})=\widetilde\Omega(n^{2/3})$, so the value is in fact tight.'}
    - {measure: Dna, value: '\widetilde\Omega(n^2)', note: 'Squeeze: $\mathrm{D}^{\mathrm{na}}\ge\mathrm{D}$; the ceiling is the arity $\widetilde\Theta(n^4)$.'}
    - {measure: Rna, value: '\widetilde\Omega(n^{4/3})', note: 'Squeeze: $\mathrm{R}^{\mathrm{na}}\ge\mathrm{R}=\widetilde\Omega(n^{4/3})$.'}
    - {measure: Cmin, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{C}_{\min}\le\mathrm{C}^1\le\mathrm{UC}_1=\widetilde O(n)$ -- every $1$-input is cheap to certify, and the hardness lives entirely on the $0$-side.'}
    - {measure: bs0, value: '\widetilde\Omega(n^{4/3})', putative: true, note: 'Nisan''s refined bound $\mathrm{C}^0\le\mathrm{s}_1\cdot\mathrm{bs}_0$ [Nisan91] with $\mathrm{C}^0=\widetilde\Theta(n^2)$ and $\mathrm{s}_1\le\mathrm{s}=\widetilde\Theta(n^{2/3})$. This pins the large block sensitivity to the $0$-side, matching the fact that $\mathrm{C}^0$ rather than $\mathrm{C}^1$ is what is large.'}
    - {measure: s0, value: '\widetilde O(n^{2/3})', note: 'Squeeze: $\mathrm{s}_0\le\mathrm{s}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: s1, value: '\widetilde O(n^{2/3})', note: 'Squeeze: $\mathrm{s}_1\le\mathrm{s}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: EC, value: '\widetilde\Omega(n^{4/3})', note: 'Squeeze: $\mathrm{EC}\ge\mathrm{fbs}=\widetilde\Omega(n^{4/3})$; the ceiling is $\mathrm{EC}\le\mathrm{C}=\widetilde\Theta(n^2)$. (The alternative route $\mathrm{R}_0=O(\mathrm{EC}^2)$ only gives $\widetilde\Omega(n)$.)'}
    - {measure: CG, value: '\widetilde\Omega(n^2)', note: 'Squeeze: $\mathrm{R}_0=O(\mathrm{CG})$ against $\mathrm{R}_0=\widetilde\Theta(n^2)$; the ceiling is $\mathrm{CG}\le\mathrm{C}^0\mathrm{C}^1=\widetilde O(n^3)$.'}
    - {measure: cbs, value: '\widetilde\Omega(n^{4/3})', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}=\mathrm{bs}=\widetilde\Omega(n^{4/3})$ ([[cbs]] vs [[bs]]).'}
    - {measure: psD, value: '\widetilde\Omega(n^{4/3})', note: 'For a Boolean function the canonical solution is forced to be $f$ itself, so $\mathrm{psD}=\mathrm{R}=\widetilde\Omega(n^{4/3})$.'}
    - {measure: Rbar, value: '\widetilde\Omega(n^{4/3})', note: 'The distributional form of $\mathrm{R}$: $\overline{\mathrm{R}}=\Theta(\mathrm{R})=\widetilde\Omega(n^{4/3})$.'}
    - {measure: Dmu, value: '\widetilde\Omega(n^{4/3})', note: 'Yao''s minimax: $\max_\mu\mathrm{D}^{\mu}=\Theta(\mathrm{R})=\widetilde\Omega(n^{4/3})$.'}
    - {measure: QE, value: '\widetilde\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{Q}_E\ge\mathrm{Q}=\widetilde\Omega(n^{2/3})$; the ceiling is $\mathrm{Q}_E\le\mathrm{D}=\widetilde\Theta(n^2)$.'}
    - {measure: Q0, value: '\widetilde\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_E$.'}
    - {measure: Advpm, value: '\widetilde\Omega(n^{2/3})', refs: [Reichardt11], note: 'Squeeze: $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$.'}
    - {measure: gamma2, value: '\widetilde\Omega(n^{2/3})', refs: [LMRSS11], note: 'Squeeze: the approximate $\gamma_2$ norm is the factorisation-norm form of $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$.'}
    - {measure: MAdv, value: '\widetilde\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{MAdv}=\Theta(\mathrm{Q})$.'}
    - {measure: odeg, value: '\widetilde O(n^{2/3})', note: 'Squeeze: $\widetilde{\deg}_+\le\widetilde{\deg}=\widetilde O(n^{2/3})$, inheriting the caveat on the $\widetilde{\deg}$ line.'}
    - {measure: sdeg, value: '\widetilde O(n^{2/3})', note: 'Squeeze: $\mathrm{sdeg}\le\widetilde{\deg}_+\le\widetilde{\deg}=\widetilde O(n^{2/3})$, inheriting the caveat on the $\widetilde{\deg}$ line.'}
    - {measure: Inf, value: '\widetilde O(n^{2/3})', note: 'Squeeze: $\mathrm{I}(f)\le\mathrm{s}(f)=\widetilde\Theta(n^{2/3})$. Against $\mathrm{C}=\widetilde\Theta(n^2)$ this makes the family a cubic $\mathrm{C}$-vs-$\mathrm{I}$ example, mirroring its record $\mathrm{C}$-vs-$\mathrm{s}$ gap.'}
    - {measure: Inf1, value: '\widetilde O(n^{2/3})', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide coordinate by coordinate, so $\mathrm{I}^{1}=\mathrm{I}=\widetilde O(n^{2/3})$.'}
    - {measure: MaxInf, value: '\widetilde O(n^{2/3})', note: 'A maximum is at most a sum, so $\mathrm{MaxInf}\le\mathrm{I}\le\mathrm{s}=\widetilde\Theta(n^{2/3})$. Against $\mathrm{C}=\widetilde\Theta(n^2)$ this is a cubic $\mathrm{C}$-vs-$\mathrm{MaxInf}$ gap.'}
    - {measure: bs1, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{bs}_1\le\mathrm{C}^1\le\mathrm{UC}_1=\widetilde O(n)$. Read against the recorded $\mathrm{bs}_0=\widetilde\Omega(n^{4/3})$ this makes the block sensitivity of this family genuinely one-sided: all of it lives on the $0$-inputs, exactly like $\mathrm{C}$.'}
    - {measure: R1, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', note: 'Squeeze: $\mathrm{R}\le\mathrm{R}^1\le\mathrm{R}_0$, i.e. between $\widetilde\Omega(n^{4/3})$ and $\widetilde\Theta(n^2)$.'}
    - {measure: chi, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', refs: [Li18], note: 'Floor $\chi=\Omega(\mathrm{bs})=\widetilde\Omega(n^{4/3})$ [Li18] (the alternative $\chi=\Omega(\sqrt{\mathrm{R}})$ only gives $\widetilde\Omega(n^{2/3})$); ceiling $\chi=O(\mathrm{R})=\widetilde O(n^2)$.'}
    - {measure: chibar, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', refs: [GLSS19], note: 'Squeezed along $\mathrm{RS}\lesssim\bar\chi\lesssim\mathrm{LR}\lesssim\mathrm{R}$ [GLSS19] between $\mathrm{RS}=\widetilde\Omega(n^{4/3})$ and $\mathrm{R}=\widetilde O(n^2)$.'}
    - {measure: LR, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', note: 'Squeezed between $\bar\chi=\widetilde\Omega(n^{4/3})$ and $\mathrm{R}=\widetilde O(n^2)$.'}
    - {measure: Rstar, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', note: 'Squeezed between $\mathrm{LR}=\widetilde\Omega(n^{4/3})$ and $\mathrm{R}=\widetilde O(n^2)$; the quantum floor $\mathrm{R}^*=\Omega(\mathrm{Q})=\widetilde\Omega(n^{2/3})$ is weaker.'}
    - {measure: Np, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', refs: [FRPU94], note: 'Squeeze: $\mathrm{R}\le\mathrm{N}_p=O(\mathrm{R}\log\mathrm{R})$, so the noisy model inherits the whole $\mathrm{R}$ range $[\widetilde\Omega(n^{4/3}),\widetilde O(n^2)]$.'}
    - {measure: robustQ, value: '\widetilde\Omega(n^{2/3}),\ \widetilde O(n^2)', refs: [BNRdW05], note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}^{\mathrm{rob}}=O(\mathrm{Q}\log\mathrm{Q})$ [BNRdW05], inheriting the $\mathrm{Q}$ range.'}
    - {measure: CGpub, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', refs: [ABIKPS17], note: 'The public-coin certificate game value collapses to $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})$ for total functions [ABIKPS17], whose recorded range is $[\widetilde\Omega(n^{4/3}),\widetilde O(n^2)]$; independently $\mathrm{CG}^{\mathrm{pub}}\le\mathrm{C}=\widetilde\Theta(n^2)$.'}
    - {measure: CGns, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', refs: [ABIKPS17], note: 'Same collapse: $\mathrm{CG}^{\mathrm{ns}}=\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})$.'}
    - {measure: CGstar, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', refs: [ABIKPS17], note: 'Same collapse: entangled certificate games are $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})$.'}
    - {measure: prt, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', refs: [JainKlauck10], note: 'Floor $\mathrm{prt}_\varepsilon\ge\mathrm{RC}+\log\varepsilon=\widetilde\Omega(n^{4/3})$; ceiling $\mathrm{prt}_\varepsilon\le 2\mathrm{R}_\varepsilon=\widetilde O(n^2)$ [JainKlauck10, Thm 3.1].'}
    - {measure: rprt, value: '\widetilde\Omega(n^{4/3}),\ \widetilde O(n^2)', refs: [JainKlauck10], note: 'The $\mathrm{RC}$ floor survives the relaxation and $\mathrm{rprt}\le\mathrm{prt}$, so the $\mathrm{prt}$ range carries over unchanged.'}
    - {measure: Adv, value: '\widetilde\Omega(n^{2/3}),\ \widetilde O(n^{3/2})', refs: [Ambainis02], note: 'Floor $\mathrm{bs}\le\mathrm{Adv}^2$ [Ambainis02] with $\mathrm{bs}=\widetilde\Omega(n^{4/3})$. Ceiling: the certificate barrier $\mathrm{Adv}\le\sqrt{\mathrm{C}^0\mathrm{C}^1}=\sqrt{\widetilde\Theta(n^2)\cdot\widetilde O(n)}=\widetilde O(n^{3/2})$. The strong asymmetry of the certificate complexities is what makes the barrier bite here.'}
    - {measure: cjdeg, value: '\widetilde\Omega(n^{2/3}),\ \widetilde O(n^2)', note: 'Floor $\mathrm{cjdeg}\ge\widetilde{\deg}=\widetilde\Theta(n^{2/3})$; ceiling $\mathrm{cjdeg}\le\mathrm{D}=\widetilde\Theta(n^2)$, since a depth-$\mathrm{D}$ decision tree is an exact conical junta of width $\mathrm{D}$.'}
    - {measure: rdeg, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{rdeg}=\max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}\le\deg=\widetilde O(n)$. Against $\mathrm{C}=\widetilde\Theta(n^2)$ this inherits the $\mathrm{C}$-vs-$\deg$ quadratic gap.'}
    - {measure: ndeg, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{ndeg}\le\min\{\mathrm{C}^1,\deg\}=\widetilde O(n)$; here the two bounds happen to agree, both coming from $\mathrm{UC}_1$.'}
    - {measure: NQ, value: '\widetilde O(n)', note: 'Squeeze: $\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil=\widetilde O(n)$.'}
    - {measure: ardeg, value: '\widetilde O(n^{2/3})', note: 'Squeeze: $\mathrm{rdeg}_{1/3}\le\min\{\mathrm{rdeg},\widetilde{\deg}\}=\widetilde O(n^{2/3})$.'}
    - {measure: PostQ, value: '\widetilde O(n^{2/3})', refs: [MahadevdeWolf15], note: 'Squeeze: $\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] applied to the $\mathrm{ardeg}$ line. Against $\mathrm{C}=\widetilde\Theta(n^2)$ this is a cubic $\mathrm{C}$-vs-$\mathrm{PostQ}$ gap.'}
    - {measure: deg2, value: '\widetilde O(n)', note: 'The exact multilinear representation over $\mathbb{R}$ has integer coefficients, so reducing mod $2$ gives $\deg_2\le\deg=\widetilde O(n)$.'}
    - {measure: degp, value: '\widetilde O(n)', note: 'Same integrality argument as the $\deg_2$ line, for every prime $p$.'}
    - {measure: D_size, value: '\widetilde\Omega(n^2)', note: 'Squeeze: $\mathrm{D}\le\mathrm{DTsize}-1$ with $\mathrm{D}=\widetilde\Theta(n^2)$. The stronger $\mathrm{DTsize}\ge 2^{\mathrm{rank}}$ route is unavailable: $\mathrm{C}_{\min}=\widetilde O(n)$ is only an upper bound, so $\mathrm{rank}$ has no recorded floor.'}
  witnesses:
    - {of: [C, s],      setting: total, statement: '$\mathrm{C} = \widetilde\Omega(\mathrm{s}^3)$; upper bound $\mathrm{C}\le \mathrm{s}\cdot\mathrm{bs} \le 2\mathrm{s}^5$.', refs: [BBGJK21]}
    - {of: [C, lambda], setting: total, statement: '$\mathrm{C} = \widetilde\Omega(\lambda^4)$; upper bound $\mathrm{C}\le\mathrm{D}=O(\lambda^6)$.', refs: [BBGJK21]}
    - {of: [C, deg],    setting: total, statement: '$\mathrm{C} = \widetilde\Omega(\deg^2)$; upper bound $\mathrm{C}\le\mathrm{D}=O(\deg^3)$.', refs: [BBGJK21]}
    - {of: [C, adeg],   setting: total, statement: '$\mathrm{C} = \widetilde\Omega(\widetilde{\deg}^3)$; upper bound $\mathrm{C}\le\mathrm{D}=O(\widetilde{\deg}^4)$.', refs: [BBGJK21]}
  notes: |
    **Why no $\lambda$ value is recorded.** It is tempting to read
    $\lambda = \widetilde O(\sqrt n)$ off the $\mathrm{C}=\widetilde\Omega(\lambda^4)$
    witness, exactly as the $\widetilde{\deg}$ and $\mathrm{s}$ values are read off
    theirs. But the four separations above are the four cells of the
    $\mathrm{C}$ row of [BBGJK21], and nothing in the statement forces them to be
    witnessed by *one* function. If they were, then $\lambda=\widetilde O(\sqrt n)$
    together with the (solid) $\mathrm{bs}=\widetilde\Omega(n^{4/3})$ below would give
    $\mathrm{bs}=\widetilde\Omega(\lambda^{8/3})$ -- a power $2.67$, comfortably past
    the best known $\mathrm{bs}$-vs-$\lambda$ separation of $\lambda^{2.127}$
    (see [[MeiburgTournament]]). A record that cheap would not have gone unnoticed,
    so the honest reading is that the $\mathrm{C}$-vs-$\mathrm{s}$ and
    $\mathrm{C}$-vs-$\lambda$ cells come from different constructions in the paper,
    and $\lambda$ for *this* function stays blank until the construction is
    transcribed. The same caution applies, more weakly, to reading the
    $\deg$ and $\widetilde{\deg}$ values off their witnesses.
  refs: [BBGJK21]
  see_also: [C, UC, s, BHTfn, MeiburgTournament]
  todo: 'Transcribe the construction from [BBGJK21], and in particular settle which of the four $\mathrm{C}$-row separations are witnessed by the same function.'

- id: GSSfn
  name: Gilmer-Saks-Srinivasan functions
  symbol: 'f_{\mathrm{GSS}}'
  group: separating
  order: 34
  kind: total
  arity: '$n^2$ bits'
  short: 'Separates C from RC quadratically -- with no log loss -- and RC from bs by a $3/2$ power.'
  definition: |
    Two constructions studying the limits of composition for
    $\mathrm{C}$, $\mathrm{RC}$ and $\mathrm{bs}$. Both have the shape
    $\mathrm{OR}_n \circ g$ for a cleverly chosen $n$-variate $g$, exploiting
    the elementary fact that $\mathrm{OR}$-composition multiplies the
    $0$-side of $\mathrm{C}$, $\mathrm{bs}$ and $\mathrm{fbs}$ by $n$ while
    leaving the $1$-side alone.
  formal: |
    For the quadratic separation [GSS16, Thm 32]: pick $N = 2^{n/50}$ points
    $x^1,\dots,x^N \in \{0,1\}^n$ uniformly at random and let $g_n$ be their
    indicator. With high probability the points are at pairwise Hamming
    distance $\ge n/100$, which forces every $0$-input to have at most $200$
    disjoint sensitive blocks ($\mathrm{bs}_0(g_n),\mathrm{fbs}_0(g_n)=O(1)$),
    while sheer density makes every subcube of codimension $n/100$ contain a
    $1$, so $\mathrm{C}_0(g_n)\ge n/100$. Then $f = \mathrm{OR}_n\circ g_n$ on
    $n^2$ bits. By [GSS16, Prop. 31], for $m\in\{\mathrm{C},\mathrm{bs},
    \mathrm{fbs}\}$ one has $m_1(\mathrm{OR}_n\circ g)=m_1(g)$ and
    $m_0(\mathrm{OR}_n\circ g)=n\cdot m_0(g)$.
  scale: {var: n, subs: {N: 'n^2'}}
  values:
    - {measure: C0, value: '\Theta(n^2)', refs: [GSS16], note: 'A random $g_n$ has $\mathrm{C}_0(g_n)=\Theta(n)$, and $\mathrm{OR}$-composition multiplies the $0$-side by $n$ [GSS16, Prop. 31, Claim 34]. No logarithmic loss anywhere.'}
    - {measure: C,  value: '\Theta(n^2)', note: 'Squeeze: $\mathrm{C}\ge\mathrm{C}_0=\Omega(n^2)$ and $\mathrm{C}\le N=n^2$.'}
    - {measure: C1, value: 'n', refs: [GSS16], putative: true, note: 'By [GSS16, Prop. 31] $\mathrm{C}_1(f)=\mathrm{C}_1(g_n)$, and $\mathrm{C}_1(g_n)=n$: the $1$-inputs of $g_n$ are isolated points (pairwise distance $\ge n/100$), so every subcube containing one and no $0$-input is a single point.'}
    - {measure: fbs, value: '\Theta(n)', refs: [GSS16], note: 'Upper: $\mathrm{fbs}(f)\le\max\{n\,\mathrm{fbs}_0(g_n),\mathrm{fbs}_1(g_n)\}=O(n)$, since the pairwise-distance property caps $\mathrm{fbs}_0(g_n)$ at $200$ [GSS16, Thm 32]. Lower: $\mathrm{fbs}\ge\mathrm{bs}\ge\mathrm{bs}_0(f)=n\,\mathrm{bs}_0(g_n)\ge n$.'}
    - {measure: bs, value: '\Theta(n)', note: 'Squeezed between $\mathrm{bs}_0(f)=n\,\mathrm{bs}_0(g_n)\ge n$ and $\mathrm{fbs}=O(n)$.'}
    - {measure: RC, value: '\Theta(n)', note: 'Squeeze: $\mathrm{RC}=\Theta(\mathrm{fbs})$.'}
    - {measure: s,  value: '\Theta(n)', putative: true, note: 'Upper $\mathrm{s}\le\mathrm{bs}=O(n)$. Lower: take a point $y$ at Hamming distance $1$ from some $x^i$, so $\mathrm{s}_y(g_n)=1$, and feed the copy $(y,\dots,y)$ to $\mathrm{OR}_n\circ g_n$; every one of the $n$ blocks is then sensitive, so $\mathrm{s}_0(f)\ge n$.'}
    - {measure: D,  value: '\Theta(n^2)', note: 'Squeeze: $\mathrm{D}\ge\mathrm{C}=\Omega(n^2)$ and $\mathrm{D}\le N=n^2$.'}
    - {measure: Dna, value: 'n^2', note: 'Squeeze: $\mathrm{D}\le\mathrm{Dna}\le N=n^2$.'}
    - {measure: UC, value: '\Theta(n^2)', note: 'Squeeze: $\mathrm{C}\le\mathrm{UC}\le\mathrm{D}$, both $\Theta(n^2)$.'}
    - {measure: SP, value: '\Theta(n^2)', note: 'Squeeze: $\mathrm{C}\le\mathrm{SP}\le\mathrm{D}$.'}
    - {measure: R0, value: '\Theta(n^2)', note: 'Squeeze: $\mathrm{C}\le\mathrm{R}_0\le\mathrm{D}$. A zero-error algorithm''s transcript is a certificate, so the maximal $\mathrm{C}_0$ pins $\mathrm{R}_0$ at the top; the cheap fractional certificate helps only the bounded-error models.'}
    - {measure: CA, value: '\Theta(n)', refs: [ABIKPS17], note: 'Squeeze: $\mathrm{CA}=\Theta(\mathrm{fbs})$ for total functions. Against $\mathrm{C}=\Theta(n^2)$ this is the same quadratic gap the entry is built for, read on the classical adversary bound.'}
    - {measure: FC, value: '\Theta(n)', note: 'Squeeze: $\mathrm{FC}=\mathrm{fbs}$ exactly.'}
    - {measure: QC, value: '\Theta(\sqrt n)', note: 'Squeeze: $\mathrm{QC}=\Theta(\sqrt{\mathrm{fbs}})$.'}
    - {measure: s0, value: '\Theta(n)', note: 'Squeeze: the $\mathrm{s}$ line above exhibits a $0$-input with $n$ sensitive blocks-of-size-one, and $\mathrm{s}_0\le\mathrm{s}=O(n)$.'}
    - {measure: bs0, value: '\Theta(n)', note: 'Squeeze: $\mathrm{s}_0\le\mathrm{bs}_0\le\mathrm{bs}=O(n)$.'}
    - {measure: R,  value: '\Omega(n)', note: 'Squeeze: $\mathrm{R}=\Omega(\mathrm{fbs})=\Omega(n)$; the ceiling is $\mathrm{R}\le\mathrm{D}=O(n^2)$. Unlike $\mathrm{R}_0$, bounded-error randomized complexity is not pinned by $\mathrm{C}$, and [GSS16] do not compute it.'}
    - {measure: Q,  value: '\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{bs}=O(\mathrm{Q}^2)$ [BBCMdW01] with $\mathrm{bs}=\Theta(n)$.'}
    - {measure: lambda, value: 'O(n)', note: 'Squeeze: $\lambda\le\mathrm{s}=O(n)$, with the Huang floor $\lambda\ge\sqrt{\mathrm{s}}=\Omega(\sqrt n)$.'}
    - {measure: deg, value: '\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{D}=O(\deg^3)$ [Midrijanis04] against $\mathrm{D}=\Theta(n^2)$. The inner $g_n$ is a random indicator, so its degree is almost surely full and the true value is presumably $\Theta(n^2)$; only the lower bound is recorded.'}
    - {measure: s1, value: 'n', putative: true, note: 'A $1$-input of $g_n$ is an isolated point, so all $n$ of its bits are sensitive; feeding it to one copy of $\mathrm{OR}_n\circ g_n$ with the other $n-1$ copies at $0$-inputs gives $\mathrm{s}_1(f)\ge n$. The ceiling is $\mathrm{s}_1\le\mathrm{C}^1=n$.'}
    - {measure: bs1, value: 'n', putative: true, note: 'Squeezed between $\mathrm{s}_1=n$ and $\mathrm{C}^1=n$. So the whole $\mathrm{C}$-vs-$\mathrm{bs}$ gap of this family lives on the $0$-side, where $\mathrm{C}^0=\Theta(n^2)$ but $\mathrm{bs}_0=\Theta(n)$.'}
    - {measure: Cmin, value: 'n', putative: true, note: 'Upper: $\mathrm{C}_{\min}\le\mathrm{C}^1=n$. Lower: a $1$-certificate must pin a whole isolated point of some copy ($n$ bits), and a $0$-certificate must force all $n$ copies to $0$ at $\ge n/100$ bits each; so $\mathrm{C}_x\ge n$ for every input.'}
    - {measure: rank, value: '\Omega(n)', note: 'A Delayer who defers on every query survives at least $\mathrm{C}_{\min}$ rounds, so $\mathrm{rank}\ge\mathrm{C}_{\min}=n$; the ceiling is $\mathrm{rank}\le\mathrm{D}=\Theta(n^2)$.'}
    - {measure: UCmin, value: '\Omega(n)', refs: [BHT17], note: 'Squeeze: $\mathrm{D}\le\mathrm{UC}_{\min}^2$ [BHT17] against $\mathrm{D}=\Theta(n^2)$ (equally, $\mathrm{UC}_{\min}\ge\min\{\mathrm{C}^0,\mathrm{C}^1\}=n$). Unlike [[GPWfn]] there is no matching upper bound: the $1$-certificates here are not unambiguous, since several copies can be $1$ at once.'}
    - {measure: EC, value: '\Omega(n)', note: 'Squeeze: $\mathrm{EC}\ge\mathrm{fbs}=\Theta(n)$, with ceiling $\mathrm{EC}\le\mathrm{C}=\Theta(n^2)$. Note $\mathrm{R}_0=O(\mathrm{EC}^2)$ gives the same $\Omega(n)$, so the two routes agree and neither closes the gap.'}
    - {measure: CG, value: '\Omega(n^2)', note: 'Squeeze: $\mathrm{R}_0=O(\mathrm{CG})$ against $\mathrm{R}_0=\Theta(n^2)$.'}
    - {measure: cbs, value: '\Theta(n)', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}=\mathrm{bs}=\Theta(n)$ ([[cbs]] vs [[bs]]).'}
    - {measure: adeg, value: '\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{bs}=O(\widetilde{\deg}^2)$ [NS94] with $\mathrm{bs}=\Theta(n)$.'}
    - {measure: QE, value: '\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{Q}_E\ge\deg/2=\Omega(n^{2/3})$, which beats the route through $\mathrm{Q}$; the ceiling is $\mathrm{Q}_E\le\mathrm{D}=\Theta(n^2)$.'}
    - {measure: Q0, value: '\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_E$.'}
    - {measure: Advpm, value: '\Omega(\sqrt n)', refs: [Reichardt11], note: 'Squeeze: $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$.'}
    - {measure: MAdv, value: '\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{MAdv}=\Theta(\mathrm{Q})$.'}
    - {measure: R1, value: '\Omega(n)', note: 'Squeeze: $\mathrm{R}^1\ge\mathrm{R}=\Omega(n)$; the ceiling is $\mathrm{D}=\Theta(n^2)$.'}
    - {measure: RS, value: '\Omega(n),\ O(n^2)', refs: [BenDavidKothari18], note: 'The sabotage inequality runs $\mathrm{R}_\varepsilon\ge\overline{\mathrm{R}}_\varepsilon\ge(1-2\varepsilon)\mathrm{RS}$ [BenDavidKothari18, Thm 12], so $\mathrm{R}$ is the *ceiling*, $\mathrm{RS}=O(\mathrm{R})=O(n^2)$. The floor is $\mathrm{RS}\ge\mathrm{CG}^{\mathrm{pub}}\ge\mathrm{fbs}=\Theta(n)$, which matches the recorded $\mathrm{R}$ floor.'}
    - {measure: Rna, value: '\Omega(n)', note: 'Squeeze: $\mathrm{R}^{\mathrm{na}}\ge\mathrm{R}=\Omega(n)$; the ceiling is $\mathrm{D}^{\mathrm{na}}=n^2$.'}
    - {measure: psD, value: '\Omega(n)', note: 'For a Boolean function the canonical solution is forced to be $f$ itself, so $\mathrm{psD}=\mathrm{R}=\Omega(n)$.'}
    - {measure: Rbar, value: '\Omega(n)', note: 'The distributional form of $\mathrm{R}$: $\overline{\mathrm{R}}=\Theta(\mathrm{R})=\Omega(n)$.'}
    - {measure: Dmu, value: '\Omega(n)', note: 'Yao''s minimax: $\max_\mu\mathrm{D}^{\mu}=\Theta(\mathrm{R})=\Omega(n)$.'}
    - {measure: Inf, value: '2^{-\Theta(n)}', putative: true, note: 'Direct computation. The inner $g_n$ is the indicator of $2^{n/50}$ isolated points, so $\mathrm{I}(g_n)=2^{-n}\sum_x \mathrm{s}(g_n,x)=2^{-n}\cdot 2n\cdot 2^{n/50}=2n\,2^{-49n/50}$. In $f=\mathrm{OR}_n\circ g_n$ a bit is influential only if it flips its own copy *and* the other $n-1$ copies all evaluate to $0$, an event of probability $1-o(1)$, so $\mathrm{I}(f)=(1\pm o(1))\,n\,\mathrm{I}(g_n)=2^{-\Theta(n)}$. Total influence is therefore exponentially small while $\mathrm{D}=\Theta(n^2)$ -- a reminder that no polynomial bound on $\mathrm{D}$ in terms of $\mathrm{I}$ can exist.'}
    - {measure: Inf1, value: '2^{-\Theta(n)}', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide coordinate by coordinate, so $\mathrm{I}^{1}=\mathrm{I}=2^{-\Theta(n)}$.'}
    - {measure: MaxInf, value: '2^{-\Theta(n)}', note: 'Squeeze: $\mathrm{MaxInf}\le\mathrm{I}=2^{-\Theta(n)}$, and $\mathrm{MaxInf}\ge\mathrm{I}/n^2$, which changes only the constant in the exponent.'}
    - {measure: NS, value: '2^{-\Theta(n)}', note: 'For any constant $\delta$: $\mathrm{NS}_\delta\le\delta\,\mathrm{I}(f)=2^{-\Theta(n)}$.'}
    - {measure: Stab, value: '1-2^{-\Theta(n)}', note: 'For any constant $\rho$: $f$ takes the value $1$ with probability $n\,2^{-49n/50}$, so $\Pr[f(x)\ne f(y)]\le 2\Pr[f=1]=2^{-\Theta(n)}$ for correlated $x,y$, giving $\mathrm{Stab}_\rho=1-2^{-\Theta(n)}$ -- the function is essentially constant in the Fourier-analytic sense despite being maximally hard to query.'}
    - {measure: chi, value: '\Omega(n),\ O(n^2)', refs: [Li18], note: 'Floor $\chi=\Omega(\mathrm{bs})=\Omega(n)$ [Li18]; ceiling $\chi=O(\mathrm{R})=O(n^2)$. The composition-friendly relaxation of $\mathrm{R}$ therefore sees the $\mathrm{bs}$ scale, not the $\mathrm{C}$ scale.'}
    - {measure: chibar, value: '\Omega(n),\ O(n^2)', refs: [GLSS19], note: 'Squeezed along $\mathrm{RS}\lesssim\bar\chi\lesssim\mathrm{LR}\lesssim\mathrm{R}$ [GLSS19] between $\mathrm{RS}=\Omega(n)$ and $\mathrm{R}=O(n^2)$.'}
    - {measure: LR, value: '\Omega(n),\ O(n^2)', note: 'Squeezed between $\bar\chi=\Omega(n)$ and $\mathrm{R}=O(n^2)$.'}
    - {measure: Rstar, value: '\Omega(n),\ O(n^2)', note: 'Squeezed between $\mathrm{LR}=\Omega(n)$ and $\mathrm{R}=O(n^2)$; the quantum floor $\mathrm{R}^*=\Omega(\mathrm{Q})=\Omega(\sqrt n)$ is weaker.'}
    - {measure: Np, value: '\Omega(n)', refs: [FRPU94], note: 'Squeeze: $\mathrm{N}_p\ge\mathrm{R}=\Omega(n)$; the ceiling $O(\mathrm{R}\log\mathrm{R})$ adds only $O(n^2\log n)$, which is above the recorded $\mathrm{R}$ ceiling anyway.'}
    - {measure: robustQ, value: '\Omega(\sqrt n)', refs: [BNRdW05], note: 'Squeeze: $\mathrm{Q}^{\mathrm{rob}}\ge\mathrm{Q}=\Omega(\sqrt n)$ [BNRdW05].'}
    - {measure: CGpub, value: '\Theta(n)', refs: [ABIKPS17], note: 'The public-coin certificate game value collapses to $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\Theta(n)$ for total functions [ABIKPS17]. Against the recorded $\mathrm{CG}=\Omega(n^2)$ this makes the family a quadratic private-coin-vs-public-coin certificate-game separation with no logarithmic loss.'}
    - {measure: CGns, value: '\Theta(n)', refs: [ABIKPS17], note: 'Same collapse: $\mathrm{CG}^{\mathrm{ns}}=\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\Theta(n)$.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [ABIKPS17], note: 'Same collapse: entangled certificate games are $\Theta(\mathrm{CA})=\Theta(n)$.'}
    - {measure: prt, value: '\Omega(n),\ O(n^2)', refs: [JainKlauck10], note: 'Floor $\mathrm{prt}_\varepsilon\ge\mathrm{RC}+\log\varepsilon=\Omega(n)$ (also $\mathrm{prt}_\varepsilon\ge(1-4\varepsilon)\mathrm{CA}+\log\varepsilon$, the same scale); ceiling $\mathrm{prt}_\varepsilon\le 2\mathrm{R}_\varepsilon=O(n^2)$ [JainKlauck10, Thm 3.1]. The zero-error partition bound is a different story: $\mathrm{prt}_0\ge\mathrm{C}=\Omega(n^2)$.'}
    - {measure: rprt, value: '\Omega(n),\ O(n^2)', refs: [JainKlauck10], note: 'The $\mathrm{RC}$ and $\mathrm{CA}$ floors survive the relaxation and $\mathrm{rprt}\le\mathrm{prt}$, so the $\mathrm{prt}$ range carries over.'}
    - {measure: Adv, value: '\Omega(\sqrt n),\ O(n^{3/2})', refs: [Ambainis02], note: 'Floor $\mathrm{bs}\le\mathrm{Adv}^2$ [Ambainis02] with $\mathrm{bs}=\Theta(n)$; ceiling the certificate barrier $\mathrm{Adv}\le\sqrt{\mathrm{C}^0\mathrm{C}^1}=\sqrt{\Theta(n^2)\cdot n}=O(n^{3/2})$.'}
    - {measure: gamma2, value: '\Omega(\sqrt n)', refs: [LMRSS11], note: 'Squeeze: the approximate $\gamma_2$ norm is the factorisation-norm form of $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})=\Omega(\sqrt n)$.'}
    - {measure: D_size, value: '2^{\Omega(n)}', refs: [EhrenfeuchtHaussler89], note: 'A decision tree of rank $r$ has at least $2^r$ leaves, so $\mathrm{DTsize}\ge 2^{\mathrm{rank}}$, and the recorded $\mathrm{rank}=\Omega(n)$ (every input needs an $n$-bit certificate) gives an exponential size lower bound. The ceiling is the trivial $2^{\mathrm{D}}=2^{O(n^2)}$.'}
    - {measure: ndeg, value: 'O(n)', note: 'Squeeze: $\mathrm{ndeg}\le\mathrm{C}^1=n$ -- sum the indicator conjunctions of the $1$-certificates, which are non-negative and cannot cancel. Against $\mathrm{C}=\Theta(n^2)$ this is a clean quadratic gap.'}
    - {measure: NQ, value: 'O(n)', note: 'Squeeze: $\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil=O(n)$.'}
    - {measure: cjdeg, value: '\Omega(\sqrt n),\ O(n^2)', note: 'Floor $\mathrm{cjdeg}\ge\widetilde{\deg}=\Omega(\sqrt n)$; ceiling $\mathrm{cjdeg}\le\mathrm{D}=\Theta(n^2)$, a depth-$\mathrm{D}$ tree being an exact conical junta of width $\mathrm{D}$.'}
  witnesses:
    - {of: [C, RC],  setting: total, statement: '$\mathrm{C} = \Omega(\mathrm{RC}^2)$, matching $\mathrm{C}=O(\mathrm{RC}^2)$. **Settled**, and with no logarithmic loss.', refs: [GSS16]}
    - {of: [C, bs],  setting: total, statement: '$\mathrm{C} = \Omega(\mathrm{bs}^2)$, matching $\mathrm{C} \le \mathrm{s}\cdot\mathrm{bs} \le \mathrm{bs}^2$. **Settled**, and with no logarithmic loss.', refs: [GSS16, Nisan91]}
    - {of: [RC, bs], setting: total, statement: '$\mathrm{RC} = \Omega(\mathrm{bs}^{3/2})$ against the upper bound $\mathrm{RC} = O(\mathrm{bs}^2)$. This comes from the *second* construction, not from the values recorded here.', refs: [GSS16]}
  notes: |
    The recorded values are for the first construction, [GSS16, Thm 32], which
    is the one that settles $\mathrm{C}$ against $\mathrm{RC}$ and against
    $\mathrm{bs}$. Note that it loses no logarithms: the separations really are
    $\Omega(\cdot^2)$, not $\widetilde\Omega(\cdot^2)$, which is unusual in this
    part of the zoo.

    The $\mathrm{RC}$-vs-$\mathrm{bs}$ witness is a different function
    [GSS16, Thm 37], also of the form $\mathrm{OR}_n\circ g$ on $n^2$ bits but
    with $g$ an explicit graph function due to Tal: the variables are the edges
    of $K_s$ with $n=\binom s2$, and $g$ has $\mathrm{bs}_0(g)=O(1)$ but
    $\mathrm{fbs}_0(g)=\Omega(\sqrt n)$, giving $\mathrm{bs}(f)=O(n)$ and
    $\mathrm{fbs}(f)=\Omega(n^{3/2})$. Its numbers are deliberately not merged
    into the table above.

    [GSS16] phrase all of this in terms of *critical exponents*
    $\mathrm{crit}(m_1,m_2)$, the supremum of $\alpha$ such that
    $m_1 = \Omega(m_2^\alpha)$ is achievable; the two theorems give
    $\mathrm{crit}(\mathrm{C},\mathrm{bs}) = \mathrm{crit}(\mathrm{C},\mathrm{fbs}) = 2$
    and $\mathrm{crit}(\mathrm{fbs},\mathrm{bs}) \ge 3/2$.
  refs: [GSS16, KulkarniTal16]
  see_also: [C, RC, bs, fbs, OR]

- id: GPWfn
  name: Goos-Pitassi-Watson partition-number function
  symbol: 'f_{\mathrm{GPW}}'
  group: separating
  order: 35
  kind: total
  arity: '$n$ bits'
  short: 'The query-side function behind "deterministic communication vs partition number"; gives $\mathrm{D}=\widetilde\Omega(\deg^2)$.'
  definition: |
    A total function built to have small subcube-partition complexity but large
    deterministic complexity. Lifting it with a gadget yields the corresponding
    communication separation.
  formal: |
    [GPW18, Thm 5]. The input is a $k\times k$ matrix over the alphabet
    $\Sigma = \{0,1\}\times([k]\times[k]\cup\{\bot\})$: each cell carries a bit
    and an optional pointer to another cell. The function is defined *by* an
    unambiguous decision tree of cost $2k-1$: guess a column, verify that all
    $k$ of its cells carry a $1$, follow the pointer stored in the first cell
    that has one, and check that the pointed-to cell carries a $0$. An
    adversary argument shows every deterministic tree needs $k^2$ cell queries.
    Encoding $\Sigma$ in $\lceil\log|\Sigma|\rceil = \Theta(\log k)$ bits gives
    a Boolean function on $n = \Theta(k^2\log k)$ bits and costs only that same
    logarithmic factor, hence $\mathrm{P}^{dt} \ge \widetilde\Omega(\mathrm{UP}^{dt\,2})$.
  scale:
    var: n
    note: '$n$ is the Boolean input length, $n = \Theta(k^2\log k)$ for the grid parameter $k$.'
  values:
    - {measure: D,  value: '\widetilde\Theta(n)', refs: [GPW18], note: 'The adversary of [GPW18, Sec. 2.1] survives $k^2 = \widetilde\Theta(n)$ cell queries; and $\mathrm{D}\le n$ trivially. So this function is *maximally* hard deterministically, up to logarithms.'}
    - {measure: Dna, value: '\widetilde\Theta(n)', note: 'Squeezed between $\mathrm{D}=\widetilde\Omega(n)$ and the input length $n$.'}
    - {measure: C1, value: '\widetilde O(\sqrt n)', refs: [GPW18], note: 'The unambiguous decision tree above reads $2k-1 = \widetilde O(\sqrt n)$ cells, so $\mathrm{C}_1\le\mathrm{UC}_1\le\widetilde O(\sqrt n)$.'}
    - {measure: deg, value: '\widetilde O(\sqrt n)', refs: [GPW18], note: 'Summing the indicator polynomials of the leaves of an unambiguous decision tree represents the function exactly, so $\deg\le\mathrm{UC}_1=\widetilde O(\sqrt n)$ [GPW18, Sec. 1.3]. Against $\mathrm{D}=\widetilde\Omega(n)$ this is the record $\mathrm{D}=\widetilde\Omega(\deg^2)$.'}
    - {measure: UCmin, value: '\widetilde\Theta(\sqrt n)', note: 'Upper $\mathrm{UC}_{\min}\le\mathrm{UC}_1=\widetilde O(\sqrt n)$; lower from $\mathrm{D}\le\mathrm{UC}_{\min}^2$ [BHT17] against $\mathrm{D}=\widetilde\Omega(n)$. The quadratic $\mathrm{D}$-vs-$\mathrm{UC}_{\min}$ gap is therefore optimal up to logarithms.'}
    - {measure: C0, value: '\widetilde\Theta(n)', putative: true, note: 'Upper: $\mathrm{C}_0\le\mathrm{D}=\widetilde O(n)$. Lower: take the $0$-input in which every matrix bit is $1$ and each column carries its single pointer in its *last* cell. A $0$-certificate must refute all $k$ columns; refuting column $j$ means either pinning its pointer chain (all $k$ cells of the column, since "the first cell that has a pointer" is only determined once the earlier cells are fixed to $\bot$) or ruling out $0$-valued targets globally, which means fixing all $k^2$ matrix bits to $1$. Both cost $\Theta(k^2)$ bits $=\widetilde\Theta(n)$.'}
    - {measure: C,  value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{C}\ge\mathrm{C}_0$ and $\mathrm{C}\le\mathrm{D}$. Note the asymmetry: $\mathrm{C}_1=\widetilde O(\sqrt n)$ but $\mathrm{C}_0$ is maximal.'}
    - {measure: UC, value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{C}\le\mathrm{UC}\le\mathrm{D}$. It is the *one-sided* $\mathrm{UC}_1$ that is small here; the two-sided quantity is maximal, which is exactly why [GPW18] needs the AND-composed variant for the $\mathrm{SP}$ separation.'}
    - {measure: SP, value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{C}\le\mathrm{SP}\le\mathrm{D}$.'}
    - {measure: s,  value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Lower: at a $1$-input with a unique witness column, all $k$ cells of that column are sensitive. Upper: $\mathrm{s}_1\le\mathrm{C}_1=\widetilde O(\sqrt n)$, and at a $0$-input a sensitive bit must single-handedly create a witness column, so it is either the target bit of one of the $k$ columns or one of the $O(\log k)$ pointer bits redirecting a column at an existing $0$, giving $\mathrm{s}_0=O(k\log k)$.'}
    - {measure: bs, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Lower $\mathrm{bs}\ge\mathrm{s}$. Upper: $\mathrm{bs}_1\le\mathrm{C}_1=\widetilde O(\sqrt n)$, and disjoint sensitive blocks at a $0$-input inject into the $k$ columns (two disjoint blocks cannot both complete the same column), so $\mathrm{bs}_0=O(k)$. Against $\mathrm{C}=\widetilde\Theta(n)$ this makes the function an extremal example for $\mathrm{C}=O(\mathrm{bs}^2)$ as well, alongside [[GSSfn]].'}
    - {measure: fbs, value: '\widetilde\Omega(\sqrt n)', note: 'From $\mathrm{C}=O(\mathrm{fbs}^2)$ [Tal13] against $\mathrm{C}=\widetilde\Theta(n)$. The block-injection argument recorded under $\mathrm{bs}$ suggests the matching $\widetilde O(\sqrt n)$, but the fractional relaxation is not covered by it.'}
    - {measure: FC, value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{FC}=\mathrm{fbs}$ exactly.'}
    - {measure: RC, value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{RC}=\Theta(\mathrm{fbs})$.'}
    - {measure: CA, value: '\widetilde\Omega(\sqrt n)', refs: [ABIKPS17], note: 'Squeeze: $\mathrm{CA}=\Theta(\mathrm{fbs})$ for total functions.'}
    - {measure: R,  value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{R}=\Omega(\mathrm{fbs})$. The gap up to $\mathrm{D}=\widetilde\Theta(n)$ is not closed here -- closing it in the other direction is precisely what [[GJPWfn]] was built for.'}
    - {measure: R0, value: '\widetilde\Theta(n)', note: 'Squeeze: $\mathrm{C}\le\mathrm{R}_0\le\mathrm{D}$, and both ends are $\widetilde\Theta(n)$. A zero-error algorithm''s transcript is a certificate, so the maximal $\mathrm{C}_0$ recorded above already pins $\mathrm{R}_0$ at the top even though $\mathrm{R}$ may be far smaller.'}
    - {measure: Q,  value: '\widetilde\Omega(n^{1/4})', note: 'Squeeze: $\mathrm{bs}=O(\mathrm{Q}^2)$ [BBCMdW01] with $\mathrm{bs}=\widetilde\Theta(\sqrt n)$.'}
    - {measure: QC, value: '\widetilde\Omega(n^{1/4})', note: 'Squeeze: $\mathrm{QC}=\Theta(\sqrt{\mathrm{fbs}})$.'}
    - {measure: adeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\widetilde{\deg}\le\deg=\widetilde O(\sqrt n)$.'}
    - {measure: sdeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{sdeg}\le\widetilde{\deg}\le\deg$.'}
    - {measure: lambda, value: '\widetilde O(\sqrt n)', refs: [ABKRT21], note: 'Squeeze: $\lambda=O(\widetilde{\deg})$ [ABKRT21]. Against $\mathrm{D}=\widetilde\Theta(n)$ this is another $\mathrm{D}=\widetilde\Omega(\lambda^2)$ family; the record is still the quartic one from [[pointer]].'}
    - {measure: s1, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Lower: at a $1$-input with a unique witness column all $k=\widetilde\Theta(\sqrt n)$ cells of that column are sensitive. Upper: $\mathrm{s}_1\le\mathrm{C}^1=\widetilde O(\sqrt n)$.'}
    - {measure: s0, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{s}_0\le\mathrm{s}=\widetilde\Theta(\sqrt n)$; the $\mathrm{s}$ line above bounds it directly by $O(k\log k)$.'}
    - {measure: bs1, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Squeezed between $\mathrm{s}_1=\widetilde\Omega(\sqrt n)$ and $\mathrm{C}^1=\widetilde O(\sqrt n)$.'}
    - {measure: bs0, value: '\widetilde O(\sqrt n)', note: 'From the block-injection argument on the $\mathrm{bs}$ line: disjoint sensitive blocks at a $0$-input inject into the $k$ columns, so $\mathrm{bs}_0=O(k)=\widetilde O(\sqrt n)$. Combined with $\mathrm{C}^0=\widetilde\Theta(n)$ this is the extremal $\mathrm{C}^0=\widetilde\Omega(\mathrm{bs}_0^2)$ behaviour.'}
    - {measure: Cmin, value: '\widetilde\Theta(\sqrt n)', putative: true, note: 'Upper: $\mathrm{C}_{\min}\le\mathrm{C}^1=\widetilde O(\sqrt n)$. Lower: a $1$-certificate must exhibit all $k$ cells of a witness column plus the pointer check, so $\mathrm{C}_x=\widetilde\Omega(\sqrt n)$ at every $1$-input, and $0$-inputs cost $\widetilde\Theta(n)$.'}
    - {measure: rank, value: '\widetilde\Omega(\sqrt n)', note: 'A Delayer who defers on every query survives at least $\mathrm{C}_{\min}$ rounds, so $\mathrm{rank}\ge\mathrm{C}_{\min}=\widetilde\Omega(\sqrt n)$; the ceiling is $\mathrm{rank}\le\mathrm{D}=\widetilde\Theta(n)$.'}
    - {measure: EC, value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{EC}\ge\mathrm{fbs}=\widetilde\Omega(\sqrt n)$ (equally, $\mathrm{R}_0=O(\mathrm{EC}^2)$ with $\mathrm{R}_0=\widetilde\Theta(n)$); the ceiling is $\mathrm{EC}\le\mathrm{C}=\widetilde\Theta(n)$.'}
    - {measure: CG, value: '\widetilde\Omega(n)', note: 'Squeeze: $\mathrm{R}_0=O(\mathrm{CG})$ against $\mathrm{R}_0=\widetilde\Theta(n)$.'}
    - {measure: cbs, value: '\widetilde\Theta(\sqrt n)', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}=\mathrm{bs}=\widetilde\Theta(\sqrt n)$ ([[cbs]] vs [[bs]]).'}
    - {measure: odeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\widetilde{\deg}_+\le\widetilde{\deg}=\widetilde O(\sqrt n)$.'}
    - {measure: rdeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{rdeg}\le\deg=\widetilde O(\sqrt n)$ (take the denominator $q\equiv 1$). Against $\mathrm{D}=\widetilde\Theta(n)$ this is a quadratic $\mathrm{D}$-vs-$\mathrm{rdeg}$ gap.'}
    - {measure: QE, value: '\widetilde\Omega(n^{1/4})', note: 'Squeeze: $\mathrm{Q}_E\ge\mathrm{Q}=\widetilde\Omega(n^{1/4})$; the ceiling is $\mathrm{Q}_E\le\mathrm{D}=\widetilde\Theta(n)$.'}
    - {measure: Q0, value: '\widetilde\Omega(n^{1/4})', note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_E$.'}
    - {measure: Advpm, value: '\widetilde\Omega(n^{1/4})', refs: [Reichardt11], note: 'Squeeze: $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$.'}
    - {measure: MAdv, value: '\widetilde\Omega(n^{1/4})', note: 'Squeeze: $\mathrm{MAdv}=\Theta(\mathrm{Q})$.'}
    - {measure: R1, value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{R}^1\ge\mathrm{R}=\widetilde\Omega(\sqrt n)$.'}
    - {measure: RS, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [BenDavidKothari18], note: 'The sabotage inequality runs $\mathrm{R}_\varepsilon\ge\overline{\mathrm{R}}_\varepsilon\ge(1-2\varepsilon)\mathrm{RS}$ [BenDavidKothari18, Thm 12], so $\mathrm{R}$ is the *ceiling*: $\mathrm{RS}=O(\mathrm{R})\le O(\mathrm{D})=\widetilde O(n)$. The floor is $\mathrm{RS}\ge\mathrm{CG}^{\mathrm{pub}}\ge\mathrm{fbs}=\widetilde\Omega(\sqrt n)$.'}
    - {measure: Rna, value: '\widetilde\Omega(\sqrt n)', note: 'Squeeze: $\mathrm{R}^{\mathrm{na}}\ge\mathrm{R}=\widetilde\Omega(\sqrt n)$; the ceiling is $\mathrm{D}^{\mathrm{na}}=\widetilde\Theta(n)$.'}
    - {measure: psD, value: '\widetilde\Omega(\sqrt n)', note: 'For a Boolean function the canonical solution is forced to be $f$ itself, so $\mathrm{psD}=\mathrm{R}=\widetilde\Omega(\sqrt n)$.'}
    - {measure: Rbar, value: '\widetilde\Omega(\sqrt n)', note: 'The distributional form of $\mathrm{R}$: $\overline{\mathrm{R}}=\Theta(\mathrm{R})=\widetilde\Omega(\sqrt n)$.'}
    - {measure: Dmu, value: '\widetilde\Omega(\sqrt n)', note: 'Yao''s minimax: $\max_\mu\mathrm{D}^{\mu}=\Theta(\mathrm{R})=\widetilde\Omega(\sqrt n)$.'}
    - {measure: Inf, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{I}(f)\le\mathrm{s}(f)=\widetilde\Theta(\sqrt n)$ (equally, $\mathrm{I}\le\deg$). Against $\mathrm{D}=\widetilde\Theta(n)$ this gives a quadratic $\mathrm{D}$-vs-$\mathrm{I}$ gap.'}
    - {measure: Inf1, value: '\widetilde O(\sqrt n)', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide coordinate by coordinate, so $\mathrm{I}^{1}=\mathrm{I}=\widetilde O(\sqrt n)$.'}
    - {measure: MaxInf, value: '\widetilde O(\sqrt n)', note: 'A maximum is at most a sum, so $\mathrm{MaxInf}\le\mathrm{I}\le\mathrm{s}=\widetilde\Theta(\sqrt n)$. Against $\mathrm{D}=\widetilde\Theta(n)$ this is a quadratic gap.'}
    - {measure: chi, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [Li18], note: 'Floor $\chi=\Omega(\mathrm{bs})=\widetilde\Omega(\sqrt n)$ [Li18]; ceiling $\chi=O(\mathrm{R})=\widetilde O(n)$.'}
    - {measure: chibar, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [GLSS19], note: 'Squeezed along $\mathrm{RS}\lesssim\bar\chi\lesssim\mathrm{LR}\lesssim\mathrm{R}$ [GLSS19] between $\mathrm{RS}=\widetilde\Omega(\sqrt n)$ and $\mathrm{R}=\widetilde O(n)$.'}
    - {measure: LR, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', note: 'Squeezed between $\bar\chi=\widetilde\Omega(\sqrt n)$ and $\mathrm{R}=\widetilde O(n)$.'}
    - {measure: Rstar, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', note: 'Squeezed between $\mathrm{LR}=\widetilde\Omega(\sqrt n)$ and $\mathrm{R}=\widetilde O(n)$; the quantum floor $\mathrm{R}^*=\Omega(\mathrm{Q})=\widetilde\Omega(n^{1/4})$ is weaker.'}
    - {measure: Np, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [FRPU94], note: 'Squeeze: $\mathrm{R}\le\mathrm{N}_p=O(\mathrm{R}\log\mathrm{R})$, so the noisy model inherits the whole $\mathrm{R}$ range.'}
    - {measure: robustQ, value: '\widetilde\Omega(n^{1/4}),\ \widetilde O(n)', refs: [BNRdW05], note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}^{\mathrm{rob}}=O(\mathrm{Q}\log\mathrm{Q})$ [BNRdW05], inheriting the $\mathrm{Q}$ range $[\widetilde\Omega(n^{1/4}),\widetilde O(n)]$.'}
    - {measure: CGpub, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [ABIKPS17], note: 'The public-coin certificate game value collapses to $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\widetilde\Omega(\sqrt n)$ for total functions [ABIKPS17]; the ceiling is $\mathrm{CG}^{\mathrm{pub}}\le\mathrm{C}=\widetilde\Theta(n)$. Against the recorded $\mathrm{CG}=\widetilde\Omega(n)$ this is where a private-coin/public-coin gap could appear.'}
    - {measure: CGns, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [ABIKPS17], note: 'Same collapse: $\mathrm{CG}^{\mathrm{ns}}=\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})$.'}
    - {measure: CGstar, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [ABIKPS17], note: 'Same collapse: entangled certificate games are $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})$.'}
    - {measure: prt, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [JainKlauck10], note: 'Floor $\mathrm{prt}_\varepsilon\ge\mathrm{RC}+\log\varepsilon=\widetilde\Omega(\sqrt n)$; ceiling $\mathrm{prt}_\varepsilon\le 2\mathrm{R}_\varepsilon=\widetilde O(n)$ [JainKlauck10, Thm 3.1]. At zero error the story is different: $\mathrm{prt}_0\ge\mathrm{C}=\widetilde\Theta(n)$.'}
    - {measure: rprt, value: '\widetilde\Omega(\sqrt n),\ \widetilde O(n)', refs: [JainKlauck10], note: 'The $\mathrm{RC}$ floor survives the relaxation and $\mathrm{rprt}\le\mathrm{prt}$, so the $\mathrm{prt}$ range carries over.'}
    - {measure: Adv, value: '\widetilde\Omega(n^{1/4}),\ \widetilde O(n^{3/4})', refs: [Ambainis02], note: 'Floor $\mathrm{bs}\le\mathrm{Adv}^2$ [Ambainis02] with $\mathrm{bs}=\widetilde\Theta(\sqrt n)$; ceiling the certificate barrier $\mathrm{Adv}\le\sqrt{\mathrm{C}^0\mathrm{C}^1}=\sqrt{\widetilde\Theta(n)\cdot\widetilde O(\sqrt n)}=\widetilde O(n^{3/4})$.'}
    - {measure: gamma2, value: '\widetilde\Omega(n^{1/4})', refs: [LMRSS11], note: 'Squeeze: the approximate $\gamma_2$ norm is the factorisation-norm form of $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})=\widetilde\Omega(n^{1/4})$.'}
    - {measure: D_size, value: '2^{\widetilde\Omega(\sqrt n)}', refs: [EhrenfeuchtHaussler89], note: 'A decision tree of rank $r$ has at least $2^r$ leaves, so $\mathrm{DTsize}\ge 2^{\mathrm{rank}}$ and the recorded $\mathrm{rank}=\widetilde\Omega(\sqrt n)$ gives an exponential size floor. The ceiling is the trivial $2^{\mathrm{D}}=2^{\widetilde O(n)}$.'}
    - {measure: ndeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{ndeg}\le\min\{\mathrm{C}^1,\deg\}=\widetilde O(\sqrt n)$; both bounds trace back to the same unambiguous $1$-certificates.'}
    - {measure: NQ, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil=\widetilde O(\sqrt n)$.'}
    - {measure: ardeg, value: '\widetilde O(\sqrt n)', note: 'Squeeze: $\mathrm{rdeg}_{1/3}\le\min\{\mathrm{rdeg},\widetilde{\deg}\}=\widetilde O(\sqrt n)$.'}
    - {measure: PostQ, value: '\widetilde O(\sqrt n)', refs: [MahadevdeWolf15], note: 'Squeeze: $\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] applied to the $\mathrm{ardeg}$ line, giving a quadratic $\mathrm{D}$-vs-$\mathrm{PostQ}$ gap.'}
    - {measure: cjdeg, value: '\widetilde\Omega(n^{1/4}),\ \widetilde O(n)', note: 'Floor $\mathrm{cjdeg}\ge\widetilde{\deg}\ge\Omega(\sqrt{\mathrm{bs}})=\widetilde\Omega(n^{1/4})$; ceiling $\mathrm{cjdeg}\le\mathrm{D}=\widetilde\Theta(n)$.'}
    - {measure: deg2, value: '\widetilde O(\sqrt n)', note: 'The exact multilinear representation over $\mathbb{R}$ has integer coefficients, so reducing mod $2$ gives $\deg_2\le\deg=\widetilde O(\sqrt n)$.'}
    - {measure: degp, value: '\widetilde O(\sqrt n)', note: 'Same integrality argument as the $\deg_2$ line, for every prime $p$.'}
  witnesses:
    - {of: [D, deg], setting: total, statement: '$\mathrm{D} = \widetilde\Omega(\deg^2)$; upper bound $\mathrm{D}=O(\deg^3)$ [Midrijanis04]. Cell still **open** in $[2,3]$.', refs: [GPW18, Midrijanis04]}
    - {of: [D, SP],  setting: total, statement: '$\mathrm{D} = \widetilde\Omega(\mathrm{SP}^{1.5})$, from the AND-composed variant of [GPW18, Thm 4]; upper bound $\mathrm{D} = O(\mathrm{SP}^2)$, so the cell is **open** in $[1.5,2]$.', refs: [GPW18, KRS15]}
  notes: |
    Two functions live here. The values above are for the [GPW18, Thm 5]
    function, whose gap is against the **one-sided** unambiguous width
    $\mathrm{UC}_1$ (their $\mathrm{UP}^{dt}$). That one-sided quantity does
    *not* upper bound $\mathrm{SP}$, since an unambiguous DNF partitions only
    the $1$-inputs.

    For the two-sided quantity one needs [GPW18, Thm 4]: with $g$ the function
    above and $q := \mathrm{UC}_1(g)$, the composition
    $f := \mathrm{AND}_q\circ g$ satisfies $\mathrm{UC}(f)=\widetilde O(q^2)$
    (certify the $q$ copies one-sidedly and pay $\mathrm{D}(g)$ on the single
    exceptional copy) while $\mathrm{D}$ multiplies to $\widetilde\Omega(q^3)$.
    Since $\mathrm{SP}\le\mathrm{UC}$, this gives
    $\mathrm{D}=\widetilde\Omega(\mathrm{SP}^{1.5})$, matching the earlier
    bound of [KRS15]. It is the *communication* versions that reach the
    quadratic gap against the partition number [GPW18, Thm 2].
  refs: [GPW18, KRS15]
  see_also: [SP, UC, UCmin, deg, GJPWfn]

- id: GJPWfn
  name: Goos-Jayram-Pitassi-Watson function
  symbol: 'f_{\mathrm{GJPW}}'
  group: separating
  order: 36
  kind: total
  arity: '$n$ bits'
  short: 'Randomized analogue of GPW: $\mathrm{R}_0, \mathrm{R} = \widetilde\Omega(\deg^2)$.'
  definition: 'The randomized-communication-vs-partition-number construction, read as a query-complexity function.'
  formal: |
    Tribes-List, $\mathrm{TL}$ [GJPW18, Sec. 3.1]. The input is a $k\times k$
    matrix over $\Sigma = \{0,1\}\times([k]^{k-1}\cup\{\bot\})$: each cell
    carries a bit $m_{ij}$ and either $\bot$ or a *list* of $k-1$ row indices,
    one for every other column. Encoding a cell takes $\Theta(k\log k)$ bits,
    so $n = \Theta(k^3\log k)$. Again the function is defined by an
    unambiguous decision tree, of cost $\Theta(k\log k)$: guess a column $j$,
    check that all $k$ of its bits are $1$ and that some cell holds a list,
    read that list in full, and check that each of the $k-1$ cells it points to
    carries a $0$. So $\mathrm{TL}$ is the "unique all-$1$ column, certified
    against all others" function, and $\mathrm{UP}^{dt}(\mathrm{TL}) =
    \Theta(k\log k)$.
  scale:
    var: n
    note: '$n$ is the Boolean input length, $n = \Theta(k^3\log k)$ for the matrix parameter $k$.'
  values:
    - {measure: R,  value: '\widetilde\Theta(n^{2/3})', refs: [GJPW18], note: 'Lower bound $\widetilde\Omega(k^2)=\widetilde\Omega(n^{2/3})$: [GJPW18, Lem. 8] proves it even against the weaker one-sided-approximate model, $\mathrm{coWAPP}^{dt}_{0.05}(\mathrm{TL})\ge\widetilde\Omega(\mathrm{UP}^{dt}(\mathrm{TL})^2)$. Upper bound from $\mathrm{R}\le\mathrm{D}=\widetilde O(n^{2/3})$.'}
    - {measure: R0, value: '\widetilde\Theta(n^{2/3})', note: 'Squeezed between $\mathrm{R}$ and $\mathrm{D}$, both $\widetilde\Theta(n^{2/3})$.'}
    - {measure: D,  value: '\widetilde\Theta(n^{2/3})', note: 'Squeeze: $\mathrm{D}\ge\mathrm{R}=\widetilde\Omega(n^{2/3})$ and $\mathrm{D}\le\mathrm{UC}_{\min}^2=\widetilde O(n^{2/3})$ [BHT17].'}
    - {measure: C1, value: '\widetilde O(n^{1/3})', refs: [GJPW18], note: 'The unambiguous decision tree costs $\Theta(k\log k)=\widetilde O(n^{1/3})$, so $\mathrm{C}_1\le\mathrm{UC}_1=\widetilde O(n^{1/3})$.'}
    - {measure: deg, value: '\widetilde O(n^{1/3})', refs: [GJPW18], note: 'Sum the leaf indicators of the unambiguous decision tree: $\deg\le\mathrm{UC}_1=\widetilde O(n^{1/3})$. Against $\mathrm{R}=\widetilde\Omega(n^{2/3})$ this is the recorded $\mathrm{R}=\widetilde\Omega(\deg^2)$.'}
    - {measure: UCmin, value: '\widetilde\Theta(n^{1/3})', note: 'Upper $\mathrm{UC}_{\min}\le\mathrm{UC}_1=\widetilde O(n^{1/3})$; lower from $\mathrm{D}\le\mathrm{UC}_{\min}^2$ [BHT17] against $\mathrm{D}=\widetilde\Omega(n^{2/3})$.'}
    - {measure: C0, value: '\widetilde\Theta(n^{2/3})', putative: true, note: 'Upper: $\mathrm{C}_0\le\mathrm{D}=\widetilde O(n^{2/3})$. Lower: take a $0$-input with exactly one all-$1$ column $c$, whose list sits in the *last* cell of $c$ and has at least one target carrying $1$. Every other column is refuted by a single $0$ bit, but refuting $c$ itself forces the certificate to pin the whole column -- the $k-1$ earlier pointer fields as $\bot$ plus the list itself, $\Theta(k^2\log k)=\widetilde\Theta(n^{2/3})$ bits. Fixing another column entirely to $1$ (the cheap $\Theta(k)$-bit block that works for all other columns) is not available, since no other column is all-$1$ in this input.'}
    - {measure: C,  value: '\widetilde\Theta(n^{2/3})', note: 'Squeeze: $\mathrm{C}\ge\mathrm{C}_0$ and $\mathrm{C}\le\mathrm{D}$. As in [[GPWfn]] the asymmetry is total: $\mathrm{C}_1=\widetilde O(n^{1/3})$ against a maximal $\mathrm{C}_0$.'}
    - {measure: UC, value: '\widetilde\Theta(n^{2/3})', note: 'Squeeze: $\mathrm{C}\le\mathrm{UC}\le\mathrm{D}$.'}
    - {measure: SP, value: '\widetilde\Theta(n^{2/3})', note: 'Squeeze: $\mathrm{C}\le\mathrm{SP}\le\mathrm{D}$. So the *two-sided* partition number is maximal here, which is why the $\mathrm{R}$-vs-$\mathrm{SP}$ witness has to be the AND-composed variant.'}
    - {measure: s,  value: '\widetilde\Theta(n^{1/3})', putative: true, note: 'Lower: at a $1$-input with a unique witness column, all $k$ bits of that column are sensitive. Upper: $\mathrm{s}_1\le\mathrm{C}_1=\widetilde O(n^{1/3})$; at a $0$-input a single flip must create a witness column, and per column only the unique missing $1$, the unique non-zero target, or the $O(\log k)$ bits of the list entry addressing it can do that, so $\mathrm{s}_0=O(k\log k)$.'}
    - {measure: bs, value: '\widetilde\Theta(n^{1/3})', putative: true, note: 'Lower $\mathrm{bs}\ge\mathrm{s}$. Upper: $\mathrm{bs}_1\le\mathrm{C}_1$, and disjoint sensitive blocks at a $0$-input inject into the $k$ columns. Together with $\mathrm{C}=\widetilde\Theta(n^{2/3})$ this makes $\mathrm{C}=\widetilde\Theta(\mathrm{s}\cdot\mathrm{bs})$, i.e. Nisan''s bound is tight on this family.'}
    - {measure: fbs, value: '\widetilde\Omega(n^{1/3})', note: 'From $\mathrm{C}=O(\mathrm{fbs}^2)$ [Tal13] against $\mathrm{C}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: FC, value: '\widetilde\Omega(n^{1/3})', note: 'Squeeze: $\mathrm{FC}=\mathrm{fbs}$ exactly.'}
    - {measure: RC, value: '\widetilde\Omega(n^{1/3})', note: 'Squeeze: $\mathrm{RC}=\Theta(\mathrm{fbs})$.'}
    - {measure: CA, value: '\widetilde\Omega(n^{1/3})', refs: [ABIKPS17], note: 'Squeeze: $\mathrm{CA}=\Theta(\mathrm{fbs})$ for total functions.'}
    - {measure: RS, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', refs: [BenDavidKothari18], note: 'The sabotage inequality is $\mathrm{R}_\varepsilon\ge\overline{\mathrm{R}}_\varepsilon\ge(1-2\varepsilon)\mathrm{RS}$ [BenDavidKothari18, Thm 12], so $\mathrm{R}=\widetilde\Theta(n^{2/3})$ is only the *ceiling*. The floor is $\mathrm{RS}\ge\mathrm{CG}^{\mathrm{pub}}\ge\mathrm{fbs}=\widetilde\Omega(n^{1/3})$; the alternative $\mathrm{R}=O(\mathrm{RS}^2\log\mathrm{RS})$ [Thm 32] gives the same $\widetilde\Omega(n^{1/3})$. Since no total function with $\mathrm{RS}=o(\mathrm{R})$ is known the truth is presumably $\widetilde\Theta(n^{2/3})$, but that is not a theorem.'}
    - {measure: R1, value: '\widetilde\Theta(n^{2/3})', note: 'Squeeze: $\mathrm{R}\le\mathrm{R}^1\le\mathrm{D}$.'}
    - {measure: Dmu, value: '\widetilde\Theta(n^{2/3})', note: 'Maximised over input distributions: Yao''s minimax gives $\max_\mu \mathrm{D}^{\mu}=\Theta(\mathrm{R})$.'}
    - {measure: Dna, value: '\widetilde\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{D}^{\mathrm{na}}\ge\mathrm{D}$.'}
    - {measure: Q,  value: '\widetilde\Omega(n^{1/6})', note: 'Squeeze: $\mathrm{bs}=O(\mathrm{Q}^2)$ [BBCMdW01] with $\mathrm{bs}=\widetilde\Theta(n^{1/3})$; the ceiling is $\mathrm{Q}\le\mathrm{R}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: QC, value: '\widetilde\Omega(n^{1/6})', note: 'Squeeze: $\mathrm{QC}=\Theta(\sqrt{\mathrm{fbs}})$.'}
    - {measure: adeg, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\widetilde{\deg}\le\deg=\widetilde O(n^{1/3})$. Against $\mathrm{R}=\widetilde\Theta(n^{2/3})$ this is also $\mathrm{R}=\widetilde\Omega(\widetilde{\deg}^2)$.'}
    - {measure: sdeg, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\mathrm{sdeg}\le\widetilde{\deg}\le\deg$.'}
    - {measure: lambda, value: '\widetilde O(n^{1/3})', refs: [ABKRT21], note: 'Squeeze: $\lambda=O(\widetilde{\deg})$ [ABKRT21].'}
    - {measure: s1, value: '\widetilde\Theta(n^{1/3})', putative: true, note: 'Lower: at a $1$-input with a unique witness column all $k=\widetilde\Theta(n^{1/3})$ bits of that column are sensitive. Upper: $\mathrm{s}_1\le\mathrm{C}^1=\widetilde O(n^{1/3})$.'}
    - {measure: s0, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\mathrm{s}_0\le\mathrm{s}=\widetilde\Theta(n^{1/3})$; the $\mathrm{s}$ line bounds it directly by $O(k\log k)$.'}
    - {measure: bs1, value: '\widetilde\Theta(n^{1/3})', putative: true, note: 'Squeezed between $\mathrm{s}_1=\widetilde\Omega(n^{1/3})$ and $\mathrm{C}^1=\widetilde O(n^{1/3})$.'}
    - {measure: bs0, value: '\widetilde O(n^{1/3})', note: 'From the block-injection argument on the $\mathrm{bs}$ line: disjoint sensitive blocks at a $0$-input inject into the $k$ columns, so $\mathrm{bs}_0=O(k)$. Against $\mathrm{C}^0=\widetilde\Theta(n^{2/3})$ the $0$-side alone already realises the quadratic $\mathrm{C}$-vs-$\mathrm{bs}$ gap.'}
    - {measure: Cmin, value: '\widetilde\Theta(n^{1/3})', putative: true, note: 'Upper: $\mathrm{C}_{\min}\le\mathrm{C}^1=\widetilde O(n^{1/3})$. Lower: certifying a $1$ requires the whole witness column and its list, $\widetilde\Omega(n^{1/3})$ bits, and every $0$-input costs at least that much too.'}
    - {measure: rank, value: '\widetilde\Omega(n^{1/3})', note: 'A Delayer who defers on every query survives at least $\mathrm{C}_{\min}$ rounds, so $\mathrm{rank}\ge\mathrm{C}_{\min}=\widetilde\Omega(n^{1/3})$; the ceiling is $\mathrm{rank}\le\mathrm{D}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: EC, value: '\widetilde\Omega(n^{1/3})', note: 'Squeeze: $\mathrm{EC}\ge\mathrm{fbs}=\widetilde\Omega(n^{1/3})$; the ceiling is $\mathrm{EC}\le\mathrm{C}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: CG, value: '\widetilde\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{R}_0=O(\mathrm{CG})$ against $\mathrm{R}_0=\widetilde\Theta(n^{2/3})$.'}
    - {measure: cbs, value: '\widetilde\Theta(n^{1/3})', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}=\mathrm{bs}=\widetilde\Theta(n^{1/3})$ ([[cbs]] vs [[bs]]).'}
    - {measure: odeg, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\widetilde{\deg}_+\le\widetilde{\deg}=\widetilde O(n^{1/3})$.'}
    - {measure: rdeg, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\mathrm{rdeg}\le\deg=\widetilde O(n^{1/3})$ (take the denominator $q\equiv 1$). Against $\mathrm{R}=\widetilde\Theta(n^{2/3})$ this is a quadratic $\mathrm{R}$-vs-$\mathrm{rdeg}$ gap.'}
    - {measure: QE, value: '\widetilde\Omega(n^{1/6})', note: 'Squeeze: $\mathrm{Q}_E\ge\mathrm{Q}=\widetilde\Omega(n^{1/6})$; the ceiling is $\mathrm{Q}_E\le\mathrm{D}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: Q0, value: '\widetilde\Omega(n^{1/6})', note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_E$.'}
    - {measure: Advpm, value: '\widetilde\Omega(n^{1/6})', refs: [Reichardt11], note: 'Squeeze: $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$.'}
    - {measure: MAdv, value: '\widetilde\Omega(n^{1/6})', note: 'Squeeze: $\mathrm{MAdv}=\Theta(\mathrm{Q})$.'}
    - {measure: Rna, value: '\widetilde\Omega(n^{2/3})', note: 'Squeeze: $\mathrm{R}^{\mathrm{na}}\ge\mathrm{R}=\widetilde\Omega(n^{2/3})$.'}
    - {measure: psD, value: '\widetilde\Theta(n^{2/3})', note: 'For a Boolean function the canonical solution is forced to be $f$ itself, so $\mathrm{psD}=\mathrm{R}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: Rbar, value: '\widetilde\Theta(n^{2/3})', note: 'The distributional form of $\mathrm{R}$: $\overline{\mathrm{R}}=\Theta(\mathrm{R})=\widetilde\Theta(n^{2/3})$.'}
    - {measure: Inf, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\mathrm{I}(f)\le\mathrm{s}(f)=\widetilde\Theta(n^{1/3})$ (equally, $\mathrm{I}\le\deg$). Against $\mathrm{R}=\widetilde\Theta(n^{2/3})$ this is a quadratic $\mathrm{R}$-vs-$\mathrm{I}$ gap.'}
    - {measure: Inf1, value: '\widetilde O(n^{1/3})', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide coordinate by coordinate, so $\mathrm{I}^{1}=\mathrm{I}=\widetilde O(n^{1/3})$.'}
    - {measure: MaxInf, value: '\widetilde O(n^{1/3})', note: 'A maximum is at most a sum, so $\mathrm{MaxInf}\le\mathrm{I}\le\mathrm{s}=\widetilde\Theta(n^{1/3})$; against $\mathrm{R}=\widetilde\Theta(n^{2/3})$ this is a quadratic gap.'}
    - {measure: chi, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', refs: [Li18, Sanyal18], note: 'Two floors that agree: $\chi=\Omega(\mathrm{bs})=\widetilde\Omega(n^{1/3})$ [Li18] and $\mathrm{R}=O(\chi^2)$ [Sanyal18] with $\mathrm{R}=\widetilde\Theta(n^{2/3})$. Ceiling $\chi=O(\mathrm{R})=\widetilde O(n^{2/3})$.'}
    - {measure: chibar, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', refs: [GLSS19], note: 'Squeezed along $\mathrm{RS}\lesssim\bar\chi\lesssim\mathrm{LR}\lesssim\mathrm{R}$ [GLSS19]; equivalently $\bar\chi=\Omega(\sqrt{\mathrm{R}})=\widetilde\Omega(n^{1/3})$.'}
    - {measure: LR, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', note: 'Squeezed between $\bar\chi$ and $\mathrm{R}$; the direct floor $\mathrm{LR}=\Omega(\sqrt{\mathrm{R}})$ gives the same $\widetilde\Omega(n^{1/3})$.'}
    - {measure: Rstar, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', note: 'Squeezed between $\mathrm{LR}=\widetilde\Omega(n^{1/3})$ and $\mathrm{R}=\widetilde\Theta(n^{2/3})$; the quantum floor $\mathrm{R}^*=\Omega(\mathrm{Q})=\widetilde\Omega(n^{1/6})$ is weaker.'}
    - {measure: Np, value: '\widetilde\Theta(n^{2/3})', refs: [FRPU94], note: 'Squeeze: $\mathrm{R}\le\mathrm{N}_p=O(\mathrm{R}\log\mathrm{R})$ with $\mathrm{R}=\widetilde\Theta(n^{2/3})$ pinned; the noise overhead vanishes into the tilde.'}
    - {measure: robustQ, value: '\widetilde\Omega(n^{1/6}),\ \widetilde O(n^{2/3})', refs: [BNRdW05], note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}^{\mathrm{rob}}=O(\mathrm{Q}\log\mathrm{Q})$ [BNRdW05], inheriting the $\mathrm{Q}$ range.'}
    - {measure: CGpub, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', refs: [ABIKPS17], note: 'The public-coin certificate game value collapses to $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})=\widetilde\Omega(n^{1/3})$ for total functions [ABIKPS17]; the ceiling is $\mathrm{CG}^{\mathrm{pub}}\le\mathrm{C}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: CGns, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', refs: [ABIKPS17], note: 'Same collapse: $\mathrm{CG}^{\mathrm{ns}}=\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})$.'}
    - {measure: CGstar, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', refs: [ABIKPS17], note: 'Same collapse: entangled certificate games are $\Theta(\mathrm{CA})=\Theta(\mathrm{fbs})$.'}
    - {measure: prt, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', refs: [JainKlauck10], note: 'Floor $\mathrm{prt}_\varepsilon\ge\mathrm{RC}+\log\varepsilon=\widetilde\Omega(n^{1/3})$; ceiling $\mathrm{prt}_\varepsilon\le 2\mathrm{R}_\varepsilon=\widetilde O(n^{2/3})$ [JainKlauck10, Thm 3.1]. Since $\mathrm{D}=O(\mathrm{prt}_{1/3}^3)$ also gives only $\widetilde\Omega(n^{2/9})$, the cell stays a genuine quadratic gap.'}
    - {measure: rprt, value: '\widetilde\Omega(n^{1/3}),\ \widetilde O(n^{2/3})', refs: [JainKlauck10], note: 'The $\mathrm{RC}$ floor survives the relaxation and $\mathrm{rprt}\le\mathrm{prt}$, so the $\mathrm{prt}$ range carries over.'}
    - {measure: Adv, value: '\widetilde\Omega(n^{1/6}),\ \widetilde O(\sqrt n)', refs: [Ambainis02], note: 'Floor $\mathrm{bs}\le\mathrm{Adv}^2$ [Ambainis02] with $\mathrm{bs}=\widetilde\Theta(n^{1/3})$; ceiling the certificate barrier $\mathrm{Adv}\le\sqrt{\mathrm{C}^0\mathrm{C}^1}=\sqrt{\widetilde\Theta(n^{2/3})\cdot\widetilde O(n^{1/3})}=\widetilde O(\sqrt n)$.'}
    - {measure: gamma2, value: '\widetilde\Omega(n^{1/6})', refs: [LMRSS11], note: 'Squeeze: the approximate $\gamma_2$ norm is the factorisation-norm form of $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})=\widetilde\Omega(n^{1/6})$.'}
    - {measure: D_size, value: '2^{\widetilde\Omega(n^{1/3})}', refs: [EhrenfeuchtHaussler89], note: 'A decision tree of rank $r$ has at least $2^r$ leaves, so $\mathrm{DTsize}\ge 2^{\mathrm{rank}}$ and the recorded $\mathrm{rank}=\widetilde\Omega(n^{1/3})$ gives an exponential size floor. The ceiling is the trivial $2^{\mathrm{D}}=2^{\widetilde O(n^{2/3})}$.'}
    - {measure: ndeg, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\mathrm{ndeg}\le\min\{\mathrm{C}^1,\deg\}=\widetilde O(n^{1/3})$, both bounds coming from the unambiguous $1$-certificates.'}
    - {measure: NQ, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil=\widetilde O(n^{1/3})$.'}
    - {measure: ardeg, value: '\widetilde O(n^{1/3})', note: 'Squeeze: $\mathrm{rdeg}_{1/3}\le\min\{\mathrm{rdeg},\widetilde{\deg}\}=\widetilde O(n^{1/3})$.'}
    - {measure: PostQ, value: '\widetilde O(n^{1/3})', refs: [MahadevdeWolf15], note: 'Squeeze: $\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] applied to the $\mathrm{ardeg}$ line; against $\mathrm{R}=\widetilde\Theta(n^{2/3})$ this is a quadratic $\mathrm{R}$-vs-$\mathrm{PostQ}$ gap.'}
    - {measure: cjdeg, value: '\widetilde\Omega(n^{1/6}),\ \widetilde O(n^{2/3})', note: 'Floor $\mathrm{cjdeg}\ge\widetilde{\deg}\ge\Omega(\sqrt{\mathrm{bs}})=\widetilde\Omega(n^{1/6})$; ceiling $\mathrm{cjdeg}\le\mathrm{D}=\widetilde\Theta(n^{2/3})$.'}
    - {measure: deg2, value: '\widetilde O(n^{1/3})', note: 'The exact multilinear representation over $\mathbb{R}$ has integer coefficients, so reducing mod $2$ gives $\deg_2\le\deg=\widetilde O(n^{1/3})$.'}
    - {measure: degp, value: '\widetilde O(n^{1/3})', note: 'Same integrality argument as the $\deg_2$ line, for every prime $p$.'}
  witnesses:
    - {of: [R0, deg], setting: total, statement: '$\mathrm{R}_0 = \widetilde\Omega(\deg^2)$ against $\mathrm{R}_0 = O(\deg^3)$.', refs: [GJPW18]}
    - {of: [R, deg],  setting: total, statement: '$\mathrm{R} = \widetilde\Omega(\deg^2)$ against $\mathrm{R} = O(\deg^3)$.', refs: [GJPW18]}
    - {of: [R, SP],   setting: total, statement: '$\mathrm{R} = \widetilde\Omega(\mathrm{SP}^{1.5})$, from the AND-composed variant $\mathrm{AND}_q\circ\mathrm{TL}^q$ with $q = \mathrm{UC}_1(\mathrm{TL})$ [GJPW18, Lem. 9]; not from the values recorded here.', refs: [GJPW18]}
  notes: |
    $\mathrm{TL}$ is [[GPWfn]] made randomized-hard: replacing the GPW single
    pointer by a full list of $k-1$ pointers means that a randomized algorithm
    which has *guessed* the right column still cannot cheaply refute the other
    columns, which is what [GJPW18, Lem. 8] exploits. The price is a cell of
    $\Theta(k\log k)$ bits instead of $\Theta(\log k)$, which is why the
    exponents here read $2/3$ and $1/3$ in the input length rather than
    $1$ and $1/2$.

    The $\mathrm{R}$-vs-$\mathrm{SP}$ witness is the AND-composed function
    $\mathrm{AND}_q\circ\mathrm{TL}^q$, a different function, so its numbers
    are not merged into the table above.
  refs: [GJPW18]
  see_also: [GPWfn, deg, R0, UCmin]

- id: Ambainis13fn
  name: Ambainis' exact-quantum function
  symbol: '\mathrm{NE}^d'
  aliases: ['iterated NOT-ALL-EQUAL', 'NE^d']
  group: separating
  order: 37
  kind: total
  arity: '$3^d$ bits'
  short: 'The first total function with a superlinear exact quantum speedup: $\mathrm{Q}_E = O(\mathrm{D}^{0.8675})$.'
  definition: |
    The $d$-fold iteration of the $3$-bit NOT-ALL-EQUAL gadget
    $\mathrm{NE}(x_1,x_2,x_3) = 1$ unless $x_1=x_2=x_3$. Iterating means
    substituting a fresh copy of $\mathrm{NE}^{d-1}$ for each of the three
    inputs, so $\mathrm{NE}^d$ is a read-once formula on $3^d$ bits.
  formal: |
    $\mathrm{NE} = \mathrm{OR}(x_1\oplus x_2,\ x_2\oplus x_3)$, of degree $2$
    but deterministic complexity $3$, and both behave multiplicatively under
    iteration: $\mathrm{D}(\mathrm{NE}^d)=3^d$ and $\deg(\mathrm{NE}^d)=2^d$
    [NS94]. The exact quantum algorithm of [Ambainis13] is built inductively:
    it maintains a designated basis state whose amplitude is $1$ on $0$-inputs
    and a fixed $\alpha<1$ on $1$-inputs, and interleaves the induction steps
    (which push $\alpha$ towards $1$) with amplitude amplification (which
    pushes it back), finishing with one more amplification that separates the
    two cases perfectly.
  scale:
    var: d
    subs: {n: '3^d'}
    note: 'The asymptotic variable is the iteration depth $d$; the input length is $n = 3^d$.'
  values:
    - {measure: D,  value: '3^d', refs: [NS94, Ambainis13], note: 'Exactly the input length. $\mathrm{NE}^d(0,\dots,0)=0$ while every weight-one input evaluates to $1$, so all $3^d$ variables are sensitive there.'}
    - {measure: s,  value: '3^d', refs: [Ambainis13], note: 'Same all-zero input: $\mathrm{s}_0 = 3^d$, and $\mathrm{s}\le n = 3^d$. This is what forces $\mathrm{D}$ and $\mathrm{R}$ to be maximal.'}
    - {measure: s0, value: '3^d', note: 'Squeeze: the all-zero input is fully sensitive, and $\mathrm{s}_0\le n$.'}
    - {measure: bs, value: '3^d', note: 'Squeeze: $\mathrm{s}\le\mathrm{bs}\le n$.'}
    - {measure: bs0, value: '3^d', note: 'Squeeze: $\mathrm{s}_0\le\mathrm{bs}_0\le n$.'}
    - {measure: fbs, value: '3^d', note: 'Squeeze: $\mathrm{bs}\le\mathrm{fbs}\le n$.'}
    - {measure: RC, value: '3^d', note: 'Squeeze: $\mathrm{fbs}\le\mathrm{RC}\le\mathrm{D}$.'}
    - {measure: C,  value: '3^d', note: 'Squeeze: $\mathrm{bs}\le\mathrm{C}\le n$.'}
    - {measure: C0, value: '3^d', note: 'Squeeze: $\mathrm{bs}_0\le\mathrm{C}_0\le n$. Certifying the all-zero input really does require all $3^d$ bits.'}
    - {measure: UC, value: '3^d', note: 'Squeeze: $\mathrm{C}\le\mathrm{UC}\le\mathrm{D}$.'}
    - {measure: SP, value: '3^d', note: 'Squeeze: $\mathrm{C}\le\mathrm{SP}\le\mathrm{D}$.'}
    - {measure: Dna, value: '3^d', note: 'Squeeze: $\mathrm{D}\le\mathrm{Dna}\le n$.'}
    - {measure: R,  value: '3^d', refs: [Ambainis13], note: 'The all-zero input has full sensitivity, so $\mathrm{R}=\Omega(\mathrm{s})=\Omega(3^d)$; and $\mathrm{R}\le\mathrm{D}=3^d$. So the exact quantum speedup below is a speedup over bounded-error randomized query complexity too.'}
    - {measure: noisyR, value: '3^d', refs: [CKMPSS23], note: 'The zoo''s own [[noisyR]] vs [[R]] entry records $\mathrm{R}(f)=\Theta(n)\Rightarrow\mathrm{noisyR}(f)=\Theta(\mathrm{R}(f))$ [CKMPSS23], and the recorded $\mathrm{R}$ is linear in the arity here -- the all-zero input has full sensitivity.'}
    - {measure: R0, value: '3^d', note: 'Squeeze: $\mathrm{R}\le\mathrm{R}_0\le\mathrm{D}$.'}
    - {measure: Rna, value: '3^d', note: 'Squeeze: $\mathrm{R}\le\mathrm{Rna}\le\mathrm{Dna}$.'}
    - {measure: deg, value: '2^d', refs: [NS94], note: '$\deg(\mathrm{NE})=2$ and degree is multiplicative for iterated read-once composition, so $\deg = 2^d = n^{\log_3 2} = n^{0.6309\ldots}$. The gap $\mathrm{D}=\deg^{\log_2 3}$ is what makes an exact quantum speedup possible at all: $\mathrm{Q}_E\ge\deg/2$, so a function with $\mathrm{D}=\Theta(\deg)$ can never show one.'}
    - {measure: Q,  value: '\Theta(2.1213^d)', refs: [Ambainis13], note: 'The bounded-error complexity is $\Theta((3/\sqrt2)^d) = \Theta(n^{0.6845\ldots})$: the lower bound is Ambainis'' adversary argument and the matching upper bound follows from the optimality of the negative-weight adversary bound. Note this is *above* $\deg$, so the degree lower bound on $\mathrm{Q}$ is not tight here.'}
    - {measure: FC, value: '3^d', note: 'Squeeze: $\mathrm{FC}=\mathrm{fbs}$ exactly.'}
    - {measure: CA, value: '\Theta(3^d)', refs: [ABIKPS17], note: 'Squeeze: $\mathrm{CA}=\Theta(\mathrm{fbs})$ for total functions.'}
    - {measure: CGpub, value: '\Theta(3^d)', note: 'Squeeze: $\mathrm{CG}^{\mathrm{pub}}=\Theta(\mathrm{CA})$.'}
    - {measure: CGstar, value: '\Theta(3^d)', note: 'Squeeze: the non-signaling, entangled and public-coin certificate games all collapse to $\Theta(\mathrm{CA})$.'}
    - {measure: CGns, value: '\Theta(3^d)', note: 'Squeeze: $\mathrm{CG}^{\mathrm{ns}}=\Theta(\mathrm{CG}^{\mathrm{pub}})=\Theta(\mathrm{CA})$.'}
    - {measure: CG, value: '\Omega(3^d)', note: 'Squeeze: $\mathrm{CG}\ge\mathrm{CG}^{\mathrm{pub}}=\Theta(3^d)$, equally $\mathrm{R}_0=O(\mathrm{CG})$. Only a lower bound is recorded: the ceiling available is $\mathrm{CG}\le\mathrm{C}^0\mathrm{C}^1=\Theta(9^d)$ (or $\mathrm{CG}=O(\mathrm{EC}^2)$, the same), and private randomness is *not* bounded by $\mathrm{R}_0$ -- $\mathrm{CG}(\oplus_n)=\Theta(n^2)$ while $\mathrm{R}_0(\oplus_n)=n$.'}
    - {measure: EC, value: '\Theta(3^d)', note: 'Squeeze: $\mathrm{FC}\le\mathrm{EC}\le\mathrm{C}$, and both ends are $3^d$.'}
    - {measure: prt, value: '\Theta(3^d)', note: 'Squeezed between $\mathrm{RC}$ and $2\mathrm{R}$ [JainKlauck10], which coincide at $3^d$.'}
    - {measure: rprt, value: '\Theta(3^d)', note: 'Squeeze: $\overline{\mathrm{prt}}\ge\mathrm{RC}=3^d$ and $\overline{\mathrm{prt}}\le\mathrm{prt}$.'}
    - {measure: RS, value: '3^d', refs: [BenDavidKothari18], putative: true, note: 'The inequality runs $\mathrm{R}_\varepsilon\ge\bar{\mathrm{R}}_\varepsilon\ge(1-2\varepsilon)\mathrm{RS}$ [BenDavidKothari18, Thm 12], i.e. $\mathrm{RS}=O(\mathrm{R})=O(3^d)$, *not* $\mathrm{RS}\ge\mathrm{R}$. The matching floor is direct: sabotage the all-zero input at one coordinate $i$. Both completions are legal ($\mathrm{NE}^d(0^n)=0$ while every weight-one input gives $1$), and every query to $j\ne i$ returns $0$, so nothing about $i$ leaks until it is queried; against the uniform distribution on the $3^d$ choices of $i$ a deterministic solver needs $(3^d+1)/2$ queries in expectation, and Yao gives $\mathrm{RS}=\Omega(3^d)$.'}
    - {measure: R1, value: '3^d', note: 'Squeeze: $\mathrm{R}\le\mathrm{R}^1\le\mathrm{D}$.'}
    - {measure: Rbar, value: '\Theta(3^d)', note: 'Squeeze: $\bar{\mathrm{R}}\le\mathrm{R}=3^d$ and $\bar{\mathrm{R}}=\Omega(\mathrm{fbs})=\Omega(3^d)$.'}
    - {measure: Dmu, value: '\Theta(3^d)', note: 'Maximised over input distributions: Yao''s minimax gives $\max_\mu\mathrm{D}^{\mu}=\Theta(\mathrm{R})$.'}
    - {measure: C1, value: '\Theta(3^d)', putative: true, note: 'Certifying $\mathrm{NE}=1$ at the top means exhibiting two children with different values, so $\mathrm{C}_1(\mathrm{NE}^d)=\mathrm{C}_1(\mathrm{NE}^{d-1})+\mathrm{C}_0(\mathrm{NE}^{d-1})=\mathrm{C}_1(\mathrm{NE}^{d-1})+3^{d-1}$, and hence $\mathrm{C}_1(\mathrm{NE}^d)=(3^d+1)/2$. Even the $1$-side of certificate complexity is within a factor $2$ of the input length.'}
    - {measure: QC, value: '\Theta(3^{d/2})', note: 'Squeeze: $\mathrm{QC}=\Theta(\sqrt{\mathrm{fbs}})$. This is $\Theta(n^{1/2})$, well below $\mathrm{Q}=\Theta(n^{0.6845})$.'}
    - {measure: lambda, value: '3^{d/2}', putative: true, note: 'The sensitivity graph of the $3$-bit gadget is two disjoint stars $K_{1,3}$ (the only $0$-inputs are $000$ and $111$), so $\lambda(\mathrm{NE})=\sqrt3$; spectral sensitivity is multiplicative under composition [ABKRT21], giving $\lambda(\mathrm{NE}^d)=3^{d/2}$. This meets the general floor $\lambda\ge\sqrt{\mathrm{s}}$ with equality, and sits below $\deg=2^d$ as $\lambda\le\deg$ requires.'}
    - {measure: Advpm, value: '\Theta(2.1213^d)', refs: [Reichardt11], note: 'Squeeze: $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$. Ambainis'' lower bound for this family is in fact an adversary bound, so this line is where the recorded $\mathrm{Q}$ comes from.'}
    - {measure: gamma2, value: '\Theta(2.1213^d)', refs: [LMRSS11], note: 'Squeeze: the approximate $\gamma_2$ norm is the factorisation-norm form of $\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$.'}
    - {measure: MAdv, value: '\Theta(2.1213^d)', note: 'Squeezed between $\mathrm{Adv}^{\pm}$ and $O(\mathrm{Q})$, which coincide.'}
    - {measure: adeg, value: 'O(2^d)', note: 'Squeeze: $\widetilde{\deg}\le\deg=2^d$, with the floor $\widetilde{\deg}=\Omega(\sqrt{\mathrm{bs}})=\Omega(3^{d/2})$. Since $\widetilde{\deg}(\mathrm{NE})=\deg(\mathrm{NE})=2$ -- a symmetric $3$-bit function that is $0$ exactly at Hamming weights $0$ and $3$ admits no degree-$1$ approximation -- the true value is presumably $\Theta(2^d)$.'}
    - {measure: Q0, value: 'O(2.593^d)', note: 'Squeeze: $\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_E$; the floor is $\Omega(2.1213^d)$.'}
    - {measure: QE, value: 'O(2.593^d)', refs: [Ambainis13], note: 'The main theorem: $\mathrm{Q}_E(\mathrm{NE}^d) = O(2.593\ldots^d) = O(\mathrm{D}^{0.8675\ldots})$. The best known lower bound is only $\mathrm{Q}_E\ge\mathrm{Q}=\Omega(2.1213^d)$, so the exponent is not pinned; the value is recorded as $O(\cdot)$ for that reason.'}
    - {measure: s1, value: '3^{d-1}', putative: true, note: 'Exact. At a $1$-input of $\mathrm{NE}$ exactly one of the three coordinates is sensitive -- the odd one out, e.g. only $y_1$ at $y=011$ -- so $\mathrm{s}_1(\mathrm{NE}^d)=\max\{\mathrm{s}_0,\mathrm{s}_1\}(\mathrm{NE}^{d-1})=\mathrm{s}_0(\mathrm{NE}^{d-1})=3^{d-1}$, attained by putting the all-zero input into one child and $1$-inputs into the other two. So the fully sensitive input is essentially unique to the $0$-side: $\mathrm{s}_1$ is a factor $3$ below $\mathrm{s}_0=3^d$.'}
    - {measure: bs1, value: '\Theta(3^d)', putative: true, note: 'Lower: at the $1$-input above (child $1$ all-zero, children $2,3$ equal to $1$) each single bit of child $1$ is a sensitive block, giving $\mathrm{bs}_1\ge 3^{d-1}$. Upper: $\mathrm{bs}_1\le\mathrm{C}^1=(3^d+1)/2$. Unlike sensitivity, block sensitivity is maximal on both sides.'}
    - {measure: Cmin, value: '\Theta(2.3028^d)', putative: true, note: 'Exact recursion. Let $a_d=\min_{x\in f^{-1}(0)}\mathrm{C}_x$ and $b_d=\min_{x\in f^{-1}(1)}\mathrm{C}_x$. A $0$-certificate must pin all three children (they must be shown equal): $a_d=3\min\{a_{d-1},b_{d-1}\}$. A $1$-certificate need only exhibit two children with different values: $b_d=a_{d-1}+b_{d-1}$. With $a_0=b_0=1$ one gets $b_d<a_d$ for all $d\ge1$, hence $a_d=3b_{d-1}$ and $b_d=b_{d-1}+3b_{d-2}$, i.e. $1,2,5,11,26,59,137,\dots$, whose growth rate is the root $(1+\sqrt{13})/2=2.3027\ldots$ So $\mathrm{C}_{\min}=\Theta(2.3028^d)=\Theta(n^{0.7587})$, strictly between $\lambda=n^{1/2}$ and $\mathrm{C}=n$.'}
    - {measure: rank, value: '\Omega(2.3028^d)', note: 'A Delayer who defers on every query survives at least $\mathrm{C}_{\min}$ rounds, so $\mathrm{rank}\ge\mathrm{C}_{\min}=\Omega(2.3028^d)$; the ceiling is $\mathrm{rank}\le\mathrm{D}=3^d$.'}
    - {measure: UCmin, value: '\Theta(3^d)', note: 'Squeeze: an unambiguous certificate family is in particular a certificate family, so $\mathrm{UC}_{\min}\ge\min\{\mathrm{C}^0,\mathrm{C}^1\}=(3^d+1)/2$; and $\mathrm{UC}_{\min}\le\mathrm{UC}=3^d$. Both sides of this function are expensive to certify even ambiguously, so the [BHT17] route to a low-sensitivity function gets no traction here.'}
    - {measure: cbs, value: '3^d', note: 'For a Boolean function every input is critical and the solution function is forced, so $\mathrm{cbs}=\mathrm{bs}=3^d$ ([[cbs]] vs [[bs]]).'}
    - {measure: psD, value: '3^d', note: 'For a Boolean function the canonical solution is forced to be $f$ itself, so $\mathrm{psD}=\mathrm{R}=3^d$.'}
    - {measure: Adv, value: 'O(2.1213^d)', note: 'Squeeze: $\mathrm{Adv}\le\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})=\Theta(2.1213^d)$. The floor is $\mathrm{Adv}\ge\sqrt{\mathrm{bs}}=3^{d/2}$ (equally $\mathrm{Adv}\ge\lambda$), so the positive adversary is pinned between $1.7320^d$ and $2.1213^d$ here.'}
    - {measure: odeg, value: 'O(2^d)', note: 'Squeeze: $\widetilde{\deg}_+\le\widetilde{\deg}\le\deg=2^d$.'}
    - {measure: sdeg, value: 'O(2^d)', note: 'Squeeze: $\mathrm{sdeg}\le\widetilde{\deg}_+\le\deg=2^d$.'}
    - {measure: rdeg, value: 'O(2^d)', note: 'Squeeze: $\mathrm{rdeg}\le\deg=2^d$ (take the denominator $q\equiv 1$).'}
    - {measure: Inf, value: '\Omega((5/3)^d)', putative: true, note: 'Exact recursion. Coordinate $i$ of the top $\mathrm{NE}$ is sensitive at $y$ iff the *other two* children agree, an event independent of child $i$; hence $\mathrm{I}(\mathrm{NE}^d)=3\big(p_{d-1}^2+(1-p_{d-1})^2\big)\,\mathrm{I}(\mathrm{NE}^{d-1})$ with $p_d=\Pr[\mathrm{NE}^d=1]=3p_{d-1}(1-p_{d-1})$ and $\mathrm{I}(\mathrm{NE}^0)=1$. Since $p_d\to 2/3$, the factor tends to $3(4/9+1/9)=5/3$; the convergence is only neutral ($g''(2/3)=-1$), so the product picks up a $d^{o(1)}$ correction and only the lower bound $\mathrm{I}=\Omega((5/3)^d)$ is recorded (numerically the ratio $\mathrm{I}_d/(5/3)^d$ stays in $[0.9,1.2]$ out to $d=200$). Note $(5/3)^d=n^{0.4650}$, well below $\mathrm{s}=n$: the function is maximally sensitive at one input but only polynomially sensitive on average.'}
    - {measure: Inf1, value: '\Omega((5/3)^d)', note: 'For a Boolean-valued function the $L_1$ and $L_2$ influences coincide coordinate by coordinate, so $\mathrm{I}^{1}=\mathrm{I}$.'}
    - {measure: MaxInf, value: '\Omega((5/9)^d)', note: '$\mathrm{NE}^d$ is transitive -- the automorphism group permuting the three children at every node acts transitively on the $3^d$ leaves -- so every coordinate has the same influence and $\mathrm{MaxInf}=\mathrm{I}/3^d=\Omega((5/9)^d)$. Individual influences are exponentially small even though $\mathrm{D}$ is maximal.'}
    - {measure: chi, value: '\Theta(3^d)', refs: [Li18], note: 'Squeeze: $\chi=\Omega(\mathrm{bs})=\Omega(3^d)$ [Li18], and $\chi\le\bar\chi=O(\mathrm{LR})=O(\mathrm{R}^{*})\le O(\mathrm{R})=O(3^d)$. All four inner measures of randomized composition collapse to the arity here.'}
    - {measure: chibar, value: '\Theta(3^d)', refs: [GLSS19], note: 'Squeeze: $\bar\chi=\Omega(\mathrm{RS})=\Omega(3^d)$ [GLSS19] and $\bar\chi=O(\mathrm{LR})\le O(\mathrm{R})=O(3^d)$.'}
    - {measure: LR, value: '\Theta(3^d)', refs: [BBGM22], note: 'Squeeze: $\bar\chi=O(\mathrm{LR})$ and $\mathrm{LR}=O(\mathrm{R}^{*})\le\mathrm{R}$ [BBGM22]; both ends are $3^d$. This is the $\mathrm{LR}=\Theta(\mathrm{R})$ end of the range, as the recorded $\mathrm{RS}=\Theta(\mathrm{R})$ forces.'}
    - {measure: Rstar, value: '\Theta(3^d)', refs: [BBGM22], note: 'Squeeze: $\mathrm{LR}=O(\mathrm{R}^{*})$ and $\mathrm{R}^{*}\le\mathrm{R}$ [BBGM22], both $\Theta(3^d)$. Iterating buys nothing, which is no surprise: $\mathrm{NE}^d$ is already an iterate, and $\mathrm{R}$ is exactly the arity at every depth.'}
    - {measure: Np, value: '\widetilde\Theta(3^d)', refs: [FRPU94], note: 'Floor $\mathrm{N}_p=\Omega(\mathrm{R})=\Omega(3^d)$ (a clean algorithm simulates the noisy one by flipping each answer itself with probability $p$), ceiling $\mathrm{N}_p=O(\mathrm{R}\log\mathrm{R})=O(d\,3^d)$ [FRPU94]. Whether the $\log$ is paid is open here: the general floor $\mathrm{N}_p=\Omega(\mathrm{I}\log\mathrm{I})$ only gives $\Omega(d\,(5/3)^d)$, because the total influence of $\mathrm{NE}^d$ is exponentially below its arity -- unlike $\oplus_n$, which is why that function is known to need $\Theta(n\log n)$.'}
    - {measure: robustQ, value: '\widetilde\Theta(2.1213^d)', refs: [BNRdW05], note: 'Squeeze: $\mathrm{Q}^{\mathrm{rob}}\ge\mathrm{Q}$ and $\mathrm{Q}^{\mathrm{rob}}=O(\mathrm{Q}\log\mathrm{Q})$ [BNRdW05], with $\mathrm{Q}=\Theta(2.1213^d)$.'}
    - {measure: D_size, value: '2^{\Omega(2.3028^d)}', note: 'A decision tree with $L$ leaves has rank at most $\log_2 L$, so $\mathrm{DTsize}\ge 2^{\mathrm{rank}}\ge 2^{\mathrm{C}_{\min}}=2^{\Omega(2.3028^d)}$, against the ceiling $2^{\mathrm{D}}=2^{3^d}$. Doubly exponential in the asymptotic variable, hence recorded in a form the growth parser does not read.'}
    - {measure: deg2, value: '2^d', putative: true, note: 'Exact. Over $\mathbb{F}_2$, $\mathrm{NE}=x_1+x_2+x_3+x_1x_2+x_1x_3+x_2x_3$, of degree $2$. Composing on disjoint blocks, the top-degree part of $\mathrm{NE}^d$ is $T_1T_2+T_1T_3+T_2T_3$ in the children''s top parts $T_i$; the three products live on different pairs of blocks, so no cancellation is possible and the degree doubles at every level: $\deg_2(\mathrm{NE}^d)=2^d=\deg(\mathrm{NE}^d)$ (checked exhaustively for $d\le2$). Unlike $\oplus_n$, whose $\mathbb{F}_2$-degree collapses to $1$, this function is exactly as hard mod $2$ as over the reals.'}
    - {measure: degp, value: '2^d', putative: true, note: 'Exact for *every* prime $p$. The multilinear representation over any field is unique on $\{0,1\}^n$ and is the reduction of the integer one obtained by Mobius inversion, so $\deg_p\le\deg=2^d$ with equality iff the top coefficient survives mod $p$. Here the real form is $\mathrm{NE}=x_1+x_2+x_3-(x_1x_2+x_1x_3+x_2x_3)$ and a top-degree coefficient obeys $c_d=-c_{d-1}^2$ with $c_0=1$, so $|c_d|=1$ and it is nonzero modulo every $p$.'}
    - {measure: Fdim, value: '\Theta(3^d)', putative: true, note: 'Exactly $2\cdot3^{d-1}$. In the $\pm1$ encoding $\mathrm{NE}=\tfrac12(-1+y_1y_2+y_1y_3+y_2y_3)$, so the Fourier support of $\mathrm{NE}^d$ consists of the sets $S_i\triangle S_j$ ($i<j$) with $S_i$ in the support of child $i$; since $\emptyset$ is in each child''s support for $d\ge2$, taking $\mathbb{F}_2$-sums of two such sets recovers every $S_i$, so the span is the direct sum of the children''s spans and $\dim_d=3\dim_{d-1}$ with $\dim_1=2$. Verified exhaustively for $d\le2$ ($2$ and $6$). So $\mathrm{NE}^d$ depends on $\tfrac23 n$ independent parities -- no parity structure to exploit.'}
    - {measure: PDT, value: '\Omega(2^d),\ O(3^d)', note: 'Floor $\mathrm{D}^{\oplus}\ge\deg_2=2^d$: the leaves of a depth-$k$ parity decision tree are products of $k$ affine forms, so the $\mathbb{F}_2$-degree is at most $k$. Ceiling $\mathrm{D}^{\oplus}\le\dim_{\mathbb{F}_2}=2\cdot3^{d-1}$ (query the relevant parities). Parity queries do help a little: already $\mathrm{D}^{\oplus}(\mathrm{NE})=2<3=\mathrm{D}(\mathrm{NE})$, via $\mathrm{NE}=\mathrm{OR}(x_1\oplus x_2,x_2\oplus x_3)$.'}
    - {measure: NS, value: '\Theta(1)', putative: true, note: 'For every constant $\delta\in(0,1/2)$. Push a $\delta$-correlated pair through the recursion: the joint law of $(\mathrm{NE}^d(x),\mathrm{NE}^d(y))$ is a $3$-fold product-then-gadget map on the four-state joint distribution, with marginal $p_d=\Pr[\mathrm{NE}^d=1]=3p_{d-1}(1-p_{d-1})\to2/3$. Iterating it numerically, the orbit is independent of $\delta$ (tested at $\delta$ corresponding to $\rho\in\{0.01,0.5,0.99\}$) from about $d=10$ on, and $\mathrm{NS}_\delta$ climbs to $4/9$ from below: $0.468$ at $d=30$, $0.452$ at $d=400$. So a constant flip rate destroys all correlation except what the bias forces.'}
    - {measure: Stab, value: '\Theta(1)', putative: true, note: 'Same recursion as [[NS]]: for every constant $\rho\in(0,1)$, $\mathrm{Stab}_\rho\to 1/9$, and numerically $\mathrm{Stab}_\rho$ agrees with $\hat f(\emptyset)^2=(1-2p_d)^2$ to six decimals by $d=30$ for $\rho$ anywhere in $[0.01,0.99]$. That is, $\mathrm{Stab}_\rho-\hat f(\emptyset)^2\to0$: all Fourier weight above level $0$ is noise-sensitive in the Benjamini-Kalai-Schramm sense, consistent with $\mathrm{MaxInf}=(5/9)^{d+o(d)}\to0$. $\mathrm{Stab}$ itself stays $\Theta(1)$ only because the function is biased. Note the contrast with $\mathrm{RS}=\mathrm{R}=3^d$: query complexity maximal, stability constant, exactly the incomparability that [[MAJ]] witnesses.'}
    - {measure: ndeg, value: 'O(2^d)', note: 'Squeeze: $\mathrm{ndeg}\le\min\{\mathrm{C}^1,\deg\}=2^d$ (the certificate bound is the weaker one here, $(3^d+1)/2$). Already at $d=1$ the real form $x_1+x_2+x_3-(x_1x_2+x_1x_3+x_2x_3)$ is nonzero exactly on the $1$-inputs, so $\mathrm{ndeg}(\mathrm{NE})=2$. No floor is recorded: nondeterministic degree has no $\sqrt{\mathrm{bs}}$-type lower bound.'}
    - {measure: NQ, value: 'O(2^d)', note: 'Squeeze: $\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil\le 2^{d-1}$ (de Wolf), and $\mathrm{ndeg}\le\deg=2^d$.'}
    - {measure: ardeg, value: 'O(2^d)', note: 'Squeeze: $\mathrm{rdeg}_{1/3}\le\mathrm{rdeg}_0\le\deg=2^d$; approximation only helps.'}
    - {measure: PostQ, value: 'O(2^d)', refs: [MahadevdeWolf15], note: 'Squeeze: $\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] and $\mathrm{rdeg}_{1/3}\le\deg=2^d$. Not enough to decide whether post-selection beats $\mathrm{Q}=\Theta(2.1213^d)$ on this function, which would need a rational approximation genuinely below the real degree.'}
    - {measure: cjdeg, value: '\Omega(3^{d/2}),\ O(3^d)', note: 'Floor: dropping non-negativity gives $\mathrm{cjdeg}\ge\widetilde{\deg}=\Omega(\sqrt{\mathrm{bs}})=\Omega(3^{d/2})$. Ceiling: a depth-$\mathrm{D}$ decision tree is already an exact conical junta -- one width-$\le\mathrm{D}$ conjunction per accepting path, all coefficients $1$ -- so $\mathrm{cjdeg}\le\mathrm{D}=3^d$.'}
