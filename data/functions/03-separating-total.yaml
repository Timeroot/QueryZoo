    - {of: [D, QE],  setting: total, statement: '$\mathrm{D} = \Omega(\mathrm{Q}_E^{1.15})$; the source of every "$1.15$" in the $\mathrm{Q}_E$ column. Upper bound $\mathrm{D}=O(\mathrm{Q}_E^3)$.', refs: [Ambainis13, Midrijanis04]}
    - {of: [C, QE],  setting: total, statement: '$\mathrm{C} = \Omega(\mathrm{Q}_E^{1.15})$.', refs: [Ambainis13]}
    - {of: [RC, QE], setting: total, statement: '$\mathrm{RC} = \Omega(\mathrm{Q}_E^{1.15})$.', refs: [Ambainis13]}
    - {of: [bs, QE], setting: total, statement: '$\mathrm{bs} = \Omega(\mathrm{Q}_E^{1.15})$.', refs: [Ambainis13]}
