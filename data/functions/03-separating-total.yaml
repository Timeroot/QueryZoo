  notes: |
    Every combinatorial measure of $\mathrm{NE}^d$ is pinned to the input
    length by the all-zero input, which is sensitive in every coordinate.
    That makes this a rare entry where the whole left half of the table is
    exact: $\mathrm{s} = \mathrm{bs} = \mathrm{fbs} = \mathrm{RC} = \mathrm{C}
    = \mathrm{UC} = \mathrm{SP} = \mathrm{D} = \mathrm{R} = 3^d$, with only
    $\deg$, $\mathrm{Q}$ and $\mathrm{Q}_E$ dropping below it. Every "$1.15$"
    in the $\mathrm{Q}_E$ column is $1/0.8675\ldots$ read off against one of
    these.

    Whether $2.593\ldots$ is the truth is open; [Ambainis13] asks both whether
    the algorithm can be improved and whether a better $\mathrm{Q}_E$ lower
    bound than $\mathrm{Q}$ exists. The largest possible gap is bounded by
    $\mathrm{D}=O(\mathrm{Q}_E^3)$ [Midrijanis04].
  refs: [Ambainis13, AmbainisGruslysEtAl16, NS94]
  see_also: [QE, D, PARITY, NANDtree]
