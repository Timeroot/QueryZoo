# =====================================================================
# FUNCTIONS: the named problems that headline theorems, rather than the
# gadgets built to fill a matrix cell. Surjectivity, k-distinctness,
# triangle finding, recursive Fourier sampling, and friends.
# =====================================================================
functions:

- id: Surjectivity
  name: Surjectivity
  symbol: '\mathrm{SURJ}_{N,R}'
  group: quantum
  order: 55
  kind: total
  arity: 'a list of $N$ elements of $[R]$ in binary, so $n = N\log_2 R$ bits; canonically $R = N/2$'
  short: 'The only known *natural* function separating $\mathrm{Q}$ from $\widetilde{\deg}$: $\widetilde{\deg} = \tilde\Theta(n^{3/4})$ while $\mathrm{Q} = \tilde\Theta(n)$.'
  definition: |
    Read the input as a list $x_1,\dots,x_N \in [R]$ and accept iff every value in
    the range is hit, $\{x_1,\dots,x_N\} = [R]$. With $R$ a power of two and each
    $x_i$ written in binary this is a *total* Boolean function on $n = N\log_2 R$
    bits, computed by a depth-3 $\mathrm{AC}^0$ circuit with logarithmic bottom
    fan-in. The problem is trivial for $R > N$; the interesting regime is $R = N/2$.

    Two encodings appear in the literature and they differ by a $\log R$ factor.
    [Sherstov21] works over the one-hot domain, where
    $\mathrm{SURJ}_{n,r} = \mathrm{AND}_r \circ \mathrm{OR}_n$ restricted to Hamming
    weight $\le n$; [BKT18] and [BT22] use the binary encoding above.
    [BT22, Obs. 52 and Lem. 54] relate the two -- which is where the tildes below
    come from.
  formal: '$$\mathrm{SURJ}_{N,R}(x) \;=\; \bigwedge_{j\in[R]}\ \bigvee_{i\in[N]}\ [\,x_i = j\,].$$'
  values:
    - {measure: adeg, value: '\tilde\Theta(n^{3/4})', refs: [Sherstov21, BKT18, BT22], note: 'At $R = N/2$. Upper: [Sherstov21, Thm. 1.3] constructs a polynomial of degree $O(\sqrt n\,r^{1/4})$ for $r \le n$; [BKT18, Thm. 3.1] restates it as $\tilde O(N^{3/4})$ for every $R$. Lower: [BKT18, Thm. 4.1], $\tilde\Omega(R^{3/4})$ for some $N = O(R)$. In general $\widetilde{\deg}(\mathrm{SURJ}_{N,R}) = \tilde\Theta(R^{1/4}N^{1/2})$. The $\varepsilon$-dependence is $\tilde\Theta(n^{3/4}\log^{1/4}(1/\varepsilon))$ for $3^{-n} \le \varepsilon \le 1/3$ [SherstovThaler23].'}
    - {measure: Q, value: '\tilde\Theta(n)', refs: [BeameMachmouchi12], note: 'Lower: [BeameMachmouchi12, Cor. 3] gives $\Omega(n/\log n)$ -- their Cor. 2 shows $\Omega(N)$ *element* queries for $\mathrm{ONTO}$ with $[2N-2]\to[N]$, and the binary encoding costs the log. Upper: $n$, trivially. A clean $\Omega(n)$ is widely attributed to [Sherstov18asymmetry], but that paper states it only as a confidence in Remark 3.4 ("we are confident that ... one can eliminate the logarithmic factors"), not as a theorem, and about some $\mathrm{AC}^0$ function rather than $\mathrm{SURJ}$ in the binary encoding; hence the tilde.'}
    - {measure: sdeg, value: '\tilde\Theta(\sqrt n)', refs: [BunThaler21largeerror, BT22], note: '[BunThaler21largeerror, Thm. 1.1]: $\deg_{\pm}(\mathrm{SURJ}_{N,R}) = \tilde\Theta(\min\{R,\sqrt N\})$ for $R < N/2$, which at the canonical $R$ is $\tilde\Theta(\sqrt n)$; also [BT22, Thm. 57]. Their Cor. 1.2 turns this into an $\mathrm{AC}^0$ function with unbounded-error communication complexity $\tilde\Omega(\sqrt n)$.'}
    - {measure: s, value: '\Theta(n)', putative: true, note: 'At $R = N/2$ take the list in which each of $1,\dots,R-1$ occurs exactly once and $R$ fills the remaining $R+1$ slots: a $1$-input on which flipping any bit of any uniquely-occurring element deletes that value from the range, so $\mathrm{s} \ge (R-1)\log_2 R = n/2 - O(\log n)$. And $\mathrm{s}\le n$.'}
    - {measure: C0, value: '\Theta(n/\log n)', putative: true, note: 'Exactly $N$, the number of *slots*, which at $R = N/2$ is $n/\log_2 R = \Theta(n/\log n)$. Upper: a $0$-input misses some value $u$, and forcing $x_i \ne u$ costs a *single* bit per slot -- fix one position where $x_i$ and $u$ disagree. Lower: take the $0$-input in which every value except $u$ occurs at least twice; then for each slot $i$ the input obtained by rewriting $x_i$ to $u$ is surjective, so the certificate must fix a bit in every slot. Verified by exhaustive search at $R = 4$, $N = 8$, where $\max_x \mathrm{C}_x = 8 = N$ over all $0$-inputs. (An earlier version of this entry said $n$; that over-counts by a factor $\log R$ -- one does not have to pin down each $x_i$, only to keep it away from $u$.)'}
    - {measure: C1, value: '\Theta(n)', putative: true, note: 'A $1$-certificate names one preimage for each of the $R$ range values, which is $R\log_2 R = n/2$ bits at $R = N/2$, and that suffices.'}
    - {measure: bs, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{bs}(f) \le n$, with $\mathrm{s} = \Theta(n)$ here.'}
    - {measure: R, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f) \le 3\,\mathrm{R}(f) \le 3n$, and $\mathrm{bs} = \Theta(n)$ here. (The $\mathrm{Q} \le \mathrm{R}$ route would only give $\tilde\Theta(n)$; block sensitivity removes the log.)'}
    - {measure: deg, value: 'n', putative: true, note: 'Full degree, for every power of two $R \ge 2$ and every even $N \ge R$ -- in particular at $R = N/2$. The coefficient of the top monomial $\prod_i x_i$ is $\pm\sum_x(-1)^{|x|}\mathrm{SURJ}(x)$. Inclusion-exclusion over the missed set gives $\sum_x(-1)^{|x|}\mathrm{SURJ}(x) = (-1)^N\sum_{S\subseteq[R]}(-1)^{|S|}\sigma(S)^N$ with $\sigma(S) = \sum_{v\in S}(-1)^{|v|}$, because $\sum_{v\in[R]}(-1)^{|v|} = 0$. Splitting $S$ by the parity of its elements and passing to exponential generating functions turns this into $N!\,[z^N]\big((1-e^z)(1-e^{-z})\big)^{R/2} = N!\,[z^N]\big(-4\sinh^2(z/2)\big)^{R/2}$, and expanding $\sinh$ leaves $\pm R!\,T(N,R)$, where $T$ is the central factorial number of the second kind. $T(N,R) > 0$ whenever $N \equiv R \bmod 2$ and $N \ge R$, which holds here since $R$ is even. Checked numerically at $R=2,N=4$ (coefficient $-2$) and $R=4,N=8$ (coefficient $504 = 4!\cdot T(8,4)$).'}
    - {measure: D, value: 'n', note: 'Evasive: $\deg(f) \le \mathrm{D}(f) \le n$ and $\deg = n$ here, so every deterministic tree must read all $n$ bits on some input. This settles the question the previous version of this entry left open, but only as strongly as the $\deg$ computation above.'}
    - {measure: fbs, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{fbs}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The $\mathrm{s}$ end is itself an unpublished argument (see above), so this is only as good as that.'}
    - {measure: C, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{C}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The $\mathrm{s}$ end is itself an unpublished argument (see above), so this is only as good as that.'}
    - {measure: FC, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{FC}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The $\mathrm{s}$ end is itself an unpublished argument (see above), so this is only as good as that.'}
    - {measure: R0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The $\mathrm{s}$ end is itself an unpublished argument (see above), so this is only as good as that.'}
    - {measure: RC, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{RC}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: chi, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \chi(g) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: chibar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\chi}(g) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: LR, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: Rstar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: CA, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{CA}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: CG, value: '\Omega(n),\ O(n^2/\log n)', refs: [CGLMSG23], note: 'The old reading $\mathrm{bs} \le \mathrm{CG} \le \mathrm{D}$ was wrong on the right: $\mathrm{CG}$ is *not* capped by the arity. The correct sandwich is $\max\{\mathrm{Adv}^2, \mathrm{R}_0, \mathrm{CA}\} \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ [CGLMSG23]. Here $\mathrm{R}_0 = \Theta(n)$ from below, and $\mathrm{C}^0\mathrm{C}^1 = \Theta(n/\log n)\cdot\Theta(n)$ from above. The $\mathrm{Adv}$ route gives nothing extra, since only $\mathrm{Adv} = O(n/\sqrt{\log n})$ is recorded. The gap is genuine and left open.'}
    - {measure: CGpub, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end of this sandwich is itself the zoo''s own argument (see the note on $\mathrm{s}$), so this value inherits its status.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional. The lower end also inherits the provenance of $\mathrm{s}$ on this page.'}
    - {measure: s1, value: '\Theta(n)', putative: true, note: 'The $\mathrm{s} = \Theta(n)$ witness on this page is a $1$-input, so the maximum is carried by the $1$-side: $\mathrm{s}^1 \ge (R-1)\log_2 R = n/2 - O(\log n)$. Exhaustive check at $R=4$, $N=8$: $\mathrm{s}^1 = 6 = (R-1)\log_2 R$.'}
    - {measure: s0, value: '\Theta(n/\log n)', putative: true, note: 'A factor $\log n$ below $\mathrm{s}^1$. Upper: at a $0$-input, a single flip can only change one slot, so it can only add one value to the range; hence exactly one value $u$ may be missing and each slot has at most one sensitive bit, giving $\mathrm{s}^0 \le N = \Theta(n/\log n)$. Lower: take $u = 0^r$, cover the $R-1-r$ values of Hamming weight $\ge 2$ with one slot each and fill the remaining $N-R+1+r$ slots with duplicated weight-one values; flipping the single $1$ of any of those slots produces $u$ and loses nothing. Exhaustive check at $R=4$, $N=8$: $\mathrm{s}^0 = 7 = N-R+1+r$.'}
    - {measure: bs1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}^1(f) \le \mathrm{bs}^1(f) \le n$, with $\mathrm{s}^1 = \Theta(n)$ here. (At $R=4$, $N=8$ the exhaustive value is $\mathrm{bs}^1 = 8 = n/2 = \mathrm{C}^1$.)'}
    - {measure: bs0, value: '\Theta(n/\log n)', putative: true, note: 'Upper: a sensitive block $B$ at a $0$-input must create every missing value, so fix one missing $u$ and map $B$ to the least slot $i$ with $(x\oplus B)_i = u$; two *disjoint* blocks cannot share that slot, since both would have to restrict to the same nonzero pattern $x_i \oplus u$ there. Hence $\mathrm{bs}^0 \le N$. Lower: $\mathrm{s}^0 = \Theta(N)$. So $\mathrm{bs}^0 = \Theta(N) = \Theta(n/\log n)$, and the block-sensitivity asymmetry matches the certificate asymmetry $\mathrm{C}^0 = N$ against $\mathrm{C}^1 = n/2$.'}
    - {measure: Cmin, value: '\Theta(n/\log n)', putative: true, note: 'Upper: $\mathrm{C}_{\min} \le \mathrm{C}^0 = N$. Lower: in any certificate at most $R-1$ slots can be left entirely unfixed -- $R$ free slots could be set to $1,\dots,R$ and make the input surjective -- so every certificate touches at least $N-R+1 = R+1$ slots, and $\mathrm{C}_{\min} \ge R+1 = \Theta(N)$. The $1$-side is more expensive ($\mathrm{C}^1 = n/2$), so the minimum is attained on $0$-inputs.'}
    - {measure: EC, value: '\Theta(n)', note: 'Squeezed between $\mathrm{fbs}(f) \le \mathrm{EC}(f) \le \mathrm{C}(f)$, both $\Theta(n)$ here.'}
    - {measure: UC, value: '\Theta(n)', note: 'Squeezed between $\mathrm{C}(f) \le \mathrm{UC}(f) \le \mathrm{D}(f)$, with $\mathrm{C} = \Theta(n)$ and $\mathrm{D} = n$.'}
    - {measure: SP, value: '\Theta(n)', note: 'Squeezed between $\mathrm{C}(f) \le \mathrm{SP}(f) \le \mathrm{D}(f)$, with $\mathrm{C} = \Theta(n)$ and $\mathrm{D} = n$.'}
    - {measure: Dna, value: 'n', note: 'Every bit is relevant -- permute the list so that the slot in question holds a uniquely-occurring value, and flipping any of its bits changes the answer -- so for a total function the non-adaptive cost is the full $n$. Consistent with $\mathrm{D} = \mathrm{D}^{\mathrm{na}} = n$: adaptivity buys nothing here.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}(f) \le \mathrm{R}^{\mathrm{na}}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with $\mathrm{R} = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}} = n$ here.'}
    - {measure: Dmu, value: '\Theta(n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon = \Theta(n)$.'}
    - {measure: QE, value: '\tilde\Theta(n)', note: 'Sandwiched: $\mathrm{Q}_{\varepsilon}(f) \le \mathrm{Q}_{\mathrm{E}}(f) \le \mathrm{D}(f)$, with $\mathrm{Q}_{\varepsilon} = \tilde\Theta(n)$ and $\mathrm{D} = n$ here.'}
    - {measure: Q0, value: '\tilde\Theta(n)', note: 'Sandwiched: $\mathrm{Q}_{\varepsilon}(f) \le \mathrm{Q}_{0}(f) \le \mathrm{Q}_{\mathrm{E}}(f)$, both $\tilde\Theta(n)$ here.'}
    - {measure: Advpm, value: '\tilde\Theta(n)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \tilde\Theta(n)$ here.'}
    - {measure: gamma2, value: '\tilde\Theta(n)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \tilde\Theta(n)$ here.'}
    - {measure: MAdv, value: '\tilde\Theta(n)', note: 'Same sandwich as [[Advpm]]: the multiplicative adversary is also a tight characterisation of $\mathrm{Q}$.'}
    - {measure: QC, value: '\Theta(\sqrt n)', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{FC}(f)})$ ([[QC]] vs [[FC]]), and $\mathrm{FC} = \Theta(n)$ here.'}
    - {measure: Adv, value: 'O(n/\sqrt{\log n})', putative: true, note: 'The certificate-complexity barrier: $\mathrm{Adv}(f) \le \sqrt{\mathrm{C}^0(f)\,\mathrm{C}^1(f)}$ for total $f$, and here that is $\sqrt{N \cdot n/2} = \Theta(n/\sqrt{\log n})$. Only a $\sqrt{\log n}$ factor short of $\mathrm{Q}$, so unlike [[ElementDistinctness]] and [[Collision]] the positive-weights adversary is *not* badly broken on surjectivity -- but it cannot reach $\mathrm{Q} = \tilde\Theta(n)$ either. A floor: $\mathrm{Adv} \ge \lambda \ge \sqrt{\mathrm{s}} = \Omega(\sqrt n)$.'}
    - {measure: lambda, value: '\Omega(\sqrt n),\ O(n/\sqrt{\log n})', putative: true, note: 'Lower: $\lambda \ge \sqrt{\mathrm{s}} = \Omega(\sqrt n)$ -- a star of degree $\mathrm{s}$ sits inside the sensitivity graph -- which here is the same bound Huang''s $\lambda \ge \sqrt{\deg}$ gives, since $\deg = n$. Upper: the sensitivity graph is bipartite between $0$- and $1$-inputs with side degrees $\mathrm{s}^0$ and $\mathrm{s}^1$, so $\lambda \le \sqrt{\mathrm{s}^0\mathrm{s}^1} = \sqrt{\Theta(n/\log n)\cdot\Theta(n)} = O(n/\sqrt{\log n})$ -- the same ceiling the certificate barrier puts on $\mathrm{Adv}$, and for the same asymmetry reason. Which end is the truth is open.'}
    - {measure: Np, value: '\tilde\Theta(n)', note: 'Between $\mathrm{R} = \Theta(n)$ and $O(\mathrm{R}\log \mathrm{R}) = O(n\log n)$ ([[Np]] vs [[R]]).'}
    - {measure: robustQ, value: '\tilde\Theta(n)', note: 'Between $\mathrm{Q} = \tilde\Theta(n)$ and the universal ceiling $\mathrm{Q}^{\mathrm{rob}} \le O(n)$ of Buhrman-Newman-Röhrig-de Wolf, who recover all $n$ bits from $O(n)$ noisy queries. Noise is free here because the problem is already maximally hard.'}
    - {measure: D_size, value: '\Omega(2^{n/\log n}),\ O(2^n)', putative: true, note: 'Lower: a tree with $L$ leaves has one at depth $\le \log_2 L$ (Kraft), and a leaf at depth $t$ is a certificate of size $t$, so $\log_2 L \ge \mathrm{C}_{\min} = \Theta(n/\log n)$. Upper: the complete tree. The $\log n$ in the exponent is exactly the gap between $\mathrm{C}_{\min} = \Theta(N)$ and $\mathrm{D} = n = N\log_2 R$, i.e. the fact that a $0$-certificate spends one bit per slot rather than $\log R$.'}
    - {measure: Inf, value: '2^{-\Theta(n/\log n)}', putative: true, note: 'Exponentially small, because surjectivity is exponentially rare: $N = 2R$ uniform draws into $R$ bins cover them all with probability $p = e^{-\Theta(R)} = 2^{-\Theta(n/\log n)}$, and the uniform measure on $\{0,1\}^n$ *is* the uniform measure on lists since $R$ is a power of two. Upper: $\mathrm{Inf}_i \le \Pr[f(x)=1]+\Pr[f(x^{\oplus i})=1] = 2p$, so $\mathrm{I}(f) \le 2np = 2^{-\Theta(n/\log n)}$. Lower: Poincare, $\mathrm{I}(f) \ge \mathrm{Var}(f) = 4p(1-p) = \Theta(p)$. So $\mathrm{I} = \Theta(1)$ fails badly while $\mathrm{D} = n$: total influence says nothing about query complexity for biased functions.'}
    - {measure: Inf1, value: '2^{-\Theta(n/\log n)}', note: 'For Boolean-valued $f$ the $L_1$ and $L_2$ influences coincide ([[Inf1]]), so this is the $\mathrm{I}(f)$ row verbatim.'}
    - {measure: MaxInf, value: '2^{-\Theta(n/\log n)}', note: 'Between $\mathrm{I}(f)/n$ and $\mathrm{I}(f)$, both $2^{-\Theta(n/\log n)}$ since the factor $n$ is swallowed by the exponent.'}
    - {measure: Var, value: '2^{-\Theta(n/\log n)}', note: 'From $\mathrm{Var} = 2\,\mathrm{NS}_{1/2}$ and the [[NS]] entry. A uniform input is surjective with doubly negligible probability, so the whole Fourier picture is about the bias; the ratio to $\mathrm{MaxInf}$ is not pinned, so [[osss]] is not recorded.'}
    - {measure: RS, value: '\Theta(n)', refs: [BenDavidKothari18], putative: true, note: 'Upper: $\mathrm{RS}(f)\le\mathrm{R}(f)=\Theta(n)$ for total $f$ [BenDavidKothari18]. Lower: take the surjective input that puts value $v$ in slot $v$ for $v\le R$ and value $1$ in the other $R$ slots. Starring any one bit of any of the first $R$ slots sabotages it: flipping that bit turns slot $v$ into a slot holding some other value $w\ne v$, which is still covered elsewhere, so the value $v$ goes missing and surjectivity flips. Those $R\log_2 R=\Theta(n)$ sabotaged inputs share one base assignment and each has a unique star, so finding a star is finding a marked coordinate among $\Theta(n)$.'}
    - {measure: noisyR, value: '\Theta(n)', refs: [CKMPSS23, BenDavidBlais20composition], note: '$\mathrm{noisyR}\le\mathrm{R}=\Theta(n)$ [BenDavidBlais20composition], and here $\mathrm{R}=\Theta(n)$ is $\Theta(\text{arity})$, which forces $\mathrm{noisyR}=\Theta(\mathrm{R})$ [CKMPSS23]. Cheap biased queries do not help: the hard part is coverage, not accuracy.'}
    - {measure: D_prod, value: '\Theta(n)', refs: [Sanyal24], conf: medium, putative: true, note: 'Upper: $\mathrm{D}^{\mathrm{prod}}\le\mathrm{R}=\Theta(n)$ (also $\widetilde O(\mathrm{RS})$ [Sanyal24]). Lower: point masses are product measures, so fix slots $1,\dots,R-1$ to the values $1,\dots,R-1$ and give each of the remaining $R+1$ slots independent bits, each $1$ with probability $1-1/\log_2 R$ except the last, which is $1$ with probability $e/(R+1)$. Then a free slot equals the one uncovered value (the all-ones codeword) with probability $1/(R+1)$, so the answer is balanced, and resolving one free slot costs $\Theta(\log R)$ bits in expectation because a $0$ is rare. Any tree must resolve a constant fraction of the $R+1$ slots, giving $\Omega(R\log R)=\Omega(n)$.'}
    - {measure: deg2, value: '\Theta(n)', putative: true, note: 'Restrict: fix slots $1,\dots,R-1$ to the values $1,\dots,R-1$, encode the remaining value $R$ by the all-ones codeword, and leave the other $R+1$ slots free. Any non-all-ones codeword names an already covered value, so the restriction is exactly $\mathrm{OR}_{R+1}\circ\mathrm{AND}_{\log_2 R}$ on $(R+1)\log_2 R=\Theta(n)$ free bits. Over $\mathbb{F}_2$ that is $1+\prod_i(1+\prod_j x_{ij})$, whose top monomial is the product of every free bit, so $\deg_2\ge(R+1)\log_2 R$. Mod-$2$ degree never increases under restriction, and $\deg_2\le n$.'}
    - {measure: degp, value: '\Theta(n)', putative: true, note: 'Same restriction as [[deg2]]: over $\mathbb{F}_p$ the restriction $\mathrm{OR}_{R+1}\circ\mathrm{AND}_{\log_2 R}$ is $1-\prod_i(1-\prod_j x_{ij})$, whose top monomial has coefficient $\pm1\ne0$, so $\deg_p\ge(R+1)\log_2 R=\Theta(n)$; and $\deg_p\le\deg=n$.'}
    - {measure: PDT, value: '\Theta(n)', note: 'A depth-$t$ parity tree writes $f$ over $\mathbb{F}_2$ as a sum of products of at most $t$ affine forms, so $\deg_2\le\mathrm{D}^{\oplus}$; with $\deg_2=\Theta(n)$ and $\mathrm{D}^{\oplus}\le\mathrm{D}=n$ there is no room. Parity queries buy nothing on surjectivity.'}
    - {measure: Fdim, value: '\Theta(n)', note: '$\mathrm{D}^{\oplus}(f)\le\dim_{\mathbb{F}_2}(f)\le n$ ([[Fdim]] vs [[PDT]]), and $\mathrm{D}^{\oplus}=\Theta(n)$ here.'}
    - {measure: spar, value: '2^{\Theta(n)}', putative: true, note: 'Sparsity never increases under restriction, since the Fourier support of a restriction is a projection of the original support. On the restriction of the [[deg2]] entry, $\pm1$-valued $f=1-2\prod_i(1-\mathrm{AND}_{\log_2 R})$: the blocks are disjoint, every one of the $2^{\log_2 R}$ coefficients of $1-\mathrm{AND}$ is nonzero, and coefficients multiply, so the product has $2^{(R+1)\log_2 R}=2^{\Theta(n)}$ nonzero coefficients. The ceiling is $2^n$.'}
    - {measure: L1, value: '2^{\Omega(n/\log n)},\ O(2^n)', note: 'On the restriction of the [[deg2]] entry the spectral norm multiplies over the disjoint blocks: $\hat L_1(\prod_i(1-\mathrm{AND}_s))=(2-2^{1-s})^{R+1}$ with $s=\log_2 R$, and $\hat L_1(1-2P)\ge2\hat L_1(P)-1$, so $\hat L_1\ge2^{\Omega(R)}=2^{\Omega(n/\log n)}$. Restriction can only decrease $\hat L_1$. The ceiling is $\hat L_1\le2^{\mathrm{D}}=2^n$ ([[L1]] vs [[D]]).'}
    - {measure: NS, value: '2^{-\Theta(n/\log n)}', note: 'Sandwiched by the two recorded influence values: $\delta\,\mathrm{MaxInf}\le\mathrm{NS}_\delta\le\delta\,\mathrm{Inf}$, and both $\mathrm{Inf}$ and $\mathrm{MaxInf}$ are $2^{-\Theta(n/\log n)}$ here. A random list of $N$ elements of $[R]$ is almost never surjective, and it takes a coordinated flip to change that.'}
    - {measure: Stab, value: '1 - 2^{-\Theta(n/\log n)}', note: '$\mathrm{Stab}_\rho=1-2\,\mathrm{NS}_\delta$ at $\rho=1-2\delta$ in the $\pm1$ normalisation, and $\mathrm{NS}_\delta=2^{-\Theta(n/\log n)}$. Surjectivity is a near-constant function on the uniform measure, so it is as stable as a constant to within its tiny bias.'}
    - {measure: UCmin, value: '\Omega(n/\log n),\ O(n)', refs: [BHT17], note: '$\mathrm{UC}^b\ge\mathrm{C}^b$ on each side, so $\mathrm{UC}_{\min}\ge\min\{\mathrm{C}^0,\mathrm{C}^1\}=\Theta(n/\log n)$, and $\mathrm{UC}_{\min}\le\mathrm{UC}=\Theta(n)$. Which side is cheaper is exactly the open part: the $0$-certificates are the short ones.'}
    - {measure: cjdeg, value: '\tilde\Omega(n^{3/4}),\ O(n)', note: '$\widetilde{\deg}_\varepsilon\le\mathrm{cjdeg}_\varepsilon\le\mathrm{R}_\varepsilon$ ([[cjdeg]] vs [[adeg]], [[cjdeg]] vs [[R]]), with $\widetilde{\deg}=\tilde\Theta(n^{3/4})$ [BKT18] and $\mathrm{R}=\Theta(n)$. Closing this would settle whether the conical junta relaxation sees the $n^{3/4}$ barrier or the true randomized cost.'}
    - {measure: odeg, value: '\tilde\Omega(\sqrt n),\ \tilde O(n^{3/4})', note: '$\mathrm{sdeg}\le\widetilde{\deg}_+\le\widetilde{\deg}$ ([[odeg]] vs [[adeg]], [[sdeg]] vs [[odeg]]), and the two ends are the recorded $\mathrm{sdeg}=\tilde\Theta(\sqrt n)$ and $\widetilde{\deg}=\tilde\Theta(n^{3/4})$.'}
    - {measure: ardeg, value: '\tilde\Omega(\sqrt n),\ \tilde O(n^{3/4})', refs: [MahadevdeWolf15], putative: true, note: 'Upper: $\mathrm{rdeg}_\varepsilon\le\widetilde{\deg}_\varepsilon$ ([[ardeg]] vs [[adeg]]). Lower: if $p/q$ approximates $f$ to $1/3$ with $q>0$, then $p-q/2$ has the sign of $f-1/2$ everywhere, so $\mathrm{sdeg}\le\mathrm{rdeg}_{1/3}$; and $\mathrm{sdeg}=\tilde\Theta(\sqrt n)$.'}
    - {measure: PostQ, value: '\tilde\Omega(\sqrt n),\ \tilde O(n^{3/4})', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon(f)=\Theta(\mathrm{rdeg}_\varepsilon(f))$ [MahadevdeWolf15], and the [[ardeg]] entry places approximate rational degree between $\tilde\Omega(\sqrt n)$ and $\tilde O(n^{3/4})$.'}
    - {measure: rdeg, value: '\Omega(n/\log n),\ O(n)', refs: [deWolf03], putative: true, note: '$\mathrm{rdeg}(f)=\max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}\le\mathrm{C}(f)=\Theta(n)$. For the lower end, restrict as in [[deg2]] but also fix all but one bit of each free slot to $1$: the restriction of $\bar f$ is $\mathrm{NOR}_{R+1}$, and a polynomial nonzero exactly at $0^t$ must be a multiple of $\prod_i(1-y_i)$, so $\mathrm{ndeg}(\bar f)\ge R+1=\Theta(n/\log n)$.'}
  witnesses:
    - {of: [Q, adeg], setting: total, statement: '$\mathrm{Q} = \tilde\Omega(\widetilde{\deg}^{4/3})$. Not the record separation -- cheat sheets give $\tilde\Omega(\widetilde{\deg}^4)$, matching the $O(\widetilde{\deg}^4)$ upper bound -- but per [BKT18] this is the only *natural* function known to separate the two at all.', refs: [BKT18]}
  notes: |
    In the element-query model, where one query returns a whole $x_i \in [R]$, the
    quantum bound is clean: $\mathrm{Q}(\mathrm{SURJ}_{N,N/2+1}) = \Theta(N)$
    [BeameMachmouchi12, Cor. 2]. The tildes above are an artefact of the binary
    encoding.
  refs: [Sherstov21, BKT18, BT22, BeameMachmouchi12, BunThaler21largeerror, SherstovThaler23, Sherstov18asymmetry]
  see_also: [adeg, Q, sdeg, cheatsheet, ElementDistinctness, KDistinctness]

- id: KDistinctness
  name: '$k$-distinctness'
  symbol: '\mathrm{DIST}^k_n'
  group: quantum
  order: 56
  kind: total
  arity: '$n$ symbols over an alphabet $[q]$ (element queries); $k$ is a constant'
  scale: {var: n}
  short: '$\mathrm{Q} = \Theta(n^{3/4 - 1/(4(2^k-1))})$, settled in 2026 after fourteen years; the approximate degree is still open.'
  definition: |
    Decide whether some symbol occurs at least $k$ times in the list. $k = 2$ is the
    complement of [[ElementDistinctness]]. On the indicator matrix of the list it is
    $\mathrm{OR}_q \circ \mathrm{THR}^k_n$ restricted to Hamming weight $\le n$.
  formal: '$$\mathrm{DIST}^k(x) \;=\; \bigvee_{i_1 < \cdots < i_k}\ [\,x_{i_1} = \cdots = x_{i_k}\,].$$'
  values:
    - {measure: Q, value: '\Theta\!\big(n^{3/4 - 1/(4(2^k-1))}\big)', refs: [Belovs12kdist, Belovs26kdist], conf: medium, note: 'For constant $k$ and alphabet size $q = \Omega(n^2)$. Upper: [Belovs12kdist], a learning graph of cost $O(n^{1 - 2^{k-2}/(2^k-1)})$ -- the same exponent, $2/3$ at $k=2$ and $5/7$ at $k=3$. Lower: [Belovs26kdist, Thm. 1.1], by a compressed-oracle framework that subsumes the polynomial method; the same paper recovers $\Omega(n^{2/3})$ for element distinctness (its Thm. 6.10). Marked medium confidence only because the lower bound is a 2026 preprint; the exponent matches the 2012 algorithm exactly. Earlier: $O(n^{k/(k+1)})$ by quantum walk [Ambainis07].'}
    - {measure: adeg, value: '\tilde\Omega\!\big(n^{3/4-1/(4k)}\big),\ O\!\big(n^{3/4-1/(4(2^k-1))}\big)', refs: [MTZ20, Sherstov21, BT22], conf: medium, note: 'Open, so recorded as a range. Lower: [MTZ20, Thm. 17 / Cor. 18] for $2 \le k \le \log^4 q$ -- the first proof that $4$-distinctness is strictly harder than element distinctness. Upper: [Sherstov21, Thm. 1.1], degree $O(\sqrt n \cdot \min\{n,q\}^{1/2 - 1/(4(1-2^{-k}))})$, and $\tilde O(n^{3/4})$ for all $k \le \mathrm{polylog}(n)$ [MTZ20, Thm. 2]. The 2026 quantum lower bound does *not* transfer: [BT22] ask exactly how fast $\widetilde{\deg}$ approaches $n^{3/4}$ and it is still open.'}
    - {measure: R, value: '\Theta(n)', note: 'Read everything; the lower bound is the usual hybrid argument in the element-query model.'}
    - {measure: D, value: 'n', note: 'Element-query model.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.', conf: medium}
    - {measure: R0, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.', conf: medium}
    - {measure: R1, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with $\mathrm{R}_{\varepsilon}(f) = \Theta(n)$ and $\mathrm{D}(f) = n$ here.', conf: medium}
    - {measure: Advpm, value: '\Theta\!\big(n^{3/4 - 1/(4(2^k-1))}\big)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta\!\big(n^{3/4 - 1/(4(2^k-1))}\big)$ here.', conf: medium}
    - {measure: gamma2, value: '\Theta\!\big(n^{3/4 - 1/(4(2^k-1))}\big)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta\!\big(n^{3/4 - 1/(4(2^k-1))}\big)$ here.', conf: medium}
    - {measure: MAdv, value: '\Theta\!\big(n^{3/4 - 1/(4(2^k-1))}\big)', note: '$\mathrm{MAdv}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[MAdv]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta\!\big(n^{3/4 - 1/(4(2^k-1))}\big)$ here.', conf: medium}
    - {measure: C1, value: 'k', putative: true, note: 'Exhibit the $k$ positions carrying a repeated symbol. Counting a query as one symbol read, as throughout this entry and [[ElementDistinctness]].'}
    - {measure: C0, value: 'n', putative: true, note: 'Take a $0$-input in which one symbol occurs exactly $k-1$ times and everything else is distinct. Leave any other position unread and it could be overwritten with that symbol, completing a $k$-fold repeat; so the certificate must read all $n$ symbols.'}
    - {measure: C, value: 'n', note: '$\mathrm{C} = \max(\mathrm{C}^0,\mathrm{C}^1) = \max(n,k) = n$.'}
    - {measure: Cmin, value: 'k', putative: true, note: 'The cheapest certificate anywhere is a $k$-fold repeat; every $0$-input costs $n$.'}
    - {measure: s1, value: 'k', putative: true, note: 'At a $1$-input every sensitive position must destroy *every* $k$-fold repeat, so it lies in all of them; a $1$-input with a single $k$-group therefore has sensitivity exactly $k$, and no $1$-input has more. The same argument caps $\mathrm{bs}^1$.'}
    - {measure: bs1, value: 'k', putative: true, note: 'Disjoint sensitive blocks at a $1$-input must each meet every $k$-group, and a $k$-group has only $k$ positions, so $\mathrm{bs}^1 \le k$; the single-$k$-group input attains it.'}
    - {measure: s0, value: '\Theta(n)', putative: true, note: 'On the $0$-input of the $\mathrm{C}^0$ note, overwriting any of the $n-k+1$ positions outside the $(k-1)$-group with that group''s symbol flips the answer. So the sensitivity is wildly asymmetric: $\Theta(n)$ on $0$-inputs against $k$ on $1$-inputs.'}
    - {measure: s, value: '\Theta(n)', note: '$\mathrm{s} = \max(\mathrm{s}^0,\mathrm{s}^1) = \Theta(n)$.'}
    - {measure: bs0, value: '\Theta(n)', note: 'The $n-k+1$ singleton blocks of the $\mathrm{s}^0$ note are disjoint, and $\mathrm{bs}^0 \le n$.'}
    - {measure: bs, value: '\Theta(n)', note: '$\mathrm{s} \le \mathrm{bs} \le n$.'}
    - {measure: fbs, value: '\Theta(n)', note: 'Between $\mathrm{bs} = \Theta(n)$ and $n$.'}
    - {measure: FC, value: '\Theta(n)', note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: RC, value: '\Theta(n)', note: '$\mathrm{RC} = \Theta(\mathrm{FC}) = \Theta(n)$.'}
    - {measure: EC, value: '\Theta(n)', note: 'Squeezed between $\mathrm{fbs} = \Theta(n)$ and $\mathrm{C} = n$.'}
    - {measure: UC, value: 'n', note: 'Squeezed between $\mathrm{C} = n$ and $\mathrm{D} = n$.'}
    - {measure: SP, value: 'n', note: 'Squeezed between $\mathrm{C} = n$ and $\mathrm{D} = n$.'}
    - {measure: CA, value: '\Theta(n)', note: '$\mathrm{CA} = \Theta(\mathrm{fbs}) = \Theta(n)$; also capped by $\mathrm{R} = \Theta(n)$. The *classical* adversary is tight here even though the positive quantum adversary is not.'}
    - {measure: Adv, value: 'O(\sqrt n)', putative: true, note: 'The certificate barrier $\mathrm{Adv}(f) \le \sqrt{\mathrm{C}^0 \mathrm{C}^1} = \sqrt{nk} = O(\sqrt n)$ for constant $k$ -- so the positive-weights adversary cannot even reach the $\Omega(n^{2/3})$ of [[ElementDistinctness]], let alone the true exponent. This is why every lower bound in the row above goes through the polynomial method or a compressed oracle.'}
    - {measure: QC, value: '\Theta(\sqrt n)', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{FC}(f)})$, and $\mathrm{FC} = \Theta(n)$ here. Note this is *below* $\mathrm{Q}$, as it must be -- quantum certificate complexity is not a lower bound on $\mathrm{Q}$ in any useful sense here.'}
    - {measure: Dna, value: 'n', note: 'Every symbol is relevant, so a non-adaptive algorithm reads all of them; $\mathrm{D} = n$ anyway.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Sandwiched between $\mathrm{R} = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}} = n$.'}
    - {measure: Dmu, value: '\Theta(n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon = \Theta(n)$.'}
    - {measure: CGpub, value: '\Theta(n)', refs: [CGLMSG23], note: 'Squeezed between $\mathrm{fbs} = \Theta(n)$ and $\mathrm{C} = n$; equivalently $\Theta(\mathrm{CA})$, which is also $\Theta(n)$ here.'}
    - {measure: CGstar, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CG, value: '\Theta(n)', refs: [CGLMSG23], note: 'For constant $k$ the correct sandwich $\mathrm{R}_0 \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ [CGLMSG23] closes: $\mathrm{R}_0 = \Theta(n)$ and $\mathrm{C}^0\mathrm{C}^1 = n \cdot k = \Theta(n)$. The value happens to agree with the one previously recorded, but the old justification -- $\mathrm{CG} \le \mathrm{D}$ -- is false in general: $\mathrm{CG}$ can exceed the arity, as it does for $\oplus_n$. For growing $k$ the ceiling degrades to $O(nk)$.'}
    - {measure: chi, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \chi(g) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: chibar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\chi}(g) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: LR, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: Rstar, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: prt, value: '\Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(n)$ here.'}
    - {measure: rprt, value: '\Theta(n)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{D}(f)$, with both ends $\Theta(n)$ here. As on [[Surjectivity]], the lower end rests on the observation that the [JainKlauck10] arguments survive the relaxation of the completeness constraint; the upper end is unconditional.', refs: [JainKlauck10]}
    - {measure: Np, value: '\tilde\Theta(n)', note: 'Between $\mathrm{R} = \Theta(n)$ and $O(\mathrm{R}\log \mathrm{R}) = O(n\log n)$ ([[Np]] vs [[R]]).'}
    - {measure: robustQ, value: '\tilde\Theta\!\big(n^{3/4 - 1/(4(2^k-1))}\big)', note: 'Between $\mathrm{Q}$ and $O(\mathrm{Q}\log \mathrm{Q})$ ([[robustQ]] vs [[Q]]), and $\mathrm{Q} = \Theta(n^{3/4-1/(4(2^k-1))})$ by the row above. Even the fourteen-year-old exponent is noise-robust up to a log.'}
    - {measure: Q0, value: '\Omega\!\big(n^{3/4 - 1/(4(2^k-1))}\big),\ O(n)', note: 'Only the generic $\mathrm{Q}_{\varepsilon} \le \mathrm{Q}_0 \le \mathrm{D}$. Zero error is *not* obviously free here, unlike on the search problems in this file: a $k$-collision found is a $k$-element certificate, but certifying that *no* symbol repeats $k$ times costs $\mathrm{C}^0 = n$, so a zero-error algorithm must be right on $0$-inputs with certainty.'}
    - {measure: QE, value: '\Omega\!\big(n^{3/4 - 1/(4(2^k-1))}\big),\ O(n)', note: 'Same window as $\mathrm{Q}_0$, which it contains: $\mathrm{Q}_0 \le \mathrm{Q}_{\mathrm{E}} \le \mathrm{D} = n$. The usual $\mathrm{Q}_{\mathrm{E}} \ge \deg/2$ route is unavailable because $\deg(\mathrm{DIST}^k)$ is itself not recorded.'}
    - {measure: RS, value: '\Theta(n)', refs: [BenDavidKothari18], putative: true, note: 'Upper: $\mathrm{RS}\le\mathrm{R}=\Theta(n)$ [BenDavidKothari18]. Lower: take the input consisting of $n/(k-1)$ values each repeated exactly $k-1$ times -- a $0$-input with no room to spare. Starring any single symbol sabotages it: left alone its group stays at $k-1$ copies, changed to another group it makes that group $k$. So all $n$ symbols are sabotage positions over one base input, and finding the $\ast$ is finding a marked symbol among $n$.'}
    - {measure: noisyR, value: '\Theta(n)', refs: [CKMPSS23, BenDavidBlais20composition], note: '$\mathrm{noisyR}\le\mathrm{R}$ [BenDavidBlais20composition], and $\mathrm{R}=\Theta(n)=\Theta(\text{arity})$ forces equality [CKMPSS23].'}
    - {measure: D_prod, value: '\Theta(n)', conf: medium, putative: true, note: 'Upper: $\mathrm{D}^{\mathrm{prod}}\le\mathrm{R}=\Theta(n)$. Lower: fix (point masses are product measures) $n/2$ symbols as $m=n/(2(k-1))$ groups of $k-1$ copies of distinct values $a_1,\dots,a_m$; let free symbol $j$ independently be $a_{j\bmod m}$ with probability $1/M$ and otherwise a private value $b_j$ used nowhere else, where $M=n/2$. No accidental collision is possible, so the instance is a $1$-input exactly when some free symbol picks its $a$, an $\mathrm{OR}$ of $M$ independent events of probability $1/M$. Any tree that leaves a constant fraction of the free symbols unread errs with constant probability, so $\mathrm{D}^\mu=\Omega(n)$. Alphabet size $m+M=O(n)$ suffices.'}
    - {measure: cjdeg, value: '\tilde\Omega\!\big(n^{3/4-1/(4k)}\big),\ O(n)', note: '$\widetilde{\deg}_\varepsilon\le\mathrm{cjdeg}_\varepsilon\le\mathrm{R}_\varepsilon$ ([[cjdeg]] vs [[adeg]], [[cjdeg]] vs [[R]]), taking the lower end from the recorded approximate degree and the upper end from $\mathrm{R}=\Theta(n)$.'}
    - {measure: ardeg, value: 'O\!\big(n^{3/4 - 1/(4(2^k-1))}\big)', note: '$\mathrm{rdeg}_\varepsilon\le\widetilde{\deg}_\varepsilon$ ([[ardeg]] vs [[adeg]]), and the recorded approximate degree upper bound is the tight quantum one. No lower bound is recorded: the sign degree of $k$-distinctness is not known here, so the $\mathrm{sdeg}\le\mathrm{rdeg}_{1/3}$ route gives nothing.'}
    - {measure: PostQ, value: 'O\!\big(n^{3/4 - 1/(4(2^k-1))}\big)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15]; see [[ardeg]]. Equivalently, post-selection is at least as strong as the plain quantum algorithm, whose cost is $\Theta(n^{3/4-1/(4(2^k-1))})$.'}
    - {measure: D_size, value: '2^{\Theta(n\log n)}', conf: medium, putative: true, note: 'For $q\ge n$ (so that the all-distinct inputs exist) every $0$-input needs all $n$ symbols read, since $\mathrm{C}^0=n$, so distinct $0$-inputs end at distinct leaves; the $n!$ orderings of $n$ fixed distinct values already give $\mathrm{DTsize}\ge n!=2^{\Theta(n\log n)}$. The ceiling is $q^n$, which matches for $q=\mathrm{poly}(n)$.'}
  witnesses:
    - {of: [R, Q], setting: total, statement: 'A family of total functions with $\mathrm{R} = \Theta(\mathrm{Q}^{1/(3/4 - 1/(4(2^k-1)))})$, approaching $\mathrm{R} = \mathrm{Q}^{4/3}$ as $k \to \infty$ -- over a large alphabet, so not a Boolean-input separation.', refs: [Belovs26kdist]}
  notes: |
    Open, per [Belovs26kdist, §7]: the approximate degree; alphabets smaller than
    $n^2$; non-constant $k$; and removing the "$\Omega(n)$ singletons" assumption on
    the input distribution. The framework is explicitly incomparable to the
    Liu-Zhandry compressed-oracle results, which fix a uniformly random input.
  refs: [Belovs12kdist, Belovs26kdist, MTZ20, Sherstov21, BT22, Ambainis07]
  see_also: [ElementDistinctness, Q, adeg, Collision]

- id: TriangleFinding
  name: Triangle finding
  symbol: '\mathrm{TRI}_m'
  group: quantum
  order: 57
  kind: total
  arity: 'the adjacency matrix of a graph on $m$ vertices: $n = \binom m2 = \Theta(m^2)$ bits'
  scale: {var: m, subs: {n: '\binom m2'}}
  short: 'The flagship open problem of quantum query complexity: $\Omega(m)$ against $O(m^{5/4})$, stuck for twenty years.'
  definition: |
    Does the input graph contain a copy of $K_3$? One query reveals one entry of the
    adjacency matrix. Detection and finding have the same complexity up to constants
    here, since the problem carries no promise [CGP26, Lem. 3.4].

    Values below are stated in the number of *vertices* $m$, as the literature does;
    in the zoo's convention $n = \binom m2$ input variables, so $m = \Theta(\sqrt n)$.
  formal: '$$\mathrm{TRI}_m(x) \;=\; \bigvee_{u<v<w}\ x_{uv} \wedge x_{vw} \wedge x_{uw}.$$'
  values:
    - {measure: Q, value: '\Omega(m),\ O(m^{5/4})', refs: [CLM20, LeGall14, LMS13, Belovs12span, MSS07], conf: medium, note: 'Open. Best upper bound $O(m^{5/4})$ with no log factors [CLM20], after $\tilde O(m^{5/4})$ by combinatorial arguments [LeGall14, Thm. 1.1]. The ladder: $O(m^{3/2})$ by Grover, $\tilde O(m^{13/10})$ [MSS07, Thm. 4], $O(m^{35/27})$ [Belovs12span, Thm. 8], $O(m^{9/7})$ [LMS13, Thm. 7], also $\tilde O(m^{9/7})$ by nested quantum walks [JKM13]. The only lower bound is the trivial $\Omega(m)$ from a Grover search embedded in one bipartite block [CGP26, Lem. 3.3(3)]. Still open as of August 2026.'}
    - {measure: R, value: '\Theta(m^2) = \Theta(n)', refs: [CGP26], note: '[CGP26, Lem. 3.3(3)] proves $\mathrm{R} = \Theta(m^2)$ for every subgraph-containment problem whose pattern keeps an edge after pinning, by embedding classical search over the $\binom m2$ pairs. Often asserted without citation, e.g. [LeGall14, §1].'}
    - {measure: D, value: '\binom m2 = n', refs: [Bollobas76, CKS02], note: 'Evasive for every $m$: containing $K_k$ is elusive for all $2 \le k \le m$ [Bollobas76]. (Kahn-Saks-Sturtevant gives evasiveness of monotone properties only for prime-power $m$; Chakrabarti-Khot-Shi handle general patterns only along an arithmetic progression.)'}
    - {measure: C1, value: '3', refs: [MSS07], note: 'Name the three edges. This is the whole difficulty: with $N$ variables and $1$-certificates of size $K$, no positive-weight adversary can prove more than $\Omega(\sqrt{NK})$ [MSS07, §1], which for $N = m^2$, $K = 3$ is exactly the $\Omega(m)$ already on record.'}
    - {measure: C0, value: '\binom m2 = n', putative: true, note: 'The complete bipartite graph $K_{\lceil m/2\rceil,\lfloor m/2\rfloor}$ is a *maximal* triangle-free graph, so any unfixed pair could be set to $1$ and create a triangle; a $0$-certificate must fix every variable.'}
    - {measure: s, value: '\Theta(m^2) = \Theta(n)', putative: true, note: 'On that same $K_{m/2,m/2}$ all $2\binom{\lfloor m/2\rfloor}{2} = \Theta(m^2)$ non-edges are sensitive, and $\mathrm{s} \le \binom m2$. Note the asymmetry: on a $1$-input with a single triangle and nothing else, $\mathrm{s} = 3$, so it is $\mathrm{s}^0$ that carries the maximum.'}
    - {measure: bs, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s} \le \mathrm{bs} \le \mathrm{C} \le \binom m2$.'}
    - {measure: fbs, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{fbs}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: RC, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{RC}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: FC, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{FC}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: Rbar, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\mathrm{R}}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: chi, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \chi(g) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: chibar, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \bar{\chi}(g) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: LR, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{LR}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: Rstar, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{bs}(f) \le \mathrm{R}^{*}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: CA, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{CA}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: CGpub, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{CG}^{\mathrm{pub}}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: prt, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}(f) \le \mathrm{prt}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here.'}
    - {measure: rprt, value: '\Theta(m^2) = \Theta(n)', conf: medium, note: 'Sandwiched: $\mathrm{s}(f) \le \overline{\mathrm{prt}}_{\varepsilon}(f) \le \mathrm{R}_{\varepsilon}(f)$, with both ends $\Theta(m^2) = \Theta(n)$ here. The lower end is the zoo''s own observation that the [JainKlauck10] techniques survive the relaxation of the completeness constraint (see the $\mathrm{RC}\to\overline{\mathrm{prt}}$ record); the upper end is unconditional.'}
    - {measure: C, value: '\binom m2 = n', note: '$\mathrm{C} = \max(\mathrm{C}^0,\mathrm{C}^1) = \max(\binom m2, 3)$.'}
    - {measure: s1, value: '3', putative: true, note: 'Sharp, and the whole story of this problem in one line. If two edges $e \ne f$ are both sensitive at a $1$-input then deleting either kills *every* triangle, so every triangle contains both; four sensitive edges are impossible and three must be a single triangle. Attained by a graph with exactly one triangle. Compare $\mathrm{s}^0 = \Theta(m^2)$.'}
    - {measure: bs1, value: '3', putative: true, note: 'Same argument as $\mathrm{s}^1$: every sensitive block must delete an edge of every triangle, so disjoint blocks inject into the $3$ edges of any one triangle.'}
    - {measure: s0, value: '\Theta(m^2) = \Theta(n)', putative: true, note: 'The maximum in the $\mathrm{s}$ entry is attained at the $0$-input $K_{\lceil m/2\rceil,\lfloor m/2\rfloor}$, so it is the $0$-side that carries it.'}
    - {measure: bs0, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{s}^0 \le \mathrm{bs}^0 \le \binom m2$, with $\mathrm{s}^0 = \Theta(m^2)$.'}
    - {measure: Cmin, value: '3', putative: true, note: 'A $1$-certificate is a triangle and cannot be smaller; every $0$-input costs $\binom m2$.'}
    - {measure: EC, value: '\Theta(m^2) = \Theta(n)', note: 'Squeezed between $\mathrm{fbs} = \Theta(m^2)$ and $\mathrm{C} = \binom m2$.'}
    - {measure: UC, value: '\binom m2 = n', note: 'Squeezed between $\mathrm{C} = \binom m2$ and $\mathrm{D} = \binom m2$.'}
    - {measure: SP, value: '\binom m2 = n', note: 'Squeezed between $\mathrm{C} = \binom m2$ and $\mathrm{D} = \binom m2$.'}
    - {measure: Dna, value: '\binom m2 = n', note: 'Every edge is relevant, so a non-adaptive deterministic algorithm reads the whole adjacency matrix -- which costs nothing extra, since the property is evasive.'}
    - {measure: Rna, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched between $\mathrm{R} = \Theta(m^2)$ and $\mathrm{D}^{\mathrm{na}} = \binom m2$.'}
    - {measure: Dmu, value: '\Theta(m^2) = \Theta(n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon = \Theta(m^2)$.'}
    - {measure: R0, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}_{0}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m^2)$ here.'}
    - {measure: R1, value: '\Theta(m^2) = \Theta(n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $\Theta(m^2)$ here.'}
    - {measure: CG, value: '\Theta(m^2) = \Theta(n)', refs: [CGLMSG23], note: 'Pinned by $\mathrm{R}_0 \le \mathrm{CG} \le \mathrm{C}^0\mathrm{C}^1$ [CGLMSG23]: a $1$-certificate is a single triangle, so $\mathrm{C}^1 = 3$ and the product is $\binom m2 \cdot 3 = \Theta(m^2)$, matching $\mathrm{R}_0 = \Theta(m^2)$ from below. Consistent with $\mathrm{Adv}^2 = \Theta(m^2)$. The lopsided certificate sizes are what make this one of the rare cases where $\mathrm{CG}$ stays at the arity; the old note justified it by the false $\mathrm{CG} \le \mathrm{D}$.'}
    - {measure: Adv, value: '\Theta(m)', putative: true, note: 'Pinned exactly, and it is the barrier in the $\mathrm{C}^1$ note made into a value. Upper: $\mathrm{Adv}(f) \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = \sqrt{3\binom m2} = O(m)$. Lower: restrict to $K_{\lceil m/2\rceil,\lfloor m/2\rfloor}$ with the $2\binom{\lfloor m/2\rfloor}{2} = \Theta(m^2)$ within-side pairs left free; adding any one of them closes a triangle, so the restriction *is* $\mathrm{OR}$ on $\Theta(m^2)$ variables, and $\mathrm{Adv}$ is monotone under restriction, giving $\mathrm{Adv} \ge \mathrm{Adv}(\mathrm{OR}_{\Theta(m^2)}) = \Omega(m)$. So the positive-weights adversary is stuck at the trivial bound for a structural reason, and any improvement on $\Omega(m)$ needs negative weights or a different method entirely.'}
    - {measure: lambda, value: '\Theta(m)', putative: true, note: 'Squeezed: $\sqrt{\mathrm{s}(f)} \le \lambda(f) \le \mathrm{Adv}(f)$, with $\mathrm{s} = \Theta(m^2)$ and $\mathrm{Adv} = \Theta(m)$. Spectral sensitivity is therefore a *tight* certificate that the positive adversary cannot go past $m$ here.'}
    - {measure: QC, value: '\Theta(m)', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{FC}(f)})$, and $\mathrm{FC} = \Theta(m^2)$ here.'}
    - {measure: adeg, value: '\Omega(m),\ O(m^{5/4})', note: 'Open, and open in exactly the same window as $\mathrm{Q}$. Upper: $\widetilde{\deg} \le 2\mathrm{Q} = O(m^{5/4})$ by the polynomial method applied to [CLM20]. Lower: $\widetilde{\deg} = \Omega(\sqrt{\mathrm{bs}}) = \Omega(m)$ by Nisan-Szegedy, which is all that is known -- the Bun-Kothari-Thaler machinery that settled $\widetilde{\deg}$ for [[Surjectivity]] and pushed [[KDistinctness]] has not been made to say anything here. Exact $\deg$ is left blank on purpose: the top Fourier coefficient $\sum_x(-1)^{|x|}\mathrm{TRI}_m(x)$ is nonzero for $3 \le m \le 7$ -- it is $-1, 3, -4, -3, -61$ -- but it is tiny compared with $2^{\binom m2}$ and nothing rules out its vanishing at larger $m$, so $\deg = \binom m2$ stays a conjecture.', refs: [CLM20]}
    - {measure: gamma2, value: '\Omega(m),\ O(m^{5/4})', note: 'The approximate $\gamma_2$ norm equals $\mathrm{Adv}^{\pm}$ up to constants ([[gamma2]] vs [[Advpm]]), so it inherits the open window too.'}
    - {measure: CGstar, value: '\Theta(m^2) = \Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: CGns, value: '\Theta(m^2) = \Theta(n)', refs: [CGLMSG23], note: 'All three of $\mathrm{CG}^{\mathrm{pub}}$, $\mathrm{CG}^{*}$ and $\mathrm{CG}^{\mathrm{ns}}$ collapse to $\Theta(\mathrm{CA})$ for every function (the non-signaling bottleneck, [[CGpub]] vs [[CGns]]), so this is the recorded $\mathrm{CG}^{\mathrm{pub}}$ value verbatim; only the private-coin [[CG]] can be larger.'}
    - {measure: Advpm, value: '\Omega(m),\ O(m^{5/4})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), so the general adversary inherits the open window verbatim: computing $\mathrm{Adv}^{\pm}(\mathrm{TRI}_m)$ *is* the triangle problem.'}
    - {measure: MAdv, value: '\Omega(m),\ O(m^{5/4})', note: 'Squeezed between $\mathrm{Adv}^{\pm}$, which the multiplicative adversary dominates, and $\mathrm{Q}$, which it lies below -- and those two have the same open window here. So the strengthening from additive to multiplicative buys nothing on the triangle problem either: any improvement would be an improvement to $\mathrm{Q}$.'}
    - {measure: robustQ, value: '\Omega(m),\ O(m^{5/4}\log m)', note: 'Between $\mathrm{Q}$ and $O(\mathrm{Q}\log \mathrm{Q})$ ([[robustQ]] vs [[Q]]), so the window is the $\mathrm{Q}$ window plus a log. Noise is not where the difficulty lies.'}
    - {measure: Np, value: '\tilde\Theta(m^2)', note: 'Between $\mathrm{R} = \Theta(m^2)$ and $O(\mathrm{R}\log \mathrm{R}) = O(m^2\log m)$ ([[Np]] vs [[R]]). Classically the problem is already maximally hard, so noise costs only a log.'}
    - {measure: Inf, value: '2^{-\Theta(m^2)}', putative: true, note: 'Exponentially small, because a uniform graph has a triangle with probability $1 - 2^{-\Theta(m^2)}$: the number of triangle-free graphs on $m$ vertices is $2^{(1/4+o(1))m^2}$ against $2^{\binom m2}$ in all. Write $q = \Pr[\mathrm{TRI}_m = 0]$. Upper: an edge is pivotal only if deleting it destroys every triangle, in particular only on graphs whose $\mathrm{TRI}$ value is $0$ after the flip, so $\mathrm{Inf}_e \le 2q$ and $\mathrm{I} \le 2\binom m2 q = 2^{-\Theta(m^2)}$. Lower: Poincare, $\mathrm{I} \ge \mathrm{Var} = \Theta(q)$. So on the uniform measure the triangle problem is invisible, which is why every lower bound for it argues against a planted distribution instead.'}
    - {measure: Inf1, value: '2^{-\Theta(m^2)}', note: 'For Boolean-valued $f$ the $L_1$ and $L_2$ influences coincide ([[Inf1]]), so this is the $\mathrm{I}(f)$ row verbatim.'}
    - {measure: MaxInf, value: '2^{-\Theta(m^2)}', note: 'Exactly $\mathrm{I}(f)/\binom m2$: $\mathrm{TRI}_m$ is edge-transitive, so every coordinate has the same influence. The $\binom m2$ is swallowed by the exponent.'}
    - {measure: Var, value: '2^{-\Theta(m^2)}', note: 'From $\mathrm{Var} = 2\,\mathrm{NS}_{1/2}$ and the [[NS]] entry: a uniform graph contains a triangle with probability $1-2^{-\Theta(m^2)}$.'}
    - {measure: RS, value: '\Theta(m^2)', refs: [BenDavidKothari18], putative: true, note: 'Upper: $\mathrm{RS}\le\mathrm{R}=\Theta(m^2)$ [BenDavidKothari18]. Lower: start from the complete bipartite graph $K_{m/2,m/2}$, which is triangle-free, and note that adding any one of the $2\binom{m/2}2=\Theta(m^2)$ missing intra-side edges creates a triangle, since two vertices on the same side always share a neighbour. Starring any one of those edges sabotages the input, so finding a $\ast$ is finding a marked coordinate among $\Theta(m^2)$.'}
    - {measure: noisyR, value: '\Theta(m^2)', refs: [CKMPSS23, BenDavidBlais20composition], note: '$\mathrm{noisyR}\le\mathrm{R}$ [BenDavidBlais20composition], and $\mathrm{R}=\Theta(m^2)=\Theta(\text{arity})$ forces $\mathrm{noisyR}=\Theta(\mathrm{R})$ [CKMPSS23].'}
    - {measure: D_prod, value: '\Theta(m^2)', conf: medium, putative: true, note: 'Upper: $\mathrm{D}^{\mathrm{prod}}\le\mathrm{R}=\Theta(m^2)$. Lower: the Erdos-Renyi measure $G(m,c/m)$ is a product distribution on the edge slots, and $c$ can be chosen so that a triangle exists with probability $1/2$. A tree of depth $\varepsilon m^2$ leaves a pair set that still spans $(1-3\varepsilon)\binom m3$ triples, each independently present with probability $c^3/m^3$, so conditioned on any transcript the posterior probability of a triangle in the unread part stays bounded away from $0$ and $1$.'}
    - {measure: deg2, value: '\Theta(m^2)', putative: true, note: 'Set every edge at vertex $1$ to $1$ and leave the rest free: the graph then has a triangle exactly when some edge survives among the other $m-1$ vertices, so the restriction is $\mathrm{OR}_t$ with $t=\binom{m-1}2$. Over $\mathbb{F}_2$, $\mathrm{OR}_t=1+\prod_i(1+x_i)$ has degree $t$, and mod-$2$ degree never increases under restriction; the ceiling is $\binom m2$.'}
    - {measure: degp, value: '\Theta(m^2)', putative: true, note: 'Same restriction as [[deg2]]: $\mathrm{OR}_t=1-\prod_i(1-x_i)$ has $\mathbb{F}_p$-degree $t=\binom{m-1}2$, and $\deg_p\le\deg\le\binom m2$.'}
    - {measure: PDT, value: '\Theta(m^2)', note: '$\deg_2\le\mathrm{D}^{\oplus}\le\mathrm{D}$: a depth-$t$ parity tree writes $f$ as a sum of products of at most $t$ affine forms over $\mathbb{F}_2$. With $\deg_2=\Theta(m^2)$ and $\mathrm{D}=\binom m2$ the two ends meet.'}
    - {measure: Fdim, value: '\Theta(m^2)', note: '$\mathrm{D}^{\oplus}\le\dim_{\mathbb{F}_2}(f)\le\binom m2$ ([[Fdim]] vs [[PDT]]), and $\mathrm{D}^{\oplus}=\Theta(m^2)$.'}
    - {measure: spar, value: '2^{\Theta(m^2)}', putative: true, note: 'Sparsity does not increase under restriction, and the restriction of [[deg2]] is $\mathrm{OR}_t$ with $t=\binom{m-1}2$, whose $\pm1$ form $1-2\prod_i(1-x_i)$ has all $2^t$ Fourier coefficients nonzero. The ceiling is $2^{\binom m2}$.'}
    - {measure: L1, value: '2^{\Omega(m)}', putative: true, note: 'Restrict to $m/3$ vertex-disjoint triangles with all other edges set to $0$: the restriction is $\mathrm{OR}_{m/3}\circ\mathrm{AND}_3$, the blocks are disjoint so $\hat L_1$ multiplies, and $\hat L_1(\prod_i(1-\mathrm{AND}_3))=(2-2^{-2})^{m/3}$; with $\hat L_1(1-2P)\ge2\hat L_1(P)-1$ this gives $2^{\Omega(m)}$. Restriction can only decrease $\hat L_1$, and the ceiling is $2^{\mathrm{D}}=2^{\binom m2}$ ([[L1]] vs [[D]]).'}
    - {measure: NS, value: '2^{-\Theta(m^2)}', note: '$\delta\,\mathrm{MaxInf}\le\mathrm{NS}_\delta\le\delta\,\mathrm{Inf}$, and both recorded influence values are $2^{-\Theta(m^2)}$: a uniformly random graph contains a triangle with overwhelming probability, so resampling a $\delta$-fraction of the edges almost never changes the answer.'}
    - {measure: Stab, value: '1 - 2^{-\Theta(m^2)}', note: '$\mathrm{Stab}_\rho=1-2\,\mathrm{NS}_\delta$ at $\rho=1-2\delta$, and $\mathrm{NS}_\delta=2^{-\Theta(m^2)}$. Triangle-freeness is a vanishingly rare event, so the function is nearly constant and nearly perfectly stable.'}
    - {measure: ndeg, value: '3', refs: [deWolf03], putative: true, note: 'Upper: $\sum_{\{a,b,c\}}x_{ab}x_{bc}x_{ca}$ is a sum of non-negative terms, positive exactly on the graphs with a triangle, so $\mathrm{ndeg}\le\mathrm{C}^1=3$. Lower: fix one triple free and every other edge to $0$; a multilinear polynomial in three variables vanishing on the other seven points must be a multiple of $x_1x_2x_3$, and nondeterministic degree does not increase under restriction.'}
    - {measure: NQ, value: '2', refs: [deWolf03], note: '$\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil$ [deWolf03] and $\mathrm{ndeg}=3$. Two queries suffice for a nondeterministic quantum verifier even though $\mathrm{Q}=\Omega(m)$.'}
    - {measure: rdeg, value: '\Theta(m^2)', refs: [deWolf03], putative: true, note: '$\mathrm{rdeg}=\max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}\le\mathrm{C}=\binom m2$. The complement side is the expensive one: on the restriction of [[deg2]] the complement is $\mathrm{NOR}_t$ with $t=\binom{m-1}2$, and a polynomial nonzero exactly at $0^t$ is a multiple of $\prod_i(1-x_i)$, so $\mathrm{ndeg}(\bar f)\ge\binom{m-1}2$.'}
    - {measure: UCmin, value: '\Theta(m^2)', refs: [BHT17], conf: medium, putative: true, note: '$\mathrm{UC}^0\ge\mathrm{C}^0=\binom m2$, so the question is the $1$-side. For the input consisting of a single triangle $T$, any certificate must fix a triangle to $1$ and can only fix edges of $T$, so its $1$-part is exactly $T$. For two distinct triangles $T$ and $U$ the graph $T\cup U$ then lies in both certificates unless one of them fixes an edge of the other to $0$; orienting each such pair, some triangle beats at least half the others, and since each edge lies in $m-2$ triangles its $0$-set has size $\Omega(m^2)$. Hence $\mathrm{UC}^1=\Theta(m^2)$ too, and the ceiling is $\mathrm{UC}=\binom m2$.'}
    - {measure: cjdeg, value: '\Omega(m),\ O(m^2)', note: '$\widetilde{\deg}_\varepsilon\le\mathrm{cjdeg}_\varepsilon\le\mathrm{R}_\varepsilon$ ([[cjdeg]] vs [[adeg]], [[cjdeg]] vs [[R]]), with $\widetilde{\deg}=\Omega(m)$ and $\mathrm{R}=\Theta(m^2)$.'}
    - {measure: ardeg, value: 'O(m^{5/4})', note: '$\mathrm{rdeg}_\varepsilon\le\widetilde{\deg}_\varepsilon=O(m^{5/4})$ ([[ardeg]] vs [[adeg]]). The $\mathrm{sdeg}\le\mathrm{rdeg}_{1/3}$ route gives no lower bound here, since no sign-degree bound is recorded for triangle finding.'}
    - {measure: PostQ, value: 'O(m^{5/4})', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15]; see [[ardeg]]. Post-selection is in particular at least as strong as the $O(m^{5/4})$ quantum walk.'}
    - {measure: D_size, value: '2^{\Theta(m^2)}', putative: true, note: 'Every $0$-input needs all $\binom m2$ edges read, since $\mathrm{C}^0=\binom m2$, so distinct triangle-free graphs end at distinct leaves. The $2^{m^2/4}$ bipartite graphs on a fixed balanced vertex split are all triangle-free, so $\mathrm{DTsize}\ge2^{m^2/4}$; the ceiling is $2^{\binom m2}$.'}
  witnesses:
    - {of: [R, Q], setting: total, statement: 'A candidate for a large gap that nobody can pin down: $\mathrm{R} = \Theta(m^2)$ against a $\mathrm{Q}$ known only to lie in $[\Omega(m), O(m^{5/4})]$, so the true exponent of $\mathrm{R}$ vs $\mathrm{Q}$ here is somewhere in $[8/5, 2]$.'}
  notes: |
    Two barriers are worth knowing. The certificate-complexity barrier above caps the
    positive-weight adversary at $\Omega(m)$. And [BalodisIraids15] show
    $\mathrm{Q}(\mathrm{TRI}_m) = \Omega(\sqrt m \cdot \mathrm{Q}(\mathrm{GC}_m))$ for
    graph collision, so any super-Grover bound for graph collision -- itself stuck at
    the trivial bound -- would immediately break the triangle barrier.

    A restricted-model lower bound often misquoted as an unconditional one:
    [BelovsRosmanis14, Prop. 13] gives $\Omega(m^{9/7}/\sqrt{\log m})$ for the
    *non-adaptive learning graph* complexity of the triangle certificate structure,
    and unconditionally only for the edge-weighted triangle-sum problem. Le Gall's
    $\tilde O(m^{5/4})$ therefore separates adaptive from non-adaptive learning
    graphs rather than contradicting anything.
  refs: [CLM20, LeGall14, LMS13, JKM13, Belovs12span, MSS07, CGP26, Bollobas76, CKS02, BelovsRosmanis14, BalodisIraids15]
  see_also: [Q, R, Advpm, C1, GroverSearch]

- id: RecursiveFourierSampling
  name: Recursive Fourier sampling
  symbol: '\mathrm{RFS}^g_\ell'
  group: quantum
  order: 58
  kind: partial
  arity: 'an oracle on $(\{0,1\}^n)^\ell$; cost is counted in oracle calls, not in bits'
  short: 'The original superpolynomial oracle separation: $\mathrm{Q}_E = 2^\ell$ against $n^{\Omega(\log n)}$ classically at $\ell = \log n$.'
  definition: |
    Fix a Boolean $g:\{0,1\}^n\to\{0,1\}$ that is *not* a parity; $g$ is known in
    advance and free to evaluate. Take a tree of height $\ell$ in which every internal
    vertex has $2^n$ children, one per string. Each vertex $v$ carries a secret
    $s_v \in \{0,1\}^n$, subject to the promise that
    $g(s_{v\cdot x}) = s_v\cdot x \bmod 2$ for every child $x$; the oracle answers
    $g(s_v)$ at the leaves. The task is to output $g(s_\varnothing)$ at the root.
    The canonical choice is $g_{\mathrm{mod}3}(s) = [\,|s| \equiv 0 \bmod 3\,]$.

    Three inequivalent formulations circulate. This is [Aaronson03rfs, §1] with the
    per-node secrets made explicit as in [McKague12, §1.1].
    [BernsteinVazirani97, §8.4] is genuinely different -- the string length *halves*
    at each level, so the height is forced to $\log n$, and there is no fixed $g$ --
    and should not be described as "$\mathrm{RFS}^g_\ell$ with $\ell = \log n$".
  formal: |
    $$g(s_{x_1\ldots x_k}) = s_{x_1\ldots x_{k-1}}\cdot x_k \bmod 2,
      \qquad A(x_1,\dots,x_\ell) = g(s_{x_1\ldots x_\ell}),
      \qquad \text{output } g(s_\varnothing).$$
  values:
    - {measure: QE, value: '2^\ell', refs: [Aaronson03rfs, BernsteinVazirani97], note: 'One level costs two queries by the Bernstein-Vazirani kickback trick, and the recursion is exact: [Aaronson03rfs, Lem. 1] puts the language version in $\mathrm{EQP}^A$; [BernsteinVazirani97, Thm. 8.4.3] gives a polynomial-time quantum machine accepting with probability $1$, from the recursion $T(n) \le \mathrm{poly}(n) + 4T(n/2)$.'}
    - {measure: Q, value: '\Theta(2^\ell) \text{ for } g = g_{\mathrm{mod}3}', refs: [Aaronson03rfs], note: '[Aaronson03rfs, Thm. 5]: $\mathrm{Q}(\mathrm{RFS}^g_\ell) = \Omega\big((1-\mu(g))^{-\ell/2}\big)$, where $\mu(g)$ is the nonparity coefficient of Def. 2. Prop. 6 gives $\mu(g_{\mathrm{mod}3}) = 3/4 - O(1/n)$, hence $\Omega(2^\ell)$, matching the algorithm. Thm. 7: $\mu(g) < 0.146$ forces $g$ to be a parity, so *any* legal $g$ gives $\Omega(2^{0.113\ell})$. This was the first lower bound to need the adversary method rather than the polynomial method.'}
    - {measure: R, value: 'n^{\Omega(\log n)} \text{ at } \ell = \log n', refs: [BernsteinVazirani97], note: '[BernsteinVazirani97, Thm. 8.4.6 / Cor. 8.4.7]: relative to a random legal oracle, with probability $1$, the language is not in $\mathrm{BPTime}(T(n))$ for any $T(n) = n^{o(\log n)}$; the explicit bound is $\tfrac1{12}\varphi(n/4)$ with $\varphi(n) = n(n/2)\cdots 1 > n^{(\log n)/2}$. So the separation is superpolynomial, not exponential. The often-quoted $\Theta(n^\ell)$ for general $\ell$ is a folklore extrapolation -- BV prove only the $\ell = \log n$ case.'}
    - {measure: bs, value: '1', refs: [Aaronson10], putative: true, note: 'The promise is rigid enough that no block of the oracle can be flipped and stay inside it. Worth recording because it is precisely why the polynomial method says nothing here.'}
    - {measure: Advpm, value: '\Theta(2^{\ell})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(2^{\ell})$ here for the base function $g = g_{\mathrm{mod}3}$.'}
    - {measure: MAdv, value: '\Theta(2^{\ell})', note: 'Same sandwich as [[Advpm]]: the multiplicative adversary is also a tight characterisation of $\mathrm{Q}$.'}
    - {measure: Q0, value: '\Theta(2^{\ell}) \text{ for } g = g_{\mathrm{mod}3}', note: 'Squeezed to nothing: $\mathrm{Q}_{\varepsilon} \le \mathrm{Q}_0 \le \mathrm{Q}_{\mathrm{E}}$, and both ends are $\Theta(2^{\ell})$ here -- the exact algorithm already matches the bounded-error lower bound, so error tolerance buys nothing at all on $\mathrm{RFS}$.'}
    - {measure: gamma2, value: '\Theta(2^{\ell}) \text{ for } g = g_{\mathrm{mod}3}', note: 'The approximate $\gamma_2$ norm equals $\mathrm{Adv}^{\pm}$ up to constants ([[gamma2]] vs [[Advpm]]), which is $\Theta(\mathrm{Q}_{\varepsilon}) = \Theta(2^{\ell})$ here.'}
    - {measure: Adv, value: '\Theta(2^{\ell}) \text{ for } g = g_{\mathrm{mod}3}', refs: [Aaronson03rfs], note: 'Unusually, the *positive-weight* adversary is already tight. The $\Omega(2^{\ell})$ of [Aaronson03rfs, Thm. 5] is proved with Ambainis'' weighted adversary, which has non-negative weights, so it is a lower bound on $\mathrm{Adv}$ itself and not merely on $\mathrm{Q}$; the ceiling is $\mathrm{Adv} \le \mathrm{Adv}^{\pm} = O(\mathrm{Q}) \le O(\mathrm{Q}_{\mathrm{E}}) = O(2^{\ell})$. Contrast [[TriangleFinding]], where the certificate-complexity barrier pins $\mathrm{Adv}$ strictly below $\mathrm{Q}$. Note the $\mathrm{bs} = 1$ entry: the polynomial method cannot even get started, while the adversary method is exactly optimal.'}
    - {measure: D, value: 'O(n^{\ell})', putative: true, note: 'Upper: to learn $s_v$ it suffices to learn the $n$ bits $s_v\cdot x$ for $x = e_1,\dots,e_n$, and each of those is $g(s_{vx})$, one recursive call one level down; so $T(\ell) = n\,T(\ell-1)$ with $T(0) = 1$. Lower: $\mathrm{D} \ge \mathrm{R} = n^{\Omega(\log n)}$ at $\ell = \log n$, so at that setting the two meet and $\mathrm{D} = n^{\Theta(\log n)}$. For general $\ell$ only the upper bound is on record.'}
    - {measure: R0, value: 'n^{\Omega(\log n)} \text{ at } \ell = \log n', note: 'From $\mathrm{R}_{\varepsilon} \le \mathrm{R}_0$ and the [BernsteinVazirani97] bound on $\mathrm{R}$; capped above by $\mathrm{D} = O(n^{\ell})$.'}
    - {measure: Rbar, value: 'n^{\Omega(\log n)} \text{ at } \ell = \log n', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), so allowing the classical algorithm to pay only in expectation does not rescue it.'}
    - {measure: R1, value: 'n^{\Omega(\log n)} \text{ at } \ell = \log n', note: 'From $\mathrm{R}_{\varepsilon} \le \mathrm{R}^{1}$; capped above by $\mathrm{D} = O(n^{\ell})$.'}
    - {measure: Dmu, value: 'n^{\Omega(\log n)} \text{ at } \ell = \log n', refs: [BernsteinVazirani97], note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon$; and this is the form the bound is actually proved in -- [BernsteinVazirani97, Thm. 8.4.6] argues against a *uniformly random legal oracle*, so it is a $\mathrm{D}^\mu$ statement first and an $\mathrm{R}$ statement afterwards.'}
    - {measure: s, value: '0', putative: true, note: 'Exactly zero, and this is the sharpest illustration in the zoo of the warning on the [[s]] page that sensitivity is useless on a promise. Group the leaves by their parent $v$: the oracle restricted to the $2^n$ children of $v$ is the *linear* function $x \mapsto s_v\cdot x$, because the promise says $g(s_{vx}) = s_v\cdot x$. Changing a single leaf value destroys linearity, so no single-bit flip of a legal oracle is legal, and there is nothing for $\mathrm{s}$ to count. Compare $\mathrm{bs} = 1$: the smallest legal-to-legal change flips a $2^{-\ell}$ fraction of the whole tree.'}
    - {measure: s0, value: '0', note: 'Immediate from $\mathrm{s} = \max(\mathrm{s}^0,\mathrm{s}^1) = 0$.'}
    - {measure: s1, value: '0', note: 'Immediate from $\mathrm{s} = \max(\mathrm{s}^0,\mathrm{s}^1) = 0$.'}
    - {measure: lambda, value: '0', note: 'The sensitivity graph is empty, since $\mathrm{s} = 0$: there is not a single pair of legal oracles at Hamming distance one with different answers. So $\lambda(f) = 0$, and the $\mathrm{Q} = \Omega(\lambda)$ route -- like every other combinatorial route -- says nothing at all here. This is the case the [[lambda]] page''s partial-setting warning is about.'}
    - {measure: bs0, value: '1', putative: true, note: 'Both sides attain the recorded $\mathrm{bs} = 1$. Given any legal oracle $A$ and any $s''_\varnothing$ with $g(s''_\varnothing) \ne g(s_\varnothing)$, one can build a legal $A''$ realising it (choose the subtree secrets top-down), and $B = \{\text{leaves where } A \ne A''\}$ is a sensitive block; so $\mathrm{bs}_x \ge 1$ at every input, of either answer.'}
    - {measure: bs1, value: '1', putative: true, note: 'Same construction as $\mathrm{bs}^0$, run from a $1$-input.'}
    - {measure: Dna, value: 'O(n^{\ell})', putative: true, note: 'Adaptivity buys nothing: the $O(n^{\ell})$ deterministic algorithm of the $\mathrm{D}$ entry is already non-adaptive. Its query set is fixed in advance -- the $n^{\ell}$ leaves $(e_{i_1},\dots,e_{i_\ell})$ whose every path component is a standard basis vector -- and the recursion $s_v\cdot e_i = g(s_{v e_i})$ then reconstructs every secret bottom-up. So $\mathrm{D} \le \mathrm{D}^{\mathrm{na}} \le n^{\ell}$, and at $\ell = \log n$ both are $n^{\Theta(\log n)}$.'}
    - {measure: Rna, value: 'n^{\Omega(\log n)} \text{ at } \ell = \log n', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{\mathrm{na}}_{\varepsilon}(f) \le \mathrm{D}^{\mathrm{na}}(f)$, with $\mathrm{R} = n^{\Omega(\log n)}$ and $\mathrm{D}^{\mathrm{na}} = O(n^{\ell})$ here, so at $\ell = \log n$ the two ends meet at $n^{\Theta(\log n)}$.'}
    - {measure: Np, value: 'n^{\Omega(\log n)} \text{ at } \ell = \log n', note: 'At least $\mathrm{R} = n^{\Omega(\log n)}$, and at most $O(\mathrm{R}\log \mathrm{R})$ ([[Np]] vs [[R]]), which changes nothing at this scale. Noise is not what makes recursive Fourier sampling hard classically.'}
    - {measure: robustQ, value: '\Omega(2^{\ell}),\ O(\ell\,2^{\ell})', note: 'Sandwiched by the generic $\mathrm{Q}(f) \le \mathrm{Q}^{\mathrm{rob}}(f) = O(\mathrm{Q}(f)\log \mathrm{Q}(f))$ ([[robustQ]] vs [[Q]]) around $\mathrm{Q} = \Theta(2^{\ell})$ at $g = g_{\mathrm{mod}3}$. Whether the $\ell$ is needed is open: the Bernstein-Vazirani kickback is exact and has no error to amplify, but the recursion must re-run it $\ell$ levels deep.'}
    - {measure: adeg, value: 'O(2^{\ell})', note: 'From $\widetilde{\deg}(f) \le 2\,\mathrm{Q}(f)$, which survives the passage to partial functions ([[adeg]] vs [[Q]]), and $\mathrm{Q} = \Theta(2^{\ell})$ at $g = g_{\mathrm{mod}3}$. No lower bound is recorded because none is available: with $\mathrm{s} = 0$ and $\mathrm{bs} = 1$ every symmetrisation argument starts from nothing, which is exactly why [Aaronson03rfs] had to invent an adversary proof.', refs: [Aaronson03rfs]}
    - {measure: LR, value: 'n^{\Omega(\log n)} \text{ at } \ell = \log n', refs: [BBGM22], note: '$\mathrm{LR}(f)=\Omega(\sqrt{\mathrm{R}(f)})$ and $\mathrm{LR}(f)\le\mathrm{R}(f)$ ([[LR]] vs [[R]], both for partial $f$) [BBGM22]. A square root does not dent $n^{\Omega(\log n)}$, so the linearised measure is superpolynomial too; capped above by $\mathrm{D}=O(n^{\ell})$.'}
    - {measure: ardeg, value: 'O(2^{\ell})', note: '$\mathrm{rdeg}_\varepsilon(f)\le\widetilde{\deg}_\varepsilon(f)$ ([[ardeg]] vs [[adeg]]), and the [[adeg]] entry gives $O(2^{\ell})$ at $g=g_{\mathrm{mod}3}$. No lower bound: the polynomial method is blind here, which is the whole point of the $\mathrm{bs}=1$ entry.'}
    - {measure: PostQ, value: 'O(2^{\ell})', refs: [MahadevdeWolf15], note: 'Post-selection can only help, so $\mathrm{PostQ}\le\mathrm{Q}=\Theta(2^{\ell})$; equivalently $\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)$ [MahadevdeWolf15] and [[ardeg]] is $O(2^{\ell})$.'}
  witnesses:
    - {of: [R, QE], setting: partial, statement: 'Superpolynomial: $\mathrm{Q}_E = \mathrm{poly}$ against $\mathrm{R} = n^{\Omega(\log n)}$ at $\ell = \log n$ -- the first such separation, and it is *exact* quantum versus randomized.', refs: [BernsteinVazirani97]}
  notes: |
    $\mathrm{RFS}$ was the original candidate for $\mathrm{BQP}\not\subset\mathrm{PH}$,
    a role Forrelation eventually filled: it does give
    $\mathrm{BQP}^A \not\subset \mathrm{NP}^A, \mathrm{MA}^A$, but at $\ell = \log n$
    it *is* in $\mathrm{PH}$ [Aaronson10], and whether some setting of the parameters
    escapes $\mathrm{PH}$ (or $\mathrm{AM}$) is open.
  refs: [Aaronson03rfs, BernsteinVazirani97, Aaronson10, McKague12]
  see_also: [QE, Q, R, Forrelation, Simon, BV]

- id: GluedTrees
  name: Welded trees
  symbol: '\mathrm{WT}_n'
  aliases: ['glued trees', 'conjoined trees', 'graph traversal problem']
  group: relational
  order: 59
  kind: relation
  arity: 'a $9$-edge-coloured adjacency oracle on $2^{2n}$ possible vertex names, for a graph with $2^{n+2}-2$ vertices'
  short: 'The quantum-walk speedup: $\mathrm{Q} = \Theta(n)$ against $\mathrm{R} = \mathrm{D} = \tilde\Theta(2^{n/2})$ -- exponential in the tree height, but only $\tilde\Theta(\sqrt{N})$ in the vertex count.'
  definition: |
    Two complete binary trees of height $n$ are joined leaf-to-leaf by a random cycle
    alternating between the two leaf sets. Each vertex gets a uniformly random $2n$-bit
    *name*, so names are exponentially sparse in the $2^{2n}$ name space, and the
    oracle maps (name, colour) to the name of the neighbour across the edge of that
    colour, or to $1^{2n}$ if there is none. Given the name of the ENTRANCE, output the
    name of the EXIT. The random $9$-colouring is chosen precisely so that it tells a
    classical algorithm nothing.

    This is a *relation* with a unique valid answer, and the oracle is not a Boolean
    decision tree: costs below are in oracle calls, and Boolean queries would cost an
    extra $O(n)$ factor.
  formal: '$S = \{(\mathcal{O}_{G,\pi,c},\ \pi(\mathrm{EXIT}))\}$ over welded trees $G$ of height $n$, injective namings $\pi: V \hookrightarrow \{0,1\}^{2n}$ with $\pi(\mathrm{ENTRANCE})$ fixed, and proper $9$-edge-colourings $c$.'
  values:
    - {measure: Q, value: '\Theta(n)', refs: [JefferyZur25, Belovs24welded], putative: true, conf: medium, note: 'Upper: [JefferyZur25, §5], a multidimensional (electric-network) quantum walk, $O(n)$ queries and $O(n^2)$ time; [Belovs24welded] reproves it in a page. The 2003 continuous-time walk is *not* an $O(n)$-query algorithm: simulating $e^{-iHt}$ for $t = O(n^4)$ costs $O(t^2)$ queries, so [CCDFGS03] as stated is $O(n^{8.5})$ queries, brought to $O(n^{2.5}\log^2 n)$ by [AtiaChakraborty21]. Lower, $\Omega(n)$: nobody states this as a theorem, but it is the light-cone argument -- names are random $2n$-bit strings in a space of size $2^{2n}$, so with probability $1 - 2^{-\Omega(n)}$ an algorithm never guesses a name it has not been handed, and after $t$ queries everything it has seen lies within distance $t$ of the ENTRANCE, which is $2n+2$ away from the EXIT; BBBV makes the hybrid argument quantum. [Belovs24welded] calls the linear upper bound optimal, which presupposes it. The $\Theta$ is therefore only as good as that folklore argument, hence the medium confidence.'}
    - {measure: QE, value: 'O(n^{1.5}\log n)', refs: [LiLiLuo24], note: '[LiLiLuo24, §5, Alg. 2]: run the plain coined quantum walk for a classically precomputable number of steps, then exact amplitude amplification. Zero error -- one of very few exponential $\mathrm{Q}_E$-vs-$\mathrm{R}$ separations known. Their bounded-error Alg. 1 uses $O(n^2\log n)$ queries.'}
    - {measure: D, value: '\tilde\Theta(2^{n/2})', refs: [AaronsonAmbainis18, Liu17thesis], conf: medium, note: 'Upper $O(n\,2^{n/2})$: Shalev Ben-David, reported in [AaronsonAmbainis18, fn. 5] as $O(\sqrt N\log N)$ with $N = 2^n$ ($O(\sqrt N \log^2 N)$ with Boolean queries), and written out in full as [Liu17thesis, §4.3, Alg. 5] -- breadth-first search the top $\lceil n/2\rceil$ levels, cross using short probe-trees to tell "up" from "down", then search the last $\lfloor n/2\rfloor$ levels. Lower: $\mathrm{D} \ge \mathrm{R} = \Omega(2^{n/2}/n)$. So randomness buys essentially nothing here: $\mathrm{D}$ and $\mathrm{R}$ agree to within $n^2$.'}
    - {measure: R, value: '\tilde\Theta(2^{n/2})', refs: [Liu17thesis, AaronsonAmbainis18], conf: medium, note: 'The window is $[\Omega(2^{n/2}/n),\ O(n\,2^{n/2})]$, so the exponent is pinned and only the polynomial factor is open. Lower: [Liu17thesis, Cor. 25], for the easier task of finding either the EXIT or any cycle; [AaronsonAmbainis18, fn. 5] asserts $\Omega(\sqrt N)$ for constant success probability. Refereed but weaker: $\Omega(2^{n/6})$ [CCDFGS03, Thm. 9] and $\Omega(2^{n/3})$ [FennerZhang03, Thm. 1.2], both in the exponentially-small-success regime. Upper: from $\mathrm{R} \le \mathrm{D}$. Medium confidence: the strong lower bound lives in a thesis and a footnote.'}
    - {measure: Q0, value: '\Omega(n),\ O(n^{1.5}\log n)', note: 'Sandwiched between $\mathrm{Q} = \Theta(n)$ and $\mathrm{Q}_{\mathrm{E}} = O(n^{1.5}\log n)$; closing it is the second of the two open questions in the notes below.'}
    - {measure: Advpm, value: '\Theta(n)', conf: medium, note: '$\mathrm{Adv}^{\pm}$ characterises $\mathrm{Q}$ up to constants ([[Advpm]] vs [[Q]]), and $\mathrm{Q} = \Theta(n)$ here. Medium confidence on two counts: the characterisation is proved for state conversion rather than for search relations in general, and the $\Omega(n)$ side of $\mathrm{Q}$ is itself folklore.'}
    - {measure: R0, value: '\tilde\Theta(2^{n/2})', note: 'Sandwiched: $\mathrm{R}_{\varepsilon} \le \tfrac32\mathrm{R}_0$ and $\mathrm{R}_0 \le \mathrm{D}$, and both ends are $\tilde\Theta(2^{n/2})$. The classical algorithm never gains from being allowed to err: it finds the EXIT by walking to it.'}
    - {measure: Rbar, value: '\tilde\Theta(2^{n/2})', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon} = \tilde\Theta(2^{n/2})$ here.'}
    - {measure: Dmu, value: '\tilde\Theta(2^{n/2})', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon = \tilde\Theta(2^{n/2})$; the maximising $\mu$ is the uniform distribution over welded trees, namings and colourings, which is exactly what the lower-bound proofs use.'}
    - {measure: Dna, value: '\Theta(4^n)', putative: true, note: 'Adaptivity is not a convenience here, it is the whole problem: $\mathrm{D}^{\mathrm{na}}/\mathrm{D} = \tilde\Theta(2^{3n/2})$. A non-adaptive algorithm must fix its query names in advance knowing only $\pi(\mathrm{ENTRANCE})$, and the $2^{n+2}-2$ real names are a $2^{-n+2}$ fraction of the $2^{2n}$ name space. Upper: query all $9\cdot 2^{2n}$ (name, colour) pairs and reconstruct the graph. Lower: let $S$ be the set of names queried. The transcript reveals $\pi(\mathrm{EXIT})$ only if $\mathrm{EXIT}$ or one of its $\le 3$ neighbours lies in $S$; if not, and if some name outside $S$ is unused, swapping $\pi(\mathrm{EXIT})$ with that name leaves the transcript unchanged and the required output different. So $|S| \ge 2^{2n} - 2^{n+2} - 1$.'}
    - {measure: C, value: '\Theta(1)', putative: true, note: 'Nine queries certify the answer, and this is the cleanest statement of what the welded-trees speedup does *not* give you. Certificate: query $(y,c)$ for all nine colours $c$ at $y = \pi(\mathrm{EXIT})$. The answers show $y$ has exactly two neighbours. In the welded-trees graph only the two roots have degree $2$; every other vertex has degree $3$, and a name that is not a vertex answers $1^{2n}$ nine times. Since $\pi(\mathrm{ENTRANCE})$ is fixed and known and differs from $y$, every legal instance consistent with those nine cells has $\pi(\mathrm{EXIT}) = y$. So $\mathrm{C} \le 9$ while $\mathrm{D} = \tilde\Theta(2^{n/2})$: verifying the exit is free, finding it is not.'}
    - {measure: cbs, value: '\Theta(1)', putative: true, note: 'Contrast [[TseitinExpander]], where $\mathrm{cbs} = \Theta(n)$. Every input is critical -- the valid answer $\pi(\mathrm{EXIT})$ is unique -- so the solution function $s$ is forced and $\mathrm{cbs} = \max_x \mathrm{bs}(s,x)$. Let $B$ be a block whose flip changes the answer, and put $y = \pi(\mathrm{EXIT})$. In the modified instance $y$ is not the exit, so $y$ is either a degree-$3$ vertex or not a vertex at all; either way one of the nine cells $(y,c)$ has changed, so $B$ meets $\{(y,c)\}_{c=1}^{9}$. Disjoint blocks therefore number at most nine. At least one exists (rename the exit), so $\mathrm{cbs} = \Theta(1)$ -- which is the witness behind the recorded fact that $\mathrm{D}$ is unbounded in terms of $\mathrm{cbs}$ ([[D]] vs [[cbs]]).'}
    - {measure: Rna, value: '\Theta(4^n)', putative: true, note: 'Randomness does not help the non-adaptive algorithm either, so $\mathrm{R}^{\mathrm{na}}/\mathrm{R} = \tilde\Theta(2^{3n/2})$ as well. Upper: $\mathrm{R}^{\mathrm{na}} \le \mathrm{D}^{\mathrm{na}} = \Theta(4^n)$. Lower: let the algorithm draw a random name set $S$, $|S| = t$. Since $\pi$ is a uniformly random injection with only $\pi(\mathrm{ENTRANCE})$ pinned, the exit and its two neighbours land in $S$ with probability at most $3t/(2^{2n}-1)$; conditioned on missing all three, the transcript is independent of which unqueried unused name carries the exit, and there are $2^{2n} - t - 2^{n+2}$ candidates. So the success probability is at most $3t/(2^{2n}-1) + o(1)$, and $t = \Omega(4^n)$ is needed for $2/3$.'}
    - {measure: psD, value: '\tilde\Theta(2^{n/2})', note: 'Squeezed by $\mathrm{R} \le \mathrm{psD} \le \mathrm{D}$ ([[psD]] vs [[R]]), and here $\mathrm{R}$ and $\mathrm{D}$ already agree to within $n^2$. Pseudo-determinism costs nothing because the answer is unique to begin with: there is only one solution function, so the canonical-answer requirement is vacuous.'}
    - {measure: Np, value: '\tilde\Theta(2^{n/2})', note: 'At least $\mathrm{R} = \Omega(2^{n/2}/n)$, at most $O(\mathrm{R}\log \mathrm{R}) = O(2^{n/2}n^2)$ ([[Np]] vs [[R]]). Noise costs only a factor $\mathrm{poly}(n)$, which is invisible at this scale.'}
    - {measure: robustQ, value: '\Omega(n),\ O(n\log n)', note: 'Squeezed by $\mathrm{Q} \le \mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ ([[robustQ]] vs [[Q]]) around $\mathrm{Q} = \Theta(n)$. So the exponential separation from $\mathrm{R}$ survives noisy oracles intact -- unusually, since the quantum walk''s advantage is an interference effect.'}
    - {measure: gamma2, value: '\Theta(n)', conf: medium, note: 'The approximate $\gamma_2$ norm and $\mathrm{Adv}^{\pm}$ agree up to constants ([[gamma2]] vs [[Advpm]]), and $\mathrm{Adv}^{\pm} = \Theta(n)$ here. Medium confidence for the same two reasons as the $\mathrm{Adv}^{\pm}$ row: $\gamma_2$ is only partially defined on relations, and the $\Omega(n)$ side of $\mathrm{Q}$ is folklore.'}
    - {measure: MAdv, value: '\Theta(n)', conf: medium, note: 'Between $\mathrm{Adv}^{\pm} = \Theta(n)$ (the multiplicative adversary is at least as strong) and $\mathrm{Q} = \Theta(n)$ (every adversary bound is a lower bound on $\mathrm{Q}$). Same medium-confidence caveats as the $\mathrm{Adv}^{\pm}$ and $\gamma_2$ rows.'}
    - {measure: Cmin, value: '\Theta(1)', note: '$1\le\mathrm{C}_{\min}\le\mathrm{C}=\Theta(1)$: nine queries exhibit the EXIT vertex and certify it at every input, so the cheapest input is no cheaper than a constant.'}
    - {measure: Adv, value: 'O(n)', note: '$\mathrm{Adv}\le\mathrm{Adv}^{\pm}=\Theta(n)$ ([[Adv]] vs [[Advpm]]). The positive-weight bound cannot be much smaller than $\mathrm{Q}=\Theta(n)$ here either, but no matching lower bound is recorded: the certificate structure is trivial ($\mathrm{C}=\Theta(1)$), which is exactly the regime where the positive adversary is weak.'}
    - {measure: prt, value: '\widetilde O(2^{n/2})', refs: [JainKlauck10], note: '$\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon$ [JainKlauck10], a bound stated for relations, and $\mathrm{R}=\tilde\Theta(2^{n/2})$. The usual lower bound $\mathrm{prt}\ge\widetilde{\deg}$ is unavailable: approximate degree is not defined for a relation.'}
    - {measure: rprt, value: '\widetilde O(2^{n/2})', refs: [JainKlauck10], note: '$\overline{\mathrm{prt}}_\varepsilon\le\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon=\widetilde O(2^{n/2})$ [JainKlauck10].'}
    - {measure: cjdeg, value: '\widetilde O(2^{n/2})', note: '$\mathrm{cjdeg}_\varepsilon\le\mathrm{R}_\varepsilon=\widetilde O(2^{n/2})$ ([[cjdeg]] vs [[R]], relation setting).'}
    - {measure: PostQ, value: 'O(n)', note: 'Post-selection can only help, so $\mathrm{PostQ}\le\mathrm{Q}=\Theta(n)$. Whether it helps at all here is open; the quantum walk already runs in linear time.'}
    - {measure: D_size, value: '\Omega(4^n)', putative: true, note: 'Answer counting. Each leaf of a tree is labelled with a single vertex name, and for every one of the $2^{2n}$ names there is a legal instance whose EXIT carries that name, so instances with different EXIT names must reach different leaves. Hence $\mathrm{DTsize}\ge2^{2n}=4^n$ -- the same $\Theta(4^n)$ that makes the non-adaptive complexity trivial.'}
  witnesses:
    - {of: [R, Q], setting: relation, statement: 'Exponential in the tree height: $\mathrm{Q} = \Theta(n)$ against $\mathrm{R} = \tilde\Theta(2^{n/2})$. In the vertex count $N = 2^n$ that reads $\mathrm{Q} = \Theta(\log N)$ vs $\mathrm{R} = \tilde\Theta(\sqrt N)$ -- the same shape as Simon, and *not* a $2^{\Omega(N)}$ separation.', refs: [CCDFGS03, FennerZhang03, JefferyZur25, Liu17thesis]}
    - {of: [R, QE], setting: relation, statement: 'The separation survives at zero error: $\mathrm{Q}_E = O(n^{1.5}\log n)$ against $\mathrm{R} = \tilde\Theta(2^{n/2})$.', refs: [LiLiLuo24]}
    - {of: [D, R], setting: relation, statement: '**Not** a separation, and that is the point: $\mathrm{D} = O(n2^{n/2})$ while $\mathrm{R} = \Omega(2^{n/2}/n)$, so randomness is worth at most a factor $n^2$ here.', refs: [AaronsonAmbainis18, Liu17thesis]}
  notes: |
    The speedup produces no certificate. [ChildsCoudronGilani23] show that the
    *path-finding* version -- output an ENTRANCE-to-EXIT path rather than just the EXIT
    name -- cannot be solved efficiently by any quantum algorithm that only ever
    queries names inside a connected subgraph containing the ENTRANCE. The walk
    necessarily forgets how it got there.

    The advantage also lives entirely in the labelled adjacency-list presentation:
    symmetric graph properties admit at most polynomial quantum speedups
    (Ben-David, Childs, Gilyen, Kretschmer, Podder, Wang, FOCS 2020).

    Open: whether $\mathrm{R} = \Theta(2^{n/2})$ with no $n$ factor (the window is
    $[\Omega(2^{n/2}/n), O(n2^{n/2})]$), and whether $\mathrm{Q}_E$ can be brought down
    to $O(n)$.
  refs: [CCDFGS03, FennerZhang03, Liu17thesis, JefferyZur25, LiLiLuo24, Belovs24welded, ChildsCoudronGilani23, AaronsonAmbainis18, AtiaChakraborty21]
  see_also: [Simon, YamakawaZhandry, Q, QE, R]

- id: LocalSearchCube
  name: Local search on the hypercube
  symbol: '\mathrm{LS}(\{0,1\}^n)'
  aliases: ['black-box 2SAT-FLIP']
  group: relational
  order: 60
  kind: relation
  arity: 'a table $f:\{0,1\}^n \to \mathbb{Z}$, so $N = 2^n$ integer-valued input cells'
  short: 'The query-complexity home of PLS, and tight in all three models: $\mathrm{D} = \Theta(2^n/\sqrt n)$, $\mathrm{R} = \Theta(2^{n/2}\sqrt n)$, $\mathrm{Q} = \Theta(2^{n/3}n^{1/6})$.'
  definition: |
    Given $f$ by an oracle, output any $v$ that is a local minimum: $f(v) \le f(w)$ for
    every neighbour $w$ at Hamming distance $1$. A minimum always exists, so this is a
    *total* search problem -- the black-box form of the PLS-complete problem 2SAT-FLIP.

    Note the arity convention: there are $N = 2^n$ cells, each holding an integer, so
    the bounds below are in cell-queries and $n = \log_2 N$.
  formal: '$S = \{(f, v) : f(v) \le f(w) \text{ for all } w \text{ with } |v \oplus w| = 1\}$.'
  scale:
    var: n
    subs: {N: '2^n'}
    note: 'The parameter is the cube dimension $n$, not the table size $N = 2^n$. Every bound below is a count of *cell* queries, so e.g. $\mathrm{D} = \Theta(N/\sqrt{\log N})$ reads as $\Theta(2^n/\sqrt n)$.'
  values:
    - {measure: D, value: '\Theta(2^n/\sqrt n)', refs: [LTT89, SanthaSzegedy09], note: '[LTT89] characterise $\mathrm{D}$ for every graph in terms of vertex cuts; on the cube the optimum is essentially to query the middle layer. Quoted in this form in [SanthaSzegedy09, §1].'}
    - {measure: R, value: '\Theta(2^{n/2}\sqrt n)', refs: [Zhang09localsearch, Aldous83], note: 'Upper: Aldous'' generic $O(\sqrt{N\Delta})$ with $N = 2^n$, $\Delta = n$. Lower: [Zhang09localsearch, Thm. 2], after [Aldous83] ($2^{n/2-o(n)}$) and [Aaronson06, Thm. 15] ($\Omega(2^{n/2}/n^2)$).'}
    - {measure: Q, value: '\Theta(2^{n/3}n^{1/6})', refs: [Zhang09localsearch, Aaronson06], note: 'Upper: Aaronson''s generic $O(N^{1/3}\Delta^{1/6})$. Lower: [Zhang09localsearch, Thm. 2], after [Aaronson06, Thm. 15] ($\Omega(2^{n/4}/n)$ by the relational adversary) and an unpublished $\Omega(2^{n/3}/n^{O(1)})$ of Ambainis.'}
    - {measure: R0, value: '\Theta(2^{n/2}\sqrt n)', note: 'A candidate local minimum is verified with $\Delta = n$ further queries, so $\mathrm{R}_0 = O(\mathrm{R} + n)$, and $n \ll \mathrm{R}$ here. Same remark as on [[promiseFind1]].'}
    - {measure: Advpm, value: '\Theta(2^{n/3}n^{1/6})', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = \Theta(2^{n/3}n^{1/6})$ here.'}
    - {measure: Q0, value: '\Theta(2^{n/3}n^{1/6})', note: 'Same verification argument as $\mathrm{R}_0$: a candidate is checked with $\Delta = n$ further queries, so $\mathrm{Q}_0 = O(\mathrm{Q} + n)$, and $n \ll 2^{n/3}$. Zero error is free for every model on this problem, because the answer carries its own certificate.'}
    - {measure: Rbar, value: '\Theta(2^{n/2}\sqrt n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon} = \Theta(2^{n/2}\sqrt n)$ here.'}
    - {measure: Dmu, value: '\Theta(2^{n/2}\sqrt n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon = \Theta(2^{n/2}\sqrt n)$. [Aldous83] and [Zhang09localsearch] both argue against an explicit $\mu$ -- a random-walk / staircase distribution -- so the lower bound is really a $\mathrm{D}^\mu$ bound to begin with.'}
    - {measure: Dna, value: '2^n', putative: true, note: 'Every cell -- that is, the whole table, $N = 2^n$ -- and the loss against $\mathrm{D} = \Theta(2^n/\sqrt n)$ is only the $\sqrt n$. Suppose the fixed query set $S$ omits the cell $u$ and let $f$ agree on $S$ with the Hamming distance to $u$. If $f(u) = 0$ then $u$ is the unique local minimum, while if $f(u)$ is huge the local minima are exactly the $n$ neighbours of $u$; the transcript is the same in both cases and the required output differs, so $S$ must be everything.'}
    - {measure: C, value: 'n+1', putative: true, note: 'Exactly $n+1$, at every input. A local minimum $v$ is certified by $f(v)$ together with its $n$ neighbours, and nothing less will do: drop the neighbour $w$ from the certificate and the completion $f(w) = f(v)-1$ is consistent and makes $v$ invalid. So $\mathrm{C} = n+1 = \log_2 N + 1$ against $\mathrm{D} = \Theta(N/\sqrt{\log N})$ -- an exponential $\mathrm{D}$-vs-$\mathrm{C}$ gap on a *total* search problem, which is the query-complexity content of "PLS solutions are efficiently verifiable".'}
    - {measure: Rna, value: '\Theta(2^n)', putative: true, note: 'Randomness buys nothing without adaptivity, and the gap against $\mathrm{R} = \Theta(2^{n/2}\sqrt n)$ is quadratic. Upper: $\mathrm{R}^{\mathrm{na}} \le \mathrm{D}^{\mathrm{na}} = 2^n$. Lower: pick $u$ uniformly and let $f$ be the Hamming distance to $u$ except at $u$ itself, where $f(u) \in \{0, 2n\}$ with a fair coin. Both completions are legal, the reading on any cell other than $u$ is identical, and the valid outputs are disjoint -- $\{u\}$ in one case, the $n$ neighbours of $u$ in the other. A fixed query set $S$ of size $t$ contains $u$ with probability $t/2^n$, so the success probability is at most $t/2^n + 1/2$ and $t \ge 2^n/6$.'}
    - {measure: CA, value: '\tilde\Theta(2^{n/2})', refs: [Aaronson06, Zhang09localsearch], note: 'Lower: [Aaronson06, Thm. 15] proves $\Omega(2^{n/2}/n^2)$ by exactly the object this measure names -- his classical *relational* adversary, a weighting of pairs of inputs with different valid answers. Upper: $\mathrm{CA} \le \mathrm{R} = \Theta(2^{n/2}\sqrt n)$. So the classical adversary is tight here up to $n^{2.5}$, and the sharpening to $\Theta(2^{n/2}\sqrt n)$ in [Zhang09localsearch] came from a different (random-walk) argument rather than from a better relation.'}
    - {measure: psD, value: '\Omega(2^{n/2}\sqrt n),\ O(2^n/\sqrt n)', note: 'Only the generic $\mathrm{R} \le \mathrm{psD} \le \mathrm{D}$ ([[psD]] vs [[R]]), and here the two ends are quadratically apart, so this is one of the natural places to look for a genuine pseudo-deterministic separation: a randomized algorithm may return *any* local minimum, but committing in advance to *which* one looks much closer to the deterministic problem of finding a canonical minimum.'}
    - {measure: Np, value: '\tilde\Theta(2^{n/2})', note: 'Between $\mathrm{R} = \Theta(2^{n/2}\sqrt n)$ and $O(\mathrm{R}\log \mathrm{R}) = O(2^{n/2}n^{1.5})$ ([[Np]] vs [[R]]). The integer cells are read bit by bit under noise, but that only costs $\mathrm{polylog}$.'}
    - {measure: robustQ, value: '\tilde\Theta(2^{n/3})', note: 'Between $\mathrm{Q} = \Theta(2^{n/3}n^{1/6})$ and $O(\mathrm{Q}\log \mathrm{Q}) = O(2^{n/3}n^{7/6})$ ([[robustQ]] vs [[Q]]).'}
    - {measure: gamma2, value: '\Theta(2^{n/3}n^{1/6})', conf: medium, note: 'Equal to $\mathrm{Adv}^{\pm}$ up to constants ([[gamma2]] vs [[Advpm]]), which is $\Theta(2^{n/3}n^{1/6})$ here. Medium confidence only because $\gamma_2$ is listed as partially defined on relations.'}
    - {measure: MAdv, value: '\Theta(2^{n/3}n^{1/6})', conf: medium, note: 'Squeezed between $\mathrm{Adv}^{\pm} = \Theta(2^{n/3}n^{1/6})$, which the multiplicative adversary dominates, and $\mathrm{Q} = \Theta(2^{n/3}n^{1/6})$, which every adversary bound is below. Medium confidence for the same definedness reason as $\gamma_2$.'}
    - {measure: Cmin, value: 'n+1', note: 'Exactly $n+1$, like $\mathrm{C}$: certifying that a vertex is a local minimum means reading it and all $n$ neighbours, and that cost is the same at every input, so the min over inputs equals the max.'}
    - {measure: Adv, value: 'O(2^{n/3}n^{1/6})', note: '$\mathrm{Adv}\le\mathrm{Adv}^{\pm}=\Theta(2^{n/3}n^{1/6})$ ([[Adv]] vs [[Advpm]]). No lower bound is recorded here: the $\Omega(2^{n/3}n^{1/6})$ of [Aaronson06] and [Zhang09localsearch] is a relational adversary argument, which is the [[CA]] and [[Advpm]] family rather than the positive-weight quantum bound.'}
    - {measure: QE, value: '\Omega(2^{n/3}n^{1/6}),\ O(2^n/\sqrt n)', note: '$\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_{\mathrm{E}}\le\mathrm{D}$, with $\mathrm{Q}=\Theta(2^{n/3}n^{1/6})$ and $\mathrm{D}=\Theta(2^n/\sqrt n)$. Nothing is known about exact local search: even the classical deterministic upper bound is the only ceiling available.'}
    - {measure: PostQ, value: 'O(2^{n/3}n^{1/6})', note: 'Post-selection can only help, so $\mathrm{PostQ}\le\mathrm{Q}=\Theta(2^{n/3}n^{1/6})$.'}
    - {measure: prt, value: 'O(2^{n/2}\sqrt n)', refs: [JainKlauck10], note: '$\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon$ [JainKlauck10] in the relation setting, and $\mathrm{R}=\Theta(2^{n/2}\sqrt n)$. The recorded $\mathrm{CA}=\tilde\Theta(2^{n/2})$ does not give a matching lower bound: $\mathrm{CA}\le\mathrm{prt}$ is proved only for partial functions.'}
    - {measure: rprt, value: 'O(2^{n/2}\sqrt n)', refs: [JainKlauck10], note: '$\overline{\mathrm{prt}}_\varepsilon\le\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon$ [JainKlauck10].'}
    - {measure: cjdeg, value: 'O(2^{n/2}\sqrt n)', note: '$\mathrm{cjdeg}_\varepsilon\le\mathrm{R}_\varepsilon$ ([[cjdeg]] vs [[R]], relation setting).'}
    - {measure: D_size, value: '\Omega(2^n)', putative: true, note: 'Answer counting: for every vertex $v$ of the cube the table $f(x)=|x\oplus v|$ has $v$ as its unique local minimum, so the $2^n$ vertices force $2^n$ distinct leaves.'}
  witnesses:
    - {of: [D, R], setting: relation, statement: 'Quadratic, on a *total* search problem: $\mathrm{D} = \tilde\Theta(\mathrm{R}^2)$.', refs: [LTT89, Zhang09localsearch]}
    - {of: [R, Q], setting: relation, statement: '$\mathrm{R} = \tilde\Theta(\mathrm{Q}^{3/2})$ -- strictly super-linear but well short of quadratic.', refs: [Zhang09localsearch]}
  notes: |
    **Why the exponents stop there.** [SanthaSzegedy09, Thm. 1]:
    $\mathrm{D}(\mathrm{LS}_G) = O(\mathrm{Q}_{\varepsilon}(\mathrm{LS}_G)^{19})$ for
    *every* graph $G$, so local search admits no exponential quantum speedup anywhere.
    Their route is $\mathrm{D} = O(\log n\,(\Delta + s))$ (Thm. 2) against
    $\mathrm{Q} = \Omega((s/\Delta)^{1/8}/\log n)$ (Thm. 4), with $s$ the separation
    number; they say plainly that $19$ is far from optimal, and the true exponent is
    open.

    **PLS.** 2SAT-FLIP is PLS-complete and its neighbourhood graph is the cube, so the
    $\Omega(2^{n/3}n^{1/6})$ bound gives an oracle relative to which
    $\mathsf{PLS} \not\subseteq \mathsf{FBQP}$ [Aaronson06] -- and Santha-Szegedy say
    that oracle separation can never be made exponential.

    **Expanders.** [BranzeiChooRecker24] get $\mathrm{R} = \Omega(n^{1.5}/g)$ ($g$ the
    vertex congestion) and $\Omega((s/\Delta)^{1/4})$, giving $\tilde\Theta(\sqrt n)$ on
    constant-degree expanders; [BranzeiRecker24] get $\mathrm{Q} = \Omega(n^{3/4}/\sqrt g)$.
  refs: [Aaronson06, Zhang09localsearch, SanthaSzegedy09, LTT89, Aldous83, BranzeiChooRecker24, BranzeiRecker24]
  see_also: [LocalSearchGrid, SearchCNF, GroverSearch, promiseFind1]

- id: LocalSearchGrid
  name: Local search on the grid
  symbol: '\mathrm{LS}([k]^d)'
  group: relational
  order: 61
  kind: relation
  arity: 'a table $f:[k]^d \to \mathbb{Z}$, so $N = k^d$ cells; $d$ is constant'
  short: 'Tight at $\Theta(k^{d/2})$ randomized for $d\ge4$ and $\Theta(k^{d/3})$ quantum for $d\ge6$; the low dimensions took another decade, and $d=4$ quantum is still open.'
  definition: 'As [[LocalSearchCube]], on the $d$-dimensional grid with nearest-neighbour edges, so $\Delta = 2d$.'
  values:
    - {measure: R, value: '\Theta(k^{d/2})\ (d \ge 4)', refs: [Zhang09localsearch, Aldous83, SunYao09], note: '[Zhang09localsearch, Thm. 3], matching Aldous'' $O(\sqrt{N\Delta}) = O(k^{d/2})$. The two small dimensions cost a log: $\mathrm{R} = \tilde\Theta(k^{3/2})$ at $d = 3$, from $\Omega((k^3/\log k)^{1/2})$ [Zhang09localsearch, Thm. 3]; and $\mathrm{R} = \tilde\Theta(k)$ at $d = 2$, from $\Omega(k^{1-\delta})$ for every constant $\delta > 0$ [SunYao09] via Sarkozy-Szemeredi, against Aldous'' $O(k)$ -- [Zhang09localsearch] had reached only $\Omega(k^{2/3})$ there.'}
    - {measure: Q, value: '\Theta(k^{d/3})\ (d \ge 6)', refs: [Zhang09localsearch, Aaronson06, SunYao09, Verhoeven06], note: '[Zhang09localsearch, Thm. 3], matching Aaronson''s $O(N^{1/3}\Delta^{1/6}) = O(k^{d/3})$. Below $d = 6$ the picture degrades one dimension at a time: $\tilde\Theta(k^{5/3})$ at $d = 5$, from $\Omega((k^5/\log k)^{1/3})$ [Zhang09localsearch, Thm. 3]; a genuine polynomial gap $\Omega(k^{6/5})$ to $O(k^{4/3})$ at $d = 4$, the one cell of the table still open; $\tilde\Theta(k)$ at $d = 3$, from $\Omega(k^{1-\delta})$ [SunYao09] against $O(k)$; and $\tilde\Theta(\sqrt k)$ at $d = 2$, from $\Omega(k^{1/2-\delta})$ [SunYao09] against $O(\sqrt k\log\log k)$ [Verhoeven06] via graph genus (also $O(\sqrt k(\log\log k)^{1.5})$ [Zhang09localsearch, Thm. 5]).'}
    - {measure: D, value: '\Theta(k^{d-1})', refs: [LTT89, LlewellynTovey93], note: 'Not merely $\tilde\Theta$: the deterministic case was settled before the randomized one. Upper $O(k^{d-1})$ by the divide-and-conquer of Llewellyn-Tovey-Trick: query the $(d-1)$-dimensional middle slab together with the boundary of the current region, take the smallest value seen, and recurse into whichever half contains a strictly smaller neighbour of it -- the region halves each round, so the slab costs form a geometric series. Matching $\Omega(k^{d-1})$ lower bounds are due to [LlewellynTovey93] and, independently, to Althofer and Koschnick (1993). The generic $\mathrm{D} = O(\log N\,(\Delta + s))$ of [SanthaSzegedy09, Thm. 2] with separation number $s([k]^d) = \Theta(k^{d-1})$ recovers the upper bound only up to the $\log$.'}
    - {measure: R0, value: '\Theta(k^{d/2})\ (d \ge 4)', note: 'A candidate local minimum is verified with $\Delta = 2d = O(1)$ further queries, so $\mathrm{R}_0 = O(\mathrm{R} + d)$; with $d$ constant this is $\Theta(k^{d/2})$. Same remark as on [[LocalSearchCube]].'}
    - {measure: Q0, value: '\Theta(k^{d/3})\ (d \ge 6)', note: 'Same verification argument: $\mathrm{Q}_0 = O(\mathrm{Q} + d)$, and $d$ is constant. Zero error is free here for the same reason it is free classically.'}
    - {measure: Rbar, value: '\Theta(k^{d/2})\ (d \ge 4)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]).'}
    - {measure: Dmu, value: '\Theta(k^{d/2})\ (d \ge 4)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon$; [Zhang09localsearch, Thm. 3] argues against an explicit random-walk distribution, so the bound is a $\mathrm{D}^\mu$ bound already.'}
    - {measure: Advpm, value: '\Theta(k^{d/3})\ (d \ge 6)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]). In the open dimension $d = 4$ the general adversary inherits the window $[\Omega(k^{6/5}), O(k^{4/3})]$ verbatim.'}
    - {measure: Dna, value: 'k^d = N', putative: true, note: 'Every cell, for every $d \ge 1$, so non-adaptivity is catastrophic already at $d = 2$ where $\mathrm{D} = \Theta(k)$. If the fixed query set $S$ omits the cell $u$, let $f$ agree on $S$ with the $\ell_1$ distance to $u$: when $f(u) = 0$ the unique local minimum is $u$, and when $f(u)$ is huge the local minima are exactly the neighbours of $u$. Same transcript, different required output.'}
    - {measure: C, value: '2d+1 = \Theta(1)', putative: true, note: 'A local minimum is certified by its own value and those of its $\le 2d$ neighbours, and no smaller set will do -- omit a neighbour and it can be completed to a strictly smaller value. With $d$ constant this is $\Theta(1)$ against $\mathrm{D} = \Theta(k^{d-1})$, an unbounded $\mathrm{D}$-vs-$\mathrm{C}$ gap on a total search problem. Compare [[LocalSearchCube]], where the same argument gives $n+1$ because the degree grows.'}
    - {measure: Rna, value: '\Theta(k^d)', putative: true, note: 'Every cell, even with randomness, so $\mathrm{R}^{\mathrm{na}} = \Theta(\mathrm{D}^{\mathrm{na}}) = \Theta(N)$. Randomise the [[Dna]] construction: draw $u$ uniformly from $[k]^d$, let $f$ be the $\ell_1$ distance to $u$ off $u$, and set $f(u) \in \{0, 2dk\}$ by a fair coin. The two completions have disjoint solution sets and agree everywhere but $u$, so a fixed query set of size $t$ succeeds with probability at most $t/k^d + 1/2$.'}
    - {measure: psD, value: '\Omega(k^{d/2}),\ O(k^{d-1})\ (d \ge 4)', note: 'Only the generic $\mathrm{R} \le \mathrm{psD} \le \mathrm{D}$ ([[psD]] vs [[R]]). The window is a factor $k^{d/2-1}$ wide, and unlike [[LocalSearchCube]] it stays wide for every fixed $d \ge 4$, so the grid is the cleaner family to ask the pseudo-deterministic question on: is there a canonical local minimum findable in $\tilde O(k^{d/2})$ randomized queries?'}
    - {measure: Np, value: '\tilde\Theta(k^{d/2})\ (d \ge 4)', note: 'Between $\mathrm{R} = \Theta(k^{d/2})$ and $O(\mathrm{R}\log \mathrm{R}) = O(k^{d/2}\log k)$ ([[Np]] vs [[R]]).'}
    - {measure: robustQ, value: '\tilde\Theta(k^{d/3})\ (d \ge 6)', note: 'Between $\mathrm{Q} = \Theta(k^{d/3})$ and $O(\mathrm{Q}\log \mathrm{Q}) = O(k^{d/3}\log k)$ ([[robustQ]] vs [[Q]]).'}
    - {measure: gamma2, value: '\Theta(k^{d/3})\ (d \ge 6)', conf: medium, note: 'Equal to $\mathrm{Adv}^{\pm}$ up to constants ([[gamma2]] vs [[Advpm]]). Medium confidence only because $\gamma_2$ is listed as partially defined on relations.'}
    - {measure: MAdv, value: '\Theta(k^{d/3})\ (d \ge 6)', conf: medium, note: 'Squeezed between $\mathrm{Adv}^{\pm} = \Theta(k^{d/3})$, which it dominates, and $\mathrm{Q} = \Theta(k^{d/3})$, which it is below. Same definedness caveat as $\gamma_2$.'}
    - {measure: Cmin, value: '\Theta(1)', note: 'Between $d+1$ and $\mathrm{C}=2d+1$: a corner cell has only $d$ neighbours to check, an interior cell has $2d$, and $d$ is a constant.'}
    - {measure: Adv, value: 'O(k^{d/3})\ (d \ge 6)', note: '$\mathrm{Adv}\le\mathrm{Adv}^{\pm}=\Theta(k^{d/3})$ ([[Adv]] vs [[Advpm]]). As on [[LocalSearchCube]], the known lower bound is a relational adversary argument rather than a positive-weight quantum one.'}
    - {measure: QE, value: '\Omega(k^{d/3}),\ O(k^{d-1})\ (d \ge 6)', note: '$\mathrm{Q}\le\mathrm{Q}_0\le\mathrm{Q}_{\mathrm{E}}\le\mathrm{D}$, with $\mathrm{Q}=\Theta(k^{d/3})$ and $\mathrm{D}=\Theta(k^{d-1})$.'}
    - {measure: PostQ, value: 'O(k^{d/3})\ (d \ge 6)', note: 'Post-selection can only help, so $\mathrm{PostQ}\le\mathrm{Q}=\Theta(k^{d/3})$.'}
    - {measure: prt, value: 'O(k^{d/2})\ (d \ge 4)', refs: [JainKlauck10], note: '$\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon$ [JainKlauck10] in the relation setting, and $\mathrm{R}=\Theta(k^{d/2})$ for $d\ge4$.'}
    - {measure: rprt, value: 'O(k^{d/2})\ (d \ge 4)', refs: [JainKlauck10], note: '$\overline{\mathrm{prt}}_\varepsilon\le\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon$ [JainKlauck10].'}
    - {measure: cjdeg, value: 'O(k^{d/2})\ (d \ge 4)', note: '$\mathrm{cjdeg}_\varepsilon\le\mathrm{R}_\varepsilon$ ([[cjdeg]] vs [[R]], relation setting).'}
    - {measure: D_size, value: '\Omega(k^d)', putative: true, note: 'Answer counting: for every cell $v$ the table $f(x)=\|x-v\|_1$ has $v$ as its unique local minimum, so all $N=k^d$ cells force distinct leaves.'}
  refs: [Zhang09localsearch, SunYao09, Aaronson06, Verhoeven06, SanthaSzegedy09, LTT89, LlewellynTovey93, Aldous83]
  see_also: [LocalSearchCube, R, Q]

- id: FourierFishing
  name: Fourier fishing
  symbol: '\mathrm{FFish}_N'
  aliases: ['Fourier sampling']
  group: relational
  order: 62
  kind: relation
  arity: 'a truth table $f:\{0,1\}^n \to \{-1,1\}$, so $N = 2^n$ input bits'
  short: 'The largest separation there is: one quantum query against $\Omega(N/\log N)$ randomized ones -- impossible for a decision problem.'
  definition: |
    Write $\widehat f(z) = 2^{-n/2}\sum_x f(x)(-1)^{x\cdot z}$, so $\sum_z \widehat f(z)^2 = N$
    and a typical $|\widehat f(z)|$ is $\Theta(1)$. **Fourier fishing** asks for any $z$
    with $|\widehat f(z)| \ge 1$; the promise version restricts to $f$ on which one
    Hadamard-query-Hadamard round succeeds with probability at least
    $\mathrm{Succ}_Q - 1/n$, where
    $\mathrm{Succ}_Q = \tfrac{2}{\sqrt{2\pi}}\int_1^\infty x^2 e^{-x^2/2}dx \approx 0.801$,
    against $\mathrm{Succ}_R = \tfrac{2}{\sqrt{2\pi}}\int_1^\infty e^{-x^2/2}dx \approx 0.317$
    for a uniformly random guess.

    Its sibling **Fourier sampling** -- output a sample within total variation
    $\varepsilon$ of $D_f(y) = \widehat f(y)^2/N$ -- is a sampling problem, which the
    zoo's total/partial/relation vocabulary has no slot for; see the notes.
  formal: '$\mathrm{FFish}_N = \{(f,z) : |\widehat f(z)| \ge 1\}$.'
  values:
    - {measure: Q, value: '1', refs: [AaronsonChen17, AaronsonAmbainis18], note: '[AaronsonChen17, Lem. 6.3]: Hadamard, query, Hadamard, measure. It solves Fourier sampling *exactly* and fishing with probability $\ge 0.801 - 1/n$ on the promise.'}
    - {measure: R, value: '\Omega(N/\log N)', refs: [AaronsonChen17], note: '[AaronsonChen17, Thm. 6.4]: no $o(N/\log N)$-query randomized algorithm solves promise-fishing with probability $\mathrm{Succ}_R + \Omega(1)$. Note this is the *relation*; [AaronsonAmbainis18, Thm. 27] proves the analogous bound for the sampling problem and leaves the relation as a "plausible conjecture", which is what Aaronson-Chen discharge.'}
    - {measure: D, value: 'N', note: 'Read everything. Nothing better is possible below $\Omega(N/\log N)$, and nothing better is known at all.'}
    - {measure: Advpm, value: '\Theta(1)', note: '$\mathrm{Adv}^{\pm}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[Advpm]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon}(f) = 1$ here.'}
    - {measure: Dna, value: 'N', note: 'Trivially, since $\mathrm{D}^{\mathrm{na}} \ge \mathrm{D} = N$ and reading the whole truth table is non-adaptive. Adaptivity is worth nothing here, which is the mirror image of [[GluedTrees]].'}
    - {measure: R0, value: '\Theta(N)', putative: true, note: 'Settled, unlike $\mathrm{R}$ itself: the $\log N$ window that is open for bounded error closes at zero error. Upper $\mathrm{R}_0 \le \mathrm{D} = N$. Lower: $\mathrm{C} = O(\mathrm{R}_0)$ ([[C]] vs [[R0]]) -- fix the coins of a zero-error algorithm and the transcript it produces must force a valid answer, so it is a certificate -- and $\mathrm{C} \ge N/2$ by the row below. So $\mathrm{R}_0 \ge N/4$, and Fourier fishing separates $\mathrm{R}_0$ from $\mathrm{R}$ by at least the same $\log N$ that separates $\mathrm{R}$ from $\mathrm{D}$.'}
    - {measure: Rna, value: '\Omega(N/\log N),\ O(N)', note: 'Sandwiched between $\mathrm{R}_{\varepsilon} = \Omega(N/\log N)$ and $\mathrm{D}^{\mathrm{na}} = N$.'}
    - {measure: Rbar, value: '\Omega(N/\log N),\ O(N)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), so the expected-cost model does not escape the bound either.'}
    - {measure: Dmu, value: '\Omega(N/\log N),\ O(N)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon$. The maximising $\mu$ is the uniform distribution on truth tables: [AaronsonChen17, Thm. 6.4] proves its bound against a uniformly random $f$, so the statement is a $\mathrm{D}^\mu$ statement before it is an $\mathrm{R}$ statement.'}
    - {measure: D_prod, value: '\Omega(N/\log N),\ O(N)', putative: true, conf: medium, note: 'Sharper than the generic $\mathrm{D}^{\mathrm{prod}} \le \mathrm{R}$ would give. [AaronsonChen17, Thm. 6.4] argues against a *uniformly random* truth table, and the uniform distribution on $\{-1,1\}^N$ is a product distribution; the only caveat is that it is the uniform distribution conditioned on the promise, an event of probability $1-o(1)$, which is no longer literally a product. So the lower bound survives the restriction to product $\mu$ up to that conditioning.'}
    - {measure: C, value: '\Theta(N)', putative: true, note: 'At least $N/2$, so the one-query quantum answer is not even *checkable* cheaply. Fix $q$ cells; they contribute $S_{\mathrm{fix}}$ to $\widehat f(z) = N^{-1/2}\sum_x f(x)(-1)^{x\cdot z}$ with $|S_{\mathrm{fix}}| \le q/\sqrt N$, while the $N-q$ free cells contribute any value on the lattice $\{(N-q-2j)/\sqrt N\}$. If $q \le N/2$ then $(N-q)/\sqrt N \ge |S_{\mathrm{fix}}|$, so some completion has $|\widehat f(z)| \le 1/\sqrt N < 1$ and $z$ is not valid. The promise costs nothing: among uniformly random completions of the free cells $\widehat f(z)$ is essentially a standard Gaussian, so $\Pr[|\widehat f(z)|<1] = \Theta(1)$ while the promise holds with probability $1-o(1)$, and the two events intersect. Upper $\mathrm{C} \le \mathrm{D} = N$.'}
    - {measure: D_size, value: '2^{\Theta(N)}', putative: true, note: 'Every leaf is deep, so the tree is wide. A tree with $L$ leaves has one at depth $\le \log_2 L$ (Kraft), and a leaf at depth $t$ is a subcube on which one fixed $z$ is output, i.e. a certificate of size $t$; by the $\mathrm{C}$ row every certificate has size $\ge N/2$, so $\log_2 L \ge N/2$. Upper: the complete tree, $2^N$ leaves. Contrast $\mathrm{Q} = 1$: this is a $2^{\Omega(N)}$-versus-one-query gap, far past the $\mathrm{Q}_{2/5} = O(\sqrt{\mathrm{DTsize}})$ ceiling ([[D_size]] vs [[Q]]), which of course only bounds $\mathrm{Q}$ from above.'}
    - {measure: rank, value: '\Omega(N/\log N),\ O(N)', putative: true, refs: [EhrenfeuchtHaussler89], note: 'A depth-$d$ decision tree of rank $r$ has at most $\sum_{i \le r}\binom di \le (d+1)^r$ leaves [EhrenfeuchtHaussler89]. Here $d \le N$ and, by the $\mathrm{DTsize}$ row, every tree has at least $2^{N/2}$ leaves, so $(N+1)^r \ge 2^{N/2}$ and $r = \Omega(N/\log N)$. Upper: $\mathrm{rank} \le \mathrm{D} = N$ ([[rank]] vs [[D]]). Note that the whole $\log N$ of the window is the crudeness of $(d+1)^r$, not any slack in the certificate bound.'}
    - {measure: psD, value: '\Omega(N/\log N),\ O(N)', note: 'Only the generic $\mathrm{R} \le \mathrm{psD} \le \mathrm{D}$ ([[psD]] vs [[R]]), and the window is the same $\log N$ that is open for $\mathrm{R}$. Pseudo-determinism cannot help much here because $\mathrm{R}_0 = \Theta(N)$ already pins the top of the range.'}
    - {measure: Np, value: '\tilde\Theta(N)', note: 'Between $\mathrm{R} = \Omega(N/\log N)$ and $O(\mathrm{R}\log \mathrm{R}) = O(N\log N)$ ([[Np]] vs [[R]]).'}
    - {measure: robustQ, value: '\Theta(1)', conf: medium, note: 'Still constant: $\mathrm{Q}^{\mathrm{rob}} = O(\mathrm{Q}\log \mathrm{Q})$ ([[robustQ]] vs [[Q]]) reads $O(1)$ at $\mathrm{Q} = 1$, and $\mathrm{Q}^{\mathrm{rob}} \ge \mathrm{Q} = 1$. So the largest known relational speedup is not an artefact of a noiseless oracle. Medium confidence because the generic simulation is stated asymptotically and the constant-$\mathrm{Q}$ case needs the $O(\mathrm{Q})$ form of it.'}
    - {measure: Adv, value: '\Theta(1)', note: 'At most $\mathrm{Adv}^{\pm} = \Theta(1)$ ([[Adv]] vs [[Advpm]]), and at least $1$ since the problem is not trivial. The positive-weights bound is useless here for a reason that has nothing to do with the certificate barrier: $\mathrm{Q}$ itself is $1$.'}
    - {measure: gamma2, value: '\Theta(1)', conf: medium, note: 'Equal to $\mathrm{Adv}^{\pm} = \Theta(1)$ up to constants ([[gamma2]] vs [[Advpm]]). Medium confidence only because $\gamma_2$ is listed as partially defined on relations.'}
    - {measure: MAdv, value: '\Theta(1)', conf: medium, note: 'Between $\mathrm{Adv}^{\pm} = \Theta(1)$, which it dominates, and $\mathrm{Q} = 1$, which it is below. Same definedness caveat as $\gamma_2$.'}
    - {measure: Cmin, value: '\Theta(N)', putative: true, note: 'Not just the worst input: every input is expensive. Certifying the answer $z$ means forcing $|\sum_x f(x)(-1)^{x\cdot z}|\ge\sqrt N$, and the unread cells can contribute $-(N-|S|)$ to that sum, so a certificate of size $|S|$ forces nothing unless $|S|\ge(N+\sqrt N)/2$. Hence $\mathrm{C}_{\min}\ge N/2$, matching $\mathrm{C}=\Theta(N)$.'}
    - {measure: PDT, value: '\Omega(\log N),\ O(N)', putative: true, note: 'Upper: $\mathrm{D}^{\oplus}\le\mathrm{D}=N$. Lower: answer counting. For each $z$ the truth table $f=\chi_z$ has $z$ as its only valid answer, so a tree needs at least $N$ leaves and hence depth $\ge\log_2 N$. Whether parity queries actually help is open -- a parity of truth-table cells is not a Fourier coefficient.'}
    - {measure: prt, value: 'O(N)', refs: [JainKlauck10], note: '$\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon\le2\,\mathrm{D}=2N$ [JainKlauck10], stated for relations. The partition bound is a lower-bound technique for $\mathrm{R}$, so the recorded $\mathrm{R}=\Omega(N/\log N)$ says nothing about it from below.'}
    - {measure: rprt, value: 'O(N)', refs: [JainKlauck10], note: '$\overline{\mathrm{prt}}_\varepsilon\le\mathrm{prt}_\varepsilon=O(N)$ [JainKlauck10].'}
    - {measure: cjdeg, value: 'O(N)', note: '$\mathrm{cjdeg}_\varepsilon\le\mathrm{R}_\varepsilon\le\mathrm{D}=N$ ([[cjdeg]] vs [[R]], relation setting).'}
    - {measure: PostQ, value: '\Theta(1)', note: '$1\le\mathrm{PostQ}\le\mathrm{Q}=1$: one Fourier sample already solves the problem, and no problem with a nonconstant answer is solved with zero queries. Post-selection has nothing left to buy -- the interest of this family is entirely on the classical side.'}
  witnesses:
    - {of: [R, Q], setting: relation, statement: 'One quantum query against $\Omega(N/\log N)$ classical ones. For a partial **decision** problem this is impossible: $\mathrm{Q}(f) = k$ forces $\mathrm{R}(f) = O(N^{1-1/2k})$ [AaronsonAmbainis18], so at $\mathrm{Q}=1$ the ceiling is $O(\sqrt N)$ -- attained by [[Forrelation]].', refs: [AaronsonChen17, AaronsonAmbainis18]}
  notes: |
    **The sampling sibling is settled and even stronger.** [AaronsonChen17, Thm. 6.8]
    gives the optimal $\Omega(N)$ for Fourier *sampling* at some constant $\varepsilon$,
    and Thm. 6.7 gives $\Omega(N/\log N)$ for every
    $\varepsilon < \mathrm{Succ}_Q - \mathrm{Succ}_R \approx 0.483$; [AaronsonAmbainis18,
    Thm. 27] had $\Omega(N/\log N)$ at $\varepsilon = 0.01$. So sampling sits at
    $\mathrm{R} = \Theta(N)$ against $\mathrm{Q} = 1$ -- the reason this problem is
    quoted throughout the quantum-supremacy literature. If the zoo ever grows a
    `sampling` setting, this is the motivating example.

    Aaronson's Kolmogorov-complexity trick converts any sampling problem into a
    roughly equivalent relation, but it costs $\mathrm{Q} = 1 \to O(\log N)$, which is
    why the relation version had to be proved directly.

    Open: whether $\mathrm{R}(\mathrm{FFish}_N)$ is $\Theta(N/\log N)$ or $\Theta(N)$ --
    the $\Omega(N)$ proof is for sampling and does not transfer. Aaronson-Ambainis
    conjecture that $O(N/\log N)$ classical queries suffice for *any* one-query quantum
    sampling problem.
  refs: [AaronsonChen17, AaronsonAmbainis18, Aaronson10]
  see_also: [Forrelation, kForrelation, YamakawaZhandry, RecursiveFourierSampling, R, Q]

- id: OrderedSearch
  name: Ordered search
  symbol: '\mathrm{OS}_n'
  aliases: ['binary search', 'insertion into a sorted list']
  group: separating
  order: 63
  kind: partial
  arity: '$n$ bits under the promise $x_1 \le x_2 \le \cdots \le x_n$'
  short: 'Where quantum buys only a constant factor: $\mathrm{D} = \lceil\log_2(n+1)\rceil$ and $\mathrm{Q} = \Theta(\log n)$, with the constant pinned between $0.221$ and $0.390$.'
  definition: |
    Promise: $x = 0^k1^{\,n-k}$ for some $0 \le k \le n$. The *reconstruction* version
    outputs $k$; the *decision* version outputs $\mathrm{parity}(k)$, which is the
    Boolean form the degree measures need. Equivalently: insert an item into a sorted
    list of $n$ items using comparisons.

    Together with [[GroverSearch]] this is one of the two calibration points for
    $\mathrm{R}$ versus $\mathrm{Q}$ -- the one where the answer is "nothing much".
  formal: '$\mathrm{OS}_n(0^k1^{n-k}) = k$ on the promise; the decision version is $\mathrm{OS}^{\oplus}_n(0^k1^{n-k}) = k \bmod 2$.'
  values:
    - {measure: D, value: '\lceil \log_2(n+1) \rceil', note: 'Exactly. Upper: binary search. Lower: a depth-$T$ tree has at most $2^T$ leaves and must separate all $n+1$ promise inputs.'}
    - {measure: R, value: '\log_2 n - \Theta(1)', note: 'Randomness buys a constant number of queries, not a constant factor. Upper: $\mathrm{R}\le\mathrm{D}$. Lower, by Yao plus leaf-counting: under the uniform distribution on the $n+1$ inputs a $T$-query deterministic tree is right on at most $2^T$ of them, so success $\ge 2/3$ forces $T \ge \log_2(n+1) - \log_2(3/2)$.'}
    - {measure: R0, value: '\log_2 n \pm \Theta(1)', note: 'Sandwiched: $\mathrm{R} \le \mathrm{R}_0 \le \mathrm{D}$, and both ends are $\log_2 n \pm O(1)$.'}
    - {measure: Q, value: '\Theta(\log n)', refs: [HNS02, CCKS25], note: 'The *constant* is open. Lower: $\tfrac1\pi(\ln n - 1) \approx 0.2206\log_2 n$ [HNS02], by a weighted all-pairs inner-product argument. Upper: $5\log_{7265} n \approx 0.390\log_2 n$ [CCKS25]. The ladder of lower bounds: $\Omega(\sqrt{\log n}/\log\log n)$ [BuhrmandeWolf99ordered], $\log_2 n/(2\log\log n)$ [FGGS98limit], $\tfrac1{12}\log_2 n$ [Ambainis99ordered], then HNS.'}
    - {measure: QE, value: '\Theta(\log n)', refs: [CCKS25, HNS02], note: 'Upper $0.390\log_2 n$: [CCKS25] show every bounded-error $k$-query algorithm can be made translation-invariant with no workspace, and an LP search then finds an exact $5$-query algorithm for lists of length $7265$. Earlier exact algorithms: $0.526\log_2 n$ ($3$ queries, $52$ items) [FGGS99invariant], $0.433\log_2 n$ ($4$ queries, $605$ items) [CLP07]. Lower: $\mathrm{Q}_E \ge \mathrm{Q} \ge \tfrac1\pi(\ln n - 1)$.'}
    - {measure: Adv, value: '\Theta(1)', putative: true, refs: [ChildsLee08, SpalekSzegedy06], note: 'Decision version, like the rest of the combinatorial column here. The certificate barrier applies: two queries $\{x_k = 0,\ x_{k+1} = 1\}$ pin the boundary, so $\mathrm{C}^0 = \mathrm{C}^1 = 2$ and $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = 2$. Against $\mathrm{Adv}^{\pm} = \widetilde\Theta(\log n)$ this is one of the cleanest positive-vs-negative-weight gaps in the zoo, and it is *not* the usual property-testing shape -- the promise is as far from a testing promise as it gets. For the $(n+1)$-valued **reconstruction** version the picture inverts: [ChildsLee08] compute the exact optimum of the adversary bound as $\tfrac1\pi\ln n + O(1)$, matching Hoyer-Neerbek-Shi, so the method is *optimal* there. The barrier is a theorem about Boolean output and does not survive the larger alphabet -- see [[Adv]] vs [[C]].'}
    - {measure: Advpm, value: '\tfrac1\pi\ln n + O(1)', refs: [ChildsLee08], note: 'The same ceiling holds for negative weights, so improving $0.221\log_2 n$ needs a genuinely different technique. Unlike the positive-weight $\mathrm{Adv}$ above, this survives the passage to the Boolean decision version, since $\mathrm{Adv}^{\pm} = \Theta(\mathrm{Q})$ and $\mathrm{Q}$ is $\widetilde\Theta(\log n)$ either way.'}
    - {measure: C, value: '2', putative: true, note: 'Decision version, $n \ge 2$: $\{x_k = 0,\ x_{k+1} = 1\}$ pins $k$ and hence the answer, and one query cannot. This is what makes the positive adversary useless here.'}
    - {measure: C0, value: '2', putative: true, note: 'Same two-query certificate; the promise makes both sides equally cheap to certify.'}
    - {measure: C1, value: '2', putative: true, note: 'Same two-query certificate; the promise makes both sides equally cheap to certify.'}
    - {measure: Cmin, value: '1', putative: true, note: 'At the two extreme inputs $0^n$ and $1^n$ a single query at the relevant end suffices, since only one promise input is consistent with it.'}
    - {measure: deg, value: '1', putative: true, note: 'Under the zoo''s partial-function convention -- agree with $f$ on the domain, unconstrained off it -- the promise makes $x_j = [\,j \ge k\,]$, so for any target $g(k)$ the degree-one polynomial $p(x) = g(0) + \sum_j (g(j+1)-g(j))(1 - x_j)$ is exactly right. Hence $\deg = 1$ for *every* Boolean predicate of $k$, and the unbounded polynomial method says nothing here. [BunVoronova23] write "degree $n$" for the same object; they mean a *bounded* polynomial.'}
    - {measure: sdeg, value: '1', note: 'From $\mathrm{sdeg} \le \deg = 1$.'}
    - {measure: odeg, value: '1', note: 'Squeezed between $\mathrm{sdeg} = 1$ and $\deg = 1$. Like $\deg$ and $\mathrm{sdeg}$, and unlike $\widetilde{\deg}$, the one-sided approximate degree is blind to the promise: it never asks the polynomial to stay bounded off the domain.'}
    - {measure: adeg, value: '\Omega\!\big(\tfrac{\log n}{(\log\log n)^2}\big),\ O(\log n)', refs: [BunVoronova23], note: 'Decision version. [BunVoronova23, Def. 5, Thm. 12]: $\widetilde{\deg}_{1/2-\gamma}(\mathrm{OS}^{\oplus}_{2^m}) = \Omega(m/\log^2 m - \log(1/\gamma))$, which in the number of input variables $n = 2^m$ is the bound stated. Upper: binary search. Previous best was $\Omega(\sqrt{\log n})$ [BuhrmandeWolf99ordered]. The whole distance between this and $\deg = 1$ is the boundedness requirement off the promise.'}
    - {measure: Q0, value: '\Theta(\log n)', note: 'Sandwiched: $\mathrm{Q}_{\varepsilon}(f) \le \mathrm{Q}_{0}(f) \le \mathrm{Q}_{\mathrm{E}}(f)$, with both ends $\Theta(\log n)$ here.'}
    - {measure: MAdv, value: '\Theta(\log n)', note: 'Sandwiched: $\mathrm{Q}_{\varepsilon}(f) \le \mathrm{MAdv}(f) \le \mathrm{Q}_{\mathrm{E}}(f)$, with both ends $\Theta(\log n)$ here.'}
    - {measure: Rbar, value: '\Theta(\log n)', note: '$\bar{\mathrm{R}}_{\varepsilon}(f) = \Theta(\mathrm{R}_{\varepsilon}(f))$ for every $f$ ([[Rbar]] vs [[R]]), and $\mathrm{R}_{\varepsilon}(f) = \log_2 n - \Theta(1)$ here. The expected-cost version does *not* beat binary search by more than a constant, unlike the quantum case.'}
    - {measure: Dmu, value: '\Theta(\log n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu_\varepsilon = \mathrm{R}_\varepsilon$, and the maximising $\mu$ is the uniform distribution on the $n+1$ promise inputs -- which is exactly the distribution the $\mathrm{R}$ entry''s leaf-counting argument uses.'}
    - {measure: rank, value: '1', putative: true, note: 'The cheapest illustration in the zoo of rank ignoring caterpillars. Linear search -- query $x_1$; if it is $1$ output $k=0$, otherwise query $x_2$, and so on -- is a comb: every internal node has a leaf for one child, so the rank never rises above $1$, while the depth is $n$. Hence $\mathrm{rank} = 1$ against $\mathrm{D} = \lceil\log_2(n+1)\rceil$: the *size*-optimal and *depth*-optimal trees are different trees, and the rank-optimal one is neither. ($\mathrm{rank} \ge 1$ because $\mathrm{OS}_n$ is not constant.)'}
    - {measure: D_size, value: 'n+1', putative: true, note: 'Exactly. Lower: the promise inputs reaching a fixed leaf are those $k$ compatible with the answers along the path, which is an *interval* of $k$; consecutive $k$ have opposite parity, so on the decision version $\mathrm{OS}^{\oplus}_n$ that interval must be a singleton, and there are $n+1$ inputs. Upper: binary search has exactly $n+1$ leaves. Consistent with the Ehrenfeucht-Haussler bound: a rank-$1$ tree of depth $n$ has at most $n+1$ leaves, and the comb attains it.'}
    - {measure: Dna, value: 'n', putative: true, note: 'A fixed query set $S$ tells you only which gap of $S$ the boundary $k$ falls into, i.e. an interval of candidate $k$; the $|S|+1$ intervals must all be singletons to determine the parity, and there are $n+1$ candidates, so $|S| \ge n$. Adaptivity is worth an exponential factor here -- the largest possible, since $\mathrm{D}^{\mathrm{na}} \le n$ always.'}
    - {measure: Rna, value: '\Theta(n)', putative: true, note: 'Randomness does not rescue non-adaptivity. Take $k$ uniform on $\{0,\dots,n\}$; a fixed query set of size $t$ leaves the parity determined only when the gap containing $k$ is a singleton, and there are at most $t+1$ singleton gaps, so the algorithm is right with probability at most $\tfrac{t+1}{n+1} + \tfrac12\big(1-\tfrac{t+1}{n+1}\big)$. Forcing this to $\ge 2/3$ gives $t \ge \tfrac{n+1}{3}-1$. Upper: $\mathrm{R}^{\mathrm{na}} \le \mathrm{D}^{\mathrm{na}} = n$.'}
    - {measure: s, value: '2', putative: true, note: 'Decision version, $n \ge 2$. Flipping bit $j$ of $0^k1^{n-k}$ leaves the promise unless $j \in \{k, k+1\}$, and those two flips move to $k-1$ and $k+1$, both of which change the parity. So $\mathrm{s}_x = 2$ in the interior and $1$ at $k \in \{0,n\}$. This is the measure''s partial-setting warning made concrete: $\mathrm{s} = 2$ while $\mathrm{R} = \Theta(\log n)$. The certificate family is $\Theta(1)$ too -- $\{x_k = 0,\,x_{k+1} = 1\}$ pins $k$ among promise inputs, so $\mathrm{C} = \mathrm{C}^0 = \mathrm{C}^1 = 2$ and $\mathrm{C}_{\min} = 1$ -- but those cells are deliberately left blank, because the zoo''s [[Adv]] vs [[C]] record (the certificate-complexity barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1}$) is a theorem about partial *Boolean* functions, whereas the $\mathrm{Adv}$ value recorded below is [ChildsLee08]''s exact bound for the $(n+1)$-valued *search* version. Those two coexisting -- $\mathrm{Adv} = \tfrac1\pi\ln n$ against $\mathrm{C} = 2$ -- is precisely the observation that the barrier does not survive a large output alphabet; on the Boolean version $\mathrm{OS}^{\oplus}_n$ the barrier does apply and forces $\mathrm{Adv} = O(1)$ despite $\mathrm{Q} = \tilde\Theta(\log n)$, which is why [BunVoronova23] had to go through approximate degree.'}
    - {measure: s0, value: '2', putative: true, note: 'Attained at any interior $k$ of even parity, $n \ge 3$.'}
    - {measure: s1, value: '2', putative: true, note: 'Attained at any interior $k$ of odd parity, $n \ge 3$.'}
    - {measure: bs, value: '2', putative: true, note: 'Decision version. Flipping a block $B$ of $0^k1^{n-k}$ stays on the promise only if $B$ is the interval between the old and the new boundary, so every sensitive block contains position $k$ (if it moves the boundary down) or position $k+1$ (if it moves it up). Two disjoint sensitive blocks are therefore the most possible, and $k\pm1$ supplies them.'}
    - {measure: bs0, value: '2', putative: true, note: 'Same argument as $\mathrm{bs}$, at an interior $k$ of even parity.'}
    - {measure: bs1, value: '2', putative: true, note: 'Same argument as $\mathrm{bs}$, at an interior $k$ of odd parity.'}
    - {measure: fbs, value: '2', putative: true, note: 'Every "down" block contains position $k$ and every "up" block contains position $k+1$, so the two load constraints alone cap the LP at $2$, which the two unit blocks attain. No fractional gain over $\mathrm{bs}$ here.'}
    - {measure: FC, value: '2', putative: true, note: 'Equal to $\mathrm{fbs}$ by LP duality.'}
    - {measure: QC, value: '\Theta(1)', note: '$\mathrm{QC}(f) = \Theta(\sqrt{\mathrm{FC}(f)})$, and $\mathrm{FC} = 2$.'}
    - {measure: RC, value: '2', putative: true, note: 'Query positions $k$ and $k+1$ and reject unless the answers are $0$ and $1$: any promise input with a different boundary fails one of the two checks with certainty. $\mathrm{RC} \ge \mathrm{bs} = 2$, and Aaronson''s $\mathrm{RC} = \Theta(\mathrm{fbs})$ agrees.'}
    - {measure: R1, value: '\Theta(\log n)', note: 'Sandwiched: $\mathrm{R}_{\varepsilon}(f) \le \mathrm{R}^{1}(f) \le \mathrm{D}(f)$, with both ends $\Theta(\log n)$ here.'}
    - {measure: lambda, value: '\Theta(1)', putative: true, note: 'Exactly $2\cos\!\big(\tfrac{\pi}{n+2}\big)$, which climbs to $2$ and never reaches it -- a constant, and that is the whole content: the sensitivity graph is a *path*. Its vertices are the $n+1$ promise inputs $0^k1^{n-k}$; two of them are Hamming neighbours exactly when their indices differ by one, and then the answers differ too, so $G_f = P_{n+1}$, whose adjacency matrix has spectral norm $2\cos(\pi/(n+2)) < 2$. Against $\mathrm{Q} = \Theta(\log n)$ this is the sharpest cheap illustration that spectral sensitivity is worthless on a promise: $\mathrm{Q} = \Omega(\lambda)$ gives nothing, and Huang''s $\deg \le \lambda^2$ is vacuous here because $\deg = 1$ as well.'}
    - {measure: gamma2, value: '\Theta(\log n)', note: '$\gamma_2^{\alpha}(f) = \Theta(\mathrm{Q}_{\varepsilon}(f))$ for every $f$ ([[gamma2]] vs [[Q]]), and $\mathrm{Q}_{\varepsilon} = \Theta(\log n)$ here. Note the contrast with the positive-weights $\mathrm{Adv} = \Theta(1)$ on this page: the certificate barrier $\mathrm{Adv} \le \sqrt{\mathrm{C}^0\mathrm{C}^1} = 2$ bites, and only the general adversary escapes it.'}
    - {measure: Np, value: '\tilde\Theta(\log n)', note: 'Between $\mathrm{R} = \log_2 n - \Theta(1)$ and $O(\mathrm{R}\log \mathrm{R}) = O(\log n\log\log n)$ ([[Np]] vs [[R]]). Whether the $\log\log n$ is real is the noisy-binary-search question of Feige-Raghavan-Peleg-Upfal.'}
    - {measure: robustQ, value: '\tilde\Theta(\log n)', note: 'Between $\mathrm{Q} = \Theta(\log n)$ and $O(\mathrm{Q}\log \mathrm{Q}) = O(\log n\log\log n)$ ([[robustQ]] vs [[Q]]).'}
    - {measure: cjdeg, value: '\Omega\!\big(\tfrac{\log n}{(\log\log n)^2}\big),\ O(\log n)', note: 'Squeezed between $\widetilde{\deg}$ and $\mathrm{R}_{\varepsilon}$, so it inherits the [BunVoronova23] window exactly. Worth contrasting with $\deg = 1$: imposing *non-negativity* on top of boundedness changes nothing further here, but dropping boundedness collapses the measure completely.'}
    - {measure: PDT, value: '1', putative: true, note: 'One parity query. On the promise $x=0^k1^{n-k}$ the decision version is $\mathrm{OS}^{\oplus}=k\bmod 2=(n\bmod 2)\oplus\bigoplus_i x_i$, so the single query $\bigoplus_{i\in[n]}x_i$ settles it, against $\mathrm{D}=\lceil\log_2(n+1)\rceil$. The same identity is why $\deg=1$.'}
    - {measure: D_prod, value: '1', putative: true, note: 'The support of a product measure is a subcube, and a subcube inside the promise has dimension at most $1$: a $2$-dimensional subcube contains two inputs of equal Hamming weight, and the chain has none. A $1$-dimensional one is a pair $x^{(k)},x^{(k+1)}$ differing in coordinate $k+1$, which one query settles, and the balanced such measure needs that query. So $\mathrm{D}^{\mathrm{prod}}=1$ while $\mathrm{R}=\Theta(\log n)$ -- product distributions are useless on a chain promise.'}
    - {measure: degp, value: '1', putative: true, note: 'Same construction as the $\deg=1$ entry, over $\mathbb{F}_p$: with $p(x)=\sum_i c_ix_i$ one has $p(x^{(k)})=\sum_{i>k}c_i$, and choosing $c_i=\pm1$ alternating makes the partial sums alternate between $0$ and $1$, which is $k\bmod 2$ on the promise.'}
    - {measure: ndeg, value: '1', putative: true, note: 'A linear form suffices: pick $c_i$ so that $\sum_{i>k}c_i$ is $0$ for even $k$ and $1$ for odd $k$ (successive differences are $\pm1$), giving $p$ nonzero exactly on the $1$-inputs of the promise. Nondeterministic degree is defined on the domain only, so nothing off the chain constrains $p$; and $\mathrm{ndeg}\ge1$ since the function is nonconstant.'}
    - {measure: NQ, value: '1', refs: [deWolf03], note: '$\mathrm{NQ}=\lceil\mathrm{ndeg}/2\rceil$ [deWolf03] and $\mathrm{ndeg}=1$.'}
    - {measure: rdeg, value: '1', refs: [deWolf03], note: '$\mathrm{rdeg}=\max\{\mathrm{ndeg}(f),\mathrm{ndeg}(\bar f)\}$ [deWolf03], and both sides are $1$ by the [[ndeg]] argument applied to $f$ and to its complement (shift the alternating partial sums by one).'}
    - {measure: ardeg, value: '1', note: '$1\le\mathrm{rdeg}_{1/3}\le\mathrm{rdeg}=1$. Note the contrast with $\widetilde{\deg}=\Omega(\log n/(\log\log n)^2)$: approximate degree demands boundedness off the promise, rational approximation does not.'}
    - {measure: PostQ, value: '\Theta(1)', refs: [MahadevdeWolf15], note: '$\mathrm{PostQ}_\varepsilon=\Theta(\mathrm{rdeg}_\varepsilon)=\Theta(1)$ [MahadevdeWolf15]. Post-selection collapses ordered search: $\mathrm{Q}=\Theta(\log n)$ but a post-selected algorithm needs only a constant number of queries.'}
    - {measure: RS, value: '\Theta(\log n)', refs: [BenDavidKothari18], putative: true, note: 'The fixed coordinates of a sabotaged input must still be $0$s before $1$s, so a $\ast$ that matters always lies in the gap between the last fixed $0$ and the first fixed $1$; binary search on that gap finds one in $\lceil\log_2 n\rceil$ queries. For the lower bound, the $n$ inputs $0^{i-1}\ast1^{n-i}$ each have a unique correct answer, so a tree needs $n$ leaves.'}
    - {measure: chibar, value: '\Theta(\log n)', refs: [GLSS19], note: '$\bar\chi=\Omega(\mathrm{RS})=\Omega(\log n)$ [GLSS19] with the [[RS]] entry, and $\bar\chi=O(\mathrm{LR})\le O(\mathrm{R})=O(\log n)$ ([[chibar]] vs [[LR]]).'}
    - {measure: chi, value: 'O(\log n)', note: '$\chi\le\bar\chi=\Theta(\log n)$ ([[chi]] vs [[chibar]]). No lower bound: the route $\mathrm{R}=O(\chi^2)$ is recorded only for total functions.'}
    - {measure: LR, value: '\Theta(\log n)', refs: [BBGM22, GLSS19], note: '$\mathrm{LR}\le\mathrm{R}=O(\log n)$ [BBGM22], and $\bar\chi=O(\mathrm{LR})$ with $\bar\chi=\Theta(\log n)$ gives the matching lower bound. So the linearised measure does not see the $\sqrt{\mathrm{R}}$ slack here: ordered search composes perfectly.'}
    - {measure: prt, value: '\Omega\!\big(\tfrac{\log n}{(\log\log n)^2}\big),\ O(\log n)', refs: [JainKlauck10, BunVoronova23], note: '$\widetilde{\deg}_{2\varepsilon}\le\mathrm{prt}_\varepsilon+\log(1/\varepsilon)\le2\,\mathrm{R}_\varepsilon+\log(1/\varepsilon)$ [JainKlauck10], so the partition bound inherits the recorded approximate degree window between $\Omega(\log n/(\log\log n)^2)$ and $O(\log n)$.'}
    - {measure: rprt, value: '\Omega\!\big(\tfrac{\log n}{(\log\log n)^2}\big),\ O(\log n)', refs: [JainKlauck10, KLLRX15], note: 'Same window as [[prt]]: $\widetilde{\deg}_{2\varepsilon}\le\overline{\mathrm{prt}}_\varepsilon+\log(1/\varepsilon)$ [KLLRX15] and $\overline{\mathrm{prt}}\le\mathrm{prt}\le2\,\mathrm{R}$.'}
    - {measure: noisyR, value: 'O(\log n)', refs: [BenDavidBlais20composition], note: '$\mathrm{noisyR}\le\mathrm{R}=O(\log n)$ [BenDavidBlais20composition]. The strengthening "$\mathrm{R}=\Theta(\text{arity})\Rightarrow\mathrm{noisyR}=\Theta(\mathrm{R})$" does not apply: the arity is $n$, not $\log n$. Noisy binary search is the natural candidate for a matching lower bound, but the answer here is a single bit, so the information-per-cost argument gives only $\Omega(1)$.'}
    - {measure: SP, value: '2', putative: true, note: 'The $n+1$ subcubes $\{x_k=0,x_{k+1}=1\}$ (with $\{x_1=1\}$ and $\{x_n=0\}$ at the ends) have codimension at most $2$ and each meets the promise in exactly one input, so they partition $\mathrm{Dom}(f)$ into monochromatic pieces. And $\mathrm{SP}\ge\mathrm{C}=2$. A subcube partition of size $2$ against $\mathrm{D}=\Theta(\log n)$: the $\mathrm{D}$ versus $\mathrm{SP}$ question is hopeless on promises.'}
    - {measure: UC, value: '2', note: '$\mathrm{UC}=\mathrm{SP}$ exactly, and the partition of the [[SP]] entry is already unambiguous on each side separately -- input $x^{(k)}$ is consistent with the certificate $\{x_k=0,x_{k+1}=1\}$ and with no other.'}
    - {measure: UCmin, value: '2', refs: [BHT17], note: '$\mathrm{UC}_{\min}=\min\{\mathrm{UC}^0,\mathrm{UC}^1\}$ [BHT17], and both sides are $2$ by the family of the [[UC]] entry; the floor is $\mathrm{C}_{\min}$ on the relevant side.'}
    - {measure: EC, value: 'O(\sqrt n)', conf: medium, putative: true, note: 'Put $w^{x^{(k)}}_i=1/\sqrt{k+1-i}$ for $i\le k$ and $1/\sqrt{i-k}$ for $i>k$, so every weight is in $[0,1]$ and $\sum_iw^x_i\le4\sqrt n$. Two promise inputs $k$ and $k+d$ have different values only for odd $d$, and they differ exactly on the $d$ coordinates between them, where $\sum_{t=1}^{d}1/\sqrt{t(d+1-t)}\ge1$ (equality at $d=1$, tending to $\pi$). The certificate weighting is not available: the $d=1$ constraints force $w^{x^{(k)}}_k=w^{x^{(k)}}_{k+1}=1$, and supports two apart then fail to overlap. The total-function bound $\mathrm{EC}\le\mathrm{C}=2$ does not hold on a promise.'}
    - {measure: CA, value: 'O(\log n)', refs: [JainKlauck10, CGLMSG23], note: '$(1-4\varepsilon)\mathrm{CA}\le\mathrm{prt}_\varepsilon+\log(1/\varepsilon)$ for partial functions [JainKlauck10, CGLMSG23], and $\mathrm{prt}\le2\,\mathrm{R}=O(\log n)$. No matching lower bound: $\mathrm{CA}=\Theta(\mathrm{fbs})$ holds only for total functions, and here $\mathrm{fbs}=2$.'}
    - {measure: CGpub, value: 'O(\log n)', refs: [CGLMSG23], note: '$\mathrm{CG}^{\mathrm{pub}}=\Theta(\mathrm{CA})$ survives the passage to partial functions [CGLMSG23], and [[CA]] is $O(\log n)$.'}
    - {measure: CGstar, value: 'O(\log n)', refs: [CGLMSG23], note: 'The three non-private variants all collapse to $\Theta(\mathrm{CA})$ by LP duality, which is a partial-function statement [CGLMSG23]; see [[CA]].'}
    - {measure: CGns, value: 'O(\log n)', refs: [CGLMSG23], note: 'As [[CGstar]]: $\mathrm{CG}^{\mathrm{ns}}=\Theta(\mathrm{CA})=O(\log n)$ [CGLMSG23]. Private-coin [[CG]] is the one variant that escapes the collapse, so it is left blank.'}
  witnesses:
    - {of: [R, Q], setting: partial, statement: 'The canonical *non*-separation: $\mathrm{R} = \Theta(\mathrm{Q})$, with only the constant in doubt, and it lies in $[1/0.390,\ 1/0.221] \approx [2.6,\ 4.5]$.', refs: [HNS02, CCKS25]}
    - {of: [Q, deg], setting: partial, statement: 'Unbounded: $\deg = 1$ while $\mathrm{Q} = \Theta(\log n)$ -- the cleanest illustration of why exact degree is worthless on a promise.', putative: true}
    - {of: [Q, adeg], setting: partial, statement: 'And the repair: $\widetilde{\deg} = \tilde\Theta(\mathrm{Q})$ up to $(\log\log n)^2$, so the polynomial method does work once boundedness is imposed.', refs: [BunVoronova23]}
  notes: |
    [BenOrHassidim08] give a quantum algorithm of *expected* cost below
    $0.32\log_2 n$ -- better than the best worst-case exact constant. The zoo has no
    expected-cost quantum measure ([[Rbar]] and [[R0]] are randomized, [[Q0]] counts
    worst case), so it cannot be filed as a value; note also that their abstract says
    "error free" while their §3 says $o(1)$ failure probability.

    Open: the constant; whether the $(\log\log n)^2$ loss in $\widetilde{\deg}$ is
    removable; and $\widetilde{\deg}$ of the reconstruction version.
  refs: [HNS02, CCKS25, CLP07, FGGS99invariant, FGGS98limit, Ambainis99ordered, BuhrmandeWolf99ordered, ChildsLee08, BenOrHassidim08, BunVoronova23]
  see_also: [GroverSearch, Q, QE, adeg, deg, Adv, Advpm]

- id: TseitinExpander
  name: Tseitin search on an expander
  symbol: '\mathrm{Ts}(G)'
  aliases: ['Tseitin contradiction', 'odd-charge search']
  group: relational
  order: 64
  kind: relation
  arity: '$n = |E|$ bits, one per edge of a bounded-degree expander $G$'
  short: 'The family critical block sensitivity was invented for: $\mathrm{cbs} = \Theta(n)$, and here it really does match $\mathrm{R}$ and $\mathrm{D}$.'
  definition: |
    Fix a connected graph $G = (V,E)$ of bounded degree $d$ that is an expander, and
    a charge $\chi : V \to \{0,1\}$ of *odd* total parity. The input assigns a bit to
    each edge. A vertex $v$ is *violated* if the bits on its incident edges do not
    sum to $\chi(v) \bmod 2$. Since $\sum_v \chi(v)$ is odd while every edge is
    counted twice, some vertex is always violated -- so this is a **total** search
    problem. The task: name one.
  formal: |
    $$\mathrm{Ts}(G) \;=\; \Big\{\,(x, v) \;:\; x \in \{0,1\}^{E},\ v \in V,\
      \textstyle\sum_{e \ni v} x_e \not\equiv \chi(v) \ (\mathrm{mod}\ 2)\,\Big\}.$$
  values:
    - {measure: cbs, value: '\Theta(n)', refs: [HuynhNordstrom12, GoosPitassi14], note: 'The theorem the measure exists for. Expansion is what forces it: any solution function must commit to a violated vertex, and flipping the edges along a path to a far-away vertex moves the violation, so no commitment is stable. Contrast [[SearchCNF]] on a random dense formula, where a constant fraction of clauses is falsified, $\mathrm{R} = \Theta(1)$, and therefore $\mathrm{cbs} = \Theta(1)$ as well.'}
    - {measure: R, value: '\Theta(n)', putative: true, refs: [GoosPitassi14], note: 'Lower: $\mathrm{R} = \Omega(\mathrm{cbs}) = \Omega(n)$ ([[cbs]] vs [[R]]). Upper: read every edge. Sampling -- the trick that makes [[SearchCNF]] easy -- fails here, because an adversarial input can leave exactly one vertex violated.'}
    - {measure: D, value: '\Theta(n)', refs: [Urquhart87, BenSassonWigderson01, LNNW95], note: 'Squeezed between $\mathrm{R} = \Theta(n)$ and the trivial $n$. Equivalently, by [LNNW95], the minimum depth of a tree-like resolution refutation of the Tseitin formula, which is $\Omega(n)$ on an expander.'}
    - {measure: R0, value: '\Theta(n)', note: 'Between $\mathrm{R} = \Theta(n)$ and $\mathrm{D} = \Theta(n)$.'}
    - {measure: Rbar, value: '\Theta(n)', note: 'Between $\mathrm{R} = \Theta(n)$ and $\mathrm{D} = \Theta(n)$.'}
    - {measure: Rna, value: '\Theta(n)', note: 'Between $\mathrm{R} = \Theta(n)$ and $\mathrm{D}^{\mathrm{na}} = n$.'}
    - {measure: Dna, value: 'n', note: 'Between $\mathrm{D} = \Theta(n)$ and the trivial $n$.'}
    - {measure: Dmu, value: '\Theta(n)', note: 'By Yao, $\max_\mu \mathrm{D}^\mu = \mathrm{R} = \Theta(n)$.'}
    - {measure: CA, value: '\Theta(n)', refs: [ABK21lifting], note: 'Squeezed: $\mathrm{cbs} = O(\mathrm{CA})$ [ABK21lifting] gives $\Omega(n)$, and $\mathrm{CA} \le \mathrm{R} = \Theta(n)$ closes it. So on this family the classical adversary is tight, which is exactly the contrast with [[SearchCNF]], where it collapses to $\Theta(1)$.'}
    - {measure: D_size, value: '2^{\Theta(n)}', refs: [Urquhart87, BenSassonWigderson01], note: 'Decision-tree size for the search problem is tree-like resolution size, and [Urquhart87] gives $2^{\Omega(n)}$ on an expander; $2^n$ is the ceiling.'}
    - {measure: C, value: '\Theta(1)', putative: true, note: 'The $d = O(1)$ edges incident to a violated vertex certify it. So verification is trivial while $\mathrm{R} = \Theta(n)$ -- the same shape as [[SearchCNF]], and the reason this is a *search* problem rather than a decision problem in disguise.'}
    - {measure: Cmin, value: '\Theta(1)', putative: true, note: 'At most $\mathrm{C} = O(1)$, at least $1$.'}
    - {measure: psD, value: '\Theta(n)', putative: true, note: 'At least $\mathrm{R} = \Theta(n)$ and at most $\mathrm{D} = \Theta(n)$, so pseudo-determinism is free here. Contrast [[SearchCNF]] and [[ApproxHW]], where it is exactly the expensive part.'}
    - {measure: D_prod, value: '\Theta(1)', putative: true, note: 'Constant against $\mathrm{R} = \Theta(n)$: the hard distribution for Tseitin *must* be correlated, and $O(1)$ queries suffice against any product $\mu$. Write $t_e = 1-2\Pr_\mu[x_e=1]$ and $T_v = (-1)^{\chi(v)}\prod_{e \ni v} t_e$, so that $\Pr_\mu[v \text{ violated}] = (1-T_v)/2$. Every edge meets exactly two vertices, so $\prod_v T_v = (-1)^{\sum_v \chi(v)}\prod_e t_e^2 = -\prod_e t_e^2 \le 0$, and therefore some $v^*$ has $T_{v^*} \le 0$, i.e. is violated with probability $\ge 1/2$. Query its $d = O(1)$ edges. If it is not violated, delete $v^*$ and fold the revealed bits into the charges of its neighbours: the residual instance on $G - v^*$ has total charge $\sum_v \chi(v) + \sum_{e \ni v^*} x_e \equiv \sum_v \chi(v)$, still odd, and the unqueried edges are still independent. Two rounds leave error $\le 1/4$, so $\mathrm{D}^{\mathrm{prod}} \le 2d = O(1)$.'}
    - {measure: Q, value: 'O(\sqrt n)', note: 'Grover over the $\Theta(n)$ vertices, each tested for violation with $d = O(1)$ queries. So the quadratic speedup that [[SearchCNF]] does not need and [[GluedTrees]] far exceeds is exactly what Tseitin gets. No matching $\Omega(\sqrt n)$ is recorded: $\mathrm{cbs}$ is a randomized lower bound with no known quantum analogue, and the natural relational adversary is weak here because two inputs with different violated vertices differ only along a path, which in an expander has length $O(\log n)$.'}
    - {measure: Q0, value: 'O(\sqrt n)', note: 'Zero error is free, as it is classically: a candidate vertex is checked with $d = O(1)$ further queries, so $\mathrm{Q}_0 = O(\mathrm{Q} + 1)$, and the $\mathrm{Q}$ row gives $O(\sqrt n)$.'}
    - {measure: rank, value: '\Omega(n/\log n),\ O(n)', putative: true, refs: [EhrenfeuchtHaussler89, Urquhart87], note: 'A depth-$d$ tree of rank $r$ has at most $\sum_{i\le r}\binom di \le (d+1)^r$ leaves [EhrenfeuchtHaussler89]. Here $d \le n$ and $\mathrm{DTsize} = 2^{\Omega(n)}$ [Urquhart87], so $(n+1)^r \ge 2^{\Omega(n)}$ and $r = \Omega(n/\log n)$; the ceiling is $\mathrm{rank} \le \mathrm{D} = \Theta(n)$ ([[rank]] vs [[D]]). In Prover-Delayer terms the Delayer scores $\Omega(n/\log n)$ points on an expander Tseitin formula.'}
    - {measure: Np, value: '\tilde\Theta(n)', note: 'Between $\mathrm{R} = \Theta(n)$ and $O(\mathrm{R}\log \mathrm{R}) = O(n\log n)$ ([[Np]] vs [[R]]).'}
    - {measure: PDT, value: '\Theta(\log n)', putative: true, note: 'Exponentially cheaper than $\mathrm{D}=\Theta(n)$. For a vertex set $S$, $\sum_{v\in S}(\chi(v)+\sum_{e\ni v}x_e)=\chi(S)+\sum_{e\in\partial S}x_e$ over $\mathbb{F}_2$, since interior edges are counted twice -- one parity query tells whether $S$ contains an odd number of violated vertices. Starting from $S=V$, which is odd because the total charge is odd, halving $S$ each time isolates a violated vertex in $\lceil\log_2|V|\rceil$ queries. Matching lower bound by answer counting: the violation vector is $Ax+\chi$, which ranges over all odd-weight vectors, so each single vertex $v$ is the unique answer for some input and the tree needs $|V|=\Theta(n)$ leaves.'}
    - {measure: Advpm, value: 'O(\sqrt n)', note: '$\mathrm{Adv}^{\pm}=\Theta(\mathrm{Q})$ is settled in the relation setting ([[Advpm]] vs [[Q]]), and $\mathrm{Q}=O(\sqrt n)$ by Grover search over the $\Theta(n)$ vertices, one of which is always violated. No lower bound is recorded because none is recorded for $\mathrm{Q}$.'}
    - {measure: Adv, value: 'O(\sqrt n)', note: '$\mathrm{Adv}\le\mathrm{Adv}^{\pm}=O(\sqrt n)$ ([[Adv]] vs [[Advpm]]).'}
    - {measure: MAdv, value: 'O(\sqrt n)', conf: medium, note: 'The multiplicative adversary is also a tight characterisation of $\mathrm{Q}$, so it inherits the $O(\sqrt n)$ ceiling; the characterisation is usually stated for functions, hence the reduced confidence in the relational reading.'}
    - {measure: gamma2, value: 'O(\sqrt n)', conf: medium, note: 'The approximate $\gamma_2$ norm equals $\mathrm{Adv}^{\pm}$ up to constants ([[gamma2]] vs [[Advpm]]), which is $O(\sqrt n)$ here.'}
    - {measure: robustQ, value: 'O(\sqrt n\log n)', note: '$\mathrm{Q}^{\mathrm{rob}}=O(\mathrm{Q}\log\mathrm{Q})$ ([[robustQ]] vs [[Q]]) with $\mathrm{Q}=O(\sqrt n)$.'}
    - {measure: QE, value: 'O(n)', note: '$\mathrm{Q}_{\mathrm{E}}\le\mathrm{D}=\Theta(n)$. Reading every edge determines the whole violation vector, and nothing better is known exactly: the Grover algorithm behind $\mathrm{Q}=O(\sqrt n)$ has one-sided error.'}
    - {measure: prt, value: 'O(n)', refs: [JainKlauck10], note: '$\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon=O(n)$ [JainKlauck10], stated for relations. The recorded $\mathrm{CA}=\Theta(n)$ does not close this from below: $\mathrm{CA}\le\mathrm{prt}$ is a partial-function statement.'}
    - {measure: rprt, value: 'O(n)', refs: [JainKlauck10], note: '$\overline{\mathrm{prt}}_\varepsilon\le\mathrm{prt}_\varepsilon\le2\,\mathrm{R}_\varepsilon=O(n)$ [JainKlauck10].'}
    - {measure: cjdeg, value: 'O(n)', note: '$\mathrm{cjdeg}_\varepsilon\le\mathrm{R}_\varepsilon=O(n)$ ([[cjdeg]] vs [[R]], relation setting -- the version used for total search problems).'}
    - {measure: PostQ, value: 'O(\sqrt n)', note: 'Post-selection can only help, so $\mathrm{PostQ}\le\mathrm{Q}=O(\sqrt n)$.'}
  witnesses:
    - {of: [cbs, R], setting: relation, statement: 'The tight case: $\mathrm{cbs} = \Theta(\mathrm{R}) = \Theta(n)$, so the general bound $\mathrm{cbs} = O(\mathrm{R})$ cannot be improved.', refs: [HuynhNordstrom12, GoosPitassi14]}
  notes: |
    Two false-clause-style search problems sit at opposite ends of the same cell.
    On a random $\Delta$-dense unsatisfiable CNF ([[SearchCNF]]) a constant fraction
    of the clauses is falsified, so $\mathrm{R} = \Theta(1)$ while $\mathrm{D} =
    \Theta(n)$: an unbounded $\mathrm{D}$-vs-$\mathrm{R}$ separation, and
    $\mathrm{cbs}$ -- being a randomized lower bound -- sees none of it. On Tseitin
    over an expander the violation can be unique, sampling is useless, and all of
    $\mathrm{cbs}$, $\mathrm{CA}$, $\mathrm{R}$ and $\mathrm{D}$ line up at
    $\Theta(n)$. The lifted consequence is the one the measure was built for:
    $\mathrm{R}^{cc}(\mathrm{Ts}(G) \circ g^n) = \Omega(n)$ for a constant-size
    gadget [GoosPitassi14].
  refs: [Urquhart87, HuynhNordstrom12, GoosPitassi14, BenSassonWigderson01, LNNW95, ABK21lifting]
  see_also: [SearchCNF, cbs, CA, D, R, psD]
